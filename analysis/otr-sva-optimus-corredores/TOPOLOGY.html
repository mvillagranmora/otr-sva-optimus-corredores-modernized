<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

const DATA = /*__TOPOLOGY_DATA__*/ {"system": "otr-sva-optimus-corredores", "root": {"id": "sys", "name": "otr-sva-optimus-corredores", "kind": "system", "children": [{"id": "dom:Plataforma", "name": "Plataforma", "kind": "domain", "children": [{"id": "mod:BcsPlataformaWeb", "name": "BcsPlataformaWeb", "kind": "module", "loc": 8137, "file": "BSCL/Plataforma/JAVA/BcsPlataformaWeb", "language": "java", "description": "BcsPlataformaWeb is the web front-end for the Plataforma domain, acting as the top-level entry point with no inbound callers across 8,137 lines of code. Its BootstrapServlet reads Diccionario, Empresa, Imagen, and DiaFeriado reference data from HANA_BSCL; the module also writes to HANA_BSCL and reads from CrystalReports. It dispatches across 35 outbound connections to modules including BcsSocioNegocioServicios, BcsCustodiaServicios, BcsOrdenServicios, BcsMesaServicios, BcsFondoMutuoServicios, BcsTesoreriaServicios, BcsFacturacionServicios, BcsContabilidadServicios, and BcsNormativaServicios."}, {"id": "mod:BcsPlataformaServicios", "name": "BcsPlataformaServicios", "kind": "module", "loc": 103816, "file": "BSCL/Plataforma/JAVA/BcsPlataformaServicios", "language": "java", "description": "BcsPlataformaServicios is the central services hub of the Plataforma domain, providing shared platform capabilities to 20 callers including BECB, BcsAPVServicios, BcsCanalAgenteServicios, BcsContabilidadServicios, BcsFondoMutuoServicios, BcsMesaServicios, BcsNormativaServicios, BcsOrdenServicios, and BcsPortafolioServicios. It reads from SQL_Server and PostgreSQL, writes to HANA_BSCL, SFTP, and DTE_SII, and in turn calls BcsReplica, BcsSocioNegocioServicios, BcsTesoreriaServicios, BcsTesoreriaJobs, and BcsValo2. At 103,816 lines of code, it supplies downstream modules with form field metadata lookups across entity types such as Moneda, Pais, TipoTelefono, and Giro."}, {"id": "mod:BcsJobManager", "name": "BcsJobManager", "kind": "module", "loc": 1887, "file": "BSCL/Plataforma/JAVA/BcsJobManager", "language": "java", "description": "BcsJobManager is a batch job scheduling engine within the Plataforma domain that identifies and dispatches pending scheduled programs for execution. Its TransactionManager class reads Programa and Agenda records from HANA_BSCL, filtering candidates in state PEN whose fechaEjecucion falls within the current day and whose Intento count has not reached MaximoIntentos. It locks each selected row by setting Bloqueo to 'S' before processing, detects daemon jobs via the EsDemonio flag, and registers no inbound callers across its 1887 lines of code."}, {"id": "mod:BcsPlataformaJobs", "name": "BcsPlataformaJobs", "kind": "module", "loc": 22858, "file": "BSCL/Plataforma/JAVA/BcsPlataformaJobs", "language": "java", "description": "BcsPlataformaJobs is a 22,858-line scheduled batch module in the Plataforma domain that processes securities market files, loading structured records for corporate actions (TBACFVC), issuer data (TBUTEMIS), price vectors (VectorPrecios), and fixed-income instruments (TBRFMI). The primary job class, ProcesadorArchivosJob, extends BcsJob and reads source data from SQL_Server, then writes results to HANA_BSCL and delivers output files to SFTP. The module has no inbound connections and is not called by any other component in the domain."}, {"id": "mod:BcsUtils", "name": "BcsUtils", "kind": "module", "loc": 11978, "file": "BSCL/Plataforma/JAVA/BcsUtils", "language": "java", "description": "BcsUtils is a shared utility library for the Plataforma domain that centralizes cross-cutting infrastructure services across 11,978 lines of code, including configuration retrieval, in-memory definition caching, file compression, HTTP communication, and logging support. It calls the stored procedure BSCL.Plataforma.BD.Utilitarios::ObtenerConfiguracion via cl.bcs.nuam.StoredProcedure to resolve per-company parameters identified by IdEmpresa and CodigoParametro. The module reads from SQL_Server and PostgreSQL, writes to HANA_BSCL and SFTP, and the packet records no inbound connections."}, {"id": "mod:BcsFilters", "name": "BcsFilters", "kind": "module", "loc": 421, "file": "BSCL/Plataforma/JAVA/BcsFilters", "language": "java", "description": "BcsFilters enforces service-level access control across the Plataforma domain by intercepting every inbound HTTP request through the ServiceFilter servlet filter (421 LOC). For each request carrying an X-SESSION-TOKEN header, it reads ACC.Sesion, ACC.Usuario, ACC.Rol, ACC.Perfil, ACC.Acceso, ACC.AccesoServicio, and PLA.Servicio tables in HANA_BSCL via the jdbc/hanaDB DataSource to verify that the caller's profile may invoke the target service. Requests matching noAuthURLs, noAuthServices identifiers 700729, 600017, 171721, 1381, 14, 1556, and 384, or noAuthChanels WS, CLI, and AGE bypass the check. No module calls BcsFilters directly."}, {"id": "mod:BcsPlataformaReporteApi", "name": "BcsPlataformaReporteApi", "kind": "module", "loc": 1380, "file": "BSCL/Plataforma/JAVA/BcsPlataformaReporteApi", "language": "java", "description": "BcsPlataformaReporteApi is the report-generation API for the Plataforma domain, responsible for loading Crystal Reports templates, populating them with data, and exporting finished documents. At 1,380 lines, it reads report definitions from CrystalReports and writes output to HANA_BSCL, querying the table BSCL.Report::Template via Sql2o. The module handles subreport assembly, barcode generation through barcode4j, image embedding using PictureObject, and Excel workbook evaluation through Apache POI; no inbound connections are recorded, so callers are not captured in the packet."}, {"id": "mod:BcsValo2", "name": "BcsValo2", "kind": "module", "loc": 7342, "file": "BSCL/Plataforma/JAVA/BcsValo2", "language": "java", "description": "BcsValo2 is a 7,342-line Plataforma module that loads and stages fixed-income bond instrument records for valuation. Called by BcsPlataformaServicios, it reads bond data from SQL_Server via ArchivoBonos and the Bono entity, then generates INSERT statements that populate the BSCL.Plataforma.BD::INS.Instrumento and BSCL.Plataforma.BD::INS.InstrumentoBono tables in HANA_BSCL, recording fields such as IdInstrumento, Nemotecnico, ISIN, TasaEmision, FechaVencimiento, ConvencionDias, TipoLibor, and NumeroCupones."}, {"id": "mod:BcsDeploy", "name": "BcsDeploy", "kind": "module", "loc": 3397, "file": "BSCL/Plataforma/JAVA/BcsDeploy", "language": "java", "description": "BcsDeploy is a standalone deployment automation tool within the Plataforma domain that promotes artifacts from a development environment to production by coordinating database schema changes and file transfers. The 3,397-line Deploy class reads configuration from config.properties, queries SVN for file metadata, and writes to both HANA_BSCL and an SFTP endpoint. It targets remote hosts Web, Fiori, WebServices, and ICliente using JSch for secure file transfer, and has 0 inbound connections \u2014 no other module calls it."}, {"id": "mod:BcsCargasPeru", "name": "BcsCargasPeru", "kind": "module", "loc": 13489, "file": "BSCL/Plataforma/JAVA/BcsCargasPeru", "language": "java", "description": "BcsCargasPeru is a 13,489-line batch client-enrollment loader for Peru that provisions new business-partner records into the Plataforma domain. The module resolves enrollment data through ConsultarEnrolamiento and ValidarDocumentoIdentidad, then orchestrates sequential calls to CrearPersona, CrearDocumentoIdentidad, CrearDireccionFisica, CrearDireccionElectronica, CrearTelefono, and CrearCliente before writing results to HANA_BSCL and DTE_SII. It applies a Peru-specific identity-type branching rule keyed on CodigoPais='PE'. No inbound connections are recorded; it is invoked externally with no registered callers in the graph."}, {"id": "mod:BcsPlataformaServlets", "name": "BcsPlataformaServlets", "kind": "module", "loc": 1026, "file": "BSCL/Plataforma/JAVA/BcsPlataformaServlets", "language": "java", "description": "BcsPlataformaServlets manages normativo file intake for the Plataforma domain, accepting multipart POST uploads at /files/upload and rejecting GET requests outright. Spanning 1026 lines, the module resolves storage paths through LocalizadorArchivo, persists document metadata via DocumentoDAO and Documento, and triggers downstream processing through Batch, writing results to HANA_BSCL over the jdbc/hanaDB DataSource. Individual uploads are capped at 10 megabytes per the MAX_FILE_SIZE constant. No inbound connections are recorded, so callers are unknown."}, {"id": "mod:BcsPortalConfirmacionWeb", "name": "BcsPortalConfirmacionWeb", "kind": "module", "loc": 595, "file": "BSCL/Plataforma/JAVA/BcsPortalConfirmacionWeb", "language": "java", "description": "BcsPortalConfirmacionWeb is a 595-line Plataforma module that renders confirmation notifications for the BCS portal by evaluating FreeMarker 2.3.23 templates against JSON context data. Its EvalTemplate class, in package cl.bcs.notificacion.template, uses Gson to deserialize context payloads, StringEscapeUtils to sanitize HTML, and JSONObject and JSONArray to group KeyValue records by codigo into structured output. The module writes its results to HANA_BSCL and registers no inbound connections in the packet, meaning no callers are catalogued here."}]}, {"id": "dom:SocioNegocio", "name": "SocioNegocio", "kind": "domain", "children": [{"id": "mod:BcsSocioNegocioServicios", "name": "BcsSocioNegocioServicios", "kind": "module", "loc": 131100, "file": "BSCL/SocioNegocio/JAVA/BcsSocioNegocioServicios", "language": "java", "description": "BcsSocioNegocioServicios is the central service layer for business-partner management in the SocioNegocio domain, handling operations such as portfolio annotation uploads through SubirArchivoAnotacionPortafolio. Spanning 131100 lines of code, it is called by 13 upstream modules including BcsAPVServicios, BcsFacturacionServicios, BcsJobsFondoMutuo, BcsMesaServicios, BcsTesoreriaJobs, SURA, and BcsPlataformaWeb; it calls 10 downstream modules including BcsCuentaInversionServicios, BcsCustodiaServicios, BcsNormativaServicios, BcsOrdenServicios, and BcsPortafolioServicios, and writes to HANA_BSCL, SFTP, and DTE_SII."}, {"id": "mod:BcsSocioNegocioJobs", "name": "BcsSocioNegocioJobs", "kind": "module", "loc": 1588, "file": "BSCL/SocioNegocio/JAVA/BcsSocioNegocioJobs", "language": "java", "description": "BcsSocioNegocioJobs automates the scheduled blocking of clients within the SocioNegocio domain, running 1,588 lines of batch-job logic dispatched by BcsPlataformaWeb. The primary job, PautaBloqueoAutomaticoClientes, verifies prior-run status via ConsultarPautaEjecutar, then invokes BloqueoAutomaticoClientesPorConfiguracion and BloqueoAutomaticoClientesPorTemporalidad against module SOC to apply two distinct blocking strategies. It advances the next pauta via AdelantarPauta using a 10-second offset, logs all lifecycle steps through AgregarControlPauta, and writes results to HANA_BSCL."}]}, {"id": "dom:Custodia", "name": "Custodia", "kind": "domain", "children": [{"id": "mod:BcsCustodiaServicios", "name": "BcsCustodiaServicios", "kind": "module", "loc": 123977, "file": "BSCL/Custodia/JAVA/BcsCustodiaServicios", "language": "java", "description": "BcsCustodiaServicios is the core custody services module in the Custodia domain, managing securities portfolio positions across 15 search types including CUS_NEG, VENPAC, COMPAC, SIM, EMP, GTA, and TRA, with both current and historical views. Called by 11 modules \u2014 among them BcsAPVServicios, BcsContabilidadServicios, BcsFondoMutuoServicios, BcsMesaServicios, and BcsPlataformaWeb \u2014 it reads from SQL_Server and CrystalReports, writes to HANA_BSCL, DTE_SII, and DCV_SOAP, and calls BcsCuentaInversionServicios, BcsReplica, BcsTesoreriaJobs, and BcsFacturacionServicios across 15 outbound connections."}, {"id": "mod:BcsCustodiaJobs", "name": "BcsCustodiaJobs", "kind": "module", "loc": 7231, "file": "BSCL/Custodia/JAVA/BcsCustodiaJobs", "language": "java", "description": "BcsCustodiaJobs is a 7,231-line Custodia domain module that produces scheduled financial reports, most notably GenerarArchivoInformeMayorMenorValor, which ranks portfolio positions by highest and lowest value. Dispatched by BcsPlataformaWeb, the module reads valuation data from CrystalReports and writes results to HANA_BSCL. It emits Excel and CSV output files applying per-currency precision rules \u2014 4 decimals for UF, 2 for USD and EUR, and 0 for CLP \u2014 and differentiates among pact types PP, PC, and PD."}]}, {"id": "dom:Orden", "name": "Orden", "kind": "domain", "children": [{"id": "mod:BcsOrdenServicios", "name": "BcsOrdenServicios", "kind": "module", "loc": 72127, "file": "BSCL/Orden/JAVA/BcsOrdenServicios", "language": "java", "description": "BcsOrdenServicios is the central order-management module of the Orden domain, at 72,127 lines, responsible for creating, routing, and charging investment orders while computing coverage, exigibility, and guarantees for client portfolios. Ten modules depend on it: BcsAPVServicios, BcsCuentaInversionServicios, BcsCustodiaServicios, BcsFacturacionServicios, BcsJobsFondoMutuo, BcsOrdenJobs, BcsPlataformaServicios, BcsSocioNegocioServicios, and BcsTesoreriaJobs call it, while BcsPlataformaWeb dispatches to it. Outbound, it calls BcsMesaServicios and BcsSocioNegocioServicios, reads from SQL_Server, and writes to HANA_BSCL, DTE_SII, and BECB_SOAP."}, {"id": "mod:BcsOrdenJobs", "name": "BcsOrdenJobs", "kind": "module", "loc": 11867, "file": "BSCL/Orden/JAVA/BcsOrdenJobs", "language": "java", "description": "BcsOrdenJobs is an 11,867-line scheduled-job module in the Orden domain that processes operator transactions, invoking CrearOrdenesPostreras to create late orders, ReservarLiberarTransacciones to reserve and release transactions, and EnviarAsignacionesFacturar to forward assignments for billing. It is called by BcsFacturacionServicios and BcsOrdenServicios, and dispatched by BcsPlataformaWeb. At runtime it calls BcsOrdenServicios and BcsPlataformaServicios, and writes results to HANA_BSCL."}, {"id": "mod:BcsJobOrders", "name": "BcsJobOrders", "kind": "module", "loc": 2124, "file": "BSCL/Orden/JAVA/BcsJobOrders", "language": "java", "description": "BcsJobOrders is a 2124-line Java scheduler module in the Orden domain that manages chronological order allocation and assignment within the BSCL schema. Dispatched by BcsPlataformaWeb, it writes to HANA_BSCL via the ConnectorsOrders class, which reads the LibroOrdenes table and the ConsultarParametrosProgramas view, and invokes stored procedures PrepararAsignacionCronologica, PrepararAsignacionCronologicaConFecha, BloquearDesbloquearOrdenes, BloquearDesbloquearTransacciones, AnularAsignacionMasiva, and AgregarAsignacion to orchestrate assignment lifecycle operations."}]}, {"id": "dom:Mesa", "name": "Mesa", "kind": "domain", "children": [{"id": "mod:BcsMesaServicios", "name": "BcsMesaServicios", "kind": "module", "loc": 65153, "file": "BSCL/Mesa/JAVA/BcsMesaServicios", "language": "java", "description": "BcsMesaServicios is the central trading-desk service module for the Mesa domain, at 65,153 lines of code, that manages spot foreign-exchange operations including trade recording, margin calculation, liquidation confirmation, and payment-voucher generation. It is called by BcsCustodiaServicios, BcsJobsFondoMutuo, BcsOrdenServicios, BcsTesoreriaJobs, and BcsPlataformaWeb, and it calls BcsContabilidadJobs, BcsContabilidadServicios, BcsCuentaInversionServicios, BcsCustodiaServicios, BcsFacturacionServicios, BcsFondoMutuoServicios, BcsJobsFondoMutuo, BcsPlataformaServicios, BcsPortafolioServicios, BcsSocioNegocioServicios, and BcsTesoreriaJobs, while writing to HANA_BSCL and reading from CrystalReports."}, {"id": "mod:BcsMesaJobs", "name": "BcsMesaJobs", "kind": "module", "loc": 4314, "file": "BSCL/Mesa/JAVA/BcsMesaJobs", "language": "java", "description": "BcsMesaJobs processes scheduled batch jobs for the Mesa domain, executing bulk file loads of termination operations dispatched by BcsPlataformaWeb. Each job run reads operation headers, details, portfolios, instruments, and liquidation conditions from HANA_BSCL and reads report definitions from CrystalReports, then invokes CrearOperacionMesa, IngresarDetalleOperacionMesa, ValorizarInstrumento, CalcularParidad, and ObtenerDiaSiguiente before writing processed results back to HANA_BSCL. The module spans 4,314 lines of code and serves as the batch execution layer for the Mesa domain."}]}, {"id": "dom:FondoMutuo", "name": "FondoMutuo", "kind": "domain", "children": [{"id": "mod:BcsFondoMutuoServicios", "name": "BcsFondoMutuoServicios", "kind": "module", "loc": 69956, "file": "BSCL/FondoMutuo/JAVA/BcsFondoMutuoServicios", "language": "java", "description": "BcsFondoMutuoServicios is the core mutual-fund operations engine of the FondoMutuo domain, handling contribution and rescue request certification, commission calculation, custody processing, and reinvestment workflows across 69,956 lines of code. It writes results to HANA_BSCL and calls BcsCustodiaServicios, BcsJobsFondoMutuo, and BcsPlataformaServicios for downstream processing. Eight upstream modules depend on it: BcsAPVServicios, BcsCuentaInversionServicios, BcsFacturacionServicios, BcsJobsFondoMutuo, BcsMesaServicios, BcsPlataformaServicios, and BcsTesoreriaJobs call it directly, while BcsPlataformaWeb dispatches to it."}, {"id": "mod:BcsJobsFondoMutuo", "name": "BcsJobsFondoMutuo", "kind": "module", "loc": 2516, "file": "BSCL/FondoMutuo/JAVA/BcsJobsFondoMutuo", "language": "java", "description": "BcsJobsFondoMutuo is the batch-job orchestration module for the FondoMutuo domain, processing mutual-fund operations such as fiscal-bonus reinvestment orders (IngresarOrdenBonificacionFiscalReinversion) across 2,516 lines of code. Ten upstream callers invoke it, including BcsAPVServicios, BcsCuentaInversionServicios, BcsFondoMutuoServicios, BcsNormativaServicios, BcsTesoreriaJobs, and BcsPlataformaWeb, which dispatches it. It in turn calls 12 downstream services \u2014 BcsOrdenServicios, BcsPortafolioServicios, BcsSocioNegocioServicios, BcsCustodiaServicios, BcsFacturacionServicios, and BcsMesaServicios among them \u2014 and writes output to the HANA_BSCL data store."}]}, {"id": "dom:Tesoreria", "name": "Tesoreria", "kind": "domain", "children": [{"id": "mod:BcsTesoreriaServicios", "name": "BcsTesoreriaServicios", "kind": "module", "loc": 28600, "file": "BSCL/Tesoreria/JAVA/BcsTesoreriaServicios", "language": "java", "description": "BcsTesoreriaServicios is the 28,600-line treasury services module for the Tesoreria domain, responsible for collection distribution, PAC mandate processing, CSC and SAAPV fund subscriptions, cargo/abono generation, and ingress/egress voucher liquidation for client portfolios. It is called by BcsAPVServicios, BcsContabilidadServicios, BcsPlataformaServicios, and BcsTesoreriaJobs, and dispatched by BcsPlataformaWeb. Outbound, it calls BcsCuentaInversionServicios, BcsPlataformaServicios, and BcsTesoreriaJobs, and writes transactional results to HANA_BSCL, SFTP, and DTE_SII."}, {"id": "mod:BcsTesoreriaJobs", "name": "BcsTesoreriaJobs", "kind": "module", "loc": 2899, "file": "BSCL/Tesoreria/JAVA/BcsTesoreriaJobs", "language": "java", "description": "BcsTesoreriaJobs is a 2,899-line scheduled-job module in the Tesoreria domain that orchestrates bulk DAP and FFMM income and expense processing. It receives 9 inbound connections \u2014 called by BcsAPVServicios, BcsCustodiaServicios, BcsFacturacionServicios, BcsJobsFondoMutuo, BcsMesaServicios, BcsNormativaServicios, BcsPlataformaServicios, and BcsTesoreriaServicios, and dispatched by BcsPlataformaWeb. Outbound, it calls 9 services including BcsCuentaInversionServicios, BcsFondoMutuoServicios, BcsOrdenServicios, and BcsSocioNegocioServicios, and writes results to HANA_BSCL."}]}, {"id": "dom:Facturacion", "name": "Facturacion", "kind": "domain", "children": [{"id": "mod:BcsFacturacionServicios", "name": "BcsFacturacionServicios", "kind": "module", "loc": 45979, "file": "BSCL/Facturacion/JAVA/BcsFacturacionServicios", "language": "java", "description": "BcsFacturacionServicios handles billing and electronic invoice generation across the securities brokerage platform, producing comprobantes of document types including FAC, BOE, FOE, and NCE for orders, custody, and mutual fund operations. Spanning 45979 lines, it is called by 7 modules \u2014 BcsCuentaInversionServicios, BcsCustodiaServicios, BcsJobsFondoMutuo, BcsMesaServicios, BcsOrdenServicios, BcsPlataformaServicios, and BcsPlataformaWeb \u2014 maintains 12 outbound connections, writes fiscal documents to DTE_SII and transaction data to HANA_BSCL, and reads report definitions from CrystalReports."}, {"id": "mod:BcsFacturacionJobs", "name": "BcsFacturacionJobs", "kind": "module", "loc": 2296, "file": "BSCL/Facturacion/JAVA/BcsFacturacionJobs", "language": "java", "description": "BcsFacturacionJobs handles scheduled billing file generation for the Facturacion domain, producing physical output files whose format is defined in FAC.FormatoArchivo and whose data is supplied by a stored procedure associated with each format. Dispatched by BcsPlataformaWeb, the 2296-line module receives IdEmpresa, IdUsuario, CodigoFormatoArchivo, and IdPrograma as runtime parameters, calls the configured stored procedure via a CALL statement, and writes the resulting files to both HANA_BSCL and DTE_SII."}]}, {"id": "dom:Contabilidad", "name": "Contabilidad", "kind": "domain", "children": [{"id": "mod:BcsContabilidadServicios", "name": "BcsContabilidadServicios", "kind": "module", "loc": 20443, "file": "BSCL/Contabilidad/JAVA/BcsContabilidadServicios", "language": "java", "description": "BcsContabilidadServicios is the core accounting-centralization service for the Contabilidad domain, generating pre-comprobantes with journal entries (asientos) across multiple TipoContabilidad types and persisting results to HANA_BSCL and SFTP while also submitting electronic tax documents to DTE_SII. At 20,443 lines, it is called by BcsMesaServicios and dispatched by BcsPlataformaWeb; in turn it calls BcsContabilidadJobs, BcsCustodiaServicios, BcsPlataformaServicios, and BcsTesoreriaServicios to resolve cross-domain data needed during pre-voucher assembly."}, {"id": "mod:BcsContabilidadJobs", "name": "BcsContabilidadJobs", "kind": "module", "loc": 1519, "file": "BSCL/Contabilidad/JAVA/BcsContabilidadJobs", "language": "java", "description": "BcsContabilidadJobs handles the accounting InterfazContable job by accepting batches of PreComprobante identifiers, generating JSON journal entries via GenerarJsonAsientoSap, and posting them one by one to SAP through CallerWSJournalVoucher; it reads connection parameters from interfazSAP.properties, maps response codes using ITZ.HomologaRespuestaSap, updates ITZ.PreComprobante records in HANA_BSCL, and writes audit logs to SFTP. At 1,519 lines, it is called by BcsContabilidadServicios and BcsMesaServicios and dispatched by BcsPlataformaWeb."}]}, {"id": "dom:Normativa", "name": "Normativa", "kind": "domain", "children": [{"id": "mod:BcsNormativaServicios", "name": "BcsNormativaServicios", "kind": "module", "loc": 83376, "file": "BSCL/Normativa/Java/BcsNormativaServicios", "language": "java", "description": "BcsNormativaServicios is the central regulatory compliance service for the Normativa domain, generating statutory reports and annexes \u2014 including Annex 1 of Circular 20 covering voluntary pension savings (APV) deposits, balances, transfers, and withdrawals broken down by plan, series, and gender. At 83,376 lines of code, it is called by BcsCuentaInversionServicios, BcsCustodiaServicios, BcsNormativaJobs, BcsPlataformaServicios, BcsPortafolioServicios, BcsSocioNegocioServicios, and BcsPlataformaWeb; it calls out to BcsJobsFondoMutuo and BcsTesoreriaJobs; reads report templates from JasperReports and CrystalReports; and writes results to HANA_BSCL, SFTP, and DTE_SII."}, {"id": "mod:BcsNormativaJobs", "name": "BcsNormativaJobs", "kind": "module", "loc": 57661, "file": "BSCL/Normativa/Java/BcsNormativaJobs", "language": "java", "description": "BcsNormativaJobs enforces regulatory validation rules for derivative instrument reporting, including DJ1 form checks covering instrument types such as CAL, CAP, CCS, FLR, FOB, FUT, FWD, FXS, OTR, PUT, STN, and SWP, as well as event codes, currency pairs, country codes, and counterparty RUT values. At 57,661 lines of code, the module is dispatched by BcsPlataformaWeb, calls BcsNormativaServicios and BcsPlataformaServicios, writes results to HANA_BSCL, and reads report definitions from CrystalReports."}, {"id": "mod:BcsNormativaCore", "name": "BcsNormativaCore", "kind": "module", "loc": 8347, "file": "BSCL/Normativa/Java/BcsNormativaCore", "language": "java", "description": "BcsNormativaCore manages the regulatory-document schema lifecycle for the Normativa domain, enforcing submission deadlines and regulatory-entity assignments tracked through the Esquema entity with fields including codigoVersionSII, fechaPresentacionLimite, idEntidadReguladora, periodicidad, and periodoInicio. Spanning 8,347 lines of code, the module is dispatched by BcsPlataformaWeb and writes validated schema data to the HANA_BSCL data store using target namespaces defined under BSCL.Normativa.BD and source views under BSCL.Normativa.BD.Vistas."}, {"id": "mod:BcsCartolas", "name": "BcsCartolas", "kind": "module", "loc": 4558, "file": "BSCL/Normativa/Java/BcsCartolas", "language": "java", "description": "BcsCartolas manages the certified account statement workflow within the Normativa domain, handling Nomina records that track period-based processing across states EN_PROCESO, TERMINADO, and ERROR for each IdEmpresa and IdUsuario. At 4,558 lines, the module is dispatched by BcsPlataformaWeb, reads from JasperReports, and writes to HANA_BSCL. Each Nomina captures FechaDesde, FechaHasta, FechaCertificacion, TipoProceso, EstadoProceso, and MensajeProceso, with lifecycle transitions persisted through NominaService using ContextoCartolas."}, {"id": "mod:BcsCartolasJobs", "name": "BcsCartolasJobs", "kind": "module", "loc": 1235, "file": "BSCL/Normativa/Java/BcsCartolasJobs", "language": "java", "description": "BcsCartolasJobs is a 1,235-line Normativa module that configures and generates investment account statements by loading Plantilla templates, chart procedures including GraficoActivoPorProducto, GraficoConsolidadoPorProducto, and GraficoFM, and images such as Logo and Banner, effective from 2016. It is dispatched by BcsPlataformaWeb, reads report definitions from JasperReports via JasperUtils and stored procedures under the prefix BSCL.Normativa.BD.Servicios::CAR., and writes configuration and resource records to HANA_BSCL using ConfigService, PlantillaService, and RecursoService."}, {"id": "mod:BcsCartolasMaster", "name": "BcsCartolasMaster", "kind": "module", "loc": 1775, "file": "BSCL/Normativa/Java/BcsCartolasMaster", "language": "java", "description": "BcsCartolasMaster generates consolidated client account statements \u2014 cartolas master \u2014 in PDF format within the Normativa domain, assembling up to seven conditional sections including InfoCarteraMasterPag2, InfoCarteraFM, CarteraRV, CarteraRF, CarteraIF, CarteraFuturos, and CarteraFM based on data availability and template parameters. Its 1,775-line GeneradorMaster class is dispatched by BcsPlataformaWeb, reads report templates from JasperReports, writes results to HANA_BSCL, and archives each generated file through ConcurrentArchiver using the CARTOLA_MASTER template."}, {"id": "mod:BcsTributarioJobs", "name": "BcsTributarioJobs", "kind": "module", "loc": 136, "file": "BSCL/Normativa/Java/BcsTributarioJobs", "language": "java", "description": "BcsTributarioJobs schedules the loading of IPC factor values within the Normativa domain, executing the CargaIPC batch job. Dispatched by BcsPlataformaWeb, the 136-line module's BcsJobCargaIPC class extends BcsJob and calls the stored procedure BSCL.Normativa.BD.Servicios::TRI.CargarValorFactorIpc against schema BSCL, supplying parameters IdEmpresa, IdUsuario, IdModulo, SimularOperacion, and UsaReglasNegocio; it then writes to HANA_BSCL, rolling back when the error counter exceeds zero and committing on success."}]}, {"id": "dom:APV", "name": "APV", "kind": "domain", "children": [{"id": "mod:BcsAPVServicios", "name": "BcsAPVServicios", "kind": "module", "loc": 31928, "file": "BSCL/APV/JAVA/BcsAPVServicios", "language": "java", "description": "BcsAPVServicios is the central service layer for the APV domain, orchestrating voluntary pension savings operations including bulk loading of TGR bonification files via CargaBonificacionTGR, which processes record types for affiliates carrying fields such as RutAfiliado, AnoAhorro, FolioEgreso, and MontoPagadoNeto. It writes results to HANA_BSCL and calls BcsCuentaInversionServicios, BcsCustodiaServicios, BcsFondoMutuoServicios, BcsJobsFondoMutuo, BcsOrdenServicios, BcsPlataformaServicios, BcsPortafolioServicios, BcsSocioNegocioServicios, BcsTesoreriaJobs, and BcsTesoreriaServicios. It is called by BcsJobsFondoMutuo, BcsPlataformaServicios, BcsPortafolioServicios, BcsSocioNegocioServicios, BcsTesoreriaJobs, and dispatched from BcsPlataformaWeb across 31928 lines of code."}, {"id": "mod:BcsAPVJobs", "name": "BcsAPVJobs", "kind": "module", "loc": 1369, "file": "BSCL/APV/JAVA/BcsAPVJobs", "language": "java", "description": "BcsAPVJobs handles Voluntary Pension Savings (APV) batch processing of fiscal bonus orders for variable income instruments, creating purchase orders with current market prices, custody data, and distribution details. Dispatched by BcsPlataformaWeb, the module runs job INGRESAR_ORDEN_RV_BONIFICACION_FISCAL via IngresarOrdenRVBonificacionFiscal, which calls CrearOrdenes, CalcularMontoYCobrosOrden, ConsultarCustodiaPortafolio, DistribucionContrato, and ConsultarFlujoCaja. It creates and drops a temporary table PrecioInstrumentos during each run and logs execution through AgregarLogPrograma and AgregarLog. At 1,369 lines, it declares no outbound module connections."}]}, {"id": "dom:CuentaInversion", "name": "CuentaInversion", "kind": "domain", "children": [{"id": "mod:BcsCuentaInversionServicios", "name": "BcsCuentaInversionServicios", "kind": "module", "loc": 22466, "file": "BSCL/CuentaInversion/JAVA/BcsCuentaInversionServicios", "language": "java", "description": "BcsCuentaInversionServicios is the central services module for the CuentaInversion domain, managing investment account balances, debt aging reports, and MovimientoCargoAbono movements across 22,466 lines of code. It receives 14 inbound connections from modules including BcsAPVServicios, BcsMesaServicios, BcsOrdenServicios, BcsPortafolioServicios, BcsTesoreriaServicios, and BcsPlataformaWeb; it calls out to BcsFacturacionServicios, BcsFondoMutuoServicios, BcsNormativaServicios, BcsOrdenServicios, and BcsSocioNegocioServicios, and writes to the HANA_BSCL database and DTE_SII system."}, {"id": "mod:BcsCuentaInversionJobs", "name": "BcsCuentaInversionJobs", "kind": "module", "loc": 3137, "file": "BSCL/CuentaInversion/JAVA/BcsCuentaInversionJobs", "language": "java", "description": "BcsCuentaInversionJobs generates physical investment account files for the CuentaInversion domain, reading file format configuration from CTA.FormatoArchivo and dynamically calling the stored procedure named in each format with fixed parameters p_IdEmpresa, p_IdUsuario, p_CodigoFormatoArchivo, and p_IdPrograma. The 3137-line module is dispatched by BcsPlataformaWeb and writes results to HANA_BSCL, also updating RutaSalida in BSCL.Plataforma.BD::BAT.Programa. GenerarArchivo, the main job class, extends BcsJob, implements JavaCall, and logs under CTA.GENERAR_ARCHIVO."}]}, {"id": "dom:Portafolio", "name": "Portafolio", "kind": "domain", "children": [{"id": "mod:BcsPortafolioServicios", "name": "BcsPortafolioServicios", "kind": "module", "loc": 9111, "file": "BSCL/Portafolio/JAVA/BcsPortafolioServicios", "language": "java", "description": "BcsPortafolioServicios is the service layer for the Portafolio domain, spanning 9,111 lines of code, and is responsible for creating and fully configuring client investment portfolios, including fee profile assignment, payment preference setup, tax regime validation, and authorization event generation. It is called by BcsAPVServicios, BcsJobsFondoMutuo, BcsMesaServicios, and BcsSocioNegocioServicios, and dispatched from BcsPlataformaWeb. Outbound, it calls BcsAPVServicios, BcsCuentaInversionServicios, BcsNormativaServicios, BcsPlataformaServicios, and BcsSocioNegocioServicios, and writes to HANA_BSCL."}]}, {"id": "dom:CanalAgente", "name": "CanalAgente", "kind": "domain", "children": [{"id": "mod:BcsCanalAgenteServicios", "name": "BcsCanalAgenteServicios", "kind": "module", "loc": 288, "file": "BSCL/CanalAgente/JAVA/BcsCanalAgenteServicios", "language": "java", "description": "BcsCanalAgenteServicios operates within the CanalAgente domain to expose investment account movement history to agent-channel users across a date range; dispatched by BcsPlataformaWeb, it accepts p_IdEmpresa, p_IdUsuario, p_IdPortafolio, p_FechaDesde, p_FechaHasta, and p_IdMoneda and returns P_SALDOEFECTIVOINICIAL, P_SALDOEFECTIVOFINAL, and a list of MovimientoCuentaInversion records. To serve each request, it calls BcsCuentaInversionServicios via ConsultarCartolaDeMovimiento and BcsPlataformaServicios for platform utilities, and writes CartolaDeMovimientoComprobante data to DTE_SII."}]}, {"id": "dom:Corredor", "name": "Corredor", "kind": "domain", "children": [{"id": "mod:BECB", "name": "BECB", "kind": "module", "loc": 3080, "file": "BSCL/Corredor/BECB", "language": "java", "description": "BECB is a 3080-line Corredor module that generates the InformeVencimientosGenerales report, consolidating maturity data acro // ── Layout: circle-pack in a fixed world space ─────────────────────────
// d3.pack gives every node (x, y, r) once; zooming is purely a canvas
// transform, so the layout never recomputes and pan/zoom stays at 60fps.
const WORLD = 8000;
// Leaves without a meaningful LOC (data stores, screens, jobs) get a floor
// based on the median module size so they stay visible next to code.
// LLM-generated data is messy: coerce loc to a finite number everywhere
// (a single NaN propagates through pack() and blanks the whole canvas).
const numLoc = d => { const l = Number(d.loc); return Number.isFinite(l) && l > 0 ? l : 0; };
const locs = [];
(function walk(d) { if (d.children && d.children.length) d.children.forEach(walk);
  else if (numLoc(d) > 1) locs.push(numLoc(d)); })(DATA.root);
locs.sort((a, b) => a - b);
const FLOOR = Math.max(1, Math.round((locs[Math.floor(locs.length / 2)] || 100) * 0.4));
const root = d3.hierarchy(DATA.root, d => d.children)
  .sum(d => (d.children && d.children.length ? 0 : Math.max(numLoc(d), d.kind === "module" ? 1 : FLOOR)))
  .sort((a, b) => b.value - a.value);
d3.pack().size([WORLD, WORLD]).padding(d => Math.max(3, 24 / (d.depth + 1)))(root);

const nodes = [];
const byId = new Map();
root.each(d => {
  let id = String(d.data.id ?? d.data.name ?? `n${nodes.length}`);
  // LLM data can repeat ids. Keep every node but make ids unique; edges,
  // flows, and entry points bind to the first occurrence.
  for (let k = 2; byId.has(id); k++) id = `${id}~${k}`;
  const n = { id, name: String(d.data.name ?? d.data.id ?? "?"),
    kind: d.data.kind || "module",
    language: d.data.language || null, file: d.data.file || null,
    description: typeof d.data.description === "string" ? d.data.description : null,
    loc: numLoc(d.data), x: d.x, y: d.y, r: d.r, depth: d.depth,
    parentNode: d.parent ? d.parent.__viz : null,
    container: !!(d.children && d.children.length) };
  d.__viz = n;
  nodes.push(n); byId.set(n.id, n);
});
nodes.sort((a, b) => b.r - a.r); // painters: parents under children
if (!nodes.some(n => !n.container)) {
  fail("The topology has no leaf modules to draw.<br>Check <code>topology.json</code> — every domain needs children.");
  throw new Error("empty topology");
}
// Shared level-of-detail rule: a node exists on screen only once its
// parent is big enough. Drawing, edge culling, and hit-testing must agree.
const isRevealed = (n, k) => !n.parentNode || n.parentNode.r * k >= REVEAL_R;

const entrySet = new Set((DATA.entryPoints || []).map(String));
const edges = (DATA.edges || [])
  .filter(e => e && byId.has(String(e.source)) && byId.has(String(e.target)))
  .map(e => ({ source: String(e.source), target: String(e.target), kind: e.kind }));
const deadSet = new Set((DATA.deadEnds || []).map(String));
const fanIn = new Map(), fanOut = new Map();
const edgesByKind = new Map(), adjacency = new Map();
const addAdj = (id, e) => { const a = adjacency.get(id); a ? a.push(e) : adjacency.set(id, [e]); };
for (const e of edges) {
  fanOut.set(e.source, (fanOut.get(e.source) || 0) + 1);
  fanIn.set(e.target, (fanIn.get(e.target) || 0) + 1);
  const b = edgesByKind.get(e.kind); b ? b.push(e) : edgesByKind.set(e.kind, [e]);
  addAdj(e.source, e); if (e.target !== e.source) addAdj(e.target, e);
}

  datastore: "#3d6a5a", job: "#7a5d8a", screen: "#8a6d4a" };
const LANG_FILL = { cobol: "#5e7a9e", java: "#9a6848", c: "#6e6a58",
  "c++": "#6e6a58", python: "#5a7850", javascript: "#9a8348",
  typescript: "#4a6580", csharp: "#5f7a5f", rpg: "#7d6580", pl1: "#806858",
  natural: "#587a78", sql: "#3d6a5a" };
const EDGE_STYLE = {
  call:     { color: "rgba(201,182,144,0.30)", label: "calls" },
  dispatch: { color: "rgba(160,130,200,0.35)", label: "dynamic dispatch" },
  read:     { color: "rgba(91,160,224,0.30)",  label: "reads" },
  write:    { color: "rgba(224,122,82,0.40)",  label: "writes" },
};
function fillFor(n) {
  if (n.kind === "domain" || (n.container && n.kind !== "system"))
    return n.depth % 2 ? "#2d2d2d" : "#262626";
  if (n.kind !== "module" && KIND_FILL[n.kind]) return KIND_FILL[n.kind];
  return (n.language && LANG_FILL[n.language.toLowerCase()]) || "#4a6580";
}

// ── State ───────────────────────────────────────────────────────────────
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let transform = d3.zoomIdentity;
let hovered = null, selected = null, activeFlow = null;
const kindOn = Object.fromEntries(Object.keys(EDGE_STYLE).map(k => [k, true]));

// ── Render ──────────────────────────────────────────────────────────────
const MIN_R = 1.5, LABEL_R = 22, REVEAL_R = 55;
let raf = null;
const requestDraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = null; draw(); }); };

function visible(n, k, tx, ty, vw, vh) {
  const sx = n.x * k + tx, sy = n.y * k + ty, sr = n.r * k;
  return sx + sr > -60 && sx - sr < vw + 60 && sy + sr > -60 && sy - sr < vh + 60;
}

const flowNodeSet = () => (activeFlow ? activeFlow._set : null);

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const vw = innerWidth, vh = innerHeight;
  const bw = Math.round(vw * dpr), bh = Math.round(vh * dpr);
  if (canvas.width !== bw) { canvas.width = bw; canvas.style.width = vw + "px"; }
  if (canvas.height !== bh) { canvas.height = bh; canvas.style.height = vh + "px"; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#1e1e1e"; ctx.fillRect(0, 0, vw, vh);

  const { x: tx, y: ty, k } = transform;
  const flowSet = flowNodeSet();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // Nodes
  for (const n of nodes) {
    const sr = n.r * k;
    if (sr < MIN_R) continue;
    if (!isRevealed(n, k)) continue; // LOD: reveal children gradually
    if (!visible(n, k, tx, ty, vw, vh)) continue;
    const sx = n.x * k + tx, sy = n.y * k + ty;
    const inFlow = flowSet ? flowSet.has(n.id) : true;
    const isSel = selected === n.id, isHov = hovered === n.id;

    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.globalAlpha = (n.container ? 0.55 : 0.85) * (inFlow ? 1 : 0.18);
    ctx.fillStyle = isSel ? "rgba(204,120,92,0.25)" : fillFor(n);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = isSel ? 2.5 : isHov ? 1.8 : n.container ? 1 : 0.8;
    ctx.strokeStyle = isSel || isHov ? "#cc785c"
      : entrySet.has(n.id) ? "rgba(204,120,92,0.9)"
      : n.container ? "#3a3a3a" : "rgba(212,212,212,0.18)";
    if (entrySet.has(n.id) && !isSel && !isHov) ctx.lineWidth = 1.6;
    if (deadSet.has(n.id)) ctx.setLineDash([5, 4]); // dead-end candidate
    ctx.globalAlpha = inFlow ? 1 : 0.25; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    if (sr > LABEL_R) {
      const fs = Math.min(17, Math.max(9, sr / 6));
      ctx.font = `${n.container ? "600" : "400"} ${fs}px system-ui, sans-serif`;
      ctx.fillStyle = n.container ? "#8a8a8a" : "#e8e8e8";
      ctx.globalAlpha = inFlow ? 1 : 0.3;
      const ly = n.container && sr > 55 ? sy - sr + fs + 5 : sy;
      const label = n.name.length > 28 ? [...n.name].slice(0, 26).join("") + "…" : n.name;
      ctx.fillText(label, sx, ly);
      ctx.globalAlpha = 1;
    }
  }

  // Edges: batched per kind, endpoints must both be on screen
  const vis = id => { const n = byId.get(id); return n && n.r * k > MIN_R * 2 && isRevealed(n, k) && visible(n, k, tx, ty, vw, vh); };
  const curve = (a, b) => {
    const ax = a.x * k + tx, ay = a.y * k + ty, bx = b.x * k + tx, by = b.y * k + ty;
    if ((ax - bx) ** 2 + (ay - by) ** 2 < 120) return;
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo((ax + bx) / 2 + (by - ay) * 0.12, (ay + by) / 2 + (ax - bx) * 0.12, bx, by);
  };
  if (!flowSet) {
    for (const [kind, style] of Object.entries(EDGE_STYLE)) {
      if (!kindOn[kind]) continue;
      const bucket = edgesByKind.get(kind);
      if (!bucket) continue;
      ctx.strokeStyle = style.color; ctx.lineWidth = 0.8; ctx.beginPath();
      let drawn = 0;
      for (const e of bucket) {
        if (!vis(e.source) || !vis(e.target)) continue;
        curve(byId.get(e.source), byId.get(e.target));
        if (++drawn > 1200) break;
      }
      ctx.stroke();
    }
  }

  // Focus edges (hover/selection) in accent, on top
  const focus = hovered || selected;
  if (focus && !flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const e of adjacency.get(focus) || []) {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
  }

  // Active flow: numbered step path
  if (flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 2;
    const seq = activeFlow._seq;
    ctx.beginPath();
    for (let i = 0; i + 1 < seq.length; i++) {
      const a = byId.get(seq[i]), b = byId.get(seq[i + 1]);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
    seq.forEach((id, i) => {
      const n = byId.get(id); if (!n) return;
      const sx = n.x * k + tx, sy = n.y * k + ty - n.r * k - 10;
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#cc785c"; ctx.fill();
      ctx.fillStyle = "#1e1e1e"; ctx.font = "700 11px system-ui, sans-serif";
      ctx.fillText(String(i + 1), sx, sy + 0.5);
    });
  }
}

// ── Zoom / pan / hit-testing ────────────────────────────────────────────
// Max zoom scales with the smallest leaf so deep estates stay reachable.
const leafRs = nodes.filter(n => !n.container).map(n => n.r);
const MAX_K = Math.max(600, Math.ceil(140 / Math.max(1e-6, Math.min(...leafRs))));
const zoomB = d3.zoom().scaleExtent([0.05, MAX_K]).clickDistance(4)
  .on("zoom", ev => { transform = ev.transform; requestDraw(); })
  .on("start", () => canvas.classList.add("dragging"))
  .on("end", () => canvas.classList.remove("dragging"));
const sel = d3.select(canvas).call(zoomB).on("dblclick.zoom", null);

function hit(mx, my) {
  const wx = (mx - transform.x) / transform.k, wy = (my - transform.y) / transform.k;
  let best = null;
  for (const n of nodes) {
    if (n.r * transform.k < MIN_R) continue;
    // Mirror the draw-time LOD rule so hidden nodes can't be clicked.
    if (!isRevealed(n, transform.k)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy <= n.r * n.r && (!best || n.r < best.r)) best = n;
  }
  return best;
}
let flyGen = 0;
function flyTo(n) {
  const gen = ++flyGen; // a newer flyTo (or Escape) cancels this one
  const vw = innerWidth, vh = innerHeight, cur = transform;
  const from = [(vw / 2 - cur.x) / cur.k, (vh / 2 - cur.y) / cur.k, Math.min(vw, vh) / cur.k];
  const targetW = Math.max(n.r * 2.6, Math.min(vw, vh) / MAX_K); // respect scaleExtent
  const interp = d3.interpolateZoom(from, [n.x, n.y, targetW]);
  const dur = Math.max(400, interp.duration * 0.55), t0 = performance.now();
  (function step() {
    if (gen !== flyGen) return;
    const t = Math.min(1, (performance.now() - t0) / dur);
    const [cx, cy, w] = interp(d3.easeCubicInOut(t));
    const k = Math.min(vw, vh) / w;
    sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - cx * k, vh / 2 - cy * k).scale(k));
    if (t < 1) requestAnimationFrame(step);
  })();
}
canvas.addEventListener("mousemove", e => {
  const h = hit(e.offsetX, e.offsetY);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = h ? "pointer" : "grab"; requestDraw(); }
});
canvas.addEventListener("click", e => {
  const h = hit(e.offsetX, e.offsetY);
  if (activeFlow && h) setFlow(""); // leave the walkthrough to inspect a node
  selected = h ? h.id : null;
  resultsEl.innerHTML = "";
  renderSidebar(); requestDraw();
});
canvas.addEventListener("dblclick", e => { const h = hit(e.offsetX, e.offsetY); if (h) flyTo(h); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape inside the search box or flow select should only affect that
  // control, not reset the whole viewport.
  if (e.target === searchEl || (e.target && e.target.tagName === "SELECT")) return;
  flyGen++; selected = null; resultsEl.innerHTML = "";
  setFlow(""); flyTo(nodes[0]); renderSidebar();
});
addEventListener("resize", requestDraw);

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderSidebar() {
  if (activeFlow) return renderFlowSidebar();
  if (!selected) { sidebar.classList.remove("open"); return; }
  const n = byId.get(selected);
  const neighbors = [];
  for (const e of edges) {
    if (e.source === n.id) neighbors.push({ id: e.target, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "→" });
    else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>

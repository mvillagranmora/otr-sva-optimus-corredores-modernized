worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Soporte WebSocket (CallWebsocket servlet en TomEE)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # Redirect raíz → login del portal corredores
        location = / {
            return 301 $scheme://$http_host/BSCL/Plataforma/UI/optimus?p=login;
        }

        # ── UI estática — AngularJS SPA del portal Optimus (corredores) ──────
        # optimus.html es generado en build time (Dockerfile.frontend stage Python)
        # a partir de views/login.html rellenando los placeholders ::VAR::.
        # El index.html redirige a "optimus?p=login"; nginx resuelve esa URL
        # mediante $uri.html → optimus.html sin necesidad de consultar HANA.
        location /BSCL/Plataforma/UI/ {
            alias /usr/share/nginx/html/BSCL/Plataforma/UI/;
            try_files $uri $uri.html $uri/ =404;
        }

        # ── Assets BSCL — módulos AngularJS, libs, imágenes compartidas ──────
        location /BSCL/ {
            alias /usr/share/nginx/html/BSCL/;
            try_files $uri $uri/ =404;
        }

        # ── GWJAVA API gateway ────────────────────────────────────────────────
        # El JS del frontend llama /BSCL/Plataforma/GWJAVA/PLA/*.
        # El WAR de TomEE está desplegado en contexto /PLA para que sus filtros
        # Java (SesionFilter, ServiceFilter) funcionen con sus noAuthURLs.
        # nginx reescribe el prefijo público antes de llegar a TomEE.
        location /BSCL/Plataforma/GWJAVA/PLA/ {
            rewrite ^/BSCL/Plataforma/GWJAVA/PLA/(.*)$ /PLA/$1 break;
            proxy_pass         http://corredores:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            # WebSocket headers (CallWebsocket)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}

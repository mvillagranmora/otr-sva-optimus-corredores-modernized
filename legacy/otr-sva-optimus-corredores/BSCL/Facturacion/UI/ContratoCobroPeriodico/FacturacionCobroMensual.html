<div class="row" ng-controller="FacturacionCobroMensualCtrl">
	<div class="row bcs-cuerpo">	

		<!-- INICIO SUB GRILLA DETALLE REGISTRO -->
		<div class="row">
			<bcs-grid 
				id="grid-cliente-facturacion-cobros-mensual" 
				configuracion = "confBasicaClienteFacturacionCobroMensual" 
				seleccionado = "seleccionClienteFacturacionCobroMensual" 
				api = "gridApiClienteFacturacionCobroMensual">
			</bcs-grid>
		</div>
		<!-- FIN SUB GRILLA DETALLE REGISTRO -->	
	</div>

	<!-- INICIO PANEL COMANDOS --> 
	<div class="row bcs-panel-comandos" style="margin-top:15px">
		<bcs-button  
			class="col-xs-2 pull-right" 
			id = 'FacturacionCobroMensualCtrl_btnEnviarFacturar' 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="'true'"
			bcs-texto="'UI_ENVIAR_FACTURAR' | translate"
			bcs-habilitado="data.btnActivos"
			bcs-clic="data.enviarFacturar(seleccionClienteFacturacionCobroMensual)">
		</bcs-button>
		
		<bcs-button  
			class="col-xs-1 pull-right" 
			id = 'FacturacionCobroMensualCtrl_btnCancelar' 
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'true'"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-habilitado="true"
			bcs-clic="data.cancelar()">
		</bcs-button>		

	</div>
	<!-- FIN PANEL COMANDOS -->
</div>

<div class="row" ng-controller='IngresarContratoCobroPeriodicoModalCtrl'>
<form name="frmIngConCobPer">
  <div class="row bcs-cuerpo">
    <div class="row">    	
	  <!-- INICIO MANTENEDOR -->	
	  <div class="col-xs-12">	    
	    <div class="row">
	      <div class="col-xs-4">
			<label class="col-xs-4" translate>UI_TIPO_CONTRATO_COBRO_PERIODICO_ABR</label>
			<bcs-combobox-base class="col-xs-8"
			   bcs-requerido
			   id="frmIngConCobPer_UI_TIPO_CONTRATO_COBRO_PERIODICO"
			   auto-cargar="'true'"
			   tipo="data.oTipoContratoCobro.tipo"
			   configuracion= "data.oTipoContratoCobro.configuracion"
			   seleccionado="data.oTipoContratoCobro.seleccionado"								
			   filtros="data.oTipoContratoCobro.filtros"
			   id-actual="data.oTipoContratoCobro.idActual">
			</bcs-combobox-base>
		  </div>		  
		  		  
		  <div class="col-xs-4">
			<label class="col-xs-4" translate>UI_FORMATO_CONTRATO_COBRO</label>
			<bcs-combobox-base class="col-xs-8"
			   bcs-requerido
			   id="frmIngConCobPer_UI_FORMATO_CONTRATO_COBRO"
			   auto-cargar="'true'"
			   tipo="data.oFormatoContratoCobro.tipo"
			   configuracion= "data.oFormatoContratoCobro.configuracion"
			   seleccionado="data.oFormatoContratoCobro.seleccionado"								
			   filtros="data.oFormatoContratoCobro.filtros"
			   id-actual="data.oFormatoContratoCobro.idActual">
			</bcs-combobox-base>
		  </div>
		  
		  <div class="col-xs-4">
		   	<label class="col-xs-5" translate>UI_MONEDA_LIQUIDACION</label>
			<bcs-combobox-base class="col-xs-7"
			   bcs-requerido
			   id="frmIngMvtoFac_UI_MONEDA_LIQUIDACION"
			   tipo="data.oMonedaContratoCobroLiquidacion.tipo"
			   id-actual="data.oMonedaContratoCobroLiquidacion.idActual"
			   configuracion= "data.oMonedaContratoCobroLiquidacion.configuracion"
			   seleccionado= "data.oMonedaContratoCobroLiquidacion.seleccionado"
			   filtros ="data.oMonedaContratoCobroLiquidacion.filtros">
			</bcs-combobox-base >		
		  </div>
	    </div>
    	    	    			
		<div class="row">	
		  <div class="col-xs-8">
	        <label class="col-xs-2" translate>UI_SOCIO_NEGOCIO</label>
		    <bcs-combobox-base class="col-xs-10"
		       bcs-requerido
			   id="frmIngConCobPer_UI_SOCIO_NEGOCIO"
			   auto-cargar="'true'"
			   tipo="data.oSocioNegocio.tipo"
			   seleccionado="data.oSocioNegocio.seleccionado"
			   filtros="data.oSocioNegocio.filtros"						    
			   id-actual="data.oSocioNegocio.idActual"
			   cascada-a="data.oPortafolio.filtros.IdCliente"
			   cascada-valor="'IdCliente'"
	           cascada-defecto="'-1'"
			   configuracion= "data.oSocioNegocio.configuracion">
			</bcs-combobox-base>
	 	  </div>
							  
		  <div class="col-xs-4">
		    <label class="col-xs-5" translate>UI_PORTAFOLIO</label>
			<bcs-combobox-base class="col-xs-7"
			   bcs-requerido
			   id="frmIngConCobPer_UI_PORTAFOLIO"
			   auto-cargar="'false'"
			   tipo="'combobox-portafolio'"
			   seleccionado="data.oPortafolio.seleccionado"
			   id-actual="data.oPortafolio.idActual"
			   filtros="data.oPortafolio.filtros"
		       item-post-filtro="'1'"
			   configuracion= "data.oPortafolio.configuracion"  >
			</bcs-combobox-base >
		  </div>		    
		</div>
		<hr/>
		
		<br>
		<div class="row">
		  <div class="col-xs-4">
			<label class="col-xs-4" translate>UI_CLASIFICACION</label>			
			<bcs-combobox-base class="col-xs-8"
			   id="frmIngConCobPer_UI_CLASIFICACION"
			   auto-cargar="'true'"
			   tipo="data.oClasificacionTipoInstrumento.tipo"
			   configuracion= "data.oClasificacionTipoInstrumento.configuracion"
			   seleccionado="data.oClasificacionTipoInstrumento.seleccionado"								
			   filtros="data.oClasificacionTipoInstrumento.filtros"
			   id-actual="data.oClasificacionTipoInstrumento.idActual"			   						
			   todos="'S'">
			</bcs-combobox-base>
		  </div>
		  
		  <div class="col-xs-4">
			  <label class="col-xs-3" translate>UI_CONCEPTO</label>
		      <bcs-combobox-base class="col-xs-9"
		        bcs-requerido
		        id="frmIngConCobPer_cobro_UI_CONCEPTO"
			    tipo="data.oConceptoCobroPeriodico.tipo"
			    configuracion= "data.oConceptoCobroPeriodico.configuracion"
			    id-actual="data.oConceptoCobroPeriodico.idActual"
			    seleccionado="data.oConceptoCobroPeriodico.seleccionado"
			    filtros="data.oConceptoCobroPeriodico.filtros">
			  </bcs-combobox-base>
		    </div>
		</div>		
		
	    <div class="row">
	  	  <div class="col-xs-6">
	  		<bcs-grid id="frmIngConCobPer_grid_TipoInstrumento" configuracion = "confBasicaTipoInstrumento" seleccionado = "seleccionTipoInstrumento" api = "gridApiTipoInstrumento"></bcs-grid>
	  	  </div>
	  	  
	  	  <div class="col-xs-1">
	  	    <div class="row">
	  	      <bcs-button class="col-xs-12"	  	      
	  	        bcs-tipo="'default'"  
			    bcs-auto-desactivar="'false'" 
			    bcs-texto="'-->'" 
			    bcs-habilitado="true"  
			    bcs-clic="agregarTipoInstrumento()">
			  </bcs-button>
			</div>
			
			<div class="row">			
			  <bcs-button class="col-xs-12" 
			    bcs-tipo="'default'"  
			    bcs-auto-desactivar="'false'" 
			    bcs-texto="'<--'" 
			    bcs-habilitado="false"  
			    bcs-clic="quitarTipoInstrumento()">
		      </bcs-button>
		    </div>  
	  	  </div> 		  
	  	  
		  <div class="col-xs-5">
		    <bcs-grid id="frmIngConCobPer_grid_TipoInstrumentoSel" configuracion = "confBasicaTipoInstrumentoSel" seleccionado = "seleccionTipoInstrumentoSel" api = "gridApiTipoInstrumentoSel"></bcs-grid>
		  </div>
	    </div>
	  </div>	  	  
	  <hr/>	
	    
	  <br>	
	  <div class="row">
	    <div class="col-xs-12">
	      <div class="row">	      
	        <div class="col-xs-4">
	          <label class="col-xs-4" translate>UI_COBRO</label>
	          <bcs-combobox-base class="col-xs-8"
			    bcs-requerido
			    id="frmIngConCobPer_cobro_UI_COBRO"
			    tipo="data.oCobroPeriodico.tipo"
			    id-actual="data.oCobroPeriodico.idActual"
			    configuracion= "data.oCobroPeriodico.configuracion"
			    seleccionado= "data.oCobroPeriodico.seleccionado"
			    filtros ="data.oCobroPeriodico.filtros">
			  </bcs-combobox-base >
	        </div>
	      
	        <div class="col-xs-4">
			  <label class="col-xs-4" translate>UI_TIPO_COBRO</label>
		      <bcs-input-texto class="col-xs-6"
		        ng-model="data.oTipoCobro"		       
		        maxlength="80"
		        k-ng-disabled="'true'">
		      </bcs-input-texto>
	 	    </div>
	 	    
	 	    <div class="col-xs-4">
			  <label class="col-xs-3" translate>UI_COBRO_PERIODICO_POR_RANGOS_ABR</label>
			  <bcs-input-checkbox 
			    id="frmIngConCobPer_cobro_UI_COBRO_POR_RANGOS"
			    ng-model="data.oCobroPorRangos">
			  </bcs-input-checkbox>
		    </div>
		  </div>
		  
		  <div class="row">
	        <div class="col-xs-4">
	          <label class="col-xs-4" translate>UI_MONTO_MINIMO_COBRAR_ABR</label>
			  <bcs-input-monetario class="col-xs-6"
			    id="frmIngConCobPer_cobro_UI_MONTO_MINIMO_COBRAR"
			    simbolo="data.oMonedaContratoCobroLiquidacion.seleccionado.IdMoneda"			   
			    k-ng-model="data.oMontoMinimoCobrar"
			    k-ng-disabled ="data.activaroMontoMinimoCobrar">
			  </bcs-input-monetario>
		    </div> 
	      
	        <div class="col-xs-4">
	          <label class="col-xs-4" translate>UI_MONTO_MAXIMO_COBRAR_ABR</label>
			  <bcs-input-monetario class="col-xs-6"
			    id="frmIngConCobPer_cobro_UI_MONTO_MAXIMO_COBRAR"
			    simbolo="data.oMonedaContratoCobroLiquidacion.seleccionado.IdMoneda"			   
			    k-ng-model="data.oMontoMaximoCobrar"
			    k-ng-disabled ="data.activaroMontoMaximoCobrar">
			  </bcs-input-monetario>
		    </div>	        
		    
	      
	      
	        <div class="col-xs-2">
	          <bcs-button class="col-xs-12" 
			    bcs-tipo="'default'"  
			    bcs-auto-desactivar="'false'" 
			    bcs-texto="'AGREGAR COBRO'"
			    bcs-habilitado="true"  
			    bcs-clic="agregarCobroPeriodico()">
		      </bcs-button>
	        </div>
	        
	        <div class="col-xs-2">
	          <bcs-button class="col-xs-12" 
			    bcs-tipo="'default'"  
			    bcs-auto-desactivar="'false'" 
			    bcs-texto="'QUITAR COBRO'"
			    bcs-habilitado="true"  
			    bcs-clic="quitarCobroPeriodico()">
		      </bcs-button>
	        </div>
	      </div>	      	      
	    </div>
	  </div>  
	    
	  <div class="row">
	  	<div class="col-xs-12">
	  	  <bcs-grid id="frmIngConCobPer_grid_Cobro" configuracion = "confBasicaCobro" seleccionado = "seleccionCobro" api = "gridApiCobro"></bcs-grid>
	  	</div>
	  </div>
	  
	  <div class="row">  
	    <div class="col-xs-2">
	      <bcs-button class="col-xs-12" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="'false'" 
			bcs-texto="'DETALLE COBRO'" 
			bcs-habilitado="data.activaroAgrDetCob"  
			bcs-clic="data.agregarCobrosPeriodicoDet(seleccionCobro)">
		  </bcs-button>		  
	    </div>
	  </div>	  	  	              
      <!-- FIN MANTENEDOR -->
      
      <!-- INICIO PANEL COMANDOS -->
      <div class="row bcs-panel-comandos" style="margin-top:32px">
        <bcs-button  class="col-xs-1" id = 'IngresarContratoCobroPeriodicoModalCtrl_btnIngresarCobroPeriodico' bcs-tipo="'principal'"  bcs-auto-desactivar="'false'"  bcs-texto="'UI_INGRESAR' | translate"  bcs-habilitado="frmIngConCobPer.$valid" bcs-clic="data.ingresarContratoCobroPeriodicoModal()"></bcs-button>        
      </div>
      <!-- FIN PANEL COMANDOS -->
      
 </form> 
</div>

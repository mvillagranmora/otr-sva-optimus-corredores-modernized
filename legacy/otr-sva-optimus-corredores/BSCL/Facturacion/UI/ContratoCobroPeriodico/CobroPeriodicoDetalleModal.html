<div class="row" ng-controller="CobroPeriodicoDetalleModalCtrl">
  <div class="row bcs-cuerpo">	
	<div class="row">
	
	  <!-- INICIO CAMPOS -->
	  <div class="col-xs-11"> 				
		<div class="row">	
		  <div class="col-xs-6">
	        <label class="col-xs-2" translate>UI_COBRO</label>
		    <bcs-input-texto class="col-xs-10"
		       ng-model="data.oCobro"		       
		       maxlength="80"
		       k-ng-disabled="'true'">
		    </bcs-input-texto>
	 	  </div>
	 	  
	 	  <div class="col-xs-2">
	        <label class="col-xs-7" translate>UI_COBRO_PERIODICO_POR_RANGOS_ABR</label>
			  <bcs-input-checkbox 
			    ng-model="data.oCobroPorRangos"
			    ng-disabled="'true'">
			  </bcs-input-checkbox>
	 	  </div>	 	  
		</div>
		
		<div class="row">	
		  <div class="col-xs-3">
	        <label class="col-xs-4" translate>UI_MONTO_DESDE</label>
			<bcs-input-monetario class="col-xs-8"
			    simbolo="data.simbolooMontoDesde"			   
			    bcs-mayor-que="'0'"
			    k-ng-model="data.oMontoDesde"
			    k-ng-disabled = "data.activaroMontoDesde">
			</bcs-input-monetario>
	 	  </div>
	 	  
	 	  <div class="col-xs-3">
	        <label class="col-xs-4" translate>UI_MONTO_HASTA</label>
			<bcs-input-monetario class="col-xs-8"
			    simbolo="data.simbolooMontoHasta"			   
			    bcs-mayor-que="'0'"
			    k-ng-model="data.oMontoHasta"
			    k-ng-disabled = "data.activaroMontoHasta">
			</bcs-input-monetario>
	 	  </div>
	 	  
	 	  <div class="col-xs-3">
	        <label class="col-xs-4" translate>UI_MONTO_COBRO</label>
			<bcs-input-monetario class="col-xs-8"
			    simbolo="data.simbolooMontoCobro"			   
			    bcs-mayor-que="'0'"
			    k-ng-model="data.oMontoCobro"
			    k-ng-disabled = "data.activaroMontoCobro">
			</bcs-input-monetario>
	 	  </div>
	 	  
	 	  <div class="col-xs-3">
	        <label class="col-xs-5" translate>UI_PORCENTAJE_COBRO</label>					
			<bcs-input-porcentaje class="col-xs-5"	
              k-ng-model="data.oPorcentajeCobro"
              k-ng-disabled = "data.activaroPorcentajeCobro">
			</bcs-input-porcentaje>
			
	 	  </div>	 	  	 	  
		</div>		
	  <!-- FIN CAMPOS -->
	  </div>
	  	
	  <!-- INICIO BOTONES -->
	  <div class="col-xs-1">
		<div class="row">
		  <bcs-button class="col-xs-12" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="'false'" 
			bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="data.activaroAgregarRangoCobrosPer"  
			bcs-clic="agregarCobrosPeriodicoGrilla()">
		  </bcs-button>
		</div>
		
		<div class="row">
		  <bcs-button class="col-xs-12" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="'false'" 
			bcs-texto="'UI_QUITAR' | translate" 
			bcs-habilitado="data.activaroQuitarRangoCobrosPer"  
			bcs-clic="quitarCobrosPeriodicoGrilla()">
		  </bcs-button>
		</div>  
	  </div>
	  <!-- FIN BOTONES -->
	</div>
	
	<!-- INICIO GRILLA DETALLE COBRO -->
	<div class="row">	
	  <div class="col-xs-12">
	  	<bcs-grid id="CobroPeriodicoDetalleModalCtrl_grid_CobroDet" 
	  		configuracion = "confBasicaCobroDet" 
	  		seleccionado = "seleccionCobroDet"
	  		api = "gridApiCobroDet">
	  	</bcs-grid>
	  </div>
	</div>
	<!-- FIN GRILLA DETALLE COBRO -->
  </div>
  
  <!-- INICIO PANEL COMANDOS --> 
  <div class="row bcs-panel-comandos">
	<bcs-button  class="col-xs-1" id = 'CobroPeriodicoDetalleModalCtrl_btnCrearCobroDetalle' bcs-tipo="'principal'"  bcs-auto-desactivar="'true'"  bcs-texto="'UI_CREAR' | translate"   bcs-habilitado="data.activaroAgregarCobrosPer"  bcs-clic="data.agregarCobrosPeriodicoDet()"></bcs-button>
  </div>
  <!-- FIN PANEL COMANDOS -->
</div>

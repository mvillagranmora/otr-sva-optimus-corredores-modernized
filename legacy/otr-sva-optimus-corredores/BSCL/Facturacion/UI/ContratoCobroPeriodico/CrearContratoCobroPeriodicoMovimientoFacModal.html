<div class="row" ng-controller="CrearContratoCobroMovimientoFacModal">
  <div class="row bcs-cuerpo">	
	<div class="row">
	
	  <!-- INICIO -->
	  <div class="col-xs-12">
	    <div class="row">
	      <div class="col-xs-4">
	        <label class="col-xs-5" translate>UI_TIPO_COBRO</label>
	        <bcs-input-texto class="col-xs-6" 
	           ng-model="data.oTipoCobro"  
	           maxlength="30"
	           k-ng-disabled="data.activaroTipoCobro">
	        </bcs-input-texto>
	      </div>	  
		</div>
		
		<div class="row">
		  <div class="col-xs-4">
	        <label class="col-xs-5" translate>UI_MONEDA_COBRO</label>
	        <bcs-input-texto class="col-xs-6" 
	           ng-model="data.oMonedaOperacionMovimientoComprobanteCobro"  
	           maxlength="30"
	           k-ng-disabled="data.activaroMonedaOperacionMovimientoComprobanteCobro">
	        </bcs-input-texto>	        
	      </div>
	      
	      <div class="col-xs-3">
	        <label class="col-xs-5" translate>UI_MONTO_COBRO</label>
	        <bcs-input-monetario class="col-xs-6"
			   decimales = "data.decimalesoMontoOperacionCobro"
			   simbolo="data.simbolooMontoOperacionCobro" 
			   k-ng-model="data.oMontoOperacionCobro"
			   k-ng-disabled="data.activaroMontoOperacionCobro">
			</bcs-input-monetario>  
	      </div> 
	      
	      <div class="col-xs-3">
	        <label class="col-xs-5" translate>UI_PORCENTAJE</label>
			<bcs-input-porcentaje class="col-xs-6"	
			   id="formAnticipoSimultanea_TASA"			
			   name="data.tasa" 				
			   k-ng-disabled = "data.activaroPorcentajeCobro" 
			   k-ng-model="data.oPorcentajeCobro">
			 </bcs-input-porcentaje>
	      </div> 	      
	    </div>
	    
	    <div class="row">
	      <div class="col-xs-4">
	        <label class="col-xs-5" translate>UI_MONEDA_LOCAL</label>	
	        <bcs-input-texto class="col-xs-6" 
	           ng-model="data.oMonedaLocalMovimientoComprobanteCobro"  
	           maxlength="30"
	           k-ng-disabled="data.activaroMonedaLocalMovimientoComprobanteCobro">
	        </bcs-input-texto>			
	      </div>
	      
	      <div class="col-xs-3">
	        <label class="col-xs-5" translate>UI_MONTO_LOCAL</label>
			<bcs-input-monetario class="col-xs-6"
			   decimales = "data.decimalesoMontoLocalCobro"
			   simbolo="data.simbolooMontoLocalCobro"			    
			   k-ng-model="data.oMontoLocalCobro"
			   k-ng-disabled="data.activaroMontoLocalCobro">
			</bcs-input-monetario>  
	      </div>
	    </div>
	    
	    <div class="row">
	      <div class="col-xs-4">
	        <label class="col-xs-5" translate>UI_MONEDA_LIQUIDACION</label>
	        <bcs-input-texto class="col-xs-6" 
	           ng-model="data.oMonedaLiquidacionMovimientoComprobanteCobro"  
	           maxlength="30"
	           k-ng-disabled="data.activaroMonedaLiquidacionMovimientoComprobanteCobro">
	        </bcs-input-texto>
	      </div>
	      
	      <div class="col-xs-3">
	        <label class="col-xs-5" translate>UI_MONTO_LIQUIDACION</label>
	        <bcs-input-monetario class="col-xs-6"
			   decimales = "data.decimalesoMontoLiquidacionCobro"
			   simbolo="data.simbolooMontoLiquidacionCobro" 
			   k-ng-model="data.oMontoLiquidacionCobro"
			   k-ng-disabled="data.activaroMontoLiquidacionCobro">
			</bcs-input-monetario>  
	      </div>
	    </div>	    
	  </div>
	</div>
	
	<div class ="row">
	  <br>
	  <br>
	</div>
	
	<div class="row">
	  <div class="col-xs-12">
	    <bcs-grid 
	       id="grid-modificar-movimiento-cobros"	       
	       configuracion = "confBasicaModificarMovimientoCobros" 
	       seleccionado = "seleccionModificarMovimientoCobros" 
	       api = "gridApiModificarMovimientoCobros">
	    </bcs-grid>
	  </div>     
	</div>	
  </div>
  
  <!-- INICIO PANEL COMANDOS --> 	  
  <div class="row bcs-panel-comandos" style="margin-top:15px">
	<bcs-button  class="col-xs-1" bcs-tipo="'principal'"  bcs-auto-desactivar="'true'"  bcs-texto="'UI_GRABAR' | translate"  bcs-habilitado="true"  bcs-clic="data.modificarMovimientoComprobanteCobro()"></bcs-button>
	<bcs-button  class="col-xs-1" bcs-tipo="''"           bcs-auto-desactivar="'true'"  bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="data.cancelar()"></bcs-button>				
						
	<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">		            
	   <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	   
    </bcs-menu>
  </div>	
  <!-- FIN PANEL COMANDOS -->
</div>

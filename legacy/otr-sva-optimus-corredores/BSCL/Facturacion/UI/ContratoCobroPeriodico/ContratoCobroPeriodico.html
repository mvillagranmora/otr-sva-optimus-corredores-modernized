<div class="row" ng-controller="ContratoCobroPeriodicoCtrl">
	<div class="row bcs-cuerpo">	
		<div class="row">

			<!-- INICIO FILTROS -->	
			<div class="col-xs-10"> 				
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-9" 
							id="UI_SOCIO_NEGOCIO"
							auto-cargar="'false'" 
							ng-style = "{'width' : data.oClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && data.oClientePortafolio.seleccionado ? '72%' : '75%'}"
							tipo="data.oClientePortafolio.tipo"
							seleccionado="data.oClientePortafolio.seleccionado"
							filtros="filtrosPortafolio" 
							id-actual="filtros.IdPortafolio"
							configuracion="data.oClientePortafolio.configuracion">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-6">
				  	  <label class="col-xs-3" translate>UI_CLASIFICACION</label>
					  <bcs-combobox-base class="col-xs-9" 
								tipo         = "data.oConfiguracionClasificacion.tipo"
								id-actual    = "data.oConfiguracionClasificacion.idActual"
								seleccionado = "data.oConfiguracionClasificacion.seleccionado"
								id-post-filtro = "data.oConfiguracionClasificacion.idPostFiltro"
								item-post-filtro="'1'"
								bcs-requerido
								configuracion= "data.oConfiguracionClasificacion.configuracion" 
								cascada1-a="data.oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
								cascada1-valor="'IdClasificacionTipoInstrumento'" 	
								todos="'S'" 	
							></bcs-combobox-base >			  	  
					</div>
				</div>

				<div class="row">						
					<div class="col-xs-6">
				  	  <label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
					  <bcs-combobox-base class="col-xs-9" 
								auto-cargar="'false'"
								tipo="data.oConfiguracionTipoInstrumento.tipo"  
								filtros="data.oConfiguracionTipoInstrumento.filtros"
								configuracion= "data.oConfiguracionTipoInstrumento.configuracion" 
								id-actual = "data.oConfiguracionTipoInstrumento.idActual"
								id-post-filtro = "data.oConfiguracionTipoInstrumento.idPostFiltro" 
								item-post-filtro="'1'"
								seleccionado="data.oConfiguracionTipoInstrumento.seleccionado"
								cascada1-a="data.oConfiguracionInstrumento.filtros.IdTipoInstrumento"
								cascada1-valor="'IdTipoInstrumento'" 	
								todos="'S'"							
							></bcs-combobox-base >
					</div>
					
					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_MES_PROCESAR</label>
						<bcs-input-date
							class="col-xs-9"
							bcs-requerido
							k-ng-model="data.kngFechaProceso"
							k-options="data.FechaConsultaOpt"
							todo-dias="'true'">
						</bcs-input-date>	
					</div>
				</div>
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_GLOSA</label>
						<div class="col-xs-4">
							<label style="color:green; font-weight: bold;" translate>UI_FACTURADA</label>
						</div>
						<div class="col-xs-4">
							<label style="color:black; font-weight: bold;" translate>UI_NO_FACTURADA</label>
						</div>
					</div>
				</div>
			</div>
			<!-- FIN FILTROS -->
					
			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button 
						class="col-xs-12" 
						bcs-tipo="'bcs-button-search'"  
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_BUSCAR' | translate" 
						bcs-habilitado="true"  
						bcs-clic="buscar()">
					</bcs-button>
				</div>
				<div class="row">
					<bcs-button 
						class="col-xs-12" 
						bcs-tipo="'bcs-button-secondary'"  
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="true"  
						bcs-clic="limpiarFiltros()">
				  </bcs-button>
				</div>
			</div>
			<!-- FIN BOTONES -->	  
		</div> 

		<!-- INICIO SUB GRILLA DETALLE REGISTRO -->      
		<div class="row">
			<bcs-grid 
				id="grid-cliente-contrato-cobros" 
				configuracion = "confBasicaClienteContCobros" 
				seleccionado = "seleccionClienteContCobros" 
				fn-doble-click = "detalleMovimientoContrato(seleccionClienteContCobros)"
				api = "gridApiClienteContCobros">
			</bcs-grid>
		</div>
		<!-- FIN SUB GRILLA DETALLE REGISTRO -->	
	</div>

	<!-- INICIO PANEL COMANDOS --> 
	<div class="row bcs-panel-comandos" style="margin-top:15px">
		<bcs-button  
			class="col-xs-1" 
			id = 'ContratoCobroPeriodicoCtrl_btnIngresarContrato' 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="'true'"  
			bcs-texto="'UI_GENERAR' | translate"
			bcs-habilitado="data.btnActivos"
			bcs-clic="data.crearContratoCobro(seleccionClienteContCobros)">
		</bcs-button>
		<bcs-button  
			class="col-xs-1" 
			id = 'ContratoCobroPeriodicoCtrl_btnCancelar' 
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'true'"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-habilitado="true"
			bcs-clic="data.cancelar()">
		</bcs-button>		
		
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
			bcs-texto="'UI_OPCIONES' | translate">
		<li ng-click="data.seleccionarTodosMovimientos()">{{'UI_SELECCIONAR_TODO'
			| translate}}</li>
		<li ng-click="data.deseleccionarTodosMovimientos()">{{'UI_DESELECCIONAR_TODO'
			| translate}}</li>
		</bcs-menu>
	</div>
	<!-- FIN PANEL COMANDOS -->
</div>

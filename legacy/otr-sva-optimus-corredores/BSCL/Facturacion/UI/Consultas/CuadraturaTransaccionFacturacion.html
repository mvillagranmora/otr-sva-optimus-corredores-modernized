<div class="row" ng-controller="CuadraturaTransaccionFacturacionCtrl">
  <div class="row bcs-cuerpo">
    <div class="row">
    
      <!-- INICIO FILTROS -->
      <div class="col-xs-10"> 
        <div class="row">	
		  <div class="col-xs-5">
	        <label class="col-xs-4" translate>UI_FOLIO_TRANSACCION</label>		  
		    <bcs-input-texto class="col-xs-8"
		      id="UI_FOLIO_TRANSACCION"
		      ng-model ="data.oFolioTransaccion">
		    </bcs-input-texto>		    
	 	  </div>
	 	  
	 	  <div class="col-xs-5">
			<label class="col-xs-4" translate>UI_FECHA_TRANSACCION</label>
			<bcs-input-date class="col-xs-8" 
			   id="UI_FECHA_TRANSACCION"
			   k-ng-model="data.oFechaTransaccion">
		    </bcs-input-date>
		  </div>
		  
		  <div class="col-xs-2">
		    <label class="col-xs-10" translate>UI_SOLO_DESCUADRATURA</label>
			<bcs-input-checkbox 
			  id="UI_SOLO_DESCUADRATURA"
			  ng-model="data.oSoloDescuadratura">
			</bcs-input-checkbox>
		  </div>	  	 	  
		</div>
		
		<div class="row">
		  <div class="col-xs-5">
			<label class="col-xs-4" translate>UI_CLASIFICACION</label>			
			<bcs-combobox-base class="col-xs-8"
			   auto-cargar="'true'"
			   tipo="data.oClasificacionTipoInstrumento.tipo"
			   configuracion= "data.oClasificacionTipoInstrumento.configuracion"
			   seleccionado="data.oClasificacionTipoInstrumento.seleccionado"								
			   filtros="data.oClasificacionTipoInstrumento.filtros"
			   id-actual="data.oClasificacionTipoInstrumento.idActual"
			   cascada-a="data.oTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
			   cascada-valor="'IdClasificacionTipoInstrumento'"							
			   todos="'S'"
			   id-defecto="'0'"
			   item-post-filtro="'1'">
			</bcs-combobox-base>
		  </div>
		  
		  <div class="col-xs-5">
			<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>					
			<bcs-combobox-base  class="col-xs-8"
			   auto-cargar="'false'"
			   tipo="data.oTipoInstrumento.tipo"
			   configuracion= "data.oTipoInstrumento.configuracion"
			   id-actual="data.oTipoInstrumento.idActual"
			   seleccionado="data.oTipoInstrumento.seleccionado"
			   filtros="data.oTipoInstrumento.filtros"
			   todos="'S'"
			   id-defecto="'0'"
			   item-post-filtro="'1'">								
			</bcs-combobox-base>
		  </div>
		
		</div>
      </div>
      <!-- FIN FILTROS -->
      
      <!-- INICIO BOTONES -->
	  <div class="col-xs-2">
		<div class="row">
		  <bcs-button class="col-xs-12" 
			 bcs-tipo="'bcs-button-search'"  
			 bcs-auto-desactivar="'false'" 
			 bcs-texto="'UI_BUSCAR' | translate" 
			 bcs-habilitado="true"  
			 bcs-clic="buscar()">
		  </bcs-button>
		</div>
		  
		<div class="row">
		  <bcs-button class="col-xs-12" 
			 bcs-tipo="'bcs-button-secondary'"  
			 bcs-auto-desactivar="'false'" 
			 bcs-texto="'UI_LIMPIAR' | translate" 
			 bcs-habilitado="true"  
			 bcs-clic="limpiarFiltros()">
		  </bcs-button>
		</div>		  
	  </div>
	  <!-- FIN BOTONES -->
	</div>  
	  
	  <!-- INICIO SUB GRILLA DETALLE REGISTRO -->
	  <div class="row">
	    <bcs-grid id="grid-cuadratura-transaccion" fn-exportar-excel = "exportarExcel" configuracion = "confBasicaCuadraturaTransaccion" seleccionado = "seleccionCuadraturaTransaccion" api = "gridApiCuadraturaTransaccion">
		 <div bcs-grid-detail ng-non-bindable>
		   <div style="width: 830px;" >
	         <uib-tabset>
	           <uib-tab heading="{{'UI_DETALLE' | translate}}">
	             <bcs-grid 
	               configuracion = "confBasicaCuadraturaTransaccionDetalle(dataItem)"
	               seleccionado = "dataItem.seleccionTransaccionDetalle">
				 </bcs-grid>
	           </uib-tab> 
			 </uib-tabset>
		   </div>
		 </div>
	    </bcs-grid>	 
	  </div> 
	  <!-- FIN SUB GRILLA DETALLE REGISTRO -->    
    
  </div>
  

  <!-- INICIO PANEL COMANDOS --> 	  
  <div class="row bcs-panel-comandos">	 						
	<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">		            
	   <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	   
    </bcs-menu>
  </div>	
  <!-- FIN PANEL COMANDOS -->
  
</div>

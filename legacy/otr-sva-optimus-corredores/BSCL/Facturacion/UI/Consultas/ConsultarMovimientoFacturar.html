<div class="row" ng-controller="ConsultarMovimientoFacturarCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">

			<!-- INICIO FILTROS -->
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-8">
						<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-10"
							id="ConsultarMovimientoFacturarCtrl_UI_SOCIO_NEGOCIO"
							auto-cargar="'false'" tipo="data.oClientePortafolio.tipo"
							ng-style="{'width' : data.oClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && data.oClientePortafolio.seleccionado  ? '81%' : '83.33333333%'}"
							seleccionado="data.oClientePortafolio.seleccionado"
							filtros="filtrosPortafolio" 
							id-actual="filtros.IdPortafolio"
							bcs-requerido="'true'"
							configuracion="data.oClientePortafolio.configuracion">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_ESTADO</label>
						<bcs-combobox-base class="col-xs-8"
							id="ConsultarMovimientoFacturarCtrl_UI_ESTADO"
							auto-cargar="'true'" tipo="data.oEstadoMovimientoFactura.tipo"
							configuracion="data.oEstadoMovimientoFactura.configuracion"
							id-actual="data.oEstadoMovimientoFactura.idActual"
							seleccionado="data.oEstadoMovimientoFactura.seleccionado"
							filtros="data.oEstadoMovimientoFactura.filtros" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>
				</div>

				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_TIPO_COMPROBANTE</label>
						<bcs-combobox-base class="col-xs-8"
							id="ConsultarMovimientoFacturarCtrl_UI_TIPO_COMPROBANTE"
							auto-cargar="'true'" tipo="data.oTipoComprobante.tipo"
							configuracion="data.oTipoComprobante.configuracion"
							id-actual="data.oTipoComprobante.idActual"
							seleccionado="data.oTipoComprobante.seleccionado"
							filtros="data.oTipoComprobante.filtros" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>

					<div class="col-xs-4">
						<label class="col-xs-5" translate>UI_CONDICION_LIQUIDACION_ABR</label>
						<bcs-combobox-base class="col-xs-7"
							id="ConsultarMovimientoFacturarCtrl_UI_CONDICION_LIQUIDACION_ABR"
							auto-cargar="'true'" tipo="data.oCondicionLiquidacion.tipo"
							configuracion="data.oCondicionLiquidacion.configuracion"
							id-actual="data.oCondicionLiquidacion.idActual"
							seleccionado="data.oCondicionLiquidacion.seleccionado"
							filtros="data.oCondicionLiquidacion.filtros" todos="'S'"
							item-post-filtro="'1'" id-defecto="'0'"> </bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_CLASIFICACION</label>
						<bcs-combobox-base class="col-xs-8"
							id="ConsultarMovimientoFacturarCtrl_UI_CLASIFICACION"
							auto-cargar="'true'"
							tipo="data.oClasificacionTipoInstrumento.tipo"
							configuracion="data.oClasificacionTipoInstrumento.configuracion"
							seleccionado="data.oClasificacionTipoInstrumento.seleccionado"
							filtros="data.oClasificacionTipoInstrumento.filtros"
							id-actual="data.oClasificacionTipoInstrumento.idActual"
							cascada-a="data.oTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
							cascada-valor="'IdClasificacionTipoInstrumento'" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>

				</div>

				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base class="col-xs-8"
							id="ConsultarMovimientoFacturarCtrl_UI_TIPO_INSTRUMENTO"
							auto-cargar="'false'" tipo="data.oTipoInstrumento.tipo"
							configuracion="data.oTipoInstrumento.configuracion"
							id-actual="data.oTipoInstrumento.idActual"
							seleccionado="data.oTipoInstrumento.seleccionado"
							filtros="data.oTipoInstrumento.filtros" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>

					<div class="col-xs-4">
						<label class="col-xs-5" translate>UI_OPERACION</label>
						<bcs-combobox-base class="col-xs-7"
							id="ConsultarMovimientoFacturarCtrl_UI_OPERACION"
							auto-cargar="'true'" tipo="data.oOperacion.tipo"
							configuracion="data.oOperacion.configuracion"
							id-actual="data.oOperacion.idActual"
							seleccionado="data.oOperacion.seleccionado"
							filtros="data.oOperacion.filtros" todos="'S'"
							item-post-filtro="'1'"> </bcs-combobox-base>
					</div>

					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
						<bcs-input-instrumentos class="col-xs-8"
							id="ConsultarMovimientoFacturarCtrl_UI_INSTRUMENTO"
							datos-instrumento="data.instrumento"
							buscar-instrumento="data.buscarinstrumento" filtro-estado="'ACT'"
							filtro-tipo-instrumento="data.oConfiguracionTipoInstrumento.seleccionado.IdTipoInstrumento">
						</bcs-input-instrumentos>
					</div>
				</div>

				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA_MOVIMIENTO</label>
						<bcs-input-date class="col-xs-4"
							id="ConsultarMovimientoFacturarCtrl_UI_FECHA_MOVIMIENTO_DESDE"
							k-ng-model="data.oFechaMovimientoDesde"> </bcs-input-date>
						<bcs-input-date class="col-xs-4"
							id="ConsultarMovimientoFacturarCtrl_UI_FECHA_MOVIMIENTO_HASTA"
							k-ng-model="data.oFechaMovimientoHasta"> </bcs-input-date>
					</div>
				</div>
			</div>
			<!-- FIN FILTROS -->

			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_BUSCAR' | translate"
						bcs-habilitado="true" bcs-clic="buscar()"> </bcs-button>
				</div>

				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="true" bcs-clic="limpiarFiltros()"> </bcs-button>
				</div>
			</div>
			<!-- FIN BOTONES -->

		</div>

		<!-- INICIO SUB GRILLA DETALLE REGISTRO -->
		<div class="row">
			<bcs-grid id="grid-consultar-movimiento-facturar"
				fn-exportar-excel="exportarExcel"
				configuracion="confBasicaConsultarMovimientoFacturar"
				seleccionado="seleccionConsultarMovimientoFacturar"
				api="gridApiConsultarMovimientoFacturar">
			<div bcs-grid-detail ng-non-bindable>
				<div style="width: 830px;">
					<uib-tabset> <uib-tab
						heading="{{'UI_COBROS' | translate}}"> <bcs-grid
						configuracion="confBasicaConsultaMovimientoCobros(dataItem)"
						seleccionado="dataItem.seleccionConsultaMovimientoCobros">
					</bcs-grid> </uib-tab> <uib-tab heading="{{'UI_FORMA_DE_PAGO' | translate}}">
					<bcs-grid
						configuracion="confBasicaConsultaMovimientoFormasDePago(dataItem)"
						seleccionado="dataItem.seleccionConsultaMovimientoFormasDePago">
					</bcs-grid> </uib-tab> </uib-tabset>
				</div>
			</div>
			</bcs-grid>
		</div>
		<!-- FIN SUB GRILLA DETALLE REGISTRO -->
	</div>

	<!-- INICIO PANEL COMANDOS -->
	<div class="row col-xs-12 bcs-panel-comandos">
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
			bcs-texto="'UI_OPCIONES' | translate">
		<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' |
			translate}}</li>
		</bcs-menu>
	</div>
	<!-- FIN PANEL COMANDOS -->

</div>

<div id="CuadraturaFacturacion" class="row" ng-controller="CuadraturaFacturacionCtrl">
	<div class="row">
		<form name="formCuadraturaFacturacion" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_PROCESO</label>
				<bcs-input-date class="col-xs-7"
					id="CuadraturaFacturacion_fechaProceso"
					bcs-requerido
					k-ng-model="filtro.FechaProceso"
					k-ng-disabled="'true'">
				</bcs-input-date>
		  	</div>
		</form>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
			<bcs-button class="col-xs-4"
				id="CuadraturaFacturacion_ejecutar"
				bcs-tipo="'principal'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EJECUTAR' | translate"
				bcs-habilitado="formCuadraturaFacturacion.$valid"
				bcs-clic="fn.ejecutar()">
			</bcs-button>
		</div>
	</div>
</div>

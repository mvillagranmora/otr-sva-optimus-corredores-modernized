<div class="row" ng-controller='BlotterCargaMasivaFacturacionCtrl'>
	<form name="frmBlotterCargaMasiva"  class="col-xs-12 form-horizontal">
	<div class="row bcs-cuerpo">
	 
		<div class="row">
			<!-- INICIO FILTROS -->
			<div class="col-xs-10">		
	
				<div class="row">
					<div class="col-xs-12">
						 <label class="col-xs-2" translate>UI_TIPO_CARGA</label>
						 <bcs-combobox-base class="col-xs-10"
						    bcs-requerido 
						 	id              = "frmBlotterCargaMasiva_TipoCarga"
							tipo			= "oConfiguracionTipoCargaMasiva.tipo"
							id-Actual		= "oConfiguracionTipoCargaMasiva.idActual"
							seleccionado	= "oConfiguracionTipoCargaMasiva.seleccionado"
							filtros			= "oConfiguracionTipoCargaMasiva.filtros"
							configuracion	= "oConfiguracionTipoCargaMasiva.configuracion">
						 </bcs-combobox-base>
					</div>
				</div>
				
				
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-4" translate>UI_FECHA_CARGA</label>
						<bcs-input-date class="col-xs-4" 
							 k-ng-model  	= "kngFechaCargaDesde" 
							 ng-model    	= "FechaCargaDesde">
						</bcs-input-date>		
						<bcs-input-date class="col-xs-4"
							 k-ng-model  	= "kngFechaCargaHasta" 
							 ng-model    	= "FechaCargaHasta">
						</bcs-input-date>		
					</div>									

														
					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_ESTADO</label>
						<bcs-combobox-base  class="col-xs-9"
						    id               = "frmBlotterCargaMasiva_Estado"												
							tipo			 = "oConfiguracionEstado.tipo"
							configuracion	 = "oConfiguracionEstado.configuracion"
							seleccionado	 = "oConfiguracionEstado.seleccionado"
							id-actual		 = "oConfiguracionEstado.idActual"
							filtros			 = "oConfiguracionEstado.filtros"											
							todos			 = "'S'">
						</bcs-combobox-base>
					</div>
				</div>				
				
				
			</div>
			<!-- FIN FILTROS -->
			
			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="'false'" bcs-texto="'UI_BUSCAR' | translate"  bcs-habilitado="frmBlotterCargaMasiva.$valid" bcs-clic="buscarCargaMasiva()"></bcs-button>
				</div>
				<div class="row">  
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'"  bcs-clic="limpiarFiltros()"></bcs-button>
				</div>
													
			</div>
			<!-- FIN BOTONES -->
		</div>
		

		<div class="row">		
			<bcs-grid id="grid-carga-masiva"
				configuracion 		= "confBasicaCargaMasiva"
				seleccionado  		= "seleccionCargaMasiva"
				fn-exportar-excel 	= "exportarExcel"
				fn-doble-click      = "detalleCargaMasiva(seleccionCargaMasiva)">
			</bcs-grid>
		</div>
		
	</div>
	
	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos">
		<bcs-button  id="CargaMasivaFacturacion_Cargar" class="col-xs-2" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false"  bcs-texto="'UI_CARGAR' | translate"   bcs-habilitado="frmBlotterCargaMasiva.$valid"  bcs-clic="cargarArchivo()"></bcs-button>
		<bcs-button  id="CargaMasivaFacturacion_Eliminar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false"  bcs-texto="'UI_ELIMINAR' | translate"   bcs-habilitado="seleccionCargaMasiva"  bcs-clic="eliminarCargarMasiva(seleccionCargaMasiva)"></bcs-button>
		<bcs-button  id="CargaMasivaFacturacion_Procesar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false"  bcs-texto="'UI_PROCESAR' | translate"   bcs-habilitado="seleccionCargaMasiva"  bcs-clic="procesarCargarMasiva(seleccionCargaMasiva)"></bcs-button>
 
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">	
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
        </bcs-menu>
	</div>
	

	</form>	
</div>

<div class="col-xs-12" ng-controller="ComplementoCargaMasivaCtrl">
	<form name="frmComplementoCargaMasiva" class="col-xs-12 form-horizontal">   

		<div class="row bcs-cuerpo">
		
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_CARGA</label>
				<div class="col-xs-8">{{parametros.NombreTipoCargaMasiva}}</div>
			</div>
						
			<div class="row">
			    <label class="col-xs-4" translate>UI_EJECUTIVO_DIGITADOR</label>
			    <bcs-combobox-base  class="col-xs-8"
			       id				= "frmComplementoCargaMasiva_Ejecutivo"
				   tipo				= "data.oConfiguracionEjecutivo.tipo"
				   configuracion	= "data.oConfiguracionEjecutivo.configuracion"
				   id-actual		= "data.oConfiguracionEjecutivo.idActual"
				   seleccionado		= "data.oConfiguracionEjecutivo.seleccionado"
				   filtros			= "data.oConfiguracionEjecutivo.filtros">
				</bcs-combobox-base>
			</div>

			<div class="row">
				<label class="col-xs-4" translate>UI_BOLSA</label>
				<bcs-combobox-base class="col-xs-8"
					id				= "frmComplementoCargaMasiva_Bolsa"
					tipo			= "data.oConfiguracionBolsa.tipo" 
					id-actual		= "data.oConfiguracionBolsa.idActual" 
					configuracion	= "data.oConfiguracionBolsa.configuracion"
					seleccionado	= "data.oConfiguracionBolsa.seleccionado" 
					filtros			= "data.oConfiguracionBolsa.filtros">
				</bcs-combobox-base >
			</div>
			
			<div class="row">
				<label class="col-xs-4" translate>UI_BOVEDA</label>
				<bcs-combobox-base class="col-xs-8" 
				    id				= "frmComplementoCargaMasiva_Boveda"
					tipo			= "data.oConfiguracionBoveda.tipo" 
					id-actual		= "data.oConfiguracionBoveda.idActual" 
					configuracion	= "data.oConfiguracionBoveda.configuracion"
					seleccionado	= "data.oConfiguracionBoveda.seleccionado" 
					filtros			= "data.oConfiguracionBoveda.filtros">
				</bcs-combobox-base >
			</div>	

		</div>

						
		<div class="row bcs-panel-comandos">
			<bcs-button id="frmComplementoCargaMasiva_Procesar"  class="col-xs-3 pull-right"  bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="false" bcs-texto="'UI_PROCESAR' | translate"    bcs-habilitado="frmComplementoCargaMasiva.$valid" bcs-clic="procesarCargaMasiva()"></bcs-button>
			<bcs-button id="frmComplementoCargaMasiva_Limpiar"   class="col-xs-3 pull-right"  bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"     bcs-habilitado="frmComplementoCargaMasiva.$valid" bcs-clic="limpiarComplemento()"></bcs-button>
		</div>
	
	</form>	
</div>

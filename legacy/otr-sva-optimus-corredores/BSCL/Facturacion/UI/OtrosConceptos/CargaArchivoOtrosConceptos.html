<div class="row" ng-controller="CargarArchivoOtrosConceptosCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<bcs-grid
			id="grid-resultados"
	 		configuracion = "configResultados"
			seleccionado = "seleccionResultados"
			api="gridApiResultados">
			</bcs-grid>
			
		</div>	
		<div class="row">     
			<bcs-button class="col-xs-3" bcs-habilitado="conf.archivoValido"  bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'Guardar Movimientos'" bcs-clic="guardar()"></bcs-button>
			<bcs-button class="col-xs-3" bcs-habilitado="'true'"  bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'Cargar archivo'" bcs-clic="cargarArchivo()"></bcs-button>
		</div>
	</div>
</div>

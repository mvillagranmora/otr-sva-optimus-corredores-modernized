<div class="row" ng-controller="PeriodoCierreCtrl">
	<div class="row bcs-cuerpo">
	  <div class="row">
	  <form name = "frmProcPerCier">
	     <!-- FILTROS -->
	     <div class="col-xs-9">
			<label class="col-xs-6" translate>UI_ANO_PERIODO</label>
			<bcs-input-date class="col-xs-4" 
			   bcs-requerido
			   id="frmProcPerCier_UI_ANO_PERIODO"
			   k-ng-model="data.oAnoPeriodo"
			   k-options = "confBasicaAnoPeriodo"
			   todo-dias = "'true'" >
		    </bcs-input-date>
		 </div>
		 <!-- FIN FILTROS -->
		 
		 <!-- INICIO BOTONES -->
	     <div class="col-xs-3">
		   <div class="row">
		      <bcs-button class="col-xs-12" 
			       bcs-tipo="'default'"  
			       bcs-auto-desactivar="'false'" 
			       bcs-texto="'UI_BUSCAR' | translate" 
			       bcs-habilitado="frmProcPerCier.$valid"  
			       bcs-clic="buscar()">
		     </bcs-button>
		   </div>
		 </div>
	     <!-- FIN BOTONES --> 
	   </form>
	  </div>	  
	  
	  <div class="row">
		<bcs-grid 
	       id="frmProcPerCier_grid_periodo_cierre"	       
	       configuracion = "confBasicaProcesarPeriodoCierre" 
	       seleccionado = "seleccionProcPerCierre" 
	       api = "gridApiProcPerCierre">
	    </bcs-grid>			
	  </div>
	   
	  
	  <div class="row">     
		<bcs-button class="col-xs-4" id = 'ProcPerCier_btnCerrarPeriodo' bcs-tipo="'principal'"  bcs-auto-desactivar="'true'"  bcs-texto="'UI_PROCESAR_PERIODO' | translate"	bcs-habilitado="'true'"  bcs-clic="data.cerrarPeriodo()"></bcs-button>
	  </div>
	</div>	
</div>

<div id="GenerarArchivoAFP" class="row" ng-controller='GenerarArchivoAFPCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-9">
				<!-- INICIO FILTROS -->
				<div class="col-xs-12">
					<div class="row">
						<div class="col-xs-6">
							<label class="col-xs-2" translate>UI_AFP</label> 
							<bcs-combobox-base class="col-xs-8" 
								id="ConfiguracionAFP_UI_AFP"
								bcs-requerido="'true'"  auto-cargar="'true'" 
								id-actual="filtros.IdAFP"
								tipo="data.oComboboxAFP.tipo"
								seleccionado="data.oComboboxAFP.seleccionado"
								configuracion="data.oComboboxAFP.configuracion"
								filtros="filtrosAFP">
							</bcs-combobox-base>
						</div>
						<div class="col-xs-6">
							<label class="col-xs-2" translate>UI_FECHA</label>
							<bcs-input-date class="col-xs-8" bcs_requerido
								id="GenerarArchivoAFP_UI_FECHA"
								name="uFechaMovimientoComprobante"
								k-ng-model="data.oFechaMovimientoComprobante"
								k-ng-disabled="data.activaroFechaMovimientoComprobante">
							</bcs-input-date>
						</div>
					</div>
				</div>
			</div>
			<!-- FIN FILTROS -->
			<div class="col-xs-3">
				<!-- INICIO BOTONES -->
				<div class="row">
					<bcs-button class="col-xs-12"  id="GenerarArchivoAFP_UI_GENERAR"
						bcs-habilitado="true" bcs-tipo="'bcs-button-input-form'" bcs-habilitado="data.btnGenerar"
						bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate" 
						bcs-clic="data.generar();">
					</bcs-button>
				</div>
				<!-- FIN BOTONES -->
			</div>
		</div>
	</div>
</div>

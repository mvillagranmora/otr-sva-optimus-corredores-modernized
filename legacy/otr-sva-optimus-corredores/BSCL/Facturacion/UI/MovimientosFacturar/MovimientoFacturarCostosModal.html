<div class="row" ng-controller="MovimientoFacturarCostosModalCtrl">
  <div class="row bcs-cuerpo">	
	<!-- INICIO GRILLA -->
	
	<div class="row">
	  <div class="col-xs-4">
	    <label class="col-xs-6" translate>UI_TIPO_CALCULO</label>
	  </div>
	  
	  <div class="col-xs-4">
		<label class="col-xs-4" translate>UI_MONTO</label>
		<bcs-input-checkbox 
		  class="col-xs-1"
		  ng-model="data.oIndMonto">
		</bcs-input-checkbox>
	  </div>
	  
	  <div class="col-xs-4">
		<label class="col-xs-5" translate>UI_PORCENTAJE</label>
		<bcs-input-checkbox 
		  class="col-xs-1"
		  ng-model="data.oIndPorcentaje">
		</bcs-input-checkbox>
	  </div>	
	</div>
	
	<div class="row">
	  <bcs-grid 
	     id="grid-movimiento-facturacion-costos" 
	     configuracion = "data.confBasicaMovimientoFacturacionCostos" 
	     seleccionado = "seleccionMovimientoCostos">
	  </bcs-grid>
	</div>
	<!-- FIN GRILLA -->
  </div>
  
  <!-- INICIO PANEL COMANDOS -->
  <div class="row">
	<div class="col-xs-12 bcs-panel-comandos">	  
	  <bcs-button  class="col-xs-2 pull-right" id = 'MovimientoFacturarCostosCtrl_btnActualizarCostos' bcs-tipo="'bcs-button-primary'" bcs-habilitado="'true'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACTUALIZAR' | translate"   bcs-habilitado="data.btnActivo"  bcs-clic="data.actualizarCostos()"></bcs-button>
	</div>
  </div>
  <!-- FIN PANEL COMANDOS -->	
</div>

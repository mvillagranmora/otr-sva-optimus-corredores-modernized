<div class="row" ng-controller="ModificarMovimientoGeneralModalCtrl">
  <div class="row bcs-cuerpo">	
	<div class="row">
	
	  <!-- INICIO -->	  
	  <div class="col-xs-12">
	    <div class="row">
	      <div class="col-xs-6">
		    <label class="col-xs-3" translate>UI_MOVIMIENTO</label>
		    <bcs-input-texto 
		       class="col-xs-9"			    
			   ng-model="bModifMvtoMod.oMovimientoComprobante.IdMovimientoComprobante" 
			   k-ng-disabled = "'true'">
			</bcs-input-texto>		    
		  </div>
	    </div>
	    
	    <div class="row">
	      <div class="col-xs-6">
	        <label class="col-xs-3" translate>UI_CLIENTE</label>
		    <bcs-input-texto 
		       class="col-xs-9"  
		       ng-model="bModifMvtoMod.oMovimientoComprobante.NombreLargoCliente"  
		       maxlength="80"
		       k-ng-disabled="'true'">
		    </bcs-input-texto>
	 	  </div>
	 	  
	      <div class="col-xs-6">
	        <label class="col-xs-2" translate>UI_PORTAFOLIO</label>
		    <bcs-combobox-base class="col-xs-9"
		       id="UI_PORTAFOLIO"
		       tipo="data.oPortafolio.tipo"
		       seleccionado="data.oPortafolio.seleccionado"
		       id-actual="data.oPortafolio.idActual"
		       filtros="data.oPortafolio.filtros"
		       id-post-filtro = "bModifMvtoMod.oMovimientoComprobante.IdPortafolio"
		       configuracion= "data.oPortafolio.configuracion">
		    </bcs-combobox-base>
		  </div> 
		</div> 
		
		  
		<div class="row">
		  <div class="col-xs-6">
		    <label class="col-xs-3" translate>UI_FORMA_CUSTODIA</label>		    
		    <bcs-combobox-base class="col-xs-9"
			   tipo="data.oFormaCustodia.tipo"
			   seleccionado="data.oFormaCustodia.seleccionado"
			   id-actual="data.oFormaCustodia.idActual"
			   filtros="data.oFormaCustodia.filtros"
			   configuracion="data.oFormaCustodia.configuracion"
			   id-post-filtro = "bModifMvtoMod.oMovimientoComprobante.IdFormaCustodia">
			</bcs-combobox-base >
		  </div>
		  
		  
		  
		  <div class="col-xs-6">
		    <label class="col-xs-2" translate>UI_BOVEDA</label>
			<bcs-combobox-base class="col-xs-9"
			   id= "UI_BOVEDA"
			   tipo="data.oBoveda.tipo"			   
			   seleccionado="data.oBoveda.seleccionado"
			   id-actual="data.oBoveda.idActual"
			   filtros="data.oBoveda.filtros"
			   id-post-filtro = "bModifMvtoMod.oMovimientoComprobante.IdBoveda"
			   configuracion= "data.oBoveda.configuracion">
			</bcs-combobox-base >
		  </div>
		</div>
		
		<div class="row">
		  <br>
		  <div class="col-xs-11">
		    <div class="col-xs-6">
		      <label class="col-xs-4" translate>UI_COMPROBANTE_INDIVIDUAL</label>	 				
			  <bcs-input-checkbox 
			      ng-model="data.oComprobanteInd"
			      ng-disabled = "data.activaroComprobanteInd">			   
		    </div>
		  </div>  
		</div>
		
		<div class="row">
		  <div class="col-xs-11">
		    <div class="col-xs-6">
		      <label class="col-xs-4" translate>UI_AFECTO_DERECHO</label>	 				
			  <bcs-input-checkbox 
			      ng-model="data.afectoDerecho"
			      ng-disabled = "data.activarafectoDerecho">			   
		    </div>
		  </div>  
		</div>
		
		<div class="row">
		  <div class="col-xs-11">
		    <div class="col-xs-6">
		      <label class="col-xs-4" translate>UI_AFECTO_GASTO</label>	 				
			  <bcs-input-checkbox 
			      ng-model="data.afectoGasto"
			      ng-disabled = "data.activarafectoGasto">			   
		    </div>
		  </div>  
		</div>
		
		<div class="row">
		  <div class="col-xs-11">
		    <div class="col-xs-6">
		      <label class="col-xs-4" translate>UI_AFECTO_IVA</label>	 				
			  <bcs-input-checkbox 
			      ng-model="data.afectoIva"
			      ng-disabled = "data.activarafectoIva">			   
		    </div>
		  </div>  
		</div>
		
		<div class="row">
		  <div class="col-xs-11">
		    <div class="col-xs-6">
		      <label class="col-xs-4" translate>UI_AFECTO_COMISION</label>	 				
			  <bcs-input-checkbox			       
			      ng-model="data.afectoComision"
			      ng-disabled = "data.activarafectoComision">			   
		    </div>
		  </div>  
		</div>
		
		<div class="row"
		ng-hide = "!['FOX','FOE','NEO'].includes(bModifMvtoMod.oMovimientoComprobante.IdTipoComprobante)">
			<div class="col-xs-11">	
			 <div class="col-xs-11">	 
			   <label class="col-xs-2" translate>UI_TIPO_REFERENCIA</label>
			   <bcs-combobox-base
					class="col-xs-7" bcs-requerido="data.oReferencia.length > 0"
					id="UI_TIPO_REFERENCIA"
					tipo="data.oTipoReferencia.tipo"
					seleccionado="data.oTipoReferencia.seleccionado"
					id-actual="data.oTipoReferencia.idActual"
					filtros="data.oTipoReferencia.filtros"
					id-post-filtro="bModifMvtoMod.oMovimientoComprobante.TipoReferencia"
					configuracion="data.oTipoReferencia.configuracion"
					id-defecto="data.oTipoReferencia.idDefecto">
		   	   </bcs-combobox-base>
			 </div>  
			</div>   	        	
		</div>
		<div class="row"
		ng-hide = "!['FOX','FOE','NEO'].includes(bModifMvtoMod.oMovimientoComprobante.IdTipoComprobante)">
			<div class="col-xs-11">	
			 <div class="col-xs-11">	 
			   <label class="col-xs-2" translate>UI_REFERENCIA_DOCUMENTO</label>
			   <bcs-input-texto class="col-xs-10"
				   id="UI_REFERENCIA_DOCUMENTO"
				   maxlength="18"
				   ng-model="data.oReferencia"
				   tipo-campo="'textarea'"
				   atributos="margin: 0px; height:23px;resize:none;width: 30%">
			   </bcs-input-texto>
			 </div>  
			</div>   	        	
		</div>

		<div class="row">
		 <div class="col-xs-11">	
		  <div class="col-xs-11">	 
			<label class="col-xs-2" translate>UI_COMENTARIO</label>
			<bcs-input-texto class="col-xs-10"
			    id="UI_COMENTARIO"
	           	maxlength="250"
				ng-model="data.oComentario"
				tipo-campo="'textarea'"
				atributos="margin: 0px; height:60px;resize:none;width: 100%">
	        </bcs-input-texto>
	      </div>  
	     </div>   	        	
		</div>
				
	  </div>	  
    </div>
  </div>  
  
  <!-- INICIO PANEL COMANDOS --> 	  
  <div class="row bcs-panel-comandos" style="margin-top:50px">
	<bcs-button  class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="'true'"  bcs-texto="'UI_GRABAR' | translate"  bcs-habilitado="true"  bcs-clic="data.modificarMovimientoComprobanteGral()"></bcs-button>
	<bcs-button  class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'true'"  bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="data.cancelar()"></bcs-button>				
						
	<!-- bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">		            
	   <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	   
    </bcs-menu-->
  </div>	
  <!-- FIN PANEL COMANDOS -->
</div>

<div class="row" ng-controller="ModificarMovimientoFormasDePagoModalCtrl">
  <div class="row bcs-cuerpo">	
	<div class="row">
	  <!-- INICIO -->
	  <div class="col-xs-12">
	    <div class="row">
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_MEDIOS_DE_PAGO</label>
			<bcs-input-texto class="col-xs-7" 
			   name="oMedioDePago"
		       ng-model="data.oMedioDePago" 		       
		       k-ng-disabled="data.activaroMedioDePago">
		    </bcs-input-texto>
		  </div>
		  
		  <div class="col-xs-4">
		    <label class="col-xs-4" translate>UI_MODALIDAD</label>
			<bcs-combobox-base class="col-xs-7"
			   id="UI_MODALIDAD_MEDIO_PAGO"
			   tipo="data.oModalidadMedPago.tipo"
			   seleccionado="data.oModalidadMedPago.seleccionado"
			   id-actual="data.oModalidadMedPago.idActual"
			   filtros="data.oModalidadMedPago.filtros"
			   id-post-filtro = "data.oModalidadMedPago.IdModalidadDePago" 
			   configuracion= "data.oModalidadMedPago.configuracion"
			   activado = "data.activaroModalidadMedPago">
			</bcs-combobox-base>
		  </div>
		  
		  <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_ESTADO</label>
	        <bcs-combobox-base class="col-xs-7"
	           id="UI_ESTADO_FORMA_PAGO"
			   tipo="data.oEstadoMovimientoFDePago.tipo"
			   seleccionado="data.oEstadoMovimientoFDePago.seleccionado"
			   id-actual="data.oEstadoMovimientoFDePago.idActual"
			   filtros="data.oEstadoMovimientoFDePago.filtros"
			   id-post-filtro = "data.oEstadoMovimientoFDePago.IdEstado"
			   configuracion= "data.oEstadoMovimientoFDePago.configuracion"
			   activado="data.activaroEstadoMovimientoFDePago">
			</bcs-combobox-base>	        
	      </div>		  
	    </div>
	    
	    <div class="row">
	      <div class="col-xs-4">	
			<label class="col-xs-4" translate>UI_MONTO</label>					
			<bcs-input-monetario class="col-xs-7" 
			   name="oMontoFDePago"
			   decimales = "data.decimalesoMontoFDePago"
			   simbolo="data.simbolooMontoFDePago"
			   k-ng-model="data.oMontoFDePago"
			   k-ng-disabled="data.activaroMontoFDePago">
			</bcs-input-monetario>
		  </div>
		  
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_CUENTA_BANCARIA</label>
	        <bcs-combobox-base class="col-xs-7"
	           id="UI_CTA_BANC_FORMA_PAGO"
			   tipo="data.oCuentaBancariaFDePago.tipo"
			   seleccionado="data.oCuentaBancariaFDePago.seleccionado"
			   id-actual="data.oCuentaBancariaFDePago.idActual"
			   filtros="data.oCuentaBancariaFDePago.filtros"			   
			   id-post-filtro = "data.oCuentaBancariaFDePago.IdCuentaBancaria" 
			   configuracion= "data.oCuentaBancariaFDePago.configuracion"
			   activado = "data.activaroCuentaBancariaFDePago">
			</bcs-combobox-base>
	      </div>
	      
	      <div class="col-xs-4">	    
	        <label class="col-xs-4" translate>UI_TIPO_CUENTA_BANCARIA_ABR</label>				
			<bcs-input-texto class="col-xs-7" 
	           name="oBancoFDePago"
	           ng-model="data.oTipoCuentaBancariaFDePago"
	           k-ng-disabled="data.activaroTipoCuentaBancariaFDePago">
	        </bcs-input-texto>
	      </div>
	    </div>	
	    
	    <div class="row">
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_BANCO</label>
			<bcs-input-texto class="col-xs-7" 
	           name="oBancoFDePago"
	           ng-model="data.oBancoFDePago"
	           k-ng-disabled="data.activaroBancoFDePago">
	        </bcs-input-texto>	        	        
	      </div>
	      
	      <div class="col-xs-4">
			<label class="col-xs-4" translate>UI_NUMERO_CUENTA_ABR</label>									
			<bcs-input-texto class="col-xs-7" 
			   name="oNumeroCuentaBancaria" 
			   ng-model="data.oNumeroCuentaBancaria"
			   k-ng-disabled="data.activaroNumeroCuentaBancaria">
			</bcs-input-texto>																	
		  </div>
		  
		  <div class="col-xs-4">
		    <label class="col-xs-4" translate>UI_MONEDA</label> 
			<bcs-input-texto class="col-xs-7" 
			   name="oMonedaFDePago" 
			   ng-model="data.oMonedaFDePago"
			   k-ng-disabled="data.activaroMonedaFDePago">
			</bcs-input-texto>						  
		  </div>		  
	    </div>
	    
	    <div class="row">
	      <div class="col-xs-4">
		    <label class="col-xs-4" translate>UI_NUMERO_SERIE</label> 
			<bcs-input-texto class="col-xs-7" 
			   name="oNumeroSerie" 
			   ng-model="data.oNumeroSerie"
			   k-ng-disabled="data.activaroNumeroSerie">
			</bcs-input-texto>						  
		  </div>
		  
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_NUMERO_DOCUMENTO_ABR</label>
	        <bcs-input-numero class="col-xs-7" 
	           name="oNumeroDocumento" 
	           k-ng-model="data.oNumeroDocumento"
	           k-ng-disabled="data.activaroNumeroDocumento"
	           formato = "'#'">
	        </bcs-input-numero>	        
	      </div>
	      
 
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_FECHA_DOCUMENTO</label>
	        <bcs-input-date class="col-xs-7"
	           name="oFechaDocumento" 
	           configuracion="data.oFechaDocumento" 
	           after-render="missionCompled" 
	           ng-model="data.oFechaDocumento" 
	           k-ng-model="data.oFechaDocumento"
	           k-ng-disabled="data.activaroFechaDocumento">
	        </bcs-input-date>
	      </div>
	    </div>   
	    
	    <div class="row">
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_TIPO_TARJETA_BANCARIA_ABR</label>
	        <bcs-combobox-base class="col-xs-7"
	           id="UI_TIP_TAR_BANC_FORMA_PAGO"
			   tipo="data.oTipoTarjBancariaFDePago.tipo"
			   seleccionado="data.oTipoTarjBancariaFDePago.seleccionado"
			   id-actual="data.oTipoTarjBancariaFDePago.idActual"
			   filtros="data.oTipoTarjBancariaFDePago.filtros" 
			   id-post-filtro = "data.oTipoTarjBancariaFDePago.IdTipoTarjetaBancaria"
			   configuracion= "data.oTipoTarjBancariaFDePago.configuracion"
			   activado="data.activaroTipoTarjBancariaFDePago">
			</bcs-combobox-base>
	      </div>
	      
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_NUMERO_TARJETA_ABR</label>
	        <bcs-input-texto class="col-xs-7" 
	           name="oNumeroTarjetaBancaria" 
	           ng-model="data.oNumeroTarjetaBancaria"
	           k-ng-disabled="data.activaroNumeroTarjetaBancaria">
	        </bcs-input-texto>	
	      </div>
	      
	      <div class="col-xs-4">
	        <label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO_TARJETA_ABR</label>
	        <bcs-input-date class="col-xs-7"
	           name="oFechaVencimientoTarjeta" 
	           configuracion="data.oFechaVencimientoTarjeta" 
	           after-render="missionCompled" 
	           ng-model="data.oFechaVencimientoTarjeta" 
	           k-ng-model="data.oFechaVencimientoTarjeta"
	           k-ng-disabled="data.activaroFechaVencimientoTarjeta">
	        </bcs-input-date>
	      </div>
	      
	      
	    </div>
	  </div>
	</div>
	
	<div class="row">
	  <br>	  
	  <div class="col-xs-12">
	    <bcs-grid 
	       id="grid-modificar-movimiento-formas-de-pago" 
	       configuracion = "confBasicaModificarMovimientoFormasDePago" 
	       seleccionado = "seleccionModificarMovimientoFormasDePago" 
	       api = "gridApiModificarMovimientoFormasDePago">
	    </bcs-grid>
	  </div>     
	</div>
  </div>
  
  <!-- INICIO PANEL COMANDOS --> 	  
  <div class="row bcs-panel-comandos" style="margin-top:10px">
	<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="'true'"  bcs-texto="'UI_GRABAR' | translate"  bcs-habilitado="true"  bcs-clic="data.modificarMovimientoComprobanteFormDePago()"></bcs-button>
	<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'true'"  bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="data.cancelar()"></bcs-button>				
						
	<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"  bcs-texto="'UI_OPCIONES' | translate">		            
	   <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	   
    </bcs-menu>
  </div>	
  <!-- FIN PANEL COMANDOS -->

</div>

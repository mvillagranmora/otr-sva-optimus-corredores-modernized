<div class="row" ng-controller="ModificarMovimientoCobroModalCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-12">
				<bcs-grid
					id="grid-modificar-movimiento-cobros"
					configuracion = "confBasicaModificarMovimientoCobros"
					seleccionado = "seleccionModificarMovimientoCobros"
					api = "gridApiModificarMovimientoCobros">
				</bcs-grid>
			</div>
		</div>
	</div>
	
	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos" style="margin-top:15px">
		<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="'true'"  bcs-texto="'UI_GRABAR' | translate"  bcs-habilitado="true"  bcs-clic="data.modificarMovimientoComprobanteCobro()"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'true'"  bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="data.cancelar()"></bcs-button>
		
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
	<!-- FIN PANEL COMANDOS -->
</div>

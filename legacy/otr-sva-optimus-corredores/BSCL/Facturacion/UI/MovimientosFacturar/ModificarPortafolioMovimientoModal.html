<div class="row" ng-controller='ModificarPortafolioMovimientoModalCtrl as bModifMvtoMod'>
  <div class="row no-margin">
    <div class="col-xs-12">
      <!-- DATOS BASICOS -->
	  <div class="row">
		 <div class="row k-window-subtitle">
		   <label class="col-xs-4" translate>UI_DATOS_BASICOS</label>																							
		 </div>
	  </div>
    </div>
    
    
	<div class="col-xs-12" style="margin-top:10px">
		<div class="col-xs-12">
			<strong class="col-xs-2" style="color: black;" translate>UI_CLIENTE</strong>
	        <label class="col-xs-10">{{bModifMvtoMod.infoPrincipalCliente.NombreLargoCliente}}</label>
		</div> 
    </div>	
    
	<div class="col-xs-12" style="margin-top:10px">
		<div class="col-xs-12">
        <label class="col-xs-2" translate>UI_PORTAFOLIO</label>
	    <bcs-combobox-base class="col-xs-10"
	       id="UI_PORTAFOLIO"
	       tipo="data.oPortafolio.tipo"
	       seleccionado="data.oPortafolio.seleccionado"
	       id-actual="data.oPortafolio.idActual"
	       filtros="data.oPortafolio.filtros"
	       id-post-filtro = "bModifMvtoMod.infoPrincipalCliente.IdPortafolio"
	       configuracion= "data.oPortafolio.configuracion">
	    </bcs-combobox-base>
	  </div> 
    </div>	
  </div>	
  
  
  <!-- INICIO PANEL COMANDOS --> 	  
  <div class="row bcs-panel-comandos" style="margin-top:50px">
	<bcs-button  class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="'true'"  bcs-texto="'UI_GRABAR' | translate"  bcs-habilitado="true"  bcs-clic="data.modificarMovimientoComprobanteGral()"></bcs-button>
	<bcs-button  class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'true'"  bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="data.cancelar()"></bcs-button>				
  </div>	
  <!-- FIN PANEL COMANDOS -->
</div>

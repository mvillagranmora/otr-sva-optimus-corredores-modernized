<div class="row" ng-controller='AnularMovimientosPorAsignacionMasivaModalCtrl'>
	<form id="anular-movimientos-por-asignacion-masiva-modal-form" name="anularMovimientosPorAsignacionMasivaForm"
		class="col-xs-12 form-horizontal">
		<div class="bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" for="id-asignacion-masiva" translate>UI_ID_ASIGNACION_MASIVA</label>
					<bcs-input-numero id="id-asignacion-masiva" name="idAsignacionMasiva" class="col-xs-8"
						ng-model="data.IdAsignacionMasiva" decimales="0">
					</bcs-input-numero>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-8" k-ng-model="data.fechaConsulta" k-ng-disabled="data.filtraPorAsignacionMasiva" ></bcs-input-date>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base class="col-xs-8" 
						todos = "'S'"
						activado = "!data.filtraPorAsignacionMasiva"
						item-post-filtro = "'1'"
						id-actual = "data.IdClasificacionTipoInstrumento"
						tipo="'combobox-clasificacion-tipo-instrumento'" 
						cascada1-a="filters.tipoInstrumento.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base >
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_OPERACION</label>
					<bcs-combobox-base class="col-xs-8" 
						todos = "'S'"
						activado = "!data.filtraPorAsignacionMasiva"
						item-post-filtro = "'1'"
						id-actual = "data.AccionOrden"
						tipo="'combobox-operacion'"
						filtros="filters.operacion">
					</bcs-combobox-base >
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
					<bcs-combobox-base 
						class="col-xs-8"
						activado = "!data.filtraPorAsignacionMasiva"
						item-post-filtro = "'1'"
						tipo="'combobox-libro-orden'"
						id-actual="data.IdLibroOrdenes"
						todos="'S'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_SECUENCIA_ORDEN</label>
					<bcs-input-numero class="col-xs-8" 
					ng-model="data.SecuenciaOrden" 
					k-ng-disabled="data.filtraPorAsignacionMasiva"
					decimales=0></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_HORA_DESDE</label>
				<bcs-input-time class="col-xs-8"
					k-ng-model = "data.horaDesde"
					k-ng-disabled="data.filtraPorAsignacionMasiva"
				>
				</bcs-input-time>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_HORA_HASTA</label>
				<bcs-input-time class="col-xs-8"
					k-ng-model = "data.horaHasta"
					k-ng-disabled="data.filtraPorAsignacionMasiva"
				>
				</bcs-input-time>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
				<bcs-combobox-base class="col-xs-8" 
					todos = "'S'"
					activado = "!data.filtraPorAsignacionMasiva"
					item-post-filtro = "'1'"
					id-actual = "data.IdTipoInstrumento"
					tipo="'combobox-tipo-instrumento'" >
				</bcs-combobox-base >
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CONDICION_LIQUIDACION</label>
				<bcs-combobox-base 
					 class="col-xs-8"
					 activado = "!data.filtraPorAsignacionMasiva"
					 item-post-filtro = "'1'"
					 tipo="'combobox-condicion-liquidacion'"
					 id-actual="data.IdCondicionDeLiquidacion"
					 todos="'S'">
				</bcs-combobox-base>
			</div>			
			<div class="row">
				<label class="col-xs-4" translate>UI_BOLSA</label>
				<bcs-combobox-base class="col-xs-8"
					todos = "'S'"
					activado = "!data.filtraPorAsignacionMasiva"
					item-post-filtro = "'1'"
					id-actual = "data.IdBolsa"
					tipo="'combobox-bolsa'">
				</bcs-combobox-base >
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_FOLIO_TRANSACCION</label>
				<bcs-input-numero class="col-xs-8" ng-model="data.FolioTransaccion" k-ng-disabled="data.filtraPorAsignacionMasiva" decimales="0"></bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
				<bcs-combobox-base class = "col-xs-8"		
					activado = "!data.filtraPorAsignacionMasiva"
					tipo = "'combobox-instrumento'"
					id-actual = "data.Instrumento"					
					todos = "'S'">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CANAL_INGRESO</label>
				<bcs-combobox-base class="col-xs-8"
					activado = "!data.filtraPorAsignacionMasiva"
					filtros = "datos.filtrosCanalIngreso"
					tipo="'combobox-tipo-canal-ingreso'"
					id-actual="data.IdTipoCanalIngreso"
					todos = "'S'"
					item-post-filtro = "'1'">
				</bcs-combobox-base >
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-combobox-base 
					class="col-xs-8" 
					todos="'N'" 
					item-post-filtro="'1'"
					activado="!data.filtraPorAsignacionMasiva"
					carga-cliente-automatico="'S'"  
					id-actual="data.IdPortafolio" 
					tipo="data.oClientePortafolio.tipo"
					seleccionado="data.oClientePortafolio.seleccionado">
				</bcs-combobox-base>
			</div>
			<div class="row">
					<label class="col-xs-4" translate>UI_MARCA_ASIGNACION</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.MarcaAsignacion" k-ng-disabled="data.filtraPorAsignacionMasiva" maxlength="25"></bcs-input-texto>
			</div>
		</div>
		<div class="row"></div>
		<hr>
		<div class="row">
			<div class="col-xs-12">
				<div class="row" style="display:flex; justify-content:center; gap:5px;">
					<div class="col-xs-10" style="display:flex; justify-content:center;">
						<bcs-button id="btn-aceptar-anulacion" bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'"
							bcs-clic="anularMovimientosPorAsignacionMasiva()" style="width:90%;">
						</bcs-button>
					</div>

					<div class="col-xs-10" style="display:flex; justify-content:center;">
						<bcs-button id="btn-informacion-anulacion" bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="false" bcs-texto="'UI_PREVISUALIZAR' | translate" bcs-habilitado="'true'"
							bcs-clic="buscarInformacionAnulaciones()" style="width:90%;">
						</bcs-button>
					</div>

					<div class="col-xs-10" style="display:flex; justify-content:center;">
						<bcs-button id="btn-cancelar-anulacion" bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'"
							bcs-clic="cancelar()" style="width:90%;">
						</bcs-button>
					</div>
				</div>
			</div>
		</div>
	</form>
</div>

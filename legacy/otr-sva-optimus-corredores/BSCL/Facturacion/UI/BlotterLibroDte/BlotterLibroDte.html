<div id="BlotterLibroDte" ng-controller='BlotterLibroDteCtrl'>

	<div class="col-xs-12">
	  <uib-tabset>
		 <uib-tab select="select('gridLibroDteComprobante')" heading="{{'UI_LIBRO_DTE_COMPROBANTE' | translate}}">
		    <div id="gridLibroDteComprobante" 
		         ng-include="'../../Facturacion/UI/BlotterLibroDte/LibroDteComprobante.html'">
			</div>
		 </uib-tab>
		 
		 <uib-tab select="select('gridLibroDte')" heading="{{'UI_LIBRO_DTE' | translate}}" ng-show = "SesionLocale === 'CL'">

			     ng-include="'../../Facturacion/UI/BlotterLibroDte/LibroDte.html'">

		 </uib-tab>

	</div>

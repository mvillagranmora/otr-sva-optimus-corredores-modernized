<div class="row">
	<label class="col-xs-4" translate>UI_SALDO_CUOTAS</label>
	<bcs-input-numero
		class="col-xs-8"
		decimales = "decimalesCantidad"
		simbolo= "''"
		k-options = " { min : -999999999999 } "
		k-ng-model= "saldoCuotas" 
		k-ng-disabled = "true">
	</bcs-input-numero>
</div>
<div class="row">
	<label class="col-xs-4" translate>UI_SALDO_MONTO</label>
	<bcs-input-monetario class="col-xs-8"
		k-ng-model="saldoMonto"
		decimales = "'2'"
		simbolo="idMoneda"
		k-ng-disabled="'true'">
	</bcs-input-monetario>
</div>

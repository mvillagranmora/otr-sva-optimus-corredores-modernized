<div class="col-xs-12" ng-controller="BlotterFondosMutuosModificarFechasCtrl">
	<div class="row bcs-cuerpo">
		<form name="FormModificarFecha" class="filters-formulario">
			<div class="row">
				<div class="col-xs-12">
				 	<div class="row">
				  		<div class="col-xs-3">
					  		<label class="col-xs-4" translate>UI_FECHA_CURSE</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_CURSE"
								k-ng-model="formData.datosDespues.FechaAceptacion"
								todo-dias = true>
							</bcs-input-date>
				  		</div>
				  		<div class="col-xs-3">
					  		<label class="col-xs-4 col-xs-offset-1" translate>UI_FECHA_VALOR_CUOTA</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_VALOR_CUOTA"
								k-ng-model="formData.datosDespues.FechaValorCuota"
								todo-dias = true>
							</bcs-input-date>
				  		</div>
						<div class="col-xs-3">
							<label class="col-xs-4 col-xs-offset-1" translate>UI_FECHA_CERTIFICACION</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_CERTIFICACION"
								k-ng-model="formData.datosDespues.FechaCertificacion"
								todo-dias = true>
							</bcs-input-date>
						</div> 
				  		<div class="col-xs-3">
							<label class="col-xs-4 col-xs-offset-1" translate>UI_FECHA_LIQUIDACION</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_LIQUIDACION"
								k-ng-model="formData.datosDespues.FechaLiquidacion"
								todo-dias = true>
							</bcs-input-date>
						</div>
				  	</div>
					<div class="row bcs-panel-comandos">
					  <bcs-button class="col-xs-2 pull-right" id="AgregarFechas_INGRESAR"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="true"
						bcs-texto="'UI_GRABAR_FECHAS' | translate" 
						bcs-habilitado="FormModificarFecha.$valid"
						bcs-clic="GrabarFechas()"> </bcs-button>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>

<div id="ExportarBatchFFM" ng-controller="ExportarBatchFFMCtrl">	
	<div class="row bcs-cuerpo">
		<form name="formExportarBatchFFM" class="col-xs-12 form-horizontal">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_FECHA_CURSE_DESDE</label>
					<bcs-input-date
						class				= "col-xs-6"
						id					= "UI_FECHA_OPERACION"
						k-ng-model			= "filtros.fechaDesde"
						bcs-requerido>
					</bcs-input-date>						
				</div>					
				<div class="col-xs-6">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_FECHA_CURSE_HASTA</label>
					<bcs-input-date
						class				= "col-xs-6"
						id					= "UI_FECHA_OPERACION2"
						k-ng-model			= "filtros.fechaHasta"
						bcs-requerido>
					</bcs-input-date>
				</div>
			</div>
			<div class="row"><br/></div>		
		</form>
	</div>
	
	
	<div class="row bcs-panel-comandos">	
		<bcs-button 
			class				= "col-xs-4 pull-right" 
			bcs-habilitado		= "'true'" 
			bcs-tipo			= "'bcs-button-primary'"
			bcs-auto-desactivar	= "false" 
			bcs-texto			= "'UI_EXPORTAR' | translate" 
			bcs-clic			= "exportar()">
		</bcs-button>
			
		<bcs-button 
			class				= "col-xs-4 pull-right" 
			bcs-habilitado		= "'true'" 
			bcs-tipo			= "'bcs-button-secondary'"
			bcs-auto-desactivar	= "false" 
			bcs-texto			= "'UI_CERRAR' | translate"
			 bcs-clic			= "cerrar()">
		</bcs-button>
	</div>	
</div>

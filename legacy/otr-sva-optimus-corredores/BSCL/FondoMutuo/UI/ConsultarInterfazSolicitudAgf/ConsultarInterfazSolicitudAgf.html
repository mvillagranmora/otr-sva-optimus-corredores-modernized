<div id="ConsultaInterfazSolicitudAgf" class="col-xs-12" ng-controller="ConsultaInterfazSolicitudAgfCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_INGRESO_DESDE</label>
					<bcs-input-date
						class="col-xs-6"
						id="UI_FECHA_INGRESO_DESDE"
						bcs-requerido
						k-ng-model="filtros.fechaIngresoDesde">
					</bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_FECHA_INGRESO_HASTA</label>
					<bcs-input-date class="col-xs-6"
						id="UI_FECHA_INGRESO_HASTA"
						bcs-requerido
						k-ng-model="filtros.fechaIngresoHasta"> 
					</bcs-input-date>
				</div>
				<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
			  		<bcs-combobox-buscador-fondos class="col-xs-6" 
						muestra-valor-cuota = "'N'"
						datos-fondo="filtros.FondoMutuo"
						buscar-fondo="formData.setFondo"
						id-ventana="winID">
					</bcs-combobox-buscador-fondos>
				</div>
		  	</div>
		  	<div class="row">
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_ESTADO</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-estado-interfaz-agf-ffmm'"
			  			id-actual="filtros.IdEstado"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
			  	<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_TIPO_REGISTRO</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-tipo-registro-carga-ffmm'"
			  			id-actual="filtros.TipoRegistro"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarSolicitudes(apiGridSolicitud,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-interfaz-solicitud-agf"
			 	configuracion="defaultOptions"
				api = "apiGridSolicitud"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="BlotterFFM_ingresarFFM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_REPROCESAR_SOLICITUD_ERROR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="reprocesar(datos.kNgModel)">
			</bcs-button>	
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div id="MantenedorValorTipoCambio" class="col-xs-12" ng-controller="MantenedorValorTipoCambioCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<bcs-grid 
				id="grid-ingreso-valor-tipo-cambio-fmm"
			 	configuracion="defaultOptions"
				api = "apiGridValorTipoCambio"
				seleccionado="datos.kNgModel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorValorTipoCambio_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR_ARCHIVO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="cargarArchivo()">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorValorTipoCambio_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_PROCESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="procesarTipoCambioFFMM()"
				ng-if="habilitaBotonProcesar">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_HISTORICO_TIPO_CAMBIO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="historicoTipoCambioFMM()">
			</bcs-button>
		</div>
	</div>
</div>

<div id="LogCertificarAporteRescateFFM" class="col-xs-12" ng-controller="LogCertificarAporteRescateFFMCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<label class="col-xs-2" translate>UI_FECHA_CERTIFICACION</label>
				<bcs-input-date class="col-xs-3"
					id="UI_CERTIFICACION"
					bcs-requerido
					k-ng-model="filtros.fechaCertificacion"> 
				</bcs-input-date>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
		  		<bcs-combobox-buscador-fondos class="col-xs-3" 
					muestra-valor-cuota = "'N'"
					datos-fondo="filtros.fondoMutuo"
					buscar-fondo="formData.setFondo"
					id-ventana="winID">
				</bcs-combobox-buscador-fondos> 
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_SIMULACION</label> 
			  	<bcs-combobox-base class="col-xs-3"
			  			tipo="'combobox-si-no'"
			  			id-actual="filtros.Simulacion"
			  			id-defecto="''" 
			  			todos="'S'">
			  	</bcs-combobox-base>
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarLogCertificacion()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-log-certificar-aporte-rescate"
			 	configuracion="defaultOptions"
			 	fn-doble-click="abrirDetalle(datos.kNgModel)"
				api = "apiGridSolicitud"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-1 col-xs-offset-9"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div id="ConfirmacionCertificarAporteRescateFFM" class="col-xs-12" ng-controller="ConfirmacionCertificarAporteRescateFFMCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
			  		<bcs-combobox-buscador-fondos class="col-xs-6" 
						muestra-valor-cuota = "'N'"
						datos-fondo="filtros.fondoMutuo"
						buscar-fondo="formData.setFondo"
						id-ventana="winID">
					</bcs-combobox-buscador-fondos>
				</div>
				<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_ESTADO</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-estado-certificacion-ffmm'"
			  			id-actual="filtros.IdEstado"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarCertificacion()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>		
		
		<div class="row">
			<new-bcs-grid
				id					= "grid-confirmacion-ffm"
				configuracion		= "defaultOptions"
				api					= "apiGridSolicitud"
				seleccionado		= "datos.kNgModel"
				fn-doble-click		="abrirDetalle(datos.kNgModel)"
				fn-exportar-excel	= "exportarExcel">
			</new-bcs-grid>
		</div>
		 
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-3 pull-right" id="Confirmar_CertificacionFFM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CONFIRMAR' | translate" 
				bcs-habilitado="habilitarBoton" 
				bcs-clic="confirmarCertificacionFFM()">
			</bcs-button>	
			<bcs-button class="col-xs-3 pull-right" id="Confirmar_CertificacionFFM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CONFIRMAR_BATCH' | translate" 
				bcs-habilitado="habilitarBoton" 
				bcs-clic="confirmarCertificacionBatchFFM()">
			</bcs-button>	
		</div>
	</div>
</div>

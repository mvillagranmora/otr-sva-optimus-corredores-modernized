<div class="col-xs-12" ng-controller="PagarAGFCtrl">
	<div class="row bcs-cuerpo">
		<form name="FormPagoAGF" class="filters-formulario">
			<div class="row">
				<div class="col-xs-10">
					<div class="row">
						<div class="col-xs-4">
							<label class="col-xs-4" translate>UI_EMISOR</label> 
					  		<bcs-combobox-base class="col-xs-6"
					  			tipo="'combobox-emisor'"
					  			id-actual="formData.filtros.IdEmisor"
					  			filtros="formData.filtrosEmisor"
					  			todos="'S'" 
					  			id-defecto="'0'">
					  		</bcs-combobox-base>
					  	</div>
				  		<div class="col-xs-4">
					  		<label class="col-xs-4 col-xs-offset-1" translate>UI_ESTADO</label>
					  		<bcs-combobox-base class="col-xs-6"
					  			tipo="'combobox-estado-liquidacion-ffmm'"
					  			id-actual="formData.filtros.IdEstado"
					  			id-defecto="'CRT'">
					  		</bcs-combobox-base>
						</div>
						<div class="col-xs-4">
							<label class="col-xs-4 col-xs-offset-1" translate>UI_FECHA_CERTIFICACION</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_CERTIFICACION"
								bcs-requerido
								k-ng-model="formData.filtros.FechaCertificacion"
								k-options="formData.fechaOptions">
							</bcs-input-date>
						</div> 
					</div> 		
				  	<div class="row"> 
				  		<div class="col-xs-4">
							<label class="col-xs-4" translate>UI_FECHA_LIQUIDACION</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_LIQUIDACION"
								bcs-requerido
								k-ng-model="formData.filtros.FechaLiquidacion"
								k-options="formData.fechaOptions">
							</bcs-input-date>
						</div>
						<div class="col-xs-4">
					  		<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
					  		<bcs-combobox-buscador-fondos class="col-xs-6" 
								muestra-valor-cuota = "'N'"
								datos-fondo="formData.filtros.FondoMutuo"
								buscar-fondo="formData.setFondo"
								id-ventana="winID">
							</bcs-combobox-buscador-fondos>
						</div>
						
						<div class="col-xs-4">
							<label class="col-xs-4 col-xs-offset-1" translate>UI_TIPO_SOLICITUD</label>
					  		<bcs-combobox-base class="col-xs-6"
					  			tipo="'combobox-operacion-ffmm'"
					  			id-actual="formData.filtros.TipoSolicitud"
					  			seleccionado="oOperacion.seleccionado"
					  			filtros="formData.filtrosTipoSolicitud"
					  			id-defecto="'APO'"
					  			bcs-requerido>
					  		</bcs-combobox-base>
						</div>
				  	</div>
				  	<div class="row">
				  		<div class="col-xs-4">
					  		<label class="col-xs-4" translate>UI_FECHA_CURSE</label>
							<bcs-input-date
								class="col-xs-6"
								id="UI_FECHA_CURSE"
								k-ng-model="formData.filtros.FechaCurse"
								k-options="formData.fechaOptions"
								bcs-requerido>
							</bcs-input-date>
				  		</div>
				  		<div class="col-xs-4">
							<label class="col-xs-4 col-xs-offset-1" translate>UI_FONDO</label> 
					  		<bcs-combobox-base class="col-xs-6"
					  			tipo="'combobox-fondo-ffmm'"
					  			id-actual="formData.filtros.IdFondo"
					  			filtros="formData.filtrosFondo"
					  			todos="'S'" 
					  			id-defecto="'0'">
					  		</bcs-combobox-base>
					  	</div>
					  	
				  	</div>
				</div>
				<div class="col-xs-2">
						<bcs-button
						  class					= "col-xs-12"
						  bcs-tipo				= "'bcs-button-search'"
						  bcs-auto-desactivar		= "false"
						  bcs-texto				= "'UI_BUSCAR' | translate"
						  bcs-habilitado			= "true"
						  bcs-clic				= "buscar(formData.filtros)">
					  </bcs-button>
					
				</div>
			</div>
		</form>
	</div>
	<div class="row">
		<new-bcs-grid
			id					= "grid-pago-agf-ffm"
			configuracion		= "defaultOptions"
			fn-doble-click		= "abrirDetalle(datos.kNgModel)"
			api					= "apiGridSolicitud"
			seleccionado		= "seleccionMovimientos">
		</new-bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>	
			<bcs-button class="col-xs-2 pull-right" id="BlotterFFM_ingresarFFM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_LIQUIDAR' | translate" 
				bcs-habilitado="true"
				bcs-clic="formData.pagarAGF()">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="BlotterFFM_ingresarFFM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false"
				bcs-habilitado="!(formData.filtros.IdEstado == 'ING' && oOperacion.seleccionado.CodigoConcepto == 'RES')" 
				bcs-texto="'UI_VER_CARTAS' | translate" 
				bcs-clic="formData.verCartas()">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="BlotterFFM_ingresarFFM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false"
				bcs-habilitado="!(formData.filtros.IdEstado == 'ING' && oOperacion.seleccionado.CodigoConcepto == 'RES')" 
				bcs-texto="'UI_INFORME_LIQUIDACION' | translate" 
				bcs-clic="formData.verInformeLiquidacion()">
			</bcs-button>
		</div>
	</div>
</div>

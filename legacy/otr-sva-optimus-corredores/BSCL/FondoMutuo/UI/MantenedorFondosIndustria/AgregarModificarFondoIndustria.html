<div id="AgregarModificarFondoIndustria" class="col-xs-12" ng-controller="AgregarModificarFondoIndustriaCtrl">
	<form name="frmFondoNominal" class="col-xs-12 form-horizontal">		
		<div class="col-xs-12 bcs-cuerpo">				
			<label class="col-xs-12" ><span>{{titulo}}<span></label>
			<br>
			<hr>		
			<div class="row col-xs-12">
				<label class="col-xs-5" translate>UI_RUN_FFMM</label>
				<bcs-input-texto id="rutFFMM" class="col-xs-7"
					ng-model="data.rutFFMM"
					k-ng-disabled ="parametrosEntrada.accion ==='MOD'?true:false"  
					bcs-requerido  ="'true'">
				</bcs-input-texto>				
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-5" translate>UI_NOMBRE_FFMM</label>
				<bcs-input-texto id="nombreFFMM" class="col-xs-7"
					ng-model="data.nombreFFMM"  
					bcs-requerido= "'true'">
				</bcs-input-texto>				
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-5" translate>UI_RUT_SOC_ADM_FFMM</label>
				<bcs-input-texto id="rutSociedadAdministradora" class="col-xs-7"
					ng-model="data.rutSociedadAdministradora"
					k-ng-disabled ="parametrosEntrada.accion ==='MOD'?true:false"     
					bcs-requerido= "'true'">
				</bcs-input-texto>				
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-5" translate>UI_SOCIEDAD_ADM_FFMM</label>
				<bcs-input-texto id="sociedadAdministradora" class="col-xs-7"
					ng-model="data.sociedadAdministradora"  
					bcs-requerido= "'true'">
				</bcs-input-texto>				
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-5" translate>UI_MONEDA</label>
				<bcs-combobox-base class="col-xs-7"
					tipo = "'combobox-moneda'"
					id-actual = "data.IdMoneda"
					filtros="data.cmbbxMoneda.filtros"
					auto-cargar="true"
					item-post-filtro="'1'"
					id-defecto="data.cmbbxMoneda.IdMonedaDefecto"
					todos="'N'"
					bcs-requerido= "'true'"
					seleccionado="data.cmbbxMoneda.MonedaSeleccionado">
			 	</bcs-combobox-base >
			</div>
		</div>
	</form>
	
	<div class="row">
		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="frmFondoNominal.$valid" bcs-clic="guardar()"></bcs-button>	
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
			
			</div>
		</div>
	</div>
</div>

<div id="MantenedorFondosIndustria" class="col-xs-12" ng-controller="MantenedorFondosIndustriaCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<div class="row"></div>
		<div class="row">			
			<new-bcs-grid 
				id="grid-fondos-industria"
		 		configuracion = "defaultOptions"
				seleccionado = "datos.seleccionFondosIndustria"
				api = "apiGridFondosIndustria"
				fn-exportar-excel = "exportarExcel">
			</new-bcs-grid>
		</div>
	</div>
	<div class="row">
		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="true" bcs-clic="agregarFondo()"></bcs-button>	
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="activaBotones" bcs-clic="modificarFondo()"></bcs-button>
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="activaBotones" bcs-clic="eliminarFondo()"></bcs-button>
			</div>
		</div>
	</div>
</div>

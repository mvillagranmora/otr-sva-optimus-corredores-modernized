<div id="ConsultaValorCuotaHistorico" class="col-xs-12" ng-controller="ConsultaValorCuotaHistoricoCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<label class="col-xs-2" translate>UI_EMISOR</label> 
		  		<bcs-combobox-base class="col-xs-2"
		  			tipo="'combobox-emisor'"
		  			id-actual="filtros.IdEmisor"
		  			filtros="formData.filtrosEmisor"
		  			todos="'S'" 
		  			id-defecto="'0'">
		  		</bcs-combobox-base>
				<label class="col-xs-2" translate>UI_FECHA_CARGA_DESDE</label>
				<bcs-input-date
					class="col-xs-2"
					id="UI_FECHA_OPERACION"
					bcs-requerido
					k-ng-model="filtros.fechaCargaDesde"
					todo-dias="'true'">
				</bcs-input-date>
				<label class="col-xs-2" translate>UI_FECHA_CARGA_HASTA</label>
				<bcs-input-date class="col-xs-2"
					id="UI_FECHA_OPERACION2"
					bcs-requerido
					k-ng-model="filtros.fechaCargaHasta"
					todo-dias="'true'"> 
				</bcs-input-date>
		  	</div>
		  	<div class="row"> 
		  		<label class="col-xs-2" translate>UI_INSTRUMENTO</label> 
		  		<bcs-combobox-buscador-fondos class="col-xs-2" 
					muestra-valor-cuota = "'N'"
					datos-fondo="filtros.FondoMutuo"
					buscar-fondo="formData.setFondo"
					id-ventana="winID">
				</bcs-combobox-buscador-fondos>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarValoresCuota(apiGridValoresCuota,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-valor-historico"
			 	configuracion="defaultOptions"
				api = "apiGridValoresCuota"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
	        </bcs-menu>
	    </div>
	</div>
</div>

<div class="col-xs-12" ng-controller="InformeRentabilidadFFMMExtranjeroCtrl">
	<div class="bcs-cuerpo">
		<div class="row">
			<form name="formCertificados" class="col-xs-12 form-horizontal">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-2" translate>UI_CLIENTE</label>
						<bcs-combobox-base class="col-xs-10" id="UI_CLIENTE" bcs-requerido="'true'" auto-cargar="'false'"
							carga-cliente-automatico="'N'" id-Actual="data.oSocioNegocio.idActual"
							tipo="'combobox-socio-negocio'" seleccionado="data.oSocioNegocio.seleccionado"
							configuracion="data.oSocioNegocio.configuracion" filtros="data.oSocioNegocio.filtros"
							cascada-a="data.oPortafolio.filtros.IdCliente" cascada-valor="'IdCliente'">
						</bcs-combobox-base>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-2" translate>UI_PERIODO_COMERCIAL</label>
						<bcs-input-date
							class="col-xs-10"
							k-Options="config.agnoComercial"
							k-ng-model="data.agnoComercial"
							bcs-requerido="'true'"
							todo-dias="'true'">
						</bcs-input-date>
					</div>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos" style="margin-top: 3rem">
		<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
			bcs-texto="'UI_GENERAR_CERTIFICADO' | translate" bcs-habilitado="$scope.data.oPortafolio.seleccionado.IdPortafolio!=0"
			bcs-clic="generarInformeRentabilidadFFMMExtranjeroUnitario()"></bcs-button>
		<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
					bcs-texto="'UI_GENERAR_LOTE_CERTIFICADOS' | translate" bcs-habilitado="true"
					bcs-clic="generarInformeRentabilidadFFMMExtranjeroMasivo()"></bcs-button>

	</div>
</div>

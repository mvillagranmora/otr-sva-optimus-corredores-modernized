<div id="LogAdministracionLiquidezFFM" class="col-xs-12" ng-controller="LogAdministracionLiquidezFFMCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_PROCESO</label>
					<bcs-input-date class="col-xs-8"
						id="UI_FECHA_PROCESO"
						bcs-requerido
						k-ng-model="filtros.fechaIngreso"> 
					</bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
			  		<bcs-combobox-buscador-fondos class="col-xs-6"
			  			id="UI_INSTRUMENTO" 
						muestra-valor-cuota = "'N'"
						datos-fondo="filtros.fondoMutuo"
						buscar-fondo="formData.setFondo"
						filtros="oFondos.filtros"
						filtros-combobox="oFondos.filtros"
						id-ventana="winID">
					</bcs-combobox-buscador-fondos>
				</div> 
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1"  translate>UI_MONEDA</label>
					<bcs-combobox-base 
						class="col-xs-6"
						id="UI_MONEDA"
						bcs-requerido
					 	auto-cargar="'true'"
					 	id-actual="filtros.IdMoneda"
					 	id-defecto="''"
					 	tipo="'combobox-moneda'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_CLIENTE</label>
			  		<bcs-combobox-base class="col-xs-8"
							id="UI_CLIENTE"
						 	auto-cargar="'false'"
						    tipo="'combobox-socio-negocio'"
						    seleccionado="oSocioNegocio.seleccionado"
						    filtros="oSocioNegocio.filtros"
							cascada-a="oPortafolio.filtros.IdCliente"
							cascada-valor="'IdCliente'"
							cascada1-a="filtros.IdCliente"
							cascada1-valor="'IdCliente'"
		                    cascada-defecto="'-1'"
		                    id-actual="oSocioNegocio.idActual"
						    configuracion= "oSocioNegocio.configuracion">
					</bcs-combobox-base>
			  	</div>
			  	<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_PORTAFOLIO</label> 
			  		<bcs-combobox-base class="col-xs-6"
							id="UI_PORTAFOLIO"
						 	auto-cargar="'false'"
						    tipo="'combobox-portafolio'"
						    seleccionado="oPortafolio.seleccionado"
						    filtros="oPortafolio.filtros"
		                    id-actual="filtros.IdPortafolio"
						    configuracion= "oPortafolio.configuracion"
					>
					</bcs-combobox-base >
				</div> 
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarLogAdministracionLiquidez()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-log-adm-liquidez-ffm"
			 	configuracion="defaultOptions"
			 	fn-doble-click="abrirDetalle(datos.kNgModel)"
				api = "apiGridLogAdmLiquidez"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-1 col-xs-offset-9"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div id="ModificarFondoAdministracionLiquidacion" class="col-xs-12" ng-controller="ModificarFondoAdministracionLiquidacionCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_MONEDA</label>
					<bcs-input-texto 
						class="col-xs-6"
						bcs-requerido
						ng-model="datosDespues.IdMoneda"
						k-ng-disabled="'true'"
					>
					</bcs-input-texto>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
			  		<bcs-combobox-buscador-fondos class="col-xs-6" 
						muestra-valor-cuota = "'N'"
						datos-fondo="formData.FondoMutuo"
						id-defecto="datosDespues.IdSerieFondo"
						buscar-fondo="formData.setFondo"
						filtros="oFondos.filtros"
						filtros-combobox="oFondos.filtros"
						id-ventana="winID">
					</bcs-combobox-buscador-fondos>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_MONTO_MINIMO</label> 
			  		<bcs-input-monetario class="col-xs-6"
						decimales = "formData.decimalesMonto"
						bcs-requerido
						k-ng-model="datosDespues.MontoMinimo"
						simbolo="datosDespues.IdMoneda">
					</bcs-input-monetario>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="true"  bcs-clic="guardar()"></bcs-button>
			</div>
	  	</div>
	</div>
	<hr>
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
			  		<bcs-combobox-base class="col-xs-6"
							id="UI_CLIENTE"
						 	auto-cargar="'false'"
						    tipo="'combobox-socio-negocio'"
						    seleccionado="oSocioNegocio.seleccionado"
						    filtros="oSocioNegocio.filtros"
							cascada-a="oPortafolio.filtros.IdCliente"
							cascada-valor="'IdCliente'"
							cascada1-a="filtros.IdCliente"
							cascada1-valor="'IdCliente'"
		                    cascada-defecto="'-1'"
		                    id-actual="oSocioNegocio.idActual"
						    configuracion= "oSocioNegocio.configuracion">
					</bcs-combobox-base>
			  	</div>
			  	<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_PORTAFOLIO</label> 
			  		<bcs-combobox-base class="col-xs-6"
							id="UI_PORTAFOLIO"
						 	auto-cargar="'false'"
						    tipo="'combobox-portafolio'"
						    seleccionado="oPortafolio.seleccionado"
						    filtros="oPortafolio.filtros"
		                    id-actual="filtros.IdPortafolio"
						    configuracion= "oPortafolio.configuracion"
					>
					</bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
			  		<bcs-combobox-buscador-fondos class="col-xs-6" 
						muestra-valor-cuota = "'N'"
						datos-fondo="formData.datosFondoPortafolio"
						buscar-fondo="formData.setFondoPortafolio"
						filtros="oFondos.filtros"
						filtros-combobox="oFondos.filtros"
						id-ventana="winID">
					</bcs-combobox-buscador-fondos>
				</div>
		</div>
		<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_MONTO_MINIMO</label> 
			  		<bcs-input-monetario class="col-xs-6"
						decimales = "formData.decimalesMonto"
						bcs-requerido
						k-ng-model="formData.MontoMinimoPortafolio"
						simbolo="datosDespues.IdMoneda">
					</bcs-input-monetario>
				</div>
		</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="true"  bcs-clic="guardarPortafolio()"></bcs-button>
			</div>
	  	</div>
	</div>
	</div>
	<div class="row">
		<bcs-grid 
			id="grid-consulta-administracion-liquidez-ffm"
		 	configuracion="defaultOptions"
		 	fn-doble-click="abrirDetalle(datos.kNgModel)"
			api = "apiGridConsultaAdministracionLiquidez"
			seleccionado="datos.kNgModel"
			fn-exportar-excel = "exportarExcel">		
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="ModificarFondoAdministracionLiquidacion_eliminarPortafolioAdministracionLiquidez" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ELIMINAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="eliminarPortafolioAdministracionLiquidez(datos.kNgModel)">
			</bcs-button>	
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

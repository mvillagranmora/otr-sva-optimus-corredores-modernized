<div id="ModificarFondoAdministracionLiquidacion" class="col-xs-12" ng-controller="ModificarFondoAdministracionLiquidacionGenericoCtrl">
	<div class="row bcs-cuerpo">
	   	<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_MONEDA</label>
						<bcs-input-texto 
							class="col-xs-6"
							bcs-requerido
							ng-model="datosDespues.IdMoneda"
							k-ng-disabled="'true'"
						>
						</bcs-input-texto>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
				  		<bcs-combobox-buscador-fondos class="col-xs-6" 
							muestra-valor-cuota = "'N'"
							datos-fondo="formData.FondoMutuo"
							id-defecto="datosDespues.IdSerieFondo"
							buscar-fondo="formData.setFondo"
							filtros="oFondos.filtros"
							filtros-combobox="oFondos.filtros"
							id-ventana="winID">
						</bcs-combobox-buscador-fondos>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-4 col-xs-offset-1" translate>UI_MONTO_MINIMO</label> 
				  		<bcs-input-monetario class="col-xs-6"
							decimales = "formData.decimalesMonto"
							bcs-requerido
							k-ng-model="datosDespues.MontoMinimo"
							simbolo="datosDespues.IdMoneda">
						</bcs-input-monetario>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-4 col-xs-offset-1" translate>UI_HORA</label> 
				  		<bcs-input-time 
							class="col-xs-6" 
							ng-model="datosDespues.HoraCierreLiquidezComercial" >
						</bcs-input-time>
					</div>
			  	</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-input-form'"  bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="true"  bcs-clic="guardar()"></bcs-button>
				</div>
		  	</div>
		</div>
	</div>
</div>

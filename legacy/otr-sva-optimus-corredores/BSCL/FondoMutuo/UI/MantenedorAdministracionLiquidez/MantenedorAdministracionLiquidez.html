<div id="MantenedorAdministracionLiquidez" class="col-xs-12" ng-controller="MantenedorAdministracionLiquidezCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<bcs-grid 
				id="grid-administracion-liquidez-ffm"
			 	configuracion="defaultOptions"
			 	fn-doble-click="modificarInstrumentoAdministracionLiquidez(datos.kNgModel)"
				api = "apiGridAdministracionLiquidacion"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="MantenedorAdministracionLiquidez_modificar" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR_GENERICO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="modificarInstrumentoAdministracionLiquidezGenerico(datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorAdministracionLiquidez_modificar" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CONSULTA' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="consultaAdministracionLiquidezGenerico(datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorAdministracionLiquidez_verLog" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_LOG_ADMINISTRACION_LIQUIDEZ' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="verLogAdministracionLiquidez()">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"  bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

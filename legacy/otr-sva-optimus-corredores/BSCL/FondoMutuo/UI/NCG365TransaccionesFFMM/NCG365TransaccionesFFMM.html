<div class="col-xs-12" ng-controller="NCG365TransaccionesFFMMCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form name="formCertificados" class="col-xs-12 form-horizontal">
	            <div class="row"> 
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_CLIENTE</label>
						<bcs-combobox-base class="col-xs-8"
							id="UI_CLIENTE"
							bcs-requerido = "'true'"
							auto-cargar="'false'"
							carga-cliente-automatico="'S'"
							id-Actual="data.oSocioNegocio.idActual"						
							tipo="'combobox-socio-negocio'"
							seleccionado="data.oSocioNegocio.seleccionado"
							configuracion= "data.oSocioNegocio.configuracion"
							filtros="data.oSocioNegocio.filtros"
							cascada-a			="data.oPortafolio.filtros.IdCliente"
							cascada-valor		="'IdCliente'"
							>
						</bcs-combobox-base >
					

					
						
					</div>
					
	            </div>
					<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
								<bcs-combobox-base 
									class				="col-xs-8"
									id					="UI_PORTAFOLIO"
								 	auto-cargar			="'false'"
								 	bcs-requerido
								    tipo				="'combobox-portafolio'"
								    seleccionado		="data.oPortafolio.seleccionado"
								    filtros				="data.oPortafolio.filtros"
				                    item-post-filtro	="'1'"
				                    id-actual			="data.oPortafolio.idActual"
								    configuracion		="data.oPortafolio.configuracion">
								</bcs-combobox-base>
							</div>
						</div>
					
						            
	            <div class="row">
	            	<div class="col-xs-12">
		            	<label class="col-xs-4" translate>UI_FECHA</label>
						<bcs-input-date class="col-xs-8 " bcs-requerido="'true'"
							k-ng-model = "data.fechahasta" k-Options="data.fechahastaOptions">
						</bcs-input-date>
					</div>
	            </div>
			</form>
		</div>
		<hr>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right"  bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_IMPRIMIR' | translate" bcs-habilitado="$scope.data.oPortafolio.seleccionado.IdPortafolio!=0" bcs-clic="VerCarta()"></bcs-button>
					
	</div>
</div>

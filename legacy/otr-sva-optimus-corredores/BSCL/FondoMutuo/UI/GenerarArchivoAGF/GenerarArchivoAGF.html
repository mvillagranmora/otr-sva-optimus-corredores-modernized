<div id="GenerarArchivoAGFFFM" class="col-xs-12" ng-controller="GenerarArchivoAGFFFMCtrl">
	<div class="row bcs-cuerpo">
	   	<div class="row">
	   	<form name="FormGenerarArchivoAGF" class="filters-formulario">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_INDICADOR</label>
						<bcs-combobox-base class="col-xs-8"
							id="UI_INDICADOR"
						 	bcs-requerido
						    tipo="'combobox-indicador-archivo-agf'"
						    seleccionado="formData.oIndicador.seleccionado"
		                    item-post-filtro="'1'"
		                    id-actual="formData.oIndicador.idActual"
		                    id-defecto="formData.oIndicador.idDefecto">
						</bcs-combobox-base>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
						<bcs-input-date
							class="col-xs-8"
							id="UI_FECHA_OPERACION"
							bcs-requerido
							k-ng-model="formData.fechaDesde">
						</bcs-input-date>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
						<bcs-input-date class="col-xs-8"
							id="UI_FECHA_OPERACION2"
							bcs-requerido
							k-ng-model="formData.fechaHasta"> 
						</bcs-input-date>
					</div>
				</div>
			</div>
		</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-4" id="GenerarArchivoAGF_generarFFM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_GENERAR' | translate" 
				bcs-habilitado="FormGenerarArchivoAGF.$valid" 
				bcs-clic="generarArchivo()">
			</bcs-button>
		</div>
	</div>
</div>

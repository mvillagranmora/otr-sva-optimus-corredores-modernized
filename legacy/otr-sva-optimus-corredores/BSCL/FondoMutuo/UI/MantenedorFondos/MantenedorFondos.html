<div id="MantenedorFondos" class="col-xs-12" ng-controller="MantenedorFondosCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_EMISOR</label> 
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-emisor'"
			  			id-actual="filtros.IdEmisor"
			  			filtros="formData.filtrosEmisor"
			  			todos="'S'" 
			  			id-defecto="'0'">
			  		</bcs-combobox-base>
			  	</div>
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_ESTADO</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-estado-instrumento-ffmm'"
			  			id-actual="filtros.IdEstadoFondo"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-tipo-instrumento'"
			  			id-actual="filtros.IdTipoInstrumento"
			  			id-defecto="'0'"
			  			filtros="formData.filtrosTipoInstrumento" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
		  	</div>
		  	<div class="row"> 
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_INSTRUMENTO</label> 
			  		<bcs-combobox-buscador-fondos class="col-xs-6" 
						muestra-valor-cuota = "'N'"
						datos-fondo="filtros.FondoMutuo"
						buscar-fondo="formData.setFondo"
						id-ventana="winID">
					</bcs-combobox-buscador-fondos>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarInstrumentosFMM(apiGridInstrumentos,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<new-bcs-grid 
				id="grid-consulta-instrumentos-fmm"
			 	configuracion="defaultOptions"
			 	fn-doble-click="modificarInstrumentoFMM(datos.kNgModel,'N')"
				api = "apiGridInstrumentos"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</new-bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_INGRESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ingresarInstrumentoFMM()">
			</bcs-button>	
			<bcs-button class="col-xs-2" id="MantenedorFondos_ModificarInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="datos.kNgModel" 
				bcs-clic="modificarInstrumentoFMM(datos.kNgModel,'S')">
			</bcs-button>	
			<bcs-button class="col-xs-2" id="MantenedorFondos_ComisionesInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_COMISIONES' | translate" 
				bcs-habilitado="datos.kNgModel" 
				bcs-clic="comisionesFMM(datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorFondos_ValorCuotaInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_VALOR_CUOTA' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="indicadoresFMM()">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorFondos_TipoCambioInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_TIPO_CAMBIO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="tipoCambioFMM()">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" bcs-tipo="'bcs-button-secondary'" >
	            <li id="MantenedorFondos_MantenedorFamiliasFMM" ng-click="mantenedorFamiliasFFM()">{{'UI_MANTENEDOR_FAMILIAS' | translate}}</li>
	            <li id="MantenedorFondos_AdministracionLiquidezFMM" ng-click="administracionLiquidezFMM()">{{'UI_ADMINISTRACION_LIQUIDEZ' | translate}}</li>
	            <li id="MantenedorFondos_MangenedorRegimenFMM"  ng-click="mantenedorRegimen()">{{'UI_MANTENEDOR_REGIMEN_FONDO_MUTUO' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div class="col-xs-12" ng-controller="IngresarFFMCtrl">
	<!-- Pre-Ingreso -->
	<div class="row bcs-cuerpo" ng-show="formData.IngresoConfirmacion === 'I'">
	 <div ng-show="formData.DatosAdicionales === 'N'">	
	 	<form name="FormIngresoFFM" class="filters-formulario">
		   	<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<label class="col-xs-4" translate>UI_OPERACION</label>
				  		<bcs-combobox-base class="col-xs-8"
				  			tipo="'combobox-tipo-operacion-ffmm'"
				  			id-actual="formData.tipoOperacion"
				  			seleccionado="oOperacion.seleccionado"
				  			filtros="formData.filtrosFondosMutuos"
				  			cascada-a="formData.filtrosFormaPago.IdTipoOperacion"
				  			cascada-valor="'IdTipoOperacion'"
				  			cascada-defecto="'-1'"
				  			todos="'N'" 
				  			bcs-requerido
				  		 	foco = "formData.focoOperacion">
				  		</bcs-combobox-base> 
				  	</div>
				  	<hr>
				  	<div class="row">
						<label class="col-xs-4" translate>UI_CLIENTE</label>
						<bcs-combobox-base class="col-xs-8"
							id="UI_CLIENTE"
						 	auto-cargar="'false'"
						 	bcs-requerido
						    tipo="'combobox-socio-negocio'"
						    carga-cliente-automatico="'S'"
						    seleccionado="oSocioNegocio.seleccionado"
						    filtros="oSocioNegocio.filtros"
							cascada-a="oPortafolio.filtros.IdCliente"
							cascada-valor="'IdCliente'"
		                    cascada1-a="formData.FiltrosBusquedaFondo.IdCategoriaPerfilFondoMutuo"
		                    cascada1-valor="'IdCategoriaInversionista'"
		                    cascada-defecto="'-1'"
		                    id-actual="oSocioNegocio.idActual"
						    configuracion= "oSocioNegocio.configuracion">
						</bcs-combobox-base>
					</div>      
		 			<div class="row">
						<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-8"
							id="UI_PORTAFOLIO"
						 	auto-cargar="'false'"
						 	bcs-requerido
						    tipo="'combobox-portafolio'"
						    seleccionado="oPortafolio.seleccionado"
						    filtros="oPortafolio.filtros"
		                    item-post-filtro="'1'"
		                    id-actual="oPortafolio.idActual"
		                    cascada-a="formData.filtrosFormaPago.IdPortafolio"
		                    cascada-valor="'IdPortafolio'"
						    configuracion= "oPortafolio.configuracion">
						</bcs-combobox-base >
					</div>
				  	<hr>
				  	<bcs-combobox-buscador-fondos-custodia
							datos-fondo="datosFondo" 
							muestra-valor-cuota = "'S'"
							buscar-fondo="formData.setFondo"
							id-ventana="winID"
							muestra-detalle="'S'"
							es-detalle="'S'"
							mas-informacion="masInformacion"
							filtros="formData.FiltrosBusquedaFondo">
					</bcs-combobox-buscador-fondos-custodia>
			  		<hr>
			  		<div ng-show="formData.AporteRescate === 'A'">
			  			<div class="row" ng-show="datosFondo.Diferido && oPortafolio.seleccionado && oPortafolio.seleccionado.IdPortafolio">
					  		<label class="col-xs-4" translate>UI_MONEDA_APORTE</label>
					  		<bcs-combobox-base 
								class="col-xs-3"
								id="UI_MONEDA"
								bcs-requerido="datosFondo.Diferido === 'S'"
							 	auto-cargar="'true'"
							 	id-actual="formData.IdMonedaAporte"
							 	id-defecto="datosFondo.IdMoneda"
							 	filtros="formData.filtrosFormaPago.IdPortafolio"
							 	tipo="'combobox-moneda-cuenta-inversion-ffmm'"
							 	ng-show="datosFondo.Diferido === 'S'"
							 	usa-filtros-completos   = "'S'">
							</bcs-combobox-base>
						 	<bcs-input-texto class="col-xs-3"
						 		k-ng-disabled="'true'"
						 		ng-model="formData.IdMonedaAporte"
						 		ng-show="datosFondo.Diferido === 'N'"
						 	>
						 	</bcs-input-texto>
						 	<label class="col-xs-2" translate>UI_DOLAR_OBSERVADO</label>
					  		<bcs-input-monetario class="col-xs-3"
					  			k-ng-model="formData.dolarObservado"
								simbolo="'USD'"
								k-ng-disabled="'true'">
					  		</bcs-input-monetario>
				  		</div>
					  	<div class="row">
						  	<label class="col-xs-4" translate>UI_MONTO_INICIAL</label> 
					  		<bcs-input-monetario class="col-xs-8"
					  			k-ng-model="formData.montoInicial"
					  			decimales = "formData.DecimalesFondo"
					  			bcs-requerido
								simbolo="datosFondo.IdMoneda">
					  		</bcs-input-monetario>
				  		</div>
				  		<div class="row">
						  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
					  		<bcs-input-numero class="col-xs-8"
								decimales = "formData.decimalesCantidad"
								bcs-requerido
								k-ng-model="formData.numeroCuotas"
								k-ng-disabled="'true'">
							</bcs-input-numero> 
				  		</div>
				  		<div class="row">
						  	<label class="col-xs-4" translate>UI_FECHA_APORTE</label> 
					  		<bcs-input-date
								class="col-xs-8"
								k-ng-model="formData.fechaAporte" 
								bcs-requerido
								k-options="data.fechaOperacionOptions"
								k-ng-disabled="'true'">
							</bcs-input-date>
				  		</div>
					  	<div class="row">
						  	<label class="col-xs-4" translate>UI_GLOSA</label> 
					  		<bcs-input-texto class="col-xs-8"
						  		maxlength="100"
								tipo-campo="'textarea'"
								ng-model="formData.comentario"
								atributos="margin: 0px; height:73px;resize:none;width: 100%">
					  		</bcs-input-texto>
				  		</div>	  	
				  	</div>
				  	
				  	<div ng-show="formData.AporteRescate === 'R'">
						<div class="row">
						  	<label class="col-xs-4" translate>UI_SALDO_CUOTAS</label> 
					  		<bcs-input-monetario class="col-xs-8"
					  			k-ng-model="formData.SaldoCuotas"
					  			decimales = "formData.DecimalesFondo"
								simbolo="datosFondo.IdMoneda"
								k-ng-disabled="'true'">
					  		</bcs-input-monetario>
				  		</div>
				  		<div class="row">
						  	<label class="col-xs-4" translate>UI_SALDO_MONTO</label> 
					  		<bcs-input-monetario class="col-xs-8"
					  			k-ng-model="formData.SaldoMonto"
					  			decimales = "formData.DecimalesFondo"
								simbolo="datosFondo.IdMoneda"
								k-ng-disabled="'true'">
					  		</bcs-input-monetario>
				  		</div>
				  		<hr>
					  	<div class="row">
						  	<label class="col-xs-4" translate>UI_FECHA_RESCATE</label> 
					  		<bcs-input-date
								class="col-xs-8"
								k-ng-model="formData.fechaAporte" 
								bcs-requerido
								k-options="data.fechaOperacionOptions"
								k-ng-disabled="'true'">
							</bcs-input-date>
				  		</div>
				  		<div class="row">
							<label class="col-xs-4" translate>UI_TIPO_RESCATE</label>
						  		<bcs-combobox-base class="col-xs-8"
						  			tipo="'combobox-tipo-rescate-ffmm'"
						  			id-actual="formData.TipoRescate"
						  			id-defecto="'M'">
						  		</bcs-combobox-base>
					  		</bcs-combobox-base> 
					  	</div>
					  	<div class="row">
						  	<label class="col-xs-4" translate>UI_MONTO_RESCATE</label> 
					  		<bcs-input-monetario class="col-xs-8"
					  			k-ng-model="formData.montoInicial"
					  			decimales = "formData.DecimalesFondo"
					  			bcs-requerido
					  			k-ng-disabled="formData.TipoRescate === 'C' || formData.TipoRescate === 'T'"
								simbolo="datosFondo.IdMoneda">
					  		</bcs-input-monetario>
				  		</div>
				  		<div class="row">
						  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
					  		<bcs-input-numero class="col-xs-8"
								decimales = "formData.decimalesCantidad"
								bcs-requerido
								k-ng-model="formData.numeroCuotas"
								k-ng-disabled="formData.TipoRescate === 'M' || formData.TipoRescate === 'T'">
							</bcs-input-numero> 
				  		</div>
				  		<div class="row">
						  	<label class="col-xs-4" translate>UI_MONTO_COMISIONES</label> 
					  		<bcs-input-monetario class="col-xs-8"
					  			k-ng-model="formData.montoComisiones"
					  			decimales = "formData.DecimalesFondo"
					  			bcs-requerido = "formData.AporteRescate === 'R'"
								simbolo="datosFondo.IdMoneda">
					  		</bcs-input-monetario>
				  		</div>
					  	<div class="row">
						  	<label class="col-xs-4" translate>UI_GLOSA</label> 
					  		<bcs-input-texto class="col-xs-8"
						  		maxlength="100"
								tipo-campo="'textarea'"
								ng-model="formData.comentario"
								atributos="margin: 0px; height:73px;resize:none;width: 100%">
					  		</bcs-input-texto>
				  		</div>  	
				  	</div>
				  	
				</div>
			</div>
			
			</form>
        
			<div class="row bcs-panel-comandos">
				<div class=col-xs-12>
					<bcs-button class="col-xs-4" id="BlotterFFM_ingresarFFM" 
						bcs-texto="'UI_INGRESAR' | translate" 
						bcs-habilitado="FormIngresoFFM.$valid"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="true"
						bcs-clic="formData.ingresarAporteRescate()">
					</bcs-button>	
					<bcs-button class="col-xs-4" id="BlotterFFM_ingresarFFM"
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="limpiarFMM()"
						bcs-blur="formData.resetFoco()">
					</bcs-button>
				</div>
				<div class="col-xs-4">
					<bcs-button class="col-xs-7 pull-right" id="BlotterFFM_ingresarFFM"
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_MAS_DATOS' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="formData.masDatos()">
					</bcs-button>
				</div>
			</div>
		</div>
		<div ng-show="formData.DatosAdicionales === 'S'">
			<div class="row">
				<label class="col-xs-4" translate>UI_INSTRUCCION_COBRO</label>
			</div>
			<hr> 
			<div class="row">
			  	<label class="col-xs-4" translate>UI_MONTO_RESCATE</label> 
		  		<bcs-input-monetario class="col-xs-8"
		  			k-ng-model="formData.montoInicial"
		  			decimales = "formData.DecimalesFondo"
		  			k-ng-disabled="'true'"
					simbolo="datosFondo.IdMoneda">
		  		</bcs-input-monetario>
	  		</div>
	  		<div class="row"> 
		  		<bcs-forma-pago class="col-xs-12"
		  			seleccionado="oFormaPago.seleccionado"
		  			id-seleccionado="formData.IdFormaPago"
		  			id-portafolio="formData.filtrosFormaPago.IdPortafolio.value"
                  	id-tipo-operacion="formData.filtrosFormaPago.IdTipoOperacion.value" >
		  		</bcs-forma-pago>
	  		</div>
	  		
	  		<div class="row bcs-panel-comandos">
				<div class="col-xs-8"></div>
				<div class="col-xs-4">
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM" 
						bcs-texto="'UI_VOLVER' | translate" 
						bcs-tipo="'principal'" 
						bcs-habilitado="'true'" 
						bcs-auto-desactivar="false" 
						bcs-clic="formData.masDatos()">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
	<!-- Solicitud Ingresada -->
	<div class="row bcs-cuerpo" ng-show="formData.IngresoConfirmacion === 'C'">
		<div class="row">
			<div class="col-xs-12">
			    <div class="row" ng-show="true">
				  	<label class="col-xs-4" translate>UI_SECUENCIA_OPERACION</label> 
			  		<bcs-input-texto class="col-xs-8" ng-model="formData.ResultadoSolicitudAporteRescate.SecuenciaOperacion" k-ng-disabled="'true'"></bcs-input-texto>
		  		</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_OPERACION</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="oOperacion.seleccionado.Descripcion"
			  			k-ng-disabled="'true'"
			  		> 
			  	</div>
			  	<hr>
			  	<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="oSocioNegocio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>      
	 			<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="oPortafolio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>
			  	<hr>
			  	<div class="row">
			  	    <label class="col-xs-4" translate>UI_FONDO_MUTUO</label>
				  	<bcs-input-texto class="col-xs-8"
			  			ng-model="datosFondo.IdSerieFondo"
			  			k-ng-disabled="'true'"
			  		>
		  		</div>
		  		
		  		<div class="row">
					<span class="col-xs-6">
						<label class="col-xs-8 k-window-subtitle" translate>UI_MAS_INFORMACION&nbsp;&nbsp;</label>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="!ingresoFFM.muestraDetalle" ng-click="ingresoFFM.muestraDetalle = !ingresoFFM.muestraDetalle;ajustaVentana()">({{'+' | translate}})</em>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="ingresoFFM.muestraDetalle" ng-click="ingresoFFM.muestraDetalle = !ingresoFFM.muestraDetalle;ajustaVentana()">({{'-' | translate}})</em>
					</span>
				</div>
				<div class="row" ng-show="ingresoFFM.muestraDetalle">
					<div class="row">
					  	<label class="col-xs-3" translate>UI_TIPO_FONDO</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.NombreCorto}}</label>
				  		<label class="col-xs-3" translate>UI_PERFIL</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.IdCategoriaPerfilFondoMutuo}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_REGIMEN_TRIBUTARIO</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.IdRegimenTributario}}</label>
				  		<label class="col-xs-3" translate>UI_PROPOSITO_SERIE</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.PropositoSerie}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_ENTRADA</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.EsComisionEntradaUI}}</label>
				  		<label class="col-xs-3" translate>UI_MINIMO_PATRIMONIO</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.EsPatrimonioMinimoUI}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_SALIDA</label> 
				  		<label class="col-xs-3" translate>{{datosFondo.EsComisionSalidaUI}}</label>
		  			</div>
				</div>
		  		<hr>
		  		<div class="row">
			  		<label class="col-xs-4" translate>UI_MONEDA_APORTE</label>
				 	<bcs-input-texto class="col-xs-3"
				 		k-ng-disabled="'true'"
				 		ng-model="formData.IdMonedaAporte">
				 	</bcs-input-texto>
				 	<label class="col-xs-2" translate>UI_DOLAR_OBSERVADO</label>
			  		<bcs-input-monetario class="col-xs-3"
			  			k-ng-model="formData.dolarObservado"
						simbolo="'USD'"
						k-ng-disabled="'true'">
			  		</bcs-input-monetario>
		  		</div>  		
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_MONTO_INICIAL</label> 
			  		<bcs-input-monetario class="col-xs-8"
			  			k-ng-model="formData.ResultadoSolicitudAporteRescate.MontoInicial"
			  			decimales = "formData.DecimalesFondo"
			  			k-ng-disabled="'true'"
			  			simbolo="datosFondo.IdMoneda"
			  		>
			  		</bcs-input-monetario>
		  		</div>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
			  		<bcs-input-texto class="col-xs-8"
			  			ng-model="formData.ResultadoSolicitudAporteRescate.NumeroCuotas"
			  			k-ng-disabled="'true'"	
			  		>
			  		</bcs-input-texto>
		  		</div>
				<div class="row">
				  	<label class="col-xs-4" translate>UI_FECHA_APORTE</label>
				  	<bcs-input-texto class="col-xs-8"
			  			ng-model="formData.ResultadoSolicitudAporteRescate.FechaAporte"
			  			k-ng-disabled="'true'">
			  		</bcs-input-texto>
		  		</div>
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_GLOSA</label> 
			  		<bcs-input-texto class="col-xs-8"
				  		maxlength="260"
						tipo-campo="'textarea'"
						ng-model="formData.comentario"
						atributos="margin: 0px; height:73px;resize:none;width: 100%"
						k-ng-disabled="'true'"	
					>
			  		</bcs-input-texto>
		  		</div>
		  		<!--  <div class="row" ng-show="formData.visibleTruco">
			  		<bcs-input-texto 
			  			class="col-xs-8"
						ng-model = "formData.truco"
						foco = "formData.focoTruco">
			  		</bcs-input-texto>
		  		</div>-->
			</div>
		</div>
		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
				<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_VOLVER' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="limpiarFMM('true')"
					foco = "formData.focoVolver">
				</bcs-button>	
				<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
					bcs-tipo="'bcs-button-secondary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_VER_COMPROBANTE' | translate" 
					bcs-habilitado="'true'" 
					bcs-blur="formData.resetFoco()"
					bcs-clic="verComprobante()"
					foco = "formData.focoComprobante">
				</bcs-button>
			</div>
		</div>
	</div>
	
</div>

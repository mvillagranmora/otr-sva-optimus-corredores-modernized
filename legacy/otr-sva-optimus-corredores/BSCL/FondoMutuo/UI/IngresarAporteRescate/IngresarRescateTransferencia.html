<div class="col-xs-12" ng-controller="IngresarRescateTransferenciaFFMCtrl as rescateTransferencia">
	<!-- Pre-Ingreso -->
	<div class="row bcs-cuerpo" ng-show="rescateTransferencia.formData.IngresoConfirmacion === 'I'">
	 <div ng-show="rescateTransferencia.formData.DatosAdicionales === 'N'">	
	 	<form name="FormIngresoFFM" class="filters-formulario">
		   	<div class="row">
				<div class="col-xs-12">
				  	<div class="row">
						<label class="col-xs-4" translate>UI_CLIENTE_ORIGEN</label>
						<bcs-combobox-base class="col-xs-8"
							id="UI_CLIENTE"
						 	auto-cargar="'false'"
						 	bcs-requerido
						    tipo="'combobox-socio-negocio'"
						    carga-cliente-automatico="'S'"
						    seleccionado="rescateTransferencia.oSocioNegocio.seleccionado"
						    filtros="rescateTransferencia.oSocioNegocio.filtros"
							cascada-a="rescateTransferencia.oPortafolio.filtros.IdCliente"
							cascada-valor="'IdCliente'"
		                    cascada1-a="rescateTransferencia.formData.IdCategoriaInversionista"
		                    cascada1-valor="'IdCategoriaInversionista'"
		                    cascada2-a="rescateTransferencia.formData.FiltrosBusquedaFondo.IdCliente"
		                    cascada2-valor="'IdCliente'"
		                    cascada-defecto="'-1'"
		                    id-actual="rescateTransferencia.oSocioNegocio.idActual"
						    configuracion= "rescateTransferencia.oSocioNegocio.configuracion">
						</bcs-combobox-base>
					</div>      
		 			<div class="row">
						<label class="col-xs-4" translate>UI_PORTAFOLIO_ORIGEN</label>
						<bcs-combobox-base 
							class				="col-xs-8"
							id					="UI_PORTAFOLIO"
						 	auto-cargar			="'false'"
						 	bcs-requerido
						    tipo				="'combobox-portafolio'"
						    seleccionado		="rescateTransferencia.oPortafolio.seleccionado"
						    filtros				="rescateTransferencia.oPortafolio.filtros"
		                    item-post-filtro	="'1'"
		                    id-actual			="rescateTransferencia.oPortafolio.idActual"
		                    cascada-a			="rescateTransferencia.formData.filtrosFormaPago.IdPortafolio"
		                    cascada-valor		="'IdPortafolio'"
		                    cascada1-a			="rescateTransferencia.formData.FiltrosBusquedaFondo.IdPortafolio"
		                    cascada1-valor		="'IdPortafolio'"
		                    cascada2-a			="rescateTransferencia.formData.filtrosCuentaInversion.IdPortafolio"
 							cascada2-valor		="'IdPortafolio'"
 							cascada3-a			="rescateTransferencia.formData.FiltrosAutorizarOrden.IdPortafolio"
 							cascada3-valor		="'IdPortafolio'"
 							cascada4-a			="rescateTransferencia.formData.FiltrosComboFondo.IdPortafolio"
 							cascada4-valor		="'IdPortafolio'"
						    configuracion		= "rescateTransferencia.oPortafolio.configuracion">
						</bcs-combobox-base >
					</div>
					<div class="row">
 						<label class="col-xs-4" translate>UI_AUTORIZADOR_ORIGEN</label>
						<bcs-combobox-base
								class					= "col-xs-8"
								bcs-requerido 			= "rescateTransferencia.oPortafolio.seleccionado.portafolio.TipoPersona === 'J'"
								tipo					= "'combobox-autorizado-dar-ordenes'"
								id-actual				= "rescateTransferencia.formData.idAutorizadoDarOrdenes"
								id-defecto				= "rescateTransferencia.formData.idAutorizadoDarOrdenesDefecto"
								seleccionado			= "autorizadoDarOrdenes" 
								filtros					= "rescateTransferencia.formData.FiltrosAutorizarOrden"	
								usa-filtros-completos   = "'S'">
						</bcs-combobox-base>						
 					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_CLIENTE_DESTINO</label>
						<bcs-combobox-base 
							class				="col-xs-8"
							id					="UI_CLIENTE_DESTINO"
						 	auto-cargar			="'false'"
						 	bcs-requerido
						    tipo				="'combobox-socio-negocio'"
						    seleccionado		="rescateTransferencia.oSocioNegocioDestino.seleccionado"
						    filtros				="rescateTransferencia.oSocioNegocioDestino.filtros"
							cascada-a			="rescateTransferencia.oPortafolioDestino.filtros.IdCliente"
							cascada-valor		="'IdCliente'"
		                    cascada-defecto		="'-1'"
		                    id-actual			="rescateTransferencia.oSocioNegocioDestino.idActual"
						    configuracion		= "rescateTransferencia.oSocioNegocioDestino.configuracion">
						</bcs-combobox-base>
					</div>      
		 			<div class="row">
						<label class="col-xs-4" translate>UI_PORTAFOLIO_DESTINO</label>
						<bcs-combobox-base 
							class				="col-xs-8"
							id					="UI_PORTAFOLIO_DESTINO"
						 	auto-cargar			="'false'"
						 	bcs-requerido
						    tipo				="'combobox-portafolio'"
						    seleccionado		="rescateTransferencia.oPortafolioDestino.seleccionado"
						    filtros				="rescateTransferencia.oPortafolioDestino.filtros"
		                    item-post-filtro	="'1'"
		                    id-actual			="rescateTransferencia.oPortafolioDestino.idActual"
		                    cascada-a			="rescateTransferencia.formData.filtrosFormaPagoDestino.IdPortafolio"
		                    cascada-valor		="'IdPortafolio'"
		                    cascada1-a			="rescateTransferencia.formData.FiltrosBusquedaFondoDestino.IdPortafolio"
		                    cascada1-valor		="'IdPortafolio'"
		                    cascada2-a			="rescateTransferencia.formData.FiltrosAutorizarOrdenDestino.IdPortafolio"
 							cascada2-valor		="'IdPortafolio'"
						    configuracion		= "rescateTransferencia.oPortafolioDestino.configuracion">
						</bcs-combobox-base >
					</div>
					<div class="row">
 						<label class="col-xs-4" translate>UI_AUTORIZADOR_DESTINO</label>
						<bcs-combobox-base
								class					= "col-xs-8"
								bcs-requerido 			= "rescateTransferencia.oPortafolioDestino.seleccionado.portafolio.TipoPersona === 'J'"
								tipo					= "'combobox-autorizado-dar-ordenes'"
								id-actual				= "rescateTransferencia.formData.idAutorizadoDarOrdenesDestino"
								id-defecto				= "rescateTransferencia.formData.idAutorizadoDarOrdenesDestinoDefecto"
								seleccionado			= "autorizadoDarOrdenesDestino" 
								filtros					= "rescateTransferencia.formData.FiltrosAutorizarOrdenDestino"	
								usa-filtros-completos   = "'S'">
						</bcs-combobox-base>						
 					</div>
				  	<hr>
				  	<bcs-combobox-buscador-fondos-custodia
				  			id="UI_BUSCADOR_FONDO_RESCATE_TRANSFERENCIA"
							datos-fondo="rescateTransferencia.datosFondo" 
							muestra-valor-cuota = "'S'"
							buscar-fondo="rescateTransferencia.formData.setFondo"
							id-ventana="winID"
							muestra-detalle="'S'"
							es-detalle="'S'"
							mas-informacion="rescateTransferencia.masInformacion"
							filtros="rescateTransferencia.formData.FiltrosBusquedaFondo"
							filtros-combobox="rescateTransferencia.formData.FiltrosComboFondo">
					</bcs-combobox-buscador-fondos-custodia>
			  		<hr>
					<div ng-if="rescateTransferencia.datosFondo.IdInstrumento && rescateTransferencia.oPortafolio.seleccionado.IdPortafolio && (rescateTransferencia.formData.IdRegimenFondoMutuo || rescateTransferencia.formData.TipoRescate == 'T')">
						<bcs-saldo-custodia-fondo
					  		    decimales = "rescateTransferencia.datosFondo.DecimalesCuota"
								id-boveda = "'COR'"
								id-cliente = "rescateTransferencia.oSocioNegocio.seleccionado.IdCliente"
								id-instrumento = "rescateTransferencia.datosFondo.IdInstrumento"
								id-regimen = "rescateTransferencia.formData.IdRegimenFondoMutuo"
								id-portafolio = "rescateTransferencia.oPortafolio.seleccionado.IdPortafolio"
								fecha-saldo = "rescateTransferencia.formData.fechaSistema"
								id-moneda = "rescateTransferencia.datosFondo.IdMoneda"
								saldo-cuotas = "rescateTransferencia.formData.SaldoCuotas"
								saldo-monto = "rescateTransferencia.formData.SaldoMonto" 
						>
						</bcs-saldo-custodia-fondo>
						<hr>
					</div>
				  	<div class="row">
					  	<label class="col-xs-4" translate>UI_FECHA_SISTEMA</label> 
				  		<bcs-input-date
							class="col-xs-8"
							k-ng-model="rescateTransferencia.formData.fechaSistema" 
							bcs-requerido
							k-ng-disabled="'true'">
						</bcs-input-date>
			  		</div>
			  		<div class="row">
						<label class="col-xs-4" translate>UI_TIPO_RESCATE</label>
					  		<bcs-combobox-base class="col-xs-8"
					  			id="UI_TIPO_RESCATE"
					  			tipo="'combobox-tipo-rescate-ffmm'"
					  			configuracion="rescateTransferencia.formData.oConfiguracionTipoRescate.configuracion"
                                filtros="rescateTransferencia.formData.oConfiguracionTipoRescate.filtros" 
					  			id-actual="rescateTransferencia.formData.TipoRescate"
					  			id-defecto="'M'"
					  			seleccionado="rescateTransferencia.formData.TipoRescateSeleccionado">
					  		</bcs-combobox-base>
				  		</bcs-combobox-base> 
				  	</div>
				  	<div class="row" ng-if="rescateTransferencia.datosFondo && rescateTransferencia.oPortafolio.seleccionado.IdPortafolio">
			  			<label class="col-xs-4" translate>UI_REGIMEN</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-regimen-serie-fondo'"
				  			id-actual="rescateTransferencia.formData.IdRegimenFondoMutuo"
				  			seleccionado="rescateTransferencia.formData.regimenFondoMutuo"
				  			item-post-filtro="'1'"
				  			filtros="rescateTransferencia.formData.filtrosRegimen"
				  			bcs-requerido
				  			todos="'N'">
						</bcs-combobox-base>
			  		</div>
				  	<div class="row">
					  	<label class="col-xs-4" translate>UI_MONTO_RESCATE</label> 
				  		<bcs-input-monetario class="col-xs-8"
				  			id="UI_MONTO_RESCATE"
				  			k-ng-model="rescateTransferencia.formData.montoInicial"
				  			decimales = "rescateTransferencia.formData.decimalesMonto"
				  			bcs-requerido
				  			k-ng-disabled="rescateTransferencia.formData.TipoRescate === 'C' || rescateTransferencia.formData.TipoRescate === 'T'"
							simbolo="rescateTransferencia.datosFondo.IdMoneda">
				  		</bcs-input-monetario>
			  		</div>
			  		<div class="row">
					  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
				  		<bcs-input-numero class="col-xs-8"
				  			id="UI_NUMERO_CUOTAS"
							decimales = "rescateTransferencia.formData.decimalesCantidad"
							bcs-requerido
							k-ng-model="rescateTransferencia.formData.numeroCuotas"
							k-ng-disabled="rescateTransferencia.formData.TipoRescate === 'M' || rescateTransferencia.formData.TipoRescate === 'T'">
						</bcs-input-numero> 
			  		</div>
			  		<div class="row">
					  	<label class="col-xs-4" translate>UI_MONTO_COMISIONES</label> 
				  		<bcs-comision-solicitud-fondo class="col-xs-8"
					  		id-serie-fondo="rescateTransferencia.datosFondo.IdSerieFondo"
					  		id-instrumento="rescateTransferencia.datosFondo.IdInstrumento"
					  		id-cliente="rescateTransferencia.oSocioNegocio.seleccionado.IdCliente"
					  		id-portafolio="rescateTransferencia.oPortafolio.seleccionado.IdPortafolio"
					  		id-moneda="rescateTransferencia.datosFondo.IdMoneda"
					  		id-moneda-operacion="rescateTransferencia.datosFondo.IdMoneda"
					  		tipo-solicitud="'RES'"
					  		tipo-movimiento="'RESTRANSF'"
					  		fecha-valor-cuota="rescateTransferencia.formData.fechaSistema"
					  		es-traspaso="'N'"
					  		cantidad="rescateTransferencia.formData.numeroCuotas"
					  	>	
					  	</bcs-comision-solicitud-fondo>
			  		</div>
				  	<div class="row">
					  	<label class="col-xs-4" translate>UI_GLOSA</label> 
				  		<bcs-input-texto class="col-xs-8"
				  			id="UI_GLOSA"
					  		maxlength="100"
							tipo-campo="'textarea'"
							ng-model="rescateTransferencia.formData.comentario"
							atributos="margin: 0px; height:73px;resize:none;width: 100%">
				  		</bcs-input-texto>
			  		</div>  
				  	
				</div>
			</div>
			
			</form>
        
			<div class="row bcs-panel-comandos">
				<div class=col-xs-12>
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM" 
						bcs-texto="'UI_INGRESAR' | translate" 
						bcs-habilitado="FormIngresoFFM.$valid"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="true"
						bcs-clic="rescateTransferencia.formData.ingresarAporteRescate()">
					</bcs-button>	
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="rescateTransferencia.limpiarFMM()"
						bcs-blur="rescateTransferencia.formData.resetFoco()">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
	<!-- Solicitud Ingresada -->
	<div class="row bcs-cuerpo" ng-show="rescateTransferencia.formData.IngresoConfirmacion === 'C'">
		<div class="row">
			<div class="col-xs-12">
			    <div class="row" ng-show="true">
				  	<label class="col-xs-4" translate>UI_SECUENCIA_OPERACION</label> 
			  		<bcs-input-texto class="col-xs-8" ng-model="rescateTransferencia.formData.ResultadoSolicitudAporteRescate.SecuenciaOperacion" k-ng-disabled="'true'"></bcs-input-texto>
		  		</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_OPERACION</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="oOperacion.seleccionado.Descripcion"
			  			k-ng-disabled="'true'"
			  		> 
			  	</div>
			  	<hr>
			  	<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE_ORIGEN</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.oSocioNegocio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>      
	 			<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO_ORIGEN</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.oPortafolio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE_DESTINO</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.oSocioNegocioDestino.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>      
	 			<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO_DESTINO</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.oPortafolioDestino.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>
			  	<hr>
			  	<div class="row">
			  	    <label class="col-xs-4" translate>UI_FONDO_MUTUO</label>
				  	<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.datosFondo.IdSerieFondo"
			  			k-ng-disabled="'true'"
			  		>
		  		</div>
		  		
		  		<div class="row">
					<span class="col-xs-6">
						<label class="col-xs-8" translate>UI_MAS_INFORMACION&nbsp;&nbsp;</label>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="!ingresoFFM.rescateTransferencia.muestraDetalle" ng-click="ingresoFFM.rescateTransferencia.muestraDetalle = !ingresoFFM.rescateTransferencia.muestraDetalle;ajustaVentana()">({{'+' | translate}})</em>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="ingresoFFM.rescateTransferencia.muestraDetalle" ng-click="ingresoFFM.rescateTransferencia.muestraDetalle = !ingresoFFM.rescateTransferencia.muestraDetalle;ajustaVentana()">({{'-' | translate}})</em>
					</span>
				</div>
				<div class="row" ng-show="ingresoFFM.rescateTransferencia.muestraDetalle">
					<div class="row">
					  	<label class="col-xs-3" translate>UI_TIPO_FONDO</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.NombreCorto}}</label>
				  		<label class="col-xs-3" translate>UI_PERFIL</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.IdCategoriaPerfilFondoMutuo}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_REGIMEN_TRIBUTARIO</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.IdRegimenTributario}}</label>
				  		<label class="col-xs-3" translate>UI_PROPOSITO_SERIE</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.PropositoSerie}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_ENTRADA</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.EsComisionEntradaUI}}</label>
				  		<label class="col-xs-3" translate>UI_MINIMO_PATRIMONIO</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.EsPatrimonioMinimoUI}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_SALIDA</label> 
				  		<label class="col-xs-3" translate>{{rescateTransferencia.datosFondo.EsComisionSalidaUI}}</label>
		  			</div>
				</div>
		  		<hr>	
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_FECHA_SISTEMA</label> 
			  		<bcs-input-date
						class="col-xs-8"
						k-ng-model="rescateTransferencia.formData.fechaSistema" 
						bcs-requerido
						k-ng-disabled="'true'">
					</bcs-input-date>
			  	</div>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_TIPO_RESCATE</label> 
			  		<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.formData.ResultadoSolicitudAporteRescate.TipoRescate"
			  			k-ng-disabled="'true'">
			  		</bcs-input-texto>
		  		</div>
		  		<div class="row" ng-show="rescateTransferencia.formData.TipoRescate !== 'T'">
			  		<label class="col-xs-4" translate>UI_REGIMEN</label>
				 	<bcs-input-texto class="col-xs-8"
				 		k-ng-disabled="'true'"
				 		ng-model="rescateTransferencia.formData.regimenFondoMutuo.Descripcion">
				 	</bcs-input-texto>
				</div>
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_MONTO_RESCATE</label> 
			  		<bcs-input-monetario class="col-xs-8"
			  			k-ng-model="rescateTransferencia.formData.ResultadoSolicitudAporteRescate.MontoRescate"
			  			decimales = "rescateTransferencia.formData.decimalesMonto"
			  			k-ng-disabled="'true'"
			  			simbolo="rescateTransferencia.datosFondo.IdMoneda"
			  		>
			  		</bcs-input-monetario>
		  		</div>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
			  		<bcs-input-texto class="col-xs-8"
			  			ng-model="rescateTransferencia.formData.ResultadoSolicitudAporteRescate.NumeroCuotas"
			  			k-ng-disabled="'true'"	
			  		>
			  		</bcs-input-texto>
		  		</div>
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_GLOSA</label> 
			  		<bcs-input-texto class="col-xs-8"
				  		maxlength="260"
						tipo-campo="'textarea'"
						ng-model="rescateTransferencia.formData.comentario"
						atributos="margin: 0px; height:73px;resize:none;width: 100%"
						k-ng-disabled="'true'"	
					>
			  		</bcs-input-texto>
		  		</div>
			</div>
		</div>

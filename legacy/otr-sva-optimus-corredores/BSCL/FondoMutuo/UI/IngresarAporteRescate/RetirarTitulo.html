	<!-- Pre-Ingreso -->
	<div class="row bcs-cuerpo" ng-show="retiroTitulo.formData.IngresoConfirmacion === 'I'">
	 <div>	
	 	<form name="FormIngresoFFM" class="filters-formulario">

							seleccionado="retiroTitulo.oClientePortafolio.seleccionado"
							filtros="filtrosPortafolio"
							ng-style="{'width' : retiroTitulo.oClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && retiroTitulo.oClientePortafolio.seleccionado  ? '50%' : '66.66666667%'}"

		                    cascada-valor="'IdCategoriaInversionista'"

		                    cascada1-valor="'IdCliente'"
		                    
		                    cascada2-a="retiroTitulo.formData.filtrosFormaPago.IdPortafolio"
		                    cascada2-valor="'IdPortafolio'"
		                    cascada3-a="retiroTitulo.formData.filtrosCuentaInversion.IdPortafolio"
		                    cascada3-valor="'IdPortafolio'"
		                    cascada4-a="retiroTitulo.formData.FiltrosBusquedaFondo.IdPortafolio"
		                    cascada4-valor="'IdPortafolio'"
		                    cascada5-a="retiroTitulo.formData.FiltrosAutorizarOrden.IdPortafolio"
		                    cascada5-valor="'IdPortafolio'"
		                    		                    
		                    cascada-defecto="'-1'"
		                    		                    							
							configuracion="retiroTitulo.oClientePortafolio.configuracion">
						</bcs-combobox-base>

					<div class="row">
 						<label class="col-xs-4" translate>UI_AUTORIZADOR</label>
						<bcs-combobox-base
								class					= "col-xs-8"
								bcs-requerido 			= "retiroTitulo.oClientePortafolio.seleccionado.portafolio.TipoPersona === 'J'"
								tipo					= "'combobox-autorizado-dar-ordenes'"
								id-actual				= "retiroTitulo.formData.idAutorizadoDarOrdenes"
								id-defecto				= "retiroTitulo.formData.idAutorizadoDarOrdenesDefecto"
								seleccionado			= "autorizadoDarOrdenes" 
								filtros					= "retiroTitulo.formData.FiltrosAutorizarOrden "	>
						</bcs-combobox-base>						
 					</div>
					
				  	<hr>
				  	<bcs-combobox-buscador-fondos
							id="UI_BUSCADOR_FONDO_APORTE"
							datos-fondo="retiroTitulo.datosFondo" 
							muestra-valor-cuota = "'S'"
							buscar-fondo="retiroTitulo.formData.setFondo"
							id-ventana="retiroTitulo.winID"
							id-defecto="retiroTitulo.datosFondoDefecto.IdDefecto"
							muestra-detalle="'S'"
							es-detalle="'S'"
							mas-informacion="retiroTitulo.masInformacion"
							filtros="retiroTitulo.formData.FiltrosBusquedaFondo"
							filtros-combobox="retiroTitulo.formData.FiltrosComboFondo">
					</bcs-combobox-buscador-fondos>
			  		<hr>
			  		<div ng-if="retiroTitulo.oClientePortafolio.seleccionado.IdPortafolio && retiroTitulo.datosFondo.IdInstrumento && retiroTitulo.formData.IdRegimenFondoMutuo">
						<bcs-saldo-custodia-fondo
					  		    decimales = "retiroTitulo.datosFondo.DecimalesCuota"
								id-boveda = "'COR'"
								id-cliente = "retiroTitulo.oClientePortafolio.seleccionado.IdCliente"
								id-instrumento = "retiroTitulo.datosFondo.IdInstrumento"
								id-regimen = "retiroTitulo.formData.IdRegimenFondoMutuo"
								id-portafolio = "retiroTitulo.oClientePortafolio.seleccionado.IdPortafolio"
								fecha-saldo = "retiroTitulo.formData.fechaSistema"
								id-moneda = "retiroTitulo.datosFondo.IdMoneda"
								saldo-cuotas = "retiroTitulo.formData.SaldoCuotas"
								saldo-monto = "retiroTitulo.formData.SaldoMonto">
						</bcs-saldo-custodia-fondo>
						<hr>
			  		</div>
			  		<div class="row">
					  	<label class="col-xs-4" translate>UI_FECHA_SISTEMA</label> 
				  		<bcs-input-date
							class="col-xs-8"
							k-ng-model="retiroTitulo.formData.fechaSistema" 
							bcs-requerido
							k-ng-disabled="'true'">
						</bcs-input-date>
			  		</div>
			  		<div class="row" ng-if="retiroTitulo.datosFondo && retiroTitulo.oClientePortafolio.seleccionado.IdPortafolio">
			  			<label class="col-xs-4" translate>UI_REGIMEN</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-regimen-serie-fondo'"
				  			id-actual="retiroTitulo.formData.IdRegimenFondoMutuo"
				  			seleccionado="retiroTitulo.formData.regimenFondoMutuo"
							id-defecto="retiroTitulo.formData.RegimenDefecto"
				  			item-post-filtro="'1'"
				  			filtros="retiroTitulo.formData.filtrosRegimen"
				  			bcs-requerido
				  			todos="'N'">
						</bcs-combobox-base>
			  		</div>
			  		<div class="row">
					  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
				  		<bcs-input-numero class="col-xs-8"
				  			id="UI_NUMERO_CUOTAS"
							decimales = "retiroTitulo.formData.decimalesCantidad"
							bcs-requerido
							k-ng-model="retiroTitulo.formData.numeroCuotas">
						</bcs-input-numero> 
			  		</div>
				  	<div class="row">
					  	<label class="col-xs-4" translate>UI_GLOSA</label> 
				  		<bcs-input-texto class="col-xs-8"
				  			id="UI_GLOSA"
					  		maxlength="100"
							tipo-campo="'textarea'"
							ng-model="retiroTitulo.formData.comentario"
							atributos="margin: 0px; height:73px;resize:none;width: 100%">
				  		</bcs-input-texto>
			  		</div>	 	
				</div>
			</div>
			
			</form>
        
			<div class="row bcs-panel-comandos">
				<div class=col-xs-12>
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarTituloFFM" 
						bcs-texto="'UI_INGRESAR' | translate" 
						bcs-habilitado="FormIngresoFFM.$valid"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="true"
						bcs-clic="retiroTitulo.formData.retirarTitulo()">
					</bcs-button>	
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="retiroTitulo.limpiarFMM()"
						bcs-blur="retiroTitulo.formData.resetFoco()">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
	<!-- Solicitud Ingresada -->
	<div class="row bcs-cuerpo" ng-show="retiroTitulo.formData.IngresoConfirmacion === 'C'">
		<div class="row">
			<div class="col-xs-12">
			    <div class="row" ng-show="true">
				  	<label class="col-xs-4" translate>UI_SECUENCIA_OPERACION</label> 
			  		<bcs-input-texto 
			  		class="col-xs-8" 
			  		ng-model="retiroTitulo.formData.ResultadoSolicitudAporteRescate.SecuenciaOperacion" 
			  		k-ng-disabled="'true'"></bcs-input-texto>
		  		</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_OPERACION</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="oOperacion.seleccionado.Descripcion"
			  			k-ng-disabled="'true'"
			  		> 
			  	</div>
			  	<hr>
			  	<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="retiroTitulo.oClientePortafolio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>      
	 			<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="retiroTitulo.oClientePortafolio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>
			  	<hr>
			  	<div class="row">
			  	    <label class="col-xs-4" translate>UI_FONDO_MUTUO</label>

			  			ng-model="retiroTitulo.datosFondo.IdSerieFondo"
			  			k-ng-disabled="'true'"
			  		>
		  		</div>
		  		
		  		<div class="row">
					<span class="col-xs-6">
						<label class="col-xs-8" translate>UI_MAS_INFORMACION&nbsp;&nbsp;</label>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="!ingresoFFM.retiroTitulo.muestraDetalle" ng-click="ingresoFFM.retiroTitulo.muestraDetalle = !ingresoFFM.retiroTitulo.muestraDetalle;ajustaVentana()">({{'+' | translate}})</em>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="ingresoFFM.retiroTitulo.muestraDetalle" ng-click="ingresoFFM.retiroTitulo.muestraDetalle = !ingresoFFM.retiroTitulo.muestraDetalle;ajustaVentana()">({{'-' | translate}})</em>
					</span>
				</div>
				<div class="row" ng-show="ingresoFFM.retiroTitulo.muestraDetalle">
					<div class="row">
					  	<label class="col-xs-3" translate>UI_TIPO_FONDO</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.NombreCorto}}</label>
				  		<label class="col-xs-3" translate>UI_PERFIL</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.IdCategoriaPerfilFondoMutuo}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_REGIMEN_TRIBUTARIO</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.IdRegimenTributario}}</label>
				  		<label class="col-xs-3" translate>UI_PROPOSITO_SERIE</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.PropositoSerie}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_ENTRADA</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.EsComisionEntradaUI}}</label>
				  		<label class="col-xs-3" translate>UI_MINIMO_PATRIMONIO</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.EsPatrimonioMinimoUI}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_SALIDA</label> 
				  		<label class="col-xs-3" translate>{{retiroTitulo.datosFondo.EsComisionSalidaUI}}</label>
		  			</div>
				</div>
		  		<hr>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_FECHA_SISTEMA</label> 
			  		<bcs-input-date
						class="col-xs-8"
						k-ng-model="retiroTitulo.formData.fechaSistema" 
						bcs-requerido
						k-ng-disabled="'true'">
					</bcs-input-date>
			  	</div>
			  	<div class="row">
			  		<label class="col-xs-4" translate>UI_REGIMEN</label>
				 	<bcs-input-texto class="col-xs-8"
				 		k-ng-disabled="'true'"
				 		ng-model="retiroTitulo.formData.regimenFondoMutuo.Descripcion">
				 	</bcs-input-texto>
				</div>   		
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_MONTO_INICIAL</label> 
			  		<bcs-input-monetario class="col-xs-8"
			  			k-ng-model="retiroTitulo.formData.ResultadoSolicitudAporteRescate.MontoInicial"
			  			decimales = "retiroTitulo.formData.decimalesMonto"
			  			k-ng-disabled="'true'"
			  			simbolo="retiroTitulo.formData.IdMonedaAporte">
			  		</bcs-input-monetario>
		  		</div>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
			  		<bcs-input-texto class="col-xs-8"
			  			ng-model="retiroTitulo.formData.ResultadoSolicitudAporteRescate.NumeroCuotas"
			  			k-ng-disabled="'true'"	
			  		>
			  		</bcs-input-texto>
		  		</div>
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_GLOSA</label> 
			  		<bcs-input-texto class="col-xs-8"
				  		maxlength="260"
						tipo-campo="'textarea'"
						ng-model="retiroTitulo.formData.comentario"
						atributos="margin: 0px; height:73px;resize:none;width: 100%"
						k-ng-disabled="'true'"	
					>
			  		</bcs-input-texto>
		  		</div>
			</div>
		</div>
		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
				<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_VOLVER' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="retiroTitulo.limpiarFMM('true')"
					foco = "retiroTitulo.formData.focoVolver">
				</bcs-button>	
			</div>
		</div>
	</div>
	
</div>

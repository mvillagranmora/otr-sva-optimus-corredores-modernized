<div class="col-xs-12" ng-controller="IngresarGarantiaFFMCtrl as ingresoGarantia">
	<!-- Pre-Ingreso -->
	<div class="row bcs-cuerpo" ng-show="ingresoGarantia.formData.IngresoConfirmacion === 'I'">
	 <div>	
	 	<form name="FormIngresoFFM" class="filters-formulario">
		   	<div class="row">
				<div class="col-xs-12">
				  	<div class="row">
				  	<!-- Inicio GCMBIPAPAS-1 Filtro de clientes por Perfiles-->

						<label class="col-xs-4" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-8" id="UI_SOCIO_NEGOCIO"
							auto-cargar="'false'"
							bcs-requerido
							id-actual="ingresoGarantia.oClientePortafolio.idActual"
							tipo="ingresoGarantia.oClientePortafolio.tipo"
							carga-cliente-automatico="'S'" 
							seleccionado="ingresoGarantia.oClientePortafolio.seleccionado"
							filtros="filtrosPortafolio"
							ng-style="{'width' : ingresoGarantia.oClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && ingresoGarantia.oClientePortafolio.seleccionado  ? '50%' : '66.66666667%'}"
		                    cascada1-a="ingresoGarantia.formData.IdCategoriaInversionista"
		                    cascada1-valor="'IdCategoriaInversionista'"
		                    cascada2-a="ingresoGarantia.formData.FiltrosBusquedaFondo.IdCliente"
		                    cascada2-valor="'IdCliente'"
		                    
		                    cascada-a="ingresoGarantia.formData.filtrosFormaPago.IdPortafolio"
		                    cascada-valor="'IdPortafolio'"
		                    cascada1-a="ingresoGarantia.formData.filtrosCuentaInversion.IdPortafolio"
		                    cascada1-valor="'IdPortafolio'"
		                    cascada2-a="ingresoGarantia.formData.FiltrosBusquedaFondo.IdPortafolio"
		                    cascada2-valor="'IdPortafolio'"
		                    cascada3-a="ingresoGarantia.formData.FiltrosAutorizarOrden.IdPortafolio"
		                    cascada3-valor="'IdPortafolio'"		                    
		                    cascada-defecto="'-1'"
		                    							
							configuracion="ingresoGarantia.oClientePortafolio.configuracion">
						</bcs-combobox-base>						
					</div>      
					<!--
		 			<div class="row">
						<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-8"

						 	auto-cargar="'false'"
						 	bcs-requerido
						    tipo="'combobox-portafolio'"

					<!-- Fin GCMBIPAPAS-1 -->
					
					<div class="row">
 						<label class="col-xs-4" translate>UI_AUTORIZADOR</label>
						<bcs-combobox-base
								class					= "col-xs-8"
								bcs-requerido 			= "ingresoGarantia.oClientePortafolio.seleccionado.portafolio.TipoPersona === 'J'"
								tipo					= "'combobox-autorizado-dar-ordenes'"
								id-actual				= "ingresoGarantia.formData.idAutorizadoDarOrdenes"
								id-defecto				= "ingresoGarantia.formData.idAutorizadoDarOrdenesDefecto"
								seleccionado			= "autorizadoDarOrdenes" 
								filtros					= "ingresoGarantia.formData.FiltrosAutorizarOrden "	>
						</bcs-combobox-base>						
 					</div>
					
				  	<hr>
				  	<bcs-combobox-buscador-fondos
							id="UI_BUSCADOR_FONDO_APORTE"
							datos-fondo="ingresoGarantia.datosFondo" 
							muestra-valor-cuota = "'S'"
							buscar-fondo="ingresoGarantia.formData.setFondo"
							id-ventana="ingresoGarantia.winID"
							id-defecto="ingresoGarantia.datosFondoDefecto.IdDefecto"
							muestra-detalle="'S'"
							es-detalle="'S'"
							mas-informacion="ingresoGarantia.masInformacion"
							filtros="ingresoGarantia.formData.FiltrosBusquedaFondo"
							filtros-combobox="ingresoGarantia.formData.FiltrosComboFondo">
					</bcs-combobox-buscador-fondos>
			  		<hr>
			  		<div ng-if="ingresoGarantia.oClientePortafolio.seleccionado.IdPortafolio && ingresoGarantia.datosFondo.IdInstrumento && ingresoGarantia.formData.IdRegimenFondoMutuo">
						<bcs-saldo-custodia-fondo
					  		    decimales = "ingresoGarantia.datosFondo.DecimalesCuota"
								id-boveda = "'COR'"
								id-cliente = "ingresoGarantia.oClientePortafolio.seleccionado.IdCliente"
								id-instrumento = "ingresoGarantia.datosFondo.IdInstrumento"
								id-regimen = "ingresoGarantia.formData.IdRegimenFondoMutuo"
								id-portafolio = "ingresoGarantia.oClientePortafolio.seleccionado.IdPortafolio"
								fecha-saldo = "ingresoGarantia.formData.fechaSistema"
								id-moneda = "ingresoGarantia.datosFondo.IdMoneda"
								saldo-cuotas = "ingresoGarantia.formData.SaldoCuotas"
								saldo-monto = "ingresoGarantia.formData.SaldoMonto">
						</bcs-saldo-custodia-fondo>
						<hr>
			  		</div>
			  		<div class="row">
					  	<label class="col-xs-4" translate>UI_FECHA_SISTEMA</label> 
				  		<bcs-input-date
							class="col-xs-8"
							k-ng-model="ingresoGarantia.formData.fechaSistema" 
							bcs-requerido
							k-ng-disabled="'true'">
						</bcs-input-date>
			  		</div>
			  		<div class="row" ng-if="ingresoGarantia.datosFondo && ingresoGarantia.oClientePortafolio.seleccionado.IdPortafolio">
			  			<label class="col-xs-4" translate>UI_REGIMEN</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-regimen-serie-fondo'"
				  			id-actual="ingresoGarantia.formData.IdRegimenFondoMutuo"
				  			seleccionado="ingresoGarantia.formData.regimenFondoMutuo"
							id-defecto="ingresoGarantia.formData.RegimenDefecto"
				  			item-post-filtro="'1'"
				  			filtros="ingresoGarantia.formData.filtrosRegimen"
				  			bcs-requerido
				  			todos="'N'">
						</bcs-combobox-base>
			  		</div>
			  		<div class="row">
					  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
				  		<bcs-input-numero class="col-xs-8"
				  			id="UI_NUMERO_CUOTAS"
							decimales = "ingresoGarantia.formData.decimalesCantidad"
							bcs-requerido
							k-ng-model="ingresoGarantia.formData.numeroCuotas">
						</bcs-input-numero> 
			  		</div>
			  		<div class="row">
						<label class="col-xs-4" translate>UI_CONCEPTO</label>	
						<bcs-combobox-base class="col-xs-8"  
							bcs-requerido   = "'true'"
							tipo			= "ingresoGarantia.oConceptoGarantia.tipo"  
							filtros			= "ingresoGarantia.oConceptoGarantia.filtros"
							configuracion	= "ingresoGarantia.oConceptoGarantia.configuracion" 
							id-actual		= "ingresoGarantia.oConceptoGarantia.idActual" 
							seleccionado	= "ingresoGarantia.oConceptoGarantia.seleccionado"
							cascada1-a		= "ingresoGarantia.filtrosGarantia.IdEntidadDestinoGarantia"
							cascada1-valor  = "'IdEntidadDestinoGarantia'">
						</bcs-combobox-base>
					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_ENTIDAD_DESTINO</label>
						<bcs-combobox-base class="col-xs-8" bcs-requerido
							auto-cargar="'true'" auto-seleccion="'true'"
							tipo="'combobox-entidad-destino-garantia'"
							id-actual="ingresoGarantia.idActualGarantia"
							seleccionado="ingresoGarantia.seleccionadoGarantia"
							filtros="ingresoGarantia.filtrosGarantia">
						</bcs-combobox-base>
					</div>
				  	<div class="row">
					  	<label class="col-xs-4" translate>UI_GLOSA</label> 
				  		<bcs-input-texto class="col-xs-8"
				  			id="UI_GLOSA"
					  		maxlength="100"
							tipo-campo="'textarea'"
							ng-model="ingresoGarantia.formData.comentario"
							atributos="margin: 0px; height:73px;resize:none;width: 100%">
				  		</bcs-input-texto>
			  		</div>	 	
				</div>
			</div>
			
			</form>
        
			<div class="row bcs-panel-comandos">
				<div class=col-xs-12>
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarTituloFFM" 
						bcs-texto="'UI_INGRESAR' | translate" 
						bcs-habilitado="FormIngresoFFM.$valid"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="true"
						bcs-clic="ingresoGarantia.formData.ingresarGarantia()">
					</bcs-button>	
					<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="ingresoGarantia.limpiarFMM()"
						bcs-blur="ingresoGarantia.formData.resetFoco()">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
	<!-- Solicitud Ingresada -->
	<div class="row bcs-cuerpo" ng-show="ingresoGarantia.formData.IngresoConfirmacion === 'C'">
		<div class="row">
			<div class="col-xs-12">
			    <div class="row" ng-show="true">
				  	<label class="col-xs-4" translate>UI_SECUENCIA_OPERACION</label> 
			  		<bcs-input-texto 
			  		class="col-xs-8" 
			  		ng-model="ingresoGarantia.formData.ResultadoSolicitudAporteRescate.SecuenciaOperacion" 
			  		k-ng-disabled="'true'"></bcs-input-texto>
		  		</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_OPERACION</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="oOperacion.seleccionado.Descripcion"
			  			k-ng-disabled="'true'"
			  		> 
			  	</div>
			  	<hr>
			  	<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="ingresoGarantia.oClientePortafolio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>      
	 			<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
					<bcs-input-texto class="col-xs-8"
			  			ng-model="ingresoGarantia.oClientePortafolio.seleccionado.KdataTextTemplate"
			  			k-ng-disabled="'true'"
			  		>
				</div>
			  	<hr>
			  	<div class="row">
			  	    <label class="col-xs-4" translate>UI_FONDO_MUTUO</label>
				  	<bcs-input-texto class="col-xs-8"
			  			ng-model="ingresoGarantia.datosFondo.IdSerieFondo"
			  			k-ng-disabled="'true'"
			  		>
		  		</div>
		  		
		  		<div class="row">
					<span class="col-xs-6">
						<label class="col-xs-8" translate>UI_MAS_INFORMACION&nbsp;&nbsp;</label>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="!ingresoFFM.ingresoGarantia.muestraDetalle" ng-click="ingresoFFM.ingresoGarantia.muestraDetalle = !ingresoFFM.ingresoGarantia.muestraDetalle;ajustaVentana()">({{'+' | translate}})</em>
						<em class="col-xs-4" style="text-decoration: underline;" ng-show="ingresoFFM.ingresoGarantia.muestraDetalle" ng-click="ingresoFFM.ingresoGarantia.muestraDetalle = !ingresoFFM.ingresoGarantia.muestraDetalle;ajustaVentana()">({{'-' | translate}})</em>
					</span>
				</div>
				<div class="row" ng-show="ingresoFFM.ingresoGarantia.muestraDetalle">
					<div class="row">
					  	<label class="col-xs-3" translate>UI_TIPO_FONDO</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.NombreCorto}}</label>
				  		<label class="col-xs-3" translate>UI_PERFIL</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.IdCategoriaPerfilFondoMutuo}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_REGIMEN_TRIBUTARIO</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.IdRegimenTributario}}</label>
				  		<label class="col-xs-3" translate>UI_PROPOSITO_SERIE</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.PropositoSerie}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_ENTRADA</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.EsComisionEntradaUI}}</label>
				  		<label class="col-xs-3" translate>UI_MINIMO_PATRIMONIO</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.EsPatrimonioMinimoUI}}</label>
		  			</div>
		  			<div class="row">
					  	<label class="col-xs-3" translate>UI_COMISION_SALIDA</label> 
				  		<label class="col-xs-3" translate>{{ingresoGarantia.datosFondo.EsComisionSalidaUI}}</label>
		  			</div>
				</div>
		  		<hr>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_FECHA_SISTEMA</label> 
			  		<bcs-input-date
						class="col-xs-8"
						k-ng-model="ingresoGarantia.formData.fechaSistema" 
						bcs-requerido
						k-ng-disabled="'true'">
					</bcs-input-date>
			  	</div>
			  	<div class="row">
			  		<label class="col-xs-4" translate>UI_REGIMEN</label>
				 	<bcs-input-texto class="col-xs-8"
				 		k-ng-disabled="'true'"
				 		ng-model="ingresoGarantia.formData.regimenFondoMutuo.Descripcion">
				 	</bcs-input-texto>
				</div>  		
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_MONTO_INICIAL</label> 
			  		<bcs-input-monetario class="col-xs-8"
			  			k-ng-model="ingresoGarantia.formData.ResultadoSolicitudAporteRescate.MontoInicial"
			  			decimales = "ingresoGarantia.formData.decimalesMonto"
			  			k-ng-disabled="'true'"
			  			simbolo="ingresoGarantia.formData.IdMonedaAporte">
			  		</bcs-input-monetario>
		  		</div>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_NUMERO_CUOTAS</label> 
			  		<bcs-input-texto class="col-xs-8"
			  			ng-model="ingresoGarantia.formData.ResultadoSolicitudAporteRescate.NumeroCuotas"
			  			k-ng-disabled="'true'"	
			  		>
			  		</bcs-input-texto>
		  		</div>
		  		<div class="row">
				  	<label class="col-xs-4" translate>UI_CONCEPTO</label> 
			  		<bcs-input-texto class="col-xs-8"
			  			ng-model="ingresoGarantia.oConceptoGarantia.seleccionado.Nombre"
			  			k-ng-disabled="'true'"	
			  		>
			  		</bcs-input-texto>
		  		</div>
			  	<div class="row">
				  	<label class="col-xs-4" translate>UI_GLOSA</label> 
			  		<bcs-input-texto class="col-xs-8"
				  		maxlength="260"
						tipo-campo="'textarea'"
						ng-model="ingresoGarantia.formData.comentario"
						atributos="margin: 0px; height:73px;resize:none;width: 100%"
						k-ng-disabled="'true'"	
					>
			  		</bcs-input-texto>
		  		</div>
			</div>
		</div>
		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
				<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM"
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_VOLVER' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="ingresoGarantia.limpiarFMM('true')"
					foco = "ingresoGarantia.formData.focoVolver">
				</bcs-button>	
			</div>
		</div>
	</div>
	
</div>

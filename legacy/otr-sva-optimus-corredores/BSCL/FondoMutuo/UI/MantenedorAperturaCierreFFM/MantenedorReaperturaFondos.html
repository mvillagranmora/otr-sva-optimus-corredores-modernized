<div id="MantenedorReaperturaFondos" class="col-xs-12" ng-controller="MantenedorReaperturaFondosCtrl">
	<form name="FormMantenedorReaperturaFondos" class="filters-formulario">
		<div class="row bcs-cuerpo">
		   	<div class="row">
				<div class="row">
					<label class="col-xs-4" translate>UI_FONDO</label> 
			  		<bcs-input-texto class="col-xs-8"
				  		k-ng-disabled="'true'"
				  		bcs-requerido
						ng-model="formData.IdFondo">
			  		</bcs-input-texto> 
			  	</div>
				<div class="row">
			  		<label class="col-xs-4" translate>UI_FECHA_FONDO</label> 
			  		<bcs-input-date class="col-xs-8"
			  			bcs-requerido 
						k-ng-model="formData.fechaFondo">
					</bcs-input-date>
			  	</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorReaperturaFondos_Reabrir" 
				bcs-habilitado="FormMantenedorReaperturaFondos.$valid"
				bcs-auto-desactivar="true" 
				bcs-texto="'UI_REABRIR' | translate" 
				bcs-tipo="'bcs-button-primary'"  
				bcs-clic="formData.reabrirFondo()">
			</bcs-button>	
		</div>
	</div>
</div>

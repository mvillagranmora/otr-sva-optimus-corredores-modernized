<div id="IngresarHorarioCierreFondo" class="col-xs-12" ng-controller="IngresarHorarioCierreFondoCtrl">
	<form name="FormIngresoHorarioCierreFondoFFM" class="filters-formulario">
		<div class="row bcs-cuerpo">
		   	<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<label class="col-xs-6" translate>UI_FONDO</label>
						<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-fondo-ffmm'"
			  			id-actual="IdFondo"
			  			id-defecto="IdFondoDefault"
			  			bcs-requerido
			  			todos="'N'"
			  			ng-show="!formData.EsEdicion">
			  			</bcs-combobox-base> 
						<bcs-input-texto class="col-xs-6"
							ng-model="IdFondo"
							k-ng-disabled="'true'"
							bcs-requerido
							ng-show="formData.EsEdicion">
						</bcs-input-texto>
				  	</div>
				</div>
				<div class="col-xs-12">
					<div class="row">
						<label class="col-xs-6" translate>UI_CIERRE_PLATAFORMA_COMERCIAL</label>
						<bcs-input-time 
							class="col-xs-6"
							ng-model="formData.Horarios.HoraCierreComercial" >
						</bcs-input-time>
				  	</div>
				</div>
				<div class="col-xs-12">
					<div class="row">
						<label class="col-xs-6" translate>UI_CIERRE_BACKOFFICE</label>
						<bcs-input-time 
							class="col-xs-6" 
							ng-model="formData.Horarios.HoraCierreBackOffice" >
						</bcs-input-time>
				  	</div>
				</div>
				<div class="col-xs-12" ng-show="formData.EsEdicion">
					<div class="row">
						<label class="col-xs-6" translate>UI_HABILITADO</label>
						<bcs-input-checkbox 
	         				class="col-xs-2"
							ng-model="formData.Horarios.EsHabilitado"> 
						</bcs-input-checkbox>
				  	</div>
				</div>
			 </div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-4" id="MantenedorAperturaCierre_ConfiguracionHorarioCierreFMM" 
				bcs-tipo="'principal'" 
				bcs-auto-desactivar="true'" 
				bcs-texto="'UI_GUARDAR' | translate" 
				bcs-habilitado="FormIngresoHorarioCierreFondoFFM.$valid" 
				bcs-clic="formData.crearHorariosInstrumento()">
			</bcs-button>
		</div>
	</div>
</div>

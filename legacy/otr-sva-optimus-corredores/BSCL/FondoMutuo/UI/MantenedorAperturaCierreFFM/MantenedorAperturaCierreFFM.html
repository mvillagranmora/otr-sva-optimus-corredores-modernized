<div id="MantenedorAperturaCierre" class="col-xs-12" ng-controller="MantenedorAperturaCierreCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_EMISOR</label> 
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-emisor'"
			  			id-actual="filtros.IdEmisor"
			  			filtros="formData.filtrosEmisor"
			  			todos="'S'" 
			  			id-defecto="'0'">
			  		</bcs-combobox-base>
			  	</div>
			  	<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_MONEDA</label>
					<bcs-combobox-base 
						class="col-xs-6"
						id="UI_MONEDA"
						bcs-requerido
					 	auto-cargar="'true'"
					 	id-actual="filtros.IdMoneda"
					 	id-defecto="'0'"
					 	todos="'S'"
					 	tipo="'combobox-moneda'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_FONDO</label> 
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-fondo-ffmm'"
			  			id-actual="filtros.IdFondo"
			  			id-defecto="0"
			  			todos="'S'">
			  		</bcs-combobox-base>
				</div>
		  	</div>
		  	<div class="row"> 
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_NACIONAL</label> 
			  		<bcs-input-checkbox 
		         		class="col-xs-6"
						ng-model="filtros.EsNacional"> 
					</bcs-input-checkbox>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_PERFIL</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-perfil-fondo-mutuo'"
			  			id-actual="filtros.PerfilFondoMutuo"
			  			todos="'N'" 
			  			id-defecto="'PERFIL_COMERCIAL'">
			  		</bcs-combobox-base>
			  	</div>  
			  	<div class="col-xs-4">
			  		<label class="col-xs-4 col-xs-offset-1" translate>UI_PAIS</label>
					<bcs-combobox-base 
						class="col-xs-6"
						id="UI_PAIS"
						bcs-requerido
					 	auto-cargar="'true'"
					 	id-actual="filtros.IdPaisOrigen"
					 	id-defecto="'0'"
					 	todos="'S'"
					 	tipo="'combobox-pais'">
					</bcs-combobox-base>
				</div>
		  	</div>	
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarInstrumentosHoraCierre(apiGridInstrumentos,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
		</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-instrumentos-cierre-fmm"
			 	configuracion="defaultOptions"
				api = "apiGridInstrumentos"
				seleccionado="datos.kNgModel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-10>
			<bcs-button class="col-xs-3" style="width: 19%;" id="MantenedorAperturaCierre_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CONFIGURACION_HORARIOS' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="configurarHorariosFMM()">
			</bcs-button>	
			<bcs-button class="col-xs-1" id="MantenedorAperturaCierre_BloqueoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_BLOQUEO' | translate" 
				bcs-habilitado="!datos.kNgModel || datos.kNgModel.length < 2"
				bcs-clic="configurarAperturaCierreBloqueoFMM()">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorAperturaCierre_AperturaFondosFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_APERTURA_FONDOS' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="abrirCerrarFondos(datos.kNgModel,'ABRIR')">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorAperturaCierre_CierreFondosFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CIERRE_FONDOS' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="abrirCerrarFondos(datos.kNgModel,'CERRAR')">
			</bcs-button>
			<bcs-button class="col-xs-3" style="width: 20%;" id="MantenedorAperturaCierre_AdmPerfilesFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ADM_PERFILES' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="abrirAdmPerfilFondoMutuo()">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorAperturaCierre_AperturaAutomaticaFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_APERTURA_AUTOMATICA' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="aperturaAutomaticaFondoMutuo()">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-1">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="reapertura(datos.kNgModel)">{{'UI_REAPERTURA_FONDOS' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

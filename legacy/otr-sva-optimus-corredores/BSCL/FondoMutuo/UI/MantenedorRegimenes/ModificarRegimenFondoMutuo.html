<div class="col-xs-12" ng-controller="ModificarRegimenFondoMutuoCtrl">
	<form name="ModificarRegimenFondoMutuo" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_REGIMEN</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_REGIMEN"
				  		maxlength="40"
				  		bcs-requerido
				  		k-ng-disabled="'true'"
						ng-model="formData.datosDespues.IdRegimenFondoMutuo">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_DESCRIPCION</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_DESCRIPCION"
				  		maxlength="100"
				  		bcs-requerido
						ng-model="formData.datosDespues.Descripcion">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_VALIDA_PORTAFOLIO_CLIENTE</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.ValidaPortafolioCliente"
			  			id-defecto="formData.datosAntes.ValidaPortafolioCliente">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_VALIDA_PORTAFOLIO_AGF</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.ValidaPortafolioAGF"
			  			id-defecto="formData.datosAntes.ValidaPortafolioAGF">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERMITE_RESCATE</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.PermiteRescate"
			  			id-defecto="formData.datosAntes.PermiteRescate">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERMITE_APORTE</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.PermiteAporte"
			  			id-defecto="formData.datosAntes.PermiteAporte">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERMITE_TRASPASO</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.PermiteTraspaso"
			  			id-defecto="formData.datosAntes.PermiteTraspaso">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_VALIDAR_MONTO_MINIMO_INSTRUMENTO</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.ValidaMontoMinimoInstrumento"
			  			id-defecto="formData.datosAntes.ValidaMontoMinimoInstrumento">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERMITE_MANDATO_LIQUIDACION</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.RescateConMandato"
			  			id-defecto="formData.datosAntes.RescateConMandato">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERMITE_MANDATO_LIQUIDACION_CAMBIO_REGIMEN</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-si-no'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.AceptaMandatoEnReinversion"
			  			id-defecto="formData.datosAntes.AceptaMandatoEnReinversion">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-estado-regimenes-ffmm'"
			  			bcs-requerido
			  			id-actual="formData.datosDespues.IdEstado"
			  			id-defecto="formData.datosAntes.IdEstado">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CERTIFICA_SIN_ASOCIADO</label>
					<bcs-combobox-base class="col-xs-8"
									   tipo="'combobox-si-no'"
									   bcs-requerido
									   id-actual="formData.datosDespues.CertificaSinAsociado"
									   id-defecto="formData.datosAntes.CertificaSinAsociado">
					</bcs-combobox-base>
				</div>
				<hr>
				<div class="row">
					<label class="col-xs-4" translate>UI_HOMOLOGACIONNCG365</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_HOMOLOGACIONNCG365"
				  		maxlength="100"				  		
						ng-model="formData.datosDespues.HomologacionNCG365">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_REGIMEN</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-regimen-ffm'"
			  			seleccionado="formData.datosDespues.RegimenSeleccionado"
			  			id-actual="formData.datosDespues.IdRegimen"
			  			id-defecto="formData.datosAntes.IdIdRegimen">
			  		</bcs-combobox-base>
				</div>
				
				<div class="row">	
	    			<div class="col-xs-4 pull-right">
		    			<bcs-button class		= "col-xs-8 pull-right"
							bcs-habilitado		= "true" 
							bcs-auto-desactivar	= "false" 
							bcs-tipo			= "'bcs-button-input-form'"
							bcs-texto			= "'UI_QUITAR' | translate" 
							bcs-clic			= "quitarRegimen()">
						</bcs-button>
					</div>
					<div class="col-xs-4 pull-right">
		    			<bcs-button 
		    				class				= "col-xs-8"
							bcs-habilitado		= "true" 
							bcs-tipo			= "'bcs-button-input-form'"
							bcs-auto-desactivar	= "false" 
							bcs-texto			= "'UI_AGREGAR' | translate" 
							bcs-clic			= "agregarRegimen()">
						</bcs-button>
					</div>
				</div>	
				
				<bcs-grid 
					id="grid-regimen"
				 	configuracion="confRegimen"
					api = "apiGridRegimenesFM"
					seleccionado="datos.kNgModel">
				</bcs-grid>
				<hr>
				<div class="row">
					<label class="col-xs-4" translate>UI_PROPOSITO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-proposito-portafolio'"
						id-actual="formData.datosDespues.PropositoSerieRelacionado"
						id-defecto="formData.datosAntes.PropositoSerieRelacionado"
						todos="'N'"
						seleccionado="formData.datosDespues.PropositoSeleccionado">
					</bcs-combobox-base>
				</div>
				
				<div class="row">	
	    			<div class="col-xs-4 pull-right">
		    			<bcs-button class		= "col-xs-8 pull-right"
							bcs-habilitado		= "true" 
							bcs-tipo			= "'bcs-button-input-form'"
							bcs-auto-desactivar	= "false" 
							bcs-texto			= "'UI_QUITAR' | translate" 
							bcs-clic			= "quitarProposito()">
						</bcs-button>
					</div>
					<div class="col-xs-4 pull-right">
		    			<bcs-button 
		    				class				= "col-xs-8"
							bcs-habilitado		= "true" 
							bcs-tipo			= "'bcs-button-input-form'"
							bcs-auto-desactivar	= "false" 
							bcs-texto			= "'UI_AGREGAR' | translate" 
							bcs-clic			= "agregarProposito()">
						</bcs-button>
					</div>
				</div>	
				
				<bcs-grid 
					id="grid-proposito-portafolio"
				 	configuracion="confPropositoPortafolio"
					api = "apiGridPropositoPortafolioFM"
					seleccionado="datos.propositoPortafoliokNgModel">
				</bcs-grid>
				
				
				
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-4 pull-right" id="AgregarEsquemaDeclaracion_INGRESAR" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="ModificarRegimenFondoMutuo.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="true"
				bcs-clic="modificarRegimen()">
			</bcs-button>	
			<bcs-button class="col-xs-4 pull-right" id="AgregarEsquemaDeclaracion_LIMPIAR"
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_LIMPIAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="limpiar()">
			</bcs-button>
		</div>
	</div>
</div>

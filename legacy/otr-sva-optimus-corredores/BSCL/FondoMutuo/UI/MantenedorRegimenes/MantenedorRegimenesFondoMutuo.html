<div id="MantenedorRegimenesFFMM" class="col-xs-12" ng-controller="MantenedorRegimenesFFMMCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_ESTADO</label>
			  		<bcs-combobox-base class="col-xs-6"
			  			tipo="'combobox-estado-regimenes-ffmm'"
			  			id-actual="filtros.IdEstado"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarRegimenesFM(apiGridRegimenesFM,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-regimenes-fmm"
			 	configuracion="defaultOptions"
				api = "apiGridRegimenesFM"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">	
				
				<div bcs-grid-detail ng-non-bindable>
					<div style="width: 830px;">
						<uib-tabset> <uib-tab
							heading="{{'UI_PROPOSITO_PORTAFOLIO' | translate}}"> <bcs-grid
							configuracion="confPropositoPortafolio(dataItem)"
							seleccionado="dataItem.seleccionPropositoPortafolio"> </bcs-grid> </uib-tab> <uib-tab
							heading="{{'UI_REGIMEN_DESTINO' | translate}}"> <bcs-grid
							configuracion="confRegimenDestino(dataItem)"
							seleccionado="dataItem.seleccionRegimenDestino">
						</bcs-grid> </uib-tab> </uib-tabset>
					</div>
				</div>		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2" id="MantenedorRegimenesFFMM_IngresarRegimenes" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="modificarRegimenesFM(datos.kNgModel)">
			</bcs-button>	
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div id="EditarParidadValorCuota" class="col-xs-12" ng-controller="EditarParidadCtrl">

<div class="bcs-cuerpo">
	<div class="row">
			<label class="col-xs-3" translate>UI_EDITAR_PARIDAD</label>
			<bcs-input-numero
				id="campoEditarParidad"
				class="col-xs-9"
				decimales="10"
				bcs-requerido="''"
				ng-model="valorParidad"
			></bcs-input-numero>
	</div>
</div>
	
	<div class="row bcs-panel-comandos" style="margin-top: 3rem">
		<bcs-button class="col-xs-2 pull-right" id="EditarParidad_Aceptar" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="'true'" 
			bcs-clic="aceptar()">
		</bcs-button>

		<bcs-button class="col-xs-2 pull-right" id="EditarParidad_Cancelar"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="cancelar()">	
	</div>
</div>

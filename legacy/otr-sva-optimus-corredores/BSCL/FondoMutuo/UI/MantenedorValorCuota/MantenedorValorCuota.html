<div id="MantenedorValorCuota" class="col-xs-12" ng-controller="MantenedorValorCuotaCtrl">
	<div class="row bcs-cuerpo">
		<div kendo-tooltip k-options="toolTipOptions" class="row">
			<bcs-grid 
				id="gridValorCuotaFFMM"
			 	configuracion="defaultOptions"
				api = "apiGridValorCuota"
				seleccionado="filasSelec">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorValorCuota_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR_ARCHIVO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="cargarArchivo()">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_PROCESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="procesarCuotasFFMM()"
				ng-if="habilitaBotonProcesar">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_HISTORICO_CUOTAS' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="historicoCuotasFMM()">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorValorCuota_IngresarInstrumentoFMMAF" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR_ARCHIVO_ALL_FUNDS' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="cargarArchivoAF()">
			</bcs-button>
			<bcs-button class="col-xs-2 pull-right" id="MantenedorValorCuota_EditarParidad"
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="'false'"
				bcs-texto="'UI_EDITAR_PARIDAD' | translate"
				bcs-habilitado="'true'" 
				bcs-clic="editarParidadFFMM()"
				ng-if="habilitaBotonEditarParidad">
			</bcs-button>
			
		</div>
		
	</div>
	
</div>

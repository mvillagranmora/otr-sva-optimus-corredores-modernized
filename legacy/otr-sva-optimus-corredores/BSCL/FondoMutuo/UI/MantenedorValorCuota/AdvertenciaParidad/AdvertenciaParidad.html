<div id="AdvertenciaParidad" class="col-xs-12" ng-controller="AdvertenciaParidadCtrl">

<div class="bcs-cuerpo">
	<div class="row">
			<label class="col-xs-6" translate>Fondos sin paridad editada</label>
	</div>

	<bcs-grid configuracion = "confGrid">
		<div bcs-grid-detail ng-non-bindable>
			<bcs-grid configuracion = "confDetalle(params.fondosSinCambios)">
			</bcs-grid>
		</div>
	</bcs-grid>
</div>
	<div class="row bcs-panel-comandos" style="margin-top: 3rem">
		<bcs-button class="col-xs-3 pull-right" id="AdvertenciaParidad_Aceptar" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="'true'" 
			bcs-clic="aceptar()">
		</bcs-button>

		<bcs-button class="col-xs-3 pull-right" id="AdvertenciaParidad_Cancelar"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="cancelar()">	
	</div>
</div>

<div id="ConsultarOmnibus" class="col-xs-12" ng-controller="ConsultarOmnibusCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA</label>
						<bcs-input-date
							class				= "col-xs-6"
							id					= "UI_FECHA_OPERACION"
							k-ng-model			= "filtros.fechaOmnibus"
							bcs-requerido>
						</bcs-input-date>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_ESTADO</label>
						<bcs-combobox-base
							class				= "col-xs-6"
							tipo				= "'combobox-estado-omnibus-detalle'"
							id-actual			= "filtros.IdEstado"
							id-defecto			= "'0'"
							todos				= "'S'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4 col-xs-offset-1" translate>UI_EMISOR</label>
						<bcs-combobox-base
							class				= "col-xs-6"
							tipo				= "'combobox-emisor'"
							id-actual			= "filtros.IdEmisor"
							filtros				= "formData.filtrosEmisor"
							todos				= "'S'"
							id-defecto			= "'0'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4 col-xs-offset-1" translate>UI_INSTRUMENTO</label>
						<bcs-combobox-buscador-fondos
							class				= "col-xs-6"
							muestra-valor-cuota	= "'N'"
							datos-fondo			= "filtros.FondoMutuo"
							buscar-fondo		= "formData.setFondo"
							id-ventana			= "winID">
						</bcs-combobox-buscador-fondos>
					</div>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button
						class					= "col-xs-12"
						bcs-tipo				= "'bcs-button-search'"
						bcs-auto-desactivar		= "false"
						bcs-texto				= "'UI_BUSCAR' | translate"
						bcs-habilitado			= "true"
						bcs-clic				= "buscar(apiGridSolicitud,filtros)">
					</bcs-button>
				</div>
				<div class="row">
					<bcs-button
						class					= "col-xs-12"
						bcs-tipo				= "'bcs-button-secondary'"
						bcs-auto-desactivar		= "false"
						bcs-texto				= "'UI_LIMPIAR' | translate"
						bcs-habilitado			= "true"
						bcs-clic				= "limpiarFiltros()">
					</bcs-button>
				</div>
			</div>
		</div>
		<div class="row">
			<bcs-grid
				id					= "grid-consulta-omnibus-ffm"
				configuracion		= "defaultOptions"
				fn-doble-click		= "abrirDetalle(datos.kNgModel)"
				api					= "apiGridSolicitud"
				seleccionado		= "datos.kNgModel"
				fn-exportar-excel	= "exportarExcel">
			</bcs-grid>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2" id="ConsultarOmnibus_auotorizar"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_AUTORIZAR' | translate" bcs-habilitado="'true'"
				bcs-clic="autorizarOmnibus(datos.kNgModel)"> </bcs-button>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	
			</bcs-menu>
		</div>
	</div>
</div>

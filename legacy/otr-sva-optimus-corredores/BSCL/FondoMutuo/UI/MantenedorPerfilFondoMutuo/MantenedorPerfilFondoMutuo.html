<div class="col-xs-12" ng-controller="MantenedorPerfilFondoMutuoCtrl as administrarPerfilFondoMutuo">
	<form name="FormMantenedorPerfilFFM" class="filters-formulario">
	   	<div class="row">
			<div class="col-xs-12">
				<div class="row">
		  			<label class="col-xs-2" translate>UI_DATOS_PERFIL</label>
		  		</div>
		  		<hr>
			  	<div class="row">
					<label class="col-xs-2" translate>UI_TIPO_PERFIL</label> 
			  		<bcs-combobox-base class="col-xs-10"
			  			tipo="'combobox-tipo-perfil-ffmm'"
			  			id-actual="administrarPerfilFondoMutuo.formData.IdKeyPerfil"
			  			id-defecto="'PERFIL_COMERCIAL'"
			  			todos="'N'"
			  			bcs-requerido>
			  		</bcs-combobox-base>
				</div>
			  	<div class="row">
			  	    <label class="col-xs-2" translate>UI_PERFIL</label> 
			  		<bcs-combobox-base class="col-xs-10"
			  			tipo="'combobox-perfil'"
			  			id-actual="administrarPerfilFondoMutuo.formData.IdPerfil"
			  			id-defecto="0"
			  			todos="'N'"
			  			bcs-requerido>
			  		</bcs-combobox-base>
		  		</div>
			</div>
		</div>
		</form>
		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
				<bcs-button class="col-xs-2 pull-right" id="BlotterFFM_ingresarFFM" 
					bcs-texto="'UI_GUARDAR' | translate" 
					bcs-habilitado="FormMantenedorPerfilFFM.$valid"
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="true"
					bcs-clic="administrarPerfilFondoMutuo.formData.administrarPerfilFondoMutuo()"
				>
				</bcs-button>	
			</div>
		</div>
</div>

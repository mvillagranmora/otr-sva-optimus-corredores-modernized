<div class="col-xs-12" ng-controller="IngresarFamiliaFFMCtrl as ingresarFamiliaFFM">
	<form name="FormIngresoInstrumentoFFM" class="filters-formulario">
	   	<div class="row">
			<div class="col-xs-12">
			  	<div class="row">
					<label class="col-xs-3" translate>UI_ID_FAMILIA</label> 
			  		<bcs-input-texto class="col-xs-9"
				  		maxlength="40"
				  		bcs-requerido
				  		k-ng-disabled="ingresarFamiliaFFM.parametros.IdFamiliaFondo"
						ng-model="ingresarFamiliaFFM.datosDespues.IdFamiliaFondo">
			  		</bcs-input-texto>
			  	</div>
			  	<div class="row">
					<label class="col-xs-3" translate>UI_NOMBRE_FAMILIA</label> 
			  		<bcs-input-texto class="col-xs-9"
				  		maxlength="40"
				  		bcs-requerido
						ng-model="ingresarFamiliaFFM.datosDespues.NombreFamilia">
			  		</bcs-input-texto>
			  	</div>
			  	<div class="row">
					<label class="col-xs-3" translate>UI_ESTADO</label>
			  		<bcs-combobox-base class="col-xs-9"
			  			tipo="'combobox-estado-familia-ffmm'"
			  			id-actual="ingresarFamiliaFFM.datosDespues.IdEstado"
			  			id-defecto="ingresarFamiliaFFM.datosAntes.IdEstado"
			  			bcs-requerido>
			  		</bcs-combobox-base> 
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-4 pull-right" id="BlotterFFM_ingresarFFM" 
				bcs-texto="'UI_GUARDAR' | translate" 
				bcs-habilitado="FormIngresoInstrumentoFFM.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="true"
				bcs-clic="ingresarFamiliaFFM.formData.ingresarFamiliaFondoMutuo()"
				bcs-blur="formData.resetFoco()">
			</bcs-button>	
		</div>
	</div>
</div>

<div id="MantenedorFamilia" class="col-xs-12" ng-controller="MantenedorFamiliaCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarFamiliasFMM(apiGridFamilias,filtros)"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-familias-fmm"
			 	configuracion="defaultOptions"
			 	fn-doble-click="modificarFamiliasFMM(datos.kNgModel)"
				api = "apiGridFamilias"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_INGRESAR_FAMILIA' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ingresarFamiliaFMM()">
			</bcs-button>	
			<bcs-button class="col-xs-3 " id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR_FAMILIA' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="modificarFamiliaFMM(datos.kNgModel)">
			</bcs-button>	
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div class="row" ng-controller="GenerarCertificado31Ctrl">
	<div class="col-xs-12 bcs-cuerpo">
		<form name="PanelSolicitudInterfaces" class="filters-formulario">
			<div class="row">
					<div >		
						<label class="col-xs-3" translate>UI_CIUDAD</label>
						<bcs-combobox-base 
							id			 = "formCrearPersona_ciudadResidencia"
							class		 = "col-xs-9" 
							cache		 = "true"
							id-actual	 = "formData.ciudad"
							filtros		 = "configData.filtroCiudad"
							id-defecto	 = "formData.valorDefecto"
							tipo		 = "'combobox-ciudad'"
							seleccionado = "formData.ciudadSeleccionado"
							>
						</bcs-combobox-base>
					</div>			
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_SOLICITUD</label>
				<bcs-input-date
					class			= "col-xs-9"
					k-ng-model		= "formData.fecha"
					k-ng-disabled	= "false"					
					>
				</bcs-input-date >
			</div>
			<div class="row bcs-panel-comandos">
				<bcs-button
					class				= "col-xs-3 pull-right"
					id					= "btn_GenerarCertificado31" 
					bcs-tipo			= "'bcs-button-primary'" 
					bcs-auto-desactivar	= "configData.habilitarSolicitar" 
					bcs-texto			= "'UI_SOLICITAR' | translate"
					bcs-habilitado		= "formData.ciudad && formData.fecha"
					bcs-clic			= "cargarCiudadFecha()">
				</bcs-button>	
				<bcs-button 
					id					 = "formCrearPersona_btnCancelar" 
					class				 = "col-xs-2 pull-right" 
					bcs-tipo			 = "'bcs-button-secondary'" 
					bcs-auto-desactivar	 = "false" 
					bcs-texto			 = "'UI_CANCELAR' | translate" 
					bcs-habilitado		 = "true" 
					bcs-clic			 = "cancelar()">
				</bcs-button>		
					
			</div>
		</form>
	</div>
</div>

<div id="PanelPrincipal" class="row" ng-controller="PanelPrincipalCtrl as pc1">
<form class="col-xs-12 form-horizontal">
<br>
	<div class="row">

		<label class="col-xs-4" translate>UI_FECHA</label> 
	  		<bcs-input-date
				class="col-xs-8"
				k-ng-model="pc1.fecha" 
				bcs-requerido>
			</bcs-input-date>
	</div>
	<div class="row">
		<label class="col-xs-4" translate>UI_MOTIVO</label>
		<bcs-combobox-base class="col-xs-8"
					tipo = "'combobox-motivo-anulacion_traspaso-ffmm'"
					id-actual = "pc1.cmbbx.IdMotivo"
					filtros="pc1.cmbbx.Motivo.filtros"
					auto-cargar="true"
					item-post-filtro="'1'"
					id-defecto="pc1.params.PrevDocumento.IdMotivo"
					todos="'N'"
					seleccionado="pc1.cmbbx.IdMotivoObj">
	 	</bcs-combobox-base >		

	</div>
	<br>	

</form>		
	<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px">
			 <bcs-button class="col-xs-4 pull-right"   bcs-tipo="'bcs-button-primary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.anular()">
			 </bcs-button>
			 <bcs-button class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	
</div>

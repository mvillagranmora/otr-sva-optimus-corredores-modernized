<div class="row" ng-controller="LimitesSpotCorredora">
   <div class="row bcs-cuerpo">
	  <div class="row">
	  
	     <!-- INICIO FILTROS -->
		 <div class="col-xs-10">
		    <div class="row">
		      <div class="col-xs-6">
			    <label class="col-xs-3" translate>UI_CLIENTE</label>
				<bcs-combobox-base
						class="col-xs-8"
						id="frmlimitesSpotCorredoraCliente"
						carga-cliente-automatico="'S'"
						id-actual="socioGral.idActual"
						auto-cargar="'true'"
						tipo="oConfiguracionCliente.tipo"
						filtros="oConfiguracionCliente.filtros"                                 
						configuracion= "oConfiguracionCliente.configuracion"                                                    
						seleccionado="oConfiguracionCliente.seleccionado"                                   >
					</bcs-combobox-base>
			  </div>
			  
			  <div class="col-xs-4">					
					<div class="col-xs-4">
					<label style="padding-left: 15px" translate>UI_FECHA</label></div>
					<bcs-input-date class="col-xs-8" id="informacion_limites_FECHA_DESDE" 
						bcs-requerido 								
						k-ng-model		= "filtros.kngFechaInicio" 
						ng-model		= "filtros.FechaInicio"
						k-ng-disabled	= "disabledFechaConsulta">
					</bcs-input-date>				
			  </div>
				
			</div>
		 </div>
		 <!-- FIN FILTROS -->
				
		 <!-- INICIO BOTONES -->
		 <div class="col-xs-2">
		    <div class="row"> 
  			  <bcs-button class="col-xs-12" 
  				 bcs-tipo="'bcs-button-search'" 
  				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_BUSCAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="buscarRegistros()"> 
			  </bcs-button>
		    </div>  
				   
			<div class="row">					
			  <bcs-button class="col-xs-12" 
				 bcs-tipo="'bcs-button-secondary'" 
				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_LIMPIAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="limpiarFiltros()"> 
			  </bcs-button>					
			</div>	  
		 </div>
		 <!-- FIN BOTONES -->		 
	  </div>			
	  
	  
	  <!-- INICIO GRILLA DETALLE REGISTRO -->						
	  <div class="row">
		 <bcs-grid id="grid-Inf-Limites" 
		     configuracion="confBasicaInfLimites"
			 seleccionado="seleccionInfLimites"
			 fn-exportar-excel="exportarExcel"
			 > 
		 </bcs-grid>
	  </div>
	  <!-- FIN GRILLA DETALLE REGISTRO -->
   </div>	
</div>

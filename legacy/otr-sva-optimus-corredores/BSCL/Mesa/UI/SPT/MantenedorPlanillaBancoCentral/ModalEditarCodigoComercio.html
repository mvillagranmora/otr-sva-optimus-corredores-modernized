<div ng-controller="ModalEditarCodigoComercio as edCodigoComercio">
	<form name="formEditarCodigoComercio" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_EDITAR_ESTADO|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<!-- EDITAR ESTADOS -->
			<div class="row">
				<div class="row col-xs-12">
					<label class="col-xs-3" translate>UI_CODIGO_PLANILLA_BANCO_CENTRAL</label>
					<bcs-combobox-base 
						class="col-xs-9"
						id="UI_CODIGO_PLANILLA_BANCO_CENTRAL"
					 	auto-cargar="'true'"
					 	item-post-filtro = "'1'"
					    tipo="'combobox-planilla-banco-central'"
						seleccionado="data.CodigoComercioSeleccionado"
                        id-actual="data.CodigoComercioIdActual"
			        	activado='!(data.bloqueoAnulacion)'
					>
					</bcs-combobox-base>
				</div>
			</div>
			<hr>
			<!-- BOTONES -->
			<div class="row bcs-panel-comandos alignButtonsToRight">
				<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-input-form'"
					bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate"
					bcs-habilitado="true"
					bcs-clic="data.editarCodigoComercio()">
				</bcs-button>
			</div>
		</div>
		<hr>
</div>
</form>
</div>

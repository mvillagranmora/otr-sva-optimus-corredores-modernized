<div ng-controller="IngresarSpotCtrl as ingSpot">
	<bcs-websocket bcs-msg='msgWebsocket(message)'></bcs-websocket>
	<form name="formIngresarSpot" class="filters-formulario">
		<div class="col-xs-12">
			<!-- FILTROS -->
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-8 col-xs-offset-3" translate>{{data.EjemploIngresoRapido}}</label>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<div class="col-xs-6">
							<label class="col-xs-3" translate>UI_INGRESO_RAPIDO</label>
							<bcs-input-texto class="col-xs-8"
								placeholder="'C|V 994/999 13265876-5 1 100000 10 685.25 F'"
								id="UI_INGRESO_RAPIDO" ng-model="data.ingresoRapido"
								ng-focus="data.focoIngresoRapido()"
								ng-blur="data.noFocoIngresoRapido()" k-ng-disabled="'true'">
							</bcs-input-texto>
						</div>
						<div class="col-xs-6">
							<label class="col-xs-3" translate>UI_FECHA_OPERACION</label>
							<bcs-input-date class="col-xs-8" id="UI_FECHA_OPERACION"
								bcs-requerido k-ng-model="data.kngFechaOperacion"
								k-ng-disabled="'true'" k-options="data.fechaOperacionOptions">
							</bcs-input-date>
						</div>
					</div>
					<div class="row">
						<div class="col-xs-12">
							<div class="col-xs-6">
								<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
								<bcs-combobox-base class="col-xs-8"
									id="UI_SOCIO_NEGOCIO" 
									carga-cliente-automatico="'S'"
									bcs-requerido="'true'" 
									auto-cargar="'false'"
									tipo="'combobox-cliente-portafolio-spot'"
									seleccionado="data.oClientePortafolio.seleccionado"
									filtros = "filtrosPortafolio"
					    			id-actual="data.oClientePortafolio.idActual"
					    			id-defecto="data.oClientePortafolio.idDefecto"
									configuracion="data.oClientePortafolio.configuracion"
									cascada1-a="data.oConfiguracionContactos.filtros.IdCliente"				
									cascada1-valor="'IdCliente'"
									activado='(!data.bloqueoAnulacion)&&(!data.bloqueoModificacion)&&(!data.bloqueoSolicitudPuntas)'> 
								</bcs-combobox-base>
							</div>
							<div class="col-xs-6">
								<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
								<bcs-combobox-base class="col-xs-8" id="UI_TIPO_INSTRUMENTO"
									auto-cargar="'false'" bcs-requerido
									tipo="'combobox-tipoinstrumento-mesa'"
									filtros="data.oConfiguracionTipoInstrumento.filtros"
									item-post-filtro="'1'"
									seleccionado="data.tipoInstrumentoSeleccionado"
									id-actual="data.oConfiguracionTipoInstrumento.idActual"
									activado='(!data.bloqueoAnulacion)&&(!data.bloqueoModificacion)&&(!data.bloqueoSolicitudPuntas)'>
								</bcs-combobox-base>
							</div>
						</div>
					</div>
					<div class="row">

						<div class="col-xs-6">
							<label class="col-xs-3" translate>UI_OPERACION</label>
							<bcs-combobox-base class="col-xs-8" bcs-requerido="'true'"
								id="UI_OPERACION" auto-cargar="'true'" id-defecto="'COMSPT'"
								tipo="'combobox-operacion-mesa'"
								id-actual="data.TipoOperacionIdActual"
								filtros="data.oConfiguracionOperacion.filtros"
								seleccionado="data.OperacionSeleccionado"
								activado='( (!data.bloqueoAnulacion)||(!data.bloqueoModificacion)||(!data.bloqueoSolicitudPuntas) ) && (!data.bloqueoSolicitudPuntas)'>
							</bcs-combobox-base>
						</div>
					</div>
				</div>
			</div>
			<hr>

			<!-- DATOS OPERACION -->
			<uib-tabset> <uib-tab

				 active="data.tabDatosOperacionesActive">

					</bcs-input-numero>

				<div class="col-xs-4" tabindex="3">

					<label class="col-xs-5" translate>UI_PARIDAD_CIERRE</label>

						k-ng-disabled="(data.MonedaSecundariaIdActual !== 'CLP')||

						bcs-tipo="'bcs-button-input-form'"

				<div class="col-xs-4">
					<label class="col-xs-5" translate>UI_PARIDAD_COSTO</label>
					<bcs-input-numero class="col-xs-6" id="UI_PARIDAD_COSTO"
						ng-model="data.ParidadCosto" k-ng-model="data.kngParidadCosto"
						simbolo="data.oConfiguracionMoneda.seleccionado.IdMoneda"
						decimales="data.oConfiguracionMoneda.seleccionado.Decimales"
						k-ng-disabled="((data.MonedaSecundariaIdActual||'CLP') === 'CLP') ||
								                (data.tipoInstrumentoSeleccionado.Nemotecnico === 'INTERB') ||
								                (data.tipoInstrumentoSeleccionado.Nemotecnico === 'ARBINT')||(data.bloqueoModificacion)">
					</bcs-input-numero>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-5" translate>UI_MONTO_EQUIVALENTE</label>
					<bcs-input-monetario class="col-xs-6" id="UI_MONTO_EQUIVALENTE"
						ng-model="data.montoEquivalente"
						k-ng-model="data.kngMontoEquivalente"

						decimales="data.MonedaSecundariaSeleccionado.MonedaSecundariaDecimales"
						k-ng-disabled="'true'"> </bcs-input-monetario>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5" translate>UI_MARGEN</label>
					<bcs-input-monetario class="col-xs-6" id="UI_MARGEN"

						k-options="{min : -999999999999, spinners : false}"
						simbolo="data.MonedaSecundariaIdActual"
						decimales="data.MonedaSecundariaSeleccionado.MonedaSecundariaDecimales"
						k-ng-disabled="'true'"> </bcs-input-monetario>
				</div>
			</div>

							item-post-filtro="'1'" tipo="'combobox-planilla-banco-central'"

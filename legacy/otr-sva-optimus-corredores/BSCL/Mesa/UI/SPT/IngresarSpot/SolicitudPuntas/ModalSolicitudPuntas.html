<div id="ModalSolicitudPuntas" ng-controller="ModalSolicitudPuntas" style="padding-right: 0px;">
<form name="formModalSolicitudPuntas" class="col-xs-12 form-horizontal">
	
		
		<div class="row bcs-cuerpo">			
			<!--  <div class="col-xs-12">
				<label class="col-xs-3" translate>UI_PARA</label>
				<bcs-combobox-base
					id="UI_PARA"
					class="col-xs-9" 
					tipo="'combobox-usuario'" 						
					todos="'N'" 
					seleccionado="data.UsuarioAutorizadorSeleccionado" 
					item-post-filtro="'1'">
				</bcs-combobox-base>
			</div> -->
			<div class="col-xs-12">
				<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-input-texto class="col-xs-9"
					id="UI_CLIENTE_PORTAFOLIO"
					ng-model="data.Cliente" 
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			<div class="col-xs-12">
				<label class="col-xs-3" translate>UI_MONEDA_PRINCIPAL</label>
				<bcs-input-texto class="col-xs-9"
					id="UI_MONEDA_PRINCIPAL"
					ng-model="data.IdMoneda" 
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			<div class="col-xs-12" tabindex="0">
				<label class="col-xs-3" translate>UI_MONTO</label>
				<bcs-input-numero class="col-xs-9" 
					id="UI_MONTO_PRINCIPAL"
					k-ng-model="data.Monto" 
					simbolo="parametros.Moneda.IdMonedaPrincipal"
					decimales="parametros.Moneda.MonedaPrincipalDecimales"
					k-ng-disabled="'true'"> 
				</bcs-input-numero>
			</div> 
			<div class="col-xs-12" tabindex="1">
				<label class="col-xs-3" translate>UI_TC_CIERRE</label>
				<bcs-input-numero class="col-xs-9"
					id="UI_TC_CIERRE"
					k-ng-model="data.TipoCambioCierre" 
					simbolo="data.IdMoneda"
					decimales="parametros.Moneda.MonedaPrincipalDecimales"
					k-ng-disabled="'true'">
				</bcs-input-numero>					
			</div>
			<div class="col-xs-12">
				<label class="col-xs-3" translate>UI_TC_COSTO_SOLICITADO</label>
				<bcs-input-numero class="col-xs-9" 
					id="UI_TC_COSTO"
					k-ng-model="data.TipoCambioCosto"
					simbolo="data.IdMoneda"
					decimales="parametros.Moneda.MonedaPrincipalDecimales"
					bcs-requerido="'true'"
					>
				</bcs-input-numero>				
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_OBSERVACIONES</label> <!-- Tipo de proceso / tarea  -->
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<bcs-input-texto class="col-xs-12"
						id="UI_OBSERVACIONES" 
						tipo-campo="'textarea'"
						atributos="margin: 0px; height: 50px; overflow: auto;"
						maxlength="300"
						name="Observaciones"
						ng-model="data.ObservacionSolicitud" >
					</bcs-input-texto>
				</div>
			</div>
		</div>
	
</form>
<div class="row bcs-panel-comandos alignButtonsToRight">
	<bcs-button id={{IdBotonAceptar}} class="col-xs-3" bcs-tipo="'bcs-button-primary'"
		bcs-auto-desactivar="false" bcs-habilitado="formModalSolicitudPuntas.$valid"
		bcs-texto="'UI_ENVIAR_SOLICITUD' | translate" bcs-clic="Aceptar()"></bcs-button>
	<bcs-button id="ModalSolicitud_puntas_cancelar" class="col-xs-3" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
		bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
		bcs-clic="cancelar()"></bcs-button>
</div>
</div>

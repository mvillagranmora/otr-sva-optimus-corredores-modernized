<div ng-controller="ReporteOperacionesFicticias">
	<form name="formReporteOperacionesFicticias" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_REPORTE_OPERACIONES_FICTICIAS|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_FECHA</label>
					<bcs-input-date
						class="col-xs-8"
						id="UI_FECHA"
						ng-model="data.Fecha"
						k-ng-model="data.kngFecha"
						k-options="data.LimiteFecha"
					>
					</bcs-input-date>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base 
							class="col-xs-8"
							id="UI_TIPO_INSTRUMENTO"
							ng-model="prueba"
							auto-cargar="'true'"
							todos="'S'"
							bcs-requerido
						 	item-post-filtro="'1'"
							tipo="'combobox-tipoinstrumento-mesa'"
							filtros="data.oConfiguracionTipoInstrumento.filtros"
							seleccionado="data.tipoInstrumento.seleccionado"
						>
						</bcs-combobox-base >
				</div>
			</div>
			<hr>	
			<div class="row">
				<div class="col-xs-12 alignButtonsToRight">
					<bcs-button  
						bcs-tipo="'bcs-button-input-form'"
						class=col-xs-3
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_GENERAR_REPORTE' | translate"
						bcs-habilitado="true"
						bcs-clic="generarReporteOperacionesFicticias()" 
					>
					</bcs-button>
				</div>
			</div>
		</div>
	</form>
</div>

<div id="IngresoValores" class="row" ng-controller="IngresoValoresCtrl as pYTC">

<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-7"
						id="pYTC_FECHA"
						k-ng-model="pYTC.filtro.Fecha">
					</bcs-input-date>
				</div>
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false"
					bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="pYTC.win.botonActivo" bcs-clic="pYTC.fn.buscar()"></bcs-button>
			</div>
	  	</div>
	</div>
	<br>
		
	<div class="row">
		<bcs-grid
			id="pYTC_GrillaParidadesYTipoCambio"
			configuracion="pYTC.grilla.ParidadesYTipoCambio"
			seleccionado="pYTC.grilla.paridadYTipoCambioSel"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-8">
			<bcs-button id="ParidadesYTipoCambio_grabar" class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_GRABAR' | translate" bcs-habilitado="pYTC.win.botonActivo" bcs-clic="pYTC.fn.grabar()">
			</bcs-button>
		</div>
		<bcs-menu class="col-xs-2 col-xs-offset-2" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel('ParidadesYTipoCambio')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>


</div>

<div id="InfOperacionesPenDatatec" class="row" ng-controller="InfOperacionesPenDatatecCtrl as InOpPeDatc">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-8"
						id="InOpPeDatc_FECHA"
						k-ng-disabled="'true'" 
						k-ng-model="InOpPeDatc.filtro.Fecha">
					</bcs-input-date>
				</div>
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="'true'"
					bcs-auto-desactivar="'false'"
					bcs-clic="InOpPeDatc.fn.buscar()"></bcs-button>
			</div>
	  	</div>
	</div>
	<br>
		
	<div class="row">
		<bcs-grid
			id="InOpPeDatc_GrillaOperacionesPendientesDatatec"
			configuracion="InOpPeDatc.grilla.OperacionesPendientesDatatec"
			seleccionado="InOpPeDatc.grilla.OperacionPendienteDatatecSel"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-8"></div>
		<div class="col-xs-2"></div>
		<bcs-menu class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel('OperacionesPendientesDatatec')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

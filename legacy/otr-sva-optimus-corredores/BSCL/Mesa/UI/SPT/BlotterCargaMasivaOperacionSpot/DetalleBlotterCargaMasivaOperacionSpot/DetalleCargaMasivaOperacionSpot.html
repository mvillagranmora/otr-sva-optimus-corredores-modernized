<div class="col-xs-12" ng-controller="DetalleCargaMasivaOperacionSpotCtrl">
    
    <div class="bcs-cuerpo">
		<!--- INICIO FORMULARIO -->
		<form name="frmDetalleCargaMasivaOperacionSpot" class="col-xs-12 form-horizontal">
			<div class="row">						
				    <div class="row">		    
					  	<table class="table">
					  		<tr>
								<td width="20%"><strong class="align_right" translate>UI_FOLIO_CARGA</strong></td>
							  	<td width="30%"><label class="">{{oCargaMasiva.IdCargaMasiva}}</label></td>					
							  	<td width="20%"><strong class="align_right" translate>UI_FECHA_INGRESO</strong></td>
							  	<td width="30%"><label class="" >{{oCargaMasiva.FechaCarga | kformat:'d'}}</label></td>
							</tr>
							
							<tr>
								<td><strong class="align_right" translate>UI_CANTIDAD_REGISTROS</strong></td>
							  	<td><label class="">{{oCargaMasiva.CantidadRegistros}}</label></td>					
							</tr>
							
							<tr>				
							  	<td><strong class="align_right" translate>UI_TIPO_CARGA</strong></td>
							  	<td><label class="" >{{oCargaMasiva.NombreTipoCargaMasiva}}</label></td>
							  	<td><strong class="align_right" translate>UI_ESTADO</strong></td>
							  	<td><label class="">{{oCargaMasiva.EstadoCargaMasiva }}</label></td>
							</tr>
					  	</table>
				    </div>
							
					<div class="row"><br></div>
														
					<div class="row">
						<bcs-grid 
							id				= "grid-carga-masiva-detalle"
						 	configuracion	= "confBasicaCargaMasivaDetalleOperacionSpot"
							seleccionado	= "seleccionCargaMasivaDetalleOperacionSpot">
						</bcs-grid>
					</div>
			</div>
		</form>
	</div>
	<!--- TERMINO FORMULARIO -->
</div>

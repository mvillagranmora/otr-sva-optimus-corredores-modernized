<div id="PosicionInicialMesaSpt" class="row" ng-controller="PosicionInicialMesaSptCtrl">
	<div class="row">
		<form name="formPosicionInicialMesaSpt" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-8" 
					id="UI_FECHA"
					bcs-requerido
					k-ng-model ="data.kngFecha" 
					k-ng-disabled="'true'"
					k-options ="data.fechaOptions">
				</bcs-input-date>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_MONEDA</label>
				<bcs-combobox-base class="col-xs-8"
					id="UI_MONEDA_PRINCIPAL"
					tipo="'combobox-moneda'"
					auto-cargar="'true'"
					bcs-requerido
					seleccionado="data.oConfiguracionMoneda.seleccionado"
					filtros="data.oConfiguracionMoneda.filtros"
					id-defecto="data.oConfiguracionMoneda.idDefecto"
					id-actual="data.oConfiguracionMoneda.idActual">
				</bcs-combobox-base>
			</div>
			<hr style="margin: 15px 0px 0px">
			
			<div class="row">
				<h5 class="col-xs-12" translate>UI_TIPO_CAMBIO</h5>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_INICIAL</label>
				<bcs-input-numero class="col-xs-8" 
					id="UI_INICIAL"
					bcs-requerido
					ng-model="data.TipoCambioInicial"
					k-ng-model="data.kngTipoCambioInicial"
					decimales="4"> 
				</bcs-input-numero>
			</div>
			<div class="row">					  
				<label class="col-xs-4" translate>UI_CIERRE_INGRESADO</label>
				<bcs-input-numero class="col-xs-8" 
					id="UI_CIERRE_INGRESADO"
					bcs-requerido
					ng-model="data.CierreIngresado"
					k-ng-model="data.kngCierreIngresado"
					decimales="4"> 
				</bcs-input-numero>
			</div>
			<hr style="margin: 15px 0px 0px">
			
			<div class="row">
				<h5 class="col-xs-12" translate>UI_POSICION</h5>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_INICIAL</label>
				<bcs-input-numero class="col-xs-8" 
					id="UI_INICIAL"
					bcs-requerido
					k-options="data.oConfiguracionPosicionInicial"
					ng-model="data.PosicionInicial"
					k-ng-model="data.kngPosicionInicial"
					decimales="4">
				</bcs-input-numero>
			</div>
			<hr style="margin: 15px 0px">
			
			<div class="row alignButtonsToRight">
				<bcs-button class="col-xs-3"
					bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false"
					bcs-texto="'UI_GRABAR' | translate" 
					bcs-habilitado="formPosicionInicialMesaSpt.$valid"
					bcs-clic="data.grabarDatos()">
				</bcs-button>
				<!--bcs-habilitado="data.bloqueoGrabar"-->
			</div>
		</form>
	</div>
</div>

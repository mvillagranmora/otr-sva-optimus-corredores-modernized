<div id="EnvioPuntas" ng-controller="EnvioPuntas" style="padding-right: 0px;">
<form name="formModalEnvioPuntas" class="col-xs-12 form-horizontal">	
		<div class="row bcs-cuerpo">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_SOLICITANTE</label>
						<bcs-input-texto class="col-xs-9"
							id="UI_SOLICITANTE"
							ng-model="data.UsuarioSolicitud" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>				
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-input-texto class="col-xs-9"
							id="UI_CLIENTE_PORTAFOLIO"
							ng-model="data.Cliente" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_MONEDA_PRINCIPAL</label>
						<bcs-input-texto class="col-xs-9"
							id="UI_MONEDA_PRINCIPAL"
							ng-model="data.IdMoneda" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12" tabindex="0">
						<label class="col-xs-3" translate>UI_MONTO</label>
						<bcs-input-numero class="col-xs-9" 
							id="UI_MONTO_PRINCIPAL"
							k-ng-model="data.Monto" 
							simbolo="data.IdMoneda"
							decimales="2"
							k-ng-disabled="'true'"> 
						</bcs-input-numero>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_TC_COSTO_SOLICITUD</label>
						<bcs-input-numero class="col-xs-9" 
							id="UI_TC_COSTO_SOLICITUD"
							k-ng-model="data.TipoCambioCostoSolicitado"
							simbolo="data.IdMoneda"
							decimales="2"
							k-ng-disabled="'true'">
						</bcs-input-numero>				
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_OBSERVACIONES</label> <!-- Tipo de proceso / tarea  -->
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<bcs-input-texto class="col-xs-10"
							id="UI_OBSERVACIONES" 
							tipo-campo="'textarea'"
							atributos="margin: 0px; height: 50px; width:820px; overflow: auto;"
							maxlength="300"
							name="Observaciones"
							ng-model="data.ObservacionSolicitud" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>
				</div>
				<hr>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_TC_COSTO_APROBADO</label>
						<bcs-input-numero class="col-xs-9" 
							id="UI_TC_COSTO_APROBADO"
							k-ng-model="data.TipoCambioCostoAprobado"
							simbolo="data.IdMoneda"
							decimales="2"
							bcs-requerido="'true'"
							>
						</bcs-input-numero>				
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_OBSERVACIONES</label> <!-- Tipo de proceso / tarea  -->
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<bcs-input-texto class="col-xs-10"
							id="UI_OBSERVACIONES_AUTORIZADOR" 
							tipo-campo="'textarea'"
							atributos="margin: 0px; height: 50px; width:820px; overflow: auto;"
							maxlength="300"
							name="Observaciones"
							ng-model="data.ObservacionAutorizador" 
							>
						</bcs-input-texto>
					</div>
				</div>
			</div>			
		</div>
</form>
<div class="row bcs-panel-comandos">
	<bcs-button id={{IdBotonAceptar}} class="col-xs-2" bcs-tipo="'principal'"
		bcs-auto-desactivar="false" bcs-habilitado="formModalEnvioPuntas.$valid"
		bcs-texto="'UI_APROBAR' | translate" bcs-clic="Aceptar()"></bcs-button>
	<bcs-button id="EnvioPuntas_cancelar" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="''"
		bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
		bcs-clic="cancelar()"></bcs-button>
</div>
</div>

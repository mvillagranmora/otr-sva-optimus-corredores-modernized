<div ng-controller="DatatecSpt">
	<form name="formDatatecSpt" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{'DatatecSpot'|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
		<div class="row">
				<label class="col-xs-12" translate>UI_RUTA_ARCHIVO_DATATEC</label>
		</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
		<div class="row">
				<bcs-input-texto class="col-xs-12" 
					id="CargaDatatec_Cargar"
					bcs-mayor-que="'0'" 
					ng-model="data.RutaDatatec"
					k-ng-model="data.kngRutaDatatec"
					k-ng-disabled="'true'"
					></bcs-input-texto>
		</div>
		<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-3">
					<input type="file" 
						ng-model="data.fileName"
						file-reader-datatec="data.fileContent" 
						file-name-datatec="data.fileName"
						style="display:inline"/>
					<bcs-input-texto 
						ng-show="false" 
						tipo-campo="'textarea'" 
						atributos="height:400px;resize:none;width: 100%" 
						ng-model="data.fileContent"	>
					</div>
					<div class="col-xs-5"></div>
					<div class="col-xs-5"></div>
					<div class="col-xs-5"></div>
					</bcs-input-texto>
					<bcs-button 
						class="col-xs-2" 
						bcs-tipo="'principal'"
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_CARGAR_ARCHIVO' | translate" 
						bcs-habilitado="true" 
						bcs-clic="data.cargarArchivo()"
					></bcs-button>
				</div>
		</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
				<div class="row">
					<div class="col-xs-12">
						<bcs-grid 
							id="grid-carga-archivo"
					 		configuracion = "confGrillaLog"
							seleccionado = "seleccionGrillaLog">
						</bcs-grid>
					</div>
				</div>
			<!--  -->
			<hr>
			<div class="row"
				 ng-show="data.texto">
				<label class="col-xs-3" 
				style="font-size: 150%"
				translate>UI_EN_ESPERA</label>
			</div>
			<div class="row">
			<hr>
			<!-- BOTON -->
			<div class="row">
				<div class="row">
					<bcs-button class="col-xs-2" bcs-tipo="'principal'"
						bcs-auto-desactivar="false"
						bcs-texto="'UI_LIMPIAR_LOG' | translate" 
						bcs-habilitado="true"
						bcs-clic="data.limpiarDatos()"	
					></bcs-button>
					<bcs-button class="col-xs-2" bcs-tipo="''"
						bcs-auto-desactivar="false"
						bcs-texto="'UI_SALIR' | translate" 
						bcs-habilitado="true"
						bcs-clic=""	
					></bcs-button>
				</div>
			</div>
		</div>
</div>
</form>
</div>

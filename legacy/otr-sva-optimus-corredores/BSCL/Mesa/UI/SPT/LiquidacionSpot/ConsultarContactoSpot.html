<div ng-controller=ConsultarContactoSpotCtrl>
	<div class="row">
		<!-- Datos Basicos de Contacto-->
		<div class="row col-xs-12">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_NOMBRE</label>
				<label class="col-xs-8" >{{data.Nombre}}</label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_CORREO</label>
				<label class="col-xs-8" >{{data.Correo}}</label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_TELEFONO</label>
				<label class="col-xs-8" >{{data.Telefono}}</label>
			</div>
		</div>
		<hr>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_CALLE</label>
				<label class="col-xs-8" >{{data.Calle}}</label>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_NUMERO</label>
				<label class="col-xs-8" >{{data.NumeroCalle}}</label>
			</div>	
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_CIUDAD</label>
				<label class="col-xs-8" >{{data.NombreCiudad}}</label>
			</div>		
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_PAIS</label>
				<label class="col-xs-8" >{{data.NombrePais}}</label>
			</div>
		</div>
	</div>
 
</div>

<div id="SolicitudTasas" class="row" ng-controller="SolicitudTasasCtrl as sTas">
	<!-- INICIO FILTROS -->
	<div class="row">
		<form name="ModalMantenedorMesas" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-6" k-ng-model="sTas.filtro.Fecha"></bcs-input-datetime>
		  	</div>
		  	<div class="row">
				<label class="col-xs-4" translate>UI_FUENTE</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-fuente'"
					id-actual="sTas.filtro.Codigo"
					id-defecto="sTas.filtro.CodigoDef"
					filtros="sTas.cmbbx.Fuente.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="sTas.filtro.FuenteObj">
				</bcs-combobox-base>
		  	</div>
		</form>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
			<bcs-button id="SolicitudTasas_generarArchivo" class="col-xs-4" bcs-tipo="''" bcs-auto-desactivar="false" 
				bcs-texto="'UI_GENERAR_ARCHIVO' | translate" bcs-habilitado="ModalMantenedorMesas.$valid" bcs-clic="sTas.fn.generarArchivo()">
			</bcs-button>
			<!--
			<bcs-button id="SolicitudTasas_abrirArchivo" class="col-xs-4" bcs-tipo="''" bcs-auto-desactivar="false" 
				bcs-texto="'UI_ABRIR_ARCHIVO' | translate" bcs-habilitado="'true'" bcs-clic="sTas.fn.abrirArchivo()">
			</bcs-button>
			-->
		</div>
	</div>
</div>

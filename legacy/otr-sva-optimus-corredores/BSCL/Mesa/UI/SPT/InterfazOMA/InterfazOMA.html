<div id="SolicitudTasas" class="row" ng-controller="InterfazOMACtrl as InterfazOma">
	<!-- INICIO FILTROS -->
	<div class="row">
		<form name="ModalMantenedorMesas" class="col-xs-12">
			<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-6" k-ng-model="InterfazOma.filtro.Fecha"></bcs-input-datetime>
			</div>
				<div class="col-xs-6">
				<label class="col-xs-2" translate>UI_HORA</label>
				<bcs-input-checkbox class="col-xs-1"
						id="UI_HORA"
						ng-model="InterfazOma.ChkHora"
						k-ng-disabled=""
					>
					</bcs-input-checkbox>
					
				</div>	
			</div>
			<div class="row">
			<div  class="col-xs-6">
				<label class="col-xs-4" translate>UI_HORA_DESDE</label>
				<bcs-input-time class="col-xs-6"
					k-ng-disabled	=	"InterfazOma.ngHora"
					k-ng-model 		=	"datos.fechaDesde"
					ng-model		=	"ngHoraDesde"
					k-options		=	"{format:'HH:mm:ss'}"
					>
				</bcs-input-time>
			</div>
			<div  class="col-xs-6">
				<label class="col-xs-4" translate>UI_HORA_HASTA</label>
				<bcs-input-time class="col-xs-6"
					k-ng-disabled	=	"InterfazOma.ngHora"
					k-ng-model		=   "datos.fechaHasta"
					ng-model		=	"ngHoraHasta"
					k-options		=	"{format:'HH:mm:ss'}"
					>
				</bcs-input-time>
			</div>
		  	</div>		  	
		  	<div class="row">
				<label class="col-xs-2" translate>Formato</label>
				<div class="col-xs-6">
					<bcs-input-checkbox class="col-xs-1"
						id="UI_TXT"
						ng-model="InterfazOma.ChkTXT"
						k-ng-model="InterfazOma.kngChkTXT"
						k-ng-disabled=""
					>
					</bcs-input-checkbox>
					<label class="col-xs-3" translate>UI_TXT</label>
					<bcs-input-checkbox class="col-xs-1"
						id="UI_CSV"
						ng-model="InterfazOma.ChkCSV"
						k-ng-model="InterfazOma.kngChkCSV"
						k-ng-disabled=""
					>
					</bcs-input-checkbox>
					<label class="col-xs-3" translate>UI_CSV</label>
		  		</div>
		  	</div>
		</form>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button 
					id="SolicitudTasas_generarArchivo" 
					class="col-xs-4" 
					bcs-tipo="'bcs-button-input-form'" 
					bcs-auto-desactivar="false"
					bcs-texto="'UI_GENERAR_ARCHIVO' | translate" 
					bcs-habilitado="ModalMantenedorMesas.$valid && InterfazOma.haBoton" 
					bcs-clic="InterfazOma.fn.generarArchivo()"
				>
			</bcs-button>
			<!--
			<bcs-button id="SolicitudTasas_abrirArchivo" class="col-xs-4" bcs-tipo="''" bcs-auto-desactivar="false" 
				bcs-texto="'UI_ABRIR_ARCHIVO' | translate" bcs-habilitado="'true'" bcs-clic="sTas.fn.abrirArchivo()">
			</bcs-button>
			-->
		</div>
	</div>
</div>

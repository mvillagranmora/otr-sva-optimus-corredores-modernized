<div id="ReporteMensualOperaciones" class="row" ng-controller="ReporteMensualOperacionesCtrl as RptMenOpe">
	<!-- INICIO FILTROS -->
	<div class="row">
		<form name="ModalReporteMensualOperaciones" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_PERIODO</label>
					<bcs-input-date
						class="col-xs-9"
						k-Options="RptMenOpe.config.agnoMes"
						k-ng-model="RptMenOpe.data.agnoMes"
						bcs-requerido="'true'"
						todo-dias="'true'">
					</bcs-input-date>
				</div>
			</div>	  	
		  	<div class="row">
				<label class="col-xs-3" translate>Formato</label>
				<div class="col-xs-9">
					<bcs-input-checkbox class="col-xs-1"
						id				=	"UI_TXT"
						ng-model		=	"RptMenOpe.ChkTXT"
						k-ng-model		=	"RptMenOpe.kngChkTXT"
						k-ng-disabled	=	""
					>
					</bcs-input-checkbox>
					<label class="col-xs-3" translate>UI_TXT</label>
					<bcs-input-checkbox class="col-xs-1"
						id				=	"UI_CSV"
						ng-model		=	"RptMenOpe.ChkCSV"
						k-ng-model		=	"RptMenOpe.kngChkCSV"
						k-ng-disabled	=	""
					>
					</bcs-input-checkbox>
					<label class="col-xs-3" translate>UI_CSV</label>
		  		</div>
		  	</div>
		</form>
	</div>
	<hr>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button 
					id="ReporteMensualOperaciones_generarArchivo" 
					class="col-xs-4" 
					bcs-tipo="'bcs-button-input-form'" 
					bcs-auto-desactivar="false"
					bcs-texto="'UI_GENERAR_ARCHIVO' | translate" 
					bcs-habilitado="ModalReporteMensualOperaciones.$valid" 
					bcs-clic="RptMenOpe.fn.generarArchivo()"
				>
			</bcs-button>
		</div>
	</div>
</div>

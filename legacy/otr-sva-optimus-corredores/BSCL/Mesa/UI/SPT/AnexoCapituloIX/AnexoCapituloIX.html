<div ng-controller="AnexoCapituloIX">
	<form name="formAnexoCapituloIX" class="filters-formulario">
		<div class="col-xs-12 bcs-cuerpo">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-6" 
					id="UI_FECHA" bcs-requerido
					k-ng-model ="data.kngFecha" 
					k-ng-disabled="'true'"
					k-options ="data.fechaOptions"
					k-options="data.LimiteFecha"
					> 
				</bcs-input-date>
			</div>
			<div class="col-xs-6" ng-show="data.txtFD">
				<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-6" 
					id="UI_FECHA_DESDE" bcs-requerido
					k-ng-model ="data.kngFechaDesde" 
					k-ng-disabled="data.HabilitaFecha"
					k-options ="data.fechaOptions"
					> 
				</bcs-input-date>
			</div>
		</div>
	</form>
</div>

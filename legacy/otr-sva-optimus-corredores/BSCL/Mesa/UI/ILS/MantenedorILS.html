<div id="mantenedorILS" class="row" ng-controller="MantenedorILSCtrl as mantenedorILS"> 
	<div class="col-xs-12 bcs-cuerpo">
		<div class="row">
			<div class="col-xs-4 col-xs-offset-6">
				<label class="col-xs-4" translate>UI_ILS_MANTENCION</label>
				<bcs-combobox-base 
					auto-cargar="'true'"
					class="col-xs-8"
					filtros="mantenedorILS.filtros"
					id="UI_ILS_MANTENCION"
					tipo="'combobox-operacion-mesa'"
					todos="'S'"
					seleccionado="mantenedorILS.seleccionado"
					item-post-filtro="'1'"
					>
				</bcs-combobox-base>
			</div>
			<div class="col-xs-2">
				<bcs-button  class="col-xs-12" 
					bcs-texto="'UI_ILS_LOG_PROCESO' | translate" 
					bcs-habilitado="'true'"
					bcs-clic="LogProcesoUI()">
				</bcs-button>
			</div>				
		</div>
		<hr>	
		<div class="col-xs-12">			
			<uib-tabset>
				<!-- INICIA TABS -->
				<uib-tab id="TabResultado" heading="{{'UI_ILS_RESULTADOS' | translate}}" select="mantenedorILS.fnTabResultado()">
					<div class="row">
						<div id="PanelResultado" style="padding: 0px 0 10px 0;"></div>
					</div>					
				</uib-tab>
				<uib-tab id="TabConceptos" heading="{{'UI_ILS_CONCEPTOS' | translate}}" select="mantenedorILS.fnTabConceptos()">
					<div class="row">
						<div id="PanelConceptos" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabItems" heading="{{'UI_ILS_ITEMS' | translate}}" select="mantenedorILS.fnTabItems()">
					<div class="row">
						<div id="PanelItems" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabDetalleItem" heading="{{'UI_ILS_DETALLE_ITEM' | translate}}" select="mantenedorILS.fnTabDetalleItem()">
					<div class="row">
						<div id="PanelDetalleItem" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabDetalleCobertura" heading="{{'UI_ILS_DETALLE_COBERTURA' | translate}}"  select="mantenedorILS.fnTabDetalleCobertura()">
					<div class="row">
						<div id="PanelDetalleCobertura" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<!-- FIN TABS -->				
			</uib-tabset>
		</div>
	</div>
</div>

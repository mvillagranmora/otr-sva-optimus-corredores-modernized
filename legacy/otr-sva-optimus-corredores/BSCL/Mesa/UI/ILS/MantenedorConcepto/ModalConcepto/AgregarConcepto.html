<div class="col-xs-12" ng-controller="AgregarConceptoCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarCocepto" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>Id Concepto </label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.idConcepto.trim()!=''"
						ng-model="data.idConcepto">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Concepto </label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.nombreConcepto.trim()!=''"
						ng-model="data.nombreConcepto">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Corto Concepto </label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.nombreCortoConcepto.trim()!=''"
						ng-model="data.nombreCortoConcepto">
					</bcs-input-texto>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">
			<bcs-button class="col-xs-6" bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="formAgregarCaja.$valid" bcs-clic="AgregarCajas()"></bcs-button>
			<bcs-button class="col-xs-6" bcs-tipo="''" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>				
		</div>
	</div>
</div>

<form class="col-xs-12 form-horizontal">
	<div id="MantenedorConcepto" ng-controller="MantenedorConceptoCtrl"	style="padding-right: 0px;">
		<div>
			<!-- Inicia Información de Concepto -->
			<div style="width:500px; float: right;">
				<hr style="margin-bottom:10px">
				<div class="row">
					<label class="col-xs-2" translate>UI_CONCEPTO</label>
					<bcs-input-texto class="col-xs-10" k-ng-disabled="'true'" ng-model="filtro.NombreConcepto"></bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_NOMBRE_CORTO</label>
					<bcs-input-texto class="col-xs-6" k-ng-disabled="'true'" ng-model="filtro.NombreCorto"></bcs-input-texto>
				</div>				
				<hr style="margin-bottom:10px">	
				<div class="row">
					<label class="col-xs-2 text-right" translate>UI_NOMBRE_ITEM</label>
					<bcs-combobox-base 
						activado="habilitado"
						class="col-xs-10"
						filtros=""
						id="IdItem"						
						id-actual="data.Item"
						id-defecto="'0'"
						seleccionado="itemSeleccionado"
						style="padding-left:7px;"						
						tipo="'combobox-item-ils'"
					>
					</bcs-combobox-base>						
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_FACTOR</label>
					<bcs-input-numero class="col-xs-3" 
						k-ng-disabled="inputDisabled" 
						ng-model="Factor"
						k-ng-model="kngFactor"
					>
					</bcs-input-numero>
					<label class="col-xs-2" translate>UI_OPERACION</label>
					<bcs-combobox-base 
						activado="habilitado"
						class="col-xs-3"
						filtros=""
						id="operacionId"						
						id-actual="data.Operacion"
						id-defecto="'0'"
						seleccionado="operacion.seleccionado"
						style="padding-left:7px;"						
						tipo="'combobox-tipo-operacion-ctb'"
					>
					</bcs-combobox-base>
					<bcs-button class="col-xs-2 " 
						bcs-tipo="''"
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="habilitado" 
						bcs-clic="limpiar()"
					>
					</bcs-button>						
				</div>
				<div class="row">
					<bcs-grid id="grid-concepto-configuarcion" 
						configuracion="ConceptoConfiguracion"
						seleccionado="seleccionConceptoConfiguarcion">
					</bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 col-xs-offset-8">
						<bcs-button class="col-xs-6" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'Grabar' | translate"
							bcs-habilitado="habilitado" bcs-clic="agregarConceptoConfiguracion()"></bcs-button>
						<bcs-button class="col-xs-6" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'Eliminar' | translate"
							bcs-habilitado="habilitadoMoneda" bcs-clic="eliminarConceptoConfiguracion()"></bcs-button>
					</div>
				</div>
			</div>
			<!-- Finaliza Información de Concepto -->	
						
			<!-- Inicia Grid Inquierdo Concepto -->
			<div style="float: none; overflow: hidden; padding-right: 10px">
				<div class="row bcs_titulo no-margin">Conceptos</div>
				<!-- Grilla Concepto -->
				<div class="row">
					<bcs-grid id="grid-concepto" 
						configuracion="Concepto"
						seleccionado="seleccionConcepto">
					</bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-6"></div>
					<bcs-button class="col-xs-2" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
						bcs-habilitado="'true'" bcs-clic="agregarConcepto()"></bcs-button>
					<bcs-button class="col-xs-2" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="modificarConcepto()"></bcs-button>
					<bcs-button class="col-xs-2" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="eliminarCaja()"></bcs-button>					
				</div>
			</div>
			<!-- Finaliza Grid Izquierdo Concepto -->			
		</div>
	</div>
</form>

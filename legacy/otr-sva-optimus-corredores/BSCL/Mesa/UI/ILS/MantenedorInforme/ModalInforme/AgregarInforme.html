<div class="col-xs-12" ng-controller="AgregarInformeCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarCaja" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>Id Informe</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.codigoCaja.trim()!=''"
						ng-model="data.codigoCaja">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Informe</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.nombreCaja.trim()!=''"
						ng-model="data.nombreCaja">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Empresa</label>
					<bcs-combobox-base class="col-xs-6" 
						bcs-requerido="oConfiguracionEstadoTesoreria.idActual!='false'"
						auto-cargar="'true'"
						activado = "'false'"
						tipo="oConfiguracionEstadoTesoreria.tipo"
						configuracion= "oConfiguracionEstadoTesoreria.configuracion"
						seleccionado="oConfiguracionEstadoTesoreria.seleccionado"
						id-actual="oConfiguracionEstadoTesoreria.idActual"
						filtros="oConfiguracionEstadoTesoreria.filtros"
						id-defecto="oConfiguracionEstadoTesoreria.idDefecto">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">
			<bcs-button class="col-xs-6" bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="formAgregarCaja.$valid" bcs-clic="AgregarCajas()"></bcs-button>
			<bcs-button class="col-xs-6" bcs-tipo="''" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>				
		</div>
	</div>
</div>

<form class="col-xs-12 form-horizontal">
	<div id="MantenedorInforme" ng-controller="MantenedorInformeCtrl"	style="padding-right: 0px;">
		<div>
			<!-- Inicia Información de Informe -->
			<div style="width:500px; float: right;">
				<hr style="margin-bottom:10px">
				<div class="row">
					<label class="col-xs-2" translate>Informe</label>
					<bcs-input-texto class="col-xs-10" k-ng-disabled="'true'" ng-model="filtro.NombreInforme"></bcs-input-texto>
				</div>
				<hr style="margin-bottom:10px">	
				<div class="row">
					<label class="col-xs-2" translate>Indice </label>
					<bcs-input-texto class="col-xs-1" k-ng-disabled="inputDisabled" ng-model="BuscarIndice"></bcs-input-texto>
					<bcs-button class="col-xs-1" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'BUSCAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="agregarCajaMoneda()"></bcs-button>
					<label class="col-xs-2" translate>Nombre Indice </label>
					<bcs-input-texto class="col-xs-6" k-ng-disabled="'true'" ng-model="NombreIndice"></bcs-input-texto>						
				</div>
				<div class="row">
					<label class="col-xs-2" translate>Orden </label>
					<bcs-input-texto class="col-xs-2" k-ng-disabled="inputDisabled" ng-model="OrdenIndice"></bcs-input-texto>
					<bcs-button class="col-xs-2 col-xs-offset-6" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="limpiar()"></bcs-button>						
				</div>
				<div class="row">
					<bcs-grid id="grid-moneda" 
						configuracion="Moneda"
						seleccionado="seleccionCajaMoneda">
					</bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 col-xs-offset-8">
						<bcs-button class="col-xs-6" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'UI_GRABAR' | translate"
							bcs-habilitado="habilitado" bcs-clic="agregarCajaMoneda()"></bcs-button>
						<bcs-button class="col-xs-6" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="habilitadoMoneda" bcs-clic="modificarCajaMoneda()"></bcs-button>
					</div>
				</div>
			</div>
			<!-- Finaliza Información de Informe -->	
						
			<!-- Inicia Grid Inquierdo Informe -->
			<div style="float: none; overflow: hidden; padding-right: 10px">
				<div class="row bcs_titulo no-margin">Informes</div>
				<!-- Grilla Informe -->
				<div class="row">
					<bcs-grid id="grid-informe" 
						configuracion="Informe"
						seleccionado="seleccionInforme">
					</bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-6 col-xs-offset-6">
						<bcs-button class="col-xs-4" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
							bcs-habilitado="'true'" bcs-clic="agregarInforme()"></bcs-button>
						<bcs-button class="col-xs-4" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate"
							bcs-habilitado="habilitado" bcs-clic="modificarInforme()"></bcs-button>
						<bcs-button class="col-xs-4" bcs-tipo="''"
							bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="habilitado" bcs-clic="eliminarCaja()"></bcs-button>					
					</div>
				</div>
			</div>
			<!-- Finaliza Grid Izquierdo Informe -->			
		</div>
	</div>
</form>

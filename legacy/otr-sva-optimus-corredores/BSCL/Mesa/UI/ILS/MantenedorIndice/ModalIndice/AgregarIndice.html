<div class="col-xs-12" ng-controller="AgregarIndiceCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarCaja" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>Id Indice</label>
					<bcs-input-texto class="col-xs-4" bcs-requerido="data.codigoCaja.trim()!=''"
						ng-model="data.codigoCaja">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Indice</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.nombreCaja.trim()!=''"
						ng-model="data.nombreCaja">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Corto Indice</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.nombreCaja.trim()!=''"
						ng-model="data.nombreCortoIndice">
					</bcs-input-texto>
				</div>				
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">
			<bcs-button class="col-xs-6" bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="formAgregarCaja.$valid" bcs-clic="AgregarCajas()"></bcs-button>
			<bcs-button class="col-xs-6" bcs-tipo="''" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>		
		</div>		
	</div>
</div>

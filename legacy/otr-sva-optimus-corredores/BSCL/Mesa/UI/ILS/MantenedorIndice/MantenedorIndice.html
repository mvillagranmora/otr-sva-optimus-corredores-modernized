<form class="col-xs-12 form-horizontal">
	<div id="MantenedorIndice" ng-controller="MantenedorIndiceCtrl"	style="padding-right: 0px;">
		<!-- Inicia Información de Indice -->
		<div style="width:500px; float: right;">
			<hr style="margin-bottom:10px">		
			<div class="row">
				<label class="col-xs-2" translate>Indice</label>
				<bcs-input-texto class="col-xs-10" k-ng-disabled="'true'" ng-model="filtro.indice"></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>Nombre Corto</label>
				<bcs-input-texto class="col-xs-6" k-ng-disabled="'true'" ng-model="filtro.nombreCorto"></bcs-input-texto>
			</div>
			<hr style="margin-bottom:10px">	
			<div class="row">
				<label class="col-xs-2" translate>Concepto</label>
				<bcs-input-texto class="col-xs-1" k-ng-disabled="inputDisabled" ng-model="BuscarConcepto"></bcs-input-texto>
				<bcs-button class="col-xs-1" bcs-tipo="''"
					bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"
					bcs-habilitado="habilitado" bcs-clic="">
				</bcs-button>
				<label class="col-xs-2" translate>Nombre Concepto</label>
				<bcs-input-texto class="col-xs-6" k-ng-disabled="'false'" ng-model="NombreConcepto"></bcs-input-texto>				
			</div>
			<div class="row">
				<label class="col-xs-1" translate>Posición</label>
				<bcs-combobox-base 
					activado="habilitado"				
					class="col-xs-2"
					filtros=""
					id="posicionId"						
					id-actual="filtro.Posicion"
					id-defecto="'0'"
					seleccionado="saldo.seleccionado"
					tipo="'combobox-tipo-producto-mesa-modulo'"
					todos="'S'">
				</bcs-combobox-base>
				<label class="col-xs-1" translate>Factor</label>
				<bcs-input-texto class="col-xs-2" k-ng-disabled="inputDisabled" ng-model="Factor"></bcs-input-texto>
				<label class="col-xs-1" translate>Operación</label>
				<bcs-combobox-base 
					activado="habilitado"
					class="col-xs-2"
					filtros=""
					id="operacionId"						
					id-actual="filtro.Operacion"
					id-defecto="'0'"
					seleccionado="operacion.seleccionado"
					style="padding-left:7px;"						
					tipo="'combobox-tipo-producto-mesa-modulo'"
					todos="'S'">
				</bcs-combobox-base>				
				<div class="col-xs-2 col-xs-offset-1">
					<bcs-button bcs-auto-desactivar="false"  bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="limpiar()">
					</bcs-button>		
				</div>
			</div>
			<div class="row">
				<bcs-grid id="grid-moneda" 
					configuracion="Moneda"
					seleccionado="seleccionCajaMoneda">
				</bcs-grid>
			</div>
			<div class="row bcs-panel-comandos">
				<div class="col-xs-4 col-xs-offset-8">
					<bcs-button class="col-xs-6" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_GRABAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="agregarCajaMoneda()"></bcs-button>
					<bcs-button class="col-xs-6" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
						bcs-habilitado="habilitadoMoneda" bcs-clic="modificarCajaMoneda()"></bcs-button>
				</div>
			</div>
		</div>
		<!-- Finaliza Información de Indice -->	
						
		<!-- Inicia Grid Izquierdo Indice -->
		<div style="float: none; overflow: hidden; padding-right: 10px">
			<div class="row">
				<bcs-grid id="grid-informe" 
					configuracion="Indice"
					seleccionado="seleccionIndice">
				</bcs-grid>
			</div>
			<div class="row bcs-panel-comandos">
				<div class="col-xs-6 col-xs-offset-6">
					<bcs-button class="col-xs-4" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
						bcs-habilitado="'true'" bcs-clic="agregarIndice()"></bcs-button>
					<bcs-button class="col-xs-4" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="modificarIndice()"></bcs-button>
					<bcs-button class="col-xs-4" bcs-tipo="''"
						bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
						bcs-habilitado="habilitado" bcs-clic="eliminarCaja()"></bcs-button>					
				</div>
			</div>
		</div>
		<!-- Finaliza Grid Izquierdo Indice -->			
	</div>
</form>

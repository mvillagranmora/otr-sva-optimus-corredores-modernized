<div ng-controller="InformeArticulo">
	<form name="formInformeArticulo" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_ARTICULO_FORWARD|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
				<bcs-input-date
					class="col-xs-8"
					id="UI_FECHA_DESDE"
					ng-model="data.FechaDesde"
					k-ng-model="data.kngFechaDesde"
				>
			</div>
			<div class="row">
				</bcs-input-date>
				<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
				<bcs-input-date
					class="col-xs-8"
					id="UI_FECHA_HASTA"
					ng-model="data.FechaHasta"
					k-ng-model="data.kngFechaHasta"
				>
				</bcs-input-date>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_PRODUCTO</label>
				<bcs-combobox-base 
					class="col-xs-8"
					id="UI_TIPO_PRODUCTO"
					auto-cargar="'true'"
					item_post_filtro="'1'"
					todos="'S'"
					tipo="'combobox-tipo-producto'"
					seleccionado="data.tipoProductoSeleccionado"
				>
				</bcs-combobox-base >
			</div>
			<div class="row">
			</div>
			<hr>
			<div class="row alignButtonsToRight">
					<bcs-button  
						bcs-tipo="'bcs-button-input-form'"
						class="col-xs-4"
						bcs-auto-desactivar="'true'" 
						bcs-texto="'UI_PROCESAR' | translate"
						bcs-habilitado="true"
						bcs-clic="generarInformeArticulo84()" 
					>
					</bcs-button>
			</div>
		</div>
	</form>
</div>

<div ng-controller="IngresarForwardCtrl">
	<bcs-websocket bcs-msg='msgWebsocket(message)'></bcs-websocket>

		<div class="col-xs-12 bcs-cuerpo">

				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_INGRESO_RAPIDO</label>
					<bcs-input-texto class="col-xs-8"
						placeholder="'C|V 994/999 13265876-5 1 100000 10 685.25 F'"
						id="UI_INGRESO_RAPIDO" ng-model="data.ingresoRapido"
						k-ng-model="data.kngingresoRapido"
						k-ng-disabled="(bloqueoAnular || bloqueoModificar || bloqueoAnticipo) || (bloqueoIngresoRapido)">
					</bcs-input-texto>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_FECHA_OPERACION</label>
					<bcs-input-date class="col-xs-8" id="UI_FECHA_OPERACION"
						ng-model="data.FechaOperacion" k-ng-model="data.kngFechaOperacion"
						k-options="data.fechaOperacionOptions" k-ng-disabled="'true'">
					</bcs-input-date>
				</div>
			</div>

				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>

						carga-cliente-automatico="'S'"
						bcs-requerido="'true'" 
						auto-cargar="'false'"
						tipo="'combobox-cliente-portafolio'"
						seleccionado="data.oClientePortafolio.seleccionado"
						filtros = "filtrosPortafolio"
		    			id-actual="filtros.IdPortafolio"
		    			id-defecto="data.oClientePortafolio.idDefecto"
						configuracion="data.oClientePortafolio.configuracion"
						cascada1-a="data.oConfiguracionContactos.filtros.IdCliente"				
						cascada1-valor="'IdCliente'"
						activado="(!bloqueoAnular && !bloqueoAnticipo)"> 
					</bcs-combobox-base> 
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base class="col-xs-8" id="UI_TIPO_INSTRUMENTO"
						bcs-requerido="true" auto-cargar="'true'" item_post_filtro="'1'"
						tipo="'combobox-tipoinstrumento-mesa'"
						filtros="data.oConfiguracionTipoInstrumento.filtros"
						seleccionado="data.tipoInstrumentoSeleccionado"
						id-actual="data.tipoInstrumentoIdActual"
						cascada1-a="data.oConfiguracionMedioDePago.filtros.IdInstrumento"
						cascada1-valor="'IdInstrumento'" activado="false">
					</bcs-combobox-base>
				</div>
			</div>

			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_OPERACION</label>
					<bcs-combobox-base class="col-xs-8" bcs-requerido="true"
						id="UI_OPERACION" auto-cargar="'true'" item_post_filtro="'1'"
						tipo="'combobox-operacion-mesa'"
						filtros="data.oConfiguracionOperacion.filtros"
						seleccionado="data.OperacionSeleccionada"
						id-actual="data.OperacionIdActual"
						activado="(!bloqueoAnular && !bloqueoModificar && !bloqueoAnticipo)">
					</bcs-combobox-base>
				</div>
			</div>

			<hr>

			<!-- DATOS OPERACIÃ“N -->
			<uib-tabset> <uib-tab id="idDatosOperacionales"

			<div class="row" style="padding-top: 10px;">
				<div class="col-xs-4">
					<label class="col-xs-5" translate>UI_MONEDA_PRINCIPAL</label>

						tipo="'combobox-moneda-principal'"

						seleccionado="data.oConfiguracionMonedaPrincipal.seleccionado"
						filtros="data.oConfiguracionMonedaPrincipal.filtros"

						cascada1-a="data.oConfiguracionMedioDePago.filtros.IdMonedaPrincipal"
						cascada1-valor="'IdMonedaPrincipal'"
						activado="(!bloqueoAnular && !bloqueoModificar && !bloqueoAnticipo)">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">

						seleccionado="data.oConfiguracionMonedaSecundaria.seleccionado"
						filtros="data.oConfiguracionMonedaSecundaria.filtros"
						id-actual="data.MonedaSecundariaIdActual"
						cascada1-a="data.oConfiguracionMedioDePago.filtros.IdMonedaSecundaria"
						cascada1-valor="'IdMonedaSecundaria'"
						activado="(!bloqueoAnular && !bloqueoModificar && !bloqueoAnticipo)">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-5" translate>UI_MONTO</label>
					<bcs-input-monetario class="col-xs-6" id="UI_MONTO"
						bcs-requerido="true" bcs-mayor-que="'0'"
						k-ng-model="data.kngMonto"
						simbolo="data.oConfiguracionMonedaPrincipal.seleccionado.IdMonedaPrincipal"
						decimales="data.oConfiguracionMonedaPrincipal.seleccionado.MonedaPrincipalCantidadDecimales"
						k-ng-disabled="(bloqueoAnular || bloqueoAnticipo)"
						foco="data.FocoMonto" ng-blur="data.saleMonto()">
					</bcs-input-monetario>
				</div>

				<div
					ng-show="(data.tipoInstrumentoSeleccionado.Nemotecnico === 'SECARE' || data.tipoInstrumentoSeleccionado.Nemotecnico === 'SEINFL')">
					<div class="col-xs-4">
						<label class="col-xs-5" translate>UI_MONTO_INICIAL</label>
						<bcs-input-monetario class="col-xs-6" id="UI_MONTO_INICIAL"
							bcs-requerido="true" bcs-mayor-que="'0'"
							k-ng-model="data.kngMontoInicial"
							simbolo="data.oConfiguracionMonedaSecundaria.seleccionado.IdMonedaSecundaria"
							decimales="data.oConfiguracionMonedaSecundaria.seleccionado.MonedaSecundariaCantidadDecimales"
							k-ng-disabled="(bloqueoAnular || bloqueoAnticipo)">
						</bcs-input-monetario>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-5" translate>UI_MONTO_FINAL</label>
						<bcs-input-monetario class="col-xs-6" id="UI_MONTO_FINAL"
							bcs-requerido="true" bcs-mayor-que="'0'"
							k-ng-model="data.kngMontoFinal"
							simbolo="data.oConfiguracionMonedaSecundaria.seleccionado.IdMonedaSecundaria"

							k-ng-disabled="(bloqueoAnular || bloqueoAnticipo)">
						</bcs-input-monetario>
					</div>
				</div>
			</div>
			<div class="row">

					</bcs-input-date>
				</div>

						id-defecto="data.ModalidadLiquidacionDefecto"
						activado="(!bloqueoAnular && !bloqueoAnticipo) && data.HabilitadoPorCompensacion">

				<div class="col-xs-4">

					</bcs-input-time>
					<!--k-ng-model="data.kngHoraFixing"-->
				</div>

<div ng-controller="EmisionDevengoFWD">
	<form name="formEmisionDevengoFWD" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{'UI_EMISION_DEVENGO_FWD'|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<!-- PARAMETROS INICIALES -->
				<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
					<bcs-input-date class="col-xs-8" 
								id="UI_FECHA_HASTA" bcs-requerido
								k-ng-model ="data.kngFechaHasta" 
								k-ng-disabled="data.HabilitaFechaHasta"
								k-options ="data.LimiteFecha"
								> 
					</bcs-input-date>
				</div>
			</div>
			<div class="row">
			<hr>
			<div class="col-xs-12">
					<bcs-button  class="col-xs-3 pull-right" 
								bcs-tipo="'bcs-button-primary'"
								bcs-texto="'UI_GENERAR' | translate" 
								bcs-habilitado="'true'" 
								bcs-clic="data.generarReporte()">
					</bcs-button>
			</div>
			</div>
	</div>
	</form>

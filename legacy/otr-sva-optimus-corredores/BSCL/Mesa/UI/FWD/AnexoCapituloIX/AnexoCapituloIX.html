<div ng-controller="AnexoCapituloIX">
	<form name="formAnexoCapituloIX" class="filters-formulario">
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
					<bcs-input-date class="col-xs-8" 
						id="UI_FECHA_DESDE" bcs-requerido
						k-ng-model ="data.kngFechaDesde" 
						k-ng-disabled="data.HabilitaFechaDesde"
						k-options ="data.LimiteFecha"
						>
					</bcs-input-date>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
					<bcs-input-date class="col-xs-8" 
						id="UI_FECHA_HASTA" bcs-requerido
						k-ng-model ="data.kngFechaHasta" 
						k-ng-disabled="data.HabilitaFechaHasta"
						k-options ="data.LimiteFecha"
						>
					</bcs-input-date>
				</div>
			</div>
		  	<div class="row">
				<label class="col-xs-4" translate>Formato</label>
				<div class="col-xs-8">
					<bcs-input-checkbox class="col-xs-2"
						id="UI_TXT"
						ng-model="data.ChkTXT"
						k-ng-model="data.kngChkTXT"
						k-ng-disabled="">
					</bcs-input-checkbox>
					<label class="col-xs-3" translate>UI_TXT</label>
					<bcs-input-checkbox class="col-xs-2"
						id="UI_CSV"
						ng-model="data.ChkCSV"
						k-ng-model="data.kngChkCSV"
						k-ng-disabled="">
					</bcs-input-checkbox>
					<label class="col-xs-3" translate>UI_CSV</label>
		  		</div>
		  	</div>
			<div class="row">
				<hr>
				<div class="col-xs-12">
					<bcs-button  class="col-xs-3 pull-right" 
						bcs-tipo="'bcs-button-primary'"
	                    bcs-auto-desactivar="false" 
						bcs-texto="'UI_GENERAR' | translate" 
						bcs-habilitado="formAnexoCapituloIX.$valid"
						bcs-clic="data.generarArchivo()">
					</bcs-button>
				</div>
			</div>
		</div>
	</form>
</div>

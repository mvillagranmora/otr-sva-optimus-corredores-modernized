<div id="ReporteMovimientosDiariosFWDMonedas" class="row" ng-controller="ReporteMovimientosDiarioFWDMonedasCtrl as rMDFWD">
	<form name="ReporteMovimientosDiariosFWDMonedas" class="col-xs-12">
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_FECHA_MOVIMIENTO</label>
				<bcs-input-date class="col-xs-8" 
					id="UI_FECHA_MOVIMIENTO" bcs-requerido
					k-ng-model ="data.kngFechaMovimiento" 
					k-ng-disabled="data.HabilitaFechaMovimiento"
					k-options ="data.LimiteFecha"
					> 
				</bcs-input-date>
			</div>
		</div>
		<div class="row"></div>
		<hr>
		<div class="row alignButtonsToRight">
				<bcs-button class="col-xs-4" 
					bcs-tipo="'bcs-button-input-form'"
					bcs-auto-desactivar="false"
					bcs-texto="'UI_GENERAR' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="data.generarReporte()">
				</bcs-button>
		</div>
	</form>
</div>

<div ng-controller="ValorizacionForward">
	<form name="formValorizacionForward" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_VALORIZACION_FORWARD|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="col-xs-8">
				<label class="col-xs-5" translate>UI_FECHA_PROCESO</label>
				<bcs-input-date
					class="col-xs-7"
					id="UI_FECHA_OPERACION"
					ng-model="data.FechaProceso"
					k-ng-model="data.kngFechaProceso"
					k-options="data.LimiteFechaProceso"
				>
				</bcs-input-date>
			</div>
			<div class="col-xs-4">
				<bcs-button  
					bcs-tipo="'bcs-button-input-form'"
					bcs-auto-desactivar="'true'" 
					bcs-texto="'UI_PROCESAR' | translate"
					bcs-habilitado="true"
					bcs-clic="ValorizacionForward()" 
				>
				</bcs-button>
			</div>
		</div>
	</form>
</div>

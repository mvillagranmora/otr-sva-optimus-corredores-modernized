<div ng-controller="MantenedorCanastaModal as mntCanastaModal">
	<form name="formMantenedorCanastaModal" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_MONEDAS_POR_PRODUCTO|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<!-- MONEDAS POR PRODUCTOS -->
			<div class="row">
				<div class="row">
					<label class="row col-xs-4" translate>UI_MONEDA_PRINCIPAL</label>
					<bcs-combobox-base 
						class="row col-xs-8"
						id="UI_MONEDA"
						auto-cargar="'true'"
						item-post-filtro="'1'"
						tipo="'combobox-moneda-principal'"
					    seleccionado="data.MonedaPrincipalSeleccionado"
					    filtros="data.ConfiguracionMonedaPrincipal.filtros"
	                    id-actual="data.MonedaPrincipalIdActual"
					>
					</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="row col-xs-4" translate>UI_CANASTA</label>
					<bcs-combobox-base 
						class="row col-xs-8"
						id="UI_CANASTA"
						auto-cargar="'true'"
						bcs-requerido="true"
						item-post-filtro="'1'"
						tipo="'combobox-canasta-mesa'"
						filtros="data.ConfiguracionCanasta.filtros"
					    seleccionado="data.CanastaSeleccionado"
	                    id-actual="data.CanastaIdActual"
					>
					</bcs-combobox-base>
				</div>
				<!-- BOTONES -->
				<div class="row bcs-panel-comandos">
					<bcs-button class="col-xs-3 pull-right" 
						bcs-tipo="'bcs-button-primary'"
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_INGRESAR' | translate"
						bcs-habilitado="ValidoDatos()"
						bcs-clic="IngresarCanasta()" 
					>
					</bcs-button>
				</div>
			</div>
		</div>
	</form>
</div>

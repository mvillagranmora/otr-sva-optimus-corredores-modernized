<div ng-controller="MantenedorCanastaFactores as mntCanastaFactores">
	<form name="formMantenedorCanastaFactores" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_CANASTA_FACTORES|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<uib-tabset>
				<uib-tab id="IdCanasta" heading="{{'UI_CANASTA' | translate}}">
					<div class="row">
						<div class="col-xs-9">
						</div>
						<bcs-button class="col-xs-3" 
							bcs-tipo="'bcs-button-search'"
							bcs-auto-desactivar="'true'" 
							bcs-texto="'UI_BUSCAR' | translate"
							bcs-habilitado="true"
							bcs-clic="BuscarCanastas()" 
						>
						</bcs-button>
					</div>
					<div class="row">
						<bcs-grid id="grid-canasta"
							configuracion="confBasicaCanasta"
							seleccionado="ObjSeleccionGrilla.seleccionCanasta"
							>
						</bcs-grid>
					</div>
					<!-- BOTONES -->
					<div class="row bcs-panel-comandos">
						<bcs-button class="col-xs-3 pull-right" 
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_INGRESAR' | translate"
							bcs-habilitado="true"
							bcs-clic="IngresarCanasta()" 
						>
						</bcs-button>
						<bcs-button class="col-xs-3 pull-right" 
							bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="'true'" 
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="(botonEliminarCanastaHabilitado)"
							bcs-clic="EliminarCanasta()" 
						>
						</bcs-button>
					</div>
				</uib-tab>
				<uib-tab id="IdFactores" heading="{{'UI_FACTORES' | translate}}">
					<div class="row">
						<label class="col-xs-2" translate>UI_CANASTA</label>
						<bcs-combobox-base 
							class="row col-xs-7"
							id="UI_CANASTA"
							auto-cargar="'true'"
							item-post-filtro="'1'"
							todos="'S'"
							tipo="'combobox-canasta-mesa'"
							filtros="data.ConfiguracionCanasta.filtros"
						    seleccionado="data.CanastaSeleccionado"
		                    id-actual="data.CanastaIdActual"
						>
						</bcs-combobox-base>
						<bcs-button class="col-xs-3" 
							bcs-tipo="'bcs-button-search'"
							bcs-auto-desactivar="'true'" 
							bcs-texto="'UI_BUSCAR' | translate"
							bcs-habilitado="true"
							bcs-clic="BuscarFactores()" 
						>
						</bcs-button>
					</div>
					<div class="row">
						<bcs-grid id="grid-factores"
							configuracion="confBasicaFactores"
							seleccionado="ObjSeleccionGrilla.seleccionFactores"
							>
						</bcs-grid>
					</div>
					<!-- BOTONES -->
					<div class="row bcs-panel-comandos">
						<bcs-button class="col-xs-3 pull-right" 
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_INGRESAR' | translate"
							bcs-habilitado="true"
							bcs-clic="IngresarFactores()" 
						>
						</bcs-button>
						<bcs-button class="col-xs-3 pull-right" 
							bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="'true'" 
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="true"
							bcs-clic="EliminarFactorCanasta()" 
						>
						</bcs-button>
					</div>
				</uib-tab>
			</uib-tabset>	
		</div>
	</form>
</div>

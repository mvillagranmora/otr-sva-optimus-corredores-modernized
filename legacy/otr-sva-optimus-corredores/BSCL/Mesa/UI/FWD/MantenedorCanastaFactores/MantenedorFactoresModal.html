<div ng-controller="MantenedorFactoresModal as mntFactoresModal">
	<form name="formMantenedorCanastaFactores" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_MONEDAS_POR_PRODUCTO|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
				<label class="col-xs-4" translate>UI_CANASTA</label>
				<bcs-combobox-base 
					class="row col-xs-8"
					id="UI_CANASTA"
					auto-cargar="'true'"
					item-post-filtro="'1'"
					tipo="'combobox-canasta-mesa'"
					filtros="data.ConfiguracionCanasta.filtros"
				    seleccionado="data.CanastaSeleccionado"
                    id-actual="data.CanastaIdActual"
				>
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="row col-xs-4" translate>UI_HASTA</label>
				<bcs-input-numero 
					class="col-xs-8" 
					id="UI_HASTA"
					k-ng-model="data.kngHasta"
				>
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="row col-xs-4" translate>UI_FACTOR</label>
				<bcs-input-numero 
					class="col-xs-8" 
					id="UI_FACTOR"
					k-ng-model="data.kngFactor"
				>
				</bcs-input-numero>
			</div>
			<!-- BOTONES -->
			<div class="row bcs-panel-comandos">
				<bcs-button class="col-xs-3 pull-right" 
					bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_INGRESAR' | translate"
					bcs-habilitado="ValidoDatos()"
					bcs-clic="IngresarFactorCanasta()" 
				>
				</bcs-button>
			</div>

		</div>
	</form>
</div>

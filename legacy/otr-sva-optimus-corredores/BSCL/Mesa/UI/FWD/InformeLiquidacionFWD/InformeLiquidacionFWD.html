<div class="row" ng-controller='InformeLiquidacionFWDCtrl as OperacionFWD'>
    <form name="frmInformeLiquidacionFWD"  class="col-xs-12 form-horizontal">
        <div class="row bcs-cuerpo">
            <div class="col-xs-12">
                <div class="row">
	                <label class="col-xs-4" translate>UI_FECHA</label>
	                <bcs-input-date class="col-xs-8" 
                         id="FechaOperacion"
                         bcs-requerido="true"
                         k-ng-model="data.kngFechaOperacion"
                         k-options = "data.FechaOperacionOpt"
                         todo-dias="'true'">
	                </bcs-input-date>
                </div>
            </div>  
        </div>
        <div class=row></div>
        <hr>
        <div class="row alignButtonsToRight">
            <bcs-button id="frmBuscarOperaciones"  
                class="col-xs-4" 
                bcs-tipo="'bcs-button-input-form'" 
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_GENERAR' | translate"  
                bcs-habilitado="frmInformeLiquidacionFWD.$valid" 
                bcs-clic="data.InformeLiquidacionFWD()">  
            </bcs-button>
        </div>
    </form>
</div>

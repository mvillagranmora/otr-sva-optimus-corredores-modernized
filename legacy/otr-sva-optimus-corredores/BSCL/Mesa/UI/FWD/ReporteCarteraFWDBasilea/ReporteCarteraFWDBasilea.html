<div ng-controller="ReporteCarteraFWDBasilea">
	<form name="formReporteCarteraFWDBasilea" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{'UI_CARTERA_FWD_BASILEA'|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
					<bcs-input-date
						class="col-xs-8" 
						id="UI_FECHA_HASTA" bcs-requerido
						k-ng-model ="data.kngFechaHasta" 
						k-ng-disabled="data.HabilitaFechaHasta"
						k-options ="data.LimiteFecha"> 
					</bcs-input-date>
				</div>
			</div>
			<div class="row"></div>
			<hr>
			<div class="row alignButtonsToRight">
					<bcs-button
						class="col-xs-4" 
						bcs-tipo="'bcs-button-input-form'"
						bcs-texto="'UI_GENERAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-auto-desactivar="false"
						bcs-clic="data.generarReporte()">
					</bcs-button>
			</div>
		</div>
	</form>
</div>

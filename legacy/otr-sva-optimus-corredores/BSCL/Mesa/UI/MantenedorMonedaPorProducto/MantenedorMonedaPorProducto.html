<div ng-controller="MantenedorPorProducto as mntPorProducto">
	<form name="formIngresarSpot" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_MONEDAS_POR_PRODUCTO|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<!-- MONEDAS POR PRODUCTOS -->
			<br>
			<div class="row">
				<div class="col-xs-10">
					<div class="col-xs-6">
						<label class="row col-xs-4" translate>UI_TIPO_PRODUCTO</label>
						<bcs-combobox-base 
							class="row col-xs-7"
							id="UI_TIPO_PRODUCTO"
							auto-cargar="'true'"
							bcs-requerido
							item-post-filtro="'1'"
							tipo="'combobox-tipo-producto-mesa-modulo'"
							filtros="data.oConfiguracionTipoProducto.filtros"
							seleccionado="data.oConfiguracionTipoProducto.seleccionado"
							id-actual="data.oConfiguracionTipoProducto.idActual"
							memoria="IdCodigo"	
							todos="'S'"							
							cascada-a="data.oConfiguracionTipoInstrumento.filtros.IdTipoInstrumento"
							cascada-valor="'IdTipoInstrumento'"
							cascada-defecto=""													
													
						> 
						</bcs-combobox-base >
					</div>
					<div class="col-xs-6">
						<label class="row col-xs-5" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base 
							class="row col-xs-7"
							id="UI_TIPO_INSTRUMENTO"
							ng-model="prueba"
							auto-cargar="'true'"
							bcs-requerido
							item-post-filtro="'1'"
							todos="'S'"
							tipo="'combobox-instrumento-mesa-ui'"
							filtros="data.oConfiguracionTipoInstrumento.filtros"
							seleccionado="data.oConfiguracionTipoInstrumento.seleccionado"
							id-actual="data.oConfiguracionTipoInstrumento.idActual"
							memoria="IdTipoOperacion"
							
							cascada1-a="data.oConfiguracionMonedaPrincipal.filtros.Nemotecnico"
							cascada1-valor="'Nemotecnico'"
							cascada1-defecto=""
							
							cascada2-a="data.oConfiguracionMonedaSecundaria.filtros.Nemotecnico"
							cascada2-valor="'Nemotecnico'"
							cascada2-defecto=""
						> 
						</bcs-combobox-base >
					</div>
					<div class="col-xs-6">
						<label class="row col-xs-4" translate>UI_MONEDA_PRINCIPAL</label>
						<!--  tipo="'combobox-moneda'" -->
						<bcs-combobox-base 
							class="row col-xs-7"
							id="UI_MONEDA_PRINCIPAL"
							auto-cargar="'true'"
							tipo = "'combobox-parmonedas-base'"							
							item-post-filtro="'1'"
							todos="'S'"
							seleccionado="data.oConfiguracionMonedaPrincipal.seleccionado"
							filtros="data.oConfiguracionMonedaPrincipal.filtros"
			    	        id-actual="data.oConfiguracionMonedaPrincipal.idActual"
						>
						</bcs-combobox-base>
					</div>
					<div class="col-xs-6">
						<label class="row col-xs-5" translate>UI_MONEDA_SECUNDARIA</label>
						<bcs-combobox-base 
							class="row col-xs-7"
							id="UI_MONEDA_SECUNDARIA"
							auto-cargar="'true'"
							item-post-filtro="'1'"
							todos="'S'"
							tipo = "'combobox-parmonedas-base'"
							seleccionado="data.oConfiguracionMonedaSecundaria.seleccionado"
							filtros="data.oConfiguracionMonedaSecundaria.filtros"
			            	id-actual="data.oConfiguracionMonedaSecundaria.idActual"
						>
						</bcs-combobox-base>
					</div>
				</div>
				<!-- BOTONES -->
				<div class="col-xs-2">
					<bcs-button class="row col-xs-12" 
						bcs-tipo="'bcs-button-search'"
						bcs-auto-desactivar="'true'" 
						bcs-texto="'UI_BUSCAR' | translate"
						bcs-habilitado="true"
						bcs-clic="data.filtrarMonedaPorProducto()" >
					</bcs-button>
				</div>
			</div>
			<br>
			<hr>
			<!-- DATOS OPERACIÓN -->
			<!-- GRILLA -->
			<div class="row">
				<div class="col-xs-12">
					<bcs-grid 	id="grid-calce" 
								configuracion="confMonedaProducto"
								seleccionado="seleccion"
								fn-exportar-excel = "exportarExcel"
								>
					</bcs-grid>
				</div>
			</div>
			<div class="row bcs-panel-comandos">
					<div class="col-xs-8">
						<bcs-button class="row col-xs-3"
								id="MesaMonedaPorProductoSpot_ingresar" 
								bcs-tipo="'bcs-button-primary'"
								bcs-auto-desactivar="false" 
								bcs-texto="'UI_INGRESAR' | translate"
								bcs-habilitado="true"
								bcs-clic="data.modificarMonedaPorProducto('Crear')" >
							</bcs-button>	
							<bcs-button class="row col-xs-3"
								id="MesaMonedaPorProductoSpot_modificar"  
								bcs-tipo="'bcs-button-secondary'"
								bcs-auto-desactivar="false" 
								bcs-texto="'UI_MODIFICAR' | translate"
								bcs-habilitado="true"
								bcs-clic="data.modificarMonedaPorProducto()" >
							</bcs-button>	
					</div>
					<div class="col-xs-4 alignButtonsToRight">
						<bcs-menu class="col-xs-4" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" bcs-tipo="'bcs-button-secondary'">
							<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
						</bcs-menu>	
					</div>							
			</div>
		</div>
		<hr>
</div>
</form>
</div>

<div id="ModalMetodoEventoPosicion" class="row" ng-controller="ModalMetodoEventoPosicionCtrl as mMEP">
	<div class="row">
		<form name="ModalMetodoEventoPosicion" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_METODO</label>
				<bcs-combobox-base class="col-xs-8"
					id="mMEP_PosicionMRFTipo"
					tipo="'combobox-metodo-posicion-mrf'"
					id-actual="mMEP.datosMetodoEvento.IdMetodo"
					id-defecto="mMEP.datosMetodoEvento.IdMetodoDef"
					filtros="mMEP.cmbbx.PosicionMRF.filtros"
					bcs-requerido
					configuracion="mMEP.cmbbx.PosicionMRF.configuracion"
					seleccionado="mMEP.datosMetodoEvento.PosicionMRFObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_EVENTO</label>
				<bcs-combobox-base class="col-xs-8"
					id="mMEP_Evento"
					tipo="'combobox-evento-posicion'"
					id-actual="mMEP.datosMetodoEvento.IdEvento"
					id-defecto="mMEP.datosMetodoEvento.IdEventoDef"
					filtros="mMEP.cmbbx.Evento.filtros"
					bcs-requerido
					seleccionado="mMEP.datosMetodoEvento.EventoObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_AGRUPACION</label>
				<bcs-combobox-base class="col-xs-8"
					id="mMEP_Agrupacion"
					tipo="'combobox-parametro-mesa'"
					id-actual="mMEP.datosMetodoEvento.IdAgrupacion"
					id-defecto="mMEP.datosMetodoEvento.IdAgrupacionDef"
					filtros="mMEP.cmbbx.Agrupacion.filtros"
					bcs-requerido
					configuracion="mMEP.cmbbx.Agrupacion.configuracion"
					seleccionado="mMEP.datosMetodoEvento.AgrupacionObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					id="mMEP_Estado"
					tipo="'combobox-estado-mesas'"
					id-actual="mMEP.datosMetodoEvento.IdEstado"
					id-defecto="mMEP.datosMetodoEvento.IdEstadoDef"
					filtros="mMEP.cmbbx.Estado.filtros"
					bcs-requerido
					seleccionado="mMEP.datosMetodoEvento.EstadoObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ORDEN_ITEM</label>
				<bcs-input-numero class="col-xs-8"
					id="mMEP_OrdenItem"
					k-ng-model="mMEP.datosMetodoEvento.OrdenItem"
					bcs-requerido
					decimales="0">
				</bcs-input-numero>
			</div>
		</form>
	</div>
	<br>
	<hr>
	<div class="row bcs-panel-buttons alignButtonsToRight">
		<bcs-button id={{mMEP.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalMetodoEventoPosicion.$valid" bcs-clic="mMEP.fn.aceptar();">
		</bcs-button>
		<bcs-button id="ModalMetodoEventoPosicion_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mMEP.fn.cancelar();">
		</bcs-button>
	</div>
</div>

<div id="ModalItemsManualesPosicionMRF" class="row" ng-controller="ModalItemsManualesPosicionMRFCtrl as mIMPM">
	<div class="row">
		<form name="ModalItemsManualesPosicionMRF" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_METODO</label>
				<bcs-combobox-base class="col-xs-7"
					id="mIMPM_PosicionMRFTipo"
					tipo="'combobox-metodo-posicion-mrf'"
					id-actual="mIMPM.datosItemManual.IdMetodo"
					id-defecto="mIMPM.datosItemManual.IdMetodoDef"
					filtros="mIMPM.cmbbx.PosicionMRF.filtros"
					bcs-requerido
					configuracion="mIMPM.cmbbx.PosicionMRF.configuracion"
					seleccionado="mIMPM.datosItemManual.PosicionMRFObj">
				</bcs-combobox-base>
				
			</div>

			<div class="row">
				<label class="col-xs-4" translate>UI_EVENTO</label>
				<bcs-combobox-base class="col-xs-7"
					id="mIMPM_Evento"
					tipo="'combobox-evento-posicion'"
					id-actual="mIMPM.datosItemManual.IdEvento"
					id-defecto="'0'"
					filtros="mIMPM.cmbbx.Evento.filtros"
					todos="'N'"
					bcs-requerido
					configuracion="mIMPM.cmbbx.Evento.configuracion"
					seleccionado="mIMPM.dataFiltros.EventoObj">
				</bcs-combobox-base>
				
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_MONTO_EVENTO</label>
				<bcs-input-numero class="col-xs-7"
					id="mIMPM_MontoEvento"
					k-ng-model="mIMPM.datosItemManual.MontoEvento"
					bcs-requerido
					k-options="{min : -999999999999, spinners : false}"
					decimales="mIMPM.frmCantidadDecimales">
				</bcs-input-numero>			
				<label class="col-xs-1" translate> {{mIMPM.frmTipoReajuste}}</label>			
				
			</div>
		</form>
	</div>
	<br>
	<hr>
	<div class="row bcs-panel-buttons alignButtonsToRight">
		<bcs-button id={{mIMPM.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalItemsManualesPosicionMRF.$valid" bcs-clic="mIMPM.fn.aceptar();">
		</bcs-button>
		<bcs-button id="ModalItemsManualesPosicionMRF_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mIMPM.fn.cancelar();">
		</bcs-button>
	</div>
</div>

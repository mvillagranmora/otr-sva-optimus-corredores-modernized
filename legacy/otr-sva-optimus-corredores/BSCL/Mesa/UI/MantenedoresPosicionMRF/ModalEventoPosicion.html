<div id="ModalEventoPosicion" class="row" ng-controller="ModalEventoPosicionCtrl as mEvPos">
	<div class="row">
		<form name="ModalEventoPosicion" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_OPERACION</label>
				<bcs-combobox-base class="col-xs-8"
					id="mEvPos_Operacion"
					tipo="'combobox-tipo-operacion-posicion'"
					id-actual="mEvPos.datosEvento.IdOperacion"
					id-defecto="mEvPos.datosEvento.IdOperacionDef"
					filtros="mEvPos.cmbbx.Operacion.filtros"
					bcs-requerido
					seleccionado="mEvPos.datosEvento.OperacionObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_EVENTO_POSICION</label>
				<bcs-combobox-base class="col-xs-8"
					id="mEvPos_TipoEvento"
					tipo="'combobox-parametro-mesa'"
					id-actual="mEvPos.datosEvento.IdTipoEvento"
					id-defecto="mEvPos.datosEvento.IdTipoEventoDef"
					filtros="mEvPos.cmbbx.TipoEvento.filtros"
					bcs-requerido
					configuracion="mEvPos.cmbbx.TipoEvento.configuracion" 
					seleccionado="mEvPos.datosEvento.TipoEventoObj">
				</bcs-combobox-base>
			</div>
		  	<div class="row">
		  		<label class="col-xs-4" translate>UI_INDICADOR_ACCION</label>
				<bcs-combobox-base class="col-xs-8"
					id="mEvPos_IndicadorAccion"
					tipo="'combobox-parametro-mesa'"
					id-actual="mEvPos.datosEvento.IndAccion"
					id-defecto="mEvPos.datosEvento.IndAccionDef"
					filtros="mEvPos.cmbbx.IndicadorAccion.filtros"
					bcs-requerido
					configuracion="mEvPos.cmbbx.IndicadorAccion.configuracion" 
					seleccionado="mEvPos.datosEvento.IndicadorAccionObj">
				</bcs-combobox-base>
		  	</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					id="mEvPos_Estado"
					tipo="'combobox-estado-mesas'"
					id-actual="mEvPos.datosEvento.IdEstado"
					id-defecto="mEvPos.datosEvento.IdEstadoDef"
					filtros="mEvPos.cmbbx.Estado.filtros"
					bcs-requerido
					seleccionado="mEvPos.datosEvento.EstadoObj">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<br>
	<hr>
	<div class="row bcs-panel-buttons alignButtonsToRight">
		<bcs-button id={{mEvPos.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalEventoPosicion.$valid" bcs-clic="mEvPos.fn.aceptar();">
		</bcs-button>
		<bcs-button id="ModalEventoPosicion_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mEvPos.fn.cancelar();">
		</bcs-button>
	</div>
</div>

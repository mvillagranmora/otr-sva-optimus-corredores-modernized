<div id="ModalTipoOperacionPosicion" class="row" ng-controller="ModalTipoOperacionPosicionCtrl as mTOP">
	<div class="row">
		<form name="ModalTipoOperacionPosicion" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_PRODUCTO</label>
				<bcs-combobox-base class="col-xs-8"
					id="mTOP_TipoProducto"
					tipo="'combobox-tipo-producto'"
					id-actual="mTOP.datosTipoOpePos.IdTipoProducto"
					id-defecto="mTOP.datosTipoOpePos.IdTipoProductoDef"
					filtros="mTOP.cmbbx.TipoProducto.filtros"
					seleccionado="mTOP.datosTipoOpePos.TipoProductoObj"
					cascada1-a="mTOP.cmbbx.TipoOperacion.filtros.IdTipoProducto"
					cascada1-valor="'IdTipoProducto'">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
				<bcs-combobox-base class="col-xs-8"
					id="mTOP_TipoOperacion"
					tipo="'combobox-tipo-operacion'"
					id-actual="mTOP.datosTipoOpePos.IdTipoOperacion"
					id-post-filtro="mTOP.datosTipoOpePos.IdTipoOperacionDef"
					filtros="mTOP.cmbbx.TipoOperacion.filtros"
					seleccionado="mTOP.datosTipoOpePos.TipoOperacionObj">
				</bcs-combobox-base>
			</div>
		  	<div class="row">
		  		<label class="col-xs-4" translate>UI_TIPO_COMPROBANTE</label>
				<bcs-combobox-base class="col-xs-8"
					id="mTOP_TipoComprobante"
					tipo="'combobox-tipo-comprobante-posicion-mrf'"
					id-actual="mTOP.datosTipoOpePos.IdTipoComprobante"
					id-defecto="mTOP.datosTipoOpePos.IdTipoComprobanteDef"
					filtros="mTOP.cmbbx.TipoComprobante.filtros"
					bcs-requerido
					seleccionado="mTOP.datosTipoOpePos.TipoComprobanteObj">
				</bcs-combobox-base>
		  	</div>
		  	<div class="row">
		  		<label class="col-xs-4" translate>UI_NOMBRE_EVENTO</label>
				<bcs-input-texto class="col-xs-8" 
					ng-model="mTOP.datosTipoOpePos.NombreEvento"
					bcs-requerido>
				</bcs-input-texto>
		  	</div>
		  	<div class="row">
		  		<label class="col-xs-4" translate>UI_TIPO_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					id="mTOP_TipoEstado"
					tipo="'combobox-tipo-estado-posicion-mrf'"
					id-actual="mTOP.datosTipoOpePos.IdTipoEstado"
					id-defecto="mTOP.datosTipoOpePos.IdTipoEstadoDef"
					filtros="mTOP.cmbbx.TipoEstado.filtros"
					bcs-requerido
					seleccionado="mTOP.datosTipoOpePos.TipoEstadoObj">
				</bcs-combobox-base>
		  	</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-estado-mesas'"
					id-actual="mTOP.datosTipoOpePos.IdEstado"
					id-defecto="mTOP.datosTipoOpePos.IdEstadoDef"
					filtros="mTOP.cmbbx.Estado.filtros"
					bcs-requerido
					seleccionado="mTOP.datosTipoOpePos.EstadoObj">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<br>
	<hr>
	<div class="row bcs-panel-buttons alignButtonsToRight">
		<bcs-button id={{mTOP.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalTipoOperacionPosicion.$valid" bcs-clic="mTOP.fn.aceptar();">
		</bcs-button>
		<bcs-button id="ModalTipoOperacionPosicion_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mTOP.fn.cancelar();">
		</bcs-button>
	</div>
</div>

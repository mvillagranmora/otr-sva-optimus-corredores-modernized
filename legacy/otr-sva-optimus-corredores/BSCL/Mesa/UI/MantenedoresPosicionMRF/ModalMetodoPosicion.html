<div id="ModalMetodoPosicion" class="row" ng-controller="ModalMetodoPosicionCtrl as mMetPos">
	<div class="row">
		<form name="ModalMetodoPosicion" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_NOMBRE_METODO</label>
				<bcs-input-texto class="col-xs-8" 
					ng-model="mMetPos.datosMetodo.NombreMetodo"
					bcs-requerido>
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_GLOSA</label>
				<bcs-input-texto class="col-xs-8" 
					ng-model="mMetPos.datosMetodo.Glosa"
					bcs-requerido>
				</bcs-input-texto>
			</div>
		  	<div class="row">
		  		<label class="col-xs-4" translate>UI_TIPO_REAJUSTE</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-tipo-reajuste'"
					id-actual="mMetPos.datosMetodo.IdTipoReajuste"
					id-defecto="mMetPos.datosMetodo.IdTipoReajusteDef"
					filtros="mMetPos.cmbbx.TipoReajuste.filtros"
					todos="'N'"
					bcs-requerido
					configuracion="mMetPos.cmbbx.TipoReajuste.configuracion" 
					seleccionado="mMetPos.datosMetodo.TipoReajusteObj">
				</bcs-combobox-base>
		  	</div>
		  	<div class="row">
		  		<label class="col-xs-4" translate>UI_MESA</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-mesas'"
					id-actual="mMetPos.datosMetodo.IdMesa"
					id-defecto="mMetPos.datosMetodo.IdMesaDef"
					filtros="mMetPos.cmbbx.Mesa.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mMetPos.datosMetodo.MesaObj">
				</bcs-combobox-base>
		  	</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-estado-mesas'"
					id-actual="mMetPos.datosMetodo.IdEstado"
					id-defecto="mMetPos.datosMetodo.IdEstadoDef"
					filtros="mMetPos.cmbbx.Estado.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mMetPos.datosMetodo.EstadoObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ES_POSICION_INICIAL</label>
				<input class="col-xs-8" type="checkbox" ng-model="mMetPos.datosMetodo.esPosicionInicial">
				</label>
			</div>
			<!-- div class="row">
				<label class="col-xs-4" translate>UI_TIPO_POSICION</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-tipo-pos-mesas'"
					id-actual="mMetPos.filtro.IdTipoPosicion"
					id-defecto="'0'"
					filtros="mMetPos.cmbbx.TipoPos.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mMetPos.datosMetodo.TipoPosObj">
				</bcs-combobox-base>
			</div-->
		</form>
	</div>
	<br>
	<hr>
	<div class="row bcs-panel-buttons alignButtonsToRight">
		<bcs-button id={{mMetPos.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalMetodoPosicion.$valid" bcs-clic="mMetPos.fn.aceptar();">
		</bcs-button>
		<bcs-button id="ModalMetodoPosicion_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mMetPos.fn.cancelar();">
		</bcs-button>
	</div>
</div>

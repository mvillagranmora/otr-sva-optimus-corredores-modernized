<div id="PanelOperadoresMesa" class="row" ng-controller="PanelOperadoresMesaCtrl as pOM">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
		  		<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_MESA</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-mesas'"
						id-actual="pOM.filtro.Codigo"
						id-defecto="'0'"
						filtros="pOM.cmbbx.Mesa.filtros"
						todos="'S'"
						configuracion="pOM.cmbbx.Mesa.configuracion" 
						seleccionado="pOM.dataFiltros.MesaObj">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" style="text-align:center" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-estado-mesas'"
						id-actual="pOM.filtro.IdEstado"
						id-defecto="'0'"
						filtros="pOM.cmbbx.Estado.filtros"
						todos="'S'"
						seleccionado="pOM.dataFiltros.EstadoObj">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pOM.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pOM.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			configuracion="pOM.grilla.OperadoresMesa"
			seleccionado="pOM.grilla.operadorMesaSel"
			fn-doble-click="pOM.win.modificar(pOM.grilla.operadorMesaSel)"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelOperadoresMesa_agregar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'" bcs-clic="pOM.win.agregar()">
		</bcs-button>
		<bcs-button id="PanelOperadoresMesa_modificar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="pOM.grilla.operadorMesaSel !== undefined" bcs-clic="pOM.win.modificar(pOM.grilla.operadorMesaSel)">
		</bcs-button>
		
		<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel('AgentesOperadoresMesa')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

<div id="MantenedorMesas" ng-controller="MantenedorMesasCtrl as mMesas">
	<form class="col-xs-12 form-horizontal">
		<div class="col-xs-12">
	  		<uib-tabset>
				<uib-tab id="TabMesas" heading="{{'UI_MESAS' | translate}}" select="mMesas.fnTabMesas()">
					<div class="row">
						<div id="PanelMesas" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabOperadoresMesa" heading="{{'UI_AGENTE_OPERADOR_MESA' | translate}}" select="mMesas.fnTabOperadoresMesa()">
					<div class="row">
						<div id="PanelOperadoresMesa" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabFormaPagoMesa" heading="{{'UI_FORMAS_DE_PAGO' | translate}}" select="mMesas.fnTabFormaPagoMesa()">
                    <div class="row">
                        <div id="PanelFormaPagoMesa" style="padding: 0px 0 10px 0;"></div>
                    </div>
                </uib-tab>
			</uib-tabset>
		</div>
	</form>
</div>

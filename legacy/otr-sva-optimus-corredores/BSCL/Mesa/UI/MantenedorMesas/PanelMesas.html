<div id="PanelMesas" class="row" ng-controller="PanelMesasCtrl as pMesas">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
		  		<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_TIPO_PRODUCTO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-tipo-producto-mesa-modulo'"
						id-actual="pMesas.filtro.IdTipoProductoMesaModulo"
						id-defecto="pMesas.filtro.IdTipoProductoMesaModuloDefecto"
						filtros="pMesas.cmbbx.TipoProductoMesaModulo.filtros"
						todos="'S'"
						seleccionado="pMesas.dataFiltros.TipoProductoMesaModuloObj">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" style="text-align:center" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-estado-mesas'"
						id-actual="pMesas.filtro.IdEstado"
						id-defecto="'0'"
						filtros="pMesas.cmbbx.Estado.filtros"
						todos="'S'"
						seleccionado="pMesas.dataFiltros.EstadoObj">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pMesas.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pMesas.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			configuracion="pMesas.grilla.Mesas"
			seleccionado="pMesas.grilla.mesaSel"
			fn-doble-click="pMesas.win.modificar(pMesas.grilla.mesaSel)"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelMesas_agregar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'" bcs-clic="pMesas.win.agregar()">
		</bcs-button>
		<bcs-button id="PanelMesas_modificar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="pMesas.grilla.mesaSel !== undefined && pMesas.grilla.mesaSel.IdEstado !== 'INA'" bcs-clic="pMesas.win.modificar(pMesas.grilla.mesaSel)">
		</bcs-button>
		
		<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel('MantenedorMesas')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

<div id="ModalMantenedorFormaPagoMesa" class="row" ng-controller="ModalMantenedorFormaPagoMesaCtrl as mMFPM">
	<div class="row">
		<div ng-class="mMFPM.win.modoEditar ? 'col-xs-9' : 'col-xs-12'">
			<form name="ModalMantenedorFormaPagoMesa">
				
				<div class="row">
			  		<label class="col-xs-4" translate>UI_TIPO_PRODUCTO</label>
					<bcs-combobox-base class="col-xs-8"
                      tipo="mMFPM.data.oConfiguracionTipoProducto.tipo"
                      seleccionado="mMFPM.data.oConfiguracionTipoProducto.seleccionado"
                      filtros="mMFPM.data.oConfiguracionTipoProducto.filtros"
                      id-actual="mMFPM.data.oConfiguracionTipoProducto.idActual"
                      id-post-filtro="mMFPM.data.oConfiguracionTipoProducto.idPostFiltro"
                      id-defecto="mMFPM.data.oConfiguracionTipoProducto.idDefecto"
                      configuracion= "mMFPM.data.oConfiguracionTipoProducto"
                      todos = "'N'"
                      cascada1-a="mMFPM.data.oConfiguracionTipoOperacion.filtros.IdTipoProducto"
                      cascada1-valor="'IdTipoProductoMesa'"
                      cascada2-a="mMFPM.data.oConfiguracionMoneda.filtros.IdTipoProducto"
                      cascada2-valor="'IdTipoProductoMesa'"
                      cascada3-a="mMFPM.data.oConfiguracionMedioDePago.filtros.IdTipoProducto"
                      cascada3-valor="'IdTipoProductoMesa'"
                      activado = "mMFPM.data.Habilita"
                      bcs-requerido>
                    </bcs-combobox-base>
			  	</div>
			  	<div class="row">
                    <label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
                    <bcs-combobox-base class="col-xs-8"
                      tipo="mMFPM.data.oConfiguracionTipoOperacion.tipo"
                      seleccionado="mMFPM.data.oConfiguracionTipoOperacion.seleccionado"
                      filtros="mMFPM.data.oConfiguracionTipoOperacion.filtros"
                      id-actual="mMFPM.data.oConfiguracionTipoOperacion.idActual"
                      id-post-filtro="mMFPM.data.oConfiguracionTipoOperacion.idPostFiltro"
                      id-defecto="mMFPM.data.oConfiguracionTipoOperacion.idDefecto"
                      configuracion= "mMFPM.data.oConfiguracionTipoOperacion"
                      todos = "'S'"
                      id-defecto="'0'"
                      auto-cargar="'false'" 
                      cascada1-a="mMFPM.data.oConfiguracionMoneda.filtros.IdTipoOperacion"
                      cascada1-valor="'IdTipoOperacion'"
                      cascada2-a="mMFPM.data.oConfiguracionMedioDePago.filtros.IdTipoOperacion"
                      cascada2-valor="'IdTipoOperacion'"
                      activado = "mMFPM.data.Habilita"
                      bcs-requerido>
                    </bcs-combobox-base>
                </div>
                <div class="row">
                    <label class="col-xs-4" translate>UI_MONEDA</label>
                    <bcs-combobox-base class="col-xs-8"
                      tipo="mMFPM.data.oConfiguracionMoneda.tipo"
                      seleccionado="mMFPM.data.oConfiguracionMoneda.seleccionado"
                      filtros="mMFPM.data.oConfiguracionMoneda.filtros"
                      id-actual="mMFPM.data.oConfiguracionMoneda.idActual"
                      id-post-filtro="mMFPM.data.oConfiguracionMoneda.idPostFiltro"
                      id-defecto="mMFPM.data.oConfiguracionMoneda.idDefecto"
                      configuracion= "mMFPM.data.oConfiguracionMoneda"
                      todos = "'S'"
                      id-defecto="'0'"
                      auto-cargar="'false'" 
                      cascada2-a="mMFPM.data.oConfiguracionMedioDePago.filtros.IdMoneda"
                      cascada2-valor="'IdMoneda'"
                      activado = "mMFPM.data.Habilita"
                      bcs-requerido>
                    </bcs-combobox-base>
                </div>
                <div class="row">
                    <label class="col-xs-4" translate>UI_MEDIO_DE_PAGO</label>
                    <bcs-combobox-base class="col-xs-8"
                      tipo="mMFPM.data.oConfiguracionMedioDePago.tipo"
                      seleccionado="mMFPM.data.oConfiguracionMedioDePago.seleccionado"
                      filtros="mMFPM.data.oConfiguracionMedioDePago.filtros"
                      id-actual="mMFPM.data.oConfiguracionMedioDePago.idActual"
                      id-post-filtro="mMFPM.data.oConfiguracionMedioDePago.idPostFiltro"
                      id-defecto="mMFPM.data.oConfiguracionMedioDePago.idDefecto"
                      configuracion= "mMFPM.data.oConfiguracionMedioDePago"
                      todos = "'N'"
                      auto-cargar="'false'" 
                      activado = "mMFPM.data.Habilita"
                      bcs-requerido>
                    </bcs-combobox-base>
                </div>
                <div class="row">
                    <label class="col-xs-4" translate>UI_DIAS</label>
                    <bcs-input-numero class="col-xs-8"
                         bcs-requerido 
                         k-ng-model="mMFPM.data.Dias" 
                         decimales = 0
                         k-options = " { min : 0 } "
                         k-ng-disabled = "!mMFPM.data.Habilita">
                     </bcs-input-numero>
                </div>
                <div class="row">
                    <label class="col-xs-4" translate>UI_NOMBRE</label>
                    <bcs-input-texto class="col-xs-8" 
                        ng-model="mMFPM.data.Nombre"
                        bcs-requerido 
                        k-ng-disabled="false">
                    </bcs-input-texto>
                </div>
			  	<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
	                     tipo="mMFPM.data.oConfiguracionEstado.tipo"
	                     seleccionado="mMFPM.data.oConfiguracionEstado.seleccionado"
	                     filtros="mMFPM.data.oConfiguracionEstado.filtros"
	                     id-actual="mMFPM.data.oConfiguracionEstado.idActual"
	                     id-post-filtro="mMFPM.data.oConfiguracionEstado.idPostFiltro"
	                     id-defecto="mMFPM.data.oConfiguracionEstado.idDefecto"
	                     configuracion= "mMFPM.data.oConfiguracionEstado"
	                     todos = "'N'"
	                     item-post-filtro="'1'">
	                 </bcs-combobox-base>
				</div>
				<div class="row">
			  		<label class="col-xs-4" translate>UI_POR_DEFECTO</label>
					<bcs-input-checkbox 
						ng-model="mMFPM.data.PorDefecto" 
						ng-disabled="mMFPM.data.PorDefectoAsignado">
					</bcs-input-checkbox>
				</div>
			</form>
		</div>
	</div>
	<br>
	
	
	
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button id={{mMFPM.IdBotonAceptar}} class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalMantenedorFormaPagoMesa.$valid" bcs-clic="mMFPM.fn.aceptar();">
			</bcs-button>
			<bcs-button id="ModalMantenedorFormaPagoMesa_cancelar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mMFPM.fn.cancelar();">
			</bcs-button>
		</div>
	</div>
</div>

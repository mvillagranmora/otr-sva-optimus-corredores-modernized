<div id="CierreMesa" class="row" ng-controller="CierreMesaCtrl as cMesa">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
		  		<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_TIPO_PRODUCTO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-tipo-producto-mesa-modulo'"
						id-actual="cMesa.filtro.IdTipoProductoMesaModulo"
						id-defecto="cMesa.filtro.IdTipoProductoMesaModuloDefecto"
						filtros="cMesa.cmbbx.TipoProductoMesaModulo.filtros"
						seleccionado="cMesa.dataFiltros.TipoProductoMesaModuloObj">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row alignButtonsToRight">
				<bcs-button class="col-xs-10" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="cMesa.fn.buscar()"></bcs-button>
			</div>
			<!--
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="cMesa.fn.limpiar()"></bcs-button>
			</div>
			-->
	  	</div>
	</div>
	<hr style="margin: 15px 0px 0px">
	
	
	<div class="row">
		<div class="col-xs-12">
			<div class="col-xs-5">
				<bcs-input-checkbox class="col-xs-1" 
					ng-model="cMesa.win.TodosTpoPrd"
					ng-disabled="false">
				</bcs-input-checkbox>
				<label class="col-xs-3" style="padding-top:4px;" translate>UI_TODOS</label>
			</div>
		</div>
	</div>
	
	
	<div class="row" style="overflow:auto; height:400px; border:1px solid #c9c9c9;">
		<div class="col-xs-12">
			<div class="row" style="padding-left:5px;">
				<h6 class="col-xs-2" translate>UI_MESA</h6>
				<h6 class="col-xs-2" translate>UI_CERRADO</h6>
				<h6 class="col-xs-2" translate>UI_ESTADO_MESA</h6>
				<h6 class="col-xs-2" translate>UI_USUARIO_MODIFICACION</h6>
				<h6 class="col-xs-2" translate>UI_FECHA_MODIFICACION</h6>
				<h6 class="col-xs-2" translate>UI_ESTADO_MODULO</h6>
			</div>
			<hr style="border-top:1px solid #c9c9c9;">
			<div class="row" style="padding-left:5px;">
				<div ng-repeat="mesas in cMesa.data">
					<div class="row">
						<label class="col-xs-2">{{mesas.NombreMesa}}</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="mesas.MesaCerrada" ng-disabled="mesas.ModuloMesaCerrado"></bcs-input-checkbox>
						<label class="col-xs-2">{{mesas.MsjEstadoMesa}}</label>
						<label class="col-xs-2">{{mesas.CodigoUsuario}}</label>
						<label class="col-xs-2">{{mesas.FechaModificacionFrmt}}</label>
						<label class="col-xs-2">{{mesas.MsjEstadoModulo}}</label>
					</div>
				</div>
			</div>
		</div>
	</div>
	<br>
	
	
	<!-- no se usa gilla pues no tiene checkbox 
	<div class="row">
		<bcs-grid
			configuracion="cMesa.grilla.Mesas"
			seleccionado="cMesa.grilla.mesaSel"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	-->
	
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
			<bcs-button id="CierreMesa_grabar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_GRABAR' | translate" bcs-habilitado="'true'" bcs-clic="cMesa.fn.grabar()">
			</bcs-button>
		</div>
		<!--
		<div class="col-xs-2">
			<bcs-button class="col-xs-12 pull-right" bcs-tipo="''" bcs-auto-desactivar="false" 
				bcs-texto="'UI_EXPORTAR' | translate" bcs-habilitado="true" bcs-clic="exportarExcel('CierreMesa')">
			</bcs-button>
		</div>-->
	</div>
</div>

<div class="row" ng-controller='DetalleCargaOperacionTerminoCtrl'>
	<form name="frmBlotterCargaMasiva"  class="col-xs-12 form-horizontal">
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-2 pull-right">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'" bcs-texto="'UI_REFRESCAR' | translate"  bcs-habilitado="'true'" bcs-clic="buscarOperacionesTermino()"></bcs-button>
				</div>
													
			</div>
		</div>
		<div class="row">		
			<bcs-grid id="grid-carga-masiva"
				configuracion 		= "confBasicaOperacionesTermino"
				seleccionado  		= "seleccionOperacionTermino"
				fn-exportar-excel 	= "exportarExcel">
				<div bcs-grid-detail ng-non-bindable>
					<div class="row">
						<uib-tabset> 
							<uib-tab heading="{{'UI_CARTERAS' | translate}}">
								<bcs-grid id="grid-detalle" 
								configuracion="confBasicaOperacionesTerminoDetalle(dataItem)"
								>
								</bcs-grid>
							</uib-tab>
						</uib-tabset>
					</div>
				</div>
			</bcs-grid>
		</div>
		
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="CargaMasivaOperacionTermino_Procesar"  class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false"  bcs-texto="'UI_PROCESAR' | translate"   bcs-habilitado="seleccionOperacionTermino"  bcs-clic="procesarOperacion(seleccionOperacionTermino)"></bcs-button>
		<bcs-button id="CargaMasivaOperacionTermino_Eliminar"  class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false"  bcs-texto="'UI_ELIMINAR' | translate"   bcs-habilitado="seleccionOperacionTermino"  bcs-clic="eliminarOperacion(seleccionOperacionTermino)"></bcs-button>
	</div>
	

	</form>	
</div>

<div id="InformeOperacionesDiariasPactos" class="row" ng-controller="InformeOperacionesDiariasPactosCtrl as iODP">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			 <div class="col-xs-12">
			 	<div class="row">
			 		<label class="col-xs-2" translate>UI_TIPO_BUSQUEDA</label>
					<label class="col-xs-3">
					<input type="checkbox" style="margin-right:5px;" ng-model="data.opDia">{{'UI_MRF_OPERACIONES_POR_DIA' | translate}}
					</label>
					<label class="col-xs-3">
					<input type="checkbox" style="margin-right:5px;" ng-model="data.opFechaEstado">{{'UI_MRF_OPERACIONES_POR_ESTADO_FECHA' | translate}} 
					</label>
					<label class="col-xs-3">
					<input type="checkbox" style="margin-right:5px;" ng-model="data.carterasVigentes">{{'UI_MRF_OPERACIONES_VIGENTES' | translate}}
					</label>	
			 	</div>
		    </div>
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_MESA</label>
					<bcs-combobox-base class="col-xs-7"
						id="UI_MESA"
						tipo="'combobox-mesas'"
						id-actual="iODP.filtro.IdMesa"
						id-defecto="'0'"
						filtros="iODP.cmbbx.Mesa.filtros"
						todos="'S'"
						configuracion="iODP.cmbbx.Mesa.configuracion"
						seleccionado="iODP.dataFiltros.MesaObj">
					</bcs-combobox-base>
					<label class="col-xs-4" translate>UI_ORDENAR_POR</label>
					<bcs-combobox-base class="col-xs-7"
						tipo="'combobox-parametro-mesa'"
						id-actual="iODP.filtro.ValorParametro"
						id-defecto="iODP.filtro.ValorParametroDef"
						filtros="iODP.cmbbx.OrdenarOperaciones.filtros"
						todos="'N'"
						configuracion="iODP.cmbbx.OrdenarOperaciones.configuracion"
						seleccionado="iODP.dataFiltros.OrdenarOperacionesObj">
					</bcs-combobox-base>
					<label class="col-xs-4" translate>UI_CONFIRMA_PACTO</label> 
					<label class="col-xs-4"> 
						<input type="checkbox" ng-model="iODP.pactoConfirmado">
					</label>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-7" auto-cargar="'true'"
						tipo="'combobox-estado-operacion-mesa'" configuracion=""
						seleccionado="iODP.dataFiltros.EstadoObj" filtros="" todos="'S'"
						id-actual="iODP.filtro.IdEstado" item-post-filtro="'1'"
						activado="data.opFechaEstado" id-defecto="'0'">
					</bcs-combobox-base>
					
					<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
					<bcs-input-date class="col-xs-7" k-ng-model="iODP.filtro.Fecha" k-ng-disabled="!data.opFechaEstado" k-options="iODP.options.oConfiguracionFechaDesde"></bcs-input-date>
					
					<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
					<bcs-input-date class="col-xs-7" k-ng-model="iODP.filtro.FechaHasta" k-ng-disabled="!data.opFechaEstado"  k-options="iODP.options.oConfiguracionFechaHasta"></bcs-input-date>
				</div>
			</div>
		
			<div class="row">
				<div class="col-xs-6"></div>
				<div class="col-xs-6"></div>
			</div>
			<div class="row">
				<div class="col-xs-6"></div>
		  		<div class="col-xs-6"></div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-11" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="iODP.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-11" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="iODP.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
	<br>
	<div class="row">
		<bcs-grid
			configuracion="iODP.grilla.OperacionesDiariasPactos"
			seleccionado="iODP.grilla.operacionesDiariasPactosSel"
			fn-exportar-excel="exportarExcel">
			<div bcs-grid-detail ng-non-bindable>
					<uib-tabset> 
						<uib-tab
							heading="{{'UI_SUBYACENTE' | translate}}"> 
							<bcs-grid class="col-xs-6"
								configuracion="iODP.grilla.OperacionesDiariasPactosDetalle(dataItem)"
								seleccionado="iODP.grilla.operacionesDiariasPactosDetalleSel"> 
							</bcs-grid>
						</uib-tab> 
					</uib-tabset>
			</div>
		</bcs-grid>
	</div>
	<br>
	
	<div class="row bcs-panel-buttons">
		<div class="col-xs-8">
			<bcs-button id="InformeOperacionesDiariasPactos_generar"
				class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_GENERAR_INFORME' | translate"
				bcs-habilitado="iODP.win.existenOperaciones"
				bcs-clic="iODP.fn.generarInforme()"> </bcs-button>
			<bcs-button id="InformeOperacionesDiariasPactos_generarCertificado"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				class="col-xs-3"
				bcs-texto="'UI_GENERAR_CERTIFICADO' | translate"
				bcs-habilitado="iODP.win.existenOperacionesVig"
				bcs-clic="iODP.fn.generarCertificado()"> </bcs-button>
		</div>
		<div class="col-xs-2"></div>
		<bcs-menu class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

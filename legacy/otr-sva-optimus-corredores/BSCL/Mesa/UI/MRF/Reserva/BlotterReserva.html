<div class="loaderCSS"></div>

<div class="col-xs-12" ng-controller="BlotterReservaCtrl">
    <form name="frmBlotterReserva"  class="col-xs-12 form-horizontal">

        <div class="row bcs-cuerpo">
            <div class="row">   
                <div class="col-xs-10">
                    <div class="row">   
                        <div class="col-xs-8">
                             <label class="col-xs-2" translate>UI_MESA</label>
                             <bcs-combobox-base class="col-xs-9"
	                            id="UI_MESA_RF"
	                            auto-cargar="'true'"
	                            bcs-requerido
	                            tipo="'combobox-mesas'"
	                            seleccionado="data.oMesasRF.seleccionado"
	                            filtros="data.oMesasRF.filtros"
	                            id-actual="data.oMesasRF.idActual"
	                            todos="'S'"
	                            configuracion= "data.oMesasRF.configuracion"
	                            id-defecto="data.oMesasRF.idDefecto">
	                        </bcs-combobox-base>
                        </div>
                        <div class="col-xs-4">                  
                            <label class="col-xs-4" translate>UI_CODIGO_USUARIO</label>
	                        <bcs-combobox-base class="col-xs-8"
	                            id="UI_USUARIO_MESA_RF"
	                            auto-cargar="'true'"
	                            tipo="'combobox-usuario'"
	                            seleccionado="data.oUsuario.seleccionado"
	                            filtros="data.oUsuario.filtros"
	                            id-actual="data.oUsuario.idActual"
	                            configuracion= "data.oUsuario.configuracion"
	                            id-defecto="data.oUsuario.idDefecto">
	                        </bcs-combobox-base>               
                        </div>
                    </div> 
                    <div class="row">   
                        <div class="col-xs-8">
                             <label class="col-xs-2" translate>UI_CLIENTE</label>
	                         <bcs-combobox-base class="col-xs-9" id="frmMesa_SOCIO_NEGOCIO"
	                            auto-cargar="'true'"
	                            tipo="'combobox-socio-negocio'"
	                            seleccionado="data.oConfiguracionSocioNegocio.seleccionado"
	                            filtros="data.oConfiguracionSocioNegocio.filtros"                           
	                            id-actual="data.oConfiguracionSocioNegocio.idActual"
	                            id-post-filtro="data.oConfiguracionSocioNegocio.idPostFiltro"
	                            id-defecto="data.oConfiguracionSocioNegocio.idDefecto"                          
	                            configuracion= "data.oConfiguracionSocioNegocio.configuracion"
	                            cascada-a="data.oConfiguracionPortafolio.filtros.IdCliente"
	                            cascada-valor="'IdCliente'"
	                            cascada-defecto="-1"
	                            activado = "false">
	                        </bcs-combobox-base>
                        </div>
                        <!-- 
	                    <div class="col-xs-4">
	                        <label class="col-xs-4" translate>UI_PORTAFOLIO</label>
	                         <bcs-combobox-base class="col-xs-8" id="frmMesa_PORTAFOLIO"
	                            auto-cargar="'false'"
	                            tipo="'combobox-portafolio'"
	                            seleccionado="data.oConfiguracionPortafolio.seleccionado"
	                            id-actual="data.oConfiguracionPortafolio.idActual"                              
	                            filtros="data.oConfiguracionPortafolio.filtros"
	                            configuracion= "data.oConfiguracionPortafolio.configuracion"                            
	                            
	                            item-post-filtro="'1'">
	                        </bcs-combobox-base >
	                    </div>--> 
                    </div>
                    
                    <!-- FIN FILTROS -->        
                </div>
                <div class="col-xs-2">
                    <!-- BOTONES -->
                    <bcs-button class="col-xs-12" id="frmBlotterReserva_BUSCAR" 
                        bcs-tipo="'bcs-button-search'"  
                        bcs-auto-desactivar="false" 
                        bcs-texto="'UI_BUSCAR' | translate" 
                        bcs-habilitado="frmBlotterReserva.$valid"   
                        bcs-clic="buscarCarteras(filtros)"> 
                    </bcs-button>
                </div>
            </div>
 
            <div class="row col-xs-12">
                <bcs-grid id="frmCarteraReservada_grid"
                    seleccionado = "seleccionCartera"
                    configuracion = "grid.confBasicaCarteraReservada">
                </bcs-grid>
            </div>
        </div>

        <!-- INICIO PANEL COMANDOS -->
        <div class="row bcs-panel-comandos">
            <bcs-button id="CarteraReservada_Reservar" class="col-xs-2" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-clic="Reservar()" bcs-texto="'UI_RESERVAR' | translate" bcs-habilitado="'false'"></bcs-button>
	        <bcs-button id="CarteraReservada_Liberar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-clic="Liberar()" bcs-texto="'UI_LIBERAR' | translate" bcs-habilitado="'false'"></bcs-button>
	        <bcs-button id="CarteraReservada_Salir" class="col-xs-2 pull-right"  bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-clic="Cancelar()" bcs-texto="'UI_SALIR' | translate" bcs-habilitado="'true'"></bcs-button>       
            
        </div>

    </form> 
</div>

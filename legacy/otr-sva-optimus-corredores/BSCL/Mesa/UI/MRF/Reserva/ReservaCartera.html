<div class="row" ng-controller='ReservaCarteraCtrl'>
<form name="frmBlotterReserva">
	<div id="BlotterReserva">
		<div class="row">
			<div class="col-xs-12">
				<!-- Inicio filtros de búsqueda -->
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_NEMO</label>
						<bcs-input-texto id="Nemo" class="col-xs-3"
							ng-model="data.frmNemo"  
							k-ng-disabled='true'>
						</bcs-input-texto>							
						<label class="col-xs-2 col-xs-offset-1" translate>UI_FOLIO_CARTERA</label>
						<bcs-input-numero class="col-xs-3" id="FolioCartera"
							k-ng-model="data.frmFolioCartera"
							k-ng-readonly='saldoReadOnly'
							decimales = "0" 
							k-ng-disabled = "'false'">
						</bcs-input-numero>	
					</div>
				</div>
	 			
				<div class="row">				
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_EMISOR</label>
						<bcs-input-texto id="Emisor" class="col-xs-3"
							ng-model="data.frmEmisor" 
							k-ng-disabled='true'>
						</bcs-input-texto>													
						<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_VENCIMIENTO</label>
						<bcs-input-date class="col-xs-3" id="FechaVencimiento"
							activado="'false'" 
							k-ng-model="data.frmFechaVencimiento"
							k-ng-disabled = "'true'">
						</bcs-input-date>				
						
					</div>
				</div>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_MERCADO</label>
						<bcs-input-texto id="Emisor" class="col-xs-3" 
						    ng-model="data.frmMercado"
							k-ng-disabled='true'>
						</bcs-input-texto>																			
						<label class="col-xs-2 col-xs-offset-1" translate>UI_CANTIDAD_TOTAL</label>
						<bcs-input-numero class="col-xs-3" id="CantidadTotal"
							k-ng-model="data.frmCantidadTotal"
							k-ng-readonly='saldoReadOnly'
							decimales = "2" 
							k-ng-disabled = "'false'">
						</bcs-input-numero>							
					</div>
				</div>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_TIPO_REAJUSTE</label>
						<bcs-input-texto id="TipoReajuste" class="col-xs-3" 
							ng-model="data.frmTipoReajuste"
							k-ng-disabled='true'>
						</bcs-input-texto>																									
						<label class="col-xs-2 col-xs-offset-1" translate>UI_CANTIDAD_RESERVA</label>
						<bcs-input-numero class="col-xs-3" id="CantidadTotalReservada"
							k-ng-model="data.frmCantidadTotalReservada"
							k-ng-readonly='saldoReadOnly'
							decimales = "2" 
							k-ng-disabled = "'false'">
						</bcs-input-numero>							
					</div>
				</div>
				
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_CORTE_MINIMO</label>
						<bcs-input-numero id="TipoReajuste" class="col-xs-3" 
							k-ng-model="data.frmCorteMinimo"
							decimales="0" 
							k-ng-disabled='true'>
						</bcs-input-numero>																									
													
					</div>
				</div>

				<hr>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_CANTIDAD_DISPONIBLE</label>
						<bcs-input-numero class="col-xs-3" id="CantidadTotalLibre"
							k-ng-model="data.frmCantidadTotalLibre"
							k-ng-readonly='saldoReadOnly'
							decimales = "2" 
							k-ng-disabled = "'false'">
						</bcs-input-numero>		
						<label class="col-xs-3" style="margin-left: 5px;" translate>({{data.frmComentario}})</label>					
					</div>
				</div>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>{{data.frmCantidadSP}}</label>
						<bcs-input-numero class="col-xs-3" id="CantidadAReservar"
						    k-ng-model="data.frmCantidadReserva"
							decimales = "2" >
						</bcs-input-numero>							
					</div>
				</div>
				
			</div>

		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right" bcs-clic="Reservar()" bcs-tipo="'bcs-button-primary'" bcs-texto="data.frmBoton | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>
		<bcs-button class="col-xs-2 pull-right" bcs-clic="Cancelar()" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>		
	</div>
</form>
</div>

<div ng-controller="quincenalDePactosCtrl as quincenalDePactos">
	<form name="formQuincenalDePactos" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_QUINCENAL_DE_PACTOS | translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12 row">
					<div class="col-xs-10">
						<label class="col-xs-2" translate>UI_FECHA</label>
						<bcs-input-date
							class="col-xs-5"
							id="UI_FECHA"
							bcs-requerido
							k-ng-model="data.kngFecha"
							k-options="fecha"
						>
						</bcs-input-date>
					</div>
					<!-- BOTONES -->
					<div class="col-xs-2 alignButtonsToRight">
						<bcs-button class="col-xs-12" 
							bcs-tipo="'bcs-button-search'"
							bcs-auto-desactivar="'true'" 
							bcs-texto="'UI_BUSCAR' | translate"
							bcs-habilitado="true"
							bcs-clic="data.consultarQuincenalDePactos()" >
						</bcs-button>
					</div>
				</div>
			<br><br>
		 	<!-- GRILLA -->
			<div class="row">
				<div class="col-xs-12">
					<bcs-grid 	id="grid-posicionPorMoneda"
								fn-exportar-excel = "exportarExcel" 
								configuracion="confQuincenalDePactos"
								seleccionado="seleccion"
								>
					<!-- fn-exportar-excel = "exportarExcel" -->
					</bcs-grid>
				</div>
			</div>
			<!-- <div class="row bcs-panel-comandos">
					<div class="col-xs-10"></div>
					<div class="col-xs-2">
						<bcs-button  class="col-xs-12" 
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_EXPORTAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="exportarExcel()">
						</bcs-button>
					</div>
			</div> -->
			<!-- BOTONES -->
		<div class="row bcs-panel-buttons">
			<div class=col-xs-6>
				<bcs-button class="col-xs-4" 
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_GRABAR' | translate"
					bcs-habilitado="true" 
					bcs-clic="data.grabarQuincenalDePactos()"	
				></bcs-button>
				<bcs-button class="col-xs-4"
					bcs-tipo="'bcs-button-secondary'"
					bcs-auto-desactivar="'false'" 
					bcs-texto="'UI_GENERAR_REPORTE' | translate"
					bcs-habilitado="true"
					bcs-clic="generarReporteQuinPactos()" 
				>
				</bcs-button>
				<bcs-button class="col-xs-4"
					bcs-tipo="'bcs-button-secondary'"
					bcs-auto-desactivar="'false'" 
					bcs-texto="'UI_ANEXO_XIX' | translate"
					bcs-habilitado="true"
					bcs-clic="data.generarAnexoXIX()" 
				>
				</bcs-button>
			</div>
			<div class=col-xs-6>
				<bcs-menu class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
				<li ng-click="exportarExcel(NombreArchivo)">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
				</bcs-menu>
			</div>
			
		</div>		
	</div>
		</div>
	</form>
</div>

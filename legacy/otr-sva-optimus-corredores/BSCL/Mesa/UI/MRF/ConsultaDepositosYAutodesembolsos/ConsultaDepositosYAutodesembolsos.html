<div id="depositosYAutodesembolsos" ng-controller='depositosYAutodesembolsosCtrl as dya'>
	<div class="row">
		<!-- INICIO FILTROS -->
		<div class="row">
			<label class="col-xs-3" translate>UI_TIPO_OPERACION</label>
			<bcs-combobox-base class="col-xs-9"
				id="frmMesa_TipoOperacion"
			 	auto-cargar="'true'"
			 	bcs-requerido
			    tipo="data.oConfiguracionTipoOperacion.tipo"
			    seleccionado="data.oConfiguracionTipoOperacion.seleccionado"
			    filtros="data.oConfiguracionTipoOperacion.filtros"
	            id-actual="data.oConfiguracionTipoOperacion.idActual"
			    configuracion= "data.oConfiguracionTipoOperacion.configuracion"
				id-defecto="data.oConfiguracionTipoOperacion.idDefecto">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-3" translate>UI_FECHA_DESDE</label>
			<bcs-input-date class="col-xs-3" k-ng-model="dya.filtro.FechaDesde" k-options="dya.options.oConfiguracionFechaDesde"></bcs-input-date>
			
			<label class="col-xs-3" translate>UI_FECHA_HASTA</label>
			<bcs-input-date class="col-xs-3" k-ng-model="dya.filtro.FechaHasta"  k-options="dya.options.oConfiguracionFechaHasta"></bcs-input-date>
		</div>
	<!-- FIN FILTROS -->
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="dia_generar" bcs-tipo="'bcs-button-input-form'" bcs-habilitado="data.oConfiguracionTipoOperacion.seleccionado !== false" class="col-xs-3 pull-right" bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate" bcs-clic="dya.generar()"></bcs-button>
	</div>
</div>

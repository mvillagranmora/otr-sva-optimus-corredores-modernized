<div class="row" ng-controller='BlotterReasignacionMesaRFCtrl'>
	<div class="row bcs-cuerpo">

		<div class="row" style="margin-bottom: 20px;">

			<div class="col-xs-6">
				<!-- INICIO FILTROS -->
				<div class="col-xs-9">

					<div class="row">
						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
							<bcs-combobox-base class="col-xs-8" id="frmMesa_TipoOperacion" auto-cargar="'true'"
								bcs-requerido tipo="data.oConfiguracionTipoOperacion.tipo"
								seleccionado="data.oConfiguracionTipoOperacion.seleccionado"
								filtros="data.oConfiguracionTipoOperacion.filtros"
								id-actual="data.oConfiguracionTipoOperacion.idActual"
								configuracion="data.oConfiguracionTipoOperacion.configuracion"
								id-defecto="data.oConfiguracionTipoOperacion.idActualDef" todos="'S'">
							</bcs-combobox-base>

						</div>
					</div>

					<div class="row">
						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_FECHA</label>
							<bcs-input-date class="col-xs-8" k-ng-model="kngFecha" ng-model="FechaCargaDesde">
							</bcs-input-date>
						</div>
					</div>

				</div>
				<!-- FIN FILTROS -->

				<!-- INICIO BOTONES -->
				<div class="col-xs-3">
					<div class="row">
						<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="'false'"
							bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="btn.BuscarOp"
							bcs-clic="BuscarOperaciones()">
						</bcs-button>
					</div>
					<div class="row">
						<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'"
							bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiarFiltros()">
						</bcs-button>
					</div>

				</div>
				<!-- FIN BOTONES -->
			</div>

			<!-- DETALLE DE LA OPERACION QUE SE ESTA REALIZANDO -->
			<div class="col-xs-6">
				<uib-tabset class="col-xs-12">
					<uib-tab heading="{{ 'UI_INFO_OPERACION' | translate}}" select="">
						<div class="row">

							<label class="col-xs-6">{{ 'UI_TIPO_OPERACION' | translate}}:
								{{infoOperacion.tipoOperacion}}</label>
							<label class="col-xs-6">{{ 'UI_TOTAL_NOMINAL' | translate}}:
								{{infoOperacion.totalNominalEnPantalla}}</label>
							<label class="col-xs-6" id="totalReasignado">{{ 'UI_TOTAL_REASIGNADO' | translate}}:
								{{infoOperacion.totalReasignadoEnPantalla}}</label>
							<label class="col-xs-6">{{ 'UI_DIFERENCIA' | translate}}:
								{{infoOperacion.diferenciaEnPantalla}}</label>

						</div>
					</uib-tab>
				</uib-tabset>
			</div>


		</div>


		<!-- LABELS Y GRILLAS SUPERIOR -->
		<div class="row">

			<!-- GRILLA OPERACIONES -->
			<uib-tabset class="col-xs-6">
				<uib-tab heading="{{ 'UI_OPERACIONES_REASIGNACION' | translate}}" select="select('gridTransacciones')">
					<div class="row">

						<bcs-grid id="grid-reasignacionOP" configuracion="confBasicaReasignacionOp"
							seleccionado="data.seleccionOperaciones" fn-exportar-excel="exportarExcel">
						</bcs-grid>

					</div>
				</uib-tab>
			</uib-tabset>

			<!-- GRILLA CARTERAS -->
			<uib-tabset class="col-xs-6">
				<uib-tab select="updateTabs()" heading="{{ 'UI_DETALLE_OPERACION' | translate}}"
					active="formData.tabClientesActiva">
					<div class="row">

						<bcs-grid id="grid-reasignacionCarteras" configuracion="confBasicaReasignacionCarteras"
							seleccionado="data.seleccionCartera" fn-exportar-excel="exportarExcel">
						</bcs-grid>

					</div>
				</uib-tab>
			</uib-tabset>

		</div>
		<!-- FIN LABELS Y GRILLAS SUPERIOR -->

		<!-- BOTONES INTERMEDIOS GRILLAS SUPERIOR -->
		<div class="row">

			<div class="row">
				<div class="col-xs-6">
					<div class="col-xs-12">
						<bcs-button class="col-xs-3  pull-right" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'"
							bcs-texto="'UI_DETALLE' | translate" bcs-habilitado="btn.Detalle"
							bcs-clic="btnDetalleOperaciones(seleccionOperaciones[0])">
						</bcs-button>
						<bcs-button class="col-xs-3  pull-right" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'"
							bcs-texto="'UI_QUITAR' | translate" bcs-habilitado="btn.QuitarOp"
							bcs-clic="btnQuitarOperaciones(seleccionOperaciones[0])">
						</bcs-button>
					</div>
				</div>
				<div class="col-xs-6">
					<div class="col-xs-12">
						<div>
							<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'"
								bcs-texto="'UI_REASIGNAR' | translate" bcs-habilitado="btn.Reasig"
								bcs-clic="btnReasignarClientes(seleccionCartera[0], seleccionOperaciones[0])">
							</bcs-button>
						</div>

					</div>
				</div>
			</div>

		</div>
		<!-- FIN BOTONES GRILLAS SUPERIOR -->

		<!-- GRILLA REASIGNACIONES -->
		<div class="row">
			<uib-tabset>
				<uib-tab heading="{{ 'UI_REASIGNACIONES' | translate}}">

					<bcs-grid id="grid-reasignados" configuracion="confReasignados"
						seleccionado="data.seleccionReasignados" fn-exportar-excel="exportarExcel">
					</bcs-grid>

				</uib-tab>
			</uib-tabset>
		</div>

		<!-- BOTONES DE GRILLA INFERIOR Y GENERAL -->
		<div class="row bcs-panel-comandos">
			<div class="col-xs-12">
				<bcs-button class="col-xs-1" style="width: 10%;" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'"
					bcs-texto="'UI_QUITAR' | translate" bcs-habilitado="btn.QuitarReasig"
					bcs-clic="btnQuitarReasignacion(seleccionReasignados[0])">
				</bcs-button>
				<bcs-button id="aceptarReasignacionMesa" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="btn.AceptarReasig"
					bcs-clic="btnAceptarReasig()">
				</bcs-button>
			</div>
		</div>

	</div>

	

</div>

<div class="row" ng-controller='SelectorClientesCtrl'>
	<div class="row">
		<div class="col-xs-6">
			<div class="row">

				<div class="col-xs-12">
					<div class="col-xs-12" style="margin-bottom: 5px;">
						<label class="col-xs-3" translate>UI_NOMBRE</label>
						<bcs-input-texto class="col-xs-8" ng-model="nombreCompleto"></bcs-input-texto>
					</div>
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_DOCUMENTO_IDENTIDAD</label>
						<bcs-input-texto class="col-xs-8" ng-model="numeroDocumentoIdentidad"></bcs-input-texto>
					</div>
				</div>

			</div>
		</div>
		<div class="col-xs-4">
			<div class="row">

				<div class="col-xs-10" style="margin-bottom: 5px;">
					<label class="col-xs-5" translate>{{ 'UI_TIPO_REASIGNACION' | translate}}:</label>
					<bcs-input-checkgroup valores="data.opcionesFiltro"
						etiquetas="{opTotal :'UI_TOTAL', opParcial: 'UI_PARCIAL'}" orientacion="H" modo="U"
						activado="'true'"></bcs-input-checkgroup>
				</div>
				<div class="col-xs-10">
					<label class="col-xs-5" translate>{{ 'UI_NOMINALES_REASIGNACION' | translate}}:</label>
					<bcs-input-texto class="col-xs-4" ng-model="cantidadNominales" k-ng-disabled="data.inputCantidad">
					</bcs-input-texto>
				</div>

			</div>
		</div>
		<div class="col-xs-2">
			
					
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false"
					bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="buscarClientesMesaRF()">
				</bcs-button>
			
		</div>
	</div>
	<div class="row">
		<div class="row">
			<bcs-grid configuracion="confBasicaClientesMesaRF" seleccionado="seleccionado">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-1 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
		<bcs-button class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
			bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

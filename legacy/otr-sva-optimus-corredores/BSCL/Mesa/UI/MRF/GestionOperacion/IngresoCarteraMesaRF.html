<div class="col-xs-12" ng-controller="IngresoCarteraMesaRFCtrl">
	<div class="row bcs-cuerpo">
		<form name="frmIngresoNominal" class="col-xs-12 form-horizontal">
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_CLASIFICACION</label>		
				<bcs-input-texto id="Mercado" class="col-xs-9"
					ng-model="dataNominal.GlsMercado"  
					k-ng-disabled='true'>
				</bcs-input-texto>
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_INSTRUMENTO</label>
				<bcs-input-texto id="Instrumento" class="col-xs-9"
					ng-model="dataNominal.GlsInstrumento"  
					k-ng-disabled='true'>
				</bcs-input-texto>
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_EMISOR</label>
				<bcs-input-texto id="Emisor" class="col-xs-6"
					ng-model="dataNominal.GlsEmisor"  
					k-ng-disabled='true'>
				</bcs-input-texto>				
				<label class="col-xs-3">
					<bcs-input-checkbox ng-model="dataNominal.switchFungible" ng-disabled ="'true'" ></bcs-input-checkbox>
					{{'UI_FUNGIBLE' | translate}}
				</label>
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_VALOR_CLASIFICACION_RIESGO</label>
				<bcs-input-texto id="ClasificacionRiesgo" class="col-xs-9"
					ng-model="dataNominal.GlsValorClasificacionRiesgo"  
					k-ng-disabled='true'>
				</bcs-input-texto>
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_BOVEDA</label>
				<bcs-input-texto id="Boveda" class="col-xs-9"
					ng-model="dataNominal.GlsBoveda"  
					k-ng-disabled='true'>
				</bcs-input-texto>				
			</div>
			<!--
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_CATEGORIA_IFRS</label>
				<bcs-input-texto id="IFRS" class="col-xs-6"
					ng-model="dataNominal.GlsIFRS"  
					k-ng-disabled='true'>
				</bcs-input-texto>				
			</div>-->
			<div class="row col-xs-12">
                <label class="col-xs-3" translate>UI_CATEGORIA_IFRS</label>
                <bcs-combobox-base class="col-xs-9"
                    
                    todos = "'N'"
                    configuracion= "dataNominal.oConfiguracionClasificacionIfrs.configuracion"
                    tipo="dataNominal.oConfiguracionClasificacionIfrs.tipo"
                    id-actual="dataNominal.oConfiguracionClasificacionIfrs.idActual"
                    seleccionado="dataNominal.oConfiguracionClasificacionIfrs.seleccionado"
                    filtros="dataNominal.oConfiguracionClasificacionIfrs.filtros"
                    activado="false"
                    id-post-filtro = "dataNominal.oConfiguracionClasificacionIfrs.idPostFiltro"
                    id-defecto = "dataNominal.oConfiguracionClasificacionIfrs.idDefecto">
                </bcs-combobox-base >
            </div>
			<!-- 
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_MONEDA_EMISION</label>
				<bcs-input-texto id="TipoReajuste" class="col-xs-6"
					ng-model="dataNominal.MonedaEmisionInstrumento"  
					k-ng-disabled='true'>
				</bcs-input-texto>
			</div>-->
			<div class="row col-xs-12">
                <label class="col-xs-3" translate>UI_TIPO_REAJUSTE</label>
                <bcs-input-texto id="TipoReajuste" class="col-xs-9"
                    ng-model="dataNominal.IdTipoReajuste"  
                    k-ng-disabled='true'>
                </bcs-input-texto>
            </div>
            
			<div class="row col-xs-12">
                <label class="col-xs-3" translate>UI_MONEDA_LIQUIDACION</label>
                <bcs-input-texto id="TipoReajuste" class="col-xs-9"
                    ng-model="dataNominal.MonedaLiquidacionInstrumento"  
                    k-ng-disabled='true'>
                </bcs-input-texto>
            </div>
            
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_FECHA_VENCIMIENTO</label>
				<bcs-input-texto id="TipoReajuste" class="col-xs-9"
                    ng-model="dataNominal.kngFechaVencimientoDisplay"  
                    k-ng-disabled='true'>
                </bcs-input-texto>
                <!-- 
				<bcs-input-date class="col-xs-6" 
					k-ng-model="dataNominal.kngFechaVencimiento" 
					bcs-requerido="dataNominal.fechaVencimientoRequerido" 
					k-ng-disabled ='true' 
					k-options="dataNominal.oConfiguracionFechaVencimiento">
				</bcs-input-date> -->
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_CORTE_MINIMO</label>
				<bcs-input-numero class="col-xs-9" 
					name="uCorteMinimo"
					decimales="dataNominal.IdDecimalRescateDisplay"  
					ng-model="dataNominal.corteMinimo" 
					k-ng-model="dataNominal.kngCorteMinimo" 
					k-ng-disabled="true">
				</bcs-input-numero>
			</div>
			<!-- 
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_REPETICIONES</label>
				<bcs-input-numero class="col-xs-6" 
					name="uRepeticiones" 
					ng-model="dataNominal.numeroRepeticiones" 
					k-ng-model="dataNominal.kngNumeroRepeticiones" 
					k-ng-disabled='true' 
					k-options="dataNominal.oConfiguracionNumeroRepeticiones">
				</bcs-input-numero>
			</div>-->
			<div class="row col-xs-12">
				<label class="col-xs-3" >{{dato.IdClasificacionTipoInstrumento === 'IF'? 'UI_CANTIDAD_REPETICIONES' : 'UI_CANTIDAD' | translate}}</label>
				<bcs-input-numero class="col-xs-9" 
					name="uCantidad" 
					bcs-requerido = "dataNominal.cantidadRequerido" 
					ng-model="dataNominal.cantidad" 
					decimales="dataNominal.IdDecimalRescateDisplay"
					k-ng-model="dataNominal.kngCantidad" 
					k-ng-disabled="dataNominal.activarCantidad || !dataNominal.valorizar" 
					k-options="dataNominal.oConfiguracionCantidad">
				</bcs-input-numero>
				<label class="col-xs-3" ng-show ="dataNominal.muestraDatosRF"><strong> Cartera reservada</strong></label>
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_VALOR_RESCATE</label>
				<bcs-input-monetario class="col-xs-9" 
					name="uValorRescate" 
					bcs-requerido = "dataNominal.valorRescateRequerido" 
					simbolo="dataNominal.IdMonedaRescateDisplay" 
					decimales="dataNominal.IdDecimalRescateDisplay" 
					ng-model="dataNominal.valorRescate" 
					k-ng-model="dataNominal.kngValorRescate"  
					k-ng-disabled="dataNominal.activarValorRescate || !dataNominal.valorizar">
				</bcs-input-monetario>
			</div>
			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_TASA</label>
				<bcs-input-numero class="col-xs-3" 
					name="uTasa" 
					bcs-requerido = "dataNominal.tasaRequerido" 
					ng-model="dataNominal.tasa" 
					k-ng-model="dataNominal.kngTasa"  
					decimales="dataNominal.IdDecimalTasa"
					k-ng-disabled="dataNominal.activarTasa || !dataNominal.valorizar" 
					k-options="dataNominal.oConfiguracionTasa">
				</bcs-input-numero>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_MERCADO</label>
				<bcs-input-numero class="col-xs-3" 
					name="uTasaMercado" 
					ng-model="dataNominal.tasaMercado" 
					decimales="dataNominal.IdDecimalTasa"
					k-ng-model="dataNominal.kngTasaMercado" 
					k-ng-disabled="true"
					k-options="dataNominal.oConfiguracionTasa">
				</bcs-input-numero>
			</div>

			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_PRECIO</label>
					<!--  simbolo="dataNominal.IdMonedaPrecioDisplay" 
						  decimales="dataNominal.IdDecimalMonedaDisplay" -->				
				<bcs-input-numero class="col-xs-3" 
					name="uPrecio" 
					bcs-requerido = "dataNominal.precioRequerido"  
					ng-model="dataNominal.precio" 
					k-ng-model="dataNominal.kngPrecio" 
					decimales="dataNominal.IdDecimalPrecio"
					k-ng-disabled="dataNominal.activarPrecio || !dataNominal.valorizar">
				</bcs-input-numero>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_MERCADO</label>
				<bcs-input-numero class="col-xs-3" 
					name="uPrecioMercado" 
					ng-model="dataNominal.PrecioMercado" 
					k-ng-model="dataNominal.kngPrecioMercado"
					decimales="dataNominal.IdDecimalPrecio" 
					k-ng-disabled="true">
				</bcs-input-numero>				
			</div>

			<div class="row col-xs-12">
				<label class="col-xs-3" translate>UI_MONTO</label>
				<bcs-input-monetario class="col-xs-9" 
					name="uMonto" 
					bcs-requerido = "dataNominal.montoRequerido" 
					simbolo="'CLP'" 
					decimales="0"
					ng-model="dataNominal.monto" 
					k-ng-model="dataNominal.kngMonto"  
					k-ng-disabled="!dataNominal.valorizar"> 
				</bcs-input-monetario>
			</div>
			<div class="row col-xs-12">
                <label class="col-xs-3" translate>UI_MONTO_LIQUIDACION</label>
                <bcs-input-monetario class="col-xs-9" 
                    name="uMonto" 
                    simbolo="dataNominal.IdMonedaMontoLiquidacionDisplay" 
                    decimales="dataNominal.IdDecimalMontoLiquidacionDisplay"   
                    ng-model="dataNominal.montoLiquidacionOperacion" 
                    k-ng-model="dataNominal.kngMontoLiquidacionOperacion"  
                    k-ng-disabled="true"></bcs-input-monetario>
            </div>
			
			<div class="row bcs-panel-comandos" style="padding-top: 5px !important;"> 
				<bcs-button id="frmAgregarCartera"  
					class="col-xs-4 pull-right" 
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="dataNominal.valorizar?'UI_VALORIZAR_CARTERA':'UI_AGREGAR' | translate"  
					bcs-habilitado="'true'" 
					bcs-clic="dataNominal.valorizar?dataNominal.valoriza():dataNominal.aceptar()">
				</bcs-button>
				<bcs-button id="frmEliminarCartera" 
					class="col-xs-2 pull-right" 
					bcs-tipo="'bcs-button-secondary'"
					bcs-auto-desactivar="false"
					bcs-texto="dataNominal.valorizar?'UI_CANCELAR':'UI_MODIFICAR' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="!dataNominal.valorizar?dataNominal.cancelar():dataNominal.cerrar()">
				</bcs-button>
			</div>
			
		</form>
	</div>
</div>

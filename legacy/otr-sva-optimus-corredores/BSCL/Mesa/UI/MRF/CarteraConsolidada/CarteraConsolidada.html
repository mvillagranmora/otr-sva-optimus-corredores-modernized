<div class="row" ng-controller='CarteraConsolidadaCtl'>
	<form name="frmCarteraConsolidada">
		<div id="CarteraConsolidada">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
					<div class="col-xs-8">
						<bcs-combobox-base class="col-xs-9" id="UI_SOCIO_NEGOCIO"
							activado="data.EnabledClientePortafolio"
							tipo="data.oConf_ClientePortafolio.tipo"
							filtros="filtrosPortafolio"
							id-actual="data.oConf_ClientePortafolio.idActual"
							seleccionado="data.oConf_ClientePortafolio.seleccionado">
						</bcs-combobox-base>
					</div>
					<bcs-button class="col-xs-2 pull-right" style="position: absolute;" id="frmBtn_BUSCAR"
						bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false"
						bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'"
						bcs-clic="buscarCarteraConsolidada(filtros)"> </bcs-button>
				</div>
			</div>
			

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-2" translate>UI_TIPO_CARTERA</label>
					<bcs-combobox-base class="col-xs-2" id="frmTipo_Cartera"
						auto-cargar="'true'" bcs-requerido
						tipo="'combobox-parametro-mesa'"
						seleccionado="data.oConf_TipoCartera.seleccionado"
						filtros="data.oConf_TipoCartera.filtros"
						id-actual="data.oConf_TipoCartera.idActual"
						configuracion="data.oConf_TipoCartera.configuracion"
						id-defecto="data.oConf_TipoCartera.idDefecto">
					</bcs-combobox-base>
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-2" translate>UI_CARTERA</label>
					<bcs-combobox-base class="col-xs-2" id="frmCartera"
						auto-cargar="'true'" bcs-requerido
						tipo="'combobox-parametro-mesa'"
						seleccionado="data.oConf_Cartera.seleccionado"
						filtros="data.oConf_Cartera.filtros"
						id-actual="data.oConf_Cartera.idActual"
						configuracion="data.oConf_Cartera.configuracion"
						id-defecto="data.oConf_Cartera.idDefecto"> </bcs-combobox-base>
				</div>
			</div>

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-2" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-2" id="frmFECHA"
						k-ng-model="data.kngFecha" ng-model="data.Fecha" bcs-requerido>
					</bcs-input-date>					
				</div>
			</div>

			

			<div class="row">
				<bcs-grid id="frmGrid_CarteraConsolidada"
					fn-exportar-excel = "exportarExcel"
					configuracion="grid.confBasicaCarteraConsolidada"
					> </bcs-grid>
			</div>
		</div>
	</form>
</div>

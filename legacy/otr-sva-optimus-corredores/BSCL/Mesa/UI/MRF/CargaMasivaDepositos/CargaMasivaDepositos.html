<div id="CargaMasivaDepositos" class="row" ng-controller="CargaMasivaDepositosCtrl as cmDep">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_FECHA_DESDE</label>
					<bcs-input-date class="col-xs-8" k-ng-model="cmDep.filtro.FechaDesde"></bcs-input-date>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_FECHA_HASTA</label>
					<bcs-input-date class="col-xs-8" k-ng-model="cmDep.filtro.FechaHasta"></bcs-input-date>
				</div>
		  	</div>
		  	<div class="row">
		  		<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_CLIENTE_VENDEDOR</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-socio-negocio'"
						id-actual="cmDep.filtro.IdSocioDeNegocio"
						id-defecto="'0'"
						filtros="cmDep.cmbbx.SocioDeNegocio.filtros"
						todos="'N'"
						seleccionado="cmDep.dataModal.SocioDeNegocioObj">
					</bcs-combobox-base>
				</div>
		  		<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-estado-deposito'"
						id-actual="cmDep.filtro.IdEstado"
						id-defecto="cmDep.filtro.IdEstadoDef"
						filtros="cmDep.cmbbx.Estado.filtros"
						todos="'S'"
						item-post-filtro="'1'">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="cmDep.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="cmDep.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			configuracion="cmDep.grilla.Depositos"
			seleccionado="cmDep.grilla.depositoSel"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-8">
			<bcs-button id="CargaMasivaDepositos_cargarArchivo" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR_ARCHIVO' | translate" bcs-habilitado="'true'" bcs-clic="cmDep.fn.cargarArchivo()">
			</bcs-button>
			<bcs-button id="CargaMasivaDepositos_grabar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" 
				ng-show="cmDep.win.esCargaArchivo" bcs-auto-desactivar="false" 
				bcs-texto="'UI_GRABAR' | translate" bcs-habilitado="'true'" bcs-clic="cmDep.fn.grabar()">
			</bcs-button>
			<bcs-button id="CargaMasivaDepositos_procesar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" 
				ng-show="cmDep.win.esProcesaCarga" bcs-auto-desactivar="false" 
				bcs-texto="'UI_PROCESAR' | translate" bcs-habilitado="'true'" bcs-clic="cmDep.fn.procesar()">
			</bcs-button>
			<bcs-button id="CargaMasivaDepositos_anular" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" 
				ng-show="cmDep.win.esProcesaCarga" bcs-auto-desactivar="false" 
				bcs-texto="'UI_ANULAR' | translate" bcs-habilitado="'true'" bcs-clic="cmDep.fn.anular()">
			</bcs-button>
		</div>
	</div>
	
	<!--
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-1" bcs-tipo="''" bcs-auto-desactivar="false" 
			bcs-texto="'UI_EXPORTAR' | translate" bcs-habilitado="true" bcs-clic="exportarExcel('CargaMasivaDepositos')">
		</bcs-button>
	</div>
	-->
</div>

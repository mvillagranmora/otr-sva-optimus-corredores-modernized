<div class="row" ng-controller='ConsultarAnticiposOperacionesMesaRFCtrl as conAnticipo'>
	<form name="frmConsultarAnticiposOperacionesMesa"  class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-10">
					
						<div class="col-xs-12">
							<label class="col-xs-2" translate>UI_MESA</label>
							<bcs-combobox-base class="col-xs-10"
								id="UI_MESA"
								tipo="dataAnticipo.oConfiguracionMesas.tipo"
								auto-cargar="'true'"
								bcs-requerido
								seleccionado="dataAnticipo.oConfiguracionMesas.seleccionado"
								filtros="dataAnticipo.oConfiguracionMesas.filtros"
								id-actual="dataAnticipo.oConfiguracionMesas.idActual"
								configuracion= "dataAnticipo.oConfiguracionMesas.configuracion"
								item-post-filtro="'1'">
							</bcs-combobox-base>
						</div>
						
						<!--<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_OPERACION</label>
						<bcs-input-date class="col-xs-3" 
							id="FechaOperacion"
							k-ng-disabled = "'true'" 
							k-ng-model="dataAnticipo.kngFechaOperacion"
							k-options = "dataAnticipo.FechaOperacionOpt">
						</bcs-input-date>-->		
					
				</div>
				<div class="col-xs-2">
						<bcs-button id="frmBuscarOperaciones"  
							class="col-xs-12" style="position: absolute;"
							bcs-tipo="'bcs-button-search'" 
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_BUSCAR' | translate"  
							bcs-habilitado="frmConsultarAnticiposOperacionesMesa.$valid" 
							bcs-clic="dataAnticipo.btnBuscar()">  
						</bcs-button>
					
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO_DESDE</label>
					<bcs-input-date class="col-xs-4" 
						id="FechaOperacion"
						activado="'true'" 
						k-ng-model="dataAnticipo.kngFechaOperacion"
						k-options="dataAnticipo.oConfiguracionFechaDesde">
					</bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO_HASTA</label>
					<bcs-input-date class="col-xs-4" 
						id="FechaOperacionFin"
						activado="'true'" 
						k-ng-model="dataAnticipo.kngFechaOperacionFin"
						k-options="dataAnticipo.oConfiguracionFechaHasta">
					</bcs-input-date>
				</div>
				
				<div class="col-xs-2">
					<i id='toolConsultarAnticiposOperacionesMesaRF' class="glosa-icono"></i>
			        <label translate>UI_GLOSA</label>
				</div>	                
				
			</div>
			<div class="row" ng-if="show">
				<new-bcs-grid id="grid-anticipoOperacionMesaRF"
					fn-exportar-excel = "exportarExcel"
				 	configuracion  = "dataAnticipo.confBasicaOperacionesMesaRF"
					seleccionado   = "dataAnticipo.seleccionOperacionesMesaRF"
					api            = "dataAnticipo.gridApiOperacionesMesaRF"
					fn-doble-click = "dataAnticipo.detalleOperacion(grid.dataAnticipo.seleccionOperacionesMesaRF)"	>
				</new-bcs-grid>
				
			</div>
		</div>
		
		<!-- INICIO PANEL COMANDOS -->
		<div class="row bcs-panel-comandos">
			<bcs-button  class="col-xs-2" id="frmConsultarAnticiposMesaRentaFija_btn_ingresoAnticipo"
				bcs-tipo="'bcs-button-primary'"           
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_ANTICIPO' | translate" 
				bcs-habilitado="dataAnticipo.seleccionOperacionesMesaRF !== undefined && dataAnticipo.seleccionOperacionesMesaRF[0].IdEstado === 'VIG' && dataAnticipo.seleccionOperacionesMesaRF[0].ParametroConfirmacion == 'N' 
				|| dataAnticipo.seleccionOperacionesMesaRF !== undefined && dataAnticipo.seleccionOperacionesMesaRF[0].IdEstado === 'VIG' && dataAnticipo.seleccionOperacionesMesaRF[0].EstadoConfirmacion === 'CNF' && dataAnticipo.seleccionOperacionesMesaRF[0].ParametroConfirmacion == 'S'"  			
				bcs-clic="crearAnticipoOperacion()">
			</bcs-button>
			<bcs-button  class="col-xs-2" id="frmConsultarAnticiposMesaRentaFija_btn_papeletaAnticipo"
				bcs-auto-desactivar="false"  bcs-tipo="'bcs-button-secondary'" 
				bcs-texto="'UI_PAPELETA_ANTICIPO' | translate" 
				bcs-habilitado="dataAnticipo.seleccionOperacionesMesaRF !== undefined && dataAnticipo.seleccionOperacionesMesaRF[0].IdEstado === 'ANT'" 
				bcs-clic="generarReporteAnticipoOperacion()">
			</bcs-button>
			
			
			<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"  bcs-texto="'UI_OPCIONES' | translate">
				<li ng-click="exportarExcel(NombreArchivo)">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</form>
</div>

<div class="row" ng-controller='ConsultarVencimientosOperacionesMesaRFCtrl as conVencimiento'>
	<form name="frmConsultarVencimientoOperacionesMesa"  class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-10">
					
						<div class="col-xs-12">
							<label class="col-xs-2" translate>UI_MESA</label>
							<bcs-combobox-base class="col-xs-10"
								id="UI_MESA"
								tipo="dataVencimiento.oConfiguracionMesas.tipo"
								auto-cargar="'true'"
								bcs-requerido
								seleccionado="dataVencimiento.oConfiguracionMesas.seleccionado"
								filtros="dataVencimiento.oConfiguracionMesas.filtros"
								id-actual="dataVencimiento.oConfiguracionMesas.idActual"
								configuracion= "dataVencimiento.oConfiguracionMesas.configuracion"
								item-post-filtro="'1'">
							</bcs-combobox-base>
					
					</div>
				</div>
				<div class="col-xs-2">
						<bcs-button id="frmBuscarOperaciones"  
							class="col-xs-12" style="position: absolute;"
							bcs-tipo="'bcs-button-search'" 
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_BUSCAR' | translate"  
							bcs-habilitado="frmConsultarVencimientoOperacionesMesa.$valid" 
							bcs-clic="dataVencimiento.buscarOperacionesMesaRF(dataVencimiento.gridApiOperacionesMesaRF,dataVencimiento)">  
						</bcs-button>
					
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO_DESDE</label>
					<bcs-input-date class="col-xs-4" 
						id="FechaOperacion"
						activado="'false'" 
						k-ng-model="dataVencimiento.kngFechaOperacion"
						k-options="{max: dataVencimiento.kngFechaOperacionFin}">
					</bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO_HASTA</label>
					<bcs-input-date class="col-xs-4" 
						id="FechaOperacionFin"
						activado="'false'" 
						k-ng-model="dataVencimiento.kngFechaOperacionFin"
						k-options="{min: dataVencimiento.kngFechaOperacion}">
					</bcs-input-date>
				</div>	
				
				<div class="col-xs-2">
					<i id='toolConsultarVencimientosOperacionesMesaRF' class="glosa-icono"></i>
			        <label translate>UI_GLOSA</label>
				</div>				
					
			</div>
			<div class="row" ng-if="show">
				<bcs-grid id="grid-vencimientoOperacionMesaRF"
					fn-exportar-excel = "exportarExcel"
				 	configuracion  = "dataVencimiento.confBasicaOperacionesMesaRF"
					seleccionado   = "dataVencimiento.seleccionOperacionesMesaRF"
					api            = "dataVencimiento.gridApiOperacionesMesaRF"
					fn-doble-click = "dataVencimiento.detalleOperacion(grid.dataVencimiento.seleccionOperacionesMesaRF)"	>
				</bcs-grid>
				
			</div>
		</div>
		
		<!-- INICIO PANEL COMANDOS -->
		<div class="row bcs-panel-comandos">
			<bcs-button  class="col-xs-2" id="frmConsultarVencimientoMesaRentaFija_btn_ingresoRenovacion"
				bcs-tipo="'bcs-button-primary'"           
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_RENOVACION' | translate" 
				bcs-habilitado="dataVencimiento.seleccionOperacionesMesaRF !== undefined && dataVencimiento.seleccionOperacionesMesaRF && dataVencimiento.seleccionOperacionesMesaRF[0].IdEstado === 'LIQ' && dataVencimiento.seleccionOperacionesMesaRF[0].FechaVencimientoUI === SesionFechaSistema" 
				bcs-clic="crearRenovacionOperacion()">
			</bcs-button>
			<bcs-button  class="col-xs-2" id="frmConsultarVencimientoMesaRentaFija_btn_ingresoReversaAnticipo"
				bcs-tipo="'bcs-button-secondary'"           
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_REVERSA' | translate" 
				bcs-habilitado="dataVencimiento.seleccionOperacionesMesaRF !== undefined && dataVencimiento.seleccionOperacionesMesaRF && dataVencimiento.seleccionOperacionesMesaRF[0].IdEstado === 'ANT'" 
				bcs-clic="crearReversaAnticipoOperacion()">
			</bcs-button>
			<bcs-button  class="col-xs-2" id="btn-pauta"
				bcs-tipo="'bcs-button-secondary'"           
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_VENCIMIENTO_MESA' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="EjecutarPauta()">
			</bcs-button>
			
			<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"  bcs-texto="'UI_OPCIONES' | translate">
				<li ng-click="exportarExcel(NombreArchivo)">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</form>
</div>

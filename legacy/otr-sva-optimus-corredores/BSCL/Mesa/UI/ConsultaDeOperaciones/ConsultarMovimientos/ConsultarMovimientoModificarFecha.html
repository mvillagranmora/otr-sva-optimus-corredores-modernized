<div ng-controller="ConsultarMovimientoModificarFechaCtrl">
	
	<form class="row" name="ConsultarMovimientoModificarFechaForm">
		<div class="row">
			<label class="col-xs-5" translate>UI_FECHA_MOVIMIENTO</label>
			<bcs-input-date class="col-xs-7" 
				id="frmConsMovModFec_UI_FECHA_OPERACION"
				name="uFechaOperacion"
				k-ng-model="data.oFechaOperacion"
				k-ng-disabled="true">
			</bcs-input-date>						
		</div>
	
		<div class="row">
			<label class="col-xs-5" translate>UI_FECHA_OPERACION_NUEVA</label>
			<bcs-input-date class="col-xs-7"
				id="ComprobanteFacturacionCtrl_UI_FECHA_OPERACION_NUEVA"
				k-ng-model="data.oFechaOperacionNueva"> 
			</bcs-input-date>
		</div>
		<hr>
	</form>
	<div class="row alignButtonsToRight">
		<bcs-button  class="col-xs-3" 
		    bcs-tipo="'bcs-button-primary'" 
		    bcs-auto-desactivar="false" 
		    bcs-texto="'UI_ACEPTAR' | translate"
		    bcs-habilitado="true"  
			bcs-clic="data.aceptar()">
		</bcs-button>
			
		<bcs-button  class="col-xs-3" 
		    bcs-tipo="'bcs-button-secondary'" 
		    bcs-auto-desactivar="false" 
		    bcs-texto="'UI_CANCELAR' | translate" 
		    bcs-habilitado="'true'" 
		    bcs-clic="data.cancelar()">
		</bcs-button>
	</div>

</div>

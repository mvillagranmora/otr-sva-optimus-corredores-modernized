<div id="ModalGenerarContrato" class="col-xs-12" ng-controller="ModalGenerarContratoCtrl as cGC">
    <div class="bcs-cuerpo">
        <div class="row">
            <label class="col-xs-4 ng-scope" translate="">UI_FIRMA_CORREDORA</label>
            <div class="col-xs-8">
                <bcs-combobox-base
                tipo="'combobox-apoderado-corredora'"
			    bcs-requerido
                todos="'N'"
                filtros="cGC.cmbbx.oConfApoderadoCorredora.filtros"
                seleccionado="cGC.apoderadoCorredoraPrimero">
            </bcs-combobox-base>
            <bcs-combobox-base 
                tipo="'combobox-apoderado-corredora'"
                bcs-requerido
                todos="'N'"
                filtros="cGC.cmbbx.oConfApoderadoCorredora.filtros"
                seleccionado="cGC.apoderadoCorredoraSegundo">
            </bcs-combobox-base>
            </div>
        </div>
        <hr>
        <div class="row">
            <label class="col-xs-4 ng-scope" translate="">UI_FIRMA_APODERADO</label>
            <div class="col-xs-8">
                <bcs-combobox-base 
                tipo="'combobox-apoderado-cliente'"
                bcs-requerido
                todos="'N'"
                filtros="cGC.cmbbx.oConfApoderadoCliente.filtros"
                seleccionado="cGC.apoderadoClientePrimero">
                </bcs-combobox-base>
                <bcs-combobox-base 
                tipo="'combobox-apoderado-cliente'"
                bcs-requerido
                todos="'N'"
                filtros="cGC.cmbbx.oConfApoderadoCliente.filtros"
                seleccionado="cGC.apoderadoClienteSegundo">
                </bcs-combobox-base>
            </div>
        </div>
        <div class="row">
            <bcs-button  id="GenerarContrato" 
				class="col-xs-3" 
				bcs-tipo="'principal'"   
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_GENERAR_CONTRATO' | translate" 
				bcs-habilitado="'true'"
				bcs-clic="cGC.fn.generarContrato()">
				</bcs-button>
        </div>
    </div>
</div>

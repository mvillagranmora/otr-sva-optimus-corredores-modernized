<div id="PanelNomina" class="row" ng-controller="PanelNominaCtrl as pc1">
<form class="col-xs-12 form-horizontal">

	<br>
	<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-12" translate>UI_TC_CIERRE_PARA_FONDOS_MUTUOS</label>
			</div>
	</div>
<br>
	<div class="row">

		<label class="col-xs-4" translate>UI_FECHA</label> 
	  		<bcs-input-date
				class="col-xs-8"
				k-ng-model="solCir.Prevfecha" 
				bcs-requerido
				k-ng-disabled="'true'">
			</bcs-input-date>
	</div>
	<div class="row">

		<label class="col-xs-4" translate>UI_TC_CIERRE</label>
		<bcs-input-numero class="col-xs-8" id="UI_TC_CIERRE"
			ng-model="pc1.TipoCambioCierre"
			k-ng-model="pc1.kngTipoCambioCierre"
			bcs-requerido
			simbolo="'USD'"
			decimales="'4'">
		</bcs-input-numero>

	</div>
	
	

	<div class="row">
		<label class="col-xs-4" translate>UI_TC_COSTO</label>
		
		<bcs-input-numero class="col-xs-8" id="UI_TC_COSTO"
			ng-model	= "pc1.TipoCambioCosto"
			k-ng-model	= "pc1.kngTipoCambioCosto"
			bcs-requerido
			simbolo		= "'USD'"
			decimales	= "'4'">
		</bcs-input-numero>
	</div>	

	
	
	
	<br>	

</form>		
	<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px">
			 <bcs-button class="col-xs-4 pull-left"   bcs-tipo="'principal'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.guardarCambios()">
			 </bcs-button>
			 <bcs-button class="col-xs-4 pull-left" bcs-tipo="''"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	
</div>

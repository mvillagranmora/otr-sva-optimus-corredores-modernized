<div id="ReporteDiarioPrestamosAnexo14" class="row" ng-controller="ReporteDiarioPrestamosAnexo14Ctrl as rMDFWD">
	<form name="ReporteDiarioPrestamosAnexo14" class="col-xs-12">
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-2" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-9" 
					id="UI_FECHA_HASTA" bcs-requerido
					k-ng-model ="data.kngFechaMovimiento" 
					k-ng-disabled="data.HabilitaFechaMovimiento"
					k-options ="data.LimiteFecha"
					> 
				</bcs-input-date>
			</div>
		</div>
		<div class="row alignButtonsToRight" style="padding-top: 10px;">
			<hr>
			<div class="col-xs-3">
				<bcs-button class="col-xs-12" 
					bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false"
					bcs-texto="'UI_GENERAR' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="data.generarReporte()">
				</bcs-button>
			</div>
		</div>
	</form>
</div>

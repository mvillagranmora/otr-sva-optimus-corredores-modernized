<div id="ConsultarFusionCartera" class="row" ng-controller='ConsultarFusionCarterasCtrl'>
	<form name="frmCarteras">
		<div class="col-xs-10" ng-show="!esVentana">

			
			<div class="col-xs-8">
				<label class="col-xs-2" translate>UI_CLIENTE</label>                
				<bcs-combobox-base
					class="col-xs-10"
					id="frmCarteras_Cliente"
					carga-cliente-automatico="'S'"
					id-actual="socioGral.idActual"
					auto-cargar="'true'"
					tipo="oConfiguracionCliente.tipo"
					filtros="oConfiguracionCliente.filtros"                                 
					configuracion= "oConfiguracionCliente.configuracion"                                                    
					seleccionado="oConfiguracionCliente.seleccionado"                                   
					cascada-a="oConfiguracionPortafolio.filtros.IdCliente"
					cascada-defecto="-1"
					cascada-valor="'IdCliente'">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_PORTAFOLIO</label>                 
				<bcs-combobox-base class="col-xs-8"
					id="ConsultarCarteras_Portafolio"
					auto-cargar="'false'"
					tipo="'combobox-portafolio'"
					filtros="oConfiguracionPortafolio.filtros"
					item-post-filtro="'1'"
					usa-filtros-completos = "'S'"
					configuracion= "oConfiguracionPortafolio"  
					seleccionado = "oConfiguracionPortafolio.seleccionado">
				</bcs-combobox-base >
			</div>  
			
		<div class="row">
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_CLASIFICACION_ABR</label>
					<bcs-combobox-base
						class="col-xs-8"
						tipo			= "oConfiguracionClasificacionTipoInstrumento.tipo"
						id-actual		= "oConfiguracionClasificacionTipoInstrumento.idActual"
						seleccionado	= "oConfiguracionClasificacionTipoInstrumento.seleccionado"
						filtros			= "oConfiguracionClasificacionTipoInstrumento.filtros"
						item-post-filtro="'1'"
						configuracion= "oConfiguracionClasificacionTipoInstrumento.configuracion" 	

						>
				</bcs-combobox-base>
			</div>


			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO_ABR</label>
				<bcs-combobox-base
					class="col-xs-8"
								auto-cargar="'false'"
								tipo="oConfiguracionTipoInstrumento.tipo"  
								filtros="oConfiguracionTipoInstrumento.filtros"
								configuracion= "oConfiguracionTipoInstrumento.configuracion" 
								id-actual = "oConfiguracionTipoInstrumento.idActual"
								id-post-filtro = "oConfiguracionTipoInstrumento.idPostFiltro" 
								item-post-filtro="'1'"
								seleccionado="oConfiguracionTipoInstrumento.seleccionado"
								cascada1-a="oConfiguracionInstrumento.filtros.IdTipoInstrumento"
								cascada1-valor="'IdTipoInstrumento'" 	
								todos="'S'"	
					>
				</bcs-combobox-base>
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
				<bcs-input-instrumentos 
					class="col-xs-8" 
							id="UI_INSTRUMENTO" 
							name="uInstrumento"
							datos-instrumento="instrumentoDatos"
							buscar-instrumento="oConfiguracionInstrumento.buscar"
							filtro-tipo-instrumento = "oConfiguracionTipoInstrumento.idActual"
							filtro-clasificacion="oConfiguracionClasificacionTipoInstrumento.idActual" 
							filtro-estado = "'ACT'"
					></bcs-input-instrumentos>
			
			</div>
		</div>
					

			
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_REAL_DESDE</label>
					<bcs-input-date class="col-xs-8"					
						bcs-requerido
						k-ng-model    = "kngFechaConsultaDesde"
						k-options     = "FechaConsultaOptDesde">
					</bcs-input-date>
				</div>	
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_REAL_HASTA</label>
					<bcs-input-date class="col-xs-8"					
						bcs-requerido
						k-ng-model    = "kngFechaConsultaHasta"
						k-options     = "FechaConsultaOptHasta">
					</bcs-input-date>
				</div>	  
			</div>
					
		</div>
	</form>	
	
	<div class="col-xs-2" ng-show="!esVentana">
		<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'" bcs-clic="buscarCarteras();"></bcs-button>
		<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiarFiltros()"></bcs-button>
	</div>

	<div class="col-xs-12">
		<div class="row" >
		
			<bcs-grid id="grid-carterasFCAll"
				configuracion = "confBasicaCarterasFCAll"
				seleccionado = "seleccionCarterasAll"
				fn-exportar-excel="excelCarterasAll"
				ng-show="verGrillaAll"

				fn-doble-click="detalleCarterasFC(seleccionDetalleFusionCarteras)">
				

				<div bcs-grid-detail ng-non-bindable>
					<div style="width: 830px;">
						<uib-tabset> <uib-tab
							heading="{{'UI_DETALLE_FUSION_CARTERAS' | translate}}"> <bcs-grid 
							id="grid-fusionCarterasAll"
							configuracion="confBasicaDetalleFusionCarteras(dataItem)"
							seleccionado="dataItem.seleccionDetalleFusionCarteras">
						</bcs-grid> </uib-tab> </uib-tabset>
					</div>
				</div>

			</bcs-grid>

			
					
		</div>
		
		<div class= "row">
			<div class="col-xs-2">
				<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-primary'" bcs-habilitado="true"  bcs-auto-desactivar="false" bcs-tipo="'default'" bcs-texto="'UI_FUSIONAR_CARTERA' | translate" bcs-clic="FusionarCarteras();"></bcs-button>
			</div>
			<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-show="verGrillaAll" ng-click="excelCarterasAll('Fusion Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
				
			</bcs-menu>
		</div>
	</div>
	

		
</div>

<div class="row" ng-controller='ConsultarCarterasPorInstrumentoCtrl'>
<form name="frmCarterasIns">
	<div class="col-xs-10" ng-show="!esVentana">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_CLASIFICACION_ABR</label>
				<bcs-combobox-base
					class="col-xs-9"
								tipo         = "oConfiguracionClasificacionTipoInstrumento.tipo"
								id-actual    = "oConfiguracionClasificacionTipoInstrumento.idActual"
								seleccionado = "oConfiguracionClasificacionTipoInstrumento.seleccionado"
								id-post-filtro = "oConfiguracionClasificacionTipoInstrumento.idPostFiltro"
								item-post-filtro="'1'"
								bcs-requerido
								configuracion= "oConfiguracionClasificacionTipoInstrumento.configuracion" 
								cascada1-a="oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
								cascada1-valor="'IdClasificacionTipoInstrumento'" 	
								cascada2-a="oConfiguracionInstrumento.filtros.IdClasificacionTipoInstrumento"
								cascada2-valor="'IdClasificacionTipoInstrumento'"
								todos="'S'" 
					>
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO_ABR</label>
				<bcs-combobox-base
					class="col-xs-9"
								auto-cargar="'false'"
								tipo="oConfiguracionTipoInstrumento.tipo"  
								filtros="oConfiguracionTipoInstrumento.filtros"
								configuracion= "oConfiguracionTipoInstrumento.configuracion" 
								id-actual = "oConfiguracionTipoInstrumento.idActual"
								id-post-filtro = "oConfiguracionTipoInstrumento.idPostFiltro" 
								item-post-filtro="'1'"
								seleccionado="oConfiguracionTipoInstrumento.seleccionado"
								cascada1-a="oConfiguracionInstrumento.filtros.IdTipoInstrumento"
								cascada1-valor="'IdTipoInstrumento'" 	
								todos="'S'"	
					>
				</bcs-combobox-base>
			</div>
		</div>

		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_INSTRUMENTO</label>
				<bcs-input-instrumentos 
					class="col-xs-9" 
							id="UI_INSTRUMENTO" 
							name="uInstrumento"
							datos-instrumento="instrumentoDatos"
							buscar-instrumento="oConfiguracionInstrumento.buscar"
							filtro-tipo-instrumento = "oConfiguracionTipoInstrumento.idActual"
							filtro-clasificacion="oConfiguracionClasificacionTipoInstrumento.idActual" 
							filtro-estado = "'ACT'"
					></bcs-input-instrumentos>
			
			</div>
			<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-9"
						id="UI_ESTADO"
						auto-cargar="'true'"
						tipo="'combobox-estado-custodia'"
						filtros="oConfiguracionEstado.filtros"
						id_defecto="oConfiguracionEstado.idDefecto"
						idActual="oConfiguracionEstado.idActual"
						cache = "true"
						todos="'S'"
						configuracion= "oConfiguracionEstado.configuracion"  
						seleccionado = "oConfiguracionEstado.seleccionado">
					</bcs-combobox-base >
				</div>
		</div>
		
		
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
				<bcs-input-date class="col-xs-9"					
					bcs-requerido
					k-ng-model    = "kngFechaConsulta"
					k-options     = "FechaConsultaOpt">
				</bcs-input-date>
			</div>			
			<div class="col-xs-2">
				<div class="col-xs-2">
					<bcs-input-checkbox id="frmCarteras_chkFechaLiquidacion" ng-model="chkFechaLiquidacion"></bcs-input-checkbox>
				</div>
				<label class="col-xs-10" translate>UI_FECHA_LIQUIDACION</label>
			</div>	
			<div class="col-xs-2">					
				<div class="col-xs-2">
					<bcs-input-checkbox id="frmCarteras_chkFechaAdquisicion" ng-model="chkFechaAdquisicion"></bcs-input-checkbox>
				</div>
				<label class="col-xs-10" translate>UI_FECHA_ADQUISICION</label>
			</div>		  
		</div>
		
	</div>
</form>
		<div class="col-xs-2">
			<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="frmCarterasIns.$valid" bcs-clic="buscarCarteras();"></bcs-button>
			<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiarFiltros()"></bcs-button>
  		</div>

		<div class="col-xs-12">
			<div class="row" >
						<bcs-grid id="grid-carterasIAll"
					 		configuracion = "confBasicaCarterasIAll"
							seleccionado = "seleccionCarterasIAll"
							fn-exportar-excel="excelCarterasIAll"
						></bcs-grid>
			</div>
			<div class= "row">
				<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate">		            
					<li ng-show="verGrillaIAll" ng-click="excelCarterasIAll('Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
					<li ng-show="verGrillaIRV" ng-click="excelCarterasIRV('Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
					<li ng-show="verGrillaIRF" ng-click="excelCarterasIRF('Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
					<li ng-show="verGrillaIIF" ng-click="excelCarterasIIF('Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
					<li ng-show="verGrillaIDV" ng-click="excelCarterasIDV('Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
					<li ng-show="verGrillaIFM" ng-click="excelCarterasIFM('Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
				</bcs-menu>
			</div>
		</div>
<!-- 	
		<div class="col-xs-12" ng-show="esVentana">
			<div class="row" >
				<bcs-button class="row col-xs-2" bcs-habilitado="true" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_SELECCIONAR' | translate" bcs-clic="seleccionarRegistro()"></bcs-button>
			</div>
		</div>	
-->
</div>

<div class="col-xs-12" id="MantenedorClienteCustodiaCierreJuntaAccionista" ng-controller="MantenedorClienteCustodiaCierreJuntaAccionistaCtrl">
	<form name="FormMantenedorClienteCustodiaCierreJuntaAccionista" class="filters-formulario">
			<div class="col-xs-12">
			  	<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE</label> 
			  		<bcs-combobox-base class="col-xs-8"
						id="UI_CLIENTE"
					 	auto-cargar="'true'"
					 	bcs-requerido
					    tipo="'combobox-socio-negocio'"
					    seleccionado="oSocioNegocio.seleccionado"
					    filtros="oSocioNegocio.filtros"
	                    id-actual="datosDespues.IdSocioDeNegocio"
	                    id-defecto="datosAntes.IdSocioDeNegocio"
					    configuracion= "oSocioNegocio.configuracion">
					</bcs-combobox-base>
				</div>
				<div class="row">
			  	   <label class="col-xs-4" translate>UI_INSTRUMENTO</label>
			  	   <bcs-input-texto ng-show="parametros.esEdicion" class="col-xs-8"
			  	   		ng-model="datosDespues.Nemotecnico"
			  	   		k-ng-disabled="'true'"
			  	   >
			  	   </bcs-input-texto>
			  	   	<bcs-input-instrumentos class="col-xs-8" ng-show="!parametros.esEdicion"
							buscar-instrumento="buscarInstrumento"
							datos-instrumento="instrumento"
							filtro-emisor="filtros.IdEmisor">
					</bcs-input-instrumentos>
		  		</div>
			  	<div class="row">
			  	    <label class="col-xs-4" translate>UI_CANTIDAD_DERECHO</label> 
			  		<bcs-input-numero class="col-xs-8"
				  		maxlength ="28"
				  		decimales = "'0'"
				  		bcs-requerido
						k-ng-model="datosDespues.CantidadDerecho">
			  		</bcs-input-numero>
		  		</div>
		  		<div class="row">
			  		<label class="col-xs-4" translate>UI_INSTRUCCION</label>
			  		<bcs-input-texto class="col-xs-8"
				  			id="UI_GLOSA"
					  		maxlength="500"
							tipo-campo="'textarea'"
							ng-model="datosDespues.Instruccion"
							atributos="margin: 0px; height:73px;resize:none;width: 100%">
				  	</bcs-input-texto>
		  		</div>
			</div>
		</form>

		<div class="row bcs-panel-comandos">
			<div class=col-xs-12>
				<bcs-button class="col-xs-4 pull-right" id="GUARDAR_CLIENTE" 
					bcs-texto="'UI_GUARDAR' | translate" 
					bcs-habilitado="FormMantenedorClienteCustodiaCierreJuntaAccionista.$valid"
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="true"
					bcs-clic="guardarClienteCustodia()">
				</bcs-button>	
			</div>
			
		</div>
</div>

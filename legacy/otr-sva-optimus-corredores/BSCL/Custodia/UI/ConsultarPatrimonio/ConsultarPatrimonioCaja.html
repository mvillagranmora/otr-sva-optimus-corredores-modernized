<div class="row" ng-controller='ConsultarPatrimonioCajaCtrl'>
	<div class="col-xs-10">
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-3" style="width:12.4%;" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-combobox-base
					class="col-xs-9"
					ng-style="{'width' : data.oConfiguracionClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && data.oConfiguracionClientePortafolio.seleccionado  ? '86%' : '87.5%'}"
					carga-cliente-automatico="'S'"
					auto-cargar="'false'" 
					tipo="'combobox-cliente-portafolio'"								 				
					seleccionado="data.oConfiguracionClientePortafolio.seleccionado"									
					id-actual="data.oConfiguracionClientePortafolio.idActual">
				</bcs-combobox-base>
			</div>
		</div>			
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
				<bcs-input-date
					class="col-xs-9"
					k-ng-model="data.kngFecha"
					k-options="data.FechaConsultaOpt">	
			</div>
			<div class="col-xs-2">
				<div class="col-xs-2">
					<bcs-input-checkbox ng-model="data.chkFechaLiquidacion"></bcs-input-checkbox>
				</div>
				<label class="col-xs-10" translate>UI_FECHA_LIQUIDACION</label>
			</div>	
			<div class="col-xs-2">					
				<div class="col-xs-2">
					<bcs-input-checkbox ng-model="data.chkFechaAdquisicion"></bcs-input-checkbox>
				</div>
				<label class="col-xs-10" translate>UI_FECHA_OPERACION</label>
			</div>
			<div class="col-xs-2">					
				<div class="col-xs-2">
					<bcs-input-checkbox ng-model="data.chkVigente"></bcs-input-checkbox>
				</div>
				<label class="col-xs-10" translate>UI_VIGENTE</label>
			</div>
		</div>
	</div>
	
	<div class="col-xs-2">
		<div class="row">
			<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'" bcs-clic="buscar()" ></bcs-button>
		</div>
	</div>
	
	<div class="col-xs-12">
		<div class="row" >
			<bcs-grid
				id="grid-custodia-patrimonio-caja"
				configuracion="confGrillaPatrimonioCaja">
			</bcs-grid>
		</div>
	</div>
</div>

<form name="frmOperacionesPendientes">
<div class="row" ng-controller='ConsultarOperacionesPendientesCtrl'>
	<div class="col-xs-10">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_CLIENTE</label>				
				<bcs-combobox-base class="col-xs-8 iconLupa"
					    id="UI_SOCIO_NEGOCIO"
					    auto-cargar="'false'"
					    
						tipo="oClientePortafolio.tipo"
						filtros="filtrosPortafolio"									
						configuracion= "oClientePortafolio.configuracion"									 				
						seleccionado="oClientePortafolio.seleccionado"									
						id-actual="filtros.IdPortafolio">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
				<bcs-input-date class="col-xs-8"					
					bcs-requerido
					k-ng-model    = "kngFechaConsulta"
					k-options     = "FechaConsultaOpt">
				</bcs-input-date>				
			</div>
		</div>
			
	
	
		<div class="row">	
			<div class="col-xs-6">
				<bcs-input-checkbox 
					ng-model	="data.switchpOperador"
					ng-disabled	="data.ngDisabledSwitchOperador">
				</bcs-input-checkbox>			
				<label class="col-xs-3" translate>UI_OPERADOR_DIRECTO</label>
			</div>
	
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_ESTADO</label>
				<bcs-combobox-base
					class="col-xs-8" 
					tipo="data.oConfiguracionEstadoMovimiento.tipo"
					filtros="data.oConfiguracionEstadoMovimiento.filtros"
					id-actual="filtro.estado"
					seleccionado="filtro.estadoObj"
					todos="'S'"
					item-post-filtro="'1'" >
				</bcs-combobox-base>		
			</div>
		</div>	 
				
	</div>		
	

	<div class="col-xs-2">
		<bcs-button 
			class="row col-xs-12" 
			bcs-tipo="'bcs-button-search'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_BUSCAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="buscarOperacionesPendientes()">
		</bcs-button>
		
		<bcs-button 
			class="row col-xs-12" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_LIMPIAR' | translate" 
			bcs-habilitado="true" 
			bcs-clic="limpiarFiltros()">
		</bcs-button>
  	</div>
  	
	<div class="row" >
		<div class="col-xs-12">			
			<bcs-grid 
				id				="gridOperacionesPendientes"
	 			configuracion	= "confGrillaOperacionesPendientes"
	 			api 			= "gridApi"
				seleccionado 	= "seleccionOperacionPendiente"
				fn-exportar-excel = "exportarExcel">
			</bcs-grid>
		</div>
	</div>
	
	<div class="row">
		<div class="col-xs-12 bcs-panel-comandos">
<!--		
			<bcs-button  
				class				="col-xs-2" 
				bcs-tipo			="'principal'"
				bcs-habilitado		="'true'" 
				bcs-auto-desactivar	="'false'"  
				bcs-texto			="'UI_VALIDAR_GARANTIAS' | translate"       
				bcs-habilitado		="data.btnActivo"  
				bcs-clic			="btnValidarGarantias()">
			</bcs-button>
			-->
			<bcs-button  
				class				="col-xs-2" 
				bcs-tipo			="'bcs-button-primary'" 
				bcs-habilitado		="'true'" 
				bcs-auto-desactivar	="'false'"  
				bcs-texto			="'UI_ENVIAR' | translate"    
				bcs-habilitado		="data.btnActivo"  
				bcs-clic			="btnEnviarGarantias()">
				</bcs-button>
<!--				
			<bcs-button  
				class				="col-xs-2" 
				bcs-tipo			="'default'" 
				bcs-habilitado		="'true'" 
				bcs-auto-desactivar	="'false'"  
				bcs-texto			="'UI_ENVIAR_ASIGNACIONES' | translate"
				bcs-habilitado		="data.btnActivo"  
				bcs-clic			="btnEnviarGarantias()">
			</bcs-button>
-->
			<bcs-button  
				class				="col-xs-2" 
				bcs-tipo			="'bcs-button-secondary'" 
				bcs-habilitado		="'true'" 
				bcs-auto-desactivar	="'false'"  
				bcs-texto			="'UI_COMPLETADO' | translate"
				bcs-habilitado		="data.btnActivo"  
				bcs-clic			="btnCompletado()">
			</bcs-button>
						


			<bcs-menu 
				class			="col-xs-1 pull-right" 
				bcs-habilitado	="'true'" 
				bcs-tipo = "'bcs-button-secondary'"
				bcs-texto		="'UI_OPCIONES' | translate">		            
					<li ng-click	="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>

		</div>
	</div>

</div>
</form>

<div id="blotterCarteras" ng-controller='BlotterCustodiaCtrl as blotterPadre'>
 	<div class="row no-margin">
		<div class="col-xs-12">
			<uib-tabset>
				<uib-tab id="tabCustodiaPortafolio" select="select('gridCustodiaPortafolio')" active="blotterPadre.tabCustodiaPortafolio" heading="{{'UI_CUSTODIA' | translate}}">
					<div id="gridCustodiaPortafolio">
					</div>
				</uib-tab>
				<uib-tab id="tabMovimientos" select="select('gridMovimientos')" active="blotterPadre.tabMovimientos" heading="{{'UI_MOVIMIENTOS' | translate}}">
					<div id="gridMovimientos">
					</div>
				</uib-tab>
				<uib-tab id="tabCustodiaGeneral" select="select('gridCustodiaGeneral')" active="blotterPadre.tabCustodiaGeneral" heading="{{'UI_TOTAL_CUSTODIA' | translate}}">
					<div id="gridCustodiaGeneral">
					</div>
				</uib-tab>
				<uib-tab id="tabCustodiaPendientes" select="select('gridCustodiaPendientes')" active="blotterPadre.tabCustodiaPendientes" heading="{{'UI_INSTRUMENTOS_PENDIENTES' | translate}}">
					<div id="gridCustodiaPendientes">
					</div>
				</uib-tab> 				
			</uib-tabset>
		</div>
	</div>
</div>

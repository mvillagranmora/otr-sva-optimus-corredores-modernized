<div class="row" ng-controller='ConsultaMovimientosGarantiasCtrl'>
	<div class="col-xs-12 bcs-cuerpo">
		<div class="col-xs-12">
			<div class="col-xs-10">	
				
				<div class="row">
					<div class="col-xs-8">
						<label class="col-xs-2" translate>UI_SOCIO_NEGOCIO</label>
						<bcs-combobox-base class="col-xs-10"
							id				= "UI_SOCIO_NEGOCIO"
							auto-cargar		= "'false'"
							id-actual		= "data.oSocioNegocio.idActual"
							id-defecto		= "data.oSocioNegocio.idDefecto"
							tipo			= "'combobox-socio-negocio'"
							seleccionado	= "data.oSocioNegocio.seleccionado"
							filtros			= "data.oSocioNegocio.filtros"
							activado		= "data.oSocioNegocio.activado"
							cascada-a		= "data.oPortafolio.filtros.IdCliente"
							cascada-valor	= "'IdCliente'"
							cascada-defecto	= "'-1'"
							configuracion	= "data.oSocioNegocio.configuracion"  >
						</bcs-combobox-base >					
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left:5px;" translate>UI_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-8"
							id				 = "UI_PORTAFOLIO"
							auto-cargar		 = "'false'"
							tipo			 = "'combobox-portafolio'"
							seleccionado	 = "data.oPortafolio.seleccionado"
							id-actual		 = "data.oPortafolio.idActual"
							id-defecto		 = "data.oPortafolio.idDefecto"
							filtros			 = "data.oPortafolio.filtros"
							activado		 = "data.oPortafolio.activado"
							item-post-filtro = "'1'"
							configuracion	 = "data.oPortafolio.configuracion">
						</bcs-combobox-base>
					</div>
				</div>
				
				<div class="row">
					<div class="col-xs-4">						
						<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>	
						<bcs-combobox-base class="col-xs-8" 
							auto-cargar		 = "'true'"
							tipo			 = "data.oConfiguracionTipoInstrumento.tipo"  
							filtros			 = "data.oConfiguracionTipoInstrumento.filtros"
							configuracion	 = "data.oConfiguracionTipoInstrumento.configuracion" 
							id-actual		 = "data.oConfiguracionTipoInstrumento.idActual" 
							seleccionado	 = "data.oConfiguracionTipoInstrumento.seleccionado" 
							memoria			 = "''"
							cascada1-a		 = "data.oConfiguracionEntidadDestinoGarantia.filtros.IdContraparte"
							cascada1-valor	 = "'IdContraparteGarantia'"
							cascada2-a		 = "data.oConfiguracionOperacion.filtros.IdTipoInstrumento"
							cascada2-valor	 = "'IdTipoInstrumento'"
							todos			 = "'S'"
							id-defecto		 = "'0'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>								  
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left:5px;" translate>UI_OPERACION</label>
						<bcs-combobox-base class="col-xs-8"
							auto-cargar		 = "'false'"
							tipo			 = "data.oConfiguracionOperacion.tipo"
							filtros			 = "data.oConfiguracionOperacion.filtros"
							configuracion	 = "data.oConfiguracionOperacion.configuracion" 
							id-actual		 = "data.oConfiguracionOperacion.idActual"
							seleccionado	 = "data.oConfiguracionOperacion.seleccionado"
							memoria			 = "data.oConfiguracionTipoInstrumento.idActual"
							todos			 = "'S'"
							id-defecto		 = "'0'"
							item-post-filtro = "'1'"
							usa-filtros-completos = "'S'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left:5px;" translate>UI_ENTIDAD_DESTINO</label>
						<bcs-combobox-base class="col-xs-8"
						    auto-cargar		 = "'false'"
							tipo			 = "data.oConfiguracionEntidadDestinoGarantia.tipo"  
							configuracion	 = "data.oConfiguracionEntidadDestinoGarantia.configuracion" 
							id-actual		 = "data.oConfiguracionEntidadDestinoGarantia.idActual" 
							seleccionado	 = "data.oConfiguracionEntidadDestinoGarantia.seleccionado" 
							filtros			 = "data.oConfiguracionEntidadDestinoGarantia.filtros"
							todos			 = "'S'"
						    id-defecto		 = "'0'"
						    item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>					
				</div>
				
				<div class="row">
					<div class="col-xs-4">						
						<label class="col-xs-4" translate>UI_ORIGEN</label>
						<bcs-combobox-base class="col-xs-8"
							auto-cargar		 = "'true'"
							tipo			 = "data.oConfiguracionOrigenGarantia.tipo"  
							configuracion	 = "data.oConfiguracionOrigenGarantia.configuracion" 
							id-actual		 = "data.oConfiguracionOrigenGarantia.idActual"
							id-defecto		 = "data.oConfiguracionOrigenGarantia.idDefecto"
							seleccionado	 = "data.oConfiguracionOrigenGarantia.seleccionado" 
							filtros			 = "data.oConfiguracionOrigenGarantia.filtros"
							activado		 = "data.oConfiguracionOrigenGarantia.activado"
							todos			 = "'S'"
							id-defecto		 = "'0'" 
							item-post-filtro = "'1'">
						</bcs-combobox-base >
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left:5px;" translate>UI_MONEDA</label>
						<bcs-combobox-base class="col-xs-8"
							auto-cargar		 = "'true'"
							tipo			 = "data.oConfiguracionMoneda.tipo"  
							filtros			 = "data.oConfiguracionMoneda.filtros"
							configuracion	 = "data.oConfiguracionMoneda.configuracion" 
							id-actual		 = "data.oConfiguracionMoneda.idActual"
							id-defecto		 = "data.oConfiguracionMoneda.idDefecto"
							activado		 = "data.oConfiguracionMoneda.activado"
							seleccionado	 = "data.oConfiguracionMoneda.seleccionado"
							todos			 = "'S'"
							id-defecto		 = "'0'" 
							item-post-filtro = "'1'">
						</bcs-combobox-base >
					</div>					
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left:5px;" translate>UI_INSTRUMENTO</label>					  
						<bcs-input-instrumentos
							class				= "col-xs-8"
							name				= "uInstrumento"
							datos-instrumento	= "data.instrumentoBusqueda"
							buscar-instrumento	= "data.oConfiguracionInstrumento.buscar"							
							filtro-estado		= "'ACT'"
							filtroSoloVigentes	= 'S'>
						</bcs-input-instrumentos>
					</div>
				</div>
				
				
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA_CONSULTA</label>
						<bcs-input-date class="col-xs-8"
							bcs-requerido
							k-ng-model	= "data.kngFecha"
							k-options	= "data.FechaConsultaOpt">
						</bcs-input-date>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4"  style="Padding-left:5px;" translate>UI_FOLIO_OPERACION</label>
						<bcs-input-texto class="col-xs-5"
							k-options		="{ format : 'n0', min:0, spinners: false }"
							ng-model		="data.ngFolioOperacionGarantizada">
						</bcs-input-texto>
					</div>
				</div>
						
			</div>
 
			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" 
						bcs-tipo="''"  
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_BUSCAR' | translate" 
						bcs-habilitado="'true'"  
						bcs-clic="data.buscar()"
					></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" 
						bcs-tipo="''"  
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'"  
						bcs-clic="data.limpiar()"
					></bcs-button>
				</div>
			</div>
		</div>

		<div class="col-xs-12">
			<bcs-grid id="grid-garantias"
				configuracion = "confBasicaGarantias"
				seleccionado = "seleccionGarantias"
				>
			</bcs-grid>
		</div>
		
		<div class="col-xs-12">
			<div class="row" >
				<bcs-grid id="grid-cartola-movimientos"
		 		configuracion = "confGridCartola"
				seleccionado = "seleccionCartola"
				fn-exportar-excel="excelCartolaMovimientos"
				>
				</bcs-grid>
			</div>
		</div>
	</div>
	
	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos">
		<bcs-button class="row col-xs-2" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="frmConsultaMovimientosGarantias.$valid"  bcs-clic="buscarMovimientos()"></bcs-button>
		<bcs-button class="row col-xs-2" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiarFiltros()"></bcs-button>
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
         	<li ng-click="excelCartolaMovimientos('CartolaMovimientos')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	            
		</bcs-menu>
	</div>
</div>

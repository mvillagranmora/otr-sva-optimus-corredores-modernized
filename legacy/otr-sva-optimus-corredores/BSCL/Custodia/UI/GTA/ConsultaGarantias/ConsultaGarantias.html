<div ng-controller="ConsultaGarantiasCtrl">
	<!-- Filtros -->
	<div class="col-xs-12 bcs-cuerpo">
		<div class="col-xs-12">
			<div class="col-xs-10">

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-2" style="width: 11%;" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-10" style="width: 87%;" id="UI_SOCIO_NEGOCIO"
							auto-cargar="'true'" 
							carga-cliente-automatico="'S'"
							id-actual="filtros.IdPortafolio"
							id-defecto="data.oClientePortafolio.idDefecto"
							tipo="data.oClientePortafolio.tipo"
							seleccionado="data.oClientePortafolio.seleccionado"
							filtros="filtrosPortafolio"
							activado="data.oClientePortafolio.activado"
							cascada-a="data.oPortafolio.filtros.IdCliente"
							cascada-valor="'IdCliente'" cascada-defecto="'-1'"
							configuracion="data.oClientePortafolio.configuracion">
						</bcs-combobox-base>
					</div>
				
				</div>

				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base class="col-xs-8" auto-cargar="'true'"
							tipo="data.oConfiguracionTipoInstrumento.tipo"
							filtros="data.oConfiguracionTipoInstrumento.filtros"
							configuracion="data.oConfiguracionTipoInstrumento.configuracion"
							id-actual="data.oConfiguracionTipoInstrumento.idActual"
							seleccionado="data.oConfiguracionTipoInstrumento.seleccionado"
							memoria="''"
							cascada1-a="data.oConfiguracionEntidadDestinoGarantia.filtros.IdContraparte"
							cascada1-valor="'IdContraparteGarantia'"
							cascada2-a="data.oConfiguracionOperacion.filtros.IdTipoInstrumento"
							cascada2-valor="'IdTipoInstrumento'" todos="'S'" id-defecto="'0'"
							item-post-filtro="'1'"> </bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left: 5px;" translate>UI_OPERACION</label>
						<bcs-combobox-base class="col-xs-8" auto-cargar="'false'"
							tipo="data.oConfiguracionOperacion.tipo"
							filtros="data.oConfiguracionOperacion.filtros"
							configuracion="data.oConfiguracionOperacion.configuracion"
							id-actual="data.oConfiguracionOperacion.idActual"
							seleccionado="data.oConfiguracionOperacion.seleccionado"
							memoria="data.oConfiguracionTipoInstrumento.idActual" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"
							usa-filtros-completos="'S'"> </bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left: 5px;" translate>UI_ENTIDAD_DESTINO</label>
						<bcs-combobox-base class="col-xs-8" auto-cargar="'false'"
							tipo="data.oConfiguracionEntidadDestinoGarantia.tipo"
							configuracion="data.oConfiguracionEntidadDestinoGarantia.configuracion"
							id-actual="data.oConfiguracionEntidadDestinoGarantia.idActual"
							seleccionado="data.oConfiguracionEntidadDestinoGarantia.seleccionado"
							filtros="data.oConfiguracionEntidadDestinoGarantia.filtros"
							todos="'S'" id-defecto="'0'" item-post-filtro="'1'">
						</bcs-combobox-base>
					</div>
				</div>

				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_ORIGEN</label>
						<bcs-combobox-base class="col-xs-8" auto-cargar="'true'"
							tipo="data.oConfiguracionOrigenGarantia.tipo"
							configuracion="data.oConfiguracionOrigenGarantia.configuracion"
							id-actual="data.oConfiguracionOrigenGarantia.idActual"
							id-defecto="data.oConfiguracionOrigenGarantia.idDefecto"
							seleccionado="data.oConfiguracionOrigenGarantia.seleccionado"
							filtros="data.oConfiguracionOrigenGarantia.filtros"
							activado="data.oConfiguracionOrigenGarantia.activado" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left: 5px;" translate>UI_MONEDA</label>
						<bcs-combobox-base class="col-xs-8" auto-cargar="'true'"
							tipo="data.oConfiguracionMoneda.tipo"
							filtros="data.oConfiguracionMoneda.filtros"
							configuracion="data.oConfiguracionMoneda.configuracion"
							id-actual="data.oConfiguracionMoneda.idActual"
							id-defecto="data.oConfiguracionMoneda.idDefecto"
							activado="data.oConfiguracionMoneda.activado"
							seleccionado="data.oConfiguracionMoneda.seleccionado" todos="'S'"
							id-defecto="'0'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left: 5px;" translate>UI_INSTRUMENTO</label>
						<bcs-input-instrumentos class="col-xs-8" name="uInstrumento"
							datos-instrumento="data.instrumentoBusqueda"
							buscar-instrumento="data.oConfiguracionInstrumento.buscar"
							filtro-estado="'ACT'" filtroSoloVigentes='S'>
						</bcs-input-instrumentos>
					</div>
				</div>


				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA_CONSULTA</label>
						<bcs-input-date class="col-xs-8" bcs-requerido
							k-ng-model="data.kngFecha" k-options="data.FechaConsultaOpt">
						</bcs-input-date>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" style="Padding-left: 5px;" translate>UI_FOLIO_OPERACION</label>
						<bcs-input-texto class="col-xs-8"
							k-options="{ format : 'n0', min:0, spinners: false }"
							k-ng-disabled="data.chkAgruparGarantias"
							ng-model="data.ngFolioOperacionGarantizada"> </bcs-input-texto>
					</div>
					<div class="col-xs-2">
						<label class="col-xs-8" style="padding-left: 5px;" translate>UI_AGRUPAR_GARANTIAS</label>					
						<div class="col-xs-2">
							<bcs-input-checkbox ng-model="data.chkAgruparGarantias"></bcs-input-checkbox>
						</div>
						
					</div>
				</div>

			</div>

			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_BUSCAR' | translate"
						bcs-habilitado="'true'" bcs-clic="data.buscar()"></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="'true'" bcs-clic="data.limpiar()"></bcs-button>
				</div>
			</div>
		</div>

		<div class="col-xs-12" ng-show = "!data.chkAgruparGarantias">
			<bcs-grid id="grid-garantias" configuracion="confBasicaGarantias"
				seleccionado="seleccionGarantias"
				fn-exportar-excel = "tab.exportarExcelVig"> </bcs-grid>
		</div>

		<div class="col-xs-12" ng-show = "data.chkAgruparGarantias">
			<bcs-grid id="grid-garantias-masiva" configuracion="confBasicaGarantiasAgrupadas"
				seleccionado="seleccionGarantiasMasivas"
				fn-exportar-excel = "tab.exportarExcelAgrupado"> </bcs-grid>
		</div>
	</div>


	<!-- INICIO PANEL COMANDOS -->
	<div class="row newBCScomandos">
		<bcs-button class="col-xs-2" id="BlotterGarantia_Ingreso"
			bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" ng-show= "!data.chkAgruparGarantias"
			bcs-habilitado="true"
			bcs-texto="'UI_INGRESO_GARANTIA' | translate"
			bcs-clic="data.ingresoGarantia()"></bcs-button>
		<bcs-button class="col-xs-2" id="BlotterGarantia_Retiro" ng-show= "!data.chkAgruparGarantias"
			bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'"
			bcs-texto="'UI_RETIRO_GARANTIA' | translate"
			bcs-habilitado="seleccionGarantias"
			bcs-clic="data.retiroGarantia(seleccionGarantias)"></bcs-button>
		<bcs-button class="col-xs-2" id="BlotterGarantia_Retiro" ng-show= "data.chkAgruparGarantias"
			bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'"
			bcs-texto="'UI_RETIRO_GARANTIA_MASIVO' | translate"
			bcs-habilitado="seleccionGarantiasMasivas"
			bcs-clic="data.retiroGarantiaAgrupada(seleccionGarantiasMasivas)"></bcs-button>
		<!-----  BOTON EN DESARROLLO ---------
		<bcs-button class="col-xs-2" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="'false'" 
			bcs-texto="'UI_RETIRO_GARANTIA' | translate" 
			bcs-habilitado="seleccionGarantias" 
			bcs-clic="data.retiroGarantia2()"
		></bcs-button>
		------>
		<!--<bcs-button class="col-xs-2" 
			id="BlotterGarantia_CertificarGarantia"
			bcs-tipo="'default'"  
			bcs-auto-desactivar="'false'" 
			bcs-texto="'UI_CERTIFICAR_GARANTIA' | translate" 
			bcs-habilitado="seleccionGarantias"  
			bcs-clic="data.certificarGarantia()"
		></bcs-button>-->
		<bcs-button class="col-xs-2" id="BlotterGarantia_ObtenerComprobante"
			bcs-auto-desactivar="'false'"
			bcs-tipo="'bcs-button-secondary'"
			bcs-texto="'UI_OBTENER_COMPROBANTE' | translate" ng-show= "!data.chkAgruparGarantias"
			bcs-habilitado="seleccionGarantias && !data.chkAgruparGarantias" bcs-clic="obtenerComprobante()"></bcs-button>


		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
			bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcelGTA()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			<li ng-show="SesionLocale==='PE'"  ng-click="generarArchivoGarantia()">{{'UI_ARCHIVO_GARANTIA' | translate}}</li>
		</bcs-menu>
	</div>
</div>

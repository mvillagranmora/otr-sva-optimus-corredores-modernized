<div ng-controller="BusquedaOperacionEspecificaCtrl">

	<bcs-grid id="frmBusquedaOperacionEspecifica_grid_operaciones"
		configuracion = "grid.confListaDeOperacionesVigentes"
		seleccionado = "grid.ListaDeOperacionesVigentes"
		fn-doble-click 	="seleccionarOperacion(grid.ListaDeOperacionesVigentes)">					
	</bcs-grid>

	<div class="row newBCScomandos alignButtonsToRight">		
		<div class="col-xs-3">	
			<bcs-button   
				id="frmBusquedaOperacionEspecifica_Seleccionar" 
				bcs-tipo		="'bcs-button-primary'"
				bcs-habilitado	="'true'"
				bcs-texto		="'UI_SELECCIONAR' | translate"
				bcs-clic		="seleccionarOperacion(grid.ListaDeOperacionesVigentes)">
			</bcs-button>
		</div>
	</div>
</div>

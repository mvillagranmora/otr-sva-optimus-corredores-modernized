
<div class="row" ng-controller='CoberturaGarantiaCtrl'>
	<div class="row bcs-cuerpo" ng-form="frmCoberturaGarantia">
		<div class="row">
			<!-- INICIO FILTROS -->
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-9"
							id="frmCoberturaGarantia_Cliente" auto-cargar="'false'"
							tipo="data.oClientePortafolio.tipo"
							style="width: 71%;"
							seleccionado="data.oClientePortafolio.seleccionado"
							filtros="filtrosPortafolio"
							configuracion="data.oConfiguracionCliente.configuracion"
							id-actual="filtros.IdPortafolio"> </bcs-combobox-base>
					</div>

					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base class="col-xs-9"
							id				 = "frmCoberturaGarantia_TipoInstrumento" 
							auto-cargar		 = "true"
							tipo			 = "data.oConfiguracionTipoInstrumento.tipo"
							configuracion	 = "data.oConfiguracionTipoInstrumento.configuracion"
							id-actual		 = "data.oConfiguracionTipoInstrumento.idActual"
							seleccionado	 = "data.oConfiguracionTipoInstrumento.seleccionado"
							filtros			 = "data.oConfiguracionTipoInstrumento.filtros"							
							cascada1-a		 = "data.oConfiguracionInstrumento.filtros.IdTipoInstrumento"
							cascada1-valor	 = "'IdTipoInstrumento'"
							todos			 = "'S'"
							item-post-filtro = "'1'"> 
						</bcs-combobox-base>
					</div>
				</div>


				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-3" translate>UI_INSTRUMENTO</label>
						<bcs-combobox-base class="col-xs-9"
							id="frmCoberturaGarantia_Instrumento" auto-cargar="'false'"
							tipo="data.oConfiguracionInstrumento.tipo"
							filtros="data.oConfiguracionInstrumento.filtros"
							configuracion="data.oConfiguracionInstrumento.configuracion"
							id-actual="data.oConfiguracionInstrumento.idActual"
							seleccionado="data.oConfiguracionInstrumento.seleccionado"
							todos="'S'" item-post-filtro="'1'"> </bcs-combobox-base>
					</div>
					<div class="col-xs-6">
						<label class="col-xs-3" style="padding-left: 15px" translate>UI_ENTIDAD_DESTINO</label>
						<bcs-combobox-base 
							class			= "col-xs-9"
							id				= "frmCoberturaGarantia_EntidadDestino"  
						    auto-cargar		= "'true'"						    						    
							tipo			= "data.oConfiguracionEntidadDestino.tipo"  
							configuracion	= "data.oConfiguracionEntidadDestino.configuracion" 
							id-actual		= "data.oConfiguracionEntidadDestino.idActual" 
							seleccionado	= "data.oConfiguracionEntidadDestino.seleccionado" 
							filtros			= "data.oConfiguracionEntidadDestino.filtros"
							todos           = "'S'">
						</bcs-combobox-base>
					</div>
				</div>


				<div class="row">

					<div class="col-xs-6"></div>
				</div>


			</div>
			<!-- FIN FILTROS -->


			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" id="frmCoberturaGarantia_BtnBuscar"
						bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="'false'"
						bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'"
						bcs-clic="buscarGarantiasResumen()"> </bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" id="frmCoberturaGarantia_BtnLimpiar"
						bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'"
						bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'"
						bcs-clic="limpiarFiltros()"> </bcs-button>
				</div>
			</div>
			<!-- FIN BOTONES -->
		</div>

		<div class="row">
			<!-- GRILLA -->
			<bcs-grid
				id="formRevisionCoberturaGarantias_gridCoberturaGarantiaResumen"
				configuracion="configCoberturaGarantiaResumen"
				seleccionado="seleccionCoberturaGarantiaResumen"
				fn-exportar-excel="exportarExcel">

				<div bcs-grid-detail ng-non-bindable>
					<uib-tabset> 
						<uib-tab
							select="select('TabCoberturaGarantiaDetalle')"
							heading="{{'UI_GARANTIAS' | translate}}"> 
							<bcs-grid
								configuracion="data.configCoberturaGarantiaDetalle(dataItem)"
								seleccionado="data.seleccionCoberturaGarantiaDetalle"> 
							</bcs-grid>
						</uib-tab> 
						<uib-tab select="select('TabCoberturaGarantiaOperaciones')" heading="{{'UI_OPERACIONES' | translate}}"> 
							<bcs-grid
								configuracion="data.configCoberturaGarantiaOperaciones(dataItem)"
								seleccionado="data.seleccionCoberturaGarantiaOperaciones">
							</bcs-grid> 
						</uib-tab> 
					</uib-tabset>
				</div>
			</bcs-grid>
		</div>
	</div>

	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos">
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'"
		bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate">
		<li
			ng-click="exportarExcel('formRevisionCoberturaGarantias_gridCoberturaGarantiaResumen')">{{'UI_EXPORTAR_EXCEL'
			| translate}}</li>
		</bcs-menu>
	</div>
</div>

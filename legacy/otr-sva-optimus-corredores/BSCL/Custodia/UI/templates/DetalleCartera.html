<div style="text-align:center;border-bottom: 2px solid #E52929;padding-top: 8px;padding-bottom: 8px;">

<label style="font-size:16px;color:#AAAAAA;padding-left:10px;" translate>UI_DETALLE_MOVIMIENTO_CARTERA</label>
	
</div>

					<h4 ><span translate>UI_FOLIO_CARTERA</span>: <span>{{valorDetalle.FolioCartera}}</span></h4>

			  	<div class="form-group"> 
			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_INSTRUMENTO</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">
			     		<label>{{valorDetalle.Nemo}}</label>
			    	</div>
			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_BOVEDA</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">
			     		<label>{{valorDetalle.NombreBoveda}}</label>
			    	</div>
			  	</div>
			  	<div class="form-group">
			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_CONDICION_LIQUIDACION</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">
			     		<label>{{valorDetalle.NombreCondicionLiquidacion}} ({{valorDetalle.IdCondicionLiquidacion}})</label>
			    	</div>
			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_BOLSA</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">
			     		<label>{{valorDetalle.IdBolsa}}</label>

			  	</div>

			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">
			     		<label>{{valorDetalle.Fecha | date:'dd-MM-yyyy HH:mm:ss'}}</label>
			    	</div>
			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_FECHA_LIQUIDACION</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">

			  	</div>
			  	<div class="form-group">
			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_DOCUMENTO_IDENTIDAD</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">

			     		<label>{{valorDetalle.CodigoPortafolio}}</label>

			  	</div>

			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_RAZON_SOCIAL</label>

			  	</div>

			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_ESTADO</label>

			    	<label class="col-md-2" translate style="font-weight: bold; text-align:right">UI_PRECIO</label>
			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">
			     		<label>{{valorDetalle.Precio | number:5}}</label>
			    	</div>

			    	<div class="col-md-3" style="padding-left:3px; padding-right:3px;">

			  	</div>

</div>
<div class="button-bar-style">
	<div>
    	<kendo-button class="pull-right" ng-click="inter.ok();" translate>UI_ACEPTAR</kendo-button>
	</div>
</div>

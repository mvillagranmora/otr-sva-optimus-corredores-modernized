<div class="row" ng-controller='ConsultarCustodiaInstrPendientesCtrl'>
	<form name="frmConsultarCustodiaInstrPendientesNew">
		<div class="col-xs-10">
			<div class="row" ng-if ="!MostrarProducto">
				<div class="col-xs-4">
					<label class="col-xs-3" translate>UI_CLIENTE</label>
					<bcs-combobox-base
						class="col-xs-9"
						id="frmConsultarCustodiaInstrPendientesNew_Cliente"
						auto-cargar="'true'"
						item-post-filtro="data.oConfiguracionCliente.itemPostFiltro"
						tipo="data.oConfiguracionCliente.tipo"
						filtros="data.oConfiguracionCliente.filtros"									
						configuracion= "data.oConfiguracionCliente.configuracion"									 				
						seleccionado="data.oConfiguracionCliente.seleccionado"									
						id-actual="socioGral.idActual"
						cascada-a="data.oConfiguracionPortafolio.filtros.IdCliente"
						cascada-valor="'IdCliente'"
						carga-cliente-automatico="'S'"
						cascada-defecto="-1">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label>					
					<bcs-combobox-base
						class="col-xs-8"
						id="frmConsultarCustodiaInstrPendientesNew_Portafolio"
						auto-cargar="'false'"
						tipo="'combobox-portafolio'"
						filtros="data.oConfiguracionPortafolio.filtros"
						item-post-filtro="'1'"
						usa-filtros-completos = "'S'"
						configuracion= "data.oConfiguracionPortafolio"  
						seleccionado = "data.oConfiguracionPortafolio.seleccionado">
					</bcs-combobox-base >
				</div>
			</div>
			
			<div class="row" ng-if="MostrarProducto">
				<div class="col-xs-4">
					<label class="col-xs-3" translate>UI_CLIENTE</label>
					<bcs-combobox-base
						class				= "col-xs-9"
						id					= "UI_CLIENTE"
						auto-cargar			= "'true'"
						tipo				= "'combobox-socio-negocio'"
						seleccionado		= "oSocioNegocio.seleccionado"
						filtros				= "oSocioNegocio.filtros"
						cascada-a			= "oPortafolio.filtros.IdCliente"
						cascada-valor		= "'IdCliente'"
						cascada-defecto     = "-1"
						id-actual			= "socioGral.idActual"
						carga-cliente-automatico="'S'"
					>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
				    <label class="col-xs-4" translate>UI_PRODUCTO</label>
				    <bcs-combobox-base
				    	class				= "col-xs-8"
				        id					= "UI_PRODUCTO"
				        auto-cargar			= "'true'"
				        tipo				= "'combobox-otro-producto-agrupador'"
				        seleccionado		= "oProducto.seleccionado"
						cascada-a			= "oPortafolio.filtros.IdProductoAgrupador"
						cascada-valor		= "'IdProductoAgrupador'"
						id-actual			= "oProducto.idActual"
						item-post-filtro    ="'1'">
				    </bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label> 
					<bcs-combobox-base
						class				= "col-xs-8"
						id					= "UI_PORTAFOLIO"
						auto-cargar			= "'false'"
						tipo				= "'combobox-portafolio'"
						seleccionado		= "oPortafolio.seleccionado"
						filtros				= "oPortafolio.filtros"
						id-actual			= "oPortafolio.idActual"
						usa-filtros-completos = "'S'"
						activado			= "oSocioNegocio.seleccionado && oProducto.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
				
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-3" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base
						class="col-xs-9" 
						tipo         = "data.oConfiguracionClasificacion.tipo"
						id-actual    = "data.oConfiguracionClasificacion.idActual"
						seleccionado = "data.oConfiguracionClasificacion.seleccionado"
						id-post-filtro = "data.oConfiguracionClasificacion.idPostFiltro"
						item-post-filtro="'1'"
						bcs-requerido
						configuracion= "data.oConfiguracionClasificacion.configuracion" 
						cascada1-a="data.oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'" 	
						cascada2-a="data.oConfiguracionInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada2-valor="'IdClasificacionTipoInstrumento'"
						todos="'S'">
					</bcs-combobox-base >			  	  
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base
						class="col-xs-8" 
						auto-cargar="'false'"
						tipo="data.oConfiguracionTipoInstrumento.tipo"  
						filtros="data.oConfiguracionTipoInstrumento.filtros"
						configuracion= "data.oConfiguracionTipoInstrumento.configuracion" 
						id-actual = "data.oConfiguracionTipoInstrumento.idActual"
						id-post-filtro = "data.oConfiguracionTipoInstrumento.idPostFiltro" 
						item-post-filtro="'1'"
						seleccionado="data.oConfiguracionTipoInstrumento.seleccionado"
						cascada1-a="data.oConfiguracionInstrumento.filtros.IdTipoInstrumento"
						cascada1-valor="'IdTipoInstrumento'" 	
						todos="'S'">
					</bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos
						class="col-xs-8"
						id="UI_INSTRUMENTO" 
						name="uInstrumento"
						datos-instrumento="data.instrumentoDatos"
						buscar-instrumento="data.oConfiguracionInstrumento.buscar"
						filtro-tipo-instrumento = "data.oConfiguracionTipoInstrumento.idActual"
						filtro-clasificacion="data.oConfiguracionClasificacion.idActual" 
						filtro-estado = "'ACT'">
					</bcs-input-instrumentos>
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date
						class="col-xs-9"
						bcs-requerido="true"
						k-ng-model="data.kngFecha"
						k-options="data.FechaConsultaOpt">	
				</div>
				<div class="col-xs-2">
					<div class="col-xs-2">
						<bcs-input-checkbox id="frmCustodiaPortafolio_chkFechaLiquidacion" ng-model="data.chkFechaLiquidacion"></bcs-input-checkbox>
					</div>
					<label class="col-xs-10" translate>UI_FECHA_LIQUIDACION</label>
				</div>	
				<div class="col-xs-2">					
					<div class="col-xs-2">
						<bcs-input-checkbox id="frmCustodiaPortafolio_chkFechaMovimiento" ng-model="data.chkFechaMovimiento"></bcs-input-checkbox>
					</div>
					<label class="col-xs-10" translate>UI_FECHA_MOVIMIENTO</label>
				</div>
			</div>
		</div>
	</form>

	<div class="col-xs-2">
		<div class="row">
			<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="frmConsultarCustodiaInstrPendientesNew.$valid" bcs-clic="buscar()" ></bcs-button>
		</div>
	</div>
  		
	<div class="col-xs-12">
		<div class="row" >
			<bcs-grid
				id="grid-custodia-pendientes"
				configuracion="confGrillaCustPendientes"
				seleccionado="seleccionCustPendientes"
				fn-exportar-excel="exportarExcel">
			</bcs-grid>
		</div>
	</div>
	
	<div class= "row">
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">		            
			<li ng-click="exportarExcel('custodia-pendientes')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

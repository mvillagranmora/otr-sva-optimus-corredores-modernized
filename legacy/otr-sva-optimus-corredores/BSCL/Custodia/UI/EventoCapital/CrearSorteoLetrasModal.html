<div ng-controller="CrearSuscripcionClienteModalCtrl">
	<div class	="row bcs_titulo" translate>
		UI_INGRESO_SUSCRIPCION
	</div>
	<!-- 
	<div 	ng-show	="data.Accion=='Modificar'"
			class="row bcs_titulo" translate>
		UI_MODIFICAR_EVENTO
	</div>
	 -->
	 
	 <form name="formSuscripcionClienteModal">

		<div class="col-xs-12">
		<input type="file" file-reader="data.fileContent" style="display:inline"/>
			<bcs-input-texto 
				tipo-campo="'textarea'" 
				atributos="height:300px;resize:none;width: 100%" 
				ng-model="data.fileContent">
			</bcs-input-texto>
		</div>
		
	</form>
	

	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2" ng-show="'true'" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_PRORRATEAR' | translate" bcs-habilitado="data.accionDisabled && formSuscripcionClienteModal.$valid" bcs-clic="data.CrearSuscripcionCliente()"></bcs-button>
		<bcs-button class="col-xs-2" ng-show="'true'" bcs-tipo="''"          bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-habilitado="data.accionDisabled" bcs-clic="data.btnCerrar(false)"></bcs-button>
	</div>

	</div> 
</div>

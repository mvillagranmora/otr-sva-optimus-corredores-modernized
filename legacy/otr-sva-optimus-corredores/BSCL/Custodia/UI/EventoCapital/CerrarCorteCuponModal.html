<div ng-controller="CerrarCorteCuponModalCtrl">

	
		<form name="formCerrarCorteCupon">
	<div class="row">	  	
	        <label class="col-xs-3" translate>UI_EMISOR</label>
	        <bcs-combobox-base 
	           ng-show="true"
	           class="col-xs-4"	           
	           id="UI_EMISOR"
	           bcs-requerido
			   tipo				= "data.oEmisor.tipo" 
			   id-actual		= "data.oEmisor.idActual"
			   id-defecto		= "data.oEmisor.idDefecto"  
			   configuracion	= "data.oEmisor.configuracion"
			   seleccionado		="data.oEmisor.seleccionado" 
			   filtros			="data.oEmisor.filtros"
			   activado 		= "data.activaroEmisor"
			   foco 			= "formData.Emisor">
			</bcs-combobox-base > 
	      </div>
     
			<div class="row">  
				<label class="col-xs-3" translate>UI_FECHA_PAGO</label>
				<bcs-input-date 
					class="col-xs-4" 
					bcs-requerido
					k-ng-model="data.kngFechaPago">
				</bcs-input-date>
			</div>
	
	
		</form>
		<div class="row bcs-panel-comandos">
			<bcs-button 
				class="col-xs-2" 
				ng-show="'true'" 
				bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="data.accionDisabled"	
				bcs-clic="data.CerrarCorteCupon()">
			</bcs-button>
		
			<bcs-button 
				class				="col-xs-2" 
				ng-show				="'true'" 
				bcs-tipo			="''"          
				bcs-auto-desactivar	="false" 
				bcs-texto			="'UI_CERRAR' | translate" 
				bcs-habilitado		="data.accionDisabled" 								
				bcs-clic			="data.btnCerrar(false)">
			</bcs-button>
		
		<input style="background-color:rgba(0, 0, 0, 0);border:none" readonly type="text"/>
	</div>
</div>

<div ng-controller="ModificaFormaPagoEventoCapitalClienteModalCtrl">
	<div class	="row bcs_titulo" translate>
		UI_MODIFICA_FORMA_PAGO
	</div>
	<form name="ModificaFormaPagoEventoCapitalClienteModal">
		<div class="row">
			<div class="col-xs-11">
				<div class="row">
					<div class="col-xs-12">
						<div class="col-xs-6">
							<label class="col-xs-6" translate>UI_DOCUMENTO_IDENTIDAD</label>
							<bcs-input-texto
				               	class			="col-xs-6"
				                id				="UI_DOCUMENTOIDENTIDADTXT"
				               	maxlength		="15"
								ng-model		="data.DocumentoIdentidadTXT"
								k-ng-disabled	= "'true'"
								foco 			= "formData.DocumentoIdentidad">
			               	</bcs-input-texto>
			            </div>
		               	<div class="col-xs-1"></div>
		               	<div class="col-xs-5">
							<label class="col-xs-3" translate>UI_PORTAFOLIO</label>
							<bcs-input-texto
				               	class			="col-xs-9"
				                id				="UI_PORTAFOLIOTXT"
				               	maxlength		="200"
								ng-model		="data.PortafolioTXT"
								k-ng-disabled	= "'true'"
								foco 			= "formData.Portafolio">
			               	</bcs-input-texto>
			            </div>	
					</div>
				</div>
				
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_NOMBRE</label>
						<bcs-input-texto
			               	class			="col-xs-9"
			                id				="UI_NOMBRETXT"
			               	maxlength		="15"
							ng-model		="data.NombreTXT"
							k-ng-disabled	= "'true'"
							foco 			= "formData.Nombre">
		               	</bcs-input-texto>
					</div>
				</div>
				<div class="row">
					<label class="col-xs-3" translate>UI_FORMA_PAGO</label>
					<bcs-combobox-base
						id 						= "EvCapForm_comboFormaDePago" 
						class					= "col-xs-9"
						activado 				= "'true'"
						filtros 				= "configuracionPreferenciaPagoPortafolio.filtros"
						tipo					= "'combobox-preferencia-pago-portafolio'"
						id-actual 				= "configuracionPreferenciaPagoPortafolio.IdPreferenciaPagoPortafolio"
						id-post-filtro 			= "configuracionPreferenciaPagoPortafolio.idPostFiltro"
						seleccionado			= "data.formaDePagoSeleccionada">
					</bcs-combobox-base>
	  			</div>
			</div>
		</div>
	</form>


	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button 
			class				="col-xs-2" 
			ng-show				="'true'" 
			bcs-tipo			="'bcs-button-primary'" 
			bcs-auto-desactivar	="false" 
			bcs-texto			="'UI_GRABAR' | translate" 
			bcs-habilitado		="'True'"
			bcs-clic			="data.ModificaFormaDePago()">
		</bcs-button>
		<bcs-button 
			class				="col-xs-2" 
			ng-show				="'true'" 
			bcs-tipo			="'bcs-button-secondary'"          
			bcs-auto-desactivar	="false" 
			bcs-texto			="'UI_CERRAR' | translate" 
			bcs-clic			="data.btnCerrar(false)"
			bcs-habilitado		="'True'"
			bcs-blur			="formData.resetFoco()">
		</bcs-button>
		<!-- <input style="background-color:rgba(0, 0, 0, 0);border:none" readonly type="text"/> -->
	</div>

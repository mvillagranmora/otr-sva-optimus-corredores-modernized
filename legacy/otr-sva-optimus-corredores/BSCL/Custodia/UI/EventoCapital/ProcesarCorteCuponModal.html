<div ng-controller="ProcesarCorteCuponModalCtrl">

	
		<form name="formProcesarCorteCupon">
   
			<div class="row">  
				<label class="col-xs-3" translate>UI_FECHA_DESDE</label>
				<bcs-input-date 
					class="col-xs-8" 
					bcs-requerido
					k-ng-model="data.kngFechaCorteCuponDesde">
				</bcs-input-date>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_HASTA</label>
				<bcs-input-date
					class="col-xs-8"
					bcs-requerido
					k-ng-model="data.kngFechaCorteCuponHasta">
				</bcs-input-date>
			</div>
	
	
		</form>
		<div class="row bcs-panel-comandos alignButtonsToRight" style="padding-top: 5px !important;">
			<bcs-button 
				class="col-xs-3" 
				ng-show="'true'" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="data.accionDisabled"	
				bcs-clic="data.ProcesarCorteCupon()">
			</bcs-button>
		
			<bcs-button 
				class				="col-xs-3" 
				ng-show				="'true'" 
				bcs-tipo			="'bcs-button-secondary'"          
				bcs-auto-desactivar	="false" 
				bcs-texto			="'UI_CERRAR' | translate" 
				bcs-habilitado		="data.accionDisabled" 								
				bcs-clic			="data.btnCerrar(false)">
			</bcs-button>
		
		<!-- <input style="background-color:rgba(0, 0, 0, 0);border:none" readonly type="text"/> -->
	</div>
</div>

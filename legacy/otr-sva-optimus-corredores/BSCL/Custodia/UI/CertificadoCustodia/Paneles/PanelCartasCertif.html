<div id="PanelCartasCertif" class="row" ng-controller="PanelCartasCertifCtrl as pcCus">
<form class="col-xs-12 form-horizontal">
	<!-- PARAMETROS CLIENTES -->
	<div class="row">
		<div class="col-xs-6">
			<bcs-input-checkbox class="col-xs-2"
				ng-model="pcCus.control.filtraContratoCustodia"
				ng-disabled="!pcCus.pantalla.modoEdicion"
				>
			</bcs-input-checkbox>
			<label class="col-xs-8" translate>UI_CIR_CLIENTES_CONTRATO_CUSTODIA</label>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-6">
			<bcs-input-checkbox class="col-xs-2"
				ng-model="pcCus.control.filtraIncluirClientesSinCustodia"
				ng-disabled="!pcCus.pantalla.modoEdicion"
				>
			</bcs-input-checkbox>
			<label class="col-xs-8" translate>UI_CIR_CLIENTES_SIN_CUSTODIA</label>
		</div>
	</div>
	<!-- FIN PARAMETROS CLIENTE -->	
	<hr>
	<br>
	<div class="row">
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroRV"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				</bcs-input-checkbox>
				<label class="col-xs-4" translate>UI_RENTA_VARIABLE</label>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroRF"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				 </bcs-input-checkbox>
				<label class="col-xs-4" translate>UI_RENTA_FIJA</label>
			</div>
	</div>
	
	<div class="row">
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroIIF"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				</bcs-input-checkbox>
				<label class="col-xs-7" translate>UI_INTERMEDIACION_FINANCIERA</label>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroFFMM"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				 </bcs-input-checkbox>
				<label class="col-xs-4" translate>UI_FFM</label>
			</div>
	</div>
	<hr>
	<br>	
	<div class="row">
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroPACTOS"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				</bcs-input-checkbox>
				<label class="col-xs-7" translate>UI_INCLUIR_OPERACION_DE_PACTO</label>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroVENTACORTA"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				 </bcs-input-checkbox>
				<label class="col-xs-7" translate>UI_INCLUIR_OPERACION_DE_VENTA_CORTA</label>
			</div>
	</div>	
	<div class="row">
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroSIMULTANEA"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				</bcs-input-checkbox>
				<label class="col-xs-7" translate>UI_INCLUIR_OPERACION_DE_SIMULTANEA</label>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroFORWARD"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				</bcs-input-checkbox>
				<label class="col-xs-7" translate>UI_INCLUIR_OPERACION_DE_FORWARDS</label>
			</div>
	</div>
	<div class="row">
		<div class="col-xs-6">
			<bcs-input-checkbox class="col-xs-2"
				ng-model="pcCus.control.registroPRESTAMOS"
				ng-disabled="!pcCus.pantalla.modoEdicion"
				>
			</bcs-input-checkbox>
			<label class="col-xs-7" translate>UI_INCLUIR_OPERACION_DE_PRESTAMOS</label>
		</div>
	</div>
	<hr>
	<br>	
	<div class="row">
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pcCus.control.registroMONTOCOMPROM"
					ng-disabled="!pcCus.pantalla.modoEdicion"
					>
				</bcs-input-checkbox>
				 <label class="col-xs-9" translate>UI_CONSIDERAR_MONTO_COMPROMETIDO</label> 
			</div>
	</div>	
	<hr>
</form>	
	<br>	
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button
			id="PanelCartasCertif_editar"
			class="col-xs-2"
			bcs-tipo="'bcs-button-primary'"
			ng-show="!pcCus.pantalla.modoEdicion"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_EDITAR' | translate"
			bcs-habilitado="!pcCus.pantalla.modoEdicion"
			bcs-clic="pcCus.editarPCCus()">
		</bcs-button>
		<bcs-button
			id="PanelCartasCertif_guardar"
			class="col-xs-2"
			bcs-tipo="'bcs-button-primary'"
			ng-show="pcCus.pantalla.modoEdicion"
			bcs-auto-desactivar="true"
			bcs-texto="'UI_GUARDAR' | translate"
			bcs-habilitado="pcCus.botonGuardarActivado"
			bcs-clic="pcCus.guardarParametros()">
		</bcs-button>		
	</div>
	
</div>


<div id="consultarContratosOpciones" ng-controller='ContratosOpcionesCtrl'>
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-12">
					<label translate class="col-xs-2">UI_CLIENTE_PORTAFOLIO</label>
					<bcs-combobox-base 
						id="ClientePortafolio"
						class="col-xs-8"
						style="width: 82%;"
						 tipo="'combobox-cliente-portafolio'"
						filtros="ordenOP.datosForm.configuracionPortafolio.filtros"
						bcs-requerido="true"
						muestra-enlace = "'S'"
						cascada-a="ordenOP.datosForm.configuracionPreferenciaPagoPortafolio.filtros.IdPortafolio"
						cascada-valor="'IdPortafolio'"
						cascada1-a="ordenOP.datosForm.configuracionAutorizadoDarOrdenes.filtros.IdPortafolio"
						cascada1-valor="'IdPortafolio'"
						cascada2-a="ordenOP.datosForm.configuracionCuentaCustodio.filtros.IdPortafolio"
						cascada2-valor="'IdPortafolio'"
						id-actual = "ordenOP.datosForm.configuracionPortafolio.idActual"
						seleccionado = "datos.portafolioSeleccionado">
					</bcs-combobox-base >
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-2" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-10" k-ng-model="datos.fecha" format="yyyy-mm-dd" bcs-requerido="true"></bcs-input-date>				
					
				</div>
			</div>

		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="datos.disableBtn" bcs-clic="buscar();"></bcs-button>
			</div>

			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiarFiltros()"></bcs-button>
			</div>

		</div>
		
		
	</div>
	

	<div class="row">
		<div class="col-xs-12">
			<bcs-grid id="grid-carteraCompras"
				configuracion = "confCompras"
				seleccionado = "seleccionCarterasAll"				
				ng-show="true">
			</bcs-grid>

		</div>
	</div>
	
	
		
</div>

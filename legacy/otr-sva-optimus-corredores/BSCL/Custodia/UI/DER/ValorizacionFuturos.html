
<div id="consultarValorizacionFuturos" ng-controller='CarteraValorizacionFuturosCtrl'>
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
					<bcs-combobox-base class="col-xs-4" 
						bcs-requerido
						auto-cargar		="'false'"
						tipo			="oClientePortafolio.tipo"
						id-actual		="filtros.IdPortafolio"
						carga-cliente-automatico	="'S'" 
						style           = "width: 82%;"
						seleccionado	="oClientePortafolio.seleccionado"
						filtros			="filtrosPortafolio"
						configuracion	="oClientePortafolio.configuracion">
					</bcs-combobox-base>
				</div>
			</div>
			
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button  class= "col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="Buscar();"></bcs-button>
			</div>
			<div class="row">
				<bcs-button  class= "col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="Limpiar()"></bcs-button>
			</div>
		</div>

	</div>

	<div class="row">
		<div class="col-xs-12">
			<new-bcs-grid id="grid-carteraFuturos"
				configuracion = "confValorizacionFuturos"
				seleccionado = "seleccionFila"
				fn-exportar-excel="excelCarterasAll"				
				ng-show="true">
			</new-bcs-grid>
		</div>
	</div>

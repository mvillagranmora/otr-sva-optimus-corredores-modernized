<div class="row" ng-controller='ConsultarTarjetaExistenciaCtrl'>
	<form name="frmTarjetaExistencia" class="row filters-formulario">
		<div class="col-xs-10">
			<div class="row">
				<label class="col-xs-2" translate>UI_INSTRUMENTO</label>
				<bcs-input-instrumentos class="col-xs-4"
					id					= "frmTarjetaExistencia_Instrumento"
					configuracion		= "filtro.oInstrumento.configuracion"  
					datos-instrumento	= "filtro.oInstrumento.datos"
					buscar-instrumento	= "filtro.oInstrumento.setInstrumento"
					muestra-precio 		= "false"
					filtro-estado 		= "'ACT'">
				</bcs-input-instrumentos>
				
				<label class="col-xs-1" style="padding-left:15px" translate>UI_CONCEPTO</label>
				<bcs-combobox-base id="frmTarjetaExistencia_Concepto" class="col-xs-5"
					auto-cargar		="'true'"
					tipo			= "'combobox-concepto-custodia'"  
					configuracion	= "filtro.oConfiguracionConcepto.configuracion" 
					id-actual		= "filtro.oConfiguracionConcepto.idActual" 
					seleccionado	= "filtro.oConfiguracionConcepto.seleccionado" 
					filtros			= "filtro.oConfiguracionConcepto.filtros"
					todos			="'S'" 
					item-post-filtro="'1'" 
				></bcs-combobox-base >
			</div>		
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date class="col-xs-4"
						id			= "frmTarjetaExistencia_FechaConsulta"
						k-options	= "{max: filtros.kngFechaConsultaHasta}"
						k-ng-model	= "filtro.kngFechaConsultaDesde">	
					</bcs-input-date>
					<bcs-input-date class="col-xs-4"						
						id			= "frmTarjetaExistencia_FechaConsulta"
						k-options	= "{min : filtros.kngFechaConsultaDesde}"
						k-ng-model	= "filtro.kngFechaConsultaHasta">
					</bcs-input-date>
				</div>
			</div>		
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" 
					bcs-tipo			="'bcs-button-search'" 
					bcs-auto-desactivar="'false'" 
					bcs-texto			="'UI_BUSCAR' | translate" 
					bcs-habilitado		="'true' && frmTarjetaExistencia.$valid " 
					bcs-clic			="Buscar()"
				></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" 
					bcs-tipo			="'bcs-button-secondary'"  
					bcs-auto-desactivar="'false'" 
					bcs-texto=			"'UI_LIMPIAR' | translate" 
					bcs-habilitado		="'true'"  
					bcs-clic			="Limpiar()"
				></bcs-button>
			</div>
		</div>
	</form>

	<uib-tabset>
		<!-- ********************************* DETALLADO ********************************* -->
		<uib-tab heading="{{'UI_DETALLADO' | translate}}">
			<div class="row" style="height: 380px">
				<bcs-grid id="frmTarjetaExistencia_gridConsultaTarjetaExistencia"
					configuracion		= "confConsultaTarjetaExistencia"
					seleccionado		= "seleccionConsultaTarjetaExistencia"
					fn-exportar-excel	= "excelTarjetaExistencia">
				</bcs-grid>
			</div>
			<div class="row" style="padding-top:10px">
				<bcs-button class="col-xs-2 pull-left"
					bcs-show			="SesionLocale==='PE'" 
					bcs-tipo			="'bcs-button-primary'" 
					bcs-auto-desactivar="'false'" 
					bcs-texto			="'UI_TARJETA_EXISTENCIA' | translate" 
					bcs-habilitado		="activarDescargaReportes" 
					bcs-clic			="obtenerTarjetaExistencia()"
				></bcs-button>
				<bcs-menu 
				class			="col-xs-1 pull-right" 
				bcs-tipo		="'bcs-button-secondary'"
				bcs-habilitado	="'true'" 
				bcs-texto		="'UI_OPCIONES' | translate">		            
					<li ng-click = "excelTarjetaExistencia('ConsultaTarjetaExistencia')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
			</div>
		</uib-tab>

		<!-- ********************************* RESUMIDO ********************************* -->
		<uib-tab heading="{{'UI_RESUMIDO' | translate}}">
			<div class="row" style="height: 380px">
				<bcs-grid 
					id="frmTarjetaExistencia_gridConsultaTarjetaExistenciaResumen"
					configuracion		= "confConsultaTarjetaExistenciaResumen"
					seleccionado		= "seleccionConsultaTarjetaExistenciaResumen"
					fn-exportar-excel	= "excelTarjetaExistenciaResumen">
				</bcs-grid>
			</div>
			<div class="row" style="padding-top:10px">
				<bcs-button class="col-xs-2 pull-left"
					bcs-show			="SesionLocale==='PE'" 
					bcs-tipo			="'bcs-button-primary'" 
					bcs-auto-desactivar="'false'" 
					bcs-texto			="'UI_CUADRO_RESUMEN' | translate" 
					bcs-habilitado		="activarDescargaReportes" 
					bcs-clic			="obtenerPosiciones()"
					>
				</bcs-button>
				<bcs-menu 
				class			="col-xs-1 pull-right" 
				bcs-tipo		="'bcs-button-secondary'"
				bcs-habilitado	="'true'" 
				bcs-texto		="'UI_OPCIONES' | translate">		            
					<li ng-click = "excelTarjetaExistenciaResumen('ConsultaTarjetaExistenciaResumen')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
			</div>
		</uib-tab>
	</uib-tabset>

	<div class="row" style="padding-top:5px; align-items: center;display: flex;justify-content: center;">
		<label class="col-xs-2" style="width: 13% !important;" translate>UI_FECHA_EJECUCION_PROCESO</label>
		<bcs-input-date class="col-xs-2"
			style="padding-right: 5px;"
			bcs-requerido
			id			= "frmTarjetaExistencia_FechaEjecucionProceso"
			k-ng-model	= "data.kngFechaProceso"
			k-options	= "data.FechaProcesoOptions">	
		</bcs-input-date>

		<bcs-button class="col-xs-2" 
			bcs-tipo			="'bcs-button-primary'" 
			bcs-auto-desactivar="'false'" 
			bcs-texto			="'UI_EJECUTAR_PROCESO' | translate" 
			bcs-habilitado		="'true'" 
			bcs-clic			="procesarTarjetaExistencia()"
		></bcs-button>
	</div>

</div>

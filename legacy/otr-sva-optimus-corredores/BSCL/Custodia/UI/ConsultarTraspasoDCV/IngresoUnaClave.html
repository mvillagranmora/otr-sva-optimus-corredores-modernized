<div class="row" ng-controller='IngresoClaveCtrl'>
<form name="frmIngresoClave">
	<div id="IngresoClave ">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-5" translate>UI_FOLIO_COMPROBANTE</label>
						<bcs-input-texto id="Folio" class="col-xs-7"
							ng-model="data.frmFolio"  
							k-ng-disabled='true'>
						</bcs-input-texto>							
					</div>
				</div>
	 			
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-5" translate>UI_RUT</label>
						<bcs-input-texto id="Rut" class="col-xs-7" 
						    ng-model="data.frmRut"
							k-ng-disabled='true'>
						</bcs-input-texto>																			
					</div>
				</div>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-5" translate>UI_INSTRUMENTO</label>
						<bcs-input-texto id="Instrumento" class="col-xs-7" 
							ng-model="data.frmInstrumento"
							k-ng-disabled='true'>
						</bcs-input-texto>																									
					</div>
				</div>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-5" translate>UI_CANTIDAD</label>
						<bcs-input-numero class="col-xs-7" id="Cantidad"
							k-ng-model="data.frmCantidad"
							k-ng-readonly='saldoReadOnly'
							decimales = "2" 
							k-ng-disabled = "'false'">
						</bcs-input-numero>						
					</div>
				</div>

				<hr>

				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-5" translate>UI_CLAVE_OPERACION</label>
						<bcs-input-texto id="Clave" class="col-xs-7" 
							ng-model="data.Clave" maxlength="15">
						</bcs-input-texto>																									
					</div>
				</div>

				<hr>
<!--  			
				
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-5" translate>UI_CORREDOR_CONTRAPARTE</label>
						<bcs-input-texto id="Rut" class="col-xs-5" 
						    ng-model="data.frmCorredor"
							k-ng-disabled='true'>
						</bcs-input-texto>																			
					</div>
				</div>
-->				
				
			</div>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'" bcs-clic="btnIngresar()" bcs-texto="'UI_GRABAR' | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>
		<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-secondary'" bcs-clic="btnCancelar()" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>		
	</div>
</form>
</div>

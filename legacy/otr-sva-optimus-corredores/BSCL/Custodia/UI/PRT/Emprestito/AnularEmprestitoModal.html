<div ng-controller="AnularEmprestitoModalCtrl">
	<div class="row bcs-cuerpo">
		<form name="formEmprestito">
			<div class="row">
				<label class="col-xs-3" translate>UI_FOLIO_PRESTAMO</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-disabled="'true'"
					k-ng-model="data.kngFolioPrsetamo"
					k-options ="data.folioPrsetamoOptions"
				></bcs-input-numero>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_FOLIO_EMPRESTITO</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-disabled="'true'"
					k-ng-model="data.kngFolioEmprestito"
					k-options ="data.folioEmprestitoOptions"
				></bcs-input-numero>
			</div>
		
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_PRESTAMO</label>
				<bcs-input-texto 
					class			="col-xs-9"
					k-ng-disabled	="'true'"
					ng-model		="data.tipoPrsetamo">
				</bcs-input-texto>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_INICIO</label>
				<bcs-input-date
					class="col-xs-3"
					bcs-requerido
					k-ng-model="data.kngFechaInicio"
					k-options="data.FechaInicioOptions"
					k-ng-disabled = "'true'"
				>
				</bcs-input-date>
			</div>	
			
			<div class="row">
				<label class="col-xs-3 " translate>UI_TIPO_INSTRUMENTO</label>
				<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.tipoInstrumento"
					k-ng-disabled="'true'"
				>
				</bcs-input-texto>
			</div>
			
			<div class="row">
				<label class="col-xs-3 " translate>UI_INSTRUMENTO</label>
				<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.instrumento"
					k-ng-disabled="'true'"
				>
				</bcs-input-texto>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_GARANTIAS_ESPECIFICAS</label>
				<input type="checkbox"
					ng-model="data.checkConGarantiasEspecificas"
					ng-disabled="'true'" >
			</div>
			<hr>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_PRESTAMISTA</label>			
				<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.prestamista"
					k-ng-disabled="'true'"
				>
				</bcs-input-texto>
			</div>
<!-- 
			<div class="row">
				<label class="col-xs-3" translate>UI_CUSTODIO</label>
				<bcs-input-texto class="col-xs-9"    
					name="data.custodio"     
					ng-model="data.custodio"
					k-ng-disabled = "'true'" 
				>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_CUENTA_DEPOSITO</label>
				<bcs-input-texto class="col-xs-9"    
					name="data.cuentaDeposito"     
					ng-model="data.cuentaDeposito"
					k-ng-disabled = "'true'" 
				>
				</bcs-input-texto>              
				
			</div>
			<hr>
 -->
			<div class="row">
				<label class="col-xs-3" translate>UI_CANTIDAD</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-model="data.kngCantidad"
					k-options ="data.cantidadOptions"
					k-ng-disabled = "'true'"
				>
				</bcs-input-numero>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PRECIO</label>
				<bcs-input-monetario
					class="col-xs-3"
					k-options ="data.precioOptions"
					k-ng-model="data.kngPrecio"
					k-ng-disabled="'true'"
				>
				</bcs-input-monetario>			
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO</label>
				<bcs-input-monetario
					class="col-xs-3"
					k-ng-disabled="'true'"
					k-ng-model="data.kngMonto"
					k-options ="data.montoOptions"
					simbolo="data.monedaInstrumento"
				></bcs-input-monetario>
			</div>
			
			<div class="row"> 
				<label class="col-xs-3" translate>UI_FECHA_ANULACION</label>
				<bcs-input-date
					class="col-xs-3"
					k-ng-model="data.kngFechaAnulacion"
					k-options="data.FechaAnulacionOptions"
					k-ng-disabled = "'true'"
				>
				</bcs-input-date>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PLAZO</label>
				<bcs-input-numero 
					class="col-xs-3"
					k-ng-model="data.kngPlazo"
					k-options ="data.plazoOptions"
					k-ng-disabled = "'true'" 
				>
				</bcs-input-numero>
			</div>
			
			
			<div class="row">
				<label class="col-xs-3" translate>UI_PORCENTAJE_PREMIO_ABR</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-model="data.kngPorcentajePremio"
					k-options ="data.porcentajePremioOptions"
					k-ng-disabled = "'true'"
				>
				</bcs-input-numero>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PREMIO</label>
				<bcs-input-monetario
					class="col-xs-3"
					k-ng-disabled="'true'"
					k-ng-model="data.kngMontoPremio"
					k-options ="data.montoPremioOptions"
					simbolo="data.monedaInstrumento"
				></bcs-input-monetario>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_PLAZO</label>
				<bcs-input-monetario
					class="col-xs-3"
					k-ng-disabled="'true'"
					k-ng-model="data.kngMontoPlazo"
					k-options ="data.montoPlazoOptions"
					simbolo="data.monedaInstrumento"
				></bcs-input-monetario>
			</div>
			
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="col-xs-2" ng-show="'true'" bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="false" bcs-texto="'UI_DESASIGNAR' | translate" bcs-habilitado="data.accionDisabled && formEmprestito.$valid" bcs-clic="data.anularEmprestito()"></bcs-button>
		<bcs-button class="col-xs-2" ng-show="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-habilitado="data.accionDisabled" bcs-clic="data.btnCerrar(false)"></bcs-button>
	</div>
</div>

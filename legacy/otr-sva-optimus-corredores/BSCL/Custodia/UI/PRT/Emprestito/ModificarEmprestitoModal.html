<div ng-controller="ModificarEmprestitoModalCtrl">
	<div class="row bcs-cuerpo">
		<form name="formEmprestito">
			<div class="row">
				<label class="col-xs-3" translate>UI_FOLIO_PRESTAMO</label>
				<bcs-input-numero
					class="col-xs-2"
					k-ng-disabled="'true'"
					k-ng-model="data.kngFolioPrsetamo"
					k-options ="data.folioPrsetamoOptions">
				</bcs-input-numero>
				<label class="col-xs-2 col-xs-offset-2" translate>UI_FOLIO_EMPRESTITO</label>
				<bcs-input-numero
					class="col-xs-2"
					k-ng-disabled="'true'"
					k-ng-model="data.kngFolioEmprestito"
					k-options ="data.folioEmprestitoOptions">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_PRESTAMO</label>
				<bcs-input-texto 
					class="col-xs-9"
					k-ng-disabled="'true'"
					ng-model="data.tipoPrsetamo">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_INICIO</label>
				<bcs-input-date
					class="col-xs-3"
					bcs-requerido
					k-ng-model="data.kngFechaInicio"
					k-options="data.FechaInicioOptions"
					k-ng-disabled="'true'">
				</bcs-input-date>
			</div>	
			<div class="row">
				<label class="col-xs-3 " translate>UI_TIPO_INSTRUMENTO</label>
				<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.tipoInstrumento"
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3 " translate>UI_INSTRUMENTO</label>
				<bcs-input-texto 
					class="col-xs-3"
					ng-model="data.instrumento"
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			
			<hr>
			<div class="row">
				<label class="col-xs-3" translate>UI_PRESTAMISTA</label>			
				<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.prestamista"
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			
			<hr>
			<div class="row">
				<label class="col-xs-3" translate>UI_CANTIDAD</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-disabled="'true'"
					k-ng-model="data.kngCantidad"
					k-options ="data.cantidadOptions">
				</bcs-input-numero>
							
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PRECIO</label>
				<bcs-input-monetario
					class="col-xs-2"
					k-ng-disabled="'true'"
					bcs-mayor-que="'0'"
					k-options ="data.precioOptions"
					k-ng-model="data.kngPrecio"
					>
				</bcs-input-monetario>			
			</div>
			
			
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO</label>
				<bcs-input-monetario
					class="col-xs-3"
					bcs-mayor-que="'-1'"
					k-ng-disabled="'true'"
					simbolo="data.monedaInstrumento"
					k-ng-model="data.kngMonto"
					k-options ="data.montoOptions">
				</bcs-input-monetario>

				
			</div>
			<div class="row">

				<label class="col-xs-3" translate>UI_FECHA_VENCIMIENTO</label>
				<bcs-input-date
					class="col-xs-3"
					bcs-requerido
					k-ng-model="data.kngFechaVencimiento"
					k-options="data.FechaVencimientoOptions"
					k-ng-disabled="'true'">
				</bcs-input-date>								
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PLAZO</label>
				<bcs-input-numero 
					class="col-xs-1"
					k-ng-model="data.kngPlazo"
					k-options="data.plazoOptions"
					k-ng-disabled="'true'">
				</bcs-input-numero>
			</div>
			
			
			<div class="row">
				<label class="col-xs-3" translate>UI_PORCENTAJE_PREMIO_ABR</label>
				<bcs-input-numero
					class="col-xs-3"
					bcs-mayor-igual-que="'-1'"
					k-ng-model		= "data.kngPorcentajePremio"
					k-options 		= "data.porcentajePremioOptions">
				</bcs-input-numero>
				<!-- k-ng-disabled 	= "data.PorcentajePremioDisabled" -->
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PREMIO</label>
				<bcs-input-monetario
					class="col-xs-3"
					bcs-mayor-igual-que="'-1'"
					k-ng-disabled="'true'"
					simbolo="data.monedaInstrumento"
					k-ng-model="data.kngMontoPremio"
					k-options ="data.montoPremioOptions">
				</bcs-input-monetario>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_PLAZO</label>
				<bcs-input-monetario
					class="col-xs-3"
					bcs-mayor-que="'-1'"
					k-ng-disabled="'true'"
					k-ng-model="data.kngMontoPlazo"
					simbolo="data.monedaInstrumento"
					k-options ="data.montoPlazoOptions">
				</bcs-input-monetario>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_INTERES_DIARIO</label>
				<bcs-input-numero
					class="col-xs-3"
					bcs-mayor-igual-que = "'-1'"
					decimales   		= "0"
					k-ng-disabled		= "'true'"
					k-ng-model			= "data.kngInteresDiario"
					k-options 			= "data.InteresDiarioOptions">
				</bcs-input-numero>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_INTERES_ACUMULADO</label>
				<bcs-input-numero
					class="col-xs-3"
					bcs-mayor-igual-que = "'-1'"
					decimales   		= "0"
					k-ng-disabled       = "'true'"
					k-ng-model		    = "data.kngInteresAcumulado"
					k-options 		    = "data.InteresAcumuladoOptions">
				</bcs-input-numero>
			</div>			
	
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button 
			class="col-xs-2" 
			ng-show="'true'" 
			bcs-tipo="'principal'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GRABAR' | translate" 
			bcs-habilitado="data.accionDisabled && formEmprestito.$valid" 
			bcs-clic="data.ModificarEmprestito()">
		</bcs-button>
		
		
		<bcs-button 
			class="col-xs-2" 
			ng-show="'true'" 
			bcs-tipo="'default'" 
			bcs-auto-desactivar="false"
			bcs-texto="'UI_CERRAR' | translate" 
			bcs-clic="data.btnCerrar(false)"
			bcs-habilitado="'true'"
			>
		</bcs-button>
	</div>
</div>

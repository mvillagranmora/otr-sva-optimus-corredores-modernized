<div ng-controller="ConsultarPrestamistasDisponiblesSinCustodiaModalCtrl">
	<div class="row bcs-cuerpo">
		<form name="formConsultarPrestamistasDisponiblesSinCustodia">
			<div class="row" ng-show="data.oDatosCartera.Filtrado">
			<!-- FILTROS -->
				<div class="col-xs-12">	
					<div class="row">
	                	<label class="col-xs-2" translate>UI_SOCIO_NEGOCIO</label>
						<bcs-input-texto class="col-xs-10"
							id				="formConsultarPrestamistasDisponiblesSinCustodia_SocioNegocioTexto"
							k-ng-disabled	="'true'"
							ng-model		="data.oDatosCartera.SocioNegocio">
						</bcs-input-texto>
            		</div>
            		
		            <div class="row">
	                    <label class="col-xs-2" translate>UI_PORTAFOLIO</label>
						<bcs-input-texto class="col-xs-10"
							id				="formConsultarPrestamistasDisponiblesSinCustodia_PortafolioTexto"
							k-ng-disabled	="'true'"
							ng-model		="data.oDatosCartera.Portafolio">
						</bcs-input-texto>
		            </div>
					
					<div class="row">
						<label class="col-xs-2" translate>UI_FECHA</label>
						<bcs-input-date class="col-xs-2"
							id		="formConsultarPrestamistasDisponiblesSinCustodia_FechaTexto"
							k-ng-model	="data.oDatosCartera.fechaBusqueda"
							k-ng-disabled 	= "'true'">
						</bcs-input-date>
					</div>

				</div>
			</div>
		</form>			
		<div class="row">
			<bcs-grid id="formConsultarPrestamistasDisponiblesSinCustodia_grid-prestamistas"
				configuracion = "data.confBasicaPrestamistas"
				seleccionado = "data.selPrestamistas"
				fn-doble-click = "data.fnDobleClick(data.selPrestamistas)">
			</bcs-grid>
		</div>

	</div>
</div>

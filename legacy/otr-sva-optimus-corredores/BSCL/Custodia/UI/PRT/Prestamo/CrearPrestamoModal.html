<div ng-controller="CrearPrestamoModalCtrl">
	<div class="row bcs-cuerpo">
		<form name="formPrestamo">
			<div class="row">
				<label class="col-xs-3" translate>UI_MERCADO</label>
				<bcs-combobox-base class="col-xs-9" auto-cargar="'true'"
					id	="UI_MERCADO"
					bcs-requerido tipo="'combobox-clasificacion-tipo-instrumento'"
					configuracion="data.oConfiguracionMercado.configuracion"
					seleccionado="data.oConfiguracionMercado.seleccionado"
					filtros="data.oConfiguracionMercado.filtros"
					id-actual="data.oConfiguracionMercado.idActual"
					todos="'N'"
					item-post-filtro="'1'">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3 " translate>UI_TIPO_PRESTAMO</label>
				<bcs-combobox-base class="col-xs-4" auto-cargar="'true'"
					bcs-requerido tipo="'combobox-tipo-prestamo'"
					filtros="data.oConfiguracionTipoPrestamo.filtros"
					configuracion="data.oConfiguracionTipoPrestamo.configuracion"
					id-actual="data.oConfiguracionTipoPrestamo.idActual"
					seleccionado="data.oConfiguracionTipoPrestamo.seleccionado"
					item-post-filtro="data.oConfiguracionTipoPrestamo.itemPostFiltro"
					todos="'N'">
				</bcs-combobox-base>
				<label class="col-xs-3 col-xs-offset-1" translate>UI_COBRO_PRIMA_INICIO</label>
				<bcs-input-checkbox ng-model="data.checkCobroAlInicio"
					ng-disabled="'true'"> </bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_CUSTODIA</label>
				<bcs-input-checkbox ng-disabled="data.checkTipoCustodiaHabilita" ng-model="data.checkTipoCustodia"> </bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_BOLSA</label>
				<bcs-combobox-base class="col-xs-9" auto-cargar="'true'"
					bcs-requerido tipo="'combobox-bolsa'"
					id-actual="data.oConfiguracionBolsa.IdActual"
					configuracion="data.oConfiguracionBolsa.configuracion"
					seleccionado="data.oConfiguracionBolsa.seleccionado"
					filtros="data.oConfiguracionBolsa.filtros" memoria="'PRESTAMO'"
					cascada1-a="data.oConfiguracionTipoInstrumento.filtros.IdBolsa"
					cascada1-valor="'IdBolsa'"> </bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FOLIO_ENTIDAD</label>
				<bcs-input-texto class="col-xs-9" ng-model="data.folioEntidad">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FOLIO_TRANSACCION</label>
				<bcs-input-texto class="col-xs-9" ng-model="data.folioTransaccion">
				</bcs-input-texto>
			</div>
			<hr>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
				<bcs-combobox-base class="col-xs-9" auto-cargar="'true'"
					bcs-requerido tipo="'combobox-tipo-instrumento'"
					configuracion="data.oConfiguracionTipoInstrumento.configuracion"
					seleccionado="data.oConfiguracionTipoInstrumento.seleccionado"
					filtros="data.oConfiguracionTipoInstrumento.filtros"
					id-actual="data.oConfiguracionTipoInstrumento.idActual"
					memoria="data.oConfiguracionBolsa.IdActual" todos="'N'">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_INSTRUMENTO</label>
				<bcs-input-instrumentos class="col-xs-9" bcs-requerido
					ng-style="{'width': data.muestraDatosRF ? '33.33333333%' : '75%'}"
					name="uInstrumento" buscar-instrumento="data.nginstrumento"
					datos-instrumento="data.instrumento"
					muestra-precio="(data.muestraDatosRF?'N':'S')"
					filtro-estado="'ACT'"
					filtro-solo-vigentes = "'S'"
					filtro-tipo-instrumento="data.oConfiguracionTipoInstrumento.idActual"
					filtro-bolsa="data.oConfiguracionBolsa.IdActual"> 	
				</bcs-input-instrumentos>

				<label class="col-xs-2 col-xs-offset-1" translate ng-show="data.muestraDatosRF">UI_CORTE_MINIMO</label>
				<bcs-input-numero ng-show="data.muestraDatosRF" class="col-xs-2"
					id="UI_CORTE_MINIMO" k-ng-model="data.kngCorteMinimo"
					k-options="data.corteMinimoOptions"
					simbolo="data.monedaCorteMinimo"
					decimales="data.oDecimales.corteMinimo.decimales"
					k-ng-disabled="'true'"></bcs-input-numero>

			</div>

			<div class="row" ng-show="data.muestraDatosRF">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_EMISOR</label>
					<bcs-combobox-base class="col-xs-9" auto-cargar="'true'"
						id="UI_EMISOR" bcs-requerido="'false'" tipo="'combobox-emisor'"
						id-actual="data.oConfiguracionEmisor.idActual"
						id-post-filtro="data.oConfiguracionEmisor.idPostFiltro"
						configuracion="data.oConfiguracionEmisor.configuracion"
						seleccionado="data.oConfiguracionEmisor.seleccionado"
						filtros="data.oConfiguracionEmisor.filtros" activado="'false'">
					</bcs-combobox-base>
				</div>
			</div>


			<div class="row" ng-show="data.muestraDatosRF">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_TIPO_REAJUSTE</label>
					<bcs-combobox-base class="col-xs-9" auto-cargar="'false'"
						id="UI_TIPO_REAJUSTE" bcs-requerido="'false'"
						tipo="'combobox-instrumento-tipo-reajuste'"
						configuracion="data.oConfiguracionTipoReajuste.configuracion"
						seleccionado="data.oConfiguracionTipoReajuste.seleccionado"
						filtros="data.oConfiguracionTipoReajuste.filtros"
						id-actual="data.kngIdTipoReajuste"
						id-post-filtro="data.oConfiguracionTipoReajuste.idPostFiltro"
						id-defecto="data.oConfiguracionTipoReajuste.idDefecto"
						item-post-filtro="'1'" activado="'false'"> </bcs-combobox-base>
				</div>
			</div>


			<div class="row" ng-show="data.muestraDatosRF">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_VENCIMIENTO</label>
					<bcs-input-plazo class="col-xs-9"
						bcs-requerido="data.muestraDatosRF"
						id="UI_FECHA_VENCIMIENTO_INSTRUMENTO"
						fecha-inicial="data.kngFechaOperacion"
						fecha-vencimiento="data.kngFechaVencimientoInstr"
						plazo="data.kngPlazoInstr" activa-plazo="false"
						activa-fecha="false"> </bcs-input-plazo>
				</div>
			</div>

			<hr>
			<div class="row">
				<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-combobox-base class="col-xs-9" id="UI_SOCIO_NEGOCIO"
					bcs-requerido
					carga-cliente-automatico="'S'"
					ng-style		= "{'width' : oClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && oClientePortafolio.seleccionado  ? '64%' : '75%'}"
					auto-cargar		= "'true'"
					tipo			= "oClientePortafolio.tipo"
					seleccionado	= "oClientePortafolio.seleccionado"
					id-actual		= "oClientePortafolio.idActual"
					filtros			= "oClientePortafolio.filtros"
					configuracion	= "oClientePortafolio.configuracion">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_CLIENTE_CUSTODIA_EXTERNA</label>
				<input type="checkbox" ng-model="data.checkCustodiaExterna"
					ng-disabled="'true'">
			</div>
			<!-- <div class="row">
				<label class="col-xs-3" translate>UI_CUSTODIO</label>
				<bcs-input-texto class="col-xs-9"    
					name="data.custodio"     
					ng-model="data.ngCustodio"
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_CUENTA_DEPOSITO</label>
				<bcs-input-texto class="col-xs-9"    
					name="data.cuentaDeposito"     
					ng-model="data.ngCuentaDeposito"
					k-ng-disabled="'true'">
				</bcs-input-texto>     
			</div>
-->
			
			<div class="col-xs-12" style="border: 1px solid rgb(201, 201, 201);border-radius:2px;padding:.5em;min-height: 20px;margin-bottom: .5rem; margin-top: .5rem;">
				<div class="row">
					<label class="col-xs-2" translate>UI_CANTIDAD</label>
					<bcs-input-numero class="col-xs-4 col-xs-offset-1" bcs-requerido
						k-ng-model="data.kngCantidad" k-options="data.cantidadOptions">
					</bcs-input-numero>

					<label class="col-xs-3" ng-show="!data.muestraDatosRF">&nbsp;</label>
					<label class="col-xs-1 col-xs-offset-1" translate ng-show="data.muestraDatosRF">UI_TASA</label>
					<label class="col-xs-2" ng-show="!data.muestraDatosRF">&nbsp;</label>
					<bcs-input-numero ng-show="data.muestraDatosRF" class="col-xs-3"
					k-ng-model="data.kngTasa" k-options="data.tasaOptions">
					</bcs-input-numero>					
				</div>

				<div class="row">
					<label class="col-xs-2" translate>UI_PRECIO</label>
					<bcs-input-monetario class="col-xs-4 col-xs-offset-1" bcs-mayor-que="'-1'"
						k-options="data.precioOptions" simbolo="data.monedaInstrumento"
						k-ng-model="data.kngPrecio"> </bcs-input-monetario>

						<bcs-button class="col-xs-3 col-xs-offset-2" ng-show="data.muestraDatosRF"
							bcs-tipo="'bcs-button-secondary'" style="position: absolute; width: 24.5%;" bcs-auto-desactivar="false"
							bcs-texto="'UI_VALORIZAR' | translate" bcs-habilitado="'true'"
							bcs-clic="data.ObtenerValorizacion()"> </bcs-button>
				</div>
				
				<div class="row">
					 <label class="col-xs-2" translate>UI_MONTO</label>
					<bcs-input-monetario class="col-xs-4 col-xs-offset-1" bcs-mayor-que="'0'"
						simbolo="data.monedaInstrumento" k-ng-disabled="'true'"
						k-ng-model="data.kngMonto" k-options="data.montoOptions">
					</bcs-input-monetario>
				</div>
			</div>
			
		
			<div class="row">
				<label class="col-xs-3" translate>UI_CONDICION_LIQUIDACION</label>
				
				<bcs-input-condicion-liquidacion
					class = "col-xs-4"
					bcs-requerido
					set-id-condicion-liquidacion = "data.IdCondicionDeLiquidacion"
					fecha-inicial 				 = "data.fechaInicialCondicionDeLiquidacion"
					condicion-de-liquidacion 	 = "data.condicionLiquidacionSeleccionada"
					id-tipo-operacion 			 = "data.idTipoOperacion"
					fecha-liquidacion 			 = "data.fechaLiquidacion"
					activado 					 = "'true'">
				</bcs-input-condicion-liquidacion>

			</div>		
	
			
			
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_VENCIMIENTO</label>
				
				<bcs-input-plazo
					id="CraerPrestamoModal_InputPlazoVencimiento"
					class="col-xs-4"
					activa-fecha="true"
					activa-plazo="true"
					bcs-menor-igual-que="data.MaximoDiasPrestamo"
					bcs-mayor-igual-que="data.MinimoDiasPrestamo"
					fecha-inicial="data.fechaInicialVencimiento"
					fecha-vencimiento="data.kngFechaVencimiento"
					plazo="data.kngPlazo"
					id-tipo-operacion="data.idTipoOperacion"
					id-condicion-de-liquidacion="'T0'"
					bcs-requerido="true"
					id-tipo-prestamo="data.oConfiguracionTipoPrestamo.seleccionado.IdTipoPrestamo"
				>
				</bcs-input-plazo>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_PORCENTAJE_PRIMA_ABR</label>
				<bcs-input-numero class="col-xs-4" bcs-mayor-igual-que="'-1'"
					k-ng-model="data.kngPorcentajePrima"
					k-options="data.porcentajePrimaOptions"> </bcs-input-numero>
				<label class="col-xs-1 col-xs-offset-1" translate>UI_PRIMA</label>
				<bcs-input-monetario class="col-xs-3" bcs-mayor-igual-que="'-1'"
					k-ng-disabled="'true'" k-ng-model="data.kngMontoPrima"
					simbolo="data.monedaInstrumento" k-options="data.montoPrimaOptions">
				</bcs-input-monetario>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_PLAZO</label>
				<bcs-input-monetario class="col-xs-4" bcs-mayor-que="'-1'"
					k-ng-disabled="'true'" k-ng-model="data.kngMontoPlazo"
					simbolo="data.monedaInstrumento" k-options="data.montoPlazoOptions">
				</bcs-input-monetario>
			</div>
			<div class="row" ng-show="'false'">
				<label class="col-xs-3" translate>UI_GARANTIAS_ESPECIFICAS</label>
				<bcs-input-checkbox ng-model="data.checkConGarantiasEspecificas" ng-disabled="data.checkTipoCustodia === false">
				</bcs-input-checkbox>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="col-xs-2" ng-show="'true'" bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_GRABAR' | translate"
			bcs-habilitado="data.yaValorizo && data.accionDisabled && formPrestamo.$valid"
			bcs-clic="data.crearPrestamo()"> </bcs-button>
		
		<bcs-button class="col-xs-2" ng-show="'true'" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate"
			bcs-habilitado="data.accionDisabled" bcs-clic="data.btnCerrar(false)">
		</bcs-button>
	</div>
</div>

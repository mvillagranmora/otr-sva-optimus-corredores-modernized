<div ng-controller="AnticiparPrestamoModalCtrl">
	<div class="row bcs-cuerpo">
		<form name="formAnticipoPrestamo">
			<div class="row">
				<label class="col-xs-3 " translate>UI_TIPO_PRESTAMO</label>
			    <bcs-input-texto 
			    	class	= "col-xs-9"
					ng-model= "data.oShow.NombreTipoPrestamo"
					k-ng-disabled="'true'" 
					>
				</bcs-combobox-base>
				<label class="col-xs-3 col-xs-offset-1" translate>UI_COBRO_PRIMA_INICIO</label>
				<bcs-input-checkbox
					ng-model="data.oShow.checkCobroAlInicio"
					ng-disabled="'true'">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FOLIO_PRESTAMO</label>
				<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.oShow.folioPrestamo"
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
			
			<div class="row">
                 <label class="col-xs-3" translate>UI_CLIENTE</label>
             	<bcs-input-texto 
					class="col-xs-9"
					ng-model="data.oShow.nombreCliente"
					k-ng-disabled="'true'"
				>
				</bcs-input-texto>
          	</div>
            <div class="row">
                 <label class="col-xs-3" translate>UI_PORTAFOLIO</label>
				 <bcs-combobox-base class="col-xs-9"
				 	id="UI_PORTAFOLIO"
				 	auto-cargar="'true'"
				    tipo="'combobox-portafolio'"
				    id-Actual="oPortafolio.idActual"
				    id-Defecto="oPortafolio.idDefecto"
				    activado="'false'"
				    filtros="oPortafolio.filtros"
				>
				</bcs-combobox-base >
            </div>
			<hr>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
				<bcs-combobox-base class="col-xs-9" 
					auto-cargar="'true'"
					tipo="'combobox-tipo-instrumento'"
					seleccionado="data.oConfiguracionTipoInstrumento.seleccionado"
					idActual="data.oConfiguracionTipoInstrumento.idActual"
					idDefecto="data.oConfiguracionTipoInstrumento.idDefecto"
					ng-disabled = "'true'"
					filtros="data.oConfiguracionTipoInstrumento.filtros"
					activado="false"
					item-post-filtro="1"
				>
				</bcs-combobox-base> 	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_INSTRUMENTO</label>				
				<bcs-input-texto class="col-xs-9" 
					ng-model="data.oShow.Nemotecnico"
					k-ng-disabled="'true'"
				>
				</bcs-input-instrumentos>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_CANTIDAD</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-model="data.oShow.kngCantidad"
					k-options ="data.cantidadOptions">
				</bcs-input-numero>
				<label class="col-xs-2 col-xs-offset-1" translate ng-show="data.muestraDatosRF">UI_CORTE_MINIMO</label>
				<bcs-input-monetario ng-show="data.muestraDatosRF" class="col-xs-2"
					id="UI_CORTE_MINIMO" k-ng-model="data.kngCorteMinimo"
					k-options="data.corteMinimoOptions"
					simbolo="data.monedaCorteMinimo"
					decimales="data.oDecimales.corteMinimo.decimales"
					k-ng-disabled="'true'"></bcs-input-monetario> 
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_PRECIO</label>
				<bcs-input-monetario
					class="col-xs-3"
					k-options ="data.precioOptions"
					k-ng-model="data.oShow.kngPrecio"
					k-ng-disabled="'true'"
					simbolo="data.monedaInstrumento"
					>
				</bcs-input-monetario>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO</label>
				<bcs-input-monetario
					class="col-xs-3"
					bcs-mayor-que="'0'"
					k-ng-disabled="'true'"
					simbolo="data.monedaInstrumento"
					k-ng-model="data.oShow.kngMonto"
					k-options ="data.montoOptions">
				</bcs-input-monetario>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_DIAS_COBRADOS</label>
				<bcs-input-numero 
					class="col-xs-3"
					k-ng-model="data.kngDiasCobradosPrestatario"
					k-options="data.plazoOptions"
					k-ng-disabled="'true'">
				</bcs-input-numero>
				
			</div>
			<div class="row"> 
				<label class="col-xs-3" translate>UI_FECHA_VENCIMIENTO</label>
				
				<bcs-input-date
					class="col-xs-3"
					bcs-requerido
					k-ng-model="data.oShow.kngFechaVencimiento"
					k-options="data.FechaVencimientoOptions"
					k-ng-disabled="'true'">
				</bcs-input-date>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PLAZO_RESIDUAL</label>
				<bcs-input-numero
					class="col-xs-3"
					k-ng-model="data.oShow.kngPlazoPrestatario"
					k-ng-disabled="'true'"
					k-options ="data.plazoOptions">
				</bcs-input-numero>

			</div>
			<div class="row"> 
				<label class="col-xs-3" translate>UI_CONDICION_LIQUIDACION</label>
				<bcs-input-condicion-liquidacion
					class = "col-xs-3"
					bcs-requerido
					set-id-condicion-liquidacion = "data.IdCondicionDeLiquidacion"
					fecha-inicial 				 = "data.fechaInicial"
					condicion-de-liquidacion 	 = "data.condicionLiquidacionSeleccionada"
					id-tipo-operacion 			 = "data.idTipoOperacion"
					fecha-liquidacion 			 = "data.fechaLiquidacion"
					activado 					 = "'false'">
				</bcs-input-condicion-liquidacion>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_PORCENTAJE_PRIMA_ABR</label>
				<bcs-input-numero
					class="col-xs-3"
					bcs-mayor-igual-que="'-1'"
					k-ng-model="data.oShow.kngPorcentajePrima"
					k-options ="data.porcentajePrimaOptions"
					k-ng-disabled = "data.PorcentajePrimaDisabled"
				>
				</bcs-input-numero>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PRIMA</label>
				<bcs-input-monetario
					class="col-xs-3"
					bcs-mayor-igual-que="'-1'"
					k-ng-model="data.oShow.kngMontoPrima"
					k-options ="data.montoPrimaOptions"
					k-ng-disabled = "data.PorcentajePrimaDisabled"
					simbolo="data.monedaInstrumento"
					>
				</bcs-input-monetario>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_PLAZO</label>
				<bcs-input-monetario
					class="col-xs-3"
					bcs-requerido="true"
					k-ng-disabled="'true'"
					k-ng-model="data.oShow.kngMontoPlazoPrestatario"
					simbolo="data.monedaInstrumento"
					k-options ="data.montoPlazoOptions">
				</bcs-input-monetario>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_PREMIO</label>
				<bcs-input-monetario
					class="col-xs-3"
					k-ng-model="data.oShow.kngTotalPremio"
					simbolo="data.monedaInstrumento"
					k-options ="data.montoPrimaOptions"
					k-ng-disabled="'true'">
					
				</bcs-input-monetario>
			</div>					
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button 
			class="col-xs-2" 
			ng-show="'true'" 
			bcs-habilitado="data.accionDisabled"
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GRABAR' | translate" 
			bcs-clic="data.fnAnticipar()">
		</bcs-button>
		<bcs-button 
			class="col-xs-2" 
			ng-show="'true'"
			bcs-habilitado="true" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CERRAR' | translate" 
			bcs-clic="data.btnCerrar(false)">
		</bcs-button>
	</div>
</div>

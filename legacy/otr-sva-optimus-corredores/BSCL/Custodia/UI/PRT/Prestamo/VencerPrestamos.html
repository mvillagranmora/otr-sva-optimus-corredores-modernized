<div ng-controller="VencerPrestamosCtrl">
    <div class="row bcs_titulo">
        <div class="col-xs-12">
            <span>{{'UI_VENCIMIENTO_PRESTAMO'|translate}}</span>
        </div>
    </div>
            
    <div class="col-xs-12 bcs-cuerpo">
        <!-- DATOS DEL VENCIMIENTO -->
        <div class="row">
            <label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO</label>
            <bcs-input-date class="col-xs-8"
                k-ng-model="data.kngFechaSistema"
                ng-model="data.fechaMovimiento"
                k-ng-disabled = "data.FechaMovimientoDisabled" 
            ></bcs-input-date><!-- "'true'" -->
        </div>      
        
        <div class="row"><br></div> 
        
        <!-- BOTONES -->
        <div class="row bcs-panel-comandos alignButtonsToRight">
            <bcs-button class="col-xs-3" 
                bcs-tipo="'bcs-button-primary'" 
                bcs-auto-desactivar="'true'" 
                bcs-texto="'UI_EJECUTAR' | translate" 
                bcs-habilitado="data.procesarDisabled" 
                bcs-clic="data.procesar()"                  
            ></bcs-button>              
            <bcs-button class="col-xs-3" 
                bcs-tipo="'bcs-button-secondary'" 
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_CANCELAR' | translate" 
                bcs-habilitado="data.cancelDisabled" 
                bcs-clic="data.cancelar()"
            ></bcs-button>
        </div>              
    </div>
</div>

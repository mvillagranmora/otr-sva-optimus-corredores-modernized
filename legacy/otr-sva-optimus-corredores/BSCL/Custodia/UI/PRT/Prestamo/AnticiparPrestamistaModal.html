<div ng-controller="AnticiparPrestamistaModalCtrl">
	<div class="row bcs-cuerpo">
		<form name="formAnticipoPrestamista">
            <div class="row">
                <label class="col-xs-3" translate>UI_CANTIDAD</label>
                <bcs-input-numero
                    class="col-xs-3"
                    k-ng-model="data.oShow.kngCantidad"
                    k-options ="data.cantidadOptions">
                </bcs-input-numero>
            </div>				
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button 
			class="col-xs-2" 
			ng-show="'true'" 
			bcs-habilitado="data.accionDisabled && formAnticipoPrestamo.$valid"
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GRABAR' | translate" 
			bcs-clic="data.fnAnticiparPrestamista()">
		</bcs-button>
		<bcs-button 
			class="col-xs-2" 
			ng-show="'true'"
			bcs-habilitado="true" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CERRAR' | translate" 
			bcs-clic="data.btnCerrar(false)">
		</bcs-button>
	</div>
</div>

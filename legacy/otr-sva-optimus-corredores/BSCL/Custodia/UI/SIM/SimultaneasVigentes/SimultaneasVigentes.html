<div ng-controller="SimultaneasVigentesCtrl">
	<!-- FILTROS -->
	<div class="row">
		<form name="frmSimul">
			<div class="col-xs-10">
				<div class="row">
					<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
					<bcs-combobox-base class="col-xs-8" style="width: 81.5%;" id="UI_SOCIO_NEGOCIO"
						auto-cargar="'false'"
						id-actual="filtros.IdPortafolio"
						tipo="oClientePortafolio.tipo"
						carga-cliente-automatico="'S'" 
						seleccionado="oClientePortafolio.seleccionado"
						filtros="filtrosPortafolio"
						configuracion="oClientePortafolio.configuracion">
					</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_TIPO_OPERACION</label>
					<bcs-combobox-base class="col-xs-4" auto-cargar="'true'"
						tipo="'combobox-tipo-operacion'"
						filtros="oConfiguracionTipoOperacion.filtros"
						configuracion="oConfiguracionTipoOperacion.configuracion"
						id-actual="oConfiguracionTipoOperacion.idActual"
						seleccionado="oConfiguracionTipoOperacion.seleccionado"
						todos="'S'" id-defecto="'0'"></bcs-combobox-base>
					<label class="col-xs-2 txt-left" translate
						style="padding-left: 15px">UI_INSTRUMENTO</label>
					<bcs-input-instrumentos class="col-xs-4" name="uInstrumento"
						datos-instrumento="instrumento"
						buscar-instrumento="buscarinstrumento" filtro-estado="'ACT'"
						filtro-tipo-instrumento="oConfiguracionTipoOperacion.seleccionado.IdTipoInstrumento ? oConfiguracionTipoOperacion.seleccionado.IdTipoInstrumento : 'SIM'"
						filtro-subyacente="'SIM'"></bcs-input-instrumentos>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date class="col-xs-4" bcs-requerido="true"
						k-ng-model="kngFecha" k-options="FechaConsultaOpt"></bcs-input-date>
					<label class="col-xs-2" translate style="padding-left: 15px">UI_TRANSACCION</label>
					<bcs-input-numero class="col-xs-4" ng-model="Transaccion"
						k-ng-model="TransaccionObj"
						k-options="{ format : 'n0', min:0, spinners: false }"></bcs-input-numero>
				</div>
			</div>

			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_BUSCAR' | translate"
						bcs-habilitado="frmSimul.$valid" bcs-clic="buscar()"></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="'true'" bcs-clic="limpiar()"></bcs-button>
				</div>
			</div>
		</form>
	</div>

	<!-- GRILLA -->
	<div class="row">
		<bcs-grid id="grid-simultaneas-vigentes"
			configuracion="confBasicaSimultaneasVigentes"
			seleccionado="seleccionSimultaneasVigentes"
			fn-exportar-excel="exportarExcel"> </bcs-grid>
	</div>

<div ng-controller="ValorizacionCustodiaCtrl as valoCust">
<form name="formValorizacionCustodia">
	<div class="row">
		<div class="col-xs-5">
			<div class="row">
				<h6 class="col-xs-12 k-window-subtitle" translate>{{ 'UI_TIPO_VALORIZACION'|translate}}</h6>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CARTERA_RV</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkCarteraRV"  
					ng-model="valoCust.datos.carteraRV"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CARTERA_RF</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkCarteraRF"  
					ng-model="valoCust.datos.carteraRF"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CARTERA_IF</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkCarteraIF"  
					ng-model="valoCust.datos.carteraIF"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CARTERA_FFMM</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkCarteraFFMM"  
					ng-model="valoCust.datos.carteraFFMM"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_PRESTAMOS_EMPRESTITOS</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkPrestamosEmprestitos"  
					ng-model="valoCust.datos.prestamosEmprestitos"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_GARANTIAS_RVRFIFFM</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkGarantiasRVRFIF"  
					ng-model="valoCust.datos.garantiasRVRFIF"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_SIMULTANEAS</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkSimultaneas"  
					ng-model="valoCust.datos.simultaneas"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CUPONES</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkCupones"  
					ng-model="valoCust.datos.cupones"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_PACTOS</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkPactos"  
					ng-model="valoCust.datos.pactos"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CARTERA_FUTUROS</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkFuturos"  
					ng-model="valoCust.datos.carteraFuturos"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-6" translate>UI_CARTERA_OPCIONES</label>
				<bcs-input-checkbox class="col-xs-6"
					id="idChkOpciones"  
					ng-model="valoCust.datos.carteraOpciones"
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
		</div>
		<div class="col-xs-6 col-xs-offset-1">
			<div class="row">
				<h6 class="col-xs-12 k-window-subtitle" translate>{{ 'UI_SOCIO_DE_NEGOCIO'|translate}}</h6>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_CUENTA_PROPIA</label>
					<div class="col-xs-2">
						<bcs-input-checkbox
							ng-model="valoCust.datos.cuentaPropia">
                   	 	</bcs-input-checkbox>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_CLIENTE</label>
					<bcs-combobox-base class="col-xs-9"
						id="UI_CLIENTE"
					 	auto-cargar="'false'"
					    tipo="'combobox-socio-negocio'"
					    seleccionado="valoCust.datos.socioNegocio"
						cascada-a="oPortafolio.filtros.IdCliente"
						cascada-valor="'IdCliente'"
	                    cascada-defecto="'-1'"
	                    bcs-requerido="false"
	                    id-actual="oSocioNegocio.idActual"
					    configuracion= "oSocioNegocio.configuracion">
					</bcs-combobox-base>
				</div>
			</div>           
				<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_PORTAFOLIO</label>
					<bcs-combobox-base class="col-xs-9"
						id="UI_PORTAFOLIO"
					 	auto-cargar="'false'"
					    tipo="'combobox-portafolio'"
					    seleccionado="oPortafolio.seleccionado"
					    filtros="oPortafolio.filtros"
	                    id-actual="valoCust.datos.IdPortafolio"
					    configuracion= "oPortafolio.configuracion">
					</bcs-combobox-base >
				</div>
			</div>
			<br>
			<div class="row">
				<h6 class="col-xs-12 k-window-subtitle" translate>{{ 'UI_FECHA'|translate}}</h6>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_FECHA_PROCESO</label>
					<bcs-input-date
						class="col-xs-9"
						id="idFechaProceso"
						k-ng-disabled = "true"
						bcs-requerido
						k-ng-model="valoCust.datos.fechaProceso">
					</bcs-input-date>
				</div>
			</div>	
		</div>
	</div>
	<br>
	<hr>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button 
			style="padding-top: 5px;"
			class="col-xs-3" 
			ng-show="'true'" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-habilitado="formValorizacionCustodia.$valid" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-clic="valoCust.fn.clicValorizar()">
		</bcs-button>
	</div>
</form>
</div>

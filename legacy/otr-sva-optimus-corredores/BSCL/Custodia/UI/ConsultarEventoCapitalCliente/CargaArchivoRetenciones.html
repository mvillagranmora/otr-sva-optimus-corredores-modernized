<div id="CargaArchivoRetenciones" class="col-xs-12" ng-controller="CargaArchivoRetencionesCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<form name="CargaArchivoRetencionesForm" class="filters-formulario">
			<div class="row">
				<label class="col-xs-3" translate>UI_ARCHIVO</label>
				<div class="col-xs-4">
					<input 
						type											="file" 
						file-reader-carga-archivo-custodia callback 	= "formInfo.cargarArchivo" 
						ng-accept										="configArchivo.formatoArchivoDefecto" 
						style="display:inline"
					/>
				</div>
			</div>
			<div class="row bcs-panel-comandos">
				<div class=col-xs-8>
					<bcs-button class="col-xs-4" id="CargarArchivo" 
						bcs-texto			="'UI_CARGAR' | translate" 
						bcs-habilitado		="CargaArchivoRetencionesForm.$valid && formData.archivo"
						bcs-tipo			="'principal'" 
						bcs-auto-desactivar	="false"
						bcs-clic			="formInfo.cargarArchivoRetenciones()">
					</bcs-button>
				</div>
			</div>
		</form>
	</div>
</div>

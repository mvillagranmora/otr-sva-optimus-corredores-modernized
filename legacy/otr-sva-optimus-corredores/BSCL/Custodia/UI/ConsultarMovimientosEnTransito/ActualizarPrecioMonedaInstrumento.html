<div id="ActualizarPrecioMonedaIntrumento" class="row" ng-controller="ActualizarPrecioMonedaIntrumentoCtrl as pMoneda">
	<div class="row">
		<div ng-class="pMoneda.win.modoEditar ? 'col-xs-9' : 'col-xs-12'">
			<form name="ActualizarPrecioMonedaInstrumento">
				<div class="row">
					<label class="col-xs-4" translate>UI_TIPO_DOCUMENTO</label>
					<bcs-input-texto class="col-xs-8" 
						ng-model="pMoneda.datos.tipoComprobante"
						bcs-requerido
						k-ng-disabled="true">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_NUMERO_DOCUMENTO</label>
					<bcs-input-texto class="col-xs-8" 
						ng-model="pMoneda.datos.numeroDocumento"
						bcs-requerido
						k-ng-disabled="true">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_NEMOTECNICO</label>
					<bcs-input-texto class="col-xs-8" 
						ng-model="pMoneda.datos.nemotecnico"
						bcs-requerido
						k-ng-disabled="true">
					</bcs-input-texto>
				</div>		
				<div class="row">
					<label class="col-xs-4" translate>UI_PRECIO</label>
					<bcs-input-monetario 
						class="col-xs-8" 
						decimales="4" 
						k-ng-model="pMoneda.datos.precio" 
						k-ng-disabled="false" 
						bcs-requerido>
					</bcs-input-monetario>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CANTIDAD</label>
					<bcs-input-numero class="col-xs-8" 
						ng-model="pMoneda.datos.cantidad"
						decimales="0"
						bcs-requerido
						k-ng-disabled="true">
					</bcs-input-numero>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_MONTO</label>
					<bcs-input-monetario 
						class="col-xs-8" 
						decimales="4" 
						k-ng-model="pMoneda.datos.monto" 
						k-ng-disabled="true" 
						bcs-requerido>
					</bcs-input-monetario>
				</div>
			</form>
		</div>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id=ActualizarprecioMonedaIntrumento_guardar class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="true" bcs-clic="pMoneda.fn.aceptar();">
		</bcs-button>
		<bcs-button id="ActualizarprecioMonedaIntrumento_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="pMoneda.fn.cancelar();">
		</bcs-button>
	</div>
</div>

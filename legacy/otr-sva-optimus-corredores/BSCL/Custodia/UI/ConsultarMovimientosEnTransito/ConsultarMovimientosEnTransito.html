<div id="MovimientoEnTransito" class="row"
    ng-controller='ConsultarMovimientosEnTransitoCtrl'>
    <form name="frmCarteras">
        <div class="col-xs-10">
            <div class="row" ng-if="!MostrarProducto">
                <div class="col-xs-8">
                    <label class="col-xs-3" style="width: 20.8333% !important;" translate>UI_CLIENTE_PORTAFOLIO</label>
                    <bcs-combobox-base class="col-xs-9" style="width: 79.1667%;" id="UI_SOCIO_NEGOCIO"
                        auto-cargar="'false'" carga-cliente-automatico="'S'"
                        id-actual="data.filtros.IdPortafolio"
                        id-defecto="data.oClientePortafolio.idDefecto"
                        tipo="data.oClientePortafolio.tipo"
                        seleccionado="data.oClientePortafolio.seleccionado"
                        filtros="filtrosPortafolio"
                        activado="data.oClientePortafolio.activado"
                        configuracion="data.oClientePortafolio.configuracion">
                    </bcs-combobox-base>
                </div>
            </div>
            <div class="row" ng-if="MostrarProducto">
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_CLIENTE</label>
                    <bcs-combobox-base class="col-xs-7" id="UI_CLIENTE"
                        auto-cargar="'false'" tipo="'combobox-socio-negocio'"
                        seleccionado="oSocioNegocio.seleccionado"
                        filtros="oSocioNegocio.filtros"
                        cascada-a="oPortafolio.filtros.IdCliente"
                        cascada-valor="'IdCliente'" id-actual="oSocioNegocio.idActual"
                        carga-cliente-automatico="'S'"> </bcs-combobox-base>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_PRODUCTO</label>
                    <bcs-combobox-base class="col-xs-7" id="UI_PRODUCTO"
                        auto-cargar="'true'" tipo="'combobox-otro-producto-agrupador'"
                        seleccionado="oProducto.seleccionado"
                        cascada-a="oPortafolio.filtros.IdProductoAgrupador"
                        cascada-valor="'IdProductoAgrupador'"
                        id-actual="oProducto.idActual" item-post-filtro="'1'">
                    </bcs-combobox-base>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_PORTAFOLIO</label>
                    <bcs-combobox-base class="col-xs-7" id="UI_PORTAFOLIO"
                        auto-cargar="'false'" tipo="'combobox-portafolio'"
                        seleccionado="oPortafolio.seleccionado"
                        filtros="oPortafolio.filtros" id-actual="oPortafolio.idActual"
                        usa-filtros-completos="'S'"
                        activado="oSocioNegocio.seleccionado && oProducto.seleccionado">
                    </bcs-combobox-base>
                </div>
            </div>

            <div class="row">
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_CLASIFICACION</label>
                    <bcs-combobox-base class="col-xs-7"
                        tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
                        ng-model="clasificacionTipoInstrumento"
                        seleccionado="filtro.clasificacionTipoInstrumentoObj" todos="'S'"
                        item-post-filtro="'1'"
                        cascada-a="data.oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
                        cascada-valor="'IdClasificacionTipoInstrumento'">
                    </bcs-combobox-base>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_TIPO_INSTRUMENTO_ABR</label>
                    <bcs-combobox-base class="col-xs-7"
                        tipo="data.oConfiguracionTipoInstrumento.tipo"
                        filtros="data.oConfiguracionTipoInstrumento.filtros"
                        ng-model="tipoInstrumento" seleccionado="filtro.tipoInstrumento"
                        todos="'S'" item-post-filtro="'1'"> </bcs-combobox-base>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_INSTRUMENTO</label>
                    <bcs-input-instrumentos class="col-xs-7"
                        datos-instrumento="filtro.instrumentoObjeto"
                        buscar-instrumento="filtro.buscarinstrumento"
                        filtro-estado="'ACT'"> </bcs-input-instrumentos>
                </div>
            </div>

            <div class="row">
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_OPERACION</label>
                    <bcs-combobox-base class="col-xs-7"
                        tipo="data.oConfiguracionTipoOperacionCustodia.tipo"
                        ng-model="accion" id-actual="filtro.accion.idActual"
                        seleccionado="filtro.accion.seleccionado" todos="'S'"
                        item-post-filtro="'1'"> </bcs-combobox-base>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_CONCEPTO</label>
                    <bcs-combobox-base class="col-xs-7"
                        tipo="data.oConfiguracionConceptoCustodia.tipo"
                        ng-model="concepto" id-actual="filtro.concepto.idActual"
                        seleccionado="filtro.concepto.seleccionado" todos="'S'"
                        item-post-filtro="'1'"> </bcs-combobox-base>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_BOVEDA</label>
                    <bcs-combobox-base class="col-xs-7"
                        tipo="data.oConfiguracionBoveda.tipo" ng-model="boveda"
                        seleccionado="filtro.boveda" todos="'S'" item-post-filtro="'1'">
                    </bcs-combobox-base>
                </div>
            </div>

            <div class="row">
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_FECHA_DESDE</label>
                    <bcs-input-date class="col-xs-7" ng-model="filtro.fecIniciong"
                        k-ng-model="filtro.fecInicio"></bcs-input-date>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_FECHA_HASTA</label>
                    <bcs-input-date class="col-xs-7" ng-model="filtro.fecTerminong"
                        k-ng-model="filtro.fecTermino"></bcs-input-date>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_FECHA_LIQUIDACION_DESDE</label>
                    <bcs-input-date class="col-xs-7" ng-model="filtro.fecIniciong"
                        k-ng-model="filtro.fecInicioLiq"></bcs-input-date>
                </div>
                <div class="col-xs-4">
                    <label class="col-xs-5" translate>UI_FECHA_LIQUIDACION_HASTA</label>
                    <bcs-input-date class="col-xs-7" ng-model="filtro.fecTerminong"
                        k-ng-model="filtro.fecTerminoLiq"></bcs-input-date>
                </div>
            </div>
        </div>
    </form>

    <div class="col-xs-2">
        <bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-search'"
            bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"
            bcs-habilitado="true" bcs-clic="buscarMovimientos()"></bcs-button>
        <bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-secondary'"
            bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
            bcs-habilitado="true" bcs-clic="limpiarFiltros()"></bcs-button>
    </div>

    <div class="col-xs-12">
        <div class="row">
            <bcs-grid id="grid-movimientos-en-transito"
                configuracion="data.confBasicaMovimientosEnTransito"
                seleccionado="data.seleccionMovimientosEnTransito"
                fn-exportar-excel="excelMovimientosEnTransito"> </bcs-grid>
    <div class="row" style="margin-top: 5px;">
        <div class="col-xs-3 pull-right">
            <label translate class="row">UI_SUMA_MONTO</label><label style="margin-right: 5px;">:</label>{{sumaMonto}}
        </div>
        <div class="col-xs-3 pull-right">
            <label translate class="row">UI_SUMA_CANTIDAD</label><label style="margin-right: 5px;">:</label>{{sumaCantidad}}
        </div>
    </div>
            <div class="row">
                
                <div class="col-xs-12 bcs-panel-comandos">
                    <bcs-button id="MovimientoEnTransito_Certificar" class="col-xs-1"
                        bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
                        bcs-texto="'UI_CERTIFICAR' | translate" bcs-habilitado="true"
                        bcs-clic="enviarCertificar()"></bcs-button>
                    <bcs-button id="MovimientoEnTransito_Anular" class="col-xs-1"
                        bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
                        bcs-texto="'UI_ANULAR' | translate" bcs-habilitado="true"
                        bcs-clic="enviarAnular()"></bcs-button>
                    <!-- bcs-button  class="col-xs-3" bcs-tipo="''"           bcs-auto-desactivar="false" bcs-texto="'UI_GENERATRASPASO' | translate"      bcs-habilitado="habilitaBotonGeneraTraspaso(data.seleccionMovimientosEnTransito)"   bcs-clic="generarTraspaso()"></bcs-button-->
                    <bcs-button id="TraspasoCustodiaEmisor" class="col-xs-3"
                        bcs-auto-desactivar="false"
                        bcs-tipo="'bcs-button-secondary'"
                        bcs-habilitado="data.seleccionMovimientosEnTransito"
                        bcs-texto="'UI_VER_TRASPASO_CUSTODIA_EMISOR' | translate"
                        bcs-habilitado="true" bcs-clic="descargarTraspasoCustodiaEmisor()"></bcs-button>
                    <bcs-button id="MovimientoEnTransito_EditarPrecioMoneda"
                        class="col-xs-2" bcs-auto-desactivar="false"
                        bcs-tipo="'bcs-button-secondary'"
                        bcs-habilitado="data.seleccionMovimientosEnTransito"
                        bcs-texto="'EDITAR PRECIO MONEDA' | translate"
                        bcs-habilitado="true" bcs-clic="editarPrecioMoneda()"></bcs-button>
                    <bcs-button id="TraspasoEntreCorredores" class="col-xs-2"
                        bcs-auto-desactivar="false"
                        bcs-tipo="'bcs-button-secondary'"
                        bcs-habilitado="data.seleccionMovimientosEnTransito"
                        bcs-texto="'TRASPASO CORREDOR' | translate"
                        bcs-habilitado="true" bcs-clic="descargarTraspasoEntreCorredores()"></bcs-button>
					<bcs-button id="CartaTraspaso" 
						class="col-xs-2"
						bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="false" 
						bcs-habilitado="data.seleccionMovimientosEnTransito"  
						bcs-texto="'UI_VER_CARTA_TRASPASO' | translate"       
						bcs-habilitado="true"   bcs-clic="descargarCartaTraspaso()"></bcs-button>
                    <bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
                        bcs-texto="'UI_OPCIONES' | translate">
                        <li ng-click="data.seleccionarTodosMovimientos()">{{'UI_SELECCIONAR_TODO'
                        | translate}}</li>
                        <li ng-click="data.deseleccionarTodosMovimientos()">{{'UI_DESELECCIONAR_TODO'
                        | translate}}</li>
                        <li ng-click="excelMovimientosEnTransito('MovimientosEnTransito')">{{'UI_EXPORTAR_EXCEL'
                        | translate}}</li>
                    </bcs-menu>
                </div>
            </div>
        </div>
    </div>
</div>

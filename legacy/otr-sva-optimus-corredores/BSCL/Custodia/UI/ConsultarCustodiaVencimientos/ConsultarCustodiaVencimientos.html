<div class="row" ng-controller='ConsultarCustodiaVencimientosCtrl'>	
	<div class="row bcs-cuerpo" ng-form="frmConsultarCustodiaVencimientos">
		<div class="col-xs-10">
			<div class="row" ng-if="!MostrarProducto">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-combobox-base 
						class			="col-xs-8"
						id				="frmConsultarCustodiaVencimientos_SocioNegocio"
					    auto-cargar		="'true'"
					    carga-cliente-automatico="'S'"
					    tipo			="'combobox-socio-negocio'"
					    item-post-filtro="filtros.oConfiguracionCliente.itemPostFiltro"						
						filtros			="filtros.oConfiguracionCliente.filtros"									
						configuracion	="filtros.oConfiguracionCliente.configuracion"									 				
						seleccionado	="filtros.oConfiguracionCliente.seleccionado"									
						id-actual		="fitros.socioGral.idActual"
						cascada-a		="filtros.oConfiguracionPortafolio.filtros.IdCliente"
						cascada-valor	="'IdCliente'"
						cascada-defecto	="-1">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4"  translate>UI_PORTAFOLIO</label>					
					<bcs-combobox-base class="col-xs-8" id="frmConsultarCustodiaVencimientos_Portafolio"
					 	auto-cargar		="'false'"
					    tipo			="'combobox-portafolio'"
					    filtros			="filtros.oConfiguracionPortafolio.filtros"
	                    item-post-filtro="'1'"
					    configuracion	="filtros.oConfiguracionPortafolio"  
					    seleccionado 	="filtros.oConfiguracionPortafolio.seleccionado">
					</bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4"   translate>UI_EJECUTIVO</label>
					<bcs-combobox-base class="col-xs-8" id="frmConsultarCustodiaVencimientos_Ejecutivo" 
						auto-cargar		="'true'"
						tipo			="'combobox-ejecutivo'"
						configuracion	="filtros.oConfiguracionEjecutivo.configuracion" 
						id-actual		="filtros.oConfiguracionEjecutivo.idActual" 
						seleccionado	="filtros.oConfiguracionEjecutivo.seleccionado"
						filtros			="filtros.oConfiguracionEjecutivo.filtros"						 
						item-post-filtro="'1'"
						todos			="'S'" 
					></bcs-combobox-base >
				</div>
			</div>
			
			<div class="row" ng-if="MostrarProducto">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-combobox-base
						class				= "col-xs-8"
						id					= "UI_CLIENTE"
						auto-cargar			= "'true'"
						carga-cliente-automatico="'S'"
						tipo				= "'combobox-socio-negocio'"
						seleccionado		= "oSocioNegocio.seleccionado"
						filtros				= "oSocioNegocio.filtros"
						cascada-a			= "oPortafolio.filtros.IdCliente"
						cascada-valor		= "'IdCliente'"
						id-actual			= "socioGral.idActual">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
				    <label class="col-xs-4"  translate>UI_PRODUCTO</label>
				    <bcs-combobox-base
				    	class				= "col-xs-8"
				        id					= "UI_PRODUCTO"
				        auto-cargar			= "'true'"
				        tipo				= "'combobox-otro-producto-agrupador'"
				        seleccionado		= "oProducto.seleccionado"
						cascada-a			= "oPortafolio.filtros.IdProductoAgrupador"
						cascada-valor		= "'IdProductoAgrupador'"
						id-actual			= "oProducto.idActual"
						item-post-filtro    = "'1'">
				    </bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4"  translate>UI_PORTAFOLIO</label> 
					<bcs-combobox-base
						class				= "col-xs-8"
						id					= "UI_PORTAFOLIO"
						auto-cargar			= "'false'"
						tipo				= "'combobox-portafolio'"
						seleccionado		= "oPortafolio.seleccionado"
						filtros				= "oPortafolio.filtros"
						id-actual			= "oPortafolio.idActual"
						activado			= "oSocioNegocio.seleccionado && oProducto.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base class="col-xs-8" id="frmConsultarCustodiaVencimientos_Clasificacion"
						auto-cargar		="'true'"
						tipo         	="'combobox-clasificacion-tipo-instrumento'"
						id-actual    	="filtros.oConfiguracionClasificacion.idActual"
						seleccionado 	="filtros.oConfiguracionClasificacion.seleccionado"
						id-post-filtro 	="filtros.oConfiguracionClasificacion.idPostFiltro"
						configuracion	="filtros.oConfiguracionClasificacion.configuracion"
						item-post-filtro="'1'"						 
						cascada1-a		="filtros.oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor	="'IdClasificacionTipoInstrumento'" 	
						cascada2-a		="filtros.oConfiguracionInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada2-valor	="'IdClasificacionTipoInstrumento'"
						todos			="'S'" 	
					></bcs-combobox-base >			  	  
				</div>
				<div class="col-xs-4">
				  	<label class="col-xs-4"  translate>UI_TIPO_INSTRUMENTO</label>
				  	<bcs-combobox-base class="col-xs-8" id="frmConsultarCustodiaVencimientos_TipoInstrumento"
						auto-cargar		="'true'"
						tipo			="'combobox-tipo-instrumento'"
						filtros			="filtros.oConfiguracionTipoInstrumento.filtros"
						configuracion	="filtros.oConfiguracionTipoInstrumento.configuracion" 
						id-actual 		="filtros.oConfiguracionTipoInstrumento.idActual"
						id-post-filtro 	="filtros.oConfiguracionTipoInstrumento.idPostFiltro" 
						seleccionado	="filtros.oConfiguracionTipoInstrumento.seleccionado"
						item-post-filtro="'1'"
						todos			="'S'"							
					></bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4"  translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos class="col-xs-8" id="frmConsultarCustodiaVencimientos_Instrumento" 
						name					="uInstrumento"
						datos-instrumento		="filtros.instrumentoDatos"
						buscar-instrumento		="filtros.oConfiguracionInstrumento.buscar"
						filtro-tipo-instrumento ="filtros.oConfiguracionTipoInstrumento.idActual"
						filtro-clasificacion	="filtros.oConfiguracionClasificacion.idActual" 
						filtro-estado 			= "'ACT'"	>
					</bcs-input-instrumentos>
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO</label>
					<bcs-input-date id="frmConsultarCustodiaVencimientos_FechaVencimientoDesde" class="col-xs-4" bcs-requerido
						k-ng-model	="filtros.kngFechaVencimientoDesde"
						k-options	="{max: filtros.kngFechaVencimientoHasta}">
					</bcs-input-date>
					<bcs-input-date id="frmConsultarCustodiaVencimientos_FechaVencimientoHasta" class="col-xs-4" bcs-requerido
						k-ng-model	="filtros.kngFechaVencimientoHasta"
						k-options	="{min : filtros.kngFechaVencimientoDesde}">
					</bcs-input-date>
				</div>
				<div class="col-xs-4" ng-if ="MostrarProducto">
					<label class="col-xs-4"   translate>UI_EJECUTIVO</label>
					<bcs-combobox-base
						class				="col-xs-8"
						id					="frmConsultarCustodiaVencimientos_Ejecutivo"
						auto-cargar			="'true'"
						tipo				="'combobox-ejecutivo'"
						configuracion		="filtros.oConfiguracionEjecutivo.configuracion"
						id-actual			="filtros.oConfiguracionEjecutivo.idActual"
						seleccionado		="filtros.oConfiguracionEjecutivo.seleccionado"
						filtros				="filtros.oConfiguracionEjecutivo.filtros"
						item-post-filtro	="'1'"
						todos				="'S'">
					</bcs-combobox-base >
				</div>
			</div>
		</div>

		<div class="col-xs-2">
			<div class="row"> <bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="buscar()" ></bcs-button> </div>
			<div class="row"> <bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiar()" ></bcs-button> </div>
		</div>
	</div>
<div class="col-xs-12">
	<div class="row">
		<bcs-grid
			id="frmConsultarCustodiaVencimientos_gridCustodiaVencimientos"
			configuracion 	= "grid.confCustodiaVencimientos"
			seleccionado 	= "grid.seleccionCustodiaVencimientos"			
			fn-doble-click 	= "grid.detalleSubyacentes(grid.seleccionCustodiaVencimientos)"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
  
	<div class="row bcs-panel-comandos">
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel('Vencimientos Carteras')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>
</div>

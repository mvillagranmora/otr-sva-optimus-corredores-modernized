<div class="row" ng-controller='CustodiaSubyacenteModalCtrl'>	
	<div class="row">
		<div class="row">
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_CLIENTE</label>
				<bcs-input-texto class ="col-xs-8"	id ="frmCustodiaSubyacenteModal_Cliente"
					ng-model		="data.Cliente"
					k-ng-disabled 	="'true'">
				</bcs-input-texto>
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4" style="padding-left: 15px" translate>UI_PORTAFOLIO</label>
				<bcs-input-texto class ="col-xs-8"	id ="frmCustodiaSubyacenteModal_Portafolio"
					ng-model		="data.Portafolio"
					k-ng-disabled 	="'true'">
				</bcs-input-texto>			
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4"  style="padding-left: 15px" translate>UI_EJECUTIVO</label>
				<bcs-input-texto class ="col-xs-8"	id ="frmCustodiaSubyacenteModal_Ejecutivo"
					ng-model		="data.Ejecutivo"
					k-ng-disabled 	="'true'">
				</bcs-input-texto>	
			</div>
		</div>			 
		<div class="row">
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_CLASIFICACION</label>
				<bcs-input-texto class ="col-xs-8"	id ="frmCustodiaSubyacenteModal_Clasificacion"
					ng-model		="data.Clasificacion"
					k-ng-disabled 	="'true'">
				</bcs-input-texto>	
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4" style="padding-left: 15px" translate>UI_INSTRUMENTO</label>
				<bcs-input-texto class ="col-xs-8"	id ="frmCustodiaSubyacenteModal_Instrumento"
					ng-model		="data.Instrumento"
					k-ng-disabled 	="'true'">
				</bcs-input-texto>	
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4" style="padding-left: 15px" translate>UI_FECHA_VENCIMIENTO</label>
				<bcs-input-date class ="col-xs-8"	id ="frmCustodiaSubyacenteModal_FechaVencimiento"
					k-ng-model		="data.FechaVencimiento"
					k-ng-disabled 	="'true'">
				</bcs-input-date>	
		  	</div>
		</div>
	</div>

	<div class="row" style="padding-top: 10px">
		<bcs-grid id="frmCustodiaSubyacenteModal_gridCustodiaSubyacente"
			configuracion 	= "grid.confCustodiaSubyacente"
			seleccionado 	= "grid.seleccionCustodiaSubyacente"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>

	<div class="row bcs-panel-comandos">
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel('Cartera Subyacente')">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

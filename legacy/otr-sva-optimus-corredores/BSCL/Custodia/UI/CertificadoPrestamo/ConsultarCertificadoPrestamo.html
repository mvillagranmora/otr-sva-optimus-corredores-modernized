<div id="ConsultarCertificadoPrestamo" ng-controller="ConsultarCertificadoPrestamo">
	<form name="formCertificadoPrestamos">
		<div class="row">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CLIENTE</label>				
					<bcs-combobox-base class="col-xs-7"
						    id="cbClientes"
						    id-actual="oConfiguracionCliente.IdActual"
						    bcs-requerido
							tipo="oConfiguracionCliente.tipo"
							filtros="oConfiguracionCliente.filtros"									
							configuracion= "oConfiguracionCliente.configuracion"									 				
							seleccionado="oConfiguracionCliente.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CERTIFICADOS_PRESTAMOS</label>				
					<bcs-combobox-base class="col-xs-7"
						    id="cbCertificadosPrestamos"
						    id-actual="oConfiguracionCertificados.IdActual"
						    bcs-requerido
							tipo="oConfiguracionCertificados.tipo"								 				
							seleccionado="oConfiguracionCertificados.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
					<bcs-input-date class="col-xs-7"
						k-ng-model="certPres.kngFechaDesde"
						bcs-requerido>
					</bcs-input-date>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
					<bcs-input-date class="col-xs-7"
						k-ng-model="certPres.kngFechaHasta"
						bcs-requerido>
					</bcs-input-date>
				</div>
			</div>
		</div>
	</form>
	
	<div class="row bcs-panel-comandos alignButtonsToRight" 
	style="padding-top: 5px !important;">
		<bcs-button class="col-xs-4" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false"
			bcs-texto="'UI_GENERAR' | translate" 
			bcs-habilitado="formCertificadoPrestamos.$valid" 
			ng-click="Generar()">
		</bcs-button>
	</div>
</div>

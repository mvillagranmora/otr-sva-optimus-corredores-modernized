<div class="row" ng-controller='PrestamosPendientesPorCargarCtrl'>
	<div class="row bcs-cuerpo" ng-form="frmPrestamosPendientesPorCargar">
		<div class="row">
			<!-- INICIO FILTROS -->
			<div class="col-xs-10">
				<div class="row">
						<div class="col-xs-6">
							<label class="col-xs-4" translate>UI_DOCUMENTO_IDENTIDAD_ABR</label>
						  <bcs-input-texto
							  class				= "col-xs-8"
							  ng-model			= "data.DocumentoIdentidad">
						  </bcs-input-texto>
						</div>
					  
					<div class="col-xs-6">
						<label class="col-xs-2" translate>UI_FECHA</label>
						<bcs-input-date
							class				= "col-xs-10"
							k-ng-model			= "data.Fecha">
						</bcs-input-date>
					</div>
			  	</div>
				  <div class="row">
					<div class="col-xs-12">
						<label class="col-xs-2" translate>UI_TIPO_DOCUMENTO_IDENTIDAD</label>
						<bcs-combobox-base
							class				= "col-xs-10"
							tipo				= "'combobox-tipo-documento-identidad'"
							id-actual			= "data.TipoDocumentoIdentidad"
							id-defecto			= "'0'"
							todos				= "'S'"
							item-post-filtro	= "'1'">
						</bcs-combobox-base>
					  </div>
				  </div>
				  
			</div>
			<!-- FIN FILTROS -->

			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button
						class				= "col-xs-12"
						id					= "frmPrestamosPendientesPorCargar_BtnBuscar"
						bcs-tipo			= "'bcs-button-search'"
						bcs-auto-desactivar	= "'false'"
						bcs-texto			= "'UI_BUSCAR' | translate"
						bcs-habilitado		= "'true'"
						bcs-clic			= "buscarPrestamosPendientesPorCargar()">
					</bcs-button>
				</div>
				<div class="row">
					<bcs-button
						class				= "col-xs-12"
						id					= "frmPrestamosPendientesPorCargar_BtnLimpiar"
						bcs-tipo			= "'bcs-button-secondary'"
						bcs-auto-desactivar	= "'false'"
						bcs-texto			= "'UI_LIMPIAR' | translate"
						bcs-habilitado		= "'true'"
						bcs-clic			= "limpiarFiltros()">
					</bcs-button>
				</div>
			</div>
			<!-- FIN BOTONES -->
		</div>
		
		<div class="row">
			<bcs-grid
				id					= "frmPrestamosPendientesPorCargar_gridPrestamosPendientesPorCargar"
				configuracion		= "configuracionPrestamosPendientesPorCargar"
				seleccionado		= "seleccionPrestamosPendientesPorCargar"
				fn-exportar-excel	= "exportarExcel">
			</bcs-grid>
		</div>
		
		
		
		<div class="row">
			<div class="col-xs-2">
				<bcs-button
					class				= "col-xs-12"
					id					= "frmPrestamosPendientesPorCargar_BtnReprocesar"
					bcs-tipo			= "'bcs-button-primary'"
					bcs-auto-desactivar	= "'false'"
					bcs-texto			= "'UI_REPROCESAR' | translate"
					bcs-habilitado		= "'true'"
					bcs-clic			= "ReprocesarPrestamosPendientesPorCargar()">
				</bcs-button>
			</div>
			<div class="col-xs-2">
				<bcs-button
					class				= "col-xs-12"
					id					= "frmPrestamosPendientesPorCargar_BtnCancelar"
					bcs-tipo			= "'bcs-button-secondary'"
					bcs-auto-desactivar	= "'false'"
					bcs-texto			= "'UI_CANCELAR' | translate"
					bcs-habilitado		= "'true'"
					bcs-clic			= "buscarPrestamosPendientesPorCargar()">
				</bcs-button>
			</div>
			<div class="col-xs-6">
			</div>
			<div class="col-xs-2">
				<bcs-menu
					class="col-xs-12 pull-right"
					bcs-habilitado="'true'"
					bcs-tipo= "'bcs-button-secondary'"
					bcs-texto="'UI_OPCIONES' | translate">
					<li ng-click="exportarExcel('formRevisionCoberturaGarantias_gridCoberturaGarantiaResumen')">{{'UI_EXPORTAR_EXCEL'| translate}}</li>
				</bcs-menu>
			</div>
		</div>
	</div>
</div>

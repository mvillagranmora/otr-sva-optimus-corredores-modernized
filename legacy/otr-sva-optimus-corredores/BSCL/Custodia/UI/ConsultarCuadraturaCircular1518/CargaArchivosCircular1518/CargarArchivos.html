<div class="col-xs-12" ng-controller="cargarArchivoL0002DCVCtrl">
	<form name="PrevioCargaL002" class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-10">
					<div class="row">
						<div class="col-xs-12">
							<b> <h5 class="col-xs-8" translate>UI_FECHA_CUADRATURA</h5> </b>
							<b> <h5 class="col-xs-4"> {{FechaCuadraturaLabel | date: 'dd-MM-yyyy' }} </h5> </b>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-10">
					<div class="row">
						<div class="col-xs-12">
							<b> <h5 class="col-xs-8" translate>UI_NOMBRE_ARCHIVO</h5> </b>
							<b> <h5 class="col-xs-4" translate> {{TituloPrevioCarga}} </h5> </b>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-10">
					<div class="row">
						<div class="col-xs-12">
							<b> <h5 class="col-xs-8" translate>UI_SOBREESCRIBE_ARCHIVO</h5> </b>
							<div ng-repeat="(keyItem, valItem) in formData.matriz">
								<label class="col-xs-1" >{{valItem.CodNombre}}</label>
								<bcs-input-checkbox 
									class="col-xs-1"
									ng-disabled="formData.checkDisable[valItem.CodNombre]"
									ng-model="formData.check[valItem.CodNombre]"> 
								</bcs-input-checkbox>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="row" ng-show="formData.SobreescribeArchivo==='S'">
				<div class="col-xs-12">
					<b> <h5 class="col-xs-4" translate>UI_INFORMACION_IMPORTANTE </h5> </b>
					<div class="col-xs-8"> 
						<b> <p translate> UI_ALERTA_SOBREESCRIBE_CIRCULAR </p> </b>
					</div>
				</div>
			</div>
		</div>
		<div class="row bcs-panel-comandos">
			<div class="row">
				<div class="col-xs-12 alignButtonsToRight">
					<!-- <div class="col-xs-3"></div> -->
					<bcs-button class="col-xs-4"
						bcs-texto="'UI_CONFIRMAR' | translate"
						bcs-habilitado="PrevioCargaL002.$valid"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar= "'true'"
						bcs-clic="callTocargarArchivo()"> 
					</bcs-button>
					<!-- <div class="col-xs-3"></div> -->
				</div>
			</div>
		</div>
	</form>
</div>

<div class="row" ng-controller='DetalleComprobanteDeTesoreriaCtrl as bInfoComprobante'>
  <div class="row no-margin">
    <div class="col-xs-12">
      <!-- DATOS BASICOS -->
	  	<div class="row">
			<div class="row k-window-subtitle">
			   <label class="col-xs-4" translate>UI_DATOS_BASICOS</label>																							
			</div>
	  	</div>
	  	<table class="table">
	  		<tr>
				<td><strong class="align_right" translate>UI_SECUENCIA_COMPROBANTE</strong></td>
			  	<td><label class="">{{bInfoComprobante.IdComprobante}}</label></td>					
			  	<td><strong class="align_right" translate>UI_TIPO_COMPROBANTE</strong></td>
			  	<td><label class="" >{{bInfoComprobante.oComprobante[0].NombreTipoMovimiento}}</label></td>
			</tr>
			<tr>
				<td><strong class="align_right" translate>UI_CONCEPTO</strong></td>
			  	<td><label class="">{{bInfoComprobante.oComprobante[0].NombreConcepto}}</label></td>					
			  	<td><strong class="align_right" translate>UI_CAJA</strong></td>
			  	<td><label class="" >{{bInfoComprobante.oComprobante[0].NombreCaja}}</label></td>
			</tr>
			<tr>				
			  	<td><strong class="align_right" translate>UI_FECHA_INGRESO</strong></td>
			  	<td><label class="" >{{bInfoComprobante.oComprobante[0].FechaMovimiento | kformat:'d'}}</label></td>
			  	<td><strong class="align_right" translate>UI_ESTADO</strong></td>
			  	<td><label class="">{{bInfoComprobante.oComprobante[0].NombreEstado}}</label></td>
			</tr>
			<tr>
			  	<td><strong class="align_right" translate>UI_SOCIO_DE_NEGOCIO</strong></td>
			  	<td><label class="">{{bInfoComprobante.oComprobante[0].NombrePersona}}</label></td>					
			  	<td><strong class="align_right" translate>UI_DOCUMENTO_IDENTIDAD</strong></td>
			  	<td><label class="" >{{bInfoComprobante.oComprobante[0].DocumentoIdentidad}}</label></td>
			</tr>
			<tr>
			  	<td><strong class="align_right" translate>UI_PERSONA_PAGO_COBRO</strong></td>
			  	<td><label class="">{{bInfoComprobante.oComprobante[0].NombrePersonaTitularPago}}</label></td>					
			  	<td><strong class="align_right" translate>UI_PORTAFOLIO</strong></td>
			  	<td><label class="" >{{bInfoComprobante.oComprobante[0].NombrePortafolioTitularPago}}</label></td>
			</tr>
			<tr>				
			  	<td><strong class="align_right" translate>UI_FECHA_LIQUIDACION</strong></td>
			  	<td><label class="" >{{bInfoComprobante.oComprobante[0].FechaLiquidacion | kformat:'d'}}</label></td>
			  	<td><strong class="align_right" translate>UI_MONTO</strong></td>
			  	<td><label class="">{{bInfoComprobante.oComprobante[0].Monto | kformat:'c':bInfoComprobante.oComprobante[0].IdMoneda:'monto':'GEN'}}</label></td>
			</tr>
			<tr>				
				<td><strong class="align_right" translate>UI_COMENTARIO</strong></td>
				<td colspan="3"><label class="" >{{bInfoComprobante.oComprobante[0].Glosa}}</label></td>	
		  </tr>
	  	</table>   
    </div>
    
	

	<div class="col-xs-12" style="margin-top:10px">
		<div class="row k-window-subtitle">
		   <label class="col-xs-4" translate>UI_MOVIMIENTOS_ORIGEN_COMPROBANTE</label>
		</div>
		<bcs-grid id="detalle-comprobante-tesoreria"
			configuracion = "confBasicaMovimientosComprobantes"
			seleccionado = "seleccionMovimientosComprobantes">
		</bcs-grid>
	</div>
	<div class="col-xs-12" style="margin-top:10px">		
		<div class="row k-window-subtitle">
		   <label class="col-xs-4" translate>UI_FORMA_DE_PAGO</label>
		</div>
		<bcs-grid id="formaPago-comprobante-tesoreria"
			configuracion = "confBasicaComprobanteFormaDePago"
			seleccionado = "seleccionComprobanteFormaDePago">
		</bcs-grid>
	</div>
  </div>	
</div>

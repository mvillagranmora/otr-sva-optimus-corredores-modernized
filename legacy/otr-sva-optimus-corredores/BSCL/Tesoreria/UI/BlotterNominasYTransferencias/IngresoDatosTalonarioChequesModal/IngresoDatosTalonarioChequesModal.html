<div class="row" ng-controller='IngresoDatosTalonarioChequesCtrl'>
	<form name="frmIngresoDatosTalonarioCheques" class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<label class="col-xs-4" translate>UI_BANCO</label>
				<bcs-input-texto class="col-xs-8" id="frmIngresoDatosTalonarioCheques_NOMBRE_BANCO"
					name="frm.nombreBanco" 				
					ng-model="frm.nombreBanco"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CUENTA_BANCARIA</label>
				<bcs-input-texto class="col-xs-8" id="frmIngresoDatosTalonarioCheques_CUENTA_BANCARIA"
					name="frm.cuentaBancaria" 				
					ng-model="frm.cuentaBancaria"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_NUMERO_SERIE</label>
				<bcs-combobox-base  class="col-xs-8" id="frmIngresoDatosTalonarioCheques_NUMERO_SERIE" bcs-requerido
					auto-cargar="'true'"
					tipo="frm.oConfiguracionChequerasSeries.tipo"
					configuracion= "frm.oConfiguracionChequerasSeries.configuracion"
					seleccionado="frm.oConfiguracionChequerasSeries.seleccionado"
					id-actual="frm.oConfiguracionChequerasSeries.idActual"
					filtros="frm.oConfiguracionChequerasSeries.filtros"				
					item-post-filtro="'-1'">
				</bcs-combobox-base>	
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_REMANENTE</label>
				<bcs-input-texto class="col-xs-4" id="frmIngresoDatosTalonarioCheques_REMANENTE"
					name="frm.remanente" 				
					ng-model="frm.remanente"
					k-ng-disabled = "'true'" >
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CANTIDAD_A_PROCESAR</label>
				<!--<bcs-input-texto class="col-xs-4" id="frmIngresoDatosTalonarioCheques_CANTIDAD_A_PROCESAR"
					name="frm.cantidadProcesar" 				
					ng-model="frm.cantidadProcesar"
					k-ng-disabled = "'true'" >
				</bcs-input-numero>-->

				<bcs-input-numero class="col-xs-8" id="frmIngresoDatosTalonarioCheques_CANTIDAD_A_PROCESAR" bcs-requerido
					name="frm.cantidadProcesar" 				
					k-ng-model="frm.cantidadProcesar"
					k-options="{format:'#'}"								
					decimales=0>
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CHEQUE_DESDE</label>
				<bcs-input-numero class="col-xs-8" id="frmIngresoDatosTalonarioCheques_CHEQUE_DESDE" bcs-requerido
					name="frm.chequeDesde" 				
					k-ng-model="frm.chequeDesde"
					k-options="{format:'#'}"
					k-ng-disabled = "'true'"			
					decimales=0>
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CHEQUE_HASTA</label>
				<bcs-input-texto class="col-xs-8" id="frmIngresoDatosTalonarioCheques_CHEQUE_HASTA" bcs-requerido
					name="frm.chequeHasta" 				
					ng-model="frm.chequeHasta"
					k-ng-disabled = "'true'" >
				</bcs-input-texto>
			</div>
		</div>
		<div class="row bcs-panel-comandos alignButtonsToRight">
			<bcs-button class="col-xs-3" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_AGREGAR' | translate" 
				bcs-habilitado="frmIngresoDatosTalonarioCheques.$valid"
				bcs-clic="verAlerta(frm)"
			></bcs-button>
			<bcs-button class="col-xs-3" 
				id="frmConsultarNominas_btn_talonarioCancelar"
				bcs-tipo="'bcs-button-anular'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true"
				bcs-clic="cancelar()"
			></bcs-button>
		</div>
	</form>
</div>

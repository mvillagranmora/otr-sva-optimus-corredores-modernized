<div class="row" ng-controller='BlotterMonedasTesoreriaCtrl'>
	<div class="row no-margin" ng-form="frmBlotterMonedasTesoreria">
	
		<div class="col-xs-8" style="padding-right: 10px;">
			<div class="row">
				<bcs-grid id="frmBlotterMonedasTesoreria_gridMonedasSistema"
					configuracion 	= "confMonedasSistema"
					seleccionado 	= "seleccionMonedasSistema">
				</bcs-grid>
            </div>
            <div class="row bcs-panel-comando" style="padding-top: 4px;">			
				<div class="col-xs-3 pull-right">
					<bcs-button id="frmBlotterMonedasTesoreria_asignar"
						bcs-tipo			= "'bcs-button-primary'"  
						bcs-auto-desactivar	= "false"  
						bcs-texto			= "'UI_AGREGAR' | translate"  
						bcs-habilitado		= "seleccionMonedasSistema.length > 0"
						bcs-clic			= "agregarMonedasTesoreria()">
					</bcs-button>
				</div>
			</div>
        </div>
        
        <div class="col-xs-4" style="padding-left: 10px;">
        	<div class="row">
				<bcs-grid id="frmBlotterMonedasTesoreria_gridMonedasTesoreria"
					configuracion = "confMonedasTesoreria"
					seleccionado  = "seleccionMonedasTesoreria">
				</bcs-grid>
            </div>
            <div class="row bcs-panel-comando" style="padding-top: 4px;">
                <div class="col-xs-5 pull-right">
                    <bcs-button id="frmBlotterMonedasTesoreria_asignar"
                        bcs-tipo			= "'bcs-button-primary'"  
                        bcs-auto-desactivar	= "false"  
                        bcs-texto			= "'UI_ELIMINAR' | translate"  
                        bcs-habilitado		= "seleccionMonedasTesoreria.length > 0"                                                                         
                        bcs-clic			= "eliminarMonedasTesoreria()">
                    </bcs-button>
                </div>
			</div> 
        </div>
	
    </div>
</div>

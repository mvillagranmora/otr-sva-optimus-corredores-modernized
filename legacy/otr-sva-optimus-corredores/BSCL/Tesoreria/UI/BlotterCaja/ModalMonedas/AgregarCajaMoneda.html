<div class="col-xs-12" ng-controller="AgregarCajasMonedaCtrl">
	<div class="bcs-cuerpo">
		<div class="row">
			<form name="formAgregarCajaMoneda" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_CODIGO_CAJA</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido="data.codigoCaja.trim()!=''"
						ng-model="data.codigoCaja"
						k-ng-disabled="true"> </bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_CAJA</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido="data.nombreCaja.trim()!=''"
						ng-model="data.nombreCaja"
						k-ng-disabled="true"> </bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_MONEDA</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="oConfiguracionComboBoxMoneda.idActual!='false'" 
						auto-cargar="'true'"
						tipo="oConfiguracionComboBoxMoneda.tipo"
						configuracion= "oConfiguracionComboBoxMoneda.configuracion"
						seleccionado="oConfiguracionComboBoxMoneda.seleccionado"
						id-actual="oConfiguracionComboBoxMoneda.idActual"
						filtros="oConfiguracionComboBoxMoneda.filtros"
						todos="'N'" id-defecto="oConfiguracionComboBoxMoneda.idDefecto"> </bcs-combobox-base>
				</div>
				<!--<div class="row">
					<label class="col-xs-4" translate>UI_SALDO</label>
					<bcs-input-monetario class="col-xs-6"
						bcs-requerido="data.kngSaldo.trim()!=''"
						name="data.saldo"
						ng-model="data.ngSaldo"
						k-ng-model="data.kngSaldo"
						k-options="data.optSaldo"
						simbolo="oConfiguracionComboBoxMoneda.idActual"
						decimales="2"></bcs-input-monetario>
				</div>-->
				<div class="row">
					<label class="col-xs-4" translate>UI_TIPO_MOVIMIENTO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="oConfiguracionTipoMovimiento.idActual!='false'"
						tipo="oConfiguracionTipoMovimiento.tipo" 
						configuracion= "oConfiguracionTipoMovimiento.configuracion" 				
						seleccionado="oConfiguracionTipoMovimiento.seleccionado"
						filtros="oConfiguracionTipoMovimiento.filtros" 
						id-actual="oConfiguracionTipoMovimiento.idActual"
						todos="'S'" id-defecto="oConfiguracionTipoMovimiento.idDefecto">
					</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8" 
						bcs-requerido="oConfiguracionEstadoTesoreria.idActual!='false'"
						auto-cargar="'true'"
						tipo="oConfiguracionEstadoTesoreria.tipo"
						configuracion= "oConfiguracionEstadoTesoreria.configuracion"
						seleccionado="oConfiguracionEstadoTesoreria.seleccionado"
						id-actual="oConfiguracionEstadoTesoreria.idActual"
						filtros="oConfiguracionEstadoTesoreria.filtros"
						todos="'N'" id-defecto="oConfiguracionEstadoTesoreria.idDefecto">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate"
			bcs-habilitado="formAgregarCajaMoneda.$valid" bcs-clic="AgregarCajaMoneda()"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

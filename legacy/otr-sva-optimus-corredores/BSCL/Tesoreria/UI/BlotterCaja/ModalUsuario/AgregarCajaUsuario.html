<div class="col-xs-12" ng-controller="AgregarCajaUsuarioCtrl">
	<div class="bcs-cuerpo">
		<div class="row">
			<form name="formAgregarCajaUsuario" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_CODIGO_CAJA</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido="data.codigoCaja.trim()!=''"
						ng-model="data.codigoCaja"
						k-ng-disabled="true"> </bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_CAJA</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido="data.nombreCaja.trim()!=''"
						ng-model="data.nombreCaja"
						k-ng-disabled="true"> </bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_USUARIO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="oConfiguracionComboBoxUsuario.idActual!='false'" 
						auto-cargar="'true'" 
						tipo="oConfiguracionComboBoxUsuario.tipo" 
						configuracion= "oConfiguracionComboBoxUsuario.configuracion"
						seleccionado="oConfiguracionComboBoxUsuario.seleccionado"
						id-actual="oConfiguracionComboBoxUsuario.idActual"
						filtros="oConfiguracionComboBoxUsuario.filtros"
						todos="'N'" id-defecto="oConfiguracionComboBoxUsuario.idDefecto"> </bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_SOBREGIRO</label>
					<bcs-input-checkbox class="col-xs-8"
						ng-model="data.sobregiro"> </bcs-input-checkbox>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_FECHA_INICIO</label>
					<bcs-input-date class="col-xs-8"
						bcs-requerido="data.fechaInicio.trim()!=''"
						k-ng-model="data.fechaInicio"> </bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_FECHA_TERMINO</label>
					<bcs-input-date class="col-xs-8"
						bcs-requerido="data.fechaTermino.trim()!=''"
						k-ng-model="data.fechaTermino"> </bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8" 
						bcs-requerido="oConfiguracionEstadoTesoreria.idActual!='false'"
						auto-cargar="'true'"
						tipo="oConfiguracionEstadoTesoreria.tipo"
						configuracion= "oConfiguracionEstadoTesoreria.configuracion"
						seleccionado="oConfiguracionEstadoTesoreria.seleccionado"
						id-actual="oConfiguracionEstadoTesoreria.idActual"
						filtros="oConfiguracionEstadoTesoreria.filtros"
						todos="'N'" id-defecto="oConfiguracionEstadoTesoreria.idDefecto">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate"
			bcs-habilitado="formAgregarCajaUsuario.$valid" bcs-clic="AgregarCajaUsuario()"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

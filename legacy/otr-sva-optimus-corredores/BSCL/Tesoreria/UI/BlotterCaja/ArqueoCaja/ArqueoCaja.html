<div class="col-xs-12" ng-controller="ArqueoCajaCtrl as bInfoCaja">
	<div class="bcs-cuerpo">
		<div class="row col-xs-5">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_CAJA</label>
				<bcs-input-texto 
					class="col-xs-9"
					k-ng-disabled="'true'"
					ng-model="bInfoCaja.Caja">
				</bcs-input-texto>
			</div>
			<div class="col-xs-6" style="padding-left: 10px;">
				<label class="col-xs-3" translate>UI_ESTADO</label>
				<bcs-input-texto
					class="col-xs-9"
					k-ng-disabled="'true'"
					ng-model="bInfoCaja.NombreEstado">
				</bcs-input-texto>
			</div>
		</div>

		<div class="row col-xs-12" style="padding-top: 10px;">
			<div class="col-xs-4">
				<bcs-grid id="arqueo-caja"
					configuracion = "confArqueoCaja"
					seleccionado = "seleccionArqueoCaja">
				</bcs-grid>
				<div class="row bcs-panel-comandos" style="padding-top: 3px !important;">
					<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'" ng-show="bInfoCaja.IdEstado === 'CER'"
						bcs-auto-desactivar="false" bcs-texto="'UI_ABRIR_CAJA' | translate"
						bcs-habilitado="'true'" bcs-clic="mantenedorCaja('ABT')"></bcs-button>
					<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'" ng-show="bInfoCaja.IdEstado === 'ABT'"
						bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR_CAJA' | translate"
						bcs-habilitado="'true'" bcs-clic="mantenedorCaja('CER')"></bcs-button>
				</div>				
			</div>
			<div class="col-xs-8" style="padding-left: 10px;">
				<bcs-grid id="detalle-arqueo-caja"
					configuracion = "confDetalleArqueoCaja"
					seleccionado = "seleccionDetalleArqueoCaja">
				</bcs-grid>
				<div class="row bcs-panel-comandos" style="padding-top: 3px !important; ">
					<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
						bcs-auto-desactivar="false" bcs-texto="'UI_DEPOSITAR' | translate"
						bcs-habilitado="'true'" bcs-clic="envioADeposito()"></bcs-button>
					<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="false" bcs-texto="'UI_ENVIAR_BOVEDA' | translate"
						bcs-habilitado="'true'" bcs-clic="envioABoveda()"></bcs-button>
				</div>
			</div>
		</div>
	</div>

	
</div>

<div class="row" ng-controller='MotivoAnulacionCtrl'>
	<form name="frmMotivoAnulacion">
		<div class="row bcs-cuerpo">		
			<div class="row">
				<div class="col-xs-3">
					<label translate>UI_MOTIVO_ANULACION</label>
				</div>
				<div class="col-xs-9">
					<bcs-combobox-base id = "frmMotivoAnulacion_Motivo"
						bcs-requerido							
						tipo			= "oConfiguracionMotivoAnulacion.tipo" 
						configuracion	= "oConfiguracionMotivoAnulacion.configuracion" 				
						seleccionado	= "oConfiguracionMotivoAnulacion.seleccionado"
						filtros			= "oConfiguracionMotivoAnulacion.filtros" 
						id-actual		= "oConfiguracionMotivoAnulacion.idActual">
					</bcs-combobox-base>
				</div>					
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_COMENTARIO</label>					
				<textarea class="col-xs-9" 
					id="frmMotivoAnulacion_descripcion" 
					ng-model="descripcion">
				</textarea>
			</div>	
		</div>

		<div class="row bcs-panel-comandos alignButtonsToRight" style="margin-top: 10px">
			<bcs-button  class="col-xs-2" id="frmMotivoAnulacion_btnConfirmar"
				bcs-tipo="'bcs-button-primary'"
				bcs-habilitado='frmMotivoAnulacion.$valid'
				bcs-texto="'UI_CONFIRMAR' | translate"
				bcs-clic="confirmar()"
			></bcs-button>
			<bcs-button  class="col-xs-2" id="frmMotivoAnulacion_btnCancelar" 
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false"
				bcs-habilitado='true' 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-clic="cancelar()"
			></bcs-button>			
		</div>
	</form>	
</div>

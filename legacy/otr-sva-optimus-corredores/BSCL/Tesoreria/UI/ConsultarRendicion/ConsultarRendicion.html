<div id="ConsultarRendicion" class="col-xs-12" ng-controller="ConsultarRendicionCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<bcs-grid 
				id="grid-consultar-rendicion"
			 	configuracion="defaultOptions"
				api = "apiGridRendicion"
				seleccionado="datos.kNgModel">		
			</bcs-grid>
		</div>
	</div>
	
	
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="procesarArchivo" 
				bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_PROCESAR' | translate" 
				bcs-habilitado="'true'"
				ng-show ="isVisible" 
				bcs-clic="procesarArchivo()">

		</div>
		<div class="col-xs-1"></div>

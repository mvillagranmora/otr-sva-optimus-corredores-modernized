<div class="row" ng-controller='AnularChequeCtrl'>
<form name="frmAnularCheque">
	<div id="AnularCheque">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-7" translate>UI_SERIE_CHEQUE</label>
						<bcs-input-numero bcs-requerido class="col-xs-5" 
							k-ng-model="NroChequeActual" 
							decimales="'0'" 
							k-ng-disabled="true" 
							id="frmNroChequeActual">
						</bcs-input-numero>
					</div>
				</div>
	 			
				<div class="row">
					<label class="col-xs-7" translate>UI_COMENTARIO</label>
	                <bcs-input-texto class="col-xs-5"
	                	maxlength="50"
						ng-model="Comentario"
	                    id="frmComentario"						
						tipo-campo="'textarea'"
						atributos="margin: 0px; height:73px;resize:none;width: 100%">
	                </bcs-input-texto>	

	                
				</div>
			</div>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'"   bcs-clic="btnGrabar()" bcs-texto="'UI_ANULAR' | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>
		<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-secondary'" bcs-clic="btnCancelar()" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>		
	</div>
</form>
</div>

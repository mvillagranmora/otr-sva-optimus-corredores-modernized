
<div ng-controller="ComplementarTransacionCtrl">	
	<div class="row bcs-cuerpo">	
		<form name="frmComplementarTransacion" class="col-xs-12 form-horizontal">
			
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_TRANSACCION</label>
				<bcs-input-date bcs-requerido class="col-xs-8" bcs-requerido k-ng-model="fechaTransaccion" ></bcs-input-date>	
			</div>
			
			<div class="row">
				<label class="col-xs-4" translate>UI_FOLIO_TRANSACCION</label>
				<bcs-input-numero class="col-xs-8" id="frmComplementarTransacion_FolioTransaccion" ng-model="folioTransaccion" decimales="0"></bcs-input-numero>
			</div>
			
			<div class="row"><br/></div>
		</form>
	</div>
	 
	<div class="row bcs-panel-comandos alignButtonsToRight">	
		<bcs-button class="col-xs-4" 
			bcs-habilitado="frmComplementarTransacion.$valid" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_PROCESAR' | translate" 
			bcs-clic="procesar()">
		</bcs-button>
		<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-secondary'"  bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>
</div>

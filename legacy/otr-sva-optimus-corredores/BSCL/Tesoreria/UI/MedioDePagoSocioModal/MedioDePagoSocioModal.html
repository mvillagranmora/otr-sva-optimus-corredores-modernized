<div class="row" ng-controller='MedioDePagoSocioModalCtrl'>
	<form name="frmMedioDePagoSocioModal"  class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label>									
				<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_SOCIO_NEGOCIO"
					name="frm.socioNegocio"
					ng-model="frm.socioNegocio"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>
			</div>			

			<div class="row">
				<label class="col-xs-4" translate>UI_DOCUMENTO_IDENTIDAD</label>									
				<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_DOCUMENTO_IDENTIDAD"
					name="frm.documentoIdentidad" 				
					ng-model="frm.documentoIdentidad"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>
			</div>

			<div class="row">
				<label class="col-xs-4" translate>UI_MEDIO_DE_PAGO</label>									
				<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_SOCIO_NEGOCIO"
					name="frm.medioDePago" 				
					ng-model="frm.medioDePago"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>
			</div>

			<div class="row">
				<label class="col-xs-4" translate>UI_MODALIDAD</label>
				<bcs-combobox-base class="col-xs-8"	id="frmMedioDePagoSocioModal_MODALIDAD" 							
					tipo="frm.oConfiguracionModalidadPago.tipo" 
					configuracion= "frm.oConfiguracionModalidadPago.configuracion" 				
					seleccionado="frm.oConfiguracionModalidadPago.seleccionado"
					filtros="frm.oConfiguracionModalidadPago.filtros" 
					id-actual="frm.oConfiguracionModalidadPago.idActual"
					id-defecto="frm.oConfiguracionModalidadPago.idDefecto"
					activado="frm.oConfiguracionModalidadPago.activado"
					item-post-filtro="'1'">
				</bcs-combobox-base>
			</div>

			<div style="height: 110px" ng-show="showCuentasBancarias">
				<div class="row">
					<label class="col-xs-4" translate>UI_CUENTAS_BANCARIAS</label>
					<bcs-combobox-base class="col-xs-8" id="frmMedioDePagoSocioModal_CUENTAS_BANCARIAS" bcs-requerido ="showCuentasBancarias"
						tipo="frm.oConfiguracionCuentaBancoSocioNegocio.tipo" 
						configuracion= "frm.oConfiguracionCuentaBancoSocioNegocio.configuracion" 				
						seleccionado="frm.oConfiguracionCuentaBancoSocioNegocio.seleccionado"
						filtros="frm.oConfiguracionCuentaBancoSocioNegocio.filtros" 
						id-actual="frm.oConfiguracionCuentaBancoSocioNegocio.idActual"
						id-defecto="frm.oConfiguracionCuentaBancoSocioNegocio.idDefecto"
						item-post-filtro="'1'">
					</bcs-combobox-base>
				</div>

				<div class="row">
					<label class="col-xs-4" translate>UI_TIPO_CUENTA_BANCARIA</label>									
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_TIPO_CUENTA_BANCARIA" bcs-requerido ="showCuentasBancarias"
						name="frm.tipoCuentaBancaria" 				
						ng-model="frm.tipoCuentaBancaria"
						k-ng-disabled = "'true'" 
					></bcs-input-texto>
				</div>

				<div class="row">
					<label class="col-xs-4" translate>UI_BANCO</label>
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_BANCO" bcs-requerido ="showCuentasBancarias"
						name="frm.banco" 				
						ng-model="frm.banco"
						k-ng-disabled = "'true'" 
					></bcs-input-texto>
				</div>

				<div class="row">
					<label class="col-xs-4" translate>UI_NUMERO_CUENTA</label>									
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_NUMERO_CUENTA" bcs-requerido ="showCuentasBancarias"
						name="frm.numeroCuenta" 				
						ng-model="frm.numeroCuenta"
						k-ng-disabled = "'true'" 
					></bcs-input-texto>
				</div>

				<div class="row">
					<label class="col-xs-4" translate>UI_MONEDA</label>						 			
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_MONEDA_CUENTA" bcs-requerido ="showCuentasBancarias"
						name="frm.moneda" 				
						ng-model="frm.moneda"
						k-ng-disabled = "'true'" 
					></bcs-input-texto>
				</div>
				
				<div class="row">
					<label class="col-xs-4" translate>UI_CUENTA_DCV_ORIGEN</label>						 			
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_CUENTA_ORIGEN_DCV" 
						name="frm.cuentaOrigenDCV" 				
						ng-model="frm.cuentaOrigenDCV"
						k-ng-disabled = "'true'" 
					></bcs-input-texto>
				</div>			
				
				<div class="row">
					<label class="col-xs-4" translate>UI_CUENTA_DCV_DESTINO</label>						 			
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_CUENTA_DESTINO_DCV" 
						name="frm.cuentaDestinoDCV" 				
						ng-model="frm.cuentaDestinoDCV"
						k-ng-disabled = "'true'" 
					></bcs-input-texto>
				</div>	
				
				<div class="row">
					<label class="col-xs-4" translate>UI_CLAVE_DCV</label>						 			
					<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_CLAVE_DCV" bcs-requerido ="frm.idMedioDePago === 'TDP'"
						name="frm.claveDCV"
						ng-model="frm.claveDCV"
						k-ng-disabled="frm.idMedioDePago !== 'TDP'"
					></bcs-input-texto>
				</div>										
				
			</div>
		</div>
		<div style="height: 110px" ng-show="showCajas">
			<div class="row">
				<label class="col-xs-4" translate>UI_CAJA</label>
				<bcs-combobox-base class="col-xs-8" id="frmMedioDePagoSocioModal_CAJA" bcs-requerido ="showCajas"
					tipo="frm.oConfiguracionCaja.tipo" 
					configuracion= "frm.oConfiguracionCaja.configuracion"
					seleccionado="frm.oConfiguracionCaja.seleccionado"
					filtros="frm.oConfiguracionCaja.filtros" 
					id-actual="frm.oConfiguracionCaja.idActual"
					id-defecto="frm.oConfiguracionCaja.idDefecto"
					activado="frm.oConfiguracionCaja.activado">
				</bcs-combobox-base>
			</div>

			<div class="row">
				<label class="col-xs-4" translate>UI_CODIGO</label>									
				<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_CODIGO" bcs-requerido ="showCajas"
					name="uCodigoCaja" 
					ng-model="frm.CodigoCaja" 
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>

			<div class="row">
				<label class="col-xs-4" translate>UI_MONEDA</label>									
				<bcs-input-texto class="col-xs-8" id="frmMedioDePagoSocioModal_MONEDA_CAJA" bcs-requerido ="showCajas"
					name="uMonedaCaja" 
					ng-model="frm.MonedaCaja" 
					k-ng-disabled="'true'">
				</bcs-input-texto>
			</div>
	
		</div> 
		
		<div class="row bcs-panel-comandos alignButtonsToRight divButtonsMedioPagoSocio">
			<bcs-button class="col-xs-2"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_SELECCIONAR' | translate" 
				bcs-habilitado="frmMedioDePagoSocioModal.$valid"
				bcs-clic="seleccionar(frm)"
			></bcs-button>
			<bcs-button class="col-xs-2" 
				id="frmMedioDePagoSocioModal_btn"
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true"
				bcs-clic="cancelar()"
			></bcs-button>
		</div>					
	</form>
</div>

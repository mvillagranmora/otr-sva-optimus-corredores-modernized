<div class="row" ng-controller='VistaPreviaComprobanteCtrl'>

	<div class="row">
		<bcs-grid id="grid-vista-previa-comprobante"
		 	configuracion = "confVistaPreviaComprobante"
			seleccionado = "seleccionVistaPreviaComprobante">		
		</bcs-grid>
	</div>
		
	<div class="row bcs-panel-comandos" style="margin-top: 10px">
		<bcs-button  class="col-xs-2 pull-right" id="VistaPreviaComprobante_btnConfirmar"
			bcs-habilitado='true'
			bcs-tipo="'bcs-button-primary'"
			bcs-texto="'UI_CONFIRMAR' | translate"
			bcs-clic="confirmar()"
		></bcs-button>
		<bcs-button  class="col-xs-2 pull-right" id="VistaPreviaComprobante_btnCancelar" 
			bcs-auto-desactivar="false"
			bcs-habilitado='true' 
			bcs-tipo="'bcs-button-secondary'"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-clic="cancelar()"
		></bcs-button>			
	</div>
</div>

<div id="ConsultarIngresoEgreso" class="row" ng-controller='ConsultarIngresoEgresoCtrl'>	
	<div class="row bcs-cuerpo" ng-form="frmConsultarIngresoEgreso">	
		<div class="row">
		
			<!-- INICIO FILTROS -->
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-4">
						<label  class="col-xs-4 bcs-label" translate>UI_TIPO_MOVIMIENTO</label>
						<bcs-combobox-base  class="col-xs-8" id="frmConsultarIngresoEgreso_TipoMovimiento"	
							auto-cargar		 = "'true'"
							tipo			 = "oConfiguracionTipoMovimiento.tipo"
							configuracion	 = "oConfiguracionTipoMovimiento.configuracion"
							seleccionado	 = "oConfiguracionTipoMovimiento.seleccionado"
							id-actual		 = "oConfiguracionTipoMovimiento.idActual"
							filtros			 = "oConfiguracionTipoMovimiento.filtros"
							memoria			 = "IngresoEgreso"
							todos="'S'" id-defecto="'0'" item-post-filtro="'1'">			
						</bcs-combobox-base>
					</div>
					
					<div class="col-xs-4">
						<label class="col-xs-4 bcs-label" style="padding-left: 5px;" translate>UI_FECHA_LIQUIDACION</label>
						<bcs-input-date class="col-xs-4" id="frmConsultarIngresoEgreso_fechaLiquidacionDesde" k-ng-model="kngFechaLiquidacionDesde"></bcs-input-date>
						<bcs-input-date class="col-xs-4" id="frmConsultarIngresoEgreso_fechaLiquidacionHasta" k-ng-model="kngFechaLiquidacionHasta"></bcs-input-date>
					</div>
					
					<div class="col-xs-4">
						<label class="col-xs-5 bcs-label" style="padding-left: 10px" translate>UI_TIPO_SOCIO_NEGOCIO</label>								
						<bcs-combobox-base class="col-xs-7" id="frmConsultarIngresoEgreso_TipoSocioNegocio"
							auto-cargar		="'true'"
							tipo			="oConfiguracionTipoSocioNegocio.tipo"
							configuracion	="oConfiguracionTipoSocioNegocio.configuracion" 				
							seleccionado	="oConfiguracionTipoSocioNegocio.seleccionado"
							filtros			="oConfiguracionTipoSocioNegocio.filtros"
							activado        ="oConfiguracionTipoSocioNegocio.activado"
							id-actual		="oConfiguracionTipoSocioNegocio.idActual"
							id-post-filtro	="oConfiguracionTipoSocioNegocio.idPostFiltro"
							todos="'S'" id-defecto="'0'" item-post-filtro="'1'">
						</bcs-combobox-base>
					</div>
				</div>
				
				<div class="row">
	                <div class="col-xs-8">
	                    <label class="col-xs-2 bcs-label" translate>UI_SOCIO_NEGOCIO</label>
						 <bcs-combobox-base class="col-xs-10" id="frmConsultarIngresoEgreso_SocioNegocio"
						 	auto-cargar		="'false'"
						    tipo			="'combobox-socio-negocio'"
						    configuracion	="oConfiguracionSocioNegocio.configuracion"
						    id-Actual		="oConfiguracionSocioNegocio.idActual"
						    seleccionado	="oConfiguracionSocioNegocio.seleccionado"
						    filtros			="oConfiguracionSocioNegocio.filtros"
						    carga-cliente-automatico = "'true'"
							cascada-a		="oConfiguracionPortafolio.filtros.IdCliente"
							cascada-valor	="'IdCliente'"							
	                        cascada-defecto	="-1">
						</bcs-combobox-base >
	                </div>
	                <div class="col-xs-4">
						<label class="col-xs-5 bcs-label" style="padding-left: 10px" translate>UI_CAJA</label>
						<bcs-combobox-base  class="col-xs-7" id="frmConsultarIngresoEgreso_Caja"							
							tipo			="oConfiguracionCaja.tipo"						
							configuracion	= "oConfiguracionCaja.configuracion"
							seleccionado	="oConfiguracionCaja.seleccionado"
							id-actual		="oConfiguracionCaja.idActual"
							filtros			="oConfiguracionCaja.filtros"
							cascada1-a		="oConfiguracionCajaMoneda.filtros.IdCaja"
							cascada1-valor	="'IdCaja'"
							todos="'S'" item-post-filtro="'1'">
						</bcs-combobox-base>
					</div>
	            </div>

	
		            
	            <div class="row">
	                <div class="col-xs-8">
	                    <label class="col-xs-2 bcs-label" translate>UI_PORTAFOLIO</label>
						 <bcs-combobox-base class="col-xs-10" id="frmConsultarIngresoEgreso_Portafolio"
						 	auto-cargar			  = "'false'"
						    tipo				  = "'combobox-portafolio'"
						    configuracion		  = "oConfiguracionPortafolio.configuracion"
						    seleccionado		  = "oConfiguracionPortafolio.seleccionado"
						    filtros				  = "oConfiguracionPortafolio.filtros"						    
						    id-actual		  	  = "oConfiguracionPortafolio.idActual"
						    activado              = "oConfiguracionPortafolio.activado"						    
	                        item-post-filtro	  = "'1'"						    
						    usa-filtros-completos = "'S'">
						</bcs-combobox-base>
	                </div>
	                <div class="col-xs-4">
						<label class="col-xs-5 bcs-label"  style="padding-left: 10px" translate>UI_MONEDA</label>					
						<bcs-combobox-base  class="col-xs-7" id="frmConsultarIngresoEgreso_Moneda"
							auto-cargar		="'false'"									
							tipo			="oConfiguracionCajaMoneda.tipo"						
							configuracion	="oConfiguracionCajaMoneda.configuracion"
							seleccionado	="oConfiguracionCajaMoneda.seleccionado"
							id-actual		="oConfiguracionCajaMoneda.idActual"
							filtros			="oConfiguracionCajaMoneda.filtros"
							memoria			="oConfiguracionCaja.idActual"
							todos="'S'" id-defecto="0" item-post-filtro="'1'">
						</bcs-combobox-base>
					</div>
	            </div> 
				
				<div class="row">
					<div class="col-xs-8">
						<label class="col-xs-2 bcs-label" translate>UI_CONCEPTO</label>
						<!-- memoria			="oConfiguracionTipoMovimiento.idActual" -->
						<bcs-combobox-base  class="col-xs-10" id="frmConsultarIngresoEgreso_Concepto"
							auto-cargar		 = "true"
							tipo			 = "oConfiguracionConcepto.tipo" 
							configuracion	 = "oConfiguracionConcepto.configuracion" 				
							seleccionado	 = "oConfiguracionConcepto.seleccionado"
							filtros			 = "oConfiguracionConcepto.filtros"
							activado         = "oConfiguracionConcepto.activado"
							id-actual		 = "oConfiguracionConcepto.idActual">
						</bcs-combobox-base>
	
					</div>
					<div class="col-xs-4">
						<label class="col-xs-5 bcs-label" style="padding-left: 10px" translate>UI_ESTADO</label>
						<bcs-combobox-base  class="col-xs-7" id="frmConsultarIngresoEgreso_Estado"
							auto-cargar		="'true'"					
							tipo			="oConfiguracionEstadoTesoreria.tipo"
							configuracion	="oConfiguracionEstadoTesoreria.configuracion"
							seleccionado	="oConfiguracionEstadoTesoreria.seleccionado"
							id_defecto		="oConfiguracionEstadoTesoreria.idDefecto"
							id-actual		="oConfiguracionEstadoTesoreria.idActual"
							filtros			="oConfiguracionEstadoTesoreria.filtros"
							memoria			="IngresoEgreso"				
							todos="'S'" id-defecto="'0'" item-post-filtro="'1'">
						</bcs-combobox-base>			
					</div>					
				</div>

				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4 bcs-label" translate>UI_MERCADO</label>					
						<bcs-combobox-base
							class				="col-xs-8"
							tipo				="oConfiguracionClasificacionTipoInstrumento.tipo"
							id-actual			="oConfiguracionClasificacionTipoInstrumento.idActual"
							seleccionado		="oConfiguracionClasificacionTipoInstrumento.seleccionado"
							filtros				="oConfiguracionClasificacionTipoInstrumento.filtros"
							cascada-a			="oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
							cascada-valor		="oConfiguracionClasificacionTipoInstrumento.cascadaValor"
							cascada1-valor		="oConfiguracionClasificacionTipoInstrumento.cascadaValor"
							todos				="'S'"
							item-post-filtro	="'1'">
						</bcs-combobox-base>
					</div>
					
					<div class="col-xs-4">
						<label class="col-xs-4 bcs-label" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base
							class				="col-xs-8"
							tipo				="oConfiguracionTipoInstrumento.tipo"
							id-actual			="oConfiguracionTipoInstrumento.idActual"
							seleccionado		="oConfiguracionTipoInstrumento.seleccionado"
							filtros				="oConfiguracionTipoInstrumento.filtros"
							cascada-valor		="oConfiguracionTipoInstrumento.cascadaValor"
							cascada1-valor		="oConfiguracionTipoInstrumento.cascadaValor"
							todos				="'S'"
							item-post-filtro	="'1'">
						</bcs-combobox-base>	
					</div>
	                <div class="col-xs-4">
					
					</div>
	            </div> 
			</div>
			<!-- FIN FILTROS -->
					
			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" 
						bcs-tipo="'bcs-button-search'"  
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_BUSCAR' | translate" 
						bcs-habilitado='true'  
						bcs-clic="buscarMovimientos(filtros)"
						
					></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" 
						bcs-tipo="'bcs-button-secondary'"  
						bcs-auto-desactivar="'false'" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado='true'  
						bcs-clic="limpiarFiltros(filtros)"
						
					></bcs-button>
				</div>
			</div>
			<!-- FIN BOTONES -->
		</div>
		
		<div class="row">
			<bcs-grid id="grid-ingreso-egreso"
			 	configuracion = "confBasicaIngresoEgreso"
				seleccionado = "seleccionIngresoEgreso"				
				fn-doble-click = "detalleIngresoEgreso(seleccionIngresoEgreso)"
				fn-exportar-excel = "exportarExcel"
				footer="false">
				
				<div bcs-grid-detail ng-non-bindable>
					<div style="width : 1650px;">
	              	<uib-tabset> <!--<uib-tabset style="width:800px;">-->
	                  	<uib-tab heading="{{'UI_FORMA_DE_PAGO' | translate}}">
	                  		<bcs-grid configuracion = "confBasicaIngresoEgresoFormaPago(dataItem)"	                            
	                            seleccionado = "seleccionIngresoEgresoFormaPago">
							</bcs-grid>                  		
	                  	</uib-tab>
					</uib-tabset>
					</div>
				</div>
			</bcs-grid>
		</div>
	</div> 

	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos bcs-background-comandos">
		<bcs-button  id="ConsultarIngreso_CrearIngresoEgreso" 		class="col-xs-2" bcs-tipo="'bcs-button-primary'" 	 bcs-auto-desactivar="false"  bcs-texto="'UI_CREAR_INGRESO_EGRESO' | translate"  bcs-habilitado='true'  	  bcs-clic="crearIngresoEgreso()"></bcs-button>
		<bcs-button  id="ConsultarIngreso_Editar" 					class="col-xs-2" bcs-tipo="'bcs-button-edit'" 		 bcs-auto-desactivar="false"  bcs-texto="'UI_EDITAR' | translate"      			 bcs-habilitado="btnActivo"   bcs-clic="editarIngresoEgreso(seleccionIngresoEgreso)"></bcs-button>
		<bcs-button  id="ConsultarIngreso_GenerarComprobante" 		class="col-xs-2" bcs-tipo="'bcs-button-secondary'"   bcs-auto-desactivar="false"  bcs-texto="'UI_GENERAR_COMPROBANTE' | translate"   bcs-habilitado="btnActivo"   bcs-clic="generarComprobantes()"></bcs-button>			
		<bcs-button  id="ConsultarIngreso_EdicionMultiple" 			class="col-xs-2" bcs-tipo="'bcs-button-edit'" 		 bcs-auto-desactivar="false"  bcs-texto="'UI_EDICION_MULTIPLE' | translate"      bcs-habilitado="btnActivo"   bcs-clic="edicionMultiple()"></bcs-button>				
		<bcs-button  id="ConsultarIngreso_anularIngresoEgreso" 		class="col-xs-2" bcs-tipo="'bcs-button-anular'"  	 bcs-auto-desactivar="false"  bcs-texto="'UI_ANULAR' | translate"                bcs-habilitado="btnActivo"   bcs-clic="anularIngresoEgreso()"></bcs-button>
		
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" bcs-tipo="'bcs-button-secondary'">
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			<li ng-click="exportarReporte()">{{'UI_EXPORTAR_REPORTE' | translate}}</li>
			<li id="ConsultarIngreso_crearPartidaIngreso" ng-click="crearPartidaIngresoEgreso('PARING')">{{'UI_PARTIDA_INGRESOS' | translate}}</li>
			<li id="ConsultarIngreso_crearPartidaEgreso"  ng-click="crearPartidaIngresoEgreso('PAREGR')">{{'UI_PARTIDA_EGRESOS' | translate}}</li>
            <li ng-click="seleccionarDeseleccionarTodosMovimientos()">{{'UI_SELECCIONAR_DESELECCIONAR_TODO' | translate}}</li>
            <li id="ConsultarIngreso_BloquearDesbloquear" ng-click="bloquearDesbloquearIngresoEgreso()">{{'UI_BLOQUEAR_DESBLOQUEAR' | translate}}</li>
		</bcs-menu>
	</div> 
</div>

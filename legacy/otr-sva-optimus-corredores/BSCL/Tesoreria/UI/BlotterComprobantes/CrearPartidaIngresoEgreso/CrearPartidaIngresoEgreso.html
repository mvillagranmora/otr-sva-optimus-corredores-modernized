<div class="col-xs-12" ng-controller="PartidaIngresoEgresoCtrl">
    
    <div class="bcs-cuerpo">
		<!--- INICIO FORMULARIO -->
		<form name="frmPartidaIngresoEgreso" class="col-xs-12 form-horizontal">
			
			<div class="row">
				<tabset>
					<!-- INICIO DATOS FORMA DE PAGO -->				
					<tab select="select('tabFormaPago')" heading="{{'UI_FORMAS_PAGO' | translate}}">
						<div id="tabFormaPago" style="height: 600px">
							<bcs-formas-de-pago
								id-ventana					= "idVentana"							
								obj-forma-de-pago			= "objParametrosVentana"
								saldo-por-asignar			= "data.saldoPorAsignar"
								configuracion-forma-pago	= "data.configuracionFormaPago"
								show-bloque-datos-operacion	= "false"
								show-bloque-datos-socio		= "false">
							</bcs-formas-de-pago>

							<div class="row">																															
								<bcs-button class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-secondary'"   bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"  bcs-habilitado="'true'" bcs-clic="data.eliminarFormaPago()" id="frmPartidaIngresoEgreso_buttonEliminar"></bcs-button>
								<bcs-button class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-primary'"     bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"  bcs-habilitado="'true'" bcs-clic="data.agregarFormaPago()" id="frmPartidaIngresoEgreso_buttonAgregar"></bcs-button>
							</div>
							
							<div class="row">						
								<bcs-grid id="frmPartidaIngresoEgreso_gridFormaDePago"
									configuracion = "data.confBasicaPartidaIngresoEgresoFormaDePago"
									seleccionado  = "data.seleccionPartidaIngresoEgresoFormaDePago">
								</bcs-grid>							
							</div>

							<div class="row bcs-panel-comandos">
								<bcs-button class="col-xs-2  pull-right"   bcs-tipo="'bcs-button-primary'"   bcs-auto-desactivar="false" bcs-texto="'UI_CREAR' | translate"     bcs-habilitado="'true'" bcs-clic="data.crearPartidaIngresoEgreso()"  id="frmPartidaIngresoEgreso_buttonCrear"></bcs-button> <!--btnActivo-->
								<bcs-button class="col-xs-2  pull-right"   bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"  bcs-habilitado="'true'" bcs-clic="data.cancelar('NOK')"  id="frmPartidaIngresoEgreso_buttonCancelar"></bcs-button>
								<div classxxx="col-xs-8"></div>
							</div> 
						</div>
					</tab> 	
					<!-- FIN DATOS FORMA DE PAGO -->
					
					
					
					
					<!-- MOVIMIENTOS A GENERAR PARTIDA DE INGRESO/EGRESO -->
					<tab select="select('tabMovimientos')" heading="{{'UI_MOVIMIENTOS' | translate}}">
						<div id="tabMovimientos" style="height: 600px">							
							<div class="row">
							
								<bcs-grid id="frmPartidaIngresoEgreso_gridMovimientos"
								 	configuracion = "confBasicaIngresoEgreso"
									seleccionado = "seleccionIngresoEgreso">
									
									<div bcs-grid-detail ng-non-bindable>
										<bcs-grid
											configuracion = "confBasicaIngresoEgresoFormaDePago(dataItem)"
											seleccionado = "seleccionIngresoEgresoFormaDePago">
										</bcs-grid>
									</div>
								</bcs-grid>
								
							</div>
						</div>		
					</tab>
					<!-- FIN MOVIMIENTOS A GENERAR PARTIDA DE INGRESO/EGRESO -->
					
					
						
				</tabset>
			</div>
			
		</form>
	</div>
	<!--- TERMINO FORMULARIO -->
	
</div>

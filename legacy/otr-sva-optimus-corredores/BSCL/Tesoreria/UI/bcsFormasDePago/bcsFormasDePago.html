<div>
	<!-- DATOS BASICOS -->			
	<div class="col-xs-12">
		<div class="row" style="height: 20px">
			<label class="k-window-subtitle" translate>UI_DATOS_BASICOS</label>
		</div>																
		<table class="table">
			<tr ng-show="showBloqueDatosOperacion">
				<td><label class="align_right" translate>UI_TIPO_MOVIMIENTO</label></td>
				<td><label class="">{{objFormaDePago[0].NombreTipoMovimiento}}</label></td>					
				<td><label class="align_right" translate>UI_SECUENCIA_COMPROBANTE</label></td>
				<td><label class="" >{{objFormaDePago[0].IdComprobante}}</label></td>
			</tr>
			<tr ng-show="showBloqueDatosSocio">
				<td><label class="align_right" translate>UI_SOCIO_NEGOCIO</label></td>
				<td><label class="">{{objFormaDePago[0].NombrePersona}}</label></td>					
				<td><label class="align_right" translate>UI_DOCUMENTO_IDENTIDAD</label></td>
				<td><label class="" >{{objFormaDePago[0].DocumentoIdentidad}}</label></td>
			</tr>
			<tr>
				<td><label class="align_right" translate>UI_CAJA</label></td>
				<td><label class="">{{objFormaDePago[0].NombreCaja}}</label></td>					
				<td><label class="align_right" translate>UI_CONCEPTO</label></td>
				<td><label class="" >{{objFormaDePago[0].NombreConcepto}}</label></td>
			</tr>
			<tr>
				<td><label class="align_right" translate>UI_FECHA_LIQUIDACION</label></td>
				<td><label class="">{{objFormaDePago[0].FechaLiquidacion | kformat:'d'}}</label></td>					
				<td><label class="align_right" translate>UI_MONTO</label></td>
				<td><label class="">{{objFormaDePago[0].Monto | kformat:'c':objFormaDePago[0].IdMoneda:'monto':'GEN'}}</label></td>
			</tr>
		</table>
	</div>
	<!-- FIN DATOS BASICOS -->


	<!-- MEDIO DE PAGO -->
	<div class="col-xs-12">
		<div class="row" style="margin-top: 10px;">
			<label class="k-window-subtitle" translate>{{tituloFormaPago}}</label>
		</div>
		<div class="row">	
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_MEDIOS_DE_PAGO</label>					
				<bcs-combobox-base class="col-xs-8"
					bcs-requerido
					tipo="data.oConfiguracionMedioDePago.tipo" 
					configuracion= "data.oConfiguracionMedioDePago.configuracion" 				
					seleccionado="data.oConfiguracionMedioDePago.seleccionado"
					id-actual="data.oConfiguracionMedioDePago.idActual"
					filtros="data.oConfiguracionMedioDePago.filtros" 								
					cascada1-a="data.oConfiguracionModalidadPago.filtros.IdMedioDePago"
					cascada1-valor="'IdMedioDePago'"				
					item-post-filtro="'5'"
					id-post-filtro="data.oConfiguracionMedioDePago.idPostFiltro"
					>
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6" style="padding-left: 15px" ng-show="data.showModalidadPago">
				<label class="col-xs-4" translate>UI_MODALIDAD</label>
				<bcs-combobox-base class="col-xs-8"
					auto-cargar="'false'"
					bcs-requerido
					tipo="data.oConfiguracionModalidadPago.tipo" 
					configuracion= "data.oConfiguracionModalidadPago.configuracion" 				
					seleccionado="data.oConfiguracionModalidadPago.seleccionado"
					id-actual="data.oConfiguracionModalidadPago.idActual"
					filtros="data.oConfiguracionModalidadPago.filtros"
					memoria= "data.oConfiguracionMedioDePago.idActual"
					item-post-filtro="'1'">
				</bcs-combobox-base>
			</div>
		</div>
		<div class="row" ng-show="data.showMontoSaldo">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_MONTO</label>					
				<bcs-input-monetario class="col-xs-6" 
					bcs-requerido
					k-ng-model="data.kngMontoFormaPago"
					k-ng-disabled = 'data.montoFormaPagoDisabled'
					simbolo="data.montoFormaPagoSimbolo" 
					decimales="data.montoFormaPagoDecimales">
				</bcs-input-monetario>										
			</div>
			<div class="col-xs-6" style="padding-left: 15px">										
				<label class="col-xs-4"  translate>UI_SALDO</label>					
				<bcs-input-monetario class="col-xs-6"
					k-ng-model="saldoPorAsignar" 
					k-ng-disabled = "true" 
					simbolo="data.saldoPorAsignarSimbolo" 
					decimales="data.saldoPorAsignarDecimales">
				</bcs-input-monetario>								
			</div>
		</div>
	</div>
	<!-- FIN MEDIO DE PAGO -->

	<!-- ORIGEN / DESTINO-->
	<div class="col-xs-12">
		<div class="row" style="height: 20px;">				
			<div class="row col-xs-6" ng-show="data.showDatosOrigen">
				<label class="k-window-subtitle" translate>{{tituloOrigenPago}}</label>
			</div>				
			<div class="row col-xs-6" ng-show="data.showDatosDestino" style="padding-left: 15px;">
				<label class="k-window-subtitle" translate>{{tituloDestinoPago}}</label>
			</div>				
			<div class="row col-xs-6" ng-show="data.showConfiguracionPartida" style="padding-left: 15px;">
				<label class="k-window-subtitle" translate>{{tituloConfiguracionPartida}}</label>
			</div>
		</div>
			
		<div class="row" style="height: 120px">
			<!-- INICIO "ORIGEN" FORMA DE PAGO -->
			<div class="col-xs-6" ng-show="data.showDatosOrigen">
				<!-- Datos cuenta bancaria de la corredora (cuando es egreso y origen corredora)-->
				<div class="col-xs-12" ng-show="data.showDatosCuentaBancariaCorredoraOrigen">
						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_CUENTAS_BANCARIAS</label>
							<bcs-combobox-base class="col-xs-8"
								bcs-requerido="data.oConfiguracionCuentaBancoCorredora.requerido"
								tipo="data.oConfiguracionCuentaBancoCorredora.tipo" 
								configuracion= "data.oConfiguracionCuentaBancoCorredora.configuracion" 				
								seleccionado="data.oConfiguracionCuentaBancoCorredora.seleccionado"
								filtros="data.oConfiguracionCuentaBancoCorredora.filtros" 
								id-actual="data.oConfiguracionCuentaBancoCorredora.idActual"
								cascada1-a="data.oConfiguracionChequerasSeries.filtros.IdCuentaBanco"
								cascada1-valor="'IdCuentaBanco'"
								cascada1-defecto="-1">
							</bcs-combobox-base>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_TIPO_CUENTA_BANCARIA</label>									
							<bcs-input-texto class="col-xs-8" name="uTipoCuentaCorredora" ng-model="data.TipoCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_BANCO</label>									
							<bcs-input-texto class="col-xs-8" name="uBancoCuentaCorredora" ng-model="data.BancoCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_NUMERO_CUENTA</label>									
							<bcs-input-texto class="col-xs-8" name="uNumeroCuentaCorredora" ng-model="data.NumeroCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>																	
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_MONEDA</label>									
							<bcs-input-texto class="col-xs-8" name="uMonedaCuentaCorredora" ng-model="data.MonedaCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>
						</div>	

						<div class="col-xs-12" ng-show="data.showSerieDocumentoCorredora">
							<label class="col-xs-4" translate>UI_SERIE_CHEQUERA</label>
							<bcs-combobox-base  class="col-xs-8"				    
								auto-cargar="'false'"
								tipo="data.oConfiguracionChequerasSeries.tipo"
								configuracion= "data.oConfiguracionChequerasSeries.configuracion"
								seleccionado="data.oConfiguracionChequerasSeries.seleccionado"
								id-actual="data.oConfiguracionChequerasSeries.idActual"
								filtros="data.oConfiguracionChequerasSeries.filtros"									
								item-post-filtro="'-1'">
							</bcs-combobox-base>												
						</div>

						<div class="col-xs-12"  ng-show="data.showFolioDocumentoCorredora">
							<label class="col-xs-4" translate>UI_FOLIO_DOCUMENTO</label>
							<bcs-input-texto class="col-xs-8" id="frm_FolioDocumento" 																									
								ng-model="data.FolioDocumentoCorredora"
								k-ng-disabled = "data.ShowFolioDocumentoCorredora">
							</bcs-input-texto>
						</div>
				</div>
				<!-- Fin Datos cuenta bancaria de la corredora -->
						
						
				<!-- Datos cuenta bancaria del socio origen -->
				<div class="col-xs-12" ng-show="data.showDatosCuentaBancariaSocioOrigen">												
						<div class="col-xs-12" ng-show="data.showBancoCuentaSocio">
							<label class="col-xs-4" translate>UI_BANCO</label>
							<bcs-combobox-base  
								class="col-xs-8"
								auto-cargar   = "true"									
								tipo          = "data.oConfiguracionBancoCuentaSocio.tipo"
								id-actual     = "data.oConfiguracionBancoCuentaSocio.idActual"													
								configuracion = "data.oConfiguracionBancoCuentaSocio.configuracion"
								seleccionado  = "data.oConfiguracionBancoCuentaSocio.seleccionado"							
								filtros       = "data.oConfiguracionBancoCuentaSocio.filtros"
								id-post-filtro= "data.oConfiguracionBancoCuentaSocio.idPostFiltro">
							</bcs-combobox-base>
						</div>

						<div class="col-xs-12" ng-show="data.showNumeroCuentaSocio">
							<label class="col-xs-4" translate>UI_NUMERO_CUENTA</label>
							<bcs-input-texto class="col-xs-8" name="uNumeroCuentaSocio" ng-model="data.NumeroCuentaSocio"></bcs-input-texto>																	
						</div>

					 	<div class="col-xs-12" ng-show="data.showFechaDocumentoSocio">
							<label class="col-xs-4" translate>UI_FECHA_DOCUMENTO</label>
							<bcs-input-date class="col-xs-4" name="uFechaDocumentoSocio" configuracion="data.FechaDocumentoSocioOptions" after-render="missionCompled" k-ng-model="data.kngFechaDocumentoSocio"></bcs-input-date>																	
						</div>										

						<div class="col-xs-12" ng-show="data.showSerieDocumentoSocio">
							<label class="col-xs-4" translate>UI_SERIE_CHEQUERA</label>
							<bcs-input-texto class="col-xs-8" name="uSerieDocumentoSocio" ng-model="data.SerieDocumentoSocio"></bcs-input-texto>																	
						</div>
					
						<div class="col-xs-12" ng-show="data.showFolioDocumentoSocio">
							<label class="col-xs-4" translate>UI_FOLIO_DOCUMENTO</label>
							<bcs-input-numero class="col-xs-8" decimales = "0" k-ng-model="data.FolioDocumentoSocio"></bcs-input-numero>
						</div>
				</div>
				<!-- Fin Datos cuenta bancaria socio origen -->
			</div>
			<!-- FIN "ORIGEN" FORMA DE PAGO -->

			<!-- INICIO "DESTINO" FORMA DE PAGO -->							                      
			<div class="col-xs-6" style="padding-left: 15px;" ng-show="data.showDatosDestino">
				<!-- Datos cuenta bancaria de la corredora (cuando es ingreso y destinatario corredora)-->
				<div class="col-xs-12" ng-show="data.showDatosCuentaBancariaCorredoraDestino">
						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_CUENTAS_BANCARIAS</label>
							<bcs-combobox-base class="col-xs-8"
								bcs-requerido="data.oConfiguracionCuentaBancoCorredora.requerido"
								tipo="data.oConfiguracionCuentaBancoCorredora.tipo" 
								configuracion= "data.oConfiguracionCuentaBancoCorredora.configuracion" 				
								seleccionado="data.oConfiguracionCuentaBancoCorredora.seleccionado"
								filtros="data.oConfiguracionCuentaBancoCorredora.filtros" 
								id-actual="data.oConfiguracionCuentaBancoCorredora.idActual">
							</bcs-combobox-base>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_TIPO_CUENTA_BANCARIA</label>									
							<bcs-input-texto class="col-xs-8" name="uTipoCuentaCorredora" ng-model="data.TipoCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_BANCO</label>									
							<bcs-input-texto class="col-xs-8" name="uBancoCuentaCorredora" ng-model="data.BancoCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_NUMERO_CUENTA</label>									
							<bcs-input-texto class="col-xs-8" name="uNumeroCuentaCorredora" ng-model="data.NumeroCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>																	
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_MONEDA</label>									
							<bcs-input-texto class="col-xs-8" name="uMonedaCuentaCorredora" ng-model="data.MonedaCuentaCorredora" k-ng-disabled="'true'"></bcs-input-texto>
						</div>										
				</div>
				<!-- Fin Datos cuenta bancaria de la corredora -->

				<!-- Datos cuenta bancaria del socio de negocio -->
				<div class="col-xs-12" ng-show="data.showDatosCuentaBancariaSocioDestino">
						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_CUENTAS_BANCARIAS</label>
							<bcs-combobox-base class="col-xs-8"
								auto-cargar		= "true"
								bcs-requerido	= "false"
								tipo			="data.oConfiguracionCuentaBancoSocioNegocio.tipo" 
								configuracion	="data.oConfiguracionCuentaBancoSocioNegocio.configuracion" 				
								seleccionado	="data.oConfiguracionCuentaBancoSocioNegocio.seleccionado"
								filtros			="data.oConfiguracionCuentaBancoSocioNegocio.filtros" 
								id-actual		="data.oConfiguracionCuentaBancoSocioNegocio.idActual"
								usa-filtros-completos = "'S'"
								id-post-filtro  = "data.oConfiguracionCuentaBancoSocioNegocio.idPostFiltro"
								>
							</bcs-combobox-base>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_TIPO_CUENTA_BANCARIA</label>									
							<bcs-input-texto class="col-xs-8" name="uTipoCuentaSocio" ng-model="data.TipoCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_BANCO</label>									
							<bcs-input-texto class="col-xs-8" name="uBancoCuentaSocio" ng-model="data.BancoCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_NUMERO_CUENTA</label>									
							<bcs-input-texto class="col-xs-8" name="uNumeroCuentaSocio" ng-model="data.NumeroCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>																	
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_MONEDA</label>									
							<bcs-input-texto class="col-xs-8" name="uMonedaCuentaSocio" ng-model="data.MonedaCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>
						</div>
				</div>
				<!-- Fin Datos cuenta bancaria de la corredora -->								

				<!-- Datos de la caja -->
				<div class="col-xs-12" ng-show="data.showDatosCaja">
						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_CAJA</label>									
							<bcs-input-texto class="col-xs-8" name="uNombreCaja" ng-model="data.NombreCaja" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_CODIGO</label>									
							<bcs-input-texto class="col-xs-8" name="uCodigoCaja" ng-model="data.CodigoCaja" k-ng-disabled="'true'"></bcs-input-texto>
						</div>

						<div class="col-xs-12">
							<label class="col-xs-4" translate>UI_MONEDA</label>									
							<bcs-input-texto class="col-xs-8" name="uMonedaCaja" ng-model="data.MonedaCaja" k-ng-disabled="'true'"></bcs-input-texto>
						</div>										
				</div>
				<!-- Fin Datos de la caja -->						
			</div>	 
			<!-- FIN "DESTINO" FORMA DE PAGO -->


			<!-- INICIO "CONFIGURACION" FORMA DE PAGO -->
			<div class="col-xs-6" style="padding-left: 15px" ng-show="data.showConfiguracionPartida">
				<div class="col-xs-12">
					<div class="col-xs-6">
						<input type="checkbox" ng-model="data.GeneraNomina" >							
						<label translate>UI_INCLUYE_NOMINA</label>
					</div>	
					<div class="col-xs-6">
						<input type="checkbox" ng-model="data.GeneraTransferencia">
						<label translate>UI_GENERA_TRANSFERENCIA</label>
					</div>									
				</div>
				<div class="col-xs-12">
					<div class="col-xs-6" ng-show="data.showUsaTalonarioCheque">
						<input type="checkbox" ng-model="data.UsaTalonarioCheque">						
						<label translate>UI_USA_TALONARIO_CHEQUE</label>
					</div>								
				</div>
			</div>
			<!-- FIN "CONFIGURACION" FORMA DE PAGO -->
		</div>
		
	</div>
	<!-- FIN ORIGEN / DESTINO-->	
</div>

<div class="col-xs-12" ng-controller="EditarIngresoEgresoCtrl">
<form name="frmIngresoEgreso" class="col-xs-12 form-horizontal">   
	<div class="row bcs-cuerpo">
	
		<uib-tabset>
			<!-- INICIO TAB DATOS BASICOS -->
			<uib-tab heading="{{'UI_DATOS_BASICOS' | translate}}" active="data.tabActivo.tabDatosBasicos" select="select('tabDatosBasicos')">			
				<div ng-form="forms.datosBasicos" style="height: auto">
					<div class="row">
						<label class="col-xs-4" translate>UI_TIPO_MOVIMIENTO</label>
						<bcs-combobox-base class="col-xs-8"
							bcs-requerido
							id				= "frmIngresoEgreso_TipoMovimiento"
							tipo			= "data.oConfiguracionTipoMovimiento.tipo" 
							configuracion	= "data.oConfiguracionTipoMovimiento.configuracion" 				
							seleccionado	= "data.oConfiguracionTipoMovimiento.seleccionado"
							filtros			= "data.oConfiguracionTipoMovimiento.filtros"
							activado        = "data.oConfiguracionTipoMovimiento.activado"
							id-actual		= "data.oConfiguracionTipoMovimiento.idActual"
							id-defecto		= "data.oConfiguracionTipoMovimiento.idDefecto"
							id-post-filtro	= "data.oConfiguracionTipoMovimiento.idPostFiltro">
						</bcs-combobox-base>
					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_TRASPASO</label>

					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_TIPO_SOCIO_NEGOCIO</label>

							id				= "frmIngresoEgreso_TipoSocio"
							carga-cliente-automatico="'S'" 
							tipo			= "data.oConfiguracionTipoSocioNegocio.tipo"
							configuracion	= "data.oConfiguracionTipoSocioNegocio.configuracion" 				
							seleccionado	= "data.oConfiguracionTipoSocioNegocio.seleccionado"
							filtros			= "data.oConfiguracionTipoSocioNegocio.filtros"
							activado        = "data.oConfiguracionTipoSocioNegocio.activado"
							id-defecto		= "data.oConfiguracionTipoSocioNegocio.IdDefecto"

							id-post-filtro	= "data.oConfiguracionTipoSocioNegocio.idPostFiltro">
						</bcs-combobox-base>									
					</div>

					<div class="row" ng-show="data.showIngresar">
						<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label>
						<bcs-combobox-base class="col-xs-8"
							bcs-requerido				= "data.showIngresar"
							id                			= "frmIngresoEgreso_Socio"

							carga-cliente-automatico    ="'S'" 
							tipo			  			= "'combobox-socio-negocio'"
							configuracion	  			= "data.oConfiguracionSocioNegocio.configuracion"
							seleccionado	  			= "data.oConfiguracionSocioNegocio.seleccionado"
							filtros			  			= "data.oConfiguracionSocioNegocio.filtros"
							id-actual		  			= "data.oConfiguracionSocioNegocio.idActual"

						</bcs-combobox-base>
					</div>
					<div class="row" ng-show="data.showModificar">
						<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label>
						<bcs-input-texto class="col-xs-8" id="frmIngresoEgreso_Socio"
							ng-model="data.NombresocioDeNegocio" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>
					<div class="row" ng-show="data.showIngresar" ng-if="MostrarProducto">
						<label class="col-xs-4" translate>UI_PRODUCTO</label>
						<bcs-combobox-base
							class				= "col-xs-8"
							id					= "UI_PRODUCTO"
							auto-cargar			= "'true'"
							tipo				= "'combobox-otro-producto-agrupador'"
							filtros             = "data.oProducto.filtros"

							seleccionado		= "data.oProducto.seleccionado"
							id-actual			= "data.oProducto.idActual"
							item-post-filtro    = "'1'">
						</bcs-combobox-base >
					</div>
					<div class="row" ng-show="data.showIngresar" ng-if="!MostrarProducto">
						<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-8"							
							id					= "frmIngresoEgreso_PortafolioSocio"
							auto-cargar			= "{{data.oConfiguracionPortafolio.autoCargar}}"
							bcs-requerido 		= "data.showPortafolio && data.showIngresar"
							tipo				= "'combobox-portafolio'"
							configuracion		= "data.oConfiguracionPortafolio.configuracion"
							seleccionado		= "data.oConfiguracionPortafolio.seleccionado"
							filtros				= "data.oConfiguracionPortafolio.filtros"
							id-actual		  	= "data.oConfiguracionPortafolio.idActual"
							usa-filtros-completos = "'S'"
							item-post-filtro	="'1'"
							>
						</bcs-combobox-base >
					</div>
					<div class="row" ng-show="data.showIngresar" ng-if="MostrarProducto">
						<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-8"							
							id					= "frmIngresoEgreso_PortafolioSocio"
							auto-cargar			= "{{data.oConfiguracionPortafolio.autoCargar}}"
							bcs-requerido 		= "data.showPortafolio && data.showIngresar"
							tipo				= "'combobox-portafolio'"
							activado			= "data.oConfiguracionPortafolio.activado"
							configuracion		= "data.oConfiguracionPortafolio.configuracion"
							seleccionado		= "data.oConfiguracionPortafolio.seleccionado"
							filtros				= "data.oConfiguracionPortafolio.filtrosAPV"
							id-actual		  	= "data.oConfiguracionPortafolio.idActual"
							id-defecto			= "data.oConfiguracionPortafolio.idDefecto"
							activado            = "data.oConfiguracionPortafolio.activado"
							id-post-filtro		= "data.oConfiguracionPortafolio.idPostFiltro"
							usa-filtros-completos = "'S'"
							>
						</bcs-combobox-base >
					</div>
					<div class="row" ng-show="data.showModificar">
						<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
						<bcs-input-texto class="col-xs-8" id="frmIngresoEgreso_Portafolio"
							ng-model="data.NombePortafolio" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>

					<div class="row">
						<label class="col-xs-4" translate>UI_PAGUESE_A_LA_ORDEN</label>	 				
						<input id="frmIngresoEgreso_TitularPago" type="checkbox" ng-model="data.titularPago" ng-disabled="data.titularPagoDisabled">
					</div>

					<div class="row" ng-show="data.showIngresar">
						<label class="col-xs-4" translate>UI_PERSONA_RELACIONADA</label>
						<bcs-combobox-base class="col-xs-8"
							id						= "frmIngresoEgreso_SocioRelacionado"
							auto-cargar				= "'false'"
							tipo					= "'combobox-relacionado'" 
							activado				= "data.titularPago"
							carga-cliente-automatico= "'false'"
							id-defecto				= "data.oConfiguracionSocioNegocioRelacionado.idDefecto"

							seleccionado			= "data.oConfiguracionSocioNegocioRelacionado.seleccionado"
							filtros					= "data.oConfiguracionSocioNegocioRelacionado.filtros"																		
							configuracion			= "data.oConfiguracionSocioNegocioRelacionado.configuracion"
							id-post-filtro			= "data.oConfiguracionSocioNegocioRelacionado.idPostFiltro"
							usa-filtros-completos = "'S'">
						</bcs-combobox-base>
					</div>
					<div class="row" ng-show="data.showModificar">
						<label class="col-xs-4" translate>UI_PERSONA_RELACIONADA</label>
						<bcs-input-texto class="col-xs-8" id="frmIngresoEgreso_SocioRelacionado"
							ng-model="data.NombeSocioRelacionado" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>

					<div class="row" ng-show="data.showIngresar">

							id					= "frmIngresoEgreso_PortafolioRelacionado"
							auto-cargar			= "{{data.oConfiguracionPortafolioRelacionado.autoCargar}}"
							bcs-requerido 		= "data.showPortafolioRelacionado"
							activado			= "data.titularPago"
							tipo				= "'combobox-portafolio'"
							id-defecto			= "data.oConfiguracionPortafolioRelacionado.idDefecto"								
							configuracion		= "data.oConfiguracionPortafolioRelacionado.configuracion"
							seleccionado		= "data.oConfiguracionPortafolioRelacionado.seleccionado"
							filtros				= "data.oConfiguracionPortafolioRelacionado.filtros"									
							id-post-filtro		= "data.oConfiguracionPortafolioRelacionado.idPostFiltro"
							usa-filtros-completos = "'S'">
						</bcs-combobox-base >
					</div>
					<div class="row" ng-show="data.showModificar">
						<label class="col-xs-4" translate>UI_PORTAFOLIO_CLIENTE_RELACIONADO</label>
						<bcs-input-texto class="col-xs-8" id="frmIngresoEgreso_PortafolioRelacionado"
							ng-model="data.NombePortafolioRelacionado" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>

					<div class="row">
						<label class="col-xs-4" translate>UI_MONEDA</label>
						<bcs-combobox-base class="col-xs-8"
							bcs-requerido
							tipo			= "data.oConfiguracionMoneda.tipo"
							configuracion	= "data.oConfiguracionMoneda.configuracion" 				
							seleccionado	= "data.oConfiguracionMoneda.seleccionado"
							filtros			= "data.oConfiguracionMoneda.filtros"
							id-defecto		= "data.oConfiguracionMoneda.idDefecto"
							id-actual		= "data.oConfiguracionMoneda.idActual"

							cascada1-valor	= "'IdMoneda'"																		
							id-post-filtro	= "data.oConfiguracionMoneda.idPostFiltro">
						</bcs-combobox-base>
					</div>

					<div class="row"> 
						<label class="col-xs-4" translate>UI_CAJA</label>
						<bcs-combobox-base class="col-xs-8"
							auto-cargar			= "'false'"							
							activado			= "data.showGenerarComprobante"							
							tipo				= "data.oConfiguracionCaja.tipo" 
							configuracion		= "data.oConfiguracionCaja.configuracion" 				
							seleccionado		= "data.oConfiguracionCaja.seleccionado"
							filtros				= "data.oConfiguracionCaja.filtros" 
							id-defecto			= "data.oConfiguracionCaja.idDefecto"
							id-actual			= "data.oConfiguracionCaja.idActual"
							id-post-filtro		= "data.oConfiguracionCaja.idPostFiltro">
						</bcs-combobox-base>
					</div>

					<div class="row">
						<label class="col-xs-4" translate>UI_MONTO</label>
						<bcs-input-monetario class="col-xs-8" 
							bcs-requerido 
							bcs-mayor-que="'0'" 
							ng-model="data.monto" 
							k-ng-model="data.kngMonto" 
							simbolo="data.oConfiguracionMoneda.seleccionado.IdMoneda" 
							decimales="data.oConfiguracionMoneda.seleccionado.Decimales">
						</bcs-input-monetario>
					</div>  

					<div class="row" id="crearEditarIngresoEgresoTSfechaliquidacion">
						<label class="col-xs-4" translate>UI_FECHA_LIQUIDACION</label>					
						<bcs-input-date class="col-xs-2" bcs-requerido name="uFechaLiquidacion" configuracion="data.FechaLiquidacionOptions" after-render="missionCompled" ng-model="data.FechaLiquidacion" k-ng-model="data.kngFechaLiquidacion"></bcs-input-date>					 
						<label class="col-xs-1"  style="text-align:right; margin-right: 10px" translate>UI_SALDO_CAJA</label>
						<bcs-saldo-cta-inversion
							class			= "col-xs-3"
							uso 			= "'EGRESOS_TESORERIA'"
							id-moneda 		= "data.oConfiguracionMoneda.seleccionado.IdMoneda"
							id-portafolio 	= "data.oConfiguracionPortafolio.seleccionado.IdPortafolio"
							fecha-saldo 	= "data.kngFechaLiquidacion">
						</bcs-saldo-cta-inversion>						
					</div>

					<div class="row" ng-show="data.showIngresar">
						<label class="col-xs-4" translate>UI_CONCEPTO</label>
						<bcs-combobox-base class="col-xs-8"
							bcs-requerido	 = "data.showIngresar"
							auto-cargar		 = "false"
							tipo			 = "data.oConfiguracionConcepto.tipo" 
							configuracion	 = "data.oConfiguracionConcepto.configuracion" 				
							seleccionado	 = "data.oConfiguracionConcepto.seleccionado"
							filtros			 = "data.oConfiguracionConcepto.filtros"
							activado         = "data.oConfiguracionConcepto.activado"
							id-actual		 = "data.oConfiguracionConcepto.idActual"
							item-post-filtro = "'0'"
							id-post-filtro	 = "data.oConfiguracionConcepto.idPostFiltro">
						</bcs-combobox-base>
					</div>
					<div class="row" ng-show="data.showModificar">
						<label class="col-xs-4" translate>UI_CONCEPTO</label>
						<bcs-input-texto class="col-xs-8" id="frmIngresoEgreso_Concepto"
							ng-model="data.NombreConcepto" 
							k-ng-disabled="'true'">
						</bcs-input-texto>
					</div>

						<label class="col-xs-4" translate>UI_AGRUPAR_EN_COMPROBANTE</label>

						<label class="col-xs-4" translate>UI_SECUENCIA_AGRUPACION</label>

					<div class="row">
						<label class="col-xs-4" translate>UI_COMENTARIO</label>					
						<textarea class="col-xs-8" id="descripcion" ng-model="data.descripcion"></textarea>
					</div>


					<div class="row" ng-style="data.traspaso && data.showIngresar ? {'padding-bottom': '0px'} : {'padding-bottom': '83px'}">
						<label class="col-xs-4" translate>UI_GENERAR_COMPROBANTE_AUTOMATICAMENTE</label>					
						<input type="checkbox" id="editarIngresoEgresocomprobanteCheckbox" ng-model="data.generarComprobante">
					</div>
					
					<div class="row" ng-show="data.traspaso && data.showIngresar" style="border-top: 1px solid #c9c9c9">

							<label class="col-xs-4" style="padding-top: 2px" translate>UI_TRASPASO</label>	
						</div>

						<div class="row">
							<label class="col-xs-4" translate>UI_TIPO_SOCIO_NEGOCIO</label>

								carga-cliente-automatico="'S'"
								tipo			= "data.oConfiguracionTipoSocioNegocio.tipo"

								id-post-filtro	= "data.oConfiguracionTipoSocioNegocio.idPostFiltroTraspaso">
							</bcs-combobox-base>									
						</div>

							<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label>
							<bcs-combobox-base class="col-xs-8"

								auto-cargar		  			= "'false'"
								tipo			  			= "'combobox-socio-negocio'"
								configuracion	  			= "data.oConfiguracionSocioNegocio.configuracion"
								seleccionado	  			= "data.oConfiguracionSocioNegocio.seleccionadoTraspaso"
								filtros			  			= "data.oConfiguracionSocioNegocio.filtrosTraspaso"

								cascada1-valor				= "'IdPersona'"
								cascada1-defecto			= "-1">
							</bcs-combobox-base>
						</div>
	
						<div class="row">
							<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
							<bcs-combobox-base class="col-xs-8"							
								id					= "frmIngresoEgreso_PortafolioSocioTraspaso"
								auto-cargar			= "{{data.oConfiguracionPortafolio.autoCargar}}"

								tipo				= "'combobox-portafolio'"
								configuracion		= "data.oConfiguracionPortafolio.configuracion"
								seleccionado		= "data.oConfiguracionPortafolio.seleccionadoTraspaso"
								filtros				= "data.oConfiguracionPortafolio.filtrosTraspaso"

<div class="col-xs-12" ng-controller="GeneraArchivoCargoCtrl">
	<form name="GeneraArchivoCargo" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_TODOS</label> 
		  			<bcs-input-checkbox class="col-xs-8"
						ng-model="formData.Todos"> 
					</bcs-input-checkbox>	
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_DIA_DESCUENTO</label>
					<bcs-input-numero class="col-xs-8" 
			  			k-ng-model="formData.DiaDescuento"
			  			k-options="oConfiguracionDiaDescuento.conf"
			  			k-ng-disabled="formData.habilitarDiasDescuento"
			  			decimales="'0'">
			  		</bcs-input-numero>
				</div>
				<div>
					<label class="col-xs-4" translate>UI_FECHA</label>
					<bcs-input-date id="formData.FechaCargo" class="col-xs-8"
						k-ng-model	="formData.FechaCargo"
						k-options	="{min : $scope.SesionFechaSistema}">
					</bcs-input-date>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos alignButtonsToRight">
			<bcs-button class="col-xs-3"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_GENERAR' | translate" 
				bcs-habilitado="formData.habilitarGenerar" 
				bcs-clic="generar()">
			</bcs-button>
		</div>
</div>

<div class="row" ng-controller='BlotterPACCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label> 
			  			<bcs-combobox-base
							class				= "col-xs-6"
							id					= "UI_CLIENTE"
							auto-cargar			= "'false'"
							tipo				= "'combobox-socio-negocio'"
							seleccionado		= "filtros.socioNegocio"
							filtros				= "oSocioNegocio.filtros"
							id-actual			= "filtros.IdSocioDeNegocio">
						</bcs-combobox-base>
					</div> 
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA_APROBACION</label> 
			  			<bcs-input-date
							class				= "col-xs-6"
							id					= "UI_FECHA_APROBACION"
							k-ng-model			= "filtros.fecha"
							bcs-requerido>
						</bcs-input-date>
					</div>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button
						class					= "col-xs-12"
						bcs-tipo				= "'bcs-button-search'"
						bcs-auto-desactivar		= "false"
						bcs-texto				= "'UI_BUSCAR' | translate"
						bcs-habilitado			= "true"
						bcs-clic				= "buscar(apiGridPac,filtros)">
					</bcs-button>
				</div>
				<div class="row">
					<bcs-button
						class					= "col-xs-12"
						bcs-tipo				= "'bcs-button-secondary'"
						bcs-auto-desactivar		= "false"
						bcs-texto				= "'UI_LIMPIAR' | translate"
						bcs-habilitado			= "true"
						bcs-clic				= "limpiarFiltros()">
					</bcs-button>
				</div>
			</div>
		</div>
		
		<div class="row">
			<div class="col-xs-12">
				<bcs-grid
					id					= "grid-consulta-contratos-pac"
					configuracion		= "defaultOptions"
					fn-doble-click		= "abrirDetalle(datos.kNgModel)"
					api					= "apiGridPac"
					seleccionado		= "datos.kNgModel"
					fn-exportar-excel	= "exportarExcel">
				</bcs-grid>
			</div>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button class="col-xs-1" id="BlotterFFM_editarFFM"
				bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_EDITAR' | translate" bcs-habilitado="'true'"
				bcs-clic="ingresarMandatoPAC('EDITAR')"> </bcs-button>
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM"
				bcs-tipo="'bcs-button-anular'" bcs-auto-desactivar="false"
				bcs-texto="'UI_ANULAR' | translate" bcs-habilitado="'true'"
				bcs-clic="AnulacionContratoPAC('CER')"></bcs-button>
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_REVOCAR' | translate" bcs-habilitado="'true'"
				bcs-clic="RevocacionContratoCSC('REV')"></bcs-button>
				
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_INGRESO' | translate" bcs-habilitado="'true'"
				bcs-clic="ingresarCSC()"></bcs-button>
				
			<!-- <bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM" 
				bcs-tipo="''" bcs-auto-desactivar="false" 
				bcs-texto="'UI_IMPRIMIR_PAC' | translate" bcs-habilitado="'true'" 
				bcs-clic="formData.pagarAGF()"></bcs-button> -->
				
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM" 
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_IMPRIMIR_PAC' | translate" bcs-habilitado="'true'" 
				bcs-clic="verComprobante()"></bcs-button>
				
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_UNIVERSO' | translate" bcs-habilitado="'true'"
				bcs-clic="cargarArchivoUni(datos.kNgModel)"></bcs-button>
				
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_CARGO' | translate" bcs-habilitado="'true'"
				bcs-clic="abrirVentanaCargo()"></bcs-button>
				
			<bcs-button class="col-xs-1" id="BlotterFFM_ingresarFFM"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_RENDICION' | translate" bcs-habilitado="'true'"
				bcs-clic="cargarArchivoRen(datos.kNgModel)"></bcs-button>
		    <bcs-button class="col-xs-1" id="BlotterFFM_CartaBanco"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_CARTA_BANCO' | translate" bcs-habilitado="datos.kNgModel && datos.kNgModel.length === 1"
				bcs-clic="generarCartaBanco(datos.kNgModel)"></bcs-button>
		</div>
    </div>
</div>

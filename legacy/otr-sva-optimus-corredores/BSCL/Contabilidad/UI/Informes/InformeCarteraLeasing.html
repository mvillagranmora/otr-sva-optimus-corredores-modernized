<!-- Archivo: InterfazContable.html -->
<div class="row" ng-controller="InterfazContableCtrl as conOperacion">
    <form name="frmInterfazContable" class="col-xs-12 form-horizontal">
      <div class="row bcs-cuerpo">
        <div class="col-xs-12">
          <label class="col-xs-3" translate>UI_FECHA</label>
          <bcs-input-date class="col-xs-9"
            id="FechaConsulta"
            k-ng-model="data.kngFechaConsulta"
            k-options="data.FechaConsultaInf"
            todo-dias="'true'">
          </bcs-input-date>
        </div>
        <div class="col-xs-12">
          <div class="row">
            <label class="col-xs-3" translate>UI_CLIENTE</label>
            <bcs-combobox-base
              id="portafolioReporte"
              class="col-xs-9"
              tipo="'combobox-cliente-portafolio'"
              filtros="data.portafolioReporteFiltros"
              bcs-requerido="'true'"
              id-actual="data.portafolioReporteIdActual"
              id-defecto="data.portafolioReporteIdDefecto"
              seleccionado="data.portafolioReporteSeleccionado"
              usa-lupa="'false'">
            </bcs-combobox-base>
          </div>
        </div>
      </div>
      <div class="row"></div>
      <hr>
      <div class="col-xs-12 alignButtonsToRight">
        <bcs-button id="btnGenerarInterfazContable"
          class="col-xs-3"
          bcs-tipo="'bcs-button-input-form'"
          bcs-auto-desactivar="false"
          bcs-texto="'UI_GENERAR' | translate"
          bcs-habilitado="!!data.kngFechaConsulta && !!data.portafolioReporteSeleccionado && data.portafolioReporteSeleccionado.IdCliente > 0"
          bcs-clic="data.Generar()">
        </bcs-button>
      </div>
    </form>
  </div>

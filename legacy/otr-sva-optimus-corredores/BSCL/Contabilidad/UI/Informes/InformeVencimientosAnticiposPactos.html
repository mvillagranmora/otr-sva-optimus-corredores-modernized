<div class="row" ng-controller='InformeVencimientosAnticiposPactosCtrl as conOperacion'>
    <form name="InformeVencimientosAnticiposPactos"  class="col-xs-12 form-horizontal">
        <div class="row bcs-cuerpo">
            <div class="col-xs-12">
                <div class="row">
	                <label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date
						id="UI_FECHA_CONSULTA"
						class="col-xs-9"
                        k-ng-model="filtros.kngFechaConsulta"
						ng-blur="data.cambiarFechaMin()"
						todo-dias="true"
						bcs-requerido
					>
					</bcs-input-date>
                </div>
            </div>
        </div>
        <div class=row></div>
        <hr>
        <div class="col-xs-12 alignButtonsToRight">
            <bcs-button id="frmBuscarOperaciones"  
                class="col-xs-3" 
                bcs-tipo="'bcs-button-input-form'" 
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_GENERAR' | translate" 
                bcs-habilitado= "!!filtros.kngFechaConsulta"
                bcs-clic="data.generarInforme()">  
            </bcs-button>
        </div>
    </form>
</div>

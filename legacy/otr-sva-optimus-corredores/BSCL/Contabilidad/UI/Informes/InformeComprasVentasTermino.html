<div class="row" ng-controller='InformeComprasVentasTerminoCtrl'>
    <form name="frmInformeComprasVentasTermino"  class="col-xs-12 form-horizontal">
        <div class="row bcs-cuerpo">
            <div class="col-xs-12">
				<label class="col-xs-3" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-9" 
					id="FechaOperacion"
					k-ng-model="data.kngFechaOperacion"
					k-options = "data.FechaOperacionOpt"
					todo-dias="'true'"
                    bcs-requerido >
			   </bcs-input-date>
            </div>  
            <div class="col-xs-12">
                <div class="row">
	                <label class="col-xs-3" translate>UI_MESA</label>
					<bcs-combobox-base class="col-xs-9" id="frmMesa_SOCIO_NEGOCIO"
						tipo="data.oConfiguracionClientePortafolio.tipo"
						seleccionado="data.oConfiguracionClientePortafolio.seleccionado"
						filtros = "data.oConfiguracionClientePortafolio.filtros"
						id-defecto="data.oConfiguracionClientePortafolio.idDefecto"
						configuracion="data.oConfiguracionClientePortafolio.configuracion"
						activado= "!data.allPortafolio"				
						bcs-requerido="!data.allPortafolio">
					</bcs-combobox-base>
                </div>
            </div>
        </div>

        <div class=row></div>
        <hr>
        <div class="col-xs-12 alignButtonsToRight">
            <bcs-button id="frmBuscarOperaciones"  
                class="col-xs-3" 
                bcs-tipo="'bcs-button-input-form'" 
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_GENERAR' | translate" 
                bcs-habilitado="frmInformeComprasVentasTermino.$valid"  
                 bcs-clic="data.Generar()">  
            </bcs-button>
        </div>
    </form>
</div>

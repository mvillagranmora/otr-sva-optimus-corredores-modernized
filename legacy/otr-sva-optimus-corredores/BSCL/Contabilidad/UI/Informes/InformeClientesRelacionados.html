<div class="row" ng-controller='InformeClientesRelacionadosCtrl as conOperacion'>
    <form name="InformeClientesRelacionados" class="col-xs-12 form-horizontal">
        <div class="row bcs-cuerpo">
            <div class="col-xs-12">
                <div class="row">
                    <label class="col-xs-3" translate>UI_FECHA_DESDE</label>
                    <bcs-input-date id="UI_FECHA_DESDE" class="col-xs-9" k-ng-model="filtros.kngFechaDesde"
                        ng-blur="data.cambiarFechaMin()" todo-dias="true" bcs-requerido>
                    </bcs-input-date>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="row">
                    <label class="col-xs-3" translate>UI_FECHA_HASTA</label>
                    <bcs-input-date id="UI_FECHA_HASTA" class="col-xs-9" k-ng-model="filtros.kngFechaHasta"
                        ng-blur="data.cambiarFechaMin()" todo-dias="true" bcs-requerido>
                    </bcs-input-date>
                </div>
            </div>
        </div>
        <div class=row></div>
        <hr>
        <div class="row bcs-panel-comandos" style="padding-top: 5px !important;">
            <div class=col-xs-8>
                <bcs-button class="col-xs-6" id="GenerarInformeClienteRelacionado" bcs-tipo="'bcs-button-primary'"
                    bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate" bcs-habilitado="true"
                    bcs-clic="data.generarInforme()">
                </bcs-button>
            </div>

            <div class=col-xs-1></div>

            <div class=col-xs-3>
                <bcs-menu id="InformeClientesRelacionados_Opciones" class="col-xs-12" bcs-habilitado="'true'"
                    bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate">
                    <li id="InformeClientesRelacionados_MantenedorConceptos" ng-click="abrirMantenedorConceptos();">
                        {{'UI_MANTENEDOR_CONCEPTOS_NORMATIVOS' | translate}}</li>
                </bcs-menu>
            </div>
        </div>
    </form>
</div>

<div class="row"
	ng-controller='InformeOperacionesPactosConDetalleCtrl as conOperacion'>
	<form name="frmInformeOperacionesPactosConDetalle"
		class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date id="UI_FECHA_CONSULTA" class="col-xs-9"
						k-ng-model="filtros.kngFechaConsulta"
						ng-blur="data.cambiarFechaMin()" todo-dias="true"
						k-options="{max: data.informes.fechaSistema}" bcs-requerido>
					</bcs-input-date>
				</div>
			</div>
			<div class="col-xs-12">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_MESA</label>
					<bcs-combobox-base class="col-xs-9" id="UI_MESA"
						tipo="data.oConfiguracionMesas.tipo" auto-cargar="'true'"
						bcs-requerido seleccionado="filtros.kngMesa"
						filtros="data.oConfiguracionMesas.filtros"
						id-actual="data.oConfiguracionMesas.idActual"
						configuracion="data.oConfiguracionMesas.configuracion"
						item-post-filtro="'1'"> </bcs-combobox-base>
				</div>
			</div>

		</div>
		<div class=row></div>
		<hr>
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button id="frmBuscarOperaciones" class="col-xs-3"
				bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false"
				bcs-texto="'UI_GENERAR' | translate" bcs-habilitado="frmInformeOperacionesPactosConDetalle"
				bcs-clic="data.generarInforme()"> </bcs-button>
		</div>
	</form>
</div>

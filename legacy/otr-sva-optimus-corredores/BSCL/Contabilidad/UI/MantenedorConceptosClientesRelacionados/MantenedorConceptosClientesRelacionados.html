<div ng-controller="MantenedorConceptosClientesRelacionadosCtrl">
	<form class="row bcs-cuerpo" name="ConceptosClientesRelacionados">
		<div class="col-xs-12">
			<bcs-grid id="datosConceptosNormativos" api="data.ConfiguracionGrillaConceptosNormativosApi"
				configuracion="data.ConfiguracionGrillaConceptosNormativos"
				seleccionado="data.ConceptoNormativoSeleccionado">
			</bcs-grid>
		</div>
	</form>
	<div class="col-xs-12 alignButtonsToRight">
		<bcs-button id="ModificarConceptoClienteRelacionado" class="col-xs-3" bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-auto-desactivar="false"
			bcs-habilitado="data.ConceptoNormativoSeleccionado !== undefined"
			bcs-clic="ModificarConceptoClienteRelacionado()">
		</bcs-button>
	</div>
</div>

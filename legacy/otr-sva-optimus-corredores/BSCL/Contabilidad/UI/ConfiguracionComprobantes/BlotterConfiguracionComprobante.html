<div id="modificarPlantilla" ng-controller='BlotterConfiguracionComprobantesCtrl'>
	<div class="col-xs-12 bcs-cuerpo">
		<div class="col-xs-12">
			<div class="col-xs-6">
 				<label class="col-xs-2" translate>UI_EMPRESA</label>
				<bcs-combobox-base class="col-xs-8"
 						item-post-filtro="'2'"
						tipo="'combobox-tiempo-despacho'"
						seleccionado="conf.tiempodespacho"
						filtros = "conf.oTiempoDespacho.filtros"
 						todos="'N'" 
 						activado="true">
				</bcs-combobox-base>
			</div>
 			<div class="row"></div>
			<uib-tabset>
				 <uib-tab select="select('TiposComprobantes')" heading="{{'UI_TIPOS_COMPROBANTES' | translate}}">
					<div id="TiposComprobantes" ng-include="'../../Contabilidad/UI/ConfiguracionComprobantes/ConfiguracionComprobantes.html'"></div>
				</uib-tab>
				 <uib-tab select="select('ConfigurarAsientos')" heading="{{'UI_CONFIGURAR_ASIENTOS' | translate}}">
					<div id="ConfigurarAsientos" ng-include="'../../Contabilidad/UI/ConfiguracionComprobantes/ConfiguracionAsientos.html'"></div>
				</uib-tab>
				
			</uib-tabset>
  		</div>
	</div>

</div>

<div ng-controller="ConfiguracionTipoContabilidadCtrl">
	<form name="formConfiguracionTipoContabilidad">
	<div class="row bcs-cuerpo">
	
		<div class="row">
			<div class="col-xs-2"><label class="col-xs-10" translate>UI_NUMERO_CONTABILIDAD</label></div>
			<div class="col-xs-8"><label class="col-xs-4" style="padding-left: 5px" translate>UI_NOMBRE_TIPO_CONTABILIDAD</label></div>
			<div class="col-xs-2"><label class="col-xs-4" style="padding-left: 5px" translate>UI_NEMO</label></div>
		</div>
	
		<div class="row">
			<bcs-input-texto class="col-xs-2" id="frmConfiguracionTipoContabilidad_numeroContabilidad" k-ng-disabled="'true'"
				ng-model="inputs.numeroContabilidad"> </bcs-input-texto>			
			<bcs-input-texto class="col-xs-8" id="frmConfiguracionTipoContabilidad_nombreTipoContabilidad" style="padding-left: 5px" 
				ng-model="inputs.nombreTipoContabilidad" maxlength="50" bcs-requerido> </bcs-input-texto>			
			<bcs-input-texto class="col-xs-2" id="frmConfiguracionTipoContabilidad_nemo" style="padding-left: 5px"
				ng-model="inputs.nemo" bcs-requerido> </bcs-input-texto>				
		</div>
		
				
		<div class="row" style="padding-top: 10px;padding-bottom: 8px">
			<div class="col-xs-2">
				<div class="row"><label class="col-xs-12" translate>UI_TIPO_COMPROBANTE</label></div>
				<div class="row">
				  	<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_tipoComprobanteTraspaso" ng-model="inputs.tipoComprobante_Traspaso">
				  	<label class="col-xs-5" translate>UI_TRASPASO</label>
				</div>
			</div>
			
			<div class="col-xs-2">
				<div class="row"><label class="col-xs-12" translate>UI_TIPO_GENERACION</label></div>
				<div class="row">
				  	<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_tipoGeneracionAuto" ng-model="inputs.tipoGeneracion_Automatica">
				  	<label class="col-xs-5" translate>UI_AUTOMATICA</label>
				</div>
				<div class="row">  		
			  		<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_tipoGeneracionManual" ng-model="inputs.tipoGeneracion_Manual">
			  		<label class="col-xs-5" translate>UI_MANUAL</label>
				</div>	
			</div>
			
			<div class="col-xs-2">
				<div class="row"><label class="col-xs-12" translate>UI_REVERSA</label></div>
				<div class="row">
				  	<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_reversaSi" ng-model="inputs.reversa_Si">
				  	<label class="col-xs-5" translate>UI_SI</label>
				</div>
				<div class="row">  		
			  		<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_reversaNo" ng-model="inputs.reversa_No">
			  		<label class="col-xs-5" translate>UI_NO</label>
				</div>
			</div>
			
			<div class="col-xs-2">
				<div class="row"><label class="col-xs-12" translate>UI_AGRUPA</label></div>
				<div class="row">
				  	<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_agrupaSI" ng-model="inputs.agrupa_Si">
				  	<label class="col-xs-5" translate>UI_SI</label>					
				</div>
				<div class="row">	
			  		<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_agrupaNO" ng-model="inputs.agrupa_No">
			  		<label class="col-xs-5" translate>UI_NO</label>
				</div>	
			
			</div>
			
			<div class="col-xs-2">
				<div class="row"><label class="col-xs-12" translate>UI_FORMATO</label></div>
				<div class="row">
				  	<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_formatoDetallado" ng-model="inputs.formato_Detallado">
				  	<label class="col-xs-5" translate>UI_DETALLADO</label>
				</div>
				<div class="row"> 		
			  		<input class="col-xs-2" type="checkbox" id="frmConfiguracionTipoContabilidad_formatoResumido" ng-model="inputs.formato_Resumido">
			  		<label class="col-xs-5" translate>UI_RESUMIDO</label>
				</div>
			</div>
			
			<div class="col-xs-2">
				<div class="row"><label class="col-xs-12" translate>UI_EJERCICIO</label></div>
				<div class="row">
					<bcs-input-texto class="col-xs-12" id="frmConfiguracionTipoContabilidad_ejercicio" k-ng-disabled="'true'"  
					ng-model="inputs.ejercicio"> </bcs-input-texto>
				</div>			
			</div>
		</div>
	</div>
	</form>
		<div class="row">
			<div class="col-xs-2 pull-right">
			<bcs-button id = "frmConfiguracionTipoContabilidad_btnGrabar"
					bcs-tipo			="'bcs-button-input-form'" 
					bcs-habilitado		="formConfiguracionTipoContabilidad.$valid"
					bcs-auto-desactivar	="'false'" 
					bcs-texto			="'UI_GRABAR' | translate"   
					bcs-clic			="btnGrabar()">
				</bcs-button>			
			</div>
		</div>	
	
</div>

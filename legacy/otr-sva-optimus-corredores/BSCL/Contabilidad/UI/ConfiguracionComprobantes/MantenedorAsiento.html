<div ng-controller="MantenedorAsientoCtrl">
	<form name="formMantenedorAsiento">
	<div class="row bcs-cuerpo">
		<div class="row">
			
			<div class="col-xs-8">
				<div class="row">
					<label class="col-xs-8" translate>UI_COMPROBANTE</label> <!-- UI_TIPO_CONTABILIZACION -->
				</div>
				<div class="row">
					<bcs-input-texto class="col-xs-10" id="" 
						ng-model="inputs.nombreTipoContabilidad" k-ng-disabled="'true'"> </bcs-input-texto>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<label class="col-xs-4" translate>UI_ORDEN</label>
				</div>
				<div class="row">
					<bcs-input-texto class="col-xs-10" id=""  bcs-requerido
						ng-model="inputs.orden"> </bcs-input-texto>
				</div>
			</div>
		</div>
		<div class="row"></div>
		<div class="row">
			<div class="col-xs-2">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-12" translate>UI_NUMERO_CUENTA</label>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">	
					<bcs-combobox-base class="col-xs-12" 						 
						tipo="'combobox-cuentas-contables'"
						seleccionado="selecionadoCuentas"  						  						
 						id-actual= "data.numeroCuentas" 								 
 						id-defecto= "data.numeroCuenta" 
 						bcs-requerido
 						activado='true'>					
 					</bcs-combobox-base>
					
					  <!--   <bcs-input-texto class="col-xs-12" id="" 
						ng-model="inputs.numeroCuenta"> </bcs-input-texto> -->
					</div>
				</div>
			</div>
			<div class="col-xs-4">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-12" translate>UI_NOMBRE_CUENTA</label>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">	
					  	
					  	<!-- 
					  	<bcs-input-texto class="col-xs-12" id="" 
						ng-model="inputs.nombreCuenta" k-ng-disabled="'true'"> </bcs-input-texto>
					 	-->
					
						<bcs-combobox-base class="col-xs-12" 						 
						tipo="'combobox-cuentas-contables-nombre'"
						seleccionado="selecionadoCuentas"				  						 
 						id-actual= "data.nombreCuenta" 							 
 						id-defecto= "data.nombreCuentas" 
 						bcs-requerido
 						activado="true">
						</bcs-combobox-base>
					
					
					
					</div>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<div class="col-xs-8">
						<label class="col-xs-8" translate>UI_EJERCICIO</label>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-8">	
					  	<bcs-input-texto class="col-xs-10" id="" bcs-requerido
						ng-model="inputs.ejercicio"> </bcs-input-texto>
					</div>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-10" translate>UI_DEBE_HABER</label>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-4">	
					  	<input class="col-xs-5" type="checkbox" id="" ng-model="inputs.debe">
					  	<label class="col-xs-5" translate>UI_DEBE</label>
					</div>
				</div>
				<div class="row">
					  	<div class="col-xs-4">  		
					  		<input class="col-xs-5" type="checkbox" id="" ng-model="inputs.haber">
					  		<label class="col-xs-5" translate>UI_HABER</label>
						</div>
				</div>				
			</div>
			<div class="col-xs-2">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-2" translate>UI_FORMATO</label>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-4">	
					  	<input class="col-xs-5" type="checkbox" id="" ng-model="inputs.detallado">
					  	<label class="col-xs-5" translate>UI_DETALLADO</label>
					</div>
				</div>
				<div class="row">
					  	<div class="col-xs-4">  		
					  		<input class="col-xs-5" type="checkbox" id="" ng-model="inputs.resumido">
					  		<label class="col-xs-5" translate>UI_RESUMIDO</label>
						</div>
				</div>				
			</div>

		</div>
	 </div>
	 </form>
		<div class="row">
			<div class="col-xs-12 bcs-panel-comandos">
			<bcs-button  
					class				="col-xs-2 pull-right" 
					bcs-tipo			="'bcs-button-input-form'" 					
					bcs-auto-desactivar	="'false'" 
					bcs-texto			="'UI_GRABAR' | translate"   
					bcs-clic			="btnGrabar()"
					bcs-habilitado="formMantenedorAsiento.$valid">
				</bcs-button>
			
			</div>
		</div>
	
</div>

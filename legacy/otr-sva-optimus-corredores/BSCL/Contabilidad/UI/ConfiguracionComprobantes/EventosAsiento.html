<div id="modificarPlantilla" ng-controller='EventosAsientoCtrl'>
	<div class="col-xs-12 bcs-cuerpo">
		<div class="col-xs-12">
			<div class="row"></div>
			<div class="row">
				<div class="row">
					<div class="col-xs-12">	
					<label class="col-xs-4" translate>UI_CENTRALIZACION</label>
					<br>
					<bcs-combobox-base class="col-xs-4" 						 
						tipo="'combobox-tipo-centralizaciones'"
						seleccionado="selecionadoTipoCentralizacion"  						  						
 						id-actual= "data.tipoCentralizacion" 								 
 						id-defecto= "data.tipoCentralizaciones" 
 						filtros = "data.filtroTipoContabilidad"
 						item-post-filtro="'1'"
 						activado='true'>					
 					</bcs-combobox-base>					
				</div>
				</div>
				
				<div class="col-xs-5">
					<label class="col-xs-4" translate>UI_EVENTOS_DISPONIBLES</label>
					<br>
					<bcs-grid id="" seleccionado="grid.seleccionadoEventoDisp"						 
						configuracion="eventos.confEventosDisponibles">
					</bcs-grid>
					<div class="row"></div>
					<div class="col-xs-12 bcs-panel-comandos">
						<bcs-button  
							class	="col-xs-3 pull-right"  
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="'false'"
							bcs-texto="'UI_AGREGAR' | translate"
							bcs-habilitado="true" bcs-clic="btnGrabar(grid.seleccionadoEventoDisp)">
						</bcs-button>
					</div>
				</div>
				<div class="col-xs-2">
					<div class="row">
						<div class="col-xs-4">	
						</div>
						<div class="col-xs-4">	
						  	<input class="col-xs-6" type="checkbox" id="" ng-model="inputs.suma">
						  	<label class="col-xs-6" translate>(+)</label> 
						</div>
						<div class="col-xs-4">	
						</div>
					</div>
					<div class="row">
						<div class="col-xs-4">	
						</div>
						 <div class="col-xs-4">  		
						  	<input class="col-xs-6" type="checkbox" id="" ng-model="inputs.resta">
						  	<label class="col-xs-6" translate>(-)</label>
						</div>
						<div class="col-xs-4">	
						</div>
					</div>	
				</div>
				<div class="col-xs-5">
					<label class="col-xs-4" translate>UI_EVENTOS_ASOCIADOS</label>
					<br>
					<bcs-grid id="" seleccionado="grid.seleccionadoEventoAsoc"						 
						configuracion="eventos.confEventosAsociados">
					</bcs-grid>
					<div class="row"></div>
					<div class="col-xs-12 bcs-panel-comandos">
						<bcs-button  
							class	="col-xs-3 pull-right"  
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="'false'"
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="true" bcs-clic="btnEliminar(grid.seleccionadoEventoAsoc)">
						</bcs-button>
					</div>
				</div>
			</div>
			<div class="row">
				
			</div>
		</div>
	</div>
</div>

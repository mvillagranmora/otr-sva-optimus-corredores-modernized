<div id="modificarPlantilla" ng-controller='CentralizacionesRequeridasCtrl'>
	<div class="col-xs-12 bcs-cuerpo">
		<div class="col-xs-12">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_NUMERO_CONTABILIDAD</label>
					<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
						ng-model="inputs.numeroContabilidad"> </bcs-input-texto>
				</div>
				<div class="col-xs-8">
					<label class="col-xs-3" translate>UI_TIPO_CONTABILIZACION</label>
					<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
						ng-model="inputs.nombreTipoContabilidad"> </bcs-input-texto>
				</div>
			</div>
			<div class="row"></div>
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_CENTRALIZACIONES_DISPONIBLES</label>
					<br>
					<bcs-grid id="" seleccionado="grid.centralizacionDispSeleccionado"
						configuracion="centralizaciones.confListaCentralizaciones">
					</bcs-grid>
					<div class="row"></div>
					<div class="col-xs-12 bcs-panel-comandos">
						<bcs-button  
							class	="col-xs-3 pull-right"  
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="'false'"
							bcs-texto="'UI_AGREGAR' | translate"
							bcs-habilitado="true" bcs-clic="btnAgregar(grid.centralizacionDispSeleccionado)">
						</bcs-button>
					</div>
				</div>
				<div class="col-xs-1">
				</div>
				<div class="col-xs-5">
					<label class="col-xs-4" translate>UI_CENTRALIZACIONES_ASOCIADAS</label>
					<br>
					<bcs-grid id="" seleccionado="grid.centralizacionAsocSeleccionado"
						configuracion="centralizaciones.confCentralizacionesRequeridas">
					</bcs-grid>
					<div class="row"></div>
					<div class="col-xs-12 bcs-panel-comandos">
						<bcs-button  
							class	="col-xs-3 pull-right"  
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="'false'"
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="true" bcs-clic="btnEliminar(grid.centralizacionAsocSeleccionado)">
						</bcs-button>
					</div>
				</div>
			</div>
			<div class="row">
				
			</div>
		</div>
	</div>
</div>

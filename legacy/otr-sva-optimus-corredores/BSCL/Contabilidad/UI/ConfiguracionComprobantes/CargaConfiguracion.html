<div ng-controller="CargaConfiguracionContableCtrl">	
	<div class="row bcs-cuerpo" style="min-height:100px">
		<form name="formGenerarInforme" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-2" translate>UI_TIPO_CARGA</label>
				<bcs-combobox-base class="col-xs-10"
				    item-post-filtro="'1'"
		  			tipo="'combobox-tipo-carga-conf-con'"
		  			id-actual="tipoCarga.Codigo"
		  			filtros="tipoCarga.filtrosCarga"
		  			seleccionado="tipoCarga.seleccionado"
		  			bcs-requerido
		  			todos="'N'">
		  		</bcs-combobox-base>
			</div>
			<div class="row" >
				<label class="col-xs-2" translate>UI_FORMATO</label>
				<label class="col-xs-10" style = "font-style: italic; word-wrap: break-word;">{{formatoCarga}}</label>
			</div>
			<div class="row" >
				<label class="col-xs-2" translate>UI_EJEMPLO_LINEA</label>
				<label class="col-xs-10" style = "font-style: italic; word-wrap: break-word;">{{ejemploCarga}}</label>
			</div>
			<br/>
			<hr/>
			<div class="row">
				<bcs-button class="col-xs-2 pull-right" 
					bcs-habilitado="'true'" 
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CARGAR_ARCHIVO' | translate" 
					bcs-clic="cargarArchivo()">
				</bcs-button>
			</div>
		</form>
	</div>
	
</div>

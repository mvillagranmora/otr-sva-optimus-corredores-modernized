<div id="modificarPlantilla" ng-controller='ConfiguracionGlosaCtrl'>
	<form name="formConfiguracionGlosa">
	<div class="col-xs-12 bcs-cuerpo">
		<div class="col-xs-12">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-6" translate>UI_NUMERO_CONTABILIDAD</label>
					<bcs-input-texto class="col-xs-6" k-ng-disabled="'true'"
						ng-model="inputs.numeroContabilidad"> </bcs-input-texto>
				</div>
				<div class="col-xs-8">
					<label class="col-xs-3" style="padding-right: 50px" translate>UI_COMPROBANTE</label>
					<bcs-input-texto class="col-xs-9" k-ng-disabled="'true'"
						ng-model="inputs.nombreTipoContabilidad"> </bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-5">
					<label class="col-xs-4" translate>UI_CAMPOSGLOSAS_DISPONIBLES</label>
					<br>
					<bcs-grid id="glosasDisponibles" seleccionado="grid.seleccionadoGlosaDisp"
						 
						configuracion="eventos.confGlosasDisponibles">
					</bcs-grid>
					<div class="row"></div>
					<div class="col-xs-12 bcs-panel-comandos">
						<bcs-button  
							class	="col-xs-3 pull-right"  
							bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="'false'"
							bcs-texto="'UI_AGREGAR' | translate"
							bcs-habilitado="formConfiguracionGlosa.$valid" 
							bcs-clic="btnGrabar(grid.seleccionadoGlosaDisp)">
						</bcs-button>
					</div>
				</div>
				<div class="col-xs-2">
					<div class="col-xs-8">
						<div class="row">
					<label class="col-xs-8">Orden</label>
					</div>
					<div class="row">
					<bcs-input-texto class="col-xs-10" id="" 
						ng-model="inputs.numeroOrden" bcs-requerido> </bcs-input-texto>
					</div>
					<div class="row">
						<input class="col-xs-6" type="checkbox" id="" ng-model="inputs.todosAsientos">
						<label class="col-xs-6" translate>UI_ASIGNAR_TODAS_LINEAS_ASIENTOS</label>
					</div>
			</div>
					<div class="row">
						<div class="col-xs-4">	
				 
						</div>
						 
						<div class="col-xs-4">	
					 
						</div>
					</div>	
				</div>
				<div class="col-xs-5">
					<label class="col-xs-4" translate>UI_CAMPOSGLOSAS_ASOCIADAS</label>
					<br>
					 
					<bcs-grid id="" seleccionado="grid.seleccionadoEventoAsoc"						 
						configuracion="eventos.confGlosaAsociados">
					</bcs-grid>
					
					<div class="row"></div>
					<div class="col-xs-12 bcs-panel-comandos">
						<bcs-button  
							class	="col-xs-3 pull-right"  
							bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="'false'"
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="true" bcs-clic="btnEliminar(grid.seleccionadoEventoAsoc)">
						</bcs-button>
					</div>
				</div>
			</div>
			<div class="row">
				
			</div>
		</div>
	</div>
	</form>
</div>

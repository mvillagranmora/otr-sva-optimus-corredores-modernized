<div id="CuadraturaDiariaOperaciones" ng-controller="CuadraturaDiariaCONCtrl">
	<div class="row">
		<div class="col-xs-5 k-window-subtitle" style="font-size:12px;" translate>
			UI_RESUMEN
		</div>
		<div class="row bcs-panel-comandos">
			<div class="col-xs-10">
				<label class="col-xs-2" translate>UI_FECHA_CUADRATURA</label>
				<bcs-input-date
					class="col-xs-9"
					k-options = "kOptFechaCuadratura"
					k-ng-model = "data.fechaCuadratura">
				</bcs-input-date>
			</div>
			<div class="col-xs-2">
				<bcs-button id="CuadraturaDiariaOperaciones_ConsultarCuadraturaCON"  class="col-xs-3 pull-right customBtnCuadraturaFac" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_CONSULTAR_RESUMEN' | translate" bcs-habilitado="'true'"  bcs-clic="consultarResumen()"></bcs-button>
		   </div>

		</div>	
	</div>
	<div class="row">
		<bcs-grid 
			id				= "grid-cuadraturas"
	 		configuracion	= "confBasicaCuadraturas"
			seleccionado	= "seleccionCuadraturas"
			fn-click 		= ConsultaUltimoDetalle(seleccionCuadraturas);>
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id="CuadraturaCierreDiarioCON_Aprobar" 	 class="col-xs-3" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_APROBAR' | translate" bcs-habilitado="'true'"  bcs-clic="Aprobar()"></bcs-button>
	 	<bcs-button id="CuadraturaCierreDiarioCON_Cuadratura"  class="col-xs-3" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_CUADRAR' | translate" bcs-habilitado="'true'"  bcs-clic="Cuadratura()"></bcs-button>
	</div>	
	<div class="row">
		<div class="col-xs-5 k-window-subtitle" style="font-size:12px;" translate>
			UI_DETALLE_CUADRATURA
		</div>
	</div>
	<div class="row">
		<bcs-grid 
			id					= "grid-resultado-centralizaciones"
			fn-exportar-excel	= "exportarExcelCentralizaciones"
			ng-show				="data.showCentralizaciones"
			configuracion 		= "confBasicaCentralizaciones"
			seleccionado 		= "seleccion">
		</bcs-grid>
		<bcs-grid 
			id					= "grid-resultado-comprobantes"
			fn-exportar-excel	= "exportarExcelComprobantes"
			ng-show				= "data.showComprobantes"
			configuracion 		= "confBasicaComprobantes"
			seleccionado 		= "seleccion">
		</bcs-grid>						
	</div>
 	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-2"></div>
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

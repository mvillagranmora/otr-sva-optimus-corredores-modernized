<div id="CuentasContablesBasilea" class="col-xs-12" ng-controller="CuentasContablesBasileaCtrl as cCCB">
    <div class="bcs-cuerpo">
        <div class="row">
            <div class="col-xs-10">
                <div class="row">
                    <div class="col-xs-7">
                        <label translate class="col-xs-3">UI_PRODUCTO</label>
                        <bcs-combobox-base
                            class="col-xs-9"
                            tipo="'combobox-producto-basilea'"
                            todos="'S'"
                            id-actual="cCCB.idActual"
                            id-defecto="' TODOS'"
                            seleccionado="cCCB.seleccionado">
                        </bcs-combobox-base>
                    </div>
                </div>
            </div>
            <div class="col-xs-2">
                <div class="row">
                    <bcs-button class="col-xs-12" id="cuentasBasilea_BUSCAR" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarCuentasBasilea()"></bcs-button>
                </div>
                <div class="row">
                    <bcs-button class="col-xs-12" id="cuentasBasilea_LIMPIAR" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltro()"></bcs-button>
                </div>
            </div>
        </div>
        <div class="row">
            <hr>
            <bcs-grid 
                configuracion="grid.confCuentasContablesBasilea" 
                seleccionado="grid.cuentaSeleccionada"
                fn-doble-click="EditarCuenta(grid.cuentaSeleccionada)">
            </bcs-grid>
        </div>
        <hr>
        <div class="row bcs-panel-comandos alignButtonsToRight">
            <bcs-button id="cuentasContablesBasilea_CANCELAR" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'"  bcs-clic="cancelar()"></bcs-button>
        </div>	
    </div>
</div>

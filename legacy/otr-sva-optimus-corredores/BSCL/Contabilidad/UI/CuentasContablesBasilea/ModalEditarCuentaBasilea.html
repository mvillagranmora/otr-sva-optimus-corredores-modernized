<div id="ModalEditarCuentaBasilea" class="col-xs-12" ng-controller="ModalEditarCuentaBasileaCtrl as cECCB">
    <div class="bcs-cuerpo" style="align-items: center;display: flex;justify-content: center;">
        <form class="filters-formulario row col-xs-11" name="formEditarCuentaContableBasilea" style="margin-top: 25px;">
            <div class="row col-xs-11">
                <label translate class="col-xs-4">UI_CONCEPTO_INFORMADO</label>
                <bcs-input-texto
                    class			= "col-xs-8"
                    ng-model		= "cECCB.parametros.Concepto"
                    k-ng-disabled	= "true">
                </bcs-input-texto>
            </div>
            <div class="row col-xs-11">
                <label translate class="col-xs-4">UI_TIPO_CUENTA_CONTABLE</label>
                <bcs-input-texto
                    class			= "col-xs-8"
                    ng-model		= "cECCB.parametros.TipoCuentaContable"
                    k-ng-disabled	= "true">
                </bcs-input-texto>
            </div>
            <div class="row col-xs-11" >
                <label translate class="col-xs-4">UI_NUMERO_CUENTA_CONTABLE</label>
                    <bcs-combobox-base class="col-xs-8" 						 
						tipo="'combobox-cuentas-contables'"
						seleccionado="selecionadoCuentas"  						  						
 						id-actual= "data.numeroCuentas" 								 
 						id-defecto= "data.numeroCuenta" 
 						bcs-requerido
 						activado='true'>					
 					</bcs-combobox-base>
            </div>
            <div class="row col-xs-11">
                <label translate class="col-xs-4">UI_NOMBRE_CUENTA_CONTABLE</label>
                <bcs-input-texto
                    class			= "col-xs-8"
                    ng-model		= "cECCB.parametros.NombreCuentaContable"
                    k-ng-disabled	= "true">
                </bcs-input-texto>
            </div>

            <div class="row col-xs-11 bcs-panel-comandos alignButtonsToRight" style="margin-top: 25px; ">
                <div class="col-xs-3" >
                    <bcs-button bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="true" bcs-texto="'UI_GUARDAR' | translate"
                        bcs-habilitado="formEditarCuentaContableBasilea.$valid" bcs-clic="guardar()"></bcs-button>
                </div>
                <div class="col-xs-3" >
                    <bcs-button bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
                        bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
                </div>
            </div>
        </form>
    </div>
</div>

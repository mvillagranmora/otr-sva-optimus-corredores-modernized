<div class="col-xs-12" ng-controller="AdministrarCentroCostoCtrl as admCentroCosto">
	<div class="row bcs-cuerpo">
		<form id="FormAdministrarCentroCostoCtrl" name="FormAdministrarCentroCostoCtrl" class="filters-formulario">
		    <div class="row">
     			<div class="row">
       				<bcs-grid 
       					id				="grilla-CentroCosto" 
						configuracion	="grillaAdministraCentroCosto" 
						seleccionado	="admCentroCosto.selGrillaCentroCosto"
						fn-exportar-excel = "exportarExcel">
					</bcs-grid>
				</div>
				<div class="row col-xs-12 bcs-panel-comandos">
					<div class="row">
						<div class="col-xs-8">
							<bcs-button
								id="AdministrarCentroCosto_crear"  
								class				="col-xs-2" 
								bcs-tipo			="'bcs-button-primary'" 		
								bcs-auto-desactivar	="false" 
								bcs-habilitado		="'true'"
								bcs-texto			="'UI_CREAR' | translate" 	 
								bcs-clic			="admCentroCosto.win.administrarCentroCosto();">	
							</bcs-button>
							<bcs-button
								id="AdministrarCentroCosto_editar"    
								class				="col-xs-2" 
								bcs-tipo			="'bcs-button-secondary'"  	
								bcs-auto-desactivar	="false" 
								bcs-texto			="'UI_EDITAR' | translate" 
								bcs-habilitado		="admCentroCosto.selGrillaCentroCosto.ProductoConcepto"  
								bcs-clic			="admCentroCosto.win.editarCentroCosto(admCentroCosto.selGrillaCentroCosto);">	
							 </bcs-button>	
						</div>
						<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
							<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
						</bcs-menu>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>

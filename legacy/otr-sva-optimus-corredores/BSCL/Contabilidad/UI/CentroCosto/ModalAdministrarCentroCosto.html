<div class="row" ng-controller="ModalAdministrarCentroCostoCtrl as madmCentroCosto">
	<div class="row">
		<form name="ModalAgregarCentroCostoDetalle" class="col-xs-12">


			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_PRODUCTO</label>
		  				<bcs-combobox-base
							class="col-xs-8" 
							
							id="ComboProducto"
							k-ng-disabled=	"'true'"
							tipo="'combobox-tipo-producto-plantilla-producto'"				
							filtros="admCentroCosto.cmbbx.IdProductoConcepto.filtros"
							id-actual="madmCentroCosto.datosDespues.IdProductoConcepto"						
							id-defecto="madmCentroCosto.datosAntes.IdProductoConcepto">
					</bcs-combobox-base>
				</div>
			</div>		

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_RELACIONADO</label>
		  				<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboRelacionado"
							tipo="'combobox-tipo-centro-costo-relacionado'"				
							filtros="madmCentroCosto.cmbbx.IdRelacionado.filtros"
							id-actual="madmCentroCosto.datosDespues.IdRelacionado"						
							id-defecto="madmCentroCosto.datosAntes.IdRelacionado">
					</bcs-combobox-base>
				</div>
			</div>		



			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_BOLSA</label>
		  				<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboBolsa"
							tipo="'combobox-bolsa'"				
							filtros="madmCentroCosto.cmbbx.IdBolsa.filtros"
							id-actual="madmCentroCosto.datosDespues.IdBolsa"						
							id-defecto="madmCentroCosto.datosAntes.IdBolsa">
					</bcs-combobox-base>
				</div>
			</div>		


			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_CENTRO</label>
		  				<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboTIPO"
							tipo="'combobox-tipo-centro-costo'"				
							filtros="madmCentroCosto.cmbbx.TipoCentro.filtros"
							id-actual="madmCentroCosto.datosDespues.TipoCentro"						
							id-defecto="madmCentroCosto.datosAntes.TipoCentro">
					</bcs-combobox-base>
				</div>
			</div>		


			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_BUSINESS</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido						
						maxlength="10"
						ng-model="madmCentroCosto.datosDespues.Business">
					</bcs-input-texto>
				</div>
			</div>										

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_VEHICULO</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						maxlength="3"
						ng-model="madmCentroCosto.datosDespues.Vehiculo">
					</bcs-input-texto>
				</div>
			</div>	


			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO</label>
		  				<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboTipoCentro"
							tipo="'combobox-tipo-centro'"				
							filtros="madmCentroCosto.cmbbx.Tipo.filtros"
							id-actual="madmCentroCosto.datosDespues.Tipo"						
							id-defecto="madmCentroCosto.datosAntes.Tipo">
					</bcs-combobox-base>
				</div>
			</div>													

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_BENEFICIO</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						maxlength="60"
						ng-model="madmCentroCosto.datosDespues.CentroBeneficio">
					</bcs-input-texto>
				</div>
			</div>	



		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAgregarCentroCostoDetalle.$valid"  
			bcs-clic="madmCentroCosto.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="madmCentroCosto.cancelar();">
		</bcs-button>
	</div>
</div>

<div id="BlotterMantenedorMetadata" class="col-xs-12" ng-controller="BlotterMantenedorMetadataCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-metadata"
			 	configuracion="defaultOptions"
				api = "apiGridMetadata"
				seleccionado="data.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-buttons">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="BlotterMantenedorMetadata_AGREGAR" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_AGREGAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="agregarMetadata()">
			</bcs-button>
			<bcs-button class="col-xs-3" id="BlotterMantenedorMetadata_AGREGAR" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EDITAR' | translate" 
				bcs-habilitado="data.kNgModel && data.kNgModel.length > 0" 
				bcs-clic="editarMetadataContabilidad(data.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-3" id="BlotterMantenedorMetadata_ELIMINAR" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ELIMINAR' | translate" 
				bcs-habilitado="data.kNgModel && data.kNgModel.length > 0" 
				bcs-clic="eliminarMetadataContabilidad(data.kNgModel)">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

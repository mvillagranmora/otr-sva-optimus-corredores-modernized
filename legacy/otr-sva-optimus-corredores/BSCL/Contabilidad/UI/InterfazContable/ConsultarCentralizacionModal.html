<div ng-controller="ConsultarCentralizacionModalCtrl">
	<div class="row bcs-cuerpo">
		 
			

		
		<div class="row">
			<new-bcs-grid id="formConsultarCentralizacion_grid-detalle"
				configuracion = "detalle.confBasicaDetalle"
				seleccionado = "detalle.selDetalle"
				fn-doble-click = "data.fnDobleClick(detalle.selDetalle)"
				fn-exportar-excel = "exportarExcel"
				api 			= "gridApi">
			</new-bcs-grid>
		</div>
		
		<bcs-menu 
				class			="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-habilitado	="'true'" 
				bcs-texto		="'UI_OPCIONES' | translate">		            
					<li ng-click	="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		

	</div>
</div>

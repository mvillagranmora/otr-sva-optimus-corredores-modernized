<div ng-controller="ConsultarPreComprobanteEnvioContabilidadCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<label class="col-xs-2 titulo" translate>UI_CABECERA</label>
		</div>
		<hr>
		<div class="row">
			<bcs-grid id="formPreComprobanteEnvioContabilidad_grid-cabecera"
				configuracion = "envioContabilidad.confBasicaCabecera"
				seleccionado = "envioContabilidad.selCabecera"
				api = "gridApiCabecera">
			</bcs-grid>
		</div>
		<div class="row">
			<label class="col-xs-2 titulo" translate>UI_DETALLE</label>
		</div>
		<hr>
		<div class="row">
			<bcs-grid id="formPreComprobanteEnvioContabilidad_grid-detalle"
				configuracion = "envioContabilidad.confBasicaDetalle"
				seleccionado = "envioContabilidad.selDetalle"
				fn-exportar-excel = "exportarExcel"
				api = "gridApiDetalle">
			</bcs-grid>
		</div>
		<div class="row">
				<div class="col-xs-7" style="padding-right: 5px">
					<bcs-button id="ConsultarPreComprobanteEnvioContabilidadCtrl_Enviar" class="row col-xs-3"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_ENVIAR' | translate" bcs-tipo="'bcs-button-primary'"
						bcs-clic="btnEnviarPreComprobantes()" bcs-habilitado="data.oDatosDetalle.Estado === 'V'"> </bcs-button>
				</div>
		
		
		<bcs-menu 
				class			="col-xs-1 pull-right row" 
				bcs-habilitado	="'true'" bcs-tipo="'bcs-button-secondary'"
				bcs-texto		="'UI_OPCIONES' | translate">		            
				<li ng-click	="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>

	</div>
</div>

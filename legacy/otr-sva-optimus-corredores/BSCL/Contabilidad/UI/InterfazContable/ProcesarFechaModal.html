<div class="row" ng-controller='ProcesarFechaCtrl'>
    <form name="formProcesarFecha"  class="col-xs-12 form-horizontal filters-formulario">
        <div class="row bcs-cuerpo">
            <div class="col-xs-12">
                <div class="row">
	                <label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date
						class="col-xs-8"
						id="UI_FECHA_OPERACION"
						ng-model="data.FechaProceso"
						k-ng-model="data.kngFechaProceso"
						todo-dias="true"
					>
					</bcs-input-date>
                </div>
            </div>
        </div>
        <div class=row></div>
        <hr>
        <div class="col-xs-12 alignButtonsToRight">
            <bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate"
					bcs-clic="procesarCentralizacionFecha()" bcs-habilitado="true"> </bcs-button>
        </div>
    </form>
</div>

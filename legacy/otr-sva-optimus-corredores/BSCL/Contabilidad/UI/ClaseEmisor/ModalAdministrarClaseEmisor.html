<div class="row" ng-controller="ModalAdministrarClaseEmisorCtrl as mAdmClaseEmisor">
	<div class="row">
		<form name="ModalAgregarClaseEmisorDetalle" class="col-xs-12">

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
		  				<bcs-combobox-base 
							class="col-xs-8" 
							bcs-requerido
							id="ComboOperacion"
							tipo="'combobox-operacion'"				
							filtros="mAdmClaseEmisor.cmbbx.TipoOperacion.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.TipoOperacion"						
							id-defecto="mAdmClaseEmisor.datosAntes.TipoOperacion"
							activado="mAdmClaseEmisor.cmbbx.TipoOperacion.activado">		
						</bcs-combobox-base>
				</div>
			</div>


			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
		  				<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboClaseInstrumento"
							tipo="'combobox-clasificacion-tipo-instrumento'"				
							filtros="mAdmClaseEmisor.cmbbx.IdClasificacionInstrumento.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdClasificacionInstrumento"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdClasificacionInstrumento"
							activado="mAdmClaseEmisor.cmbbx.IdClasificacionInstrumento.activado">
					</bcs-combobox-base>
				</div>
			</div>		

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4"  translate>UI_TIPO_BONO</label>
						<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							ng-disabled="'true'"
							id="ComboTipoBonoIRF"
							tipo="'combobox-tipo-bono-irf'"				
							filtros="mAdmClaseEmisor.cmbbx.IdTipoBonoIRF.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdTipoBonoIRF"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdTipoBonoIRF"
							activado="mAdmClaseEmisor.cmbbx.IdTipoBonoIRF.activado">								                        
	                    </bcs-combobox-base>
				</div>
			</div>

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ORIGEN_INSTRUMENTO</label>
						<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboOrigenInstrumento"
							tipo="'combobox-tipo-origen-instrumento'"				
							filtros="mAdmClaseEmisor.cmbbx.IdOrigenInstrumento.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdOrigenInstrumento"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdOrigenInstrumento"
							activado="mAdmClaseEmisor.cmbbx.IdOrigenInstrumento.activado">
						</bcs-combobox-base>
					</div>
				</div>	

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_PLAZA</label>
						<bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboPlaza"
							tipo="'combobox-tipo-plaza'"				
							filtros="mAdmClaseEmisor.cmbbx.IdPlaza.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdPlaza"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdPlaza"
							activado="mAdmClaseEmisor.cmbbx.IdPlaza.activado">
						</bcs-combobox-base>
					</div>
				</div>	

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CODIGO_IFRS</label>
                        <bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboIfrs"
							tipo="'combobox-tipo-ifrs'"				
							filtros="mAdmClaseEmisor.cmbbx.IdCodigoIFRS.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdCodigoIFRS"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdCodigoIFRS"
							activado="mAdmClaseEmisor.cmbbx.IdCodigoIFRS.activado">
	                    </bcs-combobox-base>                    	
					</div>
				</div>									


			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_RELACIONADO_GRUPO</label>
					<bcs-combobox-base
						class="col-xs-8" 
						bcs-requerido
						id="ComboRelacionadoGrupo"
						tipo="'combobox-relacion-grupo'"				
						filtros="mAdmClaseEmisor.cmbbx.IdRelacionadoGrupo.filtros"
						id-actual="mAdmClaseEmisor.datosDespues.IdRelacionadoGrupo"						
						id-defecto="mAdmClaseEmisor.datosAntes.IdRelacionadoGrupo"
						activado="mAdmClaseEmisor.cmbbx.IdRelacionadoGrupo.activado">
					</bcs-combobox-base>
				</div>
			</div>						

            <div class="row">
                  <label class="col-xs-4" translate>UI_PRESENCIA_BURSATIL</label>
                    <bcs-combobox-base
						class="col-xs-8" 
						bcs-requerido
						id="ComboPresenciaBursatil"
						tipo="'combobox-presencia-bursatil'"				
						filtros="mAdmClaseEmisor.cmbbx.IdPresenciaBursatil.filtros"
						id-actual="mAdmClaseEmisor.datosDespues.IdPresenciaBursatil"						
						id-defecto="mAdmClaseEmisor.datosAntes.IdPresenciaBursatil"
						activado="mAdmClaseEmisor.cmbbx.IdPresenciaBursatil.activado">
	                 </bcs-combobox-base>  
            </div>

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FORMADOR_MERCADO</label>
                         <bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboFormadorMercado"
							tipo="'combobox-formador-mercado'"				
							filtros="mAdmClaseEmisor.cmbbx.IdFormadorMercado.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdFormadorMercado"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdFormadorMercado"
							activado="mAdmClaseEmisor.cmbbx.IdFormadorMercado.activado">
	                    </bcs-combobox-base>                   
				</div>
			</div>						

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_PACTO_ANDINO</label>
                        <bcs-combobox-base
							class="col-xs-8" 
							bcs-requerido
							id="ComboPactoAndino"
							tipo="'combobox-pacto-andino'"				
							filtros="mAdmClaseEmisor.cmbbx.IdPactoAndino.filtros"
							id-actual="mAdmClaseEmisor.datosDespues.IdPactoAndino"						
							id-defecto="mAdmClaseEmisor.datosAntes.IdPactoAndino"
							activado="mAdmClaseEmisor.cmbbx.IdPactoAndino.activado">
	                    </bcs-combobox-base>                    	
				</div>
			</div>

			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_LARGO_PLAZO</label>
					<bcs-input-texto class="col-xs-8"
						maxlength="1"
						ng-model="mAdmClaseEmisor.datosDespues.LargoPlazo">
					</bcs-input-texto>
				</div>
			</div>										
       
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CLASE_EMISOR</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						maxlength="3"
						ng-model="mAdmClaseEmisor.datosDespues.ClaseEmisor">
					</bcs-input-texto>
				</div>
			</div>										

		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAgregarClaseEmisorDetalle.$valid"  
			bcs-clic="mAdmClaseEmisor.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mAdmClaseEmisor.cancelar();">
		</bcs-button>
	</div>
</div>

<div id="CuadraturaContabilidad" class="row" ng-controller="CuadraturaContabilidadCtrl">
	<div class="row">
		<form name="formCuadraturaContabilidad" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_PROCESO</label>
				<bcs-input-date class="col-xs-8"
					id="CuadraturaContabilidad_fechaProceso"
					bcs-requerido
					k-ng-model="filtro.FechaProceso"
					k-ng-disabled="'true'">
				</bcs-input-date>
		  	</div>
		</form>
	</div>
	<br>
	
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
			<bcs-button class="col-xs-4 pull-right"
				id="CuadraturaContabilidad_ejecutar"
				bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EJECUTAR' | translate"
				bcs-habilitado="formCuadraturaContabilidad.$valid"
				bcs-clic="fn.ejecutar()">
			</bcs-button>
		</div>
	</div>
</div>

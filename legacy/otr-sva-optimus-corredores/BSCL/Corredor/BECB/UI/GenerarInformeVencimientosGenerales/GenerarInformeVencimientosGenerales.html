<div id="GenerarInformeVencimientosGenerales" class="row" ng-controller="GenerarInformeVencimientosGeneralesCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<!-- INICIO FILTROS -->
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-6" translate>UI_FECHA_VENCIMIENTO</label>
					<bcs-input-date class="col-xs-6" 
						id="dateInformeVencimientosGenerales"
						bcs_requerido
						name="uFechaVencimiento"
						k-ng-model="data.oFechaVencimiento"
						k-ng-disabled="data.desactivarFechaVencimiento">
					</bcs-input-date>
				</div>
			</div>
			<!-- FIN FILTROS -->
			<!-- INICIO BOTONES -->
			<div class="row">
				<bcs-button 
					class="row col-xs-5 pull-right"
					id="btnGenerarInformeVencimientosGenerales"
					bcs-habilitado="true" 
					bcs-tipo="'bcs-button-primary'" 
					bcs-habilitado="'true'"
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_GENERAR_INFORME' | translate" 
					bcs-clic="data.generar();">
				</bcs-button>
			</div>
			<!-- FIN BOTONES -->
		</div>
	</div>
</div>

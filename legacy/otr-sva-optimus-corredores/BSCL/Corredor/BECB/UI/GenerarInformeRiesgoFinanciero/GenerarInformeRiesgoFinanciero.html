<div id="GenerarInformeRiesgoFinanciero" class="row" ng-controller="GenerarInformeRiesgoFinancieroCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			
			<!-- INICIO FILTROS -->
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-5">
						<label class="col-xs-4" translate>UI_FECHA</label>
						<bcs-input-date class="col-xs-7" bcs_requerido
							id="InformesRiesgoFinanciero_UI_FECHA"
							name="uFechaRifiDifi"
							k-ng-model="data.oFechaRifiDifi"
							k-ng-disabled="data.activaroFechaRifiDifi">
						</bcs-input-date>
					</div>
					<div class="col-xs-7">
						<label class="col-xs-4" translate>UI_TIPO_INFORME</label> 
						<bcs-combobox-base class="col-xs-8" 
							id="ConfiguracioRIFI_DIFI"
							bcs-requerido="'true'"  auto-cargar="'true'" 
							id-actual="filtros.IdAFP"
							tipo="data.oComboboxRifiDifi.tipo"
							seleccionado="data.oComboboxRifiDifi.seleccionado"
							configuracion="data.oComboboxRifiDifi.configuracion"
							filtros="filtrosAFP">
						</bcs-combobox-base>
					</div>
				</div>
			</div>
			
			<!-- FIN FILTROS -->
			
			<!-- INICIO BOTONES -->
			<div class="row">
				<bcs-button class="row col-xs-5 pull-right"  id="InformesRiesgoFinanciero_UI_GENERAR"
					bcs-habilitado="true" bcs-tipo="'bcs-button-primary'" bcs-habilitado="data.btnGenerar"
					bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate" 
					bcs-clic="data.generar();">
				</bcs-button>
			</div>
			<!-- FIN BOTONES -->
			
		</div>
	</div>
</div>

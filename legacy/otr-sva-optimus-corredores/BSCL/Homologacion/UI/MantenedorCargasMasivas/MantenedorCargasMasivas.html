<div class="row" ng-controller='MantenedorCargasMasivasCtrl'>
	<div class="row">
		<div class="col-xs-10">
	       <div class ="row">
              	<div class="col-xs-10"> 
					<label class="col-xs-2" translate>UI_TIPO_CARGA_MASIVA</label>
				    <bcs-combobox-base class="col-xs-6"
				  			tipo = "'combobox-tipo-carga-masiva'"
							auto-cargar="false"
							tipo="data.oConfiguracionTipoCargaTipo" 
							configuracion ="data.oConfiguracionTipoCargaConfiguracion"
							seleccionado="data.oConfiguracionTipoCargaSeleccionado"
							id-actual="data.oConfiguracionTipoCargaIdActual"							
						 	>
				     </bcs-combobox-base >
				</div>
            </div> 
			<div class="row">
              	<div class="col-xs-10"> 
					<label class="col-xs-2" translate>UI_MODO_CARGA_MASIVA</label>
				    <bcs-combobox-base class="col-xs-6"
				  			tipo = "'combobox-modo-carga-masiva'"
							auto-cargar="false"
							tipo="data.oConfiguracionModoCargaTipo" 
							configuracion ="data.oConfiguracionModoCargaConfiguracion"
							seleccionado="data.oConfiguracionModoCargaSeleccionado"
							id-actual="data.oConfiguracionModoCargaIdActual"							
						 	>
				     </bcs-combobox-base >
				</div>
               </div>
		</div>
	</div>
    <div class="row bcs-panel-comandos">
	    <div class="col-xs-2"> </div>
		<div class="col-xs-2"> </div>
		<div class="col-xs-6"> </div>
		<bcs-menu class="col-xs-2" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>  
	</div>
</div>

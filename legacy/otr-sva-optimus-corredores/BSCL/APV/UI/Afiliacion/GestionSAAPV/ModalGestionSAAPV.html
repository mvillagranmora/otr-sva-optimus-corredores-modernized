<div id="ModalGestionSAAPV" class="row" ng-controller="ModalGestionSAAPVCtrl as mgsaapv">
	<form name="formModalGestionSAAPV">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO</label>
					<bcs-input-texto
						class			= "col-xs-8"
						ng-model		= "mgsaapv.TipoDeGestion"
						k-ng-model		= "mgsaapv.kngTipoDeGestion"
						k-ng-disabled	= "true">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA</label>
					<bcs-input-date
						class			= "col-xs-8"
						k-ng-model		= "mgsaapv.Fecha"
						k-ng-disabled	= "true">
					</bcs-input-date>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_GLOSA</label>
					<bcs-combobox-base 
						class			= "col-xs-8"
						tipo			= "'combobox-glosa-apv'"
						id-actual		= "mgsaapv.GlosaIdActual"
						seleccionado	= "mgsaapv.GlosaSeleccionado"
						filtros			= "mgsaapv.GlosaFiltros.filtros"
						activado		= "true"
						bcs-requerido>
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_COMENTARIO</label>
					<bcs-input-texto
						class			= "col-xs-8"
						atributos		= "width:100%"
						ng-model		= "mgsaapv.Comentario"
						tipo-campo		= "'textarea'"
						bcs-requerido>
					</bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<hr style="margin: 10px 0px">
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button
				class				= "col-xs-3"
				id					= "UI_ACEPTAR"
				bcs-habilitado		= "mgsaapv.AceptarHabilitado"
				bcs-tipo			= "'bcs-button-primary'"
				bcs-auto-desactivar	= "false"
				bcs-texto			= "'UI_ACEPTAR' | translate"
				bcs-clic			= "mgsaapv.Aceptar()">
			</bcs-button>
			<bcs-button
				class				= "col-xs-3"
				id					= "UI_CANCELAR" 
				bcs-habilitado		= "mgsaapv.CancelarHabilitado"
				bcs-tipo			= "'bcs-button-secondary'" 
				bcs-auto-desactivar	= "false"
				bcs-texto			= "'UI_CANCELAR' | translate" 
				bcs-clic			= "mgsaapv.Cancelar()">
			</bcs-button>
		</div>
	</div>
</div>

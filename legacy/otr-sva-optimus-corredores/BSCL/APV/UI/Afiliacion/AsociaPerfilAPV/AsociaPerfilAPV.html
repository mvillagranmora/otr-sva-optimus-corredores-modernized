<div id="AsociaPerfilAPV" class="col-xs-12" ng-controller="AsociaPerfilAPVCtrl as apapv">
	<div class="col-xs-9">
	<div class="row">
		<label class="col-xs-3" translate>UI_CATEGORIA_INVERSIONISTA</label>
		<bcs-combobox-base
			class			= "col-xs-9"
			tipo			= "'combobox-categoria-inversionista'"
			bcs-requerido	="'true'"
			filtros			= "apapv.oConfiguracionCategoriaInversionista.filtros"
			id-actual		= "apapv.IdCategoriaInversionista"
			id-post-filtro	= "apapv.IdCategoriaInversionistaPost"
			seleccionado    = "apapv.CategoriaInversionistaSeleccionado"
			cascada-a		= "apapv.oConfPerfilComercial.filtros.IdCategoriaInversionista"
		    cascada-valor	= "'IdCategoriaInversionista'">
		</bcs-combobox-base>
	</div>
	<div class="row">
		<label class="col-xs-3" translate>UI_PERFIL_COMERCIAL_ABIERTO</label>
		<bcs-combobox-base 
			class			= "col-xs-9"
			tipo			= "'combobox-perfil-comercial'"
			bcs-requerido	="'true'"
			id-actual		= "apapv.IdPerfilComercialBaseOrigenAbierto"
			id-post-filtro	= "apapv.IdPerfilComercialBaseOrigenAbiertoPost"
			todos			= "'N'"
			filtros			= "apapv.oConfPerfilComercial.filtros"
			seleccionado	= "apapv.PerfilComercialAbiertoSeleccionado">
		</bcs-combobox-base>
	</div>
	<div class="row">
		<label class="col-xs-3" translate>UI_PERFIL_COMERCIAL_ACTIVO</label>
		<bcs-combobox-base 
			class			= "col-xs-9"
			tipo			= "'combobox-perfil-comercial'"
			bcs-requerido	="'true'"
			id-actual		= "apapv.IdPerfilComercialBaseOrigenActivo"
			id-post-filtro	= "apapv.IdPerfilComercialBaseOrigenActivoPost"
			todos			= "'N'"
			filtros			= "apapv.oConfPerfilComercial.filtros"
			seleccionado	= "apapv.PerfilComercialActivoSeleccionado">
		</bcs-combobox-base>
	</div>
	</div>
	<div class="col-xs-3">
		<bcs-button id="AsociaPerfilAPV_botonAsociar" 
			class="col-xs-12"
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ASOCIAR_PERFILES_APV' | translate" 
			bcs-habilitado="true" 
			bcs-clic="apapv.AsociarPerfilesAPV()">
		</bcs-button>
	</div>
	<div class="row"></div>
	<hr>
	<div class="row"></div>
	<div class="row"></div>
	<div class="row">
		<strong><div class="col-xs-4 ng-scope" translate="">UI_PERFILES_COMERCIALES_ASOCIADOS</div></strong>
		<div class="col-xs-5"></div>
		<bcs-button id="AsociaPerfilAPV_botonBuscar" 
			class="col-xs-3"
			bcs-tipo="'bcs-button-search'"
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_BUSCAR' | translate" 
			bcs-habilitado="true" 
			bcs-clic="apapv.Buscar()">
		</bcs-button>
	</div>
	<div class="row"></div>
	<div class="row">
		<bcs-grid
			id="AsociaPerfilAPV_grillaAsociaPerfil" 
			configuracion="apapv.configuracionGrillaAsociaPerfil"
		    seleccionado="apapv.seleccionadoAsociaPerfil">
		</bcs-grid>
	</div>
</div>

<div id="PanelEmpleadoContrato" class="row" ng-controller="PanelEmpleadoContratoTraspasoCtrl as petrasp">
	<div class="row">
		<form name="formPanelEmpleadoContrato" class="col-xs-12 ng-pristine ng-valid ng-valid-bcs-required">	
<!--  -->
			<div class="row">
				<strong> <div class="col-xs-12 ng-scope" translate="">UI_TIPO_TRABAJADOR</div></strong>
			</div>
			<hr>
			<div class="row">
				<div class="col-xs-3">
				   	<label class="col-xs-4 ng-scope" translate="">UI_MEDIO_RECAUDACION</label>
					<bcs-combobox-base 
						id				= "UI_MEDIO_RECAUDACION"
						class			= "col-xs-7"
						bcs-requerido
						cache			= "true"
						id-actual 		= "petrasp.MedioRecaudacionTrabajadorIdActual"
						id-post-filtro	= "petrasp.MedioRecaudacionTrabajadorIdActualPostFiltro"
						tipo			= "'combobox-forma-pago-indirecta'"
						seleccionado	= "petrasp.IdMedioRecaudacionTrabajador"
						>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
      				<label class="col-xs-4 ng-scope" translate="">UI_ENTIDAD_RECAUDADORA</label>
					<bcs-combobox-base 
						id				= "UI_ENTIDAD_RECAUDADORA"
						class			= "col-xs-7"
						bcs-requerido	= "petrasp.IdentidadRecaudadoraRequerido"
						cache			= "true"
						id-actual 		= "petrasp.IdentidadRecaudadoraIdActual"
						id-post-filtro	= "petrasp.IdentidadRecaudadoraIdActualPostFiltro"
						tipo			= "'combobox-entidad-recaudadora'"
						filtros			= "petrasp.filtroEntidadRecaudadora.IdTipoEntidadRecaudadora"
						seleccionado	= "petrasp.entidadRecaudadora"
						activado		= "petrasp.entidadRecaudadoraDeshabilitado">
					</bcs-combobox-base>    			
				</div>
				<div class="col-xs-2">
      				<label class="col-xs-4 ng-scope" translate="">UI_PENSIONADO</label>
					<bcs-combobox-base 
						id				= "UI_PENSIONADO"
						class			= "col-xs-7"
						bcs-requerido
						cache			= "true"
						id-actual 		= "petrasp.PensionadoIdActual"
						id-post-filtro	= "petrasp.PensionadoIdActualPostFiltro"
						tipo			= "'combobox-pensionado'"
						seleccionado	= "petrasp.pensionadoSeleccion">
					</bcs-combobox-base>
    			</div>
    			<div class="col-xs-3">
      				<label class="col-xs-4 ng-scope" translate="">UI_TRABAJADOR</label>

						id				= "UI_TRABAJADOR"
						class			= "col-xs-7"
						bcs-requerido
						cache			= "true"				
						id-actual 		= "petrasp.TrabajadorIdActual"
						id-post-filtro	= "petrasp.TrabajadorIdActualPostFiltro"
						tipo			= "'combobox-trabajador-saapv'"
						seleccionado	= "petrasp.trabajadorSeleccion">
					</bcs-combobox-base>
    			</div>
			</div>

			<div class="row">
    			<strong> <div class="col-xs-4 ng-scope" translate="">UI_IDENTIFICACION_EMPLEADOR</div></strong>
    		</div>
    		<hr>
    		<div class="row">
				<div class="col-xs-6">
			  		<label class="col-xs-2" translate>UI_EMPLEADOR</label>
					<bcs-combobox-base 
						id				= "UI_EMPLEADOR"
						class			= "col-xs-9"
					 	auto-cargar		= "'false'"
					    tipo			= "'combobox-socio-negocio'"
					    seleccionado	= "petrasp.datosForm.SocioNegocioSeleccionadoEmp"
					    filtros			= "petrasp.datosForm.SocioNegocioEmp"
						cascada-a		= "petrasp.ConfiguracionCmboEmp.Portafolio.filtros.IdCliente"
						cascada-valor	= "'IdCliente'"
	                    cascada-defecto	= "'-1'"
	                    id-actual		= "petrasp.datosForm.SocioNegocioidActualEmp"   
	                    activado		= "csaapv.parametrosEntrada.modoVentana === 'M' ? false : true">
					</bcs-combobox-base>
				</div>	
				<div class="col-xs-3">
					<label class="col-xs-6 ng-scope" translate="">UI_DOCUMENTO_IDENTIDAD</label>
					<bcs-input-texto 
						class			= "col-xs-6"
						bcs-requerido	= "petrasp.DocumentoIdentidadEmpleadorRequerido"
						ng-model		= "petrasp.DocumentoIdentidadEmpleador"
						k-ng-disabled	= "petrasp.datosForm.DoctoIdentidadEmpDeshabilitado"
						place-holder	= "petrasp.documentoIdentidadPlaceHolder"
						ng-blur			= "csaapv.ValidaDocumentoIdentidad('R','EMP')">
					</bcs-input-texto>
				</div>
			</div>
    		<div class="row">
    			<div class="col-xs-6">
	    			<label class="col-xs-2 ng-scope" translate="">UI_RAZON_SOCIAL</label>
					<bcs-input-texto 
						class			= "col-xs-9"
						bcs-requerido	= "petrasp.RazonSocialRequerido"
						ng-model		= "petrasp.RazonSocial"
						k-ng-disabled	= "petrasp.datosForm.RazonSocialDeshabilitado">
					</bcs-input-texto>
	    		</div>
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_COMUNA</label>
					<bcs-combobox-base 
						id				="UI_COMUNA"
						class			= "col-xs-9"
						cache			= "false"
						bcs-requerido	= "petrasp.ComunaEmpleadorRequerido"
						id-actual 		= "petrasp.ComunaEmpleadorIdActual"
						id-post-filtro	= "petrasp.idComunaEmpleadorPostFiltro"
						tipo			= "'combobox-division-pais'"
						seleccionado	= "petrasp.comunaEmpleadorSeleccionada"
						activado		= "petrasp.datosForm.ComunaEmpDeshabilitado">
					</bcs-combobox-base>
				</div>
    		</div>

						k-ng-disabled	= "petrasp.datosForm.CiudadEmpDeshabilitado">
					</bcs-input-texto>
    			</div>
				<div class="col-xs-6">
					<label class="col-xs-3 ng-scope" translate="">UI_DIRECCION_COMERCIAL</label>

						k-ng-disabled	= "petrasp.datosForm.DirComercialEmpDeshabilitado">
					</bcs-input-texto>
    			</div>

			<div class="row">
				<div class="col-xs-6">
				<label class="col-xs-2 ng-scope" translate="">UI_NOMBRES</label>

						class			= "col-xs-9"
						ng-model		= "petrasp.NombreEncargado"
						k-ng-disabled	= "petrasp.datosForm.nomEncDeshabilitado">
					</bcs-input-texto>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-2 ng-scope" translate="">UI_EMAIL</label>

						class			= "col-xs-9"
						ng-model		= "petrasp.EmailEncargado"
						ng-blur			= "petrasp.validaFormatoEmail('ENC')"
						placeholder     = "SesionValoresDefectoSistema.PLACEHOLDER_EMAIL"
						k-ng-disabled	= "petrasp.datosForm.emailEncDeshabilitado">
					</bcs-input-texto>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4 ng-scope" translate="">UI_TELEFONO</label>
					<bcs-input-texto 
						class			= "col-xs-8"
						ng-model		= "petrasp.TelefonoEncargado"
						placeholder	    = "csaapv.placeholderTelefono"

						k-ng-disabled	= "petrasp.datosForm.telEncEncDeshabilitado">
					</bcs-input-texto>
				</div>	
			</div>
			<br>
			<div class="row">
    			<div class="col-xs-offset-10 col-xs-2">

						bcs-clic			= "petrasp.limpiarEmpleador()">
					</bcs-button>
				</div>
				</div>

<div id="PanelPortafolioContratoTraspaso" class="row" ng-controller="PanelPortafolioContratoTraspasoCtrl as ptrasp">
	<div class="row">
		<form name="formPanelPortafolioContrato" class="col-xs-12 ng-pristine ng-valid ng-valid-bcs-required">	
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-5" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'" translate="">UI_ENTIDAD_RECAUDADORA_DESTINO</label>
					<label class="col-xs-5" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo !== 'EGR'" translate="">UI_ENTIDAD_RECAUDADORA_ORIGEN</label>
					<bcs-combobox-base 
					    bcs-requerido 
						id				= "UI_ENTIDAD_RECAUDADORA"
						class			= "col-xs-6"
						id-actual 		= "ptrasp.EntidadRecaudadora.idActual"
						id-defecto      = "ptrasp.EntidadRecaudadoraIdActualDefecto"
						tipo			= "'combobox-entidad-recaudadora'"
						seleccionado	= "ptrasp.EntidadRecaudadoraSeleccionado"
						activado		= "ptrasp.habilitoDocumentoIdentidad"
						filtros         = "ptrasp.EntidadRecaudadora.filtros">
					</bcs-combobox-base>    			
				</div>
				<div class="col-xs-4">
      				<label class="col-xs-5 ng-scope" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'" translate="">UI_DOCUMENTO_IDENTIDAD_DESTINO</label>
					<label class="col-xs-5 ng-scope" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo !== 'EGR'" translate="">UI_DOCUMENTO_IDENTIDAD_ORIGEN</label>
					<bcs-input-texto
						class			= "col-xs-6"
						ng-model		= "ptrasp.DocumentoIdentidadEntidadOrigen"							
						k-ng-disabled	= "true">
					</bcs-input-texto>	
    			</div>
    			<div class="col-xs-4" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'">
      				<label class="col-xs-6" translate="">UI_RAZON_RETIRO</label>
					<bcs-combobox-base 
						bcs-requerido   = "csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'"
						id				= "UI_RAZON_RETIRO"
						class			= "col-xs-6"
						id-actual 		= "ptrasp.RazonRetiroIdActual"
						id-post-filtro	= "ptrasp.RazonRetiroIdActualPostFiltro"
						tipo			= "'combobox-razon-retiro'"
						seleccionado	= "ptrasp.RazonRetiroSeleccionado"
						filtros         = "ptrasp.RazonRetiro.filtros">
					</bcs-combobox-base>    	
    			</div>	
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-5" translate="">UI_TIPO_TRASPASO</label>
					<bcs-combobox-base 
						id				= "UI_TIPO_TRASPASO" 
						class			= "col-xs-6"
						bcs-requerido
						tipo			= "'combobox-tipo-traspaso'"
						id-actual		= "ptrasp.TipoTraspasoIdActual"
						id-actual		= "ptrasp.TipoTraspasoIdActualDefecto"
						id-post-filtro	= "ptrasp.TipoTraspasoIdActualPost"
						seleccionado	= "ptrasp.TipoTraspasoSeleccionado"
						activado		= "ptrasp.habilitoTipoTraspaso"
						>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5 ng-scope" translate="">UI_TIPO_AHORRO</label>
					<bcs-combobox-base
					    bcs-requerido					 
						id					= "UI_TIPO_AHORRO"
						class				= "col-xs-6"
						tipo				= "'combobox-tipo-ahorro'"
						item-post-filtro	= "'1'"
						id-actual 			= "ptrasp.TipoAhorroIdActual"
						id-post-filtro		= "ptrasp.TipoAhorroPostFiltro"
						filtros				= "ptrasp.filtroTipoAhorro.IdTipoAhorro"
						seleccionado		= "ptrasp.TipoAhorroSeleccionado"
						cascada-a			= "ptrasp.RegimenAgrupador.filtros.CodigoRegimenTipoAhorro"
						cascada-valor		= "'Codigo'"
						todos				= "'S'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4" ng-show="ptrasp.TipoAhorroIdActual === 'APV' && ptrasp.EntidadRecaudadoraSeleccionado.IdTipoEntidadRecaudadora === 1 && csaapv.OrigenTraspasoSeleccionado.Codigo !== 'EGR'">
					<label class="col-xs-6" translate="">UI_FONDO_ORIGEN</label>
					<bcs-combobox-base 
						id				= "UI_FONDO_ORIGEN"
						class			= "col-xs-6"
						tipo			= "'combobox-fondo-origen'"
						id-actual 		= "ptrasp.FondoOrigenIdActual"
						id-post-filtro	= "ptrasp.FondoOrigenPostFiltro"
						activado        = "ptrasp.habilitoFondoOrigen"
						seleccionado	= "ptrasp.FondoOrigenSeleccionado">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-5" translate="">UI_MONTO_TRASPASO</label>
					<bcs-input-numero 
						class			= "col-xs-6"
						bcs-mayor-que	= "'0'"
						decimales		= "0"
						bcs-requerido	= "ptrasp.MontoTraspasoRequerido"
						ng-model		= "ptrasp.montoTraspaso"
						k-ng-model		= "ptrasp.kngMontoTraspaso"
						k-ng-disabled	= "!ptrasp.MontoPesoDeshabilitado"
						ng-blur			= "ptrasp.Requerido('MONTO')">
					</bcs-input-numero>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5" translate="">UI_UF_TRASPASO</label>
					<bcs-input-numero 
						class			= "col-xs-6"
						bcs-mayor-que	= "'0'"
						bcs-requerido	= "ptrasp.UFTraspasoRequerido"
						ng-model		= "ptrasp.uFTraspaso"
						k-ng-model		= "ptrasp.kngUFTraspaso"
						k-ng-disabled	= "!ptrasp.MontoUFDeshabilitado"
						ng-blur			= "ptrasp.Requerido('UF')">
					</bcs-input-numero>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-6" translate="">UI_PORCENTAJE_TRASPASO</label>
					<bcs-input-numero 
						class			= "col-xs-5"
						bcs-requerido	= "ptrasp.PorcentajeTraspasoRequerido"
						bcs-mayor-que	= "'0'"
						ng-model		= "ptrasp.porcentajeTraspaso"
						k-ng-model		= "ptrasp.kngPorcentajeTraspaso"
						k-ng-disabled	= "!ptrasp.PorcentajeDeshabilitado"
						ng-blur			= "ptrasp.Requerido('POR')">
					</bcs-input-numero>
					<label class="col-xs-1" translate="">%</label>
				</div>
			</div>
			<div class="row" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'">
				<div class="col-xs-4">
					<label class="col-xs-5" translate="">UI_REGIMEN</label>
					<bcs-combobox-base 
						id					= "UI_REGIMEN"
						class				= "col-xs-5" 
						item-post-filtro	= "'1'"
						todos				= "'S'"
						tipo				= "'combobox-regimen-tributario'"
						auto-cargar			= "'true'"
						activado			= "ptrasp.HabilitoPanelPrincipal"
						seleccionado		= "ptrasp.RegimenAgrupadorSeleccionado"
						id-actual			= "ptrasp.RegimenAgrupadorIdActual"
						cascada-a			= "ptrasp.oPortafolio.filtros.IdRegimenTributario"
						cascada-valor		= "'IdRegimenTributario'"
						filtros             = "ptrasp.RegimenAgrupador.filtros"
					>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5" translate="">UI_PORTAFOLIO</label>
					<bcs-combobox-base class="col-xs-6"
						id="UI_PORTAFOLIO"
						auto-cargar="'true'"
					 	bcs-requerido
					    tipo="'combobox-portafolio-traspaso'"
					    seleccionado="ptrasp.oPortafolio.seleccionado"
					    filtros="ptrasp.oPortafolio.filtros"
	                    id-actual="ptrasp.IdPortafolio"
					    configuracion="ptrasp.oPortafolio.configuracion"
					    todos="'S'"
					    item-post-filtro	= "'1'">
					</bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<bcs-button id="PanelPortafolioContratoTraspaso_consultarCustodia" class="col-xs-12" bcs-tipo= "'bcs-button-search'" bcs-habilitado = "true" bcs-auto-desactivar = "false" bcs-texto="'UI_BUSCAR' | translate" bcs-clic="buscarCustodia()"></bcs-button>
				</div>
			</div>
			
			<div class="row" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'">
				<div class="col-xs-5">
					<bcs-grid 
						id="grid-custodia-traspaso"
					 	configuracion="custodiaOptions"
						api = "apiGridCustodia"
						seleccionado="formData.custodia">		
					</bcs-grid> 
				</div>
			</div>
			<div class="row">
				<div class="col-xs-8" ng-show="csaapv.OrigenTraspasoSeleccionado.Codigo === 'EGR'">
					<label class="col-xs-2" translate="">UI_GLOSA_RETIRO</label>
					<div class="col-xs-10" style="padding-left: 30px">
						<textarea
							class="col-xs-11"
							ng-disabled="ptrasp.habilitoGlosaTraspasoRetiro"
							ng-model="ptrasp.GlosaTraspasoRetiro">
						</textarea>
					</div>
				</div>
    			<div class="col-xs-offset-8 col-xs-4">	
	    			<div class="col-xs-6">
		    			<bcs-button class		= "col-xs-11"
							bcs-habilitado		= "true" 
							bcs-tipo			= "'bcs-button-input-form'"
							bcs-auto-desactivar	= "false" 
							bcs-texto			= "'UI_ELIMINAR' | translate" 
							bcs-clic			= "ptrasp.fnEliminoOrigenTraspaso()">
						</bcs-button>
					</div>
					<div class="col-xs-6">
		    			<bcs-button 
		    				class				= "col-xs-11"
							bcs-habilitado		= "ptrasp.habilitarAgregar"
							bcs-tipo			= "'bcs-button-input-form'" 
							bcs-auto-desactivar	= "false" 
							bcs-texto			= "'UI_AGREGAR' | translate" 
							bcs-clic			= "ptrasp.fnAgregoOrigenTraspaso()">
						</bcs-button>
					</div>
				</div>	
    		</div> 
			<div class="row">
				<bcs-grid 
					id="gridOrigenTraspaso"
					seleccionado="ptrasp.origenTraspasoSeleccionado" 
					configuracion="ptrasp.origenTraspaso"
					>
				</bcs-grid>
			</div>
		</form>
	</div>
</div>

<div id="ModalClienteContratoSAAPV" class="col-xs-12" ng-controller="ModalClienteContratoSAAPVCtrl as mccs">
	<div class="row">
		<div class="col-xs-12">
			<bcs-grid
				id="ModalClienteContratoSAAPV_grillaClienteContrato" 
				configuracion="mccs.configuracionGrillaClienteContrato"
			    seleccionado="mccs.seleccionadoClienteContrato">
			</bcs-grid>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id="ModalClienteContratoSAAPV_botonAceptar" 
			class="col-xs-2"
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="mccs.btnAceptarEnabled" 
			bcs-clic="mccs.Aceptar()">
		</bcs-button>
		<bcs-button id="ModalClienteContratoSAAPV_botonCancelar" 
			class="col-xs-2"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true" 
			bcs-clic="mccs.Cancelar()">
		</bcs-button>
	</div>
</div>

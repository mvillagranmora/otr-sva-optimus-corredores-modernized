<div id="PanelIngresos" ng-controller="PanelIngresosCtrl as panIng" >
	<div class="row">
		<form name="formGestionIngresoEgresoAPV" class="col-xs-12 ng-pristine ng-valid ng-valid-bcs-required">
		
			<div class="row">
					<div class="col-xs-5">
				  		<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label>
						<bcs-combobox-base 
								id				= "UI_SOCIO_NEGOCIO"
								class			= "col-xs-8"
							 	auto-cargar		= "'false'"
							 	bcs-requerido
							    tipo			= "'combobox-socio-negocio'"
							    seleccionado	= "panIng.datosForm.SocioNegocioSeleccionado"
							    filtros			= "panIng.ConfiguracionCmbo.SocioNegocio"
			                    id-actual		= "panIng.datosForm.SocioNegocioIdActual"
						>
						</bcs-combobox-base>
					</div>
					<div class="col-xs-5">
					  	<label class="col-xs-4" translate>UI_FECHA_TRASPASO</label> 
				  		<bcs-input-date
							class="col-xs-4"
							k-ng-model="panIng.datosForm.fechaTraspaso" 
							bcs-requerido
						>
						</bcs-input-date>	
					</div>
					<div class="col-xs-2">
						<bcs-button class="col-xs-12" 
							bcs-tipo="'bcs-button-search'"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_BUSCAR' | translate" 
							bcs-habilitado="true"  							
							bcs-clic="panIng.consulta.GestionIngresoEgreso()">
						</bcs-button>
					</div>
			</div>
			<!-- 	GRILLAS 	-->
			<div class="row">
				<div class="col-xs-12">											
					<strong class="col-xs-4"  translate="">UI_GESTION_INGRESO_EGRESO</strong>
					<div class="col-xs-12">
						<bcs-grid 
							id				= "gridIngreso"
							configuracion 	= "panIng.datasource.GestionIngresoEgreso"
							seleccionado 	= "panIng.datasource.GestionIngresoEgresoSeleccion"
							fn-click		= "panIng.consulta.ConsultaDetalleTraspaso(panIng.datasource.GestionIngresoEgresoSeleccion)"
							fn-doble-click	= "panIng.fn.IngresoTraspaso('M', true)"
						>
						</bcs-grid>
					</div>
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-xs-12">											
					<strong class="col-xs-4"  translate="">UI_DETALLE_TRASPASO</strong>
					<div class="col-xs-12">
						<bcs-grid 
							id					= "gridDetalleTraspasos"
							configuracion 		= "panIng.datasource.DetalleTraspaso"
							seleccionado 		= "panIng.datasource.DetalleTraspasoSeleccion"
						>
						</bcs-grid>
					</div>
				</div>
			</div>
			<br>			
			<div class="row">
				<div class=col-xs-2>
				<bcs-button class				= "col-xs-12" 
								id					= "UI_MODIFICA_TRASPASO_APV"
								bcs-tipo			= "'bcs-button-primary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_MODIFICA_TRASPASO_APV' | translate" 
								bcs-habilitado		= "panIng.datasource.GestionIngresoEgresoSeleccion !== undefined" 							
								bcs-clic			= "panIng.VentanaContratoSAAPV('M')"
					>
					</bcs-button>
<!-- 
					<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES_GESTION' | translate" >
						<li ng-click="panIng.VentanaContratoSAAPV('M')">{{'UI_MODIFICAR_CONTRATO' | translate}}</li>
					</bcs-menu>	-->
				</div>
				<div class="col-xs-1"></div>

				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12" 
								id					= "REAPERTURAR"
								bcs-tipo			= "'bcs-button-secondary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'REAPERTURAR' | translate" 
								bcs-habilitado		= "panIng.fn.ValidoBotonReapertura('RA')" 	
								bcs-mostrar			= "true"
								bcs-clic			= "panIng.fn.IngresoTraspaso('R', false)"					
							
					>
					</bcs-button>
				</div>

				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12" 
								id					= "UI_RECAUDACION"
								bcs-tipo			= "'bcs-button-primary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_RECAUDACION' | translate" 
								bcs-habilitado		= "panIng.datasource.GestionIngresoEgresoSeleccion !== undefined" 							
								bcs-clic			= "panIng.fn.IngresoRecaudacion(panIng.datasource.GestionIngresoEgresoSeleccion)"
					>
					</bcs-button>
				</div>
				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12" 
								id					= "UI_INGRESO_TRASPASO_APV"
								bcs-tipo			= "'bcs-button-secondary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_INGRESO_TRASPASO_APV' | translate"
								bcs-habilitado		= "true"   										
								bcs-clic			= "panIng.VentanaIngresoTraspaso()"
					>
					</bcs-button>
				</div>
				<!--
				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12" 
								id					= "UI_AGREGAR_FORMA_PAGO"

								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_AGREGAR_FORMA_PAGO' | translate" 
								bcs-habilitado		= "panIng.datasource.DetalleTraspasoSeleccion !== undefined" 							
								bcs-clic			= "invAPV.fn.AgregoFormaPago(panIng.datasource.DetalleTraspasoSeleccion)"
					>
					</bcs-button>

				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12" 
								id					= "UI_GENERA_MOVIMIENTO_TESORERIA"
								bcs-tipo			= "'bcs-button-secondary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_GENERA_MOVIMIENTO_TESORERIA' | translate" 
								bcs-habilitado		= "panIng.datasource.GestionIngresoEgresoSeleccion !== undefined" 							
								bcs-clic			= "invAPV.fn.GeneraMovimientoTesoreria(panIng.datasource.GestionIngresoEgresoSeleccion)"
					>
					</bcs-button>
				</div>
				
				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12" 
								id					= "UI_CARGAR_ARCHIVO"
								bcs-tipo			= "'bcs-button-secondary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_CARGAR_ARCHIVO' | translate" 
								bcs-habilitado		= "'true'" 							
								bcs-clic			= "invAPV.fn.CargaArchivo()"
					>
					</bcs-button>
				</div>
				
				<div class="col-xs-2">
					<bcs-button class				= "col-xs-12"

								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_DETALLE_TRASPASO' | translate" 
								bcs-habilitado		= "panIng.fn.ValidoBotones('DT')" 							
								bcs-clic			= "panIng.fn.IngresoTraspaso('M')"
					>
					</bcs-button>
				</div>
				-->
				<div class="col-xs-3">
					<bcs-button class				= "col-xs-12" 
								id					= "UI_INGRESO_DETALLE_TRASPASO"
								bcs-tipo			= "'bcs-button-secondary'" 
								bcs-auto-desactivar	= "false" 
								bcs-texto			= "'UI_INGRESO_DETALLE_TRASPASO' | translate" 
								bcs-habilitado		= "!panIng.fn.ValidoBotones('DT')" 							
								bcs-clic			= "panIng.fn.IngresoTraspaso('M', false)"
					>
					</bcs-button>
				</div>
			</div>
		</form>
	</div>
</div>

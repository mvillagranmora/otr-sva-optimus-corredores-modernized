<div class="col-xs-12" ng-controller="IngresoBancoPreviredCtrl as ingresoBancoPrevired">
	<form name="CrearBancoPrevired" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-3" translate>UI_CODIGO_BANCO</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_CODIGO_BANCO"
				  		maxlength="200"
				  		solo-mayusculas="N"
				  		bcs-requerido
						ng-model="ingresoBancoPrevired.CodigoBancoPrevired">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-3" translate>UI_CUENTA_BANCARIA</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-numero-cuentas-bancarias-corredora'"
			  			id-actual="ingresoBancoPrevired.IdCuentaBanco"
			  			bcs-requerido
			  			todos="'N'">
			  		</bcs-combobox-base>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-11 alignButtonsToRight">
			<bcs-button class="col-xs-3" id="CrearBancoPrevired_CREAR" 
				bcs-texto="'UI_CREAR' | translate" 
				bcs-habilitado="CrearBancoPrevired.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="true"
				bcs-clic="ingresoBancoPrevired.crearBancoPrevired()">
			</bcs-button>
		</div>
	</div>
</div>

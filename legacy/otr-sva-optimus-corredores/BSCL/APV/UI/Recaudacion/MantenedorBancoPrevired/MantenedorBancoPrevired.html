<div id="MantenedorBancoPrevired" class="col-xs-12" ng-controller="MantenedorBancoPreviredCtrl as mantenedorBancoPrevired">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
			  	<div class="col-xs-10">
			  		<label class="col-xs-2" translate>UI_BANCO</label>
			  		<bcs-combobox-base class="col-xs-3"
			  			tipo="'combobox-banco'"
			  			id-actual="mantenedorBancoPrevired.filtros.IdBanco"
			  			cascada-a="mantenedorBancoPrevired.filtrosComboboxCuentaBanco.IdBanco"
						cascada-valor="'IdBanco'"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  		<label class="col-xs-2 col-xs-offset-1" translate>UI_CUENTA_BANCARIA</label>
			  		<bcs-combobox-base class="col-xs-3"
			  			tipo="'combobox-numero-cuentas-bancarias-corredora'"
			  			id-actual="mantenedorBancoPrevired.filtros.IdCuentaBanco"
			  			filtros="mantenedorBancoPrevired.filtrosComboboxCuentaBanco"
			  			id-defecto="'0'" 
			  			todos="'S'">
			  		</bcs-combobox-base>
			  	</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="mantenedorBancoPrevired.buscarBancoPrevired()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="mantenedorBancoPrevired.limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-mantenedor-banco-previred"
			 	configuracion="mantenedorBancoPrevired.gridBancoRecaudacion"
				seleccionado="mantenedorBancoPrevired.datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2" id="MantenedorBancoPrevired_CrearBancoPrevired" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CREAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="mantenedorBancoPrevired.crearBancoPrevired()">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorBancoPrevired_ModificarBancoPrevired" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="mantenedorBancoPrevired.modificarBancoPrevired(mantenedorBancoPrevired.datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-2" id="MantenedorBancoPrevired_EliminarBancoPrevired" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ELIMINAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="mantenedorBancoPrevired.elimminarBancoPrevired(mantenedorBancoPrevired.datos.kNgModel)">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
	</div>
</div>

<div class="col-xs-12" ng-controller="EditarBancoPreviredCtrl as editarBancoPrevired">
	<form name="ModificarBancoPrevired" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-3" translate>UI_CODIGO_BANCO</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_CODIGO_BANCO"
				  		maxlength="200"
				  		solo-mayusculas="N"
				  		bcs-requerido
				  		k-ng-disabled="'true'"
						ng-model="editarBancoPrevired.datosDespues.CodigoBancoPrevired">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-3" translate>UI_CUENTA_BANCARIA</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-numero-cuentas-bancarias-corredora'"
			  			id-actual="editarBancoPrevired.datosDespues.IdCuentaBanco"
			  			id-defecto="editarBancoPrevired.datosAntes.IdCuentaBanco"
			  			bcs-requerido
			  			todos="'N'">
			  		</bcs-combobox-base>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-11 alignButtonsToRight">
			<bcs-button class="col-xs-3" id="ModificarBancoPrevired_MODIFICAR" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="ModificarBancoPrevired.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="true"
				bcs-clic="editarBancoPrevired.modificarBancoPrevired()">
			</bcs-button>
		</div>
	</div>
</div>

<div id="PanelDetalleCargaContratoSAAPV" ng-controller="PanelDetalleCargaContratoSAAPVCtrl as pdccs">
	<label class="col-xs-12" translate>UI_CONTRATOS_SAAPV</label>
	<br>
	<hr>
	<div class="row">
		<bcs-grid id="gridContrato"
			seleccionado="pdccs.contratoSeleccionado" 
			configuracion="pdccs.contratoOptions" 
			fn-doble-click="pdccs.buscarDistribucion(pdccs.contratoSeleccionado)">
		</bcs-grid>
	</div>
	<label class="col-xs-12" translate>UI_DISTRIBUCION_INVERSION</label>
	<br>
	<hr>
	<div class="row">
		<bcs-grid id="gridDistribucionInversion"
			seleccionado="pdccs.distribucionInvercionSeleccionada" 
			configuracion="pdccs.distribucionInvercionOptions">
		</bcs-grid>
	</div>
</div>

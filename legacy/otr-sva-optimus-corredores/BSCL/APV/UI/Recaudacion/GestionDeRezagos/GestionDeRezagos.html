<div ng-controller="DetalleGestionRezagosCtrl as grez">
	<form name="formGestionRezagos" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_DETALLE_CARGA_INTERFACES|translate}}</span>
			</div>
		</div>
			<div class="col-xs-12">
			<div class="row col-xs-10">
				<div class="col-xs-12">
			  		<label class="col-xs-1" translate>UI_FECHA_DESDE</label>
					<bcs-input-date 
						id="UI_FECHA_DESDE" 
						class="col-xs-2" 
						k-ng-model = "grez.kngFechaDesde"
						k-options="kOptFechaSuscripcion"
					>
					</bcs-input-date>
			  		<label class="col-xs-offset-1 col-xs-1" translate>UI_FECHA_HASTA</label>
					<bcs-input-date 
						id="UI_FECHA_HASTA" 
						class="col-xs-2" 
						k-ng-model = "grez.kngFechaHasta"
						k-options="kOptFechaSuscripcion"
					>
					</bcs-input-date>
			  		<label class="col-xs-offset-1 col-xs-1" translate>UI_FOLIO_RECAUDACION</label>
					<bcs-combobox-base 
						id="UI_FOLIO_RECAUDACION" 
						auto-cargar="true"
						cache="true"
						class="col-xs-2"
						tipo="'combobox-folio-recaudacion'"
						id-actual="grez.folioContrato"
						seleccionado="grez.tipoDepositoSeleccionado">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-12">
			  		<label class="col-xs-1" translate>UI_RUT_EMPLEADOR</label>
					<bcs-combobox-base 
						id="UI_RUT_EMPLEADOR" 
						auto-cargar="true"
						class="col-xs-2"
						tipo="'combobox-empleador'"
						id-actual="grez.idPersona"
						seleccionado="grez.empleadorSeleccionado"
						id-post-filtro="grez.idPersonaPostFiltro"
						>
					</bcs-combobox-base>
			  		<label class="col-xs-offset-1 col-xs-1" translate>UI_RUT_CLIENTE</label>
					<bcs-combobox-base 
						id="UI_RUT_CLIENTE"  
						auto-cargar="true"
						class="col-xs-2"
						tipo="'combobox-clientes'"
						id-actual="grez.idCliente"
						seleccionado="grez.clienteSeleccionado"
						id-post-filtro="grez.idClientePostFiltro"
						>
					</bcs-combobox-base>
						<label class="col-xs-offset-1 col-xs-1" translate>UI_OBSERVACION</label>
						<bcs-input-texto class="col-xs-2" ng-model="grez.Observacion"></bcs-input-texto>
			</div>
			</div>
			<div class="row col-xs-2">
					<bcs-button class="col-xs-12"
						bcs-tipo="'bcs-button-search'"
						bcs-habilitado="'true'" 
						bcs-auto-desactivar="false"
						bcs-texto="'UI_BUSCAR_REGISTROS' | translate" 
						bcs-clic="grez.buscarRegistros()">
					</bcs-button>
			</div>
			</div>
			<div class="row col-xs-12">
				<bcs-grid 
					id="grid-distr-estados"
					seleccionado="grez.recaudacionSeleccionada" 
					configuracion="grez.gridRecaudacion" 
					fn-doble-click="grez.abrirEstadosDistr(grez.recaudacionSeleccionada)"
				    fn-exportar-excel="excelGestionRezagos"
					>
				</bcs-grid>
			</div>

			<div class="row">
				
				<bcs-menu class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-habilitado="'true'" bcs-texto="'UI_DEVOLUCION' | translate" >
					<li ng-click="grez.DevolucionPagoRezagos(grez.recaudacionSeleccionada,'CLIENTE')">{{'UI_A_CLIENTE' | translate}}</li>
					<li ng-click="grez.DevolucionPagoRezagos(grez.recaudacionSeleccionada,'EMPLEADOR')">{{'UI_A_EMPLEADOR' | translate}}</li>
					<li ng-click="grez.DevolucionPagoRezagos(grez.recaudacionSeleccionada,'OTROS')">{{'UI_A_OTRAS_ENTIDADES' | translate}}</li>
				</bcs-menu>	
				<!--  
				<bcs-button class="col-xs-2"
					bcs-tipo=""
					bcs-habilitado="'true'" 
					bcs-auto-desactivar="false"
					bcs-texto="'UI_OPCIONES' | translate" 
					bcs-clic="">
				</bcs-button>
				-->
				<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
		            <li ng-click="excelGestionRezagos('GestionRezagos')">{{'UI_EXPORTAR_ACTUAL_EXCEL' | translate}}</li>
				</bcs-menu>
				
			</div>
	</form>
</div>

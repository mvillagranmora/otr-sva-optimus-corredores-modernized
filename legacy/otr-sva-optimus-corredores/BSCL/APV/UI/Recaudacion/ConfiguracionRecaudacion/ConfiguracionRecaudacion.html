<div id="ConfiguracionRecaudacionAPV" class="row" ng-controller="ConfiguracionRecaudacionCtrl as cnfgRec">
	<div class="row">
		<form name="formConfiguracionRecaudacion" class="col-xs-12 ng-pristine ng-valid ng-valid-bcs-required">
			<div class="row">
				<div class="col-xs-4">
	      			<label class="col-xs-5" translate="">UI_PROCESO</label>
					<bcs-combobox-base 
						id="UI_PROCESO" 
						auto-cargar="true"
						bcs-requerido
						cache="false"
						class="col-xs-6"
						tipo="cnfgRec.oConfiguracionProceso.tipo"
						id-actual="cnfgRec.proceso"
						configuracion="cnfgRec.oConfiguracionProceso"
						filtros="cnfgRec.oConfiguracionProceso.filtros"
						seleccionado="cnfgRec.procesoSeleccionado"
						kendo-widget= "cnfgRec.proData"
						>			
					</bcs-combobox-base>
				</div>
			</div>
			<hr>
			<div class="row">
				<div class="col-xs-4">
	      			<label class="col-xs-5" translate="">UI_CUENTA_BANCARIA_ORIGEN</label>
					<bcs-combobox-base 
						id="UI_CUENTA_ORIGEN" 
						auto-cargar="true"
						bcs-requerido="cnfgRec.habilitaBancoOrigen"
						cache="false"
						class="col-xs-6"
						tipo="cnfgRec.oConfiguracionCuentaOrigen.tipo"
						id-actual="cnfgRec.cuentaOrigen"
						id-post-filtro ="cnfgRec.cuentaOrigenPost"
						configuracion="cnfgRec.oConfiguracionCuentaOrigen"
						filtros="cnfgRec.oConfiguracionCuentaOrigen.filtros"
						seleccionado="cnfgRec.cuentaOrigenSeleccionada"
						activado= "cnfgRec.habilitaBancoOrigen"
						>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
			      	<label class="col-xs-5" translate>UI_BANCO_ORIGEN</label>
					<bcs-input-texto class="col-xs-6" 
						name="uBancoOrigen" 
						ng-model="cnfgRec.bancoOrigen" 
						k-ng-disabled="true">
					</bcs-input-texto>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5 ng-scope" translate="">UI_NUMERO_CUENTA_ORIGEN</label>
					<bcs-input-texto class="col-xs-6" 
						name="uNumeroCuentaOrigen" 
						ng-model="cnfgRec.numeroCuentaOrigen" 
						k-ng-disabled="'true'"
					>
					</bcs-input-texto>		
				</div>
	    	</div>
	    	<div class="row">
				<div class="col-xs-4">
	      			<label class="col-xs-5" translate="">UI_CUENTA_BANCARIA_DESTINO</label>
					<bcs-combobox-base 
						id="UI_CUENTA_DESTINO" 
						auto-cargar="true"
						bcs-requerido
						cache="false"
						class="col-xs-6"
						tipo="cnfgRec.oConfiguracionCuentaDestino.tipo"
						id-actual="cnfgRec.cuentaDestino"
						id-post-filtro ="cnfgRec.cuentaDestinoPost"
						configuracion="cnfgRec.oConfiguracionCuentaDestino"
						filtros="cnfgRec.oConfiguracionCuentaDestino.filtros"
						seleccionado="cnfgRec.cuentaDestinoSeleccionada"
						>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
			      	<label class="col-xs-5" translate>UI_BANCO_DESTINO</label>
					<bcs-input-texto class="col-xs-6" 
						name="uBancoDestino" 
						ng-model="cnfgRec.bancoDestino" 
						k-ng-disabled="'true'">
					</bcs-input-texto>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5 ng-scope" translate="">UI_NUMERO_CUENTA_DESTINO</label>
					<bcs-input-texto class="col-xs-6" 
						name="uNumeroCuentaDestino" 
						ng-model="cnfgRec.numeroCuentaDestino" 
						k-ng-disabled="'true'"
					>
					</bcs-input-texto>		
				</div>
	    	</div>
	    	<div class="row">
				<div class="col-xs-4">
	      			<label class="col-xs-5" translate="">UI_CUENTA_BANCARIA_PUENTE</label>
					<bcs-combobox-base 
						id="UI_CUENTA_BANCARIA_PUENTE" 
						auto-cargar="true"
						bcs-requerido
						cache="false"
						class="col-xs-6"
						tipo="cnfgRec.oConfiguracionCuentaPuente.tipo"
						id-actual="cnfgRec.cuentaPuente"
						id-post-filtro ="cnfgRec.cuentaPuentePost"
						configuracion="cnfgRec.oConfiguracionCuentaPuente"
						filtros="cnfgRec.oConfiguracionCuentaPuente.filtros"						
						seleccionado="cnfgRec.cuentaPuenteSeleccionada"
						>
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
			      	<label class="col-xs-5" translate>UI_BANCO_PUENTE</label>
					<bcs-input-texto class="col-xs-6" 
						name="uBancoPuente" 
						ng-model="cnfgRec.bancoPuente" 
						k-ng-disabled="'true'">
					</bcs-input-texto>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-5 ng-scope" translate="">UI_NUMERO_CUENTA_PUENTE</label>
					<bcs-input-texto class="col-xs-6" 
						name="uNumeroCuentaPuente" 
						ng-model="cnfgRec.numeroCuentaPuente" 
						k-ng-disabled="'true'"
					>
					</bcs-input-texto>		
				</div>
	    	</div>
	    	<div class="row">
				<div class="col-xs-4">
		      		<label class="col-xs-5" translate>UI_ESTADO</label>
					<bcs-combobox-base 
						id="UI_ESTADO"
						class="col-xs-6"
						tipo="'combobox-estado-apv'"
						bcs-requerido
						id-actual="cnfgRec.estado"
						configuracion="cnfgRec.oConfiguracionEstado"
						seleccionado="cnfgRec.estadoSeleccionado"
						filtros="cnfgRec.oConfiguracionEstado.filtros" 
						>
					</bcs-combobox-base>
				</div>
    		</div>   
			<div class="row alignButtonsToRight">
				<bcs-button class="col-xs-2"
					bcs-tipo="'bcs-button-primary'"
					bcs-habilitado="true" 
					bcs-auto-desactivar="false"
					bcs-texto="'UI_GRABAR' | translate" 
					bcs-clic="cnfgRec.GrabarConfiguracion()">
				</bcs-button>
			</div>
		</form>
	</div>
</div>

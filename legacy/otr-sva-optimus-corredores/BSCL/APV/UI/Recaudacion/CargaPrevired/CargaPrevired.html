<div ng-controller="CargaPrevired">
	<div class="col-xs-12 bcs-cuerpo">
		<div class="row">
			<div class="col-xs-12">
				<div class="col-xs-4">
					<input type="file" 
					file-reader callback="data.guardarDiccionario" 
					class="custom-file-input pull-left"
					onchange="angular.element(this).scope().fileChanged(this)"
					id-ventana="idVentanaCargaArchivo" 
					ng-accept="configArchivo.formatoArchivoDefecto"
					 style="display:inline"/>
					 <div class="col-xs-7" style="height: 100%;
									position: relative;
									height: 30px;">
										<span id="nombreArchivoCartola" style="
										font-weight: bold;
										font-size: 12px;
										position: absolute;
										top: 50%; 
										left: 50%; 
										width: 100%;
										transform: translate(-50%, -50%); 
										padding-left: 14px;
									">{{nombreArchivo}}</span>
									</div>
				</div>
			</div>
		</div>
		<div class="row"></div>
		<div class="row">			
			<bcs-grid 
				id="grid-carga-archivo"
		 		configuracion = "confBasicaCargaArchivo"
				seleccionado = "seleccionCargaArchivo">
			</bcs-grid>
		</div>
		<div class="row alignButtonsToRight">
			<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="(archivo.contenido.length > 0 && erroresValidacion === 0 && file.fileData.length > 0) && habilitarBoton" bcs-clic="cerrar()"></bcs-button>	
			<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
		</div>
	</div>
</div>

<div ng-controller="DetalleCargaRecaudacionCtrl as dci">
	<form name="formCargaRecaudacion" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_DETALLE_CARGA_RECAUDACION|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div class="row">
		
				<label class="col-xs-12" translate>UI_DETALLE_CARGA_RECAUDACION</label>
				<br>
				<hr>
				<div class="row">
					<bcs-grid id="gridContrato"
						seleccionado="dci.contratoSeleccionado" 
						configuracion="dci.cargaDetalle" 
						>
					</bcs-grid>
				</div>
				<div class="row">
					<div class="row bcs-panel-comandos alignButtonsToRight">
						<bcs-button class="col-xs-2" 
							bcs-tipo="'bcs-button-primary'"  
							bcs-auto-desactivar="false"  
							bcs-texto="'UI_CARGAR' | translate" 
							bcs-habilitado="'true'"  
							bcs-clic="console.log('CARGAR ARCHIBO')"
						/>
						<bcs-button class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false"  
							bcs-texto="'UI_PREPROCESAR' | translate" 
							bcs-habilitado="'true'"  
							bcs-clic="dci.procesarDetallesCarga('PRE')"
						/>
						<bcs-button class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false"  
							bcs-texto="'UI_PROCESAR' | translate" 
							bcs-habilitado="'true'"  
							bcs-clic="dci.procesarDetallesCarga('PRO')"
						/>
					</div>
				</div>					
			</div>
		</div>
	</form>
</div>

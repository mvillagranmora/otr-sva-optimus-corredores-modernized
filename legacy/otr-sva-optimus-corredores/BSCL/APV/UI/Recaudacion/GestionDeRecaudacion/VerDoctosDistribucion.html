<div class="col-xs-12" ng-controller="VerDoctosDistCtrl as vdd">	
	<div class="row">
		<bcs-grid 
			seleccionado="vdd.anotacionSeleccionado" 
			configuracion="vdd.confGridAnotaciones" 
			fn-doble-click="vdd.modificar(pPorAut.anotacionSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id="AdministrarPortafolioAutorizaciones_agregar" class="col-xs-2" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="vdd.agregar()">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_modificar" class="col-xs-2" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="vdd.anotacionSeleccionado" bcs-clic="vdd.modificar(vdd.anotacionSeleccionado)">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_eliminar" class="col-xs-2" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" 
			bcs-habilitado="vdd.anotacionSeleccionado" bcs-clic="vdd.eliminar(vdd.anotacionSeleccionado)">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_Descargar" class="col-xs-2" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_DESCARGAR' | translate" 
			bcs-habilitado="vdd.anotacionSeleccionado.ExisteArchivo ==='S'" bcs-clic="vdd.descargar(vdd.anotacionSeleccionado)">
		</bcs-button>
		
	</div>
</div>

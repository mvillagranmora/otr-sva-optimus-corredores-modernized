<div id="AsignacionPortafolioAPV" class="row" ng-controller="AsignacionPortafolioAPVCtrl as apapv">
	<div class="row">
		<form name="formAsignacionPortafolioAPV" class="col-xs-12 ng-pristine ng-valid ng-valid-bcs-required">
			<div class="row">
				<div class="col-xs-12">
	      			<label class="col-xs-4" translate="">UI_NOMBRE_CLIENTE</label>
					<bcs-input-texto
						class			= "col-xs-8"
						ng-model		= "apapv.NombreCliente"
						k-ng-model		= "apapv.kngNombreCliente"
						k-ng-disabled	= "true"
					>
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4 ng-scope" translate="">UI_RUT_CLIENTE</label>
					<bcs-input-texto
						class			= "col-xs-8"
						ng-model		= "apapv.RutCliente"
						k-ng-model		= "apapv.kngRutCliente"
						k-ng-disabled	= "true"
					>
					</bcs-input-texto>
    			</div>
    		</div>
			<div class="row">
				<div class="col-xs-12">
	      			<label class="col-xs-4 ng-scope" ng-show= "apapv.ContratoSAAPVVisible" translate="">UI_CONTRATO_SAAPV</label>
	      			<bcs-combobox-base 
						id				= "UI_CONTRATO_SAAPV"  
						auto-cargar		= "true"
						class			= "col-xs-8"
						tipo			= "'combobox-contrato-saapv'"
						filtros			= "apapv.filtroContratoSAAPV" 
						id-actual		= "apapv.idContratoSAAPV"
						seleccionado	= "apapv.contratoSAAPVSeleccionado"
						activado		= "true"
						bcs-habilitado	= "apapv.ContratoSAAPVVisible" 
						ng-show			= "apapv.ContratoSAAPVVisible" 
					>
					</bcs-combobox-base>
    			</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
	      			<label class="col-xs-4 ng-scope" ng-show= "apapv.ContratoDCVisible" translate="">UI_CONTRATO_DC</label>
	      			<bcs-combobox-base 
						id				= "UI_CONTRATO_DC"  
						auto-cargar		= "true"
						class			= "col-xs-8"
						tipo			= "'combobox-contrato-saapv'"
						filtros			= "apapv.filtroContratoDC" 
						id-actual		= "apapv.idContratoDC"
						seleccionado	= "apapv.contratoDCSeleccionado"
						activado		= "true"
						bcs-habilitado	= "apapv.ContratoDCVisible" 
						ng-show			= "apapv.ContratoDCVisible" 
					>
					</bcs-combobox-base>
    			</div>
			</div>
			<div class="row">
				<div class="col-xs-12 alignButtonsToRight">

						<bcs-button 
						class				= "col-xs-4"
						bcs-tipo			= "'bcs-button-primary'"
						bcs-habilitado		= "apapv.ContratoSAAPVVisible" 
						bcs-auto-desactivar	= "false"
						bcs-texto			= "'UI_VER_CONTRATO' | translate" 
						bcs-clic			= "apapv.verContrato()"
						ng-show				= "apapv.ContratoSAAPVVisible" 
					>
					</bcs-button>
					<bcs-button 
						class				= "col-xs-4"
						bcs-tipo			= "'bcs-button-primary'"
						bcs-habilitado		= "apapv.ContratoDCVisible"
						bcs-auto-desactivar	= "false"
						bcs-texto			= "'UI_VER_CONTRATO_DC' | translate" 
						bcs-clic			= "apapv.verContratoDC()"
						ng-show				= "apapv.ContratoDCVisible" 
					>
					</bcs-button>
					<bcs-button 
						class				= "col-xs-4"
						bcs-tipo			= "'bcs-button-secondary'" 
						bcs-habilitado		= "apapv.contratoSeleccionado" 
						bcs-auto-desactivar	= "false"
						bcs-texto			= "'UI_ASIGNAR' | translate" 
						bcs-clic			= "apapv.asignar()"
					>
					</bcs-button>
				</div>
			</div>
		</form>
	</div>
</div>

			<div class="col-xs-12">
				<span>{{UI_GESTION_INTERFACES|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">

      						<uib-tab id="TabDistribucion" heading="{{'UI_DISTRIBUCION'| translate|uppercase }}" active="GestRec.tabs['PanelDistribucion'].active" select="GestRec.fnTabSelect('Distribucion','PanelDistribucion')" >

<div id="ModalConciliacionMasivaPrevired" ng-controller="ModalConciliacionMasivaPreviredCtrl as mConcMsv" >
	<div class="bcs-cuerpo" >
		<form name="formModalConciliacionMasivaPrevired" class="filters-formulario">
			<div class="row">
				<div class="col-xs-10">
					<div class="row">
		     			<label class="col-xs-5 ng-scope" translate="">UI_FOLIO_RECAUDACION_DESDE</label>
		     			<bcs-input-numero 
		      				id="FolioDesde" 
		      				class="col-xs-4"
							ng-model="mConcMsv.FolioDesde"
							k-ng-model="mConcMsv.kFolioDesde"
							decimales="0"
							>
						</bcs-input-numero>
					</div>
					<div class="row">
		     			<label class="col-xs-5 ng-scope" translate="">UI_FOLIO_RECAUDACION_HASTA</label>
		     			<bcs-input-numero 
		      				id="FolioHasta" 
		      				class="col-xs-4"
							ng-model="mConcMsv.FolioHasta"
							k-ng-model="mConcMsv.kFolioHasta"
							decimales="0"
							>
						</bcs-input-numero>
					</div>
				</div>
				<div class="col-xs-2">
					<div class="row">
						<bcs-button 
							class				="col-xs-12 pull-right"
							bcs-tipo			="'bcs-button-search'"
							bcs-habilitado		="mConcMsv.habilitaBtnBuscar" 
							bcs-auto-desactivar	="false"
							bcs-texto			="'UI_BUSCAR' | translate" 
							bcs-clic			="mConcMsv.filtrarFoliosRecaudacion()">
						</bcs-button>
					</div>
					<div class="row">
						<bcs-button 
							class				="col-xs-12 pull-right"
							bcs-tipo			="'bcs-button-secondary'"
							bcs-habilitado		="'true'" 
							bcs-auto-desactivar	="false"
							bcs-texto			="'UI_LIMPIAR' | translate" 
							bcs-clic			="mConcMsv.limpiarFoliosRecaudacion()">
						</bcs-button>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div class="row">
		<bcs-grid
			id 				= "gridFoliosRecaudacion"
			configuracion	= "mConcMsv.confGridFoliosRecaudacion"
			seleccionado	= "mConcMsv.seleccionFolios">
		</bcs-grid>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button 
			id					="ModalConciliacionMasivaPrevired_ConciliarMasivo"
			class				="col-xs-2 pull-right"
			bcs-tipo			="'bcs-button-primary'"
			bcs-habilitado		="mConcMsv.habilitaBtnConciliar" 
			bcs-auto-desactivar	="false"
			bcs-texto			="'UI_CONCILIAR' | translate" 
			bcs-clic			="mConcMsv.fnConciliarMasivo()">
		</bcs-button>
	</div>
	</form>
</div>

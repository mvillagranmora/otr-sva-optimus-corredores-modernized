<div ng-controller="PanelPortafolioAutorizacionesCtrl as pPorAut">		
	<div class="row">
		<bcs-grid 
			seleccionado="pPorAut.autorizadoSeleccionado" 
			configuracion="pPorAut.gridAutorizados" 
			fn-doble-click="pPorAut.modificar(pPorAut.autorizadoSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="AdministrarPortafolioAutorizaciones_agregar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="pPorAut.agregar()">
		</bcs-button>
		<!-- <bcs-button id="AdministrarPortafolioAutorizaciones_modificar" class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="pPorAut.autorizadoSeleccionado" bcs-clic="pPorAut.modificar(ppr.autorizadoSeleccionado)">
		</bcs-button>
		-->
		<!-- <bcs-button id="AdministrarPortafolioAutorizaciones_eliminar" class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" 
			bcs-habilitado="pPorAut.autorizadoSeleccionado" bcs-clic="pPorAut.eliminar(pPorAut.autorizadoSeleccionado)">
		</bcs-button>
		-->
		<bcs-button id="AdministrarPortafolioAutorizaciones_bloquear" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" ng-show="pPorAut.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_BLOQUEAR' | translate" 
			bcs-habilitado="pPorAut.autorizadoSeleccionado" bcs-clic="pPorAut.bloquearAutorizado()">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_desbloquear" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" ng-show="!pPorAut.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_DESBLOQUEAR' | translate" 
			bcs-habilitado="pPorAut.autorizadoSeleccionado" bcs-clic="pPorAut.desbloquearAutorizado()">
		</bcs-button>
	</div>
</div>

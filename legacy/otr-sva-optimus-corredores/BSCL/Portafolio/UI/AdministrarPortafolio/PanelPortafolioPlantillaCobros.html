<div class="row" ng-controller="PanelPortafolioPlantillaCobrosCtrl as pPortCob">
	<form class="row" name="formPortafolioClientePerfilComercialPerfilCobros">
		<uib-tabset>
			<uib-tab id="AdmPortPerfCom_PerfilComercial" heading="{{'UI_BASE'| translate}}" select="admPort.fnTabPortafolioPerfilComercial()">
				<div class="row">
					<div class="col-xs-6"></div>
					<div class="col-xs-1 text-center">
						<label class="col-xs-12" translate>UI_MOSTRAR_TODOS</label>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-4" translate>UI_PLANTILLA_COBROS</label>
						<bcs-combobox-base
								id="formPortafolioClientePerfilComercialPerfilCobros_plantillaCobros"
								bcs-requerido="pPortCob.camposRequeridos['formPortafolioClientePerfilComercialPerfilCobros_plantillaCobros'].Requerido === 'S'"
								class="col-xs-7"
								tipo="'combobox-perfil-cobros'"
								id-actual="pPortCob.datosDespues.IdPerfilCobros"
								id-defecto="pPortCob.datosDespues.IdPerfilCobrosDef"
								seleccionado="pPortCob.objPlantillaCobros"
								todos="'N'"
								filtros="pPortCob.cmbbx.PerfilCobrosBase.filtros"
								activado="!pPortCob.winBase.modoLectura"
								disabled="pPortCob.winBase.modoLectura"
						></bcs-combobox-base>
					</div>
					<div class="col-xs-1">
						<div class="col-xs-5"></div>
						<bcs-input-checkbox class="col-xs-7" ng-model="pPortCob.AllPlantillasCobros" ng-disabled="pPortCob.winBase.modoLectura" >
						</bcs-input-checkbox>
					</div>
				</div>
				<div class="row">
					<bcs-plantilla-cobros
						id-ventana = "pPortCob.idVentana"
						id-plantilla="pPortCob.objPlantillaCobros.IdPerfilCobros"
						modo="'PB'">
					</bcs-plantilla-cobros>
				</div>
				<div class="row col-xs-12 bcs-panel-comandos">
					<div class="col-xs-8">
						<bcs-button id="AdmPortPerfCom_PerfilCobros_editar" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-primary'"  
							ng-if="pPortCob.winBase.modoLectura" 
							bcs-mostrar="pPortCob.winBase.modoLectura"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_EDITAR' | translate" 
							bcs-habilitado="'true'"  
							bcs-clic="pPortCob.winBase.editar();">
						</bcs-button>
						<bcs-button id="AdmPortPerfCom_PerfilCobros_guardar" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-primary'"  
							ng-if="!pPortCob.winBase.modoLectura" 
							bcs-mostrar="!pPortCob.winBase.modoLectura"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_GUARDAR' | translate" 
							bcs-habilitado="formPortafolioClientePerfilComercialPerfilCobros.$valid"
							bcs-clic="pPortCob.winBase.guardar();">
						</bcs-button>
						<bcs-button id="AdmPortPerfCom_PerfilCobros_cancelar" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'" 
							ng-if="!pPortCob.winBase.modoLectura" 
							bcs-mostrar="!pPortCob.winBase.modoLectura" 
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_CANCELAR' | translate" 
							bcs-habilitado="'true'"  
							bcs-clic="pPortCob.winBase.cancelar();">
						</bcs-button>
					</div>
				</div>
			</uib-tab>
			<uib-tab id="AdmPortPerfCom_PerfilProductos" heading="{{'UI_EXTRA' | translate}}" select="admPort.fnTabPortafolioPerfilProductos()">
				<div class="row" ng-if="pPortCob.datosDespues.IdPerfilCobrosExtra">
					<bcs-plantilla-cobros
						id-plantilla="pPortCob.datosDespues.IdPerfilCobrosExtra"
						modo="'PE'"
						id-ventana = "pPortCob.idVentana"
						accion-btn="pPortCob.accionExtra"
						guardar-ok = "pPortCob.ok"
						finalizar-ok = "pPortCob.finalizarOk">
					</bcs-plantilla-cobros>
				</div>
			</uib-tab>
		</uib-tabset>
	</form>
</div>

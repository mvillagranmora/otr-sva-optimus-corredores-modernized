<div ng-controller="PanelPortafolioAnotacionesCtrl as pPorAnt">		
	<div class="row">
		<bcs-grid 
			seleccionado="pPorAnt.anotacionSeleccionado" 
			configuracion="pPorAnt.gridAnotaciones" 
			fn-doble-click="pPorAnt.anotacionSeleccionado.Origen != 'SEBRA' && pPorAnt.modificar(pPorAnt.anotacionSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="AdministrarPortafolioAutorizaciones_agregar_anotaciones" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="pPorAnt.agregar()">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_modificar_anotaciones" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="pPorAnt.anotacionSeleccionado && pPorAnt.anotacionSeleccionado.Origen != 'SEBRA'" bcs-clic="pPorAnt.modificar(pPorAnt.anotacionSeleccionado)">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_eliminar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" 
			bcs-habilitado="pPorAnt.anotacionSeleccionado && pPorAnt.anotacionSeleccionado.Origen != 'SEBRA'" bcs-clic="pPorAnt.eliminar(pPorAnt.anotacionSeleccionado)">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_Descargar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_DESCARGAR' | translate" 
			bcs-habilitado="pPorAnt.anotacionSeleccionado.ExisteArchivo ==='S'" bcs-clic="pPorAnt.descargar(pPorAnt.anotacionSeleccionado)">
		</bcs-button>
		
	</div>
</div>

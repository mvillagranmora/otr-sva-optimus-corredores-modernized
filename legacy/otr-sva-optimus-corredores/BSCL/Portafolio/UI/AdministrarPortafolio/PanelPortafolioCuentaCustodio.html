<div class="row" ng-controller="PanelPortafolioCuentaCustodioCtrl as pPortCcust">
	<div class="row">
		<bcs-grid 
			configuracion="pPortCcust.gridCuentaCustodio"
			seleccionado="pPortCcust.cuentaCustodioSeleccionado" 
			fn-doble-click="pPortCcust.win.abrirPopUp(pPortCcust.cuentaCustodioSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-8">
			<div class="row">
				<bcs-button class="col-xs-2" 
					id="FormPortafolioCuentaCustodio_crear" 
					bcs-tipo="'bcs-button-primary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CREAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="pPortCcust.win.abrirPopUp()">
				</bcs-button>
				<bcs-button class="col-xs-2" 
					id="FormPortafolioCuentaCustodio_editar" 
					bcs-tipo="'bcs-button-secondary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_EDITAR' | translate" 
					bcs-habilitado="pPortCcust.cuentaCustodioSeleccionado.IdCuentaCustodioPortafolio>0"  
					bcs-clic="pPortCcust.win.abrirPopUp(pPortCcust.cuentaCustodioSeleccionado)">
				</bcs-button>
				<bcs-button class="col-xs-2" 
					id="FormPortafolioCuentaCustodio_autorizar" 
					bcs-tipo="'bcs-button-secondary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_SOLICITAR_AUTORIZACION' | translate" 
					bcs-habilitado="(!!pPortCcust.cuentaCustodioSeleccionado && pPortCcust.cuentaCustodioSeleccionado.IdEstadoAutorizacion!=='AUT')"  
					ng-show="(!!pPortCcust.cuentaCustodioSeleccionado && pPortCcust.cuentaCustodioSeleccionado.IdEstadoAutorizacion!=='AUT')"
					bcs-clic="pPortCcust.win.solicitarAutorizacion(pPortCcust.cuentaCustodioSeleccionado)">
				</bcs-button>
			</div>
		</div>
	</div>
</div>

<div id="ModalPortafolioAnotaciones" ng-controller="ModalPortafolioAnotacionesCtrl">
	<form name ="formPortafolioClienteAnotaciones">
		<div class="row">
			<label class="col-xs-4" translate>UI_MOTIVO</label>
			<bcs-combobox-base class="col-xs-8"
				tipo = "Combobox.oConfMotivo.tipo"
				seleccionado = "data.MotivoSeleccionado"
				id-actual = "data.MotivoAnotacion"
				id-defecto = "data.MotivoAnotacionDefecto"
				todos = "'N'"
				id="formPortafolioClienteAnotaciones_motivo"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_motivo'].Requerido === 'S'"
				filtros = "Combobox.oConfMotivo.filtros">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_TITULO</label>
			<bcs-input-texto class="col-xs-8"
				id="formPortafolioClienteAnotaciones_titulo"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_titulo'].Requerido === 'S'"
				ng-model="data.Titulo">
			</bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_DETALLE</label>
			<bcs-input-texto class="col-xs-8"
				id="formPortafolioClienteAnotaciones_detalle"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_detalle'].Requerido === 'S'"
				tipo-campo = "'textarea'"
				ng-model="data.Detalle">
			</bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_FECHA_VALIDO_DESDE</label>
			<bcs-input-date class="col-xs-8 "
				id="formPortafolioClienteAnotaciones_fechaValidoDesde"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_fechaValidoDesde'].Requerido === 'S'"
				k-ng-model = "data.fechaDesde">
			</bcs-input-date>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_FECHA_VALIDO_HASTA</label>
			<bcs-input-date class="col-xs-8 "
				id="formPortafolioClienteAnotaciones_fechaValidoHasta"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_fechaValidoHasta'].Requerido === 'S'"
				k-ng-model = "data.fechaHasta">
			</bcs-input-date>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_AMBITO</label>
			<bcs-combobox-base class="col-xs-8"
				tipo = "Combobox.oConfAmbito.tipo"
				id="formPortafolioClienteAnotaciones_ambito"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_ambito'].Requerido === 'S'"
				seleccionado = "data.AmbitoSeleccionado"
				id-actual = "data.Ambito"
				id-defecto = "data.AmbitoDefecto"
				filtros = "Combobox.oConfAmbito.filtros">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_RELEVANCIA</label>
			<bcs-combobox-base class="col-xs-8"
				tipo = "Combobox.oConfRelevancia.tipo"
				id="formPortafolioClienteAnotaciones_relevancia"
				bcs-requerido="camposRequeridos['formPortafolioClienteAnotaciones_relevancia'].Requerido === 'S'"
				seleccionado = "data.RelevanciaSeleccionado"
				id-actual = "data.Relevancia"
				id-defecto = "data.RelevanciaDefecto"
				todos = "'N'"
				filtros = "Combobox.oConfRelevancia.filtros">
			</bcs-combobox-base>
		</div>
	</form>
	<div class="row">
		<label class="col-xs-4" translate>UI_ARCHIVO</label>
		<form id="formSubirArchivo" name="formSubirArchivo">
			<input
					class="col-xs-8"
					type="file"
					id="file"
					name="file"
					ng-model="data.file"
			/>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button
			id="ModalPortafolioAnotaciones_aceptar"
			class="col-xs-3 pull-right"
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_ACEPTAR' | translate"
			bcs-habilitado="formPortafolioClienteAnotaciones.$valid"
			bcs-clic="Aceptar()"> </bcs-button>
		<bcs-button
			id="ModalPortafolioAnotaciones_cancelar"
			class="col-xs-3 pull-right"
			bcs-tipo="'bcs-button-secondary'"
			bcs-habilitado="'true'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-clic="Cancelar()"> </bcs-button>
	</div>
</div>

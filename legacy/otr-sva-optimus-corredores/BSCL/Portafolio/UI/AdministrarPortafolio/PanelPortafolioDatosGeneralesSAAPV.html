<div id="DatosGeneralSAAPV" ng-controller="DatosSAAPVCtrl as psaapv">
	<div class="col-xs-12 bcs-cuerpo">
		<div class="row">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_CONTRATOS_VIGENTES</label>
					<bcs-combobox-base 
						class="col-xs-7"
						id="UI_OPERACION"
						tipo="'combobox-folio-contratos-saapv'"
						filtros="psaapv.FolioContratoFiltro.filtros"
						id-actual="psaapv.FolioContratoSAAPV"
						seleccionado="psaapv.FolioContratoSeleccionado"
						auto-cargar="'true'">
					</bcs-combobox-base>
				</div>
			</div>
			<hr>
				<div class="row">
							<div class="col-xs-4">
								<label class="col-xs-5" translate>UI_NOMBRE_PLAN</label>
								<bcs-input-texto 
									class="col-xs-6"
									k-ng-disabled = "'true'"
									ng-model="psaapv.NombrePlan">
								</bcs-input-texto>
							</div>
							<div class="col-xs-4">
								<label class="col-xs-5" translate>UI_FOLIO</label>
								<bcs-input-texto 
									class="col-xs-6"
									id="UI_APV"
									ng-model="psaapv.FolioContratoSAAPV"
									k-ng-disabled = "'true'">
								</bcs-input-texto>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-4">
								<label class="col-xs-5" translate>UI_FECHA_SUSCRIPCION</label>
								<bcs-input-date 
									class="col-xs-6"
									id="UI_FECHA_SUSCRIP"
									k-ng-model="psaapv.kngFechaSuscripcion"
									k-ng-disabled = "'true'">
								</bcs-input-date>
							</div>
							<div class="col-xs-4">
								<label class="col-xs-5" translate>UI_FECHA_REGISTRO</label>
								<bcs-input-date 
									class="col-xs-6"
									id="UI_FECHA_REGISTRO"
									k-ng-model="psaapv.kngFechaRegistro"
									k-ng-disabled = "'true'">
								</bcs-input-date>
							</div>
							<div class="col-xs-4">
								<label class="col-xs-5" translate>UI_ESTADO_CONTRATO</label>
								<bcs-input-texto 
									class="col-xs-6"
									id="UI_CONTRATO_ESTADO"
									ng-model="psaapv.IdEstado"
									k-ng-disabled = "'true'">
								</bcs-input-texto>
							</div>
						</div>
						<hr>
						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-12 ng-scope" translate="">UI_EMPLEADOR</label>
							</div>
							
							<div class="col-xs-8">
								<label class="col-xs-2" translate="">UI_RAZON_SOCIAL</label>
								<bcs-input-texto 
									class="col-xs-10" 
									id="UI_RAZOS_SOCIAL"
									ng-model="psaapv.RazonSocial" 
									k-ng-disabled="'true'"
								>
								</bcs-input-texto>
							</div>
							
							<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_RUT_EMPLEADOR</label>
								<bcs-input-texto class="col-xs-6" 
									id="UI_EMPLEADOR_RUT" 
									ng-model="psaapv.RutEmpleador"
									k-ng-disabled="'true'"
								>
								</bcs-input-texto>
							</div>
						</div>
					<hr>
					<div class="row">
							<label class="col-xs-12 ng-scope" translate="">UI_TIPO_TRABAJADOR</label>
							<br>
							<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_INSTITUCION</label>
								<bcs-input-texto class="col-xs-6" 
								id="UI_INST_TIPO" 
								ng-model="psaapv.Institucion"
								k-ng-disabled="'true'"
								>
								</bcs-input-texto>
							</div>
						<div class="col-xs-4">
							<label class="col-xs-5 ng-scope" translate="">UI_NOMBRE_INSTITUCION</label>
							<bcs-input-texto class="col-xs-6" 
							id="UI_INST_NOMBRE"
							ng-model="psaapv.NombreInstitucion"
							k-ng-disabled="'true'"
							>
							</bcs-input-texto>
						</div>
					 <div class="col-xs-4">
						<label class="col-xs-5 ng-scope" translate="">UI_CODIGO</label>
						<bcs-input-texto class="col-xs-6" 
						id="UI_INST_CODIGO" 
						ng-model="psaapv.CodigoInstitucion"
						k-ng-disabled="'true'">
						</bcs-input-texto>
					 </div>
					</div>
				<div class="row">
               	 <div class="col-xs-4">
                	<label class="col-xs-5 ng-scope" translate="">UI_TRABAJADOR</label>
					<bcs-input-texto class="col-xs-6" 
						id="UI_TRABAJADOR" 
						ng-model="psaapv.Trabajador"
						k-ng-disabled="'true'">
					</bcs-input-texto>
				</div>
 				</div>
					<hr>
				<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-12 ng-scope" translate="">UI_ORIGEN_AHORRO</label>
								
							</div>
    			<div class="row">
						<div class="col-xs-4">
							<bcs-input-checkbox class="col-xs-1"
								id="UI_CHECK_CV"
								ng-model="psaapv.ChkCV"
								k-ng-model="psaapv.kngChkCV"
								k-ng-disabled="'true'"
							>
							</bcs-input-checkbox>
							<label class="col-xs-5 ng-scope" translate="">UI_APV</label>
						</div>
						<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_TIPO_PAGO_CV</label>
								<bcs-input-numero class="col-xs-6" 
									id="UI_PAGOCV_TIPO"
									k-ng-model="psaapv.kngMontoCV"
									k-ng-disabled="'true'"
								>
								</bcs-input-numero>
						</div>
						<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_PLAZO_INICIO</label>
								<bcs-input-date 
									class="col-xs-6"
									id="UI_PLAZO_INI"
									k-ng-model="psaapv.kngFechaInicio"
									k-ng-disabled = "'true'">
								</bcs-input-date>
        				</div>
				</div>
			</div>


				<div class="row">
							<div class="col-xs-4">
								<bcs-input-checkbox class="col-xs-1"
									id="UI_CHECK_DC"
									ng-model="psaapv.ChkDC"
									k-ng-model="psaapv.kngChkDC"
									k-ng-disabled="'true'"
								>
								</bcs-input-checkbox>
								<label class="col-xs-5 ng-scope" translate="">UI_DC</label>
							</div>
							<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_TIPO_PAGO_DC</label>
								<bcs-input-numero class="col-xs-6" 
									id="UI_PAGODC_TIPO" 
									k-ng-model="psaapv.kngMontoDC"
									k-ng-disabled="'true'"
								>
								</bcs-input-numero>
							</div>
    			<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_PLAZO_TERMINO</label>
								<bcs-input-date 
									class="col-xs-6"
									id="UI_PLAZO_TER"
									k-ng-model="psaapv.kngFechaTermino"
									k-ng-disabled = "'true'">
								</bcs-input-date>
						</div>
				</div>


				<div class="row">
							
					    <div class="row">
							<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_ULTIMA_COTIZACION</label>
								<bcs-input-numero class="col-xs-6" 
									id="UI_ULTIMA_COT" 
									k-ng-model="psaapv.UltimaCotizacion"
									k-ng-disabled="'true'"
								>
								</bcs-input-numero>
							</div>
						</div>
				</div>
				    <hr>
				    	
					<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-12 ng-scope" translate="">UI_REGIMEN_TRIBUTARIO</label>
 						   </div>
							<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_REGIMEN</label>
								<bcs-input-texto class="col-xs-6" 
									k-ng-disabled="'true'" 
									id="UI_REGIMEN" 
									ng-model="psaapv.Regimen"
								>
								</bcs-input-texto>
							</div>
					</div>


					<hr>
					
				  <div class="row">
							<div class="col-xs-12">
								<label class="col-xs-12 ng-scope" translate="">UI_FORMA_PAGO</label>
    						</div>
                                
						<div class="col-xs-4">
   							 <label class="col-xs-5 ng-scope" translate="">UI_TIPO</label>
							<bcs-input-texto class="col-xs-6" 
								id="UI_FORMAPAGO_TIPO"
								ng-model="psaapv.TipoPago" 
								k-ng-disabled="'true'"
							>
							</bcs-input-texto>
						</div>
							<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_FORMA</label>
								<bcs-input-texto class="col-xs-6" 
									id="UI_FORMA" 
									ng-model="psaapv.FormaPago"
									k-ng-disabled="'true'"
								>
							</bcs-input-texto>
							</div>
						<div class="col-xs-4">
								<label class="col-xs-5 ng-scope" translate="">UI_DIA_DSCTO</label>
								<bcs-input-numero class="col-xs-6" 
									id="UI_DIA_DSCTO" 
									k-ng-model="psaapv.DiaDescuento" 
									k-ng-disabled="'true'"
								>
								</bcs-input-numero>
							</div>
						</div>
						<hr>
						
						<div class="row">
    						<div class="col-xs-2">
							<bcs-button id="UI_MODIFICAR_CONTRATO" 
								bcs-auto-desactivar="false" 
								bcs-texto="'UI_MODIFICAR_CONTRATO' | translate" 
								bcs-habilitado="!psaapv.bloqueoModificar" 
								bcs-clic="psaapv.VentanaContratoSAAPV('M')">
							</bcs-button>	
  						    </div>
					</div>
			</div>
		</div>
</div>

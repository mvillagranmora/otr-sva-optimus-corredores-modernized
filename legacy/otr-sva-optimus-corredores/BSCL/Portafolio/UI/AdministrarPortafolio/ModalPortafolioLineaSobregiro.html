<div id="ModalPortafolioLineaSobregiro" class="row" ng-controller="ModalPortafolioLineaSobregiroCtrl as mpLS">
	<div class="row">
		<form name="ModalPortafolioLineaSobregiro" class="col-xs-12">
			<div class="row">
		  		<label class="col-xs-4" translate>UI_NOMBRE_LIMITE</label>
				<bcs-input-texto class="col-xs-8" bcs-requerido ng-model="mpLS.respuesta.Nombre"></bcs-input-texto>
		  	</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_MONEDA</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-moneda-tesoreria'"
					id-actual="mpLS.respuesta.IdMoneda"
					id-defecto="mpLS.respuesta.IdMonedaDef"
					todos="'N'"
					bcs-requerido
					filtros = "mpLS.cmbbx.Moneda.filtros"
					seleccionado="mpLS.dataModal.MonedaObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_MONTO_LIMITE_SOBREGIRO</label>
				<bcs-input-numero class="col-xs-8" 
					bcs-requerido 
					k-ng-model="mpLS.respuesta.MontoTotal" 
					decimales="mpLS.win.MontoDecimal">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-estado-limites'"
					id-actual="mpLS.respuesta.Estado"
					id-defecto="mpLS.respuesta.EstadoDef"
					filtros="mpLS.cmbbx.Estado.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mavld.dataModal.EstadoObj">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<br>
	<div class="row bcs-panel-comandos">
		<bcs-button id={{mpLS.IdBotonAceptar}} class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalPortafolioLineaSobregiro.$valid" bcs-clic="mpLS.aceptar();">
		</bcs-button>
		<bcs-button id="ModalPortafolioLineaSobregiro_cancelar" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mpLS.cancelar();">
		</bcs-button>
	</div>
</div>

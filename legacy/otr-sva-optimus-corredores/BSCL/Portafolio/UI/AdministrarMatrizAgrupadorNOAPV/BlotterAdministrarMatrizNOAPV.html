<div id="BlotterAdministrarMatrizNOAPV" class="col-xs-12" ng-controller="BlotterAdministrarMatrizNOAPVCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
			  	<div class="col-xs-4">
			  		<label class="col-xs-4" translate>UI_ES_ADC</label>
			  		<bcs-input-checkbox  ng-model="EsADC"></bcs-input-checkbox>
			  	</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-matriz-no-apv"
			 	configuracion="defaultOptions"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2" id="BlotterAdministrarMatrizNOAPV_IngresarMatriz" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_INGRESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ingresar()">
			</bcs-button>
			<bcs-button class="col-xs-2" id="BlotterAdministrarMatrizNOAPV_ModificarMatriz" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="modificar(datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-2" id="BlotterAdministrarMatrizNOAPV_EliminarMatriz" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ELIMINAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="eliminar(datos.kNgModel)">
			</bcs-button>
		</div>
		
	</div>
</div>

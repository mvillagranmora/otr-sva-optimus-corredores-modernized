<div id="CrearMatrizNOAPV" class="col-xs-12" ng-controller="CrearMatrizNOAPVCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<form name="CrearMatrizNOAPVForm" class="filters-formulario">
			<div class="row">
				<label class="col-xs-3" translate>UI_CODIGO_PORTAFOLIO</label>
				<bcs-input-texto 
					class="col-xs-9"
					bcs-requerido
					ng-model="data.CodigoPortafolio">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_ES_ADC</label>
				<bcs-input-checkbox ng-model="data.EsADC"></bcs-input-checkbox>
			</div>
			<hr>
			<div class="row bcs-panel-comandos">
				<div class="col-xs-12 alignButtonsToRight">
					<bcs-button class="col-xs-3" id="Guardar" 
						bcs-texto="'UI_GUARDAR' | translate" 
						bcs-habilitado="CrearMatrizNOAPVForm.$valid"
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="false"
						bcs-clic="guardar()">
					</bcs-button>
				</div>
			</div>
		</form>
	</div>
</div>

<div id="MantenedorPortafolio"class="col-xs-12" ng-controller="MantenedorPortafolioCtrl as portm">
   

	<div class="row">
		<bcs-grid 
			id="grilla.Portafolio"
			 configuracion="portm.grilla.Portafolio"
			seleccionado="portm.grilla.PortSel"
			fn-doble-click="portm.win.eliminar(portm.grilla.PortSel)"
					>	
			<!--//fn-exportar-excel = "exportarExcel"
			bcs-habilitado="portm.grilla.portSel !== undefined "
			-->	
		</bcs-grid>
	</div>

	
			<div class="row bcs-panel-comandos alignButtonsToRight">
				
					<bcs-button class="col-xs-2" id="AgregarPortafolio" 
						bcs-tipo="'bcs-button-primary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_AGREGAR' | translate"
						bcs-habilitado="'true'" 
						bcs-clic="portm.win.agregar()">
					</bcs-button>
				
				
					<bcs-button class="col-xs-2" id="EliminarPortafolio" 
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_ELIMINAR' | translate"
						bcs-clic="portm.win.eliminar(portm.grilla.PortSel)"
						bcs-habilitado="!!portm.grilla.PortSel">
					</bcs-button>
				
			</div>	

</div>

<div id="ModalModificarSupervisorAEjecutivos" class="col-xs-12" ng-controller="ModalModificarSupervisorAEjecutivosCtrl">
	<form name="formModalModificarSupervisorAEjecutivos" class="col-xs-12 form-horizontal">

			<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<div class="col-xs-12">
							  <label class="col-xs-3" translate>UI_SUPERVISOR</label>
							<bcs-combobox-base  bcs-requerido
								tipo="'combobox-supervisor'" 
								id-actual="data.IdEmpleadoSupervisor"
								class="col-xs-9"
								filtros="data.Supervisor.filtros"
								todos="'N'">
							</bcs-combobox-base>
						</div>
					  </div>
				</div>
			</div>
		</div>
		<div class="row bcs-panel-comandos alignButtonsToRight">
					<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-primary'"
						bcs-auto-desactivar="true" bcs-texto="'UI_MODIFICAR' | translate"
						bcs-habilitado="formModalModificarSupervisorAEjecutivos.$valid"
						bcs-clic="Modificar()"> 
					</bcs-button>
		</div>
	</form>
</div>

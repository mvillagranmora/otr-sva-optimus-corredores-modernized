<div id="ModalEjecutivo" class="col-xs-12" ng-controller="ModalEjecutivoCtrl">
	<form name = "formEjecutivo" class="row">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_SUPERVISOR</label>
						<bcs-combobox-base 
							bcs-requerido
							tipo="'combobox-supervisor'" 
							class="col-xs-9"
							filtros = "filtrosSupervisor"
							id-actual="data.IdEmpleadoSupervisor"
							id-defecto= "data.IdEmpleadoSupervisorDefecto"
							todos="'N'">
						</bcs-combobox-base>
					</div>
			  	</div>
				<div class="row">
					<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_EMPLEADO</label>
						<bcs-combobox-base 
							bcs-requerido
							tipo="'combobox-empleado'" 
							filtros = "filtrosEjecutivo"
							class="col-xs-9"
							id-actual="data.IdEmpleadoEjecutivo"
							todos="'N'">
						</bcs-combobox-base>
					</div>
			  	</div>
				<div class="row">
				  	<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_ESTADO</label>
				  		<bcs-combobox-base 
				  			bcs-requerido
				  			tipo="'combobox-estado-empleado'"
					  		class="col-xs-9" 
					  		id-actual="data.IdEstado"
					  		id-defecto="'ACT'" 
					  		todos="'N'">
					  	</bcs-combobox-base>
					</div>
			  	</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		
			<bcs-button class="col-xs-3" id="ModalSupervisor_crearSupervisor"
				bcs-habilitado = "formEjecutivo.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_INGRESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ValidarIngreso()">
			</bcs-button>	
		
	</div>
</div>

<div class="row" ng-controller="ConsultarForwardPorVencer">
   <div class="row bcs-cuerpo">
	  <div class="row">
	  
	     <!-- INICIO FILTROS -->
		 <div class="col-xs-10">
		    <div class="row">
		      <div class="col-xs-6">
			    <label class="col-xs-3" translate>UI_NOMBRE_AGENTE</label>
			    <bcs-combobox-base class="col-xs-8"
			        id = "ConsultarForwardPorVencerForm_Agente"
    				bcs-requerido				    
					tipo="data.oConfiguracionAgente.tipo"
					filtros="data.oConfiguracionAgente.filtros"
					id-actual = "data.oConfiguracionAgente.idActual"
					seleccionado = "data.oConfiguracionAgente.seleccionado">
				</bcs-combobox-base >
			  </div>
					
			  <div class="col-xs-5">
				<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
				<bcs-input-date class="col-xs-5" 
				    id="UI_FECHA_CONSULTA"
					k-ng-model="data.kngFechaOperacion">
				</bcs-input-date>
			  </div>
			</div>
		 </div>
		 <!-- FIN FILTROS -->
				
		 <!-- INICIO BOTONES -->
		 <div class="col-xs-2">
		    <div class="row"> 
  			  <bcs-button class="col-xs-12" 
  				 bcs-tipo="'bcs-button-search'" 
  				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_BUSCAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="buscar()"> 
			  </bcs-button>
		    </div>  
				   
			<div class="row">					
			  <bcs-button class="col-xs-12" 
				 bcs-tipo="'bcs-button-secondary'" 
				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_LIMPIAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="limpiarFiltros()"> 
			  </bcs-button>					
			</div>	  
		 </div>
		 <!-- FIN BOTONES -->		 
	  </div>			
	  
	  
	  <!-- INICIO GRILLA DETALLE REGISTRO -->						
	  <div class="row">
		 <bcs-grid id="grid-FWD-Vencer" 
		     configuracion="confBasicaFwdPorVencer"
			 seleccionado="seleccionFwdPorVencer"
			 fn-exportar-excel="exportarExcel"
			 api="gridApiFwdPorVencer"> 
		 </bcs-grid>
	  </div>
	  <!-- FIN GRILLA DETALLE REGISTRO -->
   </div>	
</div>

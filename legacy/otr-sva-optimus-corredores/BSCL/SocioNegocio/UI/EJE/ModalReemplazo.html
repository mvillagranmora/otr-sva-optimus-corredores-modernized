<div id="ModalEjecutivo" class="col-xs-12" ng-controller="ModalReemplazoCtrl">
 <form name="formModalReemplazoClientes" class="col-xs-12 form-horizontal">
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
				  		<label class="col-xs-4" translate>UI_EJECUTIVO_REEMPLAZO</label>
						<bcs-combobox-base 
							tipo="'combobox-ejecutivo'"  bcs-requerido
							class="col-xs-8"
							id-actual="data.IdEmpleadoReemplazo"
							id-defecto= "data.IdEmpleadoReemplazoDefecto"
							filtros="data.filtroEjecutivo"
							todos="'N'">
						</bcs-combobox-base>
					</div>
			  	</div>
				<div class="row">
					<div class="col-xs-12">
				  		<label class="col-xs-4" translate>UI_FECHA_INICIO</label>
						<bcs-input-date 
				  			k-ng-model="data.FechaInicio" bcs-requerido
					  		class="col-xs-8">
					  	</bcs-input-date>
					</div>
			  	</div>
				<div class="row">
				  	<div class="col-xs-12">
				  		<label class="col-xs-4" translate>UI_FECHA_FIN</label>
				  		<bcs-input-date 
				  			k-ng-model="data.FechaFin" bcs-requerido
					  		class="col-xs-8">
					  	</bcs-input-date>
					</div>
			  	</div>
			</div>
		</div>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		
			<bcs-button class="col-xs-3" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="formModalReemplazoClientes.$valid && data.FechaFin >= data.FechaInicio"
				bcs-clic="Ingresar()">
			</bcs-button>	
		
	</div>
	</form>
</div>

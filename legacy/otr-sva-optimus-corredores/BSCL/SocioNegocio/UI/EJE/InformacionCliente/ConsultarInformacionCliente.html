<div class="row" ng-controller="ConsultarInformacionCliente">
   <div class="row bcs-cuerpo">
	  <div class="row">
	  
	     <!-- INICIO FILTROS -->
		 <div class="col-xs-10">
		    <div class="row">
		      <div class="col-xs-6">
			    <label class="col-xs-3" translate>UI_NOMBRE_AGENTE</label>
			    <bcs-combobox-base class="col-xs-8"
			        id = "ConsultarInformacionCliente_Agente"
    				bcs-requerido				    
					tipo="data.oConfiguracionAgente.tipo"
					filtros="data.oConfiguracionAgente.filtros"
					id-actual = "data.oConfiguracionAgente.idActual"
					seleccionado = "data.oConfiguracionAgente.seleccionado">
				</bcs-combobox-base >
			  </div>
					
			  <div class="col-xs-5">
				<label class="col-xs-3" translate>UI_TIPO_PERSONA</label>
				<bcs-combobox-base class="col-xs-8"
			        id = "ConsultarInformacionCliente_TipPersona"
    				bcs-requerido				    
					tipo="data.oConfiguracionTipPersona.tipo"
					filtros="data.oConfiguracionTipPersona.filtros"
					id-actual = "data.oConfiguracionTipPersona.idActual"
					seleccionado = "data.oConfiguracionTipPersona.seleccionado"
					todos="'S'"
					id-defecto="'0'">
				</bcs-combobox-base >
			  </div>
			</div>
		 </div>
		 <!-- FIN FILTROS -->
				
		 <!-- INICIO BOTONES -->
		 <div class="col-xs-2">
		    <div class="row"> 
  			  <bcs-button class="col-xs-12" 
  				 bcs-tipo="'bcs-button-search'" 
  				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_BUSCAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="buscarRegistros()"> 
			  </bcs-button>
		    </div>  
				   
			<div class="row">					
			  <bcs-button class="col-xs-12" 
				 bcs-tipo="'bcs-button-secondary'" 
				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_LIMPIAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="limpiarFiltros()"> 
			  </bcs-button>					
			</div>	  
		 </div>
		 <!-- FIN BOTONES -->		 
	  </div>			
	  
	  
	  <!-- INICIO GRILLA DETALLE REGISTRO -->						
	  <div class="row">
		 <bcs-grid id="grid-Inf-Cliente" 
		     configuracion="confBasicaInfCliente"
			 seleccionado="seleccionInfCliente"
			 fn-exportar-excel="exportarExcel"
			 > 
		 </bcs-grid>
	  </div>
	  <!-- FIN GRILLA DETALLE REGISTRO -->
   </div>	
</div>

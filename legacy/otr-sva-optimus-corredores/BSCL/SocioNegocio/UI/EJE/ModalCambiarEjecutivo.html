<div id="ModalEjecutivo" class="col-xs-12" ng-controller="ModalCambiarEjecutivoCtrl">
	<div class="row bcs-cuerpo">
		<form name="ModelEjecutivoForm" id="ModelEjecutivoForm">
		<div class="row">
			<div class="col-xs-12">
			  	<div class="row">
					<div class="col-xs-12">
						<label translate class="col-xs-3">UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base 
							id = "ModalEjecutivo_comboPortafolio"
							class="col-xs-9"
							tipo="'combobox-cliente-portafolio'"
							muestra-enlace = "'N'"
							auto-cargar="'true'"
							bcs-requerido
							id-actual = "data.datosForm.configuracionPortafolio.idActual"
							id-defecto="data.IdPortafolioDefecto"
							seleccionado = "data.portafolioSeleccionado">
						</bcs-combobox-base >
					</div>
			  	</div>


				<div class="row">
				  	<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_EJECUTIVO</label>
						<bcs-combobox-base 
							tipo="'combobox-ejecutivo'" 
							class="col-xs-9"
							bcs-requerido
							id-actual="data.IdEmpleadoEjecutivo"
							id-defecto= "data.IdEmpleadoEjecutivoDefecto"
							todos="'N'">
						</bcs-combobox-base>
					</div>
			  	</div>
			  	<div class="row">
				  	<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_PRINCIPAL</label>
						<bcs-input-checkbox 
							class="col-xs-9"
							ng-model="data.EjecutivoPrincipal">
						</bcs-input-checkbox>
					</div>
			  	</div>
			  	<div class="row">
				  	<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_CLIENTE_PRIVADO</label>
						<bcs-input-checkbox 
							class="col-xs-9"
							ng-model="data.ClientePrivado">
						</bcs-input-checkbox>
					</div>
			  	</div>
			</div>
		</div>
	</div>
	</form>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		
			<bcs-button class="col-xs-3" id="ModalReemplazo_crearEjecutivoReemplazo" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="ModelEjecutivoForm.$valid" 
				bcs-clic="Modificar()">
			</bcs-button>	
		
	</div>
</div>

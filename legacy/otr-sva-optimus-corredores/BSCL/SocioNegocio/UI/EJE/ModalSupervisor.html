<div id="ModalSupervisor" class="col-xs-12" ng-controller="ModalSupervisorCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_EMPLEADO</label>
						<bcs-combobox-base 
							tipo="'combobox-empleado'" 
							class="col-xs-9"
							id-actual="data.IdEmpleadoSupervisor"
							todos="'N'">
						</bcs-combobox-base>
					</div>
			  	</div>
				<div class="row">
				  	<div class="col-xs-12">
				  		<label class="col-xs-3" translate>UI_ESTADO</label>
				  		<bcs-combobox-base 
				  			tipo="'combobox-estado-empleado'"
					  		class="col-xs-9" 
					  		id-actual="data.IdEstado"
					  		id-defecto="'ACT'" 
					  		todos="'N'">
					  	</bcs-combobox-base>
					</div>
			  	</div>
			</div>
		</div>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		
			<bcs-button class="col-xs-3" id="ModalSupervisor_crearSupervisor" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_INGRESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="Ingresar()">
			</bcs-button>	
		
	</div>
</div>

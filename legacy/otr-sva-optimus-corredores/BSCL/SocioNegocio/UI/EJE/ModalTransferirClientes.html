<div id="ModalEjecutivo" class="col-xs-12" ng-controller="ModalTransferirClientesCtrl">
	<form name="formModalTransferirClientes" class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<div class="col-xs-12">
							<label class="col-xs-3" translate>UI_EJECUTIVO_ANTIGUO</label>
							<bcs-combobox-base tipo="'combobox-ejecutivo'" bcs-requerido
								class="col-xs-9" id-actual="data.IdEmpleadoEjecutivoAnterior"
								filtros = "filtroEjecutivo.ejecutivo.filtros"
								id-defecto="data.IdEmpleadoEjecutivoAnteriorDefecto">
							</bcs-combobox-base>
						</div>
					</div>
					<div class="row">
						<div class="col-xs-12">
							<label class="col-xs-3" translate>UI_EJECUTIVO_NUEVO</label>
							<bcs-combobox-base tipo="'combobox-ejecutivo'" bcs-requerido
								class="col-xs-9" id-actual="data.IdEmpleadoEjecutivoNuevo"
								filtros = "filtroEjecutivo.ejecutivo.filtros"
								> </bcs-combobox-base>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="row bcs-panel-comandos alignButtonsToRight">

			<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="true" bcs-texto="'UI_MODIFICAR' | translate"
				bcs-habilitado="formModalTransferirClientes.$valid"
				bcs-clic="Transferir()"> </bcs-button>

		</div>
	</form>
</div>

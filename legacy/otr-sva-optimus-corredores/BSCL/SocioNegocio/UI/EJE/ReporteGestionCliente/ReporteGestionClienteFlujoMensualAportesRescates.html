<div class="row" ng-controller="ReporteGestionClienteFlujoMensualAportesRescates">
   <div class="row bcs-cuerpo">
   <form name="frmConsultaGestionCliente">
	  <div class="row">
	  
	     <!-- INICIO FILTROS -->
		 <div class="col-xs-10">
		    <div class="row">
		      <div class="col-xs-6">
			    <label class="col-xs-4" translate>UI_NOMBRE_EJECUTIVO</label>
			    <bcs-combobox-base class="col-xs-8" 
			        id = "IdAgente"
    				bcs-requerido
    				todos="'S'"
					tipo="data.oConfiguracionAgente.tipo"
					filtros="data.oConfiguracionAgente.filtros"
					id-actual = "data.oConfiguracionAgente.idActual"
					seleccionado = "data.oConfiguracionAgente.seleccionado">
				</bcs-combobox-base >			    
			  </div>
					
			  <div class="col-xs-6">
				<label class="col-xs-4" translate>UI_ANIO</label>
				<bcs-input-date class="col-xs-8" 
				    id="UI_FECHA_CONSULTA"
				    k-options="data.kngFechaOperacionConf"
					k-ng-model="data.kngFechaOperacion"
					todo-dias="'true'"
					bcs-requerido="'true'">
				</bcs-input-date>
			  </div>
			</div>
		 </div>
		 <!-- FIN FILTROS -->
				
		 <!-- INICIO BOTONES -->
		 <div class="col-xs-2">
		    <div class="row"> 
  			  <bcs-button class="col-xs-12" 
  				 bcs-tipo="'bcs-button-search'" 
  				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_BUSCAR' | translate" 
				 bcs-habilitado="frmConsultaGestionCliente.$valid"
				 bcs-clic="buscar()"> 
			  </bcs-button>
		    </div>  
				   
			<div class="row">					
			  <bcs-button class="col-xs-12" 
				 bcs-tipo="'bcs-button-secondary'" 
				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_LIMPIAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="limpiarFiltros()"> 
			  </bcs-button>					
			</div>	  
		 </div>
		 <!-- FIN BOTONES -->		 
	  </div>			
	 </form> 
	  
	  <!-- INICIO GRILLA DETALLE REGISTRO -->						
	  <div class="row">
		 <bcs-grid id="grid-ConsultaCliente" 
		     configuracion		= "confBasicaReporteGestionCliente"
			 seleccionado		= "seleccionReporteGestionCliente"
			 fn-exportar-excel	= "exportarExcel"
			 api				= "gridApiReporteGestionCliente"> 
		 </bcs-grid>
		 
	  </div>
	  <!-- FIN GRILLA DETALLE REGISTRO -->
   </div>	
</div>
<style>
	.columnaNumero{
		text-align: right !important;
	}
	
	.columnaTexto{
		text-align: left !important;
	}
	
	.HeaderCenter{
		text-align: center !important;
	}	

</style>

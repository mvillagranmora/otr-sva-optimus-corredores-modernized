<div class="row" ng-controller="ReporteGestionCliente">
   <div class="row bcs-cuerpo">
   <form name="frmConsultaGestionCliente">
	  <div class="row">
	  
	     <!-- INICIO FILTROS -->
		 <div class="col-xs-10">
		    <div class="row">
		      <div class="col-xs-6">
			    <label class="col-xs-3" translate>UI_INSTRUMENTO</label>
			   <bcs-input-instrumentos 
			   			class="col-xs-9" 
						id="UI_INSTRUMENTO" 
						name="uInstrumento"
						datos-instrumento="data.instrumentoDatos"
						buscar-instrumento="oConfiguracionInstrumento.buscar"
						filtro-estado = "'ACT'"	
						bcs-requerido="'true'">
				</bcs-input-instrumentos>
			  </div>
					
			  <div class="col-xs-6">
				<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
				<bcs-input-date class="col-xs-9" 
				    id="UI_FECHA_CONSULTA"
				    k-options="data.kngFechaOperacionConf"
					k-ng-model="data.kngFechaOperacion"
					bcs-requerido="'true'">
				</bcs-input-date>
			  </div>
			</div>
		 </div>
		 <!-- FIN FILTROS -->
				
		 <!-- INICIO BOTONES -->
		 <div class="col-xs-2">
		    <div class="row"> 
  			  <bcs-button class="col-xs-12" 
  				 bcs-tipo="'bcs-button-search'" 
  				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_BUSCAR' | translate" 
				 bcs-habilitado="frmConsultaGestionCliente.$valid"
				 bcs-clic="buscar()"> 
			  </bcs-button>
		    </div>  
				   
			<div class="row">					
			  <bcs-button class="col-xs-12" 
				 bcs-tipo="'bcs-button-secondary'" 
				 bcs-auto-desactivar="false"
				 bcs-texto="'UI_LIMPIAR' | translate" 
				 bcs-habilitado="true"
				 bcs-clic="limpiarFiltros()"> 
			  </bcs-button>					
			</div>	  
		 </div>
		 <!-- FIN BOTONES -->		 
	  </div>			
	 </form> 
	  
	  <!-- INICIO GRILLA DETALLE REGISTRO -->						
	  <div class="row">
		 <new-bcs-grid id="grid-ConsultaCliente" 
		     configuracion="confBasicaReporteGestionCliente"
			 seleccionado="seleccionReporteGestionCliente"
			 fn-exportar-excel="exportarExcel"
			 api="gridApiReporteGestionCliente"> 
		 </new-bcs-grid>
	  </div>
	  <!-- FIN GRILLA DETALLE REGISTRO -->
   </div>	
</div>

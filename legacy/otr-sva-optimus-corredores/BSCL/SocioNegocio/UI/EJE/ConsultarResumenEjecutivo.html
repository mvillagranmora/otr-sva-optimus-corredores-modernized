<div id="ConsultaResumenEjecutivo" class="col-xs-12" ng-controller="ConsultaResumenEjecutivoCtrl">
	<div class="row bcs-cuerpo">
		<!-- Datos Basicos Ejecutivo-->
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4 k-window-subtitle" style="font-size:10px;" translate>UI_NOMBRE</label>
				<label class="col-xs-8" >{{data.ejecutivo.NombreEjecutivo}}</label>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-4 k-window-subtitle" style="font-size:10px;" translate>UI_JEFE_DIRECTO</label>
				<label class="col-xs-8" >{{data.ejecutivo.JefeDirecto}}</label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4 k-window-subtitle" style="font-size:10px;" translate>UI_CORREO</label>
				<label class="col-xs-8" >{{data.ejecutivo.Direccion}}</label>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-4 k-window-subtitle" style="font-size:10px;" translate>UI_SUPERVISOR</label>
				<label class="col-xs-8" >{{data.ejecutivo.Supervisor}}</label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4 k-window-subtitle" style="font-size:10px;" translate>UI_TELEFONO</label>
				<label class="col-xs-8" >{{data.ejecutivo.Telefono}}</label>
			</div>
		</div>
	</div>
	<hr>
	<div class="row">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-8 k-window-subtitle" style="font-size:10px;" translate>UI_ASUNTOS_PENDIENTES</label>
				<label class="col-xs-4" ><a ng-click="openDetalle('ConsultarAsuntosPendientes')" href="#">{{data.resumen.AsuntosPendientes}}</a></label>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-8 k-window-subtitle" style="font-size:10px;" translate>UI_AUTORIZACIONES_PENDIENTE</label>
				<label class="col-xs-4" ><a ng-click="openDetalle('Autorizaciones')" href="#">{{data.resumen.AutorizacionesPendientes}}</a></label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-8 k-window-subtitle" style="font-size:10px;" translate>UI_CLIENTES_ACTIVOS</label>
				<label class="col-xs-4" ><a ng-click="openDetalle('ConsultarSocioNegocio')" href="#">{{data.resumen.ClientesActivos}}</a></label>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-8 k-window-subtitle" style="font-size:10px;" translate>UI_PORTAFOLIOS_ACTIVOS</label>
				<label class="col-xs-4" ><a ng-click="openDetalle('ConsultarSocioNegocio')" href="#">{{data.resumen.PortafoliosActivos}}</a></label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-8 k-window-subtitle" style="font-size:10px;" translate>UI_ORDENES_VIGENTES</label>
				<label class="col-xs-4" ><a ng-click="abrirOrdenesVigentes()" href="#">{{data.resumen.OrdenesAccionesVigentes}}</a></label>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-8 k-window-subtitle" style="font-size:10px;" translate>UI_ORDENS_FFMM_VIGENTES</label>
				<label class="col-xs-4" ><a ng-click="openDetalle('BlotterFFM')" href="#">{{data.resumen.OrdenesFfmmVigentes}}</a></label>
			</div>
		</div>
	</div>
</div>

<div class="row" ng-controller='BloqueoAutomaticoClientesCtrl as bloautocli'>
	<form name="formBloqueoAutomaticoClientes" class="col-xs-12 form-horizontal"> 
		<div class="row">
			<label class="col-xs-12" translate>UI_BLOQUEO_AUTOMATICO_VENCIMIENTO_DOCUMENTOS</label>
		</div>
		<div class="row">
			<div class="row"> 
				 <bcs-grid id="grid-config-bloqueo-documentosVencidos"
				 	configuracion ="bloautocli.grid.documentos"
					seleccionado = "bloautocli.datos.seleccionadoDocumentos">
		    	</bcs-grid> 
			</div>
		</div>
		<div class="row">
			<div class="col-xs-8"></div>
			<bcs-button 
				class="col-xs-2" 
				bcs-tipo="'bcs-button-input-form'"  
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTIVAR' | translate" 
				bcs-habilitado="true"  
				bcs-clic="bloautocli.win.activar(bloautocli.datos.seleccionadoDocumentos)">
			</bcs-button>
			<bcs-button 
				class="col-xs-2" 
				bcs-tipo="'bcs-button-input-form'"  
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_DESACTIVAR' | translate" 
				bcs-habilitado="true"  
				bcs-clic="bloautocli.win.desactivar(bloautocli.datos.seleccionadoDocumentos)">
			</bcs-button>
		</div>
		<hr>
		<div class="row">
			<label class="col-xs-7" translate>UI_BLOQUEO_CUMPLIR_MAYORIA_EDAD</label>
			<bcs-input-numero class="col-xs-3"
				bcs-requerido = "true"
				k-ng-model="bloautocli.anosAlCumplirMayoriaEdad"  
				decimales="0"
				k-ng-disabled="false">
			</bcs-input-numero>
			<label class="col-xs-2" translate>UI_AÑOS</label>
		</div>
		<div class="row">
			<label class="col-xs-7" translate>UI_BLOQUEO_FICHA_DESACTUALIZADA</label>
			<bcs-input-numero class="col-xs-3"
				bcs-requerido = "true"
				k-ng-model="bloautocli.mesesFichaDesactualizada"  
				decimales="0"
				k-ng-disabled="false">
			</bcs-input-numero>
			<label class="col-xs-2" translate>UI_MESES</label>
		</div>
		<div class="row">
			<label class="col-xs-7" translate>UI_BLOQUEO_PORTAFOLIO_SIN_OPERACIONES</label>
			<bcs-input-numero class="col-xs-3"
				bcs-requerido = "true"
				k-ng-model="bloautocli.mesesPortafolioSinOperaciones"  
				decimales="0"
				k-ng-disabled="false">
			</bcs-input-numero>
			<label class="col-xs-2" translate>UI_MESES</label>
		</div>
		<hr>
	</form>
	<div class="row col-xs-12 alignButtonsToRight">
		<bcs-button 
			class="col-xs-2" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="formBloqueoAutomaticoClientes.$valid"
			bcs-clic="bloautocli.win.guardar()">
		</bcs-button>
	</div>
</div>

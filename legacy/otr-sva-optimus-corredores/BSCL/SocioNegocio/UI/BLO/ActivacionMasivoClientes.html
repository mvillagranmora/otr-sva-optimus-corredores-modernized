<div id="ActivacionMasivaClientes" ng-controller="ActivacionMasivaClientesCtrl">
	
	<div class="row">
		<div class="col-xs-12">
				<!-- Inicio filtros de búsqueda -->
				<form name="formBloqueoClientes">	
				<div class="row">
					<div class="col-xs-12">
				  		<label class="col-xs-4" translate>UI_CARGAR_ARCHIVO_CLIENTES</label>
						<bcs-button bcs-habilitado="true" class="col-xs-8" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'Cargar archivo'" bcs-clic="cargarArchivo()"></bcs-button>				
					</div>
			  	</div>
				
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_MOTIVO_ACTIVACION_CLIENTE</label>
						<bcs-combobox-base id="ActivacionMasivaClientes_MotivoBloqueoCliente" 
						tipo="data.oConfiguracionTipoBloqueoCliente.tipo"
						filtros="data.oConfiguracionTipoBloqueoCliente.filtros"
						class="col-xs-8" 
						id-actual = "data.oConfiguracionTipoBloqueoCliente.idActual"
						tipo="'combobox-tipo-bloqueo-socio-negocio'">
						</bcs-combobox-base>
					</div>					
			  	</div>
			  	<div class="row">
			  		<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_MOTIVO_ACTIVACION_PORTAFOLIO</label>
						<bcs-combobox-base id="ActivacionMasivaClientes_MotivoBloqueoPortafolio" 
						tipo="data.oConfiguracionTipoBloqueoPortafolio.tipo"
						filtros="data.oConfiguracionTipoBloqueoPortafolio.filtros"
						class="col-xs-8" 
						id-actual = "data.oConfiguracionTipoBloqueoPortafolio.idActual"
						tipo="'combobox-tipo-bloqueo-socio-negocio'">
						</bcs-combobox-base>
					</div>
			  	</div>
			  	</form>
				<!-- Fin filtros de búsqueda -->
		</div>
	</div>
 	<div class="row"></div>
 	
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="row col-xs-4" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="config.bloquear==false"  bcs-clic="limpiarDatos()"></bcs-button>	
		<bcs-button class="row col-xs-4" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_ACTIVAR' | translate"  bcs-habilitado="config.bloquear==false"  bcs-clic="activar()"></bcs-button>
	</div>
	
</div>

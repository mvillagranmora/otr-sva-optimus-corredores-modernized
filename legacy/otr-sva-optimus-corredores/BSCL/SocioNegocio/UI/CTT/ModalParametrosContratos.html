<div  ng-controller="ModalParametrosContratosCtrl">
	
	<!-- campos dinamicamente de acuerdo a la tabla de parametros para el contrato seleccionado -->

	<div ng-repeat="btn in parametros">
		<div class="row">
			<label class="col-xs-4">{{btn.Descripcion|translate}}</label>
			<bcs-input-texto ng-model="btn.Valor" class="col-xs-8"></bcs-input-texto>
		</div>
	</div>

	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
			bcs-texto="'UI_IMPRIMIR_CONTRATO' | translate"
			bcs-habilitado="'false'" bcs-clic="imprimirArchivo()"></bcs-button>
	</div>

</div>

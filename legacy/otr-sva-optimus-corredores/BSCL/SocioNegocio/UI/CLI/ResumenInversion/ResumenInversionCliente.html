<div class="col-xs-12" ng-controller="ResumenInversionClienteCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
    		
    		 
			 <div class="row" >
	            <div class="col-xs-10">		                 
	                 <label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
					<bcs-combobox-base class="col-xs-8" id="UI_SOCIO_NEGOCIO"
						auto-cargar="'false'"
						bcs-requerido
						id-actual="filtros.IdPortafolio"
						tipo="oClientePortafolio.tipo"
						carga-cliente-automatico="'S'" 
						seleccionado="oClientePortafolio.seleccionado"
						filtros="filtrosPortafolio"
						configuracion="oClientePortafolio.configuracion">
					</bcs-combobox-base>
	             </div>  
	             <div class="col-xs-2">
					<bcs-button
						class="col-xs-10 col-xs-offset-1" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-clic="buscar()"
						bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="(MostrarProducto===true && oClientePortafolio.seleccionado && oProducto.seleccionado)||(MostrarProducto===false &&oClientePortafolio.seleccionado) " >
					</bcs-button>
				</div>             
       		 </div>
			 
			<div class="row" ng-if="MostrarProducto">
				<div class="col-xs-10">
				    <label class="col-xs-2" translate>UI_PRODUCTO</label>
				    <bcs-combobox-base
				    	class				= "col-xs-8"
				        id					= "UI_PRODUCTO"
				        auto-cargar			= "'true'"
				        tipo				= "'combobox-otro-producto-agrupador'"
				        seleccionado		= "oProducto.seleccionado"
						cascada-a			= "oPortafolio.filtros.IdProductoAgrupador"
						cascada-valor		= "'IdProductoAgrupador'"
						id-actual			= "oProducto.idActual">
				    </bcs-combobox-base >
				</div>
			</div>
		</div>
		<hr>
		<div class="row">
			<div class="col-xs-6">				
				<div id="containerInversiones" class="row">
					<div ng-show="config.callCount>0" class="row k-window-subtitle" translate>UI_RESUMEN_INVERSIONES_ACTIVAS</div>
					<div class="row" id="treeInversiones"></div>								
				</div>
				<div id="containerInversionesPasivos" class="row">
					<div ng-show="config.callCount>0" class="row k-window-subtitle" translate>UI_RESUMEN_INVERSIONES_PASIVAS</div>					
					<div class="row" id="treeInversionesPasivos"></div>
				</div>
				<div id="containerMovimientos" class="row">
					<div ng-show="config.callCount>0" class="row k-window-subtitle" translate>UI_RESUMEN_MOVIMIENTOS</div>
					<div class="row" id="treeMovimientos"></div>
				</div>					
			</div>
			<div class="col-xs-6">
				<div class="row titulo" id="contenedorChartInversiones">
					<div id="chartInversiones" class="col-xs-12"></div>  
				</div>	
			</div>
		</div>
	</div>
</div>

<style>
	#treeMovimientos table tr td {
	    text-align: left;
	    text-transform: capitalize;
	}
	#treeInversiones table tr td{
		text-align: left;
		text-transform: capitalize;
	}
</style>

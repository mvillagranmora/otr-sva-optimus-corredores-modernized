<div id="PanelClienteHistorialCambios" class="row" ng-controller="PanelClienteHistorialCambiosCtrl as pchc" >
	<ng-form name="pchc.formClienteHistorialCambios" class="col-xs-12 form-horizontal">
		<div class="col-xs-6">
			<div class="row">
				<div class="col-xs-11">
					<label translate>UI_LOG_CATEGORIA_INVERSIONISTA</label>
					<bcs-grid
						configuracion = "pchc.RegistroCategoriaInversionistaOptions"
						fn-doble-click = "pchc.revisarencuesta()"
						seleccionado = "pchc.RegistroCategoriaInversionistaSeleccionado">

					</bcs-grid>
				</div>
			</div>
		</div>
		<div class="col-xs-6">
			<div class="row">
				<div class="col-xs-11">
			 		<label translate>UI_HISTORIAL_CAMBIOS</label> 
					<bcs-grid 
						configuracion="pchc.LogHistorialCambiosOptions">
					</bcs-grid>
				</div>
			</div>
		</div>
		<br>
		<div class="row"></div>
	</ng-form>
</div>

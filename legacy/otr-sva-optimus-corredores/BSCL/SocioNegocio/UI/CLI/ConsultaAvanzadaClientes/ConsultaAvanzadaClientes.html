										<bcs-input-date

								</div>
								<div class="col-xs-2">

							</div>

									<bcs-combobox-base

										class="col-xs-7"
										tipo="'combobox-tipo-enrolamiento'"
										id-actual = "formData.busqueda.IdTipoEnrolamiento"
										seleccionado = "tipoEnrolamiento">
									</bcs-combobox-base>
								</div>
							</div>
							
							<div class="row" ng-show="SesionLocale==='PE'">
							  <div class="col-xs-3">
							    <label class="col-xs-5" translate>UI_CLIENTE_FINAL</label>

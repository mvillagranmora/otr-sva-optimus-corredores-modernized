<div id="ModalClienteBloqueo" ng-controller="ModalClienteBloqueoCtrl">
	<form name="formBloqueoCliente">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_BLOQUEO</label>
					<bcs-combobox-base class="col-xs-4"
						tipo="'combobox-tipo-bloqueo-socio-negocio'"
						filtros="oConfiguracionTipoBloqueo.filtros"
						id-actual="dataCliente.IdTipoBloqueo"
						id-post-filtro="dataClienteOriginal.IdTipoBloqueo"
						bcs-requerido> </bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_BLOQUEO</label>
					<bcs-input-date class="col-xs-4"
						k-ng-model="dataCliente.FechaBloqueo" bcs-requerido>
					</bcs-input-date>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_COMENTARIO_BLOQUEO</label>
					<bcs-input-texto class="col-xs-4" ng-model="dataCliente.ComentarioBloqueo"
						bcs-requerido tipo-campo="'textarea'">
				</bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<bcs-button id="ModalClienteBloqueo_guardar" class="col-xs-2"
			bcs-habilitado="formBloqueoCliente.$valid" bcs-tipo="'principal'"
			bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			bcs-clic="bloqueoCliente()"></bcs-button>
		<bcs-button id="ModalClienteBloqueo_cerrar" class="col-xs-2" bcs-habilitado="'true'"
			bcs-tipo="'principal'" bcs-auto-desactivar="false"
			bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>

</div>

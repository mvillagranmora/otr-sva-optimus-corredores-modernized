<div id="ModalDocumentos" ng-controller="ModalClienteDocumentosCtrl">
	<form name="formModalDocumentos">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_DOCUMENTO</label>
					<bcs-combobox-base class="col-xs-4"
						tipo="'combobox-tipo-documentos'"
						filtros=""
						todos="'N'"
						seleccionado="data.seleccionadoTipoDoc">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12" ng-if="data.mostrarFecha">
					<label class="col-xs-4"  ng-if="data.mostrarFecha" translate>UI_FECHA_VIGENCIA</label>
					<bcs-input-date class="col-xs-4"  ng-if="data.mostrarFecha" ng-model="data.FechaVigencia">
					</bcs-input-date>
				</div>
			</div>
				<div class="col-xs-12"> 
					<div class = "row" ng-if="data.mostrarEmpresa1">
						<label class="col-xs-4" ng-if="data.mostrarEmpresa1">UI_FIRMANTE_EMPRESA</label>
						<bcs-input-texto class="col-xs-4"
							ng-model="data.seleccionadoEmpresa1"
							ng-if="data.mostrarEmpresa1">							
						</bcs-input-texto>  
					</div>
					<div class = "row"   ng-if="data.mostrarEmpresa2">
						<label class="col-xs-4" ng-if="data.mostrarEmpresa2">UI_FIRMANTE_EMPRESA</label>
						<bcs-input-texto class="col-xs-4"
							ng-model="data.seleccionadoEmpresa2"
							ng-if="data.mostrarEmpresa2">							
						</bcs-input-texto>  
					</div>
					<div class = "row" ng-if="data.mostrarEmpresa3">
						<label class="col-xs-4" ng-if="data.mostrarEmpresa3">UI_FIRMANTE_EMPRESA</label>
						<bcs-input-texto class="col-xs-4"
							ng-model="data.seleccionadoEmpresa3"
							ng-if="data.mostrarEmpresa3">							
						</bcs-input-texto>  
					</div>
					<div class = "row" ng-if="data.mostrarCliente1">
						<label class="col-xs-4" ng-if="data.mostrarCliente1">UI_FIRMANTE_CLIENTE</label>
						<bcs-input-texto class="col-xs-4"
							ng-model="data.seleccionadoCliente1"
							ng-if="data.mostrarCliente1">							
						</bcs-input-texto>  
					</div>
					<div class = "row" ng-if="data.mostrarCliente2">
						<label class="col-xs-4" ng-if="data.mostrarCliente2">UI_FIRMANTE_CLIENTE</label>
						<bcs-input-texto class="col-xs-4"
							ng-model="data.seleccionadoCliente2"
							ng-if="data.mostrarCliente2">							
						</bcs-input-texto>  
					</div>
					<div class = "row" ng-if="data.mostrarCliente3">
						<label class="col-xs-4" ng-if="data.mostrarCliente3">UI_FIRMANTE_CLIENTE</label>
						<bcs-input-texto class="col-xs-4"
							ng-model="data.seleccionadoCliente3"
							ng-if="data.mostrarCliente3">							
						</bcs-input-texto>  
					</div>
				</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<bcs-button id="ModalDocumentosCtrl_guardar" class="col-xs-2 pull-right"
			bcs-habilitado="'true'" bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			bcs-clic="Agregar()"></bcs-button>
		<bcs-button id="ModalDocumentosCtrl_cerrar" class="col-xs-2 pull-right" bcs-habilitado="'true'"
			bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
			bcs-texto="'UI_CERRAR' | translate" bcs-clic="Cerrar()"></bcs-button>
	</div>

</div>

<div id="ModalClienteAnotaciones" ng-controller="ModalClienteAnotacionesCtrl">
	<div class="row">
	  <form id="formSubirArchivo" name="formSubirArchivo" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_MOTIVO</label>
				<bcs-combobox-base
					id="formModalClienteAnotaciones_motivo"
					class="col-xs-8"
					bcs-requerido="camposRequeridos['formModalClienteAnotaciones_motivo'].Requerido === 'S'"
					tipo="Combobox.oConfMotivo.tipo"
					seleccionado="data.MotivoSeleccionado"
					id-actual="data.MotivoAnotacion"
					id-defecto="data.MotivoAnotacionDefecto"
					todos="'N'"
					filtros="Combobox.oConfMotivo.filtros"
				></bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_TITULO</label>
				<bcs-input-texto
					id="formModalClienteAnotaciones_titulo"
					class="col-xs-8"
					bcs-requerido="camposRequeridos['formModalClienteAnotaciones_titulo'].Requerido === 'S'"
					ng-model="data.Titulo"
				></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_DETALLE</label>
				<bcs-input-texto
						id="formModalClienteAnotaciones_detalle"
						tipo-campo="'textarea'"
						atributos="margin: 0px; height: 73px; resize: both; overflow: auto; width: 100%;"
						class="col-xs-8"
						ng-model="data.Detalle"
						bcs-requerido="camposRequeridos['formModalClienteAnotaciones_detalle'].Requerido === 'S'"
				></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ARCHIVO</label>
				<input
					class="col-xs-8"
					type="file"
					id="file"
					name="file"
					ng-model="data.file"
				/>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_VALIDO_DESDE</label>
				<bcs-input-date
					id="formModalClienteAnotaciones_fechaValidoDesde"
					class="col-xs-8 "
					k-ng-model="data.fechaDesde"
					bcs-requerido="camposRequeridos['formModalClienteAnotaciones_fechaValidoDesde'].Requerido === 'S'"
				></bcs-input-date>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_VALIDO_HASTA</label>
				<bcs-input-date
					id="formModalClienteAnotaciones_fechaValidoHasta"
					class="col-xs-8 "
					k-ng-model = "data.fechaHasta"
					bcs-requerido="camposRequeridos['formModalClienteAnotaciones_fechaValidoHasta'].Requerido === 'S'"
				></bcs-input-date>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_AMBITO</label>
				<bcs-combobox-base
					id="formModalClienteAnotaciones_ambito"
					class="col-xs-8"
					bcs-requerido="camposRequeridos['formModalClienteAnotaciones_ambito'].Requerido === 'S'"
					tipo="Combobox.oConfAmbito.tipo"
					seleccionado="data.AmbitoSeleccionado"
					id-actual="data.Ambito"
					id-defecto="data.AmbitoDefecto"
					todos="'N'"
					filtros="Combobox.oConfAmbito.filtros"
				></bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_RELEVANCIA</label>
				<bcs-combobox-base
					id="formModalClienteAnotaciones_relevancia"
					class="col-xs-8"
					bcs-requerido="camposRequeridos['formModalClienteAnotaciones_relevancia'].Requerido === 'S'"
					tipo="Combobox.oConfRelevancia.tipo"
					seleccionado="data.RelevanciaSeleccionado"
					id-actual="data.Relevancia"
					id-defecto="data.RelevanciaDefecto"
					todos="'N'"
					filtros="Combobox.oConfRelevancia.filtros"
				></bcs-combobox-base>
			</div>
	   </form>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button id="ModalPortafolioAnotaciones_aceptar"
			class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="formSubirArchivo.$valid"
			bcs-clic="Aceptar()"> </bcs-button>
		<bcs-button id="ModalPortafolioAnotaciones_cancelar"
			class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'"
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
			bcs-clic="Cancelar()"> </bcs-button>
	</div>
</div>

<div ng-controller="PanelClienteAnotacionesCtrl as pCliAnt">		
	<div class="row">
		<bcs-grid 
			seleccionado="pCliAnt.anotacionSeleccionado" 
			configuracion="pCliAnt.confGridAnotaciones" 
			fn-doble-click="pCliAnt.modificar(pPorAut.anotacionSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="AdministrarPortafolioAutorizaciones_agregar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="pCliAnt.agregar()">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_modificar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="pCliAnt.anotacionSeleccionado" bcs-clic="pCliAnt.modificar(pCliAnt.anotacionSeleccionado)">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_eliminar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" 
			bcs-habilitado="pCliAnt.anotacionSeleccionado" bcs-clic="pCliAnt.eliminar(pCliAnt.anotacionSeleccionado)">
		</bcs-button>
		<bcs-button id="AdministrarPortafolioAutorizaciones_Descargar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_DESCARGAR' | translate" 
			bcs-habilitado="pCliAnt.anotacionSeleccionado.ExisteArchivo ==='S'" bcs-clic="pCliAnt.descargar(pCliAnt.anotacionSeleccionado)">
		</bcs-button>
		
	</div>
</div>

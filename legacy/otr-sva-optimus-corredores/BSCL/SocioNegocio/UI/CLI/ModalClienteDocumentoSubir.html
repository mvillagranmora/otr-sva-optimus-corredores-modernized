<div class="col-xs-12" ng-controller="ModalClienteDocumentoSubirCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form id="formModalClienteDocumentoSubir" name="formSubirArchivo" class="col-xs-12 form-horizontal">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_DESCRIPCION</label>
						<bcs-input-texto
							id="formModalClienteDocumentoSubir_descripcion"
							class="col-xs-8" solo-mayusculas="S"
							bcs-requerido="camposRequeridos['formModalClienteDocumentoSubir_descripcion'].Requerido === 'S'"
							ng-model="recordData.descripcion"
						></bcs-input-texto>
					</div>
				</div>
				<div class="row" ng-show="tipoDocumento.NombrePlantillaContrato != null">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_PLANTILLA_CONTRATO</label>
						<span class="col-xs-8">
							{{ tipoDocumento.NombrePlantillaContrato }}
						</span>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_ARCHIVO</label>
						<input
							class="col-xs-8"
							type="file"
							id="data"
							name="data"
							ng-model="recordData.file"
						>
					</div>
				</div>
			</form>
		</div>
		
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formModalClienteDocumentoSubir_subir" 
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_SUBIR' | translate" 
			bcs-habilitado="formSubirArchivo.$valid" 
			bcs-clic="subirArchivo()"></bcs-button>
	</div>
</div>

<div id="ModalClienteFirmaAnexoUrl" ng-controller='ModalClienteFirmaAnexoUrlCtrl'>
<form name="formModalFirma" class="col-xs-16 form-horizontal">
	<div class="col-xs-12">

		<div class="row" ng-if="data.mostrarEmpresa1">
			<label class="col-xs-4" ng-if="data.mostrarEmpresa1" translate>UI_URL_CONTRATO</label>
			<bcs-input-texto class="col-xs-8"
							ng-model="data.UrlAnexo"
							ng-if="data.mostrarEmpresa1"
							solo-mayusculas="N">
			</bcs-input-texto>
		</div>
		
		<div ng-show="!Bloqueo">
			<bcs-button id="ModalClienteFirmaAnexo_guardar" class="col-xs-3" bcs-habilitado="formModalFirma.$valid"
				bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_FIRMA_CONTRATO' | translate"
				bcs-clic="FirmaUrl()"></bcs-button> 
				
			<bcs-button id="ModalClienteFirmaAnexo_cancelar" class="col-xs-3" bcs-habilitado="'true'"
				bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'Cancelar'"
				bcs-clic="cerrar()"></bcs-button>
		</div>
	</div>
</form>
</div>

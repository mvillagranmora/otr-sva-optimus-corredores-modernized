<div id="ModalEliminarPortafolio" ng-controller="ModalEliminarPortafolioCtrl">
	<form name="formEliminarPortafolio">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_COMENTARIO</label>
					<bcs-input-texto class="col-xs-8" atributos="width:100%" ng-model="data.Comentario" bcs-requerido tipo-campo="'textarea'"> </bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<hr style="margin: 10px 0px">
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
		<bcs-button class="col-xs-3" id={{IdBoton}}
			bcs-habilitado="formEliminarPortafolio.$valid" bcs-tipo="'principal'"
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate"
			bcs-clic="EliminarPortafolio()"></bcs-button>
		<bcs-button class="col-xs-3" id="ModalEliminarPortafolio_Cancelar" 
			bcs-habilitado="'true'" bcs-tipo="''" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
			bcs-clic="CerrarModal()"></bcs-button>
		</div>
	</div>
 
</div>

<div id="ConsultaSocioMovimientos" ng-controller='ConsultaSocioMovimientosCtrl'>
	<div class="col-xs-12 bcs-cuerpo">
	
		<!-- ------------------------------- -->
		<!-- ----------- FILTROS -------------->
		<!-- ------------------------------- -->
		<div class="col-xs-10">

		
		<div class="row">
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_CLIENTE</label>
				
				<bcs-combobox-base
					class				= "col-xs-8"
					id					= "UI_CLIENTE"
					auto-cargar			= "'true'"
					tipo				= "'combobox-socio-negocio'"
					seleccionado		= "oSocioNegocio.seleccionado"
					filtros				= "oSocioNegocio.filtros"
					cascada-a			= "oPortafolio.filtros.IdCliente"
					cascada-valor		= "'IdCliente'"
					cascada-defecto     = "-1"
					bcs-requerido		= "(filtros.folioCartera===undefined || filtros.folioCartera===null)"
					id-actual			= "socioGral.idActual"
					id-defecto          = "socioGral.idDefecto"
					carga-cliente-automatico ="'S'">
				</bcs-combobox-base>
			</div>
			
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_PORTAFOLIO</label> 
				
				<bcs-combobox-base
					class					= "col-xs-8"
					id						= "UI_PORTAFOLIO"
					auto-cargar				= "'false'"
					tipo					= "'combobox-portafolio'"
					seleccionado			= "oPortafolio.seleccionado"
					filtros					= "oPortafolio.filtros"
					id-actual				= "oPortafolio.idActual"
					usa-filtros-completos 	= "'S'"
					activado				= "oSocioNegocio.seleccionado">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					
					<bcs-combobox-base
						class				= "col-xs-8"
						tipo        	 	= "oConfiguracionClasificacionTipoInstrumento.tipo"
						id-actual    		= "oConfiguracionClasificacionTipoInstrumento.idActual"
						seleccionado 		= "oConfiguracionClasificacionTipoInstrumento.seleccionado"
						id-post-filtro 		= "oConfiguracionClasificacionTipoInstrumento.idPostFiltro"
						item-post-filtro	= "'1'"
						configuracion		= "oConfiguracionClasificacionTipoInstrumento.configuracion" 
						cascada1-a			= "oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor		= "'IdClasificacionTipoInstrumento'" 	
						cascada2-a			= "oConfiguracionInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada2-valor		= "'IdClasificacionTipoInstrumento'"
						filtros				= "oConfiguracionClasificacionTipoInstrumento.filtros"
						todos				= "'S'">
					</bcs-combobox-base>
			</div>			
		</div>
		
		<div class="row">
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO_ABR</label>
				
				<bcs-combobox-base
					class				= "col-xs-8"
					auto-cargar			= "'false'"
					tipo				= "oConfiguracionTipoInstrumento.tipo"  
					filtros				= "oConfiguracionTipoInstrumento.filtros"
					configuracion 		= "oConfiguracionTipoInstrumento.configuracion" 
					id-actual 			= "oConfiguracionTipoInstrumento.idActual"
					id-post-filtro 		= "oConfiguracionTipoInstrumento.idPostFiltro" 
					item-post-filtro	="'1'"
					seleccionado		= "oConfiguracionTipoInstrumento.seleccionado"
					cascada1-a			= "oConfiguracionInstrumento.filtros.IdTipoInstrumento"
					cascada1-valor 		= "'IdTipoInstrumento'" 	
					todos 				= "'S'">
				</bcs-combobox-base>				  			  	  
			</div>
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
				
				<bcs-input-instrumentos 
					class					= "col-xs-8" 
					id						= "UI_INSTRUMENTO" 
					name 					= "uInstrumento"
					datos-instrumento		= "instrumentoDatos"
					buscar-instrumento		= "oConfiguracionInstrumento.buscar"
					filtro-tipo-instrumento = "oConfiguracionTipoInstrumento.idActual"
					filtro-clasificacion	= "oConfiguracionClasificacionTipoInstrumento.idActual" 
					filtro-estado 			= "'ACT'">
				</bcs-input-instrumentos>				  				  			  	  
			</div>
			
			
			
		</div>
		<div class = "row">
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_FECHA_OPERACION</label>
				
				<bcs-input-date 
					class		= "col-xs-8" 
					ng-model	= "filtro.fecIniciong" 
					k-ng-model	= "filtro.fecInicio" 
					bcs-requerido>
				</bcs-input-date>
			</div>
				
			<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_HASTA</label> 
				
				<bcs-input-date 
					class		= "col-xs-8" 
					ng-model	= "filtro.fecTerminong" 
					k-ng-model	= "filtro.fecTermino" 
					bcs-requerido>
				</bcs-input-date>
			</div>			
		</div>
		
		</div>

		<div class="col-xs-2">	  			  	  
				
					
					<div class="row">
						<bcs-button 
							class				= "col-xs-12" 
							bcs-tipo			= "'bcs-button-search'"  
							bcs-auto-desactivar	= "false" 
							bcs-texto			= "'UI_BUSCAR' | translate" 
							bcs-habilitado		= "true"  
							bcs-clic			= "Buscar()">
						</bcs-button>			
					</div>

				<!-- 	<div class="row">
					<bcs-button 
						class				= "col-xs-12" 
						bcs-tipo			= "'bcs-button-secondary'"  
						bcs-auto-desactivar	= "false" 
						bcs-texto			= "'UI_LIMPIAR' | translate" 
						bcs-habilitado		= "true"  
						bcs-clic			= "limpiarFiltros()">
					</bcs-button>
					</div> -->
				
		</div>
		<!-- ------------------------------- -->
		<!-- ----------- PESTA�AS ------------->
		<!-- ------------------------------- -->
				
		<br>
		<div class="col-xs-12">
			<uib-tabset>
			
				<uib-tab id="TabCustodia" heading="Custodia" select="select('gridCustodia')" >		
		
					<div id="Custodia">
					
						<bcs-grid 	id				= "gridCustodia"
						 			configuracion	= "confBasicaCustodias"
						 			api 			= "gCustodia">
						</bcs-grid>
					
					</div>
					
				</uib-tab>
				
				<uib-tab id="TabGarantias" 	heading="Garantias" select="select('gridGarantias')" >	
				
					<div id="divGarantias">
					
						<bcs-grid 	id				= "gridGarantias"
						 			configuracion	= "confBasicaGarantias"
						 			api 			= "gGarantias">
						</bcs-grid>
					
					</div>
									
				</uib-tab>
				
				<uib-tab id="TabPrestamos" 	heading="Prestamos"  select="select('gridPrestamos')" >	
					
					<div id="divPrestamos">
					
						<bcs-grid 	id				= "gridPrestamos"
						 			configuracion	= "confBasicaPrestamos"
						 			api 			= "gPrestamos">
						</bcs-grid>
					
					</div>		
					
				</uib-tab>
				
				<uib-tab id="TabSimultaneas" heading="Simultaneas" select="select('gridSimultaneas')" >	
					
					<div id="divSimultaneas">
					
						<bcs-grid 	id				= "gridSimultaneas"
						 			configuracion	= "confBasicaSimultaneas"
						 			api 			= "gSimultaneas">
						</bcs-grid>
					
					</div>		
				
				</uib-tab>
			
			</uib-tabset>						
		</div>
	</div>

</div>

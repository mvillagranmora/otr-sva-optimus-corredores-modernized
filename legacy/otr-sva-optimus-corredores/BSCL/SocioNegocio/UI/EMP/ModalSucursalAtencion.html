<div id="ModalSucursalAtencion" ng-controller="ModalSucursalAtencionCtrl">
    <form name="formModalSucursalAtencion">
        <div class="row bcs-cuerpo">
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-4" translate>UI_SUCURSAL</label>
                    <bcs-combobox-base
                        class="col-xs-8"
                        tipo="'combobox-sucursal'"
                        filtros="oConfiguracionSucursal.filtros"
                        id-actual="data.IdSucursalActual"
                        seleccionado="data.SucursalActual"   
                        bcs-requerido>
                    </bcs-combobox-base>
                </div>
            </div>
        </div>
    </form>
    <div class="row bcs-panel-comandos">
        <bcs-button id="ModalSucursalAtencion_guardar" class="col-xs-2"
            bcs-habilitado="formModalSucursalAtencion.$valid" bcs-tipo="'principal'"
            bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
            bcs-clic="agregar()"></bcs-button>
        <bcs-button id="ModalSucursalAtencion_cerrar" class="col-xs-2" bcs-habilitado="'true'"
            bcs-tipo="''" bcs-auto-desactivar="false"
            bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
    </div>
</div>

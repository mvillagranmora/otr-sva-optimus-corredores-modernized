<div id="ModalNombresFantasia" ng-controller="ModalNombresFantasiaCtrl as mnf">
	<div class="row bcs-cuerpo">
		<form name="formNombreFantasia" class="col-xs-12 form-horizontal">	
			<div class="row">
				<label class="col-xs-3" translate>UI_NOMBRE_FANTASIA</label>
				<bcs-input-texto 
					id="formModalNombreFantasia"
					foco="true"
					bcs-requerido = "mnf.camposRequeridos['formModalNombreFantasia'].Requerido === 'S'"
					class="col-xs-9" 
					ng-model="mnf.NombreFantasia.NombreFantasia">
				</bcs-input-texto>	
			</div>			
			<div class="row">
				<label class="col-xs-3" translate>UI_ESTADO</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido="mnf.camposRequeridos['nombreFantasia_estado'].Requerido === 'S'"
					filtros = "mnf.cmbbxNombreFantasia.filtros"
					tipo="'combobox-estado-nombre-fantasia'"
					id-actual="mnf.NombreFantasia.IdEstado"
					id-defecto="mnf.NombreFantasiaOriginal.IdEstado"
					id-post-filtro="mnf.NombreFantasiaOriginal.IdEstado">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="ModalNombresFantasia_aceptar" class="col-xs-2 pull-right" bcs-habilitado="(formNombreFantasia.$valid && (mnf.NombreFantasia.NombreFantasia!==mnf.NombreFantasiaOriginal.DescripcionNombreFantasia || mnf.NombreFantasiaOriginal.IdEstado!==mnf.NombreFantasia.IdEstado))" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mnf.aceptar()"></bcs-button>
		<bcs-button id="ModalNombresFantasia_cancelar" class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mnf.cancelar()"></bcs-button>
	</div>
</div>

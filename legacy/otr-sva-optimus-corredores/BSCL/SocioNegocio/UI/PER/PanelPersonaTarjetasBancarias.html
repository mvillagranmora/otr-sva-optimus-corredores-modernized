<div id="PanelPersonaTarjetasBancarias" ng-controller="PanelPersonaTarjetasBancariasCtrl as ppca">
	<div class="row">
		<bcs-grid 
			seleccionado="ppca.TarjetaBancariaSeleccionada" 
			configuracion="ppca.TarjetaBancariaOptions" 
			fn-doble-click="ppca.modificar(ppca.TarjetaBancariaSeleccionada)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaTarjetasBancarias_agregar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'"  bcs-clic="ppca.agregar()"></bcs-button>
		<bcs-button id="PanelPersonaTarjetasBancarias_modificar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="ppca.TarjetaBancariaSeleccionada"  bcs-clic="ppca.modificar(ppca.TarjetaBancariaSeleccionada)"></bcs-button>
		<bcs-button id="PanelPersonaTarjetasBancarias_eliminar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="ppca.TarjetaBancariaSeleccionada"  bcs-clic="ppca.eliminar(ppca.TarjetaBancariaSeleccionada)"></bcs-button>
		<bcs-button id="PanelPersonaTarjetasBancarias_bloquear" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" ng-show="ppca.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_BLOQUEAR' | translate" bcs-habilitado="ppca.TarjetaBancariaSeleccionada"  bcs-clic="ppca.bloqueoTarjeta()"></bcs-button>
		<bcs-button id="PanelPersonaTarjetasBancarias_desbloquear" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" ng-show="!ppca.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_DESBLOQUEAR' | translate" bcs-habilitado="ppca.TarjetaBancariaSeleccionada"  bcs-clic="ppca.desbloqueoTarjeta()"></bcs-button>
	</div>
</div>

<div  ng-controller="ModalPersonaBloqueoCtrl">
	<form name="formBloqueoCliente">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_BLOQUEO</label>
					<bcs-combobox-base class="col-xs-4"
						tipo="'combobox-tipo-bloqueo-socio-negocio'"
						filtros="oConfiguracionTipoBloqueo.filtros"
						id-actual="dataPersona.IdTipoBloqueo"
						id-post-filtro="dataPersonaOriginal.IdTipoBloqueo"
						bcs-requerido> </bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_BLOQUEO</label>
					<bcs-input-date class="col-xs-4"
						k-ng-model="dataPersona.FechaBloqueo" bcs-requerido>
					</bcs-input-date>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_COMENTARIO_BLOQUEO</label>
					<bcs-input-texto class="col-xs-4" ng-model="dataPersona.ComentarioBloqueo"
						bcs-requerido tipo-campo="'textarea'">
				</bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right"
			bcs-habilitado="formBloqueoCliente.$valid" bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			bcs-clic="bloquearPersona()"></bcs-button>
		<bcs-button class="col-xs-2 pull-right" bcs-habilitado="'true'"
			bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
			bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>

</div>

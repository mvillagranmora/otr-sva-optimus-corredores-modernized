<div id="ModalPersonaFatcaCuentasBancariasExtranjeras" ng-controller="ModalPersonaFatcaCuentasBancariasExtranjerasCtrl as mpfcbe">
	<div class="row">
        <bcs-grid
            configuracion="mpfcbe.GrillaCuentasBancariasExt"
            seleccionado="mpfcbe.GrillaCuentasBancariasExtSeleccionado">
        </bcs-grid>
    </div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaCuentasBancarias_agregar" 
        class="col-xs-2 pull-right"
	 	ng-show="true"
        bcs-tipo="'bcs-button-primary'" 
        bcs-auto-desactivar="false" 
        bcs-texto="'UI_AGREGAR' | translate" 
        bcs-habilitado="mpfcbe.GrillaCuentasBancariasExtSeleccionado"  
        bcs-clic="mpfcbe.agregarEsFatca(mpfcbe.GrillaCuentasBancariasExtSeleccionado)"></bcs-button>
		<bcs-button id="PanelPersonaCuentasBancarias_cancelar"
        class="col-xs-2 pull-right" 
        bcs-tipo="'bcs-button-secondary'" 
        bcs-auto-desactivar="false" 
        bcs-texto="'UI_CANCELAR' | translate" 
        bcs-habilitado="'true'"  
        bcs-clic="mpfcbe.Cancelar()"></bcs-button>
	</div>
</div>

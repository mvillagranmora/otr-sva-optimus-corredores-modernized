<div id="PanelPersonaNombresFantasia" ng-controller="PanelPersonaNombresFantasiaCtrl as ppnf">
	<div class="row">
		<bcs-grid
			seleccionado="ppnf.nombreFantasiaSeleccionado" 
			configuracion="ppnf.nombreFantasiaOptions" 
			fn-doble-click="ppnf.modificar(ppnf.nombreFantasiaSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaNombresFantasia_agregar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'"  bcs-clic="ppnf.agregar()"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="ppnf.nombreFantasiaSeleccionado"  bcs-clic="ppnf.modificar(ppnf.nombreFantasiaSeleccionado)"></bcs-button>
		<!--<bcs-button  class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="ppnf.nombreFantasiaSeleccionado"  bcs-clic="ppnf.eliminar(ppnf.nombreFantasiaSeleccionado)"></bcs-button> -->
		<bcs-button id="PanelPersonaNombresFantasia_bloquear" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" ng-show="ppnf.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_BLOQUEAR' | translate" bcs-habilitado="ppnf.nombreFantasiaSeleccionado"  bcs-clic="ppnf.bloqueoNombre()"></bcs-button>
		<bcs-button id="PanelPersonaNombresFantasia_desbloquear" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" ng-show="!ppnf.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_DESBLOQUEAR' | translate" bcs-habilitado="ppnf.nombreFantasiaSeleccionado"  bcs-clic="ppnf.desbloqueoNombre()"></bcs-button>
	</div>
</div>

<div id="PanelPersonaTelefonos" ng-controller="PanelPersonaTelefonosCtrl as ppt">
	<div class="row">
		<bcs-grid
			seleccionado="ppt.telefonoSeleccionado" 
			configuracion="ppt.telefonoOptions" 
			fn-doble-click="ppt.modificar(ppt.telefonoSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaTelefonos_agregar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'"  bcs-clic="ppt.agregar()"></bcs-button>
		<bcs-button id="PanelPersonaTelefonos_modificar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="ppt.telefonoSeleccionado"  bcs-clic="ppt.modificar(ppt.telefonoSeleccionado)"></bcs-button>
		<bcs-button id="PanelPersonaTelefonos_eliminar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="ppt.telefonoSeleccionado"  bcs-clic="ppt.eliminar(ppt.telefonoSeleccionado)"></bcs-button>
		<bcs-button id="PanelPersonaTelefonos_predeterminar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_PREDETERMINAR' | translate" bcs-habilitado="ppt.telefonoSeleccionado"  bcs-clic="ppt.predeterminar(ppt.telefonoSeleccionado)"></bcs-button>
	</div>
</div>

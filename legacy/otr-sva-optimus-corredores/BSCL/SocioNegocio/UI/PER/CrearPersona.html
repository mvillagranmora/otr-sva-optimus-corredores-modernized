<div id="CrearPersona" class="col-xs-12" ng-controller="CrearPersonaCtrl" bcs-escape="ValidaSalidaESC()" >
    <div class="bcs-cuerpo" >
    	<form name="formCrearCliente" class="col-xs-12 form-horizontal">
	    	<div class="row">
				<div class="row col-xs-10">
					
				<div class="row">
					<label class="col-xs-3" style="width: 29.8%;" translate>UI_TIPO_PERSONA</label>
					<bcs-combobox-base 
						id="formCrearPersona_tipoPersona" 
						class="col-xs-8" style="width: 66.3%;"
						bcs-requerido
						working-net="workingNet.TipoPersona"
						activado="(configData.bloqueoPersona && !configData.bloqueoBuscador)"
						tipo="'combobox-tipo-persona'"
						id-defecto = "tipoPersonaDefecto"
						id-actual = "recordData.tipoPersona"
						filtros="configData.filtroTipoPersona">
					</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-3" style="width: 29.6%;" translate>{{formConfig.labelNumeroIdentidad||'UI_DOCUMENTO_IDENTIDAD'}}</label>
					<bcs-input-documento-identidad
						id="formCrearPersona_NumeroDocumentoIdentidad"
                        class="col-xs-8"
                        ng-model="searchData.NumeroDocumentoIdentidad"
                        id-tipo-persona="recordData.tipoPersona"
                        id-tipo-documento="searchData.IdTipoDocumentoIdentidad"
                        id-tipo-documento-asociado="searchData.IdTipoDocumentoIdentidadAsociado"
                        id-defecto="formConfig.tipoDocIdentidadDef"
                        tipo="'combobox-tipo-documento-identidad'"
                        tipo-documento-identidad-activado="configData.TipoDocumentoIdentidadBloqueado"
                        documento-identidad-activado="!configData.bloqueoBuscador"
                        working-net="workingNet.TipoDocumentoIdentidad"
                        cambiar-documento-identidad="recordData.documentoIdentidadNuevo"
                        cambiar-tipo-documento-identidad="recordData.tipoDocumentoIdentidad"
                        focus="true"
                        placeholder="placeholder.documentoIdentidad"
                        blur="blurDocumentoIdentidad(searchData.IdTipoDocumentoIdentidad,false)" >
                    </bcs-input-documento-identidad>
				</div>	    
				</div>
				<div class="col-xs-2">
					<bcs-button 
						id="formCrearPersona_btnBuscar"
						k-ng-disabled = "configData.bloqueoBuscador"
						class="col-xs-12" 
						bcs-auto-desactivar="false" 
						bcs-tipo="'bcs-button-search'"
						bcs-texto="'UI_BUSCAR' | translate" 
						bcs-habilitado="(searchData.NumeroDocumentoIdentidad||searchData.NumeroDocumentoIdentidadAdicional)
										&&!errorValidarNumeroDocumentoIdentidad&&!errorValidarNumeroDocumentoIdentidadAdicional
										&&!configData.bloqueoBuscador" 
						bcs-clic="configData.buscarPersona()">
					</bcs-button> 
				</div>
	            <div class="row" ng-show="formConfig.showNumeroAdicional"> 
					<label class="col-xs-3" translate>UI_NUMERO_ADICIONAL</label>
					<bcs-combobox-base 
						id="formCrearPersona_tipoDocumentoIdentidadAdicional"
						class="col-xs-4"
						activado = "!configData.bloqueoBuscador"
				  		tipo="'combobox-tipo-documento-identidad'"
				  		working-net="workingNet.TipoDocumentoIdentidadAdicional"
				  		id-actual="searchData.IdTipoDocumentoIdentidadAdicional"
				  		filtros="configData.filtroTipoDocumentoIdentidadAdicional"
				  		id-defecto="formConfig.tipoDocIdentidadAdicionalDef">
					</bcs-combobox-base>
					<bcs-input-texto 
						id="formCrearPersona_documentoIdentidadAdicional"
						class="col-xs-3" 
						bcs-requerido="formConfig.requiereNumeroAdicional"
						bcs-es-rut-valido="formConfig.requiereNumeroAdicional"
						k-ng-disabled = "configData.bloqueoBuscador"
						ng-model="searchData.NumeroDocumentoIdentidadAdicional" 
						placeholder="placeholder.documentoIdentidadAdicional"
						ng-blur="blurDocumentoIdentidad(searchData.IdTipoDocumentoIdentidadAdicional,true)"
						maxlength="formConfig.largoMaximoNumeroAdicional">
					</bcs-input-texto>       
	            </div>
	            <div class="col-xs-12">
			</div>
		</div>
		<hr>
		<div class="row">
				<div class="row" ng-show="recordData.tipoPersona === 'N'">
					<label class="col-xs-3" translate>UI_NOMBRES</label>
					<bcs-input-texto 
						id="formCrearPersona_nombres"
						class="col-xs-9" 
						bcs-requerido="recordData.tipoPersona === 'N'"
						k-ng-disabled="configData.bloqueoPersona"
						ng-model="recordData.nombres">
					</bcs-input-texto>	
				</div>
				<div class="row" ng-show="recordData.tipoPersona === 'N'">
					<label class="col-xs-3" translate>UI_APELLIDO_PATERNO</label>
					<bcs-input-texto 
						id="formCrearPersona_apellidoPaterno"
						class="col-xs-9" 
						bcs-requerido="recordData.tipoPersona === 'N'" 
						k-ng-disabled="configData.bloqueoPersona"
						ng-model="recordData.apellidoPaterno">
					</bcs-input-texto>	
				</div>
				<div class="row" ng-show="recordData.tipoPersona === 'N'">
					<label class="col-xs-3" translate>UI_APELLIDO_MATERNO</label>
					<bcs-input-texto 
						id="formCrearPersona_apellidoMaterno"
						class="col-xs-9"
						bcs-requerido="recordData.tipoPersona === 'N'" 
						k-ng-disabled="configData.bloqueoPersona"
						ng-model="recordData.apellidoMaterno">
					</bcs-input-texto>	
				</div>
				<div class="row" ng-show="recordData.tipoPersona !== 'N'">
					<label class="col-xs-3" translate>UI_RAZON_SOCIAL</label>
					<bcs-input-texto 
						id="formCrearPersona_razonSocial" 
						class="col-xs-9" 
						bcs-requerido="recordData.tipoPersona !== 'N'"
						k-ng-disabled="configData.bloqueoPersona"
						ng-model="recordData.razonSocial">
					</bcs-input-texto>	
				</div>
				<div ng-show="!modoRapido">
					<div class="row" ng-show="recordData.tipoPersona === 'N'">
						<label class="col-xs-3" translate>UI_PAIS_NACIMIENTO</label>
						<bcs-combobox-base 
							id="formCrearPersona_paisNacimiento"
							class="col-xs-3"
							bcs-requerido="!modoRapido && recordData.tipoPersona === 'N'"
							activado="!configData.bloqueoPersona"
							working-net="workingNet.PaisNacimiento"
							id-actual = "recordData.idPaisNacimiento"
							id-defecto = "recordData.idPaisNacimientoDefecto"			 
							tipo="'combobox-pais'">
						</bcs-combobox-base>
						<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_NACIMIENTO</label>
						<bcs-input-date 
							id="formCrearPersona_fechaNacimiento"
							class="col-xs-3 " 
							bcs-requerido="!modoRapido && recordData.tipoPersona === 'N'"
							k-ng-disabled="configData.bloqueoPersona"
							k-ng-model = "recordData.fechaNacimiento"
							k-options="kOptFechaNacimiento"
							k-ng-readonly="false"
							todo-dias="true"
							ng-blur="validaFechaNacimiento()">
						</bcs-input-date>	
					</div>
					<div class="row" ng-show="recordData.tipoPersona === 'N'">
						<label class="col-xs-3" translate>UI_ESTADO_CIVIL</label>
						<bcs-combobox-base 
							id="formCrearPersona_estadoCivil"
							bcs-requerido="!modoRapido && recordData.tipoPersona === 'N'"
							working-net="workingNet.EstadoCivil"
							class="col-xs-3" 
							activado="!configData.bloqueoPersona"
							id-actual = "recordData.idEstadoCivil"
							tipo="'combobox-estado-civil'">
						</bcs-combobox-base>
						<label class="col-xs-2 col-xs-offset-1" translate>UI_GENERO</label>
						<bcs-combobox-base 
							id="formCrearPersona_genero" 
							class="col-xs-3" 
							bcs-requerido="!modoRapido && recordData.tipoPersona === 'N'"
							activado="!configData.bloqueoPersona"
							id-actual = "recordData.idGenero"	
							id-defecto="recordData.idGeneroOriginal"	
							tipo="'combobox-tipo-genero'"
							filtros="configData.filtroGenero">
						</bcs-combobox-base>
					</div>
					<div class="row" ng-show="(recordData.idEstadoCivil === 'CA' || recordData.idEstadoCivil === 'CC')">
		                <div class="row">
		                    <label class="col-xs-3" translate>{{recordData.idEstadoCivil === 'CA'?'UI_CONYUGE':'UI_CONVIVIENTE_CIVIL'}}</label>
		                    <bcs-combobox-base 
		                    	id="formCrearPersona_conyuge" 
		                    	class="col-xs-3"
		                    	working-net="workingNet.Conyuge"
		                        tipo="'combobox-socio-negocio'" 
		                        filtros="configData.filtroConyuge" 
		                        id-actual="recordData.IdSocNegPersonaConyuge"
								id-defecto="recordData.IdSocNegPersonaConyugeOriginal" 
		                        seleccionado="seleccionado.RelacionadoObj"
		                        auto-cargar="true"
		                        carga-cliente-automatico="false" 
		                        activado="recordData.tipoPersona === 'N'"
	                        	bcs-requerido="recordData.idEstadoCivil === 'CA' || recordData.idEstadoCivil === 'CC'">
		                    </bcs-combobox-base>
	                        <bcs-button 
	                        	id="formCrearPersona_btnCrearConyuge"
	                            class="col-xs-1" 
	                            bcs-tipo="'bcs-button-input-form'" 
	                            bcs-habilitado="!configData.bloqueoPersona" 
	                            bcs-auto-desactivar="false"     
	                            bcs-texto="'UI_NUEVO'|translate" 
	                            bcs-clic="crearConyuge()">
	                        </bcs-button>   
		                    <label class="col-xs-2" translate>UI_REGIMEN_CONYUGAL</label>       
	                        <bcs-combobox-base
	                        	id="formCrearPersona_regimenConyugal" 
	                        	class="col-xs-3"                                 
	                            tipo="'combobox-regimen-conyugal'"
	                            working-net="workingNet.RegimenConyugal"                                                
	                            filtros="formConfig.oConfiguracionRegimenConyugal.filtros"      
	                            id-actual="recordData.RegimenConyugal"
	                            seleccionado="recordData.RegimenConyugalObj"
	                            id-defecto="recordData.RegimenConyugalOriginal"                 
	                            auto-cargar="true" 
		                        activado="recordData.tipoPersona === 'N'"
	                        	bcs-requerido="recordData.idEstadoCivil === 'CA' || recordData.idEstadoCivil === 'CC'">                                             
	                        </bcs-combobox-base>  
		                </div>                                                
		            </div>
				<hr>
				</div>
				<div class="row" ng-if="modoRapido && recordData.tipoPersona === 'N'">
					<!-- solo cuando se crea un conyugue -->
					<label class="col-xs-3" translate>UI_GENERO</label>
					<bcs-combobox-base 
						id="formCrearPersona_genero" 
						class="col-xs-9" 
						bcs-requerido="recordData.tipoPersona === 'N'"
						activado="!configData.bloqueoPersona"
						id-actual = 'recordData.idGenero'	
						tipo="'combobox-tipo-genero'"
						filtros="configData.filtroGenero">
					</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-3" translate>UI_PAIS_RESIDENCIA</label>
					<bcs-combobox-base 
						id="formCrearPersona_paisResidencia"
						class="col-xs-9"
						activado="!configData.bloqueoPersona"
						bcs-requerido = "recordData.tipoPersona === 'N' || recordData.tipoPersona === 'J'"
						id-actual = "recordData.idPaisResidencia"	
						id-defecto = "recordData.idPaisResidenciaDefecto"			 
						tipo="'combobox-pais'"
						working-net="workingNet.PaisResidencia"
						seleccionado="paisResidenciaSeleccionado"
						cascada1-a="configData.filtroCiudad.IdPais"
						cascada1-valor="'IdPais'"
						cascada2-a="configData.filtroDivisionPais.IdPais"
						cascada2-valor="'IdPais'">
					</bcs-combobox-base>	
				</div>
				<div class="row" ng-show="!modoRapido">
					<div ng-show="paisResidenciaSeleccionado.UsaDivisionPais !== 'S'">		
						<label class="col-xs-3" translate>UI_CIUDAD</label>
						<bcs-combobox-base 
							id="formCrearPersona_ciudadResidencia"
							class="col-xs-9" 
							cache="true"
							working-net="workingNet.CiudadResidencia"
							bcs-requerido = "!modoRapido && paisResidenciaSeleccionado.UsaDivisionPais !== 'S'"
							activado="!configData.bloqueoPersona"
							filtros = "configData.filtroCiudad"
							id-actual = "recordData.idCiudad"
							id-defecto = "recordData.idCiudadDefecto"
							tipo="'combobox-ciudad'"
							seleccionado="ciudadSeleccionado">
						</bcs-combobox-base>
					</div>
					<div ng-show="paisResidenciaSeleccionado.UsaDivisionPais === 'S'">
						<label class="col-xs-3" translate>{{paisResidenciaSeleccionado.NombreDivisionPais || 'UI_COMUNA'}}</label>
						<bcs-combobox-base 
							id="formCrearPersona_divisionPais"
							class="col-xs-9" 
							cache="false"
							working-net="workingNet.DivisionPaisResidencia"
							bcs-requerido="!modoRapido && paisResidenciaSeleccionado.UsaDivisionPais === 'S'"
							activado="!configData.bloqueoPersona"
							filtros = "configData.filtroDivisionPais"
							id-actual = "recordData.idDivisionPais"
							id-defecto = "recordData.idDivisionPaisDefecto"
							tipo="'combobox-division-pais'"
							seleccionado="divisionPaisSeleccionado">
						</bcs-combobox-base>
					</div>
				</div>
				<div ng-show="!modoRapido">
					<div class="row">
						<label class="col-xs-3" translate>UI_CALLE</label>
						<bcs-input-texto 
							id="formCrearCliente_direccionCalle"
							class="col-xs-9" 
							bcs-requerido="!modoRapido"
							k-ng-disabled="configData.bloqueoPersona"
							ng-model="recordData.direccionCalle">
						</bcs-input-texto>	
					</div>
					<div class="row">
						<label class="col-xs-3" translate>UI_NUMERO</label>
						<bcs-input-texto 
							id="formCrearPersona_direccionNumero"
							class="col-xs-3" 
							bcs-requerido="!modoRapido"
							k-ng-disabled="configData.bloqueoPersona"
							ng-model="recordData.direccionNumero">
						</bcs-input-texto>	
						<label class="col-xs-2 col-xs-offset-1" translate>{{(SesionLocale==='PE')?'UI_REFERENCIA':'UI_COMPLEMENTO'}}</label>
						<bcs-input-texto 
							id="formCrearPersona_direccionDepartamento"
							class="col-xs-3"
							k-ng-disabled="configData.bloqueoPersona"
							ng-model="recordData.direccionDepartamento">
						</bcs-input-texto>	
					</div>
					<hr>
					<div class="row">
						<label class="col-xs-3" translate>UI_TIPO_TELEFONO</label>
						<bcs-combobox-base 
							id="formCrearPersona_tipoTelefono"
							class="col-xs-3" 
							bcs-requerido="!modoRapido"
							working-net="workingNet.TipoTelefono"
							activado="!configData.bloqueoPersona"
							id-actual = "recordData.idTipoTelefono"
							id-defecto = "recordData.idTipoTelefonoDefecto"
							tipo="'combobox-tipo-telefono'"
							seleccionado="tipoTelefonoSeleccionado">
						</bcs-combobox-base>
						<label class="col-xs-2 col-xs-offset-1" translate>UI_TELEFONO</label>
						<bcs-input-texto 
							id="formCrearPersona_telefono"
							class="col-xs-3" 
							bcs-requerido="!modoRapido"
							k-ng-disabled="configData.bloqueoPersona" 
							ng-model="recordData.telefono"
							placeholder="placeholder.telefono" 
							ng-blur="validaFormatoTelefono()">
						</bcs-input-texto>	
					</div>
					<div class="row">
						<label class="col-xs-3" translate>UI_EMAIL</label>
						<bcs-input-texto 
							id="formCrearPersona_email" 
							class="col-xs-9" 
							placeholder="SesionValoresDefectoSistema.PLACEHOLDER_EMAIL"
							bcs-requerido="!modoRapido"
							k-ng-disabled="configData.bloqueoPersona" 
							ng-model="recordData.email" 
							ng-blur="validaFormatoEmail()">
						</bcs-input-texto>	
					</div>
				</div> <!-- ng-if="modoRapido" -->
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button 
			id="formCrearPersona_btnCrear" 
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CREAR_PERSONA' | translate" 
			bcs-habilitado="formCrearCliente.$valid" 
			bcs-clic="crearCliente()">
		</bcs-button>
		<bcs-button 
			ng-show="!modoRapido" 
			id="formCrearPersona_btnGuardarBorrador"
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  		
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR_BORRADOR' | translate" 
			bcs-habilitado="configData.bloqueoBuscador" 
			bcs-clic="guardarBorrador()">
		</bcs-button>
		<bcs-button 
			id="formCrearPersona_btnCancelar" 
			class="col-xs-2 pull-right" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="configData.bloqueoBuscador" 
			bcs-clic="cancelar()">
		</bcs-button>				
	</div>
</div>

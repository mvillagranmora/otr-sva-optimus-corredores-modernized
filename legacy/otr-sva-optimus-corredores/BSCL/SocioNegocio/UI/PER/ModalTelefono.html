<div id="ModalTelefono" ng-controller="ModalTelefonoCtrl as mte">
	<div class="row bcs-cuerpo">
		<form name="formTelefono" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-3" translate>UI_PAIS</label>
				<bcs-combobox-base
					id="formTelefono_IdPais"
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido = "mte.camposRequeridos['formTelefono_IdPais'].Requerido === 'S'"
					tipo="'combobox-pais'" 
					id-actual="mte.Telefono.IdPais"
					id-post-filtro="mte.TelefonoOriginal.IdPais"
					>
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_TELEFONO</label>
				<bcs-combobox-base
					id="formTelefono_IdTipoTelefono"
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido = "mte.camposRequeridos['formTelefono_IdTipoTelefono'].Requerido === 'S'"
					tipo="'combobox-tipo-telefono'" 
					id-actual="mte.Telefono.IdTipoTelefono"
					id-defecto="mte.TelefonoOriginal.IdTipoTelefono"
					id-post-filtro="mte.TelefonoOriginal.IdTipoTelefono">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_NUMERO</label>
				<bcs-input-texto class="col-xs-9" 
					id="formTelefono_Numero"
					bcs-requerido = "mte.camposRequeridos['formTelefono_Numero'].Requerido === 'S'"
					ng-model="mte.Telefono.Numero" 
					placeholder="mte.placeholder.telefono" 
					ng-blur="mte.validaFormatoTelefono()">
				</bcs-input-texto>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_ANEXO</label>
				<bcs-input-texto
					id="formTelefono_Anexo"
					bcs-requerido = "mte.camposRequeridos['formTelefono_Anexo'].Requerido === 'S'"
					class="col-xs-9" 
					ng-model="mte.Telefono.Anexo">
				</bcs-input-texto>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_PROPOSITO</label>
				<bcs-combobox-base
					id="formTelefono_CodigoProposito"
					bcs-requerido = "mte.camposRequeridos['formTelefono_CodigoProposito'].Requerido === 'S'"
					class="col-xs-9"
					tipo="'combobox-proposito-contacto'"
					filtros="mte.configuracionProposito.filtros"
					id-actual="mte.Telefono.CodigoProposito"
					id-defecto="mte.TelefonoOriginal.CodigoProposito">
				</bcs-combobox-base>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_COMENTARIO</label>
				<bcs-input-texto
					id="formTelefono_Comentario"
					bcs-requerido = "mte.camposRequeridos['formTelefono_Comentario'].Requerido === 'S'"
					class="col-xs-9" 
					ng-model="mte.Telefono.Comentario">
				</bcs-input-texto>
			</div>
						
			<div class="row">
				<label class="col-xs-3" translate>UI_ESTADO</label>
				<bcs-combobox-base
					id="formTelefono_IdEstado" 
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido = "mte.camposRequeridos['formTelefono_IdEstado'].Requerido === 'S'"
					filtros="mte.cmbbxEstadoTelefono.filtros"
					tipo="'combobox-estado-telefono'"
					id-actual="mte.Telefono.IdEstado"
					id-post-filtro="mte.TelefonoOriginal.IdEstado"
				>
				</bcs-combobox-base>
			</div>
			
						
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="ModalTelefono_aceptar" class="col-xs-2 pull-right" bcs-habilitado="(formTelefono.$valid==true && mte.validaFormatoTelefono()==true)" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mte.aceptar()"></bcs-button>
		<bcs-button id="ModalTelefono_cancelar" class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mte.cancelar()"></bcs-button>
	</div>
</div>

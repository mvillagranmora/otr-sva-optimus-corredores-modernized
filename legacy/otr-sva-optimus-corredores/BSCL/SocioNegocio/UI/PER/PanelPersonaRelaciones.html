<div id="PanelPersonaRelaciones" ng-controller="PanelPersonaRelacionesCtrl as ppr">
	<div class="row">
		<bcs-grid 
			seleccionado="ppr.relacionSeleccionada" 
			configuracion="ppr.gridRelacionados" 
			fn-doble-click="ppr.modificar(ppr.relacionSeleccionada)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaRelaciones_agregar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="ppr.agregar()">
		</bcs-button>
		<bcs-button id="PanelPersonaRelaciones_modificar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="ppr.relacionSeleccionada" bcs-clic="ppr.modificar(ppr.relacionSeleccionada)">
		</bcs-button>
		<bcs-button id="PanelPersonaRelaciones_bloquear" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" ng-show="ppr.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_BLOQUEAR' | translate" 
			bcs-habilitado="ppr.relacionSeleccionada && ppr.relacionSeleccionada.IdEstado !== 'VEN'" bcs-clic="ppr.bloqRelDesbloqRel('BLO')">
		</bcs-button>
		<bcs-button id="PanelPersonaRelaciones_desbloquear" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" ng-show="!ppr.showBloqueo" bcs-auto-desactivar="false" bcs-texto="'UI_DESBLOQUEAR' | translate" 
			bcs-habilitado="ppr.relacionSeleccionada && ppr.relacionSeleccionada.IdEstado !== 'VEN'" bcs-clic="ppr.bloqRelDesbloqRel('ACT')">
		</bcs-button>
	</div>
</div>

<div id="PanelPersonaDireccionesFisicas" ng-controller="PanelPersonaDireccionesFisicasCtrl as ppdf">
	<div class="row">
		<bcs-grid
			seleccionado="ppdf.direccionFisicaSeleccionada" 
			configuracion="ppdf.direccionFisicaOptions" 
			fn-doble-click="ppdf.modificar(ppdf.direccionFisicaSeleccionada)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaDireccionesFisicas_agregar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'"  bcs-clic="ppdf.agregar()"></bcs-button>
		<bcs-button id="PanelPersonaDireccionesFisicas_modificar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="ppdf.direccionFisicaSeleccionada"  bcs-clic="ppdf.modificar(ppdf.direccionFisicaSeleccionada)"></bcs-button>
		<bcs-button id="PanelPersonaDireccionesFisicas_eliminar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="ppdf.direccionFisicaSeleccionada"  bcs-clic="ppdf.eliminar(ppdf.direccionFisicaSeleccionada)"></bcs-button>
		<bcs-button id="PanelPersonaDireccionesFisicas_predeterminar" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_PREDETERMINAR' | translate" bcs-habilitado="ppdf.direccionFisicaSeleccionada"  bcs-clic="ppdf.predeterminar(ppdf.direccionFisicaSeleccionada)"></bcs-button>
	</div>
</div>

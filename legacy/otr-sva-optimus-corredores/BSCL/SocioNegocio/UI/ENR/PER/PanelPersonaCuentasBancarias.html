<div id="PanelPersonaCuentasBancarias" ng-controller="PanelPersonaCuentasBancariasEnrolCtrl as ppca">
	<div class="row">
		<bcs-grid id="grilla"
			seleccionado="ppca.cuentaBancariaSeleccionada" 
			configuracion="ppca.cuentaBancariaOptions" 
			fn-doble-click="ppca.modificar(ppca.cuentaBancariaSeleccionada)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaCuentasBancarias_agregar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'"  bcs-clic="ppca.agregar()"></bcs-button>
		<bcs-button id="PanelPersonaCuentasBancarias_modificar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="ppca.cuentaBancariaSeleccionada"  bcs-clic="ppca.modificar(ppca.cuentaBancariaSeleccionada)"></bcs-button>
		<bcs-button id="PanelPersonaCuentasBancarias_eliminar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="ppca.cuentaBancariaSeleccionada"  bcs-clic="ppca.eliminar(ppca.cuentaBancariaSeleccionada)"></bcs-button>
		<bcs-button id="PanelPersonaCuentasBancarias_predeterminar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_PREDETERMINAR' | translate" bcs-habilitado="ppca.cuentaBancariaSeleccionada"  bcs-clic="ppca.predeterminarCuenta(ppca.cuentaBancariaSeleccionada)"></bcs-button>
	</div>
</div>

<div id="ModalGrupoDireccionElectronica" ng-controller="ModalEnrolamientoGrupoDireccionElectronicaEnrolCtrl as mgdie">
    <div class="row bcs-cuerpo">
        <form name="formGrupoDireccionElectronica" class="col-xs-12 form-horizontal">
            <div class="row">
                <label class="col-xs-3" translate>UI_GRUPO</label>
                <bcs-input-texto id="formModalEnrolamientoGrupoDireccionElectronica_grupo"
                                 foco="true"
                                 class="col-xs-9"
                                 bcs-requerido="mgdie.camposRequeridos['formGrupoDireccionElectronica_grupo'].Requerido === 'S'"
                                 ng-model="mgdie.data.Grupo"></bcs-input-texto>
            </div>
            <div class="row">
                <label class="col-xs-3" translate>UI_COMENTARIO</label>
				<bcs-input-texto class="col-xs-9"
					id="formModalEnrolamientoGrupoDireccionElectronica_comentario"
					maxlength="100"
					tipo-campo="'textarea'"
					ng-model="mgdie.data.Comentario"
					bcs-requerido="mgdie.camposRequeridos['formGrupoDireccionElectronica_comentario'].Requerido === 'S'"
					atributos="margin: 0px; height:73px;resize:none;width: 100%">
				</bcs-input-texto>
            </div>
        </form>
    </div>
    <div class="row bcs-panel-comandos">
        <bcs-button id="ModalGrupoDireccionElectronica_aceptar" class="col-xs-2 pull-right" bcs-habilitado="formGrupoDireccionElectronica.$valid"
                    bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="true" bcs-texto="'UI_ACEPTAR' | translate"
                    bcs-clic="mgdie.aceptar()"></bcs-button>
        <bcs-button id="ModalGrupoDireccionElectronica_cancelar" class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
                    bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
                    bcs-clic="mgdie.cancelar()"></bcs-button>
    </div>
</div>

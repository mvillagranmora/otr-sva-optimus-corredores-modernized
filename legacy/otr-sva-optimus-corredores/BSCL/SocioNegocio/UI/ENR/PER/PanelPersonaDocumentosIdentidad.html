<div id="PanelPersonaDocumentosIdentidad" ng-controller="PanelEnrolamientoPersonaDocumentosIdentidadEnrolCtrl as ppdi">
    <div class="row">
        <bcs-grid
                id="grilla-panel-enrolamiento-persona-documentos-identidad"
                seleccionado="ppdi.documentoIdentidadSeleccionado"
                configuracion="ppdi.documentoIdentidadOptions"
                fn-doble-click="ppdi.modificar(ppdi.documentoIdentidadSeleccionado)">
        </bcs-grid>
    </div>
    <div class="row bcs-panel-comandos">
        <bcs-button id="PanelPersonaDocumentosIdentidad_agregar"
                    class="col-xs-2"
                    bcs-tipo="'bcs-button-primary'"
                    bcs-auto-desactivar="false"
                    bcs-texto="'UI_AGREGAR' | translate"
                    bcs-habilitado="'true'"
                    bcs-clic="ppdi.agregar()"></bcs-button>

        <bcs-button id="PanelPersonaDocumentosIdentidad_modificar"
                    class="col-xs-2"
                    bcs-tipo="'bcs-button-secondary'"
                    bcs-auto-desactivar="false"
                    bcs-texto="'UI_MODIFICAR' | translate"
                    bcs-habilitado="ppdi.documentoIdentidadSeleccionado"
                    bcs-clic="ppdi.modificar(ppdi.documentoIdentidadSeleccionado)"></bcs-button>

        <bcs-button id="PanelPersonaDocumentosIdentidad_eliminar"
                    class="col-xs-2"
                    bcs-habilitado="ppdi.documentoIdentidadSeleccionado"
                    bcs-tipo="'bcs-button-secondary'"
                    bcs-auto-desactivar="false"
                    bcs-texto="'UI_ELIMINAR' | translate"
                    bcs-clic="ppdi.eliminar()"></bcs-button>
    </div>
</div>

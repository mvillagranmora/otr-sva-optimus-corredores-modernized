<div id="ModalGrupoDireccionElectronica"
     ng-controller="ModalEnrolamientoGrupoDireccionElectronicaDetalleEnrolCtrl as mgdied">
     <div class="row bcs-cuerpo">
		<form name="mgdied.formGrupoDireccionElectronica" class="col-xs-12 form-horizontal">
			<div class="row col-xs-10">
				<label class="col-xs-3" translate>UI_GRUPO</label>
				<bcs-input-texto
						id="formGrupoDireccionElectronicaDetalle_grupo"
						k-ng-disabled="true"
						class="col-xs-7"
						ng-model="mgdied.data.Grupo"
				></bcs-input-texto>
			</div>
			<div class="row col-xs-10">
				<label for="formGrupoDireccionElectronicaDetalle_comentario" class="col-xs-3" translate>UI_COMENTARIO</label>
				<bcs-input-texto
						id="formGrupoDireccionElectronicaDetalle_comentario"
						tipo-campo="'textarea'"
						bcs-requerido="mgdied.camposRequeridos['formGrupoDireccionElectronica_comentario'].Requerido === 'S'"
						class="col-xs-7"
						ng-model="mgdied.data.Comentario"
						atributos="margin: 0px; height:73px;resize:both;overflow:auto;width: 100%"
				></bcs-input-texto>
			</div>
		</form>
		<form name="mgdied.formGrupoDireccionElectronicaDetalle" class="row">
			<div>
				<div class="row col-xs-10">
					<label class="col-xs-3" translate>UI_TIPO_DESTINATARIO</label>
					<bcs-combobox-base
							id="formGrupoDireccionElectronicaDetalle_tipoDestinatario"
							bcs-requerido
							class="col-xs-7"
							tipo="'combobox-tipo-destinatario'"
							id-actual="mgdied.data.IdTipoDestinatario"
							id-defecto="mgdied.dataOriginal.IdTipoDestinatario"
							todos="'N'"
					></bcs-combobox-base>
				</div>
				<div class="row col-xs-10">
					<label class="col-xs-3" translate>UI_DIRECCION_ELECTRONICA</label>
					<bcs-combobox-base
							id="formModalEnrolamientoGrupoDireccionElectronicaDetalle_direccionElectronica"
							class="col-xs-7"
							tipo="'combobox-enrolamiento-direccion-electronica'"
                            id-actual="mgdied.data.IdDireccionElectronica"
                            id-defecto="mgdied.dataOriginal.IdDireccionElectronica"
							todos="'N'"
                            filtros="mgdied.comboDireccion.filtros"
							bcs-requerido
					></bcs-combobox-base>
				</div>
			</div>
			<div class="col-xs-2 pull-right">
				<bcs-button id="ModalGrupoDireccionElectronica_aceptar"
					class="col-xs-12" bcs-habilitado="mgdied.formGrupoDireccionElectronicaDetalle.$valid" bcs-tipo="'bcs-button-input-form'"
					bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
					bcs-clic="mgdied.agregar()"></bcs-button>
			</div>
		</form>

			<div class="row">
				<bcs-grid
                    seleccionado="mgdied.direccionElectronicaSeleccionada"
                    configuracion="mgdied.direccionElectronicaOptions"
                    fn-doble-click="mgdied.noop()">
				</bcs-grid>
			</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button
			id="ModalGrupoDireccionElectronica_aceptar"
			class="col-xs-2 pull-right"
			bcs-habilitado="mgdied.formGrupoDireccionElectronica.$valid"
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_ACEPTAR' | translate"
			bcs-clic="mgdied.aceptar()"></bcs-button>
		<bcs-button
			id="ModalGrupoDireccionElectronica_cancelar"
			class="col-xs-2 pull-right"
			bcs-habilitado="mgdied.direccionElectronicaSeleccionada"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_ELIMINAR' | translate"
			bcs-clic="mgdied.eliminar(mgdied.direccionElectronicaSeleccionada)"></bcs-button>
		<bcs-button
			id="ModalGrupoDireccionElectronica_cancelar"
			class="col-xs-2 pull-right"
			bcs-habilitado="'true'"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_CANCELAR' | translate"
			bcs-clic="mgdied.cancelar()"></bcs-button>
	</div>
</div>

<div id="PanelPersonaDireccionesElectronicas" ng-controller="PanelPersonaDireccionesElectronicasEnrolCtrl as ppde">
	<div class="row">
		<bcs-grid
			seleccionado="ppde.direccionElectronicaSeleccionada" 
			configuracion="ppde.direccionElectronicaOptions" 
			fn-doble-click="ppde.modificar(ppde.direccionElectronicaSeleccionada)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button
			id="PanelPersonaDireccionesElectronicas_aceptar"
			class="col-xs-2"
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_AGREGAR' | translate"
			bcs-habilitado="'true'"
			bcs-clic="ppde.agregar()">
		</bcs-button>
		<bcs-button
			id="PanelPersonaDireccionesElectronicas_modificar"
			class="col-xs-2"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_MODIFICAR' | translate"
			bcs-habilitado="ppde.direccionElectronicaSeleccionada"
			bcs-clic="ppde.modificar(ppde.direccionElectronicaSeleccionada)">
		</bcs-button>
		<bcs-button
			id="PanelPersonaDireccionesElectronicas_eliminar"
			class="col-xs-2"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_ELIMINAR' | translate"
			bcs-habilitado="ppde.direccionElectronicaSeleccionada"
			bcs-clic="ppde.eliminar(ppde.direccionElectronicaSeleccionada)">
		</bcs-button>
		<bcs-button
			id="PanelPersonaDireccionesElectronicas_predeterminar"
			class="col-xs-2"
			bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="false"
			bcs-texto="'UI_PREDETERMINAR' | translate"
			bcs-habilitado="ppde.direccionElectronicaSeleccionada"
			bcs-clic="ppde.predeterminar(ppde.direccionElectronicaSeleccionada)">
		</bcs-button>
	</div>
</div>

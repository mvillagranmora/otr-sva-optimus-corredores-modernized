<div id="PanelPersonaRelaciones" ng-controller="PanelEnrolamientoPersonaRelacionesEnrolCtrl as ppr">
	<div class="row">
		<bcs-grid 
			seleccionado="ppr.relacionSeleccionada" 
			configuracion="ppr.gridRelacionados" 
			fn-doble-click="ppr.modificar(ppr.relacionSeleccionada)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="PanelPersonaRelaciones_agregar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="ppr.agregar()">
		</bcs-button>
		<bcs-button id="PanelPersonaRelaciones_modificar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="ppr.relacionSeleccionada" bcs-clic="ppr.modificar(ppr.relacionSeleccionada)">
		</bcs-button>
		<bcs-button id="PanelPersonaRelaciones_eliminar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" 
			bcs-habilitado="ppr.relacionSeleccionada" bcs-clic="ppr.eliminar(ppr.relacionSeleccionada)">
		</bcs-button>
	</div>
</div>

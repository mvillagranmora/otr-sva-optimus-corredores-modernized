<div class="row" ng-controller="PanelPortafolioCuentaCustodioEnrolCtrl as pPortCcust">
	<div class="row">
		<bcs-grid 
			configuracion="pPortCcust.gridCuentaCustodio"
			seleccionado="pPortCcust.cuentaCustodioSeleccionado" 
			fn-doble-click="pPortCcust.modificarCuentaCustodio(pPortCcust.cuentaCustodioSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-8">
			<div class="row">
				<bcs-button class="col-xs-2" 
					id="FormPortafolioCuentaCustodio_crear" 
					bcs-tipo="'bcs-button-primary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CREAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="pPortCcust.crearCuentaCustodio()">
				</bcs-button>
				<bcs-button class="col-xs-2" 
					id="FormPortafolioCuentaCustodio_editar" 
					bcs-tipo="'bcs-button-secondary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_EDITAR' | translate" 
					bcs-habilitado="pPortCcust.cuentaCustodioSeleccionado.IdCuentaCustodioPortafolio>0"  
					bcs-clic="pPortCcust.modificarCuentaCustodio(pPortCcust.cuentaCustodioSeleccionado)">
				</bcs-button>
				<bcs-button class="col-xs-2" 
					id="FormPortafolioCuentaCustodio_eliminar" 
					bcs-tipo="'bcs-button-secondary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_ELIMINAR' | translate" 
					bcs-habilitado="pPortCcust.cuentaCustodioSeleccionado.IdCuentaCustodioPortafolio>0"  
					bcs-clic="pPortCcust.eliminar(pPortCcust.cuentaCustodioSeleccionado)">
				</bcs-button>
			</div>
		</div>
	</div>
</div>

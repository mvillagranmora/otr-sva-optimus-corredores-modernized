<div id="PanelPortafolioPreferenciasNegocio" class="row" ng-controller="PanelPortafolioPreferenciasNegocioEnrolCtrl as ppAtr">
	<form class="col-xs-12 form-horizontal">
		<div class="row"> 
			<div class="row no-margin" style="padding-top: 0px;">
				<div>
					<div class="bcs-cuerpo">
						<form name="leFormPreferencias" class="col-xs-12 form-horizontal">
							<div style="overflow:auto; height:300px; border:1px solid #ddd; padding:10px;">
								<div class="row" style="border-bottom:1px solid #eee; margin-bottom:10px;">
									<div class="col-xs-12 titulo" translate>UI_PREFERENCIAS_GENERALES</div>
								</div>
								<div class="row">
									<div class="col-xs-12">
										<label class="col-xs-5" translate>UI_ADMINISTRACION_CARTERA_INDICADOR</label>
										<bcs-input-checkbox class="col-xs-2"
											ng-model="ppAtr.datosDespues['GENERALES//ADMCART']">
										</bcs-input-checkbox>
									</div>
								</div>
								<br>
								
								<div class="row" style="border-bottom:1px solid #eee; margin-bottom:10px;">
									<div class="col-xs-12 titulo" translate>UI_PREFERENCIAS_ORDENES</div>
								</div>
								<div class="row">
									<div class="col-xs-12">
										<label class="col-xs-5" translate>UI_MODALIDAD_CAPTACION</label>
										<bcs-input-checkgroup class="col-xs-7"
											valores="ppAtr.datosDespues['GRUPOORDENES//ORDMODALIDAD']"
											etiquetas = "ppAtr.valoresModalidadOrdenes"
											modo = "M">
										</bcs-input-checkgroup>
									</div>
								</div>
							</div>
						
						
							<div class="row bcs-panel-comandos" style="padding-top:20px">
								<div class="col-xs-8">
									<div class="row">
										<bcs-button class="col-xs-2" 
											id="AdministrarPortafolioDatosGenerales_guardar" 
											bcs-tipo="'bcs-button-primary'"
											bcs-auto-desactivar="false" 
											bcs-texto="'UI_GUARDAR' | translate"
											bcs-habilitado="'true'" 
											bcs-clic="ppAtr.guardar();">
										</bcs-button>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</form>
</div>

<div class="row" ng-controller="ModalPortafolioCuentaCustodioEnrolCtrl as modPortCcust">
	<div class="row">
		<form name="formModalPortafolioCuentaCustodio" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_BOVEDA</label>
					<bcs-combobox-base class="col-xs-8"
						id="bovedaComboPersona"
						tipo="'combobox-boveda'"
						filtros="modPortCcust.cmbbx.boveda.filtros"
						id-actual="modPortCcust.datosDespues.IdBoveda"
						id-post-filtro="modPortCcust.datosAntes.IdBoveda"
						activado="!modPortCcust.modoEditar"
						bcs-requerido="modPortCcust.camposRequeridos['bovedaComboPersona'].Requerido === 'S'"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row" ng-show="SesionLocale === 'PE'">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_MODELO_CUSTODIA</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="SesionLocale === 'PE'"
						tipo="'combobox-modelo-custodia'"
						filtros="modPortCcust.cmbbx.modeloCustodia.filtros"
						id-actual="modPortCcust.datosDespues.IdModeloCustodia"
						id-post-filtro="modPortCcust.datosAntes.IdModeloCustodia"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row" ng-show="SesionLocale === 'PE'">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_CUSTODIA</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="SesionLocale === 'PE'"
						tipo="'combobox-tipo-custodia-portafolio'"
						filtros="modPortCcust.cmbbx.tipoCustodia.filtros"
						seleccionado="modPortCcust.tipoCustodiaSel"
						id-actual="modPortCcust.datosDespues.IdTipoCustodia"
						id-post-filtro="modPortCcust.datosAntes.IdTipoCustodia"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CODIGO</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido="modPortCcust.camposRequeridos['formModalPortafolioCuentaCustodio_Codigo'].Requerido === 'S'"
						ng-model="modPortCcust.datosDespues.Codigo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_DE_CUENTA</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido ="(modPortCcust.camposRequeridos['tipoDeCuenta'].Requerido === 'S')"
						id="tipoDeCuenta"
						tipo="'combobox-tipo-cuenta-custodia'"
						id-actual="modPortCcust.datosDespues.IdTipoCuentaCustodia"
						id-post-filtro="modPortCcust.datosAntes.IdTipoCuentaCustodia"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row" ng-show="SesionLocale === 'PE'">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_BANCO_CUSTODIO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="SesionLocale === 'PE'"
						tipo="'combobox-banco-custodio'"
						activado="modPortCcust.activaBancoCustodio"
						id-actual="modPortCcust.datosDespues.IdPersonaBancoCustodio"
						id-post-filtro="modPortCcust.datosAntes.IdPersonaBancoCustodio"
						todos="'N'"
						filtros="modPortCcust.filtros.bancoCustodio">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row" ng-show="SesionLocale === 'PE'">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_BANCO_LIQUIDADOR</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido="SesionLocale === 'PE'"
						tipo="'combobox-banco-liquidador'"
						activado="modPortCcust.activaBancoLiquidador"
						id-actual="modPortCcust.datosDespues.IdPersonaBancoLiquidador"
						id-post-filtro="modPortCcust.datosAntes.IdPersonaBancoLiquidador"
						todos="'N'"
						filtros="modPortCcust.filtros.bancoLiquidador">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row" ng-show="SesionLocale !== 'PE'">
				<div class="col-xs-6">
					<label class="col-xs-10" translate>UI_LIQUIDA_DIVIDENDOS</label>
					<bcs-input-checkbox class="col-xs-2"
						ng-model="modPortCcust.datosDespues.LiquidaDividendos">
					</bcs-input-checkbox>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-10" translate>UI_LIQUIDA_VENCIMIENTOS</label>
					<bcs-input-checkbox class="col-xs-2"
						ng-model="modPortCcust.datosDespues.LiquidaVencimientos">
					</bcs-input-checkbox>
				</div>
			</div>
			<div class="row" ng-show="SesionLocale !== 'PE'">
				<div class="col-xs-6">
					<label class="col-xs-10" translate>UI_LIQUIDA_CUPONES</label>
					<bcs-input-checkbox class="col-xs-2" 
						ng-model="modPortCcust.datosDespues.LiquidaCupones">
					</bcs-input-checkbox>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-10" translate>UI_LIQUIDA_PREPAGOS</label>
					<bcs-input-checkbox class="col-xs-2"
						ng-model="modPortCcust.datosDespues.LiquidaPrepagos">
					</bcs-input-checkbox>
				</div>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="formModalPortafolioCuentaCustodio.$valid"  
			bcs-clic="modPortCcust.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modPortCcust.cancelar();">
		</bcs-button>
	</div>
</div>

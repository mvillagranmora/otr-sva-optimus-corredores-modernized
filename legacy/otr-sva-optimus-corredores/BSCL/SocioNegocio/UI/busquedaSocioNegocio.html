<div id="BusquedaSocioNegocio" ng-controller="BusquedaSocioNegocioCtrl">
    <div class="row">
            <div class="col-xs-10">
                <div class="row">
                    <div class="col-xs-8">
                        <label class="col-xs-3" translate>UI_RAZON_SOCIAL_O_NOMBRE</label>
                        <bcs-input-texto class="col-xs-9" foco="true" ng-model="formData.NombreCompleto"></bcs-input-texto>
                    </div> 
                </div>
                <div class="row">
                    <div class="col-xs-4">
                        <label class="col-xs-6" translate>UI_TIPO_DOCUMENTO_IDENTIDAD</label>
                        <bcs-combobox-base class="col-xs-6"
                            tipo="'combobox-tipo-documento-identidad'"
                            id-actual="formData.tipoDocumentoIdentidad"
                            id-defecto="'0'" 
                            todos="'S'" 
                            item-post-filtro="'1'">
                        </bcs-combobox-base>
                    </div>
                    <div class="col-xs-4">
                        <label class="col-xs-6" translate>UI_DOCUMENTO_IDENTIDAD_ABR</label>
                        <bcs-input-texto class="col-xs-6" ng-model="formData.NumeroDocumentoIdentidad" ></bcs-input-texto>
                     </div>
                </div>
            </div>
            <div class="col-xs-2">
                <div class="row">
                    <bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="read()"></bcs-button>
                </div>
                <div class="row">
                    <bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="clear()"></bcs-button>
                </div>
            </div>
        </div>
    <div class="row">
        <bcs-grid 
            id="grid-socio-negocio"
            configuracion = "gridConfigBusquedaSocioNegocio"
            seleccionado = "seleccionGrillaBusquedaSocioNegocio">
        </bcs-grid>
    </div>
    <div class="row bcs-panel-comandos alignButtonsToRight">
        <bcs-button id="BusquedaSocioNegocio_seleccionarSocioNegocio"  class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_SELECCIONAR' | translate" bcs-habilitado="'true'"  bcs-clic="seleccionarSocioNegocio()"></bcs-button>
    </div>

</div>

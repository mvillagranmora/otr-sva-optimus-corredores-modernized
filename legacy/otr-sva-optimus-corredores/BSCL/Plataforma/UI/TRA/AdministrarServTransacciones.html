<div class="col-xs-12" ng-controller="AdministrarServTransaccionesCtrl as admServTran">
	<div class="row bcs-cuerpo">
		<form id="FormAdmServTran" name="FormAdmServTran" class="filters-formulario">
		    <div class="row">
       				<div class="row">
	       				<bcs-grid 
	       					id="grid-operadores"
	       					fn-exportar-excel = "exportarExcel"  
							configuracion="admServTran.gridOperadores"
							fn-doble-click="admServTran.win.editarOperador(admServTran.selOperador)"
							seleccionado="admServTran.selOperador">
						</bcs-grid>
					</div>
					<div class="row col-xs-12 bcs-panel-comandos">
						<div class="row">
							<div class="col-xs-8">
								<bcs-button  
									class="col-xs-3 " 
									bcs-tipo="'bcs-button-primary'" 	
									ng-if="admServTran.win.muestraCrear" 	
									bcs-mostrar="admServTran.win.muestraCrear"  	
									bcs-auto-desactivar="false" 
									bcs-habilitado="'true'"
									bcs-texto="'UI_NUEVO_OPERADOR' | translate" 	 
									bcs-clic="admServTran.win.crearOperador();">	
								</bcs-button>
								<bcs-button  
									class="col-xs-2" 
									bcs-tipo="'bcs-button-secondary'"  	
									ng-if="admServTran.win.muestraEditar" 	
									bcs-mostrar="admServTran.win.muestraEditar"  	
									bcs-auto-desactivar="false" 
									bcs-texto="'UI_EDITAR' | translate" 
									bcs-habilitado="admServTran.selOperador"  
									bcs-clic="admServTran.win.editarOperador(admServTran.selOperador);">	
								</bcs-button>
								<!-- <bcs-button  class="col-xs-2" bcs-tipo="''" 			ng-if="admServTran.win.muestraCambiarEstado" 	bcs-mostrar="admServTran.win.muestraCambiarEstado" 	bcs-auto-desactivar="false" bcs-texto="'UI_QUITAR' | translate" 	bcs-habilitado="'true'"  bcs-clic="admServTran.win.cambiarEstado();">	</bcs-button> -->
							</div>
							<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"  bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
								<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
							</bcs-menu>
						</div>
					</div>
			</div>
		</form>
	</div>
</div>

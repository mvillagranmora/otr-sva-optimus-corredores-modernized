<div id="ModalOperador" class="row" ng-controller="administrarmodOperCtrl as modOper">
	<uib-tabset>
		<uib-tab id="TabDatosGenerales" heading="{{'UI_DATOS_GENERALES'| translate}}" select="selectTab1()" >
			<div class="row">
				<form name="formModalOperador" class="col-xs-12 form-horizontal">
					<div class="row bcs_titulo">
						<span>{{'UI_OPERADOR'|translate}}</span>
					</div>
					<div class="row">
						<label class="col-xs-2" translate>UI_CODIGO_OPERADOR</label>
						<bcs-input-texto 
							class="col-xs-4" 
							bcs-requerido
							maxlength = "3"
							ng-model="modOper.datosDespues.CodigoOperador"
							k-ng-disabled="!modOper.win.modoCrear">
						</bcs-input-texto>
						<label class="col-xs-2" translate>UI_CODIGO_CORREDORA</label>
						<bcs-combobox-base class="col-xs-4"
								bcs-requerido
								tipo="'combobox-corredora'"
								id-actual="modOper.datosDespues.IdCorredora"
								id-defecto = "modOper.param.operador.IdCorredora"
								filtros="modOper.filtrosCorredora"> 
							</bcs-combobox-base >				
					</div>
					<div class="row">
					<!-- [CELCONDOR - 688] Campo libro de ordenes en "operadores en rueda" -->					 
					<div class="col-xs-12">
						<label class="col-xs-2" translate>UI_LIBRO_ORDENES</label>
						<bcs-combobox-base class="col-xs-4"
						    bcs-requerido
							tipo="'combobox-libro-orden'"							 
							id-actual="modOper.datosDespues.IdLibroOrdenes"
							id-defecto = "modOper.param.operador.IdLibroOrdenes"						 
							todos="'N'"
							activado="!win.modoLectura"
							filtros="cmbbx.oConfiguracionOrdLibroOrdenes.filtros"
							seleccionado="modOper.LibroOrdenes">
						</bcs-combobox-base>
					</div>					 
				   <!-- [CELCONDOR - 688] Campo libro de ordenes en "operadores en rueda" -->
				</div>
					<hr>
					<div class="row">
						<label class="col-xs-2" translate>UI_RESERVAR_TRANSACCION</label>
				  		<bcs-input-checkbox class="col-xs-8"
							ng-model="modOper.datosDespues.ReservaTransaccion">
						</bcs-input-checkbox> 
					</div>
					<hr>
					<div class="row">
						<label class="col-xs-2" translate>UI_ASOCIADO_PORTAFOLIO</label>
				  		<bcs-input-checkbox class="col-xs-8" ng-click="cambiarTamanoVentana()"
							ng-model="modOper.datosDespues.UtilizaPortafolio">
						</bcs-input-checkbox> 
					</div>
					<div class="row">
						<label class="col-xs-2" translate>UI_HABILITADO</label>
				  		<bcs-input-checkbox class="col-xs-8"
							ng-model="modOper.datosDespues.IdEstado">
						</bcs-input-checkbox>
					</div>
					<div class="row" ng-show="modOper.datosDespues.UtilizaPortafolio">
						<div class="row">
							<label class="col-xs-2" translate>UI_CLIENTE</label>
							<bcs-combobox-base class="col-xs-4"
							 	id="UI_SOCIO_NEGOCIO"
							 	auto-cargar="'false'"
							    tipo="'combobox-socio-negocio'"
							    filtros="modOper.cbbx.socio.filtros"
								cascada-a="modOper.cbbx.portafolio.filtros.IdCliente"
								cascada-valor="'IdCliente'"
				                cascada-defecto="-1"
				                id-actual="modOper.datosDespues.IdSocioDeNegocio"
								id-defecto="modOper.datosDespues.IdSocioDeNegocioPost"
				                buscar='socio_texto'
							    configuracion= "modOper.cbbx.socio.configuracion">
							</bcs-combobox-base >
							<label class="col-xs-2" translate>UI_PORTAFOLIO</label>
							<bcs-combobox-base class="col-xs-4"
							 	id="UI_PORTAFOLIO"
							 	auto-cargar="'false'"
							    tipo="'combobox-portafolio'"
							    filtros="modOper.cbbx.portafolio.filtros"
				                      id-post-filtro="modOper.datosDespues.IdPortafolioPost"
								id-actual="modOper.datosDespues.IdPortafolio"
							    configuracion= "modOper.cbbx.portafolio.configuracion" >
							</bcs-combobox-base >
						</div>
						<br/>
						<div class="row">
							<label class="col-xs-12 k-window-subtitle" translate>UI_CONFIGURACION</label>	
							<table class="table col-xs-12">
								<thead>
									<tr>
										<td width="5%"  translate>UI_CODIGO</td>
										<td width="50%"  translate>UI_TIPO_INSTRUMENTO</td>
										<td width="15%"  translate>UI_ASIGNACION_AUTOMATICA</td>
										<td width="15%"  translate>UI_MOV_FACTURAR_AUTOMATICO</td>
										<td width="15%"  translate>UI_COMPROBANTE_AUTOMATICO</td>
									</tr>
								</thead>
								<tbody>
									<tr ng-repeat="val in modOper.datosDespues.listaTipoInstrumentos">
										<td>{{val.IdTipoInstrumento}}</td>
										<td>{{val.NombreTipoInstrumento}}</td>
										<td>
											<bcs-input-checkbox ng-model="val.AsignacionAuto"></bcs-input-checkbox>
										</td>
										<td>
											<bcs-input-checkbox ng-model="val.MovimientoFacturarAuto"></bcs-input-checkbox>
										</td>
										<td>
											<bcs-input-checkbox ng-model="val.ComprobanteAuto"></bcs-input-checkbox>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
					<hr>
					<div class="row col-xs-12 bcs-panel-comandos alignButtonsToRight">
						<bcs-button class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'" 
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_CANCELAR' | translate" 
							bcs-habilitado="'true'" 
							bcs-clic="modOper.win.cancelar();">
						</bcs-button>
						<bcs-button class="col-xs-2" 
							bcs-tipo="'bcs-button-primary'" 
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_GUARDAR' | translate" 
							bcs-habilitado="formModalOperador.$valid"
							bcs-clic="modOper.win.guardar();">
						</bcs-button>
					</div>
				</form>	
			</div>		
		</uib-tab>
		<uib-tab id="TabCarterasInversion" heading="{{'UI_CARTERAS_INVERSION' | translate}}" select="selectTab2()" ng-show="!modOper.win.modoCrear">
			<div class="row">
				<div class="row">
					<label class="col-xs-3" translate>UI_NOMBRE</label>
					<bcs-combobox-base
						class="col-xs-5" 
						bcs-requerido
						activado="true"
						tipo="'combobox-cartera-inversion'"
						id-defecto = "'N'"
						id-actual = "modOper.inputCarteraInversion"
						filtros="modOper.filtrosCarteraInversion">
					</bcs-combobox-base>
					<bcs-button 
						class="col-xs-2 col-xs-offset-1" 
						bcs-tipo="'bcs-button-primary'" 
						ng-show="true" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_AGREGAR' | translate" 
						bcs-habilitado="modOper.inputCarteraInversion"  
						bcs-clic="modOper.agregarCarteraInversion()">
					</bcs-button>
				</div>
				<div class="row">
					<bcs-grid 
						configuracion="modOper.tablaCarteraInversion"
						seleccionado="modOper.seleccionadoCarteraInversion">
					</bcs-grid>		
				</div>
				<div class="row bcs-panel-comandos">
					<bcs-button
						class="col-xs-2" 
						bcs-tipo="'bcs-button-secondary'"  
						ng-show="true" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_QUITAR' | translate" 
						bcs-habilitado="modOper.seleccionadoCarteraInversion"  
						bcs-clic="modOper.eliminarCarteraInversion(modOper.seleccionadoCarteraInversion)">
					</bcs-button>
				</div>	
			</div>
		</uib-tab>
		<uib-tab id="TabCarterasEjecutivo" heading="{{'UI_CARTERAS_EJECUTIVO' | translate}}" select="selectTab3()" ng-show="!modOper.win.modoCrear">
            <div class="row">
                <div class="row">
                    <label class="col-xs-3" translate>UI_NOMBRE</label>
                    <bcs-combobox-base
                        class="col-xs-5" 
                        bcs-requerido
                        activado="true"
                        tipo="'combobox-cartera-ejecutivo'"
                        id-defecto = "'N'"
                        id-actual = "modOper.inputCarteraEjecutivo"
                        filtros="modOper.filtrosCarteraEjecutivo">
                    </bcs-combobox-base>
                    <bcs-button 
                        class="col-xs-2 col-xs-offset-1" 
                        bcs-tipo="'bcs-button-primary'"  
                        ng-show="true" 
                        bcs-auto-desactivar="false" 
                        bcs-texto="'UI_AGREGAR' | translate" 
                        bcs-habilitado="modOper.inputCarteraEjecutivo"  
                        bcs-clic="modOper.agregarCarteraEjecutivo()">
                    </bcs-button>
                </div>
                <div class="row">
                    <bcs-grid 
                        configuracion="modOper.tablaCarteraEjecutivo"
                        seleccionado="modOper.seleccionadoCarteraEjecutivo">
                    </bcs-grid>     
                </div>
                <div class="row bcs-panel-comandos">
                    <bcs-button
                        class="col-xs-2" 
                        bcs-tipo="'bcs-button-secondary'" 
                        ng-show="true" 
                        bcs-auto-desactivar="false" 
                        bcs-texto="'UI_QUITAR' | translate" 
                        bcs-habilitado="modOper.seleccionadoCarteraEjecutivo"  
                        bcs-clic="modOper.eliminarCarteraEjecutivo(modOper.seleccionadoCarteraEjecutivo)">
                    </bcs-button>
                </div>  
            </div>
        </uib-tab>
	</uib-tabset>
</div>

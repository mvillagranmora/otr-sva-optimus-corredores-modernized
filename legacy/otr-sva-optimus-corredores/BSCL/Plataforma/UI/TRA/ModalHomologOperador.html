<div class="row" ng-controller="administrarModHomologOperCtrl as modHOper">
	<form name="formModalHomologOperador" class="col-xs-12 form-horizontal">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{'UI_OPERADOR'|translate}}</span>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_OPERADOR</label>
				<bcs-input-texto 
					class="col-xs-8" 
					ng-model="modHOper.datosDespues.CodigoOperador"
					k-ng-disabled="'true'">
				</bcs-input-texto>
	        </div>
	    </div>
	    <hr>
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_BOLSA</label>
				<bcs-combobox-base class="col-xs-8" bcs-requerido
					id="UI_BOLSA"
					tipo="'combobox-bolsa'"
					filtros="modHOper.cbbx.bolsa.filtros"
					id-actual="modHOper.datosDespues.IdBolsa" 
					id-defecto="modHOper.datosDespues.IdBolsaDefecto">
				</bcs-combobox-base >
	        </div>
	    </div>
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_CODIGO_HOMOLOGACION</label>
				<bcs-input-texto 
					class="col-xs-8" bcs-requerido
					ng-model="modHOper.datosDespues.CodigoHomologacion"
					k-ng-disabled="!modHOper.win.modalidad ==='crear'">
				</bcs-input-texto>
			</div>
		</div>
		<hr>
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_HABILITADO</label>
		  		<bcs-input-checkbox 
					ng-model="modHOper.datosDespues.IdEstado" 
					ng-disabled="modHOper.win.modoLectura">
				</bcs-input-checkbox>
			</div>
		</div>
		<hr>
		<div class="row col-xs-12 bcs-panel-comandos">
			<bcs-button class="col-xs-2" 
				bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_GUARDAR' | translate" 
				bcs-habilitado="formModalHomologOperador.$valid" 
				bcs-clic="modHOper.win.guardar();">
			</bcs-button>
			<bcs-button class="col-xs-2" 
				bcs-tipo="'default'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="modHOper.win.cancelar();">
			</bcs-button>
		</div>
	</form>
</div>

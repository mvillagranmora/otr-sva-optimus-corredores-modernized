<div id="AgregarModificarDeterioro" class="col-xs-12" ng-controller="AgregarModificarDeterioroCtrl"
    style="padding-right: 0px;">
    <form name="AgregarModificarDeterioro" class="col-xs-12 form-horizontal">
        <div class="col-xs-12 bcs-cuerpo">
            <div class="row">
                <label class="col-xs-3" translate>UI_EMISOR</label>
                <bcs-input-texto class="col-xs-6" ng-model="data.Emisor" bcs-requerido="true"
                    k-ng-disabled="accionBoton">
                </bcs-input-texto>
            </div>
            <div class="row" style="margin-top:10px;">
                <label class="col-xs-3" translate>UI_FLAG</label>
                <bcs-input-checkbox class="col-xs-3" ng-model="data.FlagDeterioro">
                </bcs-input-checkbox>
            </div>
            <div class="row" style="margin-top:10px;">
                <label class="col-xs-3" translate>UI_PORCENTAJE</label>
                <bcs-input-numero class="col-xs-6" k-ng-model="data.PorcentajeDeterioro" bcs-requerido="true"
                    decimales="4" bcs-mayor-que	= "'0'">
                </bcs-input-numero>
            </div>
            <div class="row" style="margin-top:10px;">
                <label class="col-xs-3" translate>UI_FASE</label>
                <bcs-input-numero class="col-xs-6" k-ng-model="data.Fase" bcs-requerido="true"
                    decimales="0"
                    bcs-mayor-que = "'0'">
                </bcs-input-numero>
            </div>
        </div>
    </form>
    <br>
    <div class="row alignButtonsToRight" style="padding-top: 50px; clear: both; margin: 0 0 3px 0;">
        <bcs-button id="UI_ACEPTAR" class="col-xs-2" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="'false'"
        bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="AgregarModificarDeterioro.$valid"
        bcs-clic="aceptar()"></bcs-button>
        <bcs-button id="UI_CANCELAR" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'"
        bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
    </div >
</div>

<div class="row" ng-controller='MantenedorDeterioroCtrl'>
	<!-- START FILTERS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-2">
				</div>
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"
				 bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"
				  bcs-habilitado="true"  bcs-clic="data.buscar(filtros)"></bcs-button>
			</div>
		</div>
	</div>
		<div class="row">
		<bcs-grid
			fn-doble-click="ModificarDeterioro(data.flagSeleccionado)"
			fn-exportar-excel="data.exportarExcel"
			seleccionado="data.flagSeleccionado"
			configuracion="flags">
		</bcs-grid>
	</div>
	<!-- START COMMAND PANEL -->
	<div class="row" style="padding-top: 10px; clear: both; margin: 0 0 3px 0;">
		<bcs-button id="UI_INGRESAR"
		 class="col-xs-2" bcs-tipo="'bcs-button-primary'"
		 bcs-auto-desactivar="'false'" bcs-texto="'UI_CREAR' | translate" 
		 bcs-habilitado="'true'" bcs-clic="CrearDeterioro()"></bcs-button>
		<bcs-button
    	id="Flag_Modificar"
    	class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
    	bcs-habilitado="data.flagSeleccionado"
   	 	bcs-auto-desactivar="false"
    	bcs-texto="'UI_MODIFICAR' | translate"
    	bcs-clic="ModificarDeterioro()"></bcs-button>
		<bcs-button id="Flag_Eliminar"
        class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
        bcs-habilitado="data.flagSeleccionado"
        bcs-auto-desactivar="false"
        bcs-texto="'UI_ELIMINAR' | translate"
        bcs-clic="EliminarDeterioro(data.flagSeleccionado)"></bcs-button>
      <bcs-button 
  		id="Flag_Cargar"
 		class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
 		bcs-habilitado="'true'"
  		bcs-auto-desactivar="false" 
  		bcs-texto="'UI_CARGAR' | translate" 
  		bcs-clic="cargarArchivoDeterioroEmisores()"></bcs-button>
		
	</bcs-menu>
	</div>
</div>

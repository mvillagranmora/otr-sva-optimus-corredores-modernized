<div class="row" ng-controller='MantenedorEmisoresCtrl'>
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-5">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base
						class="col-xs-8"
						tipo="'combobox-estado-instrumento'"
						todos = "'S'"
						item-post-filtro = "'1'"
						id-actual="filtros.IdEstado">
					</bcs-combobox-base>
				</div>
			</div>
		</div>
		<!-- FIN FILTROS -->
		<!-- INICIO BOTONES -->
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="formData.buscar(filtros)"></bcs-button>
			</div>
		</div>
	</div>
	<!-- FIN BOTONES -->
	<div class="row">
		<bcs-grid
			fn-doble-click="formData.modificar(formData.emisorSeleccionado)"
			fn-exportar-excel="formData.exportarExcel"
			seleccionado = "formData.emisorSeleccionado"
			configuracion="formData.grilla">
		</bcs-grid>
	</div>
	<!-- INICIO PANEL COMANDOS -->

	<div class="row bcs-panel-buttons">
		<bcs-button id="Emisores_Ingresar" bcs-tipo = "'bcs-button-primary'" class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_INGRESAR' | translate" bcs-clic="formData.ingresar()"></bcs-button>
		<bcs-button id="Emidores_Modificar" bcs-tipo = "'bcs-button-secondary'" class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-clic="formData.modificar(formData.emisorSeleccionado)"></bcs-button>
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo = "'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="formData.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
	
	
  	

</div>

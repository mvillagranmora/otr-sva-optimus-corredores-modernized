<div class="row" ng-controller='CrearModificarEmisorCtrl'>
    <form name="CrearModificarEmisorForm">
       <div class="row">
           <div class="row">
               <label class="col-xs-4" translate>UI_EMISOR</label>
               <bcs-input-texto 
               		class="col-xs-8" 
               		ng-model="emisor.IdEmisor" 
               		k-ng-disabled="!(modo === 'INGRESAR')"
               		bcs-requerido="(modo === 'INGRESAR')"
               	></bcs-input-texto>
           </div>
           <div class="row" class="row" ng-show ="!(modo === 'INGRESAR')">
               <label class="col-xs-4" translate>UI_NOMBRE</label>
               <bcs-input-texto class="col-xs-8" ng-model="emisor.NombreCompleto" k-ng-disabled="'true'"></bcs-input-texto>
           </div>
           <div class="row" ng-show="(modo === 'INGRESAR')">
           		<label class="col-xs-4" translate>UI_NOMBRE</label>
				<bcs-combobox-base class="col-xs-8"
					bcs-requerido	="(modo === 'INGRESAR')"
					tipo="'combobox-contraparte'"
					id-actual="'false'"
					id-defecto="'0'"
					todos="'S'"
					seleccionado="persona.seleccionado">
				</bcs-combobox-base>
           </div>
           
           <div class="row">
               <label class="col-xs-4" translate>UI_CODIGO</label>
               <bcs-input-texto class="col-xs-8" ng-model="emisor.CodigoEmisor"></bcs-input-texto>
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_REGULADOR</label>
               <bcs-input-texto class="col-xs-8" ng-model="emisor.Regulador"></bcs-input-texto>
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_CODIGO_REGULADOR</label>
               <bcs-input-texto class="col-xs-8" ng-model="emisor.CodigoRegulador"></bcs-input-texto>
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_EMITE_IRF</label>
               <input type="checkbox"
                    class="col-xs-1"
					ng-model="emisor.EmiteIRF"
			   >
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_EMITE_IIF</label>
               <input type="checkbox"
                    class="col-xs-1"
					ng-model="emisor.EmiteIIF"
			   >
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_EMITE_FUNGIBLES</label>
               <input type="checkbox"
                    class="col-xs-1"
					ng-model="emisor.EmiteFungible"
			   >
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_ES_AGF</label>
               <input type="checkbox"
                    class="col-xs-1"
					ng-model="emisor.IndicadorAGF"
			   >
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_CLASIFICADOR_RIESGO</label>
               <bcs-input-texto class="col-xs-8" ng-model="emisor.IdEntidadClasificadoraRiesgo"></bcs-input-texto>
           </div>
           <div class="row">
               <label class="col-xs-4" translate>UI_VALOR_RIESGO</label>
               <bcs-input-texto class="col-xs-8" ng-model="emisor.ValorClasificacionRiesgoIIF"></bcs-input-texto>
           </div>

           <div class="row">
               <label class="col-xs-4" translate>UI_TIPO_ENTIDAD_EMISOR</label>
               <bcs-combobox-base
                    class="col-xs-8"
                    bcs-requerido
                    tipo="'combobox-tipo-entidad'"
                    id-defecto="emisorDef.TipoEntidad"
                    id-actual="emisor.TipoEntidad">
               </bcs-combobox-base >
           </div>
           
           <div class="row">
               <label class="col-xs-4" translate>UI_ESTADO</label>
               <bcs-combobox-base
                   class="col-xs-8"
                   bcs-requerido
                   tipo="'combobox-estado-instrumento'"
                   id-defecto="emisorDef.IdEstado"
                   id-actual="emisor.IdEstado">
               </bcs-combobox-base >
           </div>
       </div>
    </form>
    <div class=row></div>
    <hr>
    <div class="row alignButtonsToRight">
        <bcs-button id="UI_ACEPTAR" class="col-xs-4" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="CrearModificarEmisorForm.$valid" bcs-clic="aceptar()"></bcs-button>
        <bcs-button id="UI_CANCELAR" class="col-xs-4" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
    </div>
</div>

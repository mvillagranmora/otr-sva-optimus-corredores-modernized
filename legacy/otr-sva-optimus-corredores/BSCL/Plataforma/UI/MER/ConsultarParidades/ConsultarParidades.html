<div class="row" ng-controller='ConsultarParidadesCtrl'>
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-11">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-2" translate>UI_FECHA</label>
					<bcs-input-date
						class="col-xs-5"
						k-ng-model="filtros.FechaDesde">
					</bcs-input-date>
					<bcs-input-date
						class="col-xs-5"
						k-ng-model="filtros.FechaHasta">
					</bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_ORIGEN</label>
					<bcs-combobox-base 
						class="col-xs-7"
						todos = "'S'"
						item-post-filtro = "'1'"
						tipo="'combobox-tipo-registro-paridad'"
						id-actual="filtros.IdTipoRegistro">
					</bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4 col-xs-offset-1" translate>UI_MONEDA</label>
					<bcs-combobox-base
						class="col-xs-7"
						tipo="'combobox-moneda'"
						todos = "'S'"
						item-post-filtro = "'1'"
						id-actual="filtros.IdMoneda">
					</bcs-combobox-base>
				</div>
			</div>
		</div>
		<!-- FIN FILTROS -->
		<!-- INICIO BOTONES -->
		<div class="col-xs-1">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="formData.buscar(filtros)"></bcs-button>
			</div>
		</div>
	</div>
	<!-- FIN BOTONES -->
	<div class="row">
		<bcs-grid
			api = "formData.apiGrid"
			fn-exportar-excel="formData.exportarExcel"
			seleccionado = "formData.registroSeleccionado"
			configuracion="formData.defaultOptions">
		</bcs-grid>
	</div>
	<!-- INICIO PANEL COMANDOS -->

	<div class="row bcs-panel-comandos">
		<bcs-button id="ConsultarParidades_guardar" class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="formData.guardar()"></bcs-button>
		<bcs-button id="ConsultarParidades_ingresar" class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_INGRESAR' | translate" bcs-clic="formData.ingresar()"></bcs-button>
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="formData.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
	
	
  	

</div>

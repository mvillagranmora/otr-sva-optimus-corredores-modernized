<div class="row" ng-controller='CrearParidadTipoCambioCtrl'>
	<form name="CrearParidadTipoCambioForm" style="min-height: 100px;">
		<div class="row">
			<div class="row">
				<label class="col-xs-2" translate>UI_FECHA</label>
				<bcs-input-date 
					class="col-xs-3"
					bcs-requerido
					k-ng-model="registro.Fecha">
				</bcs-input-date>	
				<label class="col-xs-2 col-xs-offset-1" translate>UI_MONEDA</label>
				<bcs-combobox-base 
					class="col-xs-3"
					bcs-requerido
					tipo="'combobox-moneda'"
					id-actual="registro.IdMoneda">
				</bcs-combobox-base >
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_PARIDAD</label>
				<bcs-input-numero 
					class="col-xs-3" 
					bcs-requerido
					bcs-mayor-igual-que="'0'"
					k-ng-model="registro.Paridad">
				</bcs-input-numero>	
				<label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO_REGISTRO</label>
				<bcs-combobox-base 
					class="col-xs-3"
					bcs-requerido
					tipo="'combobox-tipo-registro-paridad'"
					id-actual="registro.IdTipoRegistro">
				</bcs-combobox-base >
			</div>	
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<bcs-button id="UI_ACEPTAR" class="col-xs-2" bcs-tipo="'principal'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate"  bcs-habilitado="CrearParidadTipoCambioForm.$valid" bcs-clic="aceptar()"></bcs-button>
		<bcs-button id="UI_CANCELAR" class="col-xs-2" bcs-auto-desactivar="'false'" bcs-texto="'UI_CANCELAR' | translate"  bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

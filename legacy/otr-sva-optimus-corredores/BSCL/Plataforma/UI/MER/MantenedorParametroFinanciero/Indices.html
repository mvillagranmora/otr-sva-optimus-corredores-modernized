<div id="indices" ng-controller='IndicesCtrl as indices'>
	<div class="row">
		<!-- INICIO FILTROS -->
		<div class="col-xs-11">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-5" translate>UI_TIPO_PERIODO</label>
					<bcs-combobox-base class="col-xs-5"
			  			tipo="'combobox-tipo-indice'"
			  			id-actual="indices.filtros.tipoPeriodo"
			  			id-defecto="'DI'"
			  			todos="'N'">
			  		</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-2" translate>UI_PERIODO</label>
					<bcs-input-date
						class="col-xs-5"
						id="indices_Periodo"
						k-options="indices.configuracionPeriodo"
						k-ng-model="indices.filtros.periodo"
						todo-dias="'true'">
					</bcs-input-date>
				</div>
			</div>
		</div>
		<!-- FIN FILTROS -->
	</div>
	<!-- INICIO GRILLA -->
	<div class="row">
		<bcs-grid
			id="indices-parametros-financieros"
			api = "indices.apiGrid"
			fn-exportar-excel="indices.exportarExcel"
			seleccionado = "indices.registroSeleccionado"
			configuracion="indices.defaultOptions">
		</bcs-grid>
	</div>
	<!-- FIN GRILLA -->
	<div class="row bcs-panel-buttons alignButtonsToRight">
		<bcs-button id="indices_guardar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-habilitado="indices.grillaCargada" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="indices.guardar()"></bcs-button>
	</div>
</div>

<div id="EliminarMercado" ng-controller='EliminarMercadoCtrl'>
	<div class="row bcs-cuerpo">
	<div class="row">
		<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_CLASIFICACION</label>
						<bcs-combobox-base
							class="col-xs-5"
							tipo="data.oConfiguracionMercadosEliminar.tipo"
							id-actual="filtros.clasificacionTipoInstrumento"
							seleccionado="filtros.clasificacionTipoInstrumentoObj"
							configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"
							item-post-filtro="'1'" 
							todos="'N'"
							>
						</bcs-combobox-base>					
		</div>
		</div>
		<div class="row">
			<div class=col-xs-12>
				<bcs-button id="btn_eliminar" class="col-xs-3 pull-left"
			    bcs-tipo="'default'"
		    	bcs-auto-desactivar="false"
		    	bcs-texto="'ELIMINAR' | translate"
		     	bcs-habilitado="'true'"
		     	bcs-clic="EliminarMercado()">
		    </bcs-button>
			</div>	
		</div>
		
		
		
	</div>
</div>

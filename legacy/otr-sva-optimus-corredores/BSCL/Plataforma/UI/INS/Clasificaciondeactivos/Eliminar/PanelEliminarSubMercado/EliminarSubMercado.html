<div id="EliminarSubMercado" ng-controller='EliminarSubMercadoCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLASIFICACION</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
				id-actual="filtros.clasificacionTipoInstrumento"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"  
				cascada-a="data.oConfiguracionClasificacionSubMercado.filtros.IdArbolClasificacionActivo"
				cascada-valor="'IdArbolClasificacionActivo'"				
				todos="'N'"
				>
			</bcs-combobox-base>
		</div>
		</div>
		
		<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_SUB_MERCADO</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionSubMercado.tipo"
				id-actual="filtros.clasificacionSubMercado"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				filtros="data.oConfiguracionClasificacionSubMercado.filtros"
				configuracion= "data.oConfiguracionClasificacionSubMercado.configuracion"  
				>
			</bcs-combobox-base>
		</div>
		</div>
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-2"
					id					= "btn_eliminarsubmercado" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_ELIMINAR' | translate" 
					bcs-habilitado		= "'true'" 
					bcs-clic			= "EliminarSubMercado()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

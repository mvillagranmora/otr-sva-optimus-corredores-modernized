<div id="EliminarInstrumento" ng-controller='EliminarInstrumentoCtrl'>
      <div class="row bcs-cuerpo">
      <div class="row">
            <div class="col-xs-12">
                  <label class="col-xs-3" translate>UI_CLASIFICACION</label>
                  <bcs-combobox-base
                        class="col-xs-5"
                        tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
                        id-actual="filtros.clasificacionTipoInstrumento"
                        seleccionado="filtros.clasificacionTipoInstrumentoObj"
                        configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"  
                        cascada-a="data.oConfiguracionClasificacionSubMercado.filtros.IdArbolClasificacionActivo"
                        cascada-valor="'IdArbolClasificacionActivo'"
                        cascada1-a="data.oConfiguracionInstrumentosAsignados.filtros.IdArbolClasificacionActivo"
                        cascada1-valor="'IdArbolClasificacionActivo'"        
                        todos="'N'"
                        >
                  </bcs-combobox-base>
            </div>
            </div>
            
            <div class="row">
            <div class="col-xs-12">
                  <label class="col-xs-3" translate>UI_SUB_MERCADO</label>
                  <bcs-combobox-base
                        class="col-xs-5"
                        tipo="data.oConfiguracionClasificacionSubMercado.tipo"
                        id-actual="filtros.clasificacionSubMercado"
                        seleccionado="filtros.clasificacionTipoSubMercadoObj"
                        filtros="data.oConfiguracionClasificacionSubMercado.filtros"
                        configuracion= "data.oConfiguracionClasificacionSubMercado.configuracion"  
                        cascada-a="data.oConfiguracionClasificacionInstrumento.filtros.IdArbolClasificacionActivo"
                        cascada-valor="'IdArbolClasificacionActivo'"                     
                        cascada1-a="data.oConfiguracionInstrumentosAsignados.filtros.IdArbolClasificacionActivo2"
                        cascada1-valor="'IdArbolClasificacionActivo'"
                        >
                  </bcs-combobox-base>
            </div>
            </div>
            <div class="row">
            <div class="col-xs-12">
                  <label class="col-xs-3" translate>UI_CLA_INSTRUMENTO</label>
                  <bcs-combobox-base
                        class="col-xs-5"
                        tipo="data.oConfiguracionClasificacionInstrumento.tipo"
                        id-actual="filtros.clasificacionInstrumento"
                        seleccionado="filtros.clasificacionTipoInstrumentoObj"
                        filtros="data.oConfiguracionClasificacionInstrumento.filtros"
                        configuracion= "data.oConfiguracionClasificacionInstrumento.configuracion"
                        cascada-a="data.oConfiguracionInstrumentosAsignados.filtros.IdArbolClasificacionActivo"
                        cascada-valor="'IdArbolClasificacionActivo'"
                        >
                  </bcs-combobox-base>
            </div>
            </div>
                  <div class="row">
            <div class="col-xs-12">
                  <label class="col-xs-3" translate>UI_INSTRUMENTO</label>
                  <bcs-combobox-base
                        class="col-xs-5"
                        tipo="data.oConfiguracionInstrumentosAsignados.tipo"
                        id-actual="filtros.InstrumentosAsignados"
                        seleccionado="filtros.InstrumentosAsignadosObj"
                        filtros="data.oConfiguracionInstrumentosAsignados.filtros"
                        configuracion= "data.oConfiguracionInstrumentosAsignados.configuracion" 
                        >
                  </bcs-combobox-base>
            </div>
            </div>

            <div class="row">
                  <div class=col-xs-12>
                        <bcs-button
                             class                   = "col-xs-2"
                             id                           = "btn_eliminarmercado" 
                             bcs-tipo                = "''" 
                             bcs-auto-desactivar     = "false" 
                             bcs-texto               = "'UI_ELIMINAR' | translate" 
                             bcs-habilitado          = "'true'" 
                             bcs-clic                = "EliminarInstrumento()">
                  </bcs-button>     
                  </div>      
            </div>
      </div>
</div>

<div id="ModificarSubMercado" ng-controller='ModificarSubMercadoCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLASIFICACION</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
				id-actual="filtros.clasificacionTipoInstrumento"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"  
				cascada-a="data.oConfiguracionClasificacionSubMercado.filtros.IdArbolClasificacionActivo"
				cascada-valor="'IdArbolClasificacionActivo'"				
				todos="'N'"
				>
			</bcs-combobox-base>
		</div>
		</div>
		
		<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_SUB_MERCADO</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionSubMercado.tipo"
				id-actual="filtros.clasificacionSubMercado"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				filtros="data.oConfiguracionClasificacionSubMercado.filtros"
				configuracion= "data.oConfiguracionClasificacionSubMercado.configuracion"  
				>
			</bcs-combobox-base>
		</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_NUEVO_NOMBRE</label>  <!-- Pasar el nombre cuando se seleccione en el combo -->
				<bcs-input-texto 
				class		= "col-xs-5"
				foco		= "true"
				ng-model	= "formData.NuevoNombreSubMercado"
				key-enter	= "">
				</bcs-input-texto>
			</div>
		</div>
		<br>
       <div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_MOVER_A_MERCADO</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionNuevoMercado.tipo"
				id-actual="filtros.nClasificacionNuevoMercado"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				configuracion= "data.oConfiguracionClasificacionNuevoMercado.configuracion" 
				>
			</bcs-combobox-base>
		</div>
		</div>
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-3"
					id					= "btn_modificarsubmercado" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_MODIFICAR_SUBMERCADO' | translate" 
					bcs-habilitado		= "filtros.clasificacionTipoInstrumento && filtros.clasificacionSubMercado && formData.NuevoNombreSubMercado" 
					bcs-clic			= "ModificaSubMercado()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

<div id="ModificarMercado" ng-controller='ModificarMercadoCtrl'>
	<div class="row bcs-cuerpo">
			<div class="row">
		<div class="col-xs-12">
		<label class="col-xs-3" translate>UI_CLASIFICACION</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionMercados.tipo"   // cambiad
				id-actual="filtros.clasificacionTipoInstrumento"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"				 
				todos="'N'"
				>
			</bcs-combobox-base>
						
						
		</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_NUEVO_NOMBRE</label>
				<bcs-input-texto 
				class		= "col-xs-5"
				foco		= "true"
				ng-model	= "formData.NuevoNombreMercado"
				bcs-requerido="recordData.NuevoNombreMercado === 'N'"
				key-enter	= "">
				</bcs-input-texto>
			</div>
		</div>
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-2"
					id					= "btn_modificarmercado" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_MODIFICAR_MERCADO' | translate" 
					bcs-habilitado		= "filtros.clasificacionTipoInstrumento && formData.NuevoNombreMercado " 
					bcs-clic			= "ModificaMercado()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

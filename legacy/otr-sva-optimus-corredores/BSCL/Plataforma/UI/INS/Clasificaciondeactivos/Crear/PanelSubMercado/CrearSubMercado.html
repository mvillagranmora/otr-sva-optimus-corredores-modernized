<div id="CrearSubMercado" ng-controller='CrearSubMercadoCtrl'>
	<div class="row bcs-cuerpo">
	<div class="row">
		<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_CLASIFICACION</label>
						<bcs-combobox-base
							class="col-xs-5"
							tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
							id-actual="filtros.clasificacionTipoInstrumento"
							seleccionado="filtros.clasificacionTipoInstrumentoObj"
							configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"  
							todos="'N'"
							>
						</bcs-combobox-base>
						
		</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_NOMBRE</label>
				<bcs-input-texto 
				class		= "col-xs-5"
				foco		= "true"
				ng-model	= "formData.NombreSubMercado"
				key-enter	= "">
				</bcs-input-texto>
			</div>
			
		</div>
		
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-3"
					id					= "btn_crearsubmercado" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_CREAR_SUBMERCADO' | translate" 
					bcs-habilitado		= "formData.NombreSubMercado && filtros.clasificacionTipoInstrumento" 
					bcs-clic			= "crearSubMercado()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

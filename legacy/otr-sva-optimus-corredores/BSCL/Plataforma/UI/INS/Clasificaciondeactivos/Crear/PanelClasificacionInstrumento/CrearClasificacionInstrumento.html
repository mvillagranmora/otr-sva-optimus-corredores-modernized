<div id="CrearClasificacionInstrumento" ng-controller='CrearClasificacionInstrumentoCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLASIFICACION</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
				id-actual="filtros.clasificacionTipoInstrumento"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"  
				cascada-a="data.oConfiguracionClasificacionSubMercado.filtros.IdArbolClasificacionActivo"
				cascada-valor="'IdArbolClasificacionActivo'"				
				todos="'N'"
				>
			</bcs-combobox-base>
		</div>
		</div>
		
		 <div class="row">
            <div class="col-xs-12">
                  <label class="col-xs-3" translate>UI_SUB_MERCADO</label>
                  <bcs-combobox-base
                        class="col-xs-5"
                        tipo="data.oConfiguracionClasificacionSubMercado.tipo"
                        id-actual="filtros.clasificacionSubMercado"
                        seleccionado="filtros.clasificacionTipoSubMercadoObj"
                        filtros="data.oConfiguracionClasificacionSubMercado.filtros"
                        configuracion= "data.oConfiguracionClasificacionSubMercado.configuracion"
                        >
                  </bcs-combobox-base>
            </div>
            </div>
		<div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_CREAR_CLASIFICACION</label>  <!-- Pasar el nombre cuando se seleccione en el combo -->
				<bcs-input-texto 
				class		= "col-xs-5"
				foco		= "true"
				ng-model	= "formData.Nombreclasificacion"
				key-enter	= "">
				</bcs-input-texto>
			</div>
		</div>
		
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-3"
					id					= "btn_crearclasificacioninstrumento" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_CREAR_CLASIFICACION' | translate" 
					bcs-habilitado		= "filtros.clasificacionTipoInstrumento && filtros.clasificacionSubMercado && formData.Nombreclasificacion " 
					bcs-clic			= "crearclasificacioninstrumento()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

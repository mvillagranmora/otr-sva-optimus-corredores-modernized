<div id="CrearMercado" ng-controller='CrearMercadoCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_NOMBRE_MERCADO</label>  <!--  Validar que la creacon del mercado no tenga el mismo nombre que otro  -->
				<bcs-input-texto 
				class		= "col-xs-5"
				foco		= "true"
				ng-model	= "formData.NombreMercado"
				bcs-requerido="recordData.NombreMercado === 'S'"
				key-enter	= "">
				</bcs-input-texto>
			</div>
			
		</div>
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-2"
					id					= "btn_crearmercado" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_CREAR_MERCADO' | translate" 
					bcs-habilitado		= "formData.NombreMercado" 
					bcs-clic			= "crearMercado()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

<div id="Clasificaciondeactivos" class="col-xs-12" ng-controller="ClasificaciondeactivosCtrl as formData">
	
<!--
	 ***************************************************************************
		 * GRILLAS SUPERIORES (MERCADO -SUBMERCADO-CLASIFICACION) *
	 ***************************************************************************
-->
	<!-- GRILLA MERCADOS -->
		
	<div class="col-xs-4">
		<bcs-grid id="grid-Mercados"
			configuracion="formData.grillaMercados"
			fn-click="verDetalleMercado()"
			api=""
			seleccionado="formData.MercadoSeleccionado">
		</bcs-grid>
	<br>
	</div>
	
	<!-- GRILLA SUB MERCADOS -->

	<div class="col-xs-4">
		<bcs-grid id="grid-Submercados"
			 configuracion="formData.grillaSubMercados"
			 fn-click="verDetalleSubMercado()"
			 api=""
			 seleccionado="formData.SubMercadoSeleccionado">
		</bcs-grid>
			<br>
	</div>
	<!-- GRILLA CLASIFICACION -->

	<div class="col-xs-4">
		<bcs-grid id="grid-Clasificacion"
			 configuracion="formData.grillaClasificacion"
			 fn-click="verDetalleClasifiacion()"
			 api=""
			 seleccionado="formData.ClasifiacionSeleccionado">
		</bcs-grid>
		<br>
	</div>
	
<!--
	 ***************************************************************************
		 * GRILLAS INFERIORES (INSTRUMENTOS) *
	 ***************************************************************************
-->
	<!-- GRILLA INSTRUMENTOS EN MERCADOS -->
	<div class="row">
		<div class="col-xs-4">
			<bcs-grid id="grid-InstrumentosMercados"
				configuracion="formData.grillaInstrumentosMercados"
				fn-click="limpiaSeleccionesInstrumentoMercado()"
				api=""
				seleccionado="formData.MercadoInstrumentoSeleccionado">
			</bcs-grid>
	<br>
		</div>
		<br>
	<!-- GRILLA INSTRUMENTOS EN SUBMERCADOS -->

		<div class="col-xs-4">
			<bcs-grid id="grid-InstrumentosSubMercados"
				configuracion="formData.grillaInstrumentosSubMercados"
				fn-click="limpiaSeleccionesInstrumentoSubMercado()"
				api=""
				seleccionado="formData.SubMercadoInstrumentoSeleccionado">
			</bcs-grid>
		<br>
		</div>
		<br>
	<!-- GRILLA INSTRUMENTOS EN CLASIFICACION -->
		<br>
		<div class="col-xs-4">
			<bcs-grid id="grid-InstrumentosClasificacion"
				configuracion="formData.grillaInstrumentosClasificacion"
				fn-click="limpiaSeleccionesInstrumentoClasificacion()"
				api=""
				seleccionado="formData.ClasifiacionInstrumentoSeleccionado">
			</bcs-grid>
			<br>
		</div>
	
	</div>			
	<div class="row bcs-panel-comandos">
		<div class=col-xs-10>
			<bcs-button id="Traspaso_ingresar" class="col-xs-2 pull-left"
			    bcs-tipo="'default'"
		    	bcs-auto-desactivar="false"
		    	bcs-texto="'UI_NUEVO_MAY' | translate"
		     	bcs-habilitado="'true'"
		     	bcs-clic="formData.fn.ingresar()">
		    </bcs-button>
		   <bcs-button id="Traspaso_ingresar" class="col-xs-2 pull-left"
			    bcs-tipo="'default'"
		    	bcs-auto-desactivar="false"
		    	bcs-texto="'UI_MODIFICAR' | translate"
		     	bcs-habilitado="'true'"
		     	bcs-clic="formData.fn.modificar()">
		    </bcs-button>
		  
		    <bcs-button id="Traspaso_ingresar" class="col-xs-2 pull-left"
			    bcs-tipo="'default'"
		    	bcs-auto-desactivar="false"
		    	bcs-texto="'UI_ELIMINAR' | translate"
		     	bcs-habilitado="true"
		     	bcs-clic="EliminarDatos()">
		    </bcs-button>
		    
		    <bcs-button id="Traspaso_ingresar" class="col-xs-2 pull-left"
			    bcs-tipo="'default'"
		    	bcs-auto-desactivar="false"
		    	bcs-texto="'UI_CLASIFICA_ACTIVO' | translate"
		     	bcs-habilitado="'true'"
		     	bcs-clic="formData.fn.Clasificar()">
		    </bcs-button>
		        <bcs-button id="Traspaso_ingresar" class="col-xs-2 pull-left"
			    bcs-tipo="'default'"
		    	bcs-auto-desactivar="false"
		    	bcs-texto="'UI_INDICES' | translate"
		     	bcs-habilitado="'true'"
		     	bcs-clic="formData.fn.Indices()">
		    </bcs-button>
		   
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
		</div>
	</div>
	
	
</div>

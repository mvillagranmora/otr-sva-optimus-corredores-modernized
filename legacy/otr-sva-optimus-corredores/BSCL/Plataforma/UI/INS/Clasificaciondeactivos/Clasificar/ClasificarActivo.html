<div id="ClasificarActivo" ng-controller='ClasificarActivoCtrl'>
	<div class="row bcs-cuerpo">
	<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLASIFICACION</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionTipoInstrumento.tipo"
				id-actual="filtros.clasificacionTipoInstrumento"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				configuracion= "data.oConfiguracionClasificacionTipoInstrumento.configuracion"  
				cascada-a="data.oConfiguracionClasificacionSubMercado.filtros.IdArbolClasificacionActivo"
				cascada-valor="'IdArbolClasificacionActivo'"				
				todos="'N'"
				>
			</bcs-combobox-base>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_SUB_MERCADO</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionSubMercado.tipo"
				id-actual="filtros.clasificacionSubMercado"
				seleccionado="filtros.clasificacionTipoSubMercadoObj"
				filtros="data.oConfiguracionClasificacionSubMercado.filtros"
				configuracion= "data.oConfiguracionClasificacionSubMercado.configuracion"  
				cascada-a="data.oConfiguracionClasificacionInstrumento.filtros.IdArbolClasificacionActivo"
				cascada-valor="'IdArbolClasificacionActivo'"	
				>
			</bcs-combobox-base>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLA_INSTRUMENTO</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oConfiguracionClasificacionInstrumento.tipo"
				id-actual="filtros.clasificacionInstrumento"
				seleccionado="filtros.clasificacionTipoInstrumentoObj"
				filtros="data.oConfiguracionClasificacionInstrumento.filtros"
				configuracion= "data.oConfiguracionClasificacionInstrumento.configuracion"  
				>
			</bcs-combobox-base>
		</div>
		</div>
	
		<br>		 	
		<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_TIPOCLASIFICACIONINSTRUMENTO</label>
			<bcs-combobox-base
				class="col-xs-5"
				tipo="data.oTipoClasificacionInstrumentoAsignar.tipo"
				id-actual="filtros.clasificacionTipoInstrumentoAsignar"
				seleccionado="filtros.clasificacionTipoInstrumentoAsignarObj"
				configuracion= "data.oTipoClasificacionInstrumentoAsignar.configuracion"  
				cascada-a="data.oClasificacionInstrumentoAsignar.filtros.IdClasificacionTipoInstrumento"
				cascada-valor="'IdClasificacionTipoInstrumento'"
				cascada-a2="data.oInstrumentoAsignar.filtros.IdClasificacionTipoInstrumento"
				cascada-valor2="'IdClasificacionTipoInstrumento'"				
				todos="'N'"
				>
			</bcs-combobox-base>
		</div>
	</div>	 
	
		<div class="row">
			<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLASIFICACIONINSTRUMENTO</label> 
				<bcs-combobox-base
					class="col-xs-5"
					tipo="data.oClasificacionInstrumentoAsignar.tipo"
					id-actual="filtros.clasificacionInstrumentoAsignar"
					seleccionado="filtros.clasificacionInstrumentoAsignarObj"
					configuracion= "data.clasificacionInstrumentoAsignar.configuracion"
					filtros="data.oClasificacionInstrumentoAsignar.filtros"
					cascada-a="data.oInstrumentoAsignar.filtros.IdTipoInstrumento"
				    cascada-valor="'IdTipoInstrumento'"			
					todos="'N'"
					>
				</bcs-combobox-base>
			</div>
		</div>

		
		<div class="row">
			<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_INSTRUMENTO</label> 
				<bcs-combobox-base
					class="col-xs-5"
					tipo="data.oInstrumentoAsignar.tipo"
					id-actual="filtros.InstrumentoAsignar"
					seleccionado="filtros.InstrumentoAsignarObj"
					configuracion= "data.oInstrumentoAsignar.configuracion"
					filtros="data.oInstrumentoAsignar.filtros"			
					todos="'N'"
					>
				</bcs-combobox-base>
			</div>
		</div>
	<!-- HASTA ACA -->		
		
		<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-2"
					id					= "btn_crearmercado" 
					bcs-tipo			= "''" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_ASIGNAR' | translate" 
					bcs-habilitado		= "filtros.clasificacionTipoInstrumento && filtros.clasificacionTipoInstrumentoAsignar && filtros.clasificacionInstrumentoAsignar && filtros.InstrumentoAsignar" 
					bcs-clic			= "AsignarInstrumento()">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

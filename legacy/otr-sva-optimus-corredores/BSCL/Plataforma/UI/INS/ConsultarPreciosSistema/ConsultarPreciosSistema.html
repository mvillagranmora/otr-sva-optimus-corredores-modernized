<div class="row" ng-controller='ConsultarPreciosSistemaCtrl'>
	<!-- INICIO FILTROS -->
	<div class="row">
		<form name="ConsultarPreciosSistemaForm">
			<div class="col-xs-11">
				<div class="row">
				
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_INSTRUMENTO</label>				  
						<bcs-input-instrumentos  class="col-xs-8" 
						   id="MovimientoFacturarCtrl_UI_INSTRUMENTO"
						   name="uInstrumento"
						   datos-instrumento="instrumentoDatos" 
						   buscar-instrumento="ConfiguracionInstrumento.buscar"
						   filtro-estado = "'ACT'" 
						   filtro-tipo-instrumento = "['ACN','ACX','MIL','CFI','CFX','ETX','ETN','MON','OSA','FDO','FIP','FIC','FUF']"
						>
						</bcs-input-instrumentos>
					  </div>
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_FECHA_VECTOR</label>
						<bcs-input-date
							class="col-xs-8"
							activado = "'false'"
							k-ng-model="fechaVector">
						</bcs-input-date>
					</div>
					
				</div>
			</div>
		</form>
		<!-- FIN FILTROS -->
		<!-- INICIO BOTONES -->
		<div class="col-xs-1">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="buscar()"></bcs-button>				
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="limpiar()"></bcs-button>
			</div>
		</div>
	</div>
	<!-- FIN BOTONES -->
	<div class="row">
		<bcs-grid
			id="grid-precios-var"
			configuracion="configuracion"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>

</div>

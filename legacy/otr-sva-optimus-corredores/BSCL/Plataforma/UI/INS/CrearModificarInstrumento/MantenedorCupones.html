<div ng-controller="MantenedorCuponesCtrl">
    <div class="row">
        <label class="col-xs-2" translate>UI_NEMOTECNICO</label>
        <bcs-input-texto
            class="col-xs-6"
            atributos="width:100%"
            k-ng-disabled="'true'"
            bcs-requerido
            ng-model="instrumento.Nemotecnico">
        </bcs-input-texto>
    </div>
    <div class="col-xs-12">
        <bcs-grid id="gridCupones"
            configuracion="configuracionGrillaCupones"
            seleccionado="cuponSeleccionado"
            fn-click=""
            fn-doble-click="">
        </bcs-grid>
    </div>

    <div class="row bcs-panel-comandos" style="padding-top: 5px !important;">
        <bcs-button id="UI_ACEPTAR" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
        <bcs-button id="UI_CARGAARCHIVO" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_CARGAARCHIVO' | translate" bcs-habilitado="'true'" bcs-clic="VentaDetalleCarga()"></bcs-button> 
        <bcs-button ng-show="'false'" id="UI_VALIDAR"  bcs-tipo="'bcs-button-secondary'" class="col-xs-2 pull-right" bcs-auto-desactivar="'false'" bcs-texto="'UI_VALIDAR' | translate" bcs-habilitado="'true'" bcs-clic="validar()"></bcs-button>
        <bcs-button id="UI_CANCELAR" class="col-xs-2 pull-right"  bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
    </div>
</div>

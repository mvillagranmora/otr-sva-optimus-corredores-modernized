<div ng-controller="ConsultaCuponesCtrl">
    <form name="ConsultaCuponesForm">
        <div class="row">
		    <div class="col-xs-10">
		        <div class="row">
                    <label class="col-xs-2" translate>UI_NEMOTECNICO</label>
		            <bcs-input-instrumentos class="col-xs-4"
			            bcs-requerido
			            name="uInstrumento"
			            datos-instrumento="instrumento"
			            muestra-precio="'N'"
			            filtro-clasificacion="'RF'"
			            filtro-estado="'ACT'"
			            filtro-bolsa = "'BCS'">
		            </bcs-input-instrumentos>
		        </div>
		        
		        <div class="row">
                    <label class="col-xs-2" translate>UI_FECHA</label>
                    <bcs-input-date class="col-xs-4"
                        ng-disabled="'false'"
                        bcs-requerido
                        k-ng-model="fecha">
                    </bcs-input-date>
		        </div>
		    
                <div class="row">
                    <label class="col-xs-2" translate>UI_VALOR_NOMINAL</label>
                    <bcs-input-numero
                        class="col-xs-4"
                        atributos="width:100%"
                        decimales="'2'"
                        k-options="{format : 'n2', spinners : false}"
                        k-ng-model="valorNominal">
                    </bcs-input-numero>
                </div>
            </div>

		    <div class="col-xs-2">
			    <div class="row">
				    <bcs-button class="col-xs-12" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="ConsultaCuponesForm.$valid" bcs-clic="buscar()"></bcs-button>
			    </div>
		    </div>
        </div>

    </form>
    <div class="col-xs-12">
        <bcs-grid id="gridCupones"
            configuracion="configuracionGrillaCupones"
            seleccionado="cuponSeleccionado"
            fn-click=""
            fn-doble-click="">
        </bcs-grid>
    </div>
</div>

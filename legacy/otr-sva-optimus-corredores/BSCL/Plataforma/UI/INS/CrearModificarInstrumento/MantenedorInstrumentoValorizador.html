<div ng-controller='MantenedorInstrumentoValorizadorCtrl'>
    <form name="ValorizarForm">
        <div class="row">
            <label class="col-xs-6" translate>UI_NEMOTECNICO</label>
            <bcs-input-texto
                class="col-xs-6"
                atributos="width:100%"
                k-ng-disabled="'true'"
                bcs-requerido
                ng-model="params.Nemo">
            </bcs-input-texto>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_FECHA_VALORIZACION</label>
            <bcs-input-date class="col-xs-6"
                ng-disabled="'false'"
                bcs-requerido
                k-ng-model="bono.FechaValorizacion">
            </bcs-input-date>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_VALOR_NOMINAL</label>
            <bcs-input-numero
                class="col-xs-6"
                atributos="width:100%"
                bcs-requerido
                decimales="'2'"
                k-options="{format : 'n2', spinners : false}"
                k-ng-model="bono.ValorNominal">
            </bcs-input-numero>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_PRECIO</label>
            <bcs-input-numero
                class="col-xs-6"
                atributos="width:100%"
                bcs-requerido
                decimales="'4'"
                k-options="{format : 'n4', spinners : false}"
                k-ng-model="bono.PrecioValorizacion">
            </bcs-input-numero>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_VALOR_BOLSA</label>
            <bcs-input-numero
                class="col-xs-6"
                atributos="width:100%"
                bcs-requerido
                decimales="'4'"
                k-ng-model="bono.ValorBolsa">
            </bcs-input-numero>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_DURATION_BOLSA</label>
            <bcs-input-numero
                class="col-xs-6"
                atributos="width:100%"
                bcs-requerido
                decimales="'4'"
                k-ng-model="bono.DurationBolsa">
            </bcs-input-numero>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_VALOR_BLOOMBERG</label>
            <bcs-input-numero
                class="col-xs-6"
                atributos="width:100%"
                decimales="'4'"
                k-options="{format : 'n4', spinners : false}"
                k-ng-model="bono.ValorBloomberg">
            </bcs-input-numero>
        </div>

        <div class="row">
            <label class="col-xs-6" translate>UI_DURATION_BLOOMBERG</label>
            <bcs-input-numero
                class="col-xs-6"
                atributos="width:100%"
                decimales="'4'"
                k-options="{format : 'n4', spinners : false}"
                k-ng-model="bono.DurationBloomberg">
            </bcs-input-numero>
        </div>

        <div class="row bcs-panel-comandos">
            <bcs-button
                id="UI_VALORIZAR"
                class="col-xs-3"
                bcs-tipo="'bcs-button-secondary'"
                bcs-auto-desactivar="'false'"
                bcs-texto="'UI_VALORIZAR' | translate"
                bcs-habilitado="'true'"
                bcs-clic="valorizar()">
            </bcs-button>
            <bcs-button
                id="UI_GUARDAR"
                class="col-xs-3 pull-right"
                bcs-tipo="'bcs-button-primary'"
                bcs-auto-desactivar="'false'"
                bcs-texto="'UI_GUARDAR' | translate"
                bcs-habilitado="'true'"
                bcs-clic="guardar()">
            </bcs-button>
       </div>
    </form>
</div>

<div id="CargaEntidadVectorPrecio" class="col-xs-12" ng-controller="CargaEntidadVectorPrecioCtrl">
    <div class="bcs-cuerpo">
        <div class="row">
            <form name="formCargaEntidadVectorPrecio" class="col-xs-12 form-horizontal">
                <div class="row">
					<label class="col-xs-2"> Vector de precios</label>
					<div class="col-xs-3">
						<select ng-model="recordData.archivoVector">
							<option value="VECTOR_PRECIOS_BVL_RV">Archivo BVL RV</option>
							<option value="VECTOR_PRECIOS_BVL_RF">Archivo BVL RF</option>
							<option value="VECTOR_PRECIOS_TASA_RIESGO_RV">Archivo Tasa Riesgo RV</option>
							<option value="VECTOR_PRECIOS_TASA_RIESGO_RF">Archivo Tasa Riesgo RF</option>
							<option value="VECTOR_PRECIOS_CORREDORA_RV">Archivo Corredora RV</option>
							<option value="VECTOR_PRECIOS_CORREDORA_RF">Archivo Corredora RF</option>
						</select>
					</div>
					<bcs-button 
                        id="formCargaEntidadVectorPrecioBoton"  
                        class="col-xs-2" 
                        bcs-habilitado="(!!recordData.archivoVector)"  
                        bcs-tipo="''" 
                        bcs-auto-desactivar="false" 
                        bcs-texto="'CARGAR ARCHIVO'" 
                        bcs-clic="cargarArchivo()">
                    </bcs-button>
                </div>          
            </form>
        </div>
        <div class="row">
	        <bcs-grid
	                id="grid-resultados"
	                configuracion = "configResultados"
	                seleccionado = "seleccionResultados">
	        </bcs-grid>
        </div>
    </div>
    
</div>

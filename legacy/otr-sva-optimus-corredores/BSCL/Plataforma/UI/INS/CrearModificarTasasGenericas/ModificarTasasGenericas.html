<div class="row" ng-controller='ModificarTasasGenericasCtrl'>
	<!-- INICIO FILTROS -->
	<div class="row">
	

		<div class="row">
			<label class="col-xs-3" translate>UI_CLASIFICACION</label>
			<bcs-input-texto class="col-xs-6" 
				k-ng-disabled=true
	 			ng-model="formData.Clasificacion">
			</bcs-input-numero>
		</div>
		
		<div class="row">
			<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
			<bcs-input-texto class="col-xs-6" 
				k-ng-disabled=true
	 			ng-model="formData.TipoInstrumento">
			</bcs-input-numero>
		</div>
		
		<div class="row">
			<label class="col-xs-3" translate>UI_TIPO_REAJUSTE</label>
			<bcs-input-texto class="col-xs-2" 
				k-ng-disabled=true
	 			ng-model="formData.TipoReajuste">
			</bcs-input-numero>
		</div>
			
		<br>

		<div class="row">
			<label class="col-xs-3" translate>UI_PLAZO_DESDE</label>
			<bcs-input-numero class="col-xs-2" 
				name="uPlazoInicial" 
				ng-model="formData.PlazoDesde"
				bcs-requerido
				decimales="0">
			</bcs-input-numero>
		</div>

		<div class="row">
			<label class="col-xs-3" translate>UI_PLAZO_HASTA</label>
			<bcs-input-numero class="col-xs-2" 
				name="uPlazoFinal" 
				ng-model="formData.PlazoHasta"
				bcs-requerido
				decimales="0">
			</bcs-input-numero>
		</div>

				
		<div class="row">
			<label class="col-xs-3" translate>UI_TASA</label>
			<bcs-input-numero class="col-xs-2"
				name="uTasa"
				ng-model="formData.Tasa" 
				decimales="2"
				bcs-requerido>
			</bcs-input-numero>
		</div>
		<div class="row">
			<label class="col-xs-3" translate>UI_PRECIO</label>
			<bcs-input-numero class="col-xs-2"
				name="uPrecio"
				ng-model="formData.Precio" 
				decimales="2">
			</bcs-input-numero>
		</div>

			
		<!-- FIN FILTROS -->

	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-clic="formData.ModificarTasasGenericas()"></bcs-button>

	</div>


</div>

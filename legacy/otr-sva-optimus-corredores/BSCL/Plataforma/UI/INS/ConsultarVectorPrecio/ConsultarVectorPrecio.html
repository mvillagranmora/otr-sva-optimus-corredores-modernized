<div id="ConsultarVectorPrecio" class="col-xs-12" ng-controller="ConsultarVectorPrecioCtrl">
    <div class="bcs-cuerpo">
        <div class="row">
            <div class="col-xs-4">
                <label class="col-xs-5" translate>UI_INSTRUMENTO</label>
                <bcs-input-instrumentos class="col-xs-7" 
                    datos-instrumento="filtros.instrumento"
                    buscar-instrumento="filtros.buscarInstrumento"
                    bcs-requerido
                    filtro-clasificacion="filtros.IdClasificacionTipoInstrumento"
                    filtro-tipo-instrumento="filtros.IdTipoInstrumento">
                </bcs-input-instrumentos>
            </div>
            <div class="col-xs-1"></div>
            <div class="col-xs-4">
                <label class="col-xs-4" translate>UI_FECHA_INGRESO</label>
                <bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaDesde"></bcs-input-date>
                <bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaHasta"></bcs-input-date>
            </div>
            <div class="col-xs-1"></div>
            <div class="col-xs-2">
                <bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscar()"></bcs-button>
            </div>
        </div>
        <hr>
        <div class="row">
	        <bcs-grid
	                id="grid-resultados"
	                configuracion = "configResultados"
	                seleccionado = "seleccionResultados"
	                fn-exportar-excel = "exportarExcel"
	                api="gridApiResultados">
	        </bcs-grid>
        </div>
        
        <div class="row">
	        <bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
	        </bcs-menu>
        </div>
    </div>
    
</div>

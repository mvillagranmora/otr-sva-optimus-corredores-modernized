<div class="row" ng-controller='EditarCoberturaCtrl'>
	<form name="frmEditarCobertura"  class="col-xs-12 form-horizontal">

	    <div style="background-color:#C5C5C5;">
			<h5 class="modal-title" translate>UI_DATOS_GARANTIA</h5>
	    </div>

		<div class="row">
			<label class="col-xs-4" translate>UI_ENTIDAD_DESTINO</label>
			<bcs-combobox-base class="col-xs-8"
				bcs-requerido  
			    auto-cargar		= "'true'"						    						    
				tipo			= "data.oConfiguracionEntidadDestinoGarantia.tipo"  
				configuracion	= "data.oConfiguracionEntidadDestinoGarantia.configuracion" 
				id-actual		= "data.oConfiguracionEntidadDestinoGarantia.idActual" 
				seleccionado	= "data.oConfiguracionEntidadDestinoGarantia.seleccionado" 
				filtros			= "data.oConfiguracionEntidadDestinoGarantia.filtros"
                cascada1-a		= "data.oConfiguracionTipoInstrumentoExigeGarantia.filtros.IdEntidadDestinoGarantia"
	            cascada1-valor	= "'IdEntidadDestinoGarantia'"
                cascada2-a		= "data.oConfiguracionInstrumentoExigeGarantia.filtros.IdEntidadDestinoGarantia"
	            cascada2-valor	= "'IdEntidadDestinoGarantia'"	            
	            id-post-filtro	= "data.oConfiguracionEntidadDestinoGarantia.idpf">
			</bcs-combobox-base>
		</div>
			

		<div class="row">
			<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO_GARANTIZADO</label>
			<bcs-combobox-base class="col-xs-8"
				bcs-requerido
				tipo			= "data.oConfiguracionTipoInstrumentoExigeGarantia.tipo"
				configuracion	= "data.oConfiguracionTipoInstrumentoExigeGarantia.configuracion"
				seleccionado	= "data.oConfiguracionTipoInstrumentoExigeGarantia.seleccionado"
				filtros			= "data.oConfiguracionTipoInstrumentoExigeGarantia.filtros"
				id-actual		= "data.oConfiguracionTipoInstrumentoExigeGarantia.idActual"
				id-defecto		= "data.oConfiguracionTipoInstrumentoExigeGarantia.idDefecto"
                cascada1-a		= "data.oConfiguracionInstrumentoExigeGarantia.filtros.IdTipoInstrumento"
				cascada1-valor	= "'IdTipoInstrumento'"
				cascada2-a	    = "data.oConfiguracionTipoInstrumentoComoGarantia.filtros.CodigoTipoInstrumentoGarantizado" 
	            cascada2-valor  = "'CodigoTipoInstrumento'"
		        id-post-filtro	= "data.oConfiguracionTipoInstrumentoExigeGarantia.idpf">
			</bcs-combobox-base>
		</div>

		<div class="row">
			<label class="col-xs-4" translate>UI_INSTRUMENTO_GARANTIZADO</label>
			<bcs-combobox-base class="col-xs-8"				
				bcs-requerido 						
				tipo			= "data.oConfiguracionInstrumentoExigeGarantia.tipo"
				configuracion	= "data.oConfiguracionInstrumentoExigeGarantia.configuracion"
				seleccionado	= "data.oConfiguracionInstrumentoExigeGarantia.seleccionado"
				filtros			= "data.oConfiguracionInstrumentoExigeGarantia.filtros"
				id-actual		= "data.oConfiguracionInstrumentoExigeGarantia.idActual"
				id-defecto		= "data.oConfiguracionInstrumentoExigeGarantia.idDefecto"
				id-post-filtro	= "data.oConfiguracionInstrumentoExigeGarantia.idpf"> 
			</bcs-combobox-base>
		</div>
		
		<div class="row" ng-hide="!activaConcepto">
			<label class="col-xs-4" translate>UI_CONCEPTO</label>
			<bcs-combobox-base class="col-xs-8" 
				auto-seleccion="'false'"
				tipo		   ="data.oConfiguracionConceptoGarantia.tipo"
				filtros		   ="data.oConfiguracionConceptoGarantia.filtros"
				configuracion  ="data.oConfiguracionConceptoGarantia.configuracion"
				id-actual	   ="data.oConfiguracionConceptoGarantia.idActual"
				seleccionado   ="data.oConfiguracionConceptoGarantia.seleccionado">
			</bcs-combobox-base>
		</div>
			
	   <div style="background-color:#C5C5C5;">
			<h5 class="modal-title" translate>UI_DATOS_COBERTURA</h5>
	   </div>
   		
		<div class="row">
			<label class="col-xs-4" translate>UI_INSTRUMENTO_COMO_GARANTIA</label>
			<bcs-combobox-base class="col-xs-8"
				bcs-requerido
				auto-cargar		= "true"
				tipo			= "data.oConfiguracionTipoInstrumentoComoGarantia.tipo"
				configuracion	= "data.oConfiguracionTipoInstrumentoComoGarantia.configuracion"
				seleccionado	= "data.oConfiguracionTipoInstrumentoComoGarantia.seleccionado"
				filtros			= "data.oConfiguracionTipoInstrumentoComoGarantia.filtros"
				id-actual		= "data.oConfiguracionTipoInstrumentoComoGarantia.idActual"
				id-defecto		= "data.oConfiguracionTipoInstrumentoComoGarantia.idDefecto"
                cascada1-a		= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
			    cascada1-valor	= "'IdClasificacionTipoInstrumentoAval'"				    
				cascada2-a		= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.filtros.IdTipoInstrumento"
				cascada2-valor	= "'IdTipoInstrumentoAval'"
			    id-post-filtro  = "data.oConfiguracionTipoInstrumentoComoGarantia.idpf">
			</bcs-combobox-base>
		</div>			   		

		<div class="row">
			<label class="col-xs-4" translate>UI_ENTIDAD_CLASIFICADORA</label>
			<bcs-input-texto class="col-xs-8" k-ng-disabled="true" ng-model="data.oConfiguracionClasificacionRiesgoTipoInstrumento.seleccionado.IdEntidadClasificadoraRiesgo"></bcs-input-texto>			
		</div>
	   				
	   					
		<div class="row">
			<label class="col-xs-4" translate>UI_CLASIFICACION_RIESGO</label>
			<bcs-combobox-base class="col-xs-8"
				bcs-requerido
				tipo				= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.tipo"  
				filtros				= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.filtros"
				configuracion		= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.configuracion" 
				id-actual			= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.idActual"
				id-defecto			= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.idDefecto" 
				seleccionado		= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.seleccionado"
				id-post-filtro		= "data.oConfiguracionClasificacionRiesgoTipoInstrumento.idpf">
			</bcs-combobox-base>
		</div>

			
		<div class="row" ng-show="data.showPlazoTope">			
			<label class="col-xs-4" translate>UI_PLAZO_TOPE</label>
			<bcs-input-numero class="col-xs-4" configuracion="data.plazoTopeOptions" ng-model="data.plazoTope" k-ng-model="data.kngplazoTope"></bcs-input-numero>
			<select kendo-combo-box class="col-xs-3" ng-model="data.unidadPlazo" options="data.unidadPlazoOptions" style="width:30%" /> 
		</div>
				
		<div class="row">
			<label class="col-xs-4" translate>UI_COBERTURA_ENTIDAD</label>	
			<bcs-input-numero class="col-xs-4" bcs-requerido configuracion="data.coberturaEntidadOptions" k-ng-model="data.kngCoberturaEntidad"  Decimal="4"></bcs-input-numero>								
		</div>
		
		<div class="row">
			<label class="col-xs-4" translate>UI_COBERTURA_CORREDOR</label>
			<bcs-input-numero class="col-xs-4" bcs-requerido configuracion="data.coberturaCorredorOptions" k-ng-model="data.kngCoberturaCorredor" Decimal="4"></bcs-input-numero>									
		</div>
	  	
		<div class="row">
			<label class="col-xs-4" translate>UI_ESTADO</label>
			<bcs-combobox-base class="col-xs-8"
				bcs-requerido
				tipo			= "data.oConfiguracionEstadoGarantia.tipo"  
				filtros			= "data.oConfiguracionEstadoGarantia.filtros"
				configuracion	= "data.oConfiguracionEstadoGarantia.configuracion" 
				id-actual		= "data.oConfiguracionEstadoGarantia.idActual" 
				id-defecto		= "data.oConfiguracionEstadoGarantia.idDefecto"
				seleccionado	= "data.oConfiguracionEstadoGarantia.seleccionado">
			</bcs-combobox-base>				
		</div>
	
				  	
	  	<div class="row col-xs-12 bcs-panel-comandos">
			<bcs-button  class="col-xs-2"  bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_GRABAR' | translate"  bcs-habilitado="frmEditarCobertura.$valid"   bcs-clic="grabarCoberturaGarantia();"></bcs-button>
			<bcs-button  class="col-xs-2"  bcs-tipo="'default'"   bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'"   bcs-clic="limpiarFormulario()"></bcs-button>
		</div>
	
	</form>
</div>

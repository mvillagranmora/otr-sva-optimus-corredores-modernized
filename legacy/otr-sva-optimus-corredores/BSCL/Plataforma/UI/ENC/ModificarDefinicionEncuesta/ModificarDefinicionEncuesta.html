<div ng-controller="ModificarDefinicionEncuestaCtrl">	
	<div class="row bcs-cuerpo">
		<form name ="form.formm" class = "row">
				
			<div class = "row">
				<label class="col-xs-4" translate>UI_NOMBRE</label>
				<bcs-input-texto
					bcs-requerido
					class="col-xs-7" ng-model="form.nombre">
				</bcs-input-texto>
			</div>
			
			<div class = "row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-7"
					tipo="'combobox-estado-pla'" 
					bcs-requerido
					id-post-filtro="form.estadoP"
					id-actual="form.estado"
					filtros = "form.filtrosEstado"
					bcs-requerido>
					</bcs-combobox-base>
				
				
				
			</div>
		</form>
		<div class="row">
			<label class="row" translate>UI_PREGUNTAS</label>
			<bcs-grid
				class="row"
			 	configuracion ="form.configuracionPreguntas"
				seleccionado = "form.seleccionadoPreguntas"
				api = "form.apiPreguntas">
	    	</bcs-grid> 
	    	<div class = "row">
		    	<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.crearPregunta()" bcs-texto="'UI_CREAR' | translate" 
					bcs-habilitado="'true'"   ></bcs-button>
					<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.modificarPregunta()" bcs-texto="'UI_MODIFICAR' | translate" 
					bcs-habilitado="form.seleccionadoPreguntas"   ></bcs-button>
					<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.eliminarPregunta()" bcs-texto="'UI_ELIMINAR' | translate" 
					bcs-habilitado="form.seleccionadoPreguntas"   ></bcs-button>
			</div>
		</div>
		<br/>
		<hr>
		<div class="row">
			<label class="row" translate>UI_RESPUESTAS</label>
			<bcs-grid
				class="row"
			 	configuracion ="form.configuracionRespuestas"
				seleccionado = "form.seleccionadoRespuestas"
				api = "form.apiRespuestas">
	    	</bcs-grid> 
	    	<div class = "row">
	    		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.crearRespuesta()" bcs-texto="'UI_CREAR' | translate" 
				bcs-habilitado="form.seleccionadoPreguntas"   ></bcs-button>
				<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.modificarRespuesta()" bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="form.seleccionadoRespuestas"   ></bcs-button>
				<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.eliminarRespuesta()" bcs-texto="'UI_ELIMINAR' | translate" 
				bcs-habilitado="form.seleccionadoRespuestas"   ></bcs-button>
			</div>
		</div>
		<br/>
		<div class = "row">
			<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.aceptar()" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="form.formm.$valid"   bcs-tipo="'principal'"></bcs-button>
			<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.cancelar()" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="'true'"   ></bcs-button>
			
		</div>
	</div>
</div>

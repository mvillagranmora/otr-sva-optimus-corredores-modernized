<div ng-controller="ConfiguracionEncuestaCtrl">

	<div class="row">
		<bcs-grid
		 	configuracion ="form.configuracion"
			seleccionado = "form.seleccionado"
			api = "form.api">
    	</bcs-grid> 
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.crearEncuesta()" bcs-texto="'UI_CREAR' | translate" 
			bcs-habilitado="'true'"   ></bcs-button>
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.modificarEncuesta()" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="form.seleccionado" ></bcs-button>
	<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.verPuntajes()" bcs-texto="'UI_PUNTAJES' | translate" 
			bcs-habilitado="'true'" ></bcs-button>
		</div>
</div>

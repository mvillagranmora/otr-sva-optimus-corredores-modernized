<div ng-controller="AgregarPreguntaEncuestaCtrl">	
	<div class="row bcs-cuerpo">
		<form name ="form.formm" class = "row">
				
			<div class = "row">
				<label class="col-xs-4" translate>UI_PREGUNTA</label>
				<bcs-input-texto
					tipo-campo = "'textarea'"
					bcs-requerido
					class="col-xs-7" ng-model="form.pregunta">
				</bcs-input-texto>
			</div>
		</form>
		
	
		
		<br/>
		<br/>
		
		<div class = "row">
			<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.aceptar()" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="'true'"   bcs-tipo="'principal'"></bcs-button>
			<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.cancelar()" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="'true'"   ></bcs-button>
			
		</div>
	</div>
</div>

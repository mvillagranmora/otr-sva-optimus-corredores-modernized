<div ng-controller="VerDetalleEncuestaCtrl">	
	<div class="row bcs-cuerpo" style="height:auto">
	<div id="encuesta" style="height: 470px; overflow: auto;">
	<div id="encuestaR">
		<div id="datosEn">
			<div class="row">
				<label class="col-xs-3" translate>UI_CLIENTE</label>
				<bcs-input-texto class="col-xs-5"
				  		k-ng-disabled="'true'"
						ng-model="datos.NombreCliente">
			  	</bcs-input-texto>
			  	<label class="col-xs-1 col-xs-offset-1" translate>UI_USUARIO</label>
				<bcs-input-texto class="col-xs-2"
				  		k-ng-disabled="'true'"
						ng-model="datos.NombreUsuario">
			  	</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_ENCUESTA</label>
				<bcs-input-texto class="col-xs-5"
				  		k-ng-disabled="'true'"
						ng-model="datos.FechaEncuesta">
			  	</bcs-input-texto>
			  	<label class="col-xs-1 col-xs-offset-1" translate>UI_CANAL</label>
				<bcs-input-texto class="col-xs-2"
				  		k-ng-disabled="'true'"
						ng-model="datos.Canal">
			  	</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_CATEGORIA_INVERSIONISTA</label>
				<bcs-input-texto class="col-xs-5"
				  		k-ng-disabled="'true'"
						ng-model="datos.CategoriaInversionista">
			  	</bcs-input-texto>
			</div>
			<hr>
		</div>
		
		<div id="encuestaInv">
			<div id="respuestas" style="height: auto; padding: 5px 30px;">
				<div class="row" style="padding-bottom: 10px;" ng-repeat = "pregunta in data">
					<label class="row">{{pregunta.Indice}} - {{pregunta.TextoPregunta}}</label>
					<div class="row" ng-repeat = "respuesta in pregunta.respuestas">
						<input type="radio" ng-checked="respuesta.Seleccionado === 'S'" ng-disabled="true">
						<label style="font-weight: 100 !important;">
							{{respuesta.TextoRespuesta}}
							</label>
						<br/>
					</div>
					<hr>
				</div>
			</div>
		</div>
	</div>
		</div>
		<br>
		
	</div>
	<div class = "row alignButtonsToRight">
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.salir()" bcs-texto="'UI_SALIR' | translate" 
			bcs-habilitado="'true'"   bcs-tipo="'bcs-button-secondary'"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-clic = "form.descargar()" bcs-texto="'UI_DESCARGAR' | translate" 
			bcs-habilitado="'true'"   bcs-tipo="'bcs-button-primary'"></bcs-button>
	</div>
</div>

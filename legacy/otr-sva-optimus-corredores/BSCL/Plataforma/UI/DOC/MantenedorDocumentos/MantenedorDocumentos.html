<div id="MantenedorDocumentos" ng-controller='MantenedorDocumentosCtrl'>
	<div>
		<bcs-grid id="grid-tipo-documentos"
			configuracion="data.TipoDocumentos"
			fn-exportar-excel = "exportarExcel" 
			seleccionado="data.seleccionTipoDocumentos"
			api="gridApiTipoDocumentos"> </bcs-grid>
	</div>
	<div class="row col-xs-12 bcs-panel-comandos">
		<div class="col-xs-8">
			<bcs-button id="MantenedorDocumentos_agregar" class="col-xs-2"
				bcs-tipo="'principal'" bcs-auto-desactivar="false"
				bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'"
				bcs-clic="Agregar()"> </bcs-button>
			<bcs-button id="MantenedorDocumentos_modificar" class="col-xs-2"
			bcs-tipo="''" bcs-auto-desactivar="false"
			bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="data.seleccionTipoDocumentos"
			bcs-clic="Modificar()"> </bcs-button>
		</div>
		
		<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
			<!--<li ng-click="">{{'UI_ADMINISTRAR_CONDICIONES_OPERATIVAS' | translate}}</li>-->
	           <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

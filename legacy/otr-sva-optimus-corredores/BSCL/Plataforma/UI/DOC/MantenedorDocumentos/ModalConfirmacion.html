<div id="ModalConfirmacion" class="row" ng-controller="ModalConfirmacionCtrl as mCN">
	
	<div class="col-xs-12">
	<label class="col-xs-12" translate>LOS CONTRATOS DE LOS SIGUIENTES CLIENTES SE VERAN AFECTADOS</label>
	<br>
	<br>  
	<div class="col-xs-12">
		<div class="row">
			<bcs-grid
				configuracion="mCN.grilla.FirmaDoc"
				seleccionado="mCN.grilla.FirmaDocSel">
			</bcs-grid>
		</div>
	</div>
</div>
	
	
	<div class="row bcs-panel-comandos">
		<div ng-class="mCN.win.modoEditar ? 'col-xs-7' : 'col-xs-10'">
			<bcs-button id={{mCN.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="true" bcs-clic="mCN.fn.aceptar();">
			</bcs-button>
			<bcs-button id="ModalConfirmacion_cancelar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mCN.fn.cancelar();">
			</bcs-button>
		</div>
	</div>


	
</div>

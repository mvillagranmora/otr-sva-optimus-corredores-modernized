<div class="FormContenido" ng-controller='AnexoCtrl'>
<div class="row bcs_titulo">Firmar Anexo</div>
<div id="Anexo" class="row bcs-cuerpo">
	<div class="col-xs-12">
		<div class = "row">
			<label class="col-xs-4" ng-if="data.mostrarEmpresa1">{{data.NombreFirmanteEmpresa1}}</label>
			<!-- <switch name="switch1" ng-model="data.swFirmaEmpresa1" on="S" off="N" disabled="!data.bcsHabilitado1" ng-if="data.mostrarEmpresa1"></switch> -->
			<bcs-input-checkbox name="switch1" ng-disabled="!data.bcsHabilitado1" ng-model="data.swFirmaEmpresa1" ng-if="data.mostrarEmpresa1"></bcs-input-checkbox>  
		</div>
		<div class = "row">
			<label class="col-xs-4" ng-if="data.mostrarEmpresa2">{{data.NombreFirmanteEmpresa2}}</label>
			<!-- <switch name="switch2" ng-model="data.swFirmaEmpresa2" on="S" off="N" disabled="!data.bcsHabilitado2" ng-if="data.mostrarEmpresa2"></switch> -->
			<bcs-input-checkbox name="switch2" ng-disabled="!data.bcsHabilitado2" ng-model="data.swFirmaEmpresa2" ng-if="data.mostrarEmpresa2"></bcs-input-checkbox>  
		</div>
		<div class = "row">
			<label class="col-xs-4" ng-if="data.mostrarEmpresa3">{{data.NombreFirmanteEmpresa3}}</label>
			<!-- <switch name="switch3" ng-model="data.swFirmaEmpresa3" on="S" off="N" disabled="!data.bcsHabilitado3" ng-if="data.mostrarEmpresa3"></switch> -->
			<bcs-input-checkbox name="switch3" ng-disabled="!data.bcsHabilitado3" ng-model="data.swFirmaEmpresa3" ng-if="data.mostrarEmpresa3"></bcs-input-checkbox>  
		</div>
		<div class = "row">
			<label class="col-xs-4" ng-if="data.mostrarCliente1">{{data.NombreFirmanteCliente1}}</label>
			<!-- <switch name="switch4" ng-model="data.swFirmaCliente1" on="S" off="N" disabled="!data.bcsHabilitado4" ng-if="data.mostrarCliente1"></switch> -->
			<bcs-input-checkbox name="switch4" ng-disabled="!data.bcsHabilitado4" ng-model="data.swFirmaCliente1" ng-if="data.mostrarCliente1"></bcs-input-checkbox>  
		</div>
		<div class = "row">
			<label class="col-xs-4" ng-if="data.mostrarCliente2">{{data.NombreFirmanteCliente2}}</label>
			<!-- <switch name="switch5" ng-model="data.swFirmaCliente2" on="S" off="N" disabled="!data.bcsHabilitado5" ng-if="data.mostrarCliente2"></switch> -->
			<bcs-input-checkbox name="switch5" ng-disabled="!data.bcsHabilitado5" ng-model="data.swFirmaCliente2" ng-if="data.mostrarCliente2"></bcs-input-checkbox>  
		</div>
		<div class = "row">
			<label class="col-xs-4" ng-if="data.mostrarCliente3">{{data.NombreFirmanteCliente3}}</label>
			<!-- <switch name="switch6" ng-model="data.swFirmaCliente3" on="S" off="N" disabled="!data.bcsHabilitado6" ng-if="data.mostrarCliente3"></switch> -->  
			<bcs-input-checkbox name="switch6" ng-disabled="!data.bcsHabilitado6" ng-model="data.swFirmaCliente3" ng-if="data.mostrarCliente3"></bcs-input-checkbox>
		</div>
		<bcs-button class="col-xs-2" bcs-habilitado="'true'"
			bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'Guardar'"
			bcs-clic="Firmar()"></bcs-button>
		<bcs-button class="col-xs-2" bcs-habilitado="'true'"
		bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'Cancelar'"
		bcs-clic="cerrar()"></bcs-button>
	</div>
</div>
</div>

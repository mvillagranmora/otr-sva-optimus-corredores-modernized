<div ng-controller="MantenedorConceptosManualesCtrl">

	<div class="row">
		<div  class="col-xs-5">		
			<label class="col-xs-4" translate>UI_TIPO_CONCEPTO</label>
			<bcs-combobox-base 
				class				="col-xs-8" 
				id					="frmMantenedorConceptosManuales_TipoConcepto"
				tipo				="'combobox-tipo-concepto'"							 
				id-actual			="idTipoConcepto" 
				id-defecto			="idTipoConceptoDef" 
				seleccionado		="data.selTipoConcepto"
				item-post-filtro	="'1'">
			</bcs-combobox-base>
		</div>
		<div class="col-xs-5 pull-right">
			<bcs-button class="col-xs-4 pull-right"
				id					="frmMantenedorConceptosManuales_buscar"			
				bcs-auto-desactivar	="false"  
				bcs-texto			="'UI_BUSCAR' | translate"  
				bcs-habilitado		="'true'"
				bcs-clic			="buscar()">
			</bcs-button>
		</div>		
	</div>
	
	<bcs-grid id="frmMantenedorConceptosManuales_gridConceptosManuales"
		configuracion		= "confConceptoManual"
		seleccionado		= "seleccionConceptoManual"
		fn-exportar-excel	= "exportarExcel">
	</bcs-grid>
	
	<div class="row bcs-panel-comando" style="padding-top: 8px;">
		<bcs-button class="col-xs-3 pull-left"
			id					="frmMantenedorConceptosManuales_agregar"
			bcs-tipo			="'principal'" 
			bcs-auto-desactivar	="false"  
			bcs-texto			="'UI_AGREGAR' | translate"  
			bcs-habilitado		="'true'"
			bcs-clic			="agregar()">
		</bcs-button>		
		<bcs-button class="col-xs-3 pull-left"
			id					="frmMantenedorConceptosManuales_modificar"			
			bcs-auto-desactivar	="false"  
			bcs-texto			="'UI_MODIFICAR' | translate"  
			bcs-habilitado		="'true'"
			bcs-clic			="modificar(seleccionConceptoManual)">
		</bcs-button>
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

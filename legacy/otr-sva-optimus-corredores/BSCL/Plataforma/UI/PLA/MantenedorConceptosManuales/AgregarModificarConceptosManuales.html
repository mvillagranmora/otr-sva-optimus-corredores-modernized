<div ng-controller="AgregarModificarConceptosManualesCtrl">

	<div class="row">
		<label class="col-xs-2" translate>UI_CONCEPTO</label>
		<bcs-input-texto class="col-xs-1"
			id				="frmAgregarModificarConceptos_CodigoConcepto" 
			ng-model		="ngCodigoConcepto"
			k-ng-disabled	="ngCodigoConceptoDisabled"
			maxlength		=6>
		</bcs-input-texto>
		<label class="col-xs-6" translate>UI_MINIMO_6_CARACTERES</label>

		<div class="col-xs-3" style="padding-left: 15px;">
			<label class="col-xs-7" translate>UI_TIPO_CONCEPTO</label>
			<bcs-input-texto class="col-xs-5"
				id				="frmAgregarModificarConceptos_TipoConcepto" 
				ng-model		="ngTipoConcepto"
				k-ng-disabled	="'true'">
			</bcs-input-texto>
		</div>
	</div>
	<div class="row">
		<label class="col-xs-2" translate>UI_NOMBRE</label>
		<bcs-input-texto class="col-xs-7" 
			id				="frmAgregarModificarConceptos_NombreConcepto"
			ng-model		="ngNombreConcepto"
			k-ng-disabled	="!ActivarCheckPorConceptoManual"
			maxlength	=100>
		</bcs-input-texto>

		<div class="col-xs-3" style="padding-left: 15px;">
			<label class="col-xs-7" translate>UI_ESTADO</label>	
			<bcs-combobox-base class="col-xs-5" id="frmAgregarModificarConceptos_Estado"
				tipo			="oConfiguracionEstado.tipo"						  
				configuracion	="oConfiguracionEstado.configuracion"						 
				id-actual		="oConfiguracionEstado.idActual" 
				id-defecto		="oConfiguracionEstado.idDefecto"
				seleccionado	="oConfiguracionEstado.seleccionado"
				filtros			="oConfiguracionEstado.filtros"
				activado		="ActivarCheckPorConceptoManual">
			</bcs-combobox-base>
		</div>
	</div>
	<div class="row">		
		<label class="col-xs-2" translate>UI_CRITERIO_NETEO</label>
		<bcs-combobox-base 
			class			="col-xs-7" 
			id				="frmAgregarModificarConceptos_TipoCriterioNeteo"
			tipo			="'combobox-tipo-criterio-neteo'"							 
			id-actual		="idTipoCriterioNeteo" 
			id-defecto		="idTipoCriterioNeteoDef" 
			seleccionado	="selTipoCriterioNeteo">
		</bcs-combobox-base>
		
		<div class="col-xs-3" style="padding-left: 15px;">
			<bcs-input-checkbox id="frmAgregarModificarConceptos_VisiblePorEjecutivo" 
				ng-model	="ngVisiblePorEjecutivo"
				ng-disabled	="!ActivarCheckPorConceptoManual">
			</bcs-input-checkbox>&nbsp;{{'UI_VISIBLE_POR_EJECUTIVO' | translate}}
		</div>
		
	</div>
	<div class="row">		
		<label class="col-xs-2" translate>UI_NOMBRE_CONCEPTO_CARTOLA</label>
		<bcs-input-texto class="col-xs-7" 
			id				="frmAgregarModificarConceptos_NombreConceptoCartola" 
			ng-model		="ngNombreConceptoCartola"
			k-ng-disabled	="ngCodigoConceptoCartolaDisabled"
			maxlength		=500>
		</bcs-input-texto>
		<div class="col-xs-3" style="padding-left: 15px;"> 
			<bcs-input-checkbox id="frmAgregarModificarConceptos_ExclusivoCartola" 
				ng-model	="ngExclusivoCartola">
			</bcs-input-checkbox>&nbsp;{{'UI_EXCLUSIVO_CARTOLA' | translate}}
		</div>
	</div>
	<div class="row" style="padding-top: 8px;">
		<uib-tabset>
			<!-------------FACTURACIÓN--------------->			
			<uib-tab  index="2"  heading="{{'UI_FACTURACION' | translate}}"><div style="height: 250px">
				<div class="col-xs-12">
					<bcs-input-checkgroup
						valores		= "FAC.ConceptoConfiguradoEnModulo"
						etiquetas 	= "{Configurado	: 'UI_CONCEPTO_CONFIGURADO_PARA_MODULO'}"
						orientacion = 'V'
						modo 		= "U"
						activado	= "true"
						>
					</bcs-input-checkgroup>
				</div>
				<div class="col-xs-3">
					<div class="row" style="padding-bottom: 5px;"><label class="k-window-subtitle" translate>UI_INDICADORES</label></div>
					<bcs-input-checkgroup
						valores		="FAC.Indicadores"
						etiquetas 	= "{	EsOtrosConceptos	: 'UI_OTROS_CONCEPTOS',
											EsReembolso			: 'UI_REEMBOLSO'
									   }"
						orientacion = 'V'
						activado	= "FAC.ConceptoConfiguradoEnModulo.Configurado"
						modo 		= "U">
					</bcs-input-checkgroup>
					<bcs-input-checkgroup
						valores		="FAC.Indicadores2"
						etiquetas 	= "{EsInterfazSIG		: 'UI_INTERFAZ_SIG'}"
						orientacion = 'V'
						activado	= "FAC.ConceptoConfiguradoEnModulo.Configurado && FAC.Indicadores.EsOtrosConceptos"
						modo 		= "U">
					</bcs-input-checkgroup>
					<bcs-input-checkgroup
						valores		="FAC.Indicadores3"
						etiquetas 	= "{Contrapartida		: 'UI_CONTRAPARTIDA_USDCLP'}"
						orientacion = 'V'
						activado	= "FAC.ConceptoConfiguradoEnModulo.Configurado"
						modo 		= "U">
					</bcs-input-checkgroup>
					<bcs-input-checkgroup
						valores		="FAC.Indicadores4"
						etiquetas 	= "{AbonoClpContrapartida	: 'UI_ABONO_CLP_CONTRAPARTIDA'}"
						orientacion = 'V'
						activado	= "FAC.ConceptoConfiguradoEnModulo.Configurado && AbonoClpContrapartidaHabilitado"
						modo 		= "U">
					</bcs-input-checkgroup>
				</div>
				<!--   ----------------------------------------------------  AE -->
				<div class="col-xs-4">
					<div class="row" style="padding-bottom: 5px;"><label class="k-window-subtitle" translate>UI_VISIBLES</label></div>
					<bcs-input-checkgroup
						valores		="FAC.ConceptoConfiguradoEnAplicacion"
						etiquetas 	= "{	ConceptoConfiguradoOptimus 	: 'UI_OPTIMUS',
											ConceptoConfiguradoFiori 	: 'UI_FIORI', 
											ConceptoConfiguradoWs 		: 'UI_WEB_SERVICE'
									   }"
						orientacion = 'V'
						modo 		= "M"
						activado	= "FAC.ConceptoConfiguradoEnModulo.Configurado">
					</bcs-input-checkgroup>							
				</div>
				<!--   ----------------------------------------------------  AE -->
				<div class="col-xs-5">
					<div class="row">
						<label class="col-xs-4" translate>UI_CENTRO_COSTO</label>						
						<bcs-input-texto class="col-xs-5"
							id				="frmAgregarModificarConceptos_CentroCostoConcepto" 
							ng-model		="FAC.ngCentroCostoConcepto"
							activado		="FAC.ConceptoConfiguradoEnModulo.Configurado"
							k-ng-disabled	="!FAC.ConceptoConfiguradoEnModulo.Configurado"
							maxlength		=10>
						</bcs-input-texto>
						<label class="col-xs-4" translate>UI_CODIGO_PRODUCTO</label>
						<bcs-input-texto class="col-xs-5"
						id				="frmAgregarModificarConceptos_CodigoProductoInterfazSIG" 
						ng-model		="FAC.ngCodigoProductoInterfazSIG"
						activado		="FAC.ConceptoConfiguradoEnModulo.Configurado && FAC.Indicadores2.EsInterfazSIG"
						k-ng-disabled	="!FAC.Indicadores2.EsInterfazSIG"
						maxlength		=4>
					</bcs-input-texto>
					</div>
				</div>
			</div></uib-tab>

							filtros			="CUS.oConfiguracionInstrumento.filtros"

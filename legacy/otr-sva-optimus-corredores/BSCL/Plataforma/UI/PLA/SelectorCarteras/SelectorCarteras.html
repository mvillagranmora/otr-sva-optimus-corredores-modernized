<div ng-controller="SelectorCarterasCtrl">
	<form name ="BusquedaCarterasForm">
		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
						<bcs-input-texto class="col-xs-7" ng-model="parametrosForm.instrumento" k-ng-disabled="true"></bcs-input-texto>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_TASA</label>
						<bcs-input-numero class="col-xs-7" k-ng-model="parametrosForm.tasa" k-ng-disabled="true"></bcs-input-numero>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA_LIQUIDACION</label>
						<bcs-input-date class="col-xs-7" k-ng-model="parametrosForm.fechaLiquidacion" k-ng-disabled="true"></bcs-input-date>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_EMISOR</label>
						<bcs-input-texto class="col-xs-7" ng-model="parametrosForm.idEmisor" k-ng-disabled="true"></bcs-input-texto>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_TIPO_REAJUSTE</label>
						<bcs-input-texto class="col-xs-7" ng-model="parametrosForm.idTipoReajuste" k-ng-disabled="true"></bcs-input-texto>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO</label>
						<bcs-input-date class="col-xs-7" k-ng-model="parametrosForm.fechaVencimiento" k-ng-disabled="true"></bcs-input-date>
					</div>
				</div>
				<hr/>
				<div class="row" ng-hide="parametrosForm.idPortafolio > 0">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_CLIENTE</label>
						<bcs-combobox-base class="col-xs-7"
							auto-cargar="'false'"
						    tipo="'combobox-socio-negocio'"
						    filtros="parametrosBusqueda.filtrosCliente"
							cascada-a="parametrosBusqueda.filtrosPortafolio.IdCliente"
							cascada-valor="'IdCliente'"
				            cascada-defecto="'-1'">
						</bcs-combobox-base >
					</div>
					<div class="col-xs-4">
						<div class="col-xs-4" >
							<label translate>UI_PORTAFOLIO</label>
						</div>
						<bcs-combobox-base 
							class="col-xs-7"
						 	auto-cargar="'false'"
						    tipo="'combobox-portafolio'"
						    seleccionado="parametrosBusqueda.portafolioSeleccionado"
						    filtros="parametrosBusqueda.filtrosPortafolio"
				            item-post-filtro="'1'">
						</bcs-combobox-base >
					</div>
				</div>
			</div>
			<div class="col-xs-2">
				<bcs-button 
					class="col-xs-12" 
					bcs-tipo="'bcs-button-search'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="true"  
					bcs-clic="parametrosForm.buscarCarteras()">
				</bcs-button>
			</div>
		
		</div>
		<div class="row">
			<bcs-grid 
				id="grid-busqueda-carteras"
				fn-doble-click="seleccionarCartera(carteraSeleccionada)"
			 	configuracion = "gridConfigBusquedaCartera"
				seleccionado = "carteraSeleccionada"
				api = "gridApi">
			</bcs-grid>
		</div>
	
	 	
		<div class="row bcs-panel-comandos">
			<bcs-button id="BusquedaCarterasForm_seleccionarCartera" class="col-xs-2" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_SELECCIONAR' | translate" 
				bcs-habilitado="'true'"  bcs-clic="seleccionarCartera(carteraSeleccionada)"></bcs-button>
			<bcs-button id="BusquedaCarterasForm_cancelar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="'true'"  bcs-clic="cancelar()"></bcs-button>
		</div>
	</form>
</div>

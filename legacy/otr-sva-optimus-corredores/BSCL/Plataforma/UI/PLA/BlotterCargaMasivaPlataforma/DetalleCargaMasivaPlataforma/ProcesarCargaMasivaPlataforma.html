<div class="col-xs-12" ng-controller="ProcesarCargaMasivaPlataformaCtrl">
	<div class="row bcs-cuerpo">
		<form name="formProcCarMas">
			<div class="row">
				<label class="col-xs-8" translate>UI_RETIRAR_CARTERAS_SISTEMA</label>
				<bcs-input-checkbox 
					id="UI_CARTERA"
					ng-model	="data.switchCartera">
				</bcs-input-checkbox>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button 
			class				="col-xs-4" 
			ng-show				="'true'" 
			bcs-tipo			="'principal'"
			bcs-habilitado		="'true'"  
			bcs-texto			="'UI_PROCESAR' | translate" 
			bcs-clic			="data.ProcesarCargaMasiva()">
		</bcs-button>
		<bcs-button 
			class				="col-xs-4" 
			ng-show				="'true'" 
			bcs-auto-desactivar	="false" 
			bcs-habilitado		="'true'"
			bcs-texto			="'UI_CERRAR' | translate" 								
			bcs-clic			="btnCerrar(false)">
		</bcs-button>
		<input style="background-color:rgba(0, 0, 0, 0);border:none" readonly type="text"/>
	</div>
</div>

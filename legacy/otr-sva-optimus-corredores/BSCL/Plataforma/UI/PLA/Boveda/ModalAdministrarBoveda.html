<div class="row" ng-controller="ModalAdministrarBovedaCtrl as mAdmBvd">
	<div class="row">
		<form name="ModalAgregarBovedaDetalle" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ID_BOVEDA</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						k-ng-disabled="mAdmBvd.modoEditar"
						ng-model="mAdmBvd.datosDespues.IdBoveda">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CODIGO</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						ng-model="mAdmBvd.datosDespues.Codigo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_NOMBRE</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						ng-model="mAdmBvd.datosDespues.Nombre">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_PERSONA</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido = "false"
						id="bovedaComboPersona"
						tipo="'combobox-socio-negocio'"
						filtros="mAdmBvd.cmbbx.SocioDeNegocio.filtros"
						id-actual="mAdmBvd.datosDespues.IdSocioDeNegocio"
						id-defecto="mAdmBvd.datosAntes.IdSocioDeNegocio"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-input-checkbox class="col-xs-8"  
						ng-model="mAdmBvd.datosDespues.IdEstado">
					</bcs-input-checkbox>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAgregarBovedaDetalle.$valid"  
			bcs-clic="mAdmBvd.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mAdmBvd.cancelar();">
		</bcs-button>
	</div>
</div>

<div ng-controller='MantenedorParametrosCtrl'>
 	<div class="row bcs_titulo">
        <div class="col-xs-12">
            <span translate>UI_ADMINISTRACION_DICCIONARIO</span>
        </div>
    </div>
	<div class="row bcs-cuerpo">

		<div class="row">
			<div class="col-xs-11">
			{{InfoAdmin}}
			</div>
			<div class="col-xs-1 pull-right">
				<bcs-button bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false"
					bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"
					bcs-clic="data.buscar()"></bcs-button>
			</div>
		</div>
		<div class="row">
			<bcs-grid id="grid-mantenedor-parametros"
				configuracion="data.defaultOptions"
				fn-exportar-excel = "exportarExcel" 
				seleccionado="seleccionRegistro"
				fn-doble-click="editarParametro(seleccionRegistro)"> 
			</bcs-grid>
		</div>

		<div class="row bcs-panel-comandos">
			<bcs-button id="MantenedorParametrosCtrl.Editar" class="col-xs-2"
				bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_EDITAR' | translate"
				bcs-habilitado="(seleccionRegistro && seleccionRegistro.ModificablePorUsuario==='S')"
				bcs-clic="editarParametro(seleccionRegistro)"></bcs-button>
			<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>

	</div>
	
</div>

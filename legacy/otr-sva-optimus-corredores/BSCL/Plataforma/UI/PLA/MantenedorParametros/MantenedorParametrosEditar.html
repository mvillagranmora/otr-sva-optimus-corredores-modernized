<div class="col-xs-12" ng-controller="MantenedorParametrosEditarCtrl">
	<div class="row">
		<div class="col-xs-12">
			<form name="formEditarParametros">
	            <div class="row">				
	 					<label class="col-xs-2" translate>UI_CODIGO</label>
	 					<bcs-input-texto
						class="col-xs-10" 
						k-ng-disabled="datos.codigoDisable" 
						ng-model="datos.codigoKng"
						bcs-requerido="true" 
						solo-mayusculas="N">
						</bcs-input-texto>
				</div>
				<div class="row">				
	 					<label class="col-xs-2" translate>UI_VALOR</label>
	 					<bcs-input-texto 
						class="col-xs-10" 
						k-ng-disabled="datos.valorDisable" 
						ng-model="datos.valorKng"
						bcs-requerido="true" >
						</bcs-input-texto>
				</div>						
				<div class="row">
					<div class="row">
						<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-habilitado="formEditarParametros" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="true"  bcs-clic="ActualizaParametros()"></bcs-button>
						<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="LimpiarRegistro()"></bcs-button>
					</div>
				</div>
			</form>
		</div>
	</div> 
</div>

<div class="col-xs-12" ng-controller="RelacionInstrumentoCtrl as RelInst">
	<div class="row bcs-cuerpo">
		<form 
			id		="FormRelacionInstrumentoCtrl" 
			name	="FormRelacionInstrumentoCtrl" 
			class	="filters-formulario">
		    <div class="row">
     			<div class="row">
       				<bcs-grid 
       					id				="grilla-RelacionInstrumento" 
						configuracion	="grillaRelacionInstrumento" 
						seleccionado	="selGrillaRelacionInstrumento"
						fn-exportar-excel = "exportarExcel">
					</bcs-grid>
				</div>
				<div class="row col-xs-12 bcs-panel-comandos">
					<div class="row">
						<div class="col-xs-8">
							<bcs-button  
								class				="col-xs-2" 
								bcs-tipo			="'principal'" 		
								bcs-auto-desactivar	="false" 
								bcs-habilitado		="'true'"
								bcs-texto			="'UI_CREAR' | translate" 	 
								bcs-clic			="RelInst.win.administrarRelacionInstrumento();">	
							</bcs-button>
							<bcs-button  
								class				="col-xs-2" 
								bcs-tipo			="''"  	
								ng-if				="selGrillaRelacionInstrumento.IdRelacionInstrumento" 	
								bcs-mostrar			="selGrillaRelacionInstrumento.IdRelacionInstrumento"
								bcs-auto-desactivar	="false" 
								bcs-texto			="'UI_EDITAR' | translate" 
								bcs-habilitado		="'true'"  
								bcs-clic			="RelInst.win.editarRelacionInstrumento(selGrillaRelacionInstrumento);">	
							 </bcs-button>
						</div>
						<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
							<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
						</bcs-menu>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>

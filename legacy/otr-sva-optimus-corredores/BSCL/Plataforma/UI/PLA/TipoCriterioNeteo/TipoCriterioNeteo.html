<div class="col-xs-12" ng-controller="TipoCriterioNeteoCtrl as tCriNet">
	<div class="row bcs-cuerpo">
		<form id="FormTCriNet" name="FormTCriNet" class="filters-formulario">
		    <div class="row">
       				<div class="row">
	       				<bcs-grid 
	       					id="grid-tipo-criterio-neteo"
	       					fn-exportar-excel = "exportarExcel"  
							configuracion="tCriNet.grid"
							fn-doble-click="tCriNet.win.editar(tCriNet.seleccionado)"
							seleccionado="tCriNet.seleccionado">
						</bcs-grid>
					</div>
					<div class="row col-xs-12 bcs-panel-comandos">
						<div class="row">
							<div class="col-xs-8">
								<bcs-button  
									class="col-xs-3" 
									bcs-tipo="'principal'" 		
									bcs-auto-desactivar="false" 
									bcs-habilitado="'true'"
									bcs-texto="'UI_NUEVO' | translate" 	 
									bcs-clic="tCriNet.win.crear();">	
								</bcs-button>
								<bcs-button  
									class="col-xs-3" 
									bcs-tipo="''"  	
									bcs-auto-desactivar="false" 
									bcs-texto="'UI_EDITAR' | translate" 
									bcs-habilitado="tCriNet.seleccionado"  
									bcs-clic="tCriNet.win.editar(tCriNet.seleccionado);">	
								</bcs-button>
								<bcs-button  
									class="col-xs-3" 
									bcs-tipo="''"  	
									bcs-auto-desactivar="false" 
									bcs-texto="'UI_ELIMINAR' | translate" 
									bcs-habilitado="tCriNet.seleccionado"  
									bcs-clic="tCriNet.win.eliminar(tCriNet.seleccionado);">	
								</bcs-button>
							</div>
							<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
								<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
							</bcs-menu>
						</div>
					</div>
			</div>
		</form>
	</div>
</div>

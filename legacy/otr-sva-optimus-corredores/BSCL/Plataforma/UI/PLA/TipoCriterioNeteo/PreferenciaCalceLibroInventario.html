<div class="col-xs-12" ng-controller="PreferenciaCalceLibroInventarioCtrl as pclinv">
	<div class="row bcs-cuerpo">
		<form id="Formpclinv" name="Formpclinv" class="filters-formulario">
		    <div class="row">
       				<div class="row">
	       				<bcs-grid 
	       					id="grid-preferencia-calce-libro-inventario"
							configuracion="pclinv.grid"
							seleccionado="pclinv.seleccionado">
						</bcs-grid>
					</div>
					<div class="row col-xs-12 bcs-panel-comandos">
						<div class="row">
							<div class="col-xs-12">
								<bcs-button  
									class="col-xs-3" 
									bcs-tipo="''" 		
									bcs-auto-desactivar="false" 
									bcs-habilitado="'true'"
									bcs-texto="'UI_RECALCULAR' | translate" 	 
									bcs-clic="pclinv.win.recalcular();">	
								</bcs-button>
								<bcs-button  
									class="col-xs-3" 
									bcs-tipo="''"  	
									bcs-auto-desactivar="false" 
									bcs-texto="'UI_TIPOS_CRITERIO_NETEO' | translate" 
									bcs-habilitado="'true'"  
									bcs-clic="pclinv.win.tipoCriterioNeteo();">	
								</bcs-button>
							</div>
							<!-- bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
								<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
							</bcs-menu-->
						</div>
					</div>
			</div>
		</form>
	</div>
</div>

<div class="row" ng-controller="modalTipoCriterioNeteoCtrl as modTCN">
	<div class="row">
		<form name="formModalTipoCriterioNeteo" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-6" translate>UI_NOMBRE_TIPO_CRITERIO_NETEO</label>
				<bcs-input-texto 
					class="col-xs-6" 
					bcs-requerido
					maxlength = "40"
					ng-model="modTCN.datosDespues.NombreTipoCriterioNeteo">
				</bcs-input-texto>			
			</div>
			<!-- k-options="data.folioCarteraOptions" -->
			<div class="row">
				<label class="col-xs-6" translate>UI_SECUENCIA_NETEO</label>
		  		<bcs-input-numero
					class="col-xs-6"
					bcs-requerido
					decimales="0"					
					k-ng-model="modTCN.datosDespues.SecuenciaNeteo">
				</bcs-input-numero>
			</div>
			<div class="row col-xs-12 bcs-panel-comandos">
				<bcs-button class="col-xs-3" 
					bcs-tipo="'principal'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_GUARDAR' | translate" 
					bcs-habilitado="formModalTipoCriterioNeteo.$valid"
					bcs-clic="modTCN.win.guardar();">
				</bcs-button>
				<bcs-button class="col-xs-3" 
					bcs-tipo="''" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CANCELAR' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="modTCN.win.cancelar();">
				</bcs-button>
			</div>
		</form>	
	</div>	
</div>

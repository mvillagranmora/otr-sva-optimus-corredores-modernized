<div class="row" ng-controller='ConsultarFlujoCajaCtrl as cliente'>
	<div class="row bcs-cuerpo">

        <table class="table" style="margin-bottom: 20px">
            <tr>
              <td width="25%"><strong class="align_right" translate>UI_CLIENTE</strong></td>
              <td colspan="3"><label class="">{{cliente.Info[0].NombreCliente}}</label></td>
            </tr>
            <tr>
              <td width="25%"><strong class="align_right" translate>UI_DOCUMENTO_IDENTIDAD</strong></td>
              <td width="25%"><label class="" >{{cliente.Info[0].DocumentoIdentidad}}</label></td>
              <td width="25%"><strong class="align_right" translate>UI_PORTAFOLIO</strong></td>
              <td width="25%"><label class="" >{{cliente.Info[0].NombrePortafolio}}</label></td>
            </tr>
            <tr>
              <td><strong class="align_right" translate>UI_FECHA_LIQUIDACION</strong></td>
			  <td><bcs-input-date id="ConsultarFlujoCaja_FechaEfectiva" class="col-xs-11"
				k-ng-model="data.kngFechaEfectiva" 
				k-options="data.kOpFechaEfectiva">
			  </bcs-input-date></td>
              <!--<td><label class="">{{cliente.Info[0].FechaLiquidacion | kformat:'d'}}</label></td>-->
              <td><strong class="align_right" translate>UI_MONEDA</strong></td>
              <td><label class="">{{cliente.Info[0].NombreMoneda}}</label></td>
            </tr>
        </table>

		<bcs-grid id="frmConsultarFlujoCaja_grid-flujoCaja"
			configuracion = "confConsultarFlujoCaja"
			seleccionado = "seleccionConsultarFlujoCaja"
			fn-exportar-excel="excelConsultarFlujoCaja">
		</bcs-grid>

	</div>
</div>

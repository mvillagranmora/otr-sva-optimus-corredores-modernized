<div id="formConsultarBoletines" class="col-xs-12" ng-controller="ConsultarBoletinesCtrl">
    <div id="boletines">
    	<div class="row">
    		<div class="col-xs-10">
	    		<label class="col-xs-3" translate>UI_NOMBRE</label>
				<div class="col-xs-8">
					<bcs-input-texto class="col-xs-12" solo-mayusculas="S" bcs-requerido="'true'"
						ng-model="data.ReportName">
					</bcs-input-texto>
				</div>
			</div>
			<div class="col-xs-2">
	    		<bcs-button id="formConsultarBoletines_buscar" class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'" bcs-clic="search()"></bcs-button>
			</div>
    	</div>
		<div class="row">
			<bcs-grid id="grid-boletin"
			
		 	configuracion = "confGridBoletin"
			seleccionado = "seleccionBoletin"
			fn-exportar-excel = "exportarExcel">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formConsultarBoletines_subir" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_SUBIR' | translate" bcs-habilitado="'true'" bcs-clic="uploadBoletin()"></bcs-button>
		<bcs-button id="formConsultarBoletines_eliminar" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="seleccionBoletin!=undefined" bcs-clic="eliminar()"></bcs-button>
	</div>
</div>

<div id="formOperarTemplate" class="col-xs-12" ng-controller="OperarBoletinCtrl">
	<div class="row">
		<div class="col-xs-12">
			<div class="row">
				<form enctype="multipart/form-data" id="formBoletin" method="POST">
					<div class="row">
						<label class="col-xs-4" translate>UI_NOMBRE</label>
						<div class="col-xs-8">
							<bcs-input-texto class="col-xs-12" solo-mayusculas="S" bcs-requerido="'true'"
								ng-model="data.Descripcion">
							</bcs-input-texto>
						</div>
					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_BOLETIN</label>
						<div class="col-xs-8">
							<input class="col-xs-12" type="file" id="data" name="data" ></input>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button ng-if="config.operacion === 'CREATE'" id="formOperarBoletin_guardar" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_SUBIR' | translate" bcs-habilitado="'true'" bcs-clic="upload()"></bcs-button>
	</div>
</div>

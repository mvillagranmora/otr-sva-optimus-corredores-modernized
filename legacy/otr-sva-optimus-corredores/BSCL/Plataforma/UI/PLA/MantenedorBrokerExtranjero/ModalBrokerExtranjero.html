<div class="row" ng-controller="ModalBrokerExtranjeroCtrl">
	<div class="row">
		<form name="FormModalBrokerExtranjero" class="col-xs-12">
			<div class="row" ng-show="!formData.NombreCompleto">
				<label class="col-xs-4" translate>UI_SOCIO_DE_NEGOCIO</label>
				<bcs-combobox-base class="col-xs-7"
						tipo="'combobox-socio-negocio'" 
						filtros="formData.filtrosSocioDeNegocio"
						seleccionado="datos.SocioDeNegocio"
						carga-cliente-automatico="false">
					</bcs-combobox-base>
			</div>
			<div class="row" ng-show="formData.NombreCompleto">
				<label class="col-xs-4" translate>UI_SOCIO_DE_NEGOCIO</label>
				<bcs-input-texto class="col-xs-7"
				k-ng-disabled ="'true'"
				ng-model = formData.NombreCompleto>
				</bcs-input-texto>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CODIGO</label>
					<bcs-input-texto class="col-xs-7"
						bcs-requerido
						ng-model="datos.Codigo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-7"
						bcs-requerido
						tipo = "'combobox-estado-broker-extranjero'"
						id-defecto  = "datos.IdEstadoDefecto"
						id-actual = "datos.IdEstado">
					</bcs-combobox-base>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="FormModalBrokerExtranjero.$valid"  
			bcs-clic="formData.aceptar();">
		</bcs-button>
	</div>
</div>

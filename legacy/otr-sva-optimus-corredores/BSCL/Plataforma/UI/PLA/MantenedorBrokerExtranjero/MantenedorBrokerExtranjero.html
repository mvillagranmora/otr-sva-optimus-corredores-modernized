<div class="row" ng-controller="MantenedorBrokerExtranjeroCtrl">
	<div class="row">
		<form name="FormBrokerExtranjero">
		    <div class="row">
     			<div class="row">
       				<bcs-grid 
       					configuracion	="grillaBrokersExtranjeros" 
						seleccionado	="seleccionado"
						fn-exportar-excel = "exportarExcel">
					</bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-8">
						<bcs-button  
							class				="col-xs-2" 
							bcs-tipo			="'principal'" 		
							bcs-auto-desactivar	="false" 
							bcs-habilitado		="'true'"
							bcs-texto			="'UI_CREAR' | translate" 	 
							bcs-clic			="crearBrokerExtranjero()">	
						</bcs-button>
						<bcs-button  
							class				="col-xs-2" 
							bcs-tipo			="''"  	
							bcs-auto-desactivar	="false" 
							bcs-texto			="'UI_EDITAR' | translate" 
							bcs-habilitado		="seleccionado"  
							bcs-clic			="modificarBrokerExtranjero()">	
						 </bcs-button>	
					</div>
					<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
						<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
					</bcs-menu>
				</div>
			</div>
		</form>
	</div>
</div>

<div class="col-xs-12" ng-controller="MantenedorMotivosCtrl as manMot">
	<div class="row bcs-cuerpo">
		<form id="FormMantenedorMotivoCtrl" name="FormMantenedorMotivoCtrl" class="filters-formulario">
		    <div class="row">
     			<div class="row">
       				<bcs-grid 
       					id				="grilla-motivo" 
						configuracion	="grillaMantenedorMotivos" 
						seleccionado	="manMot.selGrillaMotivo"
						fn-exportar-excel = "exportarExcel">
					</bcs-grid>
				</div>
				<div class="row col-xs-12 bcs-panel-comandos">
					<div class="row">
						<div class="col-xs-8">
							<bcs-button
								id="MantenedorMotivo_crear"  
								class				="col-xs-2" 
								bcs-tipo			="'principal'" 		
								bcs-auto-desactivar	="false" 
								bcs-habilitado		="'true'"
								bcs-texto			="'UI_CREAR' | translate" 	 
								bcs-clic			="manMot.win.crearMotivo();">	
							</bcs-button>
							<bcs-button
								id="MantenedorMotivo_editar"    
								class				="col-xs-2" 
								bcs-tipo			="''"  	
								bcs-auto-desactivar	="false" 
								bcs-texto			="'UI_EDITAR' | translate" 
								bcs-habilitado		="manMot.selGrillaMotivo.IdMotivo"  
								bcs-clic			="manMot.win.editarMotivo(manMot.selGrillaMotivo);">	
							 </bcs-button>
						</div>
						<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
							<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
						</bcs-menu>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>

<div class="row" ng-controller="ModalMantenedorMotivosCtrl as mManMot">
	<div class="row">
		<form name="ModalAgregarMotivoDetalle" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-tipo-motivo'"
						activado="false"
						id-actual="mManMot.datosDespues.tipoMotivo"
						id-defecto="mManMot.datosAntes.tipoMotivo"
						>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-estado-motivo'"
						id-post-filtro="mManMot.estadoP"
						id-actual="mManMot.datosDespues.IdEstado"
						id-defecto="mManMot.datosAntes.IdEstado"
						filtros = "mManMot.filtrosEstado"
						bcs-requerido>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_MOTIVO</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						id-actual="mManMot.datosAntes.Motivo"
						ng-model="mManMot.datosDespues.Motivo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ACTIVO</label>
					<bcs-input-checkbox class="col-xs-8"  
						id-actual="mManMot.datosAntes.Activo"
						ng-model="mManMot.datosDespues.Activo">
					</bcs-input-checkbox>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAgregarMotivoDetalle.$valid"  
			bcs-clic="mManMot.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mManMot.cancelar();">
		</bcs-button>
	</div>
</div>

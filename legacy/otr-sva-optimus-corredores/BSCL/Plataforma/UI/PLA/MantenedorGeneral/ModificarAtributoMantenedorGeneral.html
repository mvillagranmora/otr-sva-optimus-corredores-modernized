<div class = "row" id="contenedorAtributos" ng-controller="ModificarAtributoCtrl">
<form name="frmAtributos" class="col-xs-12 form-horizontal" style="padding: 10px;">
	<div ng-repeat="btn in atributosMantenedor">
		<div ng-if="btn.ComponenteUI == 'bcs-input-texto'">
		  <label class="col-xs-4" style="padding-left: 10px;">{{btn.NombreDiccionario|translate}}</label>  
		  <bcs-input-texto ng-model="modificar[btn.NombreCampo]" style = "padding-top: 4px;" class="col-xs-8" bcs-requerido="btn.RequeridoCampo"></bcs-input-texto>			   	  			   	  	
		</div>
	
	    <div ng-if="btn.ComponenteUI == 'bcs-combobox-base'">
		  <label class="col-xs-4" style="padding-left: 10px;">{{btn.NombreDiccionario|translate}}</label>
		
		  <!-- id-post-filtro para socio de negocio debe estar en 1  -->
		  <bcs-combobox-base class="col-xs-6"
			  id-post-filtro		= "'1'"   
			  id-actual             = "modificar[btn.NombreCampo]"
			  id-defecto			= "modificarAntes[btn.NombreCampo]" 
			  auto-cargar		  	= "'true'"
			  tipo					= "btn.Formato"
			  style 				= "padding-top: 4px;"
			  bcs-requerido			= "btn.RequeridoCampo">
		  </bcs-combobox-base>
		</div>
	</div>
 	<div class = "row">
 	  <div class="row bcs-panel-comandos">
         <bcs-button class="col-xs-2" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="frmAtributos.$valid" bcs-mostrar = "data.mostrar" bcs-clic="modificarMantenedor()"></bcs-button>
         <bcs-button class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-habilitado="true" bcs-mostrar = "data.mostrar" bcs-clic="cerrarMantenedor()"></bcs-button>
      </div>
    </div>
    
</form>    
</div>

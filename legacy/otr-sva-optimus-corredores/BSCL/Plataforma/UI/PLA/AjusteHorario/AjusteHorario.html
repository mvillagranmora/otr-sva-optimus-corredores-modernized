<div class="row" ng-controller='AjusteHorarioCtrl'>
	<div class="row bcs_titulo">
		<div class="col-xs-12">
			<span>{{'UI_BLOTTER_REVISION_COBERTURA'|translate}}</span>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-7">
            <div class="row">				
 					<label class="col-xs-4" translate>UI_ACTUAL_AJUSTE</label>
 					<label class="col-xs-4" translate>{{Configuracion.Valor}} Segundos </label>	<label class="col-xs-4" translate>(GTM {{gtm.zonaHoraria}} )</label>		 
			</div>	
			<div class="row">
 						<label class="col-xs-4" translate>UI_NUEVO_AJUSTE</label>					
						<bcs-input-numero 
						id="segundos" 
						class="col-xs-6" 
						bcs-requerido = "'true'" 
						k-options="minimoOptions"
						k-ng-model="data.kngSegundos" >
						</bcs-input-numero>

 			 
			</div>
		</div>
		<div class="col-xs-5">
				<div class="row">
					<div class="col-xs-2"></div>
					<bcs-button class="col-xs-5" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_CAMBIAR' | translate" bcs-habilitado="true"  bcs-clic="CambiarZonaHoraria()"></bcs-button>
				</div>
				
		 </div>

	</div> 
	
</div>

<div ng-controller='AjusteFechaSistemaCtrl'>
	<div class="row bcs_titulo">
	   <div class="col-xs-12">
		   <span translate>UI_AJUSTE_FECHA_SISTEMA</span>
	   </div>
   </div>
   <div class="row">
	   <div class="col-xs-12">
		   <form name="formAjusteFechaSistema">
			   <div class="row">				
					<label class="col-xs-6" translate>UI_ACTUAL_AJUSTE</label>
					<bcs-input-date 
				   class="col-xs-6" 
				   bcs-requerido = "true" 
				   k-ng-disabled = "true"
				   k-ng-model="data.kngFechaActual" >
				   </bcs-input-date>	 
			   </div>	
			   <div class="row">
				   <label class="col-xs-6" translate>UI_NUEVO_AJUSTE</label>					
				   <bcs-input-date 
				   class="col-xs-6" 
				   bcs-requerido = "true" 
				   k-ng-model="data.kngFechaNueva" >
				   </bcs-input-date>
			   </div>
			   <br>
			   <div class="row">
				   <bcs-button class="col-xs-4 pull-right" bcs-tipo="'bcs-button-primary'"  bcs-habilitado="formAjusteFechaSistema.$valid" bcs-auto-desactivar="false" bcs-texto="'UI_CAMBIAR' | translate" bcs-habilitado="true"  bcs-clic="cambiarFechaSistema()"></bcs-button>
			   </div>
		   </form>
	   </div>
   </div> 
</div>

<div id="RequisitosProcesoFunciones"
    ng-controller='RequisitosProcesoFuncionesCtrl as rpfn'>
    <div class="row bcs-cuerpo">
        <div class="row">
            <div class="col-xs-10">
                <label class="col-xs-2" translate>UI_NOMBRE</label>
                <bcs-input-texto class="col-xs-5" ng-model="rpfn.nombre" 
                    ng-disabled="true">
                </bcs-input-texto>
            </div>
            <!-- INICIO BOTONES -->
            <div class="col-xs-2">
                <bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"
                    bcs-auto-desactivar="'false'"
                    bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="'true'"
                    bcs-clic=""></bcs-button>
            </div>
            <!-- FIN BOTONES -->
        </div>
        <div class="row">
            <div class="col-xs-10">
                <label class="col-xs-2" translate>UI_CONDICION_EJECUCION</label>
                <div class="col-xs-2">
                    <label class="col-xs-9" translate>UI_MODULO_ABIERTO</label>
                    <bcs-input-checkbox class="col-xs-1" ng-model="rpfn.abierto"
                        ng-disabled=""> </bcs-input-checkbox>
                    
                </div>
                <div class="col-xs-3">
                    <label class="col-xs-6" translate>UI_MODULO_CERRADO</label>
                    <bcs-input-checkbox class="col-xs-1" ng-model="rpfn.cerrado"
                        ng-disabled=""> </bcs-input-checkbox>
                </div>
            </div>
        </div>
        
        <!-- GRILLA -->
        <div class="row">
            <bcs-grid id="grid-procesoFunciones"
                configuracion="rpfn.confBasicaProcesoFunciones"
                seleccionado="rpfn.seleccionProcesoFunciones"
                api="rpfn.gridApiProcesoFunciones"> </bcs-grid>
        </div>
    </div>

</div>

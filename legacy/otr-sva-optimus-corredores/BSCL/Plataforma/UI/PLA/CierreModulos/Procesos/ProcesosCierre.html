<div id="ProcesosCierre" ng-controller='ProcesosCierreCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-10">	
				<div class="row">
						<div class="col-xs-7">
							<label class="col-xs-3" translate>UI_FECHA_CONSULTA</label>
							<bcs-input-date id="fechaConsultaProcesosCierre" class="col-xs-7"
								k-ng-model="fechaConsulta"
								>
							</bcs-input-date>
						</div>
				</div>
			</div>
			<!-- INICIO BOTONES -->
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="'false'" bcs-texto="'UI_BUSCAR' | translate"  bcs-habilitado="'true'" bcs-clic="buscar()"></bcs-button>
				</div>
			</div>
			<!-- FIN BOTONES -->
			
		</div>
		<div style="height: auto; overflow: hidden;">
			<div style="width: 500px; float: right;">
				<div class="row bcs_titulo no-margin">UI_LOG_PROCESOS</div>
				<div class="row">
					<bcs-grid id="grid-logProcesos"
						configuracion="confBasicaLogProcesos"
						seleccionado="seleccionLogProcesos" api="grillas.gridLogProcesos"></bcs-grid>
				</div>
			</div>
			<!-- Grid Eventos izq -->
			<div style="float: none; overflow: hidden; padding-right: 10px">
				<div class="row bcs_titulo no-margin">UI_MODULOS</div>
				<div class="row">
					<bcs-grid id="grid-modulos" configuracion="confBasicaModulos"
						seleccionado="seleccionModulo" api="grillas.gridModulos"></bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-primary'"
						bcs-auto-desactivar="false" bcs-texto="'UI_ABRIR' | translate"
						bcs-habilitado="'true'" bcs-clic="aperturaModulo()"></bcs-button>
					<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate"
						bcs-habilitado="(seleccionModulo.IdModulo!='SIS')" bcs-clic="cierreModulo()"></bcs-button>
				</div>
			</div>
		</div>
	</div>

</div>

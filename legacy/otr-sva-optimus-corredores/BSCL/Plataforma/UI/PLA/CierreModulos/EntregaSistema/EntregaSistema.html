<div id="ProcesosSistema" ng-controller='ProcesosSistemaCtrl'>
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-primary'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_ENTREGA' | translate"
						bcs-habilitado="'true'" bcs-clic="entregaSistema()">
					</bcs-button>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"
						bcs-auto-desactivar="'false'" bcs-texto="'UI_APERTURA' | translate"
						bcs-habilitado="'true'" bcs-clic="aperturaSistema()">
					</bcs-button>
				</div>
			</div>
		</div>
		<div class="row">
			<bcs-grid id="grid-logProcesos" configuracion="configResultados"
			api="gridApiResultados">
			</bcs-grid>
		</div>
	</div>
</div>

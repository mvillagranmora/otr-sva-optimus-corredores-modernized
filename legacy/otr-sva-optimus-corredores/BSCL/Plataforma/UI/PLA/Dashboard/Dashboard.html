<div class="col-xs-12" ng-controller="dashboardCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
    		  <div class="col-xs-6">
				 <div kendo-chart
				                 k-title="'Total Ordenes Ingresadas'"
				                 k-data-source="datasourceOI"
				                 k-legend="{ position: 'bottom' }"				                   
				                 k-series="seriesOI"					                 			               
				                 k-value-axis="valueaxisOI" 				                 
				                 k-category-axis="categoryaxisOI"				                 
				                 k-tooltip="tooltipOI"
				                 style="height: 360px;" ></div>    		  
    		  </div>
    		  <div class="col-xs-6">
				 <div kendo-chart
				                 k-title="'Total Comisiones vs Agente'"
				                 k-data-source="datasourceCA"
				                 k-legend="{ position: 'bottom' }"				                   
				                 k-series="seriesCA"					                 			               
				                 k-value-axis="valueaxisCA" 				                 
				                 k-category-axis="categoryaxisCA"				                 
				                 k-tooltip="tooltipCA"
				                 style="height: 360px;" ></div>    		    		  
    		  </div>
    	</div>
    	<div class="row">
    		  <div class="col-xs-6">
				 <div kendo-chart
				                 k-title="'Total Montos Netos vs Agente'"
				                 k-data-source="datasourceMA"
				                 k-legend="{ position: 'bottom' }"				                   
				                 k-series="seriesMA"					                 			               
				                 k-value-axis="valueaxisMA" 				                 
				                 k-category-axis="categoryaxisMA"				                 
				                 k-tooltip="tooltipMA"
				                 style="height: 360px;" ></div>    		  
    		  </div>
    		  <div class="col-xs-6">
				 <div kendo-chart
				                 k-title="'Distribución Instrumentos Financieros'"
				                 k-data-source="datasourceIF"
				                 k-legend="{ position: 'bottom' }"
				                 k-series-defaults="seriesDefaultsIF"					                   
				                 k-series="seriesIF"					                 			               				                			                 
				                 k-tooltip="tooltipIF"
				                 style="height: 360px;" ></div>    		    		  
    		  </div>
    	</div>    	
    </div>   
</div>

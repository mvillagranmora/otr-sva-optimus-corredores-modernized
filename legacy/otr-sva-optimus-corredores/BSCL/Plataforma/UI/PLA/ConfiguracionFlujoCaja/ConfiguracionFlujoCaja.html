<div id="ConfiguracionFlujoCaja"
	ng-controller="ConfiguracionFlujoCajaCtrl as cFlujoCaja">
	<div class="col-xs-12">
		<div class="row">
			<bcs-grid seleccionado="cFlujoCaja.FlujoCajaSeleccionado"
				configuracion="cFlujoCaja.gridFlujoCaja"> </bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos"></div>

	<div class="row bcs-panel-comandos">
		<bcs-button id="ConfiguracionFlujoCaja_ActFlujoCaja" class="col-xs-2"
			bcs-tipo="'default'" bcs-auto-desactivar="false"
			bcs-texto="'UI_ACT_Flujo_Caja' | translate" bcs-habilitado="true"
			bcs-clic="GrabarConfigurafionFlujoCaja()"></bcs-button>
		<div class="col-xs-2"></div>
	</div>

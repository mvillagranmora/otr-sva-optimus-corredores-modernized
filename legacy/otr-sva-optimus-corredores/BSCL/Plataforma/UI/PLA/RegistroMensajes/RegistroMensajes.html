<div ng-controller='RegistroMensajesCtrl'>
	<div class="col-xs-12 bcs-cuerpo">
		<div style="height:200px;min-height:200px;overflow:auto;border:1px #E7E7E7 solid;background-color:#E7E7E7">
			<table class="table b1-table" style="background-color:#E7E7E7">
			<thead>
				<tr style="border: 1px solid #B6B9BA;">
					<th class="col-xs-1">#</th>
					<th class="col-xs-1" translate>UI_TIPO</th>
					<th class="col-xs-6" translate>UI_MENSAJE</th>
					<th class="col-xs-3" translate>UI_FECHA_HORA</th>
				</tr>
			</thead>
			<tbody style="border: 1px solid #B6B9BA;">
				<tr ng-repeat="data in datars | orderBy:'-fecha'">
					<td>{{data.pos}}</td>
					<td>{{data.tipo}}</td>
					<td>{{data.msg}}</td>
					<td>{{data.fecha | kformat:'G'}}</td>
				</tr>
			</tbody>
			</table>
		</div>
		
		
		
	</div>			
</div>

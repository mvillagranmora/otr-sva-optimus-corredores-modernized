<div id="formConsultarImagenes" class="col-xs-12" ng-controller="ConsultarImagenesCtrl">
    <div id="imagenes">
    	<div class="row">
    		<div class="col-xs-8">
	    		<label class="col-xs-4" translate>UI_NOMBRE</label>
				<div class="col-xs-8">
					<bcs-input-texto class="col-xs-12" solo-mayusculas="S" bcs-requerido="'true'"
						ng-model="data.nombrArchivo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="col-xs-4">
	    		<bcs-button id="formConsultarImagenes_buscar" class="col-xs-12" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'" bcs-clic="search()"></bcs-button>
			</div>
    	</div>
		<div class="row">
			<bcs-grid id="grid-imagenes"
			fn-doble-click="viewImage()"
		 	configuracion = "confGridImagenes"
			seleccionado = "seleccionImagen"
			fn-exportar-excel = "exportarExcel">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formConsultarImagenes_subir" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_SUBIR' | translate" bcs-habilitado="'true'" bcs-clic="uploadImage()"></bcs-button>
		<bcs-button id="formConsultarImagenes_modificar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="seleccionImagen!=undefined" bcs-clic="updateImage()"></bcs-button>
		<bcs-button id="formConsultarImagenes_descargar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_DESCARGAR' | translate" bcs-habilitado="seleccionImagen!=undefined" bcs-clic="downloadImage()"></bcs-button>
	</div>
</div>

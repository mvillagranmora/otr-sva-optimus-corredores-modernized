<div class="col-xs-12" ng-controller="EditarDiccionarioCtrl">
	<div class="row">
		<div class="col-xs-12">
			<form name="formEditarDiccionario">
	            <div class="row">				
	 					<label class="col-xs-2" translate>UI_COD_DICCIONARIO</label>
	 					<bcs-input-texto
						class="col-xs-10" 
						k-ng-disabled="datos.disableCodDiccionario" 
						ng-model="datos.kngCodDiccionario"
						bcs-requerido="true" >
						</bcs-input-texto>
				</div>
				<div class="row">				
	 					<label class="col-xs-2" translate>UI_COD_LENGUAJE</label>
	 					<bcs-input-texto 
						class="col-xs-10" 
						k-ng-disabled="datos.disableCodLenguaje" 
						ng-model="datos.kngCodLenguaje"
						bcs-requerido="true" >
						</bcs-input-texto>
				</div>
				<div class="row">				 
	 					<label class="col-xs-2" translate>UI_DESCRIPCION</label>
	 					<bcs-input-texto 
						class="col-xs-10" 
						k-ng-disabled="false"
						solo-mayusculas="N"
						ng-model="datos.kngDescripcion"
						bcs-requerido="true" >
						</bcs-input-texto>
				</div>
				<div class="row">				
	 					<label class="col-xs-2" translate>UI_ABREVIADO</label>
	 					<bcs-input-texto 
						class="col-xs-10" 
						k-ng-disabled="false" 
						solo-mayusculas="N"
						ng-model="datos.kngAbreviado" >
						</bcs-input-texto>
				</div>
			
				<div class="row">
					<div class="row">
						<bcs-button class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="formEditarDiccionario.$valid" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="true"  bcs-clic="ActualizaDiccionario()"></bcs-button>
						<bcs-button class="col-xs-2" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="LimpiarRegistro()"></bcs-button>
					</div>
				</div>
			</form>
		</div>
	</div> 
</div>

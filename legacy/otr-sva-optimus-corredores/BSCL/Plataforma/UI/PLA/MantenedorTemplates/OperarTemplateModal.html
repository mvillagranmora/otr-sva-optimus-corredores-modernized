<div id="formOperarTemplate" class="col-xs-12" ng-controller="OperarTemplateCtrl">
	<div class="row">
		<div class="col-xs-12">
			<div class="row">
				<form enctype="multipart/form-data" id="formTemplate" method="POST">
					<div class="row">
						<label class="col-xs-4" translate>UI_NOMBRE</label>
						<div class="col-xs-8">
							<bcs-input-texto class="col-xs-12" solo-mayusculas="S" bcs-requerido="'true'"
								ng-model="data.ReportName">
							</bcs-input-texto>
						</div>
					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_TEMPLATE</label>
						<div class="col-xs-8">
							<input class="col-xs-12" type="file" id="data" name="data" ></input>
						</div>
					</div>
					<div class="row">
						<label class="col-xs-4" translate>UI_VERSION</label>
						<div class="col-xs-8">
							<bcs-input-texto class="col-xs-12" solo-mayusculas="S" bcs-requerido="'false'"
								ng-model="data.ReportVersion">
							</bcs-input-texto>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button ng-if="config.operacion === 'CREATE'" id="formOperarTemplate_guardar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_SUBIR' | translate" bcs-habilitado="'true'" bcs-clic="upload()"></bcs-button>
		<bcs-button ng-if="config.operacion === 'UPDATE'" id="formOperarTemplate_modificar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="'true'" bcs-clic="update()"></bcs-button>
	</div>
</div>

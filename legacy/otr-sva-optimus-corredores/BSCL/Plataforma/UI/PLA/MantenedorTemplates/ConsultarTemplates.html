<div id="formConsultarTemplates" class="col-xs-12" ng-controller="ConsultarTemplatesCtrl">
    <div id="templates">
    	<div class="row">
    		<div class="col-xs-8">
	    		<label class="col-xs-4" translate>UI_NOMBRE</label>
				<div class="col-xs-8">
					<bcs-input-texto class="col-xs-12" solo-mayusculas="S" bcs-requerido="'true'"
						ng-model="data.ReportName">
					</bcs-input-texto>
				</div>
			</div>
			<div class="col-xs-4">
	    		<bcs-button id="formConsultarTemplates_buscar" class="col-xs-12" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'" bcs-clic="search()"></bcs-button>
			</div>
    	</div>
		<div class="row">
			<bcs-grid id="grid-template"
			fn-doble-click="downloadTemplate()"
		 	configuracion = "confGridTemplate"
			seleccionado = "seleccionTemplate"
			fn-exportar-excel = "exportarExcel">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formConsultarTemplates_subir" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_SUBIR' | translate" bcs-habilitado="'true'" bcs-clic="uploadTemplate()"></bcs-button>
		<bcs-button id="formConsultarTemplates_modificar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="seleccionTemplate!=undefined" bcs-clic="updateTemplate()"></bcs-button>
		<bcs-button id="formConsultarTemplates_descargar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_DESCARGAR' | translate" bcs-habilitado="seleccionTemplate!=undefined" bcs-clic="downloadTemplate()"></bcs-button>
	</div>
</div>

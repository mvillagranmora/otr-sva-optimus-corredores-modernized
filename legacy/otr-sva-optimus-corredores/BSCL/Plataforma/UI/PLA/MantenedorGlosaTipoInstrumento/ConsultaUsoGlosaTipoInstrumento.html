<div id="consultaUsoGlosaTipoInstrumento" ng-controller='ConsultaUsoGlosaTipoInstrumentoCtrl as consultaUsoGlosaTipoInstrumento'>
	<div class="row">
		<!-- INICIO FILTROS -->
		<div class="col-xs-11">
			<div class="row">
				<div class="col-xs-8">
					<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-tipo-instrumento'"
			  			id-actual="consultaUsoGlosaTipoInstrumento.filtros.uso"
						filtros ="oConfiguracionTipoInstrumento.filtros"
			  			item-post-filtro="'1'"
			  			todos="'S'">
			  		</bcs-combobox-base>
				</div>
			</div>
		</div>
		<!-- FIN FILTROS -->
	</div>
	<!-- INICIO GRILLA -->
	<div class="row">
		<div class="row">
			<div class="col-xs-5">
				<bcs-grid 
				id="grid-usos-all"
				api = "consultaUsoGlosaTipoInstrumento.apiGridAll"
			 	configuracion = "consultaUsoGlosaTipoInstrumento.defaultOptionsAll"
				seleccionado = "consultaUsoGlosaTipoInstrumento.registroSeleccionadoAll"> 
				</bcs-grid>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button id="consultaUsoGlosaTipoInstrumento_asignar" class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="consultaUsoGlosaTipoInstrumento.filtros.uso && consultaUsoGlosaTipoInstrumento.registroSeleccionadoAll && consultaUsoGlosaTipoInstrumento.registroSeleccionadoAll.length > 0"  bcs-clic="consultaUsoGlosaTipoInstrumento.agregar()"></bcs-button>
				</div>
				<div class="row">
					<bcs-button id="consultaUsoGlosaTipoInstrumento_quitar" class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_QUITAR' | translate" bcs-habilitado="consultaUsoGlosaTipoInstrumento.filtros.uso && consultaUsoGlosaTipoInstrumento.registroSeleccionadoAct"  bcs-clic="consultaUsoGlosaTipoInstrumento.quitar()"></bcs-button>
				</div>
			</div>
			<div class="col-xs-5">
				<bcs-grid 
				id="grid-usos-act"
				api = "consultaUsoGlosaTipoInstrumento.apiGridAct"
			 	configuracion = "consultaUsoGlosaTipoInstrumento.defaultOptionsAct"
				seleccionado = "consultaUsoGlosaTipoInstrumento.registroSeleccionadoAct">
				</bcs-grid>
			</div>
		</div>
	</div>
	<!-- FIN GRILLA -->
	<div class="row bcs-panel-comandos">
		<bcs-button id="consultaUsoGlosaTipoInstrumento_eliminar" class="col-xs-1 pull-right" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-habilitado="consultaUsoGlosaTipoInstrumento.HabilitaBaja" bcs-texto="'UI_BAJAR' | translate" bcs-clic="consultaUsoGlosaTipoInstrumento.cambiar('BAJA')"></bcs-button>
		<bcs-button id="consultaUsoGlosaTipoInstrumento_guardar" class="col-xs-1 pull-right" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-habilitado="consultaUsoGlosaTipoInstrumento.HabilitaSube" bcs-texto="'UI_SUBIR' | translate" bcs-clic="consultaUsoGlosaTipoInstrumento.cambiar('SUBE')"></bcs-button>
	</div>
</div>

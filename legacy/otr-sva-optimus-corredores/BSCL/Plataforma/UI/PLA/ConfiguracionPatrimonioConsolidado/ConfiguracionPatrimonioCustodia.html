<div id="configuracionPatrimonioCustodia" ng-controller='ConfiguracionPatrimonioCustodiaCtrl as configuracionPatrimonioCustodia'>
	<!-- INICIO GRILLA -->
	<div class="row">
		<bcs-grid
			id="configuracion-patrimonio-custodia"
			api = "configuracionPatrimonioCustodia.apiGrid"
			seleccionado = "configuracionPatrimonioCustodia.registroSeleccionado"
			configuracion="configuracionPatrimonioCustodia.defaultOptions">
		</bcs-grid>
	</div>
	<!-- FIN GRILLA -->
	<div class="row bcs-panel-comandos">
		<bcs-button id="configuracionPatrimonioCustodia_guardar" class="col-xs-3" bcs-habilitado="configuracionPatrimonioCustodia.datosPorGuardar" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="configuracionPatrimonioCustodia.guardar()"></bcs-button>
	</div>
</div>

<div id="configuracionPatrimonioCaja" ng-controller='ConfiguracionPatrimonioCajaCtrl as configuracionPatrimonioCaja'>
	<!-- INICIO GRILLA -->
	<div class="row">
		<bcs-grid
			id="configuracion-patrimonio-caja"
			api = "configuracionPatrimonioCaja.apiGrid"
			seleccionado = "configuracionPatrimonioCaja.registroSeleccionado"
			configuracion="configuracionPatrimonioCaja.defaultOptions">
		</bcs-grid>
	</div>
	<!-- FIN GRILLA -->
	<div class="row bcs-panel-comandos">
		<bcs-button id="configuracionPatrimonioCaja_guardar" class="col-xs-3" bcs-habilitado="configuracionPatrimonioCaja.datosPorGuardar" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="configuracionPatrimonioCaja.guardar()"></bcs-button>
	</div>
</div>

<div ng-controller='FormatoArchivoCtrl'>
	<div>
		<bcs-grid id="grid-tipo-documentos" configuracion="data.FormatoArchivo">
		</bcs-grid>
	</div>
	<div class="row">
		<div class="col-xs-12" ng-show="data.MostrarEjemplo">
			<label class="col-xs-3" translate>UI_EJEMPLO_LINEA</label>
			<bcs-input-texto class="col-xs-12" ng-model="data.EjemploLinea"
				bcs-requerido="false" k-ng-disabled="true">
			</bcs-input-texto>
			<bcs-button ng-show="data.MostrarEjemploDescarga" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_EJEMPLO_LINEA' | translate" bcs-habilitado="'true'" bcs-clic="downloadCSV()"></bcs-button>
		</div>
	</div>
</div>

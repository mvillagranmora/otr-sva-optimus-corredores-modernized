<div>
	<div class="row">
		<bcs-grid 
			configuracion="grid.gridPrefPago"
			fn-exportar-excel = "exportarExcel" 
			seleccionado="grid.prefPagoSeleccionado"  
			fn-doble-click="win.abrirPopUp(grid.prefPagoSeleccionado)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-8">
			<div class="row">
				<bcs-button class="col-xs-2" 
					id="FormPreferenciasPago_crear" 
					bcs-tipo="'bcs-button-primary'"  
					bcs-mostrar="'true'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CREAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="win.abrirPopUp()">
				</bcs-button>
				<bcs-button class="col-xs-2" 
					id="FormPreferenciasPago_editar" 
					bcs-tipo="'bcs-button-secondary'"  
					ng-show="(grid.prefPagoSeleccionado.IdTipoOperacion.length>0)" 
					bcs-mostrar="(grid.prefPagoSeleccionado.IdTipoOperacion.length>0)"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_EDITAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="win.editar(grid.prefPagoSeleccionado)">
				</bcs-button>
			</div>
		</div>
		<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
			<!--<li ng-click="">{{'UI_ADMINISTRAR_CONDICIONES_OPERATIVAS' | translate}}</li>-->
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

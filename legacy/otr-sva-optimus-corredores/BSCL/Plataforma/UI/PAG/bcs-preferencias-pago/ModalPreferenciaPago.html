<div id="Crear" class="col-xs-12" ng-controller="ModalPreferenciaPagoCtrl as mPrefPago">
	<div class="bcs-cuerpo">
		<form name="formModalPreferenciaPago" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
				<bcs-combobox-base class="col-xs-8"
					bcs-requerido
					tipo="'combobox-tipo-operacion'"
					filtros="mPrefPago.cmbbx.TipoOperacion.filtros"
					id-actual="mPrefPago.datosDespues.IdTipoOperacion"
					id-post-filtro="mPrefPago.datosAntes.IdTipoOperacion"
					todos="'N'"
					auto-cargar="true"
					activado="!mPrefPago.win.modoEdicion"
					seleccionado="mPrefPago.TipoOperacionObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_MONEDA</label>
				<bcs-combobox-base class="col-xs-8"
					bcs-requerido
					tipo="'combobox-moneda'"
					filtros="mPrefPago.cmbbx.Moneda.filtros"
					id-actual="mPrefPago.datosDespues.IdMoneda"
					id-post-filtro="mPrefPago.datosAntes.IdMoneda"
					todos="'N'"
					auto-cargar="true"
					activado="!mPrefPago.win.modoEdicion"
					seleccionado="mPrefPago.MonedaObj">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_MEDIO_DE_PAGO</label>
				<bcs-combobox-base class="col-xs-8"
					bcs-requerido
					tipo="'combobox-medio-pago'"
					filtros="mPrefPago.cmbbx.MedioPago.filtros"
					id-actual="mPrefPago.datosDespues.IdMedioDePago"
					id-post-filtro="mPrefPago.datosAntes.IdMedioDePago"
					todos="'N'"
					auto-cargar="true"
					activado="!mPrefPago.win.modoEdicion"
					seleccionado="mPrefPago.MedioPagoObj">
				</bcs-combobox-base>
			</div>  
			<div class="row">
		  		<label class="col-xs-4" translate>UI_USA_PERSONA_RELACIONADA</label>
				<bcs-input-checkbox 
					ng-model="mPrefPago.datosDespues.UsaPersonaRelacionada" 
					ng-disabled="false">
				</bcs-input-checkbox>
		  	</div>     					
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					bcs-requerido
					tipo="'combobox-estado-perfil-comercial'"
					filtros="mPrefPago.cmbbx.estado.filtros"
					id-actual="mPrefPago.datosDespues.IdEstado"
					id-post-filtro="mPrefPago.datosAntes.IdEstado"
					todos="'N'"
					seleccionado="mPrefPago.EstadoObj">
				</bcs-combobox-base>
			</div>
			<hr>
		</form>
		<div class="row bcs-panel-comandos">
			<div class="row">
				<bcs-button id="Crear_guardar" 
					class="col-xs-3" 
					bcs-tipo="'principal'"   
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_GUARDAR' | translate" 
					bcs-habilitado="formModalPreferenciaPago.$valid"
					bcs-clic="mPrefPago.win.guardar()">
				</bcs-button>
				<bcs-button id="Crear_cancelar" 
					class="col-xs-3" 
					bcs-tipo="''" 
					bcs-mostrar="mPrefPago.win.muestraCancelar" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CANCELAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="mPrefPago.win.cancelar()">
				</bcs-button>
			</div>
		</div>
	</div>
</div>

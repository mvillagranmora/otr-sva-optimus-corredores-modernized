<div class="row" ng-controller="AdministrarPreferenciasPagoCtrl as admPrefPag">
	<div class="row">
		<uib-tabset>
			<uib-tab id="AdmPrefPago_Recibe" heading="{{'UI_PAGAMOS'| translate}}" select="admPrefPag.fnTabPrefPagoRecibe()">
				<div ng-if="admPrefPag.clicPagoRecibe">
					<bcs-preferencias-pago
						recibe-paga-portafolio="'R'">
					</bcs-preferencias-pago>
				</div>
			</uib-tab>
			<uib-tab id="AdmPrefPago_Paga" heading="{{'UI_RECIBIMOS' | translate}}" select="admPrefPag.fnTabPrefPagoPaga()">
				<div ng-if="admPrefPag.clicPagoPaga">
					<bcs-preferencias-pago
						recibe-paga-portafolio="'P'">
					</bcs-preferencias-pago>
				</div>
			</uib-tab>
		</uib-tabset>
	</div>
</div>

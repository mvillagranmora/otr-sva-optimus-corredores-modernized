 <div class="row" ng-controller='ComentenosCtrl'> 
	<!--- INICIO FORMULARIO -->
	<form class="col-xs-12 form-horizontal">    

				<div class="col-xs-12"> 
					<div class="row" ></div>
					<label class="col-xs-2" translate>De   :  </label>  
					<label class="col-xs-3" translate> {{mail.Direccion}}</label> 
								
				</div>
				
				<div class="col-xs-12"> 
					<div class="row" ></div>
					<label class="col-xs-2" translate>Para :  </label>  
					<bcs-combobox-base class="col-xs-3"
						tipo="'combobox-rol'"
						seleccionado="conf.seleccionado"
						filtros = "conf.oRol.filtros"  
						activado="EnviarUsuariosRol.value1"
						todos ="'S'">
					</bcs-combobox-base>				
				</div>
				
				<div class="row" ></div>
				
				<div class="row" ></div>
				<div class="col-xs-12">     
				<label class="col-xs-3" translate>Mensaje  </label>  
					 
				</div>   
				<div class="row" ></div>
				<div class="col-xs-12">     
 					<bcs-input-texto 
						tipo-campo="'textarea'" class="col-xs-12" ng-model="data.texto"
						atributos="margin: 0px; height:100px;resize:none;">
					</bcs-input-texto>
				</div>   
				


		<div class="row" ></div>
		<div class="row" ></div>
		<div class="row bcs-panel-comandos">
		<div class = "col-xs-12">
			 <bcs-button bcs-habilitado="'true'" class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="'false'" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="enviarComentario()"></bcs-button>
 		</div>
		</div>
	</form>
	<!--- TERMINO FORMULARIO -->
</div>

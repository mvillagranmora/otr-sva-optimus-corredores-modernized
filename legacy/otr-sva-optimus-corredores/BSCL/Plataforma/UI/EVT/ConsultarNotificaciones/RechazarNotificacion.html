<div class="row" ng-controller='ConfirmarNotificacionCtrl'>
	<div class="row"> 
	
	
		<div class="col-xs-12">
			<div class="row" ></div>
			<label class="col-xs-6" translate>UI_NOTIFICACION_A_RECHAZAR</label> 
			<label class="col-xs-6" translate>{{notificacion.DescripcionConfiguracion}}</label> 
		
		</div>
		<div class="col-xs-12">
			<div class="row" ></div>
			<label class="col-xs-6" translate>UI_NOTIFICACION_ENVIADA_EL</label> 
			<label class="col-xs-6" translate>{{notif.fechaEnviado}}</label> 
		
		</div>
		 
		<div class="col-xs-12">
			<div class="row" ></div>
			<label class="col-xs-3" translate>UI_OBSERVACION</label>
		</div> 
		 
		<div class="col-xs-12">
			<div class="row" ></div>
			
		 	<bcs-input-texto 
		 					class="col-xs-12"
	               			tipo-campo="'textarea'"
	             			ng-model = "data.observacion"
	             			atributos="margin: 0px; height:150px;resize:none;"
	             			solo-mayusculas = "N">
	 	    </bcs-input-texto>
 	    </div>
 	   
  	    <div class=row></div>
		<hr>
 	    <div class="col-xs-12 alignButtonsToRight">
 	      <div class="row"></div>
 	    	 	<bcs-button bcs-habilitado="'true'" class="col-xs-3"  bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'" bcs-texto="'UI_RECHAZAR' | translate" bcs-clic="Rechazar()"></bcs-button>

 	    	</div>
 	</div>
	
	 
</div>

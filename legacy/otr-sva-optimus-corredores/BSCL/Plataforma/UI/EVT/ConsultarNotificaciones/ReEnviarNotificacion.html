 <div class="row" ng-controller='ReEnviarCtrl'> 
	<form name="myForm" class="col-xs-12 form-horizontal">    
 

				<div class="row" ></div>
				<div class="col-xs-12">  
 					<label class="col-xs-4" translate>UI_USAR_DESTINATARIO_DEFECTO</label>
 					<bcs-input-checkbox  class="col-xs-8" ng-model="AniadirCopias.value1" ></bcs-input-checkbox> 
					
					
				</div>
				<div class="row" ></div>
				<div class ="col-xs-12">
					<label class="col-xs-4" translate>UI_REENVIAR_A_MAIL</label>
					<bcs-input-texto type="email" name="correo" 
						class="col-xs-8" 
 						k-ng-model="conf.Correo" 
						ng-model="data.Correo"
						ng-disabled="AniadirCopias.value1"
						required
 						></bcs-input-texto>
				</div>

		<div class="row" ></div>
		<div class="row" ></div>
		<hr>
		<div class = "col-xs-12 alignButtonsToRight">
		 
		    <bcs-button bcs-habilitado="'true'" class="col-xs-3" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="'false'" bcs-texto="'UI_REENVIAR' | translate" bcs-clic="reEnviarNotificacion()"></bcs-button>
 		
		</div>
	</form>
	<!--- TERMINO FORMULARIO -->
</div>

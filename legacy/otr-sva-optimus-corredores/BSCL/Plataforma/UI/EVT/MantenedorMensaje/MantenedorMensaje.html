<div class="row" ng-controller='MantenedorMensajeCtrl'>
	<div class="row bcs_titulo">
		<div class="col-xs-12">
			
		</div>
	</div>
	<div class="row">  
		<label class="col-xs-4" translate>UI_MENSAJES</label>
    	</br>
		<bcs-grid id="gridConfiguracionesMensajes"
                  configuracion = "configuracionMensajes"
                  api = "gridApiConfMensajes"
                  seleccionado = "mmsj.mensajeSeleccionado"
                  > 
                  <!-- fn-doble-click = "verDetalle()" -->
    	</bcs-grid>
    	
    	</br> 
    	
   </div>

	
	<div class="row bcs-panel-comandos">

		<bcs-button id="MantenedorMensajes_agregar" class="col-xs-2"
			bcs-tipo="'default'" bcs-auto-desactivar="false"
			bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="true"
			bcs-clic="agregarConfMensaje()"></bcs-button>
		
		<bcs-button id="MantenedorMensajes_editar" class="col-xs-2"
			bcs-tipo="'default'" bcs-auto-desactivar="false"
			bcs-texto="'UI_EDITAR' | translate"
			bcs-habilitado="mmsj.mensajeSeleccionado"
			bcs-clic="actualizarConfMensaje(mmsj.mensajeSeleccionado)"></bcs-button>

	</div>	
</div>

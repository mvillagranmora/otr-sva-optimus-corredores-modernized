<div class="col-xs-12" ng-controller='ConsultarConfirmarRechazarNotificaciones'>
<div class="col-xs-12 bcs-cuerpo">
<div class="row" >
	 
	<div class="row">
		<div class="col-xs-10">
		</div>  
		<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="BuscarNotificaciones()"></bcs-button>
				</div>
		 </div>
	</div> 
	<div class="row"> 
		 <bcs-grid id="grid-notificacion"
		 	configuracion ="notificaciones"
			seleccionado = "conf.notificaciones"
			fn-doble-click = "verDetalle(conf.notificaciones)"
		  >
    	</bcs-grid> 
    
	</div>     
	<br>
 	<div class="row bcs-panel-comandos">
		<bcs-button id="Eventos_aprobar" class="col-xs-2" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_APROBAR' | translate" bcs-habilitado="conf.notificaciones" bcs-clic="aprobarNotificacion(conf.notificaciones)"></bcs-button>
		<bcs-button id="Eventos_rechazar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_RECHAZAR' | translate" bcs-habilitado="conf.notificaciones" bcs-clic="rechazarNotificacion(conf.notificaciones)" ></bcs-button>
		<bcs-button id="Eventos_detalle" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_DETALLE' | translate" bcs-habilitado="conf.notificaciones" bcs-clic="verDetalle(conf.notificaciones)" ></bcs-button>
	</div> 
	</div>
</div>

</div>

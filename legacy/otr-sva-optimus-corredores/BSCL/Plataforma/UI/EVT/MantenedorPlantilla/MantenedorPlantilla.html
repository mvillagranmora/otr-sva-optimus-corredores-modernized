	<!--- INICIO FORMULARIO -->

 			 		</br>

                  api = "gridApiPlantillas"

                  > 
				</bcs-grid>      
 		
			  
		</div> 
		    

		<div class="row bcs-panel-buttons">

 			<bcs-button  class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_REFRESCAR' | translate" bcs-clic="Refrescar()"></bcs-button>
 		
		</div>

	<!--- TERMINO FORMULARIO -->

<!DOCTYPE html>
<html>
 
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
</head>
<body>
  <div id="context"/>
  
 </body>
<script type="text/javascript">      

     function init(dataFromParent) {
        var x = (dataFromParent.replace(/ =\"\" /g,"=''"));
        x = x.replace(/\"/g,'');
  		document.getElementById("context").innerHTML = x;  
                               
         
    };      
     
</script>
</html>

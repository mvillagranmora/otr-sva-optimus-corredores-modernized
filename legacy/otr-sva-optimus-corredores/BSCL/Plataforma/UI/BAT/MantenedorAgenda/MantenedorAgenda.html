<div class="row" ng-controller='MantenedorAgendaCtrl as magenda'>
	<div class="row">
		<div class="col-xs-10">
			<div class ="row">  
				<label class="col-xs-2" translate>UI_TIPO_PROGRAMA</label>  
				<bcs-combobox-base class="col-xs-4"
					tipo="'combobox-tipo-procesos'"
					seleccionado="magenda.datos.seleccionadoTipoPrograma"
					id-actual = "magenda.datos.IdTipoPrograma"
					todos="'S'"
					item-post-filtro="'1'"    
					activado="true">
				</bcs-combobox-base> 
				<label class="col-xs-2" style="padding-left: 15px" translate>UI_ESTADO</label>  
				<bcs-combobox-base class="col-xs-4"
					tipo="'combobox-estado-programa'"
					seleccionado = "magenda.datos.seleccionadoEstadoPrograma"
					id-actual = "magenda.datos.IdEstadoPrograma"
					todos="'S'"
					item-post-filtro="'1'">
				</bcs-combobox-base>
            </div> 
            <div class="row">				
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
					<bcs-input-date class="col-xs-8" 
						k-ng-model="magenda.datos.FechaDesde" 
						ng-model="magenda.datos.FechaDesdeString"
						id-pais="$root.SesionIdPaisSistema">
					</bcs-input-date>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" style="padding-left: 15px" translate>UI_FECHA_HASTA</label>					
					<bcs-input-date class="col-xs-8" 
						k-ng-model="magenda.datos.FechaHasta" 
						ng-model="magenda.datos.FechaHastaString"
						id-pais="$root.SesionIdPaisSistema">
					</bcs-input-date>
				</div>
			</div>	
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button 
					class="col-xs-12" 
					bcs-tipo="'bcs-button-search'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="true"  
					bcs-clic="magenda.win.buscar()">
				</bcs-button>
			</div>
			<div class="row">
				<bcs-button 
					class="col-xs-12" 
					bcs-tipo="'bcs-button-secondary'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_LIMPIAR' | translate" 
					bcs-habilitado="true"  
					bcs-clic="magenda.win.limpiar()">
				</bcs-button>
			</div>
		 </div>
	</div>
	<div class="row">
		<label class="row" translate>UI_PROGRAMAS</label>  
		<div class="row"> 
			 <bcs-grid id="grid-agendaJob"
			 	configuracion ="magenda.grid.agenda"
				seleccionado = "magenda.datos.seleccionadoAgenda">
	    	</bcs-grid> 
		
		</div>
	</div>

</div>

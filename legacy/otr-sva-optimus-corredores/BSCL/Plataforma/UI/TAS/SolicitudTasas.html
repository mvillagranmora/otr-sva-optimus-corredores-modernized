<div id="SolicitudTasas" class="row" ng-controller="SolicitudTasasCtrl as sTas">
	<!-- INICIO FILTROS -->
	<div class="row">
		<form name="ModalMantenedorMesas" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_SOLICITUD</label>
				<bcs-input-date class="col-xs-6" k-ng-model="sTas.filtro.Fecha"></bcs-input-date>
		  	</div>
		  	<hr>
			<div class="row">
				<label class="col-xs-4" translate>UI_FUENTES</label>
			</div>
			
			<hr>
			<div class="row">
				<div class="box-col">
		         <div kendo-tree-view="tree" k-options="options">
		         </div>
		   		</div>
			</div>
		    <hr>
		    
		    <div class="row bcs-panel-comandos">
				<div class="col-xs-12">
					<bcs-button id="SolicitudTasas_generarArchivo" class="col-xs-4 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
						bcs-texto="'UI_GENERAR_ARCHIVO' | translate" bcs-habilitado="ModalMantenedorMesas.$valid" bcs-clic="sTas.fn.generarArchivo()">
					</bcs-button>
				</div> 
			</div>
		</form>
	</div>	
</div>

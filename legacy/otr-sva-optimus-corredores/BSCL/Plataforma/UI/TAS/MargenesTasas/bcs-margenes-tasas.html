<div>
	<div class="col-xs-12">
		<br>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_MONEDA</label>
				<bcs-combobox-base class="col-xs-7"
					tipo="'combobox-tipo-reajuste'"
					id-actual="filtro.IdTipoReajuste"
					id-defecto="'0'"
					filtros="cmbbx.Moneda.filtros"
					todos="'S'"
					configuracion="cmbbx.Moneda.configuracion"
					seleccionado="datoFiltro.MonedaObj">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-2">
				<bcs-button id="MargenesTasas_buscar" class="col-xs-12" bcs-tipo="''" bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'" bcs-clic="fn.buscar()">
				</bcs-button>
			</div>
		</div>
		<br>
		
		<div class="row">
			<bcs-grid 
				configuracion="grilla.MargenesTasas" 
				seleccionado="grilla.margenTasaSel"
				fn-doble-click="win.modificar(grilla.margenTasaSel)"
				fn-exportar-excel="exportarExcel">
			</bcs-grid>
		</div>
		
		<div class="row bcs-panel-comandos">
			<div class="col-xs-9">
				<bcs-button id="MargenesTasas_agregar" class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="false" 
					bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'" bcs-clic="win.agregar()">
				</bcs-button>
				<bcs-button id="MargenesTasas_modificar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" 
					bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="grilla.margenTasaSel !== undefined && grilla.margenTasaSel.IdEstado === 'ACT'" bcs-clic="win.modificar(grilla.margenTasaSel)">
				</bcs-button>
				<!--
				<bcs-button id="MargenesTasas_eliminar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" 
					bcs-texto="'UI_ELIMINAR' | translate" bcs-habilitado="grilla.margenTasaSel !== undefined && grilla.margenTasaSel.IdEstado === 'ACT'" bcs-clic="win.eliminar(grilla.margenTasaSel)">
				</bcs-button>
				-->
			</div>
			<div class="col-xs-2"></div>
			<!--
			<bcs-menu class="col-xs-2" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
				<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
			-->
		</div>
	</div>
</div>

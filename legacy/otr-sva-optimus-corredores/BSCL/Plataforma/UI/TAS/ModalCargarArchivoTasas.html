<div id="ModalCargarArchivoTasas" class="row" ng-controller="ModalCargarArchivoTasasCtrl as mCAT">
	<div class="row">
		<!--
		<input type="file" id="file" file-reader="data.fileContent" file-name="data.fileName" style="display:none"/>
		<bcs-button id="ModalCargarArchivoTasas_seleccionarArchivo" bcs-tipo="''" bcs-auto-desactivar="false" 
			bcs-texto="'UI_SELECCIONAR_ARCHIVO' | translate" bcs-habilitado="'true'" bcs-clic="mCAT.fn.seleccionarArchivo()">
		</bcs-button>
		-->
		
		<input type="file" file-reader-tasas="data.fileContent" file-name="data.fileName" file-type="data.fileType" accept=".csv, .txt, .xml" style="display:inline; width:100%"/>
		<bcs-input-texto ng-show="false"
			tipo-campo="'textarea'"
			atributos="height:300px; resize:none; width:100%"
			ng-model="data.fileContent">
		</bcs-input-texto>
	</div>
	
	<div class="row bcs-panel-comandos" style="padding-top: 5px !important;">
		<bcs-button id="ModalCargarArchivoTasas_cargarArchivo" class="col-xs-4 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CARGAR_ARCHIVO' | translate" bcs-habilitado="data.fileContent !== undefined" bcs-clic="mCAT.fn.cargarArchivo()">
		</bcs-button>
		<bcs-button id="ModalCargarArchivoTasas_cerrar" class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CERRAR' | translate" bcs-habilitado="'true'" bcs-clic="mCAT.fn.cerrar()">
		</bcs-button>
	</div>
</div>

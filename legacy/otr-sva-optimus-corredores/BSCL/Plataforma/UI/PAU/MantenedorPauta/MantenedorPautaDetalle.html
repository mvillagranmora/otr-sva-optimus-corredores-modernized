<div class="row" ng-controller='MantenedorPautaDetalleCtrl as mpautadet'>
	<br>
	<div class="row">
		<label class="col-xs-2" translate>UI_TIPO_PROGRAMA</label>  
		<label class="col-xs-3">: {{mpautadet.grid.controlPauta.dataSource.data()[0].IdTipoPrograma}}</label>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_DESCRIPCION</label>  
		<label class="col-xs-4">: {{mpautadet.grid.controlPauta.dataSource.data()[0].Descripcion}}</label>
	</div>
	<div class="row">
		<label class="col-xs-2" translate>UI_ID_PROGRAMA</label>  
		<label class="col-xs-3" >: {{mpautadet.grid.controlPauta.dataSource.data()[0].IdPrograma}}</label>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_ESTADO_PROGRAMA</label>  
		<label class="col-xs-4" >: {{mpautadet.grid.controlPauta.dataSource.data()[0].NombreEstadoPrograma}}</label>
	</div>
	<div class="row">
		<label class="col-xs-2" translate>UI_FECHA_EJECUCION</label>  
		<label class="col-xs-3" >: {{mpautadet.datos.FechaEjecucionPrograma}}</label>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_PROGRAMA_REPROCESADO</label>  
		<label class="col-xs-3" >: {{mpautadet.grid.controlPauta.dataSource.data()[0].IdProgramaReprocesado}}</label>
	</div>
	<div class="row" style="min-height:30px">
		<label class="col-xs-2" translate>UI_RESULTADO_PROGRAMA</label>  
		<label class="col-xs-10" >: {{mpautadet.grid.controlPauta.dataSource.data()[0].ResultadoPrograma}}</label>
	</div>
	<br>
	<div class="row">
		<div class="row">
			<label class="col-xs-10" translate>UI_CONTROL_PROCESO</label>  
			<bcs-button 
				class="col-xs-2" 
				bcs-tipo="'bcs-button-primary'"  
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTUALIZAR' | translate" 
				bcs-habilitado="true"  
				bcs-clic="mpautadet.win.actualizar()">
			</bcs-button>
		</div>  
		<div class="row"> 
			 <bcs-grid id="grid-controlProcesoAgenda"
			 	configuracion ="mpautadet.grid.controlPauta"
				seleccionado = "mpautadet.datos.seleccionadoControlProceso">
	    	</bcs-grid> 
		</div>
	</div>
</div>

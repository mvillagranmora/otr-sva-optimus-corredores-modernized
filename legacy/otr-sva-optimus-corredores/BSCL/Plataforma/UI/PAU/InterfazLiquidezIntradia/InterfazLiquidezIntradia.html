<div ng-controller="InterfazLiquidezIntradiaCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<div class="row align_center" style="display: flex; align-items: center;">
			<label class="col-xs-2" translate>UI_FECHA_PROCESO</label>
			<bcs-input-date class="col-xs-5" k-ng-model="data.kngFechaSistema" ng-model="data.fechaMovimiento">
			</bcs-input-date>
			<div class="alignButtonsToRight col-xs-5">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'true'"
					bcs-texto="'UI_EJECUTAR_MANUAL' | translate" bcs-habilitado="data.procesarDisabled"
					bcs-clic="data.procesar()"></bcs-button>
			</div>
		</div>
		<div class="row align_center" style="display: flex; align-items: center;">
			<label class="col-xs-2" translate>UI_ENVIAR_ARCHIVO_A_CASILLA</label>
			<bcs-input-checkbox class="col-xs-3" ng-model="data.EnviarArchivoACasilla"></bcs-input-checkbox>
		</div>
	</div>
</div>

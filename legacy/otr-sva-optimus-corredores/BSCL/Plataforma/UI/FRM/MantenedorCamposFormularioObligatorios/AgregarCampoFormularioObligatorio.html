<div class="col-xs-12" ng-controller="AgregarCampoFormularioObligatorioCtrl as agregarCampoFormularioObligatorio">
	<form name="AgregarCampoFormulario" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_FORMULARIO</label>
					<bcs-combobox-base class="col-xs-8"
		  				tipo="'combobox-formulario'"
		  				id-actual="agregarCampoFormularioObligatorio.datos.CodigoFormulario"
		  				bcs-requerido
		  				id-defecto="'0'">
		  			</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CAMPO</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-campo'"
			  			id-actual="agregarCampoFormularioObligatorio.datos.CodigoCampo"
			  			seleccionado="agregarCampoFormularioObligatorio.datos.Campo"
			  			bcs-requerido
			  			id-defecto="'0'">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CANAL</label>
					<bcs-combobox-base class="col-xs-8"
			  			tipo="'combobox-tipo-canal-ingreso'"
			  			id-actual="agregarCampoFormularioObligatorio.datos.IdTipoCanal"
			  			filtros="agregarCampoFormularioObligatorio.formData.filtrosCanal"
			  			todos="'S'"
			  			bcs-requerido
			  			id-defecto="'0'">
		  			</bcs-combobox-base>
				</div>
				<div class="row" ng-show="agregarCampoFormularioObligatorio.datos.Campo.TipoDato === 'GRID'">
					<label class="col-xs-4" translate>UI_CANTIDAD_MINIMA</label>
					<bcs-input-numero class="col-xs-8"
			  			id="UI_NUMERO_CUOTAS"
						decimales = "'0'"
						bcs-requerido="agregarCampoFormularioObligatorio.datos.Campo.TipoDato === 'GRID'"
						k-ng-model="agregarCampoFormularioObligatorio.datos.CantidadMinima">
					</bcs-input-numero>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_REQUERIDO</label>
					<bcs-input-checkbox 
	  					ng-model="agregarCampoFormularioObligatorio.datos.Requerido">
	  				</bcs-input-checkbox>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right"
				bcs-texto="'UI_CREAR' | translate" 
				bcs-habilitado="AgregarCampoFormulario.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="true"
				bcs-clic="agregarCampoFormularioObligatorio.crearCampoFormulario()">
			</bcs-button>
		</div>
	</div>
</div>

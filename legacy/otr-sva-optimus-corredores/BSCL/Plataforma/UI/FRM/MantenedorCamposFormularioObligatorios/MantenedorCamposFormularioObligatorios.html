<div class="row" ng-controller="MantenedorCamposFormularioObligatoriosCtrl as mantenedorCamposFormularioObligatorios">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<label class="col-xs-2" translate>UI_FORMULARIO</label> 
		  		<bcs-combobox-base class="col-xs-2"
		  			tipo="'combobox-formulario'"
		  			id-actual="mantenedorCamposFormularioObligatorios.filtros.CodigoFormulario"
		  			todos="'S'" 
		  			id-defecto="'0'">
		  		</bcs-combobox-base>
				<label class="col-xs-1 col-xs-offset-1" translate>UI_CAMPO</label>
				<bcs-combobox-base class="col-xs-2"
		  			tipo="'combobox-campo'"
		  			id-actual="mantenedorCamposFormularioObligatorios.filtros.CodigoCampo"
		  			todos="'S'" 
		  			id-defecto="'0'">
		  		</bcs-combobox-base>
				<label class="col-xs-1 col-xs-offset-1" translate>UI_CANAL</label>
				<bcs-combobox-base class="col-xs-2"
		  			tipo="'combobox-tipo-canal-ingreso'"
		  			id-actual="mantenedorCamposFormularioObligatorios.filtros.IdTipoCanal"
		  			filtros="mantenedorCamposFormularioObligatorios.formData.filtrosCanal"
		  			todos="'S'" 
		  			id-defecto="'0'">
		  		</bcs-combobox-base>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="mantenedorCamposFormularioObligatorios.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="mantenedorCamposFormularioObligatorios.limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-campos-formulario"
			 	configuracion="mantenedorCamposFormularioObligatorios.configuracionGrilla"
				seleccionado="mantenedorCamposFormularioObligatorios.datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_EDITAR' | translate" bcs-habilitado="mantenedorCamposFormularioObligatorios.datos.kNgModel"
				bcs-clic="mantenedorCamposFormularioObligatorios.editar(mantenedorCamposFormularioObligatorios.datos.kNgModel)"> </bcs-button>
		</div>
		<div class="col-xs-1"></div>
	</div>
</div>

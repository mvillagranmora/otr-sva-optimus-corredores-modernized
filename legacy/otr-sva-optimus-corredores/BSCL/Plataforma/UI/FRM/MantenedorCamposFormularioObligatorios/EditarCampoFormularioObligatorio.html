<div class="col-xs-12" ng-controller="EditarCampoFormularioObligatorioCtrl as editarCampoFormularioObligatorio">
	<form name="EditarCampoFormulario" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_FORMULARIO</label>
					<bcs-input-texto class="col-xs-8"
						k-ng-disabled="'true'"
						ng-model="editarCampoFormularioObligatorio.datosAntes.NombreFormulario">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CAMPO</label>
					<bcs-input-texto class="col-xs-8"
						k-ng-disabled="'true'"
						ng-model="editarCampoFormularioObligatorio.datosAntes.NombreCampo">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_CANAL</label>
					<bcs-input-texto class="col-xs-8"
						k-ng-disabled="'true'"
						ng-model="editarCampoFormularioObligatorio.datosAntes.NombreCanal">
			  		</bcs-input-texto>
				</div>
				<div class="row" ng-show="editarCampoFormularioObligatorio.mostrarValorPorDefecto">
					<label class="col-xs-4" translate>UI_VALOR_DEFECTO</label>
					<div ng-if="editarCampoFormularioObligatorio.datosAntes.TipoCampoFrontend === 'bcs-input-texto'">
					  	<bcs-input-texto ng-model="editarCampoFormularioObligatorio.datosDespues.ValorDefectoCampoFormulario" class="col-xs-6"></bcs-input-texto>	  			   	  	
					</div>
					<div ng-if="editarCampoFormularioObligatorio.datosAntes.TipoCampoFrontend === 'bcs-combobox-base'">
					  	<bcs-combobox-base class="col-xs-8"
							  id-actual = "editarCampoFormularioObligatorio.datosDespues.ValorDefectoCampoFormulario"
							  id-defecto = "editarCampoFormularioObligatorio.datosAntes.ValorDefectoCampoFormulario"
							  filtros = "editarCampoFormularioObligatorio.datosDespues.ConfiguracionFrontend.filtros"
							  tipo = "editarCampoFormularioObligatorio.datosDespues.ConfiguracionFrontend.tipo"
							  seleccionado="editarCampoFormularioObligatorio.datosDespues.ConfiguracionFrontend.seleccionado">
					  	</bcs-combobox-base>	   	  			   	  	
					</div>
					<div ng-if="editarCampoFormularioObligatorio.datosAntes.TipoCampoFrontend === 'bcs-input-date'">
						<bcs-input-date class="col-xs-8"
                              k-ng-model="editarCampoFormularioObligatorio.datosDespues.ValorDefectoCampoFormulario"
                              todo-dias="true">
	                	</bcs-input-date>	  			   	  	
					</div>
				</div>
				<div class="row" ng-show="editarCampoFormularioObligatorio.datosAntes.TipoDato === 'GRID'">
					<label class="col-xs-4" translate>UI_CANTIDAD_MINIMA</label>
					<bcs-input-numero class="col-xs-6"
			  			id="UI_NUMERO_CUOTAS"
						decimales = "'0'"
						bcs-requerido="editarCampoFormularioObligatorio.datosAntes.TipoDato === 'GRID'"
						k-ng-model="editarCampoFormularioObligatorio.datosDespues.CantidadMinima">
					</bcs-input-numero>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_REQUERIDO</label>
					<bcs-input-checkbox 
						ng-disabled="editarCampoFormularioObligatorio.datosAntes.AplicaRequerido === 'N'"
	  					ng-model="editarCampoFormularioObligatorio.datosDespues.RequeridoCheck">
	  				</bcs-input-checkbox>
				</div>
					<div class="row">
					<label class="col-xs-4" translate>UI_REGENERA_CONTRATOS</label>
					<bcs-input-checkbox 
	  					ng-model="editarCampoFormularioObligatorio.datosDespues.RegeneraContratos">
	  				</bcs-input-checkbox>
				</div>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-12>
			<bcs-button class="col-xs-2 pull-right"
				bcs-texto="'UI_EDITAR' | translate" 
				bcs-habilitado="EditarCampoFormulario.$valid"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="true"
				bcs-clic="editarCampoFormularioObligatorio.editarCampoFormulario()">
			</bcs-button>
		</div>
	</div>
</div>

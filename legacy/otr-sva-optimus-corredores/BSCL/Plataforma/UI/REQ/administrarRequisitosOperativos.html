<div id="AdministrarRequisitosOperativos" ng-controller="AdministrarRequisitosOperativosCtrl as aReqOp">
	<div class="col-xs-12">
		<div class="row">
		  	<bcs-grid 
				seleccionado="aReqOp.reqOpSeleccionado" 
				fn-exportar-excel = "exportarExcel" 
				configuracion="aReqOp.gridReqOp" 
				fn-doble-click="aReqOp.modificar(aReqOp.reqOpSeleccionado)">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-10">
			<!-- <bcs-button id="AdministrarRequisitosOperativos_agregar" class="col-xs-2" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" 
				bcs-habilitado="'true'" bcs-clic="aReqOp.agregar()">
			</bcs-button> -->
			<bcs-button id="AdministrarRequisitosOperativos_modificar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="aReqOp.reqOpSeleccionado" bcs-clic="aReqOp.modificar(aReqOp.reqOpSeleccionado)">
			</bcs-button>
		</div>
		<div class="row">
			<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
				<!--<li ng-click="">{{'UI_ADMINISTRAR_CONDICIONES_OPERATIVAS' | translate}}</li>-->
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>

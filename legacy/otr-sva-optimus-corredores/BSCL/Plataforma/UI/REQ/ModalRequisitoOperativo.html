<div id="ModalRequisitosOperativos" ng-controller="ModalRequisitosOperativosCtrl as mReqOp">
	<div class="row bcs-cuerpo">
		<form name="formRequisitosOperativos" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_CONDICION_OPERATIVA</label>
				<bcs-combobox-base class="col-xs-7"
					tipo="'combobox-condicion-operativa'" 
					id-actual="mReqOp.RequisitoOperativo.IdCondicionOperativa" 
					id-defecto="mReqOp.RequisitoOperativoOriginal.IdCondicionOperativa"
					todos="'N'" 
					activado="mReqOp.RequisitoOperativo.modoCrear"
					bcs-requerido
					seleccionado="mReqOp.CondicionOperativaObj">
				</bcs-combobox-base>
		  	</div>
		  	<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_ETAPA</label>
				<bcs-combobox-base class="col-xs-7"
					tipo="'combobox-tipo-etapa'" 
					id-actual="mReqOp.RequisitoOperativo.IdTipoEtapa" 
					id-defecto="mReqOp.RequisitoOperativoOriginal.IdTipoEtapa"
					todos="'N'" 
					activado="mReqOp.RequisitoOperativo.modoCrear"
					bcs-requerido
					seleccionado="mReqOp.TipoEtapaObj">
				</bcs-combobox-base>
		  	</div>
		  	<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_CANAL_INGRESO</label>
				<bcs-combobox-base class="col-xs-7"
					tipo="'combobox-tipo-canal-ingreso'" 
					id-actual="mReqOp.RequisitoOperativo.IdTipoCanalIngreso" 
					id-defecto="mReqOp.RequisitoOperativoOriginal.IdTipoCanalIngreso"
					todos="'S'" 
					activado="mReqOp.RequisitoOperativo.modoCrear"
					seleccionado="mReqOp.TipoCanalIngresoObj">
				</bcs-combobox-base>
		  	</div>
		  	<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_COMPORTAMIENTO</label>
				<bcs-combobox-base class="col-xs-7" 
					tipo="'combobox-tipo-comportamiento'"
					id-actual="mReqOp.RequisitoOperativo.IdTipoComportamiento" 
					id-defecto="mReqOp.RequisitoOperativoOriginal.IdTipoComportamiento" 
					todos="'N'" 
					activado="true" 
					bcs-requerido
					seleccionado="mReqOp.TipoComportamientoObj">
				</bcs-combobox-base>
		  	</div>
		  	
		  	<div class="row">
				<label class="col-xs-4" translate>UI_VALOR_ATRIBUTO_1</label>
				<bcs-input-texto class="col-xs-7" 
					ng-model="mReqOp.RequisitoOperativo.ValorAtributo1" 
					bcs-requerido="mReqOp.RequisitoOperativo.CampoRequerido1"
					k-ng-disabled="!mReqOp.RequisitoOperativo.CampoRequerido1">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_VALOR_ATRIBUTO_2</label>
				<bcs-input-texto class="col-xs-7" 
					ng-model="mReqOp.RequisitoOperativo.ValorAtributo2" 
					bcs-requerido="mReqOp.RequisitoOperativo.CampoRequerido2" 
					k-ng-disabled="!mReqOp.RequisitoOperativo.CampoRequerido2">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-7"
					tipo="'combobox-estado-condicion-operativa'" 
					id-actual="mReqOp.RequisitoOperativo.IdEstado" 
					id-defecto="mReqOp.RequisitoOperativoOriginal.IdEstado"
					todos="'N'" 
					activado="true"
					bcs-requerido 
					seleccionado="mReqOp.EstadoObj">
				</bcs-combobox-base>
		  	</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
			<bcs-button id={{mReqOp.IdBotonAceptar}} class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-habilitado="formRequisitosOperativos.$valid" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mReqOp.aceptar()">
			</bcs-button>
			<bcs-button id="ModalRequisitosOperativos_cancelar" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mReqOp.cancelar()">
			</bcs-button>
		</div>
	</div>
</div>

<!DOCTYPE html>
<html ng-app="ngBcsComponents">
<head>
<title>Cargando...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
</head>
<body>
  <form id ="FLOGIN" action="" METHOD="post"><input type="hidden" name="X-SESSION-TOKEN"  value=""></form>
  <!-- LIBS -->
  <script src="libs/json3.min.js"></script>
  <script src="libs/jquery/jquery.js"></script>
  <!-- Main App JS -->
  <script>
   		$(document).ready(function() {
   			var nurl="index.xsjs#/";
   			var pos=window.location.href.indexOf("#/");
   			if (pos>0) nurl+=window.location.href.substring(pos+2);   			
			$('#FLOGIN').attr('action', nurl);
			$('input[name="X-SESSION-TOKEN"]').val(sessionStorage.getItem('Token'));
			$('#FLOGIN').submit();
   		});
   </script>
  </body>
</html>

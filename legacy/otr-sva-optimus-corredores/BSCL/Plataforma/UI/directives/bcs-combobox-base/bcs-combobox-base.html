<span bcs-enters="''" >

	<i uib-tooltip="{{tooltipText()}}" tooltip-placement="auto right" tooltip-append-to-body="true" tooltip-class="tooltip-bloqueo" ng-show="mostrarAlerta()" class="fa fa-close red-font" aria-hidden="true" style="float:right;font-size:12px;margin-top:3px;margin-right:-12px" bcs-enters="''"></i>

	<a ng-if="usaLupa" tabindex="-1" href="#" ng-click="ext.fnLupa()" class="k-select k-icon k-i-search" bcs-enters="''">&nbsp;</a>

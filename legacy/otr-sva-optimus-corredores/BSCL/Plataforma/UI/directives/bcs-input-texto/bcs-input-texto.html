<input ng-show="!tipoCampo" class="k-textbox" ng-model="ngModel" maxlength="maxlength" ng-disabled="ngDisabled" ng-readonly="ngReadonly" placeholder="{{placeholder | translate}}" ng-blur="fnBlur()"  
bcs-uppercase="usaMayusculas" ng-focus="fnFocus()" ng-keyup="keyPress($event)"></input>
<textarea ng-show="tipoCampo==='textarea'" class="k-textbox" style="{{atributos}}" ng-model="ngModel" ng-disabled="ngDisabled" ng-readonly="ngReadonly" placeholder="{{placeholder | translate}}" 
bcs-uppercase="usaMayusculas" ng-keyup="keyPress($event)" ng-blur="fnBlur()" ></textarea>

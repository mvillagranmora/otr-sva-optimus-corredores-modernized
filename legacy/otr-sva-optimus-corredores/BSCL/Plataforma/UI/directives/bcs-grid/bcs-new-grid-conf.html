<div ng-controller="bcsGridNewConfCtrl">
    <div class="row bcs_titulo" translate>
        UI_INFORMACION
    </div>
    <div class="row bcs-cuerpo">
        <div kendo-grid="bcsgridConf" options="gridConfOptions"></div>
        <br/>

    </div>
    <div class="row bcs-panel-comandos">
        <bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="guardar()"></bcs-button>    
        <bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_APLICAR' | translate" bcs-clic="aplicar()"></bcs-button>
        <bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_RESTAURAR' | translate" bcs-clic="restaurar()"></bcs-button>
        
        <bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="guardarPredeterminado()">{{'UI_GUARDAR_PREDETERMINADO' | translate}}</li>
            <li ng-click="restaurarPredeterminado()">{{'UI_RESTAURAR_PREDETERMINADO' | translate}}</li>
        </bcs-menu>
        
    </div>
</div>

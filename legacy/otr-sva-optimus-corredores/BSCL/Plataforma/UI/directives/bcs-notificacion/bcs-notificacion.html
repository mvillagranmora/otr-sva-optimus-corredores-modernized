<div>
	<div class="row">
		
		
		<div class="col-xs-12">
			 
			<label class="col-xs-3"  style=" padding:10px;" translate>UI_NOTIFICACIONES  </label>  
							<div class="row"></div>
			
			<div id="notificacion_portafolio" class="row" style="overflow:auto; padding:10px;" >
				<div class="col-xs-6" >
 						<div ng-repeat="campo in campos track by $index">
							<div class="row">
								<label class="col-xs-5">{{campo.Descripcion|translate}}</label>
								<bcs-input-checkbox 
								 class="col-xs-3" 
								 style="padding-left:8px" 
								 ng-model="campo.valor"   
								 ng-disabled="!bcsHabilitado"></bcs-input-checkbox> 
							</div>
						</div>
				</div>
				<div class="row"></div>
				<div class="col-xs-6">
 						<label class="col-xs-5" translate>UI_SUSPENDER_TEMPORAL</label>
						<bcs-input-checkbox 
								 class="col-xs-3" 
								 style="padding-left:8px" 
								 ng-model="suspensionTemporal" 
								 ng-disabled="!bcsHabilitado"
						></bcs-input-checkbox>  
  				</div>
				<div class="row"></div>
				<div class="col-xs-6">
 						<label class="col-xs-5" translate>UI_FECHA_INICIO_SUSPENSION</label>
						<bcs-input-date class="col-xs-4" 
						k-ng-model="FechaDesdeSuspension" 
						style="padding-left:8px" 
						ng-model="FechaDesde"
						k-ng-disabled="!suspensionTemporal || !bcsHabilitado"
 						></bcs-input-date> 
				</div>
				<div class="row"></div>
				<div class="col-xs-6">
 						<label class="col-xs-5" translate>UI_FECHA_TERMINO_SUSPENSION</label>
						<bcs-input-date class="col-xs-4" 
						k-ng-model="FechaHastaSuspension" 
						style="padding-left:8px" 
						ng-model="FechaHasta"
						k-ng-disabled="!suspensionTemporal || !bcsHabilitado"
 						></bcs-input-date>
				</div>
				
			</div>
		</div>
		
		 
			 
		 
 		 
	
		<div class="row no-margin" style="padding-top: 0px;">
			<div class="row bcs-panel-comandos">
				<bcs-button class="col-xs-2 pull-right" id="BcsGridAtributos_editar_notificacion" bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false" bcs-texto="'Editar'"
					ng-if="!bcsHabilitado" bcs-habilitado="'true'"
					bcs-clic="clicEditar()"></bcs-button>
				<bcs-button class="col-xs-2 pull-right" id="BcsGridAtributos_modificar_notificacion" bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false" bcs-texto="'Guardar'"
					ng-if="bcsHabilitado" bcs-habilitado="'true'"
					bcs-clic="modificarDatos()"></bcs-button>
				<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
					bcs-auto-desactivar="false" bcs-texto="'Cancelar'"
					ng-if="bcsHabilitado" bcs-habilitado="'true'"
					bcs-clic="clicCancelar()"></bcs-button>
			</div>
		</div>
	</div>
	
</div>

<div id="BusquedaInstrumentos" ng-controller="BusquedaInstrumentosCtrl">
	<div class="row">
		<bcs-grid 
			id="grid-busqueda-instrumentos"
			fn-doble-click="seleccionarInstrumento()"
		 	configuracion = "gridConfigBusquedaInstrumentos"
			seleccionado = "seleccionado"
			api = "gridApi">
		</bcs-grid>
	</div>

 	
	<div class="row bcs-panel-comandos">
		<bcs-button id="BusquedaInstrumentos_seleccionarInstrumento"  class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_SELECCIONAR' | translate" 
			bcs-habilitado="'true'"  bcs-clic="seleccionarInstrumento()"></bcs-button>
		<span class="col-xs-5 pull-right" ng-show="advFlujo"><i class="  fa fa-exclamation-triangle" style="padding-right:7px;color:orange" ></i><label translate>UI_MOSTRANDO_INSTRUMENTOS_CON_FLUJO_POSITIVO</label></span>
			
	</div>
		
			
	
	
</div>

<div class=""  uib-dropdown>
      <button id="split-button" type="button" ng-click="funcionPrincipal()" class="" ng-class="{'bcsdropdownButtonNew': bcsTipo === 'bcs-new-dropdown', 'bcs-dropdown': !bcsTipo , 'bcsdropdownButtonNewForm': bcsTipo === 'bcs-new-dropdown-form',}">{{textoPrincipal | uppercase }}</button>
      <button type="button" class="" ng-class="{'bcs-dropdownSpan': bcsTipo === 'bcs-new-dropdown', 'bcs-dropdown-side': !bcsTipo , 'bcs-dropdownSpanForm': bcsTipo === 'bcs-new-dropdown-form'}" uib-dropdown-toggle>
        <span class="caret"></span>
      </button>
	<ul class="" ng-class="{'bcs-dropdownMenu': bcsTipo === 'bcs-new-dropdown', 'dropdown-menu': !bcsTipo}" uib-dropdown-menu role="menu">
		<li role="menuitem" ng-repeat="opcion in opciones" ng-class="{'bcs-dropdownMenuItem': bcsTipo === 'bcs-new-dropdown' || bcsTipo === 'bcs-new-dropdown-form' , '': !bcsTipo }">
			<a href="#" ng-click="opcion.funcion()">{{opcion.titulo | uppercase}}</a>
		</li>
    </ul>
    </div>

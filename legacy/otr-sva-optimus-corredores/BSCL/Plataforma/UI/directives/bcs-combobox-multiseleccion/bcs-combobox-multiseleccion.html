<span class="ms-sin-tags">
    <style>
        /* 1) Ocultar los TAGs (chips), pero solo en ESTA directiva */
        bcs-combobox-multiseleccion .ms-sin-tags .k-multiselect-wrap .k-button,
        bcs-combobox-multiseleccion .ms-sin-tags .k-multiselect-wrap .k-chip {
            display: none;
        }

        /* 2) Hacer que el input ocupe TODO el ancho del combo */
        bcs-combobox-multiseleccion .ms-sin-tags .k-multiselect-wrap {
            white-space: normal;
        }

        /* li que contiene el input */
        bcs-combobox-multiseleccion .ms-sin-tags .k-multiselect-wrap .k-input {
            width: 100% !important;
            float: none !important;
        }

        /* input real de Kendo */
        bcs-combobox-multiseleccion .ms-sin-tags .k-multiselect-wrap input {
            width: 100% !important;
            box-sizing: border-box;
            text-overflow: clip;   /* sin '...' */
            overflow: visible;
        }
    </style>

    <!-- MultiSelect Kendo -->
    <select kendo-multi-select
            k-options="msOptions"
            k-ng-model="ngModel"
            k-ng-disabled="!activado"
            kendo-widget="multiWidget"
            ng-blur="fnBlur()"
            style="text-transform:uppercase!important;display:inline-block">
    </select>
</span>

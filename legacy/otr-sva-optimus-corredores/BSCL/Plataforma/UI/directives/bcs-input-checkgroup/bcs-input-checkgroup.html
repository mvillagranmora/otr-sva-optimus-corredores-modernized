<div>
	<div class="checkgroup-content" ng-if="orientacion === 'H'">
		<label style="margin-right:10px" ng-repeat="(key, value) in etiquetas">
	    	<input ng-disabled="!activado"  type="checkbox" ng-model="valores[key]">  {{etiquetas[key] | translate}}
	    </label>
	</div>
	
	<div class="checkgroup-content" ng-if="orientacion === 'V'">
		<div class="row" ng-repeat="(key, value) in etiquetas">
			<label style="margin-right:10px" >
	    		<input ng-disabled="!activado"  type="checkbox" ng-model="valores[key]">  {{etiquetas[key] | translate}}
	    	</label>
	    </div>
	</div>
	<div class="checkgroup-content" ng-if="orientacion === 'HZ'">
		<div class="col-xs-6" ng-repeat="(key, value) in etiquetas">
			<label style="margin-right:10px" >
	    		<input ng-disabled="!activado"  type="checkbox" ng-model="valores[key]">  {{etiquetas[key] | translate}}
	    	</label>
	    </div>
	</div>
</div>

<div class="col-xs-12">
	<h5 translate>UI_SALDO_CUSTODIA</h5>
	<div class="row">
		<bcs-combobox-base 
			class="col-xs-10" 
			auto-cargar="'false'" 
			tipo="'combobox-socio-negocio'"
			cascada-a="filtrosPortafolio.IdCliente"
			seleccionado = 'clienteSeleccionado'
			cascada-valor="'IdCliente'"
		>
		</bcs-combobox-base>
		<bcs-combobox-base 
			class="col-xs-10" 
			auto-cargar="'false'" 
			seleccionado="portafolioSeleccionado"
			filtros="filtrosPortafolio" 
			item-post-filtro="'1'"
			tipo="'combobox-portafolio'">
		</bcs-combobox-base>
		<bcs-input-instrumentos class="col-xs-10" 
			datos-instrumento="instrumento">
		</bcs-input-instrumentos>
		<a href="#" ng-click="buscar(clienteSeleccionado,portafolioSeleccionado,instrumento)" class="k-select k-icon k-i-search">&nbsp;</a>
		<img style="width:5%" class="pull-right" ng-show="loading" src="images/ajax-loader.gif">
	</div>
	<div class="row">
		<table class="table">
			<thead>
				<tr>
					<th translate>UI_CANTIDAD</th>
					<th translate>UI_MONTO</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>{{cantidad |  kformat:'n':instrumento.IdMoneda:'cantidad'}}</td>
					<td>{{monto |  kformat:'c':instrumento.IdMoneda:'monto'}}</td>
				</tr>
			</tbody>
		</table>
	</div>	
</div>

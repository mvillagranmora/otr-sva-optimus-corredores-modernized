<div class="col-xs-12">
    <h5 id="InstrumentosHeader" translate>UI_INFORMACION_INSTRUMENTO</h5>
    <div class="row">
        <bcs-input-instrumentos 
            class="col-xs-10"
            consulta-precio     = "'S'"  
            datos-instrumento   = "instrumento"
            filtro-bolsa        = "'BCS'">
        </bcs-input-instrumentos>
    </div>
    <div class="row">
        <strong id="InstrumentosStrongText" class="col-xs-6" translate>UI_PUNTA_COMPRA</strong>
        <label class="col-xs-6">{{instrumento.PuntaCompra || 0.000 | kformat:'c':instrumento.IdMoneda:'precio'}}</label>
    </div>
    <div class="row">
        <strong id="InstrumentosStrongText" class="col-xs-6" translate>UI_PUNTA_VENTA</strong>
        <label class="col-xs-6">{{instrumento.PuntaVenta || 0.000 | kformat:'c':instrumento.IdMoneda:'precio'}}</label>
    </div>
    <div class="row">
        <strong id="InstrumentosStrongText" class="col-xs-6" translate>UI_PRECIO_APERTURA</strong>
        <label class="col-xs-6">{{instrumento.PrecioApertura || 0.000 | kformat:'c':instrumento.IdMoneda:'precio'}}</label>
    </div>
    <div class="row">
        <strong id="InstrumentosStrongText" class="col-xs-6" translate>UI_PRECIO_MERCADO</strong>
        <label class="col-xs-6">{{instrumento.PrecioCierre || 0.000 | kformat:'c':instrumento.IdMoneda:'precio'}}</label>
    </div>
    <div class="row">
        <strong id="InstrumentosStrongText" class="col-xs-6" translate>UI_VARIACION</strong>
        <label class="col-xs-6">{{instrumento.Variacion || 0 | kformat:'n'}}</label>
    </div>
    <div class="row">
        <small>{{instrumento.Fecha | kformat:'d'}}</small>
    </div>
    
</div>

<bcs-combobox-base 
    class="col-xs-7"
    tipo="tipo"
    working-net="workingNet"
    filtros="filtroTipoDocumentoIdentidad"
    id-actual="idTipoDocumentoInterno"
    id-defecto="idDefecto"
    usa-filtro-externo ="usaFiltroExterno"
	filtro-tipo-documento ="filtroTipoDocumento"
    activado="tipoDocumentoIdentidadActivado"
    bcs-requerido="requerido">
</bcs-combobox-base>
<bcs-input-texto  
    class="col-xs-5"
    k-ng-disabled = "(!documentoIdentidadActivado || deshabilitado)" 
    ng-model="documentoAsociado" 
    placeholder="placeholder"
    foco="focus"
    ng-blur="innerBlur()"
    maxlength="largoDocumento"
    bcs-requerido="requerido">
</bcs-input-texto>

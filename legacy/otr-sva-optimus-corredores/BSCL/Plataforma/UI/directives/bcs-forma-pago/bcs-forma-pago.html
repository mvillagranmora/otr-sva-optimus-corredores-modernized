<div>
	<div class="row">

	</div>

			<thead>
				<tr>
					<th width="30%" translate>UI_MEDIO_PAGO</th>

     			</tr>
			</thead>
			<tbody> 
				<tr ng-repeat="(keyItem, valItem) in matrizFormaPago">

				</tr>
			</tbody>

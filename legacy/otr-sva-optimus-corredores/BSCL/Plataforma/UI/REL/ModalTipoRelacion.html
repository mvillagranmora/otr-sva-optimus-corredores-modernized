<div id="ModalTipoRelacion" ng-controller="ModalTipoRelacionCtrl as modtr">
	<div class="row bcs-cuerpo"> 
		<form name="formTipoRelacion" class="col-xs-12 form-horizontal">
			<div class="row" ng-show="modtr.TipoRelacion.modoCrear">
				<label class="col-xs-5" translate>UI_NOMBRE_TIPO_RELACION</label>
				<div class="col-xs-6">
					<bcs-combobox-base class="col-xs-7"
						tipo="'combobox-codigo-tipo-relacion'" 
						id-actual="modtr.TipoRelacion.IdTipoRelacion" 
						id-defecto="modtr.TipoRelacion.IdTipoRelacionDefecto"
						todos="'N'" 
						activado="true"
						bcs-requerido
						seleccionado="modtr.TipoRelacion.IdTipoRelacionObj">
					</bcs-combobox-base>
					
				</div> 
			</div>
			
			<div class="row" ng-show="!modtr.TipoRelacion.modoCrear">
				<label class="col-xs-5" translate>UI_NOMBRE_TIPO_RELACION</label>
				<div class="col-xs-6">
					<label translate>{{modtr.TipoRelacion.NombreTipoRelacion}}</label>
				</div>
			</div>
			<div class="row">
		  		<label class="col-xs-5" translate>UI_PERSONA_NATURAL</label>
		  		<bcs-input-checkbox ng-model="modtr.TipoRelacion.EsPersonaNatural"></bcs-input-checkbox>
			</div>

				<bcs-input-checkbox ng-model="modtr.TipoRelacion.EsIndefinida"></bcs-input-checkbox>
			</div>
			<div class="row">
		  		<label class="col-xs-5" translate>UI_USA_PORCENTAJE_PARTICIPACION</label>
				<bcs-input-checkbox ng-model="modtr.TipoRelacion.UsaPorcentajeParticipacion"></bcs-input-checkbox>
			</div>
			<div class="row">
		  		<label class="col-xs-5" translate>UI_RETIRA_DOCUMENTOS</label>
				<bcs-input-checkbox ng-model="modtr.TipoRelacion.RetiraDocumentos"></bcs-input-checkbox>
			</div>
			<div class="row">
		  		<label class="col-xs-5" translate>UI_USA_FINALIDAD_RELACION</label>
				<bcs-input-checkbox ng-model="modtr.TipoRelacion.UsaFinalidadRelacion"></bcs-input-checkbox>
			</div>
			<div class="row">
		  		<label class="col-xs-5" translate>UI_USA_CONDICIONES_RELACION</label>
				<bcs-input-checkbox ng-model="modtr.TipoRelacion.UsaCondicionesRelacion"></bcs-input-checkbox>
			</div>
			<div class="row">
				<label class="col-xs-5" translate>UI_USA_FIRMA_DOCUMENTO_RELACION</label>

				<bcs-input-checkbox ng-model="modtr.TipoRelacion.UsaGradoVinculacionParental"></bcs-input-checkbox>
			</div>
			<div class="row">
		  		<label class="col-xs-5" translate>UI_ESTADO</label>
				<bcs-input-checkbox ng-model="modtr.TipoRelacion.IdEstado"></bcs-input-checkbox>

	<div class="row bcs-panel-comandos">
		<div class="col-xs-12">
			<bcs-button id={{modtr.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'principal'" bcs-habilitado="formTipoRelacion.$valid || !modtr.TipoRelacion.modoCrear" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="modtr.aceptar()">
			</bcs-button>
			<bcs-button id="ModalTipoRelacion_cancelar" class="col-xs-3" bcs-tipo="''" bcs-habilitado="'true'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="modtr.cancelar()">
			</bcs-button>
		</div>

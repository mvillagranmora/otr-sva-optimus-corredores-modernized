<div class="row" ng-controller="ModalAdministrarPlantillaLimitesCtrl as maPLim">
	<div class="row">
		<form name="ModalAdministrarPlantillaLimites" class="col-xs-12">
			<div class="row">
		  		<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-input-texto class="col-xs-8"
					bcs-requerido maxlength = "40"
					ng-model="maPLim.datosDespues.IdPlantillaLimite" 
					k-ng-disabled="maPLim.win.modoEditar || maPLim.datosAntes.IdPlantillaLimite">
				</bcs-input-texto>
			</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_DESCRIPCION</label>
				<bcs-input-texto 
					class="col-xs-8" 
					bcs-requerido maxlength = "100"
					ng-model="maPLim.datosDespues.DescripcionPlantillaLimite" 
					k-ng-disabled="false">
				</bcs-input-texto>
		  	</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_HABILITADO</label>
				<bcs-input-checkbox 
					ng-model="maPLim.datosDespues.IdEstado" 
					ng-disabled="false">
				</bcs-input-checkbox>
		  	</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_POR_DEFECTO</label>
				<bcs-input-checkbox 
					ng-model="maPLim.datosDespues.PorDefecto" 
					ng-disabled="maPLim.datosAntes.IdPlantillaLimite">
				</bcs-input-checkbox>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="ModalAdministrarPlantillaLimites.$valid" bcs-clic="maPLim.guardar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="maPLim.cancelar();">
		</bcs-button>
	</div>
</div>

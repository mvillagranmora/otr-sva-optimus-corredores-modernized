<div class="row" ng-controller="ModalAdministrarGrupoActivosDetalleCtrl as magad">
	<div class="row">
		<form name="ModalAgregarGrupoActivoDetalle" class="col-xs-12">
			<div class="row">
			  <label class="col-xs-4" translate>UI_INSTRUMENTOS</label>
			  <bcs-input-instrumentos class="col-xs-8"
			  buscar-instrumento="magad.datosDespues.instrumento" 
			  datos-instrumento="magad.datosDespues.instrumentoObj" 
			  bcs-requerido 
			  k-ng-disabled="(magad.parametros.mod!==undefined)">
			  </bcs-input-instrumentos>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-estado-grupo-activos'"
						filtros="magad.cmbbx.GrupoActivos.filtros"
						id-actual="magad.datosDespues.EstadoDetalle"
						id-defecto="magad.EstadoDetalle"
						id-post-filtro="magad.datosDespues.EstadoDetalleDef"
						todos="'N'"
						seleccionado="magad.dataModal.EstadoObj">
					</bcs-combobox-base>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAgregarGrupoActivoDetalle.$valid"  
			bcs-clic="magad.guardar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="magad.cancelar();">
		</bcs-button>
	</div>
</div>

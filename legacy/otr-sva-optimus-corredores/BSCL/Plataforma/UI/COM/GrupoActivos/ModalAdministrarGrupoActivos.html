<div class="row" ng-controller="ModalAdministrarGrupoActivosCtrl as modAdmGAct">
	<div class="row">
		<form name="ModalAdministrarGrupoActivos" class="col-xs-12">
			<div class="row">
		  		<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-input-texto class="col-xs-8" maxlength = "40"
					bcs-requerido
					ng-model="modAdmGAct.datosDespues.IdGrupoActivos" 
					k-ng-disabled="(win.modoLectura || modAdmGAct.datosAntes.IdGrupoActivos)">
				</bcs-input-texto>
			</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_DESCRIPCION</label>
				<bcs-input-texto 
					bcs-requerido
					class="col-xs-8"  maxlength = "100"
					ng-model="modAdmGAct.datosDespues.DescripcionGrupoActivos" 
					k-ng-disabled="win.modoLectura">
				</bcs-input-texto>
		  	</div>
		  	<div class="row">
				<label class="col-xs-4" translate>UI_TIPO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-tipo-grupo-activos'"
					id-actual="modAdmGAct.oConfiguracionTipoGrupoActivos.idActual"
					id-defecto="modAdmGAct.oConfiguracionTipoGrupoActivos.idDefecto"
					todos="'N'"
					filtros="modAdmGAct.oConfiguracionTipoGrupoActivos.filtros"
					seleccionado="modAdmGAct.dataGrupoActivos.TipoGrupoActivosObj"
					bcs-requerido>
				</bcs-combobox-base>
		  	</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_HABILITADO</label>
				<bcs-input-checkbox 
					ng-model="modAdmGAct.datosDespues.Habilitado" 
					ng-disabled="win.modoLectura">
				</bcs-input-checkbox>
		  	</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_POR_DEFECTO</label>
				<bcs-input-checkbox 
					ng-model="modAdmGAct.datosDespues.PorDefecto" 
					ng-disabled="win.modoLectura">
				</bcs-input-checkbox>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAdministrarGrupoActivos.$valid"  
			bcs-clic="modAdmGAct.guardar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modAdmGAct.cancelar();">
		</bcs-button>
	</div>
</div>

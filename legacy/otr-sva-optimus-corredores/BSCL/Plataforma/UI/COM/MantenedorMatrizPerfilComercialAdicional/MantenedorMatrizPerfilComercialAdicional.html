<div id="MantenedorMatrizPerfilComercialAdicional"class="col-xs-12" ng-controller="MantenedorMatrizPerfilComercialAdicionalCtrl as mmpca">
   

	<div class="row">
		<bcs-grid 
			configuracion="mmpca.grilla.oConfiguracionGrilla"
			seleccionado="mmpca.grilla.PerfilSeleccionado"
			fn-doble-click="mmpca.fnModificarPerfilComercialAdicional(mmpca.grilla.PerfilSeleccionado)"
		>
		</bcs-grid>
	</div>
	
	<div class="row bcs-panel-comandos">
		
		<bcs-button 
			class="col-xs-2 pull-right" 
			id="AgregarPerfilComercialAdicional" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_AGREGAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="mmpca.fnAgregarPerfilComercialAdicional()">
		</bcs-button>
	
		<bcs-button 
			class="col-xs-2 pull-right" 
			id="ModificarPerfilComercialAdicional" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_MODIFICAR' | translate"
			bcs-habilitado="mmpca.grilla.PerfilSeleccionado !== undefined" 
			bcs-clic="mmpca.fnModificarPerfilComercialAdicional(mmpca.grilla.PerfilSeleccionado)">
		</bcs-button>
		
		<bcs-button 
			class="col-xs-2 pull-right" 
			id="EliminarPortafolio" 
			bcs-tipo="'bcs-button-secondary'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ELIMINAR' | translate"
			bcs-clic="mmpca.fnEliminarPerfilComercialAdicional(mmpca.grilla.PerfilSeleccionado)"
			bcs-habilitado="mmpca.grilla.PerfilSeleccionado !== undefined">
		</bcs-button>
		
	</div>	

</div>

<div id="AgregarModificarConfiguracionPerfilComercialAdicional" ng-controller="AgregarModificarConfiguracionPerfilComercialAdicionalCtrl as amcpca">
	<div class="row bcs-cuerpo">
		<form name="formConfiguracionPerfilComercialAdicional" class="col-xs-12 form-horizontal">
            <div class="row">
                <label class="col-xs-3" translate>UI_CATEGORIA_INVERSIONISTA</label>
                <bcs-combobox-base
                    id                  ="formConfiguracionPerfilComercialAdicional_CategoriaInversionista"
                    class               ="col-xs-9"
                    tipo                ="'combobox-categoria-inversionista'"
					auto-cargar         ="true"
                    filtros             ="amcpca.oConfiguracionCategoriaInversionista.filtros"
                    id-actual           ="amcpca.ConfiguracionEnrolamiento.IdCategoriaInversionista"
                    id-post-filtro      ="amcpca.ConfiguracionEnrolamientoOriginal.IdCategoriaInversionista"
                    cascada-a			= "amcpca.oConfiguracionPerfilProductos.filtros.IdCategoriaInversionista"
                    cascada-valor		= "'IdCategoriaInversionista'"
                    bcs-requerido       = "true">
                </bcs-combobox-base>
            </div>
            <div class="row">
                <label class="col-xs-3" translate>UI_FORMA_COBRO</label>
                <bcs-combobox-base
                    id="formConfiguracionPerfilComercialAdicional_FormaCobro"
                    class="col-xs-9"
                    tipo="'combobox-forma-cobro'"
                    filtros="amcpca.oConfiguracionFormaCobro.filtros"
                    id-actual="amcpca.ConfiguracionEnrolamiento.IdFormaCobro"
                    id-post-filtro="amcpca.ConfiguracionEnrolamientoOriginal.IdFormaCobro"
                    bcs-requerido="true">
                </bcs-combobox-base>
            </div>
            <div class="row">
                <label class="col-xs-3" translate>UI_CODIGO_PORTAFOLIO</label>
                <bcs-combobox-base
                    id="formConfiguracionPerfilComercialAdicional_CodigoPortafolio"
                    class="col-xs-3"
                    tipo="'combobox-portafolio-defecto'"
                    filtros="amcpca.oConfiguracionCodigoPortafolio.filtros"
                    id-actual="amcpca.ConfiguracionEnrolamiento.CodigoPortafolio"
                    id-post-filtro="amcpca.ConfiguracionEnrolamientoOriginal.CodigoPortafolio"
                    activado="!amcpca.EsPortafolioAPV"
                    bcs-requerido="!amcpca.EsPortafolioAPV">
                </bcs-combobox-base>

                <label class="col-xs-2 col-xs-offset-1" translate>UI_PORTAFOLIOS_APV</label>
                <bcs-input-checkbox 
                    class="col-xs-3"
                    ng-model="amcpca.EsPortafolioAPV">
                </bcs-input-checkbox>
            </div>
            <div class="row">
                <label class="col-xs-3" translate>UI_MODELO_COMERCIAL</label>
                <bcs-combobox-base
                    id="formConfiguracionPerfilComercialAdicional_PerfilComercialbase"
                    class="col-xs-9"
                    tipo="'combobox-perfil-comercial'"
                    filtros="amcpca.oConfiguracionPerfilComercialBase.filtros"
                    id-actual="amcpca.ConfiguracionEnrolamiento.IdPerfilComercialBase"
                    id-post-filtro="amcpca.ConfiguracionEnrolamientoOriginal.IdPerfilComercialBase"
                    bcs-requerido="true">
                </bcs-combobox-base>
            </div>
            <div class="row">
                <label class="col-xs-3" translate>UI_PERFIL_COBROS</label>
                <bcs-combobox-base
                    id="formConfiguracionPerfilComercialAdicional_Perfilcobros"
                    class="col-xs-9"
                    tipo="'combobox-perfil-cobros'"
                    filtros="amcpca.oConfiguracionPerfilCobros.filtros"
                    id-actual="amcpca.ConfiguracionEnrolamiento.IdPerfilCobros"
                    id-post-filtro="amcpca.ConfiguracionEnrolamientoOriginal.IdPerfilCobros"
                    bcs-requerido="true">
                </bcs-combobox-base>
            </div>
            <div class="row">
                <label class="col-xs-3" translate>UI_PERFIL_PRODUCTOS</label>
                <bcs-combobox-base
                    id="formConfiguracionPerfilComercialAdicional_PerfilProductos"
                    class="col-xs-9"
                    tipo="'combobox-perfil-productos'"
                    filtros="amcpca.oConfiguracionPerfilProductos.filtros"
                    id-actual="amcpca.ConfiguracionEnrolamiento.IdPerfilProductos"
                    id-post-filtro="amcpca.ConfiguracionEnrolamientoOriginal.IdPerfilProductos"
                    bcs-requerido="true">
                </bcs-combobox-base>
            </div>
        </form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="ModalConfiguracionPerfilComercialAdicional_aceptar" class="col-xs-2 pull-right" bcs-habilitado="formConfiguracionPerfilComercialAdicional.$valid" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="amcpca.aceptar()"></bcs-button>
		<bcs-button id="ModalConfiguracionPerfilComercialAdicional_cancelar" class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="amcpca.cancelar()"></bcs-button>
	</div>
</div>

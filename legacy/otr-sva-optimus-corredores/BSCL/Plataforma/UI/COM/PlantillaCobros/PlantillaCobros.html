<div class="row" ng-controller="PlantillaCobrosCtrl as pCob">
	<div class="row" ng-show="pCob.datos.modoLectura">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-perfil-cobros'"
					id-actual="pCob.datos.IdPerfilCobros"
					id-defecto="pCob.datos.IdPerfilCobrosDef"
					filtros="pCob.cmbbx.plantillaCobros.filtros"
					todos="'N'"
					activado="true"
					seleccionado="pCob.datos.PlantillaCobrosObj">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
				<bcs-button  
					class="col-xs-2 pull-right" 
					bcs-tipo="'bcs-button-input-form'"  
					bcs-mostrar="true"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CARGAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="pCob.fn.buscar(pCob.datos.PlantillaCobrosObj.IdPerfilCobros);">
				</bcs-button>
			</div>
	  	</div>
	  	<hr style="margin: 10px 0px">
	</div>
	<div class="row">
		<bcs-plantilla-cobros
			id-ventana = "pCob.idVentana"
			id-plantilla="pCob.datos.IdPlantillaDirectiva"
			modo="'MP'"
			modo-lectura="pCob.datos.modoLectura"
			guardar-ok="pCob.datos.guardarOk">
		</bcs-plantilla-cobros>
	</div>
</div>

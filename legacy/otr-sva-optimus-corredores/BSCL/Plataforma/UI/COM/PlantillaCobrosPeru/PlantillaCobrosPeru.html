<div class="row" ng-controller="PlantillaCobrosPeruCtrl as pCob">
	<div class="row">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_PLANTILLA</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-perfil-cobros-peru'"
					item-post-filtro = "'1'"
					filtros="pCob.cmbbx.plantillaCobros.filtros"
					seleccionado="pCob.datos.PlantillaCobrosObj">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
				<bcs-button  
					class="col-xs-2" 
					bcs-mostrar="true"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CARGAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic=" pCob.datos.IdPlantillaDirectiva = pCob.datos.PlantillaCobrosObj.IdPerfilCobros">
				</bcs-button>
			</div>
	  	</div>
	  	<hr style="margin: 10px 0px">
	</div>
	<div class="row">
		<bcs-plantilla-cobros-peru
			id-ventana = "pCob.idVentana"
			id-plantilla="pCob.datos.IdPlantillaDirectiva"
			callback-crear-perfil="pCob.refrescarPerfiles()"
			modo="'MP'">
		</bcs-plantilla-cobros-peru>
	</div>
</div>

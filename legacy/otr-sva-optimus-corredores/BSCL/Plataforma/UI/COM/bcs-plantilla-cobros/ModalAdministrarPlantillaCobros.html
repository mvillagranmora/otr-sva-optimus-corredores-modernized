<div class="row" ng-controller="ModalAdministrarPlantillaCobrosCtrl as modAdmPcob">
	<div class="row">
		<form name="ModalAdministrarPlantillaCobros" class="col-xs-12">
			<div class="row">
		  		<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-input-texto class="col-xs-8"
					bcs-requerido maxlength = "40"
					ng-model="modAdmPcob.datosDespues.IdPerfilCobros" 
					k-ng-disabled="(win.modoLectura || modAdmPcob.datosAntes.IdPerfilCobros)">
				</bcs-input-texto>
			</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_DESCRIPCION</label>
				<bcs-input-texto 
					class="col-xs-8" 
					bcs-requerido maxlength = "100"
					ng-model="modAdmPcob.datosDespues.DescripcionPerfilCobros" 
					k-ng-disabled="win.modoLectura">
				</bcs-input-texto>
		  	</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_HABILITADO</label>
				<bcs-input-checkbox 
					ng-model="modAdmPcob.datosDespues.Habilitado" 
					ng-disabled="win.modoLectura">
				</bcs-input-checkbox>
		  	</div> 
			<div class="row">
		  		<label class="col-xs-4" translate>UI_POR_DEFECTO</label>
				<bcs-input-checkbox 
					ng-model="modAdmPcob.datosDespues.PorDefecto" 
					ng-disabled="win.modoLectura">
				</bcs-input-checkbox>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalAdministrarPlantillaCobros.$valid"  
			bcs-clic="modAdmPcob.guardar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modAdmPcob.cancelar();">
		</bcs-button>
	</div>
</div>

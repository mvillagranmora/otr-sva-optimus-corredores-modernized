<div ng-controller="ModalClientesAfectadosCtrl as modCliAf">
	<div class="row">
		<form class="col-xs-12">
			<div class="row">
				<bcs-grid
					configuracion="modCliAf.gridClientesAfectados"
					api="modCliAf.apiGridClientesAfectados">
				</bcs-grid>
			</div>
			<div class="row"></div>
			<div class="row">
				<label class="col-xs-12" translate>IU_PREGUNTA_CONTINUAR</label>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modCliAf.win.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-2" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modCliAf.win.cancelar();">
		</bcs-button>
	</div>
</div>

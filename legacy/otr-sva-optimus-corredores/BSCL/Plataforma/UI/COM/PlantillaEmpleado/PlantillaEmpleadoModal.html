<div class="" style="padding:10px 30px" ng-controller="PopUpNuevaLineaPlantillaEmpleadoCtrl">
	<div class="row bcs-cuerpo">
		<div class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-5" translate>UI_MONEDA</label>
					<bcs-combobox-base class="col-xs-7"
						tipo="conf.oConfiguracionMoneda.tipo"
						id-defecto="conf.oConfiguracionMoneda.idDefecto"
						todos="'N'"
						activado="true"
						seleccionado="conf.oConfiguracionMoneda.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-5" translate>UI_MONTO_MINIMO</label>
					<bcs-input-monetario simbolo="conf.oConfiguracionMoneda.seleccionado.Simbolo" class="col-xs-7"  ng-model="data.montoMinimo" k-ng-model="data.kngMontoMinimo"></bcs-input-monetario>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-5" translate>UI_MONTO_MAXIMO</label>
					<bcs-input-monetario simbolo="conf.oConfiguracionMoneda.seleccionado.Simbolo" class="col-xs-7"  ng-model="data.montoMaximo" k-ng-model="data.kngMontoMaximo"></bcs-input-monetario>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-5" translate>UI_DESCUENTO_COMISION</label>
					<bcs-input-porcentaje class="col-xs-7" k-ng-model="data.descuento"></bcs-input-porcentaje>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-5" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-7"
						tipo="conf.oConfiguracionEstado.tipo"
						id-defecto="conf.oConfiguracionEstado.idDefecto"
						todos="'N'"
						activado="true"
						seleccionado="conf.oConfiguracionEstado.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-2" bcs-tipo="'principal'"  bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="true"  bcs-clic="aceptar();"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="cancelar();"></bcs-button>
	</div>
</div>

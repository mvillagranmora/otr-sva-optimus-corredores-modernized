<div class="" ng-controller="ModalAdministrarPlantillaEmpleadosCtrl">
	<form name="ModalAdministrarPlantillaEmpleados" class="col-xs-12">
		<div class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-input-texto class="col-xs-8"
					bcs-requerido
					ng-model="datosCabecera.IdPerfilEmpleado"
					k-ng-disabled="datosCabecera.bloqueado"> </bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_DESCRIPCION</label>
				<bcs-input-texto class="col-xs-8"
					bcs-requerido
					ng-model="datosCabecera.DescripcionPerfilEmpleado"
					k-ng-disabled="false"> </bcs-input-texto>
			</div>
			<div class="row">
		  		<label class="col-xs-4" translate>UI_HABILITADO</label>
				<bcs-input-checkbox 
					ng-model="datosCabecera.Habilitado" 
					ng-disabled="false">
				</bcs-input-checkbox>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-3" bcs-tipo="'principal'"  bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalAdministrarPlantillaEmpleados.$valid"  bcs-clic="guardar();"></bcs-button>
		<bcs-button  class="col-xs-3" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true"  bcs-clic="cancelar();"></bcs-button>
	</div>
</div>

<div class="row" ng-controller="ModalAgregarValorProductoDetalleCtrl as mavpd">
	<div class="row">
		<form name="ModalAgregarValorProductoDetalle" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_PRODUCTO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-tipo-producto-plantilla-producto'"
						filtros = "mavpd.cmbbx.TipoProducto.filtros"
						id-actual="mavpd.respuesta.IdTipoProducto"
						id-post-filtro="mavpd.respuesta.IdTipoProductoDef"
						todos="'N'"
						activado="!(mavpd.parametros.lineaDetalle)"
						seleccionado="mavpd.dataModal.TipoProductoObj"
						cascada1-a="mavpd.cmbbx.TipoOperacion.filtros.IdTipoProducto"
						cascada1-valor="'IdTipoProducto'">
					</bcs-combobox-base>
				</div>
			</div>
			<hr>	
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-tipo-operacion'"
						filtros="mavpd.cmbbx.TipoOperacion.filtros"
						id-actual="mavpd.respuesta.IdTipoOperacion"
						id-post-filtro="mavpd.respuesta.IdTipoOperacionDef"
						todos="'S'"
						seleccionado="mavpd.dataModal.TipoOperacionObj">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CANAL</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-tipo-canal-ingreso'"
						filtros="mavpd.cmbbx.TipoCanalIngreso.filtros"
						id-actual="mavpd.respuesta.IdCanalIngreso"
						id-post-filtro="mavpd.respuesta.IdCanalIngresoDef"
						todos="'S'"
						seleccionado="mavpd.dataModal.TipoCanalIngresoObj">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_GRUPO_ACTIVOS</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-grupo-activos'"
						filtros="mavpd.cmbbx.GrupoActivos.filtros"
						id-actual="mavpd.respuesta.IdGrupoActivos"
						id-post-filtro="mavpd.respuesta.IdGrupoActivosDef"
						todos="'N'"
						seleccionado="mavpd.dataModal.GrupoActivosObj">
					</bcs-combobox-base>
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-estado-perfil-comercial'"
						filtros="mavpd.cmbbx.EstadoPerfilComercial.filtros"
						id-actual="mavpd.respuesta.EstadoDetalle"
						id-post-filtro="mavpd.respuesta.EstadoDetalleDef"
						todos="'N'"
						seleccionado="mavpd.dataModal.EstadoObj">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_PERMITE_RUTEO</label>
					<bcs-input-checkbox 
					ng-model="mavpd.respuesta.PermiteRuteo" 
					ng-disabled="mavpd.ProductoPermiteRuteo">
						</bcs-input-checkbox>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="ModalAgregarValorProductoDetalle.$valid"  
			bcs-clic="mavpd.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mavpd.cancelar();">
		</bcs-button>
	</div>
</div>

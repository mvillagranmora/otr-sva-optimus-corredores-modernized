<div class="row" ng-controller="PlantillaProductosCtrl as pProd">
	<div class="row" ng-show="pProd.datos.modoLectura">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-perfil-productos'"
					id-actual="pProd.datos.IdPerfilProductos"
					id-defecto="pProd.datos.IdPerfilProductosDef"
					filtros="pProd.cmbbx.plantillaProductos.filtros"
					todos="'N'"
					activado="true"
					seleccionado="pProd.datos.PlantillaProductosObj">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
				<bcs-button
					class="col-xs-2 pull-right" 
					bcs-tipo="'bcs-button-input-form'"  
					bcs-mostrar="true"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="pProd.fn.buscar(pProd.datos.PlantillaProductosObj.IdPerfilProductos);">
				</bcs-button>
			</div>
	  	</div>
	  	<hr style="margin: 10px 0px">
	</div>
	<div class="row">
		<bcs-plantilla-productos
			id-plantilla="pProd.datos.IdPlantillaDirectiva"
			modo="'MP'"
			modo-lectura="pProd.datos.modoLectura"
			guardar-ok="pProd.datos.guardarOk">
		</bcs-plantilla-productos>
	</div>
</div>

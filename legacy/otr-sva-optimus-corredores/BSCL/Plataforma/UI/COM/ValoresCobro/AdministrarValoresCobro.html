<div class="row" ng-controller="AdministrarValorCobroCtrl as mAdmVC">
	<div class="row">
		<form name="ModalAdministrarValorCobro" class="col-xs-12">
			<div class="row">
				<bcs-grid
					configuracion="mAdmVC.GrillaValoresCobros"
					seleccionado="mAdmVC.GrillaValoresCobrosSeleccionado" 
					api="mAdmVC.apiGrillaValoresCobros">
				</bcs-grid>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="ModalAdministrarValorCobro.$valid"  
			bcs-clic="mAdmVC.modalValor();">
		</bcs-button>
		<bcs-button class="col-xs-2 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_EDITAR' | translate" 
			bcs-habilitado="(mAdmVC.GrillaValoresCobrosSeleccionado)"  
			bcs-clic="mAdmVC.modalValor(mAdmVC.GrillaValoresCobrosSeleccionado);">
		</bcs-button>
	</div>
</div>

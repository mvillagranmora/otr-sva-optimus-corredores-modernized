<div class="row" ng-controller="AdministrarTipoOrigenFondoCtrl as admTOF">
	<div class="row">
		<form name="AdministrarTipoOrigenFondo" class="col-xs-12">
			<div class="row">
				<bcs-grid
					configuracion="admTOF.GrillaTipoOrigenFondo"
					seleccionado="admTOF.GrillaTipoOrigenFondoSeleccionado" 
					fn-exportar-excel = "exportarExcel">
				</bcs-grid>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_AGREGAR' | translate" 
			bcs-habilitado="AdministrarTipoOrigenFondo.$valid"  
			bcs-clic="admTOF.modalValor();">
		</bcs-button>
		<bcs-button class="col-xs-2" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_EDITAR' | translate" 
			bcs-habilitado="(admTOF.GrillaTipoOrigenFondoSeleccionado)"  
			bcs-clic="admTOF.modalValor(admTOF.GrillaTipoOrigenFondoSeleccionado);">
		</bcs-button>
		<bcs-menu class="col-xs-2 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

<div class="row" ng-controller="ModalTipoOrigenFondoCtrl as modTOF">
	<div class="row">
		<form name="ModalTipoOrigenFondo" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CODIGO</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						k-ng-disabled="modTOF.modoEditar"
						ng-model="modTOF.tipoOrigenFondo.IdTipoOrigenFondo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_NOMBRE</label>
					<bcs-input-texto class="col-xs-8"
						bcs-requerido
						ng-model="modTOF.tipoOrigenFondo.Nombre">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_VALOR_DEFECTO</label>
					<bcs-input-numero class="col-xs-8"
						k-ng-model="modTOF.tipoOrigenFondo.ValorDefecto"  
						decimales="2">
					</bcs-input-numero>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8"
						bcs-requerido
						tipo="'combobox-estado-perfil-comercial'"
						filtros="modTOF.cmbbx.EstadoPerfilComercial.filtros"
						id-actual="modTOF.tipoOrigenFondo.IdEstado"
						id-defecto="modTOF.tipoOrigenFondo.IdEstadoDef"
						todos="'N'"
						seleccionado="modTOF.tipoOrigenFondo.EstadoSeleccionado">
					</bcs-combobox-base>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="ModalTipoOrigenFondo.$valid"  
			bcs-clic="modTOF.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modTOF.cancelar();">
		</bcs-button>
	</div>
</div>

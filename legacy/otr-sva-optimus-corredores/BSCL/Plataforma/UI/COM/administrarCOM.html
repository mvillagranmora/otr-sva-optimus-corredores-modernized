<div id="PerfilCOM" ng-controller="AdministrarCOMCtrl">
	<div class="col-xs-12">
	  	<uib-tabset>
			<uib-tab id="AdmPla_PlantillaComercial" heading="{{'UI_MODELO_COMERCIAL'| translate}}" select="fnTabPlantillaComercial()">
				<div id="PanelPlantillaComercial" style="padding: 0px 0 10px 0;min-height:400px;" ></div>
			</uib-tab>
			<uib-tab id="AdmPla_PlantillaProductos" heading="{{'UI_PLANTILLA_PRODUCTOS' | translate}}" select="fnTabPlantillaProductos()">
				<div id="PanelPlantillaProductos" style="padding: 0px 0 10px 0;min-height:400px;"></div>
			</uib-tab>
			<uib-tab ng-if = "SesionLocale === 'CL'" id="AdmPla_PlantillaCobros" heading="{{'UI_PLANTILLA_COBROS' | translate}}" select="fnTabPlantillaCobros()">
				<div id="PanelPlantillaCobros" style="padding: 0px 0 10px 0;"></div>
			</uib-tab>
			<uib-tab ng-if = "SesionLocale === 'PE'" id="AdmPla_PlantillaCobrosPeru" heading="{{'UI_PLANTILLA_COBROS' | translate}}" select="fnTabPlantillaCobrosPeru()">
				<div id="PanelPlantillaCobrosPeru" style="padding: 0px 0 10px 0;"></div>
			</uib-tab>
		   	<uib-tab id="AdmPla_GrupoDeActivos" heading="{{'UI_GRUPO_ACTIVOS'| translate}}" select="fnTabGrupoActivos()">
		    	<div id="PanelGrupoActivos" style="padding: 0px 0 10px 0;min-height:400px;"></div>
		   	</uib-tab> 
		   	<uib-tab id="AdmPla_PlantillaLimites" heading="{{'UI_PLANTILLA_LIMITES'| translate}}" select="fnTabPlantillaLimites()">
		    	<div id="PanelPlantillaLimites" style="padding: 0px 0 10px 0;min-height:400px;"></div>
		   	</uib-tab>
		</uib-tabset>
	</div>
</div>

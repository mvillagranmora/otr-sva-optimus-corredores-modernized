<div class="row" ng-controller="ModalConvenioComisionCtrl as mconvc">
	<div class="row"> 
		<form name="ModalAgregarContratoComision" class="col-xs-12">
		
			<div class="row">
				<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-combobox-base 
					id = "UI_CLIENTE_PORTAFOLIO"
				 	class="col-xs-9"
				 	tipo="'combobox-cliente-portafolio'"
		            bcs-requerido
					id-actual = "mconvc.data.IdPortafolio"
					id-defecto = "mconvc.dataOriginal.IdPortafolio"
					seleccionado = "mconvc.data.portafolioSeleccionado">
				</bcs-combobox-base >
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_TIPO_CONTRATO</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-comercial-tipo-contrato'"
					id-actual = "mconvc.data.IdTipoContrato"
					id-defecto = "mconvc.dataOriginal.IdTipoContrato"
					todos = "'N'"
					activado = "false">
				</bcs-combobox-base>	
				<label class="col-xs-2 col-xs-offset-1" translate>UI_NOMBRE</label>
				<bcs-input-texto class="col-xs-3" ng-model="mconvc.data.Nombre" bcs-requerido></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_DESCRIPCION</label>
				<bcs-input-texto class="col-xs-9" ng-model="mconvc.data.Descripcion" ></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_CLASIFICACION</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-clasificacion-tipo-instrumento'"
					id-actual = "mconvc.data.IdClasificacionTipoInstrumento"
					id-defecto = "mconvc.dataOriginal.IdClasificacionTipoInstrumento"
					todos = "'N'">
				</bcs-combobox-base>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-3"
					bcs-requerido
					tipo = "mconvc.combobox.oConfiguracionEstado.tipo"
					configuracion	= "mconvc.combobox.oConfiguracionEstado.configuracion" 
					id-actual = "mconvc.data.IdEstado"
					id-post-filtro = "mconvc.data.IdEstadoDef"
					filtros = "mconvc.combobox.oConfiguracionEstado.filtros"
					seleccionado = "mconvc.combobox.oConfiguracionEstado.seleccionado">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="ModalAgregarContratoComision.$valid"  
			bcs-clic="mconvc.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mconvc.cancelar();">
		</bcs-button>
	</div>
</div>

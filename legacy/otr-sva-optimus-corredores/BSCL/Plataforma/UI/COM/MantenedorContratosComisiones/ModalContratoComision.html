<div class="row" ng-controller="ModalContratoComisionCtrl as mcc">
	<div class="row"> 
		<form name="ModalAgregarContratoComision" class="col-xs-12">
			<div class="row">
				<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-combobox-base 
					id = "UI_CLIENTE_PORTAFOLIO"
				 	class="col-xs-9"
				 	tipo="'combobox-cliente-portafolio-contrato'"
		            bcs-requerido
					id-actual = "mcc.data.IdPortafolio"
					id-defecto = "mcc.dataOriginal.IdPortafolio"
					seleccionado = "mcc.data.portafolioSeleccionado"
					cascada-a="mcc.combobox.oConfiguracionAreaCliente.filtros.Codigo"
					cascada-valor="'Codigo'">
				</bcs-combobox-base >
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_TIPO_CONTRATO</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-comercial-tipo-contrato'"
					id-actual = "mcc.data.IdTipoContrato"
					id-defecto = "mcc.dataOriginal.IdTipoContrato"
					todos = "'N'"
					activado = "false">
				</bcs-combobox-base>	
				<label class="col-xs-2 col-xs-offset-1" translate>UI_NOMBRE</label>
				<bcs-input-texto class="col-xs-3" ng-model="mcc.data.Nombre" bcs-requerido></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_DESCRIPCION</label>
				<bcs-input-texto class="col-xs-9" ng-model="mcc.data.Descripcion" ></bcs-input-texto>
			</div>
			<div class="row">
				<label class = "col-xs-2" translate>UI_SEGMENTO_CLIENTE</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-tipo-segmento'"
					id-actual = "mcc.data.IdSegmentoCliente"
					id-defecto = "mcc.dataOriginal.IdSegmentoCliente"
					todos="'N'"
					activado = "true">
				</bcs-combobox-base>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_FORMATO_CONTRATO_COBRO</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-comercial-formato-cobro'"
					id-actual = "mcc.data.IdFormatoCobro"
					id-defecto = "mcc.dataOriginal.IdFormatoCobro"
					todos = "'N'">
				</bcs-combobox-base>
			</div>		
			<div class="row">
				<label class="col-xs-2" translate>UI_CLASIFICACION</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-clasificacion-tipo-instrumento'"
					id-actual = "mcc.data.IdClasificacionTipoInstrumento"
					id-defecto = "mcc.dataOriginal.IdClasificacionTipoInstrumento"
					todos = "'N'">
				</bcs-combobox-base>
				
				<label class="col-xs-2 col-xs-offset-1" translate>UI_MONEDA</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "'combobox-moneda'"
					id-actual = "mcc.data.IdMoneda"
					id-defecto = "mcc.dataOriginal.IdMoneda"
					todos = "'N'">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_AREA_CLIENTE</label>
				<bcs-combobox-base class = "col-xs-3"
					bcs-requerido
					tipo = "mcc.combobox.oConfiguracionAreaCliente.tipo"
					id-actual = "mcc.combobox.oConfiguracionAreaCliente.idActual"
					id-defecto = "mcc.combobox.oConfiguracionAreaCliente.idDefecto"
					filtros = "mcc.combobox.oConfiguracionAreaCliente.filtros"
					item-post-filtro = "'1'"
					seleccionado ="mcc.combobox.oConfiguracionAreaCliente.seleccionado"
					todos = "'N'"
					activado = "false">
				</bcs-combobox-base>
				<label class="col-xs-2 col-xs-offset-1" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-3"
					bcs-requerido
					tipo = "mcc.combobox.oConfiguracionEstado.tipo"
					configuracion	= "mcc.combobox.oConfiguracionEstado.configuracion" 
					id-actual = "mcc.data.IdEstado"
					id-post-filtro = "mcc.data.IdEstadoDef"
					filtros = "mcc.combobox.oConfiguracionEstado.filtros"
					seleccionado = "mcc.combobox.oConfiguracionEstado.seleccionado">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="ModalAgregarContratoComision.$valid"  
			bcs-clic="mcc.aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-3" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mcc.cancelar();">
		</bcs-button>
	</div>
</div>

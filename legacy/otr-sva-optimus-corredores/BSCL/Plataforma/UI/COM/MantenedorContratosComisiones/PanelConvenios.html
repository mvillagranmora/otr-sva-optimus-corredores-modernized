<div id="PanelConvenios" class="row" ng-controller="PanelConveniosCtrl as panelConvenios">
	<div class="row bcs-cuerpo">
	   	<div class="row">
			<div class="col-xs-10">
				 <div class="row">
					<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label> 
			  		<bcs-combobox-base 					
					 	class="col-xs-8"
					 	tipo="'combobox-cliente-portafolio'"
						id-actual = "panelConvenios.filtros.IdPortafolio"
						id-defecto="'0'">
					</bcs-combobox-base >
			  	</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="panelConvenios.buscar()"></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="panelConvenios.limpiarFiltros()"></bcs-button>
				</div>
		  	</div>
		</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-convenios"
			 	configuracion="panelConvenios.configuracionGrillaConvenios"
				seleccionado="panelConvenios.datos.kNgModel"
				fn-exportar-excel = "exportarExcel">	
			</bcs-grid>		
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button 			
				class="col-xs-2" 
				bcs-tipo="'principal'"   
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_NUEVO' | translate" 
				bcs-habilitado="'true'"  
				bcs-clic="panelConvenios.crear();">
			</bcs-button>
			<bcs-button class="col-xs-2"
				bcs-tipo="''" 
				bcs-auto-desactivar="false"
				bcs-texto="'UI_EDITAR' | translate" 
				bcs-habilitado="panelConvenios.datos.kNgModel"
				bcs-clic="panelConvenios.editar(panelConvenios.datos.kNgModel);">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
	</div>
</div>

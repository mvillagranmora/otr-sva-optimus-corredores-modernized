<div class="row" ng-controller="IngresoCobroCtrl">
	<div class="row">
		<uib-tabset active="2">
			<uib-tab heading="{{'UI_DEFINICION_COBRO' | translate}}">
				<form name="formData.FormIngresoCobro">
					<div class="row">
						<div class="row">
							<label class="col-xs-2" translate>UI_CODIGO</label>
							<bcs-input-texto class="col-xs-3" bcs-requerido ng-model="definicion.Codigo" k-ng-disabled="editando"></bcs-input-texto>
							<label class="col-xs-2 col-xs-offset-1" translate>UI_NOMBRE</label>					
							<bcs-input-texto class="col-xs-3" bcs-requerido ng-model="definicion.Nombre"></bcs-input-texto>
						</div>
						
						<div class="row">
							<label class="col-xs-2" translate>UI_CLASE_COBRO</label>
							<bcs-combobox-base class="col-xs-3"
								bcs-requerido
								id-defecto= "defecto.IdClaseCobro"
								tipo="'combobox-clase-cobro'" 
								seleccionado = "definicion.claseCobroSeleccionado">
							</bcs-combobox-base>
							<label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO_COBRO</label>
							<bcs-combobox-base class="col-xs-3"
								bcs-requerido
								id-defecto = "defecto.IdTipoCobro"
								tipo="'combobox-tipo-cobro'" 
								seleccionado = "definicion.tipoCobroSeleccionado">
							</bcs-combobox-base>
						</div>
						<div class="row">
							<label class="col-xs-2" translate>UI_ESTADO</label>					
							<bcs-combobox-base class="col-xs-3"
								bcs-requerido
								id-defecto="defecto.IdEstadoCobro" 
								tipo="'combobox-estado-cobro'" 
								seleccionado = "definicion.estadoCobroSeleccionado">
							</bcs-combobox-base>
						</div>
						<hr/>
						<div class="row">
							<label class="col-xs-4">
								<bcs-input-checkbox class="col-xs-1" ng-model="definicion.EsCobroMonedaOperacion" ng-disabled="definicion.ComisionIndirecta"></bcs-input-checkbox>{{'UI_COBRO_EN_MONEDA_OPERACION' | translate}}
							</label>
							<label class="col-xs-2 col-xs-offset-2" translate>UI_COBRO_EN_OTRA_MONEDA</label>
							<bcs-combobox-base class="col-xs-4"
								bcs-requerido = "!definicion.EsCobroMonedaOperacion"
								id-defecto = "defecto.IdMonedaCobro"
								id-actual = "definicion.idMonedaCobroSeleccionada"
								activado = "!definicion.EsCobroMonedaOperacion"
								seleccionado = "definicion.monedaCobroSeleccionada" 
								tipo="'combobox-moneda'">
							</bcs-combobox-base>
						</div>
						<hr/>
						<div class="row">
							<label class="col-xs-2">	
								<bcs-input-checkbox class="col-xs-2" ng-disabled="'true'" ng-model="definicion.MontoFijoActivado"></bcs-input-checkbox>{{'UI_MONTO_FIJO' | translate}}
							</label>
							<bcs-input-numero class="col-xs-2"
								bcs-requerido = "!!definicion.MontoFijoActivado"
								k-ng-disabled="!definicion.MontoFijoActivado" 
								k-ng-model="definicion.MontoFijo"></bcs-input-numero>
							<label class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="!definicion.MontoFijoActivado" ng-model="definicion.MontoFijoMenorActivado"></bcs-input-checkbox>{{'UI_SI_MONTO_OPERACION_ES_MENOR_A' | translate}}
							</label>				
							<bcs-input-numero class="col-xs-2"
								bcs-requerido = "!!definicion.MontoFijoMenorActivado" 
								k-ng-disabled="!definicion.MontoFijoMenorActivado" 
								k-ng-model="definicion.MontoFijoOperacionMenor">
							</bcs-input-numero>
							<div class="col-xs-3">
								<label class="col-xs-6">
									<bcs-input-checkbox class="col-xs-3" ng-disabled="!definicion.MontoFijoMenorActivado" ng-model="definicion.MontoFijoSiNoActivado"></bcs-input-checkbox>{{'UI_SI_NO' | translate}}
								</label>				
								<bcs-input-numero class="col-xs-6"
									bcs-requerido = "!!definicion.MontoFijoSiNoActivado"
									k-ng-disabled="!definicion.MontoFijoSiNoActivado" 
									k-ng-model="definicion.MontoFijoSiNo">
								</bcs-input-numero>
							</div>
						</div>
						<hr/>
						<div class="row">
							<label class="col-xs-2">	
								<bcs-input-checkbox class="col-xs-2" ng-disabled="'true'" ng-model="definicion.MontoFijoPorUnidadActivado"></bcs-input-checkbox>{{'UI_MONTO_FIJO_POR_UNIDAD' | translate}}
							</label>
							<bcs-input-numero class="col-xs-2"

								k-ng-disabled="!definicion.MontoFijoPorUnidadActivado" 
								k-ng-model="definicion.MontoFijoPorUnidadValor"></bcs-input-numero>
							<label class="col-xs-2">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="!definicion.MontoFijoPorUnidadActivado" ng-model="definicion.AllInCheckValorMontoPorUnidad"></bcs-input-checkbox>{{'UI_ALL_IN' | translate}}
							</label>			
						</div>
						<hr/>
						<div class="row">
							<label class="col-xs-2">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="'true'" ng-model="definicion.PorcentualFijo.PorcentualFijoCheckValor"></bcs-input-checkbox>{{'UI_PORCENTUAL_FIJO' | translate}}
							</label>
							<bcs-input-porcentaje class="col-xs-2"
								bcs-requerido ="!!definicion.PorcentualFijo.PorcentualFijoCheckValor" 
								k-ng-disabled="!definicion.PorcentualFijo.PorcentualFijoCheckValor" 
								k-ng-model="definicion.PorcentualFijo.PorcentualFijoInputValor">
							</bcs-input-porcentaje>

							</label>
							
							<label class="col-xs-2 col-xs-offset-2">
								<bcs-input-checkbox ng-disabled="!definicion.PorcentualFijo.PorcentualFijoCheckValor" ng-model="definicion.PorcentualFijo.MontoMinimoCheckValor" class="col-xs-2"></bcs-input-checkbox>{{'UI_MONTO_MINIMO' | translate}}
							</label>
							
							<bcs-input-monetario class="col-xs-2"

						</div>
						<div class="row">
							<label class="col-xs-2 col-xs-offset-2">

							</label>
							<label class="col-xs-2">

							</label>
							<label class="col-xs-2 col-xs-offset-2">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="!definicion.PorcentualFijo.PorcentualFijoCheckValor" ng-model="definicion.PorcentualFijo.MontoMaximoCheckValor"></bcs-input-checkbox>{{'UI_MONTO_MAXIMO' | translate}}
							</label>
							<bcs-input-monetario class="col-xs-2"

						<div class="row">
							<label class="col-xs-2 col-xs-offset-2">

							<label class="col-xs-2 col-xs-offset-2">{{'UI_MONEDA_MIN_MAX' | translate}}</label>
							<bcs-combobox-base class="col-xs-2"

								activado = "!!(definicion.PorcentualFijo.MontoMaximoCheckValor || definicion.PorcentualFijo.MontoMinimoCheckValor)"
								id-actual = "definicion.PorcentualFijo.idMonedaMinMaxCobroSeleccionada"
								seleccionado = "definicion.PorcentualFijo.monedaCobroMinMaxSeleccionada" 
								tipo="'combobox-moneda'">
							</bcs-combobox-base>
						</div>
						<hr/>
						<div class="row">
							<label class="col-xs-2">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="'true'" ng-model="definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor"></bcs-input-checkbox>{{'UI_PORCENTUAL_TASA_PLAZO' | translate}}
							</label>
							<bcs-input-porcentaje class="col-xs-2"
								bcs-requerido ="!!definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor" 
								k-ng-disabled="!definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor" 
								k-ng-model="definicion.PorcentualTasaPlazo.PorcentualTasaPlazoInputValor">
							</bcs-input-porcentaje>
							<label class="col-xs-1 col-xs-offset-1">
								{{'UI_BASE_TASA' | translate}}
							</label>
							<bcs-combobox-base class="col-xs-2"
								bcs-requerido = "!!definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor"
								id-defecto = "defecto.IdBaseTasaCobro"
								activado = "definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor"
								id-actual = "definicion.OtrosDatos.IdBaseTasaCobroSeleccionada"
								seleccionado = "definicion.OtrosDatos.BaseTasaCobroSeleccionada" 
								tipo="'combobox-base-tasa'">
							</bcs-combobox-base>
							<label class="col-xs-2">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="!definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor" ng-model="definicion.OtrosDatos.InteresSimpleCheckValor"></bcs-input-checkbox>{{'UI_INTERES_SIMPLE' | translate}}
							</label>
							<label class="col-xs-2">
								<bcs-input-checkbox class="col-xs-2" ng-disabled="!definicion.PorcentualTasaPlazo.PorcentualTasaPlazoCheckValor" ng-model="definicion.OtrosDatos.InteresCompuestoCheckValor"></bcs-input-checkbox>{{'UI_INTERES_COMPUESTO' | translate}}
							</label>
						</div>
						<hr />
						<div class="row">
							
							<!-- <label class="col-xs-2" translate>UI_MONTO_OPERACION_BASE</label>
							<bcs-input-numero class="col-xs-2" 
								bcs-requerido = "!!definicion.OtrosDatos.AllInCheckValor"
								k-ng-disabled="!definicion.OtrosDatos.AllInCheckValor" 
								k-ng-model="definicion.OtrosDatos.AllInInputValor">
							</bcs-input-numero> -->

						<div class="row">

							</label>

								<bcs-input-checkbox class="col-xs-2" ng-model="definicion.OtrosDatos.OperacionPlazoCheckValor" ng-disabled="definicion.ComisionIndirecta"></bcs-input-checkbox>{{'UI_OPERACION_PLAZO' | translate}}

			<uib-tab select="refresh()" heading="{{'UI_DEFINICION_RANGOS' | translate}}">

							<label class="col-xs-6">
								<bcs-input-checkbox class="col-xs-1" ng-disabled="true" ng-model="pestanaRangos.PorcentualPorRangoCheckValor"></bcs-input-checkbox>{{'UI_PORCENTUAL_POR_RANGO' | translate}}</label>
							<bcs-combobox-base class="col-xs-5"
								activado = "pestanaRangos.PorcentualPorRangoCheckValor"
								id-defecto = "defecto.IdTipoRangoCobro"
								id-actual = "pestanaRangos.IdTipoRangoCobroSeleccionado"
								tipo="'combobox-tipo-rango-cobro'">
							</bcs-combobox-base>
						</div>
						<div class="row">
							<label class="col-xs-6" translate>UI_MONEDA_RANGO_POR_MONTO</label>
							<bcs-combobox-base class="col-xs-5"
								activado = "pestanaRangos.PorcentualPorRangoCheckValor"
								id-defecto = "defecto.IdMonedaRangoMonto"
								id-actual = "pestanaRangos.IdMonedaRangoCobroSeleccionado"
								tipo="'combobox-moneda'">
							</bcs-combobox-base>
						</div>
						
					</div>
					<div class="col-xs-6">
						<div class="row">
							<label class="col-xs-12" translate>UI_RANGOS_DE_COBRO</label>
							<bcs-grid class="col-xs-12" id="grillaRangos"
								seleccionado = "pestanaRangos.rangoSeleccionado"
								configuracion="pestanaRangos.configuracionGrillaRangos">
							</bcs-grid>
							
						</div>
						<div class="row">
							<label class="col-xs-2" translate>UI_HASTA</label>
							<bcs-input-numero decimales = "0" k-options="{ min : 0}" decaimles class="col-xs-2" k-ng-disabled="!pestanaRangos.PorcentualPorRangoCheckValor" k-ng-model="pestanaRangos.ValorHastaInputValor"></bcs-input-numero>
							<label class="col-xs-2" translate>UI_PORCENTAJE</label>
							<bcs-input-porcentaje class="col-xs-2" k-ng-disabled="!pestanaRangos.PorcentualPorRangoCheckValor" k-ng-model="pestanaRangos.ValorPorcentajeInputValor"></bcs-input-porcentaje>
							<bcs-button bcs-clic="pestanaRangos.agregarRango()"  class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="pestanaRangos.PorcentualPorRangoCheckValor"></bcs-button>
							<bcs-button bcs-clic="pestanaRangos.quitarRango()"  class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_QUITAR' | translate" bcs-habilitado="pestanaRangos.PorcentualPorRangoCheckValor && pestanaRangos.rangoSeleccionado"></bcs-button>	
							
							
						</div>
					</div>
				</div>
			</uib-tab>
			<uib-tab heading="{{'UI_DEFINICION_INCLUSIONES_EXCLUSIONES' | translate}}">
				<div class="row">

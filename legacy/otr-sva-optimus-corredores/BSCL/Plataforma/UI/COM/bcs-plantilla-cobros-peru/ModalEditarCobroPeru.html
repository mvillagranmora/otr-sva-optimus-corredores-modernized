<div class="row" ng-controller="ModalEditarCobroPeruCtrl">
    <div class="row">
        <label class="row" translate>UI_COBROS_DISPONIBLES</label>
        <div class="row">
            <bcs-grid
                configuracion="data.gridCobros"
                
                seleccionado="data.cobrosSeleccionados">
            </bcs-grid>
        </div>
    </div> <!-- bcs-habilitado="ModalAgregarValorCobroDetalle.$valid"-->  
    <div class="row bcs-panel-comandos">
        <bcs-button class="col-xs-2" 
            bcs-tipo="'principal'"  
            bcs-auto-desactivar="false" 
            bcs-habilitado = "true"
            bcs-texto="'UI_ACEPTAR' | translate" 
            bcs-clic="aceptar();">
        </bcs-button>
        <bcs-button class="col-xs-2" 
            bcs-tipo="''"  
            bcs-auto-desactivar="false" 
            bcs-texto="'UI_CANCELAR' | translate" 
            bcs-habilitado="true"  
            bcs-clic="cancelar();">
        </bcs-button>
    </div>
</div>

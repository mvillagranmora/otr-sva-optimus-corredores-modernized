<div>
	<div class="col-xs-12">
		<div class="row" style="">
			<!-- Cabecera -->
			<div ng-show="modo==='MP'">
				<div class="row">
				  	<div class="col-xs-6">
				  		<label class="col-xs-4" translate>UI_CODIGO</label>
						<bcs-input-texto class="col-xs-8" 
							ng-model="datosCabeceraDespues.IdPerfilCobros" 
							k-ng-disabled="true">
						</bcs-input-texto> 
					</div>
				  	<div class="col-xs-6">
				  		<label class="col-xs-4" translate>UI_DESCRIPCION</label>
						<bcs-input-texto 
							class="col-xs-8" 
							ng-model="datosCabeceraDespues.DescripcionPerfilCobros" 
							k-ng-disabled="true">
						</bcs-input-texto>
				  	</div>
			  	</div>
			  	<div class="row">
					<div class="col-xs-6">
				  		<label class="col-xs-4" translate>UI_HABILITADO</label>
						<bcs-input-checkbox 
							ng-model="datosCabeceraDespues.Habilitado" 
							ng-disabled="true">
						</bcs-input-checkbox>
				  	</div>
				</div>
				<div class="row"></div>
		  	</div>
		  	<!-- Detalle -->
		  	<div ng-show="true">
				<div class="row">
					<bcs-grid
						id="planilla-perfil-cobros"
						configuracion="grilla.GrillaMatrizCobros"
						seleccionado="grilla.GrillaMatrizCobrosSeleccionado">
					</bcs-grid>
				</div>
			</div>
			<!-- Botonera Principal -->
			<div class="row col-xs-12 bcs-panel-comandos">
				<div class="col-xs-8">	
					<div ng-show="modo==='MP'">
						<bcs-button 
							id="AdmPla_PlantillaCobros_crear" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_CREAR_PLANTILLA' | translate" 
							bcs-habilitado="'true'"  
							bcs-clic="fn.administrarCabecera();">
						</bcs-button>
						<bcs-button 
							id="AdmPla_PlantillaCobros_editarCabecera" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_EDITAR_PLANTILLA' | translate" 
							bcs-habilitado="datosCabeceraDespues.IdPerfilCobros"  
							bcs-clic="fn.administrarCabecera(datosCabeceraDespues);">
						</bcs-button>
						
					</div>
					<div ng-show="modo==='MP' || modo==='PE'">
						<bcs-button 
							id="AdmPla_PlantillaCobros_crearDetalle" 
							class="col-xs-3" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_AGREGAR_DETALLE' | translate" 
							bcs-habilitado="datosCabeceraDespues.IdPerfilCobros || modo === 'PE'"  
							bcs-clic="fn.administrarDetalle();">
						</bcs-button>
						<bcs-button 
							id="AdmPla_PlantillaCobros_editarDetalle" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_EDITAR_DETALLE' | translate" 
							bcs-habilitado="datosCabeceraDespues.IdPerfilCobros && grilla.GrillaMatrizCobrosSeleccionado && modo === 'PE'"  
							bcs-clic="fn.administrarDetalle(grilla.GrillaMatrizCobrosSeleccionado,'U');">
						</bcs-button>
						<bcs-button 
                            id="AdmPla_PlantillaCobros_eliminarDetalle" 
                            class="col-xs-2" 
                            bcs-tipo="'bcs-button-secondary'"  
                            bcs-auto-desactivar="false" 
                            bcs-texto="'UI_QUITAR_DETALLE' | translate" 
                            bcs-habilitado="datosCabeceraDespues.IdPerfilCobros && grilla.GrillaMatrizCobrosSeleccionado"  
                            bcs-clic="fn.administrarDetalle(grilla.GrillaMatrizCobrosSeleccionado);">
                        </bcs-button>
                        	<bcs-button 
							id="AdmPla_PlantillaCobros_copiarCabecera" 
							class="col-xs-2" 
							bcs-tipo="'bcs-button-secondary'"  
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_COPIAR_PLANTILLA' | translate" 
							bcs-habilitado="datosCabeceraDespues.IdPerfilCobros"  
							bcs-clic="fn.administrarCabecera(datosCabeceraDespues,true);">
						</bcs-button>
					</div>
				</div>
				<div ng-show="modo==='MP'">
					<div class="col-xs-3"></div>
					<bcs-menu class="col-xs-1" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
						<li ng-click="fn.configuracionCobros()">{{'UI_CONFIGURACION_COBROS' | translate}}</li>
					</bcs-menu>
				</div>
			</div>
		</div>
	</div>
</div>

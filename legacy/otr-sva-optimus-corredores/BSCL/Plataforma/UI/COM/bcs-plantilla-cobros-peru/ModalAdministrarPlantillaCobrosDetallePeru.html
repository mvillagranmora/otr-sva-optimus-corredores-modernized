<div class="row" ng-controller="ModalAgregarValorCobroDetallePeruCtrl">
	<div class="row"> 
		<form name="ModalAgregarValorCobroDetalle" class="row">
			<div class="col-xs-5">
				<label class="row" translate>UI_PRODUCTOS/OPERACIONES</label>
				<div class="row">
					<bcs-grid
						configuracion="gridOperaciones"
						seleccionado="operacionesSeleccionadas">
					</bcs-grid>
				</div>
			</div>
			<div class="col-xs-2">
				<label class="row" translate>UI_CANALES</label>
				<div class="row">
					<bcs-grid
						configuracion="gridCanales"
						seleccionado="canalesSeleccionados">
					</bcs-grid>
				</div>
			</div>
			<div class="col-xs-5">
				<label class="row" translate>UI_BOLSAS</label>
				<div class="row">
					<bcs-grid
						configuracion="gridBolsas"
						seleccionado="bolsasSeleccionadas">
					</bcs-grid>
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row">
		<label class="row" translate>UI_COBROS_DISPONIBLES</label>
		<div class="row">
			<bcs-grid
				configuracion="gridCobros"
				fn-doble-click ="editarCobro()"
				seleccionado="cobrosSeleccionados">
			</bcs-grid>
		</div>
	</div> 
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-1" 
			bcs-tipo="'principal'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="ModalAgregarValorCobroDetalle.$valid"  
			bcs-clic="aceptar();">
		</bcs-button>
		<bcs-button class="col-xs-1" 
			bcs-tipo="''"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="cancelar();">
		</bcs-button>
	</div>
</div>

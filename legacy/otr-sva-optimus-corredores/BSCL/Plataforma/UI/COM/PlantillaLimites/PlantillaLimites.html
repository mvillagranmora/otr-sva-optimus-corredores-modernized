<div class="row" ng-controller="PlantillaLimitesCtrl as pLim">
	<div class="row" ng-show="pLim.datos.modoLectura">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_CODIGO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-plantilla-limites'"
					id-actual="pLim.datos.IdPlantillaLimite"
					id-defecto="pLim.datos.IdPlantillaLimiteDef"
					filtros="pLim.cmbbx.plantillaLimite.filtros"
					todos="'N'"
					activado="true"
					seleccionado="pLim.datos.PlantillaLimiteObj">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
				<bcs-button class="col-xs-2 pull-right" 
					bcs-tipo="'bcs-button-input-form'" bcs-mostrar="true" bcs-auto-desactivar="false" bcs-texto="'UI_CARGAR' | translate" 
					bcs-habilitado="'true'" bcs-clic="pLim.fn.buscar(pLim.datos.PlantillaLimiteObj.IdPlantillaLimite);">
				</bcs-button>
			</div>
	  	</div>
	  	<hr style="margin: 10px 0px">
	</div>
	<div class="row">
		<bcs-plantilla-limites
			id-ventana = "idVentana"
			id-plantilla="pLim.datos.IdPlantillaDirectiva"
			modo="'MP'"
			modo-lectura="pLim.datos.modoLectura"
			guardar-ok="pLim.datos.guardarOk">
		</bcs-plantilla-limites>
	</div>
</div>

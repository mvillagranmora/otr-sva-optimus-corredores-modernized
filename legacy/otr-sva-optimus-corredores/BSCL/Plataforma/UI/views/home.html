<!DOCTYPE html>
<html ng-app="ngBcsComponents">
<head>
  <title>Cargando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="max-age=0" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta charset="utf-8">
  <!-- CSS -->
  <::LIB_BASE_CSS::>
  <::LIB_THEME_CSS::>
  <::LIB_EXTRA_CSS::>
  <link rel="stylesheet" type="text/css" href="../UI/styles/sap-icons.css">
  <style>
     body > .inner {display: none; }
     body.pg-loaded > .inner { display: block; }
  </style>
  <link rel="shortcut icon" href="../UI/styles/images/favicon.ico">
</head>
<body ng-controller="AppCtrl">
  
  	<form id ="FLOGIN" action="" METHOD="post"><input type="hidden" name="X-SESSION-TOKEN"  value=""></form>
	<toaster-container toaster-options="{
	  'close-button': true,
	  'debug': false,
	  'newest-on-top': true,
	  'position-class': 'toast-bottom-right',
	  'mouseover-timer-stop': true,
	  'time-out': '5000',
	  'extended-time-out': '1000'	  
	}"></toaster-container>
	<!--[if lt IE 9]>
	  <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
	<![endif]-->
	<!-- PAGE-->
	<div id="Pagina" style="display:none;">
		<div id="wrapper">	
			<!-- TOP Navigation -->
			<div id="Barra" ng-show="ModoNavegacion === 'browser'  ">
				<div ng-include="'views/topnavbar.html'"></div>
			</div>
			<!-- LEFT Navigation -->
			<div id="Menu" ng-show="ModoNavegacion === 'browser'">
				<div  class="visible-sm visible-md visible-lg"  ng-include="'views/left_navbar.html'"></div>
			</div>
			<!-- BODY -->
			<div id="VentanaBody" class="container-fluid appBody">
				<div id="Welcome2" ng-show="ModoNavegacion === 'browser'" ng-class="{'welcomeCollapse': isMenuVisible, 'welcomeOpen': !isMenuVisible}">
					<button class="buttonCloseWelcome" ng-click="hiddenWelcome()"><span class="k-icon k-i-close" style="color: #666666"></span></button>
					<div id="containerWelcome">
						<div>
							<p class="pWelcome" style="display: inline-block;">Bienvenido </p>
							<p class="pWelcome" id="sesionUser" style="display: inline-block; margin-left:3px;">{{SesionUsuario}}</p>
						</div>
						<div>
							<p class="pWelcome" style="display: inline-block;">Estás utilizando </p>
							<p class="pWelcome" id="sesionEmpresa" style="display: inline-block;white-space:nowrap; margin-left:3px;">{{SesionEmpresa}}</p>
						</div>
						<div class="pAmbiente" ng-if="rootScope.Ambiente !== 'PRO'">{{UI_AMBIENTE|translate}} v{{VersionSistema}}</div>
						<div class="pAmbiente" ng-if="rootScope.Ambiente === 'PRO'">{{UI_AMBIENTE|translate}} v{{VersionSistema}}</div>
					</div>
				</div>
			    <div id="Formularios"></div>
			    <div ui-view></div>
			</div>
			<div id="FormWidgets" ng-show="ModoNavegacion === 'browser'"  ng-include="'views/right_sidebar.html'"></div>
			<div id="FormWidgetsProgress" ng-show="ModoNavegacion === 'browser'"  ng-include="'views/right_progress.html'"></div>
			<div id="footer" ng-show="ModoNavegacion === 'browser' && OcultarBarraInferior !== true"  ng-include="'views/footer.html'"></div>
		</div>
	</div>
	<!-- PAGE END-->
	<!-- BASE -->
	<::LIB_BASE::>
	<!-- LOCALES -->
	<::LOCALIZACION::>
	<!-- CONFIG -->	
	<::CONFIG::>	
	<!-- MODULOS-->
	<::MODULOS::>	
</body>
</html>

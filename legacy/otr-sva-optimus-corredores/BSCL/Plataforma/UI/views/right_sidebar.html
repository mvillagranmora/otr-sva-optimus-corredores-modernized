<div id="right-sidebar" ng-show="rightSidebar" class="sidebar-open" ng-controller="SideBarCtrl" style="border-radius: 10px;">
    <div class="sidebar-container" full-scroll>
        <ul class="nav nav-tabs navs-3">
            <li id="rightSideBarId" class="left-tab" ng-class="{active: tab1}"><a ng-click="tab1 = true; tab2 = false; tab3 = false; tab4 = false" ng-init="tab1 = true" class="left-tab">
                <p>Instrumento</p>
            </a></li>
            <li id="leftSideBarId" class="right-tab" ng-class="{active: tab3}"><a ng-click="tab3 = true; tab1 = false; tab2 = false; tab4 = false" class="right-tab">
                <p>Configuración</p>
            </a></li>       
        </ul>

        <div class="tab-content">
            <!-- INFORMACION DEL FORMULARIO -->
            <div class="tab-pane" ng-class="{active: tab1}">                  
                <div id="rightSideBarInstrumento" style="padding: none;">
                    <bcs-widget-instrumento></bcs-widget-instrumento>
                </div>
            </div>
            <!-- CONFIGURACION ESCRITORIO -->
            <div  class="tab-pane" ng-class="{active: tab3}">
                <div class="sidebar-title">
                    <h5 id="rightSideBarConfigTitle" class="ng-scope">Configuración</h5>
                </div>
                <div class="row setings-item" style="padding: 0; margin: 15px 20px; border: none;">
                    <div class="row" style="margin-bottom:2%">
                        <label class="col-xs-11 fontFamilyRightSideBar" translate>UI_RECORDAR_CLIENTE_AUTOMATICO</label>
                        <bcs-input-checkbox class="right-check-sidebar" id="right-sidebar_RecordarClienteAutomatico" name="RecordarClienteAutomatico" ng-disabled="false" ng-model="recordarClienteAutomatico"></bcs-input-checkbox>
                    </div>
                    <div class="row" style="margin-bottom:2%">
                        <label class="col-xs-11 fontFamilyRightSideBar" translate>UI_MOSTRAR_MENSAJES</label>
                        <bcs-input-checkbox class="right-check-sidebar" id="right-sidebar_MostrarMensajes" name="MostrarMensajes" ng-disabled="false" ng-model="mostrarMensaje"></bcs-input-checkbox>
                    </div>                  
                    <div class="row" style="margin-bottom:2%" ng-show=" Ambiente == 'DES' ||  Ambiente == 'QA' ">
                        <label class="col-xs-11 fontFamilyRightSideBar" translate>UI_VER_DICCIONARIO</label>
                        <bcs-input-checkbox class="right-check-sidebar" id="right-sidebar_VerDiccionario" name="VerDiccionario" ng-disabled="false" ng-model="VerDiccionario"></bcs-input-checkbox>
                    </div>  
                    <!-- <div class="row"> -->
                        <!-- <label class="col-xs-11" translate>UI_MENU_MINIMIZADO</label> -->
                        <!-- <bcs-input-checkbox class="col-xs-1" id="right-sidebar_menuMinimizado" name="menuMinimizado" ng-disabled="false" ng-model="menuMinimizado"></bcs-input-checkbox> -->
                    <!-- </div>          -->
                    <div class="row" style="margin-bottom:2%">
                        <label class="col-xs-11 fontFamilyRightSideBar" translate>UI_MINIMIZAR_MENSAJE_EXITO</label>
                        <bcs-input-checkbox class="right-check-sidebar" id="right-sidebar_MinimizarMensajeExito" name="MinimizarMensajeExito" ng-disabled="false" ng-model="MinimizarMensajeExito"></bcs-input-checkbox>
                    </div>
                        
                    <div class="row" style="margin-bottom:2%">
                        <label class="col-xs-11 fontFamilyRightSideBar" translate>UI_NOTIFICACIONES_EN_LINEA</label>
                        <bcs-input-checkbox class="right-check-sidebar" id="right-sidebar_NotificacionesEnLinea" name="NotificacionesEnLinea" ng-disabled="false" ng-model="NotificacionesEnLinea"></bcs-input-checkbox>
                    </div>                      
                </div>
                <div class="row" style="padding: 15px 20px; margin:0%; border-top: 2px solid #F8f8f8;">
                    <div class="row" style="margin: 0%; padding-top: 1%;">
                        <label class="col-xs-11 fontFamilyRightSideBar" translate>UI_RECORDAR_CLIENTE</label>
                        <bcs-input-checkbox class="right-check-sidebar" id="right-sidebar_RecordarCliente" name="RecordarCliente" ng-disabled="false" ng-model="recordarCliente"></bcs-input-checkbox>
                    </div>
                    <div class="col-xs-11">
                        <div class="col-xs-1"></div>
                        <div class="col-xs-11" style="width: 100%;white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 190px;"><small style=" font-family: 'Roboto-Bold';
                            font-size: 12px;
                            font-weight: bold;
                            color: #989FB3;" title="{{nombreCompleto}}">{{nombreCompleto}}</small></div>
                    </div>
                    <div class="col-xs-1">
                        <a ng-click="busquedaClienteAvanzado()" class="k-select k-icon k-i-search fa-xs iconButtonWithColor iconRightSideBar" style="font-size: px !important;"></a>
                    </div>
                    <div class="row" style="margin:0%; padding-top: 1%;">
                        <div class="col-xs-1" style="padding-top: 1%;"></div>
                        <bcs-combobox-base class="col-xs-11"
                             id="UI_PORTAFOLIO"
                             id-actual="portafolioRecordado"
                             auto-cargar="'false'"
                            tipo="'combobox-portafolio'"
                            filtros="por.filtros"
                            id-post-filtro="portIDPosfiltro"
                            configuracion= "por.configuracion" >
                        </bcs-combobox-base >
                    </div>
                </div>
            </div>
            <!-- FIN -->
        </div>
    </div>
</div>

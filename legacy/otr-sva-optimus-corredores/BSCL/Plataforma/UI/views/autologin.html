<!doctype html>
<html class="no-js" lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>OPTIMUS | Bolsa de Santiago</title>
  <meta name="description" content="Optimus Full Business Management">

  <!-- Mobile viewport optimized: h5bp.com/viewport -->
  <meta name="viewport" content="width=device-width">
  
	
	<script src="libs/K2016_3_1028/jquery.min.js"></script> 
	<script src="libs/K2015_3_1111/angular.min.js"></script>

	<script>  		   		
  	    /* cookies  */
  	    {
			var cookies = document.cookie.split(";");
	    	for (var i = 0; i < cookies.length; i++) {
	    		var cookie = cookies[i];
	    		var eqPos = cookie.indexOf("=");
	    		var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
	    		document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT";
	    	}
  	    }
		/* Definicion de dependencias de aplicacion principal */
		angular.module('AutoLogin', []);
		angular.module('AutoLogin').controller('AutoLoginCtrl',function($scope,$window){			
			angular.element(document).ready(function () {
				sessionStorage.setItem('Token', "<::TOKEN::>");
				localStorage.setItem('1_home',"go");					
				//REdirect
				var debug='';
				if ($window.location.href.indexOf("debug=true")!==-1) debug='?debug=true';
				$('#FLOGIN').attr('action', 'optimus'+debug);
				$('input[name="X-SESSION-TOKEN"]').val("<::TOKEN::>");
				$('#FLOGIN').submit();
			});
			
			
		});	
		
		
  	</script>
</head>
<body ng-app="AutoLogin" >
  <div role="main" id="main" ng-controller="AutoLoginCtrl" >
    <section id="contenidos" ng-cloak>
       <form id ="FLOGIN" action="" METHOD="post"><input type="hidden" name="X-SESSION-TOKEN"  value=""></form>   
    </section>
    </div>
</body>
</html>

<div class="col-xs-12" ng-controller="MonitorCtrl">
    <div class="row bcs_titulo">
        <div class="col-xs-12">
            <span>Monitor</span>
        </div>
    </div>
    <div class="bcs-cuerpo">
        <form name="FormMonitor" class="filters-formulario">
            <div class="row">
                <label class="col-xs-2">CPU</label>                 
                <div class="col-xs-3">: {{CPU}}% [{{DELAY}}]</div>
                <label class="col-xs-2">WATCHERS</label>                 
                <div class="col-xs-3">: {{WATCHERS}}</div>
            </div>      
            <div class="row">
                <label class="col-xs-2">DIGEST</label>                 
                <div class="col-xs-3">: {{DigestCycleAvg}} mseg</div>
                <label class="col-xs-2">RATE</label>                 
                <div class="col-xs-3">: {{DigestCycleRate}} [{{DigestCycleRatePRC}}%]</div>
            </div>                            
        </form>
    </div>
</div>

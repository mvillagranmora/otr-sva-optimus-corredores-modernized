<div ng-controller="gFormularioDetalleCtrl">
	<div class="row bcs_titulo" translate>
		UI_INFORMACION
	</div>
	<div class="row bcs-cuerpo">
		La información es: {{dato}}
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="aceptar()"></bcs-button>	
		<bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>
</div>

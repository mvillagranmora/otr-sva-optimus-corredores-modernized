<div class="col-xs-12" ng-controller="gFormularioCtrl">
    <div class="row bcs_titulo">
        <div class="col-xs-12">
            <span>{{'UI_TITULO'|translate}}</span>
        </div>
    </div>
    <div class="bcs-cuerpo">
        <form name="FormXXX" class="filters-formulario">
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>UI_NEW_INSTRUMENTO</label>
					 <bcs-input-instrumentos class="col-xs-9"
					 	id="asdfasdfasdf"
					 	bcs-requerido
					 	k-ng-readonly="true"
					 	filtro-clasificacion = "'RV'"
					 	filtro-tipo-instrumento = "'ACN'"
					 	datos-instrumento = "datosInstrumento"
					 	muestra-precio = "'N'"
					 	>
					</bcs-input-instrumentos >
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>UI_SOCIO_NEGOCIO</label>
					 <bcs-combobox-base class="col-xs-9"
					 	id="UI_SOCIO_NEGOCIO"
					 	auto-cargar="'false'"
					    tipo="'combobox-socio-negocio'"
					    filtros="socio.filtros"
						cascada-a="por.filtros.IdCliente"
						cascada-valor="'IdCliente'"
                        cascada-defecto="-1"
                        id-actual="socioIDActual"
                        buscar='socio_texto'
                        foco="foco"
					    configuracion= "socio.configuracion"  >
					</bcs-combobox-base >
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>UI_PORTAFOLIO</label>
					 <bcs-combobox-base class="col-xs-9"
					 	id="UI_PORTAFOLIO"
					 	auto-cargar="'false'"
					    tipo="'combobox-portafolio'"
					    filtros="por.filtros"
                        id-post-filtro="portIDPosfiltro"
					    configuracion= "por.configuracion"  >
					</bcs-combobox-base >
                </div>
            </div>
            <hr>        
            <hr>  
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos class="col-xs-9" bcs-requerido name="uInstrumento" configuracion= "data.InstrumentoOptions" buscar-instrumento="data.setInstrumento" datos-instrumento="data.instrumento" 
					muestra-precio = "true" ng-model="data.ngInstrumento" filtro-clasificacion="'RV'" filtro-estado = "'ACT'" filtro-bolsa = "data.oConfiguracionBolsa.IdActual"></bcs-input-instrumentos>
                </div>
            </div>
             <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3" translate>Detalle </label>
                    <span class="col-xs-6"><a ng-click="verDetalle(IdDetalle)" >#{{IdDetalle}}</a> ( ver modal <bcs-input-checkbox ng-model="verDetalleModal"></bcs-input-checkbox> ) </span>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>UI_PAIS</label>
					 <bcs-combobox-base class="col-xs-9"
					 	id="UI_PAIS"
					    tipo="pais.tipo"
					    configuracion= "pais.configuracion"
					    id-actual="pais.idActual"
						  seleccionado="pais.seleccionado"
						  id-defecto="pais.idDefecto"
						  cascada-a="ciudadFiltroRegionIDA"
						  cascada-valor="'RegionID'">
					</bcs-combobox-base >
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>UI_CIUDAD</label>
		    		 <bcs-combobox-base
		    		 id="UI_CIUDAD"
		    		 class="col-xs-9"
				    tipo="ciudad.tipo"
				    auto-cargar="'false'"
				    configuracion= "ciudad.configuracion"
				    id-actual="ciudad.idActual"
					seleccionado="ciudad.seleccionado"
					id-defecto="ciudad.idDefecto"
					filtros="ciudad.filtros"
					memoria="pais.idActual">
					</bcs-combobox-base >
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>Numero</label>
                    <bcs-input-numero id="numero" class="col-xs-4" bcs-requerido = "'true'" ng-model="data.monto" k-ng-model="data.kngMonto" ></bcs-input-numero>
                    <label class="col-xs-1  txt-right" translate style="padding-right: 5px">Fecha</label>
                    <bcs-input-datetime class="col-xs-4" ng-model="data.fechaRecepcion" k-ng-model="data.kngFechaRecepcion" ></bcs-input-datetime>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>Porcentaje</label>
                    <bcs-input-porcentaje class="col-xs-4" bcs-requerido = "'true'" ng-model="data.monto" k-ng-model="data.kngMonto" ></bcs-input-porcentaje>
                    <label class="col-xs-1  txt-right" translate style="padding-right: 5px">Fecha</label>
                    <bcs-input-date class="col-xs-4" ng-model="data.fechaRecepcion3" k-ng-model="data.kngFechaRecepcion3" ></bcs-input-date>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3 " translate>Monetario</label>
                    <bcs-input-monetario class="col-xs-4" bcs-requerido = "'true'" ng-model="data.monto" k-ng-model="data.kngMonto" ></bcs-input-monetarioe>
                    <label class="col-xs-1  txt-right" translate style="padding-right: 5px">Fecha</label>
                    <bcs-input-time class="col-xs-4" ng-model="data.fechaRecepcion2" k-ng-model="data.kngFechaRecepcion2" ></bcs-input-time>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3" translate>Texto</label>
                    <bcs-input-texto class="col-xs-9" ng-model="data.texto" k-ng-model="data.textoKNG" ></bcs-input-texto>
                </div>
            </div>
           <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3" translate>Texto</label>
                    <bcs-input-texto solo-mayusculas='S'  tipo-campo="'textarea'" class="col-xs-9" ng-model="data.texto" k-ng-model="data.textoKNG" ></bcs-input-texto>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3" translate>countryNames</label>
                    <input class="col-xs-9" kendo-auto-complete ng-model="country" k-data-source="countryNames" />
                </div>
            </div>
   			<div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3" translate>Comandos</label>
					<div class="col-xs-2">
					    <bcs-button bcs-tipo="'normal'"  bcs-auto-desactivar="false" bcs-texto="'popup'" bcs-habilitado="'true'"  bcs-clic="verAlerta()"></bcs-button>
					</div>
					<div class="col-xs-2">
					    <bcs-button bcs-tipo="'normal'"  bcs-auto-desactivar="false" bcs-texto="'notificacion'" bcs-habilitado="'true'"  bcs-clic="enviarNotificacion()"></bcs-button>
					</div>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <label class="col-xs-3" translate>Codigo archivo a cargar</label>
					<div class="col-xs-9">
						<bcs-input-texto class="col-xs-6" solo-mayusculas="S"
						ng-model="data.CodigoArchivo">
						</bcs-input-texto>	
					    <bcs-button class="col-xs-4" bcs-tipo="'normal'"  bcs-auto-desactivar="false" bcs-texto="'Cargar archivo'" bcs-habilitado="'true'"  bcs-clic="cargarArchivo()"></bcs-button>
					</div>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12">
                    <div  style="overflow: auto; height: 100px;" >HOLA MUNDO {{dataLarge}}</div>
					
                </div>
            </div>   
            <div class="row">
            	<div class="col-xs-10">
           			<label class="col-xs-4" translate>UI_FECHA_ORDEN</label>
					<bcs-input-date class="col-xs-4" k-ng-model="fechaDesde"></bcs-input-date>
					<bcs-input-date class="col-xs-4" k-ng-model="fechaHasta"></bcs-input-date>
            	</div>
            	<div class="col-xs-2">
            		<bcs-button class="col-xs-12" bcs-tipo="'normal'"  bcs-auto-desactivar="false" bcs-texto="'Validar Rango fecha'" bcs-habilitado="'true'"  bcs-clic="validarRangoFecha()"></bcs-button>
            	</div>
            </div>         
        </form>
    </div>
    <div class="row bcs-panel-comandos">
	    <div class="col-xs-2">
	    	<bcs-button id='gFormulario_comprar' bcs-tipo="'principal'"  bcs-auto-desactivar="true" bcs-texto="'UI_COMPRAR' | translate" bcs-habilitado="btncomprarhabilitado" bcs-clic="comprar()" ></bcs-button>
	    </div>
		<div class="col-xs-2">
		    <bcs-button id='gFormulario_limpiar' bcs-tipo="'normal'"  bcs-auto-desactivar="true" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'" bcs-clic="limpiar()"  ></bcs-button>
		</div>
		<div>{{datosInstrumento | json}}</div>
		<div class="col-xs-5"></div>
		<bcs-menu class="col-xs-3" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
            <li ng-click="">{{'UI_AGREGAR' | translate}}</li>
            <li ng-click="">{{'UI_ANULAR' | translate}}</li>
            <li ng-click="">{{'UI_RUTEAR' | translate}}</li>
            <li ng-click=""><hr></li>
            <li ng-click="guardarArchivo()">{{'UI_JGGUARDAR' | translate}}</li>
		</bcs-menu>

	</div>
</div>

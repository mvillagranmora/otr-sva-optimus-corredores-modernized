
<!-- INICIO DE Formulario -->

	aceptar-fn="data.guardarTransaccion()" 
	aceptar-show="data.aceptarShow"

	cancelar-show="data.cancelarShow" 
	conflictos="data.reglas"
	volver-fn="volver()" 
	volver-show="data.volverShow"> 
	<div id="FormularioIngreso" class="height_100" >
		<form name="FormularioIngreso" novalidate class="form-horizontal bcs_form height_100">			
			<table width='100%'>
			<!--fila 1-->
			<tr>
			    <!--fila 1 / columna 1-->
				<td>					
					<div class="row" align="left">
						<div class="col-xs-6" align="right"><label for="inputCaptacion" class="control-label" translate>UI_CAPTACION</label>:</div>
						<div class="col-xs-6" align="left">COMPONENTE 1</div>
					</div>
				</td>
				<!--fila 1 / columna 2-->
				<td>
					<div  class="row" align="center">
						<div class="col-xs-6" align="right"><label for="inputCaptacion" class="control-label" translate>UI_CAPTACION</label>:</div>
						<div class="col-xs-6" align="left">COMPONENTE 1</div>
					</div>
				</td>
				<!--fila 1 / columna 3-->
				</td>
					<div  class="row" align="right">
						<div class="col-xs-6" align="right"><label for="inputCaptacion" class="control-label" translate>UI_CAPTACION</label>:</div>
						<div class="col-xs-6" align="left">COMPONENTE 1</div>
					</div>
				</td>				
			</tr>
			</table>
		</form>
	</div>		
	</bcs-ingreso>
</div>
<!-- FIN DE Formulario -->

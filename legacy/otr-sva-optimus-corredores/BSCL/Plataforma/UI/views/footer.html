<div ng-click="AbrirVentana('LogSistema',{})">
	<div style="display: none;">
		<span id="ResultadoUltimaLlamada">{{MsgTipoUltimo}}</span>
	</div>
	<div class="row">
	    
	        <div class="col-xs-10 boxMessageLog boxNotif" >
	        	<div ng-class="[{'msgError' : MsgTipo == 'ERROR'} ,{'msgWarn' : MsgTipo == 'WARN'},{'msgInfo' : MsgTipo == 'INFO' }]">{{Msg}}
	        	</div>
	                
	        </div>
	       	    
	    	<div class="col-xs-1 date-hour">
	            <div>{{InfoFecha}} - {{InfoHora}}</div>
	        </div>
	        <div class="col-xs-1">
				<img id="imgFooter" src="images/LOGO-OPTIMUS-300x200-solo.png">
	        </div>
	    
	</div>
	<bcs-websocket bcs-msg='msgWebsocket(message)'></bcs-websocket>
</div>

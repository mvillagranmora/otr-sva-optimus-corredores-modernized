<div class="row" ng-controller='GeneraRutCtrl as test'>
	<div class="row">
		<div class="col-xs-2"></div>
		<label class="col-xs-6" translate>Generar 10 nuevos Rut</label>
		<bcs-button 
			class="col-xs-2" 
			bcs-texto="'Generar'" 
			bcs-habilitado="true" 
			bcs-auto-desactivar="false" 
			bcs-clic="winGenerarRut(10)">
		</bcs-button>
	</div><br><hr><br>
	<div class="row" ng-repeat="dato in lista">
		<div class="col-xs-2"></div>
		<label class="col-xs-6" translate>{{dato.rut}}</label>
		<bcs-button 
			class="col-xs-2" 
			bcs-texto="'copiar'" 
			bcs-habilitado="true" 
			bcs-auto-desactivar="false" 
			bcs-clic="winCopy(dato.rut)">
		</bcs-button> 	  
	</div>
</div>

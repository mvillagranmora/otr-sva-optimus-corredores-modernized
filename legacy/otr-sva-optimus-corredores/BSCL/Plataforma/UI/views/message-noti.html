<div id="msg-notiSection" class="sidebar-open" style="border-radius: 10px;">
    <div class="sidebar-container" full-scroll>
        <ul class="nav nav-tabs navs-3">
            <li class="center-tab" ng-class="{active: tab1}"><a ng-click="tab1 = true; tab2 = false; tab3 = false; tab4 = false" style="border-radius: 10px 10px 0 0;" ng-init="tab1 = true">
                <p style="text-align: center;">Mensajes</p>
            </a></li>
            <!-- <li class="right-tab" ng-class="{active: tab3}"><a ng-click="verMisNotificaciones()" class="right-tab">
                <p>Notificaciones</p>
            </a></li>        -->
        </ul>

        <div class="tab-content">
            <!-- INFORMACION DEL FORMULARIO -->
            <div id="msgModal" class="tab-pane" ng-class="{active: tab1}">                  
                <div class="modalMsg-title">
                    <p>Nuevos Mensajes</p>
                </div>

                <div ng-repeat="data in datars">
                    <div class="row" style="width: 22rem;">
                        <div class="col-xs-2 icon-msg">
                            <i ng-show="data.tipo === 'info'"  class="fa fa-lg fa-check-circle icons-info"></i>
                
                            <i ng-show="data.tipo === 'error'" class="fa fa-lg fa-times-circle error-msg"></i>
                        </div>
                        <div class="col-xs-10">
                            <p class="msg-text-modal">{{data.msg}}</p>
                            <p class="msg-date-modal">{{data.fecha | kformat:'G'}}</p>

                        </div>
                    </div>
                    

                </div>
            </div>
            <!-- CONFIGURACION ESCRITORIO -->
            <!-- FIN -->
        </div>
    </div>
</div>

<div class="row" ng-controller='MantenedorPautaCtrl as mpauta'>
	<div class="row">
		<div class="col-xs-10">
			<div class ="row">  
				<label class="col-xs-2" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-4" 
					k-ng-model="mpauta.datos.Fecha" 
					ng-model="mpauta.datos.FechaString"
					id-pais="$root.SesionIdPaisSistema">
				</bcs-input-date>
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button 
					class="col-xs-12" 
					bcs-tipo="'default'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="true"  
					bcs-clic="mpauta.win.buscar()">
				</bcs-button>
			</div>
		 </div>
	</div>
	<div class="row">
		<div class="row"> 
			 <bcs-grid id="grid-agendaJob"
			 	configuracion ="mpauta.grid.pauta"
				seleccionado = "mpauta.datos.seleccionadoAgenda"
				fn-doble-click="mpauta.win.pautaDetalle(mpauta.datos.seleccionadoAgenda.IdPrograma)">
	    	</bcs-grid> 
		</div>
	</div>
	<div class="row">
		<bcs-button 
			class="col-xs-2" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_REINTENTAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mpauta.win.reintentar()">
		</bcs-button>
		<!-- <bcs-button 
			class="col-xs-2" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_EJECUTAR_INMEDIATAMENTE' | translate" 
			bcs-habilitado="true"  
			bcs-clic="mpauta.win.ejecutarInmediatamente()">
		</bcs-button> -->
	</div>
</div>

<div class="row" ng-controller="AlertasCtrl">
	<div class="row bcs-cuerpo centerTextInDiv" style="min-height: 70px;">
		<div class="col-xs-1 bcs-icono" style="text-align: center;">
			<i class="fa fa-lg fa-exclamation-circle iconBcsAlerta" style="font-size: 25px !important;" ng-if="tipo === 'ERROR'"></i>
			<!-- <img ng-if="tipo === 'ERROR'" src="images/NoteIcon.png"/> -->
			<i class="fa fa-lg fa-exclamation-circle iconBcsAlerta" ng-if="tipo === 'INFO'"></i>
			<!-- <img ng-if="tipo === 'INFO'" src="images/QuestionIcon.png"/> -->
			<i class="fa fa-lg fa-exclamation-circle iconBcsAlerta" ng-if="tipo === 'PREGUNTA'"></i>
			<!-- <img ng-if="tipo === 'PREGUNTA'" src="images/QuestionIcon.png"/> -->
			<i class="fa fa-lg fa-exclamation-circle iconBcsAlerta" ng-if="tipo === 'PREGUNTA_SI_NO'"></i>
			<!-- <img ng-if="tipo === 'PREGUNTA_SI_NO'" src="images/QuestionIcon.png"/> -->
			<i class="fa fa-lg fa-exclamation-circleiconBcsAlerta" ng-if="tipo === 'PREGUNTA_SI_NO_CANCELAR'"></i>
			<!-- <img ng-if="tipo === 'PREGUNTA_SI_NO_CANCELAR'" src="images/QuestionIcon.png"/> -->
		</div>
		<div class="col-xs-11 centerText">
			{{mensaje}}
		</div>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button ng-if="tipo === 'ERROR' || tipo === 'INFO' || tipo === 'PREGUNTA'" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="aceptar()"></bcs-button>
		<bcs-button ng-if="tipo === 'PREGUNTA_SI_NO' || tipo === 'PREGUNTA_SI_NO_CANCELAR'" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_SI' | translate" bcs-clic="si()"></bcs-button>
		<bcs-button ng-if="tipo === 'PREGUNTA_SI_NO' || tipo === 'PREGUNTA_SI_NO_CANCELAR'" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_NO' | translate" bcs-clic="no()"></bcs-button>
		<bcs-button ng-if="tipo === 'PREGUNTA' || tipo === 'PREGUNTA_SI_NO_CANCELAR'" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

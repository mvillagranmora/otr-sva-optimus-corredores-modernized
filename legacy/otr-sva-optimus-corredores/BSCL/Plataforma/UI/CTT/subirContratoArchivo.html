<div class="col-xs-12" ng-controller="SubirContratoArchivoCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form id="formSubirArchivo" name="formSubirArchivo" class="col-xs-12 form-horizontal">
				<div class="row">
			  		<label class="col-xs-4" translate>UI_CODIGO_ARCHIVO</label>
					<bcs-input-texto class="col-xs-8" solo-mayusculas="S" bcs-requerido
						ng-model="recordData.codigoArchivo">
					</bcs-input-texto>	         
	            </div>
	            <div class="row"> 
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_DESCRIPCION</label>
						<bcs-input-texto class="col-xs-8" solo-mayusculas="S" bcs-requerido
						ng-model="recordData.descripcion">
					</bcs-input-texto>
					</div>	
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
	            		<label class="col-xs-4" translate>UI_ARCHIVO</label>
		            	<input class="col-xs-8" type="file" id="data" name="data" ng-model="recordData.file"></input>
					</div>
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
			  			<label class="col-xs-4" translate>UI_TIPO_PERSONA</label>
						<bcs-combobox-base
							class="col-xs-8" 
							tipo="'combobox-tipo-persona'"
							id-post-filtro = "tipoPersonaDefecto"
							id-actual = 'recordData.tipoPersona'
							bcs-requerido
							todos="'N'">
						</bcs-combobox-base>
			  		</div>
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
				  		<label class="col-xs-4" translate>UI_TIPO_CLIENTE_CMF</label>
						<bcs-combobox-base id="formCrearCrearCliente_tipoCliente_Cmf" 
							class="col-xs-8"
							id-defecto = "data.idTipoClienteCmf"
							id-actual = "recordData.tipoClienteCmf"
							tipo="'combobox-tipo-cliente-cmf'"
							seleccionado = "tipoClienteCMFSeleccionado"
							activado = "tipoClienteCmfEnabled"
							filtros="configData.filtroTipoClienteCMF.filtros">
						</bcs-combobox-base>
					</div>
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
	            		<label class="col-xs-4" translate>UI_ESTATICO</label>
		            	<input  type="checkbox" id="estatico" name="estatico" ng-model="recordData.estatico"></input>
		            	
					</div>
	            </div>
			</form>
		</div>
		
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formSubirCrearArchivo_subirArchivo" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_SUBIR' | translate" bcs-habilitado="formSubirArchivo.$valid" bcs-clic="subirArchivo()"></bcs-button>
	</div>
</div>

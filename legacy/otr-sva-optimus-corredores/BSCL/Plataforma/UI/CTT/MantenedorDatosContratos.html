<div id="MantenedorContratos" ng-controller="MantenedorContratosCtrl">
	<div class="col-xs-12">
		<div id="texto">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_RAZON_SOCIAL</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.RazonSocial"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_RUT</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.RUT"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_DIRECCION</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.Direccion"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_TELEFONO</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.Telefono"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_EMAIL</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.Email"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FAX</label>
					<bcs-input-texto class="col-xs-8" ng-model="data.Fax"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>APODERADO_CORREDORA_1</label>
					<bcs-combobox-base 
						class="col-xs-8"
						tipo="'combobox-relacionado'" 
						filtros="configuracion.FiltrosApoderado"
						seleccionado="data.PrimerApoderado"
						id-actual="data.IdPersonaApoderado1"
						id-defecto= "dataOriginal.IdPersonaApoderado1">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>APODERADO_CORREDORA_2</label>
					<bcs-combobox-base 
						class="col-xs-8"
						tipo="'combobox-relacionado'" 
						filtros="configuracion.FiltrosApoderado"
						seleccionado="data.SegundoApoderado"
						id-actual="data.IdPersonaApoderado2"
						id-defecto= "dataOriginal.IdPersonaApoderado2">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row bcs-panel-comandos">
				<bcs-button id="MantenedorDatosContratos_guardar" class="col-xs-2" id="" bcs-tipo="'principal'"
				bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
				bcs-habilitado="'true'" bcs-clic="guardar()"></bcs-button>
			</div>
		</div>	
	</div>
	
</div>

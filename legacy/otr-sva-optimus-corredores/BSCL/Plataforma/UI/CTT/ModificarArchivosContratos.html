<div class="col-xs-12" ng-controller="ModificarArchivosContratosCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form id="formModificarArchivo" name="formModificarArchivo" class="col-xs-12 form-horizontal">
				<div class="row">
			  		<label class="col-xs-4" translate>UI_CODIGO_ARCHIVO</label>
					<bcs-input-texto class="col-xs-8" solo-mayusculas="S" bcs-requerido
						ng-model="data.CodigoArchivo">
					</bcs-input-texto>	         
	            </div>
	            <div class="row"> 
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_DESCRIPCION</label>
						<bcs-input-texto class="col-xs-8" solo-mayusculas="S" bcs-requerido
						ng-model="data.Descripcion">
					</bcs-input-texto>
					</div>	
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
	            		<label class="col-xs-4" translate>UI_ARCHIVO</label>
		            	<input class="col-xs-8" type="file" id="data" name="data" ng-model="data.file"></input>
					</div>
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
			  			<label class="col-xs-4" translate>UI_TIPO_PERSONA</label>
						<bcs-combobox-base
							class="col-xs-8" 
							tipo="'combobox-tipo-persona'"
							id-defecto = "data.idTipoPersona"
							id-post-filtro = "tipoPersonaDefecto"
							id-actual = 'recordData.tipoPersona'
							todos="'N'">
						</bcs-combobox-base>
			  		</div>
	            </div>
	            <div class="row">
	            	<div class="col-xs-12">
				  		<label class="col-xs-4" translate>UI_TIPO_CLIENTE_CMF</label>
						<bcs-combobox-base id="formCrearCrearCliente_tipoCliente_Cmf" 
							class="col-xs-8"
							id-defecto = "data.idTipoClienteCMF"
							id-actual = "recordData.tipoClienteCMF"
							tipo="'combobox-tipo-cliente-cmf'"
							seleccionado = "tipoClienteCMFSeleccionado"
							activado = "tipoClienteCmfEnabled"
							filtros="configData.filtroTipoClienteCMF.filtros">
						</bcs-combobox-base>
					</div>
	            </div>
	            <div class="row">
			  		<label class="col-xs-4" translate>UI_ESTADO</label>
			  		<bcs-combobox-base class="col-xs-8"
					id-actual = 'data.Estado'	
					tipo="'combobox-estado-archivo-contrato'"
					todos="''"
					id-defecto="data.EstadoDefault">
					</bcs-combobox-base>
				</div>
	            <div class="row">
	            	<div class="col-xs-12">
	            		<label class="col-xs-4" translate>UI_ESTATICO</label>
		            	<input  type="checkbox" id="estatico" name="estatico" ng-model="data.estaticoDefault"></input>
		            	
					</div>
	            </div>
			</form>
		</div>
		
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formModificarArchivo_modificarArchivo" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="formModificarArchivo.$valid" bcs-clic="modificarArchivo()"></bcs-button>
	</div>
</div>

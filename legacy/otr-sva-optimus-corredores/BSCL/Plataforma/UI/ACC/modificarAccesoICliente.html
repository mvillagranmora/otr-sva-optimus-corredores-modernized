<div class="col-xs-12" ng-controller="modificarAccesoIClienteCtrl as macc">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form name="formModificarAcceso" class="col-xs-12 form-horizontal">	            
				<div class="row">
					<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-input-texto
		               	class			="col-xs-8"
		                id				="UI_CLIENTE"
		               	maxlength		="200"
						ng-model		="recordData.NombreCompletoClienteYRut"
						k-ng-disabled	= "'true'">
	               	</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
					<bcs-input-texto
		               	class			="col-xs-8"
		                id				="UI_PORTAFOLIO"
		               	maxlength		="200"
						ng-model		="recordData.CodigoPropositoPortafolio"
						k-ng-disabled	= "'true'">
	               	</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERSONA_AUTORIZADA</label>
					<bcs-input-texto
		               	class			="col-xs-8"
		                id				="UI_PERSONA_AUTORIZADA"
		               	maxlength		="200"
						ng-model		="recordData.NombreCompletoPersonaAut"
						k-ng-disabled	= "'true'">
	               	</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_FIRMANTE_OPTIMUS_CLIENTE</label>
					<bcs-input-checkbox
						class="col-xs-8"
						ng-model="recordData.FirmaOptimusCliente"
						ng-disabled	= "false">
					</bcs-input-checkbox>
			  	</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_PERFIL_OTORGADO</label>
					<bcs-combobox-base class="col-xs-8"
					    auto-cargar="'true'"
						tipo="data.oConfiguracionTipoPerfil.tipo"
						configuracion= "data.oConfiguracionTipoPerfil.configuracion"
						id-actual="recordData.IdTipoAutorizado"
						id-post-filtro="macc.IdTipoAutorizado"
						seleccionado="recordData.IdTipoAutorizadoNew"
						filtros="data.oConfiguracionTipoPerfil.filtros"
						bcs-requerido = "'true'"
						todos="N">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formModificarAccesoICliente" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="macc.IdTipoAutorizado !== recordData.IdTipoAutorizadoNew.IdTipoAutorizado || macc.FirmaOptimusCliente !== recordData.FirmaOptimusCliente" bcs-clic="modificarAcceso()"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>
						
	</div>
</div>

<div id="ConsultaUsuarios" ng-controller="ConsultaUsuariosCtrl">
	<div class="row">
		<div class="col-xs-10">
				<!-- Inicio filtros de búsqueda -->
					
				<div class="row">
					<div class="col-xs-8">
				  		<label class="col-xs-3" translate>UI_RAZON_SOCIAL_O_NOMBRE</label>
						<bcs-input-texto bcs-enter="buscar()" class="col-xs-9" ng-model="data.NombreCompleto"></bcs-input-texto>
					</div>
					<div class="col-xs-4">
				  		<label class="col-xs-2" translate>UI_ESTADO</label>
				  		<bcs-combobox-base  class="col-xs-10"
							auto-cargar="'true'"
							tipo="data.oConfiguracionEstadosUsuario.tipo"
							configuracion= "data.oConfiguracionEstadosUsuario.configuracion"
							id-actual="data.oConfiguracionEstadosUsuario.idActual"
							seleccionado="data.oConfiguracionEstadosUsuario.seleccionado"
							filtros="data.oConfiguracionEstadosUsuario.filtros"
							memoria= "" 
							todos="'S'"
							id-defecto="'0'"
							item-post-filtro="'1'">
						</bcs-combobox-base>
					</div>
			  	</div>
				
				<div class="row">
				  	<div class="col-xs-8">
				  		<label class="col-xs-3" translate>UI_NOMBRE_USUARIO</label>
				  		<bcs-input-texto bcs-enter="buscar()" class="col-xs-9" ng-model="data.NombreUsuario"></bcs-input-texto>
					</div> 
			  	</div>
				<!-- Fin filtros de búsqueda -->
		</div>
		<div class="col-xs-2">
			<!-- botones -->
			<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"  bcs-habilitado="true"  bcs-clic="buscar()"></bcs-button>
			<bcs-button class="row col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
		</div>
	</div>
	
	<div class="row">
		<bcs-grid id="grid-listado-usuarios"
		fn-exportar-excel = "exportarExcel"
	 	configuracion = "confBasicaConsultaUsuarios"
		seleccionado = "seleccionDetalleUsuarios"
		fn-doble-click = "modificarUsuario()">
			<div bcs-grid-detail ng-non-bindable >
			<div style="width:30%;">
              	<uib-tabset>
                  	<uib-tab heading="{{'UI_ROLES_PERMISOS' | translate}}">
                  		<bcs-grid
                            configuracion = "confBasicaRolesPermisosUsuario(dataItem)"
                            seleccionado = "seleccionRolesPermisosUsuario">
						</bcs-grid>
                  	</uib-tab>
				</uib-tabset>
				</div>
			</div>
		</bcs-grid>
	</div>

 	
	<div class="row bcs-panel-comandos">
		<bcs-button id="ConsultaUsuarios_crearUsuario"  class="col-xs-2" bcs-tipo="'bcs-button-primary'"  bcs-auto-desactivar="false" bcs-texto="'UI_CREAR' | translate" bcs-habilitado="'true'"  bcs-clic="crearUsuario()"></bcs-button>
		<bcs-button id="ConsultaUsuarios_modificarUsuario" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="'false'"  bcs-clic="modificarUsuario()"></bcs-button>
		<bcs-button id="ConsultaUsuarios_modificarRolesUsuario"  class="col-xs-2" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_ADD_ROL' | translate" bcs-habilitado="'true'"  bcs-clic="modificarRolesUsuario()"></bcs-button>
		<div class="col-xs-4"></div>
		<bcs-menu class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
            <li ng-click="crearUsuarioBolsa()">{{'UI_CREAR_USUARIO_BOLSA' | translate}}</li>
		</bcs-menu>
	</div>
		
			
	
	
</div>

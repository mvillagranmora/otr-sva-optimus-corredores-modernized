<div id="CrearPerfil" class="col-xs-12" ng-controller="CrearPerfilCtrl">
 <div class="row bcs_titulo">
        <div class="col-xs-12">
            <span>{{'UI_CREAR_PERFIL'|translate}}</span>
        </div>
    </div>
    <div class="bcs-cuerpo">
		<div class="row">
			<form name="formCrearPerfil" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_PERFIL</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="recordData.nombrePerfil.trim()!=''"
						ng-model="recordData.nombrePerfil">
					</bcs-input-texto>	
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8" bcs-requerido="recordData.estado!='false'"
						id-actual = 'recordData.estado'	
						tipo="'combobox-estado-perfil'"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="CrearPerfil_crePerfil" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_CREAR_PERFIL' | translate" bcs-habilitado="formCrearPerfil.$valid" bcs-clic="crearPerfil()"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="formCrearPerfil.$valid" bcs-clic="cancelar()"></bcs-button>	
	</div>
</div>

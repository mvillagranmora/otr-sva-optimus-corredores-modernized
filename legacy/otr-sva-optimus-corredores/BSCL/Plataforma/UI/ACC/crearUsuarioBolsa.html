<div class="col-xs-12" ng-controller="CrearUsuarioBolsaCtrl">
    <div class="bcs-cuerpo">

		<div class="row">
			<form name="formCrearUsuario" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_USUARIO</label>
					<bcs-input-texto class="col-xs-8" solo-mayusculas="S" bcs-requerido="recordData.tipoPersona.trim()!=''"
						k-ng-disabled='(configData.bloqueoUsuario)'
						ng-model="recordData.nombreUsuario">
					</bcs-input-texto>	
				</div>
				
				<div class="row" >
					<label class="col-xs-4" translate>UI_CLAVE</label>
					<bcs-input-password class="col-xs-8" bcs-requerido
						k-ng-disabled='(configData.bloqueoUsuario)'
						ng-model="recordData.clave">
					</bcs-input-password>
				</div>
				<div class="row" >
					<label class="col-xs-4" translate>UI_CONFIRMACION_CLAVE</label>
					<bcs-input-password class="col-xs-8"
						k-ng-disabled='(configData.bloqueoUsuario)'
						ng-model="recordData.confirmacionClave">
					</bcs-input-password>
				</div>
				<div class="row" ng-hide="configData.clavesIguales">
					<div class="col-xs-4"></div>	
					<label class="col-xs-8" style="color:red;" translate>UI_CLAVES_NO_IGUALES</label>
				</div>
				
				<div class="row" ng-show="SesionLocale === 'PE'">
                    <label class="col-xs-4" translate>UI_HEREDAR_ROLES_USUARIO</label>
                    <bcs-combobox-base class="col-xs-8" 
                        bcs-requerido="'false'"
                        activado='!configData.bloqueoUsuario'
                        id-actual = 'recordData.heredarRolesUsuario' 
                        tipo="'combobox-usuario'"
                        filtros="data.oHeredarRolesUsuario.filtros"
                        todos="N">
                    </bcs-combobox-base>
                </div>
                <div class="row">
					<div class="row"> 
						<label class="col-xs-4"translate>UI_USUARIO_CORREDORES</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="recordData.usuarioCorredores" ng-disabled="configData.bloqueoUsuario"></bcs-input-checkbox>
					</div>
					<div class="row"> 
						<label class="col-xs-4" translate>UI_USUARIO_NEGOCIOS</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="recordData.usuarioNegocios" ng-disabled="configData.bloqueoUsuario"></bcs-input-checkbox>
					</div>
				</div>
				
				<div class="row" >
					<label class="col-xs-4" translate>UI_FECHA_VIGENCIA</label>
					<div class="col-xs-8">
						<bcs-input-date class="col-xs-8" bcs-requerido="!recordData.indefinido"
							k-ng-disabled="(configData.bloqueoUsuario) || recordData.indefinido"
							k-ng-model = "recordData.fechaVigencia">
						</bcs-input-date>
						<div class="col-xs-4">
							<label class="col-xs-8" style="padding:2px" translate>UI_INDEFINIDO</label>
							<bcs-input-checkbox class="col-xs-2" ng-model="recordData.indefinido" ng-disabled='(configData.bloqueoUsuario)'></bcs-input-checkbox>
						</div>
					</div>
				</div>
				
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8" bcs-requerido="recordData.estado!='false'"
						activado='(!configData.bloqueoUsuario)'
						id-actual = 'recordData.estado'	
						tipo="'combobox-estado-usuario'"
						item-post-filtro="'1'"
						todos="N">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formCrearUsuario_crearUsuario" class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_CREAR_USUARIO' | translate" bcs-habilitado="formCrearUsuario.$valid && (configData.bloqueoUsuario==false) && configData.clavesIguales" bcs-clic="crearUsuario()"></bcs-button>
		<bcs-button class="col-xs-2" bcs-tipo="''"  		bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado='(!configData.bloqueoUsuario)' bcs-clic="cancelar()"></bcs-button>
						
	</div>
</div>

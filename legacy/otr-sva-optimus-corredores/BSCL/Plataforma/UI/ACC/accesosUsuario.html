<div ng-controller="ConsultarAccesosUsuarioCtrl">
	
	<div class="row">
		<div class="col-xs-10">
			<!-- Inicio filtros de búsqueda -->
			<div class="row">
				<div class="col-xs-12">
			  		<label class="col-xs-2" translate>UI_ACCESO</label>
			  		<bcs-combobox-base class="col-xs-10"
					id-actual = 'data.estado'	
					tipo="'combobox-accesos'"
					todos="'S'"
					id-defecto="''"
					item-post-filtro="data.idEstado">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">	
			<!-- botones -->
			<bcs-button class="row col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"  bcs-habilitado="true"  bcs-clic="buscar()"></bcs-button>
		</div>
	</div>
	
	<div class="row">
		<bcs-grid id="grid-accesos-usuarios"
	 	configuracion = "confGridAccesosUsuarios"
		seleccionado = "seleccionAccesosUsuarios"
		fn-exportar-excel = "exportarExcel">
		</bcs-grid>
	</div>

 	
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_EXPORTAR_EXCEL' | translate" bcs-habilitado="'true'"  bcs-clic="exportarExcel()"></bcs-button>
	</div>
	
</div>

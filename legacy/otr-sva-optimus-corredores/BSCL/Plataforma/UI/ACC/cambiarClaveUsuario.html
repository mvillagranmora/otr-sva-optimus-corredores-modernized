<div id="CambiarClaveUsuario" class="col-xs-12" ng-controller="CambioClaveUsuarioCtrl">
    <div class="bcs-cuerpo">
        <div class="row">
            <form name="formCambioClave" class="col-xs-12 form-horizontal">
                <div class="row">
                    <label class="col-xs-4" translate>UI_NOMBRE_USUARIO</label>
                    <bcs-input-texto class="col-xs-8"
                        k-ng-disabled='true'
                        ng-model="SesionUsuario">
                    </bcs-input-texto>  
                </div>
                <div class="row" >
                    <label class="col-xs-4" translate>UI_CLAVE_ACTUAL</label>
                    <bcs-input-password class="col-xs-8" ng-class="{'invalid-bcs-required': data.claveActual.trim()==''}" bcs-requerido="data.claveActual.trim()!=''"
                        ng-model="data.claveActual">
                    </bcs-input-password>
                </div>
                <div class="row" >
                    <label class="col-xs-4" translate>UI_CLAVE_NUEVA</label>
                    <bcs-input-password class="col-xs-8" ng-class="{'invalid-bcs-required': data.clave.trim()==''}" bcs-requerido="data.clave.trim()!=''"
                        ng-model="data.clave">
                    </bcs-input-password>
                </div>
                <div class="row" >
                    <label class="col-xs-4" translate>UI_CONFIRMACION_CLAVE</label>
                    <bcs-input-password class="col-xs-8" ng-class="{'invalid-bcs-required': data.confirmacionClave.trim()==''}" bcs-requerido="data.confirmacionClave.trim()!=''"
                        ng-model="data.confirmacionClave">
                    </bcs-input-password>
                </div>
                <div class="row bcs-panel-comandos alignButtonsToRight">
                    <bcs-button id="formCambioClave_cambiarClave" class="col-xs-3 " bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="isButtonEnabled" bcs-clic="cambiarClave()"></bcs-button>           
                </div>
                <div class="row" ng-show="'true'">
                    <div class="col-xs-4"></div>    
                    <label class="col-xs-8" style="color:red;" translate>{{configData.SonIguales}}</label>
                </div>
                <div class="row"  ng-show ="configData.Mensajes.length>0" wi>
                    <div class="col-xs-4 col-lg-4 " ></div>
                     <alert  type="danger" >
                        <table class="table" >
                            <tr ng-repeat="(keyItem, valItem) in configData.Mensajes">                          
                                    <td style="color:red;" >{{valItem.descripcion}}</td>
                            </tr>
                        </table>
                     </alert>
                </div>              
                
                <div class="row" ng-show="parametros.mensaje==undefined">
                    <label class="col-xs-12" style="color:red;">{{parametros.mensaje}}</label>
                </div>
            </form>
        </div>
    </div>  
</div>

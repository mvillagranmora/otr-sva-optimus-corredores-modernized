<div class="row" ng-controller='RolesModalCtrl'>
	<!--- INICIO FORMULARIO -->
	<form class="col-xs-12 form-horizontal">
		<div class="row" style="min-height:100px">
			<table class="table">
			<thead>
				<tr>
					<th translate>UI_OPERACION</th>
					<th translate>UI_RESULTADO</th>
					<th translate>UI_MENSAJES</th>
				</tr>
			</thead>
			<tbody>
				<tr ng-repeat="rolData in data">
					<td>{{rolData.operacion}}</td>
					<td>{{rolData.resultado | translate}}</td>
					<td style="max-width:200px">
						<div ng-repeat="mensaje in rolData.Mensajes">
							<div class="{{mensaje.cssClass}}">{{mensaje.text}}</div>
						</div>
					</td>
				</tr>
			</tbody>
			</table>
		</div>
		<div class="row bcs-panel-comandos">
			<bcs-button bcs-habilitado="confirmarHabilitado" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="true" bcs-texto="'UI_CONFIRMAR' | translate" bcs-clic="confirmarOperacion()"></bcs-button>
			<bcs-button bcs-habilitado="'true'" class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
		</div>
	</form>
	<!--- TERMINO FORMULARIO -->
</div>
<style>
	.alert{padding:0px; width:100%;}
</style>

<div id="ModificarRoles" ng-controller="ModificarRolesCtrl">
	<div class="row">
			<form name="formCrearRol" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_ROL</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.nombreRol.trim()!=''"
						ng-model="data.nombreRol">
					</bcs-input-texto>	
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base  class="col-xs-8"
							auto-cargar="'true'"
							tipo="data.oConfiguracionEstadoRoles.tipo"
							configuracion= "data.oConfiguracionEstadoRoles.configuracion"
							id-defecto = "data.idEstado"
							id-actual="data.oConfiguracionEstadoRoles.idActual"
							seleccionado="data.oConfiguracionEstadoRoles.seleccionado"
							filtros="data.oConfiguracionEstadoRoles.filtros"
							memoria= "" 
							todos="'N'"
							item-post-filtro="data.idEstado">	
						</bcs-combobox-base>
				</div>
				<div class="row">
					<bcs-button id="ModificarRoles_actualizarRol" bcs-tipo="'bcs-button-input-form'" class="col-xs-2 pull-right"  bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="true"  bcs-clic="actualizarRol()"></bcs-button>
				</div>
				<hr>
				<div class="row">
					<div class="col-xs-5" style="font-size:12px;">
						Perfil Disponibles
					</div>
					<div class="col-xs-2"></div>
					<div class="col-xs-5" style="font-size:12px;">
						Perfiles Actuales
					</div>
				</div>
				<div class="row">
					<div class="col-xs-5">
						<bcs-grid id="grid-perfiles-all"
					 	configuracion = "confBasicaPerfiles"
						seleccionado = "seleccionPerfiles"> 
						</bcs-grid>
					</div>
					<div class="col-xs-2">
						<div class="row">
							<bcs-button id="ModificarRoles_asignarRol" class="col-xs-12" bcs-tipo="'bcs-button-input-form'"  bcs-auto-desactivar="false" bcs-texto="'UI_ADD_PERFIL' | translate" bcs-habilitado="true"  bcs-clic="addPerfil()"></bcs-button>
						</div>
						<div class="row">
							<bcs-button id="ModificarRoles_quitarRol" class="col-xs-12" bcs-tipo="'bcs-button-input-form'"  bcs-auto-desactivar="false" bcs-texto="'UI_DEL_PERFIL' | translate" bcs-habilitado="true"  bcs-clic="removePerfil()"></bcs-button>
						</div>
					</div>
					<div class="col-xs-5">
						<bcs-grid id="grid-perfiles-roles"
					 	configuracion = "confBasicaPerfilesRol"
						seleccionado = "seleccionPerfilesRol">
						</bcs-grid>
					</div>
				</div>
				<br>
				<div class="row">
					<div class="col-xs-12" style="font-size:12px;">
						Accesos Actuales
					</div>
				</div>
				<div class="row">
					<div class="col-xs-12">
						<bcs-grid id="grid-accesos-perfil"
					 	configuracion = "confBasicaAccesosPerfil"
						seleccionado = "seleccionAccesosPerfil">
						</bcs-grid>
					</div>
				</div>
			</form>
		</div>
</div>

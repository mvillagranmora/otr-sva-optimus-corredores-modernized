<div id="CrearRol" class="col-xs-12" ng-controller="CrearRolCtrl">
    <div class="bcs-cuerpo">
		<div class="row">
			<form name="formCrearRol" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_ROL</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="recordData.nombreRol.trim()!=''"
						ng-model="recordData.nombreRol">
					</bcs-input-texto>	
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8" bcs-requerido="recordData.estado!='false'"
						id-actual = 'recordData.estado'	
						tipo="'combobox-estado-rol'"
						todos="'N'">
					</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="CrearRol_crearRol" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_CREAR_ROL' | translate" bcs-habilitado="formCrearRol.$valid" bcs-clic="crearRol()"></bcs-button>
		<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="formCrearRol.$valid" bcs-clic="cancelar()"></bcs-button>	
	</div>
</div>

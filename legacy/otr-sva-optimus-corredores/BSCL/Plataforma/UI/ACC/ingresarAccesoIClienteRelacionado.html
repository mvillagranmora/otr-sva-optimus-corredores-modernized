<div class="col-xs-12" ng-controller="ingresarAccesoIClienteRelacionadoCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form name="formCrearAcceso" class="col-xs-12 form-horizontal">	            
	            <div class="row">
		            <div class="col-xs-12">
						<label class="col-xs-4" translate>UI_PERSONA_ENTREGA_ACCESO</label>
						<bcs-combobox-base class="col-xs-8"   
						 	id="UI_SOCIO_NEGOCIO"
						 	auto-cargar="'true'"
						    tipo="'combobox-socio-negocio'" 
						    id-actual="data.Relacion.IdPersona"
							id-defecto="data.RelacionOriginal.IdPersona" 
							todos="'N'" 
						    bcs-requerido = "'true'"
						    configuracion= "data.oConfiguracionSocioNegocio.configuracion"
						    filtros="data.oConfiguracionSocioNegocio.filtros"
						    seleccionado="data.ClienteObj">
						</bcs-combobox-base>
					</div>
				</div>
				
				<div class="row">
					<label class="col-xs-4" translate>UI_PERFIL_OTORGADO</label>
					<bcs-combobox-base class="col-xs-8"
					    auto-cargar="'true'"
						tipo="data.oConfiguracionTipoPerfil.tipo"
						configuracion= "data.oConfiguracionTipoPerfil.configuracion"
						id-actual="data.oConfiguracionTipoPerfil.idActual"
						seleccionado="data.PerfilObj"
						filtros="data.oConfiguracionTipoPerfil.filtros"
						bcs-requerido = "'true'"
						todos="N">
					</bcs-combobox-base>
				</div>
				
				<div class="row">
					<label class="col-xs-4" translate>UI_FIRMANTE_OPTIMUS_CLIENTE</label>
					<bcs-input-checkbox
						class="col-xs-8"
						ng-model="data.FirmaOptimusCliente">
					</bcs-input-checkbox>
			  	</div>
			  	
				<div class="row"> 
					<label class="col-xs-4" translate>UI_PERSONA_AUTORIZADA</label>
					<bcs-combobox-base class="col-xs-8"
						auto-cargar="'false'"
					    tipo="'combobox-relacionado'"
					    id-actual="data.conf.oConfiguracionRelacionado.idActual"
					    bcs-requerido = "'true'"
					    filtros="data.conf.oConfiguracionRelacionados.filtros"
					    seleccionado="data.RelacionadoObj">
					</bcs-combobox-base>
				</div>
				
				<div class="row">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
					<bcs-combobox-base class="col-xs-8"
						auto-cargar="'false'"
						id-actual = 'recordData.estado'	
						tipo="'combobox-portafolio'"
						todos="N"
						bcs-requerido = "'true'"
						filtros="data.conf.oConfiguracionPortafolio.filtros"
						seleccionado="data.PortafolioObj">
					</bcs-combobox-base>
				</div>
		
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="formCrearAcceso_crearUsuario" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_CREAR_ACCESO' | translate" bcs-habilitado="formCrearAcceso.$valid" bcs-clic="crearAcceso()"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>
						
	</div>
</div>

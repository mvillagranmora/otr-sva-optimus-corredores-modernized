<div id="ModificarRolesUsuario" ng-controller="ModificarRolesUsuarioCtrl">
	<div class="row">
		<div class="col-xs-5" style="font-size:12px;">
			Roles Disponibles
		</div>
		<div class="col-xs-2"></div>
		<div class="col-xs-5" style="font-size:12px;">
			Roles Actuales
		</div>
	</div>
	<div class="row">
		<div class="col-xs-5">
			<bcs-grid id="grid-roles-all"
		 	configuracion = "confBasicaRoles"
			seleccionado = "seleccionRoles"> 
			</bcs-grid>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button id="ModificarRolesUsuario_asignarRolUsuario" class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_ADD_ROL' | translate" bcs-habilitado="true"  bcs-clic="addRol()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button id="ModificarRolesUsuario_quitarRolUsuario" class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_DEL_ROL' | translate" bcs-habilitado="true"  bcs-clic="removeRol()"></bcs-button>
			</div>
		</div>
		<div class="col-xs-5">
			<bcs-grid id="grid-roles-usuario"
		 	configuracion = "confBasicaRolesUsuario"
			seleccionado = "seleccionRolesUsuario">
			</bcs-grid>
		</div>
	</div>
	<br>
	<div class="row">
		<div class="col-xs-12" style="font-size:12px;">
			Perfiles Actuales
		</div>
	</div>
	<div class="row">
		<div class="col-xs-12">
			<bcs-grid id="grid-perfiles-usuario"
		 	configuracion = "confBasicaPerfilesUsuario"
			seleccionado = "seleccionPerfilesUsuario">
			</bcs-grid>
		</div>
	</div>

</div>

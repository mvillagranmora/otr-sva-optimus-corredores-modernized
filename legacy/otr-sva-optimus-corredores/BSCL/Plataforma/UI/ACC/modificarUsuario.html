<div class="col-xs-12" ng-controller="ModificarUsuarioCtrl">
    <div class="bcs-cuerpo">
		<div class="row">
			<form name="formModificarUsuario" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_USUARIO</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="recordData.nombreUsuario.trim()!=''"
						k-ng-disabled='true'
						ng-model="recordData.nombreUsuario">
					</bcs-input-texto>	
				</div>
				<div class="row" >
					<label class="col-xs-4" translate>UI_CLAVE</label>
					<bcs-input-password class="col-xs-8"
						ng-model="recordData.clave">
					</bcs-input-password>
				</div>
				<div class="row" >
					<label class="col-xs-4" translate>UI_CONFIRMACION_CLAVE</label>
					<bcs-input-password class="col-xs-8"
						ng-model="recordData.confirmacionClave">
					</bcs-input-password>
				</div>
				<div class="row" ng-hide="configData.clavesIguales">
					<div class="col-xs-4"></div>	
					<label class="col-xs-8" style="color:red;" translate>UI_CLAVES_NO_IGUALES</label>
				</div>
				<div class="row" ng-if="SesionLocale === 'PE'" >
				
                    <label class="col-xs-4" translate>UI_HEREDAR_ROLES_USUARIO</label>
                    <bcs-combobox-base class="col-xs-8" 
                        bcs-requerido  ="'false'"
                        activado       ='!configData.bloqueoUsuario'
                        auto-cargar	   = "'false'"
                        id-actual      = 'recordData.heredarRolesUsuario' 
                        tipo           ="'combobox-usuario'"
                        filtros        ="data.oHeredarRolesUsuario.filtros"
                        todos		   ="N"
                       >
                    </bcs-combobox-base>
                </div>
                
                <div class="row">
					<div class="row"> 
						<label class="col-xs-4"translate>UI_USUARIO_CORREDORES</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="recordData.usuarioCorredores" ng-disabled="configData.bloqueoUsuario"></bcs-input-checkbox>
					</div>
					<div class="row"> 
						<label class="col-xs-4" translate>UI_USUARIO_NEGOCIOS</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="recordData.usuarioNegocios" ng-disabled="configData.bloqueoUsuario"></bcs-input-checkbox>
					</div>
					<div class="row"> 
						<label class="col-xs-4" translate>UI_USUARIO_CLIENTES</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="recordData.usuarioClientes" ng-disabled="configData.bloqueoUsuarioClientes"></bcs-input-checkbox>
					</div>
					<div class="row"> 
						<label class="col-xs-4" translate>UI_USUARIO_SERVICIOS</label>
						<bcs-input-checkbox class="col-xs-2" ng-model="recordData.usuarioServicios" ng-disabled="configData.bloqueoUsuario"></bcs-input-checkbox>
					</div>
				</div>

				<div class="row" >
					<label class="col-xs-4" translate>UI_FECHA_VIGENCIA</label>
					<div class="col-xs-8">
						<bcs-input-date class="col-xs-8 " bcs-requerido="!recordData.indefinido"
							k-ng-disabled="recordData.indefinido"
							k-ng-model = "recordData.fechaVigencia">
						</bcs-input-date>
						<div class="col-xs-4">
							<label class="col-xs-8" style="padding:2px"translate>UI_INDEFINIDO</label>
							<bcs-input-checkbox class="col-xs-2" ng-model="recordData.indefinido"></bcs-input-checkbox>
						</div>
					</div>	
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-8" bcs-requerido="recordData.estado!='false'"
						id-actual = 'recordData.estado'	
						tipo="'combobox-estado-usuario'"
						todos="''"
						item-post-filtro="recordData.idEstado">
					</bcs-combobox-base>
				</div>
				<div class="row" ng-show="recordData.estado === 'BLO'">
						<div class="row">
							<label class="col-xs-4" translate>UI_TIPO_BLOQUEO</label>
							<bcs-combobox-base 
								bcs-requerido="recordData.estado === 'BLO'"
								class="col-xs-8"
								filtros="data.BloqueoSocioDeNegocio.filtros"
								id-defecto="recordData.idTipoBloqueo"
								seleccionado="recordData.tipoBloqueoSeleccionado"
								tipo="'combobox-tipo-bloqueo-socio-negocio'"
							></bcs-combobox-base>
						</div>  
						<div class="row">
							<label class="col-xs-4" translate>UI_COMENTARIO_BLOQUEO</label>       
							<bcs-input-texto
								atributos="margin: 0px; height: 53px; resize: vertical; overflow: auto; width: 100%;"
								class="col-xs-8"
								id="recordData.tipoBloqueoSeleccionado"
								maxlength="520"
								ng-model="recordData.comentarioPorDefecto"
								soloMayusculas
								tipo-campo="'textarea'"
							></bcs-input-texto>
						</div>
				</div>
				<div class="row" ng-hide="!configData.usuarioBloqueadoTemporal">	
					<label style="color:red;" translate>UI_USUARIO_BLOQUEADO_TEMPORALMENTE</label>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">

		<bcs-button id="formModificarUsuario_desbloqueoTemporalUsuario"class="col-xs-5" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_DESBLOQUEO_TEMPORAL' | translate" bcs-habilitado="configData.usuarioBloqueadoTemporal" bcs-clic="eliminarBloqueoTemporal()"></bcs-button>

		<bcs-button id="formModificarUsuario_modificarUsuario" class="col-xs-4" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="formModificarUsuario.$valid && !configData.bloqueoBtnModUs && configData.clavesIguales" bcs-clic="modificarUsuario()"></bcs-button>
						
	</div>
</div>

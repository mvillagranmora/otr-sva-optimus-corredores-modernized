<div>
	<div class="col-xs-12">
		<div class="row">
			<bcs-grid 
				configuracion="grilla.grillaLineaSobregiro"
				seleccionado="grilla.lineaSobregiroSel"
				fn-doble-click="win.modificar(grilla.lineaSobregiroSel)">
			</bcs-grid>
		</div>
		<div class="row bcs-panel-comandos">
			<div class="col-xs-8">
				<div class="row">
					<bcs-button id="LineaSobregiro_crear" class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
						bcs-texto="'UI_NUEVA_LINEA_SOBREGIRO' | translate" bcs-habilitado="'true'" bcs-clic="win.crear()">
					</bcs-button>
					<bcs-button id="LineaSobregiro_editar" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" 
						bcs-texto="'UI_EDITAR' | translate" bcs-habilitado="grilla.lineaSobregiroSel !== undefined && grilla.lineaSobregiroSel.IdEstado !== 'PEN'" bcs-clic="win.modificar(grilla.lineaSobregiroSel)">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
</div>

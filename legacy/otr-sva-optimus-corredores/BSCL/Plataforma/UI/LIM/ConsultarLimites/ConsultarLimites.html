<div id="ConsultarLimites" ng-controller="ConsultarLimitesCtrl as cLim">

		<div class="col-xs-12">

				<uib-tab id="TabCliente" heading="{{'UI_CLIENTE' | translate}}" select="cLim.fnTabLimitesCliente()">

						<div id="PanelLimitesCliente" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabCuentaPropia" heading="{{'UI_CUENTA_PROPIA' | translate}}" select="cLim.fnTabLimitesCuentaPropia()">

				<uib-tab id="TabEvaluacionLimites" heading="{{'UI_EVALUACION_LIMITES' | translate}}" select="cLim.fnTabEvaluacionLimites()">

						<div id="PanelEvaluacionLimites" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				<uib-tab id="TabAgente" heading="{{'UI_AGENTE' | translate}}" select="cLim.fnTabLimitesAgente()">

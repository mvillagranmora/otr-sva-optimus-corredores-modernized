<div id="PanelLimitesAgente" class="row" ng-controller="PanelLimitesAgenteCtrl as pLAG">
    <!-- INICIO FILTROS -->
    <div class="row">
        <div class="col-xs-10">
            <div class="row">
               <div class="col-xs-6">
					<label class="col-xs-3" translate>UI_AGENTE</label>
					<bcs-combobox-base class="col-xs-7"
						tipo="'combobox-empleado'"
						id-actual="pLAG.filtro.IdEmpleado"
						activado="true"
						filtros="pLAG.cmbbx.Agente.filtros"
						configuracion="pLAG.cmbbx.Agente.configuracion"
						seleccionado="pLAG.dataModal.AgenteObj">
					</bcs-combobox-base>
				</div>
                <div class="col-xs-6">
                    <label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
                    <bcs-combobox-base class="col-xs-7"
                        tipo="'combobox-tipo-instrumento'"
                        id-actual="pLAG.filtro.IdTipoInstrumento"
                        id-post-filtro="pLAG.filtro.IdTipoInstrumentoDef"
                        filtros="pLAG.cmbbx.TipoInstrumento.filtros"
                        todos="'S'"
                        seleccionado="pLAG.dataModal.TipoInstrumentoObj">
                    </bcs-combobox-base>
                </div>
            </div>
        </div>
        <div class="col-xs-2">
            <div class="row">
                <bcs-button class="col-xs-12" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pLAG.fn.buscar()"></bcs-button>
            </div>
            <div class="row">
                <bcs-button class="col-xs-12" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pLAG.fn.limpiar()"></bcs-button>
            </div>
        </div>
    </div>
        
    <div class="row">
        <bcs-grid
            configuracion="pLAG.grilla.LimitesAgente"
            seleccionado="pLAG.grilla.limiteSel"
            fn-exportar-excel="exportarExcel">
        </bcs-grid>
    </div>
    <div class="row bcs-panel-comandos">
        <bcs-button class="col-xs-1" bcs-tipo="''" bcs-auto-desactivar="false" 
            bcs-texto="'UI_EXPORTAR' | translate" bcs-habilitado="true" bcs-clic="exportarExcel('LimitesAgente')">
        </bcs-button>
    </div>
</div>

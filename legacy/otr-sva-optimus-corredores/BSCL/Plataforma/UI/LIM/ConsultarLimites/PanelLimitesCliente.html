<div id="PanelLimitesCliente" class="row" ng-controller="PanelLimitesClienteCtrl as pLC">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
                       <label translate class="col-xs-3">UI_CLIENTE_PORTAFOLIO</label>
                       <bcs-combobox-base class="col-xs-8"
                         tipo="'combobox-cliente-portafolio'"
                         filtros="filtrosPortafolio"
                         muestra-enlace = "'N'"       
                         id-actual = "pLC.filtro.IdPortafolio"
                         seleccionado = "pLC.dataModal.ClientePortafolioObj">
                    </bcs-combobox-base >
                 </div>
				<div class="col-xs-6">
			  		<label class="col-xs-2" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-clasificacion-tipo-instrumento'"
						id-actual="pLC.filtro.IdClasificacionTipoInstrumento"
						id-defecto="pLC.filtro.IdClasificacionTipoInstrumentoDef"
						filtros="pLC.cmbbx.ClasificacionTipoInstrumento.filtros"
						todos="'S'"
						seleccionado="pLC.dataModal.ClasificacionTipoInstrumentoObj"
						cascada1-a="pLC.cmbbx.TipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
				</div>
		  	</div>
		  	<div class="row">
				<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-tipo-instrumento'"
						id-actual="pLC.filtro.IdTipoInstrumento"
						id-post-filtro="pLC.filtro.IdTipoInstrumentoDef"
						filtros="pLC.cmbbx.TipoInstrumento.filtros"
						todos="'S'"
						seleccionado="pLC.dataModal.TipoInstrumentoObj">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pLC.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pLC.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			configuracion="pLC.grilla.LimitesCliente"
			seleccionado="pLC.grilla.limiteSel"
			fn-exportar-excel="exportarExcel">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-1" bcs-tipo="''" bcs-auto-desactivar="false" 
			bcs-texto="'UI_EXPORTAR' | translate" bcs-habilitado="true" bcs-clic="exportarExcel('LimitesCliente')">
		</bcs-button>
	</div>
</div>

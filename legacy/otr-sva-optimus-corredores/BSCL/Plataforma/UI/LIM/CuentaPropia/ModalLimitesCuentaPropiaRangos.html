<div id="ModalLimitesCuentaPropiaRangos" class="row" ng-controller="ModalLimitesCuentaPropiaRangosCtrl as mlCPR">
	<div class="row">
		<form name="ModalLimitesCuentaPropiaRangos" class="col-xs-12">
			<div class="row" style="margin-bottom:10px;">
				<div class="col-xs-10">
					<label translate>UI_MONTOS_EXPRESADOS_EN</label>: <label>{{mlCPR.respuesta.Moneda}}</label>
				</div>
			</div>
			<div class="row">
				<label class="col-xs-5" translate>UI_MONTO_DESDE</label>
				<bcs-input-numero class="col-xs-7"
					k-ng-model="mlCPR.respuesta.MontoDesde" 
					k-ng-disabled="mlCPR.win.modoEditar"
					bcs-requerido="!mlCPR.win.modoEditar"
					decimales="(mlCPR.respuesta.IdMoneda === 'CLP') ? 0 : mlCPR.win.MontoDecimal">
				</bcs-input-numero>
			</div>
			<div class="row" style="margin-bottom:15px;">
				<label class="col-xs-5" translate>UI_MONTO_HASTA</label>
				<bcs-input-numero class="col-xs-7"
					k-ng-model="mlCPR.respuesta.MontoHasta" 
					k-ng-disabled="mlCPR.win.modoEditar"
					bcs-requerido="!mlCPR.win.modoEditar"
					decimales="(mlCPR.respuesta.IdMoneda === 'CLP') ? 0 : mlCPR.win.MontoDecimal">
				</bcs-input-numero>
			</div>
			
			<div class="row">
				<label class="col-xs-5" translate>UI_PLAZO_DESDE</label>
				<bcs-input-numero class="col-xs-7"
					k-ng-model="mlCPR.respuesta.PlazoDesde" 
					k-ng-disabled="mlCPR.win.modoEditar"
					bcs-requerido="!mlCPR.win.modoEditar"
					decimales="0">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-5" translate>UI_PLAZO_HASTA</label>
				<bcs-input-numero class="col-xs-7"
					k-ng-model="mlCPR.respuesta.PlazoHasta" 
					k-ng-disabled="mlCPR.win.modoEditar"
					bcs-requerido="!mlCPR.win.modoEditar"
					decimales="0">
				</bcs-input-numero>
			</div>
			
			<br>
			<div class="row" style="margin-bottom:20px;">
				<label class="col-xs-5" translate>UI_TASA</label>
				<bcs-input-numero class="col-xs-7" 
					k-ng-model="mlCPR.respuesta.Tasa"
					bcs-requerido 
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
			</div>
			
			<div class="row" style="text-align:center;">
				<div class="col-xs-9">&nbsp;</div>
				<label class="col-xs-3" translate>UI_TASA_FINAL</label>
			</div>
			<div class="row">
				<label class="col-xs-5" translate>UI_PIB_MENOS</label>
				<bcs-input-numero class="col-xs-3"
					k-ng-model="mlCPR.respuesta.PuntosTasaMenos" 
					bcs-requerido
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
				<div class="col-xs-1"></div>
				<bcs-input-numero class="col-xs-3"
					k-ng-model="mlCPR.respuesta.TasaFinalMenos"
					k-ng-disabled="'true'"
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
			</div>
			<div class="row" style="margin-bottom:15px;">
				<label class="col-xs-5" translate>UI_PIB_MAS</label>
				<bcs-input-numero class="col-xs-3" 
					k-ng-model="mlCPR.respuesta.PuntosTasaMas" 
					bcs-requerido
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
				<div class="col-xs-1"></div>
				<bcs-input-numero class="col-xs-3"
					k-ng-model="mlCPR.respuesta.TasaFinalMas"
					k-ng-disabled="'true'"
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
			</div>
			
			<div class="row">
				<label class="col-xs-5" translate>UI_PIB_AGENTE_MENOS</label>
				<bcs-input-numero class="col-xs-3" 
					k-ng-model="mlCPR.respuesta.PuntosTasaMenosAgente" 
					bcs-requerido
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
				<div class="col-xs-1"></div>
				<bcs-input-numero class="col-xs-3" 
					k-ng-model="mlCPR.respuesta.TasaFinalMenosAgente"
					k-ng-disabled="'true'"
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-5" translate>UI_PIB_AGENTE_MAS</label>
				<bcs-input-numero class="col-xs-3" 
					k-ng-model="mlCPR.respuesta.PuntosTasaMasAgente" 
					bcs-requerido
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
				<div class="col-xs-1"></div>
				<bcs-input-numero class="col-xs-3" 
					k-ng-model="mlCPR.respuesta.TasaFinalMasAgente" 
					k-ng-disabled="'true'"
					decimales="mlCPR.win.TasaDecimal">
				</bcs-input-numero>
			</div>
			
			<br>
			<div class="row">
				<label class="col-xs-5" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-6"
					tipo="'combobox-estado-limites'"
					id-actual="mlCPR.respuesta.IdEstado"
					id-defecto="mlCPR.respuesta.IdEstadoDef"
					filtros="mlCPR.cmbbx.Estado.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mlCPR.dataModal.EstadoObj">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<br>
	<div class="row bcs-panel-comandos">
		<bcs-button id={{mlCPR.IdBotonAceptar}} class="col-xs-4" bcs-tipo="'principal'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalLimitesCuentaPropiaRangos.$valid" bcs-clic="mlCPR.aceptar();">
		</bcs-button>
		<bcs-button id="ModalLimitesCuentaPropiaRangos_cancelar" class="col-xs-4" bcs-tipo="''" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mlCPR.cancelar();">
		</bcs-button>
	</div>
</div>

<div id="MantenedorGrupoEmisores" class="row" ng-controller="MantenedorGrupoEmisoresCtrl as mGE">
	<div class="row">
		<bcs-grid
			configuracion="mGE.grilla.GrupoEmisores"
			seleccionado="mGE.grilla.grupoEmisorSel"
			fn-doble-click="mGE.win.modificar(mGE.grilla.grupoEmisorSel)">
		</bcs-grid>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button id="MantenedorGrupoEmisores_agregar" class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'" bcs-clic="mGE.win.agregar()">
		</bcs-button>
		<bcs-button id="MantenedorGrupoEmisores_modificar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" 
			bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="mGE.grilla.grupoEmisorSel !== undefined && mGE.grilla.grupoEmisorSel.IdEstado !== 'PEN'" bcs-clic="mGE.win.modificar(mGE.grilla.grupoEmisorSel)">
		</bcs-button>
	</div>
</div>

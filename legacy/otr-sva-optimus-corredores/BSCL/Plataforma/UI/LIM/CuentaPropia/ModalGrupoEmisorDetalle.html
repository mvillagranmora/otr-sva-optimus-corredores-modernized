<div id="ModalGrupoEmisorDetalle" class="row" ng-controller="ModalGrupoEmisorDetalleCtrl as mGED">
	<div class="row">
		<form name="ModalGrupoEmisorDetalle" class="col-xs-12">
			<div class="row">
				<label class="col-xs-4" translate>UI_EMISOR</label>
				<bcs-combobox-base class="col-xs-8" ng-if="!mGED.win.modoEditar"
					tipo="'combobox-emisor'"
					id-actual="mGED.respuesta.IdEmisor"
					id-defecto="mGED.respuesta.IdEmisorDef"
					filtros = "mGED.cmbbx.Emisor.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mGED.dataModal.EmisorObj">
				</bcs-combobox-base>
				<div class="col-xs-8" ng-if="mGED.win.modoEditar">
					<label class="col-xs-12">{{mGED.respuesta.IdEmisor}} &nbsp;-&nbsp; {{mGED.respuesta.RazonSocial}}</label>
				</div>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-estado-limites'"
					id-actual="mGED.respuesta.IdEstado"
					id-defecto="mGED.respuesta.IdEstadoDef"
					filtros="mGED.cmbbx.Estado.filtros"
					todos="'N'"
					bcs-requerido
					seleccionado="mGED.dataModal.EstadoObj">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id={{mGED.IdBotonAceptar}} class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModalGrupoEmisorDetalle.$valid" bcs-clic="mGED.aceptar();">
		</bcs-button>
		<bcs-button id="ModalGrupoEmisorDetalle_cancelar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="true" bcs-clic="mGED.cancelar();">
		</bcs-button>
	</div>
</div>

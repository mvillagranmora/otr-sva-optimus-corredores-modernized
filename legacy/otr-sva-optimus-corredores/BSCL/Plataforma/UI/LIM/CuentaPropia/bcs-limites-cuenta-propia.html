<div>
	<div class="col-xs-12">
		<div class="row">
			<bcs-grid 
				configuracion="grilla.grillaLimites" 
				seleccionado="grilla.limiteSel"
				fn-exportar-excel = "exportarExcel"  
				fn-doble-click="win.modificar(grilla.limiteSel)">
			</bcs-grid>
		</div>
		
		<div class="row bcs-panel-comandos">
			<div class="col-xs-9">
				<bcs-button id="LimitesCuentaPropia_agregar" class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="false" 
					bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'" bcs-clic="win.agregar()">
				</bcs-button>
				<bcs-button id="LimitesCuentaPropia_modificar" class="col-xs-3" bcs-tipo="''" bcs-auto-desactivar="false" 
					bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="grilla.limiteSel !== undefined && grilla.limiteSel.IdEstado !== 'PEN'" bcs-clic="win.modificar(grilla.limiteSel,1)">
				</bcs-button>
			</div>
			<div class="col-xs-1"></div>
			<bcs-menu class="col-xs-2" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
				<li ng-click="abrirMantenedorGrupoEmisores()" ng-show="tipoLimite === 'LIMCTPGRUPOEMISOR'">{{'UI_GRUPO_EMISORES' | translate}}</li>
				<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div id="ModalTipoCliente" ng-controller="ModalTipoCliente as mtc">
    <div class="row bcs-cuerpo">
        <form name="formTipoCliente" class="col-xs-12 form-horizontal">
                  
            <div class="row">
                <label class="col-xs-3" translate>UI_TIPO_CLIENTE</label>
                <bcs-input-texto foco="true" class="col-xs-9" 
                    bcs-requerido 
                    ng-model="mtc.TipoCliente.ModeloTipoCliente" >
                </bcs-input-texto>
            </div>
            
            <div class="row">
                <label class="col-xs-3" translate>UI_ESTADO</label>
                <bcs-combobox-base
                    class="col-xs-9"
                    auto-cargar="true"
                    bcs-requerido
                    filtros="mtc.cmbbxTipoCliente.filtros"
                    tipo="'combobox-estado-tipo-cliente'"
                    id-actual="mtc.TipoCliente.IdEstado"
                    id-post-filtro="mtc.TipoClienteOriginal.IdEstado"
                >
                </bcs-combobox-base>
            </div>
            
            <div class="row">
                <label class="col-xs-3" translate>UI_TIPO_ENROLAMIENTO</label>
                <bcs-combobox-base 
                class="col-xs-9" 
                bcs-requerido 
                tipo="'combobox-tipo-enrolamiento'"
                id-defecto="mtc.TipoCliente.TipoEnrolamientoDefecto" 
                id-actual="mtc.TipoCliente.TipoEnrolamiento"
                id-post-filtro="mtc.TipoClienteOriginal.TipoEnrolamiento">
                </bcs-combobox-base>
            </div>

            <div class="row">
                <label class="col-xs-3" translate>UI_POR_DEFECTO</label>
              <bcs-input-checkbox 
                  ng-model="mtc.TipoCliente.PorDefecto" 
                  ng-disabled="win.modoLectura">
              </bcs-input-checkbox>
          </div>
        </form>
    </div>
    <div class="row bcs-panel-comandos">
        <bcs-button id="ModalTipoCliente_aceptar" class="col-xs-3" bcs-habilitado="formTipoCliente.$valid" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mtc.aceptar()"></bcs-button>
        <bcs-button id="ModalTipoCliente_cancelar" class="col-xs-3" bcs-habilitado="'true'" bcs-tipo="''" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mtc.cancelar()"></bcs-button>
    </div>
</div>

<div id="AdministrarModelosTipoCliente" ng-controller="AdministrarModelosTipoClienteCtrl as aModTC">
	<div class="col-xs-12">
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_TIPO_CLIENTE</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-tipo-cliente'"
					id-actual="aModTC.IdTipoCliente"
					id-defecto="aModTC.IdTipoClienteDef"
					filtros = "aModTC.filtrosTipoCliente"
					todos="'N'"
					activado="!win.modoLectura"
					seleccionado="aModTC.TipoClienteObj">
				</bcs-combobox-base>
			</div>
			<bcs-button class="col-xs-2" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR' | translate" 
				bcs-habilitado="true" 
				bcs-clic="cargarDatosTabs()">
			</bcs-button>
			<bcs-button class="col-xs-2" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CREAR' | translate" 
				bcs-habilitado="true" 
				bcs-clic="crearModelo()">
			</bcs-button>
			<bcs-button class="col-xs-2" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_MODIFICAR' | translate" 
				bcs-habilitado="true" 
				bcs-clic="modificarModelo()">
			</bcs-button>
		</div>
		<div class="row"></div>
		<div class="row"></div>
		<div class="row">
		  	<uib-tabset>
				<uib-tab id="aModTC_InformacionCliente" heading="{{'UI_INFORMACION_CLIENTE'| translate}}" select="fnTabInformacionCliente()">
					<div id="PanelInformacionCliente" style="padding: 0px 0 10px 0;min-height:300px;" ></div>
				</uib-tab>
				<uib-tab id="aModTC_IndicadoresCliente" heading="{{'UI_INDICADORES_CLIENTE'| translate}}" select="fnTabIndicadoresCliente()">
					<div id="PanelIndicadoresCliente" style="padding: 0px 0 10px 0;min-height:300px;" ></div>
				</uib-tab>
				<uib-tab id="aModTC_IndicadoresPortafolio" heading="{{'UI_INDICADORES_PORTAFOLIO'| translate}}" select="fnTabIndicadoresPortafolio()">
					<div id="PanelIndicadoresPortafolio" style="padding: 0px 0 10px 0;min-height:300px;" ></div>
				</uib-tab>
				<uib-tab id="aModTC_RequisitosCliente" heading="{{'UI_REQUISITOS_CLIENTE'| translate}}" select="fnTabRequisitosCliente()">
					<div id="PanelRequisitosCliente" style="padding: 0px 0 10px 0;min-height:300px;" ></div>
				</uib-tab>
				<uib-tab id="aModTC_RequisitosPortafolio" heading="{{'UI_REQUISITOS_PORTAFOLIO'| translate}}" select="fnTabRequisitosPortafolio()">
					<div id="PanelRequisitosPortafolio" style="padding: 0px 0 10px 0;min-height:300px;" ></div>
				</uib-tab>
				<uib-tab id="aModTC_Preferencias" heading="{{'UI_PREFERENCIAS' | translate}}" select="fnTabPreferencias()">
					<div id="PanelPreferencias" style="padding: 0px 0 10px 0;min-height:300px;"></div>
				</uib-tab>
			</uib-tabset>
		</div>
	</div>
</div>

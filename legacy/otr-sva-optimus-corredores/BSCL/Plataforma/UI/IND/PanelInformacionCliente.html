<div id="AdmModelosTipoClientePanelIndicadoresCliente" ng-controller="PanelInformacionClienteCtrl as IndPInfCli">
	<div class="row">
		<div ng-if="aModTC.visible === 'INFCLI' && aModTC.IdSeleccionado">
			<div class="row">
                <label class="col-xs-3" translate>UI_TIPO_CLIENTE</label>
                <bcs-input-texto foco="true" class="col-xs-9" 
                    ng-model="aModTC.TipoClienteObj.Nombre" 
					k-ng-disabled=true>
                </bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_ESTADO</label>
				<bcs-input-texto class="col-xs-9" 
                    ng-model="aModTC.TipoClienteObj.NombreEstado" 
					k-ng-disabled=true>
                </bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_ENROLAMIENTO</label>
				<bcs-input-texto class="col-xs-9" 
                    ng-model="aModTC.TipoClienteObj.TipoEnrolamiento" 
					k-ng-disabled=true>
                </bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_POR_DEFECTO</label>
				<bcs-input-checkbox 
					ng-model="aModTC.TipoClienteObj.PorDefectoCheck" 
					ng-disabled=true>
				</bcs-input-checkbox>
            </div>
		</div>
	</div>
</div>

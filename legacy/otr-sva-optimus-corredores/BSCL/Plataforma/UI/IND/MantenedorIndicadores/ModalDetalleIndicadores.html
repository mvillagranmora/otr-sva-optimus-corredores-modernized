<div id="ModalDetalleAtributo" ng-controller="ModalDetalleIndicadorCtrl" style="padding-right: 0px;">
	<form name="formModalTipoAtributo" class="col-xs-12 form-horizontal">
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_CODIGO</label>
					<bcs-input-texto 
						bcs-requerido class="col-xs-8" 
						ng-model="DetalleIndicador.Codigo">
					</bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_NOMBRE</label>
					<bcs-input-texto bcs-requerido  class="col-xs-8" 
						ng-model="DetalleIndicador.NombreDetalleIndicador">
					</bcs-input-texto>
				</div>
			</div>
		</div>
		<br>
		<hr>
	</form>
<div class="row bcs-panel-comandos">
	<bcs-button id={{IdBotonAceptar}} class="col-xs-2" bcs-tipo="'principal'"
		bcs-auto-desactivar="false" bcs-habilitado="formModalTipoAtributo.$valid"
		bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="Aceptar()"></bcs-button>
	<bcs-button id="ModalTipoAtributo_cancelar" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="''"
		bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
		bcs-clic="cancelar()"></bcs-button>
</div>
</div>

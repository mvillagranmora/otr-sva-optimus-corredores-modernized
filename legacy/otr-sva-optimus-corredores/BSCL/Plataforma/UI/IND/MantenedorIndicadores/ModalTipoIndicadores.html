<div id="ModalTipoAtributo" ng-controller="ModalTipoIndicadorCtrl" style="padding-right: 0px;">
<form name="formModalTipoAtributo" class="col-xs-12 form-horizontal">
	
		
		<div class="row bcs-cuerpo">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_TIPO_PERSONA</label>
					<bcs-combobox-base class="col-xs-6"
						tipo="'combobox-tipo-persona'"
						todos="'S'"
						seleccionado = "TipoAtributo.TipoPersonaSeleccionado"
						id-defecto = "TipoAtributo.IdTipoPersona"
						id-post-filtro = "TipoAtributo.IdTipoPersona"
						bcs-requerido
						></bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_TIPO</label>
					<bcs-combobox-base class="col-xs-6"
						tipo="'combobox-tipo-dato-atributo'"
						seleccionado = "TipoAtributo.ClaseDatoSeleccionado"
						id-defecto = "TipoAtributo.ClaseDato"
						activado = "Habilitado"
						bcs-requerido
					></bcs-combobox-base>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_CODIGO</label>
					<bcs-input-texto k-ng-disabled = "!Habilitado" class="col-xs-6" bcs-requerido ng-model="TipoAtributo.CodigoTipoIndicador"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_NOMBRE</label>
					<bcs-input-texto class="col-xs-6" ng-model="TipoAtributo.NombreTipoIndicador" bcs-requerido></bcs-input-texto>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_GRUPO</label>
					<bcs-input-texto class="col-xs-6" ng-model="TipoAtributo.GrupoIndicador" bcs-requerido></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_VALOR_DEFECTO</label>
					<bcs-input-texto class="col-xs-6" ng-model="TipoAtributo.ValorIndicadorDefecto" bcs-requerido></bcs-input-texto>
				</div>
				<div class="col-xs-6" ng-if="TipoAtributo.ClaseDatoSeleccionado.TipoDato === 'BIGINT'">
					<label class="col-xs-4" translate>UI_CANTIDAD_DECIMALES</label>
					<bcs-input-texto class="col-xs-6" ng-model="TipoAtributo.CantidadDecimales" 
					bcs-requerido="TipoAtributo.ClaseDatoSeleccionado.TipoDato === 'BIGINT'"></bcs-input-texto>
				</div>
			</div>
			<div class="row" ng-if="TipoAtributo.ClaseDatoSeleccionado.TipoDato !== 'COMBO'">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_LONGITUD_MINIMA</label>
					<bcs-input-texto class="col-xs-6" ng-model="TipoAtributo.LongitudMinima" 
					bcs-requerido="TipoAtributo.ClaseDatoSeleccionado.TipoDato !== 'COMBO'"></bcs-input-texto>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_LONGITUD_MAXIMA</label>
					<bcs-input-texto class="col-xs-6" ng-model="TipoAtributo.LongitudMaxima" 
					bcs-requerido="TipoAtributo.ClaseDatoSeleccionado.TipoDato !== 'COMBO'"></bcs-input-texto>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_REQUIERE_AUTORIZACION</label>
					<bcs-input-checkbox class="col-xs-6" name="requiereAut"
						ng-model="TipoAtributo.RequiereAutorizacion"> </bcs-input-checkbox>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base class="col-xs-6"
						tipo="'combobox-estado-tipo-atributo'"
						seleccionado = "TipoAtributo.EstadoIndicadorSeleccionado"
						id-defecto = "TipoAtributo.IdEstado"
						bcs-requerido
					></bcs-combobox-base>
				</div>
			</div>
			<div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO</label>
					<bcs-input-checkbox class="col-xs-6" name="fechaVen"
						ng-model="TipoAtributo.RequiereFechaVencimiento"> </bcs-input-checkbox>
				</div>
			</div>
		</div>
	
</form>
<div class="row bcs-panel-comandos">
	<bcs-button id={{IdBotonAceptar}} class="col-xs-2" bcs-tipo="'principal'"
		bcs-auto-desactivar="false" bcs-habilitado="formModalTipoAtributo.$valid"
		bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="Aceptar()"></bcs-button>
	<bcs-button id="ModalTipoAtributo_cancelar" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="''"
		bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
		bcs-clic="cancelar()"></bcs-button>
</div>
</div>

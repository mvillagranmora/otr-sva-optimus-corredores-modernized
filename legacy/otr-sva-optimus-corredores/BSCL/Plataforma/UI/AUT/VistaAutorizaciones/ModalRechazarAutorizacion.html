<div ng-controller='ModalRechazarAutorizacionCtrl'>
    <form name="formComentarioRechazo">
            <div class="row bcs-cuerpo">
                <div class="row">
                    <div class="col-xs-12">
                        <label class="col-xs-3" translate>UI_FECHA</label>
                        <bcs-input-date class="col-xs-9"
                            k-ng-model="data.kngFechaOperacion" k-ng-disabled="'true'">
                        </bcs-input-date>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xs-12">
                        <label class="col-xs-3" translate>UI_COMENTARIO</label>
                        <bcs-input-texto class="col-xs-9" ng-model="ComentarioRechazo"
                            bcs-requerido = "data.requiereComentario"
                            tipo-campo="'textarea'"
                            atributos="margin: 0px; height:80px;width: 100%"
                            maxlength="520">
                        </bcs-input-texto>
                    </div>                    
                </div>
            </div>
        </form>

            <div class="row bcs-panel-comandos">
                <bcs-button class="col-xs-4 pull-right" bcs-clic="btnGrabar()" bcs-tipo="'bcs-button-primary'"  bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="formComentarioRechazo.$valid" bcs-auto-desactivar="false"></bcs-button>
                <bcs-button class="col-xs-4 pull-right" bcs-clic="btnCancelar()" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-auto-desactivar="false"></bcs-button>		
            </div>
</div>

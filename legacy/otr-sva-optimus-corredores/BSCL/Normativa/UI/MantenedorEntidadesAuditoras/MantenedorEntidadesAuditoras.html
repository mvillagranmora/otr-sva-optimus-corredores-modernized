<div id="MantenedorEntidadesAuditoras" ng-controller='MantenedorEntidadesAuditorasCtrl'>
	
	<div>
		<div>
			<form name="mantenedorEntidadesAuditoras">
			
			<bcs-grid id="grid-entidades-auditoras"
				fn-exportar-excel = "exportarExcel2" 
				configuracion="EntidadesAuditoras"
				seleccionado="data.seleccionEntidadesAuditoras" api="gridApiAtributos">
			</bcs-grid>

			<div class="row bcs-panel-comandos" style="padding-top: 10px !important;">
				<bcs-button id="MantenedorEntidadesAuditoras_crearEntidadAuditora" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false" bcs-habilitado="mantenedorEntidadesAuditoras.$valid"
					bcs-texto="'UI_CREAR' | translate" bcs-clic="CrearEntidadAuditora()"></bcs-button>
				<bcs-button id="MantenedorEntidadesAuditoras_modificarEntidadAuditora" class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'"
					bcs-texto="'UI_MODIFICAR' | translate"
					bcs-auto-desactivar="false" bcs-clic="ModificarEntidadAuditora()"
					bcs-habilitado="data.seleccionEntidadesAuditoras.IdEntidadAuditora"></bcs-button>
			</div>
			</form>
		</div>
	</div>
</div>

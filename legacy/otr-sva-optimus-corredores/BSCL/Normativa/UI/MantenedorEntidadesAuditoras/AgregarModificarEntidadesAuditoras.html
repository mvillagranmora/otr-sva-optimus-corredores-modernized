<div id="AgregarModificarEntidadesAuditoras" ng-controller="AgregarModificarEntidadesAuditorasCtrl" style="padding-right: 0px;">
    
    <form name="AgregarModificarEntidadesAuditoras" class="col-xs-12 form-horizontal">
        
            
            <div class="row bcs-cuerpo">
                
                
                <div class="row">
                    <div class="col-xs-12">
                        <label class="col-xs-4" translate>UI_EMPRESA_AUDITORA</label>
                        <bcs-input-texto class="col-xs-8" ng-model="data.EmpresaAuditora" bcs-requerido></bcs-input-texto>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-12">
                        <label class="col-xs-4" translate>UI_AUDITOR_ENCARGADO</label>
                        <bcs-input-texto class="col-xs-8" ng-model="data.AuditorEncargado" bcs-requerido></bcs-input-texto>
                    </div>
                </div>

                <div class = "row">
                    <div class="col-xs-12">
                        <label class="col-xs-4" translate>UI_TIPO_CASILLA</label>
                        <bcs-combobox-base class="col-xs-8"
                            ng-model="data.TipoCasilla"
                            tipo="oConfiguracionTipoCasilla.tipo"
                            seleccionado= "oConfiguracionTipoCasilla.seleccionado"
                            id-actual="oConfiguracionTipoCasilla.idActual"
                            id-defecto ="oConfiguracionTipoCasilla.idDefecto"
                            configuracion= "oConfiguracionTipoCasilla.configuracion"
                            bcs-requerido>
                        </bcs-combobox-base>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-12">
                        <label class="col-xs-4" translate>UI_CASILLA</label>
                        <bcs-input-texto class="col-xs-8" ng-model="data.Casilla" bcs-requerido></bcs-input-texto>
                    </div>
                </div>

                <div class = "row">
                    <div class="col-xs-12">
                        <label class="col-xs-4" translate>UI_ESTADO</label>
                        <bcs-combobox-base class="col-xs-8"
                            ng-model="data.Estado"
                            tipo="oConfiguracionEstado.tipo"
                            filtros = "filtrosEstado" 
                            seleccionado= "oConfiguracionEstado.seleccionado"
                            id-actual="oConfiguracionEstado.idActual"
                            id-defecto ="oConfiguracionEstado.idDefecto"
                            configuracion= "oConfiguracionEstado.configuracion"
                            bcs-requerido>
                        </bcs-combobox-base>
                    </div>
                </div>
                
            
        
    </form>
    <div class="row bcs-panel-comandos" style="padding-top: 10px !important;">
        <bcs-button id={{IdBotonAceptar}} class="col-xs-3 pull-right" bcs-tipo="'bcs-button-primary'"
            bcs-auto-desactivar="false" bcs-habilitado="AgregarModificarEntidadesAuditoras.$valid"
            bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="Aceptar()"></bcs-button>
        <bcs-button id="ModalTipoAtributo_cancelar" class="col-xs-3 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'"
            bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate"
            bcs-clic="cancelar()"></bcs-button>
    </div>
    </div>

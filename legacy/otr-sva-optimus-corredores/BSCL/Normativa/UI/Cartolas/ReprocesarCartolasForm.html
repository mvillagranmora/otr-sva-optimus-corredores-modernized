        <label class="col-xs-5" translate>UI_FECHA_HORA_PROGRAMACION</label>

            class="col-xs-7"
            k-ng-disabled="'false'"
            k-ng-model="Nomina.FechaProgramadaProceso">

    </div>
    <hr>
    <div class="row">

            bcs-habilitado="'true'"

    </div>

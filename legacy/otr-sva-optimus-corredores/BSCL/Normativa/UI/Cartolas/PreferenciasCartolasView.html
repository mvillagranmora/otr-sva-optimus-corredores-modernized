<div ng-controller="PreferenciasCartolasController">
    <div class="bcs-cuerpo">
        <div>
            <uib-tabset>
                <uib-tab heading="{{'UI_PLANTILLAS' | translate}}">
                    <div class="row">
                        <div class="col-xs-10">
                            <div class="row">
                                <label class="col-xs-2" translate>UI_TIPO_PLANTILLA</label>
			 					<bcs-combobox-base class="col-xs-3"
									tipo="'combobox-tipo-plantillas'"
									seleccionado="data.Plantilla"
									item-post-filtro="1"
									todos="'N'"   
									activado="true">
								</bcs-combobox-base>  
                                <label class="col-xs-2" translate align="right">UI_VIGENTE_AL</label>
                                <bcs-input-date class="col-xs-3" k-ng-model="VigenteAl"></bcs-input-date>
                            </div>
                        </div>
                        <div class="col-xs-2">
                            <div class="row">
                                <bcs-button
                                    bcs-tipo="'default'"
                                    bcs-auto-desactivar="false"
                                    bcs-texto="'UI_BUSCAR' | translate"
                                    bcs-habilitado="true"
                                    bcs-clic="buscarPlantilla()">
                                </bcs-button>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="row">
                                <label class="col-xs-1" translate>UI_NOMBRE</label>
                                <bcs-input-texto class="col-xs-2"
                                    k-ng-disabled="true"
                                    ng-model="data.PlantillaSeleccionada.Nombre">
                                </bcs-input-texto>
                                <label class="col-xs-2" translate align="right">UI_VIGENTE_DESDE</label>
                                <bcs-input-date class="col-xs-2"
                                    k-ng-disabled="true"
                                    k-ng-model="data.PlantillaSeleccionada.VigenteDesde">
                                </bcs-input-date>
                                <label class="col-xs-2" translate align="right">UI_VIGENTE</label>
                                <bcs-input-texto class="col-xs-1"
                                    k-ng-disabled="true"
                                    ng-model="data.PlantillaSeleccionada.Vigente">
                                </bcs-input-texto>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <label translate>UI_RECURSOS_PLANTILLA</label>
                    </div>
                    <div class="row">
                        <bcs-grid id="gridRecursos"
                            configuracion="configuracionGrillaRecursos"
                            seleccionado="data.RecursoSeleccionado"
                            fn-click=""
                            fn-doble-click="">
                        </bcs-grid>
                    </div>
                    <div class="row bcs-panel-comandos">
                        <bcs-button
                            class="col-xs-2"
                            bcs-tipo="'principal'"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_NUEVA_PLANTILLA' | translate"
                            bcs-habilitado="'true'"
                            ng-show = "'true'"
                            bcs-clic="nuevaPlantilla()">
                        </bcs-button>
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'default'"
                            bcs-habilitado="'true'"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_MODIFICAR_RECURSO' | translate"
                            bcs-clic="mostrarModificarRecurso()">
                        </bcs-button>
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'default'"
                            bcs-habilitado="'true'"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_MODIFICAR_VIGENCIA' | translate"
                            bcs-clic="mostrarModificarVigencia()">
                        </bcs-button>
                    </div>
                </uib-tab>
                <uib-tab heading="{{'UI_CONFIGURACION' | translate}}">
                    <div class="row">
                        <bcs-grid id="gridConfig"
                            configuracion="configuracionGrillaConfig"
                            seleccionado="data.ConfigSeleccionada"
                            fn-click=""
                            fn-doble-click="">
                        </bcs-grid>
                    </div>
                    <div class="row bcs-panel-comandos">
                        <bcs-button class="col-xs-3"
                            bcs-tipo="'default'"
                            bcs-habilitado="'true'"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_MODIFICAR_CONFIGURACION' | translate"
                            bcs-clic="mostrarModificarConfig()">
                        </bcs-button>
                    </div>
                </uib-tab>
            </uib-tabset>
        </div>
    </div>
</div>

<div class="row" ng-controller="ModificarConfigController">
    <div class="row">
        <bcs-input-texto
            class="col-xs-12"
            atributos="width:100%"
            k-ng-disabled="true"
            ng-model="Config.Descripcion">
        </bcs-input-texto>
    </div>
    <div class="row" ng-show="Config.Tipo==='IMAGEN'">
        <div class="col-xs-12">
            <input style="width:100%;" type="file" file-model="loadFile"/>
        </div>
    </div>
    <div class="row" ng-show="Config.Tipo==='NUMERO'">
        <bcs-input-numero
            class="col-xs-12"
            atributos="width:100%"
            k-ng-disabled="false"
            k-options="{format : 'n0', min:0, spinners : false}"
            ng-model="Config.Valor">
        </bcs-input-numero>
    </div>
    <div class="row" ng-show="Config.Tipo==='OPCION'">
        <bcs-input-checkbox
            class="col-xs-1"
            ng-model="Flag">
        </bcs-input-checkbox>
    </div>
    <div class="row" ng-show="Config.Tipo==='TEXTO'">
        <bcs-input-texto
            class="col-xs-12"
            atributos="width:100%"
            k-ng-disabled="false"
            ng-model="Config.Valor">
        </bcs-input-texto>
    </div>
    <div class="row">
        <bcs-button class="col-xs-4"
            bcs-tipo="'principal'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_GUARDAR' | translate"
            bcs-habilitado="'true'"
            bcs-clic="guardar()">
        </bcs-button>
    </div>
</div>

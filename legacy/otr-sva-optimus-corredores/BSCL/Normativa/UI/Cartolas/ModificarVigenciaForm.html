<div class="row" ng-controller="ModificarVigenciaController">
    <div class="row">
        <label class="col-xs-4" translate>UI_NOMBRE</label>
        <bcs-input-texto
            class="col-xs-8"
            atributos="width:100%"
            k-ng-disabled="true"
            ng-model="Plantilla.Nombre">
        </bcs-input-texto>
    </div>
    <div class="row">
        <label class="col-xs-4" translate>UI_VIGENTE_DESDE</label>
        <bcs-input-date class="col-xs-8"
            k-ng-disabled="true"
            k-ng-model="Plantilla.VigenteDesde">
        </bcs-input-date>
    </div>
    <div class="row">
        <label class="col-xs-4" translate>UI_VIGENTE</label>
        <bcs-input-checkbox
            class="col-xs-1"
            ng-model="Flag">
        </bcs-input-checkbox>
    </div>
    <div class="row">
        <bcs-button class="col-xs-8"
            bcs-tipo="'principal'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_MODIFICAR_VIGENCIA' | translate"
            bcs-habilitado="'true'"
            bcs-clic="actualizarVigencia()">
        </bcs-button>
    </div>
</div>

<div class="row" ng-controller="CertificarProcesoController">
    <div class="row">
        <label class="col-xs-12" translate>UI_NOTA_CERTIFICACION</label>
    </div>
    <div class="row">
        <bcs-input-texto
            class="col-xs-12"
            atributos="width:100%"
            ng-disabled="false"
            ng-model="Nomina.NotaCertificacion">
        </bcs-input-texto>
    </div>
    <hr>
    <div class="row">
        <bcs-button class="col-xs-4 pull-right"
            bcs-tipo="'bcs-button-input-form'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_CERTIFICAR' | translate"
            bcs-habilitado="'true'"
            bcs-clic="certificar()">
        </bcs-button>
    </div>
</div>

<form name="frmCartaUno">
<div class="row" ng-controller='ConsultarCartaUnoCtrl'>

<div class="row" class="col-xs-12">

	<label class="col-xs-2" translate>  Fecha : </label>
	<bcs-input-date
	    class="col-xs-2"
		bcs-requerido
		k-ng-model="data.oCartaUno.fecha"
		k-options="data.oCartaUno.fechaOptions"
		> 
	</bcs-input-date>
	
		<bcs-button 
			class="row col-xs-2 pull-right" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_BUSCAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="buscarCartaUno()">
		</bcs-button>
		
		<bcs-button 
			class="row col-xs-2 pull-right" 
			bcs-tipo="'default'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_LIMPIAR' | translate" 
			bcs-habilitado="true" 
			bcs-clic="limpiarFiltros()"
			>
		</bcs-button>
	
</div>
 	
	 <div class="row" >
		<div class="col-xs-12">			
			<bcs-grid 
				id				="gridCartaUno"
	 			configuracion	= "confBasicaCartaUno"
				seleccionado 	= "confBasicaCartaUno"
				fn-click 		= ""
				api 			= "gridApi">
			</bcs-grid>
		</div>
	</div>
  	
	<div class="row">
			<bcs-menu 
				class="col-xs-1 pull-right" 
				bcs-habilitado="'true'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="data.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}
				</li>
			</bcs-menu>
	</div>
</div>
</form>

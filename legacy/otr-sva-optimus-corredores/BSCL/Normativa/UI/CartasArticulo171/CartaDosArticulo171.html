<form name="frmCartaDos">
<div class="row" ng-controller='ConsultarCartaDosCtrl'>

<div class="row" class="col-xs-12">



	<label class="col-xs-2" translate>  Fecha (mes/año): </label>
	
	<bcs-input-texto class="col-xs-1" ng-model="data.oCartaDos.Mes" ></bcs-input-texto>
	<bcs-input-texto class="col-xs-2" ng-model="data.oCartaDos.anio" ></bcs-input-texto>
	

		<bcs-button 
			class="row col-xs-2 pull-right" 
			bcs-tipo="'default'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_BUSCAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="buscarCartaDos()">
		</bcs-button>
		
		<bcs-button 
			class="row col-xs-2 pull-right" 
			bcs-tipo="'default'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_LIMPIAR' | translate" 
			bcs-habilitado="true" 
			bcs-clic="limpiarFiltros()"
			>
		</bcs-button>

</div>

  	
	 <div class="row" >
		<div class="col-xs-12">			
			<bcs-grid 
				id				="gridCartaDos"
	 			configuracion	= "confBasicaCartaDos"
				seleccionado 	= "confBasicaCartaDos"
				fn-click 		= ""
				api 			= "gridApi">
			</bcs-grid>
		</div>
	</div>
  	
	<div class="row">
			<bcs-menu 
				class="col-xs-1 pull-right" 
				bcs-habilitado="'true'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="data.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}
				</li>
			</bcs-menu>
	</div>
</div>
</form>

<div class="col-xs-12" ng-controller="ConsultarCertificadosCtrl">
    <div class="bcs-cuerpo">
    	<div class="row">
			<form name="formCertificados" class="col-xs-12 form-horizontal">
	            <div class="row"> 
					<div class="col-xs-8">
						<label class="col-xs-4" translate>UI_CLIENTE</label>
						<bcs-combobox-base class="col-xs-8"
							id="UI_CLIENTE"
							bcs-requerido = "'true'"
							auto-cargar="'false'"
							id-Actual="data.oSocioNegocio.idActual"						
							tipo="'combobox-socio-negocio'"
							seleccionado="data.oSocioNegocio.seleccionado"
							configuracion= "data.oSocioNegocio.configuracion"
							filtros="data.oSocioNegocio.filtros"
							cascada-a			="data.oPortafolio.filtros.IdCliente"
							cascada-valor		="'IdCliente'"
							>
						</bcs-combobox-base >
					

					
						
					</div>
					<div class="col-xs-4">
						<div class="col-xs-12">
			            	<bcs-button
								class="col-xs-12" bcs-auto-desactivar="false"  bcs-tipo="'bcs-button-input-form'"
								bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="formCertificados.$valid" 
								bcs-clic="buscarCliente()">
							</bcs-button> 
						</div>
					</div>
					
	            </div>
					<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_PORTAFOLIO</label>
								<bcs-combobox-base 
									class				="col-xs-8"
									id					="UI_PORTAFOLIO"
								 	auto-cargar			="'false'"
								 	bcs-requerido
								    tipo				="'combobox-portafolio'"
								    seleccionado		="data.oPortafolio.seleccionado"
								    filtros				="data.oPortafolio.filtros"
				                    item-post-filtro	="'1'"
				                    id-actual			="data.oPortafolio.idActual"
								    configuracion		="data.oPortafolio.configuracion">
								</bcs-combobox-base>
							</div>
						</div>
					
						            
	            <div class="row">
	            	<div class="col-xs-8">
		            	<label class="col-xs-4" translate>UI_ANIO</label>
						<bcs-input-date class="col-xs-8 " bcs-requerido="'true'"
							k-ng-model = "data.periodo" k-Options="config.periodo">
						</bcs-input-date>
					</div>
	            </div>
			</form>
		</div>
		<hr>
		<div class="row">
			<!-- REPETIR ESTRUCTURA CERTIFICADO-->
			<div class="row">
			<div class="col-xs-11"></div>
			<div class="col-xs-1"><div class="col-xs-3"></div><label class="col-xs-6" translate>UI_ZIP</label><div class="col-xs-3"></div></div>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_CUSTODIA</label>
				<bcs-combobox-base class="col-xs-4"
					id="UI_PERIODO"
					activado="config.certificados"
					bcs-requerido = "'false'"
					auto-cargar="'false'"
					id-Actual="data.oCertificadoClienteXXX.idActual"						
					tipo="'combobox-certificados-cliente'"
					seleccionado="data.oCertificadoClienteXXX.seleccionado"
					configuracion= "data.oCertificadoClienteXXX.configuracion"
					filtros="data.oCertificadoClienteXXX.filtros">
				</bcs-combobox-base >
				<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" 
					bcs-texto="'UI_DESCARGAR' | translate" bcs-habilitado="config.certificados && data.oSocioNegocio.seleccionado.IdCliente" 
					bcs-clic="descargar('XXX')">
				</bcs-button>
				<div class="col-xs-1 text-center">
					<div class="col-xs-3"></div>
					<bcs-input-checkbox class="col-xs-6" ng-model="data.MasivoXXX" ng-disabled="config.certificados==false || data.oCertificadoClienteXXX.idActual==false" >
					</bcs-input-checkbox>
					<div class="col-xs-3"></div>
				</div>
				<div class="row">
		  			<bcs-input-checkbox class="col-xs-1" ng-disabled="true" style="width: 9%; display: flex; justify-content: center;" ng-model="data.configuracionVerCarta"></bcs-input-checkbox>
					<label class="col-xs-10" ng-show="data.configVerCarta['P']" translate>UI_CONFIGCARTA_P</label>
					<label class="col-xs-10" ng-show="data.configVerCarta['UP']" translate>UI_CONFIGCARTA_UP</label>
					<label class="col-xs-10" ng-show="data.configVerCarta['CP']" translate>UI_CONFIGCARTA_CP</label>
			  	</div>
			</div>
			<!-- FIN REPETIR ESTRUCTURA CERTIFICADO-->
			
			<div class="row" ng-show="false">
				<label class="col-xs-4" translate>UI_CERTIFICADO_YYY</label>
				<bcs-combobox-base class="col-xs-4"
					id="UI_PERIODO"
					activado="config.certificados"
					bcs-requerido = "'false'"
					auto-cargar="'false'"
					id-Actual="data.oCertificadoClienteYYY.idActual"						
					tipo="'combobox-certificados-cliente'"
					seleccionado="data.oCertificadoClienteYYY.seleccionado"
					configuracion= "data.oCertificadoClienteYYY.configuracion"
					filtros="data.oCertificadoClienteYYY.filtros">
				</bcs-combobox-base >
				<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" 
					bcs-texto="'UI_DESCARGAR' | translate" bcs-habilitado="config.certificados && data.oCertificadoClienteYYY.idActual"  
					bcs-clic="descargar('YYY')">
				</bcs-button>
				<div class="col-xs-1 pull-right">
					<div class="col-xs-3"></div>
					<bcs-input-checkbox class="col-xs-6" ng-model="data.MasivoYYY" ng-disabled="config.certificados==false || data.oCertificadoClienteYYY.idActual==false" >
					</bcs-input-checkbox>
					<div class="col-xs-3"></div>
				</div>
			</div>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-habilitado="data.MasivoXXX || data.MasivoYYY" bcs-texto="'UI_MASIVO' | translate" bcs-clic="generarMasivo()"></bcs-button>
		<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'" bcs-clic="limpiarPantalla()"></bcs-button>				
	</div>
</div>

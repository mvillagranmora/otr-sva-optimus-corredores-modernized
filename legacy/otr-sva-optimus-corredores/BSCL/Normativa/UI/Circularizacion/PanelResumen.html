<div id="PanelResumen" class="row" ng-controller="PanelResumenCtrl as pLCP">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_PERIODO</label>
			  		<bcs-input-date class="col-xs-8" k-options="pLCP.PeriodoOptions" k-ng-model="pLCP.Periodo"></bcs-input-date>
			  		<!-- 
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-tipo-limite'"
						id-actual="pLCP.filtro.IdTipoLimite"
						id-defecto="pLCP.filtro.IdTipoLimiteDef"
						filtros="pLCP.cmbbx.TipoLimite.filtros"
						todos="'S'"
						item-post-filtro="'1'">
					</bcs-combobox-base>
					 -->
				</div>
				<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_RESPUESTA</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-clasificacion-tipo-instrumento'"
						id-actual="pLCP.filtro.IdClasificacionTipoInstrumento"
						id-defecto="pLCP.filtro.IdClasificacionTipoInstrumentoDef"
						filtros="pLCP.cmbbx.ClasificacionTipoInstrumento.filtros"
						todos="'S'"
						seleccionado="pLCP.dataModal.ClasificacionTipoInstrumentoObj"
						cascada1-a="pLCP.cmbbx.TipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
				</div>
		  	</div>
		  	<div class="row">
		  		<div class="col-xs-6">
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pLCP.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pLCP.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			configuracion="pLCP.grilla.Nomina"
			seleccionado="pLCP.grilla.limiteSel"
			fn-exportar-excel="excelNomina" api="gridApi">
			
		</bcs-grid>
	</div>

	<div class="row">
		<div class="col-xs-12" style="top:10px; padding-bottom: 10px;">
			<!-- <bcs-button class="col-xs-2 pull-left"   bcs-tipo="'principal'"     bcs-auto-desactivar="false" bcs-texto="'UI_SOLICITAR_CIRCULARIZACION' | translate"  bcs-habilitado="'true'" bcs-clic="pLCP.fn.SolicitarCircularizacion()"></bcs-button> -->
			<bcs-menu 
				class="col-xs-1 pull-right"
				bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="excelNomina('Nomina')">{{'UI_EXPORTAR_EXCEL' | translate}}
				</li>
			</bcs-menu>	
		</div>
		
	</div>
	
	
	
	
</div>

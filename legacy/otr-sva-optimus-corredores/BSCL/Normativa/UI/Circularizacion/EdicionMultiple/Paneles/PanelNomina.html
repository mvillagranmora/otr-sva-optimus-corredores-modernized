<div id="PanelNomina" class="row" ng-controller="PanelNominaCtrl as pc1">
<form class="col-xs-12 form-horizontal">

	<br>
	<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-12" translate>UI_CONSIDERAR_CLIENTE_PARA_NOTIFICACION</label>
			</div>
	</div>
<br>
	<div class="row">
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pc1.control.notificarSI"
					>
				</bcs-input-checkbox>
				<label class="col-xs-4" translate>UI_SI</label>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-2"
					ng-model="pc1.control.notificarNO"
					>
				 </bcs-input-checkbox>
				<label class="col-xs-4" translate>UI_NO</label>
			</div>
	</div>
	<br>	

</form>		
	<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			 <bcs-button class="col-xs-4 pull-right"   bcs-tipo="'bcs-button-primary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.guardarCambios()">
			 </bcs-button>
			 <bcs-button class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	
</div>

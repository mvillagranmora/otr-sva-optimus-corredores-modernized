<div id="Respuesta" class="row" ng-controller="RespuestaCtrl as pc1">
<form class="col-xs-12 form-horizontal">

	<br>

<br>
		<div class="row" >
			<label class="col-xs-3" translate>UI_RESPUESTA</label>
			<bcs-combobox-base class="col-xs-9"
						tipo = "'combobox-estado-normativa'"
						id-actual = "pc1.cmbbx.IdEstadoNormativa"
						filtros="pc1.cmbbx.EstadoNormativa.filtros"
						auto-cargar="true"
						item-post-filtro="'1'"
						id-defecto="pc1.Seleccion[0].IdEstadoRespuesta"
						todos="'N'"
						seleccionado="pc1.cmbbx.IdEstadoNormativaObj">
		 	</bcs-combobox-base >		
		</div>
	<br>	

		<div class="row" ng-show="pc1.MuestraMotivo" >
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_COMENTARIO</label>
	                <bcs-input-texto class="col-xs-9"
	                    id="UI_COMENTARIO"
	                	maxlength="260"
						ng-model="pc1.Motivo"
						tipo-campo="'textarea'"
						atributos="margin: 0px; height:73px;resize:none;width: 100%"
	                >
	                </bcs-input-texto>	
	             </div>
		
		</div>


</form>		
	<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			 <bcs-button class="col-xs-4 pull-right"   bcs-tipo="'bcs-button-primary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.guardarCambios()">
			 </bcs-button>
			 <bcs-button class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	
</div>

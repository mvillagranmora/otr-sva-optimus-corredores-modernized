<div id="SolicitarCircularizacion" ng-controller="SolicitarCircularizacionCtrl as solCir">
	<form class="col-xs-12 form-horizontal">

		<div class="row" >
				<label class="col-xs-3" translate> Fecha Inicio Solicitud: </label>
				<bcs-input-date class="col-xs-3" bcs-requerido
					k-ng-model="solCir.fechaInicioSol"
					k-ng-readonly="'true'">
				</bcs-input-date>
				<label class="col-xs-3" translate>UI_USUARIO</label>
				<label style="font-weight: bold" class="col-xs-3" id="User"
					ng-model="solCir.lblUsuario" translate>{{SesionUsuario}}</label>
		
		</div>
			
			</form>
				
	<form class="col-xs-12 form-horizontal">
		<div class="row" ng-show="solCir.params.PrevUIModo === 'CIRCULARIZACION'">
			<label class="col-xs-3" translate>UI_PERIODO</label>
			<bcs-input-date class="col-xs-3" k-options="solCir.PeriodoOptions" k-ng-model="solCir.Periodo" k-ng-readonly="'true'" todo-dias="'S'"></bcs-input-date>			
		</div>
		<hr>
		<br>
			<div class="col-xs-12" >
			<uib-tabset>
					<uib-tab id="TabCartas" heading="{{solCir.panelTitulo | translate}}" select="solCir.fnTabCartas()" >
						<div class="row" >
							<div id="PanelCartas"></div>
						</div>
					</uib-tab>
															
			</uib-tabset>
			</div>
	</form>
	<form class="col-xs-12 form-horizontal">	
		<br>
	</form>	
</div>

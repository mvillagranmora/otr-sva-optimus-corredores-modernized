
<form name="frmIngresarSolicitudCircular">
<div ng-form="forms.datosBasicos">
	<div class="row"
		ng-controller='IngresarSolicitudCircularCtrl as ingSol'> 

		<div class="col-xs-12" style="height: 27px">
			<label class="col-xs-2" translate> Fecha Inicio Solicitud: </label>
			<bcs-input-date class="col-xs-3" bcs-requerido
				k-ng-model="data.oCircularConfiguracion.fechaInicioSol"
				k-options="data.fechaInicioSolOptions" k-ng-readonly="'true'">
			</bcs-input-date>

			<label class="col-xs-2"> </label> <label class="col-xs-2" translate>UI_USUARIO</label>
			<label style="font-weight: bold" class="col-xs-3" id="User"
				ng-model="data.lblUsuario" translate>{{SesionUsuario}}</label>
		</div>

		<uib-tabset> 
			<uib-tab id="Tab" heading="NCG380">
				<div class="row">
					<div class="col-xs-12">
						<div class="col-xs-5">
							<div class="row">
								<label class="col-xs-5">Registro Cliente</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroCliente"
									ng-disabled="data.modoLectura">
								</bcs-input-checkbox>
							</div>
							<div class="row">
		
								<label class="col-xs-5">Registro Autorizados</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroAutorizados"
									ng-disabled="data.modoLectura"> </bcs-input-checkbox>
		
							</div>
							<div class="row">
								<label class="col-xs-5">Registro Ordenes</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroOrdenes"
									ng-disabled="data.modoLectura"> </bcs-input-checkbox>
							</div>
							<div class="row">
								<label class="col-xs-5">Registro Operaciones</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroOperaciones"
									ng-disabled="data.modoLectura">
								</bcs-input-checkbox>
							</div>
							
							<div class="row">
								<label class="col-xs-5">Registro Asignación</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroAsignacion"
									ng-disabled="data.modoLectura">
								</bcs-input-checkbox>
							</div>
		
							<div class="row">
									<label class="col-xs-5">Registro Facturación</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroFacturacion"
									ng-disabled="data.modoLectura">
								</bcs-input-checkbox>
							</div>
							<div class="row">
								<label class="col-xs-5">Registro Custodia</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroCustodia"
									ng-disabled="data.modoLectura">
								</bcs-input-checkbox>
							</div>
							<div class="row">
		
								<label class="col-xs-5">Registro Trabajador</label>
								<bcs-input-checkbox class="col-xs-1"
									ng-model="ingSol.oSeleccionRegistros.registroTrabajador"
									ng-disabled="data.modoLectura"> </bcs-input-checkbox>
							</div>
						</div>
		
						<div class="col-xs-7" style="float: left;">
							<div class="row" ng-show="modoVisualizacion">
								<div class="col-xs-6">
									<label class="col-xs-4" translate>UI_USUARIO</label>
									<label style="font-weight: bold" class="col-xs-7">{{data.lblUsuarioCreador}}</label>
								</div>
								<div class="col-xs-6">
									<label class="col-xs-4" translate>UI_ID_SOLICITUD</label>
									<label style="font-weight: bold" class="col-xs-7">{{data.lblIdSolicitud}}</label>
								</div>
							</div>
							<hr ng-show="modoVisualizacion">
							<div class="row">
								<div class="col-xs-6">
									<label class="col-xs-4" translate>Fecha Inicio</label>
									<bcs-input-date class="col-xs-7" 
									    bcs-requerido
										k-ng-model="data.Filtros.FechaInicio"
										k-ng-disabled="seleccionFecInicio || data.modoLectura">
									</bcs-input-date>
								</div>
								<div class="col-xs-6">
									<label class="col-xs-4" translate>Fecha Fin</label>
									<bcs-input-date class="col-xs-7" 
									    bcs-requerido
										k-ng-model="data.Filtros.FechaFin"
										k-ng-disabled="seleccionFecFin || data.modoLectura">
									</bcs-input-date>
								</div>
							</div>
							<hr>
							<!-- PARAMETROS CLIENTES -->
							<div class="row">
								<div class="col-xs-9">
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3" translate>Cliente</label>
										<bcs-combobox-base class="col-xs-9" id="comboboxSocioNegocio"
											auto-cargar="'false'" tipo="'combobox-socio-negocio'"
											configuracion="data.oConfiguracionSocioNegocio.configuracion"
											id-Actual="data.oConfiguracionSocioNegocio.idActual"
											seleccionado="data.oConfiguracionSocioNegocio.seleccionado"
											activado="activadoCli">
										</bcs-combobox-base>
									</div>
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3">Listado Rut</label> 
										<input
											class="col-xs-9" type="file" 
											data-disabled="true"
											ng-model="data.Filtros.ListRut"
											ng-disabled="listRut" 
											file-reader="data.FiltrosRut.fileContent"
											style="display: inline" />
									</div>
									<div class="row" ng-show="modoVisualizacion">
										<label class="col-xs-3" translate>UI_RUT</label>
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="!ingresarSolicitud.muestraRuts" ng-click="ingresarSolicitud.muestraRuts = !ingresarSolicitud.muestraRuts">({{'+' | translate}})</em> 
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="ingresarSolicitud.muestraRuts" ng-click="ingresarSolicitud.muestraRuts = !ingresarSolicitud.muestraRuts">({{'-'| translate}})</em>
									</div>
									<div class="row" ng-show="ingresarSolicitud.muestraRuts">
										<bcs-grid id="gridListadoRut"
											configuracion="confBasicaListadoRut"
											seleccionado="seleccionListadoRut" 
											fn-click="">
										</bcs-grid>
									</div>
								</div>
								
								<div class="col-xs-3">
									<label class="col-xs-4"></label>
									<label class="col-xs-4">Todos</label>
									<bcs-input-checkbox class="col-xs-4"
										ng-model="data.Filtros.TodosCli" ng-disabled="seleccionTodosRut || data.modoLectura">
									</bcs-input-checkbox>
								</div>
							</div>
							<!-- FIN PARAMETROS CLIENTE -->
							<hr>
							<!-- PARAMETROS NEMO -->
							<div class="row">
								<div class="col-xs-9">
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3">Nemo</label>
										<bcs-input-texto class="col-xs-9" ng-model="data.Filtros.Nemo"
											k-ng-disabled="seleccionNemo"></bcs-input-texto>
									</div>
									<div class="row" ng-show="modoVisualizacion">
										<label class="col-xs-3" translate>UI_NEMO</label> 
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="!ingresarSolicitud.muestraNemos" ng-click="ingresarSolicitud.muestraNemos = !ingresarSolicitud.muestraNemos">({{'+'| translate}})</em>
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="ingresarSolicitud.muestraNemos" ng-click="ingresarSolicitud.muestraNemos = !ingresarSolicitud.muestraNemos">({{'-'| translate}})</em>
									</div>
									<div class="row" ng-show="ingresarSolicitud.muestraNemos">
										<bcs-grid id="gridListadoNemo"
											configuracion="confBasicaListadoNemo"
											seleccionado="seleccionListadoNemo" 
											fn-click="">
										</bcs-grid>
									</div>
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3" translate>Listado Nemo</label> 
										<input class="col-xs-9" type="file" ng-disabled="listNemo" ng-model="data.Filtros.ListNemo"
											file-reader="data.FiltrosNemo.fileContent"
											style="display: inline" />
									</div>
									<div class="row">
										<label class="col-xs-3">Oficio: </label>
										<bcs-input-texto class="col-xs-9" ng-model="data.Filtros.Oficio"
											ng-disabled="seleccionOficio || data.modoLectura"></bcs-input-texto>
									</div>
									<div class="row">
										<label class="col-xs-3" translate>UI_CLASIFICACION</label>
										<bcs-combobox-base
											tipo="'combobox-clasificacion-tipo-instrumento'"
											class="col-xs-9" todos="'S'" id-defecto="'0'"
											seleccionado="filtros.clasificacionTipoInstrumento"
											id-actual="filtros.IdClasificacionTipoInstrumento"
											cascada-a="datos.oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
											cascada-valor="'IdClasificacionTipoInstrumento'"
											cascada1-a="datos.oConfiguracionTipoOperacion.filtros.IdClasificacionTipoInstrumento"
											cascada1-valor="'IdClasificacionTipoInstrumento'"
											activado="seleccionMcdo"
											ng-disabled="data.modoLectura"> </bcs-combobox-base>
									</div>
								</div>
								<div class="col-xs-3">
									<label class="col-xs-4"> </label> <label class="col-xs-4">Todos</label>
									<bcs-input-checkbox class="col-xs-4"
										ng-model="data.Filtros.TodosNemo"
										ng-disabled="seleccionTodosNemo || data.modoLectura"> </bcs-input-checkbox>
								</div>
		
							</div>
							<!-- FIN PARAMETROS NEMO -->
							<hr>
							<!-- PARAMETROS EMPLEADOS -->
							<div class="row">
								<div class="col-xs-9">
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3" translate>Empleado</label>
										<bcs-combobox-base class="col-xs-9" id="comboboxSocioNegocio"
											auto-cargar="'false'" tipo="'combobox-socio-negocio'"
											configuracion="data.oConfiguracionEmpleado.configuracion"
											id-Actual="data.oConfiguracionEmpleado.idActual"
											seleccionado="data.oConfiguracionEmpleado.seleccionado"
											ng-model="data.Filtros.RutTrabajador" activado="activadoEmpl">
										</bcs-combobox-base>
									</div>
									<div class="row" ng-show="modoVisualizacion">
										<label class="col-xs-3" translate>UI_EMPLEADO</label> 
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="!ingresarSolicitud.muestraEmpleados" ng-click="ingresarSolicitud.muestraEmpleados = !ingresarSolicitud.muestraEmpleados">({{'+'| translate}})</em>
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="ingresarSolicitud.muestraEmpleados" ng-click="ingresarSolicitud.muestraEmpleados = !ingresarSolicitud.muestraEmpleados">({{'-'| translate}})</em>
									</div>
									<div class="row" ng-show="ingresarSolicitud.muestraEmpleados">
										<!-- <bcs-grid id="gridListadoNemo"
											configuracion="confBasicaListadoNemo"
											seleccionado="seleccionListadoNemo" 
											fn-click="">
										</bcs-grid> -->
									</div>
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3" translate>Listado Rut Empleado </label>
										<input class="col-xs-9" type="file" ng-disabled="listRutEmpl" ng-model="data.Filtros.ListRutEmpl"
										file-reader="data.FiltrosRutEmpl.fileContent"
										style="display: inline" />
									</div>
								</div>
								<div class="col-xs-3">
									<label class="col-xs-4"> </label>
									<label class="col-xs-4">Todos</label>
									<bcs-input-checkbox class="col-xs-4"
										ng-model="data.Filtros.TodosEmpl"
										ng-disabled="seleccionTodosEmpl || data.modoLectura">
									</bcs-input-checkbox>
								</div>
							</div>
							<!-- FIN PARAMETROS EMPLEADOS -->
							<hr>
							<!-- PARAMETROS AUTORIZADOS -->
							<div class="row">
								<div class="col-xs-9">
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3" translate>Autorizado</label>
										<bcs-combobox-base class="col-xs-9" id="comboboxSocioNegocio"
											auto-cargar="'false'" tipo="'combobox-socio-negocio'"
											configuracion="data.oConfiguracionAutorizado.configuracion"
											id-Actual="data.oConfiguracionAutorizado.idActual"
											seleccionado="data.oConfiguracionAutorizado.seleccionado"
								 			activado="activadoAut">
										</bcs-combobox-base>
									</div>
									<div class="row" ng-show="modoVisualizacion">
										<label class="col-xs-3" translate>UI_AUTORIZADO</label> 
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="!ingresarSolicitud.muestraAutorizados" ng-click="ingresarSolicitud.muestraAutorizados = !ingresarSolicitud.muestraAutorizados">({{'+'| translate}})</em>
										<em class="col-xs-9" style="text-decoration: underline;" ng-show="ingresarSolicitud.muestraAutorizados" ng-click="ingresarSolicitud.muestraAutorizados = !ingresarSolicitud.muestraAutorizados">({{'-'| translate}})</em>
									</div>
									<div class="row" ng-show="ingresarSolicitud.muestraAutorizados">
										<!-- <bcs-grid id="gridListadoNemo"
											configuracion="confBasicaListadoNemo"
											seleccionado="seleccionListadoNemo" fn-click="">
										</bcs-grid> -->
									</div>
									<div class="row" ng-show="!modoVisualizacion">
										<label class="col-xs-3" translate>Listado Rut Aut </label> <input
										class="col-xs-9" type="file" ng-disabled="listRutAut" ng-model="data.Filtros.ListRutAut"
										file-reader="data.FiltrosRutAut.fileContent"
										style="display: inline" /> 
									</div>
									
								</div>
								<div class="col-xs-3">
									<label class="col-xs-4"> </label> 
									<label class="col-xs-4">Todos</label>
									<bcs-input-checkbox class="col-xs-4"
										ng-model="data.Filtros.TodosAut" ng-disabled="seleccionTodosAut || data.modoLectura">
									</bcs-input-checkbox>
								</div>
							</div>
							<!-- FIN PARAMETROS AUTORIZADOS -->
						</div>
					</div>
				</div>
			</uib-tab> 
		</uib-tabset>

		<div class="col-xs-12" style="top: 25px">
			
			<div class="row">
				<div class="col-xs-4">
					<div class="col-xs-6">
			            <label>Separador Listas</label>
			        </div>
			        <div class="col-xs-6">
			            <select style="width:100%;" ng-model="data.separadorListas" ng-disabled="data.modoLectura">
			                <option value=",">Coma</option>
			                <option value=";">Punto y coma</option>
			            </select>
			        </div>
				</div>
				
				<div class="col-xs-4">
			        <div class="col-xs-6">
			            <label>Simbolo Decimal</label>
			        </div>
			        <div class="col-xs-6">
			            <select style="width:100%;" ng-model="data.simboloDecimal" ng-disabled="data.modoLectura" >
			                <option value=",">Coma</option>
			                <option value=".">Punto</option>
			            </select>
			        </div>
		        </div>
		        
		        <div class="col-xs-4">
			        <div class="col-xs-6">
			            <label>Formato Fecha</label>
			        </div>
			        <div class="col-xs-6">
			            <select style="width:100%;" ng-model="data.simboloFecha" ng-disabled="data.modoLectura" >
			                <option value="dd/MM/yyyy">dd/MM/yyyy</option>
			                <option value="MM/dd/yyyy">MM/dd/yyyy</option>
			            </select>
			        </div>
		        </div>
		    </div>
			
			
			<label class="col-xs-2" translate>Observaciones Grales.</label>
			<div class="row" style="height: 70px">
				<textarea class="col-xs-10" id="data.Observaciones"
					ng-model="data.Observaciones"
					ng-disabled="data.modoLectura"></textarea>
			</div>
		</div>


		<div class="col-xs-12" style="top: 10px">
		
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'default'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="data.limpiarFormulario()"></bcs-button>
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'principal'"
				bcs-auto-desactivar="false" bcs-texto="'Crear'"
				bcs-habilitado="forms.datosBasicos.$valid"
			    bcs-clic="data.cargar()"></bcs-button>
		</div>



	</div>

	</div>
</form>

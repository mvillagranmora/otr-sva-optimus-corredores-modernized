<div id="MantenedorFilialesP40" class="row"
	ng-controller='MantenedorFilialesP40Ctrl'>
	<div class="col-xs-12">
		<div class="row">
			<bcs-grid id="grid-mantenedor-filiales-p40"
				configuracion="data.confMantenedorFilialesP40"
				seleccionado="data.seleccionFilialP40"
				fn-exportar-excel="excelMovimientosEnTransito"> </bcs-grid>
			<div class="row">
				<div class="col-xs-12 bcs-panel-comandos">
					<bcs-button 
						id="MantenedorFiliales_Agregar" 
						class="col-xs-2"
						bcs-tipo="'principal'" 
						bcs-auto-desactivar="false"
						bcs-texto="'UI_AGREGAR' | translate" 
						bcs-habilitado="true"
						bcs-clic="data.AgregarFiliales()">
					</bcs-button>
					<bcs-button 
						id="MantenedorFiliales_Editar" 
						class="col-xs-2" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_EDITAR' | translate"
						bcs-habilitado="(HabilitoBotones)"
						bcs-clic="data.EditarFiliales()" >
					</bcs-button>		
					<bcs-button 
						id="MantenedorFiliales_Eliminar" 
						class="col-xs-2" 
						bcs-auto-desactivar="false"
						bcs-texto="'UI_ELIMINAR' | translate"
						bcs-habilitado="(HabilitoBotones)"
						bcs-clic="data.EliminarFiliales()">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
</div>

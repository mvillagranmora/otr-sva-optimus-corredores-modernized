 <div class="col-xs-12" ng-controller="FilialArchivoP40Ctrl as FilialArchivoP40">
	<form name="FormFilialArchivoP40" class="filters-formulario">
	   	<div class="row">
			<div class="col-xs-12">
				<div class="row">
			<label class="col-xs-4" translate>UI_CLIENTE</label>                
					<bcs-combobox-base
						class="col-xs-7"
						id="frmCarteras_Cliente"
						id-actual="data.IdSocioDeNegocio"
						id-defecto="oConfiguracionCliente.idDefecto"
						auto-cargar="'true'"
						activado="HabilitoCampos"
						bcs-requerido = "(filtros.folioCartera===undefined || filtros.folioCartera===null)"
						tipo="oConfiguracionCliente.tipo"
						filtros="oConfiguracionCliente.filtros"                                 
						configuracion= "oConfiguracionCliente.configuracion"                                                    
						seleccionado="oConfiguracionCliente.seleccionado"                                   
						cascada-a="oConfiguracionPortafolio.filtros.IdCliente"
						cascada-defecto="-1"
						cascada-valor="'IdCliente'">
					</bcs-combobox-base>
				</div>
		  		<div class="row">
			  	    <label class="col-xs-4" translate>UI_CODIGO_TENEDOR</label> 
			  		<bcs-input-texto 
						class="col-xs-7"
						ng-model="data.CodigoTenedor">
					</bcs-input-texto>
		  		</div>
		  		<div class="row">
			  	    <label class="col-xs-4" translate>UI_NOMBRE_ZIP</label> 
			  		<bcs-input-texto 
						class="col-xs-7"
						ng-model="data.NombreZip">
					</bcs-input-texto>
		  		</div>
		  		<div class="row">
			  	    <label class="col-xs-4" translate>UI_NOMBRE_ARCHIVO</label> 
			  		<bcs-input-texto 
						class="col-xs-7"
						ng-model="data.NombreArchivo">
					</bcs-input-texto>
		  		</div>
			</div>
		</div>
		</form>
		<div class="row bcs-panel-comandos">
			<div class=col-xs-3>
				<bcs-button class="row col-xs-12" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_GUARDAR' | translate" 
					bcs-habilitado=true
					bcs-tipo="'principal'" 
					bcs-clic="data.GuardarFiliales()"
				>
				</bcs-button>	
			</div>
			<div class="col-xs-3">
				<bcs-button class="row col-xs-12" 
					bcs-texto="'UI_CANCELAR' | translate"
					bcs-habilitado=true
					bcs-clic="data.Cancelar()" >
				</bcs-button>	
			</div>
		</div>
</div>

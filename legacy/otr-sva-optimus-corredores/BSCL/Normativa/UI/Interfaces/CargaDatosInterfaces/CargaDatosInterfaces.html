<div id="CargaDatosInterfaces" class="col-xs-12" ng-controller="CargaDatosInterfacesCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<form name="CargaDatosInterfacesForm" class="filters-formulario">
			<div class="row">
				<label class="col-xs-3" translate>UI_INTERFAZ</label>
				<bcs-combobox-base 
			  		class="col-xs-9"
					tipo="'combobox-interfaces'"
					bcs-requerido 				
					seleccionado="formData.Interfazseleccionado"
					id-actual="formData.idInterfaz"
					filtros="oConfiguracionInterfaz.filtros">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_ARCHIVO</label>
				<div class="col-xs-4">
					<input type="file" file-reader-interfaz callback = "formInfo.cargarArchivo" ng-accept="configArchivo.formatoArchivoDefecto" style="display:inline"/>
				</div>
			</div>
			<div class="row bcs-panel-comandos">
				<div class=col-xs-8>
					<bcs-button class="col-xs-4" id="SolicitarInterfaz" 
						bcs-texto="'UI_CARGAR' | translate" 
						bcs-habilitado="CargaDatosInterfacesForm.$valid && formData.archivo"
						bcs-tipo="'principal'" 
						bcs-auto-desactivar="false"
						bcs-clic="formInfo.cargarInterfaz()">
					</bcs-button>	
					<bcs-button class="col-xs-4" id="LimpiarSolicitudInterfaz"
						bcs-tipo="''" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'" 
						bcs-clic="formInfo.limpiarFiltros()">
					</bcs-button>
				</div>
			</div>
		</form>
	</div>
</div>

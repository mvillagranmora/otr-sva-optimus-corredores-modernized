<div id="EnvioArchivoCM" class="col-xs-12" ng-controller="EnvioArchivoCMCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
			  	<div class="col-xs-6">				
				<label class="col-xs-4" translate>UI_SOCIO_NEGOCIO</label>
					<bcs-combobox-base 
						class="col-xs-6"
					 	id="UI_SOCIO_NEGOCIO"
					 	auto-cargar="'false'"
					 	id-Actual="data.oConfiguracionSocioNegocio.idActual"
					    tipo="'combobox-socio-negocio'"
					    seleccionado="data.oConfiguracionSocioNegocio.seleccionado"
					    filtros="data.oConfiguracionSocioNegocio.filtros"
					    configuracion= "data.oConfiguracionSocioNegocio.configuracion"
						cascada-a="data.oConfiguracionPortafolio.filtros.IdCliente"
						cascada-valor="'IdCliente'"
						cascada-defecto="-1" >
					</bcs-combobox-base >
				</div>
			  	<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-6"
						id="frmFECHA"
						k-ng-model="filtros.fechaDesde"
						bcs-requerido>
					</bcs-input-date>	
				</div>
		  	</div>
		  	<div class="row">
			  	<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base
						class="col-xs-6" 
						tipo="data.oConfiguracionEstadoMovimiento.tipo"
						filtros="data.oConfiguracionEstadoMovimiento.filtros"
						id-actual="data.oConfiguracionEstadoMovimiento.idActual"
						seleccionado="data.oConfiguracionEstadoMovimiento.seleccionado"
						todos="'S'"
						item-post-filtro="'1'" >
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_MERCADO</label>
					<bcs-combobox-base
						class="col-xs-6"
						id="frmMercado"
						auto-cargar="'true'"
						todos="'S'"
						tipo="'combobox-parametro-mesa'"
						seleccionado="data.oConfiguracionMercado.seleccionado"
						filtros="data.oConfiguracionMercado.filtros"
						id-actual="data.oConfiguracionMercado.idActual"
						configuracion= "data.oConfiguracionMercado.configuracion"
						id-defecto="data.oConfiguracionMercado.idDefecto"
						item-post-filtro="'1'" >
					</bcs-combobox-base>
				</div>
		  	</div>
		  	<div class="row">
		  		<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
					<bcs-combobox-base
						class="col-xs-6"
						id="frmTipo_Operacion"
						auto-cargar="'true'"
						todos="'S'"
						tipo="'combobox-parametro-mesa'"
						seleccionado="data.oConfiguracionTipoOperacion.seleccionado"
						filtros="data.oConfiguracionTipoOperacion.filtros"
						id-actual="data.oConfiguracionTipoOperacion.idActual"
						configuracion= "data.oConfiguracionTipoOperacion.configuracion"
						id-defecto="data.oConfiguracionTipoOperacion.idDefecto"
						item-post-filtro="'1'">
					</bcs-combobox-base>
				</div>
			  	<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_TIPO_COMPROBANTE</label>
					<bcs-combobox-base
						class="col-xs-6" 
						id="frmTipo_Comprobante"
						auto-cargar="'true'"
						todos="'S'"
						tipo="'combobox-parametro-mesa'"
						seleccionado="data.oConfiguracionTipoComprobante.seleccionado"
						filtros="data.oConfiguracionTipoComprobante.filtros"
						id-actual="data.oConfiguracionTipoComprobante.idActual"
						configuracion= "data.oConfiguracionTipoComprobante.configuracion"
						id-defecto="data.oConfiguracionTipoComprobante.idDefecto"
						item-post-filtro="'1'">
					</bcs-combobox-base>
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscar(apiGridCM,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-archivo-interfaces"
			 	configuracion="defaultOptions"
				api = "apiGridCM"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-2" id="GENERAR_CM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_GENERAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="generarCM()">
			</bcs-button>		
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

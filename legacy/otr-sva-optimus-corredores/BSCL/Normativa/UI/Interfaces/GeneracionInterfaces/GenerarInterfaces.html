<div class="row" ng-controller="GenerarInterfacesCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<form name="PanelSolicitudInterfaces" class="filters-formulario">
			
			<div class="row">
				<label class="col-xs-6" translate>UI_FECHA_SOLICITUD</label>
				<bcs-input-date
					class="col-xs-6"
					k-ng-model="fecha"
					todo-dias="true"
					>
				</bcs-input-date >
			</div>
			<div class="row">
			<label class="col-xs-6" translate>UI_INTERFAZ</label>
				<bcs-combobox-base class="col-xs-6"
				    tipo			="data.oConfiguracionInterfaz.tipo"
				    seleccionado	="formData.idInterfazSeleccionadaObj"
                    id-actual		="formData.interfaz"
                    cascada-a		="data.oConfiguracionSubInterfaz.filtros.IdInterfaz"
				    cascada-valor	="'IdInterfaz'"				
                    todos			="'N'"
                    >
				</bcs-combobox-base>
			</div>
			
			<div class="row">
			<label class="col-xs-6" translate>UI_TIPO_INTERFAZ</label>
				<bcs-combobox-base class="col-xs-6"
				    tipo			="data.oConfiguracionSubInterfaz.tipo"
				    seleccionado	="formData.idSubInterfazSeleccionadaObj"
                    id-actual		="formData.subInterfaz"
                    filtros			="data.oConfiguracionSubInterfaz.filtros"
                    todos			="'N'"
                    activado        ="formData.interfaz"
                    >
				</bcs-combobox-base>
			</div>

			<div class="row">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-3"
					id					= "btn_SolicitarInterfaz" 
					bcs-tipo			= "'principal'" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_SOLICITAR' | translate"
					bcs-habilitado		= "formData.interfaz" 
					bcs-clic			= "cargarInterfazPrueba()">
			</bcs-button>	
			</div>	
		</div>
		</form>
	</div>
</div>

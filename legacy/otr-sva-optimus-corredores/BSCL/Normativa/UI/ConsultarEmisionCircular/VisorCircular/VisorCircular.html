<div class="row" ng-controller='VisorCircularesCtrl'>
	<div class="row bcs-cuerpo" ng-form="frmVisorCirculares">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<!-- <div id="gridVisorCirculares">
					</div> -->
					<bcs-grid id="gridVisorCirculares"
						configuracion="confBasicaGridVisorCirculares"
						seleccionado="gridVisorCircularesSeleccionado" 
						fn-click=""
						fn-doble-click=""
						fn-exportar-excel="excelVisorCircular">
					</bcs-grid>
				</div>
			</div>
		</div>
	</div>
	
	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-2" id="frmVisorCirculares_btn_cerrar"

			bcs-texto="'UI_CERRAR' | translate" 
			bcs-habilitado='true'
			bcs-clic="cerrarVentana()">
		</bcs-button>
		
		<bcs-menu 
			class="col-xs-2 pull-right" 
			bcs-tipo="'bcs-button-secondary'"
			bcs-habilitado="'true'" 
			bcs-texto="'UI_OPCIONES' | translate">

		</bcs-menu>

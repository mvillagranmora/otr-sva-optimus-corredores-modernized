<div id="PanelCarta2SVS" class="row" ng-controller="PanelCarta2SVSCtrl as pc2">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-8" k-options="pc2.FecInicioOptions" k-ng-model="pc2.FecInicio"></bcs-input-date>
			</div>
			<div class="col-xs-6"  ng-show="false">
				<label class="col-xs-4" translate>UI_HASTA</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pc2.FecTermino"></bcs-input-date>
			</div>
	</div>
</form>	
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px">
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'principal'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc2.solicitar()">
			 </bcs-button>
			 
			 <bcs-button class="col-xs-2 pull-left"   bcs-tipo="''"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_VER_DATOS' | translate"  
			 	bcs-habilitado="true" 
			 	bcs-clic="pc2.visorCircular()">
			 </bcs-button>
			 
			 <bcs-button  class="col-xs-2" id="frmPanelCarta1BCS_btn_imprimir"
				bcs-tipo=""
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="imprimirCircular()">
			</bcs-button>
						 
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'default'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pc2.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

<div id="PanelCIR1518" class="row" ng-controller="PanelCIR1518Ctrl as pct">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pct.FecTermino"></bcs-input-date>
			</div>
			<div class="col-xs-6">
			  		<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-clasificacion-tipo-instrumento'"
						id-actual="pct.IdClasificacionTipoInstrumento"
						id-defecto="'0'"
						filtros="pct.cmbbx.ClasificacionTipoInstrumento.filtros"
						todos="'S'"
						seleccionado="pct.dataModal.ClasificacionTipoInstrumentoObj"
						cascada1-a="pct.cmbbx.TipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
			</div>
	</div>
	<div class="row">
		
			
			
	</div>
</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px">
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'principal'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pct.solicitar()">
			 </bcs-button>

			 <bcs-button class="col-xs-2 pull-left"   bcs-tipo="''"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_VER_DATOS' | translate"  
			 	bcs-habilitado="true" 
			 	bcs-clic="pct.visorCircular()">
			 </bcs-button>
			 
			 <bcs-button  class="col-xs-2" id="frmPanelCIR1518_btn_imprimir" ng-show="false"
				bcs-tipo=""
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="imprimirCircular()">
			</bcs-button>
			 
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'default'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pct.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

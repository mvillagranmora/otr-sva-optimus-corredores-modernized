<div id="SolicitarCircular" ng-controller="SolicitarCircularCtrl as solCir">
	<form class="col-xs-12 form-horizontal">

		<div class="row" >
				<label class="col-xs-3" translate> Fecha Ingreso Solicitud: </label>
				<bcs-input-date class="col-xs-3" bcs-requerido
					k-ng-model="solCir.fechaInicioSol"
					k-ng-readonly="'true'">
				</bcs-input-date>
				<label class="col-xs-3" translate>UI_USUARIO</label>
				<label style="font-weight: bold" class="col-xs-3" id="User"
					ng-model="solCir.lblUsuario" translate>{{SesionUsuario}}</label>
		
		</div>
			
		<div class="row">
			<span class="col-xs-3">
				<label class="col-xs-4" translate>UI_FORMATO&nbsp;&nbsp;</label>
				<em class="col-xs-4" style="text-decoration: underline;" ng-show="!solCir.muestraFormatos" ng-click="solCir.muestraFormatos = !solCir.muestraFormatos">({{'UI_MOSTRAR' | translate}})</em>
				<em class="col-xs-4" style="text-decoration: underline;" ng-show="solCir.muestraFormatos" ng-click="solCir.muestraFormatos = !solCir.muestraFormatos">({{'UI_OCULTAR' | translate}})</em>
			</span>
		</div>
		
		<div class="row"  ng-show="solCir.muestraFormatos">
					<div class="col-xs-3">
				            <label>Separador Listas</label>
				    </div>
				    <div class="col-xs-3">
				            <select style="width:100%;" ng-model="solCir.separadorListas" ng-disabled="data.modoLectura">
				                <option value=",">Coma</option>
				                <option value=";">Punto y coma</option>
				            </select>
				    </div>
						
					<div class="col-xs-3">
			            <label>Simbolo Decimal</label>
			        </div>
			        <div class="col-xs-3">
			            <select style="width:100%;" ng-model="solCir.simboloDecimal" ng-disabled="solCir.modoLectura" >
			                <option value=",">Coma</option>
			                <option value=".">Punto</option>
			            </select>
			        </div>
				        
				        
			</div>
			<div class="row" ng-show="solCir.muestraFormatos">
		        <div class="col-xs-3">
			            <label>Formato Fecha</label>
			        </div>
			        <div class="col-xs-3">
			            <select style="width:100%;" ng-model="solCir.simboloFecha" ng-disabled="solCir.modoLectura" >
			                <option value="dd/MM/yyyy">dd/MM/yyyy</option>
			                <option value="MM/dd/yyyy">MM/dd/yyyy</option>
			            </select>
			        </div>
			</div>			
			
		</form>
				
	<form class="col-xs-12 form-horizontal">
		<div class="row" >
			<label class="col-xs-3" translate>UI_NORMATIVA</label>
			<bcs-combobox-base class="col-xs-6"
						tipo = "'combobox-tipo-normativa'"
						seleccionado="solCir.cmbbx.IdNormativaObj"
						bcs-requerido
						auto-cargar="true"
						item-post-filtro="'1'"
						id-defecto="solCir.params.PrevNormativa.idactual"
						id-actual = "solCir.cmbbx.IdNormativa"
						filtros="solCir.cmbbx.Normativa.filtros"
						cascada1-a="solCir.cmbbx.TipoDocumento.filtros.IdNormativa"
						cascada1-valor="'IdNormativa'">   
		 	</bcs-combobox-base >		
		</div>
		<div class="row" >
			<label class="col-xs-3" translate>UI_TIPO_DOCUMENTO</label>
			<bcs-combobox-base class="col-xs-6"
						tipo = "'combobox-tipo-documento-normativa'"
						id-actual = "solCir.cmbbx.IdTipoDocumento"
						filtros="solCir.cmbbx.TipoDocumento.filtros"
						auto-cargar="true"
						item-post-filtro="'1'"
						id-defecto="solCir.params.PrevDocumento.IdTipoDocumento"
						todos="'N'"
						seleccionado="solCir.cmbbx.IdTipoDocumentoObj">
		 	</bcs-combobox-base >		
		</div>
		<hr>
		<br>

	<form class="col-xs-12 form-horizontal">

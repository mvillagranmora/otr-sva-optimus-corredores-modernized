<div class="col-xs-12" ng-controller="ActivarEsquemaDeclaracionCtrl">
	<form name="ActivarEsquemaDeclaracion" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_VERSION</label>
					<bcs-combobox-base class="col-xs-8"
							id="UI_VERSION"
							bcs-requerido
			  				tipo="'combobox-version-declaracion'"
				  			id-actual="formData.version"
				  			seleccionado="formData.versionSeleccionado"
				  			filtros="datos.oConfiguracionVersion.filtros">
			  		</bcs-combobox-base>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_FECHA_LIMITE_PRESENTACION</label>
					<bcs-input-date
			  			id="UI_FECHA_LIMITE_PRESENTACION"
						class="col-xs-8"
						k-ng-model="formData.fechaLimitePresentacion" 
						bcs-requerido
						k-options="formData.fechaOptions">
					</bcs-input-date>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_OBSERVACION</label>
					<bcs-input-texto class="col-xs-8"
			  			id="UI_GLOSA"
				  		maxlength="100"
						tipo-campo="'textarea'"
						ng-model="formData.observacion"
						atributos="margin: 0px; height:73px;resize:none;width: 100%">
				  	</bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<hr>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button class="col-xs-3" id="ActivarEsquemaDeclaracion_ACTIVAR" 
				bcs-texto="'UI_ACTIVAR' | translate" 
				bcs-habilitado="ActivarEsquemaDeclaracion.$valid"
				bcs-tipo="'bcs-button-input-form'" 
				bcs-auto-desactivar="true"
				bcs-clic="activarEsquema()">
			</bcs-button>	
			<bcs-button class="col-xs-3" id="ActivarEsquemaDeclaracion_LIMPIAR"
				bcs-tipo="'bcs-button-input-form'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_LIMPIAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="limpiar()">
			</bcs-button>
		</div>
	</div>
</div>

<div class="col-xs-12" ng-controller="AgregarEsquemaDeclaracionCtrl">
	<form name="AgregarEsquemaDeclaracion" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_PERIODO</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_PERIODO"
				  		maxlength="100"
				  		bcs-requerido
						ng-model="formData.periodo">
			  		</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_FECHA_LIMITE_PRESENTACION</label>
					<bcs-input-date
			  			id="UI_FECHA_LIMITE_PRESENTACION"
						class="col-xs-8"
						k-ng-model="formData.fechaLimitePresentacion" 
						bcs-requerido
						k-options="formData.fechaOptions">
					</bcs-input-date>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_OBSERVACION</label>
					<bcs-input-texto class="col-xs-8"
			  			id="UI_GLOSA"
				  		maxlength="100"
						tipo-campo="'textarea'"
						ng-model="formData.observacion"
						atributos="margin: 0px; height:73px;resize:none;width: 100%">
				  	</bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<hr>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button class="col-xs-3" id="AgregarEsquemaDeclaracion_INGRESAR" 
				bcs-texto="'UI_INGRESAR' | translate" 
				bcs-habilitado="AgregarEsquemaDeclaracion.$valid"
				bcs-tipo="'bcs-button-input-form'" 
				bcs-auto-desactivar="true"
				bcs-clic="ingresarEsquema()">
			</bcs-button>	
			<bcs-button class="col-xs-3" id="AgregarEsquemaDeclaracion_LIMPIAR"
				bcs-tipo="'bcs-button-input-form'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_LIMPIAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="limpiar()">
			</bcs-button>
		</div>
	</div>
</div>

<div class="col-xs-12" ng-controller="AbrirPeriodoEsquemaDeclaracionCtrl">
	<form name="AbrirPeriodoEsquemaDeclaracion" class="filters-formulario">
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<label class="col-xs-4" translate>UI_PERIODO</label>
					<bcs-input-texto class="col-xs-8"
						id="UI_PERIODO"
				  		maxlength="100"
				  		bcs-requerido
						ng-model="formData.periodo">
			  		</bcs-input-texto>
				</div>
			</div>
		</div>
	</form>
	<hr>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button class="col-xs-3" id="AbrirPeriodoEsquemaDeclaracion_INGRESAR" 
				bcs-texto="'UI_INGRESAR' | translate" 
				bcs-habilitado="AbrirPeriodoEsquemaDeclaracion.$valid"
				bcs-tipo="'bcs-button-input-form'" 
				bcs-auto-desactivar="true"
				bcs-clic="ingresarPeriodo()">
			</bcs-button>	
			<bcs-button class="col-xs-3" id="AbrirPeriodoEsquemaDeclaracion_LIMPIAR"
				bcs-tipo="'bcs-button-input-form'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_LIMPIAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="limpiar()">
			</bcs-button>
		</div>
	</div>
</div>

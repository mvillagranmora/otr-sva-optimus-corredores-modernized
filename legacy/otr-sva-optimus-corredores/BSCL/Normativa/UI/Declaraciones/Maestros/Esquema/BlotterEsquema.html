<div id="BlotterEsquemaDeclaracionTributario" class="col-xs-12" ng-controller="BlotterEsquemaDeclaracionTributarioCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_ESQUEMA</label>
					<bcs-combobox-base class="col-xs-8"
			  				tipo="'combobox-esquema-declaracion'"
				  			id-actual="filtros.esquema"
				  			seleccionado="filtros.esquemaSeleccionado"
				  			filtros="datos.oConfiguracionEsquema.filtros">
			  		</bcs-combobox-base> 
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarEsquemas(apiGridEsquemas,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-esquema-declaracion-tributario"
			 	configuracion="defaultOptions"
				api = "apiGridEsquemas"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-buttons">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="BlotterEsquemaDeclaracionTributario_NUEVO" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_NUEVO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="nuevoEsquema(datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-3" id="BlotterEsquemaDeclaracionTributario_ABRIR_PERIODO" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ABRIR_PERIODO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="abrirPeriodo()">
			</bcs-button>
			<bcs-button class="col-xs-3" id="BlotterEsquemaDeclaracionTributario_ACTIVAR" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTIVAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="activarEsquema(datos.kNgModel)">
			</bcs-button>
			<bcs-button class="col-xs-3" id="BlotterEsquemaDeclaracionTributario_BLOQUEAR_DESBLOQUEAR" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_BLOQUEAR_DESBLOQUEAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="bloquearDesbloquearEsquema(datos.kNgModel)">
			</bcs-button>
		</div>
		<div class="col-xs-2 pull-right">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

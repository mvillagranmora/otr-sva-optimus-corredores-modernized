<div id="CargaIpc" class="col-xs-12" ng-controller="CargaIpcCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarIPC(apiGridIPC,filtros)"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-ipc"
			 	configuracion="defaultOptions"
				api = "apiGridIPC"
				seleccionado="datos.kNgModel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR_IPC' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="cargarIPC()">
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTUALIZAR_IPC' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="actualizarIPC()">
			</bcs-button>		
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

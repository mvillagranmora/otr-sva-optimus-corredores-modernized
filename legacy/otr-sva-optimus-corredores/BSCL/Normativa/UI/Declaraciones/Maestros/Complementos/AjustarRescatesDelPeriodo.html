<div id="AjustarRescatesDelPeriodo" class="col-xs-12" ng-controller="AjustarRescatesDelPeriodoCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarAjustarRescatesDelPeriodo(apiAjustarRescatesDelPeriodo,filtros)"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid
				id="grid-ajustar-rescates-del-periodo"
			 	configuracion="defaultOptions"
				api = "apiAjustarRescatesDelPeriodo"
				seleccionado="datos.kNgModel">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button
				class="col-xs-3"
				id="idAjustarRescatesDelPeriodo"
				bcs-tipo="''"
				bcs-auto-desactivar="false"
				bcs-texto="'UI_ACTUALIZAR' | translate"
				bcs-habilitado="'true'"
				bcs-clic="actualizarAjustarRescatesDelPeriodo()">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

<div id="FondoAccionario" class="col-xs-12" ng-controller="FondoAccionarioCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarFondoAccionarios(apiGridFondosAccionarios,filtros)"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-fondos-accionarios"
			 	configuracion="defaultOptions"
			 	fn-doble-click="modificarFondoAccionario(datos.kNgModel)"
				api = "apiGridFondosAccionarios"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ingresarFondoAccionario()">
			</bcs-button>	
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTUALIZAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="cargarFondosAccionarios()">
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTIVAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="activarDesactivarFondosAccionarios(datos.kNgModel,'ACT')">
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_DESACTIVAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="activarDesactivarFondosAccionarios(datos.kNgModel,'INA')">
			</bcs-button>		
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			<bcs-menu bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

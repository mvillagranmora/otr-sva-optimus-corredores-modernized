<div id="AsociarEventoCapital" class="col-xs-12" ng-controller="AsociarEventoCapitalCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="col-xs-4">
		  		<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
		  		<bcs-input-instrumentos class="col-xs-6" 
					datos-instrumento="filtros.instrumento"
					buscar-instrumento="filtros.buscarInstrumento"
					bcs-requerido
					filtro-clasificacion="filtros.IdClasificacionTipoInstrumento">
				</bcs-input-instrumentos>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarCalificaciones(apiGridEventoCapital,filtros)"></bcs-button>
			</div>  
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-evento-capital"
			 	configuracion="configuracionGrillaAsociarEventoCapital"
				api = "apiGridEventoCapital"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ASOCIAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="asociarEventoCapital(datos.kNgModel)">
			</bcs-button>		
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
		</div>
	</div>
</div>

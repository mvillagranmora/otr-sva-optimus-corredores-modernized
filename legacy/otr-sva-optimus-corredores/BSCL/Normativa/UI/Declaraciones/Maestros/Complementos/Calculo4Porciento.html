<div id="FondoAccionario" class="col-xs-12" ng-controller="Calculo4PorcientoCtrl">
	<div class="row bcs-cuerpo">
	   	<div class="row">
			<div class="col-xs-10">
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscar(apiGrid,filtros)"></bcs-button>
				</div>
		  	</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-9" >CLIENTES</label>
			</div>
			<div class="col-xs-8">
				<bcs-combobox-base
				   tipo="'combobox-clientes-complemento4porciento'"
				   todos = "'S'"
				   item-post-filtro = "'1'"
				   seleccionado="filtros.Cliente"
				   id-actual="filtros.IdCliente"
				   cascada-a="formData.oConfiguracionTipoNemo.filtros.IdCliente"
				   cascada-valor="'IdCliente'"
                   bcs-requerido>
		  		</bcs-combobox-base>
		  	</div>
		  	<div class="col-xs-2">
		  	</div>
	  		<div class="col-xs-2">
		  	</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-9" >INSTRUMENTO</label>
			</div>
			<div class="col-xs-8">
				<bcs-combobox-base
						tipo="'combobox-nemo-complemento4porciento'"
						item-post-filtro = "'1'"
						todos = "'S'"
						filtros="formData.oConfiguracionTipoNemo.filtros"
						id-actual="filtros.Nemotecnico"
						seleccionado="filtros.tipoNemo">
		  		</bcs-combobox-base>
		  	</div>
		  	<div class="col-xs-2">
		  	</div>
	  		<div class="col-xs-2">
		  	</div>
		</div>
		<div class="row">
			<bcs-grid 
				id="grid-consulta-fondos-accionarios"
			 	configuracion="defaultOptions"
				api = "apiGrid"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class=col-xs-9>	
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="'principal'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_PROCESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ProcesarNemos()"
				>
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACTIVAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="ActivarProcesar(datos.kNgModel,'ACT',filtros)">
			</bcs-button>
			<bcs-button class="col-xs-3" id="MantenedorFondos_IngresarInstrumentoFMM" 
				bcs-tipo="''" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_DESACTIVAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="DesactivarProcesar(datos.kNgModel,'INA',filtros)">
			</bcs-button>		
		</div>
		<div class="col-xs-1"></div>
		<div class="col-xs-2">
			
		</div>
	</div>
</div>

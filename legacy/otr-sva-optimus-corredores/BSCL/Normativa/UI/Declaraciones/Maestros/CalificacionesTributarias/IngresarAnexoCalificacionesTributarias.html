<div class="col-xs-12" ng-controller="IngresarAnexoCalificacionTributariaCtrl as ingresarAnexoCalificacionTributaria">
	<form name="FormIngresoAnexoCalificacionTributaria" class="filters-formulario">
	   	<div class="row">
			<div class="col-xs-12">
				<div class="row">
		  			<label class="col-xs-2" translate>UI_DATOS_ANEXO_CALIFICACION_TRIBUTARIA</label>
		  		</div>
		  		<hr>
			  	<div class="row">
					<label class="col-xs-3" translate>UI_MERCADO</label>
					<bcs-combobox-base
						tipo="'combobox-clasificacion-tipo-instrumento'"
						class="col-xs-3"
						todos = "'N'"
						bcs-requerido
						id-actual="ingresarAnexoCalificacionTributaria.datosDespues.IdClasificacionTipoInstrumento"
						id-defecto="ingresarAnexoCalificacionTributaria.datosAntes.IdClasificacionTipoInstrumento">
					</bcs-combobox-base>
			  		
					<label class="col-xs-2 col-xs-offset-1" translate>UI_INSTRUMENTO</label> 
			  		<bcs-input-instrumentos class="col-xs-3" 
						datos-instrumento="ingresarAnexoCalificacionTributaria.filtros.instrumento"
						buscarInstrumento="ingresarAnexoCalificacionTributaria.buscarInstrumento"
						bcs-requerido
						filtro-clasificacion="ingresarAnexoCalificacionTributaria.datosDespues.IdClasificacionTipoInstrumento">
					</bcs-input-instrumentos> 
				</div>
			  	<div class="row">
			  	    <label class="col-xs-3" translate>UI_FECHA_PAGO</label> 
			  		<bcs-input-date
						class="col-xs-3"
						id="UI_FECHA_PAGO"
						bcs-requerido
						k-ng-model="ingresarAnexoCalificacionTributaria.datosDespues.FechaPago">
					</bcs-input-date>
			  		
			  		<label class="col-xs-2 col-xs-offset-1"  translate>UI_EVENTO_CAPITAL</label>
					<bcs-input-numero
						class="col-xs-3"
						id="UI_EVENTO_CAPITAL"
						bcs-requerido
					 	k-ng-model="ingresarAnexoCalificacionTributaria.datosDespues.IdEventoCapital"
					 	decimales="'0'">
					</bcs-input-numero>
		  		</div>
		  		<div class="row">
			  	    <label class="col-xs-3" translate>UI_SECUENCIA_EVENTO</label> 
			  		<bcs-input-numero
						class="col-xs-3"
						id="UI_SECUENCIA_EVENTO"
						bcs-requerido
					 	k-ng-model="ingresarAnexoCalificacionTributaria.datosDespues.SecuenciaEvento"
					 	decimales="'0'">
					</bcs-input-numero>
			  		
			  		<label class="col-xs-2 col-xs-offset-1"  translate>UI_VALOR_HISTORICO</label>
					<bcs-input-monetario
						class="col-xs-3"
						id="UI_VALOR_HISTORICO"
						bcs-requerido
					 	k-ng-model="ingresarAnexoCalificacionTributaria.datosDespues.ValorHistorico"
					 	simbolo="ingresarAnexoCalificacionTributaria.filtros.instrumento.IdMoneda">
					</bcs-input-monetario>
		  		</div>
		  		<div class="row">
			  		<label class="col-xs-3" translate>UI_DESCRIPCION</label> 
			  		<bcs-input-texto
						class="col-xs-3"
						id="UI_DESCRIPCION"
						bcs-requerido
					 	ng-model="ingresarAnexoCalificacionTributaria.datosAntes.Descripcion">
					</bcs-input-texto>
			  		
			  		<div class="col-xs-6">
			  		</div>
		  		</div>
		  		<hr>
		  		<div class="row">			  		
			  		<label class="col-xs-3" translate>UI_ANIO</label> 
			  		<bcs-input-date
						class="col-xs-3"
						id="UI_ANIO"
						k-options="ingresarAnexoCalificacionTributaria.configuraciones.date"
						bcs-requerido
						ng-model="ingresarAnexoCalificacionTributaria.datosDespues.AnioOrigen">
					</bcs-input-date>
			  		
			  		<label class="col-xs-2 col-xs-offset-1"  translate>UI_TASA_CREDITO</label>
					<bcs-input-numero
						class="col-xs-3"
						id="UI_TASA_CREDITO"
						bcs-requerido
					 	k-ng-model="ingresarAnexoCalificacionTributaria.datosDespues.TasaCredito"
					 	decimales="'4'">
					</bcs-input-numero>
		  		</div>
		  		<div class="row">			  		
			  		<label class="col-xs-3" translate>UI_PORCENTAJE_DIVIDENDO</label> 
			  		<bcs-input-numero
						class="col-xs-3"
						id="UI_PORCENTAJE_DIVIDENDO"
						bcs-requerido
					 	k-ng-model="ingresarAnexoCalificacionTributaria.datosDespues.PorcentajeDividendo"
					 	decimales="'4'">
					</bcs-input-numero>
			  		
			  		<label class="col-xs-2 col-xs-offset-1"  translate>UI_TIPO_DIVIDENDO</label>
					<bcs-combobox-base
						tipo="'combobox-tipo-utilidad-calificacion-tributaria'"
						class="col-xs-3"
						todos = "'N'"
						bcs-requerido
						id-actual="ingresarAnexoCalificacionTributaria.datosDespues.IdTipoUtilidades"
						id-defecto="ingresarAnexoCalificacionTributaria.datosAntes.IdTipoUtilidades">
					</<bcs-combobox-base>
		  		</div>
		  	</div>
		</div>
		</form>
		<br>
		<div class="row bcs-panel-comandos">
			<div class=col-xs-8>
				<bcs-button class="col-xs-4" id="GUARDAR_ANEXO" 
					ng-show="!ingresarAnexoCalificacionTributaria.Edicion"
					bcs-texto="'UI_GUARDAR' | translate" 
					bcs-habilitado="FormIngresoAnexoCalificacionTributaria.$valid"
					bcs-tipo="'principal'" 
					bcs-auto-desactivar="true"
					bcs-clic="ingresarAnexoCalificacionTributaria.guardarAnexo()">
				</bcs-button>	
			</div>
			<div class="col-xs-2"></div>
		</div>
</div>

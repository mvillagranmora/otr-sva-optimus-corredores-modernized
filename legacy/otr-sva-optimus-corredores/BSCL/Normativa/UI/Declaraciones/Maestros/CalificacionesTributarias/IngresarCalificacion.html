<div id="IngresarCalificacion" class="col-xs-12" ng-controller="IngresarCalificacionCtrl">
	<!-- Es ingreso nuevo -->
    <div class="row bcs-cuerpo" ng-show="filtros.accion == 'ingresar'">
		<form name="FormIngresoCalificacion" class="filters-formulario">
			<div class="row">
				<div class="col-xs-12">

					<div class="col-xs-6">

						<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_CLASIFICACION</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="3" 
                                    bcs-requerido
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.NombreMercado">
								</bcs-input-texto>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="16" 
                                    bcs-requerido
									ng-model="datosCalificacion.Nemo">
								</bcs-input-texto>
							</div>
						</div>
                        <div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_DESCRIPCION</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="50" 
                                    bcs-requerido
									ng-model="datosCalificacion.Descripcion">
								</bcs-input-texto>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_FECHA_PAGO</label>
								<bcs-input-date 
                                    class="col-xs-8" 
                                    ng-model="datosCalificacion.FechaPago" 
                                    bcs-requerido>
								</bcs-input-date>
							</div> 
						</div>
						<div class="row">
                            <div class="col-xs-8">
								<label class="col-xs-4" translate>UI_SECUENCIA_EVENTO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="10" 
                                    bcs-requerido 
                                    k-ng-disabled="'true'"
                                    ng-model="datosCalificacion.Secuencia">
								</bcs-input-texto>
							</div>
						</div>

						<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_DIVIDENDO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="40" 
                                    bcs-requerido
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.Dividendo">
								</bcs-input-texto>
							</div>
						</div>

						<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_VALOR_HISTORICO</label>
								<bcs-input-numero 
                                    class="col-xs-8" 
                                    id="UI_VALOR_HISTORICO" 
                                    decimales="8"
									k-ng-disabled="'true'" 
                                    ng-model="datosCalificacion.ValorHistorico">
								</bcs-input-numero>
							</div>
						</div> 

					</div>

					<div class="col-xs-6">

                        <div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_FACTOR_ACT</label>
                                <bcs-input-texto 
                                    class="col-xs-8" 
                                    id="UI_FACTOR_ACT" 
                                    maxlength="5" 
                                    k-ng-disabled="'true'" 
									ng-model="datosCalificacion.FactorActualizado">
								</bcs-input-texto>
								<!-- <bcs-input-numero  
                                    class="col-xs-8" 
                                    id="UI_FACTOR_ACT" 
									k-ng-disabled="'true'" 
                                    ng-model="datosCalificacion.FactorActualizado">
								</bcs-input-numero>-->
							</div>
						</div>
						
						<div class="row">
							<div class="col-xs-8">
								<label class="col-xs-4" translate>UI_ANIO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="4" 
                                    k-ng-disabled="'true'" 
                                    bcs-requerido
									ng-model="datosCalificacion.Anio">
								</bcs-input-texto>
							</div>
						</div>

						<div class="row">
                            <div class="col-xs-8">
								<label class="col-xs-4" translate>UI_ISFUT</label>
                                <input type="checkbox" ng-model="checked" ng-disabled="">
							</div>
						</div>

					</div>
				</div>
			</div>
		</form>
	</div>
    
    <!-- Copiar -->
    <div class="row bcs-cuerpo" ng-show="filtros.accion == 'copiar'">
		<form name="FormIngresoCalificacion" class="filters-formulario">
			<div class="row">
				<div class="col-xs-12">

					<div class="col-xs-6">

						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_CLASIFICACION</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="40" 
                                    bcs-requerido 
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.NombreMercado">
								</bcs-input-texto>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="16" 
                                    bcs-requerido 	
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.Nemo">
								</bcs-input-texto>
							</div>
						</div>
                        <div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_DESCRIPCION</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="50" 
                                    bcs-requerido
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.Descripcion">
								</bcs-input-texto>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_FECHA_PAGO</label>
                                <bcs-input-date
                                    class="col-xs-8"
                                    k-ng-disabled="'true'"
                                    k-ng-model="datosCalificacion.FechaPagoCopiar"
                                    bcs-requerido>
                                </bcs-input-date>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_SECUENCIA_EVENTO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="10" 
                                    bcs-requerido 
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.Secuencia">
								</bcs-input-texto>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_DIVIDENDO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="40" 
                                    k-ng-disabled="'true'"
									ng-model="datosCalificacion.Dividendo">
								</bcs-input-texto>
							</div>
						</div>

						<!-- <div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_VALOR_HISTORICO</label>
								<bcs-input-numero 
                                    class="col-xs-8" 
                                    id="UI_VALOR_HISTORICO" 
                                    decimales="8"
                                    k-ng-disabled="'true'" 
                                    k-ng-model="datosCalificacion.ValorHistorico">
								</bcs-input-numero>
							</div>
						</div> -->

					</div>

					<div class="col-xs-6">

                        <div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_FACTOR_ACT</label>
								<bcs-input-numero 
                                    class="col-xs-8" 
                                    id="UI_FACTOR_ACT" 
									k-ng-disabled="'true'" 
                                    ng-model="datosCalificacion.FactorActualizado">
								</bcs-input-numero>
							</div>
						</div>
						
						<div class="row">
							<div class="col-xs-12">
								<label class="col-xs-4" translate>UI_ANIO</label>
								<bcs-input-texto 
                                    class="col-xs-8" 
                                    maxlength="4" 
                                    k-ng-disabled="'true'" 
                                    bcs-requerido
									ng-model="datosCalificacion.Anio">
								</bcs-input-texto>
							</div>
						</div>
                        
						<div class="row">
                            <div class="col-xs-12">
								<label class="col-xs-4" translate>UI_ISFUT</label>
                                <input type="checkbox" ng-model="checked" ng-disabled="true">
							</div>
						</div>

					</div>
				</div>
			</div>
		</form>
	</div>

	<div class="row bcs-panel-buttons alignButtonsToRight">
			<bcs-button class="col-xs-2" bcs-clic="Cancelar()" 
                bcs-tipo="'bcs-button-secondary'" 
                bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="'true'" 
                bcs-auto-desactivar="false">
            </bcs-button>

			<bcs-button class="col-xs-2" id="IngresarCalificacion_Ingresar" 
                bcs-tipo="'bcs-button-primary'"
                bcs-auto-desactivar="" 
				bcs-texto="'UI_INGRESAR' | translate" 
                bcs-habilitado="'true'" 
                ng-show="filtros.accion=='ingresar'"
				bcs-clic="ingresarCalificacionTributaria()">
			</bcs-button>

            <bcs-button class="col-xs-2" id="IngresarCalificacion_Copiar" 
                bcs-tipo="'bcs-button-primary'"
				bcs-texto="'UI_COPIAR' | translate" 
                bcs-habilitado="'true'" 
                ng-show="filtros.accion=='copiar'"
				bcs-clic="copiarCalificacionTributaria()">
			</bcs-button>

            <bcs-button class="col-xs-2" id="IngresarCalificacion_Copiar" 
            bcs-tipo="'bcs-button-primary'"
                bcs-texto="'UI_ELIMINAR' | translate" 
                bcs-habilitado="'true'" 
                ng-show="filtros.accion=='eliminar'"
                bcs-clic="eliminarCalificacionTributaria()">
            </bcs-button>
	</div>
</div>

<div id="GenerarRepoSicam" class="row" ng-controller="GenerarRepoSicamCtrl as solRepo">
    <form class="col-xs-12 form-horizontal">
        <div class="row">
            <label class="col-xs-3" translate>UI_USUARIO</label>
            <label style="font-weight: bold" class="col-xs-6" id="User">
                {{SesionUsuario}}
            </label>
        </div>
        <div class="row">
            <label class="col-xs-3" translate>Fecha Inicio:</label>
            <bcs-input-date class="col-xs-6" bcs-requerido
                k-ng-model="solRepo.fechaInicio"
                k-ng-readonly="true"
				k-ng-disabled="solRepo.isREPOFechasBloqueadas"
                k-options="solRepo.AjustarCalenario">
            </bcs-input-date>
        </div>
        <div class="row">
            <label class="col-xs-3" translate>Fecha Fin:</label>
            <bcs-input-date class="col-xs-6" bcs-requerido
                k-ng-model="solRepo.fechaFin"
                k-ng-readonly="true"
				k-ng-disabled="solRepo.isREPOFechasBloqueadas"
                k-options="solRepo.AjustarCalenario">
            </bcs-input-date>
        </div>
        <div class="row">
            <label class="col-xs-3" translate>Reporte:</label>
            <label style="font-weight: bold" class="col-xs-6" id="esquema">
                {{solRepo.esquema}} - {{solRepo.version}}
            </label>
        </div>

        <hr>
        <div class="row">
            <div class="col-xs-12 text-right">
                <bcs-button class="col-xs-4"
                    bcs-tipo="'bcs-button-input-form'"
                    bcs-auto-desactivar="'false'"
                    bcs-texto="'UI_GENERAR_REPO_SICAM' | translate"
                    bcs-habilitado="true"
                    bcs-clic="solRepo.solicitar()">
                </bcs-button>
            </div>
        </div>

    </form>
</div>

<div id="PanelCertificados" class="row" ng-controller="PanelCertificadosCtrl as pse">
<form name="PanelCertificados" class="col-xs-12 form-horizontal">
	

	<!-- PARAMETROS ESTADO SICAM -->
	<div class="row"></div>
	<div class="row">
		<div class="col-xs-2">
			<label class="col-xs-5" translate>Estado Envio SICAM</label>
			<em class="col-xs-1" style="text-decoration: underline;" ng-show="!pse.muestraListaClientes" ng-click="pse.muestraListaClientes = !pse.muestraListaClientes">({{'+' | translate}})</em>
			<em class="col-xs-1" style="text-decoration: underline;" ng-show="pse.muestraListaClientes" ng-click="pse.muestraListaClientes = !pse.muestraListaClientes">({{'-' | translate}})</em>
		</div>
			<label class="col-xs-4" translate>UI_ESTADO_SICAM</label>
            <input class="col-xs-8" style="width: 65.66666667%;" id="estadoSicam" />
		<div class="col-xs-4">
			<label class="col-xs-3">Todos</label>
			<bcs-input-checkbox class="col-xs-2" ng-model="pse.control.TodosCli"></bcs-input-checkbox>
		</div>
	</div>
	
<hr>	
</form>
<!-- FIN PARAMETROS ESTADO SICAM -->

	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight" style="top: 10px">
			 <div class="col-xs-4" style="top: 10px"></div>
			<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-input-form'"
				bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR_REPO_SICAM' | translate"
				bcs-habilitado="true" bcs-clic="pse.solicitar()">
			</bcs-button>
			
		</div>
	</div>
</div>

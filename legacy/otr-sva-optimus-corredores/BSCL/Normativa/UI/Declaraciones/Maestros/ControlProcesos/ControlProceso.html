<div id="BlotterControlProcesos" class="col-xs-12" ng-controller="BlotterControlProcesosCtrl">
	<div class="row bcs-cuerpo">
   	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_ESQUEMA</label>
					<bcs-combobox-base class="col-xs-8"
			  				tipo="'combobox-esquema-declaracion'"
				  			id-actual="filtros.esquema"
				  			seleccionado="filtros.esquemaSeleccionado"
				  			filtros="datos.oConfiguracionEsquema.filtros"
				  			cascada-a = "datos.oConfiguracionVersion.filtros.Esquema"
				  			cascada-valor="'Esquema'"
				  			item-post-filtro="'1'">
			  		</bcs-combobox-base> 
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" translate>UI_VERSION</label>
					<bcs-combobox-base class="col-xs-8"
							id="UI_VERSION"
							bcs-requerido
			  				tipo="'combobox-version-declaracion'"
				  			id-actual="formData.version"
				  			seleccionado="formData.versionSeleccionado"
				  			filtros="datos.oConfiguracionVersion.filtros">
			  		</bcs-combobox-base> 
				</div>
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarControlProceso(apiGridControlProceso,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
	  	</div>
	</div>
		<div class="row">
			<bcs-grid 
				id="grid-control-proceso"
			 	configuracion="defaultOptions"
				api = "apiGridControlProceso"
				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-buttons">
		<div class="col-xs-2 pull-right">
			<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
	            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			</bcs-menu>
		</div>
	</div>
</div>

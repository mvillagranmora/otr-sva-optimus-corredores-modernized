<div id="ModalGarantias" ng-controller="ModalGarantiasCtrl as mg">
	<div class="row bcs-cuerpo">
		<form name="formGarantias" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_GARANTIA</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido
					filtros = "mg.cmbbxTipoGarantia.filtros"
					tipo="'combobox-normativa-homologacion'"
					id-actual="mg.Garantia.S6_TipoGar"
					id-post-filtro="mg.GarantiaOriginal.S6_TipoGar">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONEDA_VALORIZACION</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido
					filtros = "mg.cmbbxMonedaValorizacion.filtros"
					tipo="'combobox-normativa-homologacion'"
					id-actual="mg.Garantia.S6_MonVal"
					id-post-filtro="mg.GarantiaOriginal.S6_MonVal">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_ID_GARANTIA</label>
				<bcs-input-texto class="col-xs-9" 
					bcs-requerido = "mg.IdGarantiaRequerido"
					ng-model="mg.Garantia.KS6_IdGar"
					ng-blur= "mg.blurRequerido('KS6_IdGar')"
					k-ng-disabled = "mg.IdGarantiaDisabled">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_UMBRAL</label>
				<bcs-input-numero class="col-xs-9" 
					bcs-requerido = "mg.MontoUmbralRequerido"
					ng-model="mg.Garantia.S6_MontoUmb"
					ng-blur= "mg.blurRequerido('S6_MontoUmb')">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_VALOR_GARANTIA</label>
				<bcs-input-numero class="col-xs-9" 
					bcs-requerido = "mg.ValorGarantiaRequerido"
					ng-model="mg.Garantia.S6_ValGtia"
					ng-blur= "mg.blurRequerido('S6_ValGtia')">
				</bcs-input-numero>
			</div>
		</form>
	</div>
	<div class=row></div>
	<hr>
	<div class="row alignButtonsToRight">
		<bcs-button id="btnAceptar" class="col-xs-2" bcs-habilitado="formGarantias.$valid" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mg.aceptar()"></bcs-button>
		<bcs-button id="btnCancelar" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mg.cancelar()"></bcs-button>
	</div>
</div>

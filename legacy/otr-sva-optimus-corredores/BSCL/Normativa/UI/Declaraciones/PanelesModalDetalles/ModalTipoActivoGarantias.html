<div id="ModalTipoActivoGarantias" ng-controller="ModalTipoActivoGarantiasCtrl as mdg">
	<div class="row bcs-cuerpo">
		<form name="formTipoActivoGarantias" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_GARANTIA</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido
					filtros = "mdg.cmbbxTipoGarantia.filtros"
					tipo="'combobox-normativa-homologacion'"
					id-actual="mdg.TipoActivoGarantia.S7_TipoGar"
					id-post-filtro="mdg.TipoActivoGarantiaOriginal.S7_TipoGar">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_ID_GARANTIA</label>
				<bcs-input-texto class="col-xs-9" 
					bcs-requerido = "mdg.IdGarantiaRequerido"
					ng-model="mdg.TipoActivoGarantia.KS7_IdGar"
					ng-blur= "mdg.blurRequerido('KS7_IdGar')"
					k-ng-disabled = "mdg.IdGarantiaDisabled">
				</bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_ACTIVO_GARANTIA</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido
					filtros = "mdg.cmbbxTipoActivoGarantia.filtros"
					tipo="'combobox-normativa-homologacion'"
					id-actual="mdg.TipoActivoGarantia.S7_TipoActGar"
					id-post-filtro="mdg.TipoActivoGarantiaOriginal.S7_TipoActGar">
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_PORCENTAJE_GARANTIA</label>
				<bcs-input-numero class="col-xs-9" 
					bcs-requerido = "mdg.PorcentajeGarantiaRequerido"
					ng-model="mdg.TipoActivoGarantia.S7_PorcGar"
					ng-blur= "mdg.blurRequerido('S7_PorcGar')">
				</bcs-input-numero>
			</div>
		</form>
	</div>
	<div class=row></div>
	<hr>
	<div class="row alignButtonsToRight">
		<bcs-button id="btnAceptar" class="col-xs-2" bcs-habilitado="formTipoActivoGarantias.$valid" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mdg.aceptar()"></bcs-button>
		<bcs-button id="btnCancelar" class="col-xs-2" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-tipo="'bcs-button-input-form'" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mdg.cancelar()"></bcs-button>
	</div>
</div>

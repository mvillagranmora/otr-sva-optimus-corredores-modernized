<div id="PanelGarantias" class="col-xs-12" ng-controller="PanelGarantiasCtrl as pgc">
	<div class="row">
		<div class="col-xs-12">
			<bcs-grid id="gridGarantias"
				configuracion="pgc.confBasicaGarantias"
				seleccionado="pgc.seleccionadoGarantias"
				fn-doble-click="pgc.modificar(pgc.seleccionadoGarantias)">
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-buttons">
		<bcs-button class="col-xs-1" 
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="'false'" 
			bcs-habilitado="'true'"
			bcs-texto="'UI_CREAR' | translate"
			bcs-clic="pgc.agregar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_ELIMINAR' | translate"
			bcs-habilitado="pgc.seleccionadoGarantias.length > 0"
			bcs-clic="pgc.eliminar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_CARGAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="pgc.cargarDataBolson()"> 
		</bcs-button>
	</div>
</div>

<div class="row" ng-controller="UploadBolsonController">
    <div class="row">
        <div class="col-xs-12">
            <input type="file" class="col-xs-5 custom-file-input-form" file-reader="data.fileContent" onchange="angular.element(this).scope().fileChanged(this)" style="display:inline"/>
                <div class="col-xs-7" style="height: 100%;
                position: relative;
                height: 30px;">
                    <span id="nombreArchivo" style="
                    font-weight: bold;
                    font-size: 12px;
                    position: absolute;
                    top: 50%; 
                    left: 50%; 
                    width: 100%;
                    transform: translate(-50%, -50%); 
                    padding-left: 14px;
                ">{{nombreArchivo}}</span>
                </div>
        </div>
    </div>
    <div class=row></div>
    <hr>
    <div class="row alignButtonsToRight">
        <bcs-button class="col-xs-4"
            bcs-tipo="'bcs-button-input-form'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_CARGAR' | translate"
            bcs-habilitado="'true'"
            bcs-clic="data.guardar()">
        </bcs-button>
    </div>
</div>

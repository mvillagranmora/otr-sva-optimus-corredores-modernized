<div id="PanelPagosPeriodo" class="col-xs-12" ng-controller="PanelPagosPeriodoCtrl as ppp">
	<div class="row">
		<bcs-grid id="gridPagosPeriodo"
			configuracion="ppp.confBasicaPagosPeriodo"
			seleccionado="ppp.seleccionadoPagosPeriodo"
			fn-doble-click="ppp.modificar(ppp.seleccionadoPagosPeriodo)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-buttons">
		<bcs-button class="col-xs-1" 
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="'false'" 
			bcs-habilitado="'true'"
			bcs-texto="'UI_CREAR' | translate"
			bcs-clic="ppp.agregar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_ELIMINAR' | translate"
			bcs-habilitado="ppp.seleccionadoPagosPeriodo.length > 0"
			bcs-clic="ppp.eliminar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_CARGAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="ppp.cargarDataBolson()"> 
		</bcs-button>
	</div>
</div>

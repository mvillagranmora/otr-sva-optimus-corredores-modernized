<div id="PanelTipoActivoGarantia" class="col-xs-12" ng-controller="PanelTipoActivoGarantiaCtrl as pdg">
	<div class="row">
		<bcs-grid id="gridTipoActivoGarantia"
			configuracion="pdg.confBasicaTipoActivoGarantia"
			seleccionado="pdg.seleccionadoTipoActivoGarantia"
			fn-doble-click="pdg.modificar(pdg.seleccionadoTipoActivoGarantia)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-buttons">
		<bcs-button class="col-xs-1" 
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="'false'" 
			bcs-habilitado="'true'"
			bcs-texto="'UI_CREAR' | translate"
			bcs-clic="pdg.agregar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_ELIMINAR' | translate"
			bcs-habilitado="pdg.seleccionadoTipoActivoGarantia.length > 0"
			bcs-clic="pdg.eliminar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_CARGAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="pdg.cargarDataBolson()"> 
		</bcs-button>
	</div>
</div>

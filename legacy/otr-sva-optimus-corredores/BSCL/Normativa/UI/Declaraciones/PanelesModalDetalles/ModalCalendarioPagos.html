<div id="ModalCalendarioPagos" ng-controller="ModalCalendarioPagosCtrl as mcp">
	<div class="row bcs-cuerpo">
		<form name="formCalendarioPagos" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-3" translate>UI_NUMERO_FLUJO</label>
				<bcs-input-numero class="col-xs-9" 
					bcs-requerido ="mcp.NumeroFlujoRequerido"
					ng-model="mcp.CalendarioPago.KS4_XR_NroFlu"
					decimales="'0'"
					ng-blur= "mcp.blurRequerido('KS4_XR_NroFlu')"
					k-ng-disabled = "mcp.NumeroFlujoDisabled">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_FLUJO</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido
					filtros = "mcp.cmbbxTipoFlujo.filtros"
					tipo="'combobox-normativa-homologacion'"
					id-actual="mcp.CalendarioPago.S4_XR_TipoFlujo"
					id-post-filtro="mcp.CalendarioPagoOriginal.S4_XR_TipoFlujo">
				</bcs-combobox-base>
			</div>
			
			<div class="row">
				<label class="col-xs-3" translate>UI_FACTOR_TASA</label>
				<bcs-input-numero class="col-xs-9" 
					bcs-requerido = "mcp.FactorTasaRequerido"
					ng-model="mcp.CalendarioPago.S4_XR_FacTasa"
					ng-blur= "mcp.blurRequerido('S4_XR_FacTasa')">
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_SPREAD_TASA</label>
				<bcs-input-numero class="col-xs-9"
					bcs-requerido = "mcp.SpreadTasaRequerido"
					ng-model="mcp.CalendarioPago.S4_XR_SpreadTasa"
					ng-blur= "mcp.blurRequerido('S4_XR_SpreadTasa')">
				</bcs-input-numero>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_TASA_FIJA</label>
				<bcs-input-numero class="col-xs-9"
					bcs-requerido = "mcp.TasaFijaRequerido"
					ng-model="mcp.CalendarioPago.S4_XR_TasaFija"
					ng-blur= "mcp.blurRequerido('S4_XR_TasaFija')">
				</bcs-input-numero>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_FIX_TASA</label>
				<bcs-input-date class="col-xs-9"
					bcs-requerido = "mcp.FechaFixTasaRequerido"
					k-options="mcp.OptFechaFixTasa" 
					k-ng-model="mcp.CalendarioPago.S4_XR_FecFixTasa"
					ng-blur= "mcp.blurRequerido('S4_XR_FecFixTasa')">
				</bcs-input-date>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_INICIO</label>
				<bcs-input-date class="col-xs-9"
					bcs-requerido = "mcp.FechaInicioRequerido"
					k-options="mcp.OptFechaInicio" 
					k-ng-model="mcp.CalendarioPago.S4_XR_FecIni"
					ng-blur= "mcp.blurRequerido('S4_XR_FecIni')">
				</bcs-input-date>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_TERMINO</label>
				<bcs-input-date class="col-xs-9"
					bcs-requerido = "mcp.FechaTerminoRequerido"
					k-options="mcp.OptFechaTermino" 
					k-ng-model="mcp.CalendarioPago.S4_XR_FecTer"
					ng-blur= "mcp.blurRequerido('S4_XR_FecTer')">
				</bcs-input-date>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_NOCIONAL</label>
				<bcs-input-numero class="col-xs-9"
					bcs-requerido = "mcp.MontoNocionalRequerido"
					bcs-mayor-que="'0'"
					ng-model="mcp.CalendarioPago.S4_XR_MontoNoc"
					ng-blur= "mcp.blurRequerido('S4_XR_MontoNoc')">
				</bcs-input-numero>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_INTERCAMBIO</label>
				<bcs-input-numero class="col-xs-9"
					bcs-requerido = "mcp.MontoIntercambioRequerido"
					bcs-mayor-que="'0'"
					ng-model="mcp.CalendarioPago.S4_XR_MontoInt"
					ng-blur= "mcp.blurRequerido('S4_XR_MontoInt')">
				</bcs-input-monetario>	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_MONEDA_MONTO</label>
				<bcs-combobox-base
					class="col-xs-9"
					auto-cargar="true"
					bcs-requerido
					filtros = "mcp.cmbbxMonedaMonto.filtros"
					tipo="'combobox-normativa-homologacion'"
					id-actual="mcp.CalendarioPago.S4_X_MonMonto"
					id-post-filtro="mcp.CalendarioPagoOriginal.S4_X_MonMonto">
				</bcs-combobox-base>
			</div>
		</form>
	</div>
	<div class=row></div>
	<hr>
	<div class="row alignButtonsToRight">
		<bcs-button id="btnAceptar" class="col-xs-2" bcs-habilitado="formCalendarioPagos.$valid" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mcp.aceptar()"></bcs-button>
		<bcs-button id="btnCancelar" class="col-xs-2" bcs-habilitado="'true'" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mcp.cancelar()"></bcs-button>
	</div>
</div>

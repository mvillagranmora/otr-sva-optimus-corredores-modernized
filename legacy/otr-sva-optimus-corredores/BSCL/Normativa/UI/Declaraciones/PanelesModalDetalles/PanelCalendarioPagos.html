<div id="PanelCalendarioPagos" class="col-xs-12" ng-controller="PanelCalendarioPagosCtrl as pcp">
	<div class="row">
		<bcs-grid id="gridCalendarioPagos"
			configuracion="pcp.confBasicaCalendarioPagos"
			seleccionado="pcp.seleccionadoCalendarioPagos"
			fn-doble-click="pcp.modificar(pcp.seleccionadoCalendarioPagos)">
		</bcs-grid>
	</div>
	<div class="row bcs-panel-buttons">
		<bcs-button class="col-xs-1" 
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="'false'" 
			bcs-habilitado="'true'"
			bcs-texto="'UI_CREAR' | translate"
			bcs-clic="pcp.agregar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_ELIMINAR' | translate"
			bcs-habilitado="pcp.seleccionadoCalendarioPagos.length > 0"
			bcs-clic="pcp.eliminar()"> 
		</bcs-button>
		<bcs-button class="col-xs-1" bcs-tipo="'bcs-button-secondary'"
			bcs-auto-desactivar="'false'" bcs-texto="'UI_CARGAR' | translate"
			bcs-habilitado="'true'" 
			bcs-clic="pcp.cargarDataBolson()"> 
		</bcs-button>
	</div>
</div>

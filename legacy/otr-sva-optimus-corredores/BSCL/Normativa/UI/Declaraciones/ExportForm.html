<div class="row" ng-controller="ExportController">
    <div class="row">
        <div class="col-xs-4">
            <label>Separador Listas</label>
        </div>
        <div class="col-xs-8">
            <select style="width:100%;" ng-model="separadorListas">
                <option value=",">Coma</option>
                <option value=";">Punto y coma</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-4">
            <label>Simbolo Decimal</label>
        </div>
        <div class="col-xs-8">
            <select style="width:100%;" ng-model="simboloDecimal">
                <option value=",">Coma</option>
                <option value=".">Punto</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-4">
            <label>Formato Fechas</label>
        </div>
        <div class="col-xs-8">
            <select style="width:100%;" ng-model="formatoFechas">
                <option value="dd-MM-yyyy">dd-MM-yyyy</option>
                <option value="MM-dd-yyyy">MM-dd-yyyy</option>
            </select>
        </div>
    </div>
    <hr>
    <div class="row alignButtonsToRight">
        <bcs-button class="col-xs-4"
            bcs-tipo="'bcs-button-input-form'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_EXPORTAR_EXCEL' | translate"
            bcs-habilitado="botonExportarHabilitado && separadorListas != simboloDecimal"
            bcs-clic="exportar()">
        </bcs-button>
    </div>
</div>

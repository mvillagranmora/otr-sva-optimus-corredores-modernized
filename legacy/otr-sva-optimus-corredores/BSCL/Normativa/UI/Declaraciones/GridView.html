<div class="row" ng-controller="GridController">
    <div class="bcs-cuerpo">

        <div class="row" ng-show="ShowTabGeneral">
            <div class="col-xs-10">

                <div class="row">
                    <div class="col-xs-6">
                        <label class="col-xs-4" translate>UI_ESQUEMA</label>
                        <input class="col-xs-8"style="width: 65.66666667%;" id="esquema" />
                    </div>
                    <div class="col-xs-6">
                        <label class="col-xs-4" translate>UI_VERSION</label>
                        <input class="col-xs-8" style="width: 65.66666667%;" id="version" />
                    </div>
                </div>
                <div class="row" ng-hide="filtroClienteOculto">
                    <div class="col-xs-12">
                        <label class="col-xs-2" translate>UI_CLIENTE</label>
                        <bcs-combobox-base class="col-xs-10"
                            id="UI_SOCIO_NEGOCIO"
                            auto-cargar="'false'"
                            bcs-requerido
                            tipo="'combobox-socio-negocio'"
                            filtros="configSocioNegocio.filtros"
                            id-actual="idSocioNegocioActual"
                            seleccionado="socioNegocioSeleccionado">
                        </bcs-combobox-base>
                    </div>
                </div>
                <div class="row" ng-hide="filtroFechasOculto">
                    <div class="col-xs-6">
                        <label class="col-xs-4" translate>UI_FECHA_DESDE</label>
                        <bcs-input-date class="col-xs-8" k-ng-model="fechaDesde"></bcs-input-date>
                    </div>
                    <!--INICIO ABBI -->
                    <div class="col-xs-6">
                        <label class="col-xs-4" translate>UI_FECHA_HASTA</label>
                        <bcs-input-date class="col-xs-8" k-ng-model="fechaHasta"
                        	k-ng-disabled="fechaHastaDeshabilitado"></bcs-input-date>
                    </div>
                    <div class="col-xs-6"  ng-hide="chkEscogerDiaOculto">
						<label class="col-xs-4" translate>UI_ESCOGER_DIA</label>
						<bcs-input-checkbox class="col-xs-2" name="chkEscogerDia" ng-model="chkEscogerDia"> </bcs-input-checkbox>
					</div>
				    <div class="col-xs-6" ng-if="tieneMonedaPrimaria">
                        <label class="col-xs-4" translate>UI_MONEDA_PRIMARIA</label>
                       	<bcs-combobox-base class="col-xs-8"
						tipo = "'combobox-sicam2p1-moneda'"
						id-actual = "cmbbx.IdMmonedaPrimaria"
						filtros="cmbbx.MmonedaPrimaria.filtros"
						auto-cargar="true"
						item-post-filtro="'0'"
						id-defecto="'0'"
						todos="'S'"
						seleccionado="cmbbx.IdMmonedaPrimariaObj">
		 				</bcs-combobox-base >		
                    </div>
					<!--FIN ABBI -->
                </div>
            </div>
            <div class="col-xs-2">
            
                <div class="row">
                    <bcs-button
                        bcs-tipo="'bcs-button-search'"
                        bcs-auto-desactivar="false"
                        bcs-texto="'UI_BUSCAR' | translate"
                        bcs-habilitado="true"
                        bcs-clic="establecerEsquema(null)">
                    </bcs-button>
                </div>
                <div class="row">
                    <bcs-button
                        bcs-tipo="'bcs-button-secondary'"
                        bcs-auto-desactivar="false"
                        bcs-texto="'UI_LIMPIAR' | translate"
                        bcs-habilitado="botonLimpiarHabilitado"
                        bcs-clic="limpiar()">
                    </bcs-button>
                </div>
            </div>
        </div>

        <div>
            <uib-tabset ng-show="ShowTabGeneral">
                <uib-tab select="refreshGridData()" heading="{{'UI_DATOS_DECLARACION' | translate}}" ng-show = "ShowTabDatosDeclaracion">
                    <div class="row">
                        <div id="gridData"/>
                    </div>
					<ul id="context-menu"></ul>
                    <div class="row" ng-if="tieneTotales">
					    <div id="gridSums"></div>
                    </div>               
                    <div class="row bcs-panel-buttons">
                        <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-primary'"
                            id="VisorDeclaraciones_Crear"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_CREAR' | translate"
                            bcs-habilitado="esquemaHabilitado"
                            ng-show = "ShowBtnCrear"
                            bcs-clic="agregarDetalle()">
                        </bcs-button>                     
                        <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-primary'"
                            id="VisorDeclaracionesBancoCentral_Crear"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_CREAR' | translate"
                            bcs-habilitado="esquemaHabilitado"
                            ng-show = "ShowBtnCrearBC"
                            bcs-clic="agregarDetalle()">
                        </bcs-button>
                        
                        <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaraciones_Eliminar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_ELIMINAR' | translate"
                            bcs-habilitado="esquemaHabilitado && botonEliminarHabilitado && marcados.length > 0"
                            ng-show = "ShowBtnEliminar"
                            bcs-clic="eliminarDetallesMarcados()">
                        </bcs-button>                      
                         <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_Eliminar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_ELIMINAR' | translate"
                            bcs-habilitado="habilitarBtnEiminar()"
                            ng-show = "ShowBtnEliminarBC"
                            bcs-clic="eliminarDetallesMarcados()">
                        </bcs-button>
                        
                        <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaraciones_Cargar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_CARGAR' | translate"
                            bcs-habilitado="'true'"
                            ng-show = "ShowBtnCargar"
                            bcs-clic="cargarData()">
                        </bcs-button>                    
                         <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_Cargar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_CARGAR' | translate"
                            bcs-habilitado="'true'"
                            ng-show = "ShowBtnCargarBC"
                            bcs-clic="cargarData()">
                        </bcs-button>
                        
                        <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaraciones_Cuadrar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_CUADRAR' | translate"
                            bcs-habilitado="controlProceso.Carga == 'S'"
                            ng-show = "ShowBtnCuadrar"
                            bcs-clic="cuadrarData()">
                        </bcs-button>
                        <bcs-button class="col-xs-1"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_Cuadrar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="textoBotonCuadrar | translate"
                            bcs-habilitado="controlProceso.Carga == 'S'"
                            ng-show = "ShowBtnCuadrarBC"
                            bcs-clic="cuadrarData()">
                        </bcs-button>
                        
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_Rectificar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_RECTIFICAR' | translate"
                            bcs-habilitado="marcados.length > 0"
                            ng-show = "ShowBtnRectificar"
                            bcs-clic="rectificarMarcados()">
                        </bcs-button>
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaraciones_Certificar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_GENERAR_CERTIFICADO' | translate"
                            bcs-habilitado="controlProceso.Validacion == 'S' && tieneCertificadoEsquema == 'S'"
                            ng-show = "ShowBtnGenerarCertificado"
                            bcs-clic="generarCertificado()">
                        </bcs-button>
                        
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaraciones_Generar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_GENERAR_DECLARACION' | translate"
                        	bcs-habilitado="controlProceso.Validacion == 'S'"
                            ng-show = "ShowBtnGenerarDeclaracion"
                            bcs-clic="generarDeclaracion()">
                        </bcs-button>
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_Generar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_GENERAR_DECLARACION' | translate"
                        	bcs-habilitado="controlProceso.Validacion == 'S'"
                            ng-show = "ShowBtnGenerarDeclaracionBC"
                            bcs-clic="generarDeclaracion()">
                        </bcs-button>
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_GenerarREPO"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_GENERAR_REPO_SICAM' | translate"
                            bcs-habilitado="dataSicam.length > 0"
                            ng-show = "mostrarBtnSicam()"
                            bcs-clic="generarREPOSicam()">
                        </bcs-button>
                        <bcs-button class="col-xs-2"
                            bcs-tipo="'bcs-button-secondary'"
                            id="VisorDeclaracionesBancoCentral_Enviar"
                            bcs-auto-desactivar="'false'"
                            bcs-texto="'UI_ENVIAR_SICAM' | translate"
                            bcs-habilitado="habilitarBtnEnviar()"
                            ng-show = "tieneEnvio"
                            bcs-clic="enviarDetallesMarcados()">
                        </bcs-button>
                        
                        <bcs-menu class="col-xs-1 pull-right"
                            bcs-tipo="'bcs-button-secondary'"
                            bcs-habilitado="'true'"
                            bcs-texto="'UI_OPCIONES' | translate">
                            <li ng-click="complementos()" ng-hide="mostrarBtnSicam()">{{'UI_COMPLEMENTOS'  | translate}}</li>
                            <li ng-hide="EsDJ1" ng-click="edicionMasiva()">{{'UI_EDICION_MASIVA'  | translate}}</li>
                            <li ng-hide="!EsDJ1" ng-click="seleccionarTodo()">{{'UI_SELTODO'  | translate}}</li>
                            <li ng-click="eliminarTodos()" ng-hide="mostrarBtnSicam()">{{'UI_ELIMINAR_TODOS' | translate}}</li>
                            <li ng-click="exportarExcel()" bcs-habilitado="esquemaHabilitado && botonExportarHabilitado" ng-show = "ShowBtnExportarExcel">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
                        </bcs-menu>
                    </div>
                </uib-tab>
                <uib-tab heading="{{'UI_DATOS_DECLARANTE' | translate}}" ng-show = "ShowTabDatosDeclarante">
                    <div class="panel panel-default" style="min-height: 40px">
                        <div class="panel-body">
                            <div class="row">
                                <label class="col-xs-2" translate>Fecha Limite</label>
                                <bcs-input-date class="col-xs-3"
                                    k-ng-disabled="true"
                                    k-ng-model="documento.FechaLimite">
                                </bcs-input-date>
                            </div>
                            <div class="row">
                                <label class="col-xs-2" translate>RUT Representante</label>
                                <bcs-input-texto class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    ng-model="documento.DocumentoIdentidadRepresentante">
                                </bcs-input-texto>
                                <label class="col-xs-2" translate>RUT Declarante</label>
                                <bcs-input-texto class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    ng-model="documento.DocumentoIdentidadDeclarante">
                                </bcs-input-texto>
                            </div>
                            <div class="row">
                                <label class="col-xs-2" translate>Direccion</label>
                                <bcs-input-texto class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    ng-model="documento.DireccionFisicaDeclaracion">
                                </bcs-input-texto>
                                <label class="col-xs-2" translate>Comuna</label>
                                <bcs-input-texto class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    ng-model="documento.ComunaDeclaracion">
                                </bcs-input-texto>
                            </div>
                            <div class="row">
                                <label class="col-xs-2" translate>Email</label>
                                <bcs-input-texto class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    ng-model="documento.DireccionElectronicaDeclaracion">
                                </bcs-input-texto>
                                <label class="col-xs-2" translate>Telefono</label>
                                <bcs-input-texto class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    ng-model="documento.TelefonoDeclaracion">
                                </bcs-input-texto>
                            </div>
                            
                            <div class="row" ng-show="!data.tieneCertificado">
                                <label class="col-xs-2" translate>Define Fecha Certificado</label>
                                <bcs-input-checkbox
                                        ng-disabled="!modoEdicion"
					                    class="col-xs-3"
                                        ng-model="data.switchDefine">
				                </bcs-input-checkbox>
                                <label class="col-xs-2" translate>Fecha Certificado</label>
                                <bcs-input-date class="col-xs-3"
                                    k-ng-disabled="!modoEdicion"
                                    k-ng-model="documento.FechaCertificado">
                                </bcs-input-date>
                            </div>
                            <div class="row">
                                <bcs-button class="col-xs-2"
                                    bcs-tipo="'bcs-button-primary'"
                                    ng-show="!modoEdicion"
                                    bcs-auto-desactivar="false"
                                    bcs-texto="'UI_EDITAR' | translate"
                                    bcs-habilitado="!modoEdicion"
                                    bcs-clic="habilitarEdicion()">
                                </bcs-button>
                                <bcs-button class="col-xs-2"
                                    bcs-tipo="'bcs-button-primary'"
                                    ng-show="modoEdicion"
                                    bcs-auto-desactivar="false"
                                    bcs-texto="'UI_GUARDAR' | translate"
                                    bcs-habilitado="'true'"
                                    bcs-clic="guardarDocumento()">
                                </bcs-button>
                                <bcs-button class="col-xs-2"
                                    bcs-tipo="'bcs-button-secondary'"
                                    ng-show="modoEdicion"
                                    bcs-auto-desactivar="false"
                                    bcs-texto="'UI_CANCELAR' | translate"
                                    bcs-habilitado="'true'"
                                    bcs-clic="deshabilitarEdicion()">
                                </bcs-button>
                            </div>
                        </div>
                    </div>
                </uib-tab>
                <uib-tab select="refreshGridCarga()" heading="{{'UI_AUDITORIA_CARGA' | translate}}" ng-show = "ShowTabAuditoriaCarga">
                    <div class="row">
                        <div id="gridCarga" />
                    </div>
                </uib-tab>
                <uib-tab select="refreshGridCuadratura()" heading="{{'UI_AUDITORIA_CUADRATURA' | translate}}" ng-show = "ShowTabAuditoriaCuadratura">
                    <div class="row">
                        <div id="gridCuadratura" />
                    </div>
                </uib-tab>
                <uib-tab select="refreshGridGeneracion()" heading="{{'UI_AUDITORIA_GENERACION' | translate}}" ng-show = "ShowTabAuditoriaGeneracion">
                    <div class="row">
                        <div id="gridGeneracion" />
                    </div>
                </uib-tab>
                <uib-tab select="refreshGridValidacion()" heading="{{'UI_AUDITORIA_VALIDACION' | translate}}" ng-show = "ShowTabAuditoriaValidacion">
                    <div class="row">
                        <div id="gridValidacion" />
                    </div>
                </uib-tab>
            </uib-tabset>
        </div>
    </div>
</div>

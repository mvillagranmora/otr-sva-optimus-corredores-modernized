<div class="row" ng-controller="GenController">
<div ng-show="mostrarFormNormal">
    <div class="row">
        <div class="col-xs-6">
            <label>Modo de Presentacion</label>
        </div>
        <div class="col-xs-6">
            <label><input type="radio" class="checkboxMargin" ng-model="modoPresentacion" value="INTERNET" />Internet</label>
            <label><input type="radio" class="checkboxMargin" ng-model="modoPresentacion" value="MAGNETICO" />Magnetico</label>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-6">
            <label>Numero de Presentacion</label>
        </div>
        <div class="col-xs-6">
            <input style="width:100%;" class="col-xs-6" id="numeroPresentacion" />
        </div>
    </div>

     <div class="row">
        <div class="col-xs-6">
            <label>Tipo de presentacion</label>
        </div>
        <div class="col-xs-6">
            <label><input type="radio" class="checkboxMargin" ng-model="rectificador" value="N" /> Original</label>
            <label><input type="radio" class="checkboxMargin" ng-model="rectificador" value="S" /> Rectificatoria</label>
        </div>
    </div>
</div>
<hr>
<div class="row alignButtonsToRight">
        <bcs-button class="col-xs-5"
            bcs-tipo="'bcs-button-input-form'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_GENERAR' | translate"
            bcs-habilitado="botonGenerarHabilitado"
            bcs-clic="generar()">
        </bcs-button>
    </div>
</div>

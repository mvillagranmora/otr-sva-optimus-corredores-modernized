<div class="row" ng-controller="QuadController">
    <div class="row">
        <div class="col-xs-4">
            <label>Tipo de Cuadratura</label>
        </div>
        <div class="col-xs-8">
            <input style="width:100%;" class="col-xs-8" id="tipoCuadratura" />
        </div>
    </div>
    <div class="row">
        <div class="col-xs-4">
            <label>Tipo de Clasificador</label>
        </div>
        <div class="col-xs-8">
            <input style="width:100%;" class="col-xs-8" id="tipoClasificador" />
        </div>
    </div>
    <div class="row">
        <label class="col-xs-4" translate>UI_FECHA_DESDE</label>
        <bcs-input-date class="col-xs-8" k-ng-model="fechaDesde"></bcs-input-date>
    </div>
    <div class="row">
        <label class="col-xs-4" translate>UI_FECHA_HASTA</label>
        <bcs-input-date class="col-xs-8" k-ng-model="fechaHasta"></bcs-input-date>
    </div>
    <hr>
    <div class="row alignButtonsToRight">
        <bcs-button class="col-xs-4"
            bcs-tipo="'bcs-button-input-form'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_CUADRAR' | translate"
            bcs-habilitado="botonCuadrarHabilitado"
            bcs-clic="cuadrar()">
        </bcs-button>
    </div>
</div>

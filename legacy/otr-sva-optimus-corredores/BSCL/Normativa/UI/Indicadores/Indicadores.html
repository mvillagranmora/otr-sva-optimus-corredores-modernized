<div id="Indicadores" ng-controller="IndicadoresCtrl as cLim">
	<form class="col-xs-12 form-horizontal">
		<div class="col-xs-12">
	  		<uib-tabset>

				<uib-tab id="TabCliente" heading="{{'UI_CLIENTE' | translate}}" select="cLim.fnTabCliente()">
					<div class="row">
						<div id="PanelCliente"></div>
					</div>
				</uib-tab>
				 
				<uib-tab id="TabPortafolio" heading="{{'UI_PORTAFOLIO' | translate}}" select="cLim.fnTabPortafolio()">
					<div class="row">
						<div id="PanelPortafolio"></div>
					</div>
				</uib-tab>
				
				<uib-tab id="TabPersonaIndicadores" heading="{{'UI_PERSONA' | translate}}" select="cLim.fnTabPersona()">
					<div class="row">
						<div id="PanelPersona" style="padding: 0px 0 10px 0;"></div>
					</div>
				</uib-tab>
				
			</uib-tabset>
		</div>
	</form>
</div>

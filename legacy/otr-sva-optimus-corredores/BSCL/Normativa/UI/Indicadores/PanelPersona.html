<div id="PanelPersona" class="row" ng-controller="PanelPersonaCtrl as pPER">
<div class="row">

	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">

			 <div class="col-xs-6"> 	  			  	  
				<label class="col-xs-3" translate>UI_GRUPO</label>
				<bcs-combobox-base class="col-xs-8"
								tipo = "'combobox-grupo-indicador'"
								id-actual = "pPER.cmbbx.IdGrupoIndicador"
								filtros="pPER.cmbbx.GrupoIndicador.filtros"
								auto-cargar="true"
								item-post-filtro="'1'"
								id-defecto="' TODOS'" 
								todos="'S'"
								cascada1-a="pPER.cmbbx.TipoIndicador.filtros.IdGrupoIndicador"
								cascada1-valor="'GrupoIndicador'"   
								seleccionado="pPER.cmbbx.IdGrupoIndicadorObj"
								memoria="'IdGrupoIndicador'">
				</bcs-combobox-base >		
			 </div>
			 
			 <div class="col-xs-6"> 	  			  	  
				<label class="col-xs-3" translate>UI_INDICADOR</label>
				<bcs-combobox-base class="col-xs-8"
								tipo = "'combobox-tipo-indicador'"
								id-actual = "pPER.cmbbx.IdTipoIndicador"
								filtros="pPER.cmbbx.TipoIndicador.filtros"
								auto-cargar="true"
								item-post-filtro="'1'"
								id-defecto="'0'" 
								todos="'S'"
								seleccionado="pPER.cmbbx.IdTipoIndicadorObj"
								memoria="'IdTipoIndicador'">
				</bcs-combobox-base >		
			 </div>
		
				 
		  	</div>
		  	<div class="row">
		  		<div class="col-xs-6">
			  		<label class="col-xs-3" translate>UI_PERSONA</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-socio-negocio'"
						id-actual="pPER.filtro.IdSocioDeNegocio"
						id-defecto="'0'"
						filtros="pPER.cmbbx.SocioDeNegocio.filtros"
						todos="'N'"
						seleccionado="pPER.SocioDeNegocioObj">
					</bcs-combobox-base>
				</div>	
		  	</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pPER.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12"bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pPER.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			id="gridPersona"
			configuracion="pPER.grilla.Persona"
			seleccionado="pPER.grilla.limiteSel"
			fn-exportar-excel="excelPersona"
			api="gridApi">
			
		</bcs-grid>
	</div>

	<div class="row">
		<div class="col-xs-12" style="top:10px">
			<bcs-menu 
				class="col-xs-1 pull-right"
				bcs-habilitado="'true'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="excelPersona('Persona')">						  	{{'UI_EXPORTAR_EXCEL' 		| translate}}</li>
			</bcs-menu>	
		</div>
		
	</div>
</div>	
	
	
</div>

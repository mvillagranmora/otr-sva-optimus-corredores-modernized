<div id="PanelPortafolio" class="row" ng-controller="PanelPortafolioCtrl as pPFO">
<div class="row">

	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">

			 <div class="col-xs-6"> 	  			  	  
				<label class="col-xs-3" translate>UI_GRUPO</label>
				<bcs-combobox-base class="col-xs-8"
								tipo = "'combobox-grupo-indicador'"
								id-actual = "pPFO.cmbbx.IdGrupoIndicador"
								filtros="pPFO.cmbbx.GrupoIndicador.filtros"
								auto-cargar="true"
								item-post-filtro="'1'"
								todos="'N'"
								cascada1-a="pPFO.cmbbx.TipoIndicador.filtros.IdGrupoIndicador"
								cascada1-valor="'GrupoIndicador'"   
								seleccionado="pPFO.cmbbx.IdGrupoIndicadorObj"
								memoria="">
				</bcs-combobox-base >		
			 </div>
			 
			 <div class="col-xs-6"> 	  			  	  
				<label class="col-xs-3" translate>UI_INDICADOR</label>
				<bcs-combobox-base class="col-xs-8"
								tipo = "'combobox-tipo-indicador'"
								id-actual = "pPFO.cmbbx.IdTipoIndicador"
								filtros="pPFO.cmbbx.TipoIndicador.filtros"
								auto-cargar="true"
								item-post-filtro="'1'"
								id-defecto="'0'" 
								todos="'S'"
								seleccionado="pPFO.cmbbx.IdTipoIndicadorObj"
								memoria="">
				</bcs-combobox-base >		
			 </div>
		  	</div>

			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
				<bcs-combobox-base 
					class="col-xs-9"
				 	tipo="'combobox-cliente-portafolio'"
				 	filtros = "pPFO.cmbbx.Portafolio.filtros"
				 	id-actual="pPFO.cmbbx.IdPortafolio"
				 	seleccionado="datos.oClientePortafolio.seleccionado"
				 	configuracion="datos.oClientePortafolio.configuracion"
				 	memoria="''">
				</bcs-combobox-base >
			</div>
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pPFO.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pPFO.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			id="gridPortafolio"
			configuracion="pPFO.grilla.Portafolio"
			seleccionado="pPFO.grilla.limiteSel"
			fn-exportar-excel="excelPortafolio"
			api="gridApi">
			
		</bcs-grid>
	</div>

	<div class="row bcs-panel-comandos" style="padding-top: 10px !important;">
		<div class="col-xs-12">
			<bcs-menu 
				class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-habilitado="'true'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="excelPortafolio('Portafolio')">						  	{{'UI_EXPORTAR_EXCEL' 		| translate}}</li>
			</bcs-menu>	
		</div>
		
	</div>
</div>	
	
	
</div>

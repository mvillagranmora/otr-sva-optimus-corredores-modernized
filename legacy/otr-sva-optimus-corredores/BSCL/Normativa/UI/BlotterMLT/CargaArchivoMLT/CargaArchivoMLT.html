<div id="CargaArchivoMLT" class="col-xs-12" ng-controller="CargaArchivoMLTCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<bcs-grid 
				id="grid-ingreso-mlt"
			 	configuracion="defaultOptions"
				api = "apiGridIngresoMLT"
				seleccionado="datos.kNgModel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button class="col-xs-3"  
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CARGAR_ARCHIVO' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="cargarArchivo()">
			</bcs-button>
			<bcs-button class="col-xs-3"  
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_PROCESAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="procesarArchivo()"
				ng-if="habilitaBotonProcesar">
			</bcs-button>
		</div>
		<div class="col-xs-1"></div>
	</div>
	
</div>

<div id="MLT" ng-controller="MLTCtrl as solTra">
	<form class="col-xs-12 form-horizontal">
		<div class="row" >
			<div class="col-xs-4" >
				<label class="col-xs-4" translate>UI_REGIMEN</label>

			 	 <div class="col-xs-6">	
					   <select style="width:100%;" ng-model="solTra.cmbbx.Regimen" k-ng-disabled="true">
				                <option value="18Q">18 Quater</option>
				                <option value="APV">APV</option>
				       </select>							
					 </div>		
				 	
			</div>
			<div class="col-xs-4" >
					<label class="col-xs-4" translate> UI_FECHA_VALOR_CUOTA</label>
					<bcs-input-date class="col-xs-5" bcs-requerido
						k-ng-model="solTra.fechavalorCuotaSol"
						k-ng-disabled="true">
					</bcs-input-date>
				
			</div>
			<div class="col-xs-4" >
					<label class="col-xs-4" translate>UI_SECUENCIA</label> 
			  		<bcs-input-numero class="col-xs-6"
					 		ng-model="solTra.Secuencia"
					 		decimales="'0'"
					 		k-ng-disabled="true">
					 </bcs-input-numero>
					
			</div>
		</div>
			
		<div class="row" >
			<div class="col-xs-4" >
				<label class="col-xs-4" translate>UI_FOLIO_CONTRATO</label>
					<bcs-input-numero class="col-xs-6"
					 		ng-model="solTra.FolioContrato"
					 		decimales="'0'"
					 		k-ng-disabled="true">
					 </bcs-input-numero>
			</div>

		</div>
			
	</form>
				
	<form class="col-xs-12 form-horizontal">
		<hr>
		<br>
			<div class="col-xs-12" >
			<uib-tabset>
					<!--
					<uib-tab id="TabEgresos" heading="{{'UI_EGRESOS' | translate}}" select="solTra.fnTabPanelEgreso()"  active="solTra.cmbbx.IdTipoMovimiento=='TRAEGR'" ng-show="solTra.cmbbx.IdTipoMovimiento=='TRAEGR'">
						<div class="row" >
							<div id="PanelEgreso"></div>
						</div>
					</uib-tab>
					-->	
					<uib-tab id="TabIngresos" heading="{{'UI_INGRESOS' | translate}}" select="solTra.fnTabPanelIngreso()" >
						<div class="row">
							<div id="PanelIngreso"></div>
						</div>
					</uib-tab>
													
			</uib-tabset> 
			</div>
	</form>
	<form class="col-xs-12 form-horizontal">	
		<br>
	</form>	
</div>

<div id="PanelOperaciones" class="row" ng-controller="PanelOperacionesCtrl as pct">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">

		  	<div class="row">
		  	<div class="col-xs-10">
			  		<label class="col-xs-2" translate>UI_CLIENTE</label>
					<bcs-combobox-base class="col-xs-10"
						tipo="'combobox-socio-negocio'"
						id-actual="pct.filtro.IdSocioDeNegocio"
						id-defecto="'0'"
						filtros="pct.cmbbx.SocioDeNegocio.filtros"
						todos="'N'"
						seleccionado="pct.SocioDeNegocioObj">
					</bcs-combobox-base>
				</div>	 
		  	</div>
		  	
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pct.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pct.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>

		<!--configuracion="pct.grillaCong" -->
	<div class="row">
		<bcs-grid
			id="gridEST"
			
			configuracion="pct.grilla.EST"
			
			seleccionado="pct.grilla.ESTSel"
			fn-exportar-excel="excelEST"
			api="gridApi">
		
		</bcs-grid>
	</div>
 
	<div class="row">
		<div class="col-xs-12" style="top:10px; padding-bottom: 10px;">
		  
			<bcs-menu 
				class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-habilitado="'true'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="excelEST('EST')">						  	{{'UI_EXPORTAR_EXCEL' 		| translate}}</li>
			</bcs-menu>	
		</div>
		
	</div>

	
	
	
</div>

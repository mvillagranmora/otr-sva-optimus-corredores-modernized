<form class="col-xs-12 form-horizontal">
	<div id="MantenedorInforme" ng-controller="MantenedorInformeCtrl"	style="padding-right: 0px;">
		<div>
			<!-- Inicia Información de Informe -->
			<div style="width:500px; float: right;">
				<hr style="margin-bottom:10px">
				<div class="row">
					<label class="col-xs-2" translate>Informe</label>
					<bcs-input-texto class="col-xs-10" k-ng-disabled="'true'" 
					ng-model="data.NombreInforme"></bcs-input-texto>
				</div>
				<hr style="margin-bottom:10px">	
				<div class="row">
					<label class="col-xs-2" translate>UI_NOMBRE_INDICE</label>
					<bcs-combobox-base 
						class="col-xs-6"
						activado="!inputDisabled"
						filtros=""
						id="IdIndice"						
						id-actual="data.IdIndice"
						id-defecto="'0'"
						seleccionado="indiceSeleccionado"						
						tipo="'combobox-indice-ils'" 
					>
					</bcs-combobox-base>
					<label class="col-xs-1" translate>Orden </label>
					<bcs-input-texto class="col-xs-2" 
					k-ng-disabled="data.kngOrdenIndice"
					ng-model="data.OrdenIndice"></bcs-input-texto>						
				</div>
				<div class="row">
					<bcs-button class="col-xs-2 col-xs-offset-8" 
					        bcs-tipo="'bcs-button-input-form'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_GRABAR' | translate"
							bcs-habilitado="habilitaGrabar"
							style="margin-bottom: 2px" 
							bcs-clic="agregarIndiceInforme()"></bcs-button>
					<bcs-button class="col-xs-2 " bcs-tipo="'bcs-button-input-form'"
						bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="habilitadoLimpiar" bcs-clic="limpiar()"></bcs-button>						
				</div>
				<div class="row">
					<new-bcs-grid id="grid-moneda"
						configuracion="Indice"
						seleccionado="seleccionIndice">
					</new-bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 pull-right">
						<bcs-button class="col-xs-6 pull-right" bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="habilitaEliInd" bcs-clic="eliminarIndice()"></bcs-button>
					</div>
				</div>
			</div>
			<!-- Finaliza Información de Informe -->	
						
			<!-- Inicia Grid Inquierdo Informe -->
			<div style="float: none; overflow: hidden; padding-right: 10px">
				<div class="row bcs_titulo no-margin">Informes</div>
				<!-- Grilla Informe -->
				<div class="row">
					<new-bcs-grid id="grid-informe"
						configuracion="Informe"
						seleccionado="seleccionInforme">
					</new-bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-8 pull-right">
						<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'"
							bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
							bcs-habilitado="'true'" bcs-clic="agregarInforme()"></bcs-button>
						<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate"
							bcs-habilitado="habilitado" bcs-clic="modificarInforme()"></bcs-button>
						<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-secondary'"
							bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="habilitado" bcs-clic="eliminarInforme()"></bcs-button>					
					</div>
				</div>
			</div>
			<!-- Finaliza Grid Izquierdo Informe -->			
		</div>
	</div>
</form>

<div class="col-xs-12" ng-controller="AgregarInformeCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarInforme" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>Nombre Informe</label>
					<bcs-input-texto class="col-xs-8" bcs-requerido="data.NombreInforme.trim()!=''"
						ng-model="data.NombreInforme"
						k-ng-model="data.kngNombreInforme">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Empresa</label>
					<bcs-combobox-base 
							class="row col-xs-8"
							id="UI_EMPRESA"
							auto-cargar="'true'"
							tipo="'combobox-empresas-ils'"
							id-defecto="IdEmpresa"
							seleccionado="data.IdEmpresa.seleccionado"
						>
						</bcs-combobox-base>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">
			<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate"
				bcs-habilitado="data.Habilitado" bcs-clic="AgregarInforme()"></bcs-button>
			<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>				
		</div>
	</div>
</div>

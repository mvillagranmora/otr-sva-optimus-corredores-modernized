
	<div id="MantenedorItem" ng-controller="MantenedorDigitadoCtrl"	style="padding-right: 0px;">
		<!-- Inicia Información de Item -->
		
		<div class="row">
			<div class="col-xs-5"> 
				<label class="col-xs-3" translate>UI_REPORTE</label>
				<bcs-combobox-base 
					class="col-xs-8"
					id="IdInforme"
					auto-cargar="'true'"
					tipo="'combobox-informe-tipo-ils'"
					id-defecto="data.Reporte"
					seleccionado="data.ReporteSeleccionado"
					activado="'false'">
				</bcs-combobox-base>
			</div>
			<div class="col-xs-3">
				<label class="col-xs-5 col-xs-offset-1" translate>UI_ILS_FECHA_CONTABLE</label>
				<bcs-input-date 
					activado="'false'" 
					class="col-xs-6" 
					id="IdFechaContable"
					k-ng-model="kngFechaContable"
					k-ng-disabled = "'true'">
				</bcs-input-date>						
			</div>
		</div>
		<hr style="margin-bottom:10px">
		<form class="col-xs-12 form-horizontal">
			<div class="row">
				<div class="col-xs-12">
					<!-- Inicia Grid Izquierdo Item -->
					<bcs-grid id="grid-superior"
						configuracion="Item"
						seleccionado="seleccionItem">
					</bcs-grid>
					<!-- Finaliza Grid Izquierdo -->
				</div>
			</div>
			<div class="row">
				<!-- Indica Grid Derecho -->
				<div class="col-xs-6">
					<br>
					<div class="col-xs-1"></div>
					<div class="col-xs-3">
						<bcs-input-checkbox class="col-xs-2"
							id="UI_MAYOR_CERO"
							ng-model="data.ChkMayorCero"
							k-ng-model="data.ChkMayorCero"
							ng-disabled="!habilitadoDigitada"
						>
						</bcs-input-checkbox>
						<label class="col-xs-10" translate>UI_MAYOR_CERO</label>
					</div>
					<div class="col-xs-3">
						<bcs-input-checkbox class="col-xs-2"
							id="UI_MENOR_CERO"
							ng-model="data.ChkMenorCero"
							k-ng-model="data.ChkMenorCero"
							ng-disabled="!habilitadoDigitada"
						>
						</bcs-input-checkbox>
						<label class="col-xs-10" translate>UI_MENOR_CERO</label>
					</div>
					<div class="col-xs-3">
						<bcs-input-checkbox class="col-xs-2"
							id="UI_PERMITE_CERO"
							ng-model="data.ChkPermiteCero"
							k-ng-model="data.ChkPermiteCero"
							ng-disabled="!habilitadoDigitada"
						>
						</bcs-input-checkbox>
						<label class="col-xs-10" translate>UI_PERMITE_CERO</label>
					</div>
				</div>
				<!-- Finaliza Grid Derecho -->
			</div>				
		</form>

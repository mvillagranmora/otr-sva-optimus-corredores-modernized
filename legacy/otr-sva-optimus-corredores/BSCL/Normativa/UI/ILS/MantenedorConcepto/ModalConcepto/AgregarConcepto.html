<div class="col-xs-12" ng-controller="AgregarConceptoCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarCocepto" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>UI_CONCEPTO</label>
					<bcs-input-texto class="col-xs-8"
						k-ng-disabled="'true'" 
						ng-model="idConcepto"
					>
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_CONCEPTO</label>
					<bcs-input-texto class="col-xs-8" 
						bcs-requerido="nombreConcepto.trim()!=''"
						ng-model="nombreConcepto"
					>
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_NOMBRE_CORTO</label>
					<bcs-input-texto class="col-xs-8" 
						bcs-requerido="nombreCortoConcepto.trim()!=''"
						ng-model="nombreCortoConcepto"
					>
					</bcs-input-texto>
				</div>
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">
			<bcs-button class="col-xs-6" 
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="MantenedorConcepto('I')"></bcs-button>
			<bcs-button class="col-xs-6" 
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" 
				bcs-clic="cancelar()"></bcs-button>				
		</div>
	</div>
</div>

<form class="col-xs-12 form-horizontal">
	<div id="MantenedorConcepto" ng-controller="MantenedorConceptoCtrl"	style="padding-right: 0px;">
		<div>
					
<!-- Inicia Grid Izquierdo Concepto -->
			<div class="row">	
				<div class="col-xs-6">
					
					<div style="float: none; overflow: hidden; padding-right: 10px"> 
						<div class="row bcs_titulo no-margin">Conceptos</div>
						<!-- Grilla Concepto -->
						<div class="row">
							<new-bcs-grid id="grid-concepto"
								configuracion="Concepto"
								seleccionado="seleccionConcepto">
							</new-bcs-grid>
						</div>
						<div class="row bcs-panel-comandos">
							<div class="col-xs-6"></div>
							<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-primary'"
								bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"
								bcs-habilitado="'true'" bcs-clic="agregarConcepto('I')"></bcs-button>
							<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
								bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate"
								bcs-habilitado="habilitado" bcs-clic="agregarConcepto('M')"></bcs-button>
							<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
								bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"
								bcs-habilitado="habilitado" bcs-clic="eliminarConcepto('E')"></bcs-button>					
						</div>
					</div> 
				</div>
<!-- Finaliza Grid Izquierdo Concepto -->	

			<div class="col-xs-6">
<!-- Inicia Informaci�n de Concepto -->
				<hr style="margin-bottom:10px">
				<div class="row">
					<label class="col-xs-2" translate>UI_CONCEPTO</label>
					<bcs-input-texto class="col-xs-10" 
						k-ng-disabled="'true'" 
						ng-model="filtro.NombreConcepto"
					>
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_NOMBRE_CORTO</label>
					<bcs-input-texto class="col-xs-6" 
						k-ng-disabled="'true'" 
						ng-model="filtro.NombreCorto"
					>
					</bcs-input-texto>
				</div>				
				<hr style="margin-bottom:10px">
				
				
				<!-- Inicio Grupo concepto -->
				<div class="row">
					<label class="col-xs-2" translate>UI_NOMBRE_GRUPO_CONCEPTO</label>
					<bcs-input-texto class="col-xs-10" 
						ng-model="nombreGrupoConcepto"
						k-ng-disabled="!habilitadoGrupoConcepto"
					>
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_NOMBRE_CORTO</label>
					<bcs-input-texto class="col-xs-4" 
						ng-model="nombreGrupoCortoConcepto"
						k-ng-disabled="!habilitadoGrupoConcepto"
					>
					</bcs-input-texto>	
					
					<label class="col-xs-2" translate>UI_FACTOR</label>
					<bcs-input-numero 
						class="col-xs-4" 
						k-ng-disabled="!habilitadoGrupoConcepto" 
						ng-model="factorGrupo"
						k-ng-model="kngFactorGrupo"
						k-options="{min: -99.9999, max: 99.9999, spinners : false}"
					>
					</bcs-input-numero>
										
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 col-xs-offset-8">
						<bcs-button class="col-xs-6" 
								bcs-tipo="'bcs-button-input-form'"
								bcs-auto-desactivar="false" 
								bcs-texto="'UI_GRABAR' | translate"
								bcs-habilitado="habilitaGrabarGrupo()" 
								bcs-clic="MantenedorConceptoGrupoConfiguracion('I')"
						>
						</bcs-button>	
						<bcs-button class="col-xs-6" 
							bcs-tipo="'bcs-button-input-form'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_LIMPIAR' | translate"
							bcs-habilitado="habilitaGrabarGrupo()" 
							bcs-clic="limpiarConceptoGrupo()"
						>
						</bcs-button>

					</div>
				</div>
				<div class="row">
					<new-bcs-grid id="grid-concepto-grupo-configuarcion"
						configuracion="ConceptoGrupoConfiguracion"
						fn-doble-click="detalleConceptoGrupoConfiguracion(seleccionConceptoGrupoConfiguracion)"
						seleccionado="seleccionConceptoGrupoConfiguracion">
					</new-bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 col-xs-offset-8">
						<div class="col-xs-6">
						</div>
						<bcs-button class="col-xs-6" 
							bcs-tipo="'bcs-button-input-form'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="habilitadoGrupoEliminar" 
							bcs-clic="MantenedorConceptoGrupoConfiguracion('E')">
						</bcs-button>
					</div>
				</div>
				<!-- Fin Grupo concepto -->
				
				
				<hr style="margin-bottom:10px">
				<div class="row">
					<label class="col-xs-2" translate>UI_NOMBRE_ITEM</label>
					<bcs-combobox-base 
						class="col-xs-10"
						activado="habilitadoItem"
						filtros=""
						id="IdItem"						
						id-actual="NombreItem"
						id-defecto="'0'"
						seleccionado="itemSeleccionado"						
						tipo="'combobox-item-ils'"
					>
					</bcs-combobox-base>
				</div>
				<div class="row">
					<!-- <label class="col-xs-2" translate>UI_FACTOR</label>
					<bcs-input-numero 
						class="col-xs-4" 
						k-ng-disabled="!habilitadoItem" 
						ng-model="Factor"
						k-ng-model="kngFactor"
						k-options="{max: 99.9999, spinners : false}"
					>
					</bcs-input-numero>-->
					<label class="col-xs-2" translate>UI_OPERACION</label>
					<bcs-combobox-base
						class="col-xs-4"
						activado="habilitadoItem"
						filtros=""
						id="operacionId"						
						ng-model="Signo"										
						id-actual="Operacion"
						id-defecto="'0'"
						seleccionado="operacionseleccionado"						
						tipo="'combobox-tipo-operacion-ctb'"
					>
					</bcs-combobox-base>						
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 col-xs-offset-8">
						<bcs-button class="col-xs-6" 
								bcs-tipo="'bcs-button-input-form'"
								bcs-auto-desactivar="false" 
								bcs-texto="'UI_GRABAR' | translate"
								bcs-habilitado="habilitaGrabar()" 
								bcs-clic="MantenedorConceptoConfiguracion('I')"
						>
						</bcs-button>	
						<bcs-button class="col-xs-6" 
							bcs-tipo="'bcs-button-input-form'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_LIMPIAR' | translate"
							bcs-habilitado="habilitaGrabar()" 
							bcs-clic="limpiar()"
						>
						</bcs-button>
					</div>
				</div>
				<div class="row">
					<new-bcs-grid id="grid-concepto-configuarcion"
						configuracion="ConceptoConfiguracion"
						fn-doble-click="detalleConceptoConfiguarcion(seleccionConceptoConfiguarcion)"
						seleccionado="seleccionConceptoConfiguarcion">
					</new-bcs-grid>
				</div>
				<div class="row bcs-panel-comandos">
					<div class="col-xs-4 col-xs-offset-8">
						<div class="col-xs-6">
						</div>
						<bcs-button class="col-xs-6" 
							bcs-tipo="'bcs-button-input-form'"
							bcs-auto-desactivar="false" 
							bcs-texto="'UI_ELIMINAR' | translate"
							bcs-habilitado="habilitadoEliminar" 
							bcs-clic="MantenedorConceptoConfiguracion('E')">
						</bcs-button>
					</div>
				</div>
			</div> 
		</div>
	</div>
					
		</div>
	</div>
</form>

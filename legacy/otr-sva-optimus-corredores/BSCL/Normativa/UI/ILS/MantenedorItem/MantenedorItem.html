<form class="col-xs-12 form-horizontal">
	<div id="MantenedorItem" ng-controller="MantenedorItemCtrl"	style="padding-right: 0px;">
		<!-- Inicia Información de Item -->
		<div style="width:600px; float: right;">
			<hr style="margin-bottom:10px">		
			<div class="row">
				<label class="col-xs-2" translate>UI_ITEM</label>
				<bcs-input-texto class="col-xs-6" k-ng-disabled="'true'" ng-model="filtro.item"></bcs-input-texto>
				<label class="col-xs-1 col-xs-offset-1 ng-scope" translate>UI_TIPO</label>
				<bcs-input-texto class="col-xs-2" k-ng-disabled="'true'" ng-model="filtro.tipo"></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_NOMBRE_CORTO</label>
				<bcs-input-texto class="col-xs-4" 
					k-ng-disabled="'true'" 
					ng-model="filtro.nombreCorto"
				>
				</bcs-input-texto>
			</div>			
			<hr style="margin-bottom:10px">	
			<div class="row">
				<label class="col-xs-2" translate>UI_ITEM_CONTABLE</label></br></br>
				<label class="col-xs-2" translate>UI_CUENTA_CONTABLE</label>
				<bcs-combobox-base 			
					class="col-xs-10"	
					activado="habilitado"				
					seleccionado="cuentacontableSeleccionado"
					id-actual="filtro.CuentaContable"
					tipo="'combobox-cuentas-contables'"
				>
				</bcs-combobox-base>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_SALDO_DH</label>
				<bcs-combobox-base 
					activado="habilitado"				
					class="col-xs-2"
					filtros=""
					id="saldoId"						
					id-actual="filtro.Saldo"
					id-defecto="'0'"
					seleccionado="saldoSeleccionado"
					tipo="'combobox-tipo-saldo-dh'"
				>
				</bcs-combobox-base>					
				<label class="col-xs-2" translate>UI_CONDICION</label>
				<bcs-combobox-base 
					activado="habilitado"				
					class="col-xs-2"
					filtros=""
					id="condicionId"						
					id-actual="filtro.Condicion"
					id-defecto="'0'"
					seleccionado="condicionSeleccionado"
					style="padding-left:7px;"
					tipo="'combobox-condicion-ctb'"
				>
				</bcs-combobox-base>					
				<label class="col-xs-2" translate>UI_MONTO</label>
				<bcs-input-numero class="col-xs-2" 
					k-ng-disabled="!habilitado" 
					ng-model="Monto"
					k-ng-model="data.kngMonto"
				>
				</bcs-input-numero>
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_FACTOR</label>
				<bcs-input-numero class="col-xs-2" 
					k-ng-disabled="!habilitado" 
					ng-model="Factor"
					k-ng-model="data.kngFactor"
					k-options="{min: -99.9999}"
				>
				</bcs-input-numero>
				<label class="col-xs-2" translate>UI_OPERACION</label>
				<bcs-combobox-base 
					activado="habilitado"
					class="col-xs-2"
					filtros=""
					id="operacionId"						
					id-actual="filtro.Operacion"
					id-defecto="'0'"
					seleccionado="operacionSeleccionado"
					style="padding-left:7px;"						
					tipo="'combobox-tipo-operacion-ctb'"
				>
				</bcs-combobox-base>				
					<bcs-button 
						id="Grabar"
						class="col-xs-2 col-xs-offset-2" 
						bcs-auto-desactivar="false" 
						bcs-tipo="'bcs-button-input-form'"
						bcs-texto="'UI_GRABAR' | translate"
						bcs-habilitado="habilitadoCtaCtble" 
						bcs-clic="agregarItemConfiguracion('C')"
					>
					</bcs-button>
			</div>
			<div class="row">
					<bcs-button class="col-xs-2 col-xs-offset-10" 
						bcs-auto-desactivar="false"  
						bcs-tipo="'bcs-button-input-form'"
						bcs-texto="'UI_LIMPIAR' | translate"
						bcs-habilitado="habilitado" 
						bcs-clic="limpiar()">
					</bcs-button>		
			</div>
			<div class="row">
				<new-bcs-grid id="grid-itemconfiguracion"
					configuracion="ItemConfiguracion"
					fn-doble-click="detalleItemConfiguracion(seleccionItemConfiguracion)"
					seleccionado="seleccionItemConfiguracion">
				</new-bcs-grid>
			</div>
			<div class="row">
				
					<bcs-button class="col-xs-2 col-xs-offset-10" 
						bcs-auto-desactivar="false" 
						bcs-tipo="'bcs-button-input-form'"
						bcs-texto="'UI_ELIMINAR' | translate"
						bcs-habilitado="habilitado" 
						bcs-clic="eliminarCuentaContableItem()"
					>
					</bcs-button>
				
			</div>
			<hr style="margin-bottom:8px">
			<!-- DIGITADA -->
			<div class="row bcs-panel-comandos">
				<label class="col-xs-2" translate>UI_ITEM_DIGITADO</label></br></br>
				<div class="col-xs-3">
					<bcs-input-checkbox class="col-xs-2"
						id="UI_MAYOR_CERO"
						ng-model="data.ChkMayorCero"
						k-ng-model="data.ChkMayorCero"
						ng-disabled="!habilitadoDigitada"
					>
					</bcs-input-checkbox>
					<label class="col-xs-10" translate>UI_MAYOR_CERO</label>
				</div>
				<div class="col-xs-3">
					<bcs-input-checkbox class="col-xs-2"
						id="UI_MENOR_CERO"
						ng-model="data.ChkMenorCero"
						k-ng-model="data.ChkMenorCero"
						ng-disabled="!habilitadoDigitada"
					>
					</bcs-input-checkbox>
					<label class="col-xs-10" translate>UI_MENOR_CERO</label>
				</div>
				<div class="col-xs-3">
					<bcs-input-checkbox class="col-xs-2"
						id="UI_PERMITE_CERO"
						ng-model="data.ChkPermiteCero"
						k-ng-model="data.ChkPermiteCero"
						ng-disabled="!habilitadoDigitada"
					>
					</bcs-input-checkbox>
					<label class="col-xs-10" translate>UI_PERMITE_CERO</label>
				</div>
				<div class="col-xs-3">
					<bcs-button class="col-xs-8" style="float: right;" 
						bcs-auto-desactivar="false" 
						bcs-tipo="'bcs-button-input-form'"
						bcs-texto="'UI_GRABAR' | translate"
						bcs-habilitado="habilitadoDigitada" 
						bcs-clic="agregarItemConfiguracionDigitadoProgramado('D')"
					>
					</bcs-button>
				</div>
			</div>	
			<hr style="margin-bottom:10px">
			<div class="row">
				<label class="col-xs-2" translate>UI_ITEM_PROGRAMADO</label></br></br>
				<label class="col-xs-2" translate>UI_SERVICIO</label>
				<bcs-input-texto 
					class="col-xs-2" 
					k-ng-disabled="'true'" 
					ng-model="data.IdProcesoFuncion"
				>
				</bcs-input-texto>
				<bcs-input-texto 
					class="col-xs-8" 
					k-ng-disabled="'true'" 
					ng-model="data.NombreServicioProgramado"
				>
				</bcs-input-texto>
			</div>
			<div class="row">
				<new-bcs-grid id="grid-itemprogramado"
					configuracion="ItemProgramado"
					seleccionado="seleccionItemProgramado">
				</new-bcs-grid>
			</div>
			<div class="row bcs-panel-comandos">
				<div class="col-xs-2 col-xs-offset-10">
					<bcs-button  
						bcs-auto-desactivar="false" 
						bcs-tipo="'bcs-button-input-form'"
						bcs-texto="'UI_GRABAR' | translate"
						bcs-habilitado="habilitadoProgramado" 
						bcs-clic="agregarItemConfiguracionDigitadoProgramado('P')"
					>
					</bcs-button>
				</div>
			</div>
				
		</div>
		<!-- Finaliza Información de Item -->	
						
		<!-- Inicia Grid Izquierdo Item -->
		<div style="float: none; overflow: hidden; padding-right: 10px">
			<div class="row">
				<new-bcs-grid id="grid-informe"
					configuracion="Item"
					seleccionado="seleccionItem">
				</new-bcs-grid>
			</div>
			<div class="row bcs-panel-comandos">
				<div class="col-xs-8 pull-right">
					<bcs-button class="col-xs-4" 
						bcs-auto-desactivar="false" bcs-tipo="'bcs-button-primary'" bcs-texto="'UI_AGREGAR' | translate"
						bcs-habilitado="'true'" bcs-clic="agregarItem()"></bcs-button>
					<bcs-button class="col-xs-4" 
						bcs-auto-desactivar="false" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_MODIFICAR' | translate"
						bcs-habilitado="habilitadoItem" bcs-clic="modificarItem()"></bcs-button>
					<bcs-button class="col-xs-4" 
						bcs-auto-desactivar="false" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_ELIMINAR' | translate"
						bcs-habilitado="habilitadoItem" bcs-clic="eliminarItem()"></bcs-button>					
				</div>
			</div>
		</div>
		<!-- Finaliza Grid Izquierdo Item -->			
	</div>
</form>

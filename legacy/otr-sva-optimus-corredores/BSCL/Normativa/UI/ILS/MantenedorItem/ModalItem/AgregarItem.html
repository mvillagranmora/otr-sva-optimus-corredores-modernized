<div class="col-xs-12" ng-controller="AgregarItemCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarItem" class="col-xs-12 form-horizontal">
				<div class="row">
					<label class="col-xs-4" translate>Id Item</label>
					<bcs-input-texto 
						activado="false"				
						class="col-xs-8" 
 						k-ng-disabled="'true'" 					
						ng-model="data.IdItem">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Item</label>
					<bcs-input-texto 
						bcs-requerido="data.NombreItem.trim()!=''"
						class="col-xs-8" 
						maxlength="200"
						ng-model="data.NombreItem">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Tipo Item</label>
					<bcs-combobox-base 
						auto-cargar="'true'"	
						activado="habilitado"				
						bcs-requerido="oConfiguracionItemTipo.idActual!='false'"	
						configuracion= "oConfiguracionItemTipo.configuracion"
						class="col-xs-8"
						id="TipoItemId"						
						id-actual="oConfiguracionItemTipo.idActual"
						id-defecto="oConfiguracionItemTipo.idDefecto"
						seleccionado="TipoItem.seleccionado"
						tipo="oConfiguracionItemTipo.tipo"
						>
					</bcs-combobox-base>				
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Corto Item</label>
					<bcs-input-texto class="col-xs-8" maxlength="20" bcs-requerido="data.nombreCortoItem.trim()!=''"
						ng-model="data.NombreCortoItem">
					</bcs-input-texto>
				</div>				
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">	
			<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="habilitaBotonGrabar" bcs-clic="AgregarItem()"></bcs-button>
			<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>
		</div>				
	</div>
</div>

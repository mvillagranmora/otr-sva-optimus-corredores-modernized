<div class="col-xs-12" ng-controller="AgregarIndiceCtrl">
	<div class="bcs-cuerpo"> 
		<div class="row">
			<form name="formAgregarIndice" class="col-xs-12 form-horizontal">
				<div class="row">
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Indice</label>
					<bcs-input-texto 
					    class="col-xs-8" 
					    bcs-requerido="data.nombreIndice.trim()!=''"
						ng-model="data.nombreIndice">
					</bcs-input-texto>
				</div>
				<div class="row">
					<label class="col-xs-4" translate>Nombre Corto Indice</label>
					<bcs-input-texto 
					    class="col-xs-8" 
					    bcs-requerido="data.nombreCortoIndice.trim()!=''"
						ng-model="data.nombreCortoIndice">
					</bcs-input-texto>			
				</div>		
				<div class="row">
					<label class="col-xs-4" translate>UI_PORCENTAJE</label>
					<bcs-input-checkbox
						ng-model	="data.tipoIndice">
					</bcs-input-checkbox>
				</div>			
			</form>
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-4 col-xs-offset-8">
			<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" 
				bcs-habilitado="habilitaGrabar()" bcs-clic="AgregarIndice()"></bcs-button>
			<bcs-button class="col-xs-6" bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="true" bcs-clic="cancelar()"></bcs-button>		
		</div>		
	</div>
</div>

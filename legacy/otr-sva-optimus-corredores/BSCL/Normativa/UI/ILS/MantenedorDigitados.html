<div ng-controller="ModalMantenedorDeCamposDigitados as mManCamDig">
	<form name="formMantenedorCamposDigitados" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_EDITAR_ESTADO|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<!-- EDITAR ESTADOS -->
			<br>
			<div class="row">
				<div class="row col-xs-12">
					<label class="col-xs-3" translate>UI_PRODUCTO</label>
					<bcs-input-texto 
						class="col-xs-8" 
						id="UI_PRODUCTO" 
						ng-model="data.NombreProducto" 
						k-ng-model="data.kngNombreProducto"
						k-ng-disabled="true"
					>
					</bcs-input-texto>
				</div>			
				<div class="row col-xs-12">
					<label class="col-xs-3" translate>UI_INSTRUMENTO</label>
					<bcs-input-texto 
						class="col-xs-8" 
						id="UI_INSTRUMENTO" 
						ng-model="data.instrumento" 
						k-ng-model="data.kngInstrumento"
						k-ng-disabled="true"
					>
					</bcs-input-texto>
				</div>
				<div class="row col-xs-12">
					<label class="col-xs-3" translate>UI_MONEDA_PRINCIPAL</label>
					<bcs-input-texto 
						class="col-xs-8" 
						id="UI_MONEDA_PRINCIPAL" 
						ng-model="data.monedaPrincipal" 
						k-ng-model="data.kngMonedaPrincipal"
						k-ng-disabled="true"
					> 
					</bcs-input-texto>
				</div>
				<div class="row col-xs-12">
					<label class="col-xs-3" translate>UI_MONEDA_SECUNDARIA</label>
					<bcs-input-texto 
						class="col-xs-8" 
						id="UI_MONEDA_SECUNDARIA" 
						ng-model="data.monedaSecundaria" 
						k-ng-model="data.kngMonedaSecundaria"
						k-ng-disabled="true"
					>
					</bcs-input-texto>
				</div>
				<div class="col-xs-12">
						<label class="row col-xs-3" translate>UI_ESTADO</label>
						<bcs-combobox-base 
							class="row col-xs-8"
							id="UI_ESTADO"
							auto-cargar="'true'"
							tipo="'combobox-estado-mesa'"
							seleccionado="data.oConfiguracionEstado.seleccionado"
							filtros="data.oConfiguracionEstado.filtros"
			            	id-defecto="data.estadoDefecto"
						>
						</bcs-combobox-base>
					</div>
			</div>
			<br>
			
			<!-- BOTONES -->
			<div class="row bcs-panel-comandos">
				<bcs-button class="col-xs-3" bcs-tipo="'principal'"
					bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate"
					bcs-habilitado="true"
					bcs-clic="data.editarEstado()">
				</bcs-button>
			</div>
		</div>
		<hr>
</div>
</form>
</div>

<div id="GeneracionCartas" class="row" ng-controller="GeneracionCartasCtrl as pc1">
<form class="col-xs-12 form-horizontal">
	<br>
		<div class="row" >
			<label class="col-xs-3" translate>UI_FECHA_DESDE</label>
			<bcs-input-date class="col-xs-9" k-ng-model="pc1.FecInicio" ></bcs-input-date>	
		</div>
		<div class="row" >
			<label class="col-xs-3" translate>UI_HASTA</label>
			<bcs-input-date class="col-xs-9" k-ng-model="pc1.FecTermino"></bcs-input-date>	
		</div>
		<div class="row" >
			<label class="col-xs-3" translate>UI_NOTIFICACION</label>
			<bcs-combobox-base class="col-xs-9"
				id-actual = 'pc1.IdNotificacion'
				tipo="'combobox-tipo-notificacion-carta'"
				todos="'S'"
				id-defecto="'0'"
				filtros	= "pc1.notificacion.filtros">
				</bcs-combobox-base>	
		</div>
	<br>	
</form>		
	<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			 <bcs-button class="col-xs-4 pull-right"   bcs-tipo="'bcs-button-primary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate"
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.generarCartas()">
			 </bcs-button>
			 <bcs-button class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	
</div>

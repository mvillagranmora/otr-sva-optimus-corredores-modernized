<div id="ModalCir1720" ng-controller="IngresarCir1720Ctrl as IngresarCir1720">
				
	<form name="FormIngresoCir1720" class="filters-formulario">
	<div class="row">
		  <label class="col-xs-2 titulo" translate>UI_DATOS_CIRCULAR</label>
	</div>
		  		<hr>
	<br>
	 <div class="bcs-cuerpo">

       
       		<div class="col-xs-12" >
			
				<div class="row" >
				
					<label class="col-xs-3" translate>UI_NEMO</label>
					<bcs-input-texto
						class				="col-xs-3"
						ng-model			="IngresarCir1720.DatosIngreso.Nemotecnico"
						maxlength			="20"
						bcs-requerido>
					</bcs-input-texto>
					
					<label class="col-xs-2 col-xs-offset-1" translate>UI_EMISOR</label>
					<bcs-input-texto
						class				="col-xs-3"
						ng-model			="IngresarCir1720.DatosIngreso.Emisor"
						maxlength			="30"
						bcs-requerido>
					</bcs-input-texto>
					

				</div>
				
			</div>
 			
			<div class="col-xs-12" >
			
				<div class="row" >
			
					<label class="col-xs-3" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-input-texto
						class				="col-xs-3"
						ng-model			="IngresarCir1720.DatosIngreso.TipoInstrumento"
						maxlength			="10"
						bcs-requerido>
					</bcs-input-texto>
					
					<label class="col-xs-2 col-xs-offset-1"  translate>UI_CANTIDAD_NOMINALES</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CANTIDAD_NOMINALES"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CantidadNominales"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
				</div>
				
			</div>
			
			<div class="col-xs-12">
					<div class="row">
				
						
						
						<label class="col-xs-3" translate>UI_TIPO_UNIDADES</label>
						<bcs-input-texto
							class			="col-xs-3"
							ng-model		="IngresarCir1720.DatosIngreso.TipoUnidades"
							maxlength		="15"
							bcs-requerido>
						</bcs-input-texto>
				
					
						<label class="col-xs-2 col-xs-offset-1" translate>UI_VALORIZACION</label>
						<bcs-input-numero 
							class			="col-xs-3"
							id				="UI_VALORIZACION"
							decimales 		="'0'"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.Valorizacion"
							decimales 		="IngresarCir1720.Config.SinDecimales">
						</bcs-input-numero>
					
					</div>
				</div>	
					
				<div class="col-xs-12">
					<div class="row">
					
						<label class="col-xs-3" translate>UI_CARTERA_PROPIA</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CARTERA_PROPIA"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CarteraPropia"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
					
						
						<label class="col-xs-2 col-xs-offset-1" translate>UI_CUSTODIA_TERCEROS</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_TERCEROS"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaTerceros"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
						
						
					
					</div>
				</div>
				
				<div class="col-xs-12">
					<div class="row">
					
						<label class="col-xs-3"  translate>UI_CUSTODIA_PROPIA_DCV</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_PROPIA_DCV"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaPropiaDCV"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
							
						<label class="col-xs-2 col-xs-offset-1" translate>UI_CUSTODIA_TERCEROS_DCV</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_TERCEROS_DCV"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaTercerosDCV"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
						
					</div>
				</div>
				
				<div class="col-xs-12">
					<div class="row">
						
						<label class="col-xs-3" translate>UI_CUSTODIA_SOCIEDAD_EMISORA</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_SOCIEDAD_EMISORA"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaSociedadEmisora"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
					
						<label class="col-xs-2 col-xs-offset-1" translate>UI_CUSTODIA_INTERMEDIARIO</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_INTERMEDIARIO"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaIntermediario"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
					</div>
				</div>					
								
				<div class="col-xs-12">							
					<div class="row">
						<label class="col-xs-3" translate>UI_CUSTODIA_BOLSAS</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_BOLSAS"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaBolsas"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
					
						<label class="col-xs-2 col-xs-offset-1" translate>UI_CUSTODIA_OTROS</label>
						<bcs-input-numero
							class			="col-xs-3"
							id				="UI_CUSTODIA_OTROS"
							bcs-requerido
							k-ng-model		="IngresarCir1720.DatosIngreso.CustodiaOtros"
							decimales 		="IngresarCir1720.Config.ConDecimales">
						</bcs-input-numero>
					</div>
				</div>
				
				<div class="col-xs-6">
					<label class="col-xs-6" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-6" k-ng-model="IngresarCir1720.FecTermino"></bcs-input-date>
					</bcs-input-date>
				</div>
			
					
			</div>	
	
<br>
<br>	
	
	
<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px">
			 <bcs-button 
			 	class="col-xs-4 pull-right"
			 	bcs-habilitado="IngresarCir1720.FormValido"   
			 	bcs-tipo="'bcs-button-primary'"    			
			 	bcs-auto-desactivar="false" 
			 	bcs-texto="'UI_GUARDAR' | translate"
			 	bcs-clic="IngresarCir1720.ingresarSol()">
			 </bcs-button>
			 <bcs-button 
			 	class="col-xs-4 pull-right" 
			 	bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="IngresarCir1720.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	</form>	
</div>

<div id="PanelCirNCG499" class="row" ng-controller="PanelCirNCG499trl as pct">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-8" k-ng-model="pct.FecTermino" todo-dias="true"></bcs-input-date>
					</bcs-input-date>
			
			  		
				</div>
				<div class="col-xs-1">  		
				</div>	
				<div class="col-xs-5">
					<i id='toolInformacionCarteras' class="glosa-icono"></i>
					<label translate>UI_GLOSA</label>
			
			  		
				</div>	
		  	</div>
		  	
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pct.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pct.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		
	<div class="row">
		<bcs-grid
			id="gridCirCMF"	
			configuracion="pct.grilla.CirCMF"	
			seleccionado="data.seleccionado"
			fn-exportar-excel="excelCirCMF"
			api="gridApi">
		
		</bcs-grid>
	</div>
	<div class="row" style="padding-top: 10px !important;">
		<div class="col-xs-12">
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'bcs-button-primary'"bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="'true'" bcs-clic="pct.Modificar(data.seleccionado)"></bcs-button>

            <bcs-button class="col-xs-2 pull-left" 
                bcs-tipo="'bcs-button-primary'"
                bcs-texto="'UI_VALORIZAR' | translate"
                bcs-auto-desactivar="false" 
                bcs-habilitado="(filtros.validarBotonValorizar === 'true')"
                ng-show="(filtros.validarBotonValorizar === 'true')" 
                bcs-clic="pct.Valorizar()">
            </bcs-button>
		</div>
	</div>
	
</div>

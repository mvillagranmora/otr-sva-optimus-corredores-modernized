<div id="PanelEdicion" class="row" ng-controller="PanelEdicionCtrl as pc1">
<form class="col-xs-12 form-horizontal">

	<br>
	 <div class="bcs-cuerpo">
       <form name="FormEdicion" class="filters-formulario">
       
       		<div class="col-xs-12" >
			
				<div class="row" >
				
					<label class="col-xs-3  ng-scope" translate>UI_NEMO</label>
					<bcs-input-texto
						class			= "col-xs-3"
						ng-model		= "pc1.control.Nemotecnico"
						k-ng-model		= "pc1.control.Nemotecnico"
						k-ng-disabled	= "true">
					</bcs-input-texto>
					
					<label class="col-xs-3  ng-scope" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-input-texto
						class			= "col-xs-3"
						id="UI_TIPO_INSTRUMENTO"
						bcs-requerido
						ng-model		= "pc1.control.TipoInstrumento"
						k-ng-model		= "pc1.control.TipoInstrumento"
						maxlength		= "10"
						k-ng-disabled	= "false">
					</bcs-input-texto>
				</div>

			</div>
			
			<div class="col-xs-12">
					<div class="row">
				
						<label class="col-xs-3"  translate>UI_CANTIDAD_NOMINALES</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CANTIDAD_NOMINALES"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CantidadUnidadesNominal"
							k-options ="pc1.control.CantidadUnidadesNominalOptions">
						</bcs-input-numero>
				
					
						<label class="col-xs-3" translate>UI_VALORIZACION</label>
						<bcs-input-numero 
							class="col-xs-3"
							id="UI_VALORIZACION"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.Valorizacion"
							k-options ="pc1.control.ValorizacionOptions">
						</bcs-input-numero>
					
					</div>
					<div class="row">
					
						<label class="col-xs-3" translate>UI_CARTERA_PROPIA</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CARTERA_PROPIA"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CarteraPropia"
							k-options ="pc1.control.CarteraPropiaOptions">
						</bcs-input-numero>
					
						
						<label class="col-xs-3" translate>UI_CUSTODIA_TERCEROS</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CUSTODIA_TERCEROS"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaTerceros"
							k-options ="pc1.control.CustodiaTercerosOptions">
						</bcs-input-numero>
					
					</div>
					<div class="row">
						<label class="col-xs-3" translate>UI_CUSTODIA_PROPIA_DCV</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CUSTODIA_PROPIA_DCV"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaPropiaDCV"
							k-options ="pc1.control.CustodiaPropiaDCVOptions">
						</bcs-input-numero>
					
						<label class="col-xs-3" translate>UI_CUSTODIA_TERCEROS_DCV</label>
						<bcs-input-numero
							class="col-xs-3 "
							id="UI_CUSTODIA_TERCEROS_DCV"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaTercerosDCV"
							k-options ="pc1.control.CustodiaTercerosDCVOptions">
						</bcs-input-numero>
					</div>
					
					<div class="row">
						<label class="col-xs-3" translate>UI_CUSTODIA_SOCIEDAD_EMISORA</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CUSTODIA_SOCIEDAD_EMISORA"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaSociedadEmisora"
							k-options ="pc1.control.CustodiaSociedadEmisoraOptions">
						</bcs-input-numero>
					
						<label class="col-xs-3" translate>UI_CUSTODIA_INTERMEDIARIO</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CUSTODIA_INTERMEDIARIO"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaIntermediario"
							k-options ="pc1.control.CustodiaIntermediarioOptions">
						</bcs-input-numero>
					</div>					
															
					<div class="row">
						<label class="col-xs-3" translate>UI_CUSTODIA_BOLSAS</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CUSTODIA_BOLSAS"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaBolsas"
							k-options ="pc1.control.CustodiaBolsasOptions">
						</bcs-input-numero>
					
						<label class="col-xs-3" translate>UI_CUSTODIA_OTROS</label>
						<bcs-input-numero
							class="col-xs-3"
							id="UI_CUSTODIA_OTROS"
							bcs-requerido
							bcs-mayor-que="'0'"
							k-ng-model="pc1.control.CustodiaOtros"
							k-options ="pc1.control.CustodiaOtrosOptions">
						</bcs-input-numero>
					</div>
						
					<div class="row">
		  				<label class="col-xs-3">
							Habilitado
						</label>
						<div class="col-xs-3">
		  					<bcs-input-checkbox ng-model="pc1.control.Habilitado"></bcs-input-checkbox>
		  				</div>		
					</div>
					
			</div>
		</form>		
	</div>
<br>
<br>	

</form>		
	<div class="row bcs-panel-comandos">
	
	
		<div class="col-xs-12" style="top: 10px">
			 <bcs-button class="col-xs-4 pull-right"   bcs-tipo="'bcs-button-primary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate"
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.guardarCambios()">
			 </bcs-button>
			 <bcs-button class="col-xs-4 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.cancelar()">
			 </bcs-button>

	
		</div>
	
	</div>
	
</div>
<br>

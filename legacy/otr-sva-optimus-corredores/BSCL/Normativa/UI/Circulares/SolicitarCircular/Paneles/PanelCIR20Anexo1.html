<div id="PanelCIR20Anexo1" class="row" ng-controller="PanelCIR20Anexo1Ctrl as pc2">
<form class="col-xs-12 form-horizontal">
    <div class="row">
            <div class="col-xs-12">
                <label class="col-xs-3" translate>UI_FECHA</label>
                <bcs-input-date class="col-xs-7" k-options="pc2.FecInicioOptions" k-ng-model="pc2.FecInicio" todo-dias="'true'"></bcs-input-date> 
                
            </div>            
    </div>
    <div class="row">
            <div class="col-xs-12"  ng-show="false">
                <label class="col-xs-3" translate>UI_HASTA</label>
                <bcs-input-date class="col-xs-7" k-ng-model="pc2.FecTermino" todo-dias="'true'"></bcs-input-date>
            </div>

    </div>
</form> 
    <div class="row bcs-panel-comandos">
    
                    
        <div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
            <bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_EMITIR' | translate"
                bcs-habilitado="true"
                bcs-clic="pc2.solicitar()">
             </bcs-button>
             
            <bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
                bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
                bcs-habilitado="true" bcs-clic="pc2.clear()">
            </bcs-button>
            
        </div>
    
    </div>
    
</div>

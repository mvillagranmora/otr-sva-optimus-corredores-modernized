<div id="PanelUAF57BFPEJ" class="row" ng-controller="PanelUAF57BFPEJCtrl as pUAF57">
<form class="col-xs-12 form-horizontal">
		<div class="row">
			<label class="col-xs-3" translate>Cliente</label>
			<div class="col-xs-9">
				<bcs-combobox-base class="col-xs-12" id="comboboxSocioNegocio"
					auto-cargar="'false'"
					tipo="'combobox-socio-negocio'"
					configuracion="pUAF57.oConfiguracionSocioNegocio.configuracion"
					id-Actual="pUAF57.oConfiguracionSocioNegocio.idActual"
					seleccionado="pUAF57.oConfiguracionSocioNegocio.seleccionado">
				</bcs-combobox-base>
			</div>
		</div>			
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
		<bcs-button  class="col-xs-2 pull-right" id="frmPanelUAF57_btn_solicitar"
				bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_EMITIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="solicitar()">
			</bcs-button>
		
			 <bcs-button  class="col-xs-2 pull-right" id="frmPanelUAF57_btn_imprimir"
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="imprimirCircular()">
			</bcs-button>
			
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pUAF57.clear()">
			</bcs-button>
		</div>
	</form>
</div>

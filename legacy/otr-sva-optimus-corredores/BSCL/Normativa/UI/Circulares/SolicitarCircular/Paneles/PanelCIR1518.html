<div id="PanelCIR1518" class="row" ng-controller="PanelCIR1518Ctrl as pct">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pct.FecTermino"></bcs-input-date>
			</div>
			<div class="row">
		
			</div>
			
			<div class="col-xs-12">
					<div class="row">
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckTodos"
									ng-disabled="false">
								</bcs-input-checkbox>
								<label class="col-xs-4" style="text-transform: capitalize" translate>UI_TODOS</label>
							</div>
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckDerivados"
									ng-disabled="pct.DesabilitaChks">
								 </bcs-input-checkbox>
								<label class="col-xs-4" style="text-transform: capitalize" translate>UI_DERIVADOS</label>
							</div>
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckFFMM"									
									ng-disabled="pct.DesabilitaChks">
								</bcs-input-checkbox>
								<label class="col-xs-2" style="text-transform: capitalize" translate>UI_FFM</label>
							</div>
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckInstrucciones"	
									ng-disabled="pct.DesabilitaChks">
								 </bcs-input-checkbox>
								<label class="col-xs-4" style="text-transform: capitalize" translate>UI_INSTRUCCIONES</label>
							</div>			
					</div>
			</div>
			
			<div class="col-xs-12">
					<div class="row">
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckIF"
									ng-disabled="pct.DesabilitaChks">
								</bcs-input-checkbox>
								<label class="col-xs-4" style="text-transform: capitalize" translate>UI_IF</label>
							</div>
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckRF"
									ng-disabled="pct.DesabilitaChks">
								 </bcs-input-checkbox>
								<label class="col-xs-4" style="text-transform: capitalize" translate>UI_RENTA_FIJA</label>
							</div>
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckRV"									
									ng-disabled="pct.DesabilitaChks">
								</bcs-input-checkbox>
								<label class="col-xs-2" style="text-transform: capitalize" translate>UI_RENTA_VARIABLE</label>
							</div>
							<div class="col-xs-3">
								<bcs-input-checkbox class="col-xs-2"
									ng-model="pct.chckSpot"
									ng-disabled="pct.DesabilitaChks">
								 </bcs-input-checkbox>
								<label class="col-xs-4" style="text-transform: capitalize" translate>UI_SPOT</label>
							</div>			
					</div>
			</div>	
	</div>
	<div class="row">
	</div>
</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pct.solicitar()">
			 </bcs-button>

			 <bcs-button class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-secondary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_VER_DATOS' | translate"  
			 	bcs-habilitado="true" 
			 	bcs-clic="pct.visorCircular()">
			 </bcs-button>
			 
			 <bcs-button  class="col-xs-2 pull-right" id="frmPanelCIR1518_btn_imprimir" ng-show="false"
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="imprimirCircular()">
			</bcs-button>
			 
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pct.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

<div id="PanelCarta1BCS" class="row" ng-controller="PanelCarta1BCSCtrl as pc1">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-6" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-6" k-ng-model="pc1.FecInicio"
				></bcs-input-date>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-1" ng-model="pc1.HabFecTermino"></bcs-input-checkbox>
				<label class="col-xs-3" translate>UI_HASTA</label>
				<bcs-input-date class="col-xs-8" ng-show="pc1.HabFecTermino" k-ng-model="pc1.FecTermino"></bcs-input-date>
			</div>
	</div>
</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pc1.solicitar()">
			 </bcs-button>
			 
			 <bcs-button class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-secondary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_VER_DATOS' | translate"  
			 	bcs-habilitado="true" 
			 	bcs-clic="pc1.visorCircular()">
			 </bcs-button>
			 
			 <bcs-button  class="col-xs-2 pull-right" id="frmPanelCarta1BCS_btn_imprimir"
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="imprimirCircular()">
			</bcs-button>
			 
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pc1.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

<div id="PanelUAFDOF" class="row" ng-controller="PanelUAFDOFCtrl as pct">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-6" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-6" k-ng-model="pct.FecInicio"
				></bcs-input-date>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-6" translate>UI_HASTA</label>
				<bcs-input-date class="col-xs-6" k-ng-model="pct.FecTermino"></bcs-input-date>
			</div>
	</div>
	<div class="row">
			<div class="col-xs-6">
					<label class="col-xs-6" translate>UI_SUCURSAL</label>
				<bcs-combobox-base class="col-xs-6"
						tipo="'combobox-sucursal'"
						id-actual="pct.IdSucursal"
						id-defecto="'0'"
						filtros="pct.cmbbx.Sucursal.filtros"
						todos="'S'"
						seleccionado="pct.dataModal.SucursalObj">
					</bcs-combobox-base>
			</div>
			<div class="col-xs-6">
			  		<label class="col-xs-6" translate>UI_AGENTE</label>
					<bcs-combobox-base class="col-xs-6"
						tipo="'combobox-empleado'"
						id-actual="pct.IdAgente"
						id-defecto="'0'"
						filtros="pct.cmbbx.Agente.filtros"
						todos="'S'"
						seleccionado="pct.dataModal.AgenteObj">
					</bcs-combobox-base>
			</div>
			
	</div>
</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pct.solicitar()">
			 </bcs-button>

			 <bcs-button class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-secondary'"    			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_VER_DATOS' | translate"  
			 	bcs-habilitado="true" 
			 	bcs-clic="pct.visorCircular()">
			 </bcs-button>
			 
			 <bcs-button  class="col-xs-2 pull-right" id="frmPanelUAFDOF_btn_imprimir"
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="pct.imprimirCircular()">
			</bcs-button>
			 
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pct.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

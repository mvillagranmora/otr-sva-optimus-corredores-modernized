<div id="PanelNGC368PART" class="row" ng-controller="PanelNGC368PARTCtrl as p368PART">
<form  name="FormSolicitudNGC368Part" class="col-xs-12 form-horizontal">
	<div class="row">			
		<label class="col-xs-2" translate>UI_FECHA</label>
		<bcs-input-date 
			class="col-xs-6" 
			k-ng-model="filtros.FechaRegistros"
			bcs-requerido >
		</bcs-input-date>		
	</div>
	<div class="row">			
		<label class="col-xs-2" translate>UI_FONDO</label>
			<bcs-combobox-base class="col-xs-6"
	  			tipo="'combobox-fondo-ffmm'"
	  			id-actual="filtros.IdFondo"
				cascada-a="oFondo.filtros.IdFondo"
				cascada-valor="'IdFondo'"
	  			id-defecto="idDefecto"
	  			todos="'N'">
			</bcs-combobox-base>
	</div>
	<div class="row">			
		<label class="col-xs-2" translate>UI_SERIE</label>
		<bcs-combobox-base
			class="col-xs-6" 
			tipo="'combobox-instrumento-ffmm'"
			id-actual="filtros.IdSerie"
			id-defecto="idDefecto"
			seleccionado="datosFondo"
			filtros="oFondo.filtros"
			todos="'N'">
		</bcs-combobox-base>
	</div>
	<div class="row">
		<label class="col-xs-2" translate>UI_CLIENTE</label>
		<bcs-combobox-base 
			class="col-xs-6" 
			id="comboboxSocioNegocio"
			auto-cargar="'false'" 
			tipo="'combobox-socio-negocio'"
			id-Actual="filtros.IdCliente"
			seleccionado="filtros.seleccionadoCliente">
		</bcs-combobox-base>
	</div>
</form>		
	<div class="row bcs-panel-comandos">			
		<div class="col-xs-12" style="top: 10px">
			<bcs-button class="col-xs-2 pull-left" 
			bcs-tipo="'principal'"
				bcs-auto-desactivar="'false'" 
				bcs-texto="'UI_EMITIR' | translate" 
				bcs-habilitado="filtros.FechaRegistros"
			    bcs-clic="p368PART.solicitar()">
			 </bcs-button>
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'default'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="p368PART.clear()">
			</bcs-button>
		</div>
	</div> 
</div>

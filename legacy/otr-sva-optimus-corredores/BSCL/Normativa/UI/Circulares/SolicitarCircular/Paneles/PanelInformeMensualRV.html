<div id="PanelInformeMensualRV" class="row" ng-controller="PanelInformeMensualRVCtrl as pcn">
<form class="col-xs-12 form-horizontal">
	<div class="row">
	<label class="col-xs-4" translate>UI_INFORME_MENSUAL</label>
	</div>
	</br>
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pcn.FecInicio"
				
				></bcs-input-date>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_HASTA</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pcn.FecTermino"
				
				></bcs-input-date>
			</div>
	</div>

</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px">
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'principal'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="seleccionGrabar"
			    bcs-clic="pcn.solicitar()">
			 </bcs-button>
			<bcs-button class="col-xs-2 pull-left" bcs-tipo="'default'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pcn.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

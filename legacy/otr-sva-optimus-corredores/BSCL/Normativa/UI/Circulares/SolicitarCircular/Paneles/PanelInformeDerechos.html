<div id="PanelInformeDerecho" class="row" ng-controller="PanelInformeDerechoCtrl as pinformederecho">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-6" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-6" k-ng-model="pinformederecho.FecInicio"
				></bcs-input-date>
			</div>
			<div class="col-xs-6">
				<bcs-input-checkbox class="col-xs-1"
					ng-model="pinformederecho.envioBursatil"
					
					>
				</bcs-input-checkbox>
				<label class="col-xs-4" translate>UI_ENVIO_BURSATIL</label>
			</div>
	</div>
			

</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pinformederecho.solicitar()">
			 </bcs-button>

			 
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pinformederecho.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

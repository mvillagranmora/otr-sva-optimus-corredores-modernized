<div id="PanelCIR1804" class="row" ng-controller="PanelCIR1804Ctrl as CIR1804">
<form name="FormSolicitudCIR1804" class="filters-formulario">
     <form class="col-xs-12 form-horizontal">
    <div class="row">
            <div class="col-xs-12">
                <label class="col-xs-3" translate>Periodo</label>
                <bcs-input-date 
                    class="col-xs-9" 
                    seleccionado="CIR1804.IdPeriodo"
                    k-options="CIR1804.FecInicioOptions"
                    k-ng-model="CIR1804.FecInicio">
                 </bcs-input-date>
            </div>
    </div>
    </form>        
    <div class="row">           
        <label class="col-xs-3" translate>Cliente</label>
			<bcs-combobox-base 
                class="col-xs-9"
                tipo="'combobox-relacionado'"
                id-defecto="idDefecto"
                bcs-requerido 
                filtros="data.oConfiguracionApoderadoCliente.filtros"
                seleccionado="CIR1804.IdPersonaAGF">
            </bcs-combobox-base>
    </div>
</form>     

    <div class="row bcs-panel-comandos">            
        <div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
            <bcs-button class="col-xs-2 pull-right" id="CIR1804_btn_imprimir"
                bcs-tipo="'bcs-button-primary'"
                bcs-auto-desactivar="false"  
                bcs-texto="'UI_IMPRIMIR' | translate" 
                bcs-habilitado="'true'" 
                bcs-clic="imprimirCircular()">
             </bcs-button>
             
            <bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
                bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
                bcs-habilitado="true" bcs-clic="CIR1804.clear()">
            </bcs-button>
        </div>
    </div> 
</div>

<div id="PanelFATCAD" class="row" ng-controller="PanelFATCADCtrl as pfatcad">
<form class="col-xs-12 form-horizontal">
	<div class="row">
		<label class="col-xs-2" translate>UI_CLIENTE</label>
		<bcs-combobox-base 
			class="col-xs-10" 
			id="comboboxSocioNegocio"
			auto-cargar="'false'" 
			tipo="'combobox-socio-negocio'"
			configuracion="oConfiguracionSocioNegocio.configuracion"
			id-Actual="oConfiguracionSocioNegocio.idActual"
			seleccionado="oConfiguracionSocioNegocio.seleccionado"
			activado="activadoCli">
		</bcs-combobox-base>
	</div>		 
	<div class="row">
		<label class="col-xs-2" translate>UI_MONTO_MINIMO</label>
		<bcs-input-numero 
			class="col-xs-3"  
			id="MontoMin" 
		 	k-ng-model="filtros.MontoMin"
		 	Decimal="4">
		</bcs-input-numero>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_MONTO_MAXIMO</label>
		<bcs-input-numero 
			class="col-xs-4"  
			id="MontoMax" 
		 	k-ng-model="filtros.MontoMax" 
		 	Decimal="4">
		</bcs-input-numero>
	</div>	
	<br><hr>	
	<div class="row">			
		<label class="col-xs-2" translate>UI_FECHA_EJECUCION</label>
		<bcs-input-date 
			class="col-xs-3" 
			k-ng-model="filtros.FecEjec"
			k-ng-disabled="seleccionFecEjec">
		</bcs-input-date>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_ENROLAMIENTO</label>
		<bcs-input-date 
			class="col-xs-4"
			k-ng-model="filtros.FecEnrol"
			k-ng-disabled="seleccionFecEnrol">
		</bcs-input-date>		
	</div>
	<br><hr>
	<div class="row">
	   <label class="col-xs-2" translate>UI_CLASIFICACION_FATCA</label>
		<bcs-combobox-base
			class="col-xs-3"
			tipo="'combobox-clasificacion-fatca'"
			todos = "'S'"
			id-defecto='0'
			seleccionado="ClasificacionFatca.seleccionado">
		</bcs-combobox-base>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_INDICADOR_FATCA</label>
		<bcs-input-checkbox 
			class="col-xs-1"
			ng-model="filtros.indicadorFatca"
			ng-disabled="modoLectura">
		</bcs-input-checkbox>
	</div>

	<div class="row">
		<label class="col-xs-2" translate>UI_TIPO_PERSONA</label>
		<bcs-combobox-base 
			id="TipoPersona" 
			class="col-xs-3" 
			bcs-requerido
			tipo="'combobox-tipo-persona'"
			id-defecto = "'0'"
			seleccionado="TipoPersona.seleccionado"
			todos = "'S'"
			filtros="configData.filtroTipoPersona"> 
		</bcs-combobox-base>
		<label class="col-xs-2 col-xs-offset-1" translate>UI_SIN_INDICIOS</label>
		<bcs-input-checkbox 
			class="col-xs-1"
			ng-model="filtros.registroIndicios"
			ng-disabled="modoLectura">
		</bcs-input-checkbox>
	</div>
 
</form>		
	<div class="row bcs-panel-comandos">			
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right" 
				bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pfatcad.solicitar()">
			 </bcs-button>
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pfatcad.clear()">
			</bcs-button>
		</div>
	</div> 
	
</div>

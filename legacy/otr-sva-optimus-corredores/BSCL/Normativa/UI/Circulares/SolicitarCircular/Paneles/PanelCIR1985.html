<div id="PanelCir1985" class="row" ng-controller="PanelCir1985Ctrl as pcpcir1985">
  <form class="col-xs-12 form-horizontal">
	<div class="row">
		<div class="col-xs-12">
			<label class="col-xs-3" translate>UI_FECHA</label>
			<bcs-input-date 
			      class="col-xs-9" 
			      k-ng-model="pcpcir1985.FecInicio">
			</bcs-input-date>
		</div>			
	</div> 
	<div class="row">
	   <div class="col-xs-12">
			<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
			<bcs-combobox-base
			      class="col-xs-9" 
				  id="PanelCir1985Ctrl_UI_SOCIO_NEGOCIO"
				  ng-style="{'width' : data.oClientePortafolio.seleccionado.IdEstadoCliente !== 'ACT' && data.oClientePortafolio.seleccionado  ? '60%' : '75%'}"
				  auto-cargar="'false'"
				  carga-cliente-automatico="'S'"
				  tipo="data.oClientePortafolio.tipo"
				  seleccionado="data.oClientePortafolio.seleccionado"
				  filtros="filtrosPortafolio"
				  id-actual="filtros.IdPortafolio"
				  configuracion="data.oClientePortafolio.configuracion"> 
			</bcs-combobox-base>
	   </div>	
	</div>
  </form>		

  <div class="row bcs-panel-comandos">
    <div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
	   <bcs-button  class="col-xs-2 pull-right" id="frmAnexo4BCS_btn_imprimir"
				bcs-tipo="'bcs-button-primary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="pcpcir1985.imprimirCircular()">
	   </bcs-button>
			 
	   <bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pcpcir1985.clear()">
	   </bcs-button>			
    </div>
  </div>	
</div>

<div id="PanelINFOFWDEBOXGarantiasForward" class="row" ng-controller="PanelINFOFWDEBOXGarantiasForwardCtrl as gfEBox">
	<form id="formGarantiasForward" name="formGarantiasForward" class="col-xs-12 form-horizontal">
		<div class="row">
			<div class="col-xs-12">
				<label class="col-xs-3" translate>UI_FECHA_VIGENCIA</label>
				<bcs-input-date class="col-xs-4" 
					k-ng-model="gfEBox.FecInicio"
					ng-blur="fvEBox.cambiarFechaMin()" todo-dias="true"
					k-options="{max: gfEBox.fechaSistema}" 
					bcs-requerido>
				</bcs-input-date>
			</div>
		</div>
	</form>
	<div class="row bcs-panel-comandos">
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right"
				bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_EMITIR' | translate" bcs-habilitado="formGarantiasForward.$valid"
				bcs-clic="gfEBox.solicitar()"> </bcs-button>

			<bcs-button class="col-xs-2 pull-right"
				bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false"
				bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"
				bcs-clic="gfEBox.clear()"> </bcs-button>
		</div>
	</div>
</div>

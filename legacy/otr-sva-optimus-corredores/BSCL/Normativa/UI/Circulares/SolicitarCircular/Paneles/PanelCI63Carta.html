<div id="PanelCI63Carta" class="row" ng-controller="PanelCI63CartaCtrl as pct">
<form class="col-xs-12 form-horizontal">
	<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-6" translate>UI_FECHA</label>
				<bcs-input-date-month class="col-xs-6" k-options="pct.FecInicioOptions" k-ng-model="pct.FecInicio"
				></bcs-input-date-month>
			</div>
			<div class="col-xs-6" ng-show="false">
				<label class="col-xs-6" translate>UI_HASTA</label>
				<bcs-input-date-month class="col-xs-6" k-ng-model="pct.FecTermino"></bcs-input-date-month>
			</div>
	</div>
	<div class="row" ng-show="false">
			<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_OPCION</label>
					<div class="col-xs-8">
							 <select style="width:100%;" ng-model="pct.opcionFiltro" ng-disabled="pct.modoLectura">
						                <option value="RE">Relacionado</option>
						                <option value="IP">Información Privilegiada</option>
						                <option value="AM">Relacionado con Inf. Privilegiada</option>
				             </select>
					</div>
			</div>
			<div class="col-xs-6">
			  		<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-clasificacion-tipo-instrumento'"
						id-actual="pct.IdClasificacionTipoInstrumento"
						id-defecto="'0'"
						filtros="pct.cmbbx.ClasificacionTipoInstrumento.filtros"
						todos="'S'"
						seleccionado="pct.dataModal.ClasificacionTipoInstrumentoObj"
						cascada1-a="pct.cmbbx.TipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
			</div>
			
	</div>
</form>		
	<div class="row bcs-panel-comandos">
	
					
		<div class="col-xs-12" style="top: 10px; padding-bottom: 10px;">
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" ng-show="false"
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_EMITIR' | translate"
				bcs-habilitado="true"
			    bcs-clic="pct.solicitar()">
			 </bcs-button>

			 <bcs-button class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-secondary'" ng-show="false"			
			 	bcs-auto-desactivar="false" bcs-texto="'UI_VER_DATOS' | translate"  
			 	bcs-habilitado="true" 
			 	bcs-clic="pct.visorCircular()">
			 </bcs-button>
			 
			 <bcs-button  class="col-xs-2 pull-right" id="frmPanelCI63Carta_btn_imprimir"
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_IMPRIMIR' | translate" 
				bcs-habilitado="'true'" 
				bcs-clic="imprimirCircular()">
			</bcs-button>
			 
			<bcs-button class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="true" bcs-clic="pct.clear()">
			</bcs-button>
			
		</div>
	
	</div>
	
</div>

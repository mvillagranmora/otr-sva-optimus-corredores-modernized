<div id="PanelEdicionCircular" class="row" ng-controller="PanelEdicionCircularCtrl as cLim">
	<!-- INICIO FILTROS -->
	<form class="col-xs-12 form-horizontal">
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_NORMATIVA</label>
				<bcs-combobox-base class="col-xs-8"
								tipo = "'combobox-tipo-normativa-UI'"
								auto-cargar="true"
								configuracion ="cLim.oCircularConfiguracion.configuracion"
								seleccionado="cLim.oCircularConfiguracion.seleccionado"
								id-actual = "cLim.oCircularConfiguracion.idactual"
								filtros="cLim.oCircularConfiguracion.filtros"
								cascada1-a="cLim.cmbbx.TipoDocumento.filtros.IdNormativa"
								cascada1-valor="'IdNormativa'" 
								id-defecto="'0'"   
								todos="'N'"
								item-post-filtro="'1'"     
								memoria="'IdNormativa'">
				 </bcs-combobox-base >	
				
			</div>
			<div class="col-xs-6">
				<label class="col-xs-3" translate>UI_TIPO_DOCUMENTO</label>
				<bcs-combobox-base class="col-xs-8"
								tipo = "'combobox-tipo-documento-normativa-UI'"
								id-actual = "cLim.cmbbx.IdTipoDocumento"
								filtros="cLim.cmbbx.TipoDocumento.filtros"
								auto-cargar="true"
								item-post-filtro="'1'"
								id-defecto="'0'" 
								todos="'N'"
								seleccionado="cLim.cmbbx.IdTipoDocumentoObj"
								>
				</bcs-combobox-base >		
			</div>
		  	</div>
		  
		</div>

	</div>
	<hr>
	
	
		<div class="col-xs-12">
	  		<uib-tabset>
	  			<uib-tab id="TabCir1518" heading="{{'UI_CIR1518_CUADRATURA_SEMANAL_DE_CUSTODIA' | translate}}" select="cLim.fnTabCir1518()"  active="cLim.cmbbx.IdTipoDocumento=='CIR1518'"  ng-show="cLim.cmbbx.IdTipoDocumento=='CIR1518'">
					<div class="row">
						<div id="PanelCir1518"></div>
					</div>
				</uib-tab>	
					<uib-tab id="TabCir1720" heading="{{'UI_CIR1720_CUADRATURA_TRIMESTRAL_DE_CUSTODIA' | translate}}" select="cLim.fnTabCir1720()"  active="cLim.cmbbx.IdTipoDocumento=='CIR1720'"  ng-show="cLim.cmbbx.IdTipoDocumento=='CIR1720'">
					<div class="row">
						<div id="PanelCir1720" ></div>
					</div>
				</uib-tab>				
				<uib-tab id="TabCirNCG499" heading="{{'UI_NCGD499_CARTERA' | translate}}" select="cLim.fnTabCirNCG499()"  active="cLim.cmbbx.IdTipoDocumento=='CIRCMF'"  ng-show="cLim.cmbbx.IdTipoDocumento=='CIRCMF'">
			<div class="row">
				<div id="PanelCirNCG499" style="padding: 0px 0 10px 0;"></div>
			</div>
		</uib-tab>			
			</uib-tabset>
		</div>
	</form>
</div>

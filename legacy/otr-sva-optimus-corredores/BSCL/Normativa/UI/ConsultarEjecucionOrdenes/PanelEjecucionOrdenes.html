<div id="PanelEjecucionOrdenes" class="row" ng-controller="PanelEjecucionOrdenesCtrl as pct">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-10">

		  	<div class="row">
		  			<div class="col-xs-6">
		  			
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
				
					<bcs-combobox-base class="col-xs-8" 
						todos="'S'"
						auto-cargar			="'true'"
						id					="UI_CLASIFICACION"
						activado="'false'"
						configuracion		="pct.cmbbx.Clasificacion.configuracion" 
						tipo				="'combobox-clasificacion-tipo-instrumento'" 
						seleccionado		="pct.dataModal.ClasificacionObj"
						filtros				="pct.cmbbx.Clasificacion.filtros" 
						id-actual			="pct.IdClasificacion"
						cascada1-a			="pct.cmbbx.TipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada1-valor		="'IdClasificacionTipoInstrumento'"
						id-defecto="'RV'"  >
						
					</bcs-combobox-base>
					
					
				</div>
				<div class="col-xs-6">
			  		<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base class="col-xs-8"
						todos="'S'"
						id="UI_TIPO_INSTRUMENTO" 
						configuracion= "pct.cmbbx.TipoInstrumento.configuracion"
						auto-cargar="'false'"
						activado="'false'"
						tipo="'combobox-tipo-instrumento'"
						seleccionado="pct.dataModal.TipoInstrumentoObj"
						filtros="pct.cmbbx.TipoInstrumento.filtros"
						id-actual="pct.IdTipoInstrumento"
						cascada1-a="pct.cmbbx.Operacion.filtros.IdTipoInstrumento"
						cascada1-valor="'IdTipoInstrumento'"
						id-defecto="'ACN'"  >
					</bcs-combobox-base>
				</div>
		  
		  
		  	</div>
		  	<div class="row">
		  	
		  	<div class="col-xs-6">
			  		<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos
						class="col-xs-8"
						id="UI_INSTRUMENTO" 
						name="uInstrumento"
						datos-instrumento="pct.instrumento"
						buscar-instrumento="pct.buscarInstrumento"
						filtro-tipo-instrumento = "pct.IdTipoInstrumento"
						filtro-clasificacion="pct.IdClasificacion" 
						filtro-estado = "'ACT'"
						filtro-solo-vigentes = 'S'
						filtro-bolsa = $root.SesionBolsaDefectoSistema 
						muestra-precio = "'N'">
					</bcs-input-instrumentos>
				</div>
		  	
		  	
		  	<div class="col-xs-6">
			  		<label class="col-xs-4" translate>UI_CLIENTE</label>
					<bcs-combobox-base class="col-xs-8"
						tipo="'combobox-socio-negocio'"
						id-actual="pct.filtro.IdSocioDeNegocio"
						id-defecto="'0'"
						filtros="pct.cmbbx.SocioDeNegocio.filtros"
						todos="'N'"
						seleccionado="pct.SocioDeNegocioObj">
					</bcs-combobox-base>
			</div>	 
			
			
			
		  	</div>
		  	
		  	
		 <div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pct.FecInicio"
				></bcs-input-date>
			</div>
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_HASTA</label>
				<bcs-input-date class="col-xs-8" k-ng-model="pct.FecTermino"></bcs-input-date>
			</div>
		 </div>
		  	
		 <div class="row"> 	
		 <div class="col-xs-6">
  		<bcs-input-checkbox style="padding-left: 0px"
			id="UI_FECHA_EJECUCION" 
			ng-model="pct.PorFechaEjecucion">
		</bcs-input-checkbox>&nbsp;{{'UI_FECHA_EJECUCION' | translate}}
		<bcs-input-checkbox style="padding-left: 20px"
			id="UI_FECHA_INGRESO" 
			ng-model="pct.PorFechaIngreso">
		</bcs-input-checkbox>&nbsp;{{'UI_FECHA_INGRESO' | translate}}
		</div>
		</div>
		  	
		</div>
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'" bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="pct.fn.buscar()"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true" bcs-clic="pct.fn.limpiar()"></bcs-button>
			</div>
	  	</div>
	</div>
		<!-- configuracion="pct.grilla.DOF" -->
		<!--configuracion="pct.grillaCong" -->
	<div class="row">
		<bcs-grid
			id="gridEjecucionOrdenes"
			
			configuracion="pct.grilla.EjecucionOrdenes"
			
			seleccionado="pct.grilla.EjecucionOrdenesSel"
			fn-exportar-excel="excelEjecucionOrdenes"
			api="gridApi">
		</bcs-grid>
	</div>

	<div class="row">
		<div class="col-xs-12" style="top:10px">
			
					<bcs-menu 
				class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'"
				bcs-habilitado="'true'" 
				bcs-texto="'UI_OPCIONES' | translate">		            
				<li ng-click="excelEjecucionOrdenes('EjecucionOrdenes')">	  	{{'UI_EXPORTAR_EXCEL' 		| translate}}</li>
			</bcs-menu>	
		</div>
		
	</div>
	
	
	
	
</div>

<div id="ReporteSaldoCuentasCambio" class="col-xs-12" ng-controller="ReporteSaldoCuentasCambioCtrl">
	<div class="row bcs-cuerpo">
		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-4"  translate>UI_ESQUEMA</label> 
						<input class="col-xs-8" style="width: 65.66666667%;" id="esquemaSAL" />
					</div>
					<div class="col-xs-6">
						<label class="col-xs-4" translate>UI_PERIODO</label> 
						<input class="col-xs-8" style="width: 65.66666667%;" id="versionSAL" />
					</div>
				</div>
			</div>
			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"
						bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"
						bcs-habilitado="true"
						bcs-clic="buscarReporteSaldoCuentasCambio(apiGridReporteSaldoCuentasCambio, filtros)">
					</bcs-button>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-4" translate>UI_FORMATO</label>
						<bcs-input-checkbox class="col-xs-1" id="UI_TXT" ng-model="chkFormatoTXT" k-ng-disabled=""></bcs-input-checkbox>
						<label class="col-xs-3" translate>UI_TXT</label>
						<bcs-input-checkbox class="col-xs-1" id="UI_CSV" ng-model="chkFormatoCSV" k-ng-disabled=""></bcs-input-checkbox>
						<label class="col-xs-3" translate>UI_CSV</label>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<bcs-grid 
				id="gridReporteSaldos"
			 	configuracion="defaultOptions"
				api = "apiGridReporteSaldoCuentasCambio"
				seleccionado="datos.kNgModel">		
			</bcs-grid>
		</div>
	</div>
	<div class="row bcs-panel-buttons">
		<div class=col-xs-112>
			<bcs-button class=col-xs-2 bcs-tipo="'bcs-button-primary'" bcs-habilitado="'true'" bcs-texto="'UI_PROCESAR' | translate" ng-click="procesarPeriodo()"></bcs-button>
			<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-habilitado="generarHabilitado" bcs-texto="'UI_GENERAR_REPORTE' | translate" ng-click="generarArchivo()"> </bcs-button>
		</div>
	</div>
</div>

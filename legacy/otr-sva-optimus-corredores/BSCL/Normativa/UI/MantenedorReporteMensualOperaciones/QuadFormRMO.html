<div class="row" ng-controller="QuadControllerRMO">
	<div class="row">
    	<div class="row">
        	<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
        	<bcs-input-date class="col-xs-8" k-ng-model="fechaDesde" k-options="dateOptions" k-ng-disabled="'true'"></bcs-input-date>
    	</div>
    	<div class="row">
        	<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
        	<bcs-input-date class="col-xs-8" k-ng-model="fechaHasta" k-options="dateOptions" k-ng-disabled="'true'"></bcs-input-date>
    	</div>
	</div>
	<hr>
	<div class="row">
    	<div class="row alignButtonsToRight">
        	<bcs-button class="col-xs-4"
	            bcs-tipo="'bcs-button-input-form'"
	            bcs-auto-desactivar="'false'"
	            bcs-texto="'UI_VALIDAR' | translate"
	            bcs-habilitado="botonValidarHabilitado"
	            bcs-clic="validarRMO()">
        	</bcs-button>
    	</div>
    </div>
</div>

<div class="row" ng-controller="LoadControllerRMO">
	<div class="row">
	    <div class="row">
	        <div class="col-xs-4">
	            <label>Fuente de Datos</label>
	        </div>
	        <div class="col-xs-4">
	            <label><input type="radio" ng-model="fuenteDatos" ng-disabled = "deshabilitaFuenteDatos" value="EXTERNA" />Externa</label>
	            <label><input type="radio" ng-model="fuenteDatos" value="INICIAL" />Sistema</label>
	        </div>
	    </div>
	    <div class="row">
	        <label class="col-xs-4" translate>UI_FECHA_DESDE</label>
	        <bcs-input-date class="col-xs-8" k-ng-model="fechaDesde" k-ng-disabled="'true'"></bcs-input-date>
	    </div>
	    <div class="row">
	        <label class="col-xs-4" translate>UI_FECHA_HASTA</label>
	        <bcs-input-date class="col-xs-8" k-ng-model="fechaHasta" k-ng-disabled="'true'"></bcs-input-date>
	    </div>  
	    <div class="row">
	        <div class="col-xs-12">
	            <input type="file" class="col-xs-5 custom-file-input-form" onchange="angular.element(this).scope().fileChanged(this)" file-model="loadFile" ng-disabled="fuenteDatos==='INICIAL'" style="display:inline"/>
					<div class="col-xs-7" style="height: 100%;
					position: relative;
					height: 30px;">
						<span id="nombreArchivo" style="
						font-weight: bold;
						font-size: 12px;
						position: absolute;
						top: 50%; 
						left: 50%; 
						width: 100%;
						transform: translate(-50%, -50%); 
						padding-left: 14px;
					">{{nombreArchivo}}</span>
					</div>
	        </div>
	    </div>
	</div>
	<hr>
	<div class="row">
	    <div class="row alignButtonsToRight">
	        <bcs-button class="col-xs-4"
	            bcs-tipo="'bcs-button-input-form'"
	            bcs-auto-desactivar="'false'"
	            bcs-texto="'UI_CARGAR' | translate"
	            bcs-habilitado="botonCargarHabilitado"
	            bcs-clic="cargarRMO()">
	        </bcs-button>
	    </div>
	</div>
</div>

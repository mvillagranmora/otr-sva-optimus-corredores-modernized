<div class="row" ng-controller="GenControllerRMO">
	<div class="row">
		<div class="row">
	        <label class="col-xs-4" translate>UI_FECHA_DESDE</label>
	        <bcs-input-date class="col-xs-8" k-ng-model="fechaDesde" k-options="dateOptions" k-ng-disabled="'true'"></bcs-input-date>
	    </div>
	    <div class="row">
	        <label class="col-xs-4" translate>UI_FECHA_HASTA</label>
	        <bcs-input-date class="col-xs-8" k-ng-model="fechaHasta" k-options="dateOptions" k-ng-disabled="'true'"></bcs-input-date>
	    </div>
	    <div class="row">
			<label class="col-xs-4" translate>UI_FORMATO</label>
			<div class="col-xs-8">
				<bcs-input-checkbox class="col-xs-2" id="UI_TXT" ng-model="chkFormatoTXT"></bcs-input-checkbox>
				<label class="col-xs-2" translate>UI_TXT</label>
				<bcs-input-checkbox class="col-xs-2" id="UI_CSV" ng-model="chkFormatoCSV"></bcs-input-checkbox>
				<label class="col-xs-2" translate>UI_CSV</label>
			</div>
		</div>
	</div>
	<div class="row">
	    <div class="row">
	        <bcs-button class="col-xs-6"
	            bcs-tipo="'principal'"
	            bcs-auto-desactivar="'false'"
	            bcs-texto="'UI_GENERAR' | translate"
	            bcs-habilitado="botonGenerarHabilitado"
	            bcs-clic="generarRMO()">
	        </bcs-button>
	    </div>
	</div>
</div>

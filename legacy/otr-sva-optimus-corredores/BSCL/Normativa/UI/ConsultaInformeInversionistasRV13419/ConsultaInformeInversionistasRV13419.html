<div ng-controller="ConsultaInformeInversionistasRV13419Ctrl as cInvRV">
	<form name="formConsultarInvRV13491" class="filters-formulario">
		<div class="row bcs_titulo">
			<div class="col-xs-12">
				<span>{{UI_DETALLE_CARGA_INTERFACES|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			
			<div class="row">
				<label class="col-xs-1" translate>UI_FECHA_DESDE</label>
				<bcs-input-date class="col-xs-2" k-ng-model="cInvRV.filtro.FechaDesde" k-options="cInvRV.options.oConfiguracionFechaDesde" todo-dias="true"></bcs-input-date>
				
				<label class="col-xs-1" translate>UI_FECHA_HASTA</label>
				<bcs-input-date class="col-xs-2" k-ng-model="cInvRV.filtro.FechaHasta"  k-options="cInvRV.options.oConfiguracionFechaHasta" todo-dias="true"></bcs-input-date>
				<bcs-button class="col-xs-offset-4 col-xs-2"
					bcs-tipo="'bcs-button-search'"
					bcs-habilitado="'true'" 
					bcs-auto-desactivar="false"
					bcs-texto="'UI_BUSCAR_REGISTROS' | translate" 
					bcs-clic="cInvRV.buscarRegistros()">
				</bcs-button>
			</div>
			<div class="row">
				<bcs-grid 
					id="grid-InvRV-13491"
					seleccionado="cInvRV.InversionistaRVSeleccionado" 
					configuracion="cInvRV.gridInversionistasRV" 
				    fn-exportar-excel="exportarExcel"
					>
				</bcs-grid>
			</div>	
			
			<div class="row">
				<bcs-button class="col-xs-3 pull-right" 
					bcs-tipo="'bcs-button-primary'"
					bcs-habilitado="seRealizoBusqueda" 
					bcs-auto-desactivar="'false'"
					bcs-texto="'UI_INFORME_MENSUAL_INVERSIONISTAS_RV' | translate" 
					bcs-clic="generarInformeInversionistasRV13419()">
				>
				
				</bcs-button>
			</div>
		</div>
	</form>
</div>

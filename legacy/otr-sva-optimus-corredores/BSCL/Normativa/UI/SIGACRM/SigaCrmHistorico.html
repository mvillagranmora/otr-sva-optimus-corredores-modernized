<div id="SigaCrmHistorico" 	ng-controller='SigaCrmHistoricoCtrl'>
    <div class="bcs-cuerpo">
    	<div class="row">
			<form name="formCertificados" class="col-xs-12 form-horizontal">
	            <div class="row"> 
					<div class="col-xs-12">
						<label class="col-xs-3" translate>UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base class="col-xs-9"
							id="UI_SOCIO_NEGOCIO" 
							carga-cliente-automatico="'S'"
							bcs-requerido="'true'" 
							auto-cargar="'false'"
							tipo="'combobox-cliente-portafolio'"
							seleccionado="data.oClientePortafolio.seleccionado"
							filtros = "filtrosPortafolio"
			    			id-actual="data.oClientePortafolio.idActual"
			    			id-defecto="data.oClientePortafolio.idDefecto"
							configuracion="data.oClientePortafolio.configuracion"
							activado='true'> 
						</bcs-combobox-base>
					</div>
				</div>
			</form>
		</div>
		<hr>
		<div class="row bcs-panel-comandos alignButtonsToRight">
			<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-habilitado="data.oClientePortafolio.seleccionado" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="data.obtenerToken()"></bcs-button>
			<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'" bcs-clic="data.limpiar()"></bcs-button>				
		</div>
	</div>	
</div>

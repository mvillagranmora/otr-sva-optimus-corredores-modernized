<div class="row" ng-controller="ModificarReporteAPVCtrl">
	<form name="formTransaccion" class="bcs-panel-formulario">
		<div class="row">
			<label class="col-xs-4" translate>UI_DOCUMENTO_IDENTIDAD</label>
			<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
				ng-model="data.DocumentoIdentidad"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_NOMBRE_CLIENTE</label>
			<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
				ng-model="data.NombreCliente"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_TIPO_APV</label>
			<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
				ng-model="data.NombreRegimenTributario"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_TIPO_PRODUCTO</label>
			<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
				ng-model="data.TipoProducto"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_PLAN_AHORRO</label>
			<bcs-input-texto class="col-xs-8" k-ng-disabled="'true'"
				ng-model="data.NombrePlanTipoInversion"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_ACUMULADO</label>
			<bcs-input-monetario class="col-xs-8" k-ng-disabled="'true'"
				simbolo="data.MontoSimbolo" decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoAcumulado"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_REGIMEN_TRIBUTARIO_A</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoRegimenTributarioA"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_REGIMEN_TRIBUTARIO_B</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoRegimenTributarioB"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_BONIFICACION_ESTATAL</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoBonificacionEstatal"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_APVC_EMPLEADOR</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoAPVCEmpleador"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_APVC_TRABAJADOR_A</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoAPVCTrabajadorA"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_APVC_TRABAJADOR_B</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoAPVCTrabajadorB"></bcs-input-monetario>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_SALDO_APVC_BONIFICACION_ESTATAL</label>
			<bcs-input-monetario class="col-xs-8" simbolo="data.MontoSimbolo"
				decimales="data.MontoDecimales"
				ng-model="dataForm.SaldoAPVCBonificacionEstatal"></bcs-input-monetario>
		</div>
	</form>

	<hr>

	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="col-xs-4" bcs-tipo="'bcs-button-primary'"
			bcs-texto="'UI_GRABAR' | translate" bcs-clic="modificarReporteAPV()"
			bcs-habilitado="puedeGrabar"></bcs-button>
	</div>
</div>

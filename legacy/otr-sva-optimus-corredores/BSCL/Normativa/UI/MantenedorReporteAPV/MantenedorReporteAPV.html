<div id="MantenedorReporteAPV" class="row" ng-controller='MantenedorReporteAPVCtrl'>
	<div class="row bcs-cuerpo" ng-form="frmMantenedorReporteAPV">
		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-6">
						<label class="col-xs-2" translate>UI_FECHA_CIERRE</label>
						<bcs-input-date class="col-xs-4"
							k-ng-model="filtros.kngFechaSistema"
							ng-blur="filtros.cambiarFechaMin()" 
							todo-dias="true"
							k-options="{max: SesionFechaSistema}" 
							bcs-requerido>
						</bcs-input-date>
					</div>
				</div>
			</div>

			<div class="col-xs-2">
				<div class="row">
					<bcs-button class="col-xs-12" id="frmMantenedorReporteAPV_btnBuscar"
						bcs-tipo="'bcs-button-search'" 
						bcs-auto-desactivar="'false'"
						bcs-texto="'UI_BUSCAR' | translate"
						bcs-habilitado = "frmMantenedorReporteAPV.$valid" 
						bcs-clic="buscar()">
					</bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" id="frmMantenedorReporteAPV_btnLimpiar"
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="'false'"
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="'true'"
						bcs-clic="limpiar()">
					</bcs-button>
				</div>
			</div>
		</div>

		<div class="row">
			<bcs-grid id="frmMantenedorReporteAPV_grid_userSettings"
				configuracion="confBasicaReporteAPV"
				seleccionado="seleccionReporteAPV" 
				fn-exportar-excel="exportarExcel">
			</bcs-grid>
		</div>

		<div class="row bcs-panel-comandos">
			<bcs-button class="col-xs-2" id="frmMantenedorReporteAPV_btnCargar"
				bcs-tipo="'bcs-button-primary'" 
				bcs-auto-desactivar="false"
				bcs-habilitado = "frmMantenedorReporteAPV.$valid" 
				bcs-texto="'UI_CARGAR' | translate" 
				bcs-habilitado="true"
				bcs-clic="cargar()">
			</bcs-button>

			<bcs-button class="col-xs-2" id="frmMantenedorReporteAPV_btnEditar"
				bcs-tipo="'bcs-button-secondary'" 
				bcs-auto-desactivar="false"
				bcs-texto="'UI_MODIFICAR' | translate"
				bcs-habilitado="seleccionReporteAPV && (seleccionReporteAPV.length && seleccionReporteAPV.length === 1)"
				bcs-clic="modificarReporteAPV()"
				bcs-habilitado="seleccionReporteAPV">
			</bcs-button>			
			
			<bcs-button  class="col-xs-2" id="frmMantenedorReporteAPV_btnEliminar"
				bcs-tipo="'bcs-button-secondary'"  
				bcs-auto-desactivar="false"  
				bcs-texto="'UI_ELIMINAR' | translate" 
				bcs-clic="eliminarRegistroAPV()"
				bcs-habilitado="seleccionReporteAPV && seleccionReporteAPV.length > 0">
			</bcs-button>			
				
			<bcs-button  class="col-xs-2" id="frmMantenedorReporteAPV_btnGenerar"
				bcs-tipo="'bcs-button-secondary'"  
				bcs-auto-desactivar="false"  
				bcs-clic="generarReporteAPV()"
				bcs-texto="'UI_GENERAR_REPORTE' | translate" 
				bcs-habilitado = "frmMantenedorReporteAPV.$valid">
			</bcs-button>
		</div>
	</div>
</div>

<div ng-controller="ExportarLibroCtrl">	
	<div class="row bcs-cuerpo">
		<form name="formExportarLibro" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-date class="col-xs-8" bcs-requerido k-ng-model="fecha" ></bcs-input-date>	
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
				<bcs-combobox-base 
			     	class="col-xs-8"
					tipo="'combobox-libro-orden'"
					id-defecto="libroDefecto"
					item-post-filtro = "'1'"
					seleccionado="filtros.LibroOrdenes">
				</bcs-combobox-base>
			</div>
			<div class="row"><br/></div>
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button class="col-xs-4" bcs-habilitado="formExportarLibro" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" 
			bcs-texto="'UI_EXPORTAR' | translate" bcs-clic="exportar()"></bcs-button>
		<bcs-button class="col-xs-4" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>
</div>

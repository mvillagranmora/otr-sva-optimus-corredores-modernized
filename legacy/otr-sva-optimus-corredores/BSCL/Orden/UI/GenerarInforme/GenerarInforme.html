<div ng-controller="GenerarInformeCtrl">	
	<div class="row bcs-cuerpo">
		<form name="formGenerarInforme" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_INFORME</label>
				<bcs-input-texto k-ng-disabled = "'true'" class="col-xs-8" ng-model="nombreInforme"></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA_CONSULTA</label>
				<bcs-input-date class="col-xs-8" bcs-requerido k-ng-model="fecha" ></bcs-input-date>	
			</div>
		</form>
	</div>
	<br/>
	<hr/>
	<div class="row alignButtonsToRight">
		<bcs-button class="col-xs-3" bcs-habilitado="formGenerarInforme.$valid" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate" bcs-clic="generar()"></bcs-button>
		<bcs-button class="col-xs-3" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>
</div>

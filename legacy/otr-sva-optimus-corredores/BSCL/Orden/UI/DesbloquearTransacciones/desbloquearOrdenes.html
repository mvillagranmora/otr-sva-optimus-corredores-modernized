<<div class="row" ng-controller='DesbloquearOrdenesCtrl' bcs-enter="buscarOrdenes(apiGridOrdenesBloqueadas,filtros)" tabindex="1">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-11">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base
						tipo="'combobox-clasificacion-tipo-instrumento'"
						class="col-xs-8"
						id-defecto = "'RV'"
						seleccionado="filtros.clasificacionTipoInstrumento"
						id-actual="filtros.IdClasificacionTipoInstrumento"
						cascada-a="datos.oConfiguracionTipoInstrumento.filtros.IdClasificacionTipoInstrumento"
						cascada-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base
						class="col-xs-8"
						tipo="'combobox-tipo-instrumento'"
						todos = "'S'"
						item-post-filtro = "'1'"
						filtros="datos.oConfiguracionTipoInstrumento.filtros"
						id-actual="filtros.IdTipoInstrumento"
						seleccionado="filtros.tipoInstrumento"
						cascada-a="datos.oConfiguracionTipoOperacion.filtros.IdTipoInstrumento"
						cascada-valor="'IdTipoInstrumento'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos class="col-xs-8"
						buscar-instrumentos="filtros.buscarInstrumento"
						datos-instrumento="filtros.instrumento"
						filtro-clasificacion="filtros.IdClasificacionTipoInstrumento"
						filtro-tipo-instrumento="filtros.IdTipoInstrumento">
					</bcs-input-instrumentos>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>					
					<bcs-combobox-base
							class="col-xs-8"
							todos = "'S'"
							item-post-filtro = "'1'"
							tipo="'combobox-operacion'"
							id-actual="filtros.AccionTipoOperacion"
							filtros="datos.oConfiguracionTipoOperacion.filtros"
							seleccionado="filtros.tipoOperacion">
						</bcs-combobox-base>
					
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_DESDE</label>
					<bcs-input-date class="col-xs-8" k-ng-model="filtros.fechaDesde"></bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_HASTA</label>
					<bcs-input-date class="col-xs-8" k-ng-model="filtros.fechaHasta"></bcs-input-date>
				</div>
			</div>
		</div>
		<!-- FIN FILTROS -->
		<!-- INICIO BOTONES -->
		<div class="col-xs-1">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarOrdenes(apiGridOrdenesBloqueadas,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
		</div>
	</div>
	<!-- FIN BOTONES -->
	<div class="row">
		<bcs-grid id="grid-ordenes-bloqueadas"
			fn-doble-click="abrirDetalle(datos.kNgModel)"
			api = "apiGridOrdenesBloqueadas"
			seleccionado="datos.kNgModel"
			fn-exportar-excel = "exportarExcel" 
			configuracion="defaultOptionsNew">
		</bcs-grid>
	</div>
	
	<!-- INICIO PANEL COMANDOS -->

	<div class="row">
		<bcs-button bcs-tipo="'bcs-button-primary'" class="col-xs-2" bcs-auto-desactivar="'false'" bcs-texto="'UI_DESBLOQUEAR_ORDEN' | translate" 
			bcs-habilitado="'true'" bcs-clic="desbloquearOrdenesSistema(datos.kNgModel)"></bcs-button>
		<div class="col-xs-7"></div>
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
</div>

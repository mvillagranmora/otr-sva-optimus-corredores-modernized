<div ng-controller="VentanaResultadoCtrl">
	<div class="row">
		<bcs-grid
			configuracion = "confGrid">
			<div bcs-grid-detail ng-non-bindable>
				<bcs-grid configuracion = "confDetalle(dataItem)">
				</bcs-grid>
			</div>
		</bcs-grid>
	</div>
	<div class="row alignButtonsToRight">
		<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
	</div>
</div>

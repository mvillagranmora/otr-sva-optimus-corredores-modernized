<div class="row" ng-controller='SelectorComprobantesCtrl' bcs-enter="buscar()" tabindex="1">
	<div class="row">
		<div class="col-xs-11">
			<div class="row">
				<div class="col-xs-3">
					<label class="col-xs-5" translate>UI_FECHA_COMPROBANTE</label>
					<bcs-input-date class="col-xs-6" k-ng-model="fechaComprobante"></bcs-input-texto>
				</div>
				
			</div>
		</div>
		<div class="col-xs-1">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscar()"></bcs-button>
			</div>
	  	</div>
  	</div>
	<div class="row">
		<div class="row">
			<bcs-grid 
				id="gridComprobantes"
				api="apiGrid"
				fn-doble-click = "aceptar()"
				seleccionado ="seleccionado"
				configuracion="configuracion">
				
				<div bcs-grid-detail ng-non-bindable>	
				   <div style="width: 830px;" >
				 	   <bcs-grid 
						  configuracion = "configuracionDetalle(dataItem)"
						  seleccionado = "seleccionComprobanteDetalle">
					   </bcs-grid>	
				   </div>
				 </div>
				
				
				
			</bcs-grid>
		</div>
	</div>		
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-2 pull-right" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
		<bcs-button  class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'"  bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

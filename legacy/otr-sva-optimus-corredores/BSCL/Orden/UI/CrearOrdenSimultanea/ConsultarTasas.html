
<div class="row" ng-controller="ConsultarTasasCtrl">
	<h4>{{tipo}}</h4>
	<div class="row">
		<table class="col-xs-12 table table-condensed" >
	    	<thead>
		        <tr >
		          <!-- <th>Plazo/Monto</th>-->
		          <th ng-repeat="monto in montos">{{monto.title}}</th>
		        </tr>
	      	</thead>
	      	<tbody >
	        	<tr ng-repeat="plazo in plazos" >
		        	<!-- <td>{{plazo.PlazoHasta}}</td>-->
		        	<td ng-repeat="monto in montos">{{plazo[monto.field]| kformat:(monto.field!=='PlazoHasta'?'p':'')}}</td>
		        	
		          <!-- <td ng-repeat="tasa in plazo.tasas track by $index"">{{tasa | kformat:'p'}}</td>-->
	        	</tr>
	      	</tbody>
    	</table>
	</div>
	<br/>
	<div class="row">
		<div class="col-xs-2">
			<bcs-button bcs-tipo="'default'"  bcs-auto-desactivar="false" bcs-texto="'Cerrar'" bcs-habilitado="'true'"  bcs-clic="cerrar()"></bcs-button>
		</div>
	</div>
</div>

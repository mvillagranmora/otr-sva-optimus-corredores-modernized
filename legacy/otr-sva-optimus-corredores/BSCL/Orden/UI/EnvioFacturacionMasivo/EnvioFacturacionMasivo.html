<div ng-controller="EnvioFacturacionMasivoCtrl">
	<div>
		<form name="EnvioFacturacionMasivoForm">
			<div class="row">
				<div class="row">
					<label class="col-xs-2" translate>UI_FECHA</label>
					<bcs-input-date class="col-xs-3" 
						k-ng-disabled="!inputsHabilitados"
						bcs-requerido
						k-ng-model = "datos.fechaProceso">
					</bcs-input-date>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_HORA_HASTA</label>
					<bcs-input-time class="col-xs-3"
						k-ng-disabled="!inputsHabilitados"
						bcs-requerido
						k-ng-model = "datos.horaHasta">
					</bcs-input-time>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base class="col-xs-3"
						activado="inputsHabilitados"
						todos = "'S'"
						bcs-requerido
						item-post-filtro = "'1'"
						id-actual = "datos.IdClasificacionTipoInstrumento"
						tipo="'combobox-clasificacion-tipo-instrumento'" 
						filtros="filtros.clasificacionTipoInstrumento" 
						cascada1-a="filtros.tipoInstrumento.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base class="col-xs-3" 
						activado="inputsHabilitados"
						todos = "'S'"
						bcs-requerido
						item-post-filtro = "'1'"
						id-actual = "datos.IdTipoInstrumento"
						tipo="'combobox-tipo-instrumento'" 
						filtros="filtros.tipoInstrumento">
					</bcs-combobox-base >
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_OPERACION</label>
					<bcs-combobox-base class="col-xs-3" 
						activado="inputsHabilitados"
						todos = "'S'"
						bcs-requerido
						item-post-filtro = "'1'"
						id-actual = "datos.AccionOperacion"
						tipo="'combobox-operacion'"
						filtros="filtros.operacion"
						cascada1-a="filtros.condicionDeLiquidacion.AccionTipoOperacion"
						cascada1-valor="'AccionOperacion'">
					</bcs-combobox-base>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_CONDICION_LIQUIDACION</label>
					<bcs-combobox-base class="col-xs-3"
						activado="inputsHabilitados"
						todos = "'S'"
						bcs-requerido
						item-post-filtro = "'1'"
						id-actual="datos.IdCondicionDeLiquidacion"
						tipo="'combobox-condicion-liquidacion'"
						filtros = "filtros.condicionDeLiquidacion">
					</bcs-combobox-base>
				</div>
				
				<div class="row">
					<label class="col-xs-2" translate>UI_LIBRO_ORDENES</label>
					<bcs-combobox-base 
				     	class="col-xs-3"
						activado="inputsHabilitados"
				     	bcs-requerido
				     	item-post-filtro = "'1'"
						filtros = "filtros.libroOrdenes"
				     	tipo="'combobox-libro-orden'"
						id-actual="datos.IdLibroOrdenes"
						todos="'S'">
					</bcs-combobox-base>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_BOLSA</label>
					<bcs-combobox-base class="col-xs-3"
						activado="inputsHabilitados"
						todos = "'S'"
						item-post-filtro = "'1'"
						filtros = "filtros.bolsa"
						bcs-requerido
						id-actual = "datos.IdBolsa"
						tipo="'combobox-bolsa'">
					 </bcs-combobox-base >
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_SECUENCIA_ORDEN</label>
					<bcs-input-numero 
						class="col-xs-3" 
						k-ng-disabled="!inputsHabilitados"
						id="EnvioFacturacionMasivo_secuencia"
						decimales = "'0'"
				     	k-ng-model="datos.IdOrden">
					</bcs-input-numero>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_FOLIO_TRANSACCION</label>
					<bcs-input-numero 
						class="col-xs-3" 
						k-ng-disabled="!inputsHabilitados"
						id="EnvioFacturacionMasivo_folio"
						decimales = "'0'"
				     	k-ng-model="datos.FolioTransaccion">
					</bcs-input-numero>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_ID_ASIGNACION_MASIVA</label>
					<bcs-input-texto
						class="col-xs-3" 
						id="EnvioFacturacionMasivo_idAsignacionMasiva"
						ng-model="datos.IdAsignacionMasiva"
						k-ng-model="datos.IdAsignacionMasiva"
						>
					</bcs-input-texto>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos 
						class="col-xs-3" 
						id="UI_INSTRUMENTO" 
						name="Instrumento"
						datos-instrumento="datos.Instrumento"
						filtro-estado = "'ACT'"	
					>
					</bcs-input-instrumentos>
				</div>
				<div class="row">
					<label class="col-xs-2" translate>UI_CANAL</label>
					<bcs-combobox-base class="col-xs-3"
						activado="inputsHabilitados"
						todos = "'S'"
						bcs-requerido
						item-post-filtro = "'1'"
						id-actual="datos.IdTipoCanalIngreso"
						tipo="'combobox-tipo-canal-ingreso'"
						filtros = "filtros.filtrosCanalIngreso">
					</bcs-combobox-base>
					<label class="col-xs-2 col-xs-offset-2" translate>UI_MARCA_ASIGNACION</label>
					<bcs-input-texto
						class="col-xs-3" 
						id="EnvioFacturacionMasivo_MarcaAsignacion"
						ng-model="datos.MarcaAsignacion"
						k-ng-model="datos.MarcaAsignacion"
						maxlength="25"
						>
					</bcs-input-texto>
				</div>
			</div>
		</form>
	</div>
	<div class="row">
		<bcs-button id="EnvioFacturacionMasivo_aceptar" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
		<bcs-button id="EnvioFacturacionMasivo_informacion"class="col-xs-2 col-xs-offset-8" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="'false'" bcs-texto="'UI_INFORMACION' | translate" bcs-habilitado="'true'" bcs-clic="verElementos()"></bcs-button>
	</div>
	
</div>

<div ng-controller="ModificarOrdenRFCtrl">	
	<div class="row bcs-cuerpo">
		<form name="formModificarOrdenRF">
			<div class="row">
				<label class="col-xs-4" translate>UI_CANTIDAD</label>
				<bcs-input-numero
					id 				= "formModificarOrdenRF_Cantidad" 
					decimales 		= "0"
					class			= "col-xs-8" 
					bcs-requerido	= "true"
					k-ng-model		= "cantidad">
				</bcs-input-numero> 
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_FORMA_NEGOCIACION</label>
				<bcs-combobox-base
					id 				= "formModificarOrdenRF_comboSistemaBursatil" 
					class			= "col-xs-8"
					bcs-requerido	= "true"
					tipo			= "'combobox-sistema-bursatil'"
					todos 			= "'N'"
					id-actual		= "idSistemaBursatil" 
					id-defecto		= "idSistemaBursatilDef"
					seleccionado	= "sistemaBursatil" 
					filtros			= "filtroSistemaBursatil">
				</bcs-combobox-base>
			</div>
			<div class="row"><br/></div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button 
			class="col-xs-2" 
			bcs-habilitado="formModificarOrdenRF.$valid" 
			bcs-tipo="'principal'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-clic="aceptar()">
		</bcs-button>
		<bcs-button 
			class="col-xs-2" 
			bcs-habilitado="'true'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-clic="cancelar()">
		</bcs-button>
	</div>
</div>

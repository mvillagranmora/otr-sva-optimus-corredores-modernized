<div ng-controller="AsignacionGrupoCtrl">
	
	<div class="row">
		<div class="col-xs-6">
			<label class="col-xs-4" translate>UI_MARCA_NEGOCIACION</label>
			<bcs-input-texto class="col-xs-8" ng-model="form.MarcaNegociacion" k-ng-disabled="true"></bcs-input-texto>
		</div>	
	</div>
	<div class="row">
		<div class="col-xs-6">
			<label class="col-xs-4" translate>UI_GRUPO</label>
			<bcs-combobox-base
				class="col-xs-8"
				filtros = "form.filtrosGrupo"
				id-defecto = "form.idGrupoDefecto"
				id-actual = "form.idGrupoActual"
				tipo="'combobox-grupos-clientes'">
			</bcs-combobox-base>
		</div>
		<div class="col-xs-6">
			<bcs-button bcs-tipo="'bcs-button-input-form'" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_CARGAR' | translate" bcs-habilitado="'true'" bcs-clic="form.clicCargarGrupo(form.idGrupoActual)"></bcs-button>
			<bcs-button bcs-tipo="'bcs-button-input-form'" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-habilitado="'true'" bcs-clic="form.clicGuardarGrupo(form.idGrupoActual)"></bcs-button>
			<bcs-button bcs-tipo="'bcs-button-input-form'" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_NUEVO' | translate" bcs-habilitado="apiGrid.dataSource.data().length" bcs-clic="form.clicNuevoGrupo()"></bcs-button>
		</div>
					
	</div>
	
	
	<div class="row">
		<bcs-grid
			ng-paste="form.pegarPortapapeles($event)"
			seleccionado = "form.clienteSeleccionado"
			fn-doble-click= "form.inicioModificarPortafolio()"
			configuracion = "form.configuracionGridClientes">
		</bcs-grid>	
	</div>
	
	<div class="row">
		<div class="col-xs-12 row" style="padding-top: 10px;">
			<label class="col-xs-1" translate>UI_TOTAL</label>
			<bcs-input-numero decimales = "form.decimales" class="col-xs-2" k-ng-model="form.cantidadPorAsignar" k-ng-disabled="true"></bcs-input-numero>
			<label class="col-xs-1" translate>UI_ASIGNADO</label>
			<bcs-input-numero decimales = "form.decimales" class="col-xs-2" k-ng-model="form.cantidadAsignado" k-ng-disabled="true"></bcs-input-numero>
			<label class="col-xs-1" translate>UI_PORCENTAJE_TOTAL</label>
			<bcs-input-numero decimales = "'4'" class="col-xs-2" k-ng-model="form.porcentajeTotal" k-ng-disabled="true"></bcs-input-numero>
			<label class="col-xs-1" translate>UI_TIPOS_PEGADO</label>
			<bcs-combobox-base
				id="ComboTipoPegado"
				class="col-xs-2"
				id-defecto = "form.tipoPegadoDefecto"
				id-actual = "form.idTipoPegado"
				seleccionado = "form.tipoPegadoSeleccionado"
				tipo="form.TipoPegadoCombobox">
			</bcs-combobox-base>
		</div>
		<div class="col-xs-12 row">
			<div id="UiMonto">
				<label class="col-xs-1" translate>UI_MONTO_TOTAL</label>
				<bcs-input-numero decimales = "form.decimales" class="col-xs-2" k-ng-model="form.montoPorAsignar" k-ng-disabled="true" k-ng-></bcs-input-numero>
				<label class="col-xs-1" translate>UI_MONTO_ASIGNADO</label>
				<bcs-input-numero decimales = "form.decimales" class="col-xs-2" k-ng-model="form.montoAsignado" k-ng-disabled="true"></bcs-input-numero>
			</div>
			
		</div>
		
	</div>
	<hr/>
	
	<form name="formAgregarPortafolio">
		<div class="row">
			<label translate class="col-xs-2">UI_CLIENTE_PORTAFOLIO</label>
			<bcs-combobox-base 
				class="col-xs-3"
				bcs-requerido = "form.editable && (form.agregando || form.modificando)"
				activado = "form.editable && (form.agregando || form.modificando)"
				id-actual="cliente.IdPortafolio"
				seleccionado = "cliente.portafolioSeleccionado"
			 	tipo="'combobox-cliente-portafolio'"
	            muestra-enlace = "'S'"
	            cascada-a="form.filtrosCuentaCustodio.IdPortafolio"
				cascada-valor="'IdPortafolio'">
			</bcs-combobox-base >
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_CUENTA_CUSTODIO</label>
			<bcs-combobox-base
				class="col-xs-3"
				bcs-requerido = "SesionLocale === 'PE' && form.editable"
				activado = "form.editable"
				usa-filtros-completos = "'S'"
				tipo="'combobox-cuenta-custodio-portafolio'"
				seleccionado="cliente.cuentaCustodioSeleccionada"
				id-actual = "cliente.IdCuentaCustodioPortafolioActual"
				id-post-filtro="cliente.IdCuentaCustodioPortafolio"
				filtros="form.filtrosCuentaCustodio"
				cascada-a="form.filtrosBoveda.IdBoveda"
				cascada-valor="'IdBoveda'">
			</bcs-combobox-base>
			
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FORMA_CUSTODIA</label>
			<bcs-combobox-base
				class="col-xs-3"
				bcs-requerido = "form.editable"
				activado = "form.editable && !form.EsVentaCorta"
				id-actual = "cliente.IdFormaCustodia"
				seleccionado = "cliente.formaCustodiaSeleccionada"
				tipo="'combobox-forma-custodia-orden'">
			</bcs-combobox-base>
		
		</div>
		
		<div class="row">
			
			<label class="col-xs-2" translate>UI_BOVEDA</label>
			<bcs-combobox-base
				class="col-xs-3"
				bcs-requerido = "form.editable"
				activado = "form.editable"
				auto-seleccion = "'true'"
				id-actual="cliente.IdBoveda"
				seleccionado = "cliente.bovedaSeleccionada"
				filtros ="form.filtrosBoveda"
				tipo="'combobox-boveda'">
			</bcs-combobox-base>
			
			<label class="col-xs-2 col-xs-offset-1" translate>UI_PAGO_COBRO_CON_CTA_INVERSION</label>
			<bcs-input-checkbox class="col-xs-3"
				ng-disabled="!form.editable || form.PagoCobroCuentaInversionDisabled" 
				ng-model="cliente.PagoCobroCuentaInversion">
			</bcs-input-checkbox>
			
			
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_CODIGO_IFRS</label>
			<bcs-combobox-base
				class="col-xs-3"
				activado = "form.editable && cliente.portafolioSeleccionado.EsCuentaPropia==='S'"
				bcs-requerido = "cliente.portafolioSeleccionado.EsCuentaPropia==='S'"
				id-actual="form.CodigoIFRS"
				seleccionado = "codigoIFRS.codigoSeleccionado"
				tipo="'combobox-codigo-ifrs'">
			</bcs-combobox-base>
			
			<label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO_CAMBIO</label>
			<bcs-input-monetario
				class="col-xs-3"
				decimales = "'2'"
				simbolo="SesionIdMonedaSistema" 
				k-ng-disabled="!form.esTransaccionExtranjera"
				k-ng-model="form.tipoCambio" >
			</bcs-input-monetario>
		</div>
		
		<div class="row" ng-show="form.EsVentaCorta">
			<label class="col-xs-2" translate>UI_PLAZO_VENTA_CORTA</label>
			<bcs-input-plazo
				class="col-xs-3"
				activa-plazo = "form.editable"
				activa-fecha = "form.editable"
				bcs-requerido = "form.editable && form.EsVentaCorta"
				bcs-mayor-que = "'0'"
				fecha-inicial = "form.FechaInicial"
				plazo = "cliente.PlazoVentaCorta"
				id-tipo-operacion = "form.IdTipoOperacion"
				id-condicion-de-liquidacion="'T0'">
			</bcs-input-plazo>	
			<label class="col-xs-2 col-xs-offset-1" translate>UI_TASA</label>
			<bcs-input-numero
				class="col-xs-3"
				k-ng-disabled = "!form.editable"
				bcs-requerido = "form.editable && form.EsVentaCorta"
				k-ng-model = "cliente.TasaVentaCorta">
			</bcs-input-numero>
			
		</div>
		<hr/>
		<div class="row" ng-show="esAsignacionGrupoPrecioPromedio">
			<label class="col-xs-2" translate>UI_NO_APLICAR_COMISION</label>
			<bcs-input-checkbox class="col-xs-3"
				ng-model="cliente.NoAplicarComision">
			</bcs-input-checkbox>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_ENVIAR_FACTURAR_AUTOMATICO</label>
			<bcs-input-checkbox class="col-xs-3"
				ng-model="cliente.EnviarFacturarAutomatico">
			</bcs-input-checkbox>
		</div>
		
	</form>
	<div class="row">
		<div class="col-xs-6">
			<!-- AGREGAR -->
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="!form.agregando && !form.modificando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate" bcs-habilitado="'true'" bcs-clic="form.agregando = true;form.editable = true"></bcs-button>
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="form.agregando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="form.agregando && formAgregarPortafolio.$valid" bcs-clic="form.agregarPortafolio()"></bcs-button>
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="form.agregando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="form.agregando" bcs-clic="form.limpiar();form.agregando = false;form.editable = false"></bcs-button>
			
			<!-- MODIFICAR -->
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="!form.agregando && !form.modificando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_MODIFICAR' | translate" bcs-habilitado="form.clienteSeleccionado" bcs-clic="form.inicioModificarPortafolio()"></bcs-button>
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="form.modificando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="form.modificando && formAgregarPortafolio.$valid" bcs-clic="form.modificarPortafolio()"></bcs-button>
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="form.modificando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="form.modificando" bcs-clic="form.limpiar();form.modificando = false;form.editable = false"></bcs-button>
			
			<bcs-button bcs-tipo="'bcs-button-input-form'" ng-show="!form.agregando && !form.modificando" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_QUITAR' | translate" bcs-habilitado="form.clienteSeleccionado" bcs-clic="form.quitarPortafolio()"></bcs-button>
		</div>
		<div class="col-xs-6">
			<label class="col-xs-2" translate>UI_FORMATO</label>
			<label class="col-xs-10" style = "font-style: italic">{{formatoCarga}}</label>
		</div>
	</div>
	<hr/>
	<div class="row">
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_ASIGNAR' | translate" bcs-habilitado="'true'" bcs-clic="form.asignar()"></bcs-button>
		</div>
	</div>
</div>

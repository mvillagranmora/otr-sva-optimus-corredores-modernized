<div class="row" ng-controller='SelectorElementosCtrl' bcs-enter="buscar(filtros)" tabindex="1">
	<div class="row">
		<form name="barraFiltrosForm">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_CLASIFICACION</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-clasificacion-tipo-instrumento'"
							id-actual="filtros.IdClasificacionTipoInstrumento"
							id-post-filtro="defecto.IdClasificacionTipoInstrumento"
							activado="!defecto.IdClasificacionTipoInstrumento"
							cascada-a="formData.filtrosTipoInstrumento.IdClasificacionTipoInstrumento"
							cascada-valor="'IdClasificacionTipoInstrumento'"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-tipo-instrumento'"
							id-actual="filtros.IdTipoInstrumento"
							id-post-filtro="defecto.IdTipoInstrumento"
							activado="!defecto.IdTipoInstrumento"
							auto-cargar="'false'"
							filtros = "formData.filtrosTipoInstrumento"
							cascada-a="formData.filtrosOperacion.IdTipoInstrumento"
							cascada-valor="'IdTipoInstrumento'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
						<bcs-input-instrumentos class="col-xs-8" 
							datos-instrumento="filtros.instrumento"
							bcs-requerido
							buscar-instrumento="defecto.instrumento"
							filtro-clasificacion="filtros.IdClasificacionTipoInstrumento"
							filtro-tipo-instrumento="filtros.IdTipoInstrumento">
						</bcs-input-instrumentos>
					</div>
			    </div>
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_OPERACION</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-operacion'"
							id-actual="filtros.AccionOrden"
							id-post-filtro="defecto.AccionOrden"
							activado="!defecto.AccionOrden"
							auto-cargar="'false'"
							filtros = "formData.filtrosOperacion"
							cascada-a="formData.filtrosCondicionDeLiquidacion.IdTipoOperacion"
							cascada-valor="'IdTipoOperacion'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CONDICION_LIQUIDACION</label>
						<bcs-combobox-base 
							class="col-xs-8"
							filtros = "formData.filtrosCondicionDeLiquidacion"
							tipo="'combobox-condicion-liquidacion'"
							id-actual="filtros.IdCondicionDeLiquidacion"
							id-post-filtro="defecto.IdCondicionDeLiquidacion"
							activado="!defecto.IdCondicionDeLiquidacion"
							auto-cargar="'false'">
						</bcs-combobox-base >
					</div>
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_BOLSA</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-bolsa'"
							id-actual="filtros.IdBolsa"
							id-post-filtro="defecto.IdBolsa"
							activado="!defecto.IdBolsa">
						</bcs-combobox-base>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-4">
						<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-libro-orden'"
							id-actual="filtros.IdLibroOrdenes"
							id-post-filtro="defecto.IdLibroOrdenes"
							activado="!defecto.IdLibroOrdenes">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-2">
						<label class="col-xs-6" translate>UI_VENTA_CORTA</label>
						<bcs-input-checkbox 
					     	class="col-xs-1"
					     	ng-disabled="'true'"
							ng-model="defecto.EsVentaCorta">
						</bcs-input-checkbox>
					</div>
					
					<div class="col-xs-2" ng-if="SesionLocale === 'PE'">
						<label class="col-xs-6" translate>UI_SOLO_ORDENES_ESPECIALES</label>
						<bcs-input-checkbox 
	                        class="col-xs-1"
    	                    ng-model="filtros.OrdenEspecial">
                    	</bcs-input-checkbox>
					</div>
					
				</div>
			</div>
		</form>
		<div class="col-xs-2">
		    <div class="row">
				<bcs-button 
					class="col-xs-10" 
					bcs-tipo="'bcs-button-search'"  
					bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate"
					bcs-habilitado="'true'"
					bcs-clic="buscar()" >
				</bcs-button>
			</div>
		</div>
	</div>
	
	<div class="row">
		<bcs-grid
			id="gridOrdenesSelector"
			api = "apiGrid"
			fn-doble-click="aceptar()"
			seleccionado="seleccionado"
			configuracion="configuracion">
		</bcs-grid>
	</div>

	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
			<bcs-button  class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

<div ng-controller="DetalleSimultaneaCtrl">
	<div class="row">
		<div class="row">
			<label class="col-xs-2" translate>UI_CLIENTE</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="simultanea.NombreCompleto"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_DOCUMENTO_IDENTIDAD</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="simultanea.DocumentoIdentidad"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_PORTAFOLIO</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="simultanea.CodigoPortafolio"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_BOLSA</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="simultanea.NombreBolsa"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_FECHA_OPERACION</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="simultanea.FechaOrden"></bcs-input-date>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO_OPERACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="simultanea.NombreTipoOperacion"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_CONDICION_LIQUIDACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="simultanea.NombreCondicionLiquidacion"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_TASA</label>
			<bcs-input-numero class="col-xs-3" k-ng-disabled="'true'" k-ng-model="simultanea.Tasa"></bcs-input-numero>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_PLAZO</label>
			<bcs-input-numero class="col-xs-3" k-ng-disabled="'true'" decimales = "'0'" k-ng-model="simultanea.Plazo"></bcs-input-numero>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_VENCIMIENTO</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="simultanea.FechaVencimiento"></bcs-input-date>
		</div>
	</div>
	
	<div ng-show="simultanea.ordenes.length > 0"  class="row">
		<h5 translate>UI_ORDENES</h5>
	</div>
	<div ng-show="simultanea.ordenes.length > 0" class="row">
		<bcs-grid class="col-xs-11"
			configuracion="configuracionOrdenes">
		</bcs-grid>
	</div>
	
	<div ng-show="simultanea.garantias.length > 0" class="row">
		<h5 translate>UI_GARANTIAS</h5>
	</div>
	<div ng-show="simultanea.garantias.length > 0" class="row">
		<bcs-grid class="col-xs-11"
			configuracion="configuracionGarantias">
		</bcs-grid>
	</div>
	<div class="row">
		<h5 translate>UI_COBROS</h5>
	</div>
	<div class="row">
		<bcs-grid class="col-xs-11"
			configuracion="configuracionCobros">
		</bcs-grid>
	</div>
	<div class="row"><br/>
	</div>
</div>

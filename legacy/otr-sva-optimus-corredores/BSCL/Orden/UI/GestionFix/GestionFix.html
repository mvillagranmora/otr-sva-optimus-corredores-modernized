<div ng-controller="GestionFixCtrl">
	<div class="row">
		<div class="col-xs-5">
			<div class="row">
				<label class="col-xs-4" translate>UI_SECUENCIA_ORDEN</label>
				<bcs-input-texto class="col-xs-7 text-right" ng-model="IdOrden"></bcs-input-texto>
			</div>
		</div>
		<div class="col-xs-5">
			<div class="row">
				<label class="col-xs-4" translate>UI_FECHA</label>
				<bcs-input-texto class="col-xs-7 text-right" ng-model="Fecha"></bcs-input-texto>
			</div>
		</div>
		<div class="col-xs-2 alignButtonsToRight">
			<bcs-button class="col-xs-8" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_REFRESCAR' | translate" 
					bcs-habilitado="'true'" bcs-clic="refrescar()"></bcs-button>
		</div>
	</div>
	
	
	
	<div class="row">
		<bcs-grid
			configuracion = "confSolicitudes"
		></bcs-grid>
	</div>
	
	<div class="row">
		<bcs-grid
			configuracion = "confRespuestas"
			seleccionado = "seleccionado"
		></bcs-grid>
	</div>
	<div class="col-xs-12 alignButtonsToRight">
		<bcs-button  class="col-xs-2 alignButtonsToRight" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_PROCESAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="procesar(seleccionado)"></bcs-button>
	</div>
	
</div>

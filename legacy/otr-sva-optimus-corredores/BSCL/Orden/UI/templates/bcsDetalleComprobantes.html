<table class="table">
  <thead>
    <tr>
      <tr>
        <th translate>{{'UI_MOVIMIENTO'}}</th>
        <th translate>{{'UI_CONDICION_LIQUIDACION'}}</th>
        <th translate>{{'UI_FECHA_LIQUIDACION'}}</th>
        <th translate>{{'UI_MONTO'}}</th>
        <th translate>{{'UI_ESTADO'}}</th>
      </tr>
    </tr>
  </thead>
  <tbody>
    <tr>
      <tr ng-repeat="comprobante in comprobantes">
        <td><label>{{comprobante.IdComprobante}}</label></td>
        <td><label>{{comprobante.CodigoCondicionLiquidacion}}</label></td>
        <td><label>{{comprobante.FechaLiquidacion}}</label></td>
        <td><label>{{comprobante.MontoComprobante | kformat:'c'}}</label></td>
        <td><label>{{comprobante.NombreEstadoComprobante}}</label></td>
      </tr>
    </tr>
  </tbody>
</table>

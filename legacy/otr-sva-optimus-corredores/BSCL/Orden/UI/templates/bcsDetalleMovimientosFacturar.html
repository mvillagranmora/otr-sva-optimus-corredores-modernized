<table class="table">
  <thead>
    <tr>
      <tr>
        <th translate>{{'UI_MOVIMIENTO'}}</th>
        <th translate>{{'UI_CODIGO_CONCEPTO'}}</th>
        <th translate>{{'UI_CONCEPTO'}}</th>
        <th translate>{{'UI_FOLIO_COMPROBANTE'}}</th>
        <th translate>{{'UI_MONTO'}}</th>
        <th translate>{{'UI_ESTADO'}}</th>
      </tr>
    </tr>
  </thead>
  <tbody>
    <tr>
      <tr ng-repeat="movimiento in movimientos">
        <td><label>{{movimiento.IdMovimientoComprobante}}</label></td>
        <td><label>{{movimiento.IdConceptoMovimiento}}</label></td>
        <td><label>{{movimiento.NombreConceptoMovimiento}}</label></td>
        <td><label>{{movimiento.FolioComprobante}}</label></td>
        <td><label>{{movimiento.Monto | kformat:'c':movimiento.IdMoneda:'monto':'GEN'}}</label></td>
        <td><label>{{movimiento.NombreEstadoFacturacion}}</label></td>
      </tr>
    </tr>
  </tbody>
</table>

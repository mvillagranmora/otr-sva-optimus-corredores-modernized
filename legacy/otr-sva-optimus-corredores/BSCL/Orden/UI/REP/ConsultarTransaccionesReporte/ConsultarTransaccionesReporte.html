<div id="ConsultarTransaccionesReporte" class="row" ng-controller="ConsultarTransaccionesReporteCtrl" tabindex="1">
	<div class="row bcs-cuerpo">
   		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-3">
		  				<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
		  				<bcs-combobox-base 
		  					class="col-xs-8" 
							auto-cargar="'true'"
							todos="'S'"
							item-post-filtro = "'1'"
							tipo="'combobox-tipo-operacion'"  
							filtros="oConfiguracionTipoOperacion.filtros"
							id-actual="datosBusqueda.tipoOperacion"
							cascada1-a="oConfiguracionCondicionLiquidacion.filtros.IdTipoOperacion"
							cascada1-valor="'IdTipoOperacion'">			
						</bcs-combobox-base>	 
			  		</div>
			  		<div class="col-xs-3">
			  			<label class="col-xs-4" translate>UI_OPERACION</label>					
						<bcs-combobox-base
							class="col-xs-8"
							todos = "'S'"
							id-post-filtro = "'VENTA'"
							tipo="'combobox-operacion'"
							id-actual="datosBusqueda.AccionOrden"
							filtros="oConfiguracionOperacion.filtros"
							cascada-a="oConfiguracionCondicionLiquidacion.filtros.AccionTipoOperacion"
							cascada-valor="'AccionOrden'">
						</bcs-combobox-base>
			  		</div>
			  		<div class="col-xs-3">
			  			<label class="col-xs-4" translate>UI_INSTRUMENTO</label>					
						<bcs-input-instrumentos 
			  				class="col-xs-8" 
							datos-instrumento="datosBusqueda.instrumentoSubyacente"
							buscar-instrumento="datosBusqueda.buscarInstrumento"
							bcs-requerido>
						</bcs-input-instrumentos>
			  		</div>
			  		<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_CONDICION_LIQUIDACION</label>
						<bcs-combobox-base 
							class="col-xs-7"
							filtros = "oConfiguracionCondicionLiquidacion.filtros"
							tipo="'combobox-condicion-liquidacion'"
							id-actual="datosBusqueda.IdCondicionDeLiquidacion"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base >
					</div>
		  		</div>

		  		<div class="row">
		  			<div class="col-xs-3">
			  			<label class="col-xs-4" translate>UI_FECHA_TRANSACCION</label>
						<bcs-input-date class="col-xs-4" k-ng-model="datosBusqueda.fechaDesde"></bcs-input-date>
						<bcs-input-date class="col-xs-4" k-ng-model="datosBusqueda.fechaHasta"></bcs-input-date>
			  		</div>
			  		<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_BOLSA</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-bolsa'"
							id-actual="datosBusqueda.IdBolsa"
							todos="'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
			    	</div>
			    	<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_MARCA_NEGOCIACION</label>
						<bcs-input-texto class="col-xs-8" ng-model="datosBusqueda.marcaNegociacion"></bcs-input-texto>
					</div>
					<div class="col-xs-3">
				    	<label class="col-xs-5" translate>UI_TRANSACCIONES_CON_SALDO</label>
						<bcs-input-checkbox 
					     	class="col-xs-7"
					     	ng-model="datosBusqueda.TransaccionesConSaldo">
						</bcs-input-checkbox>
			    	</div>
		  		</div>
			</div>
			<div class="col-xs-2">
		
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="datosForm.buscarTransaccionesReportes()"></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
				</div>
			
	  		</div>
		</div>
		<div class="row">
			<bcs-grid id="grid-transacciones-reportes"
				fn-doble-click="datosForm.abrirDetalle(datosForm.kNgModel)"
				api = "datosForm.apiGridTransaccionesReportes"
				fn-exportar-excel = "datosForm.exportarExcel"
				seleccionado="datosForm.kNgModel"
				configuracion="datosForm.defaultOptionsNew">
			</bcs-grid>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_INGRESAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="datosForm.crearTransaccion()"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_MODIFICAR' | translate" 
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.modificarTransaccion(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_ANULAR' | translate" 
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.anularTransacciones(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_RESERVAR' | translate" 
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.reservar(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_LIBERAR' | translate" 
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.liberar(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_ASIGNAR' | translate" 
			bcs-habilitado="datosForm.kNgModel[0].AccionOrden === 'VENTA'" bcs-clic="datosForm.asignar(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_ASIG_RAPIDA' | translate"
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.asignacionRapida(datosForm.kNgModel)"></bcs-button>
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="datosForm.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
            <li ng-click="datosForm.seleccionarTodo()">{{'UI_SELECCIONAR_TODO' | translate}}</li>
		</bcs-menu>
	</div>
</div>

<div id="ConsultarAsignacionesReporte" class="row" ng-controller="ConsultarAsignacionesReporteCtrl" tabindex="1">
	<div class="row bcs-cuerpo">
   		<div class="row">
			<div class="col-xs-10">
				<div class="row">
					<div class="col-xs-3">
		  				<label class="col-xs-4" translate>UI_TIPO_OPERACION</label>
		  				<bcs-combobox-base 
		  					class="col-xs-8" 
							auto-cargar="'true'"
							todos="'S'"
							item-post-filtro = "'1'"
							tipo="'combobox-tipo-operacion'"  
							filtros="oConfiguracionTipoOperacion.filtros"
							id-actual="filtros.tipoOperacion"
							seleccionado="formData.tipoOperacion" 
							cascada1-a="oConfiguracionCondicionLiquidacion.filtros.IdTipoOperacion"
							cascada1-valor="'IdTipoOperacion'">			
						</bcs-combobox-base>	 
			  		</div>
			  		<div class="col-xs-3">
			  			<label class="col-xs-4" translate>UI_OPERACION</label>					
						<bcs-combobox-base
							class="col-xs-8"
							todos = "'S'"
							id-post-filtro = "'VENTA'"
							tipo="'combobox-operacion'"
							id-actual="filtros.AccionOrden"
							filtros="oConfiguracionOperacion.filtros"
							cascada-a="oConfiguracionCondicionLiquidacion.filtros.AccionTipoOperacion"
							cascada-valor="'AccionOrden'">
						</bcs-combobox-base>
			  		</div>
			  		<div class="col-xs-3">
			  			<label class="col-xs-4" translate>UI_INSTRUMENTO</label>					
						<bcs-input-instrumentos 
			  				class="col-xs-8" 
							datos-instrumento="filtros.instrumentoSubyacente"
							buscar-instrumento="filtros.buscarInstrumento"
							bcs-requerido>
						</bcs-input-instrumentos>
			  		</div>
			  		<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_CONDICION_LIQUIDACION</label>
						<bcs-combobox-base 
							class="col-xs-7"
							filtros = "oConfiguracionCondicionLiquidacion.filtros"
							tipo="'combobox-condicion-liquidacion'"
							id-actual="filtros.IdCondicionDeLiquidacion"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base >
					</div>
		  		</div>

		  		<div class="row">
		  			<div class="col-xs-3">
			  			<label class="col-xs-4" translate>UI_FECHA_ASIGNACION</label>
						<bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaDesde"></bcs-input-date>
						<bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaHasta"></bcs-input-date>
			  		</div>
			  		<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_BOLSA</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-bolsa'"
							id-actual="filtros.IdBolsa"
							todos="'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
		    		</div>
		    		<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_ESTADO</label>
						<bcs-combobox-base 
							class="col-xs-8"
							tipo="'combobox-estados-asignacion'"
							id-actual="filtros.IdEstadoAsignacion"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
		  		</div>
			</div>
			<div class="col-xs-2">
		
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarAsignacionesReportes(apiGridAsignacionesReportes,filtros)"></bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
				</div>
			
	  		</div>
		</div>
		<div class="row">
			<bcs-grid id="grid-asignaciones-reporte"
				fn-exportar-excel = "exportarExcel"
				fn-doble-click="abrirDetalle(data.kNgModel)"
				api = "apiGridAsignacionesReportes"
				seleccionado="data.kNgModel"
				configuracion="defaultOptionsNew">
			</bcs-grid>
		</div>
	</div>
	
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'Env. Facturar' | translate" 
			bcs-habilitado="'true'" bcs-clic="data.enviarFacturar(data.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_DESASIGNAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="data.anularAsignaciones(data.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_MAPA_DE_RELACIONES' | translate"
			bcs-habilitado="data.kNgModel" bcs-clic="verMapaRelaciones(data.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-2" bcs-auto-desactivar="'false'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_EXPORTAR_LIBRO' | translate" 
			bcs-habilitado="'true'" bcs-clic="exportarLibro()"></bcs-button>
		
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			<li ng-click="seleccionarTodo()">{{'UI_SELECCIONAR_TODO' | translate}}</li>
		</bcs-menu>
	</div>
</div>

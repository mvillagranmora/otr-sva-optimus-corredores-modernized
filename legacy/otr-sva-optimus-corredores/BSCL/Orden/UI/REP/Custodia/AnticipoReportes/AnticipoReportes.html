<div ng-controller="AnticipoReportesCtrl">
	<form name="formAnticipoReportes">
		<div class="col-xs-12 bcs-cuerpo">		
			<!-- DATOS DE LA OPERACION -->
			<div class="row">
				<label class="col-xs-3" translate>UI_SOCIO_NEGOCIO</label>
				<bcs-input-texto class="col-xs-9" id="formAnticipoReportes_SOCIO_NEGOCIO"
					name="data.socioNegocio" 				
					ng-model="data.socioNegocio"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>																
			</div>
			<div class="row">			
				<label class="col-xs-3" translate>UI_PORTAFOLIO</label>
				<bcs-input-texto class="col-xs-3" id="formAnticipoReportes_PORTAFOLIO"
					name="data.portafolio" 				
					ng-model="data.portafolio"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>													
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_MOVIMIENTO</label>
				<bcs-input-date class="col-xs-3" id="formAnticipoReportes_FECHA_MOVIMIENTO"
					k-ng-model="data.kngFechaSistema"
					ng-model="data.fechaMovimiento"
					k-ng-disabled = "'true'"
				></bcs-input-date>																
			</div>		
			<div class="row">
				<label class="col-xs-3" translate>UI_TIPO_OPERACION</label>
				<bcs-input-texto class="col-xs-3" id="formAnticipoReportes_TIPO_OPERACION"
					name="data.tipoOperacion" 				
					ng-model="data.tipoOperacion"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_FOLIO</label>
				<bcs-input-texto class="col-xs-3" 
					k-ng-disabled = "'true'" 
					ng-model="data.kngFolioCartera"					
				></bcs-input-texto>											
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_INSTRUMENTO</label>	
				<bcs-input-texto class="col-xs-9" id="formAnticipoReportes_INSTRUMENTO"
					name="data.instrumento" 				
					ng-model="data.instrumento"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>														
			</div>					
			<div class="row">
				<label class="col-xs-3" translate>UI_FECHA_INVERSION</label>
				<bcs-input-date class="col-xs-3" id="formAnticipoReportes_FECHA_INVERSION"
					k-ng-model="data.kngFechaInversion"
					ng-model="data.fechaInversion"
					k-ng-disabled = "'true'"
				></bcs-input-date>		
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_FECHA_VENCIMIENTO</label>
				<bcs-input-date class="col-xs-3" id="formAnticipoReportes_FECHA_VENCIMIENTO"
					k-ng-model="data.kngFechaVencimiento"
					ng-model="data.fechaVencimiento"
					k-ng-disabled = "'true'"
				></bcs-input-date>															
			</div>					
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_INVERSION</label>
				<bcs-input-monetario class="col-xs-3" id="formAnticipoReportes_MONTO_INVERSION"
					k-ng-disabled = "'true'" 
					name="data.montoInversion" 				
					k-ng-model="data.kngMontoInversion"
					k-options="data.montoInversionOpt"	
				></bcs-input-monetario>
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_MONTO_PLAZO</label>
				<bcs-input-monetario class="col-xs-3" id="formAnticipoReportes_MONTO_PLAZO"
					k-ng-disabled = "'true'" 
					name="data.montoPlazo" 				
					k-ng-model="data.kngMontoPlazo"
					k-options="data.montoPlazoOpt"
				></bcs-input-monetario>																	
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_CANTIDAD</label>
				<bcs-input-numero class="col-xs-3" id="formAnticipoReportes_CANTIDAD"
					k-ng-disabled = "'true'" 
					name="data.cantidad" 				
					k-ng-model="data.kngCantidad"
					k-options="data.cantidadOpt"
				></bcs-input-numero>
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_PRECIO</label>	
				<bcs-input-numero class="col-xs-3" id="formAnticipoReportes_PRECIO"
					k-ng-disabled = "'true'" 
					name="data.precio" 				
					k-ng-model="data.kngPrecio"
					k-options="data.precioOpt"
				></bcs-input-numero>																
			</div>		
			<div class="row">
				<label class="col-xs-3" translate>UI_PLAZO</label>
				<bcs-input-numero class="col-xs-3" id="formAnticipoReportes_PLAZO"
					k-ng-disabled = "'true'" 
					name="data.plazo" 				
					k-ng-model="data.kngPlazo"
					k-options="{ format : 'n0', min:-999999999999 , spinners: false}"
				></bcs-input-numero>
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_TASA</label>
				<bcs-input-porcentaje class="col-xs-3"	id="formAnticipoReportes_TASA"			
					name="data.tasa" 				
					k-ng-disabled = "'true'" 
					k-ng-model="data.kngTasa"
					k-options="data.tasaOpt"
				></bcs-input-porcentaje>												
			</div>		
			<div class="row">				
				<label class="col-xs-3 txt-left" translate>UI_PLAZO_RESIDUAL</label>	
				<bcs-input-numero class="col-xs-3" id="formAnticipoReportes_PLAZO_RESIDUAL"
					k-ng-disabled = "'true'" 
					name="data.plazoResidual" 				
					k-ng-model="data.kngPlazoResidual"
					k-options="{ format : 'n0', min:-999999999999 , spinners: false}"
				></bcs-input-numero>
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_MONTO_ANTICIPO_TOTAL</label>
				<bcs-input-monetario class="col-xs-3" id="formAnticipoReportes_MONTO_ANTICIPO_TOTAL"
					k-ng-disabled = "'true'" 
					name="data.montoAnticipoTotal" 				
					k-ng-model="data.kngMontoAnticipoTotal"	
					k-options="data.montoAnticipoTotalOpt"			
				></bcs-input-monetario>														
			</div>	
			<div class="row">
				<label class="col-xs-3" translate>UI_CONDICION_LIQUIDACION</label>				
				<bcs-input-texto class="col-xs-6" id="formAnticipoReportes_CONDICION_LIQUIDACION_ORIGINAL"
					name="data.condicionLiquidacion" 				
					ng-model="data.condicionLiquidacion"
					k-ng-disabled = "'true'" 
				></bcs-input-texto>	
				<bcs-input-date class="col-xs-3" id="formAnticipoReportes_FECHA_CONDICION_LIQUIDACION_ORIGINAL"
					k-ng-disabled = "'false'"
					k-ng-model="data.kngFechaCondLiquidOpe" 
					ng-model="data.fechaCondLiquidOpe" 				
				></bcs-input-date>																
			</div>
			<br>
			<div class="row k-window-subtitle">
			   <label class="col-xs-4" translate>UI_DATOS_ANTICIPO</label>			   
			</div><hr>
			
			<!-- DATOS PARA LA SIMULTANEA -->
			<div class="row">
				<label class="col-xs-3" translate>UI_CONDICION_LIQUIDACION</label>				
				<bcs-combobox-base class="col-xs-6" id="formAnticipoReportes_CONDICION_LIQUIDACION"
					auto-cargar="'true'" 
					bcs-requerido = "'true'"
					tipo="data.oConfiguracionCondicionLiquidacion.tipo"  
					configuracion= "data.oConfiguracionCondicionLiquidacion.configuracion" 
					id-actual="data.oConfiguracionCondicionLiquidacion.idActual" 
					seleccionado="data.oConfiguracionCondicionLiquidacion.seleccionado" 
					filtros="data.oConfiguracionCondicionLiquidacion.filtros"	
					id-defecto="'T0'"			
				></bcs-combobox-base >
				<bcs-input-date class="col-xs-3" id="formAnticipoReportes_FECHA_CONDICION_LIQUIDACION" 
					name="data.fechaCondicionLiquidacion"
					k-ng-disabled = "'false'"				 				 			
					k-ng-model="data.kngFechaCondicionLiquidacion"
				></bcs-input-date>																
			</div>
			<div class="row">
				<label class="col-xs-3" translate>UI_CANTIDAD_ANTICIPO</label>
				<bcs-input-numero class="col-xs-3" id="formAnticipoReportes_CANTIDAD_ANTICIPO" 
					name="data.cantidadAnticipo"
					bcs-requerido
					bcs-mayor-que="'0'"
					k-ng-disabled = "'true'" 				 				
					k-ng-model="data.kngCantidadAnticipo"
					k-options="data.cantidadAnticipoOpt"	
				></bcs-input-numero>
				<label class="col-xs-3 txt-left" translate style="padding-left: 10px">UI_TASA_ANTICIPO</label>
				<bcs-input-porcentaje class="col-xs-3" id="formAnticipoReportes_TASA_ANTICIPO" 
					name="data.tasaAnticipo"
					bcs-mayor-que="'0'"
					k-ng-disabled = "data.tasaAnticipoDisabled" 				 				
					k-ng-model="data.kngTasaAnticipo"
					k-options="data.tasaAnticipoOpt"	
				></bcs-input-porcentaje>																
			</div>		
			<div class="row">
				<label class="col-xs-3" translate>UI_MONTO_ANTICIPO</label>
				<bcs-input-monetario class="col-xs-3" id="formAnticipoReportes_MONTO_ANTICIPO" 
					name="data.montoAnticipo"
					k-ng-disabled = "'true'" 				 				
					k-ng-model="data.kngMontoAnticipo"
					k-options="data.montoAnticipoOpt"	
				></bcs-input-monetario>												
			</div>
			
			
			<!-- BOTONES -->
			<div class="row bcs-panel-comandos">
				<bcs-button class="col-xs-2" 
					bcs-tipo="'principal'" 
					bcs-auto-desactivar="'true'" 
					bcs-texto="'UI_ANTICIPAR' | translate" 
					bcs-habilitado="formAnticipoReportes.$valid && data.showBtnCancelar"
					bcs-clic="data.anticiparGarantia()"					
				></bcs-button>				
				<bcs-button class="col-xs-2" 
					bcs-tipo="'default'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CANCELAR' | translate" 
					bcs-habilitado="btnActivo" 
					bcs-clic="data.cancelar('true')"
				></bcs-button>
				<bcs-button class="col-xs-2" 
					bcs-tipo="'default'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_LIMPIAR' | translate" 
					bcs-habilitado="btnActivo" 
					bcs-clic="data.limpiar()"
				></bcs-button>
			</div>			
		</div>
	</form>	
</div>

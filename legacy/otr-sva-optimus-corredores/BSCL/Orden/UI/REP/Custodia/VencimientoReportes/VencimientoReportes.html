<div ng-controller="VencimientoReportesCtrl">
	<div class="row bcs_titulo">
        <div class="col-xs-12">
            <span>{{'UI_TITULO_VENCIMIENTO_REPORTES'|translate}}</span>
        </div>
    </div>
			
	<div class="col-xs-12 bcs-cuerpo">
		<!-- DATOS DEL VENCIMIENTO -->
		<div class="row">
			<label class="col-xs-3" translate>UI_FECHA_MOVIMIENTO</label>
			<bcs-input-date class="col-xs-3"
				k-ng-model="data.kngFechaSistema"
				ng-model="data.fechaMovimiento"
				k-ng-disabled = "'true'"
			></bcs-input-date>																
		</div>		
		
		<div class="row"><br><br></div>	
		
		<!-- BOTONES -->
		<div class="row bcs-panel-comandos">
			<bcs-button class="col-xs-2" 
				bcs-tipo="'principal'" 
				bcs-auto-desactivar="'true'" 
				bcs-texto="'UI_EJECUTAR' | translate" 
				bcs-habilitado="data.procesarDisabled" 
				bcs-clic="data.procesar()"					
			></bcs-button>				
			<bcs-button class="col-xs-2" 
				bcs-tipo="'default'" 
				bcs-auto-desactivar="false" 
				bcs-texto="'UI_CANCELAR' | translate" 
				bcs-habilitado="data.cancelDisabled" 
				bcs-clic="data.cancelar()"
			></bcs-button>
		</div>				
	</div>
</div>

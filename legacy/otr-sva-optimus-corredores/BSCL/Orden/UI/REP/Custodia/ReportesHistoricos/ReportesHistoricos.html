<div ng-controller="ReportesHistoricasCtrl">
  	<!-- FILTROS -->	
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<label class="col-xs-2" translate>UI_SOCIO_NEGOCIO</label>
				<bcs-combobox-base class="col-xs-4"
				 	id="UI_SOCIO_NEGOCIO"
				 	auto-cargar="'false'"
				 	id-actual="oConfiguracionSocioNegocio.idActual"
				    tipo="'combobox-socio-negocio'"
				    seleccionado="oConfiguracionSocioNegocio.seleccionado"
				    filtros="oConfiguracionSocioNegocio.filtros"
				    configuracion= "oConfiguracionSocioNegocio.configuracion"
					cascada-a="oConfiguracionPortafolio.filtros.IdCliente"
					cascada-valor="'IdCliente'"
					cascada-defecto="-1" >
				</bcs-combobox-base >
				<label class="col-xs-2" translate style="padding-left: 15px">UI_PORTAFOLIO</label>
				<bcs-combobox-base class="col-xs-4"
				 	id="UI_PORTAFOLIO"
				 	id-actual="oConfiguracionPortafolio.idActual"
				 	auto-cargar="'false'"
				    tipo="'combobox-portafolio'"
				    seleccionado="oConfiguracionPortafolio.seleccionado"
				    filtros="oConfiguracionPortafolio.filtros"
					item-post-filtro="'1'"
				    configuracion= "oConfiguracionPortafolio.configuracion"  >
				</bcs-combobox-base >													
			</div>
			
			<div class="row">
				<label class="col-xs-2" translate>UI_TIPO_OPERACION</label>
				<bcs-combobox-base class="col-xs-4" 
					auto-cargar="'true'"
					tipo="oConfiguracionTipoOperacion.tipo"  
					filtros="oConfiguracionTipoOperacion.filtros"
					configuracion= "oConfiguracionTipoOperacion.configuracion" 
					id-actual="oConfiguracionTipoOperacion.idActual" 
					seleccionado="oConfiguracionTipoOperacion.seleccionado"
					todos="'S'"
					id-defecto="'0'" 
				></bcs-combobox-base>
				<label class="col-xs-2 txt-left" translate style="padding-left: 15px">UI_INSTRUMENTO</label>	
				<bcs-input-instrumentos class="col-xs-4" 
					name="uInstrumento" 
					datos-instrumento="instrumento"
					buscar-instrumento="buscarinstrumento" 
					filtro-estado = "'ACT'" 
					filtro-tipo-instrumento = "oConfiguracionTipoOperacion.seleccionado.IdTipoInstrumento"
					filtro-subyacente = "'SIM'"
				></bcs-input-instrumentos>														
			</div>
			<div class="row">
				<label class="col-xs-2" translate>UI_FECHA_INICIO</label>
				<bcs-input-date class="col-xs-2"
					k-ng-model="kngFechaInicio"
					ng-model="fechaInicio"	
					k-options="fechaInicioOpt"				
				></bcs-input-date>		
				<bcs-input-date class="col-xs-2"
					k-ng-model="kngFechaTermino"
					ng-model="fechaTermino"
					k-ng-disabled = "'true'"
				></bcs-input-date>
				
				<label class="col-xs-2 txt-left" translate style="padding-left: 15px">UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-2" 
					auto-cargar="'true'"
					tipo="oConfiguracionEstado.tipo"  
					filtros="oConfiguracionEstado.filtros"
					configuracion= "oConfiguracionEstado.configuracion" 
					id-actual="oConfiguracionEstado.idActual" 
					seleccionado="oConfiguracionEstado.seleccionado" 	
					todos="'S'"	
					id-defecto="'0'" 
				></bcs-combobox-base>														
			</div>
		</div>
					
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" 
					bcs-tipo="''"  
					bcs-auto-desactivar="'false'" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="buscar()"
				></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" 
					bcs-tipo="'default'"  
					bcs-auto-desactivar="'false'" 
					bcs-texto="'UI_LIMPIAR' | translate" 
					bcs-habilitado="'true'"  
					bcs-clic="limpiar()"
				></bcs-button>
			</div>
		</div>
	</div>					

	<!-- GRILLA -->
	<div class="row">
		<bcs-grid id="grid-reportes-historicas"
		 	configuracion = "confBasicaReportesHistoricas"
			seleccionado = "seleccionReportesokHistoricas"
			fn-exportar-excel="exportarExcel"
			
			>
		</bcs-grid>
	</div>
  	
  	<!-- INICIO PANEL COMANDOS -->
	<div class="row bcs-panel-comandos">
		<bcs-menu class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate">
            <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>	            
		</bcs-menu>
	</div>
</div>

<div id="BuscarReportantes" ng-controller='AsignacionOrdenReporteCtrl'>
	<div class="row">
  		<label class="col-xs-12" translate>UI_TRANSACCION</label>
  	</div>
  	<hr>
  	<div class="row">
  		<label class="col-xs-6" translate>UI_TIPO_INSTRUMENTO</label>
  		<bcs-input-texto 
			class='col-xs-6'
			ng-model="parametros.transacciones[0].NombreTipoInstrumento"
			k-ng-disabled	="'true'">
		</bcs-input-texto>
		<label class="col-xs-6" translate>UI_OPERACION</label>
  		<bcs-input-texto 
			class='col-xs-6'
			ng-model="parametros.transacciones[0].AccionTipoOperacion"
			k-ng-disabled	="'true'">
		</bcs-input-texto>
		<label class="col-xs-6" translate>UI_TASA</label>
  		<bcs-input-porcentaje
			class='col-xs-6'
			ng-model="parametros.transacciones[0].Tasa"
			k-ng-disabled	="'true'">
		</bcs-input-porcentaje>
		<label class="col-xs-6" translate>UI_CANTIDAD</label>
  		<bcs-input-texto 
			class='col-xs-6'
			ng-model="parametros.transacciones[0].CantidadDisponibleTransaccion"
			k-ng-disabled	="'true'">
		</bcs-input-texto> 
		<!--simbolo="parametros.transacciones[0].IdMonedaInstrumento" -->
  	</div>
	<div class="row">
  		<label class="col-xs-12" translate>UI_ORDENES_REPORTES</label>
  	</div>
  	<hr>
	<div class="row">
		<bcs-grid
			id="gridOrdenesReporte"
			fn-exportar-excel = "formData.exportarExcel"
			seleccionado = "data.kNgModel"
			api="data.apiGridOrdenesReporte"
			configuracion="data.configGridOrdenesReporte">
		</bcs-grid>
	</div>
	<div class="row">
		<bcs-button class="col-xs-4" id="AsignarOrden"
			bcs-tipo="'principal'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ASIGNAR' | translate" 
			bcs-habilitado="'true'" 
			bcs-clic="asignarOrdenReporte(data.kNgModel)">
		</bcs-button>
	</div>
</div>

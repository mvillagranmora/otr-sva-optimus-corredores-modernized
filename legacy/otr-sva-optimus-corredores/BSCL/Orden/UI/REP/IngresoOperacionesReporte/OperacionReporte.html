<div ng-controller="OperacionReporteCtrl">
	
	<!-- <form name="formIngresoReportado" class="filters-formulario"> -->
		<div class="col-xs-12">
			<div class="row" ng-show="false">
			  		<div class="col-xs-6">
			  			<div class="row" ng-show="false">
			  				<label class="col-xs-3 col-xs-offset-1" translate>UI_BOLSA</label>
							<bcs-combobox-base 
								class="col-xs-5"
								auto-cargar="true"
								
								tipo="'combobox-bolsa'" 
								id-actual="formData.idBolsa" 
								seleccionado="formData.Bolsaseleccionado" 
								filtros="filtros.filtrosBolsa"
								item-post-filtro = "'1'"
								activado="'false'"
								ng-show="modo=='INGRESAR'">
							</bcs-combobox-base>
							<bcs-input-texto 
			  					class='col-xs-5'
			  					ng-model="formEditar.bolsa"
			  					ng-show="modo=='EDITAR'"
			  					k-ng-disabled	="'true'"
			  				>
			  				</<bcs-input-texto>
						</div>
					</div>
			</div>
	  		<form name="formIngresoReportado" class="filters-formulario">
	  			<div class="col-xs-6">
 					<div class="row">
 						<label class="col-xs-12" translate>UI_REPORTADO</label>
 					</div>
 					<hr>
 					
 					<div class="row">
						<div class="row">
			  				<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
			  				<bcs-combobox-base 
			  					class="col-xs-7"
			  					tipo="'combobox-instrumento-simultanea'"
			  					id-actual="formData.idTipoInstrumento"
			  					id-defecto="formData.idTipoInstrumentoDefecto"
			  					filtros="filtros.filtrosTipoInstrumento"
			  					seleccionado="formData.TipoInstrumento"
			  					todos="'N'"
			  					bcs-requerido
			  					ng-show="modo=='INGRESAR'"
			  					activado="!formData.simulado"
			  					cascada-a="filtros.filtrosMoneda.IdTipoInstrumento"
			  					cascada-valor="'IdTipoInstrumento'"
			  					cascada1-a="oConfiguracionPreferenciaPagoPortafolio.filtros.IdTipoOperacion"
			  					cascada1-valor="'IdTipoOperacion'">
			  				</bcs-combobox-base>
			  				
			  				<bcs-input-texto 
			  					class='col-xs-7'
			  					ng-model="formEditar.tipoInstrumento"
			  					ng-show="modo=='EDITAR'"
			  					k-ng-disabled	="'true'">
			  				</<bcs-input-texto>
			  			</div>
 					</div>
 					<div class="row">
  						<label class="col-xs-4" translate>UI_CLIENTE_PORTAFOLIO</label>
			  			<bcs-combobox-base 
							id = "FormIngresoReportantes_comboPortafolio"
							class="col-xs-7"
							tipo="'combobox-cliente-portafolio'"
							bcs-requerido 
							muestra-enlace = "'S'"
							filtros="oConfiguracionPortafolio.filtros"
							seleccionado = "formData.clienteSeleccionado"
							ng-show="modo=='INGRESAR'"
							id-actual="formData.IdSocioNegocio"
							activado="!formData.simulado"
							cascada-a="oConfiguracionPreferenciaPagoPortafolio.filtros.IdPortafolio"
			  				cascada-valor="'IdPortafolio'"
			  				cascada1-a= "filtros.autorizadoDarOrdenes.IdPortafolio"
							cascada1-valor= "'IdPortafolio'"
							cascada2-a="filtros.configuracionCuentaCustodio.IdPortafolio"
                            cascada2-valor="'IdPortafolio'">
						</bcs-combobox-base >
						<bcs-input-texto 
		  					class='col-xs-7'
		  					ng-model="formEditar.clientePortafolio"
		  					ng-show="modo=='EDITAR'"
		  					k-ng-disabled	="'true'">
		  				</<bcs-input-texto>
		  						  			
					
					</div>
					<div class="row" ng-show= "modo=='INGRESAR'">
 						
 						<label class="col-xs-4" translate>UI_AUTORIZADOR</label>
						<bcs-combobox-base
								class					= "col-xs-7"
								bcs-requerido 			= "formData.clienteSeleccionado.TipoPersona === 'J' || formData.clienteSeleccionado.TipoPersona === 'M'"
								tipo					= "'combobox-autorizado-dar-ordenes'"
								id-actual				= "formData.idAutorizadoDarOrdenes"
								id-defecto				= "formData.idAutorizadoDarOrdenesDefecto"
								seleccionado			= "formData.autorizadoDarOrdenes"
								filtros					= "filtros.autorizadoDarOrdenes"
								activado				= "!formData.simulado"
								>
						</bcs-combobox-base>
 																				
 					</div>
 					<div class="row" ng-show= "modo=='INGRESAR'">
 						<label class="col-xs-4" translate>UI_MECANISMO_DE_CAPTACION</label>

						<bcs-combobox-base
								class					= "col-xs-7"
								bcs-requerido			
								tipo					= "'combobox-detalle-tipo-atributo'"
								id-actual 				= "formData.idMecanismoDeCaptacion"
								id-defecto 				= "formData.idMecanismoDeCaptacionDefecto"
								seleccionado			= "formData.mecanismoDeCaptacion"
								filtros					= "filtros.mecanismoDeCaptacion"
								activado				="!formData.simulado">
						</bcs-combobox-base>
					    -->
					    <bcs-combobox-base
								class="col-xs-7"
								bcs-requerido
								tipo="'combobox-detalle-tipo-atributo-entidad-json'"
								seleccionado="formData.mecanismoDeCaptacion"
								filtros="formData.configuracionMecanismoCaptacion.filtros"								
								auto-seleccion="'true'"
								id-actual= "formData.mecanismoDeCaptacion">
						</bcs-combobox-base> 					
 					</div>
					
					<div class="row">
						<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
						<bcs-input-instrumentos
							id 						= "UI_INSTRUMENTO"  
							class					= "col-xs-4" 
							buscar-instrumento		= "formData.setInstrumento" 
							datos-instrumento		= "formData.instrumento" 
							muestra-precio 			= "'N'"
							consulta-precio 		= "'S'"
							modo					= "FLJREP"
							filtro-flujo-custodia	= "SOLO_SUBYACENTE"
							valida-flujo-custodia 	= "formData.validaFlujoCustodia"
							bcs-requerido
							id-boveda				= "formData.cuentaCustodioSeleccionada.IdBoveda?formData.cuentaCustodioSeleccionada.IdBoveda:SesionValoresDefectoSistema.IdBovedaCuentaCustodia"
							ng-show					= "modo=='INGRESAR'"
							k-ng-disabled			= "formData.simulado"
							filtro-estado 			= "'ACT'"
							filtro-reporte 			= "'S'"
							id-portafolio			= "formData.clienteSeleccionado.IdPortafolio"
							filtro-bolsa			= "formData.Bolsaseleccionado.IdBolsa"
							filtro-tipo-instrumento  = "formData.clienteSeleccionado ? undefined : formData.idTipoInstrumento"
							id-uso					= "formData.idUso">
						</bcs-input-instrumentos>
						<!-- filtro-tipo-instrumento  = "formData.idTipoInstrumento" -->
						<div class="col-xs-1"
							ng-show="modo=='INGRESAR'">
						</div>
						<bcs-input-texto 
		  					class="col-xs-2"
		  					ng-show="modo=='INGRESAR'"
				  			ng-model="formData.instrumento.IdMoneda"
				  			K-ng-disabled="'true'">
				  		</bcs-input-texto>
				  		<bcs-input-texto 
		  					class="col-xs-4"
		  					ng-model="formEditar.instrumentoSubyacente"
		  					ng-show="modo=='EDITAR'"
		  					k-ng-disabled	="'true'">
		  				</<bcs-input-texto>
					</div>
					
									
				<div class="row">
					<label class="col-xs-4" translate>UI_PRECIO</label>
					<!-- RENTA VARIABLE -->
					<bcs-input-monetario
			 			decimales="2" 
			 			class="col-xs-3"
			 			bcs-requerido="formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RV'"
			 			k-ng-model="formData.precio"
			 			k-ng-disabled	="formData.simulado || formData.TipoInstrumento.IdClasificacionTipoInstrumento!=='RV'"
			 			ng-show="modo=='INGRESAR' && formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RV'"
			 			simbolo="formData.IdMoneda"
			 			>
			 		</bcs-input-monetario>
			 		<bcs-input-monetario 
		  				class			='col-xs-3'
		  				ng-model		="formEditar.precio"
		  				simbolo			="formEditar.moneda"
		  				ng-show			="modo=='EDITAR'"
		  				k-ng-disabled	="'true'">
		  			</bcs-input-monetario>
					<label class="col-xs-2 align_right" ng-show="modo=='INGRESAR' && formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RV'" translate>UI_MERCADO</label>
					<!-- RENTA VARIABLE -->
					<bcs-input-monetario 
						class="col-xs-2"
				  		maxlength="28"
				  		decimales = "'2'"
						k-ng-model="formData.mercado"
						k-ng-disabled="'true'"
						ng-show="modo=='INGRESAR' && formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RV'"
						simbolo="formData.instrumento.IdMoneda">
			  		</bcs-input-monetario>
			  		<!-- RENTA FIJA -->
			  		<bcs-input-porcentaje 
						class="col-xs-3"
				  		maxlength="28"
				  		decimales = "2"
				  		bcs-requerido="formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RF'"
						k-ng-model="formData.precioRf"
						ng-show="modo=='INGRESAR' && formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RF'"
						k-ng-disabled="formData.simulado || formData.TipoInstrumento.IdClasificacionTipoInstrumento!=='RF'">
			  		</bcs-input-porcentaje>
			  		
			  		<label class="col-xs-2 align_right" ng-show="modo=='INGRESAR' && formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RF'" translate>UI_PORCENTAJE_DESCUENTO</label>
					<bcs-input-porcentaje 
						class="col-xs-2"
				  		maxlength="28"
				  		decimales = "2"
						k-ng-model="formData.porcentajeDescuentoInstrumento"
						k-ng-disabled="'true'"
						ng-show="modo=='INGRESAR' && formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RF'">
						
			  		</bcs-input-porcentaje>
			  		
				</div>
				
				<div class="row">
					<label class="col-xs-4" translate>UI_MONEDA_LIQUIDACION</label>
					<bcs-combobox-base 
						class="col-xs-3"
						id="UI_MONEDA"
						bcs-requerido
					 	auto-cargar="'true'"
					 	activado="!formData.simulado"
					 	id-actual="formData.IdMoneda"
					 	tipo="'combobox-tipo-instrumento-moneda-liquidacion'"
					 	ng-show="modo=='INGRESAR'"
					 	seleccionado="formData.monedaSeleccionada"
					 	filtros="filtros.filtrosMoneda"
					 	id-post-filtro="formData.IdMonedaFiltro"
					 	cascada-a="oConfiguracionPreferenciaPagoPortafolio.filtros.IdMoneda"
			  			cascada-valor="'IdMonedaLiquidacion'">
					 	
					</bcs-combobox-base>
				
					<bcs-input-texto
		  				class="col-xs-3"
		  				ng-model="formEditar.monedaLiquidacion"
		  				ng-show="modo=='EDITAR'"
		  				k-ng-disabled	="'true'">
		  			</bcs-input-texto>
					
					<label class="col-xs-2 align_right" ng-show="formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RV'" translate>UI_PRECIO_TC</label>
					<bcs-input-monetario
						simbolo="formData.monedaSeleccionada.IdMonedaLiquidacion" 
						class="col-xs-2"
				  		maxlength="28"
				  		decimales = "'3'"
				  		k-ng-model="formData.precioTc"
						ng-show="formData.TipoInstrumento.IdClasificacionTipoInstrumento==='RV' && modo=='INGRESAR'"
						k-ng-disabled	="'true'">
			  		</bcs-input-monetario>
			  		<!--<bcs-input-monetario
		  				class="col-xs-2"
		  				ng-model="formEditar.precioTc"
		  				ng-show="formEditar.idTipoInstrumento==='RRV' && modo=='EDITAR'"
		  				k-ng-disabled	="'true'">
		  			</bcs-input-monetario>-->
				</div>
									
				<div class="row" ng-show="false">
					<label class="col-xs-4" translate>UI_MODO_MONTO</label>
					<bcs-input-checkbox 
			     		class="col-xs-2"
			     		ng-model="formData.modoMonto"
			     		ng-disabled	="'true'">
					</bcs-input-checkbox>
				</div>
				
				<div class="row" ng-show="modo=='INGRESAR'">
					<label class="col-xs-4" ng-show="formData.modoMonto" translate>UI_MONTO_CONTADO</label>
					<bcs-input-monetario 
						class="col-xs-3"
				  		maxlength="28"
				  		decimales = "'2'"
				  		simbolo="formData.monedaSeleccionada.IdMonedaLiquidacion" 
				  		bcs-requerido
						k-ng-model="formData.montoContado"
						ng-show="modo=='INGRESAR' && formData.modoMonto"
						k-ng-disabled	="formData.simulado">
			  		</bcs-input-monetario>
			  					  		
			   		<label class="col-xs-4" ng-show="!formData.modoMonto" translate>UI_CANTIDAD</label>
		  			<bcs-input-numero 
						class="col-xs-3"
				  		maxlength="28"
				  		decimales = "0"
				  		bcs-requerido="modo=='INGRESAR' && !formData.modoMonto"
						k-ng-model="formData.cantidad"
						ng-show="modo=='INGRESAR' && !formData.modoMonto"
						k-ng-disabled	="formData.simulado">
			  		</bcs-input-numero>
			  		
			  						  		
			  		<label class="col-xs-2 align_right" translate>UI_TASA_REPORTADO</label>
					<bcs-input-porcentaje 
						class="col-xs-2"
				  		maxlength="28"
				  		decimales = "2"
				  		bcs-requerido
						k-ng-model="formData.tasaReportadoV"
						ng-show="modo=='INGRESAR'"
						k-ng-disabled	="formData.simulado">
			  		</bcs-input-porcentaje>
			  		
							  		
				</div>
				<div class="row" ng-show="modo=='INGRESAR'">
					<label class="col-xs-4" translate>UI_TASA_REPORTANTE</label>
					<bcs-input-porcentaje 
						class="col-xs-3"
				  		maxlength="28"
				  		decimales = "2"
				  		bcs-requerido
						k-ng-model="formData.tasaReportanteV"
						ng-show="modo=='INGRESAR'"
						k-ng-disabled	="formData.simulado">
			  		</bcs-input-porcentaje>
			  		<!--  
			  		<bcs-input-porcentaje 
						class="col-xs-3"
				  		maxlength="28"
				  		decimales = "2"
				  		k-ng-model="formEditar.tasaReportanteV"
						ng-show="modo=='EDITAR'"
						k-ng-disabled	="formEditar.simulado">-->
			  		</bcs-input-porcentaje>
			  		<label class="col-xs-2 align_right" translate>UI_TASA_PROMEDIO</label>
					<bcs-input-porcentaje 
						class="col-xs-2"
				  		maxlength="28"
				  		decimales = "2"
				  		bcs-requerido
						k-ng-model="formData.tasaProm"
						ng-show="modo=='INGRESAR'"
						k-ng-disabled	="'true'">
			  		</bcs-input-porcentaje>
			  		<!-- <bcs-input-porcentaje 
		  				class="col-xs-2"
				  		maxlength="28"
				  		decimales = "2"
				  		k-ng-model="formEditar.tasaProm"
						ng-show="modo=='EDITAR'"
						k-ng-disabled	="'true'">
		  			</bcs-input-porcentaje>-->
						  		
				</div>
				
				<div class="row" ng-show="modo=='INGRESAR'">
					<label class="col-xs-4" ng-show="!formData.modoMonto" translate>UI_MONTO_CALCULADO</label>
					<bcs-input-monetario
							class="col-xs-3" 
							decimales = "2"
							bcs-requerido
							simbolo="formData.monedaSeleccionada.IdMonedaLiquidacion" 
							k-ng-model="formData.montoContado"
							ng-show="!formData.modoMonto"
							k-ng-disabled	="'true'">
					</bcs-input-monetario>
					
					<label class="col-xs-4" ng-show="formData.modoMonto" translate>UI_CANTIDAD_CALCULADA</label>
					<bcs-input-numero
							class="col-xs-3" 
							decimales = "0"
							k-ng-model="formData.cantidad"
							ng-show="formData.modoMonto"
							k-ng-disabled	="'true'">
					</bcs-input-numero>
					<label class="col-xs-2 align_right" translate>UI_BASE_TASA</label>
					<bcs-combobox-base 
			  			class="col-xs-2"
						bcs-requerido
						activado = "!formData.simulado"
						id-defecto="formData.idBaseTasaDefecto"
						id-actual = "formData.idBaseTasa"
						seleccionado = "formData.baseTasa" 
						tipo="'combobox-base-tasa'">
					</bcs-combobox-base>
				</div>
								
				<div class="row" ng-show="modo=='EDITAR'">
		  			<!-- <label class="col-xs-4" translate>UI_TASA_REPORTANTE</label>
		  			<bcs-input-porcentaje 
		  				class="col-xs-3"
		  				decimales = "2"
		  				k-ng-model="formEditar.tasaReportanteV"
		  				bcs-requerido="modo=='EDITAR'"
		  				k-ng-disabled="formEditar.tieneReportante">
		  			</bcs-input-porcentaje>-->
		  			<label class="col-xs-4" translate>UI_TASA_REPORTADO</label>
		  			<bcs-input-porcentaje 
		  				class="col-xs-3"
		  				decimales = "2"
		  				k-ng-model="formEditar.tasaReportadoV"
		  				bcs-requerido="modo=='EDITAR'"
		  				k-ng-disabled="formEditar.tieneReportante">
		  			
		  			</bcs-input-porcentaje>
		   		</div>
		  					  			
		  		<div class="row" ng-show="modo=='EDITAR'">
		  			<label class="col-xs-4" translate>UI_CANTIDAD</label>
		  			<bcs-input-numero 
		  				class="col-xs-3"
		  				decimales = "0"
		  				ng-model="formEditar.cantidad"
		  				k-ng-disabled	="'true'">
		  			</bcs-input-numero>
		  			<!-- <label class="col-xs-2 align_right" translate>UI_TASA_PROMEDIO</label>
		  			<bcs-input-porcentaje 
		  				class="col-xs-2"
		  				decimales = "2"
		  				k-ng-model="formEditar.tasaPromedioR"
		  				k-ng-disabled	="'true'">
		  			</bcs-input-porcentaje>-->
		  		</div>
		  		
		  		<div class="row" ng-show="modo=='EDITAR'">
		  			<label class="col-xs-4" translate>UI_MONTO_CONTADO</label>
		  			<bcs-input-monetario
						class="col-xs-3" 
						decimales = "2"
						simbolo="formEditar.monedaLiquidacion" 
						k-ng-model="formEditar.montoContado"
						k-ng-disabled	="'true'">
					</bcs-input-monetario>
					<label class="col-xs-2 align_right" translate>UI_BASE_TASA</label>
					<bcs-input-numero
		  				class='col-xs-2'
		  				ng-model="formEditar.baseTasa"
		  				decimales="0"
		  				k-ng-disabled	="'true'">
		  			</bcs-input-numero>
		  		</div>	
				
				<div class="row">
					<label class="col-xs-4" ng-show="modo=='INGRESAR'" translate>UI_TIPO_CAMBIO</label>
					<bcs-input-monetario
						class="col-xs-3" 
						decimales = "5"
						simbolo="formData.instrumento.IdMoneda" 
						k-ng-model="formData.tipoCambioOrigen"
						k-ng-disabled	="'true'"
						ng-show="modo=='INGRESAR'">
					</bcs-input-monetario>
					<label class="col-xs-2" translate></label>
					<bcs-input-monetario
						class="col-xs-2" 
						decimales = "5"
						simbolo="formData.monedaSeleccionada.IdMonedaLiquidacion" 
						k-ng-model="formData.tipoCambioLiquidacion"
						k-ng-disabled	="'true'"
						ng-show="modo=='INGRESAR'">
					</bcs-input-monetario>
				
				</div>
				<div class="row">
					<label class="col-xs-4" translate>UI_FECHA_LIQUIDACION_CONTADO</label>
					<bcs-input-condicion-liquidacion
						class 						= "col-xs-7"
						bcs-requerido
						id-tipo-operacion			= "formData.TipoInstrumento.IdTipoOperacion"
						fecha-inicial 				= "formData.fechaInicial"
						condicion-de-liquidacion	= "formData.condicionLiquidacion"
						fecha-liquidacion 			= "formData.fechaLiquidacion"
						ng-show						="modo=='INGRESAR'"
						activado					="!formData.simulado">
					</bcs-input-condicion-liquidacion> 
			
					<bcs-input-texto
						class="col-xs-2"
				  		maxlength="28"
				  		ng-model="formEditar.codigoCondicionLiquidacion"

<div class="row" ng-controller="AsociarReportantesCtrl">
		<div class="col-xs-12 bcs-cuerpo">	
			<form name="FormAsociarReportantes">		
						<div class="row">
		  					<label class="col-xs-5" translate>UI_CLIENTE</label>
					  		<bcs-input-texto class="col-xs-6"
					  			id="UI_CLIENTE"
					  			k-ng-disabled="'true'"
								ng-model="datos.NombreCompleto">
					  		</bcs-input-texto>
						</div>
						<div class="row">
							<label class="col-xs-5" translate>UI_PORTAFOLIO</label>
							<bcs-input-texto class="col-xs-6"
					  			id="UI_PORTAFOLIO"
					  			k-ng-disabled="'true'"
								ng-model="datos.CodigoPortafolio">
					  		</bcs-input-texto>
						</div>
						<div class="row">
							<label class="col-xs-5" translate>UI_TASA</label>
							<bcs-input-porcentaje class="col-xs-6"
								id="UI_TASA"
					  			maxlength="3"
					  			k-ng-disabled="'true'"
					  			k-ng-model="datos.Tasa">
			  				</bcs-input-porcentaje>
						</div>
						<div class="row">
							<label class="col-xs-5" translate>UI_MONTO</label>
							<bcs-input-monetario class="col-xs-6"
								id="UI_MONTO"
					  			maxlength="20"
					  			k-ng-disabled="'true'"
					  			simbolo="datos.IdMonedaOrden"
					  			k-ng-model="datos.MontoDisponibleAsociar">
			  				</bcs-input-monetario>
						</div>
						<div class="row">
							<label class="col-xs-5" translate>UI_MONTO_ASOCIAR</label>
							<bcs-input-monetario class="col-xs-6"
								id="UI_MONTO_ASOCIAR"
					  			maxlength="20"
					  			bcs-requerido
					  			simbolo="datos.IdMonedaOrden"
					  			k-ng-model="formData.MontoAsociar">
			  				</bcs-input-monetario>
						</div>
						<br>
						<div class="row bcs-panel-comandos">
							<bcs-button class="col-xs-3" id="AsociarOrden"
								bcs-tipo="'principal'" 
			 					bcs-auto-desactivar="'false'"
								bcs-texto="'UI_ASOCIAR' | translate" 
								bcs-habilitado="FormAsociarReportantes.$valid"
								bcs-clic="formData.asociarOrdenReportante()">
							</bcs-button>
						</div>
			  			  					
			</form>
			<br>
		</div>
</div>

<div id="BuscarReportantes" ng-controller='BuscarReportantesCtrl'>
	<div class="row">
  		<label class="col-xs-12" translate>UI_REPORTANTES</label>
  	</div>
  	<hr>
	<div class="row">
		<bcs-grid
			id="gridReportantes"
			fn-exportar-excel = "formData.exportarExcel"
			seleccionado = "formData.reportantesSeleccionadas"
			api="formData.apiReportantes"
			configuracion="formData.confGridReportes"
			fn-doble-click="asociarReportante(formData.reportantesSeleccionadas)">
		</bcs-grid>
	</div>
	<div class="row">
		<bcs-button class="col-xs-4" id="AgregarReportante"
			bcs-tipo="'principal'" 
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_ASOCIAR' | translate" 
			bcs-habilitado="'true'" 
			bcs-clic="asociarReportante(formData.reportantesSeleccionadas)">
		</bcs-button>
	</div>
</div>

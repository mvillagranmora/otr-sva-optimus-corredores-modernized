<div ng-controller="ModificarCorredorCorresponsalCtrl">
	<form name="ModificarCorredorCorresponsalForm">
		<div class="row">
			<label class="col-xs-4" translate>UI_CODIGO</label>
			<bcs-input-texto class="col-xs-8" 
				k-ng-disabled="'true'"
				ng-model = "corredorCorresponsal.CodigoCorredor">
			</bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_PAIS</label>
			<bcs-combobox-base class="col-xs-8" 
				tipo="'combobox-pais'"
				bcs-requerido
				id-defecto = "defecto.IdPais"
				id-actual = "corredorCorresponsal.IdPais">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_PERSONA</label>
			<bcs-combobox-base class="col-xs-8" 
				tipo="'combobox-socio-negocio'"
				filtros = "filtros.persona"
				id-defecto = "defecto.IdSocioDeNegocio"
				id-actual = "corredorCorresponsal.IdSocioDeNegocio"
				seleccionado = corredorCorresponsal.personaSeleccionada>
			</bcs-combobox-base>
		</div>
				
		<div class="row">
		
		<label class="col-xs-4" translate>UI_COBRO</label>
			<bcs-combobox-base  ng-if="SesionLocale === 'CL'" class="col-xs-8"
				bcs-requerido
				id-defecto = "defecto.IdPerfilCobros"
				filtros = "filtros.perfilCobrosPeru"
				tipo = "'combobox-perfil-cobros'"
				id-actual = "corredorCorresponsal.IdPerfilCobros">
			</bcs-combobox-base>
			
			
			<bcs-combobox-base  ng-if="SesionLocale === 'PE'" class="col-xs-8"
				bcs-requerido
				id-defecto ="defecto.IdPerfilCobros"
				filtros = "filtros.perfilCobrosPeru"
				tipo="'combobox-perfil-cobros-peru'"
				id-actual = "corredorCorresponsal.IdPerfilCobros">
			</bcs-combobox-base>
			
		</div>

		<div class="row" ng-show="SesionLocale === 'PE'">
			<label class="col-xs-4" translate>UI_TIPO_PRODUCTO</label>
			<bcs-combobox-base class="col-xs-8"
				bcs-requerido="SesionLocale === 'PE'"
				tipo="'combobox-tipo-producto-cobro'"
				id-actual="corredorCorresponsal.IdTipoProducto"
				id-defecto="defecto.IdTipoProducto"
				filtros="filtros.tipoProducto"
				activado="'false'"
			>
			</bcs-combobox-base>
		</div>
				 
		<div class="row" ng-show="SesionLocale === 'PE'">
			<label class="col-xs-4" translate>UI_BOVEDA</label>
			<bcs-combobox-base
				bcs-requerido="SesionLocale === 'PE'"
				class="col-xs-8"
				id-actual = "corredorCorresponsal.IdBoveda"
				tipo="'combobox-boveda'"
				filtros="filtros.IdBoveda"
				id-defecto ="defecto.IdBoveda">
			</bcs-combobox-base >	
		</div>
		
		<div class="row">
			<label class="col-xs-4" translate>UI_POR_DEFECTO_PAIS</label>
			<bcs-input-checkbox class="col-xs-8" ng-model="corredorCorresponsal.DefaultPais" ></bcs-input-checkbox>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_ESTADO</label>
			<bcs-combobox-base class="col-xs-8"
				id-defecto = "defecto.IdEstado"
				tipo="'combobox-estado-corredor-corresponsal'"
				id-actual = "corredorCorresponsal.IdEstado">
			</bcs-combobox-base>
		</div>
		
	</form>
	<div class="row">
		<br/>
	</div>
	<div class="row">
		<bcs-button class="col-xs-3" bcs-tipo="'principal'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="ModificarCorredorCorresponsalForm.$valid" bcs-clic="aceptar()"></bcs-button>
		<bcs-button class="col-xs-3" bcs-auto-desactivar="'false'" bcs-texto="'UI_CANCELAR' | translate" bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

<div class="col-xs-12" ng-controller="IngresarOrdenMainCtrl as ordenMain">
    <div class="bcs-cuerpo">
    	<div class="row">
	    	<label class="col-xs-2" translate>UI_TIPO_INSTRUMENTO</label>
			 <bcs-combobox-base
				class="col-xs-4"
				bcs-requerido
				activado = "( (ordenMain.confGlobal.tipoInstrumentoActivado==undefined || ordenMain.confGlobal.tipoInstrumentoActivado==true) && ordenMain.confGlobal.pantalla1==true)"
				id-defecto="'ACN'"
				tipo="'combobox-tipo-instrumento'"
				seleccionado="ordenMain.confGlobal.tipoInstrumentoSeleccionado"
				filtros="ordenMain.filtrosTipoInstrumento">
			 </bcs-combobox-base>
			
			 <img class="pull-right" ng-show="ordenMain.confGlobal.pensando"
			 	style = "width : 2%" 
			 	src="libs/K2015_3_1111/Fiori/loading-image.gif">
		</div>
		<hr>
		<div class="row">
			<div id="loadMe"></div>
		</div>
	</div>
</div>

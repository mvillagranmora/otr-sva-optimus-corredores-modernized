<div ng-controller="DetalleTransaccionCtrl">
	<div class="row">
		<div class="row">
			<label class="col-xs-2" translate>UI_SECUENCIA_TRANSACCION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.IdTransaccion"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_FOLIO_TRANSACCION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.FolioTransaccion"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_OPERACION</label>
			<bcs-input-datetime class="col-xs-3" k-ng-disabled="'true'" k-ng-model="transaccion.FechaOperacionTransaccion"></bcs-input-datetime>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_CONDICION_LIQUIDACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.NombreCondicionDeLiquidacion"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_LIQUIDACION</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="transaccion.FechaLiquidacion"></bcs-input-date>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_CLASIFICACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.NombreClasificacionTipoInstrumento"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO_INSTRUMENTO</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.NombreTipoInstrumento"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_TIPO_OPERACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.NombreTipoOperacion"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_INSTRUMENTO</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.InstrumentoUI"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_BOLSA</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.IdBolsa"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_PRECIO</label>
			<bcs-input-monetario class="col-xs-3" simbolo="transaccion.IdMonedaTransaccion" decimales="transaccion.DecimalesPrecio" k-ng-disabled="'true'" k-ng-model="transaccion.PrecioTransaccion"></bcs-input-monetario>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_MONTO</label>
			<bcs-input-monetario class="col-xs-3" simbolo="transaccion.IdMonedaTransaccion" decimales="transaccion.DecimalesMonto" k-ng-disabled="'true'" k-ng-model="transaccion.MontoTransaccion"></bcs-input-monetario>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_CANTIDAD_TOTAL</label>
			<bcs-input-numero class="col-xs-3" decimales="transaccion.DecimalesCantidad" k-ng-disabled="'true'" k-ng-model="transaccion.CantidadTransaccion"></bcs-input-numero>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_CANTIDAD_ASIGNADA</label>
			<bcs-input-monetario class="col-xs-3" decimales="transaccion.DecimalesCantidad" k-ng-disabled="'true'" k-ng-model="transaccion.CantidadAsignadaTransaccion"></bcs-input-monetario>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_CANTIDAD_DISPONIBLE</label>
			<bcs-input-numero class="col-xs-3" decimales="transaccion.DecimalesCantidad" k-ng-disabled="'true'" k-ng-model="transaccion.CantidadDisponibleTransaccion"></bcs-input-numero>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_ESTADO_TRANSACCION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.EstadoTransaccion"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_INDICADOR_BILATERAL</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.EsBilateralUI"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_PLAZO</label>
			<bcs-input-numero class="col-xs-3" decimales = "'0'" k-ng-disabled="'true'" k-ng-model="transaccion.Plazo"></bcs-input-numero>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_VENCIMIENTO</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="transaccion.FechaVencimiento"></bcs-input-date>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_MARCA_NEGOCIACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="transaccion.MarcaNegociacion"></bcs-input-texto>
		</div>
		
		
	</div>
	<br/>
	<div class="row">
		<uib-tabset class="col-xs-11" style="min-height:150px">
			<uib-tab heading="{{'UI_ASIGNACIONES' | translate}}">
				<bcs-detalle-asignaciones informacion-cliente="'S'" asignaciones="asignaciones"></bcs-detalle-asignaciones>
			</uib-tab>
			<uib-tab heading="{{'UI_MOVIMIENTOS_FACTURAR' | translate}}">
				<div class="row">
					<bcs-detalle-movimientos-facturar movimientos="movimientos"></bcs-detalle-movimientos-facturar>
				</div>
			</uib-tab>
		
		</uib-tabset>
	
	</div>
		
	<div class="row no-print alignButtonsToRight">
		<bcs-button id="DetalleTransaccion_verMapaRelaciones" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" 
			bcs-texto="'UI_MAPA_DE_RELACIONES' | translate"  bcs-habilitado="'true'" bcs-clic="verMapaRelaciones()"></bcs-button>
	</div>
		
</div>

<div ng-controller="AsignacionPropCronoCtrl">
	<div class="row">
		<div class="row">
			<label class="col-xs-4" translate>UI_TIPO_ASIGNACION</label>
			<bcs-combobox-base class="col-xs-8"
				tipo="'combobox-tipo-asignacion'"
				bcs-requerido 
				item-post-filtro = "'1'"
				id-actual = "datos.tipoAsignacion" 
				filtros="filtros.tipoAsignacion">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_HORA_HASTA</label>
			<bcs-input-time class="col-xs-8" 
				bcs-requerido 
				k-ng-model = "datos.horaHasta">
			</bcs-input-time>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
			<bcs-combobox-base 
				class="col-xs-8" 
				bcs-requerido 
				item-post-filtro = "'1'" 
				tipo="'combobox-libro-orden'"
				id-actual="datos.IdLibroOrdenes"
				todos="'S'">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_CONDICION_LIQUIDACION</label>
			<bcs-combobox-base 
				class="col-xs-8" 
				bcs-requerido
				item-post-filtro = "'1'"
				tipo="'combobox-condicion-liquidacion'" 
				id-actual="datos.IdCondicionDeLiquidacion"
				todos="'S'">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_CLASIFICACION</label>
			<bcs-combobox-base 
				class="col-xs-8" 
				tipo="'combobox-clasificacion-tipo-instrumento'"
				id-actual="datos.IdClasificacionTipoInstrumento" 
				filtros="filtros.clasificacionTipoInstrumento"
				cascada-a="filtros.tipoInstrumento.IdClasificacionTipoInstrumento"
				cascada-valor="'IdClasificacionTipoInstrumento'"
				cascada1-a="datos.filtrosInstrumentos.IdClasificacionTipoInstrumento"
				cascada1-valor="'IdClasificacionTipoInstrumento'" 
				todos="'S'" 
				bcs-requerido 
				item-post-filtro="'1'">
			</bcs-combobox-base>
		</div>

		<div class="row">
			<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
			<bcs-combobox-base 
				cascada-a="datos.filtrosOperacion.IdTipoInstrumento"
				cascada-valor="'IdTipoInstrumento'" 
				cascada1-a="datos.filtrosInstrumentos.IdTipoInstrumento"
				cascada1-valor="'IdTipoInstrumento'" 
				class="col-xs-8" tipo="'combobox-tipo-instrumento'" 
				filtros="filtros.tipoInstrumento"
				id-actual="datos.IdTipoInstrumento" 
				item-post-filtro="'1'" 
				todos="'S'">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_OPERACION</label>
			<bcs-combobox-base class="col-xs-8"
				todos = "'S'"
				bcs-requerido
				item-post-filtro = "'1'"
				id-actual = "datos.AccionOrden"
				tipo="'combobox-operacion'" 
				filtros="filtros.operacion">
			</bcs-combobox-base >
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_BOLSA</label>
			<bcs-combobox-base class="col-xs-8" 
				todos = "'S'"
				item-post-filtro = "'1'" 
				bcs-requerido
				id-actual = "datos.IdBolsa"
				tipo="'combobox-bolsa'">
			 </bcs-combobox-base >
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_CANAL_INGRESO</label>
			<bcs-combobox-base class="col-xs-8" 
				filtros = "datos.filtrosCanalIngreso" 
				id-actual="datos.IdTipoCanalIngreso" 
				item-post-filtro="'1'"
				tipo="'combobox-tipo-canal-ingreso'"
				todos="'S'">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_NEMOTECNICO</label>
			<bcs-combobox-base 
				class="col-xs-8" 
				filtros="datos.filtrosInstrumentos" 
				id-actual="datos.IdInstrumento" 
				item-post-filtro="'1'"
				seleccionado="datos.instrumento"
				tipo="'combobox-instrumento'">
			</bcs-combobox-base>
		</div>
		<div class="row">
			<label class="col-xs-4" translate>UI_MONEDA_NEGOCIACION</label>
			<bcs-combobox-base 
				auto-seleccion="'true'" 
				class="col-xs-8" 
				configuracion="datos.oConfiguracionMonedaNegociacion.configuracion"
				filtros="datos.oConfiguracionMonedaNegociacion.filtros"
				id-actual="datos.IdMonedaNegociacion"
				item-post-filtro="datos.itemPostFiltroMonedaNegociacion"
				seleccionado="datos.oConfiguracionMonedaNegociacion.seleccionado" 
				tipo="'combobox-moneda'" 
				todos="'S'">
			</bcs-combobox-base>
		</div>
		<div class="row">
				<label class="col-xs-4" translate>UI_MARCA_ASIGNACION</label>
				<bcs-input-texto class="col-xs-8" ng-model="datos.MarcaAsignacion" maxlength="25"></bcs-input-texto>
		</div>
		<!-- <div class="row">
			<label class="col-xs-4" translate>UI_MOSTRAR_RESULTADOS</label>
	  		<bcs-input-checkbox class="col-xs-8"
				ng-model="datos.mostrarResultados">
			</bcs-input-checkbox> 
		</div> -->
		
	</div>
	<div class="row">
		<br/>
	</div>
	<div class="row">
		<bcs-button class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="'false'" bcs-texto="'UI_INFORMACION' | translate" bcs-habilitado="'true'" bcs-clic="verElementos()"></bcs-button>
	</div>
</div>

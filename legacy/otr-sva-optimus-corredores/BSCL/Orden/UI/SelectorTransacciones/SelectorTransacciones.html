<div class="row" ng-controller='SelectorTransaccionesCtrl' bcs-enter="buscar()" tabindex="1">
	<div class="row">
		<form name="barraFiltrosForm">
			<div class="col-xs-11">
				<div class="row">
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_CLASIFICACION</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-clasificacion-tipo-instrumento'"
							id-actual="filtros.IdClasificacionTipoInstrumento"
							id-defecto="defecto.IdClasificacionTipoInstrumento"
							activado="!defecto.IdClasificacionTipoInstrumento"
							cascada-a="configuracionInterfaz.filtrosTipoInstrumento.IdClasificacionTipoInstrumento"
							cascada-valor="'IdClasificacionTipoInstrumento'"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base
							class="col-xs-7"
							tipo="'combobox-tipo-instrumento'"
							id-actual="filtros.IdTipoInstrumento"
							id-defecto="defecto.IdTipoInstrumento"
							activado="!defecto.IdTipoInstrumento"
							filtros = "configuracionInterfaz.filtrosTipoInstrumento"
							cascada-a="configuracionInterfaz.filtrosOperacion.IdTipoInstrumento"
							cascada-valor="'IdTipoInstrumento'"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-3">
					<label class="col-xs-5" translate>UI_OPERACION</label>
						<bcs-combobox-base
							class="col-xs-7"
							tipo="'combobox-operacion'"
							id-actual="filtros.AccionOrden"
							id-defecto="defecto.AccionOrden"
							activado="!defecto.AccionOrden"
							filtros = "configuracionInterfaz.filtrosOperacion"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_INSTRUMENTO</label>
						<bcs-input-instrumentos class="col-xs-7" 
							datos-instrumento="filtros.instrumento"
							bcs-requerido
							buscar-instrumento="defecto.instrumento"
							filtro-clasificacion="filtros.IdClasificacionTipoInstrumento"
							filtro-tipo-instrumento="filtros.IdTipoInstrumento">
						</bcs-input-instrumentos>
					</div>
			    </div>
				<div class="row">
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-libro-orden'"
							id-actual="filtros.IdLibroOrdenes"
							id-defecto="defecto.IdLibroOrdenes"
							activado="!defecto.IdLibroOrdenes"
							todos="'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_FECHA</label>
						<bcs-input-date class="col-xs-7" k-ng-model="filtros.FechaOperacion" k-ng-disabled="defecto.FechaOperacion"></bcs-input-date>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_CONDICION_LIQUIDACION</label>
						<bcs-combobox-base 
							class="col-xs-7"
							tipo="'combobox-condicion-liquidacion'"
							id-actual="filtros.IdCondicionDeLiquidacion"
							id-defecto="defecto.IdCondicionDeLiquidacion"
							activado="!defecto.IdCondicionDeLiquidacion"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base >
					</div>
					<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_BOLSA</label>
						<bcs-combobox-base 
					     	class="col-xs-7"
							tipo="'combobox-bolsa'"
							id-actual="filtros.IdBolsa"
							id-defecto="defecto.IdBolsa"
							activado="!defecto.IdBolsa"
							todos="'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
				</div>
				<div class="row">
					<div class="col-xs-3">
						<label class="col-xs-5" translate>UI_MARCA_NEGOCIACION</label>
						<bcs-input-texto class="col-xs-6" ng-model="filtros.marcaNegociacion"></bcs-input-texto>
					</div>
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_FUNGIBLE</label>
						<bcs-input-checkbox 
					     	class="col-xs-4"
					     	ng-disabled="filtros.esVentaCortaDeshabilitado"
					     	ng-model="filtros.EsFungible">
						</bcs-input-checkbox>
						<label class="col-xs-3" translate>UI_VENTA_CORTA</label>
						<bcs-input-checkbox 
					     	class="col-xs-1"
					     	ng-disabled="filtros.esFungibleDeshabilitado"
					     	ng-model="filtros.EsVentaCorta">
						</bcs-input-checkbox>
					</div>
				</div>
			</div>
		</form>
		<div class="col-xs-1">
		    <div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true" bcs-clic="buscar()" ></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'" ng-show="!defecto.IdClasificacionTipoInstrumento"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
		</div>
	</div>

	
	<div class="row">
		<bcs-grid
			api = "apiGrid"
			fn-doble-click="aceptar()"
			seleccionado="seleccionado"
			configuracion="configuracion">
		</bcs-grid>
	</div>

	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button bcs-tipo="'bcs-button-primary'" class="col-xs-1" bcs-auto-desactivar="'false'" bcs-texto="'UI_ACEPTAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="aceptar()"></bcs-button>
			<bcs-button  bcs-tipo="'bcs-button-secondary'" class="col-xs-1" bcs-auto-desactivar="'false'" bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="'true'" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

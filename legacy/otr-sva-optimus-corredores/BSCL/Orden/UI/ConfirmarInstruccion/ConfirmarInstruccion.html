<div class="row" ng-controller='ConfirmarInstruccionesCtrl as self' bcs-enter="self.form.CargarInstruccion()" tabindex="1">
	<form name="ConfirmarInstruccionesForm">
		<div class="row">
			<div class="row">
				<bcs-grid
					id="grid-destino-intrucciones"
					configuracion="self.configuracionGrilla"
					api = "self.apiGridDestinoInstrucciones">
				</bcs-grid>
			</div>
			
			<hr>
			
			<div class="row">
				<div ng-show="esCancelar">
					<div class="row">
						<div class="col-xs-5">
							<label class="col-xs-4" translate>UI_MOTIVO  </label> 
						</div>
					</div>
					<div class="row">
						<bcs-combobox-base
							tipo="'combobox-motivo'"
							id-actual="data.IdMotivoCancelar"
							filtros= "filtrosIdMotivo">
						</bcs-combobox-base>
					</div>
				</div>
				
				
				<div class="row">
					<div class="col-xs-5">
						<label class="col-xs-4" translate>UI_COMENTARIO  </label> 
					</div>
				</div>
				<div class="row">
					<bcs-input-texto
						id="IngresarInstruccionForm_inputComentario" 
						tipo-campo="'textarea'"
						atributos="margin: 0px; height: 90px; width:100%; overflow: auto;"
						maxlength="300"
						name="Comentario"
						ng-model="data.comentario" >
					</bcs-input-texto>
				</div>
				
				<br>
				<div class="row alignButtonsToRight">
					
					<bcs-button id="UI_ACEPTAR" class="col-xs-2" bcs-tipo="'bcs-button-primary'"
						bcs-texto="'UI_ACEPTAR' | translate"
						bcs-habilitado="'true'"
						bcs-auto-desactivar="'false'"
						bcs-clic="submit()"></bcs-button>
						
					<bcs-button id="UI_CANCELAR" class="col-xs-2" bcs-tipo="'bcs-button-secondary'"
					bcs-texto="'UI_CANCELAR' | translate"
					bcs-habilitado="'true'"
					bcs-clic="cerrar()"></bcs-button>
					
				</div>
			</div>
		</div>
	</form>
</div>

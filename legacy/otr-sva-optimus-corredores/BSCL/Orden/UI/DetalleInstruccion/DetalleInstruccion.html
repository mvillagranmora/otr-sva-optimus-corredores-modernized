<div ng-controller="DetalleInstruccionCtrl">
	<div class="row">
		<div class="row">
			<label class="col-xs-2" translate>UI_SECUENCIA_INSTRUCCION</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.IdInstruccion"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_INGRESO</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="instruccion.FechaIngreso"></bcs-input-datetime>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_ESTADO_INSTRUCCION</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.NombreEstado"></bcs-input-texto>
		
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_RUT_CLIENTE</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.DocumentoIdentidad"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_NOMBRE_COMPLETO_O_RAZON_SOCIAL</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="instruccion.NombreCompleto"></bcs-input-texto>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_PORTAFOLIO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.CodigoPropositoPortafolio"></bcs-input-texto>
			
		</div>
		<hr>
		<div class="row">
			<label class="col-xs-2" translate>UI_PROPOSITO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.Proposito"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_OPERACION</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="instruccion.NombreTipoOperacionInstruccion"></bcs-input-texto>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_MERCADO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.Mercado"></bcs-input-texto>
			
			<label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="instruccion.Tipo"></bcs-input-texto>
		</div>
				
		<div class="row">
			<label class="col-xs-2" translate>UI_INSTRUMENTO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.Nemotecnico"></bcs-input-texto>
		</div>
				
		<div class="row" ng-show="instruccion.IdTipoInstrumentoInstruccion !='IRV'">
			<label class="col-xs-2" translate>UI_PLAZO_VENCIMIENTO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.PlazoVencimiento"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_VENCIMIENTO</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="instruccion.FechaVencimiento"></bcs-input-date>
		</div>
		
		<div class="row"ng-show="instruccion.IdTipoInstrumentoInstruccion !='IRV'">
			<label class="col-xs-2" translate>UI_TIPO_REAJUSTE</label>
			<bcs-input-texto class="col-xs-4"  k-ng-disabled="'true'" ng-model="instruccion.IdTipoReajuste"></bcs-input-texto>			
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_MONEDA_LIQUIDACION</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.IdMonedaLiquidacion"></bcs-input-texto>
			
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_TRADE</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="instruccion.FechaTrade"></bcs-input-date>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_CONDICION_LIQUIDACION</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.IdCondicionDeLiquidacion"></bcs-input-texto>

			<label class="col-xs-2 col-xs-offset-1" translate>UI_FECHA_LIQUIDACION</label>
			<bcs-input-date class="col-xs-3" k-ng-disabled="'true'" k-ng-model="instruccion.FechaLiquidacion"></bcs-input-date>		
		</div>
		<hr>
		<div class="row"  ng-show="instruccion.IdTipoInstrumentoInstruccion == 'IRV'" >
			<label class="col-xs-2"translate>UI_CANTIDAD</label>
			<bcs-input-numero class="col-xs-4"k-ng-disabled="'true'"  decimales="instruccion.DecimalesCantidad||2" ng-model="instruccion.Cantidad"></bcs-input-texto>
		</div>
		
		<div class="row" ng-show="instruccion.IdTipoInstrumentoInstruccion == 'IRF'" >
			<label class="col-xs-2"translate>UI_VALOR_NOMINAL</label>
			<bcs-input-monetario class="col-xs-4"k-ng-disabled="'true'" decimales="instruccion.DecimalesPrecio||2" simbolo="instruccion.IdMonedaLiquidacion" k-ng-model="instruccion.ValorNominal"></bcs-input-monetario>
		</div>
		
		<div class="row" ng-show="instruccion.IdTipoInstrumentoInstruccion == 'IFI'" >
			<label class="col-xs-2"translate>UI_VALOR_RESCATE</label>
			<bcs-input-monetario class="col-xs-4"k-ng-disabled="'true'" decimales="instruccion.DecimalesPrecio||2" simbolo="instruccion.IdMonedaLiquidacion" k-ng-model="instruccion.ValorRescate"></bcs-input-monetario>
		</div>
		
		<div class="row" ng-show="instruccion.IdTipoInstrumentoInstruccion != 'IFI'" >
			<label class="col-xs-2"translate>UI_PRECIO_NEGOCIACION</label>
			<bcs-input-monetario class="col-xs-4"k-ng-disabled="'true'" decimales="instruccion.DecimalesPrecio||2" simbolo="instruccion.IdMonedaLiquidacion" k-ng-model="instruccion.PrecioInstruccion"></bcs-input-monetario>
		</div>
		
		<div class="row" ng-show="instruccion.IdTipoInstrumentoInstruccion !='IRV'">
			<label class="col-xs-2" ng-if="instruccion.IdTipoInstrumentoInstruccion == 'IRF'" translate>UI_TIR_NEGOCIACION</label>
			<label class="col-xs-2" ng-if="instruccion.IdTipoInstrumentoInstruccion == 'IFI'" translate>UI_TASA_NEGOCIACION</label>
			<bcs-input-monetario class="col-xs-4" ng-if="instruccion.IdTipoInstrumentoInstruccion == 'IRF' || instruccion.IdTipoInstrumentoInstruccion == 'IFI'" k-ng-disabled="'true'" decimales="instruccion.DecimalesTasa" simbolo="'%'" k-options = "formData.tirTasaOptions" k-ng-model="instruccion.TirTasa"></bcs-input-monetario>
			<!-- <label class="col-xs-2 col-xs-offset-1" translate>UI_TIPO_PRECIO</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="orden.TipoPrecio"></bcs-input-texto> -->
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_MONTO_SIN_COMISIONES</label>
			<bcs-input-monetario class="col-xs-4" k-ng-disabled="'true'"  decimales="instruccion.DecimalesMonto" simbolo="instruccion.IdMonedaLiquidacion" ng-model="instruccion.MontoNeto"></bcs-input-monetario>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_COBROS_TOTAL_GASTOS</label>
			<bcs-input-monetario class="col-xs-3" k-ng-disabled="'true'" decimales="instruccion.DecimalesMonto" simbolo="instruccion.IdMonedaLiquidacion" k-ng-model="instruccion.TotalCobros"></bcs-input-monetario>
		</div>
		
		<div class="row">
			<label class="col-xs-2" translate>UI_MONTO_TOTAL</label>
			<bcs-input-monetario class="col-xs-4" k-ng-disabled="'true'"  decimales="instruccion.DecimalesMonto" simbolo="instruccion.IdMonedaLiquidacion" ng-model="instruccion.MontoLiquidacion"></bcs-input-monetario>
		</div>

		<div class="row">
			<label class="col-xs-2" translate>UI_INTERMEDIARIO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.Intermediario"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_FOLIO_FACTURA</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="instruccion.FolioFactura"></bcs-input-texto>
		</div>
		<div class="row">
			<label class="col-xs-2" translate>UI_CANAL_INGRESO</label>
			<bcs-input-texto class="col-xs-4" k-ng-disabled="'true'" ng-model="instruccion.NombreCanalIngreso"></bcs-input-texto>
			<label class="col-xs-2 col-xs-offset-1" translate>UI_BOVEDA</label>
			<bcs-input-texto class="col-xs-3" k-ng-disabled="'true'" ng-model="instruccion.NombreBoveda"></bcs-input-texto>
		</div>
		<hr>
		<div class="row">
			<div class="col-xs-6">
				<label class="col-xs-4" translate>UI_COMENTARIO  </label>
			</div>
		</div>
		<div class="row">
			<div class="col-xs-12">
				<bcs-input-texto class="col-xs-12"
					tipo-campo="'textarea'"
					atributos="margin: 0px; height: 50px; width:100%; overflow: auto;"
					k-ng-disabled="'true'" 
					name="Comentario"
					ng-model="instruccion.Glosa" >
				</bcs-input-texto>
			</div>
		</div>
		<hr>
		<div class="row">
			<form id="formSubirArchivo" name="formSubirArchivo" class="col-xs-12 form-horizontal">
				<div class="row">
					<div class="col-xs-12">
						<label class="col-xs-4" translate>UI_DOCUMENTOS</label>
						<bcs-button id="UI_CERRAR" class="col-xs-1 pull-right" style="width: 15%;" bcs-tipo="'bcs-button-input-form'" bcs-habilitado="true"
							bcs-auto-desactivar="false" bcs-texto="'UI_CERRAR' | translate"
							bcs-clic="cerrarDetalle()"></bcs-button>
					</div>
					<div class="row">
						
					</div>
				</div>
				<div class="row">
					<div class="col-xs-6">
				  		<label class="col-xs-4" translate>UI_DESCRIPCION</label>
						<bcs-input-texto
							id="DetalleInstruccionForm_descripcionDocumento"
							class="col-xs-6"
							ng-model="formData.DescripcionDocumento"
							name="DescripcionDocumento">
						</bcs-input-texto>
					</div>
					<div class="col-xs-6">
		            	<input class="col-xs-4 custom-file-input-form" type="file" onchange="angular.element(this).scope().fileChanged(this)" id="file" name="file" ng-model="formData.file"></input>
						<div class="col-xs-4" style="height: 100%;
									position: relative;
									height: 30px;">
										<span id="nombreArchivoDetalleIns" style="
										font-weight: bold;
										font-size: 12px;
										position: absolute;
										top: 50%; 
										left: 50%; 
										width: 100%;
										transform: translate(-50%, -50%); 
										padding-left: 14px;
									">{{nombreArchivo}}</span>
									</div>
						<bcs-button id="DetalleInstruccionForm_subirArchivo" class="col-xs-2 pull-right" style="width: 30%;" bcs-tipo="'bcs-button-input-form'" bcs-auto-desactivar="false" bcs-habilitado="true" bcs-texto="'UI_SUBIR' | translate" bcs-clic="subirArchivo()"></bcs-button>
					</div>
				</div>
				
			</form>
		</div>
		<div class ="row">
			<bcs-grid 
				id="grid-listado-archivos"
			 	configuracion = "confGridArchivos"
				seleccionado = "seleccionArchivos"
				fn-exportar-excel = "exportarExcel">
			</bcs-grid>	
		</div>
		<div class="col-xs-12 alignButtonsToRight">
			<bcs-button id="DetalleInstruccionForm_descargarArchivo" class="col-xs-2" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-habilitado="seleccionArchivos" bcs-texto="'UI_DESCARGAR' | translate" bcs-clic="descargarArchivo()"></bcs-button>
			<bcs-button id="DetalleInstruccionForm_borrarArchivo" class="col-xs-2" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="false" bcs-habilitado="seleccionArchivos" bcs-texto="'UI_ELIMINAR' | translate" bcs-clic="borrarArchivo()"></bcs-button>
		</div>
	</div>
</div>

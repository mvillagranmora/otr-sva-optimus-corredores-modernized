<div class="row" ng-controller='OficializacionModalCtrl'>
	<!--- INICIO FORMULARIO -->
	<div class="row">
		<div class="col-xs-10">
			{{data.mensajeModal}}
		</div>
	</div>
	<div class="row"></div>
	<div class="row">
		<form class="col-xs-12 form-horizontal">
			<div class="row" style="min-height:100px">
				<table class="table">
				<thead>
					<tr>
						<th translate>UI_TITULO_OPERACION</th>
						<th translate>UI_TOTAL</th>
					</tr>
				</thead>
				<tbody>
					<tr ng-repeat="operacion in data.resumenOficializacion">
						<td>{{operacion.Titulo | translate}}</td>
						<td>{{operacion.Total}}</td>
					</tr>
				</tbody>
				</table>
			</div>
			<div class="row bcs-panel-comandos">
				<bcs-button bcs-habilitado="confirmarHabilitado" class="col-xs-2" bcs-tipo="'principal'" bcs-auto-desactivar="true" bcs-texto="'UI_CONFIRMAR' | translate" bcs-clic="confirmarOperacion()"></bcs-button>
				<bcs-button bcs-habilitado="'true'" class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="'false'" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
			</div>
		</form>
	</div>
	<!--- TERMINO FORMULARIO -->
</div>
<style>
	.alert{padding:0px; width:100%;}
</style>

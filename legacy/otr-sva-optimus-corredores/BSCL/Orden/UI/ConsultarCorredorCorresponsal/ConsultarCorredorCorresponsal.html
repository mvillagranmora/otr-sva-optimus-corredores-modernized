<div class="row" ng-controller="ConsultarCorredorCorresponsalCtrl">
	<div class="row bcs-cuerpo">
	 	<div class="row">
	  		<bcs-grid 
				configuracion="configuracion"
				seleccionado="seleccionCorresponsal"
				fn-click="consultarProductoCorredor(seleccionCorresponsal)">
			</bcs-grid>
		</div>
	 	<div class="row" ng-show="SesionLocale === 'PE'">
	  		<bcs-grid 
				configuracion="configuracionPlatillaProductos"
				seleccionado="seleccionado"
				fb-doble-click="modificarCorredorCorresponsal(seleccionado)"
				>
			</bcs-grid>
		</div>
		<div class="row bcs-panel-comandos">
			<div class="col-xs-12 alignButtonsToRight">
				<bcs-button  
					class="col-xs-2" 
					bcs-tipo="'bcs-button-secondary'"
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_MODIFICAR' | translate" 
					bcs-habilitado="SesionLocale === 'PE' ? seleccionado : seleccionCorresponsal"  
					bcs-clic="modificarCorredorCorresponsal((SesionLocale === 'PE' ? seleccionado : seleccionCorresponsal))">	
				</bcs-button>
				<bcs-button  
					class="col-xs-2" 
					bcs-tipo="'bcs-button-primary'"
					bcs-auto-desactivar="false" 
					bcs-habilitado="'true'"
					bcs-texto="'UI_INGRESAR' | translate" 	 
					bcs-clic="ingresarCorredorCorresponsal(seleccionCorresponsal)">	
				</bcs-button>
			</div>
		</div>
	</div>
</div>

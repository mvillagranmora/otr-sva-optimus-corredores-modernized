<div class="row" ng-controller='EnvioFacturarModalCtrl'>
	<!--- INICIO FORMULARIO -->
	<form class="col-xs-12 form-horizontal">
		<div class="row" style="min-height:100px">
			<table class="table">
			<thead>
				<tr>
					<th translate>UI_ASIGNACION</th>
					<th translate>UI_RESULTADO</th>
					<th translate>UI_MOVIMIENTO_GENERADO</th>
					<th translate>UI_MENSAJES</th>
				</tr>
			</thead>
			<tbody>
				<tr ng-repeat="asignacion in asignaciones">
					<td>{{asignacion.IdAsignacion}}</td>
					<td>{{asignacion.resultado | translate}}</td>
					<td>{{asignacion.IdMovimientoGenerado?asignacion.IdMovimientoGenerado:'------'}}</td>
					<td style="max-width:200px">{{asignacion.Mensajes?asignacion.Mensajes:'------'}}</td>
				</tr>
			</tbody>
			</table>
		</div>
		<div class="row bcs-panel-comandos">
			<bcs-button id="EnvioFacturarModal_EnviarFacturar" bcs-habilitado="confirmarHabilitado" class="col-xs-2" bcs-tipo="'principal'" bcs-auto-desactivar="true" bcs-texto="'UI_CONFIRMAR' | translate" bcs-clic="confirmarEnvioFacturar()"></bcs-button>
			<bcs-button bcs-habilitado="cerrarHabilitado" class="col-xs-2" bcs-tipo="''" bcs-auto-desactivar="'false'" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
		</div>
	</form>
	<!--- TERMINO FORMULARIO -->
</div>

<div class="row" ng-controller="AjustarTipoCambioModalCtrl">
    <form class="form-horizontal" name="AjustarTipoCambioModalForm">
        <div class="row">
            <div class="col-xs-12">
                <label class="col-xs-4" translate>UI_TIPO_CAMBIO</label>
                <bcs-input-numero 
                    class="col-xs-8" 
                    k-ng-model="asignacion.NuevoTipoCambio" 
                    change-event="calcularMontoFinal()">
                </bcs-input-numero>
            </div>  

            <div class="col-xs-12">
                <label class="col-xs-4" translate>UI_MONTO_FINAL</label>
                <bcs-input-numero 
                    class="col-xs-8" 
                    k-ng-disabled="true" 
                    k-ng-model="asignacion.NuevoMontoFinal">
                </bcs-input-numero>
            </div>
        </div> 
        
        <hr> 
        <div class="row bcs-panel-comandos alignButtonsToRight">
            <bcs-button 
                id="DetalleAsignacion_ajustarTipoCambio" 
                class="col-xs-4" 
                bcs-tipo="'bcs-button-primary'" 
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_GUARDAR' | translate"  
                bcs-habilitado="true" 
                bcs-clic="ajustarTipoCambio()">
            </bcs-button>
            <bcs-button 
                class="col-xs-4" 
                bcs-habilitado="'true'" 
                bcs-tipo="'bcs-button-secondary'" 
                bcs-auto-desactivar="false" 
                bcs-texto="'UI_CERRAR' | translate" 
                bcs-clic="cerrar()">
            </bcs-button>
        </div>
    </form>
</div>

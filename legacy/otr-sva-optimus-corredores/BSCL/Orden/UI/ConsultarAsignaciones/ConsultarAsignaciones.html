<div class="row" ng-controller='ConsultarAsignacionesCtrl' bcs-enter="buscarAsignaciones(apiGridAsignaciones,filtros)" tabindex="1">
	<!-- INICIO FILTROS -->
	<div class="row">
		<div class="col-xs-11">
			<div class="row">
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base
						id="cboClasificacionInstrumento"
						class="col-xs-8"
						tipo="'combobox-clasificacion-tipo-instrumento'"
						id-actual="filtros.IdClasificacionTipoInstrumento"
						cascada-a="data.filtrosTipoInstrumento.IdClasificacionTipoInstrumento"
						cascada-valor="'IdClasificacionTipoInstrumento'"
						cascada1-a="data.filtrosInstrumentos.IdClasificacionTipoInstrumento"
						cascada1-valor="'IdClasificacionTipoInstrumento'"
						item-post-filtro = "'1'"
						todos = "'S'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base
						id="cboTipoInstrumento"
						class="col-xs-8"
						tipo="'combobox-tipo-instrumento'"
						filtros="data.filtrosTipoInstrumento"
						id-actual="filtros.IdTipoInstrumento"
						cascada-a="data.filtrosOperacion.IdTipoInstrumento"
						cascada-valor="'IdTipoInstrumento'"
						cascada1-a="data.filtrosInstrumentos.IdTipoInstrumento"
						cascada1-valor="'IdTipoInstrumento'"
						todos = "'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_OPERACION</label>
					<bcs-combobox-base
						id="cboOperacion"
						class="col-xs-8"
						todos = "'S'"
						item-post-filtro = "'1'"
						tipo="'combobox-operacion'"
						id-actual="filtros.AccionOrden"
						filtros="data.filtrosOperacion"
						cascada-a="data.filtrosCondicionDeLiquidacion.AccionTipoOperacion"
						cascada-valor="'AccionOrden'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
					<bcs-combobox-base 
						id="cboInstrumento"
						class = "col-xs-8"
						tipo = "'combobox-instrumento'"
						seleccionado = "filtros.instrumento"
						id-actual = "filtros.buscarInstrumento"
						filtros = "data.filtrosInstrumentos">
					</bcs-combobox-base>
				</div>
			</div>
			
			<div class="row">
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_FECHA_ASIGNACION</label>
					<bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaDesde"></bcs-input-date>
					<bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaHasta"></bcs-input-date>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_CONDICION_LIQUIDACION</label>
					<bcs-combobox-base 
						class="col-xs-8"
						tipo="'combobox-condicion-liquidacion'"
						filtros="data.filtrosCondicionDeLiquidacion"
						id-actual="filtros.IdCondicionDeLiquidacion"
						todos = "'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base>						
				</div>
				<div class="col-xs-3"> 
					<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
				     <bcs-combobox-base class="col-xs-8"
						tipo="'combobox-libro-orden'"
						id-actual="filtros.IdLibroOrdenes"
						item-post-filtro = "'1'"
						todos="'S'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_BOLSA</label>
					<bcs-combobox-base 
				     	class="col-xs-8"
						tipo="'combobox-bolsa'"
						id-actual="filtros.IdBolsa"
						todos="'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base>
		    	</div>
			</div>
			
			<div class="row" ng-if="!MostrarProducto">
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base
						id="cboEstado" 
						class="col-xs-8"
						tipo="'combobox-estados-asignacion'"
						id-actual="filtros.IdEstadoAsignacion"
						todos = "'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-2" translate>UI_CLIENTE_PORTAFOLIO</label>
					<bcs-combobox-base 
						id="cboClientePortafolio"
						class="col-xs-9"
					 	tipo="'combobox-cliente-portafolio'"
					    id-actual="filtros.IdPortafolio">
					</bcs-combobox-base >
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_MONEDA</label>
					<bcs-combobox-base 
						class="col-xs-8"
						filtros = "data.filtrosMonedaNegociacion"
						tipo="'combobox-moneda'"
						id-actual="filtros.IdMoneda"
						todos = "'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base >
				</div>
			</div>
			
			<div class="row" ng-if="MostrarProducto">
				<div class="col-xs-6">
					<label class="col-xs-2" translate>UI_CLIENTE</label>
					<bcs-combobox-base
						class				= "col-xs-10"
						id					= "UI_CLIENTE"
						auto-cargar			= "'false'"
						tipo				= "'combobox-socio-negocio'"
						seleccionado		= "oSocioNegocio.seleccionado"
						filtros				= "oSocioNegocio.filtros"
						cascada-a			= "oPortafolio.filtros.IdCliente"
						cascada-valor		= "'IdCliente'"
						id-actual			= "oSocioNegocio.idActual">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-3">
				    <label class="col-xs-4" translate>UI_PRODUCTO</label>
				    <bcs-combobox-base
				    	class				= "col-xs-8"
				        id					= "UI_PRODUCTO"
				        auto-cargar			= "'true'"
				        tipo				= "'combobox-otro-producto-agrupador'"
				        seleccionado		= "oProducto.seleccionado"
						cascada-a			= "oPortafolio.filtros.IdProductoAgrupador"
						cascada-valor		= "'IdProductoAgrupador'"
						id-actual			= "oProducto.idActual">
				    </bcs-combobox-base >
				</div>
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_PORTAFOLIO</label> 
					<bcs-combobox-base
						class				= "col-xs-8"
						id					= "UI_PORTAFOLIO"
						auto-cargar			= "'false'"
						tipo				= "'combobox-portafolio'"
						seleccionado		= "oPortafolio.seleccionado"
						filtros				= "oPortafolio.filtros"
						id-actual			= "oPortafolio.idActual"
						activado			= "oSocioNegocio.seleccionado && oProducto.seleccionado">
					</bcs-combobox-base>
				</div>
			</div>
			
			<div class="row" ng-if="MostrarProducto">			
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_ESTADO</label>
					<bcs-combobox-base 
						class				= "col-xs-8"
						tipo				= "'combobox-estados-asignacion'"
						id-actual			= "filtros.IdEstadoAsignacion"
						todos				= "'S'"
						item-post-filtro	= "'1'">
					</bcs-combobox-base>
				</div>


			</div>
			<div class="row">
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_MARCA_ASIGNACION</label>
					<bcs-input-texto class="col-xs-8" ng-model="filtros.MarcaAsignacion"></bcs-input-texto>
				</div>
				
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_OPERADOR</label>
					<bcs-input-texto class="col-xs-8" ng-model="filtros.codigoOperador"></bcs-input-texto>
				</div>
			</div>
			<div class="col-xs-4">
                  <i id='toolConsultarAsignaciones' class="glosa-icono"></i>
                  <label translate>UI_GLOSA</label>
              </div>			
		</div>
		<!-- FIN FILTROS -->
		<!-- INICIO BOTONES -->
		<div class="col-xs-1">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="'true'"  bcs-clic="buscarAsignaciones(filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="'true'"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
		</div>
	</div>
	<!-- FIN BOTONES -->
	<div class="row">
		<bcs-grid id="grid-asignaciones"
			fn-exportar-excel = "exportarExcel"
			fn-doble-click="abrirDetalle(data.kNgModel)"
			seleccionado="data.kNgModel"
			configuracion="defaultOptionsNew">
		</bcs-grid>
	</div>
	<!-- INICIO PANEL COMANDOS -->
	<div class="row" style="margin-top: -5px;">
		<div class="col-xs-3 pull-right">
			<label translate class="row">UI_SUMA_MONTO_ASIGNADO</label><label style="margin-right: 5px;">:</label>{{sumaMonto}}
		</div>
		<div class="col-xs-3 pull-right">
			<label translate class="row">UI_SUMA_CANTIDAD_ASIGNADA</label><label style="margin-right: 5px;">:</label>{{sumaCantidad}}
		</div>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button bcs-tipo="'bcs-button-primary'" class="col-xs-1" bcs-auto-desactivar="'false'" bcs-texto="'Env. Facturar' | translate" id = "ConsultarAsignaciones_enviarFacturar"
			bcs-habilitado="data.ActivaBotonEnvAFac" bcs-clic="data.enviarFacturar(data.kNgModel)"></bcs-button>
		<bcs-button-dropdown bcs-tipo="'bcs-new-dropdown'" class="col-xs-2" id = "ConsultarAsignaciones_desasignar"
			opciones="data.opcionesDesasignacion"></bcs-button-dropdown>
		<bcs-button bcs-tipo="'bcs-button-secondary'" class="col-xs-2" bcs-auto-desactivar="'false'" bcs-texto="'UI_EXPORTAR_LIBRO' | translate"  id = "ConsultarAsignaciones_exportarLibro"
			bcs-habilitado="'true'" bcs-clic="exportarLibro()"></bcs-button>
		<bcs-button bcs-tipo="'bcs-button-secondary'" class="col-xs-1" style="width:125px" bcs-auto-desactivar="'false'" bcs-texto="'UI_MAPA_DE_RELACIONES' | translate" id = "ConsultarAsignaciones_mapaRelaciones"
			bcs-habilitado="data.kNgModel.length === 1" bcs-clic="verMapaRelaciones(data.kNgModel)"></bcs-button>
		<bcs-button bcs-tipo="'bcs-button-secondary'" class="col-xs-1" ng-show="SesionLocale==='PE'" bcs-auto-desactivar="'false'" bcs-texto="'UI_REASIGNAR' | translate" id = "ConsultarAsignaciones_reasignar"
			bcs-habilitado="data.ActivaBotonReasignar" bcs-clic="data.reasignarAsignaciones(data.kNgModel)"></bcs-button>
		<bcs-button bcs-tipo="'bcs-button-secondary'" class="col-xs-2" ng-show="data.AjustarDolarAsignacion" bcs-auto-desactivar="'false'" bcs-texto="'UI_AJUSTAR_TIPO_CAMBIO' | translate" id = "ConsultarAsignaciones_ajustarTipoCambio"
			bcs-habilitado="data.ActivaBotonAjustarDolarAsignacion" bcs-clic="data.ajustarTipoCambio()"></bcs-button>			
		
		<bcs-menu bcs-tipo="'bcs-button-secondary'" class="col-xs-1 pull-right" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
			<li ng-click="seleccionarTodo()">{{'UI_SELECCIONAR_TODO' | translate}}</li>
		</bcs-menu>
	</div>
	<!-- FIN PANEL COMANDOS -->
</div>

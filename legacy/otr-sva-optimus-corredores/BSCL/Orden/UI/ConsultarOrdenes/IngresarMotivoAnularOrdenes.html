<div ng-controller="IngresarMotivoAnularOrdenesCtrl">	
	<div class="row bcs-cuerpo">
		<form name="formIngresarMotivoAnularOrdenes" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_MOTIVO</label>
				<bcs-input-texto class="col-xs-8" bcs-requerido ng-model="motivo" ></bcs-input-texto>	
			</div>
			<div class="row"><br/></div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2" bcs-habilitado="formIngresarMotivoAnularOrdenes.$valid" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="aceptar()"></bcs-button>
		<bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

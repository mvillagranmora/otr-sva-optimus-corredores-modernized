<div class="row" ng-controller='OrdenesPorNegociarCtrl' bcs-enter="buscarOrdenes(apiGridOrdenes,filtros)" tabindex="1">
	<!-- INICIO FILTROS -->
<form name="OrdenesPorNegociarForm">
	<div class="row">
		<div class="col-xs-10">
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base
						tipo="'combobox-clasificacion-tipo-instrumento'"
						class="col-xs-8"
						id-defecto = "'RV'"
						filtros="filtrosClasificacionTipoInstrumento"
						id-actual="filtros.IdClasificacionTipoInstrumento"
						cascada-a="filtrosTipoInstrumento.IdClasificacionTipoInstrumento"
						cascada-valor="'IdClasificacionTipoInstrumento'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
					<bcs-combobox-base
						class="col-xs-8"
						tipo="'combobox-tipo-instrumento'"
						todos = "'S'"
						item-post-filtro = "'1'"
						filtros="filtrosTipoInstrumento"
						id-actual="filtros.IdTipoInstrumento"
						cascada-a="filtrosOperacion.IdTipoInstrumento"
						cascada-valor="'IdTipoInstrumento'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
					<bcs-input-instrumentos class="col-xs-8"
						bcs-requerido
						buscar-instrumento="filtros.buscarInstrumento"
						datos-instrumento="filtros.instrumento"
						filtro-clasificacion="filtros.IdClasificacionTipoInstrumento"
						filtro-tipo-instrumento="filtros.IdTipoInstrumento">
					</bcs-input-instrumentos>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_OPERACION</label>						
					<bcs-combobox-base
						class="col-xs-8"
						todos = "'S'"
						item-post-filtro = "'1'"
						tipo="'combobox-operacion'"
						id-actual="filtros.AccionOrden"
						filtros="filtrosOperacion">
					</bcs-combobox-base>						
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_FECHA_OPERACION</label>
					<bcs-input-date class="col-xs-8" k-ng-model="filtros.fechaOperacion"></bcs-input-date>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_BOLSA</label>
					<bcs-combobox-base class="col-xs-8"
						id 					="OrdenesPorNegociar.Bolsa" 
						todos 				="filtros.filtroBolsa.IdInstrumento.value === 0 ?'S':'N'"							
						tipo				="'combobox-bolsa-instrumento'"												
						seleccionado		="filtros.bolsaSeleccionada" 
						id-defecto			="filtros.bolsaDefecto"
						id-actual			="filtros.IdBolsa" 
						filtros				="filtros.filtroBolsa"
						item-post-filtro	= "'1'">
					</bcs-combobox-base>
				</div>
				
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_OPERADOR</label>
					<bcs-combobox-base
						class="col-xs-8"
						todos = "'S'"
						item-post-filtro = "'1'"
						tipo="'combobox-operador'"
						id-actual="filtros.Operador"
						filtros="filtrosOperador"
						cascada1-a="filtrosOperadorCarteraInversion.CodigoOperador"
						cascada1-valor="'CodigoOperador'"
						cascada2-a="filtrosOperadorCarteraEjecutivo.CodigoOperador"
						cascada2-valor="'CodigoOperador'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CARTERA_INVERSION</label>
					<bcs-combobox-base
						class="col-xs-8"
						todos = "'S'"
						item-post-filtro = "'1'"
						tipo="'combobox-operador-cartera-inversion'"
						id-actual="filtros.OperadorCarteraInversion"
						filtros="filtrosOperadorCarteraInversion">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CARTERAS_EJECUTIVO</label>
					<bcs-combobox-base
						class="col-xs-8"
						todos = "'S'"
						item-post-filtro = "'1'"
						tipo="'combobox-operador-cartera-ejecutivo'"
						id-actual="filtros.OperadorCarteraEjecutivo"
						filtros="filtrosOperadorCarteraEjecutivo">
					</bcs-combobox-base>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CONTRAPARTE</label>
					<bcs-combobox-base class="col-xs-8"
						id              ="OrdenesPorNegociar.Corredor"
						tipo            ="'combobox-corredor-corresponsal'"                         
						seleccionado    ="filtros.CorredorCorresponsalSeleccionada"
						id-actual       ="filtros.IdCorredorCorresponsal"
						filtros         ="filtros.filtroCorredorCorresponsal"                           
						item-post-filtro="'1'"
						todos           ="'S'">
					</bcs-combobox-base>
				</div>
			
				<div class="col-xs-4">
				<label class="col-xs-4" translate>UI_CANAL_INGRESO</label>
				<bcs-combobox-base class="col-xs-8"
					filtros = "filtros.filtrosCanalIngreso"
					tipo="'combobox-tipo-canal-ingreso'"
					id-actual="filtros.IdTipoCanalIngreso"
					todos = "'S'"
					item-post-filtro = "'1'">
				</bcs-combobox-base >
				</div>
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_MONEDA</label>
					<bcs-combobox-base 
						class="col-xs-8"
						filtros = "filtrosMonedaNegociacion"
						tipo="'combobox-moneda-negociacion'"
						id-actual="filtros.IdMoneda"
						todos = "'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base >
				</div>
				</div>
			<div class="row">
				<div class="col-xs-4">
					<label class="col-xs-4" translate>UI_CONDICION_LIQUIDACION</label>
					<bcs-combobox-base 
						class="col-xs-8"
						filtros = "datos.filtrosCondicionDeLiquidacion"
						tipo="'combobox-condicion-liquidacion'"
						id-actual="filtros.IdCondicionDeLiquidacion"
						todos = "'S'"
						item-post-filtro = "'1'">
					</bcs-combobox-base>
				</div>
			</div>
		</div>
		<!-- FIN FILTROS -->
		<!-- INICIO BOTONES -->
		<div class="col-xs-2">
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="true"  bcs-clic="buscarOrdenes(apiGridOrdenes,filtros)"></bcs-button>
			</div>
			<div class="row">
				<bcs-button class="col-xs-12" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button>
			</div>
		</div>
	</div>
</form>
<!-- FIN BOTONES -->
<div class="row">
	<new-bcs-grid id="grid-ordenes-por-negociar"
		fn-doble-click="abrirDetalle(ordenesSeleccionadas)"
		fn-exportar-excel = "exportarExcel"
		api = "apiGridOrdenes"
		seleccionado="ordenesSeleccionadas"
		configuracion="defaultOptionsNew">
	</new-bcs-grid>
</div>
	
	<!-- INICIO PANEL COMANDOS -->

<div class="row">
	<div class="col-xs-3 pull-right">
		<!-- <bcs-button  class="col-xs-6" bcs-auto-desactivar="'false'" bcs-texto="'UI_RUTEAR' | translate" bcs-habilitado="'true'"  bcs-clic="rutearOrdenes(ordenesSeleccionadas,operadorRuteo,bolsaRuteo)"></bcs-button> -->
		<bcs-button bcs-tipo="'bcs-button-primary'" class="col-xs-6 pull-right" bcs-auto-desactivar="'false'" bcs-texto="'UI_OFERTA_MANUAL' | translate" id="OrdenesPorNegociar_ofertaManual"
		bcs-habilitado="ordenesSeleccionadas"  bcs-clic="cantarOrdenes(ordenesSeleccionadas)"></bcs-button>
		<bcs-button class="col-xs-3 pull-right" ng-show="SesionLocal === 'PE'" bcs-auto-desactivar="'false'" bcs-texto="'UI_APROBAR_SOLICITUD' | translate" id="SolicitudPorAprobar"
		bcs-habilitado="ordenesSeleccionadas" bcs-tipo="'bcs-button-secondary'" bcs-clic="aprobarSolicitud(ordenesSeleccionadas)"></bcs-button>
		<bcs-button  class="col-xs-3 pull-right" bcs-tipo="'bcs-button-secondary'"  ng-show="SesionLocal === 'PE'" bcs-auto-desactivar="'false'" bcs-texto="'UI_RECHAZAR_SOLICITUD' | translate" id="SolicitudPorRechazar"
		bcs-habilitado="ordenesSeleccionadas"  bcs-clic="rechazarSolicitud(ordenesSeleccionadas)"></bcs-button>
	</div>
	
	<div class="col-xs-3">
		<table style="width: 250px;">
			<tr><td style="width: 30%"><strong translate>{{nemo}}</strong></td><td style="width: 30%"><label translate>UI_COMPRAS</label></td><td style="width: 30%"><label translate>UI_VENTAS</label></td></tr>
			
			<tr><td><label>Cantidad</label></td><td><label translate>{{sumaCompras}}</label></td><td><label translate>{{sumaVentas}}</label></td></tr>
			<tr><td><label translate>UI_PRECIO_MENOR</label></td><td><label translate>{{precioMenorCompras}}</label></td><td><label translate>{{precioMenorVentas}}</label></td></tr>
			<tr><td><label translate>UI_PRECIO_MAYOR</label></td><td><label translate>{{precioMayorCompras}}</label></td><td><label translate>{{precioMayorVentas}}</label></td></tr>
		</table>
	</div>

	<div class="col-xs-2">
		<label class="col-xs-9" translate>UI_REFRESCO_AUTOMATICO</label>
		<bcs-input-checkbox class="col-xs-2" ng-model="refrescoAutomatico">
	</div>
</div>
</div>

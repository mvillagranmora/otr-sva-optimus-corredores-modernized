<div id="VencimientoOrdenes" class="col-xs-12" ng-controller="VencimientoOrdenesCtrl">
    <div class="row bcs-cuerpo">
		<div class="row">  
			<label class="col-xs-4" translate>UI_FECHA_VENCIMIENTO</label>
				<bcs-input-date 
					class="col-xs-8" 
					bcs-requerido
					k-ng-disabled	= "'true'"
					k-ng-model		="data.kngFechaVencimientoOrdenes">
				</bcs-input-date>
			</div>
	</div>
	<hr>

	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id="VencimientoOrdenes" class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-habilitado="'true'" bcs-clic="VencimientoOrdenes()"></bcs-button>
		<bcs-button bcs-habilitado="'true'" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" 			bcs-auto-desactivar="'false'" bcs-texto="'UI_CERRAR' | translate" bcs-clic="cerrar()"></bcs-button>
	</div>
</div>

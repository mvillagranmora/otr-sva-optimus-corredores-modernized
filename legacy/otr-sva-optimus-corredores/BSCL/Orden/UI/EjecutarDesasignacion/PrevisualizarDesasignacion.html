<div ng-controller="PrevisualizarDesasignacionCtrl">
    <div class="row">
        <bcs-grid
        	id="grid-asignaciones"
            configuracion="confAsignaciones"
            seleccionado="seleccionAsignacion"
			api="apiAsignaciones"
			fn-exportar-excel="exportarExcel">
        </bcs-grid>
    </div>

	<div class="row bcs-panel-comandos">
		<bcs-menu
			class="col-xs-2 bcs-options-footer pull-right"
			bcs-habilitado="'true'"
			bcs-tipo="'bcs-button-secondary'"
			bcs-texto="'UI_OPCIONES' | translate">
			<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
		<bcs-button
			class="col-xs-2 bcs-options-footer pull-right"
			bcs-tipo="'bcs-button-primary'"
			bcs-auto-desactivar="'false'"
			bcs-texto="'UI_ACEPTAR' | translate"
			bcs-habilitado="'true'"
			bcs-clic="aceptar()">
		</bcs-button>
	</div>
</div>

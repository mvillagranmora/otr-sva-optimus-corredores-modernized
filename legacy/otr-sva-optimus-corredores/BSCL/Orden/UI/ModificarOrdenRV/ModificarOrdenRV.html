<div ng-controller="ModificarOrdenRVCtrl">	
	<div class="row bcs-cuerpo">
		<form name="formModificarOrdenRV">
			<div class="row">
				<label class="col-xs-4" translate>UI_CANTIDAD</label>
				<bcs-input-numero
					decimales = "0"
					class="col-xs-8" 
					bcs-requerido
					k-ng-model="cantidad">
				</bcs-input-numero> 
			</div>
			<div class="row"><br/></div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-2" bcs-habilitado="formModificarOrdenRV.$valid" bcs-tipo="'principal'" bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="aceptar()"></bcs-button>
		<bcs-button class="col-xs-2" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="cancelar()"></bcs-button>
	</div>
</div>

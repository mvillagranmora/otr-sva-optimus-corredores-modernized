<div id="ModalLibroOrdenesSegmento" ng-controller="ModalLibroOrdenesSegmentoCtrl as mloSeg">
	<div class="row bcs-cuerpo">
		<form name="formLibroOrdenesSegmento" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_SEGMENTO</label>
				<bcs-combobox-base class="col-xs-6"
					tipo="'combobox-tipo-segmento'" 
					id-actual="mloSeg.LibroOrdenesSegmento.IdSegmentoCliente" 
					id-defecto="mloSeg.LibroOrdenesSegmentoOriginal.IdSegmentoCliente"
					todos="'N'" 
					activado="true"
					bcs-requerido
					seleccionado="mloSeg.TipoSegmentoObj">
				</bcs-combobox-base>
		  	</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id={{mloSeg.IdBotonAceptar}} class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="formLibroOrdenesSegmento.$valid || !mloSeg.LibroOrdenesSegmento.modoCrear" 
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mloSeg.aceptar()">
		</bcs-button>
		<bcs-button id="ModalLibroOrdenesSegmento_cancelar" class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="'true'" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mloSeg.cancelar()">
		</bcs-button>
	</div>
</div>

<div id="ModalLibroOrdenes" ng-controller="ModalLibroOrdenesCtrl as modlo">
	<div class="row bcs-cuerpo">
		<form name="formLibroOrdenes" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_NOMBRE</label>
				<bcs-input-texto class="col-xs-8" ng-model="modlo.LibroOrdenes.NombreLibroOrdenes" bcs-requerido></bcs-input-texto>
			</div>
			<div class="row">
				<label class="col-xs-4" translate>UI_TIPO_LIBRO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-tipo-libro-orden'" 
					id-actual="modlo.LibroOrdenes.IdTipoLibroOrden" 
					id-defecto="modlo.LibroOrdenesOriginal.IdTipoLibroOrden"
					todos="'N'" 
					activado="true"
					bcs-requerido
					seleccionado="modlo.TipoLibroObj">
				</bcs-combobox-base>
		  	</div>
		  	<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
		  		<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
				<bcs-input-instrumentos class="col-xs-8"
					buscar-id-instrumento 	= "modlo.buscarInstrumento"
					datos-instrumento		="modlo.LibroOrdenes.instrumento"
					filtro-estado 			= "'ACT'"
					valida-flujo-custodia 	= "'N'">
				</bcs-input-instrumentos>
			</div>
			
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
		  		<label class="col-xs-4" translate>UI_CLIENTE_OFERTANTE</label>
				<bcs-combobox-base class = "col-xs-8"
					tipo = "'combobox-socio-negocio'"
				    filtros = "modlo.conf.oSocioNegocio.filtros"
				    id-actual = "modlo.LibroOrdenes.IdClienteOfertante"
					id-defecto = "modlo.LibroOrdenesOriginal.IdClienteOfertante">
				</bcs-combobox-base>
			</div>
			
			
			
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
				<label class="col-xs-4" translate>UI_CANTIDAD</label>
				<bcs-input-numero class="col-xs-2" k-ng-model="modlo.LibroOrdenes.Cantidad"></bcs-input-numero>
		  	</div>
		  	<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
				<label class="col-xs-4" translate>UI_FECHA_APERTURA</label>
				<bcs-input-date class="col-xs-2" k-ng-model="modlo.LibroOrdenes.FechaApertura"></bcs-input-date>
		  	</div>
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
				<label class="col-xs-4" translate>UI_FECHA_CIERRE</label>
				<bcs-input-date class="col-xs-2" k-ng-model="modlo.LibroOrdenes.FechaCierre"></bcs-input-date>
		  	</div>

		  	<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'N'">
		  		<label class="col-xs-4" translate>UI_ASIGNACION_AUTOMATICA</label>
				<bcs-input-checkbox ng-model="modlo.LibroOrdenes.AsignacionAutomatica"></bcs-input-checkbox>
			</div>
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'N'">
				<div ng-show="modlo.LibroOrdenes.AsignacionAutomatica">
					<label class="col-xs-4" translate>UI_PROCESO_ASIGNACION_AUTOMATICA</label>
					<bcs-combobox-base class="col-xs-8" 
						tipo="'combobox-tipo-asignacion'"
						id-actual="modlo.LibroOrdenes.IdTipoAsignacion" 
						id-defecto="modlo.LibroOrdenesOriginal.IdTipoAsignacion" 
						todos="'N'" 
						activado="true" 
						bcs-requerido="modlo.LibroOrdenes.AsignacionAutomatica != undefined && modlo.LibroOrdenes.AsignacionAutomatica"
						filtros="modlo.conf.oConfiguracionTipoAsignacion.filtros"
						seleccionado="modlo.TipoAsignacionObj">
					</bcs-combobox-base>
				</div>
		  	</div>
		  		
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
				<label class="col-xs-4" translate>UI_BOLSA</label>
				<bcs-combobox-base
					id 					= "modlo.LibroOrdenesBolsa" 
					class				="col-xs-8"					
					tipo				="'combobox-bolsa-instrumento'"					
					seleccionado		="modlo.LibroOrdenes.bolsaSeleccionada" 
					id-defecto			="modlo.LibroOrdenes.IdBolsa"
					id-actual			="modlo.LibroOrdenes.idBolsaSeleccionada" 
					filtros				="modlo.conf.oBolsa.filtros"
					item-post-filtro	= "'1'">
				</bcs-combobox-base>
			</div>
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
				<label class="col-xs-4" translate>UI_PRECIO</label>
				<bcs-input-numero class="col-xs-2" k-ng-model="modlo.LibroOrdenes.Precio" decimales="0"></bcs-input-numero>
			</div>
			<div class="row" ng-show="modlo.TipoLibroObj.EsLibroOfertaPublica === 'S'">
				<label class="col-xs-4" translate>UI_TIPO_SUBASTA</label>
				<bcs-input-checkgroup class="col-xs-8"
					valores = "modlo.ValoresTipoSubasta" 
					etiquetas = "modlo.EtiquetasTipoSubasta"
					modo = "U">
				</bcs-input-checkgroup>
			</div>

			<!--
			<div class="row">
				<label class="col-xs-4" translate>UI_PRIORIDAD</label>
				<bcs-input-numero class="col-xs-2" k-ng-model="modlo.LibroOrdenes.Prioridad" bcs-requerido decimales="0"></bcs-input-numero>
			</div>
			-->
			
			<div class="row">
				<label class="col-xs-4" translate>UI_ESTADO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-estados-libro-ordenes'" 
					id-actual="modlo.LibroOrdenes.IdEstado" 
					id-defecto="modlo.LibroOrdenesOriginal.IdEstado"
					todos="'N'" 
					activado="true"
					bcs-requerido 
					seleccionado="modlo.EstadoObj">
				</bcs-combobox-base>
		  	</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id="ModalLibroOrdenes_cancelar" bcs-tipo="'bcs-button-secondary'" class="col-xs-2" bcs-habilitado="'true'" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="modlo.cancelar()">
		</bcs-button>
		<bcs-button id={{modlo.IdBotonAceptar}} bcs-tipo="'bcs-button-primary'" class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="formLibroOrdenes.$valid" 
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="modlo.aceptar()">
		</bcs-button>
		</div>
</div>

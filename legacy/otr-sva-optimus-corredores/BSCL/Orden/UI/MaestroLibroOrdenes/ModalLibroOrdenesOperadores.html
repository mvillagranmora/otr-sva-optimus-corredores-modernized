<div id="ModalLibroOrdenesOperadores" ng-controller="ModalLibroOrdenesOperadoresCtrl as mloOpe">
	<div class="row bcs-cuerpo">
		<form name="formLibroOrdenesOperadores" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_OPERADOR</label>
				<bcs-combobox-base class="col-xs-6"
					tipo="'combobox-operador'" 
					id-actual="mloOpe.LibroOrdenesOperadores.CodigoOperador" 
					id-defecto="mloOpe.LibroOrdenesOperadoresOriginal.CodigoOperador"
					todos="'N'" 
					activado="true"
					bcs-requerido
					filtros="mloOpe.conf.oConfiguracionOperadores.filtros" 
					seleccionado="mloOpe.OperadorObj">
				</bcs-combobox-base>
		  	</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id={{mloOpe.IdBotonAceptar}} class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="formLibroOrdenesOperadores.$valid || !mloOpe.LibroOrdenesOperadores.modoCrear" 
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mloOpe.aceptar()">
		</bcs-button>
		<bcs-button id="ModalLibroOrdenesOperadores_cancelar" class="col-xs-2" bcs-habilitado="'true'" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mloOpe.cancelar()">
		</bcs-button>
	</div>
</div>

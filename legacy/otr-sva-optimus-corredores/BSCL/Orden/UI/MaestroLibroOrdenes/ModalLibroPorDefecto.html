<div id="ModalLibroPorDefecto" ng-controller="ModalLibroPorDefectoCtrl as modlpd">
	<div class="row" style="min-height:50px">
		<form name="formLibroPorDefecto" class="col-xs-12 form-horizontal">
			<div class="col-xs-12">
				<label class="col-xs-4" translate>UI_LIBRO_POR_DEFECTO</label>
				<bcs-combobox-base class="col-xs-8"
					tipo="'combobox-libro-orden'" 
					id-actual="modlpd.LibroPorDefecto.IdLibroOrdenes" 
					id-defecto="modlpd.LibroPorDefecto.IdLibroOrdenes"
					filtros = "modlpd.filtros"
					bcs-requerido>
				</bcs-combobox-base>
		  	</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos alignButtonsToRight">
		<bcs-button id="ModalLibroPorDefecto_cancelar" class="col-xs-3" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="modlpd.cancelar()">
		</bcs-button>
		<bcs-button id="ModalLibroPorDefecto_aceptar" class="col-xs-3" bcs-tipo="'bcs-button-primary'" bcs-habilitado="formLibroPorDefecto.$valid || !modlpd.LibroPorDefecto.modoCrear" 
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="modlpd.aceptar()">
		</bcs-button>
	</div>
</div>

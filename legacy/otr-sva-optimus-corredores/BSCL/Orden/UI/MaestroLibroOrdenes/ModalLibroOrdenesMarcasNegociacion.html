<div id="ModalLibroOrdenesMarcasNegociacion" ng-controller="ModalLibroOrdenesMarcasNegociacionCtrl as mloMN">
	<div class="row bcs-cuerpo">
		<form name="formLibroOrdenesMarcasNegociacion" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-4" translate>UI_MARCA_NEGOCACION</label>
				<bcs-input-texto class="col-xs-8" ng-model="mloMN.LibroOrdenesMarcasNegociacion.MarcaNegociacion" bcs-requerido></bcs-input-texto>
		  	</div>
		</form>
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id={{mloMN.IdBotonAceptar}} class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="formLibroOrdenesMarcasNegociacion.$valid || !mloMN.LibroOrdenesMarcasNegociacion.modoCrear" 
			bcs-auto-desactivar="false" bcs-texto="'UI_ACEPTAR' | translate" bcs-clic="mloMN.aceptar()">
		</bcs-button>
		<bcs-button id="ModalLibroOrdenesMarcasNegociacion_cancelar" class="col-xs-2" bcs-tipo="'principal'" bcs-habilitado="'true'" 
			bcs-auto-desactivar="false" bcs-texto="'UI_CANCELAR' | translate" bcs-clic="mloMN.cancelar()">
		</bcs-button>
	</div>
</div>

<div class="row" ng-controller='ConsultarTransaccionesCtrl' bcs-enter="datosForm.buscarTransacciones()" tabindex="1">
	<div class="row" >
		<div class="row">
			<div class="col-xs-11">
				<div class="row">
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_CLASIFICACION</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-clasificacion-tipo-instrumento'"
							id-actual="datosBusqueda.IdClasificacionTipoInstrumento"
							cascada-a="datosForm.filtrosTipoInstrumento.IdClasificacionTipoInstrumento"
							cascada-valor="'IdClasificacionTipoInstrumento'"
							cascada1-a="datosForm.filtrosInstrumentos.IdClasificacionTipoInstrumento"
							cascada1-valor="'IdClasificacionTipoInstrumento'"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_TIPO_INSTRUMENTO</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-tipo-instrumento'"
							id-actual="datosBusqueda.IdTipoInstrumento"
							filtros = "datosForm.filtrosTipoInstrumento"
							cascada-a="datosForm.filtrosOperacion.IdTipoInstrumento"
							cascada-valor="'IdTipoInstrumento'"
							cascada1-a="datosForm.filtrosInstrumentos.IdTipoInstrumento"
							cascada1-valor="'IdTipoInstrumento'"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_OPERACION</label>
						<bcs-combobox-base
							class="col-xs-8"
							tipo="'combobox-operacion'"
							id-actual="datosBusqueda.AccionOrden"
							filtros = "datosForm.filtrosOperacion"
							todos = "'S'"
							item-post-filtro = "'1'"
							cascada-a="datosForm.filtrosCondicionDeLiquidacion.AccionTipoOperacion"
							cascada-valor="'AccionOrden'">
						</bcs-combobox-base>
					</div>
					
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_INSTRUMENTO</label>
						<bcs-combobox-base 
							class = "col-xs-8"
							tipo = "'combobox-instrumento'"
							seleccionado = "datosBusqueda.instrumento"
							id-actual = "datosBusqueda.setInstrumento"
							filtros = "datosForm.filtrosInstrumentos">
						</bcs-combobox-base>
					</div>
			    </div>
			    
			    <div class="row">
				    <div class="col-xs-3">
						<label class="col-xs-4" translate>UI_FECHA_TRANSACCION</label>
						<bcs-input-date class="col-xs-4" k-ng-model="datosBusqueda.fechaDesde"></bcs-input-date>
						<bcs-input-date class="col-xs-4" k-ng-model="datosBusqueda.fechaHasta"></bcs-input-date>
					</div>
					
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_CONDICION_LIQUIDACION</label>
						<bcs-combobox-base 
							class="col-xs-8"
							filtros = "datosForm.filtrosCondicionDeLiquidacion"
							tipo="'combobox-condicion-liquidacion'"
							id-actual="datosBusqueda.IdCondicionDeLiquidacion"
							todos = "'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base >
					</div>
					
				    <div class="col-xs-3">
						<label class="col-xs-4" translate>UI_LIBRO_ORDENES</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-libro-orden'"
							id-actual="datosBusqueda.IdLibroOrdenes"
							todos="'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
					</div>
					
					<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_BOLSA</label>
						<bcs-combobox-base 
					     	class="col-xs-8"
							tipo="'combobox-bolsa'"
							id-actual="datosBusqueda.IdBolsa"
							todos="'S'"
							item-post-filtro = "'1'">
						</bcs-combobox-base>
			    	</div>
			    </div>
			    <div class="row ">
			    	<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_MARCA_NEGOCIACION</label>
						<bcs-input-texto class="col-xs-8" ng-model="datosBusqueda.marcaNegociacion"></bcs-input-texto>
					</div>
			    	<div class="col-xs-2">
				    	<label class="col-xs-8" translate>UI_VENTA_CORTA</label>
						<bcs-input-checkbox 
					     	class="col-xs-1"
					     	ng-model="datosBusqueda.EsVentaCorta">
						</bcs-input-checkbox>
			    	</div>
			    	<div class="col-xs-2">
				    	<label class="col-xs-10" translate>UI_TRANSACCIONES_CON_SALDO</label>
						<bcs-input-checkbox 
					     	class="col-xs-1"
					     	ng-model="datosBusqueda.TransaccionesConSaldo">
						</bcs-input-checkbox>
			    	</div>
					<div class="col-xs-2">
				    	<label class="col-xs-10" translate>UI_TRANSACCIONES_RERSERVADAS</label>
						<bcs-input-checkbox 
					     	class="col-xs-1"
					     	ng-model="datosBusqueda.TransaccionesReservadas">
						</bcs-input-checkbox>
			    	</div>
			    	<div class="col-xs-3">
						<label class="col-xs-4" translate>UI_OPERADOR</label>
						<bcs-input-texto class="col-xs-8" ng-model="datosBusqueda.codigoOperador"></bcs-input-texto>
					</div>
			    </div>		
			    
				<div class="col-xs-4">
                   <i id='toolConsultarTransacciones' class="glosa-icono"></i>
                   <label translate>UI_GLOSA</label>
               </div>	                
			    
			    		    
			</div>
			<div class="col-xs-1">
			    <div class="row">
					<bcs-button class="col-xs-12" 
						bcs-tipo="'bcs-button-search'"  
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_BUSCAR' | translate" 
						bcs-habilitado="true" 
						bcs-clic="datosForm.buscarTransacciones()" >
					</bcs-button>
				</div>
				<div class="row">
					<bcs-button class="col-xs-12" 
						bcs-tipo="'bcs-button-secondary'" 
						bcs-auto-desactivar="false" 
						bcs-texto="'UI_LIMPIAR' | translate" 
						bcs-habilitado="true"  
						bcs-clic="datosForm.limpiarFiltros()">
					</bcs-button>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<bcs-grid id="grid-transacciones"
			fn-doble-click="datosForm.abrirDetalle(datosForm.kNgModel)"
			api = "datosForm.apiGridTransacciones"
			fn-exportar-excel = "datosForm.exportarExcel"
			seleccionado="datosForm.kNgModel"
			configuracion="datosForm.defaultOptionsNew">
		</bcs-grid>
	</div>
<div class="row" style="margin-top: -5px;">
	<div class="col-xs-3 pull-right">
		<label translate class="row">UI_SUMA_MONTO</label><label style="margin-right: 5px;">:</label>{{sumaMonto}}
	</div>
	<div class="col-xs-3 pull-right">
		<label translate class="row">UI_SUMA_CANTIDAD</label><label style="margin-right: 5px;">:</label>{{sumaCantidad}}
	</div>
</div>
	<div class="row bcs-panel-comandos">
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-primary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_INGRESAR' | translate" id = "ConsultarTransacciones_ingresarTransaccion"
			bcs-habilitado="'true'" bcs-clic="datosForm.crearTransaccion()"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_MODIFICAR' | translate" id = "ConsultarTransacciones_modificarTransaccion"
			bcs-habilitado="datosForm.kNgModel && datosForm.kNgModel[0].IdSistemaBursatil === 'MANUAL' && datosForm.kNgModel.length === 1" bcs-clic="datosForm.modificarTransaccion(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ANULAR' | translate" id = "ConsultarTransacciones_anularTransaccion"
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.anularTransacciones(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_RESERVAR' | translate" id = "ConsultarTransacciones_reservarTransaccion"
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.reservar(datosForm.kNgModel)"></bcs-button>
		<bcs-button-dropdown class="col-xs-1" bcs-tipo="'bcs-new-dropdown'" id = "ConsultarTransacciones_liberarTransaccion"
			opciones="datosForm.opcionesLiberacion"></bcs-button-dropdown>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ASIGNAR' | translate" id = "ConsultarTransacciones_asignarTransaccion"
			bcs-habilitado="datosForm.kNgModel" bcs-clic="datosForm.asignar(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ASIG_RAPIDA' | translate" id = "ConsultarTransacciones_asigRapidaTransaccion"
			bcs-habilitado="datosForm.kNgModel && datosForm.UsaFechaLiquidacionEnVencimiento !== undefined" bcs-clic="datosForm.asignacionRapida(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" bcs-auto-desactivar="'false'" bcs-texto="'UI_ASIG_GRUPO' | translate" id = "ConsultarTransacciones_asigGrupoTransaccion"
			bcs-habilitado="datosForm.kNgModel && datosForm.UsaFechaLiquidacionEnVencimiento !== undefined" bcs-clic="datosForm.asignacionGrupo(datosForm.kNgModel)"></bcs-button>
		<bcs-button  class="col-xs-1" bcs-tipo="'bcs-button-secondary'" style="width:125px" bcs-auto-desactivar="'false'" bcs-texto="'UI_MAPA_DE_RELACIONES' | translate" id = "ConsultarTransacciones_mapaRelaciones"
			bcs-habilitado="datosForm.kNgModel.length === 1" bcs-clic="datosForm.verMapaRelaciones(datosForm.kNgModel)"></bcs-button>		
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="datosForm.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
            <li ng-click="datosForm.seleccionarTodo()">{{'UI_SELECCIONAR_TODO' | translate}}</li>
		</bcs-menu>
	</div>
</div>

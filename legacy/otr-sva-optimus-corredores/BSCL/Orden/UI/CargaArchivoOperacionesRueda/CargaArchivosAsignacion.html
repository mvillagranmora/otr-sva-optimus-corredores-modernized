<div ng-controller="CargaArchivosAsignacionCtrl">	
	<div class="row bcs-cuerpo" style="min-height:100px">
		<form name="formGenerarInforme" class="col-xs-12 form-horizontal">
			<div class="row">
				<label class="col-xs-2" translate>UI_TIPO_CARGA</label>
				<bcs-input-texto class="col-xs-10" k-ng-disabled = "'true'" ng-model="nombreTipoCarga"></bcs-input-texto>
			</div>
			<div class="row" >
				<label class="col-xs-2" translate>UI_FORMATO</label>
				<label class="col-xs-10" style = "font-style: italic">{{formatoCarga}}</label>
			</div>
			<div class="row" >
				<label class="col-xs-2" translate>UI_EJEMPLO_LINEA</label>
				<label class="col-xs-10" style = "font-style: italic">{{ejemploCarga}}</label>
			</div>
			<br/>
			<hr/>
			<div class="row alignButtonsToRight">
				<bcs-button class="col-xs-3 " 
					bcs-habilitado="'true'" 
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_CARGAR_ARCHIVO' | translate" 
					bcs-clic="cargarArchivo()">
				</bcs-button>
		
			</div>
		</form>
	</div>
	
</div>

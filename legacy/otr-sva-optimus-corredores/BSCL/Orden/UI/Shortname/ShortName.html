<div class="col-xs-12" ng-controller="Shortname as shortN">
	<div class="row bcs-cuerpo">
		<form id="FormshortN" name="FormshortN" class="filters-formulario">
		    <div class="row">
       				<div class="row">
	       				<bcs-grid 
	       					id="grid-shortNames"
	       					fn-exportar-excel = "exportarExcel"  
							configuracion="shortN.gridShortNames"
							fn-doble-click="shortN.win.editarShortName(shortN.selShortName)"
							seleccionado="shortN.selShortName">
						</bcs-grid>
					</div>
					<div class="row col-xs-12 bcs-panel-comandos">
						<div class="row">
							<div class="col-xs-8">
								<bcs-button  
									class="col-xs-3 " 
									bcs-tipo="'bcs-button-primary'" 	
									ng-if="shortN.win.muestraCrear" 	
									bcs-mostrar="shortN.win.muestraCrear"  	
									bcs-auto-desactivar="false" 
									bcs-habilitado="'true'"
									bcs-texto="'UI_NUEVO' | translate"
									id="Editar_ShortName" 	 
									bcs-clic="shortN.win.crearShortName();">	
								</bcs-button>
								<bcs-button  
									class="col-xs-2" 
									bcs-tipo="'bcs-button-secondary'"  	
									ng-if="shortN.win.muestraEditar" 	
									bcs-mostrar="shortN.win.muestraEditar"  	
									bcs-auto-desactivar="false" 
									bcs-texto="'UI_EDITAR' | translate" 
									bcs-habilitado="shortN.selShortName"
									id="Editar_ShortName"  
									bcs-clic="shortN.win.editarShortName(shortN.selShortName);">	
								</bcs-button>
							</div>
							<bcs-menu class="col-xs-2 pull-right" bcs-tipo="'bcs-button-secondary'"  bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
								<li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
							</bcs-menu>
						</div>
					</div>
			</div>
		</form>
	</div>
</div>

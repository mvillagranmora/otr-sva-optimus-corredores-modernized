<div class="row" ng-controller="GenerarInformeEstadisticasCtrl">
	<div class="col-xs-12 bcs-cuerpo">
		<form name="PanelSolicitudInformeEstadisticas" class="filters-formulario">
			
			
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-4" translate>UI_FECHA_ORDEN</label>
					<bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaDesde"></bcs-input-date>
					<bcs-input-date class="col-xs-4" k-ng-model="filtros.fechaHasta"></bcs-input-date>
				</div>
			</div>		

						
			<div class="row" style="padding-top: 20px;">
			<div class=col-xs-12>
				<bcs-button
					class				= "col-xs-5 pull-right"
					id					= "btnGenerarInformeEstadisticas" 
					bcs-tipo			= "'bcs-button-primary'" 
					bcs-auto-desactivar	= "false" 
					bcs-habilitado		="'true'" 
					bcs-texto			= "'UI_GENERAR_INFORME' | translate"
					bcs-clic			= "generarInformeEstadistica()">
			</bcs-button>	
			</div>	
		</div>
		</form>
	</div>
</div>

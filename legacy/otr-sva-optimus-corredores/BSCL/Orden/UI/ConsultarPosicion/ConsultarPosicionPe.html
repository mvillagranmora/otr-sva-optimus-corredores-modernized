<div class="row" ng-controller='ConsultarPosicionPeCtrl'>
	<div class="row">
		<form name = "ConsultarPosicionPeFrm">
			<div class="col-xs-11">
				<div class="col-xs-3">
					<label class="col-xs-4" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base
						class="col-xs-8"
						filtros = "datosForm.filtrosClasificacion"
						tipo="'combobox-clasificacion-tipo-instrumento'"
						id-actual="datosForm.IdClasificacionTipoInstrumento"
						bcs-requerido
						id-defecto = "'RV'">
					</bcs-combobox-base>
				</div>		
			</div>
			<div class="col-xs-1">
				
				<bcs-button class="col-xs-12" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="ConsultarPosicionPeFrm.$valid" 
					bcs-clic="datosForm.buscar()" >
				</bcs-button>
				
			
			</div>
		</form>
	</div>

	<div class="row">
		<bcs-grid id="grid-posicion"
			api = "datosForm.apiGridPosicion"
			seleccionado = "datosForm.seleccionado"
			fn-doble-click = "datosForm.consultarDemanda()"
			configuracion="datosForm.confGridPosicion">
		</bcs-grid>
	</div>
	
	<div class="row">
		<bcs-button class="col-xs-1" 
			bcs-auto-desactivar="false"
			bcs-tipo = "'principal'"
			bcs-texto="'UI_DEMANDA' | translate" 
			bcs-habilitado="datosForm.seleccionado" 
			bcs-clic="datosForm.consultarDemanda()" >
		</bcs-button>
	</div>
	
	
	
</div>

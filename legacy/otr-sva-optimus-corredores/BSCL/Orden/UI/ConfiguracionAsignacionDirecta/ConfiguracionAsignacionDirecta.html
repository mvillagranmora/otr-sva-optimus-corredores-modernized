<div class="row" ng-controller="asignacionDirectaCtrl as asDir">
    <div class="row">
        <label class="col-xs-12 k-window-subtitle" translate>UI_CONFIGURACION</label>	
        <table class="table col-xs-12">
            <thead>
                <tr>
                    <td width="5%"  translate>UI_CODIGO</td>
                    <td width="50%"  translate>UI_TIPO_INSTRUMENTO</td>
                    <td width="15%"  translate>UI_ASIGNACION_AUTOMATICA</td>
                    <td width="15%"  translate>UI_MOV_FACTURAR_AUTOMATICO</td>
                    <td width="15%"  translate>UI_COMPROBANTE_AUTOMATICO</td>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="val in asDir.datosDespues">
                    <td>{{val.IdTipoInstrumento}}</td>
                    <td>{{val.NombreTipoInstrumento}}</td>
                    <td>
                        <bcs-input-checkbox ng-model="val.AsignacionAuto" ng-click="asDir.cambiarAsignacionAuto(val)" ></bcs-input-checkbox>
                    </td>
                    <td>
                        <bcs-input-checkbox ng-model="val.MovimientoFacturarAuto" ng-click="asDir.cambiarMovimientoFacturarAuto(val)" ></bcs-input-checkbox>
                    </td>
                    <td>
                        <bcs-input-checkbox ng-model="val.ComprobanteAuto" ng-click="asDir.cambiarComprobanteAuto(val)"></bcs-input-checkbox>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <hr>
    <div class="row col-xs-12 bcs-panel-comandos">
        <bcs-button class="col-xs-2 pull-right" 
            bcs-tipo="'bcs-button-primary'" 
            bcs-auto-desactivar="false" 
            bcs-texto="'UI_GUARDAR' | translate" 
            bcs-habilitado="true"
            bcs-clic="asDir.win.guardar();">
        </bcs-button>
        <bcs-button class="col-xs-2 pull-right" 
            bcs-tipo="'bcs-button-secondary'" 
            bcs-auto-desactivar="false" 
            bcs-texto="'UI_CANCELAR' | translate" 
            bcs-habilitado="'true'" 
            bcs-clic="asDir.win.cancelar();">
        </bcs-button>
    </div>
</div>

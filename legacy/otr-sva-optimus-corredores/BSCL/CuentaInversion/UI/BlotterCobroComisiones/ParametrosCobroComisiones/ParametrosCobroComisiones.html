<div class="row" ng-controller='ParametrosCobroComisionesCtrl as pcc'>

			<div class="col-xs-12">
				<span>{{UI_GESTION_INTERFACES|translate}}</span>
			</div>
		</div>
		<div class="col-xs-12 bcs-cuerpo">
			<div  class="row">
				<uib-tabset>

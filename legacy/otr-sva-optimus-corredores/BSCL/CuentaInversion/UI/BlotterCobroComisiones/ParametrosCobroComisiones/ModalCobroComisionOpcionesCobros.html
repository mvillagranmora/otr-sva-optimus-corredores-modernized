<div class="row" ng-controller="ModalCobroComisionOpcionesCobrosCtrl as modccoc">
	<label class="col-xs-12" ><span>{{titulo}}<span></label>
	<div class="row">
		<form name="frmModalCobroComisionOpcionesCobros" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_OPCIONES_COBRO</label>
					<bcs-combobox-base 
							id="modccoc.OpcionCobro"
							class="col-xs-9"
							bcs-requerido
							auto-cargar   	= "true"									
							tipo          	= "modccoc.OpcionCobro.tipo"
							id-actual     	= "modccoc.OpcionCobro.idActual"													
							configuracion	= "modccoc.OpcionCobro.configuracion"
							seleccionado  	= "modccoc.OpcionCobro.seleccionado"							
							filtros       	= "modccoc.OpcionCobro.filtros"
							id-post-filtro	= "modccoc.OpcionCobro.idPostFiltro"
					>
					</bcs-combobox-base>	
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12">
			  		<label class="col-xs-3" translate>UI_PORTAFOLIO_APV</label>
					<bcs-input-checkbox 
					 	class="col-xs-9"
						ng-model="modccoc.PortafolioAPV" 
						id="formCobroComisionOpcionesCobros_PortafolioAPV"
					>
					</bcs-input-checkbox>					
				</div>
		  	</div>
		  	<div class = "row">
				<div class = "col-xs-12">
					<label class="col-xs-3" translate>UI_CLASIFICACION</label>
					<bcs-combobox-base 
							id="modccoc.Mercado"
							class="col-xs-9"
							bcs-requerido
							auto-cargar   	= "true"									
							tipo          	= "modccoc.Mercado.tipo"
							id-actual     	= "modccoc.Mercado.idActual"													
							configuracion	= "modccoc.Mercado.configuracion"
							seleccionado  	= "modccoc.Mercado.seleccionado"							
							filtros       	= "modccoc.Mercado.filtros"
							id-post-filtro	= "modccoc.Mercado.idPostFiltro"
					>
					</bcs-combobox-base>	
				</div>
			</div>
			<div class="row">
				<div class = "col-xs-12">
			  		<label class="col-xs-3" translate>UI_PORCENTAJE_COBRO</label>
					<bcs-input-numero 
						class="col-xs-9" 
						decimales = "4" 
						k-ng-model="modccoc.PorcentajeCobro"
						id="formCobroComisionOpcionesCobros_PorcentajeCobro"
					>
					</bcs-input-numero>
									
				</div>
			</div>
			<div class="row">
				<div class = "col-xs-12">
			  		<label class="col-xs-3" translate>UI_ESTADO</label>
					<bcs-combobox-base 
							id="modccoc.Estado"
							class="col-xs-9"
							bcs-requerido
							auto-cargar   	= "true"									
							tipo          	= "modccoc.Estado.tipo"
							id-actual     	= "modccoc.Estado.idActual"													
							configuracion	= "modccoc.Estado.configuracion"
							seleccionado  	= "modccoc.Estado.seleccionado"							
							filtros       	= "modccoc.Estado.filtros"
							id-post-filtro	= "modccoc.Estado.idPostFiltro"
					>
					</bcs-combobox-base>	
				</div>
		  	</div> 
			<div class="row">
				<div class = "col-xs-12">
					<label class="col-xs-3" translate>UI_FECHA_VIGENCIA_DESDE</label>
					<bcs-input-date 
						class="col-xs-9" 
						k-ng-model="modccoc.filtro.FechaDesde" 
						k-options="modccoc.optionsFechaVigencia"
						bcs-requerido
					>
					</bcs-input-date>
					
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button 
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="frmModalCobroComisionOpcionesCobros.$valid"
			bcs-clic="modccoc.guardar();">
		</bcs-button>
		<bcs-button 
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modccoc.cancelar();">
		</bcs-button>
	</div>
</div>

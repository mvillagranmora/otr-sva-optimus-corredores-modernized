<div id="PanelCobroComisionConceptos" class="row" ng-controller='PanelCobroComisionConceptosCtrl as pccc'>
	<form name="formCobroComisionConceptos" class="filters-formulario">
		<div class="row">
			<bcs-grid
			 	configuracion="pccc.conceptosCobroComisionOptions"
				seleccionado="pccc.conceptosSeleccionados"
				api = "kwidget"
				fn-exportar-excel = "exportarExcel">		
			</bcs-grid>
		</div>
		<div class="row bcs-panel-comandos">
			<div class="col-xs-9 pull-left">
				<bcs-button class="col-xs-2 id="PanelCobroComisionConceptos_IngresarExclusion" 
					bcs-tipo="'bcs-button-primary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_INGRESAR' | translate" 
					bcs-habilitado="'true'" 
					bcs-clic="pccc.ingresarConcepto()">
				</bcs-button>
				<bcs-button class="col-xs-2" id="PanelCobroComisionConceptos_EliminarExclusion" 
					bcs-tipo="'bcs-button-secondary'" 
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_ELIMINAR' | translate" 
					bcs-habilitado="pccc.conceptosSeleccionados && pccc.conceptosSeleccionados.length > 0" 
					bcs-clic="pccc.eliminar(pccc.conceptosSeleccionados)">
				</bcs-button>
			</div>
			<div class="col-xs-1"></div>
			<div class="col-xs-2">
				<bcs-menu bcs-habilitado="'true'" bcs-tipo="'bcs-button-secondary'" bcs-texto="'UI_OPCIONES' | translate" >
		           <li ng-click="exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
				</bcs-menu>
			</div>
				
		</div>
	</form>
</div>

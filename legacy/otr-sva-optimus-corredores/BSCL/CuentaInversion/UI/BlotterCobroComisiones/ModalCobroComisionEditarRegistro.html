<div class="row" ng-controller="ModalCobroComisionOpcionesCobrosCtrl as modccoc">
	<label class="col-xs-12" ><span>{{titulo}}<span></label>
	<div class="row">
		<form name="frmModalCobroComisionOpcionesCobros" class="col-xs-12">
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_CLIENTE</label>
						<bcs-input-texto class="col-xs-9"
							id				="ClienteCobroComisiones" 
							ng-model		="modccoc.cliente" 
							k-ng-disabled	="'true'">
						</bcs-input-texto>
				</div>	
			</div>
			<div class="row">
				<div class="col-xs-12">
					<label class="col-xs-3" translate>UI_PORTAFOLIO</label>
					<bcs-input-texto class="col-xs-9"
						id				="PortafolioCobroComisiones"
						ng-model		="modccoc.datosEntrada.Portafolio" 
						k-ng-disabled	="'true'">
					</bcs-input-texto>				
				</div>
		  	</div>
			<div class="row">
				<div class = "col-xs-12">
			  		<label class="col-xs-3" translate>UI_MONTO_COMISION</label>
					<bcs-input-numero 
						class="col-xs-9"  
						k-ng-model="modccoc.datosEntrada.MontoComision"
						id="formCobroComisionOpcionesCobrosMontoComision"
						decimales = "0" 	
					>
					</bcs-input-numero>
									
				</div>
			</div>
		</form>
	</div>
	<hr>
	<div class="row bcs-panel-comandos">
		<bcs-button 
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-primary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_GUARDAR' | translate" 
			bcs-habilitado="true"
			bcs-clic="modccoc.guardar();">
		</bcs-button>
		<bcs-button 
			class="col-xs-3 pull-right" 
			bcs-tipo="'bcs-button-secondary'"  
			bcs-auto-desactivar="false" 
			bcs-texto="'UI_CANCELAR' | translate" 
			bcs-habilitado="true"  
			bcs-clic="modccoc.cancelar();">
		</bcs-button>
	</div>
</div>

<div class="row" ng-controller='LiquidarSaldoCtrl'>
	<form name="frmLiquidarSaldo"  class="col-xs-12 form-horizontal">

		<div class="row bcs-cuerpo">
		
			<div class="row" style="padding-bottom: 10px"> 
				<div class="col-xs-6">
					<label translate class="col-xs-3">UI_CLIENTE_PORTAFOLIO</label>
					<bcs-combobox-base id = "frmCartolaMovimiento_clientePortafolio" class="col-xs-9"
						bcs-requerido
						auto-cargar		 = "'false'"
						muestra-enlace 	 = "'S'"
						tipo			 = "'combobox-cliente-portafolio'"
						id-actual		 = "data.oConfiguracionPortafolio.idActual"								
						filtros			 = "data.oConfiguracionPortafolio.filtros"
						seleccionado	 = "data.oConfiguracionPortafolio.seleccionado"
						configuracion	 = "data.oConfiguracionPortafolio.configuracion"						
						item-post-filtro = "'1'"
						cascada1-a		 = "data.oConfiguracionCuentaBancoSocioNegocio.filtros.IdPersona"
						cascada1-valor	 = "'IdPersona'">
					</bcs-combobox-base>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-3" style="padding-left: 15px" translate>UI_FECHA_CONSULTA</label>
					<bcs-input-date id="frmLiquidarSaldo_FechaConsulta" class="col-xs-9"
						k-ng-model		= "data.kngFechaSistema" 
						ng-model		= "data.FechaSistema"
						k-ng-disabled 	= "'false'">
					</bcs-input-date>
				</div>
			</div>
			<div id="gridSaldoCuentas" class="row" style="height: 120px">
				<div class="col-xs-12">
					<bcs-grid id="frmLiquidarSaldo_gridSaldosCuentas"
						configuracion = "confBasicaSaldosCuentas"
						seleccionado  = "seleccionSaldosCuentas"
						fn-click      = "cambiarCuentaInversion(seleccionSaldosCuentas)">
					</bcs-grid>
				</div>
			</div>
			
			
			<!-- MEDIO DE PAGO -->
			<div class="row">
				<div class="col-xs-12">
				
					<div class="row k-window-subtitle">
						<div class="col-xs-6">
						   <label class="k-window-subtitle" translate>UI_PAGO_CON</label>
						</div>
						<div class="col-xs-6" ng-show="data.showCamposCuentaBancariaSocioNegocio">
						   <label class="k-window-subtitle" translate>UI_DESTINO</label> (<label translate>UI_CLIENTE</label>)
						</div>						
					</div>
					
					<div class="row">
						<!-- PAGO CON -->
						<div class="col-xs-6">
							<div class="col-xs-12" style="padding-bottom: 3px;">
								<label class="col-xs-4" translate>UI_MEDIOS_DE_PAGO</label>					
								<bcs-combobox-base class="col-xs-8" id="frmLiquidarSaldo_MedioDePago"
									bcs-requerido
									tipo			= "data.oConfiguracionMedioDePago.tipo" 
									configuracion	= "data.oConfiguracionMedioDePago.configuracion" 				
									seleccionado	= "data.oConfiguracionMedioDePago.seleccionado"
									id-actual		= "data.oConfiguracionMedioDePago.idActual"
									filtros			= "data.oConfiguracionMedioDePago.filtros" 								
									cascada1-a		= "data.oConfiguracionModalidadPago.filtros.IdMedioDePago"
									cascada1-valor	= "'IdMedioDePago'"				
									item-post-filtro= "'-1'">
								</bcs-combobox-base>
							</div>
							
							<div class="col-xs-12" style="padding-bottom: 3px;">
								<label class="col-xs-4" translate>UI_MODALIDAD</label>
								<bcs-combobox-base class="col-xs-8" id="frmLiquidarSaldo_ModalidadPago"
									bcs-requerido
									auto-cargar		= "'false'"
									tipo			= "data.oConfiguracionModalidadPago.tipo" 
									configuracion	= "data.oConfiguracionModalidadPago.configuracion" 				
									seleccionado	= "data.oConfiguracionModalidadPago.seleccionado"
									id-actual		= "data.oConfiguracionModalidadPago.idActual"
									filtros			= "data.oConfiguracionModalidadPago.filtros"									
									item-post-filtro="'-1'">
								</bcs-combobox-base>
							</div>
							
							<div class="col-xs-12" style="padding-bottom: 3px;">
								<label class="col-xs-4" translate>UI_MONTO</label>					
								<bcs-input-monetario class="col-xs-8" id="frmLiquidarSaldo_MontoFormaPago"
									bcs-requerido
									k-ng-model		= "data.kngMontoFormaPago"
									k-ng-disabled 	= 'data.montoFormaPagoDisabled'
									simbolo			= "data.montoFormaPagoSimbolo" 
									decimales		= "data.montoFormaPagoDecimales">
								</bcs-input-monetario>										
							</div>
						
						</div>
						<!-- FIN PAGO CON -->
						
						<!-- INICIO DESTINO (CLIENTE) -->
						<div class="col-xs-6">
							<!-- Datos cuenta bancaria del cliente -->
							<div class="col-xs-12" ng-show="data.showCamposCuentaBancariaSocioNegocio">
									<div class="col-xs-12" style="padding-bottom: 3px;">
										<label class="col-xs-4" translate>UI_CUENTAS_BANCARIAS</label>
										<bcs-combobox-base class="col-xs-8" id="frmLiquidarSaldo_CuentaBancariaSocioNegocio"
										    auto-cargar		= "'false'"
											bcs-requerido	= "data.showCamposCuentaBancariaSocioNegocio"
											tipo			= "data.oConfiguracionCuentaBancoSocioNegocio.tipo" 
											configuracion	= "data.oConfiguracionCuentaBancoSocioNegocio.configuracion" 				
											seleccionado	= "data.oConfiguracionCuentaBancoSocioNegocio.seleccionado"
											filtros			= "data.oConfiguracionCuentaBancoSocioNegocio.filtros" 
											id-actual		= "data.oConfiguracionCuentaBancoSocioNegocio.idActual">
										</bcs-combobox-base>
									</div>

									<div class="col-xs-12" style="padding-bottom: 3px;">
										<label class="col-xs-4" translate>UI_TIPO_CUENTA_BANCARIA</label>									
										<bcs-input-texto class="col-xs-8" id="frmLiquidarSaldo_TipoCuentaSocio" ng-model="data.TipoCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>
									</div>

									<div class="col-xs-12" style="padding-bottom: 3px;">
										<label class="col-xs-4" translate>UI_BANCO</label>									
										<bcs-input-texto class="col-xs-8" id="frmLiquidarSaldo_BancoCuentaSocio" ng-model="data.BancoCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>
									</div>

									<div class="col-xs-12" style="padding-bottom: 3px;">
										<label class="col-xs-4" translate>UI_NUMERO_CUENTA</label>									
										<bcs-input-texto class="col-xs-8" id="frmLiquidarSaldo_NumeroCuentaSocio" ng-model="data.NumeroCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>																	
									</div>

									<div class="col-xs-12" style="padding-bottom: 3px;">
										<label class="col-xs-4" translate>UI_MONEDA</label>									
										<bcs-input-texto class="col-xs-8" id="frmLiquidarSaldo_MonedaCuentaSocio" ng-model="data.MonedaCuentaSocio" k-ng-disabled="'true'"></bcs-input-texto>
									</div>
							</div>
							<!-- Fin Datos cuenta bancaria del cliente -->
						</div>			
						<!-- FIN DESTINO (CLIENTE) -->			
					</div>	
				</div>
			</div>
			<!-- FIN MEDIO DE PAGO -->
			
			
			<!-- GRILLA FORMA DE PAGO -->			
			<div class="row" style="padding-top: 5px" >
				<div class="row">
					<bcs-button id="frmLiquidarSaldo_BtnAgregar"  class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-primary'"     bcs-auto-desactivar="false" bcs-texto="'UI_AGREGAR' | translate"   bcs-habilitado="frmLiquidarSaldo.$valid"  bcs-clic="agregarFormaPago()"></bcs-button>					
					<bcs-button id="frmLiquidarSaldo_BtnEliminar" class="col-xs-2 pull-right"   bcs-tipo="'bcs-button-secondary'"          	 bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate"    bcs-habilitado="seleccionFormaDePago" bcs-clic="eliminarFormaPago()"></bcs-button>
				</div>
							
	      		<div class="row">
					<bcs-grid  id	   = "frmLiquidarSaldo_gridFormaDePago"
						configuracion  = "confBasicaFormaDePago"						
						seleccionado   = "seleccionFormaDePago">
					</bcs-grid>	
				</div>
			</div>
			<!-- FIN GRILLA FORMA DE PAGO -->
			
			
			<div class="row">
				<div class="row alignButtonsToRight">					
					<bcs-button id="frmLiquidarSaldo_BtnLiquidar"  class="col-xs-2"   bcs-tipo="'bcs-button-primary'"     bcs-auto-desactivar="false" bcs-texto="'UI_LIQUIDAR' | translate" bcs-habilitado="btnLiquidarHabilitado" bcs-clic="liquidarSaldo()"></bcs-button>
				</div>
			</div>
		</div>			

	</form>	
</div>

             <bcs-grid

				seleccionado="datos.kNgModel"
				fn-exportar-excel = "exportarExcel">	
			</bcs-grid>

		<div class="row bcs-panel-comandos" style="margin-bottom: -20px;padding-top: 7px !important;">

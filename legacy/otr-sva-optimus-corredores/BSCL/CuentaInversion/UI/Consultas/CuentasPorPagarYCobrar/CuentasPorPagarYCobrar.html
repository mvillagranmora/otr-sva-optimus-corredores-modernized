<div ng-controller="CuentasPorPagarYCobrarCtrl">
    <div class="row bcs-cuerpo" ng-form="frmCuentasPorPagarYCobrar">

        <div class="row">	
			<div class="col-xs-10">					
				<div class="row">	
					<div class="col-xs-8">
						<label class="col-xs-3" translate>UI_EJECUTIVO</label>
						<bcs-combobox-base id="frmCuentasPorPagarYCobrar_Ejecutivo" class="col-xs-9"
							auto-cargar="'true'"
							tipo="oConfiguracionEjecutivo.tipo"
							configuracion= "oConfiguracionEjecutivo.configuracion" 
							id-actual="oConfiguracionEjecutivo.idActual" 
							seleccionado="oConfiguracionEjecutivo.seleccionado"
							filtros="oConfiguracionEjecutivo.filtros"
							todos="'S'"  item-post-filtro="'1'"
						></bcs-combobox-base >						
					</div>
					<div class="col-xs-4">	
							
						<label class="col-xs-4" style="padding-left: 10px" translate>UI_FECHA_CONSULTA</label>
						<bcs-input-date id="frmCuentasPorPagarYCobrar_FECHA_CONSULTA" class="col-xs-8" style="padding-left: 8px" bcs-requerido
							k-ng-model="kngFechaEfectiva" 
							ng-model="FechaEfectiva">
						</bcs-input-date>
					</div>				
				</div>

				<div class="row">
					<div class="col-xs-8">
						<label translate class="col-xs-3">UI_CLIENTE_PORTAFOLIO</label>
						<bcs-combobox-base id = "frmCuentasPorPagarYCobrar_clientePortafolio" class="col-xs-9"
							auto-cargar="'true'"
							muestra-enlace = "'S'"
							carga-cliente-automatico="'S'"
							tipo="'combobox-cliente-portafolio'"
							id-actual="oConfiguracionPortafolio.idActual"						 	
						    filtros="oConfiguracionPortafolio.filtros"
						    seleccionado="oConfiguracionPortafolio.seleccionado"
						    configuracion= "oConfiguracionPortafolio.configuracion"
							item-post-filtro="'1'">
						</bcs-combobox-base>
					</div>
					<div class="col-xs-4">
						<div class="col-xs-6" style="padding-left: 10px">
							<label class="col-xs-10" translate>UI_CUENTA_POR_COBRAR</label>
							<input type="checkbox" class="col-xs-2" id="frmCuentasPorPagarYCobrar_CuentaPorCobrar" ng-model="ngCuentaPorCobrar">
						</div>
						<div class="col-xs-6">
							<label class="col-xs-10" translate>UI_CUENTA_POR_PAGAR</label>
							<input type="checkbox" class="col-xs-2" id="frmCuentasPorPagarYCobrar_CuentaPorPagar" ng-model="ngCuentaPorPagar">
						</div>
					</div>
				</div>
			</div>

			<div class="col-xs-2">
				<div class="row"><bcs-button class="col-xs-12" id="frmCuentasPorPagarYCobrar_BUSCAR" bcs-tipo="'bcs-button-search'"  bcs-auto-desactivar="false" bcs-texto="'UI_BUSCAR' | translate" bcs-habilitado="frmCuentasPorPagarYCobrar.$valid"  bcs-clic="buscarMovimientos()"></bcs-button></div>
				<div class="row"><bcs-button class="col-xs-12" id="frmCuentasPorPagarYCobrar_LIMPIAR" bcs-tipo="'bcs-button-secondary'"  bcs-auto-desactivar="false" bcs-texto="'UI_LIMPIAR' | translate" bcs-habilitado="true"  bcs-clic="limpiarFiltros()"></bcs-button></div>
			</div>
		</div>

		<div class="row">
            <bcs-grid id="frmCuentasPorPagarYCobrar_gridCuentasPagaryCobrar"
                configuracion = "confBasicCuentasPagaryCobrar"
                seleccionado = "seleccionCuentasPagaryCobrar"
                fn-exportar-excel="excelCuentasPagaryCobrar">
            </bcs-grid>
        </div>
		
		<div class="row bcs-panel-comandos" ng-show="SesionLocale == 'PE'">
			<bcs-menu class="col-xs-1 pull-right" id="frmCuentasPorPagarYCobrar_OpcionesSaldo" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
			   <li ng-click="generarArchivoAnexo13DetalleSaldosClientes()" >{{'UI_ANEXO13_DETALLE_SALDOS_CLIENTES' | translate}}</li>
			</bcs-menu>
		</div>
    </div>
</div>

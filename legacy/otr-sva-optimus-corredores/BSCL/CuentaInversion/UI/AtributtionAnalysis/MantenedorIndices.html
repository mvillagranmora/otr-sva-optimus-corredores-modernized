<div class="row" ng-controller='MantenedorIndicesCorrCtrl'>
	
			<div class="col-xs-12 row alignButtonsToRight">
				<bcs-button class="col-xs-1" 
					bcs-tipo="'bcs-button-search'"  
					bcs-auto-desactivar="false" 
					bcs-texto="'UI_BUSCAR' | translate" 
					bcs-habilitado="true"  
					bcs-clic="formData.buscar(filtros)">
				</bcs-button>					
			</div> 	
    <br>
    <br>
	<!-- FIN BOTONES -->
	<div class="row" style="padding-top: 5px;">
		<bcs-grid
			api = "formData.apiGrid"
			fn-exportar-excel="formData.exportarExcel"
			seleccionado = "formData.registroSeleccionado"
			configuracion="formData.defaultOptions">
		</bcs-grid>
	</div>
	<!-- INICIO PANEL COMANDOS -->

	<div class="row bcs-panel-comandos">
		<bcs-button id="ConsultarParidades_guardar" bcs-tipo="'bcs-button-primary'"   class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_GUARDAR' | translate" bcs-clic="formData.guardar()"></bcs-button>
		<bcs-button id="ConsultarParidades_ingresar" bcs-tipo="'bcs-button-secondary'"   class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_CREAR' | translate" bcs-clic="formData.crear()"></bcs-button>
		<bcs-button id="ConsultarParidades_eliminar" bcs-tipo="'bcs-button-secondary'" class="col-xs-1" bcs-habilitado="'true'" bcs-auto-desactivar="false" bcs-texto="'UI_ELIMINAR' | translate" bcs-clic="formData.eliminar(formData.registroSeleccionado)"></bcs-button>
		<bcs-menu class="col-xs-1 pull-right" bcs-tipo="'bcs-button-secondary'" bcs-habilitado="'true'" bcs-texto="'UI_OPCIONES' | translate" >
            <li ng-click="formData.exportarExcel()">{{'UI_EXPORTAR_EXCEL' | translate}}</li>
		</bcs-menu>
	</div>
	
	
  	

</div>

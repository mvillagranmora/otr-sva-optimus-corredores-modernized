<div ng-controller="ConsultaAtributtionInformeController">
    <div class="col-xs-10">
        <div class="row">
            <label class="col-xs-3" translate>UI_CLIENTE</label>
            <bcs-combobox-base class="col-xs-8"
                id="UI_CLIENTE"
                auto-cargar="'false'"
                bcs-requerido
                tipo="'combobox-socio-negocio'"
                filtros="configSocioNegocio.filtros"
                cascada1-a="configPortafolio.filtros.IdCliente"
                cascada1-valor="'IdCliente'"
                cascada2-a="configGrupoPortafolio.filtros.IdCliente"
                cascada2-valor="'IdCliente'"
                cascada-defecto="'-1'"
                id-actual="IdCliente"
                seleccionado="ClienteSeleccionado">
            </bcs-combobox-base>
        </div>
        
        <div class="row">
            <label class="col-xs-3" translate>UI_PORTAFOLIO</label>
            <bcs-combobox-base class="col-xs-8"
                id="UI_PORTAFOLIO"
                auto-cargar="'false'"
                todos ="'S'"
                bcs-requerido
                tipo="'combobox-portafolio'"
                filtros="configPortafolio.filtros"
                item-post-filtro="'1'"
                id-actual="IdPortafolio"
                activado="!GrupoPortafoliosSeleccionado"
                seleccionado="PortafolioSeleccionado">
            </bcs-combobox-base>
        </div>
        
        <div class="row">
            <label class="col-xs-3" translate>UI_GRUPOS_DE_CLIENTES</label>
            <bcs-combobox-base class="col-xs-8"
                id="UI_GRUPO_PORTAFOLIOS"
                auto-cargar="'false'"
                bcs-requerido
                tipo="'combobox-estado-grupo-clientes-activos'"
                filtros="configGrupoPortafolio.filtros"
                id-actual="IdGrupo"
                usa-filtros-completos="'S'"
                seleccionado="GrupoPortafoliosSeleccionado">
            </bcs-combobox-base>
        </div>        
        
        <div class="row">
            <label class="col-xs-3" translate>UI_PERIODO</label>
             <bcs-input-date class="col-xs-4" k-ng-model="AnoDesde"></bcs-input-date>
             <bcs-input-date class="col-xs-4" k-ng-model="AnoHasta"></bcs-input-date>
        </div>
        
        <div class="row">
        <label class="row col-xs-3" translate>UI_MONEDA</label>
		<bcs-combobox-base 
			class="row col-xs-8"
			id="MonedaInforme"
			auto-cargar="'true'"
			id-post-filtro="'CLP'"
			tipo = "'combobox-moneda'"							
			seleccionado="MonedaInforme.seleccionado"
			filtros="MonedaInforme.filtroMoneda"
   	        id-actual="MonedaInforme.idActual">
		</bcs-combobox-base>
		</div>
    </div>
    
    <div class="col-xs-2">
        <div class="row">
            <bcs-button
				bcs-tipo="'bcs-button-search'"
				bcs-auto-desactivar="false"
				bcs-texto="'UI_BUSCAR' | translate"
				bcs-habilitado="'true'"
				bcs-clic="buscarInformeAtributtion()">
			</bcs-button>
        </div>
        <div class="row">
            <bcs-button
				bcs-tipo="'bcs-button-secondary'"
				bcs-auto-desactivar="'false'"
				bcs-texto="'UI_LIMPIAR' | translate"
				bcs-habilitado="'true'"
				bcs-clic="limpiarFiltros()">
			</bcs-button>
        </div>
    </div>
    
    <div class="col-xs-12">
        <bcs-grid id="gridInformeAtributtion"
            configuracion="configuracionGrillaDescargaInformeAtributtion"
            seleccionado="InformeSeleccionado"
            >
        </bcs-grid>
    </div>
    
    <div class="row bcs-panel-comandos">
		<bcs-button class="col-xs-3 pull-right" style="padding-top: 4px;"
            bcs-tipo="'bcs-button-primary'"
            bcs-auto-desactivar="'false'"
            bcs-texto="'UI_INFORME' | translate"
            bcs-habilitado="true"
            ng-show = "'true'"
            bcs-clic="solicitarInforme()">
        </bcs-button>
    </div>
</div>

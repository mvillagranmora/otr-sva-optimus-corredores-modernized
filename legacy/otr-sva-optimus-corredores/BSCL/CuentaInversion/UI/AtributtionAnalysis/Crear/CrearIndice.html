<div id="CrearIndice" ng-controller='CrearIndicesCtrl'>
	<div class="row bcs-cuerpo">
		<form name="FormCreaIndice" class="filters-formulario">
		  <div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_INDICE</label>  <!-- Pasar el nombre cuando se seleccione en el combo -->
				<bcs-input-texto										
					class		= "col-xs-9"
					bcs-requerido = "'true'"
					foco		= "true"
					ng-model	= "formData.Indice"
					key-enter	= "">
				</bcs-input-texto>
			</div>
		 </div>
		  <div class="row">
			<div class="col-xs-12">
	    		<label class="col-xs-3" translate>UI_NOMBRE</label>  <!-- Pasar el nombre cuando se seleccione en el combo -->
				<bcs-input-texto 
				class		= "col-xs-9"
				bcs-requerido = "'true'"
				foco		= "true"
				ng-model	= "formData.NombreIndice"
				key-enter	= "">
				</bcs-input-texto>
			</div>
		 </div>
		 	<div class="row">
				<div class="col-xs-12">
		    		<label class="col-xs-3" translate>UI_DESCRIPCION</label>  <!-- Pasar el nombre cuando se seleccione en el combo -->
					<bcs-input-texto 
					class		= "col-xs-9"
					bcs-requerido = "'true'"
					foco		= "true"
					ng-model	= "formData.DescripcionIndice"
					key-enter	= "">
					</bcs-input-texto>
				</div>
		 </div>	
		  <div class="row">
	            <div class="col-xs-12">
	                  <label class="col-xs-3" translate>UI_MONEDA</label>
	                  <bcs-combobox-base
	                        class="col-xs-9"
	                        tipo="data.getConfigComboboxMonedaParametro.tipo"
	                        id-actual="filtros.monedaparametro"
	                        seleccionado="filtros.MonedaParametroObj"
	                        filtros="data.oConfiguracionMonedaParametro.filtros"
	                        configuracion= "data.oConfiguracionMonedaParametro.configuracion"
	                        >
	                  </bcs-combobox-base>
	            </div>
            </div>
		 <div class="row">
	            <div class="col-xs-12" ng-show='false'>
	                  <label class="col-xs-3" translate>UI_MONEDA</label>
	                  <bcs-combobox-base
	                        class="col-xs-9"
	                        tipo="data.getConfigComboboxMonedaValor.tipo"
	                        id-actual="filtros.monedavalor"
	                        seleccionado="filtros.MonedaValorObj"
	                        filtros="data.oConfiguracionMonedaValor.filtros"
	                        configuracion= "data.oConfiguracionMonedaValor.configuracion"
	                        >
	                  </bcs-combobox-base>
	            </div>
            </div>
		 </form>			  
		  
		<div class="row">
			<div class="col-xs-12 alignButtonsToRight">
				<bcs-button
					class				= "col-xs-2"
					id					= "btn_creaindice" 
					bcs-tipo			= "'bcs-button-primary'" 
					bcs-auto-desactivar	= "false" 
					bcs-texto			= "'UI_CREAR' | translate" 
					bcs-habilitado		= "FormCreaIndice.$valid" 
					bcs-clic			= "CrearIndice('C')">
			</bcs-button>	
			</div>	
		</div>
	</div>
</div>

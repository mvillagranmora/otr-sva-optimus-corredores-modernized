<div class="row" ng-controller="GenearReporteAntiguedadDeudaCtrl">
    <div class="row">
        <div class="col-xs-12">
            <div class="row">
                <label class="col-xs-4 titulo" translate>UI_NUEVO_REPORTE</label>
            </div>
        </div>
        <form>
            <div class="col-xs-12">
                <div class="row">
                    <div class="col-xs-6 row">
                        <label class="col-xs-4" translate>UI_FECHA</label>
                        <bcs-input-date 
                            class		    ="col-xs-8" 
                            k-ng-model	    ="filtros.fechaTopeArchivoGenerar"
                            k-options		="filtros.kOptFechaDeposito">
                        </bcs-input-date>
                    </div>
                    <div class="col-xs-6 row">
                        <label class="col-xs-4" translate>UI_MONEDA</label>	
                        <bcs-combobox-base
                                class					= "col-xs-8"
                                id						= "frmCtaInvEjecutivo_CUENTAINVERSION"
                                auto-cargar				= "'true'"
                                usa-filtros-completos	= "'S'"
                                tipo					= "filtros.oConfiguracionCuentaInversion.tipo"  
                                configuracion			= "filtros.oConfiguracionCuentaInversion.configuracion" 
                                id-actual				= "filtros.oConfiguracionCuentaInversion.idActual" 
                                seleccionado			= "filtros.oConfiguracionCuentaInversion.seleccionado"
                                filtros					= "filtros.oConfiguracionCuentaInversion.filtros"
                                todos					= "'S'"
                                item-post-filtro		= "'1'"
                                bcs-requerido>
                        </bcs-combobox-base>			  			  	  
                    </div>
                </div>
                <div class="row">
                    <div class="col-xs-3">
                        <bcs-input-checkbox 
                        ng-model="filtros.ngAgrupaPortafolios"
                        ng-disabled	= "filtros.AgrupaPortafoliosDeshabilitado">
                        </bcs-input-checkbox>&nbsp;{{'UI_AGRUPA_PORTAFOLIOS' | translate}}
                    </div>
                    <div class="col-xs-3">
                        <bcs-input-checkbox 
                        ng-model	= "filtros.ngConsolidar"
                        ng-disabled	= "filtros.ConsolidarDeshabilitado">
                        </bcs-input-checkbox>&nbsp;{{'UI_CONSOLIDAR' | translate}}
                    </div>
                    <div class="col-xs-3"></div>
                </div>
            </div>	
        </form>
        <div class="col-xs-12">
            
            <div class="row alignButtonsToRight ">
                
                <div class="col-xs-5">
                    <bcs-button 
                        class				="row col-xs-7" 
                        bcs-tipo			="'bcs-button-primary'"  
                        bcs-auto-desactivar	="false" 
                        bcs-texto			="'UI_GENERAR_REPORTE' | translate" 
                        bcs-habilitado		="filtros.parametrosValidosParaNuevoReporte.valido"  
                        bcs-clic			="generarReporte()">
                    </bcs-button>
                    <bcs-button 
                        class				="row col-xs-5 " 
                        bcs-tipo			="'bcs-button-secondary'"  
                        bcs-auto-desactivar	="false" 
                        bcs-texto			="'UI_LIMPIAR' | translate" 
                        bcs-habilitado		="true"  
                        bcs-clic			="limpiaFiltrosGenerarReporte()">
                    </bcs-button>
                </div>
                
            </div>
        </div>
    </div>
</div>

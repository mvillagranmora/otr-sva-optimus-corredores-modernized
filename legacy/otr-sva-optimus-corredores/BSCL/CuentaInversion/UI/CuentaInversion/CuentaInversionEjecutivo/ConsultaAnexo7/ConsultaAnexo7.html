<div id="anexo7" ng-controller='ConsultaAnexo7Ctrl as anexo7'>
	<div class="row">
		<!-- INICIO FILTROS -->
			<div class="row">
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_TIPO_CONSULTA</label>
					<bcs-combobox-base class="col-xs-7"
			  			tipo="'combobox-tipo-indice-anexo7'"
			  			id-actual="anexo7.filtros.tipoIndice"
			  			id-defecto="'ME'"
			  			filtros="anexo7.filtroTipoIndice.Codigo"
			  			todos="'N'">
			  		</bcs-combobox-base>
				</div>
				<div class="col-xs-6">
					<label class="col-xs-4" translate>UI_PERIODO</label>
					<bcs-input-date
						class="col-xs-7"
						id="anexo7_Periodo"
						k-options="anexo7.configuracionPeriodo"
						k-ng-model="anexo7.filtros.periodo"
						todo-dias="'true'">
					</bcs-input-date>
				</div>
			</div>
		<!-- FIN FILTROS -->
	</div>
	<div class="row bcs-panel-comandos">
		<bcs-button id="anexo7_generar" bcs-tipo="'principal'" bcs-habilitado="true" class="col-xs-3" bcs-auto-desactivar="false" bcs-texto="'UI_GENERAR' | translate" bcs-clic="anexo7.generar()"></bcs-button>
	</div>
</div>

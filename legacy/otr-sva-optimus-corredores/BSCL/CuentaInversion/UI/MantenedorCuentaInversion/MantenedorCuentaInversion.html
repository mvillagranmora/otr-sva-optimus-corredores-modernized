<div class="row" ng-controller='MantenedorCuentaInversionCtrl'>
	<div class="row no-margin" ng-form="frmMantenedorCuentaInversion">		
		

        <div class="col-xs-7">
            <bcs-grid id="frmMantenedorCuentaInversion_gridSocioNegocio"
                configuracion = "confSocioDeNegocio"
                seleccionado = "seleccionSocioDeNegocio">
            </bcs-grid>          
        </div>

        <div class="col-xs-5" style="padding-left: 10px;">
            <bcs-grid id="frmMantenedorCuentaInversion_gridMonedasCuentaInversion"
                configuracion = "confMonedaClienteCuentaInversion"
                seleccionado = "seleccionMonedaClienteCuentaInversion">
            </bcs-grid>

            <div class="row bcs-panel-comando" style="padding-top: 8px;">		
                <div class="col-xs-3">
                    <bcs-button id="frmMantenedorCuentaInversion_asignar"
                        bcs-tipo="'bcs-button-primary'"  
                        bcs-auto-desactivar="false"  
                        bcs-texto="'UI_ASIGNAR' | translate"  
                        bcs-habilitado="seleccionMonedaClienteCuentaInversion"  
                        bcs-clic="asignarCuentaInversion()">
                    </bcs-button>
                </div>
                <div class="col-xs-3">
                    <bcs-button id="frmMantenedorCuentaInversion_modificar"
                        bcs-tipo="'bcs-button-primary'"
                        bcs-auto-desactivar="false"  
                        bcs-texto="'UI_MODIFICAR' | translate"  
                        bcs-habilitado="seleccionMonedaClienteCuentaInversion"  
                        bcs-clic="modificarCuentaInversion()">
                    </bcs-button>
                </div>
                <div class="col-xs-3">
                    <bcs-button id="frmMantenedorCuentaInversion_activar"
                        bcs-tipo="'bcs-button-primary'"
                        bcs-auto-desactivar="false"  
                        bcs-texto="'UI_ACTIVAR' | translate"  
                        bcs-habilitado="seleccionMonedaClienteCuentaInversion"  
                        bcs-clic="activarCuentaInversion()">
                    </bcs-button>
                </div>
                <div class="col-xs-3">
                    <bcs-button id="frmMantenedorCuentaInversion_desactivar"
                        bcs-tipo="'bcs-button-primary'"
                        bcs-auto-desactivar="false"  
                        bcs-texto="'UI_DESACTIVAR' | translate"  
                        bcs-habilitado="seleccionMonedaClienteCuentaInversion"  
                        bcs-clic="desactivarCuentaInversion()">
                    </bcs-button>
                </div>
            </div>      
        </div>

    </div>
</div>

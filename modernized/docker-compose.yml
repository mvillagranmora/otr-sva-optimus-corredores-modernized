      # Step 5b: /internal/java-call (jobs). Shared secret, fail closed; classes opted in to the migrated owners (empty = all to TomEE)
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

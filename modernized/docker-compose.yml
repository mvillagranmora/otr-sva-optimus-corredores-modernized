  # ---------------------------------------------------------------------------
  # BcsGateway — Spring Cloud Gateway (canary router)
  # Puerto interno 9090 no expuesto al host (los portales nginx lo consumen)
  # TOMEE_URL toma el valor de la variable de entorno (definida en .env).
  # Por defecto apunta al puerto interno del contenedor tomee-legacy (8080).
  # El host accede a TomEE directamente en localhost:8888 si necesita debug.
  # ---------------------------------------------------------------------------
  bcs-gateway:
    build:
      context: ./otr-sva-optimus-corredores
      dockerfile: BcsGateway/Dockerfile
    image: bcs-gateway:latest
    container_name: bcs-gateway
    expose:
      - "9090"
    networks:
      - optimus-net
    environment:
      GATEWAY_PORT: 9090
      TOMEE_URL: ${TOMEE_URL:-http://tomee-legacy:8080}
    depends_on:
      - bcs-filters
      - bcs-plataforma-web
      - bcs-plataforma-servicios
      - tomee-legacy
      - bcs-mesa-servicios
      - bcs-orden-servicios
      - bcs-portafolio-servicios
      - bcs-socio-negocio-servicios
      - bcs-custodia-servicios
      - bcs-facturacion-servicios
      - bcs-apv-servicios
      - bcs-tesoreria-servicios
      - bcs-normativa-servicios
      - bcs-cuenta-inversion-servicios
      - bcs-contabilidad-servicios
      - bcs-fondo-mutuo-servicios
      - bcs-canal-agente-servicios
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: on-failure

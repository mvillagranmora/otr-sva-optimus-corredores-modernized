  bcs-cuenta-inversion-jobs:
    build:
      context: ./otr-sva-optimus-corredores
      dockerfile: BcsCuentaInversionJobs/Dockerfile
    image: bcs-cuenta-inversion-jobs:latest
    expose:
      - "8075"
    networks:
      - optimus-net
    environment:
      SERVER_PORT: 8075
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # Jobs run in-process on BcsCuentaInversionServicios (library): they need its settings, not its URL.
      # Platform JavaCall router for the collaborators of other modules (POST {JAVACALL_URL}/internal/java-call); no default in the service
      JAVACALL_URL: ${JAVACALL_URL:-http://bcs-plataforma-web:8117}
      # configuration service used by the in-process ConsultarSaldoCuentaInversion (reports); REQUIRED by the service (no default there: it does not start without it)
      CONFIGURACION_URL: ${CONFIGURACION_URL:-http://bcs-plataforma-servicios:8114}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    depends_on:
      - bcs-cuenta-inversion-servicios
    restart: on-failure

  bcs-apv-jobs:

      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Platform JavaCall router for the collaborators of other modules (POST {JAVACALL_URL}/internal/java-call); no default
      JAVACALL_URL: ${JAVACALL_URL:-http://bcs-plataforma-web:8117}
      # Same JVM options as the proven services (UTC); can be overridden per country
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=UTC -Duser.language=en}
      CRYSTAL_REPORTS_URL: http://bcs-crystal-reports:8100
      PARIDAD_URL: http://bcs-plataforma-servicios:8114
      CUENTA_INVERSION_URL: http://bcs-cuenta-inversion-servicios:8080

# =============================================================================
# Stack completo Optimus — Core modernizado + Frontends + TomEE legacy
#
# Uso:
#   cp .env.example .env   # completar valores reales
#   docker compose up -d   # o: podman compose up -d
#
# URLs de acceso:
#   Corredores  → http://localhost:8881/   (→ /BSCL/Plataforma/UI/optimus?p=login)
#   Clientes    → http://localhost:8880/   (→ /iclient-optimus/)
#   Agentes     → http://localhost:8882/   (→ /iagente/)
#
# Arquitectura:
#   Portal Corredores (nginx:8881) → bcs-plataforma-web:8117 (app shell /optimus)
#                                  → BcsGateway:9090 (API calls)
#     ├─ Core modernizado (Spring Boot, puertos internos)
#     └─ TomEE legacy (tomee-legacy:8080, fallback circuit breaker del gateway)
#   Portal Clientes  (nginx:8880) → bcs-front-iclient-api:3002 → BcsGateway:9090
#   Portal Agentes   (nginx:8882) → iagente-api:3000           → BcsGateway:9090
# =============================================================================

networks:
  optimus-net:
    driver: bridge

volumes:
  mongodb-data:

services:

  # ===========================================================================
  # INFRAESTRUCTURA
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # MongoDB — sesiones de iCliente e iAgente
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    expose:
      - "27017"
    networks:
      - optimus-net
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # TomEE legacy — core antiguo, fallback del circuit breaker del gateway
  #
  # El gateway accede internamente a http://tomee-legacy:8080 (puerto TomEE).
  # Desde el host se expone en localhost:8888.
  # Si tu imagen TomEE escucha en otro puerto, ajusta la variable TOMEE_URL
  # en el servicio bcs-gateway más abajo.
  #
  # Configura TOMEE_LEGACY_IMAGE en .env con la imagen prebuildeada del core:
  #   TOMEE_LEGACY_IMAGE=registry.tu-empresa.cl/optimus-tomee:8.0-latest
  # ---------------------------------------------------------------------------
  tomee-legacy:
    image: tomee:latest
    container_name: tomee-legacy
    restart: unless-stopped
    networks:
      - optimus-net
    ports:
      - "8888:8080"
    environment:
      # SAP HANA — conexión al servidor de base de datos
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # JVM heap — mínimo / máximo según carga esperada en desarrollo
      JVM_XMS: "512m"
      JVM_XMX: "2048m"
    mem_limit: "2560m"
    healthcheck:
      disable: true

  # ===========================================================================
  # CORE MODERNIZADO — Spring Boot (otr-sva-optimus-corredores)
  # ===========================================================================

  bcs-crystal-reports:
    build:
      context: ./otr-sva-optimus-corredores
      dockerfile: BcsCrystalReports/Dockerfile
    image: bcs-crystal-reports:latest
    expose:
      - "8100"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL:?set HANA_URL in .env}
      HANA_USER: ${HANA_USER:?set HANA_USER in .env}
      HANA_PASSWORD: ${HANA_PASSWORD:?set HANA_PASSWORD in .env}
      HANA_SCHEMA: ${HANA_SCHEMA:-BSCL}
      # shared secret of /report (X-Internal-Token); without it every /report call is 401
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8100/reports/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    # container-level hardening (H3/H6): the sidecar opens uploaded .rpt files with a native-heavy runtime
    read_only: true
    tmpfs:
      - /app/tmp:rw,size=512m,mode=1777   # templates / pictures written during a render (TempFiles)
      - /tmp:rw,size=256m,mode=1777       # Tomcat work dirs, JRC / AWT scratch
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bcs-cuenta-inversion-servicios:
    build:
      context: ./otr-sva-optimus-corredores
      dockerfile: BcsCuentaInversionServicios/Dockerfile
    image: bcs-cuenta-inversion-servicios:latest

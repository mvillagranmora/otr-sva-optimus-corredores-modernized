spring:
  application:
    name: bcs-cuenta-inversion-servicios
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

server:
  port: 8080

services:
  autorizacion:
    url: ${AUTORIZACION_URL:http://localhost:8100}
  configuracion:
    url: ${CONFIGURACION_URL:http://localhost:8101}
  flujo-caja:
    url: ${FLUJO_CAJA_URL:http://localhost:8102}
  calendario:
    url: ${CALENDARIO_URL:http://localhost:8103}
  requisitos:
    url: ${REQUISITOS_URL:http://localhost:8104}
  log:
    url: ${LOG_URL:http://localhost:8105}
  programa:
    url: ${PROGRAMA_URL:http://localhost:8106}
  precios-tasas:
    url: ${PRECIOS_TASAS_URL:http://localhost:8107}
  paridad:
    url: ${PARIDAD_URL:http://localhost:8108}
  comprobante:
    url: ${COMPROBANTE_URL:http://localhost:8109}
  eventos:
    url: ${EVENTOS_URL:http://localhost:8110}
  javacall:
    url: ${JAVACALL_URL:http://localhost:8080}
  # shared secret of /internal/** (router -> service and service -> router); empty means every /internal call is rejected
  internal-token: ${INTERNAL_TOKEN:}

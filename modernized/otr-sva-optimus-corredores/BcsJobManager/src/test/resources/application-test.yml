spring:
  datasource:
    jobmanager:
      url: jdbc:h2:mem:jm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      hikari:
        auto-commit: false
    jobs:
      url: jdbc:h2:mem:jm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      hikari:
        auto-commit: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

jobmanager:
  node: TEST-NODE
  task-type: TEST
  process-id: test-proc-1
  poll-interval-ms: 999999
  concurrent-jobs: 2
  mode: PROGRAMA

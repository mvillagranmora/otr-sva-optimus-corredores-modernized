# Context of the tests that start the application (ArranqueAplicacionTest): H2 instead of HANA, no real service anywhere.
spring.datasource.url=jdbc:h2:mem:cijobsarranque;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
services.internal-token=fake-internal-token-0000
services.configuracion.url=http://localhost:1

# Golden and runner tests send class and parameters in the request and do not touch BAT (job pattern H4 switch).
cuentainversion.jobs.programa.modo=parametros-del-llamador

# Step 6: the golden and runner tests keep the pre-guard wiring; the guard tests turn it on themselves.
cuentainversion.jobs.guarda-tomee=false

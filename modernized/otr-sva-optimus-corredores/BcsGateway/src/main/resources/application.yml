      # ── Contabilidad ──────────────────────────────────────────────────────
      # Module BcsContabilidadServicios - verification: PROVEN (signature pending) (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-contabilidad-servicios
        uri: http://bcs-contabilidad-servicios:8081
        paths: [/api/v1/centralizacion/**, /api/v1/interfaz-**, /api/v1/informe-**, /api/v1/configuracion/**]

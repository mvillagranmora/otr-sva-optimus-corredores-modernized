server:
  port: ${GATEWAY_PORT:9090}

spring:
  application:
    name: bcs-gateway
  webflux:
    base-path: /

bcs:
  gateway:
    legacy-fallback-uri: ${TOMEE_URL:http://tomee-legacy:8080}
    # Opt-in routing: a route receives traffic only if `enabled: true` OR its id is listed here
    # (comma list, e.g. BCS_GATEWAY_ENABLED_ROUTES=bcs-tesoreria-servicios). Default: none -> 100% TomEE.
    # RULE: enable only PROVEN and signed modules (analysis/otr-sva-optimus-corredores/VERIFICATION.md).
    enabled-routes: ${BCS_GATEWAY_ENABLED_ROUTES:}
    # Request bodies up to this size are buffered once so a 503 / connection failure can be replayed to TomEE.
    max-buffered-body-bytes: ${BCS_GATEWAY_MAX_BUFFERED_BODY_BYTES:10485760}
    # Upstream response (read) timeout. Expiry -> 504 to the client, NEVER a fallback to TomEE.
    response-timeout-seconds: ${BCS_GATEWAY_RESPONSE_TIMEOUT_SECONDS:30}
    # CORS: comma list of exact origins (https://host). Empty = no CORS headers, which is right when the UI is served from the same origin as the gateway.
    cors-allowed-origins: ${BCS_GATEWAY_CORS_ALLOWED_ORIGINS:}
    # false: the X-Forwarded-For sent by the client is discarded. true ONLY behind a trusted load balancer (EKS ALB): the received chain is kept and the
    # address of the connection (the balancer) is appended; the services must then read the client from the right end of the chain.
    trust-forwarded-for: ${BCS_GATEWAY_TRUST_FORWARDED_FOR:false}
    routes:

      # ── Autenticación y sesión ─────────────────────────────────────────────
      # Module BcsFilters - verification: PARTLY PROVEN (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-filters
        uri: http://bcs-filters:8116
        paths: [/login, /sso/**, /ping, /status/**]
        enabled: false

      # ── Plataforma Web ────────────────────────────────────────────────────
      # Module BcsPlataformaWeb - verification: PARTLY PROVEN (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      # Login MVP (T-02). Public paths /BSCL/Plataforma/GWJAVA/PLA/** are rewritten to /PLA/** before matching.
      # enabled=false until G-01 (verify PROVEN, signed). no-legacy-fallback: login must never replay in TomEE
      # (it would create a second session / count a second attempt): without the service the client gets 503.
      - id: bcs-plataforma-login
        uri: http://bcs-plataforma-web:8117
        paths: [/PLA/CrearSesion, /PLA/bootstrap/**, /PLA/ValidaClaveProvisoria, /PLA/ActualizarClave,
                /PLA/SolicitudRecuperacionClave, /PLA/RecuperacionClave, /PLA/ConfirmarCambioClave, /PLA/SSO*]
        enabled: false
        no-legacy-fallback: true

      - id: bcs-plataforma-web
        uri: http://bcs-plataforma-web:8117
        # Only /PLA/** (the legacy path /BSCL/Plataforma/GWJAVA/PLA/** after the rewrite): behind the prefix the session filter of the service
        # applies. Unprefixed /call, /CallBatch and /bootstrap/** were removed: the filter does not cover them (review 2026-10-26).
        paths: [/plataforma/**, /PLA/call, /PLA/CallBatch]
        enabled: false

      # ── Plataforma Servicios ──────────────────────────────────────────────
      # Module BcsPlataformaServicios - verification: PARTLY PROVEN (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-plataforma-servicios
        uri: http://bcs-plataforma-servicios:8114
        paths: [/plataforma-servicios/**]
        enabled: false

      # ── Plataforma Jobs ───────────────────────────────────────────────────
      # Module BcsPlataformaJobs - verification: PARTLY PROVEN (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-plataforma-jobs
        uri: http://bcs-plataforma-jobs:8110
        paths: [/plataforma-jobs/**]
        enabled: false

      # ── Plataforma Reporte API ────────────────────────────────────────────
      # Module BcsPlataformaReporteApi - verification: PARTLY PROVEN (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-plataforma-reporte-api
        uri: http://bcs-plataforma-reporte-api:8115
        paths: [/plataforma-reporte/**]
        enabled: false

      # ── Cuenta Inversión ──────────────────────────────────────────────────
      # Module BcsCuentaInversionServicios - verification: PROVEN (signature pending) (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-cuenta-inversion-servicios
        uri: http://bcs-cuenta-inversion-servicios:8080
        paths: [/api/v1/cargo-abono, /api/v1/movimientos/**]
        enabled: false

      # Module BcsCuentaInversionJobs - verification: PARTLY PROVEN (VERIFICATION.md 2026-10-20).
      # enabled=false: no traffic until the module is PROVEN and signed.
      - id: bcs-cuenta-inversion-jobs

# ── Actuator ────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: BcsGateway
    description: WebFlux reverse proxy — opt-in routes to modernized services (all disabled by default) with safe TomEE fallback and Resilience4j circuit breakers
    version: "1.0.0"

logging:
  level:
    cl.bcs.gateway: INFO
    reactor.netty: WARN

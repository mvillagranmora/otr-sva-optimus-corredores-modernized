spring.application.name=apv-jobs
server.port=${SERVER_PORT:8084}

# HANA JDBC (values injected via environment, never commit credentials)
spring.datasource.url=${HANA_URL}
spring.datasource.username=${HANA_USER}
spring.datasource.password=${HANA_PASSWORD}

# Collaborators that live outside APV (CrearOrdenes, CalcularMontoYCobrosOrden, ConsultarCustodiaPortafolio, ConsultarFlujoCaja, ConsultarFlujoCustodiaFondoMutuo,
# CrearSolicitudAporteRescateNormal, ConsultarEmpresa, AgregarLog): the platform JavaCall router. No default: the deployment must say where it is.
services.javacall.url=${JAVACALL_URL}
services.javacall.connect-timeout=PT2S
services.javacall.read-timeout=PT60S

# Shared secret of /internal/** (Job Manager -> POST /internal/job-call, and jobs -> router). Empty: every /internal call is rejected.
services.internal-token=${INTERNAL_TOKEN:}

# Base folder of the files the apv-service use cases write (AlmacenArchivosLocal). The Previred job writes under PLA.RutaBaseArchivos, as the legacy did.
apv.archivos.base-dir=${APV_ARCHIVOS_DIR:}

# Session statements of BcsJob.java:130-131 on every transaction of a run (HANA). false only for a non-HANA database.
apv.jobs.sesion-hana=true

management.endpoints.web.exposure.include=health,info

# Job pattern H4 (parameters and claim from BAT.Programa; see TRANSFORMATION_NOTES.md): programa | parametros-del-llamador (tests and local runs only).
apv.jobs.programa.modo=programa

# Step 6 (JOBS_PATTERN.md H-1): fail-closed guard for the collaborators that still live in TomEE and write (CrearOrdenes,
# CrearSolicitudAporteRescateNormal, ...): marks H4G in BAT.LogPrograma before/after each call, and a program whose earlier run left a HECHO
# or an unclosed INTENTO is NOT re-run (it goes to "requires review"). Active only in a run with an idPrograma (programa mode).
# false = no marks, no checks (the golden/test profile).
apv.jobs.guarda-tomee=true

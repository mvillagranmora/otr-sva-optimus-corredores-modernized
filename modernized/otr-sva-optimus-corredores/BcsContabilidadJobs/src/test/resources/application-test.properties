spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Golden and runner tests send class and parameters in the request and do not touch BAT (job pattern H4 switch).
contabilidad.jobs.programa.modo=parametros-del-llamador

# Step 6: the golden and runner tests keep the pre-guard wiring; the guard tests turn it on themselves.
contabilidad.jobs.guarda-tomee=false

# Fake shared secret for the internal-token filter (fail closed when empty); tests send it in X-Internal-Token.
services.internal-token=fake-internal-token-0000

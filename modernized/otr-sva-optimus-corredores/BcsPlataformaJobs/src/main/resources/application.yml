spring:
  application:
    name: plataforma-jobs
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

server:
  port: ${SERVER_PORT:8110}

plataforma:
  jobs:
    log-base-path: ${PLA_LOG_BASE_PATH:/data/archivos}

services:
  plataforma:
    base-url: ${PLATAFORMA_URL:http://localhost:8110}

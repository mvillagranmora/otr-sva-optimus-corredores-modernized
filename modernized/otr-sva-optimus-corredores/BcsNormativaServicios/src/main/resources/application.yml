spring:
  application:
    name: normativa-service
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

server:
  port: ${SERVER_PORT:8113}

services:
  plataforma:
    url: ${PLATAFORMA_URL:http://localhost:8100}
  autorizacion:
    url: ${AUTORIZACION_URL:http://localhost:8120}

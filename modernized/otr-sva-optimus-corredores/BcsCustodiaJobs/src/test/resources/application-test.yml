spring:
  datasource:
    url: jdbc:h2:mem:custodia_jobs_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:schema-custodia-jobs.sql
      data-locations: classpath:data-custodia-jobs.sql
      mode: always
  batch:
    job:
      enabled: false

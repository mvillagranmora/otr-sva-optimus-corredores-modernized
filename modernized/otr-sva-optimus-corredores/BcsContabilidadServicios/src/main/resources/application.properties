# BcsContabilidadServicios — application configuration
# All credential-bearing values are read from environment variables.
# No secret values are stored in this file.

# SAP HANA datasource
spring.datasource.url=${HANA_URL}
spring.datasource.username=${HANA_USER}
spring.datasource.password=${HANA_PASSWORD}
spring.datasource.driver-class-name=com.sap.db.jdbc.Driver

# Legacy TomEE platform proxy (strangler-fig — alive until Phase 5)
plataforma.base-url=${PLATAFORMA_BASE_URL:http://localhost:8080}

# Spring Batch — use in-memory repo for now; switch to HANA in Phase 3
spring.batch.jdbc.initialize-schema=always

# Logging
logging.level.cl.bcs=INFO

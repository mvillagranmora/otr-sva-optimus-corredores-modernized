# Test-profile application properties for BcsContabilidadServicios
# All credential-shaped values use clearly-fake same-shape substitutes.
# Real credentials are NEVER stored here; tests that need live connections
# read them from environment variables via System.getenv().

spring.datasource.url=jdbc:h2:mem:contabilidad_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# SAP B1 — fake same-shape values (real ones come from environment variable SAP_B1_URL)
# Actual shape: jdbc:sap://<host>:<port>
sap.b1.url=jdbc:sap://localhost:39017
# sap.b1.api-key is read from System.getenv("SAP_B1_API_KEY") in tests

# Plataforma TomEE — fake same-shape URL (real one from PLATAFORMA_BASE_URL)
plataforma.base-url=http://localhost:18080/plataforma
# Credentials from System.getenv("PLATAFORMA_API_KEY")

# SFTP — fake same-shape values (real ones from SFTP_HOST / SFTP_USER / SFTP_PASSWORD)
sftp.host=sftp.test.invalid
sftp.port=22
sftp.remote-dir=/home/interfaz-bpc/
# sftp.password is read from System.getenv("SFTP_PASSWORD") in integration tests

# File output — tests use @TempDir; production value comes from DB config
# PLA.RutaBaseArchivos
contabilidad.ruta-base=/tmp/contabilidad-test/

# Logging — reduce noise in test output
logging.level.cl.bcs=WARN
logging.level.org.springframework=WARN

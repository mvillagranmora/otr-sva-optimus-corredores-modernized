spring:
  application:
    name: plataforma-service
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

server:
  port: ${SERVER_PORT:8114}

# Shared secret of the platform router (X-Internal-Token). Empty = every request is rejected (fails closed). Value comes from the environment only.
services:
  internal-token: ${INTERNAL_TOKEN:}

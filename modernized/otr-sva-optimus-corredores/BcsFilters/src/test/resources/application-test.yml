spring:
  datasource:
    url: jdbc:h2:mem:bcs_filters_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:schema-filters.sql
      data-locations: classpath:data-filters.sql
      mode: always

cor:
  session:
    timeout:
      minutes: 30

security:
  password:
    rehash-enabled: false

server:
  port: 8116

spring:
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver
  sql:
    init:
      mode: never

# COR-channel session timeout (RULE-025)
# Override with env var COR_SESSION_TIMEOUT_MINUTES
cor:
  session:
    timeout:
      minutes: ${COR_SESSION_TIMEOUT_MINUTES:30}

security:
  password:
    rehash-enabled: ${SECURITY_REHASH_ENABLED:false}

spring:
  application:
    name: normativa-jobs
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

server:
  port: ${SERVER_PORT:8112}

normativa:
  jobs:
    log-base-path: ${NORMATIVA_LOG_BASE_PATH:/data/archivos}
    schema: ${NORMATIVA_SCHEMA:BSCL}

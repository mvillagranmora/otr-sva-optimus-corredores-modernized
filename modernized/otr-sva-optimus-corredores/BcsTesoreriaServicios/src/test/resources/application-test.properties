# Test datasource — H2 in-memory (no real HANA credentials in test scope)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Batch — in-memory schema for tests
spring.batch.jdbc.initialize-schema=always

# Disable Spring Boot auto-config for real HANA in test context
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Fake values (same shape as real env vars) for SFTP and plataforma proxy
SFTP_HOST=localhost
SFTP_PORT=22
SFTP_USER=testuser
SFTP_PASSWORD=testpassword
PLATAFORMA_BASE_URL=http://localhost:${wiremock.port:8089}
HANA_URL=jdbc:h2:mem:testdb
HANA_USER=sa
HANA_PASSWORD=

spring.application.name=tesoreria-service
spring.datasource.url=${HANA_URL}
spring.datasource.username=${HANA_USER}
spring.datasource.password=${HANA_PASSWORD}
spring.batch.jdbc.initialize-schema=never
plataforma.base-url=${PLATAFORMA_BASE_URL:http://localhost:8080}
# Platform JavaCall router (collaborators that live in other services). No default: the deployment must say where it is.
services.javacall.url=${JAVACALL_URL}
services.javacall.connect-timeout=PT2S
services.javacall.read-timeout=PT60S
# Shared secret of /internal/** (router -> service and service -> router); empty means every /internal call is rejected (TokenInternoFilter).
services.internal-token=${INTERNAL_TOKEN:}

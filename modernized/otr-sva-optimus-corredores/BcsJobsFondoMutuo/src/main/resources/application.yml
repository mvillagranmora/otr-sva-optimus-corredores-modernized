spring:
  application:
    name: fondo-mutuo-jobs
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

server:
  port: ${SERVER_PORT:8107}

services:
  fondo-mutuo:
    base-url: ${FONDO_MUTUO_URL:http://localhost:8141}
  custodia:
    base-url: ${CUSTODIA_URL:http://localhost:8143}
  plataforma:
    base-url: ${PLATAFORMA_URL:http://localhost:8080}

      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      CARTOLAS_URL: http://bcs-cartolas:8108
      CARTOLAS_MASTER_URL: http://bcs-cartolas-master:8105
    depends_on:
      - bcs-cartolas
      - bcs-cartolas-master
    restart: on-failure

  bcs-job-manager:
    build:
      context: .
      dockerfile: BcsJobManager/Dockerfile
    image: bcs-job-manager:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8106"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
    restart: on-failure

  bcs-fondo-mutuo-servicios:
    build:
      context: .
      dockerfile: BcsFondoMutuoServicios/Dockerfile
    image: bcs-fondo-mutuo-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8111"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # Shared secret of the service-to-service calls (fail closed: empty rejects everything but the health probes)
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Platform JavaCall router for the collaborators of other modules (POST {JAVACALL_URL}/internal/java-call); no default
      JAVACALL_URL: ${JAVACALL_URL:-http://bcs-plataforma-web:8117}
      # Same JVM options as the proven services (UTC); can be overridden per country
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=UTC -Duser.language=en}
      CRYSTAL_REPORTS_URL: http://bcs-crystal-reports:8100
      # URLs de servicios auxiliares (stubs hasta que estén disponibles)
      PARIDAD_URL: ${PARIDAD_URL:-http://bcs-plataforma-servicios:8114}
      PRECIOS_TASAS_URL: ${PRECIOS_TASAS_URL:-http://bcs-plataforma-servicios:8114}
      CONFIGURACION_URL: ${CONFIGURACION_URL:-http://bcs-plataforma-servicios:8114}
      CALENDARIO_URL: ${CALENDARIO_URL:-http://bcs-plataforma-servicios:8114}
      TESORERIA_URL: ${TESORERIA_URL:-http://bcs-tesoreria-servicios:8082}
      CUENTA_INVERSION_URL: ${CUENTA_INVERSION_URL:-http://bcs-cuenta-inversion-servicios:8080}
    depends_on:
      bcs-crystal-reports:
        condition: service_healthy
    # SEC-009: no Linux capability needed by a JVM on a port > 1024, and no privilege gain. read_only NOT set (writes outside /tmp not ruled out).
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: on-failure

  bcs-jobs-fondo-mutuo:
    build:
      context: .
      dockerfile: BcsJobsFondoMutuo/Dockerfile
    image: bcs-jobs-fondo-mutuo:latest
    expose:
      - "8107"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      FONDO_MUTUO_SERVICIOS_URL: http://bcs-fondo-mutuo-servicios:8111
    depends_on:
      - bcs-fondo-mutuo-servicios
    restart: on-failure

  bcs-normativa-core:
    build:
      context: .
      dockerfile: BcsNormativaCore/Dockerfile
    image: bcs-normativa-core:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8109"
    networks:
      - optimus-net
    environment:
      # BcsNormativaCore usa NORMATIVA_DB_* en su application.properties
      NORMATIVA_DB_URL: ${HANA_URL}
      NORMATIVA_DB_USER: ${HANA_USER}
      NORMATIVA_DB_PASSWORD: ${HANA_PASSWORD}
    restart: on-failure

  bcs-normativa-jobs:
    build:
      context: .
      dockerfile: BcsNormativaJobs/Dockerfile
    image: bcs-normativa-jobs:latest
    expose:
      - "8112"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      NORMATIVA_SCHEMA: ${NORMATIVA_SCHEMA:-BSCL}
      NORMATIVA_LOG_BASE_PATH: ${NORMATIVA_LOG_BASE_PATH:-/data/archivos}
    depends_on:
      - bcs-normativa-core
    restart: on-failure

  bcs-normativa-servicios:
    build:
      context: .
      dockerfile: BcsNormativaServicios/Dockerfile
    image: bcs-normativa-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8113"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # BcsNormativaServicios lee NORMATIVA_DB_* en su application.properties
      NORMATIVA_DB_URL: ${NORMATIVA_DB_URL:-${HANA_URL}}
      NORMATIVA_DB_USER: ${NORMATIVA_DB_USER:-${HANA_USER}}
      NORMATIVA_DB_PASSWORD: ${NORMATIVA_DB_PASSWORD:-${HANA_PASSWORD}}
      PLATAFORMA_URL: http://bcs-plataforma-servicios:8114
      AUTORIZACION_URL: ${AUTORIZACION_URL:-http://bcs-plataforma-web:8117}
      CRYSTAL_REPORTS_URL: http://bcs-crystal-reports:8100
    depends_on:
      bcs-normativa-core:
        condition: service_started
      bcs-plataforma-servicios:
        condition: service_started
      bcs-crystal-reports:
        condition: service_healthy
    restart: on-failure

  bcs-plataforma-web:
    build:
      context: .
      dockerfile: BcsPlataformaWeb/Dockerfile
    image: bcs-plataforma-web:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8117"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      COR_SESSION_TIMEOUT_MINUTES: ${COR_SESSION_TIMEOUT_MINUTES:-30}
      # JavaCall service URLs (defaults use Docker network hostnames)
      BCS_PLATAFORMA_SERVICIOS_URL: ${BCS_PLATAFORMA_SERVICIOS_URL:-http://bcs-plataforma-servicios:8114}
      BCS_MESA_SERVICIOS_URL: ${BCS_MESA_SERVICIOS_URL:-http://bcs-mesa-servicios:8085}
      BCS_ORDEN_SERVICIOS_URL: ${BCS_ORDEN_SERVICIOS_URL:-http://bcs-orden-servicios:8086}
      BCS_PORTAFOLIO_SERVICIOS_URL: ${BCS_PORTAFOLIO_SERVICIOS_URL:-http://bcs-portafolio-servicios:8076}
      BCS_SOCIO_NEGOCIO_SERVICIOS_URL: ${BCS_SOCIO_NEGOCIO_SERVICIOS_URL:-http://bcs-socio-negocio-servicios:8098}
      BCS_CUSTODIA_SERVICIOS_URL: ${BCS_CUSTODIA_SERVICIOS_URL:-http://bcs-custodia-servicios:8097}
      BCS_FACTURACION_SERVICIOS_URL: ${BCS_FACTURACION_SERVICIOS_URL:-http://bcs-facturacion-servicios:8099}
      BCS_APV_SERVICIOS_URL: ${BCS_APV_SERVICIOS_URL:-http://bcs-apv-servicios:8083}
      BCS_TESORERIA_SERVICIOS_URL: ${BCS_TESORERIA_SERVICIOS_URL:-http://bcs-tesoreria-servicios:8073}
      BCS_NORMATIVA_SERVICIOS_URL: ${BCS_NORMATIVA_SERVICIOS_URL:-http://bcs-normativa-servicios:8113}
      BCS_CUENTA_INVERSION_SERVICIOS_URL: ${BCS_CUENTA_INVERSION_SERVICIOS_URL:-http://bcs-cuenta-inversion-servicios:8080}
      BCS_CONTABILIDAD_SERVICIOS_URL: ${BCS_CONTABILIDAD_SERVICIOS_URL:-http://bcs-contabilidad-servicios:8081}
      BCS_FONDO_MUTUO_SERVICIOS_URL: ${BCS_FONDO_MUTUO_SERVICIOS_URL:-http://bcs-fondo-mutuo-servicios:8111}
      BCS_CANAL_AGENTE_SERVICIOS_URL: ${BCS_CANAL_AGENTE_SERVICIOS_URL:-http://bcs-canal-agente-servicios:8102}
      # Fallback J-type canary: paquetes no migrados (Custodia, SocioNegocio) y errores de microservicio
      TOMEE_URL: ${TOMEE_URL:-http://tomee-legacy:8080}
      # Step 5b: /internal/java-call (jobs). Shared secret, fail closed; classes opted in to the migrated owners (empty = all to TomEE)
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      PLATAFORMA_JAVACALL_CLASES_HABILITADAS: ${PLATAFORMA_JAVACALL_CLASES_HABILITADAS:-}
    restart: on-failure

  bcs-plataforma-servicios:
    build:
      context: .
      dockerfile: BcsPlataformaServicios/Dockerfile
    image: bcs-plataforma-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8114"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
    depends_on:
      - bcs-plataforma-web
    restart: on-failure

  bcs-plataforma-jobs:
    build:
      context: .
      dockerfile: BcsPlataformaJobs/Dockerfile
    image: bcs-plataforma-jobs:latest
    expose:
      - "8110"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # PLATAFORMA_URL se usa para callbacks internos del scheduler
      PLATAFORMA_URL: http://bcs-plataforma-jobs:8110
      PLA_LOG_BASE_PATH: ${PLA_LOG_BASE_PATH:-/data/archivos}
    depends_on:
      - bcs-plataforma-servicios
    restart: on-failure

  bcs-plataforma-reporte-api:
    build:
      context: .
      dockerfile: BcsPlataformaReporteApi/Dockerfile
    image: bcs-plataforma-reporte-api:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8115"
    networks:
      - optimus-net
    environment:
      CRYSTAL_REPORTS_URL: http://bcs-crystal-reports:8100
    depends_on:
      bcs-crystal-reports:
        condition: service_healthy
    restart: on-failure

  bcs-filters:
    build:
      context: .
      dockerfile: BcsFilters/Dockerfile
    image: bcs-filters:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8116"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # Canary: false = acepta SHA-256 legacy sin reescribir (BD compartida con TomEE)
      # Post-cutover: cambiar a true para migrar progresivamente a BCrypt
      SECURITY_REHASH_ENABLED: ${SECURITY_REHASH_ENABLED:-false}
      COR_SESSION_TIMEOUT_MINUTES: ${COR_SESSION_TIMEOUT_MINUTES:-30}
    depends_on:
      - bcs-plataforma-web
    restart: on-failure

  # ── BcsGateway — Canary Router (Spring Cloud Gateway) ──────────────────────
  bcs-gateway:
    build:
      context: .
      dockerfile: BcsGateway/Dockerfile
    image: bcs-gateway:latest
    container_name: bcs-gateway
    ports:
      - "9090:9090"
    networks:
      - optimus-net
    environment:
      GATEWAY_PORT: 9090
      TOMEE_URL: ${TOMEE_URL:-http://tomee-legacy:8080}
    depends_on:
      - bcs-filters
      - bcs-plataforma-web
      - bcs-plataforma-servicios
      - bcs-mesa-servicios
      - bcs-orden-servicios
      - bcs-portafolio-servicios
      - bcs-socio-negocio-servicios
      - bcs-custodia-servicios
      - bcs-facturacion-servicios
      - bcs-apv-servicios
      - bcs-tesoreria-servicios
      - bcs-normativa-servicios
      - bcs-cuenta-inversion-servicios
      - bcs-contabilidad-servicios
      - bcs-fondo-mutuo-servicios
      - bcs-canal-agente-servicios
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: on-failure

  # ---------------------------------------------------------------------------
  # HANA SAP — servicio externo, NO se levanta aquí.
  # Configura HANA_URL en .env apuntando al servidor real:
  #   HANA_URL=jdbc:sap://<host>:39015
  # ---------------------------------------------------------------------------

      SAP_B1_DB_USER: ${SAP_B1_DB_USER}
      SAP_B1_DB_PASSWORD: ${SAP_B1_DB_PASSWORD}
      SFTP_HOST: ${SFTP_HOST}
      SFTP_PORT: ${SFTP_PORT}
      SFTP_USER: ${SFTP_USER}
      SFTP_PASSWORD: ${SFTP_PASSWORD}

      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      SAP_B1_URL: ${SAP_B1_URL}
      SAP_B1_USER: ${SAP_B1_USER}
      SAP_B1_PASSWORD: ${SAP_B1_PASSWORD}
      SAP_B1_COMPANY: ${SAP_B1_COMPANY}

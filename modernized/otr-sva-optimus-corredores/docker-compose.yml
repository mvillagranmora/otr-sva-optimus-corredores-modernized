version: "3.9"

# otr-sva-optimus-corredores — arquitectura completa
# Uso: cp .env.example .env && # editar .env con valores reales && podman compose up -d
#
# Nota: BcsCrystalReports corre en Java 11 (Crystal Reports SDK incompatible con Java 25).
#       BcsPortafolioServicios usa puerto 8076 en docker-compose (su yml original
#       tenía 8086, conflicto con BcsOrdenServicios; se resuelve via SERVER_PORT).
#
# Prerequisito: JAR de BcsCrystalReports instalado en Maven local del builder
#   → ver BcsCrystalReports/libs/

networks:
  optimus-net:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # Crystal Reports quarantine service (Java 11 — aislado por compatibilidad SDK)
  # ---------------------------------------------------------------------------
  bcs-crystal-reports:
    build:
      context: .
      dockerfile: BcsCrystalReports/Dockerfile
    image: bcs-crystal-reports:latest
    expose:
      - "8100"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL:?set HANA_URL in .env}
      HANA_USER: ${HANA_USER:?set HANA_USER in .env}
      HANA_PASSWORD: ${HANA_PASSWORD:?set HANA_PASSWORD in .env}
      HANA_SCHEMA: ${HANA_SCHEMA:-BSCL}
      # shared secret of /report (X-Internal-Token); without it every /report call is 401
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8100/reports/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    # container-level hardening (H3/H6): the sidecar opens uploaded .rpt files with a native-heavy runtime
    read_only: true
    tmpfs:
      - /app/tmp:rw,size=512m,mode=1777   # templates / pictures written during a render (TempFiles)
      - /tmp:rw,size=256m,mode=1777       # Tomcat work dirs, JRC / AWT scratch
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Servicios Phase 1-2 (REST — se exponen al host)
  # ---------------------------------------------------------------------------
  bcs-contabilidad-servicios:
    build:
      context: .
      dockerfile: BcsContabilidadServicios/Dockerfile
    image: bcs-contabilidad-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8081"
    networks:
      - optimus-net
    environment:
      SERVER_PORT: 8081
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      PLATAFORMA_BASE_URL: http://bcs-cuenta-inversion-servicios:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure

  bcs-cuenta-inversion-servicios:
    build:
      context: .
      dockerfile: BcsCuentaInversionServicios/Dockerfile
    image: bcs-cuenta-inversion-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8080"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure

  bcs-tesoreria-servicios:
    build:
      context: .
      dockerfile: BcsTesoreriaServicios/Dockerfile
    image: bcs-tesoreria-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8073"
    networks:
      - optimus-net
    environment:
      SERVER_PORT: 8073
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      PLATAFORMA_BASE_URL: http://bcs-cuenta-inversion-servicios:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8073/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure

  bcs-apv-servicios:
    build:
      context: .
      dockerfile: BcsAPVServicios/Dockerfile
    image: bcs-apv-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8083"
    networks:
      - optimus-net
    environment:
      SERVER_PORT: 8083
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      # Platform JavaCall router for the collaborators of other modules (POST {JAVACALL_URL}/internal/java-call); no default in the service
      JAVACALL_URL: ${JAVACALL_URL:-http://bcs-plataforma-web:8117}
      # Shared secret of the service-to-service calls (fail closed: empty rejects everything but the health probes)
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # APV_ARCHIVOS_DIR: optional base folder for generated files (mount a volume if used)
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Duser.language=en
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure

  bcs-mesa-servicios:
    build:
      context: .
      dockerfile: BcsMesaServicios/Dockerfile
    image: bcs-mesa-servicios:latest

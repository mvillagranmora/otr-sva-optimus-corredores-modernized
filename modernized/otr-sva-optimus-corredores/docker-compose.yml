      PORTAFOLIO_SERVICIOS_URL: http://bcs-portafolio-servicios:8076
    depends_on:
      bcs-crystal-reports:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure

  bcs-orden-servicios:
    build:
      context: .
      dockerfile: BcsOrdenServicios/Dockerfile
    image: bcs-orden-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8086"
    networks:
      - optimus-net
    environment:
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      CRYSTAL_REPORTS_URL: http://bcs-crystal-reports:8100
      MESA_SERVICIOS_URL: http://bcs-mesa-servicios:8085
    depends_on:

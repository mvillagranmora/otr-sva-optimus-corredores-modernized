  bcs-portafolio-servicios:
    build:
      context: .
      dockerfile: BcsPortafolioServicios/Dockerfile
    image: bcs-portafolio-servicios:latest
    # Internal service: reachable by service name on optimus-net only (not published on the host)
    expose:
      - "8076"
    networks:
      - optimus-net
    environment:
      # Puerto sobreescrito — yml original usa 8086 (conflicto con bcs-orden-servicios)
      SERVER_PORT: 8076
      HANA_URL: ${HANA_URL}
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8076/actuator/health"]

server.port=8117
spring.application.name=bcs-plataforma-web

# ─── DataSource (HANA) ────────────────────────────────────────────────────────
# Credentials must be supplied via environment variables — never hardcoded.
spring.datasource.url=${HANA_URL}
spring.datasource.username=${HANA_USER:}
spring.datasource.password=${HANA_PASSWORD:}
spring.datasource.driver-class-name=com.sap.db.jdbc.Driver

# ─── Audit DataSource ─────────────────────────────────────────────────────────
audit.datasource.url=${AUDIT_HANA_URL:${HANA_URL}}
audit.datasource.username=${AUDIT_HANA_USER:${HANA_USER:}}
audit.datasource.password=${AUDIT_HANA_PASSWORD:${HANA_PASSWORD:}}

# ─── Connection pool ──────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ─── Multipart (FileBlobManager) ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.cl.bcs=INFO
logging.level.root=WARN

# ─── Password rehash ──────────────────────────────────────────────────────────
# false = canary mode (accept both BCrypt and SHA-256; do not upgrade on login)
security.password.rehash-enabled=false

# ─── Session timeout for /call dispatcher ─────────────────────────────────────
plataforma.session-timeout-minutes=${COR_SESSION_TIMEOUT_MINUTES:30}

# ─── JavaCall service URLs (J-type routing) ───────────────────────────────────
plataforma.javacall.url.bcs-plataforma-servicios=${BCS_PLATAFORMA_SERVICIOS_URL:http://bcs-plataforma-servicios:8114}
plataforma.javacall.url.bcs-socio-negocio-servicios=${BCS_SOCIO_NEGOCIO_SERVICIOS_URL:http://bcs-socio-negocio-servicios:8098}
plataforma.javacall.url.bcs-orden-servicios=${BCS_ORDEN_SERVICIOS_URL:http://bcs-orden-servicios:8086}
plataforma.javacall.url.bcs-normativa-servicios=${BCS_NORMATIVA_SERVICIOS_URL:http://bcs-normativa-servicios:8113}
plataforma.javacall.url.bcs-mesa-servicios=${BCS_MESA_SERVICIOS_URL:http://bcs-mesa-servicios:8085}
plataforma.javacall.url.bcs-custodia-servicios=${BCS_CUSTODIA_SERVICIOS_URL:http://bcs-custodia-servicios:8097}
plataforma.javacall.url.bcs-fondo-mutuo-servicios=${BCS_FONDO_MUTUO_SERVICIOS_URL:http://bcs-fondo-mutuo-servicios:8111}
plataforma.javacall.url.bcs-apv-servicios=${BCS_APV_SERVICIOS_URL:http://bcs-apv-servicios:8083}
plataforma.javacall.url.bcs-tesoreria-servicios=${BCS_TESORERIA_SERVICIOS_URL:http://bcs-tesoreria-servicios:8073}
plataforma.javacall.url.bcs-facturacion-servicios=${BCS_FACTURACION_SERVICIOS_URL:http://bcs-facturacion-servicios:8099}
plataforma.javacall.url.bcs-cuenta-inversion-servicios=${BCS_CUENTA_INVERSION_SERVICIOS_URL:http://bcs-cuenta-inversion-servicios:8080}
plataforma.javacall.url.bcs-contabilidad-servicios=${BCS_CONTABILIDAD_SERVICIOS_URL:http://bcs-contabilidad-servicios:8081}
# BcsPortafolioServicios: docker-compose overrides yml port 8086 → 8076 (conflict with BcsOrdenServicios)
plataforma.javacall.url.bcs-portafolio-servicios=${BCS_PORTAFOLIO_SERVICIOS_URL:http://bcs-portafolio-servicios:8076}
plataforma.javacall.url.bcs-canal-agente-servicios=${BCS_CANAL_AGENTE_SERVICIOS_URL:http://bcs-canal-agente-servicios:8102}

# ─── TomEE fallback (J-type canary) ──────────────────────────────────────────
# Usado cuando el paquete no está mapeado (Fase D) o el microservicio falla.
# Apunta al puerto interno del contenedor (8080), no al host (8888).
# Nota: no se define TOMEE_URL aquí para evitar auto-referencia circular en Spring 7.
# El @Value en JavaCallRouterService ya tiene el default: ${TOMEE_URL:http://tomee-legacy:8080}

# ─── JavaCall allow-list (opt-in; default EMPTY = every class goes straight to TomEE) ──────────────
# Comma-separated legacy class names that MAY be sent to a new service. Entries are exact, case-sensitive
# fully qualified names (cl.bcs.cuentaInversion.CrearCargoAbono) or a package prefix ending in .*
# (cl.bcs.tesoreria.*). A class not listed here is proxied to TomEE without calling the new service.
# RULE: list only classes of modules that are PROVEN and signed (see analysis/.../VERIFICATION.md).
# Do not enable anything here by default; set it per environment, e.g. PLATAFORMA_JAVACALL_CLASES_HABILITADAS.
plataforma.javacall.clases-habilitadas=${PLATAFORMA_JAVACALL_CLASES_HABILITADAS:}

# ─── Step 5b: internal JavaCall router for the jobs (POST /internal/java-call) ───────────────────
# Shared secret of the service-to-service calls (fail closed: empty rejects every request under /internal).
# Also sent as X-Internal-Token toward the owners unless plataforma.javacall.internal-token is set.
services.internal-token=${INTERNAL_TOKEN:}
# Class prefix -> owner strategy@base url (longest prefix wins). JAVACALL = owner's own /internal/java-call;
# APV_REST = typed REST routes of apv-service through the bcs-apv-javacall-adapter registry.
# Only classes ALSO listed in plataforma.javacall.clases-habilitadas are sent to an owner; the rest goes to TomEE.
plataforma.javacall.destinos=${PLATAFORMA_JAVACALL_DESTINOS:cl.bcs.APV.=APV_REST@${BCS_APV_SERVICIOS_URL:http://bcs-apv-servicios:8083},cl.bcs.tesoreria.=JAVACALL@${BCS_TESORERIA_SERVICIOS_URL:http://bcs-tesoreria-servicios:8073},cl.bcs.cuentaInversion.=JAVACALL@${BCS_CUENTA_INVERSION_SERVICIOS_URL:http://bcs-cuenta-inversion-servicios:8080},cl.bcs.contabilidad.=JAVACALL@${BCS_CONTABILIDAD_SERVICIOS_URL:http://bcs-contabilidad-servicios:8081}}
# Optional registry export (IdServicio,RutaServicio,TipoServicio) used only to find the TomEE /call?t= id of a class.
plataforma.javacall.registro-servicios=${PLATAFORMA_JAVACALL_REGISTRO_SERVICIOS:}
plataforma.javacall.internal.max-body-bytes=16777216
plataforma.javacall.internal.connect-timeout-ms=3000
plataforma.javacall.internal.read-timeout-ms=60000

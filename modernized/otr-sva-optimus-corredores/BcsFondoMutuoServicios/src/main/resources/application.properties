# INTENTIONALLY WITHOUT PROPERTIES: the configuration of this module is application.yml.
#
# Why this file exists (F2 W1, Tesoreria as an in-process library, C2/C3): the plain jar of tesoreria-service carries its own
# application.properties (spring.application.name=tesoreria-service, services.javacall.read-timeout=PT60S, ...). Spring Boot resolves
# classpath:/application.properties with the FIRST file on the classpath, and a .properties file wins over the .yml of the same location,
# so without this empty file Tesoreria's settings would be loaded into this module (and its 60 s read timeout would override the 10 s of
# application.yml). This module's classes come first on the classpath, so this empty file shadows Tesoreria's. Do not delete it and do not
# put settings here. Pinned by seguridad.RecursosDuplicadosTest.

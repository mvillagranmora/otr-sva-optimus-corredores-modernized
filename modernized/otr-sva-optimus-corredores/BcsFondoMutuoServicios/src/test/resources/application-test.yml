spring:
  datasource:
    # H2 only. Tests never connect to HANA and never carry credentials.
    url: jdbc:h2:mem:fmkit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never

services:
  internal-token: test-secret
  javacall:
    url: http://localhost:19999
    connect-timeout: PT1S
    read-timeout: PT2S

fondomutuo:
  solicitud:
    listas-servidas: NORMAL

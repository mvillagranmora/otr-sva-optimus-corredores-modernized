spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always

# Golden and runner tests send class and parameters in the request and do not touch BAT (job pattern H4 switch).
tesoreria.jobs.programa.modo=parametros-del-llamador

# Step 6: the golden and runner tests keep the pre-guard wiring; the guard tests turn it on themselves.
tesoreria.jobs.guarda-tomee=false

# INTENTIONALLY WITHOUT PROPERTIES: the configuration of this module is application.properties.
#
# Why this file exists (step 5, collaborators in process): the owner libraries that this module now carries (apv-service,
# bcs-cuenta-inversion-servicios) ship their own application.yml (port, HANA driver class, service URLs). Spring Boot resolves
# classpath:/application.yml with the FIRST file on the classpath, which is the one of this module (its classes come first), so an
# empty file here shadows theirs and none of their settings leaks into the job application. Do not delete it, and do not put
# settings here.

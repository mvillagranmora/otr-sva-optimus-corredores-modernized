server:
  port: 8086

spring:
  application:
    name: bcs-portafolio-servicios
  datasource:
    url: ${HANA_URL}
    username: ${HANA_USER}
    password: ${HANA_PASSWORD}
    driver-class-name: com.sap.db.jdbc.Driver

bcs:
  plataforma:
    url: ${BCS_PLATAFORMA_URL:http://bcs-plataforma-servicios:8080}
  replica:
    url: ${BCS_REPLICA_URL:http://bcs-replica:8093}
  socionegocio:
    url: ${BCS_SOCIONEGOCIO_URL:http://bcs-socionegocio-servicios:8087}
